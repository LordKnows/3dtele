# Deploys the static site (survey/site, built by survey/build.py) to Cloudflare Workers static assets.
#
#   push to main              -> production   (https://3dv.zyhu.dev)
#   push to any other branch  -> a Worker Preview named after the branch; the URL is in the job summary
#   pull request closed       -> that branch's Preview is deleted (a reopened PR needs a new push to get it back)
#
# Needs two repository secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
# Token: an account-owned token made from the "Edit Cloudflare Workers" template. The first deploy
# creates the Worker, which a per-Worker or Editor-role token is not allowed to do.
# Previews only work for branches pushed to this repo: forks never get the secrets.

name: Deploy site

on:
  push:
    branches: ["**"]
  pull_request:
    types: [closed]

permissions:
  contents: read

env:
  # Exact pin for reproducible deploys; bump it deliberately. `wrangler preview` needs >= 4.136.3.
  WRANGLER_VERSION: "4.143.0"
  # The version the build was tested with. survey/build.py only uses the standard library.
  PYTHON_VERSION: "3.14"

jobs:
  production:
    # Deleting a branch also fires a push event, with the ref reverted to the default branch: skip it.
    if: github.event_name == 'push' && !github.event.deleted && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Deploys never overlap and are never cancelled half-way. A newer push waits for the running
    # deploy (if several wait, only the newest is kept), so the latest commit always ends up live.
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build site
        run: |
          python survey/build.py
          test -s survey/site/index.html

      - name: Deploy to production
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: deploy

  preview:
    if: github.event_name == 'push' && !github.event.deleted && github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write # lets wrangler-action record a GitHub Deployment, which shows up on the PR
    # A newer push to the same branch replaces an unfinished preview run.
    concurrency:
      group: preview-${{ github.ref_name }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build site
        run: |
          python survey/build.py
          test -s survey/site/index.html

      - name: Work out the preview name
        id: name
        env:
          BRANCH: ${{ github.ref_name }}
        run: echo "value=$(bash .github/scripts/preview-name.sh "$BRANCH")" >> "$GITHUB_OUTPUT"

      - name: Deploy preview
        id: preview
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: preview --name ${{ steps.name.outputs.value }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Show preview URL
        env:
          PREVIEW_NAME: ${{ steps.name.outputs.value }}
          PREVIEW_URL: ${{ steps.preview.outputs.preview-url }}
        run: |
          url="${PREVIEW_URL:-"(not in the wrangler output, see the Deploy preview log)"}"
          {
            echo "### Preview \`$PREVIEW_NAME\`"
            echo
            echo "$url"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Preview $PREVIEW_NAME::$url"

  cleanup:
    # Same-repo PRs only: fork PRs have no secrets, and never had a preview in the first place.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Waits for (and cancels) a preview run of the same branch, so a late preview can't outlive the cleanup.
    concurrency:
      group: preview-${{ github.event.pull_request.head.ref }}
      cancel-in-progress: true
    steps:
      # The default branch, not the PR: wrangler only needs the Worker name from wrangler.jsonc here,
      # and the merge ref of a closed PR isn't always available.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Delete the branch's preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          name="$(bash .github/scripts/preview-name.sh "$BRANCH")"
          status=0
          out="$(npx --yes "wrangler@${WRANGLER_VERSION}" preview delete --name "$name" --skip-confirmation 2>&1)" || status=$?
          printf '%s\n' "$out"
          if [ "$status" -ne 0 ]; then
            # A branch whose preview was never created (or is already gone) is fine; anything else is a real failure.
            if printf '%s' "$out" | grep -qiE 'code: 10025|preview not found'; then
              echo "::notice::No preview '$name' to delete"
            else
              exit "$status"
            fi
          fi
