.path { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 14px; }
.path ol { margin: 0; padding-left: 1.3em; display: grid; gap: 10px; font-size: 13.5px; }
.path ol li small { display: block; color: var(--muted); }
.note { font-size: 13px; color: var(--muted); max-width: 80ch; }

/* ---------- learning part ---------- */
.cchip { appearance: none; font: inherit; font-size: 12.5px; padding: 1px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); border: 1px solid transparent; cursor: pointer; white-space: nowrap; }
.cchip:hover { border-color: var(--accent); }
.cchip.ghost { background: transparent; border-color: var(--rule); color: var(--ink-2); }
.cchip.ghost:hover { border-color: var(--accent); color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chips .lbl { font-size: 12px; color: var(--muted); margin-right: 2px; }
.flash { animation: flash 1.6s ease-out 1; }
@keyframes flash { 0% { background-color: var(--flash); } 100% { background-color: transparent; } }
@media (prefers-reduced-motion: reduce) { .flash { animation: none; outline: 2px solid var(--accent); } }

.math-block { overflow-x: auto; overflow-y: hidden; padding: 8px 12px; background: var(--surface-2); border-radius: 6px; font-family: var(--mono); font-size: 13px; color: var(--ink); }
.math-block mjx-container { margin: 4px 0 !important; }
.eq { display: grid; gap: 6px; }
.eq p { font-size: 13.5px; color: var(--ink-2); white-space: pre-line; }
.eqs { display: grid; gap: 14px; }
.aside { background: var(--surface-2); border-radius: 8px; padding: 10px 14px; font-size: 14px; color: var(--ink-2); display: grid; gap: 2px; }
.aside b { font-size: 12px; color: var(--muted); letter-spacing: .05em; font-weight: 700; }
.aside span { white-space: pre-line; }
.idref { appearance: none; background: none; border: 0; padding: 0 1px; font: inherit; font-family: var(--mono); font-size: .86em; color: var(--accent); cursor: pointer; text-decoration: underline dotted; text-underline-offset: 3px; }
.idref:hover { text-decoration-style: solid; }

.roadmap { display: grid; gap: 10px; }
details.stage { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; min-width: 0; }
details.stage > summary { list-style: none; cursor: pointer; padding: 14px 18px; display: grid; grid-template-columns: 40px minmax(0,1fr) auto; gap: 12px; align-items: start; }
details.stage > summary::-webkit-details-marker { display: none; }
details.stage .num { font-family: var(--mono); width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: 13px; }
details.stage .head { display: grid; gap: 4px; }
details.stage .head h3 { font-size: 16.5px; }
details.stage .head p { font-size: 13.5px; color: var(--ink-2); }
details.stage .dur { font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: nowrap; }

.mods { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.mod { appearance: none; text-align: left; font: inherit; cursor: pointer; background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 12px 14px; display: grid; gap: 4px; align-content: start; color: var(--ink); }
.mod:hover { border-color: var(--accent); }
.mod i { font-style: normal; font-family: var(--mono); font-size: 11px; color: var(--muted); }
.mod b { font-family: var(--serif); font-size: 14.5px; }
.mod span { font-size: 12.5px; color: var(--ink-2); }

details.concept { border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); min-width: 0; }
details.concept > summary { list-style: none; cursor: pointer; padding: 12px 16px; display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 4px 12px; }
details.concept > summary::-webkit-details-marker { display: none; }
details.concept .nm { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
details.concept .nm b { font-family: var(--serif); font-size: 15.5px; }
details.concept .nm span { font-family: var(--mono); font-size: 11px; color: var(--muted); }
details.concept .tl { grid-column: 1 / -1; font-size: 13.5px; color: var(--ink-2); }
details.concept .uses { display: flex; gap: 6px; align-items: center; }
.concept-body { border-top: 1px solid var(--rule); padding: 16px 16px 20px; display: grid; gap: 18px; min-width: 0; }
.anchor-use { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }
.anchor-use > div { border: 1px solid var(--rule); border-radius: 8px; padding: 10px 12px; display: grid; gap: 6px; align-content: start; }
.anchor-use h5 { margin: 0; font-family: var(--sans); font-size: 12.5px; font-weight: 700; color: var(--ink); display: flex; gap: 8px; align-items: center; }
.anchor-use p { font-size: 13.5px; color: var(--ink-2); }
.anchor-use small { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
details.qa { border-top: 1px dashed var(--rule); }
details.qa > summary { list-style: none; cursor: pointer; padding: 8px 0; font-size: 14px; color: var(--ink); display: flex; gap: 8px; }
details.qa > summary::before { content: "问"; font-size: 11.5px; color: var(--accent); background: var(--accent-soft); border-radius: 4px; padding: 0 6px; height: fit-content; margin-top: 3px; }
details.qa > p { font-size: 13.5px; color: var(--ink-2); padding: 0 0 10px 30px; white-space: pre-line; }
.res { display: grid; gap: 6px; font-size: 13.5px; }
.res div { display: grid; grid-template-columns: 58px minmax(0,1fr); gap: 8px; }
.res .ty { font-family: var(--mono); font-size: 11px; color: var(--muted); padding-top: 3px; }
.res small { color: var(--muted); display: block; }

.diagram-wrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: 10px; background: var(--surface); padding: 10px; }
svg.diagram { display: block; width: 100%; min-width: 860px; height: auto; }
.dnode rect { fill: var(--surface-2); stroke: var(--rule); stroke-width: 1; }
.dnode.data rect { fill: var(--surface); stroke-dasharray: 4 3; }
.dnode.click { cursor: pointer; }
.dnode.click:hover rect, .dnode.click:focus rect { stroke: var(--accent); stroke-width: 1.6; }
.dnode.click:focus { outline: none; }
.dnode .t { fill: var(--ink); font-family: var(--sans); font-size: 13px; font-weight: 500; }
.dnode .s { fill: var(--muted); font-family: var(--sans); font-size: 11px; }
.dnode .k { fill: var(--accent); font-family: var(--mono); font-size: 10.5px; font-weight: 500; }
.dedge { stroke: var(--muted); stroke-width: 1.4; fill: none; }
.dedge.fb { stroke: var(--accent); stroke-dasharray: 5 4; }
.dhead { fill: var(--muted); }
.dhead.fb { fill: var(--accent); }
.dloop { fill: var(--accent-soft); fill-opacity: .45; stroke: var(--accent); stroke-width: 1; }
.dlabel { fill: var(--accent); font-family: var(--sans); font-size: 12px; font-weight: 700; }
.dnote { fill: var(--muted); font-family: var(--sans); font-size: 11.5px; }

details.step { border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); min-width: 0; }
details.step > summary { list-style: none; cursor: pointer; padding: 12px 16px; display: grid; grid-template-columns: 44px minmax(0,1fr) auto; gap: 10px; align-items: baseline; }
details.step .sid { font-family: var(--mono); font-size: 12px; color: var(--accent); }
details.step .st { display: grid; gap: 2px; }
details.step .st b { font-size: 15px; font-weight: 500; color: var(--ink); }
details.step .st small { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.step-body { border-top: 1px solid var(--rule); padding: 16px; display: grid; gap: 16px; min-width: 0; }
.checklist { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; }
.checklist div { border: 1px solid var(--rule); border-radius: 8px; padding: 8px 12px; display: grid; gap: 4px; font-size: 13px; color: var(--ink-2); align-content: start; }

.lanes-wrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: 10px; background: var(--surface); padding: 12px 12px 6px; position: relative; }
svg.lanes { display: block; width: 100%; min-width: 820px; height: auto; }
.lanes .grid { stroke: var(--rule); stroke-width: 1; }
.lanes .axis { fill: var(--muted); font-family: var(--mono); font-size: 11px; }
.lanes .lane-l { fill: var(--ink-2); font-family: var(--sans); font-size: 12px; }
.lanes .dot { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.lanes .dot.hollow { fill: var(--surface); stroke: var(--accent); stroke-width: 1.6; }
.lanes .hit { fill: transparent; cursor: pointer; }
.lanes g.m:hover .dot, .lanes g.m:focus .dot { stroke: var(--ink); }
.lanes g.m:focus { outline: none; }
.lanes .brk { stroke: var(--muted); stroke-width: 1; }
.vtip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; color: var(--ink); max-width: 320px; box-shadow: 0 4px 16px rgba(0,0,0,.12); display: grid; gap: 2px; z-index: 3; }
.vtip small { color: var(--muted); font-family: var(--mono); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--muted); align-items: center; padding: 4px 4px 0; }
.legend svg { vertical-align: middle; }
.classic-list { display: grid; gap: 10px; }
details.classic { border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); min-width: 0; }
details.classic > summary { list-style: none; cursor: pointer; padding: 10px 16px; display: grid; grid-template-columns: 52px minmax(0,1fr) auto; gap: 10px; align-items: baseline; }
details.classic > summary::-webkit-details-marker { display: none; }
details.classic .yr { font-family: var(--mono); font-size: 13px; color: var(--ink); }
details.classic .ti { display: grid; gap: 2px; }
details.classic .ti b { font-size: 14.5px; font-weight: 500; }
details.classic .ti small { font-size: 12px; color: var(--muted); }
details.classic .cit { font-family: var(--mono); font-size: 12px; color: var(--ink-2); text-align: right; white-space: nowrap; }
.classic-body { border-top: 1px solid var(--rule); padding: 12px 16px 16px; display: grid; gap: 12px; }

.gl-wrap { max-height: 72vh; overflow: auto; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); }
.gl td.en { font-weight: 500; color: var(--ink); min-width: 170px; }
.gl td.zh { min-width: 110px; }
.gl td.def { min-width: 300px; color: var(--ink-2); }

@media (max-width: 1000px) {
  .shell { grid-template-columns: minmax(0,1fr); gap: 20px; padding-top: 0; }
  .toc { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); max-height: none; overflow-x: auto; overflow-y: hidden; padding-block: 10px; border-bottom: 1px solid var(--rule); margin-inline: -20px; padding-inline: 20px; }
  .toc .brand, .toc .ramp, .toc li.grp, .toc ol.sub { display: none; }
  .toc ol { display: flex; gap: 4px; margin: 0; white-space: nowrap; }
  .toc a { border-left: 0; border-bottom: 2px solid transparent; padding: 4px 8px; }
  .toc a.on, .toc a.page.cur { border-bottom-color: var(--accent); }
  .toc-mobile { display: grid; gap: 6px; }
  :root { --jump-offset: 72px; }
  .toc { scrollbar-width: none; }
  .toc::-webkit-scrollbar { display: none; }
  .pager { grid-template-columns: minmax(0, 1fr); }
  .pager a.next { grid-column: 1; }
  .layer { grid-template-columns: minmax(0,1fr); gap: 10px; }
  .two, .idea-grid, .path, .anchor-use { grid-template-columns: minmax(0,1fr); }
  .mods { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .starts { grid-template-columns: minmax(0,1fr); }
}
@media (max-width: 560px) {
  .shell { padding-inline: 16px; }
  .toc { margin-inline: -16px; padding-inline: 16px; }
  .panel { padding: 16px; }
  details.idea > summary { grid-template-columns: minmax(0,1fr) auto; }
  details.idea .rank { display: none; }
  details.step > summary { grid-template-columns: minmax(0,1fr) auto; }
  details.step .sid { display: none; }
  details.classic > summary { grid-template-columns: 44px minmax(0,1fr); }
  details.classic .cit { grid-column: 2; text-align: left; }
  .mods { grid-template-columns: minmax(0,1fr); }
  .area-body, .idea-body, .concept-body, .step-body { padding-inline: 12px; }
}

/* ---------- overflow guards: long labels wrap inside cards instead of widening the page ---------- */
.cchip, .chip { max-width: 100%; }
.chips .cchip, .classic-body .chip, .card .chip { white-space: normal; overflow-wrap: anywhere; text-align: left; }
.toc-mobile .chips > * { white-space: nowrap; }
.card, .anchor-use > div, .classic-body, .concept-body, .step-body, .area-body, .idea-body, .blk, .subcard { grid-template-columns: minmax(0, 1fr); }
@media (min-width: 1001px) { .page-head.only-mobile { display: none; } }
@media (max-width: 1000px) { .page-head { margin-bottom: -40px; } }
main { overflow-wrap: break-word; }
.prose, .sec-head, .hero, .threat, .obj, .eqs, .eq, .kv div, .checklist div, .layer .body, .anchor-body, .classic-list, .roadmap { grid-template-columns: minmax(0, 1fr); }
mjx-container[jax="SVG"]:not([display="true"]) { display: inline-block; max-width: 100%; overflow-x: auto; overflow-y: hidden; vertical-align: middle; }
ul.plain, .path ol, .res, .timeline, .stages, .subgrid > *, .cards > * { grid-template-columns: minmax(0, 1fr); }
ul.plain li, .res span, .threat span { overflow-wrap: anywhere; }

</style>
</head>

<div class="shell">

<script type="application/json" id="data">{"meta": {"date": "2026-09-28", "subtitle": "以 Quark（Google，SIGGRAPH Asia 2024）与 Ha et al.（KAIST + Meta，CVPR 2025）两篇实时多视角新视角合成论文为出发点，分三部分展开。第一部分帮你入门：基础知识、进阶专题、经典论文，以及把基础知识和两篇论文逐步对上的精读导读。第二部分梳理 3D 临场（telepresence）的全栈调研：采集、几何、表示、渲染、传输、显示与感知。第三部分给出 18 个经过对抗式查新和模拟 AC 评审的研究方向。", "learn_lede": "面向刚进入 3D 视觉 / 临场方向的研究生，默认你有本科线代、概率、Python 和基础深度学习。建议的用法：按“学习路线”推进；遇到不懂的词查“术语表”；读两篇锚点论文时开着“精读导读”，每一步都能点回需要的基础概念。基础概念卡片也会反过来标出它在 Quark 和 Ha et al. 的哪一步用到。", "foundations_lede": "8 个模块按学习顺序排列。每个概念都有：一句话要点、直觉解释、类比、逐项拆解的公式、带数字的例子、易错点、它在两篇锚点论文中的具体位置、学习资源和自测题。标签“Quark 用到 / Ha 用到”表示该概念是否直接出现在对应论文中。", "guided_lede": "把两篇论文按流水线拆成若干步。每一步写清楚：做什么（输入 → 输出）、白话解释、类比、论文公式逐项拆解、具体超参、为什么这样设计、容易误解的地方和自测题，并链接到需要的基础概念。点击流程图的方框可以直接跳到对应步骤。内容写完后由另一个 agent 对照论文原文逐条核查，并修正了发现的错误。", "advanced_lede": "16 个进阶专题，每个包含核心思想、关键公式、演进时间线、按优先级排序的奠基论文（附 Semantic Scholar / OpenAlex 引用数）、与两篇锚点论文的关系、争论与开放问题。", "classics_lede": "按 6 个主题收录 2025 年及以前发表的高影响论文。入选标准是引用数高或改变了领域走向，并且偏重两篇锚点论文所依赖的工作。每篇都由另一个 agent 复核了是否存在、年份与会议，以及引用数（来源为 Semantic Scholar 或 OpenAlex，2026 年 9 月）。上图横轴 2010 年以前做了压缩。", "survey_lede": "以两篇锚点论文为坐标原点，覆盖 10 个子方向、350 余条论文 / 产品 / 标准，以及全栈地图、范式对比、趋势与挑战。", "ideas_lede": "这些方向来自 5 个独立视角（失败模式、基础模型、系统、问题重构/评测、跨领域）共 30 个 idea，聚类为 18 个方向。每个方向先由一个 agent 专门找“已经被做过”的证据，再由一个模拟 AC 的 agent 重新定位、打分、设计实验。结论：没有一个方向是完全空白的，18 个全部判定为“部分已被做，需要重新定位”。综合分 5 分约等于一篇普通录用论文的水平。列表按综合分排序，点开可看核心论点、查新找到的撞车工作、两周验证实验和止损标准。", "method_zh": "本报告由多 agent 工作流生成，所有 agent 都能联网检索（arXiv API、Semantic Scholar、OpenAlex、网页搜索）。\n\n调研部分：先精读两篇锚点论文（含附录），并对照原文逐条核查未言明的问题，例如 Ha et al. 的运行时间没算立体深度估计，TSDF 消融几乎没有增益。然后分 10 个子方向检索，每个方向 25–45 篇带真实链接的工作，分为里程碑 / 重要 / 相关三档，再由一个综合 agent 写出全景图、范式对比、趋势、重大挑战和阅读清单。\n\n研究方向部分：5 个视角各自提出 idea，聚类为 18 个方向。每个方向先做对抗式查新（抽查引用是否真实存在，至少 10 组检索），再做模拟 AC 评审。\n\n使用说明：这些内容由 AI agent 检索和撰写，可能有遗漏、过时或数字不准，2026 年 7–9 月的新论文覆盖尤其有限。引用或投稿前请务必打开原文核实，尤其是 2026 年的 arXiv 编号、性能数字和引用数。评分只用于比较方向之间的相对强弱，不代表真实的录用概率。\n\n入门学习部分：先固定一份课程骨架（8 个模块、40 个概念、16 个进阶专题），所有内容都用同一套 ID 互相链接。基础知识每个模块由一个 agent 撰写，再由技术编辑 agent 核查公式、数值例子、链接以及与两篇论文的对应关系，共修正 145 处。进阶专题同样经过撰写与复核，修正 95 处。经典论文由 6 个主题检索 agent 汇总并去重，再分批逐篇复核：保留 152 篇，更正 115 篇，剔除 0 篇。精读导读共 26 步，由对抗式核查 agent 对照论文原文修正 70 处。术语表 195 条。", "learn_method_zh": "入门学习部分：先固定一份课程骨架（8 个模块、{concepts} 个概念、{advanced} 个进阶专题），所有内容都用同一套 ID 互相链接。基础知识每个模块由一个 agent 撰写，再由技术编辑 agent 核查公式、数值例子、链接以及与两篇论文的对应关系，共修正 {foundation_fixes} 处。进阶专题同样经过撰写与复核，修正 {advanced_fixes} 处。经典论文由 6 个主题检索 agent 汇总并去重，再分批逐篇复核：保留 {classics} 篇，更正 {classics_corrected} 篇，剔除 {classics_removed} 篇。精读导读共 {steps} 步，由对抗式核查 agent 对照论文原文修正 {guide_fixes} 处。术语表 {glossary} 条。"}, "xref": {"concepts": {"f-linalg": "线性代数、齐次坐标与刚体变换", "f-optim": "优化、鲁棒估计与梯度下降", "f-prob": "概率、加权平均与递归滤波", "f-image": "数字图像：颜色、采样、插值与金字塔", "g-pinhole": "针孔相机模型：内参、外参、投影与反投影", "g-epipolar": "对极几何、三角化与单应", "g-depth": "深度、视差与逆深度采样", "g-sfm": "运动恢复结构（SfM）与光束法平差", "g-rig": "多相机阵列：标定、同步与卷帘快门", "d-stereo": "双目立体匹配：从 SGM 到 RAFT-Stereo", "d-mvs": "多视角立体（MVS）与平面扫描", "d-mono": "单目与视频深度估计", "d-flow": "光流、场景流与图像 warping", "d-tsdf": "截断符号距离场（TSDF）与深度融合", "d-sensors": "深度传感器与噪声特性", "r-raster": "光栅化、z-buffer 与点溅射（splatting）", "r-alpha": "Alpha 合成与 over 算子", "r-volume": "体渲染方程与离散化", "r-raymarch": "光线步进、球面追踪与隐式表面求交", "r-appearance": "反射模型、视角相关外观与光照", "r-reps": "三维表示总览：点、网格、体素、隐式场、高斯", "i-lightfield": "全光函数、光场与 Lumigraph", "i-blending": "视角相关纹理映射与混合权重（ULR）", "i-warping": "基于深度的渲染：前向/后向 warping、空洞与飞点", "i-layered": "分层表示：MPI、LDI 与分层深度图（LDM）", "i-psv": "平面扫描体与学习式视图合成", "l-cnn": "卷积网络、残差块与 U-Net", "l-attention": "注意力机制与 Transformer", "l-encoding": "位置编码、傅里叶特征与射线编码", "l-loss": "损失函数与训练实践", "l-iterative": "学习式迭代细化与展开优化", "l-diffusion": "扩散模型入门", "n-nerf": "神经辐射场（NeRF）", "n-3dgs": "3D Gaussian Splatting（3D 高斯溅射）", "n-generalizable": "可泛化 / 前馈式新视角合成", "n-dynamic": "动态场景与 4D 表示", "v-temporal": "时间一致性、闪烁与时域滤波", "v-metrics": "图像与视频质量指标", "v-codec": "视频编码、传输与延迟预算", "v-perception": "立体视觉感知与 3D 显示"}, "adv": {"a-learned-stereo": "从深度立体匹配到立体基础模型", "a-learned-mvs": "学习式多视角立体与代价体", "a-geo-fm": "前馈三维几何基础模型", "a-nerf-fast": "NeRF 的加速与抗锯齿", "a-3dgs-ext": "3D Gaussian Splatting 的扩展", "a-layered-nvs": "学习式分层表示：从 Stereo Magnification 到 Quark", "a-generalizable-ibr": "可泛化 NeRF 与学习式 IBR", "a-ff-3dgs": "前馈 3DGS 与大重建模型", "a-geometry-free": "无几何 Transformer 渲染器", "a-dynamic-4d": "动态 NeRF、4D 高斯与流式重建", "a-human-capture": "人体表演捕捉与数字人", "a-diffusion-3d": "扩散模型与三维/新视角生成先验", "a-temporal-video": "视频时间一致性方法", "a-telepresence-sys": "三维临场系统设计", "a-compression": "体积视频与神经表示的压缩传输", "a-diff-render": "可微渲染与逆渲染"}}, "site": {"brand": "3D 临场研究图谱", "current": "glossary", "pages": [{"key": "home", "file": "index.html", "label": "概览", "group": null}, {"key": "roadmap", "file": "roadmap.html", "label": "学习路线", "group": "入门学习"}, {"key": "foundations", "file": "foundations.html", "label": "基础知识", "group": "入门学习"}, {"key": "guided", "file": "guided.html", "label": "精读导读", "group": "入门学习"}, {"key": "advanced", "file": "advanced.html", "label": "进阶专题", "group": "入门学习"}, {"key": "classics", "file": "classics.html", "label": "经典论文", "group": "入门学习"}, {"key": "glossary", "file": "glossary.html", "label": "术语表", "group": "入门学习"}, {"key": "anchors", "file": "anchors.html", "label": "锚点论文", "group": "领域调研"}, {"key": "landscape", "file": "landscape.html", "label": "领域全景", "group": "领域调研"}, {"key": "areas", "file": "areas.html", "label": "分方向与论文库", "group": "领域调研"}, {"key": "ideas", "file": "ideas.html", "label": "研究机会", "group": "研究"}, {"key": "method", "href": "index.html#method", "label": "方法与说明", "group": "研究", "alias": true}], "sectionPage": {"top": "index.html", "summary": "index.html", "sitemap": "index.html", "method": "index.html", "roadmap": "roadmap.html", "roadmap-resources": "roadmap.html", "foundations": "foundations.html", "guided": "guided.html", "advanced": "advanced.html", "classics": "classics.html", "reading": "classics.html", "glossary": "glossary.html", "anchors": "anchors.html", "map": "landscape.html", "paradigms": "landscape.html", "trends": "landscape.html", "areas": "areas.html", "papers": "areas.html", "ideas": "ideas.html"}, "prefixPage": [["concept-", "foundations.html"], ["module-", "foundations.html"], ["walk-", "guided.html"], ["guide-", "guided.html"], ["adv-", "advanced.html"], ["classic-", "classics.html"], ["stage-", "roadmap.html"], ["area-", "areas.html"], ["idea-", "ideas.html"], ["anchor-", "anchors.html"]]}, "glossary": [{"term_en": "Homogeneous coordinates", "term_zh": "齐次坐标", "abbr": "", "def_zh": "在笛卡尔坐标后补一维（如 (x,y)→(x,y,1)），相差非零倍数的向量表示同一个点。它让平移和透视投影都能写成矩阵乘法，投影后再除以最后一维（透视除法）即回到像素坐标。", "concept_id": "f-linalg", "category": "几何与相机"}, {"term_en": "Rigid transformation / SE(3) pose", "term_zh": "刚体变换 / SE(3) 位姿", "abbr": "", "def_zh": "由旋转 R 和平移 t 组成、保持距离与角度不变的变换，常写成 4×4 矩阵 [R t; 0 1]。相机位姿就是一个 SE(3) 元素，世界到相机与相机到世界两种写法互为逆矩阵，相机中心为 −Rᵀt。", "concept_id": "f-linalg", "category": "几何与相机"}, {"term_en": "Camera coordinate conventions (OpenCV vs. OpenGL)", "term_zh": "相机坐标系约定（OpenCV 与 OpenGL）", "abbr": "", "def_zh": "OpenCV/COLMAP 约定相机 x 轴向右、y 轴向下、沿 +z 方向观察；OpenGL/Blender（NeRF 的合成数据即如此）约定 y 轴向上、沿 −z 方向观察。两者混用时位姿需乘一个轴翻转矩阵，这是复现代码时最常见的错误来源之一。", "concept_id": "f-linalg", "category": "几何与相机"}, {"term_en": "Pinhole camera model", "term_zh": "针孔相机模型", "abbr": "", "def_zh": "把相机理想化为一个光心：3D 点先经外参变换到相机坐标系，再经内参 K 投影到像素，x ≃ K[R|t]X。它忽略镜头畸变和景深，是几乎所有多视几何与神经渲染论文默认的相机模型。", "concept_id": "g-pinhole", "category": "几何与相机"}, {"term_en": "Intrinsic matrix", "term_zh": "内参矩阵", "abbr": "K", "def_zh": "描述相机自身成像几何的 3×3 上三角矩阵，包含以像素为单位的焦距 f_x、f_y 和主点 (c_x, c_y)，有时还有 skew。对图像做缩放或裁剪后，K 必须同步修改。", "concept_id": "g-pinhole", "category": "几何与相机"}, {"term_en": "Extrinsics", "term_zh": "外参", "abbr": "[R|t]", "def_zh": "描述相机在世界中位置与朝向的旋转 R 和平移 t，把世界坐标系中的点变换到相机坐标系。固定的多相机阵列通常只标定一次外参，之后视为常量。", "concept_id": "g-pinhole", "category": "几何与相机"}, {"term_en": "Projection / unprojection", "term_zh": "投影 / 反投影（像素↔3D 点）", "abbr": "", "def_zh": "投影把相机坐标下的 3D 点左乘 K 再除以深度得到像素；反投影则相反：只有像素时只能确定一条射线，给定深度 z 后才得到唯一的 3D 点 z·K⁻¹(u,v,1)ᵀ。两篇锚点论文中的 warp、splat 和 TSDF 查询都是这两步的组合。", "concept_id": "g-pinhole", "category": "几何与相机"}, {"term_en": "View frustum", "term_zh": "视锥", "abbr": "", "def_zh": "相机可见的空间区域：以光心为顶点、由图像四条边界和近/远平面截出的四棱台。Quark 的分层深度图 LDM 就建在目标相机的视锥内。", "concept_id": "g-pinhole", "category": "几何与相机"}, {"term_en": "Epipolar geometry", "term_zh": "对极几何", "abbr": "", "def_zh": "两台相机观察同一点时的几何约束：一幅图中的点在另一幅图中的对应点只能落在一条极线上，满足 x'ᵀF x = 0。它把对应点搜索从二维降为一维。", "concept_id": "g-epipolar", "category": "几何与相机"}, {"term_en": "Triangulation", "term_zh": "三角化", "abbr": "", "def_zh": "已知两台或多台相机的位姿和同一点的对应像素，求各条射线的（最小二乘意义下的）交点以得到其 3D 位置，常用线性 DLT 加 SVD 求初值再做非线性精化。射线夹角越小，三角化越不稳定。", "concept_id": "g-epipolar", "category": "几何与相机"}, {"term_en": "Plane-induced homography", "term_zh": "平面诱导单应", "abbr": "H", "def_zh": "两幅图像之间的 3×3 射影变换。空间中同一平面在两台相机中的像恰好由一个单应关联，它由相对位姿、平面法线与距离以及两相机内参决定；平面扫描和 MPI 渲染本质上就是逐平面做单应 warp。", "concept_id": "g-epipolar", "category": "几何与相机"}, {"term_en": "Stereo rectification", "term_zh": "立体校正", "abbr": "", "def_zh": "对双目图像重新投影，使两个像平面共面且行对齐，对应点只在水平方向上相差视差 d。校正后立体匹配只需沿同一行一维搜索。", "concept_id": "g-epipolar", "category": "几何与相机"}, {"term_en": "Baseline", "term_zh": "基线", "abbr": "B", "def_zh": "两台相机光心之间的距离。基线越大，同一深度产生的视差越大、深度越准，但遮挡更多、外观差异更大、匹配更难；Quark 的输入相机最远相距约 30 cm，属于视差大、遮挡多的宽基线设置。", "concept_id": "g-depth", "category": "几何与相机"}, {"term_en": "Disparity", "term_zh": "视差", "abbr": "d", "def_zh": "校正后同一 3D 点在左右图中的水平像素差，与深度成反比：Z=fB/d。由此深度误差近似为 δZ≈Z²/(fB)·δd，随距离的平方增长。", "concept_id": "g-depth", "category": "几何与相机"}, {"term_en": "Inverse depth / disparity-uniform sampling", "term_zh": "逆深度 / 等视差采样", "abbr": "", "def_zh": "用 1/Z 而非 Z 参数化深度，并在 1/Z 上均匀放置深度假设或图层。等视差间隔在相邻视角上对应近似相等的像素位移，近处细、远处粗；平面扫描、Quark 的 LDM 锚点和 Mip-NeRF 360 的采样都这样做。", "concept_id": "g-depth", "category": "几何与相机"}, {"term_en": "Near / far plane", "term_zh": "近平面 / 远平面", "abbr": "", "def_zh": "表示或渲染所覆盖的最小与最大深度。Quark 记为 η 与 f（此处 f 不是焦距），按每个样本的 SfM 点深度分布设定，再把 [1/f, 1/η] 等分成 L 段视差带。", "concept_id": "g-depth", "category": "几何与相机"}, {"term_en": "Metric scale vs. relative scale", "term_zh": "公制尺度与相对尺度", "abbr": "", "def_zh": "公制尺度的深度以真实的米为单位；相对尺度只确定到一个未知比例，仿射不变深度还多一个未知偏移，使用前需与真值或已知尺度对齐。SfM、单目深度和 DUSt3R 类模型通常只给相对尺度，而 Ha et al. 的 τ=0.02 m 这类固定公制阈值要求真实尺度。", "concept_id": "g-depth", "category": "几何与相机"}, {"term_en": "Structure-from-Motion", "term_zh": "运动恢复结构", "abbr": "SfM", "def_zh": "只从一组照片出发，同时估计所有相机的内外参和一组稀疏 3D 点：先做特征匹配与几何验证，再逐步注册相机、三角化新点，并反复做光束法平差。", "concept_id": "g-sfm", "category": "几何与相机"}, {"term_en": "Bundle adjustment", "term_zh": "光束法平差", "abbr": "BA", "def_zh": "对所有相机参数和 3D 点联合做非线性最小二乘，最小化全部观测的重投影误差，通常用 Levenberg–Marquardt 并利用问题的稀疏结构求解。", "concept_id": "g-sfm", "category": "几何与相机"}, {"term_en": "COLMAP", "term_zh": "COLMAP", "abbr": "", "def_zh": "最常用的开源 SfM 与 MVS 软件，输出相机内参、外参（images.txt 中的四元数和平移）和稀疏点云。NeRF、3DGS 等工作的相机位姿通常由它计算。", "concept_id": "g-sfm", "category": "几何与相机"}, {"term_en": "Camera calibration (Zhang's method)", "term_zh": "相机标定（张正友法）", "abbr": "", "def_zh": "让相机拍摄多个姿态下的已知平面棋盘格，由每个姿态的单应闭式求出内参，再连同畸变参数最小化重投影误差做精化。多相机阵列还需要在全局 BA 中联合求解外参，避免两两串联累积误差。", "concept_id": "g-rig", "category": "几何与相机"}, {"term_en": "Camera synchronization (genlock / hardware trigger)", "term_zh": "相机同步（genlock / 硬件触发）", "abbr": "", "def_zh": "让所有相机在同一时刻曝光：硬件触发或 genlock 可达亚毫秒级，时间码或软件对齐通常只到帧级且有抖动。不同步时，运动物体在各视角中不属于同一时刻，三角化和 IBR 混合都会出错。", "concept_id": "g-rig", "category": "几何与相机"}, {"term_en": "Rolling shutter / global shutter", "term_zh": "卷帘快门 / 全局快门", "abbr": "", "def_zh": "卷帘快门逐行依次曝光，图像顶部与底部的曝光时刻相差整个读出时间，运动物体会被“斜切”；全局快门所有像素同时曝光。GoPro 等运动相机是卷帘快门，DyNeRF 数据集就由 GoPro 阵列采集。", "concept_id": "g-rig", "category": "几何与相机"}, {"term_en": "Color calibration", "term_zh": "颜色标定", "abbr": "", "def_zh": "让阵列中各相机对同一物体输出一致的 RGB：锁定曝光与白平衡，用色卡为每台相机求颜色校正矩阵，或在后处理中补偿曝光差异。IBR 直接混合不同相机的像素，颜色不一致就会产生接缝和闪烁。", "concept_id": "g-rig", "category": "几何与相机"}, {"term_en": "Plücker coordinates", "term_zh": "Plücker 坐标", "abbr": "", "def_zh": "用 6 维向量 (d, o×d) 表示一条三维直线，d 为单位方向，m=o×d 称为矩；沿直线任取一点作 o，结果都相同。LRM、LVSM 等 Transformer 把每个像素的 Plücker 射线与图像块一起编码成 token，以此把相机信息告诉网络。", "concept_id": "l-encoding", "category": "几何与相机"}, {"term_en": "Stereo matching", "term_zh": "立体匹配", "abbr": "", "def_zh": "在校正后左右图的同一行上为每个像素寻找对应点得到视差，再换算为深度。经典方法依靠“匹配代价 + 平滑先验”，学习方法依靠“代价体或相关体 + 网络”；遮挡、弱纹理和高光处都容易失败。", "concept_id": "d-stereo", "category": "深度与重建"}, {"term_en": "Semi-Global Matching", "term_zh": "半全局匹配", "abbr": "SGM", "def_zh": "Hirschmüller 提出的经典立体算法：沿多个方向做一维动态规划来聚合匹配代价（对小、大视差跳变分别施加惩罚），近似求解二维平滑能量，兼顾精度与速度，长期是工业界的标准做法。", "concept_id": "d-stereo", "category": "深度与重建"}, {"term_en": "Cost volume", "term_zh": "代价体", "abbr": "", "def_zh": "把每个像素在一组视差（或深度）假设下的匹配代价排成 H×W×D 的体数据，深度估计就变成沿假设维寻找最优位置。它可由特征拼接、相关或多视角方差构造，再用 3D 卷积等方式正则化。", "concept_id": "d-stereo", "category": "深度与重建"}, {"term_en": "Soft argmin", "term_zh": "soft argmin（软最小值回归）", "abbr": "", "def_zh": "对负代价沿视差维做 softmax 得到概率，再求视差的期望，得到可微的亚像素视差估计（GC-Net 提出）。当概率分布呈多峰时，它会给出两峰之间的错误值。", "concept_id": "d-stereo", "category": "深度与重建"}, {"term_en": "RAFT-Stereo", "term_zh": "RAFT-Stereo", "abbr": "", "def_zh": "3DV 2021 的双目网络：对左右特征计算同一行所有像素对的相关并池化成多级相关金字塔，再由多级卷积 GRU 以当前视差为中心查表、迭代更新视差。Ha et al. 用它生成输入深度，但它逐帧独立、不保证时间一致，其耗时也未计入 Ha et al. 报告的每帧时间。", "concept_id": "d-stereo", "category": "深度与重建"}, {"term_en": "Photometric consistency", "term_zh": "光度一致性", "abbr": "", "def_zh": "同一表面点在各视角中颜色（或特征）相同的假设：在正确深度上各视角一致、方差小。它是立体匹配、MVS 和可泛化 NeRF 寻找表面的依据，高光、遮挡和曝光差异都会破坏它。", "concept_id": "d-mvs", "category": "深度与重建"}, {"term_en": "Multi-view stereo", "term_zh": "多视角立体", "abbr": "MVS", "def_zh": "把双目推广到 N 个已标定视角：为参考视角假设一组深度，把其他视角 warp 过来比较一致性，得到逐视角深度图，再融合成点云或网格。", "concept_id": "d-mvs", "category": "深度与重建"}, {"term_en": "Plane sweep", "term_zh": "平面扫描", "abbr": "", "def_zh": "在参考或目标视锥中放置一组与像平面平行的深度平面，把每个视角按对应单应 warp 到各平面上比较一致性的“假设—检验”过程。它是平面扫描体、MVSNet 代价体和 Quark 特征体的原型。", "concept_id": "d-mvs", "category": "深度与重建"}, {"term_en": "Variance-based cost aggregation", "term_zh": "基于方差的代价聚合", "abbr": "", "def_zh": "把 N 个视角在同一深度假设上的特征取逐元素方差作为代价：与视角顺序无关、支持任意 N。缺点是对所有视角一视同仁，一个被遮挡的视角就能拉高正确深度处的方差，因此后续方法改用学习的权重或注意力。", "concept_id": "d-mvs", "category": "深度与重建"}, {"term_en": "Coarse-to-fine depth search", "term_zh": "由粗到细的深度搜索", "abbr": "", "def_zh": "低分辨率上用较多深度假设粗定位，高分辨率上只在上一级估计附近用少量假设细化，以控制显存与计算（如 CasMVSNet、ENeRF）。Quark 逐级提高分辨率、同时减少层数，是同一思路的分层版本。", "concept_id": "d-mvs", "category": "深度与重建"}, {"term_en": "Monocular depth estimation", "term_zh": "单目深度估计", "abbr": "", "def_zh": "从单张图像预测深度，依靠从海量数据中学到的语义和形状先验，而不是三角化。每个像素都有输出，但通常只确定到未知的尺度和偏移，逐帧运行时还会闪烁；MiDaS、Depth Anything 是代表。", "concept_id": "d-mono", "category": "深度与重建"}, {"term_en": "Video depth estimation", "term_zh": "视频深度估计", "abbr": "", "def_zh": "为视频的每一帧估计时间上稳定的深度，方法包括测试时优化（如 Consistent Video Depth Estimation）和带循环或时序注意力的前馈网络（如 FlashDepth、Video Depth Anything），目标是既准确又不闪烁。", "concept_id": "d-mono", "category": "深度与重建"}, {"term_en": "Optical flow", "term_zh": "光流", "abbr": "", "def_zh": "相邻两帧之间每个像素的二维位移场。常用来把一帧 warp 到另一帧，以做对齐、时域滤波或度量闪烁；RAFT 是代表性的学习方法。", "concept_id": "d-flow", "category": "深度与重建"}, {"term_en": "Truncated signed distance field", "term_zh": "截断符号距离场", "abbr": "TSDF", "def_zh": "空间中每一点到最近表面的有符号距离，并截断到 ±τ 之内。把多张深度图的 TSDF 按置信度加权平均后，零等值面就是融合后的表面。", "concept_id": "d-tsdf", "category": "深度与重建"}, {"term_en": "Volumetric depth fusion", "term_zh": "体素深度融合", "abbr": "", "def_zh": "Curless 与 Levoy（1996）提出的做法：把每张深度图转成体素网格上的 TSDF，以加权滑动平均累积；KinectFusion 把它与相机跟踪结合并在 GPU 上实时运行。它能平均掉单张深度的噪声，但分辨率受体素显存限制。", "concept_id": "d-tsdf", "category": "深度与重建"}, {"term_en": "Image-based TSDF", "term_zh": "基于图像的 TSDF", "abbr": "", "def_zh": "Project Starline 提出、Ha et al. 采用的融合方式：不建体素网格，而是沿每条目标射线把采样点投影到各输入视角读出深度，当场计算并加权求和有符号距离，再寻找零交叉。分辨率只取决于输出图像，但每换一个视点都要重算。", "concept_id": "d-tsdf", "category": "深度与重建"}, {"term_en": "Projective signed distance", "term_zh": "投影符号距离", "abbr": "", "def_zh": "沿输入相机视线方向计算的深度差（如观测深度与采样点深度之差），用来近似真正的欧氏符号距离。表面倾斜或掠射观察时，它会比真实距离偏大。", "concept_id": "d-tsdf", "category": "深度与重建"}, {"term_en": "Truncation threshold", "term_zh": "截断阈值", "abbr": "τ", "def_zh": "TSDF 中有符号距离的截断范围，同时用于遮挡判定：采样点位于某视角观测表面之后超过 τ 时，该视角的权重置零。Ha et al. 取 τ=0.02 m，这是依赖公制尺度的常数。", "concept_id": "d-tsdf", "category": "深度与重建"}, {"term_en": "Marching cubes", "term_zh": "移动立方体", "abbr": "", "def_zh": "从体素化标量场（如 TSDF）中提取零等值面三角网格的经典算法：逐体素根据角点的符号查表生成三角形，并在棱上线性插值出顶点位置。", "concept_id": "d-tsdf", "category": "深度与重建"}, {"term_en": "Non-rigid fusion", "term_zh": "非刚性融合", "abbr": "", "def_zh": "针对运动、变形物体的深度融合：先估计形变场（常用嵌入式变形图表示）把规范模型“掰”到当前姿态，再把新深度融合进规范 TSDF，代表工作有 DynamicFusion、Fusion4D。拓扑变化和跟踪失败是主要难点。", "concept_id": "d-tsdf", "category": "深度与重建"}, {"term_en": "Structured light / active stereo", "term_zh": "结构光 / 主动立体", "abbr": "", "def_zh": "主动向场景投射红外图案来获得深度：结构光用一台相机观察已知图案的偏移并与投影仪三角测量（如 Kinect v1）；主动立体投射随机纹理后用两台红外相机做普通立体匹配（如 RealSense D4xx）。二者都属三角测量，误差随距离平方增长，且怕强阳光。", "concept_id": "d-sensors", "category": "深度与重建"}, {"term_en": "Time-of-Flight", "term_zh": "飞行时间测距", "abbr": "ToF", "def_zh": "通过测量光往返时间得到深度：直接 ToF（dToF，如 LiDAR）对短脉冲计时；间接 ToF（如 Kinect v2、Azure Kinect）测量调制光的相位差，存在最大无歧义距离 c/(2f_mod)，并受多路径干扰影响。", "concept_id": "d-sensors", "category": "深度与重建"}, {"term_en": "Flying pixels", "term_zh": "飞点", "abbr": "", "def_zh": "物体边缘处一个像素同时覆盖前景和背景，深度被混合或插值成两者之间的值，反投影后悬浮在空中，warp 之后成为散落的噪点。深度传感器、立体匹配、双线性插值和深度编码的振铃都会产生飞点。", "concept_id": "i-warping", "category": "深度与重建"}, {"term_en": "Pointmap", "term_zh": "点图", "abbr": "", "def_zh": "DUSt3R 提出的输出形式：为每个像素直接回归一个 3D 坐标（两张图都表达在第一台相机的坐标系下），相机内外参、深度和匹配都可以从点图反推。输出只有相对尺度。", "concept_id": "g-sfm", "category": "深度与重建"}, {"term_en": "3D geometric foundation model", "term_zh": "三维几何基础模型", "abbr": "", "def_zh": "在大规模多源数据上训练、一次前向即可从若干（甚至未标定的）图像输出深度、点图和相机位姿的大型 Transformer，如 DUSt3R、VGGT、MapAnything。它们正在替代部分 SfM/MVS 流程，但多数输出没有公制尺度。", "concept_id": "g-sfm", "category": "深度与重建"}, {"term_en": "Rasterization", "term_zh": "光栅化", "abbr": "", "def_zh": "以图元为中心的渲染方式：把三角形或点投影到屏幕上、确定它覆盖哪些像素，再用 z-buffer（为每个像素保留最近深度的缓冲区）解决可见性。GPU 对它高度优化，是实时图形的主流管线。", "concept_id": "r-raster", "category": "渲染与图形"}, {"term_en": "Splatting", "term_zh": "溅射", "abbr": "", "def_zh": "把每个点换成屏幕上有面积的足迹核（如 2D 高斯或圆盘）并累加到周围像素的前向（scatter 式）渲染。3DGS 的高斯投影、Quark 的双线性溅射都属于此类。", "concept_id": "r-raster", "category": "渲染与图形"}, {"term_en": "EWA splatting", "term_zh": "EWA 溅射", "abbr": "EWA", "def_zh": "Zwicker 等提出的椭圆加权平均溅射：用投影的局部仿射近似把 3D 高斯核变成屏幕上的 2D 高斯，并与低通滤波器卷积以抗走样。3DGS 的投影公式即来源于此。", "concept_id": "r-raster", "category": "渲染与图形"}, {"term_en": "Bilinear splatting", "term_zh": "双线性溅射", "abbr": "𝒫", "def_zh": "前向 warping 的一种：把源元素的值按双线性权重分给其投影位置周围的 4 个像素。Quark 用它把中间 LDM 渲染到各输入视角，从而避免光线追踪和光栅化。", "concept_id": "r-raster", "category": "渲染与图形"}, {"term_en": "Back-projection operator (gather)", "term_zh": "反投影算子（gather）", "abbr": "𝒫ᵀ", "def_zh": "Quark 中与双线性溅射互为转置（伴随）的操作：对每个 LDM 元素，把它投影到输入图并做双线性采样取值。它用于初始化特征体、生成更新特征 Δ，以及最终的 IBR 取色。", "concept_id": "r-raster", "category": "渲染与图形"}, {"term_en": "Differentiable rendering", "term_zh": "可微渲染", "abbr": "", "def_zh": "能够对输出像素关于几何、外观或相机参数求梯度的渲染器，使“渲染—比较—求导—更新”的逆渲染和端到端训练成为可能。难点在可见性边界处的不连续，常用软化（如 Soft Rasterizer）或边界采样来处理。", "concept_id": "r-raster", "category": "渲染与图形"}, {"term_en": "Z-fighting", "term_zh": "深度冲突", "abbr": "", "def_zh": "两个几乎重合的表面争夺同一个像素，谁在前取决于噪声，画面会闪烁或出现条纹。把多个视角的像素高斯合并后一次渲染就会出现这一问题，Ha et al. 改为逐视角单独渲染来避免。", "concept_id": "r-raster", "category": "渲染与图形"}, {"term_en": "Alpha compositing / over operator", "term_zh": "Alpha 合成 / over 算子", "abbr": "𝒪", "def_zh": "Porter–Duff 的 over 算子（预乘形式）C = C_F + (1−α_F)·C_B 把前景叠加到背景上；沿深度反复应用即得到分层表示、3DGS 和 NeRF 共用的合成公式。Quark 用它在输入视角和目标视角中合成颜色与深度。", "concept_id": "r-alpha", "category": "渲染与图形"}, {"term_en": "Premultiplied alpha", "term_zh": "预乘 alpha", "abbr": "", "def_zh": "把颜色预先乘以 α 后存储为 (c·α, α)，使 over 合成、插值和滤波都成为线性运算。混用预乘与非预乘颜色，会把覆盖率计入两次或产生暗边。", "concept_id": "r-alpha", "category": "渲染与图形"}, {"term_en": "Accumulated alpha / opacity", "term_zh": "累积不透明度", "abbr": "", "def_zh": "沿射线合成后的总覆盖率 α = 1 − ∏(1−α_i)，表示像素被多少“物质”覆盖：接近 0 表示空洞，小数值多出现在物体边缘。Ha et al. 用它衡量每张 warp 图在各像素上的有效程度。", "concept_id": "r-alpha", "category": "渲染与图形"}, {"term_en": "Transmittance", "term_zh": "透射率", "abbr": "T", "def_zh": "光从某点到达相机途中未被吸收或遮挡的比例，离散形式为 T_i = ∏_{j<i}(1−α_j)。体渲染中每个样本对像素的贡献权重为 T_i·α_i。", "concept_id": "r-volume", "category": "渲染与图形"}, {"term_en": "Volume rendering equation", "term_zh": "体渲染方程", "abbr": "", "def_zh": "把场景看成既发光又吸收的介质，像素颜色是沿射线对“透射率 × 体密度 × 颜色”的积分；离散化后恰好是从前到后的 alpha 合成，其中 α_i = 1 − exp(−σ_i δ_i)。", "concept_id": "r-volume", "category": "渲染与图形"}, {"term_en": "Volume density", "term_zh": "体密度", "abbr": "σ", "def_zh": "体渲染中描述单位长度上光被吸收（遮挡）程度的非负场，与采样间隔 δ 一起决定样本的不透明度。注意 Quark 中的 σ 直接作为各层的 alpha 使用，而不是体密度。", "concept_id": "r-volume", "category": "渲染与图形"}, {"term_en": "Ray marching", "term_zh": "光线步进", "abbr": "", "def_zh": "沿射线逐步查询一个场（密度、SDF 等）以计算积分或寻找表面的渲染方法。NeRF 的体渲染和 Ha et al. 的 TSDF 深度求解都属于光线步进。", "concept_id": "r-raymarch", "category": "渲染与图形"}, {"term_en": "Sphere tracing", "term_zh": "球面追踪", "abbr": "", "def_zh": "针对符号距离场的光线步进：把当前点的距离值当作安全步长前进，检测到符号变化后再在最后一步的区间内二分细化以定准表面。Ha et al. 使用 0.8·s 的保守步长和 3 次二分，区间缩小到原来的 1/8。", "concept_id": "r-raymarch", "category": "渲染与图形"}, {"term_en": "Signed distance function", "term_zh": "符号距离函数", "abbr": "SDF", "def_zh": "给出空间点到最近表面距离的标量场，表面一侧为正、另一侧为负，零等值面就是表面；其梯度即表面法线。截断后的版本就是 TSDF，可用球面追踪求交或用移动立方体提取网格。", "concept_id": "r-raymarch", "category": "渲染与图形"}, {"term_en": "BRDF", "term_zh": "双向反射分布函数", "abbr": "BRDF", "def_zh": "描述材质把某入射方向的光反射到某出射方向的比例 f_r(ω_i, ω_o)，出射辐亮度等于入射光乘以 BRDF 和余弦项后在半球上的积分。BRDF 为常数 ρ/π 的理想漫反射（Lambertian）从任何方向看都一样亮，这正是光度一致性和 IBR 任意混合颜色所隐含的假设。", "concept_id": "r-appearance", "category": "渲染与图形"}, {"term_en": "Specular highlight & Fresnel effect", "term_zh": "高光与菲涅尔效应", "abbr": "", "def_zh": "光泽材质的反射集中在镜面方向附近，高光会随视点在表面上滑动；菲涅尔效应使电介质在掠射角下的反射率急剧上升。二者破坏多视角颜色一致性，导致匹配出错和 IBR 重影。", "concept_id": "r-appearance", "category": "渲染与图形"}, {"term_en": "View-dependent appearance", "term_zh": "视角相关外观", "abbr": "", "def_zh": "同一表面点的颜色随观察方向变化的现象（高光、反射等）。NeRF 把方向作为 MLP 输入，3DGS 用球谐函数，IBR 则通过偏向角度相近的输入视角来近似它。", "concept_id": "r-appearance", "category": "渲染与图形"}, {"term_en": "Spherical harmonics", "term_zh": "球谐函数", "abbr": "SH", "def_zh": "定义在球面上的一组正交基函数，可用少量系数表示方向的低频函数。3DGS 用 3 阶球谐（每个颜色通道 16 个系数，共 48 个）表示每个高斯的视角相关颜色。", "concept_id": "r-appearance", "category": "渲染与图形"}, {"term_en": "Aliasing / anti-aliasing", "term_zh": "走样 / 抗走样", "abbr": "", "def_zh": "采样频率低于信号最高频率的两倍（Nyquist 条件）时，高频成分折叠成虚假的低频图样，表现为锯齿、摩尔纹和随运动的闪烁；抗走样即在采样前做低通滤波或超采样。Mip-NeRF、Mip-Splatting 专门处理这一问题。", "concept_id": "f-image", "category": "渲染与图形"}, {"term_en": "Bilinear interpolation", "term_zh": "双线性插值", "abbr": "", "def_zh": "在非整数坐标处用周围 4 个像素按面积加权取值，结果连续但偏模糊，是可微 warp 的基础。对深度图在前景/背景交界处做双线性插值会产生飞点。", "concept_id": "f-image", "category": "渲染与图形"}, {"term_en": "Exposure & white balance", "term_zh": "曝光与白平衡", "abbr": "", "def_zh": "曝光决定传感器积累的光量（曝光时间与增益），白平衡给 R、G、B 各乘一个增益使白色呈中性。不同相机的曝光和白平衡不一致时，IBR 会出现接缝和闪烁，Quark 自述对此敏感。", "concept_id": "f-image", "category": "渲染与图形"}, {"term_en": "Explicit 3D representations (point cloud / mesh / voxel)", "term_zh": "显式三维表示（点云 / 网格 / 体素）", "abbr": "", "def_zh": "点云是无拓扑的点集，易由深度反投影得到但渲染时有空隙；三角网格是 GPU 光栅化的标准输入，难以表示头发、半透明和拓扑变化；体素网格查询简单，但显存随分辨率立方增长。它们在存储、渲染和时间一致性上各有取舍。", "concept_id": "r-reps", "category": "渲染与图形"}, {"term_en": "Implicit neural representation", "term_zh": "隐式神经表示", "abbr": "", "def_zh": "用神经网络（通常是 MLP）把坐标映射为场值（密度、颜色、SDF）的连续表示，分辨率不受网格限制，但每次查询都要运行网络、速度较慢。NeRF 是代表。", "concept_id": "r-reps", "category": "渲染与图形"}, {"term_en": "Persistent vs. per-view representation", "term_zh": "持久表示与逐视角表示", "abbr": "", "def_zh": "持久（全局）表示重建一次即可从任意视点渲染（如 3DGS、网格）；逐视角表示只为当前目标视点构造（如 Quark 的 LDM、Ha et al. 的目标视角 TSDF 深度），每个视点、每只眼都要重算。两篇锚点论文都选了后者。", "concept_id": "r-reps", "category": "渲染与图形"}, {"term_en": "Plenoptic function", "term_zh": "全光函数", "abbr": "", "def_zh": "Adelson 与 Bergen（1991）提出的 7 维函数，描述空间任一位置、沿任一方向、任一波长、任一时刻的光线辐亮度。一张照片就是它在固定光心和时刻下的一个二维切片。", "concept_id": "i-lightfield", "category": "IBR 与表示"}, {"term_en": "Light field", "term_zh": "光场", "abbr": "", "def_zh": "在自由空间中辐亮度沿光线不变，全光函数可降为 4D 光场，常用双平面参数化 L(u,v,s,t) 表示（Levoy 与 Hanrahan 1996；同期的 Lumigraph 由 Gortler 等提出，并利用近似几何修正光线查找）。新视角合成就是对已记录的光线重新采样。", "concept_id": "i-lightfield", "category": "IBR 与表示"}, {"term_en": "Plenoptic sampling", "term_zh": "全光采样", "abbr": "", "def_zh": "Chai 等（2000）对光场的频谱分析：所需的最大相机间距与场景视差范围成反比；几何信息越多（层数越多、深度越准），需要的图像就越少（最小采样曲线）。", "concept_id": "i-lightfield", "category": "IBR 与表示"}, {"term_en": "Image-based rendering", "term_zh": "基于图像的渲染", "abbr": "IBR", "def_zh": "新视角的颜色直接从输入照片中采样和混合得到，几何只作为“去哪里取色”的代理。它锐度高、保留真实纹理，但依赖几何的准确性，几何出错时表现为重影或硬边而不是模糊。", "concept_id": "i-lightfield", "category": "IBR 与表示"}, {"term_en": "Geometric proxy", "term_zh": "几何代理", "abbr": "", "def_zh": "IBR 中用来决定从各输入图哪个位置取色的近似几何，如深度图、网格或分层表示。Quark 的代理是网络推出的 LDM 层深度，Ha et al. 的代理是 RAFT-Stereo 深度和 TSDF 融合出的目标深度。", "concept_id": "i-blending", "category": "IBR 与表示"}, {"term_en": "View-dependent texture mapping", "term_zh": "视角相关纹理映射", "abbr": "VDTM", "def_zh": "Debevec 等（1996）提出的方法：把多张照片投影到代理几何上，按目标视角与各输入视角的接近程度加权混合，从而近似视角相关外观。", "concept_id": "i-blending", "category": "IBR 与表示"}, {"term_en": "Unstructured Lumigraph Rendering", "term_zh": "非结构化 Lumigraph 渲染", "abbr": "ULR", "def_zh": "Buehler 等（2001）的经典 IBR 混合方法，按射线夹角偏差、分辨率匹配、随视点连续变化、可见性等准则为各输入视角分配权重。Quark 与 Ha et al. 让网络从数据中学出这类权重。", "concept_id": "i-blending", "category": "IBR 与表示"}, {"term_en": "Blend weights", "term_zh": "混合权重", "abbr": "β / w_k", "def_zh": "为每个像素（或每层每个像素）分配给各输入视角的非负权重，归一化后对取来的颜色做凸组合。Quark 的 β 经 softmax 得到且和为 1；Ha et al. 的 w_k 与 α_k 相乘后再归一化。", "concept_id": "i-blending", "category": "IBR 与表示"}, {"term_en": "Ghosting", "term_zh": "重影", "abbr": "", "def_zh": "几何或视角权重不准时，同一物体从不同输入视角被取到不同位置，叠加出半透明的双重轮廓；高光位置不一致时也会混出两个半亮的高光。", "concept_id": "i-blending", "category": "IBR 与表示"}, {"term_en": "Seams / hard edges", "term_zh": "接缝 / 硬边", "abbr": "", "def_zh": "相邻像素的混合权重突然切换到不同输入视角时，由颜色或几何差异形成的可见边界。曝光不一致和标定误差会放大它，Quark 自述在这些情况下会出现硬边。", "concept_id": "i-blending", "category": "IBR 与表示"}, {"term_en": "Per-view rendering with learned fusion", "term_zh": "逐视角渲染再学习融合", "abbr": "", "def_zh": "先按代理几何把每个输入视角单独渲染到目标视角，再在目标图像空间用 2D 网络融合（FVS、SVS、FWD、Ha et al.）。与把所有视角的高斯合并后一次渲染相比，它避免了 Z-fighting 和颜色串混。", "concept_id": "i-blending", "category": "IBR 与表示"}, {"term_en": "Forward warping", "term_zh": "前向 warping", "abbr": "", "def_zh": "把源图的每个像素按深度投射到目标图（scatter），会产生空洞和重叠，需要 z 排序和补洞。Ha et al. 用像素级高斯的溅射来实现。", "concept_id": "i-warping", "category": "IBR 与表示"}, {"term_en": "Backward warping", "term_zh": "后向 warping", "abbr": "", "def_zh": "从每个目标像素出发，回到源图中采样取值（gather），不会产生裂缝，但必须事先知道目标视角的深度。", "concept_id": "i-warping", "category": "IBR 与表示"}, {"term_en": "Disocclusion", "term_zh": "去遮挡区域", "abbr": "", "def_zh": "在目标视角中可见、但在输入视角中被挡住的区域，前向 warp 后表现为空洞。Ha et al. 用网络生成的背景图来填补。", "concept_id": "i-warping", "category": "IBR 与表示"}, {"term_en": "Background image", "term_zh": "背景图", "abbr": "𝓘_BG", "def_zh": "Ha et al. 的混合网络直接生成的 RGB 图，由背景权重 w_BG 混入最终图像以填补去遮挡空洞。它不是真实像素，也没有任何时间约束，大面积空洞处可能闪烁。", "concept_id": "i-warping", "category": "IBR 与表示"}, {"term_en": "Multiplane image", "term_zh": "多平面图像", "abbr": "MPI", "def_zh": "由固定深度、与参考像平面平行的一组 RGBA 平面组成的分层表示（Stereo Magnification，Zhou et al. 2018）。渲染时把各平面按单应 warp 到新视角，再从后往前做 over 合成。", "concept_id": "i-layered", "category": "IBR 与表示"}, {"term_en": "Layered depth image", "term_zh": "分层深度图像", "abbr": "LDI", "def_zh": "Shade 等（1998）提出的表示：每个像素沿视线存储多个深度样本及其颜色，因而能保存被前景挡住的内容。", "concept_id": "i-layered", "category": "IBR 与表示"}, {"term_en": "Layered depth map", "term_zh": "分层深度图", "abbr": "LDM", "def_zh": "Quark 的核心表示：位于目标视锥内的 L 层，每层每个像素有自己的深度、alpha 和对 M 张输入图的混合权重，可以看作“可弯曲的 MPI”。", "concept_id": "i-layered", "category": "IBR 与表示"}, {"term_en": "Layered mesh", "term_zh": "分层网格", "abbr": "LM", "def_zh": "把每层深度图转成三角网格的分层表示（Immersive Light Field Video、SIMPLI），便于视频编码和 GPU 渲染。Quark 直接渲染 LDM，不需要实例化网格。", "concept_id": "i-layered", "category": "IBR 与表示"}, {"term_en": "Disparity band / depth anchor", "term_zh": "视差带 / 深度锚点", "abbr": "", "def_zh": "Quark 把 [1/f, 1/η] 等分成 L 段，每段中心 δ_ℓ 为锚点，第 ℓ 层的深度只能在自己那一段内移动。这样既保持了层的前后顺序，又按等视差分配深度分辨率。", "concept_id": "i-layered", "category": "IBR 与表示"}, {"term_en": "Layer collapse", "term_zh": "层折叠", "abbr": "Lc", "def_zh": "Quark 在最后两个 Update & Fuse 步开始时把相邻两层合并为一层，层数减半、视差带宽度加倍，以便在提高分辨率的同时控制计算量。", "concept_id": "i-layered", "category": "IBR 与表示"}, {"term_en": "Plane sweep volume", "term_zh": "平面扫描体", "abbr": "PSV", "def_zh": "把各输入图像（或特征）按一组深度平面重投影到目标或参考视角后堆叠成的张量。在正确深度处各视角对齐，网络可同时读出深度线索和颜色；DeepStereo、Stereo Magnification、DeepView 都以它为输入。", "concept_id": "i-psv", "category": "IBR 与表示"}, {"term_en": "Feature volume", "term_zh": "特征体", "abbr": "V", "def_zh": "Quark 求解过程中 LDM 的隐式编码，形状为 [L,H,W,C=32]，经线性投影解码出深度、alpha 和混合权重，并在每个 Update & Fuse 步中被更新。", "concept_id": "i-psv", "category": "IBR 与表示"}, {"term_en": "Update feature", "term_zh": "更新特征", "abbr": "Δ", "def_zh": "Quark 中每个输入视角由 Update CNN 在图像空间生成、再按当前深度反投影到层空间的特征，形状为 [M,L,H,W,C]。它同时携带匹配线索和“渲染 vs 观测”的可见性信息，作用类似平面扫描体。", "concept_id": "i-psv", "category": "IBR 与表示"}, {"term_en": "Multilayer perceptron", "term_zh": "多层感知机", "abbr": "MLP", "def_zh": "由若干全连接层与逐元素非线性激活堆叠而成的网络。NeRF 用 MLP 表示辐射场，Transformer 的前馈子层也是 MLP；以低维坐标为输入时它偏好平滑函数。", "concept_id": "l-encoding", "category": "学习与网络"}, {"term_en": "Convolutional neural network", "term_zh": "卷积神经网络", "abbr": "CNN", "def_zh": "用共享的小卷积核在图像上滑动提取局部特征的网络，具有平移等变性，是图像空间特征提取、融合与细化的主力。", "concept_id": "l-cnn", "category": "学习与网络"}, {"term_en": "Residual block", "term_zh": "残差块", "abbr": "", "def_zh": "输出为 x + F(x) 的网络单元，恒等捷径让梯度可以直接回传，使很深的网络也容易训练（ResNet）。", "concept_id": "l-cnn", "category": "学习与网络"}, {"term_en": "U-Net", "term_zh": "U-Net", "abbr": "", "def_zh": "带同尺度跳连的编码器-解码器卷积网络：编码器下采样获得大感受野，解码器上采样并借助跳连恢复像素级细节。Ha et al. 的混合网络是一个四层 U-Net。", "concept_id": "l-cnn", "category": "学习与网络"}, {"term_en": "Feature pyramid", "term_zh": "特征金字塔", "abbr": "", "def_zh": "多分辨率的 CNN 特征图：浅层分辨率高、细节多，深层感受野大、语义强。Quark 用残差 CNN 加步长均值池化得到多级特征，供不同分辨率的迭代步使用。", "concept_id": "l-cnn", "category": "学习与网络"}, {"term_en": "Scaled dot-product attention", "term_zh": "缩放点积注意力", "abbr": "", "def_zh": "用 query 与各 key 的点积除以 √d 后经 softmax 得到权重，再对 value 加权平均。它与输入顺序无关，并能处理数量可变的输入，适合跨视角融合。", "concept_id": "l-attention", "category": "学习与网络"}, {"term_en": "Self-attention / cross-attention", "term_zh": "自注意力 / 交叉注意力", "abbr": "", "def_zh": "自注意力中 query、key、value 来自同一组 token；交叉注意力中 query 来自一组（如目标射线或 LDM 元素），key 与 value 来自另一组（如各输入视角的特征）。", "concept_id": "l-attention", "category": "学习与网络"}, {"term_en": "Transformer", "term_zh": "Transformer", "abbr": "", "def_zh": "由多头注意力、前馈网络、残差连接和归一化层堆叠而成的网络结构，计算量随 token 数平方增长。LRM、LVSM、VGGT 等大模型都基于它。", "concept_id": "l-attention", "category": "学习与网络"}, {"term_en": "Vision Transformer / patch tokens", "term_zh": "视觉 Transformer / 图像块 token", "abbr": "ViT", "def_zh": "把图像切成 p×p 的块、每块线性投影成一个 token 后送入 Transformer 的结构。DINOv2 等预训练 ViT 常被用作深度估计和几何模型的骨干。", "concept_id": "l-attention", "category": "学习与网络"}, {"term_en": "One-to-many attention", "term_zh": "一对多注意力", "abbr": "", "def_zh": "Quark 的跨视角融合方式：每个 LDM 元素用 1 个 query 对 M 个视角的更新特征 Δ 做交叉注意力，并把 W^K 折叠进 W^Q、W^V 折叠进 W^O，省去对 M 个输入逐一做投影的开销。", "concept_id": "l-attention", "category": "学习与网络"}, {"term_en": "Pre-LN / RMSNorm", "term_zh": "前置归一化 / 均方根归一化", "abbr": "", "def_zh": "Pre-LN 指在残差分支内先归一化、再做注意力或 MLP 的结构，训练更稳定；RMSNorm 只按均方根缩放、不减均值。Quark 的 Fusion Block 沿用这种结构，并用 3×3 卷积代替 MLP。", "concept_id": "l-attention", "category": "学习与网络"}, {"term_en": "Positional encoding", "term_zh": "位置编码", "abbr": "PE", "def_zh": "把坐标或方向映射成多频率的正弦、余弦特征再输入网络。以低维坐标为输入的 MLP 有“频谱偏置”，难以拟合高频细节，这种傅里叶特征映射可以缓解；NeRF 对 3D 位置用 10 个频率、对观察方向用 4 个频率。", "concept_id": "l-encoding", "category": "学习与网络"}, {"term_en": "Ray directional encoding", "term_zh": "射线方向编码", "abbr": "γ", "def_zh": "Quark 对每条输入射线计算其与目标视锥近、远平面交点在投影空间中的 2D 差向量，经 tanh 和 8 个 octave 的正弦编码后线性投影到 C 维；与目标射线重合时为 0。", "concept_id": "l-encoding", "category": "学习与网络"}, {"term_en": "L1 / L2 loss", "term_zh": "L1 / L2 损失", "abbr": "", "def_zh": "逐像素的绝对误差与平方误差。L2 对应均值估计，在不确定区域容易得到模糊结果；L1 对应中位数，对外点更稳健。Quark 用 10·L1 + LPIPS，Ha et al. 用 0.8·L1 + 0.2·SSIM 再加深度和掩码辅助项。", "concept_id": "l-loss", "category": "学习与网络"}, {"term_en": "Residual scaling (initialization)", "term_zh": "残差缩放（初始化）", "abbr": "", "def_zh": "GPT-2 提出的初始化技巧：按残差层数缩放残差分支的权重，以稳定深层网络的训练。Quark 采用了这一做法。", "concept_id": "l-loss", "category": "学习与网络"}, {"term_en": "Adam / AdamW & learning-rate schedule", "term_zh": "Adam / AdamW 优化器与学习率日程", "abbr": "", "def_zh": "Adam 按梯度的一阶、二阶矩估计为每个参数自适应调整步长，AdamW 把权重衰减与梯度更新解耦；训练通常配合 warmup（先线性升高学习率）和余弦衰减。Quark 采用 warmup 加 cosine 的学习率日程。", "concept_id": "f-optim", "category": "学习与网络"}, {"term_en": "Learned gradient descent / render-and-refine", "term_zh": "学习式梯度下降 / 渲染—细化（展开优化）", "abbr": "LGD", "def_zh": "DeepView 提出的展开优化：把“渲染当前估计到输入视角、与观测比较、更新”的迭代展开成固定几步，由网络根据这些“梯度原料”直接输出更新并端到端训练，几步即可收敛。Quark 的 Update & Fuse 迭代沿用了这一思路。", "concept_id": "l-iterative", "category": "学习与网络"}, {"term_en": "Update & Fuse step", "term_zh": "更新—融合步", "abbr": "", "def_zh": "Quark 的一次迭代：解码并渲染中间 LDM（Render），逐视角生成更新特征并反投影成 Δ（Update），再用跨视角注意力和卷积更新特征体 V（Fuse）。全网络共 5 步。", "concept_id": "l-iterative", "category": "学习与网络"}, {"term_en": "Convolutional GRU", "term_zh": "卷积门控循环单元", "abbr": "ConvGRU", "def_zh": "用卷积代替全连接的门控循环单元。RAFT 与 RAFT-Stereo 用它维护隐藏状态，每次迭代输出光流或视差的增量，是学习式迭代细化的常用算子。", "concept_id": "l-iterative", "category": "学习与网络"}, {"term_en": "Post-activation upsampling", "term_zh": "上采样后激活", "abbr": "", "def_zh": "先对未激活的 logits（深度、alpha、混合权重）做双线性上采样，再施加 sigmoid、softmax 等非线性，可在低分辨率网格上得到锐利的边界（ReLU Fields、DVGO）。Quark 用它把 288×512 的几何放大 3.75 倍到 1080p。", "concept_id": "f-image", "category": "学习与网络"}, {"term_en": "Diffusion model", "term_zh": "扩散模型", "abbr": "", "def_zh": "先把数据逐步加噪成高斯噪声，再训练网络逐步去噪，从而学会从复杂分布中采样的生成模型（如 DDPM）。它擅长补全缺失内容，但多步采样慢，逐帧独立采样还会闪烁。", "concept_id": "l-diffusion", "category": "学习与网络"}, {"term_en": "Latent diffusion model", "term_zh": "潜空间扩散模型", "abbr": "", "def_zh": "先用 VAE 把图像压到低维潜空间、再在潜空间中做扩散的模型，计算量大幅降低，Stable Diffusion 即属此类。它常被缩写为 LDM，与 Quark 的分层深度图（LDM）同名，阅读时要注意区分。", "concept_id": "l-diffusion", "category": "学习与网络"}, {"term_en": "Score distillation sampling", "term_zh": "分数蒸馏采样", "abbr": "SDS", "def_zh": "DreamFusion 提出：给 3D 表示的渲染图加噪，用 2D 扩散模型预测噪声，并把噪声残差经渲染器的雅可比回传给 3D 参数，从而无需 3D 训练数据就能用 2D 先验优化 3D。", "concept_id": "l-diffusion", "category": "学习与网络"}, {"term_en": "Neural rendering", "term_zh": "神经渲染", "abbr": "", "def_zh": "把神经网络与图形学渲染（光栅化、体渲染、IBR）结合，从图像中学习场景表示或直接生成图像的方法的统称。NeRF、3DGS、可泛化 IBR 都属于这一范畴。", "concept_id": "n-nerf", "category": "神经渲染"}, {"term_en": "Novel view synthesis", "term_zh": "新视角合成", "abbr": "NVS", "def_zh": "给定若干已知位姿的图像，合成场景在新相机位姿下的图像。Quark 与 Ha et al. 都要求逐帧在线完成重建与渲染。", "concept_id": "n-generalizable", "category": "神经渲染"}, {"term_en": "Neural Radiance Field", "term_zh": "神经辐射场", "abbr": "NeRF", "def_zh": "Mildenhall 等（ECCV 2020）提出：用 MLP 把 3D 位置和观察方向映射为体密度和颜色，经可微体渲染成像，并针对每个场景用多视角照片做梯度下降拟合。质量高，但训练和渲染都慢。", "concept_id": "n-nerf", "category": "神经渲染"}, {"term_en": "Per-scene optimization", "term_zh": "逐场景优化", "abbr": "", "def_zh": "针对每个场景单独拟合一个表示（如 NeRF、3DGS），需要数分钟到数小时，换一个场景或换一帧就要重新优化，与前馈式方法相对。", "concept_id": "n-nerf", "category": "神经渲染"}, {"term_en": "Floaters", "term_zh": "漂浮物", "abbr": "", "def_zh": "逐场景优化得到的辐射场或高斯场景中悬浮在空中的半透明伪影，常因训练视角稀疏或用空中的密度去拟合视角相关颜色而产生；distortion 损失等正则可以抑制。", "concept_id": "n-nerf", "category": "神经渲染"}, {"term_en": "Mip-NeRF / integrated positional encoding", "term_zh": "Mip-NeRF / 积分位置编码", "abbr": "IPE", "def_zh": "Mip-NeRF 用锥体代替射线，把每段锥台近似成 3D 高斯并解析求出位置编码的期望，使足迹大的样本自动衰减高频特征，从而抗走样。", "concept_id": "n-nerf", "category": "神经渲染"}, {"term_en": "Multiresolution hash encoding", "term_zh": "多分辨率哈希编码", "abbr": "", "def_zh": "Instant-NGP 的输入编码：在 16 个分辨率级别上把网格顶点经空间哈希映射到可训练特征表，三线性插值后拼接送入小 MLP，大幅缩短了神经场的训练时间。", "concept_id": "l-encoding", "category": "神经渲染"}, {"term_en": "3D Gaussian Splatting", "term_zh": "3D 高斯溅射", "abbr": "3DGS", "def_zh": "Kerbl 等（SIGGRAPH 2023）提出：用大量带位置、各向异性协方差、不透明度和球谐颜色的 3D 高斯表示场景，投影成屏幕上的 2D 椭圆后按 16×16 像素的 tile 和深度排序、从前到后 alpha 混合，可实时渲染；每个场景仍需优化数十分钟。Ha et al. 直接复用了它的光栅器。", "concept_id": "n-3dgs", "category": "神经渲染"}, {"term_en": "Anisotropic covariance", "term_zh": "各向异性协方差", "abbr": "Σ", "def_zh": "3DGS 中每个高斯的形状，写成 Σ = R S Sᵀ Rᵀ（由旋转四元数和三个轴向尺度构成），以保证正定且便于优化；投影时经局部仿射近似变为屏幕上的 2D 协方差。", "concept_id": "n-3dgs", "category": "神经渲染"}, {"term_en": "Adaptive density control", "term_zh": "自适应密度控制（致密化）", "abbr": "", "def_zh": "3DGS 训练中根据视空间位置梯度克隆小高斯、分裂大高斯，并剪除低不透明度高斯的启发式策略；3DGS-MCMC 把它重新表述为采样过程，使高斯总数可控。", "concept_id": "n-3dgs", "category": "神经渲染"}, {"term_en": "Popping", "term_zh": "突跳伪影", "abbr": "", "def_zh": "3DGS 只按高斯中心深度排序，相互穿插的高斯在视角变化时先后顺序翻转，画面突然跳变。StopThePop 用逐像素的分层重排序来缓解。", "concept_id": "n-3dgs", "category": "神经渲染"}, {"term_en": "Pixel-sized isotropic Gaussian", "term_zh": "像素级各向同性高斯", "abbr": "", "def_zh": "Ha et al. 的做法：以每个像素的反投影点为中心、协方差为 σ²I 的 3D 高斯，σ 使它在源图中约覆盖 1 个像素，不透明度为 1，颜色取像素值；参数由深度解析给定而非优化。", "concept_id": "n-3dgs", "category": "神经渲染"}, {"term_en": "2D Gaussian Splatting", "term_zh": "2D 高斯溅射", "abbr": "2DGS", "def_zh": "把高斯压扁成有向圆盘，渲染时精确计算射线与圆盘的交点，使深度和法线有良好定义，从而改善多视角几何一致性和表面重建。", "concept_id": "n-3dgs", "category": "神经渲染"}, {"term_en": "Mip-Splatting", "term_zh": "Mip-Splatting", "abbr": "", "def_zh": "按训练相机的最大采样率给每个 3D 高斯加一个 3D 平滑滤波，并用 2D Mip 滤波替代屏幕空间膨胀，消除改变观看距离或分辨率时的走样与高频伪影。", "concept_id": "n-3dgs", "category": "神经渲染"}, {"term_en": "Generalizable / feed-forward NVS", "term_zh": "可泛化 / 前馈式新视角合成", "abbr": "", "def_zh": "在大量场景上训练一个网络，推理时对新场景只做一次前向：输入几张已标定图像，直接输出新视角图像或可渲染的中间表示，不做逐场景优化。Quark、Ha et al.、IBRNet、ENeRF 都属于此类。", "concept_id": "n-generalizable", "category": "神经渲染"}, {"term_en": "Generalizable NeRF", "term_zh": "可泛化 NeRF", "abbr": "", "def_zh": "沿目标射线采样 3D 点、投影到各源视角取特征，由网络跨视角聚合出密度和颜色（或混合权重）再体渲染的方法，如 pixelNeRF、IBRNet、ENeRF；ENeRF 用代价体估计深度区间，每条射线只采 2 个点以达到实时。", "concept_id": "n-generalizable", "category": "神经渲染"}, {"term_en": "Pixel-aligned Gaussians", "term_zh": "像素对齐高斯", "abbr": "", "def_zh": "前馈 3DGS 的主流做法：网络为每个输入像素预测一个高斯的深度、尺度、旋转、不透明度和颜色，把 3D 重建转化为 2D 逐像素回归（如 pixelSplat、MVSplat、GPS-Gaussian）。", "concept_id": "n-generalizable", "category": "神经渲染"}, {"term_en": "Large Reconstruction Model", "term_zh": "大重建模型", "abbr": "LRM", "def_zh": "把输入图像块与 Plücker 射线编码为 token，经大型 Transformer 全局注意力后直接解码出三平面、高斯等 3D 表示的前馈模型（如 LRM、GS-LRM），依赖大规模数据训练。", "concept_id": "n-generalizable", "category": "神经渲染"}, {"term_en": "Geometry-free renderer", "term_zh": "无几何渲染器", "abbr": "", "def_zh": "不构造任何显式 3D 表示、直接由 Transformer 从输入图像和目标射线回归像素的方法（如 SRT、LVSM）。它很灵活，但没有机制保证相邻视角和相邻帧的一致，在不确定区域容易闪烁。", "concept_id": "n-generalizable", "category": "神经渲染"}, {"term_en": "Pose-free feed-forward reconstruction", "term_zh": "无位姿前馈重建", "abbr": "", "def_zh": "不需要预先标定的相机参数、由网络同时预测几何与相机的前馈重建（如 NoPoSplat、AnySplat），可缓解相机碰歪、漂移和标定误差带来的问题。", "concept_id": "n-generalizable", "category": "神经渲染"}, {"term_en": "Input view selection", "term_zh": "输入视角选择", "abbr": "", "def_zh": "可泛化方法只使用目标附近的少数输入视角：Quark 推理时取最近的 8 个，Ha et al. 取最近的 K 个（DyNeRF 上 K=4）。目标视点移动时所选集合会切换，从而引起闪烁。", "concept_id": "n-generalizable", "category": "神经渲染"}, {"term_en": "Dynamic NeRF / deformation field", "term_zh": "动态 NeRF / 变形场", "abbr": "", "def_zh": "用“规范空间（标准姿态的静态副本）+ 随时间变化的变形场”（如 D-NeRF、Nerfies）或以时间潜码为条件的辐射场（如 DyNeRF）表示动态场景。前者天然给出跨帧对应但难处理拓扑变化，二者通常都需要对整段视频离线优化。", "concept_id": "n-dynamic", "category": "神经渲染"}, {"term_en": "4D Gaussian Splatting", "term_zh": "4D 高斯溅射", "abbr": "4DGS", "def_zh": "把 3DGS 扩展到时间维：或用变形网络预测规范高斯随时间的偏移（Wu et al.），或直接定义带时间维的 4D 高斯基元（Yang et al.），通常需要对整段视频离线优化。", "concept_id": "n-dynamic", "category": "神经渲染"}, {"term_en": "Streaming reconstruction", "term_zh": "流式重建", "abbr": "", "def_zh": "每来一帧就更新一次、看不到未来帧的在线重建。例如 3DGStream 以上一帧的高斯为起点，只学习位移、旋转并按需补充新高斯。", "concept_id": "n-dynamic", "category": "神经渲染"}, {"term_en": "Free-viewpoint / volumetric video", "term_zh": "自由视点视频 / 体积视频", "abbr": "FVV", "def_zh": "回放时可以自由选择观看视点的视频，通常由多相机阵列采集，并重建成网格、点云、高斯或多视角加深度流来存储和传输。", "concept_id": "n-dynamic", "category": "神经渲染"}, {"term_en": "Parametric body model (SMPL)", "term_zh": "参数化人体模型（SMPL）", "abbr": "SMPL", "def_zh": "用 10 维形状参数 β 和 72 维姿态参数 θ（24 个关节的轴角）驱动 6890 顶点模板网格的可微人体模型。它用线性混合蒙皮（LBS，顶点位置为各关节刚性变换的加权平均）加随姿态变化的校正形变来避免肘部、肩部塌陷。", "concept_id": "n-dynamic", "category": "神经渲染"}, {"term_en": "Codec Avatars", "term_zh": "编解码化身", "abbr": "", "def_zh": "Meta 提出的路线：事先为每位用户采集数据并学习一个解码器，通话时只传输低维潜码，接收端再解码出高保真的人脸或全身外观；需要登记采集。", "concept_id": "n-dynamic", "category": "神经渲染"}, {"term_en": "Generative novel view synthesis / generative repair", "term_zh": "生成式新视角合成 / 生成式修复", "abbr": "", "def_zh": "利用图像或视频扩散模型“想象”输入中未见内容的新视角方法（如 Zero-1-to-3、CAT3D），或只修补重建渲染结果中伪影的修复器（如 Difix3D+）。", "concept_id": "l-diffusion", "category": "神经渲染"}, {"term_en": "Online vs. real-time", "term_zh": "在线与实时", "abbr": "", "def_zh": "在线指第 t 帧只用当前帧和少量历史状态、不看未来帧，也不做逐场景优化；实时指每帧处理时间低于帧间隔（30 fps 下为 33.3 ms）。在线不等于实时，也不等于端到端低延迟。", "concept_id": "v-temporal", "category": "视频与评测"}, {"term_en": "Temporal consistency", "term_zh": "时间一致性", "abbr": "", "def_zh": "输出视频相邻帧之间只随真实内容变化而变化的性质。逐帧独立预测时各帧误差互不相关，表现为闪烁，逐帧 PSNR 反映不出来。", "concept_id": "v-temporal", "category": "视频与评测"}, {"term_en": "Temporal flicker", "term_zh": "时间闪烁", "abbr": "", "def_zh": "视频相邻帧之间不应有的亮度或几何跳变。Quark 逐帧独立重建、输入集合还会切换，因此存在闪烁，而其论文指标不衡量它。", "concept_id": "v-temporal", "category": "视频与评测"}, {"term_en": "Exponential moving average", "term_zh": "指数滑动平均", "abbr": "EMA", "def_zh": "新估计 = 增益 × 新测量 + (1−增益) × 旧估计，是固定增益的卡尔曼滤波。在独立噪声下，增益为 M 时稳态方差降为原来的 M/(2−M)，代价是运动时的滞后；Ha et al. 用它对输入深度做时间滤波。", "concept_id": "f-prob", "category": "视频与评测"}, {"term_en": "Soft difference mask", "term_zh": "软差分掩码", "abbr": "M", "def_zh": "Ha et al. 的运动判别：M = min(|I_t − I_{t−1}|/λ_t + β, 1)，取 λ_t=0.7、β=0.6，因此取值范围为 [0.6, 1]，表示当前帧应在多大程度上相信新深度。光照变化和压缩噪声也会被误判为运动。", "concept_id": "v-temporal", "category": "视频与评测"}, {"term_en": "Temporal feedback", "term_zh": "时间回灌", "abbr": "", "def_zh": "Ha et al. 把上一帧输出的目标深度作为额外的 TSDF 输入，其权重取决于累积置信度和运动掩码，上限为 η=15，用来缓解输入视角集合切换引起的深度跳变。", "concept_id": "v-temporal", "category": "视频与评测"}, {"term_en": "Temporal lag / trailing", "term_zh": "时间滞后 / 拖影", "abbr": "", "def_zh": "时域滤波过度信任历史时，运动物体残留旧位置的影像或响应迟缓。时域滤波必须借助运动检测或运动补偿，在降噪与滞后之间折中。", "concept_id": "v-temporal", "category": "视频与评测"}, {"term_en": "View-switching flicker", "term_zh": "视角切换闪烁", "abbr": "", "def_zh": "目标视点移动时，参与合成的输入视角集合发生切换而引起的跳变；即使场景完全静止也会出现，时间滤波对它无效。Quark 与 Ha et al. 都承认存在这一问题。", "concept_id": "v-temporal", "category": "视频与评测"}, {"term_en": "PSNR", "term_zh": "峰值信噪比", "abbr": "PSNR", "def_zh": "定义为 10·log10(MAX²/MSE)，单位 dB，越高越好；每提高约 3 dB，MSE 约减半。它对小位移过于严厉、对模糊过于宽容，也不衡量时间闪烁。", "concept_id": "v-metrics", "category": "视频与评测"}, {"term_en": "SSIM", "term_zh": "结构相似度", "abbr": "SSIM", "def_zh": "在局部窗口内同时比较亮度、对比度和结构（协方差）的图像相似度指标，上限为 1。它也常用作训练损失，Ha et al. 的损失中就含 0.2·SSIM 项。", "concept_id": "v-metrics", "category": "视频与评测"}, {"term_en": "LPIPS", "term_zh": "学习式感知图像块相似度", "abbr": "LPIPS", "def_zh": "在预训练网络（AlexNet、VGG 等）多层归一化特征上计算加权 L2 距离的感知指标，越低越好，比 PSNR 更接近人眼判断；数值受分辨率和骨干网络影响，比较时需核对口径。", "concept_id": "v-metrics", "category": "视频与评测"}, {"term_en": "Warping error", "term_zh": "光流 warping 误差", "abbr": "", "def_zh": "用光流把第 t+1 帧 warp 到第 t 帧，在非遮挡区域计算两者差异的时间稳定性指标。它只奖励稳定、不检查与真值是否一致（全黑视频得分为 0），必须与保真度指标一起报告。", "concept_id": "v-metrics", "category": "视频与评测"}, {"term_en": "tOF / tLP", "term_zh": "时间光流差 / 时间感知差", "abbr": "tOF / tLP", "def_zh": "TecoGAN 提出的时间指标：tOF 比较输出视频与真值视频各自估计出的光流之差，tLP 比较两者相邻帧 LPIPS 之差。", "concept_id": "v-metrics", "category": "视频与评测"}, {"term_en": "Temporal change consistency", "term_zh": "时间变化一致性", "abbr": "TCC", "def_zh": "渲染视频帧差图与真值视频帧差图之间的 SSIM 平均值，越高说明时间变化越接近真值、闪烁越少。它源自 Zhang et al. 2019 的视频深度工作，Ha et al. 用其彩色版本。", "concept_id": "v-metrics", "category": "视频与评测"}, {"term_en": "Spatio-temporal entropic difference", "term_zh": "时空熵差", "abbr": "STED", "def_zh": "基于 Soundararajan 与 Bovik 的降参考时空熵差（ST-RRED）视频质量指标，在小波域比较参考视频与测试视频及其帧差的局部熵，越低越好。", "concept_id": "v-metrics", "category": "视频与评测"}, {"term_en": "SDT / SDV", "term_zh": "时间 / 视角误差标准差", "abbr": "SDT / SDV", "def_zh": "L1 误差分别在帧之间和测试视角之间的标准差（沿用 Long et al. 2021），衡量误差的稳定性而不是大小：一个处处同样模糊的方法也可能得分很低。", "concept_id": "v-metrics", "category": "视频与评测"}, {"term_en": "Fréchet Video Distance", "term_zh": "Fréchet 视频距离", "abbr": "FVD", "def_zh": "在 I3D 视频特征上计算生成视频与真实视频分布之间 Fréchet 距离的分布级指标，不需要逐像素真值，但也不检查与某个具体真值是否一致，常用于评估生成模型。", "concept_id": "v-metrics", "category": "视频与评测"}, {"term_en": "Epipolar plane image", "term_zh": "极平面图像", "abbr": "EPI", "def_zh": "相机沿水平路径平移时，把各位置渲染图的同一行像素按相机位置堆叠成 x–v 图，3D 点表现为斜率为 −f/Z 的直线，断裂或抖动说明视角不一致；固定视点按时间堆叠则得到检查闪烁的 x–t 切片。", "concept_id": "v-metrics", "category": "视频与评测"}, {"term_en": "Held-out view evaluation", "term_zh": "留出视角评测", "abbr": "", "def_zh": "把阵列中部分相机不作为输入、只作为真值来评测新视角合成的协议，例如 Quark 每 8 张取 1 张作为目标。测试视角都在阵列上时，无法评估外推到阵列之外的能力。", "concept_id": "v-metrics", "category": "视频与评测"}, {"term_en": "Stereo metrics (EPE / BP-X / D1)", "term_zh": "立体评测指标（EPE / BP-X / D1）", "abbr": "EPE", "def_zh": "EPE 是视差绝对误差的平均值；BP-X 是误差大于 X 像素的像素百分比；D1 是 KITTI 指标，统计误差同时大于 3 像素且大于真值 5% 的像素百分比。三者都在视差域计算。", "concept_id": "d-stereo", "category": "视频与评测"}, {"term_en": "Depth metrics (AbsRel / δ<1.25)", "term_zh": "深度评测指标（AbsRel / δ<1.25）", "abbr": "AbsRel", "def_zh": "AbsRel 是 |预测−真值|/真值 的平均；δ<1.25 是预测与真值之比在 1.25 倍以内的像素比例。对没有公制尺度的模型需先做尺度（和偏移）对齐，对齐方式会直接影响数值。", "concept_id": "d-mono", "category": "视频与评测"}, {"term_en": "N3DV (DyNeRF) dataset", "term_zh": "N3DV（DyNeRF）数据集", "abbr": "N3DV", "def_zh": "Neural 3D Video（DyNeRF，CVPR 2022）发布的多视角动态视频数据集，由 18–22 台同步的 GoPro 相机拍摄厨房场景（如 Sear Steak、Flame Steak），是动态新视角合成的常用基准，也是两篇锚点论文的评测数据之一。", "concept_id": "n-dynamic", "category": "视频与评测"}, {"term_en": "3D telepresence", "term_zh": "三维远程临场", "abbr": "", "def_zh": "把远端的人以真实大小、正确视差的三维形式实时呈现给本地观看者的通信系统，涉及采集、重建、压缩传输、渲染和 3D 显示的完整链路。", "concept_id": "", "category": "系统与显示"}, {"term_en": "Project Starline", "term_zh": "Project Starline", "abbr": "", "def_zh": "Google 的三维临场系统：采集舱用近红外主动立体等相机采集，多路彩色和深度视频经 H.265 压缩后传输，接收端用基于图像的融合渲染到头部跟踪的 65 英寸 8K 自动立体屏上。", "concept_id": "v-perception", "category": "系统与显示"}, {"term_en": "Live capture vs. avatar-driven telepresence", "term_zh": "实况捕捉与化身驱动", "abbr": "", "def_zh": "实况捕捉无需事先登记、如实传递此刻的外观和手中物品，但带宽高；化身驱动只传潜码、带宽极低，却需要登记采集，且只能生成模型见过的外观。", "concept_id": "", "category": "系统与显示"}, {"term_en": "End-to-end latency budget", "term_zh": "端到端延迟预算", "abbr": "", "def_zh": "把“远端动作发生到本地显示”拆成采集、处理、编码、网络、抖动缓冲、解码、重建渲染、显示各段逐项相加的分析方法。对话可容忍约 150–250 ms，只看网络推理耗时会严重低估总延迟。", "concept_id": "v-codec", "category": "系统与显示"}, {"term_en": "Sender-side vs. receiver-side rendering", "term_zh": "发送端渲染与接收端渲染", "abbr": "", "def_zh": "在发送端或云端按观看者位姿渲染再推送 2D 视频，带宽低，但头动响应要走一次网络往返；把多路彩色加深度或 3D 表示推到接收端本地渲染，带宽高且需本地 GPU，但头动延迟只取决于本地。", "concept_id": "v-codec", "category": "系统与显示"}, {"term_en": "Video codec (H.264 / HEVC / AV1)", "term_zh": "视频编解码器（H.264 / HEVC / AV1）", "abbr": "", "def_zh": "以块为单位做帧内或帧间（运动补偿）预测，再对残差做变换、量化和熵编码的标准视频压缩器，可把码率降低一到两个数量级；HEVC 的设计目标是在同等主观质量下比 H.264 省约 50% 码率。", "concept_id": "v-codec", "category": "系统与显示"}, {"term_en": "GOP and I/P/B frames", "term_zh": "图像组与 I/P/B 帧", "abbr": "GOP", "def_zh": "I 帧只做帧内编码、可独立解码但体积大；P 帧参考过去的帧；传统 B 帧还参考未来的帧，会引入重排序延迟。低延迟通信通常不参考未来帧，并用帧内刷新把 I 帧的比特分摊到多帧。", "concept_id": "v-codec", "category": "系统与显示"}, {"term_en": "Quantization parameter", "term_zh": "量化参数", "abbr": "QP", "def_zh": "控制量化步长的编码参数，H.264/HEVC 中 QP 每增加 6，步长翻倍。深度流通常需要比彩色流更低的 QP，例如 Starline 深度用 QP 14、彩色用 QP 22。", "concept_id": "v-codec", "category": "系统与显示"}, {"term_en": "Depth video coding", "term_zh": "深度视频编码", "abbr": "", "def_zh": "深度是单通道、需要高位深且边缘陡峭的信号，编码产生的振铃在反投影后会变成飞点。常用对策包括 10-bit 通道、按深度范围线性或按逆深度重映射，以及比彩色更低的 QP。", "concept_id": "v-codec", "category": "系统与显示"}, {"term_en": "RTP / WebRTC / jitter buffer", "term_zh": "RTP / WebRTC / 抖动缓冲", "abbr": "", "def_zh": "实时媒体通常经 RTP/UDP 传输，WebRTC 在其上提供拥塞控制、加密以及重传或前向纠错；接收端的抖动缓冲暂存数据包以平滑到达时间的波动，本身也会增加延迟。", "concept_id": "v-codec", "category": "系统与显示"}, {"term_en": "V-PCC / MIV", "term_zh": "基于视频的点云压缩 / MPEG 沉浸式视频", "abbr": "V-PCC / MIV", "def_zh": "两项 MPEG 标准：V-PCC 把点云分块投影成几何图、属性图和占用图后用 HEVC 编码；MIV 把多视角加深度的内容打包成图集，并把归一化视差量化后交给常规视频编码器压缩。", "concept_id": "v-codec", "category": "系统与显示"}, {"term_en": "3DGS compression", "term_zh": "3DGS 压缩", "abbr": "", "def_zh": "通过剪枝、球谐降阶、矢量量化和基于上下文的熵编码压缩高斯场景（如 LightGaussian、Scaffold-GS、HAC）。每个高斯约 59 个浮点数，其中球谐系数约占 81%，是主要压缩对象。", "concept_id": "v-codec", "category": "系统与显示"}, {"term_en": "Motion-to-photon latency", "term_zh": "运动到光子延迟", "abbr": "", "def_zh": "观看者头部运动到画面相应更新之间的延迟，必须在本地做到几十毫秒以内，否则静止的虚拟物体会“跟着头走”并诱发晕动。", "concept_id": "v-perception", "category": "系统与显示"}, {"term_en": "Binocular disparity / stereopsis", "term_zh": "双眼视差 / 立体视觉", "abbr": "", "def_zh": "两眼（瞳距约 6.3 cm）看到的图像存在水平差异，大脑融合后产生深度感。3D 显示必须为左右眼分别提供具有正确屏幕视差的图像，其几何与双目相机的 d=f·b/Z 同源。", "concept_id": "v-perception", "category": "系统与显示"}, {"term_en": "Motion parallax", "term_zh": "运动视差", "abbr": "", "def_zh": "观察者移动时，近处物体在视野中移动得比远处快而产生的深度线索。头部跟踪显示通过随头动实时更新视点来提供它。", "concept_id": "v-perception", "category": "系统与显示"}, {"term_en": "Vergence–accommodation conflict", "term_zh": "辐辏-调节冲突", "abbr": "VAC", "def_zh": "在固定焦面的 3D 显示上，双眼会聚距离由视差驱动指向虚拟物体，而晶状体只能对焦在屏幕或虚像面上。二者不一致（常以屈光度衡量）会导致视觉疲劳和立体视觉表现下降。", "concept_id": "v-perception", "category": "系统与显示"}, {"term_en": "Autostereoscopic display", "term_zh": "自动立体显示（裸眼 3D）", "abbr": "", "def_zh": "无需佩戴眼镜即可为左右眼提供不同图像的显示，例如用柱镜阵列把不同列的像素折射向不同方向。头部跟踪型只需渲染两个视点，但依赖低延迟的眼睛跟踪。", "concept_id": "v-perception", "category": "系统与显示"}, {"term_en": "Light field display", "term_zh": "光场显示", "abbr": "", "def_zh": "不跟踪观看者、同时向多个方向发出数十个视点图像的显示，多人可同时看到正确的视差，但每个视点都要渲染，对逐视角渲染的方法代价很高。", "concept_id": "v-perception", "category": "系统与显示"}, {"term_en": "Head-mounted display", "term_zh": "头戴式显示器", "abbr": "HMD", "def_zh": "为每只眼提供独立图像的 VR/AR 头显，刷新率常见 72–120 Hz，需要很低的运动到光子延迟，并为左右眼各渲染一幅图。", "concept_id": "v-perception", "category": "系统与显示"}, {"term_en": "Crosstalk", "term_zh": "串扰", "abbr": "", "def_zh": "3D 显示中本该只进入一只眼的图像部分泄漏到另一只眼，形成重影；跟踪延迟或把物体放在远离屏幕平面的位置都会加重它。", "concept_id": "v-perception", "category": "系统与显示"}, {"term_en": "Head / eye tracking", "term_zh": "头部 / 眼睛跟踪", "abbr": "", "def_zh": "实时估计观看者头部或眼睛的三维位置以确定渲染视点。由于跟踪本身有延迟，系统通常会对位置做外推预测，例如 Starline 以 120 Hz 跟踪眼部等特征并做外推。", "concept_id": "v-perception", "category": "系统与显示"}, {"term_en": "Timewarp / late-stage reprojection", "term_zh": "时间扭曲 / 渲染后重投影", "abbr": "ATW", "def_zh": "显示前按最新头部位姿对已渲染图像再做一次 warp：纯旋转时是与深度无关的单应（ATW）；有平移时需要逐像素深度（positional timewarp），并会暴露去遮挡空洞。", "concept_id": "v-perception", "category": "系统与显示"}]}</script>
<script>
(function () {
  "use strict";
  // ================= lib: DOM, text and math helpers shared by every page =================
  // A page script defines rich(text) (inline cross-links); paras() and eqList() call it.
  var DATA;
  try { DATA = JSON.parse(document.getElementById("data").textContent); } catch (e) { DATA = {}; }
  var meta = DATA.meta || {};

  // ---------- DOM helpers: all text goes through textContent; external links are https-only ----------
  function safeUrl(u) { if (typeof u !== "string") return null; var s = u.trim(); return /^https:\/\/[^\s"'<>]+$/i.test(s) ? s : null; }
  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (!Object.prototype.hasOwnProperty.call(attrs, k)) continue;
      var v = attrs[k];
      if (v === null || v === undefined || v === false) continue;
      if (k === "class") n.className = v;
      else if (k === "text") n.textContent = String(v);
      else if (k === "href") { var u = safeUrl(v); if (u) { n.setAttribute("href", u); n.setAttribute("target", "_blank"); n.setAttribute("rel", "noopener noreferrer"); } }
      else if (k.slice(0, 2) === "on" && typeof v === "function") n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, String(v));
    }
    (kids || []).forEach(function (c) { if (c === null || c === undefined || c === false) return; n.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return n;
  }
  var SVGNS = "http://www.w3.org/2000/svg";
  function sv(tag, attrs, kids) {
    var n = document.createElementNS(SVGNS, tag);
    if (attrs) for (var k in attrs) {
      if (!Object.prototype.hasOwnProperty.call(attrs, k)) continue;
      var v = attrs[k];
      if (v === null || v === undefined || v === false) continue;
      if (k === "text") n.textContent = String(v);
      else if (k.slice(0, 2) === "on" && typeof v === "function") n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, String(v));
    }
    (kids || []).forEach(function (c) { if (c) n.appendChild(c); });
    return n;
  }
  function arr(x) { return Array.isArray(x) ? x : []; }
  function str(x) { return typeof x === "string" ? x : (x === null || x === undefined ? "" : String(x)); }
  function paras(text) { return str(text).split(/\n\s*\n/).map(function (t) { return t.trim(); }).filter(Boolean).map(function (t) { return el("p", null, rich(t)); }); }
  function link(title, url) { return safeUrl(url) ? el("a", { href: url, text: title }) : el("span", { text: title }); }
  function ul(items, map) { return el("ul", { class: "plain" }, arr(items).map(function (x) { return el("li", null, [map ? map(x) : str(x)]); })); }
  function fmtCit(n) { n = Number(n); if (!(n >= 0)) return "—"; if (n >= 1000) return (n / 1000).toFixed(n >= 10000 ? 0 : 1) + "k"; return String(n); }

  // ---------- math (MathJax, typeset lazily) ----------
  var mathReady = false, mathQueue = [];
  function mathUsable() { return !!(window.MathJax && typeof window.MathJax.typesetPromise === "function"); }
  function flushMath() { mathReady = true; var q = mathQueue.slice(); mathQueue = []; q.forEach(typeset); }
  window.__atlasMathReady = flushMath;
  // MathJax may finish loading before this script runs (cached/async), so also poll for it.
  var mathPoll = setInterval(function () { if (mathUsable()) { clearInterval(mathPoll); flushMath(); } }, 200);
  setTimeout(function () { clearInterval(mathPoll); }, 30000);
  function typeset(node) {
    if (!node) return;
    if (!mathReady && mathUsable()) mathReady = true;
    if (!mathReady || !mathUsable()) { mathQueue.push(node); return; }
    try { window.MathJax.typesetPromise([node]).catch(function () { /* leave raw TeX visible */ }); } catch (e) { /* leave raw TeX visible */ }
  }
  function eqList(eqs) {
    eqs = arr(eqs).filter(function (q) { return q && str(q.tex).trim(); });
    if (!eqs.length) return null;
    return el("div", { class: "eqs" }, eqs.map(function (q) {
      return el("div", { class: "eq" }, [el("div", { class: "math-block", text: "\\[" + str(q.tex) + "\\]" }), q.explain_zh ? el("p", null, rich(q.explain_zh)) : null]);
    }));
  }
  document.addEventListener("toggle", function (e) { var t = e.target; if (t && t.tagName === "DETAILS" && t.open) typeset(t); }, true);

  // ================= core (old site): cross-links, shared components, sidebar navigation =================
  var SITE = DATA.site || {};
  // ---------- pages & cross-page links ----------
  var PAGES = arr(SITE.pages);
  var CUR_FILE = "";
  PAGES.forEach(function (p) { if (p.key === SITE.current) CUR_FILE = p.file; });
  function pageOf(id) {
    var sp = SITE.sectionPage || {};
    if (Object.prototype.hasOwnProperty.call(sp, id)) return sp[id];
    var pre = arr(SITE.prefixPage);
    for (var i = 0; i < pre.length; i++) if (id.indexOf(pre[i][0]) === 0) return pre[i][1];
    return null;
  }
  function hrefFor(id) { var f = pageOf(id); return (!f || f === CUR_FILE) ? "#" + id : f + "#" + id; }
  function align(id) {
    var t = document.getElementById(id);
    if (!t) return;
    var root = document.documentElement, prev = root.style.scrollBehavior;
    root.style.scrollBehavior = "auto";
    t.scrollIntoView({ block: "start" });
    root.style.scrollBehavior = prev;
  }
  function goTo(id, instant) {
    var t = document.getElementById(id);
    if (!t) {
      var f = pageOf(id);
      if (f && f !== CUR_FILE) window.location.href = f + "#" + id;
      return;
    }
    var p = t;
    while (p && p !== document.body) {
      if (typeof p._activate === "function") p._activate();
      if (p.tagName === "DETAILS") p.open = true;
      p = p.parentElement;
    }
    typeset(t);
    if (instant) align(id); else t.scrollIntoView({ block: "start" });
    t.classList.remove("flash"); void t.offsetWidth; t.classList.add("flash");
  }
  // Internal link: a real <a href> (works across pages, middle-click opens a tab); same-page clicks also open details and flash.
  function internalLink(targetId, cls, text, title) {
    var a = el("a", { class: cls, text: text, title: title || null });
    a.setAttribute("href", hrefFor(targetId));
    a.addEventListener("click", function (e) {
      if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      if (document.getElementById(targetId)) {
        e.preventDefault();
        try { window.history.pushState(null, "", "#" + targetId); } catch (err) { /* sandboxed frame */ }

  }
  function refChip(targetId, label, ghost) { return internalLink(targetId, "cchip" + (ghost ? " ghost" : ""), label); }

  // Known concept / advanced-topic ids mentioned in prose become inline links.
  var XREF = DATA.xref || {};
  var conceptName = XREF.concepts || {}, advName = XREF.adv || {};
  var ID_RE = /(a-[a-z0-9]+(?:-[a-z0-9]+)*|[fgdrilnv]-[a-z0-9]+)/g;
  function rich(text) {
    var s = str(text), out = [], last = 0, m;

      var id = m[1], prev = m.index > 0 ? s.charAt(m.index - 1) : "", next = s.charAt(m.index + id.length);

      if (!target || /[A-Za-z0-9_\-]/.test(prev) || /[A-Za-z0-9_]/.test(next)) continue;
