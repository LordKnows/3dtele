数据中以 AprilTag 或动捕真值衡量", "K = 4-6 时的端到端 motion-to-photon 延迟和每帧渲染毫秒数", "用户研究：任务成功率、完成时间、碰撞次数、最小间隙违规、NASA-TLX 和 SUS；各条件 EE 深度误差和 TCC 与成功率的相关性（混合效应模型）"], "key_ablations": ["机器人网格入 TSDF vs 分割并合成 vs 不处理机器人", "腕部相机：无 / 仅 FK 位姿 / FK + 光度优化", "时间门控：无 / 帧差 / render-and-compare 残差", "注入 FK 误差扫描（0-20 mm，0-2 度），找出相对 2 cm 截断融合失效的位置", "固定相机数量（2、4、6），有无腕部相机，检验一台腕部相机能否在接触区域附近替代固定相机", "融合网络有无机器人掩码和到 TCP 距离通道，以及有无 EE 加权损失", "用户研究：附加延迟 0 vs 150 ms，与界面交叉"], "needs_custom_capture": true, "capture_notes": "公开的 RH20T 可在 10 Hz 下覆盖离线 NVS 主张（C1）。用户研究主张（C2）以及任何 30 Hz 或细物体评估需要自建设备。该设备需要：一台具有稳定 URDF 和手眼标定的机械臂，4-6 台硬件同步的 RGB-D 或双目相机（RealSense D4xx 或 ZED X，配 genlock 或触发线），一台腕部 D405，一台额外的留出相机，以及一台 Quest 3 或 Vision Pro HMD。若机械臂从机器人实验室借用，预算约 5-15k 美元。若无法接触机械臂，则放弃该项目。"}, "first_two_week_test": "目标：在公开数据上检验 C1，不使用学习型融合网络，也不完整重实现 Ha et al.。\n\n第 1 周：\n- 下载约 30 段来自同一机器人配置的 RH20T 序列，均涉及抓取或放置。\n- 构建一个仅几何的渲染器：\n  - 把每个视图的 RGB-D 前向 splat 到留出的固定相机；\n  - 用 K = 4 个最近固定视图构建逐目标的 image-space TSDF；\n  - 渲染深度并做简单的可见性加权颜色融合。\n- 用提供的标定，从关节角光栅化机器人网格（pyrender 或 nvdiffrast）。\n- 检查网格轮廓与图像的对齐。网格掩码与 SAM2 夹爪掩码的 IoU 可给出 FK/标定误差的估计。\n\n第 2 周：在 EE 区域深度 AbsRel（对比留出深度）、飞点率和 EE 裁剪 LPIPS 上比较五种变体：\n- (a) 仅固定相机；\n- (b) (a) + FK 位姿下的腕部相机；\n- (c) (b) + 光度位姿优化；\n- (d) (c) + 机器人网格作为 TSDF 输入；\n- (e) (c) + URDF 渲染的分割并合成。\n\n另做一次 10 分钟的非正式预试：3 名实验室成员在 HMD 中观看 (a) 与 (d) 的视频，判断夹爪与物体之间的间隙。\n\n成本：约 1 张 GPU 和 1 名学生。验证信号是：(d) 在 EE 深度误差上比 (a) 至少好 25%，在飞点上至少好 40%，并在遮挡边界 F-score 上胜过 (e)。", "kill_criteria": "出现以下任一情况即停止或转向。\n(1) 在 RH20T 上，加入机器人网格使 EE 区域深度误差或飞点率相对仅固定相机的降低不足 15%。若它与分割并合成在统计上无法区分，也应停止：那说明该先验已被以往系统使用的平凡管线完全捕获。\n(2) FK + 优化后腕部相机位姿误差仍高于约 1 cm，导致腕部视图出现鬼影，加入后 EE 裁剪 LPIPS 反而比仅固定相机更差。此时移动相机的故事退化为 2D 腕部面板。\n(3) 预试用户研究（n = 6-8，一个轴孔任务）在延迟匹配下，与点云 + 腕部面板相比成功率差异不足 10 个百分点，时间或碰撞也无差异。若照片级 IBR 不改变操作者行为，意义论证便不复存在。\n(4) 出现一篇同期论文，为遥操作实现了融合固定与腕部相机及机器人几何的 feed-forward、逐帧照片级 IBR。每月重新检索 arXiv；两轮新颖性检索中 API 都被限流。\n(5) 1 个月内未能找到机器人实验室合作方。", "reviewer_objections": [{"objection": "这是已知组件的系统集成：ReFusion 或 Embodied Gaussians 的残差掩码、cuMotion 的机器人过滤，以及 Ha et al. 的 IBR。没有新的基础方法。", "rebuttal": "组件方面我们同意，论文也明确这样表述。贡献在于实证发现和指标：决定遥操作结果的是接触区域几何和时间一致性，而非 PSNR。在逐帧几何阶段内部做运动学融合，可量化地胜过以往所有遥操作系统使用的分割并合成设计。目标投向机器人或 VR 会议，那里经过验证的系统 + 人因贡献是一等公民；并纳入刻画融合何时有效的 FK 误差扫描。"}, {"objection": "为什么不直接从 URDF 渲染机器人（如 Dincer et al. 和 Boehringer et al. 那样），把精力花在场景上？", "rebuttal": "分割并合成基线已包含在内，并在遮挡边界上进行评估。合成是根据有噪声的传感器深度逐像素决定机器人与场景的深度顺序，因此在接触时手指会在视觉上穿入物体或悬浮在物体上方，而这恰恰是操作者需要判断的地方。将网格深度融合进 TSDF 还能阻止机器人飞点污染物体深度。若该基线打平，终止条件即触发。研究设计本身允许失败。"}, {"objection": "点云已经足够好。用户研究显示操作者会适应，照片级真实感是以延迟为代价的奢侈品。", "rebuttal": "被试内研究在各界面间匹配延迟，将界面与 0/150 ms 延迟因素交叉，并报告两者的 motion-to-photon。所选任务是毫米级间隙下深度顺序至关重要的任务（≤2 mm 轴孔、向缝隙放置、线缆布设）。混合效应分析检验渲染指标能否预测成功，因此阴性结果本身也是对 IBR 社区有信息量、可发表的发现。"}, {"objection": "RH20T 评估较弱：10 Hz、软件同步，细夹爪附近的 RealSense“真值”深度噪声大。", "rebuttal": "在机器人像素上，真值是精确的网格深度，无噪声。物体像素使用带有效性掩码的留出传感器深度，外加基于 SAM2 掩码的遮挡边界 F-score。自建的 30 Hz、硬件同步且带专用留出相机的设备是主要定量基准，RH20T 则证明结果可泛化到公开数据集。"}, {"objection": "泛化与部署：融合网络按设备微调，廉价机械臂的 FK 和手眼误差很大，而且基础方法没有公开代码。", "rebuttal": "FK 误差扫描和光度优化明确量化了鲁棒性。融合网络在 RH20T 上训练，并在自建设备（不同相机和机器人）上零样本测试，以报告跨设备迁移。Ha et al. 的重实现将开源，并对照其 DyNeRF 数值验证；鉴于没有官方代码，这本身就是对社区的贡献。"}], "synergies": "(1) 延迟与预测显示：机器人是唯一一个其未来可由指令关节轨迹得知的物体。在同一 TSDF 中按指令位姿渲染机器人网格，可得到有原理支撑的预测显示，可与预测和延迟补偿方向结合。(2) 自标定：始终可见的机器人网格提供持续的 render-and-compare 信号，用于检测和纠正固定相机的外参漂移。这可与免标定或无位姿阵列的远程呈现方向结合（例如 Tele360 风格的 LM 优化）；这里只作为消融，因为基于机器人的相机标定已有先前工作。(3) 学习型深度前端：机器人网格深度是免费的度量监督，可用于双目或单目深度模型的在线自适应，可与时间一致双目方向（如 PPMStereo 类记忆双目）结合。(4) 一致性感知指标：接触区域以及“TCC 预测任务成功”的分析可推广到人类远程呈现（注视和手部接触区域），可与感知和时间指标方向结合。(5) 带宽：系列论文的后续可加入 ROI 优先的流传输（腕部相机和 EE 区域的码率预算），与基础管线的压缩和流传输方向结合。(6) 一般性的移动相机远程呈现：render-and-compare 门控可迁移到人类远程呈现设备中的 HMD 装载或手持相机。", "effort": {"months": "8-10（约 1.5 个月重实现并验证 Ha et al.，1 个月 RH20T 上的 C1 研究，2 个月搭建和标定设备，2 个月完成融合系统、运行时和 HMD，1.5 个月 IRB 和用户研究，1 个月写作）。缩减为 C1 加小规模预试，约 5 个月可得到 workshop 或 RA-L 短文版本。", "people": "2 人：一名视觉/图形方向博士生（IBR、TSDF、融合网络）加一名机器人方向学生或合作者（机械臂、手眼标定、遥操作栈、用户研究）。必须能接触机器人实验室。", "compute": "2-4 张消费级或工作站 GPU（RTX 4090/A6000 级）用于融合网络微调（以天计，而非以周计）；1 张 RTX 4090 用于实时渲染。硬件：借用的机械臂、5-7 台带触发同步的 RGB-D 或双目相机、一台腕部 D405 和一台 Quest 3；不含机械臂约 5-15k 美元。"}, "venue": "首选：CoRL 2027（截稿约 2027 年年中）或 IEEE RA-L 并在 ICRA/IROS 上报告，二者均为滚动或 2027 年年中截稿，定位为遥操作界面加人因发现。次选：若用户研究是最强部分，则投 IEEE VR 2028 / TVCG 或 ISMAR 2027。不要投 CVPR/ICCV：CV 基础方法层面的新颖性太薄，那里的审稿人会视之为工程。RSS 2027（2027 年初截稿）和 IEEE VR 2027 考虑到缺少基础代码和设备，时间太紧。", "novelty": {"verdict": "partially_scooped", "remaining_novel_angle": "每个声称的技术要素单独来看都有先前工作。用于移动相机 TSDF 融合的 render-and-compare 残差掩码可追溯到 ReFusion 和 StaticFusion，而结合机器人状态、30 Hz 的 render-vs-observed 校正是 Embodied Gaussians。基于深度的运动学机器人自过滤是标准做法（cuMotion/nvblox），Dincer et al. 2026 已经把机器人从融合几何中去除并从 URDF 重新渲染。遥操作 GS 中为移动相机使用运动学位姿见于 HIL-GS (RA-L 2025) 和 Kang et al. 2026。遥操作中的 foveation 见于 Tefera 2024 和 Dincer 2026。面向机器人远程呈现的在线 GS 已存在：Du et al. (RA-L 2026)、GaussianNexus (UIST 2025)、Tele-GS (IROS 2025) 和 Page et al. (IROS 2025)。\n\n我没能找到的是这样一个系统：从固定相机加运动学定位的移动相机组成的混合阵列，为变化中的操作工作空间提供逐帧、feed-forward、照片级且时间一致的自由视点视频。我找到的所有实时遥操作系统，要么是点云（Dincer 2026、GHOST 2026），要么是会滞后或忽略移动物体的在线优化或静态 GS（2 Hz 的 HIL-GS、Boehringer 2025、Du 2026）。\n\n因此，可辩护的主张是系统层面和实证层面的，而非新的基础方法：\n(a) 首个融合固定与移动相机的几何引导在线 IBR（Ha et al. 风格）。其 image-space TSDF 以运动学机器人网格作为高置信度输入，从而消除（而不仅是屏蔽）夹爪-物体接触处的细结构和飞点误差。应以末端执行器附近的深度误差和飞点率进行评估。\n(b) 一项对照用户研究，表明与 2604.03730 的点云 + 腕部面板基线相比，时间和几何一致性（TCC/STED、接触区域深度误差）而不仅是 PSNR，能够预测操作表现（成功率、碰撞、时间）。\nrender-and-compare 掩码应表述为把基于残差的动态检测适配到多相机 IBR 设定，而非新的洞见。\n\n注意：整个会话中 arXiv 和 Semantic Scholar API 都被限流，因此检索主要依赖 Hugging Face 论文搜索和 Google Scholar。仍可能遗漏同期的 2026 年 arXiv 论文。", "threats": [{"title": "Physically Embodied Gaussian Splatting: A Realtime Correctable World Model for Robotics (Embodied Gaussians)", "url": "https://arxiv.org/abs/2406.10788", "year": "2024", "venue": "CoRL 2024 / arXiv", "overlap": "high", "what_overlaps": "render-and-compare 这一核心洞见。它从 3 台已标定相机渲染预测状态，与观测图像比较，并用残差（“visual forces”）以 30 Hz 校正粒子与 Gaussian 世界模型，内置机器人状态和物理约束。机器人状态感知的预测加 render-vs-observe 残差，已在实时机器人场景中出现于此。", "what_remains_different": "其目标是状态估计和仿真，而非为人类操作者提供照片级自由视点视频。它需要逐物体的粒子和 Gaussian 初始化，无法处理新出现或未建模的内容，没有 feed-forward IBR，没有移动（腕部）相机，也没有时间一致性指标或遥操作用户研究。"}, {"title": "ReFusion: 3D Reconstruction in Dynamic Environments for RGB-D Cameras Exploiting Residuals", "url": "https://arxiv.org/abs/1905.02082", "year": "2019", "venue": "IROS 2019", "overlap": "high", "what_overlaps": "在移动 RGB-D 相机的 TSDF 融合中，通过配准后渲染模型与观测深度和颜色之间的残差，并结合自由空间建模来检测动态内容。这是经典形式的“对自身运动不变的 render-and-compare 掩码”思想。StaticFusion 和 Co-Fusion 属于同一脉络。", "what_remains_different": "它是单相机 SLAM 地图，去除而非渲染动态内容。没有多相机 IBR，没有学习型融合，也不使用已知运动学位姿或机器人网格。"}, {"title": "Human-in-the-loop Gaussian Splatting for Robotic Teleoperation (HIL-GS)", "url": "https://ieeexplore.ieee.org/abstract/document/11248882/", "year": "2025", "venue": "IEEE RA-L 2025", "overlap": "medium", "what_overlaps": "遥操作显示由机器人上装载的移动 RGB-D 相机构建，其运动来自本体感知（“motion-aware reconstruction combining RGB-D and proprioceptive sensors”）。GS 在遥操作回路内更新（Scholar 摘要片段：2 Hz 下 10k 个 Gaussian 更新），并在 VR 中显示，附有用户评估。", "what_remains_different": "约 2 Hz 的在线优化 GS 建图，面向以静态为主的场景。没有固定阵列与移动相机的融合，没有对变化工作空间的逐帧 feed-forward 渲染，没有时间一致性机制，也没有接触处的机器人网格几何先验。（仅通过 Google Scholar 阅读了摘要，未打开全文。）"}, {"title": "Toward Real-time High-fidelity Immersive Robotic Telepresence via Online 3D Gaussian Splatting", "url": "https://ieeexplore.ieee.org/abstract/document/11551306/", "year": "2026", "venue": "IEEE RA-L 2026", "overlap": "medium", "what_overlaps": "基于在线 3DGS 的 VR 机器人远程呈现，针对保真度、延迟和收敛速度协同设计。它占据了该想法声称缺失的“照片级、准实时 3D 机器人远程呈现”定位。", "what_remains_different": "随场景增长的逐场景在线优化，定位于远程呈现和探索。没有证据表明其处理动态被操作物体、逐帧 feed-forward IBR、运动学机器人几何融合或时间一致性评估（仅摘要）。"}, {"title": "A Multi-View 3D Telepresence System for XR Robot Teleoperation", "url": "https://arxiv.org/abs/2604.03730", "year": "2026", "venue": "arXiv 2604.03730", "overlap": "medium", "what_overlaps": "完全相同的应用设定：用于操作遥操作的固定多视角 RGB-D 加腕部相机，从传感器几何中去除机器人并从 URDF 重新渲染，foveated RGB 细节，以及与 RGB、双目和点云基线对比的 31 人操作用户研究。", "what_remains_different": "仅点云（作者自称“visually fuzzy at edges”）。腕部相机作为 2D 面板而非几何融合，没有照片级 IBR，没有时间滤波或一致性，机器人去除使用 YOLO 分割而非向融合中做运动学投影。"}]}}, {"id": "C17", "name": "Authentic diminished reality / privacy removal / editing in live 3D video filled from TSDF-anchored observed history", "decision": "pursue_with_repositioning", "scores": {"novelty": 4, "significance": 5, "feasibility": 7, "telepresence_fit": 7, "overall": 4.5}, "sharpened": {"title_zh": "防泄漏的实时自由视点 3D 视频减弱现实：在融合前移除人物，并用观测历史填充", "title_en": "Leak-Proof Diminished Reality for Live Free-Viewpoint 3D Video: Removing People Before Fusion and Filling from Observed History", "one_liner": "在固定相机阵列的实时 image-based 3D 视频中，被移除的人物可能通过多种途径在新视角重新出现：其他相机的像素、深度轮廓、上一帧深度反馈、学习到的背景图像，以及填充区域的形状。我们在融合前以 fail-closed 规则在 3D 中移除人物，用阵列实际看到内容的 TSDF 锚定记忆填充该区域，并沿新视角轨迹以一套攻击者测试对结果进行认证。", "core_claim": "设定：来自固定同步阵列的实时几何引导 image-based rendering (IBR)。主张 (a)：逐视图 2D 移除在留出视角和新视角仍会泄露被移除的人物。这包括留下空洞（InViStream 风格）和对渲染视图做 2D 视频修复（ProPainter 类）。恢复轮廓的攻击者可得到至少 0.4 的掩码 IoU，姿态估计器可恢复至少 50% 的关键点。主张 (b)：融合前的 3D 共识 fail-closed 移除，加上上一帧反馈重置，再加上基于观测历史的填充，可将这些攻击者得分降到与同一攻击者在空场景渲染上的误报率相差 0.05 以内。主张 (c)：在被移除区域内，基于观测历史的填充相对于最好的实时 2D 修复，以空场景真值衡量 PSNR 至少高 2 dB、LPIPS 至少好 0.05，且 TCC/STED 更优。主张 (d)：以上全部在基础管线上最多增加 10 ms/帧。若留空洞或 2D 修复已达到对照水平的攻击者得分，或在背景被观测过的区域记忆填充并不明显优于实时修复，则该主张被证伪。", "key_insight": "以检索代替幻觉生成并不是洞见，那属于基于观测的减弱现实 (DR)：Kunert et al. CW 2019、Kato et al. ISMAR-Adj 2022，以及 2024 年的综述。新的观点是：多视角几何引导 IBR 是一个会泄漏的汇聚点，移除必须在融合层强制执行，而不是在任何单张图像中。在基础论文的管线中，被移除的实例可以通过五条途径返回。(1) 跨视图像素：K 个视图中任何一个掩码漏掉该人物的视图，仍会提供它 splat 出的 Gaussians。(2) 深度：TSDF 输入塑造融合表面，从而塑造轮廓。(3) 时间反馈：上一帧新视角深度被融合回来，把被移除的几何带到后续帧。(4) 学习到的背景：I_BG 是根据上下文预测的。(5) 负空间：空洞或幻觉填充的轮廓会向攻击者暴露人物的轮廓和姿态。途径 5 把隐私与填充保真度绑定在一起。只有与真实背景一致的填充才能关闭这条途径，而固定阵列可以提供这样的填充，因为每个表面点通常此刻被另一台相机看到过，或者之前被某台相机看到过。因此在此设定下，真实填充是一种隐私机制，而不只是外观修饰。", "method": "基础：重实现基础论文的管线（逐视图不透明像素 Gaussians、带上一帧深度反馈的 image-based TSDF、4 层 U-Net 融合）。没有公开代码。时间紧张时，使用更简单的深度加权融合。\n\n(1) Fail-closed 3D 共识实例掩码。\n- 每台相机：在发送端，一个轻量实例分割器加时间传播（YOLO-seg 或 EfficientSAM 类加掩码跟踪器）在各相机上并行运行。\n- 被掩码的像素借助深度提升到粗体素网格（约 2 cm）中并在那里投票。\n- 只要任一相机以高于 c_low 的置信度为某体素投票，该体素即为隐私体素（fail-closed）。凸包在 3D 中以 delta = 3 cm 膨胀，而不是在 2D 中。\n- 凸包被重投影到全部 K 个视图，得到并集掩码。即使某一视图的 2D 掩码漏检，这也能修复途径 1 和 2。\n\n(2) 在每个 IBR 输入处移除。\n- 丢弃并集掩码内的 Gaussians。\n- 在掩码内设 TSDF 权重 omega_k = 0，使空洞无法刻出人形的深度空缺，并用记忆深度替代。\n- 在重投影凸包区域重置 omega_tmp，使上一帧深度反馈无法把被移除的几何带到后续帧（途径 3）。\n- 在被移除区域用记忆渲染覆盖融合网络的背景图像 I_BG 和权重 w_BG（途径 4）。\n- 以额外的“被移除区域”通道和边界接缝损失微调 U-Net。\n\n(3) 观测历史背景记忆。\n- 每台相机一张背景板：RGB、深度、置信度和最近一次被看到的时间。\n- 仅当以下条件全部满足时像素才更新：基础论文的静态掩码判定为静态，像素在所有隐私或动态实例之外，至少 N 帧内深度一致，并且“远于或等于”当前背景板深度（一种背景建模规则）。\n- 对颜色做慢速 EMA 以吸收光照漂移。\n- 生成填充时，通过相同的前向 splat 和 TSDF 路径把背景板渲染到目标视图：先用其他相机的当前像素（空间历史），再用更早的背景板（时间历史）。\n- 光度协调：在区域周围的静态环带上逐帧拟合仿射颜色模型，并应用到记忆渲染上。\n- 从未被观测的像素（置信度 0）回退到 U-Net 背景图像或 one-step 修复器，并被标记和计数。\n- 记忆本身的隐私：隐私实例从不写入背景板，并以生存时间 (TTL) 加清除 API 限制保留期。\n\n(4) 基于攻击者的泄漏审计（评估贡献）。\n- 沿留出相机和插值新视角轨迹，运行五项检查：\n  - (a) 人物或物体检测器召回率（与 PODR 可比）；\n  - (b) 轮廓恢复攻击者，即微调用于定位填充区域的修复取证或分割网络，以与真实轮廓的 IoU 计分；\n  - (c) 2D 姿态关键点恢复；\n  - (d) 与被移除身份的行人重识别 (re-ID) 相似度；\n  - (e) 几何残差：渲染深度落在被移除实例最后已知表面 tau 范围内。\n- 每个得分都相对于同一攻击者在空场景对照渲染上的结果报告。\n\n关键路径上不使用生成模型。预算：发送端每台相机并行分割 5-8 ms，体素投票和重投影约 2 ms，记忆渲染约 3-5 ms（复用 splat 路径）。目标开销至多 10 ms，使管线在单张 RTX 4090 上保持 40-60 ms/帧。", "why_not_engineering": "论文提出了超越系统本身的三个主张。(i) 它识别并测量了多视角几何引导 IBR 特有的泄漏途径。审稿人可以证伪这一点：我们展示显而易见的基线（留空洞的逐视图掩码、对渲染视图的 2D 修复）在新视角会泄漏，并逐条消融各途径。(ii) 它表明填充保真度与隐私通过被移除区域的形状耦合：攻击者的轮廓 IoU 随填充 PSNR 下降，留空洞是最坏情况。因此基于观测的填充是由隐私目标而非外观所驱动的。(iii) 它贡献了一套基于攻击者的认证协议，以及一个用于实时多视角移除的空场景真值基准，这是领域所缺少的。InViStream 仅在源视图上测量检测器 PODR；Remove360 是静态且离线的；基于观测的 DR 文献只评估采集相机自身的视图。各机制本身（体素投票、背景板、掩码）刻意保持简单；贡献在于问题表述、泄漏证据和认证。", "differentiation": "- 基于观测的 DR（Kunert CW 2019；Kato ISMAR-Adj 2022；InpaintFusion TVCG 2020；Eskandari 2024 综述；DimSplat VRW 2025）：单个移动相机，仅输出到相机自身视图，主要是静态物体，没有隐私标准。我们引用它们作为“基于观测填充”的出处，不声称这一点。我们的增量：固定多相机阵列渲染任意远程新视角、动态人物、在多视角融合前强制移除，以及泄漏认证。\n- InViStream (arXiv 2608.11645)：多视角 RGB-D 源端隐私保护。它留下空洞，没有新视角渲染或背景记忆，并在顺序静态采集上使用检测器 PODR。我们定量表明其空洞在新视角会向攻击者泄露轮廓和姿态，而真实填充可关闭这条途径。\n- Tabet et al. 移动端 DR 隐私（iMETA 2023、TPS-ISA 2024）：在单个移动相机上用 2D 修复加光流。其隐私指标是检测器式的。我们增加了多视角新视角下的几何、轮廓和姿态攻击者。\n- The Efficient 3D Reconstruction... Live-Telepresence 论文 (ICCVW 2023, arXiv 2211.14310)：持久的静态体素记忆，但没有移除目标，也没有泄漏评估。我们把它当作记忆机制属于标准做法的证据。\n- NSTM (arXiv 2607.15271)：面向遮挡的长时记忆，没有移除或隐私目标。它可以作为消融中的替代记忆后端。\n- 离线 4D 编辑（Dynamic-eDiTor、EditCast3D、4D-MoDe、PREX）：编辑传播从论文中删去，只保留一张演示图。"}, "experiments": {"datasets": ["DyNeRF / Neural 3D Video（公开；18-21 台静态 GoPro 相机）：作为合成插入基准的背景场景。用深度 z-test 将 3D 人体序列（4K4D、THuman 或 DNA-Rendering 风格网格）合成进去，从而为填充和泄漏提供精确真值。注意：厨师几乎不动，因此真实移除厨师时没有可观测的背景，仅用于覆盖率和回退分析。", "ENeRF-Outdoor（18 台同步相机；需签协议获取，已在 ENeRF 仓库页面核实）：多人在固定室外阵列中行走。用于以攻击者指标（无需背景真值）移除真实人物，以及仅在真值存在的像素上评估填充——即该人物位于别处的帧（与构建记忆的帧做不相交的时间划分）。", "D3DMV（基础论文的第三个数据集）：对完整管线的跨数据集检查。", "CMU Panoptic Studio（公开；HD 相机加 Kinect RGB-D；多人社交序列）：在多人场景中以攻击者指标移除旁观者。依赖之前需核实 Kinect 深度已同步。", "Remove360 (arXiv 2508.11431)：不用作训练数据。采用并引用其“物理移除后采集”的协议。", "自采（必需）：6-8 台同步 RGB-D 相机（Orbbec Femto Bolt / ZED 类双目），分布在 3-4 个房间（办公室、客厅、有窗户以产生光照漂移的会议室）。每个房间包含空场景背景板、1-3 人进入/坐下/离开的序列，以及放置后被物理移除的物体。共 10-15 段序列，每段 2-5 分钟，每个房间 2 台留出相机用于真值。这是基准贡献。在知情同意书下发布。"], "baselines": ["无移除的基础管线（泄漏的上界）。", "InViStream 风格：融合前逐视图掩码并留下空洞，由融合网络和 I_BG 自然填充。", "逐视图 2D 掩码 + 对渲染新视角做实时 2D 视频修复（ProPainter 类；E2FGVI 为更快选项）。", "逐视图掩码 + 对渲染视图使用 one-step diffusion 修复器（Difix3D+ 或 NVIDIA Fixer）：生成式填充，不具备实时可比性，作为质量参考。", "对源视图掩码 + 在融合前对每个源视图做 2D 视频修复（MiniMax-Remover 类，离线），用于检验跨视图一致性。", "朴素改造的基于观测的 DR：每台相机使用单相机 Kato/Kunert 风格记忆，无 3D 共识、无反馈重置。", "离线上界：仅用非隐私像素训练的逐场景 4DGS（或 Dynamic-eDiTor 风格移除），仅比较质量。"], "metrics": ["被移除区域内相对于空场景或合成真值的填充保真度：PSNR、SSIM 和 LPIPS；也报告全帧 PSNR。", "泄漏，均相对于同一攻击者在空场景对照渲染上的结果，沿留出相机和插值新视角轨迹：检测器召回率（与 PODR 可比）；轮廓恢复攻击者 IoU；2D 姿态关键点恢复率 (PCK)；re-ID 余弦相似度及在图库中的 rank-1；几何残差（渲染深度像素落在被移除实例表面 tau 范围内的比例）。", "轨迹上的最坏情况泄漏（每序列最大值），而不仅是均值。报告无泄漏帧率。", "时间：被移除区域内的 TCC、STED 和闪烁；视图一致性（SDV / MEt3R）。", "覆盖率：被移除像素中由观测填充与由回退填充的比例，作为人物进入后时间的函数。", "延迟分解（分割、投票、记忆渲染、融合），注明 GPU。内存占用。", "鲁棒性曲线：泄漏随注入分割噪声的变化（漏检视图、2D 掩码腐蚀 1-10 px、丢帧）。", "用户研究（n 约 20）：自然度 MOS，外加“这里是否有人被移除/在哪里”的迫选测试（人类感知的隐私）。"], "key_ablations": ["逐条关闭泄漏途径：去掉 3D 共识并集掩码（仅逐视图掩码）、去掉深度掩码（保留 omega_k）、去掉上一帧反馈重置、去掉 I_BG 覆盖、去掉记忆填充（留空洞）。每项以攻击者 IoU、PCK 和 re-ID 衡量。", "填充来源：仅空间（当前其他相机）、仅时间（历史）、两者兼用、仅生成式回退。", "Fail-closed 与多数投票共识，以及 3D 膨胀 delta：泄漏与过度移除（误删远程呈现用户）之间的权衡。", "光照漂移下（窗户序列）协调开启或关闭。", "记忆更新规则：远于或等于 vs 普通 EMA vs 仅基础论文的差分掩码（记忆是否会被缓慢移动的人污染？）。", "攻击者强度：现成检测器 vs 在我们的填充上微调的攻击者（自适应对手）。"], "needs_custom_capture": true, "capture_notes": "公开的多视角动态数据集缺少被移除人物背后的空场景真值。演播室人体数据集（DNA-Rendering、ENeRF-Outdoor）没有记录背景板；已在其页面核查，未见提及。因此公开数据支持 (a) 向 DyNeRF 合成插入 3D 人体并获得精确真值，以及 (b) 在 ENeRF-Outdoor 和 Panoptic 上仅做攻击者泄漏评估。真实世界填充保真度基准需要一个小型自建阵列（6-8 台 RGB-D 或双目相机，约 3-6k 美元，硬件同步，一个周末标定），具备物理移除真值（Remove360 协议）以及真实的阴影和光照。为设备预留 3-4 周，采集和标注 2 周。需获取参与者知情同意和 IRB 豁免，因为基准本身包含可识别身份的人。仅在获得同意的情况下发布，并对非基准素材中的人脸做模糊处理。"}, "first_two_week_test": "在 DyNeRF 上用最小重实现做合成插入测试。基础论文的代码未发布，因此构建一个精简版：用 gsplat 做逐视图前向 splat，深度加权融合，带上一帧反馈的 image-based TSDF，不用 U-Net，深度用 RAFT-Stereo。\n\n第 1-4 天：\n- 在 2 个 DyNeRF 场景中，用对双目深度的 z-test 合成一个行走的 3D 人体（带深度的渲染网格序列），共 100 帧。\n- 原始帧即是填充和泄漏的精确真值。\n- 由已知合成结果生成掩码，并加入真实噪声：10% 的帧中 K 个视图漏检 1 个，以及 3 px 腐蚀。\n\n第 5-10 天：比较四种变体。\n- (A) 逐视图掩码留空洞。\n- (B) (A) + 对渲染的留出视图做 ProPainter。\n- (C) 3D 共识 fail-closed 并集掩码 + 反馈重置，仍留空洞。\n- (D) (C) + 记忆填充（采用远于或等于规则的逐相机背景板，通过相同 splat 路径渲染）。\n\n第 11-14 天：在 9 台留出相机加 2 条插值轨迹上测量：\n- 被移除区域的 PSNR 和 LPIPS；\n- 轮廓攻击者 IoU，使用 SAM2 或人物分割器加一个简单的修复取证定位器（如现成的 IML 模型）；\n- 2D 姿态估计器的 PCK；\n- 所有得分均与空场景对照渲染比较。\n\n验证标准：\n- (A) 和 (B) 均泄漏（IoU 至少 0.4 或 PCK 至少 50%）；\n- (C) 消除跨视图和反馈泄漏（检测器召回率下降可见）；\n- (D) 使攻击者得分与对照相差 0.05 以内，并在区域内比 (B) 至少高 2 dB。\n\n跑通一次这个设置，也就产出了论文的核心泄漏图。", "kill_criteria": "在 2 周测试和首次自采后，若出现以下任一情况，则终止或转向。\n(1) 简单基线在新视角已达到对照水平的攻击者得分：对渲染视图做 2D 修复即可使轮廓 IoU 和 PCK 与对照相差 0.05 以内。那就不存在需要解决的泄漏问题，论文退化为基于观测的 DR 已覆盖的质量比较。\n(2) 在背景被观测过的被移除区域，记忆填充相对实时 2D 视频修复在 PSNR 上未能至少高 1 dB 或 LPIPS 至少好 0.03。\n(3) 在真实房间序列上，10 s 后被移除区域的观测覆盖率低于约 60%，大多数像素回退到幻觉生成，真实性论证崩溃。\n(4) 分割误差占主导：使用真实的实时掩码时，即使采用 fail-closed 3D 共识，泄漏仍高于对照的 2 倍；或 fail-closed 的过度移除在超过 5% 的时间里抹掉远程呈现用户。\n(5) 出现一篇新的 2026 年论文，实现了带新视角泄漏评估的实时多视角自由视点移除。每月重新检查 arXiv，并为 InViStream 后续工作和 NSTM 设置提醒。", "reviewer_objections": [{"objection": "这只是把基于观测的减弱现实（Kunert 2019、Kato 2022、InpaintFusion、DimSplat）搬到多相机阵列上。记忆、体素投票和掩码都是标准做法，所以这是一篇系统论文。", "rebuttal": "我们同意填充机制是已知的，并如实引用。贡献在于问题和证据。多视角 IBR 有单相机自身视图 DR 中不存在的泄漏途径：跨视图像素、TSDF 中的深度轮廓、上一帧深度反馈、学习到的背景，以及被移除区域的轮廓。我们通过逐条途径消融表明自然基线在新视角会泄漏。我们还表明填充保真度通过该轮廓与隐私存在因果联系，并发布基于攻击者的认证协议和空场景真值基准。这些对实时自由视点视频而言都尚不存在。"}, {"objection": "保证的好坏取决于分割器。漏掉一帧人物就回来了，所以“防泄漏”言过其实。", "rebuttal": "该主张是有条件且经测量的，而非绝对的。Fail-closed 3D 共识意味着一个人必须同时被全部 K 台相机漏检才会泄漏。我们报告泄漏随注入掩码噪声（漏检视图、腐蚀、丢帧）的变化以及每条轨迹的最坏情况，而不仅是均值。我们也报告过度移除的代价。标题和主张将表述为“针对攻击者测试集认证”，而非“保证”。"}, {"objection": "观测历史只在物体移动时有用。静态隐私物体或坐着的人背后的背景从未被观测到，所以又回到了幻觉生成。", "rebuttal": "覆盖有两个来源。阵列中的其他相机此刻能绕过遮挡物看到（空间覆盖），过去的帧能看到移动人物的身后（时间覆盖）。我们报告覆盖率随时间的变化，并如实标记回退像素。部署时，空房间登记扫描（如 Starline 等隔间式系统）可为静态隐私物体提供背景板。DyNeRF 厨师案例被明确作为失败模式纳入。"}, {"objection": "真值较弱。合成插入缺少真实的阴影、反射和光照交互，而公开真实数据集没有人物背后的真值。", "rebuttal": "这正是我们构建具备物理移除和空场景真值（Remove360 协议）的自有基准的原因，其中包括有光照漂移的带窗房间。阴影和反射残留被作为独立的泄漏途径测量，并以 EffectErase 风格的效果移除基线作为讨论点。合成插入仅用于具有精确真值的受控消融。"}, {"objection": "InViStream 已经为多视角 RGB-D 实现了实时源端隐私保护。留空洞已足够安全，而填充会带来过期记忆显示过往隐私状态的风险。", "rebuttal": "我们定量表明空洞在新视角并不安全：空洞轮廓会向攻击者泄露轮廓和姿态，而我们的填充关闭了这条途径。过期记忆风险在设计上已处理：隐私实例从不写入背景板，且有 TTL 和清除 API。我们还评估了记忆投毒情形：一个物体出现一次后被移除，它不得再次出现。"}], "synergies": "- 面向去遮挡的长时记忆：同样的 TSDF 锚定背景板可填充远程呈现用户周围的普通去遮挡区域，修复基础论文逐帧的 I_BG。这项工作可作为两篇论文共享的记忆模块，或合并为一篇“面向实时 IBR 的观测历史记忆”论文，移除只是其中一个用例。\n- 带宽与流传输：发送端移除，背景板只发送一次，仅流式传输前景和实例增量，可同时实现隐私内建和压缩（对比 4D-MoDe、MetaStream）。\n- 语义静态/动态分离：实例掩码和 3D 投票可替代基础论文脆弱的颜色差静态掩码，在光照变化和火焰下改善时间深度滤波。\n- One-step 或因果生成式去遮挡（Difix3D+/Fixer、InstantViR、Bonn 的实时修复 transformer）：从未被观测像素的自然回退方案，攻击者测试集则提供评估幻觉的视角。\n- 时间一致性与评估基准：空场景真值采集协议和轨迹最坏情况指标可推广到任何实时 3D 视频质量研究。\n- 跨相机的重光照与颜色协调：协调步骤是共享的。\n- 远程呈现中的信任与真实性（VoluMe 风格的“真实性”论证）：被标记的回退像素图是一种来源信号，可发展为一篇关于可验证、带来源标记的 3D 视频的论文。", "effort": {"months": "6-8（2 周可行性测试；2 个月管线重实现加移除和记忆；1.5 个月搭建设备和采集；2 个月评估、攻击者测试集和用户研究；1 个月写作）", "people": "1 名全职博士生加 1 名兼职人员（采集、用户研究、IRB）", "compute": "1-2 张 RTX 4090/A6000 级 GPU。训练仅限于以被移除区域通道微调融合 U-Net（约 1-2 GPU·天）以及微调攻击者模型。6-8 台同步 RGB-D 或双目相机约需 3-6k 美元硬件。"}, "venue": "首选 ISMAR 2027（TVCG 期刊轨道）：减弱现实和隐私社区看重泄漏与认证的定位以及基准。备选 IEEE VR 2028 (TVCG)。除非攻击者和基准贡献格外强，否则 CVPR/ICCV 较为勉强。CVPR 2027 的 workshop 论文（如隐私或 XR 方向）是发布合成插入结果的合理早期节点。", "novelty": {"verdict": "partially_scooped", "remaining_novel_angle": "所陈述的关键洞见并不新颖。通过重新渲染对先前观测内容的在线体素或 TSDF 重建来填充被移除区域，仅对从未被观测的像素使用修复，是经典的基于观测的减弱现实：Kunert et al. CW 2019（体素网格加修复回退）、Kato et al. ISMAR-Adj 2022（结合在线 RGB-D SLAM 表面的自适应观测/修复）、InpaintFusion TVCG 2020、2024 年该子领域的系统综述，以及使用 Gaussian splats 的 DimSplat VRW 2025。以隐私为动机、在视角旋转下依然有效且带隐私指标的 3D DR 也已存在（Tabet et al. 2023/2024）。面向多视角 RGB-D 体积流的源端隐私保护同样存在（InViStream 2026）。\n\n仍可辩护的是设定的转变及其在技术上带来的要求。(1) DR 的输出不是采集相机自身的视图，而是从固定同步多相机阵列实时合成的任意远程新视角。因此移除必须在 image-based 融合和混合之前于几何中完成，覆盖逐视图 Gaussians、TSDF 深度输入和融合网络的背景预测，使被移除实例无法通过其他相机的像素、深度轮廓或学习到的背景图像重新出现。(2) 一个与视角无关的几何泄漏标准和审计（任何渲染出的新视角都不得包含被移除实例的表面），沿新视角轨迹针对动态人物进行评估。InViStream 只在源视图上测量基于检测器的 PODR，Remove360 是静态且离线的。(3) 面向人会移动、物体会出现的固定阵列的观测历史背景记忆，带时间戳并由置信度门控更新，由基础论文的静态掩码驱动，并以空场景真值评估填充保真度。这是实时多视角 DR 所缺少的采集协议和基准。\n\n实时的表面锚定编辑传播是较弱的增量附加内容。离线 4D 编辑已很拥挤，而在 TSDF 表面上做颜色和贴纸编辑属于工程。论文必须引用并定位于基于观测的 DR 文献之后，不得把“以检索代替幻觉”作为洞见。贡献是面向实时 3D 远程呈现的多视角、自由视点、动态、经泄漏认证的 DR。", "threats": [{"title": "An Efficient Diminished Reality Approach Using Real-Time Surface Reconstruction", "url": "https://doi.org/10.1109/CW.2019.00010", "venue": "International Conference on Cyberworlds (CW) 2019", "year": "2019", "overlap": "high", "what_overlaps": "这正是核心机制。存储在体素网格（TSDF 风格）中的即时稠密 3D 重建被用于把背景渲染到被移除 3D 物体的区域，修复只用于剩余的未观测空洞。论文将其表述为在非平面场景中优于修复。因此“从体素锚定记忆检索并重投影，配合生成式回退”并不是新洞见。", "what_remains_different": "它使用单个移动 AR 相机，只渲染采集相机自身的视图，只移除静态物体。没有远程自由视点，没有固定多相机阵列，没有动态或人物移除，没有隐私泄漏标准，也没有编辑传播。"}, {"title": "Online Adaptive Integration of Observation and Inpainting for Diminished Reality with Online Surface Reconstruction", "url": "https://doi.org/10.1109/ISMAR-Adjunct57072.2022.00069", "venue": "IEEE ISMAR-Adjunct 2022", "year": "2022", "overlap": "high", "what_overlaps": "论文明确提出基于观测 vs 基于修复的二分法。它先用修复填充感兴趣区域，然后随着观测积累，逐步用来自 RGB-D SLAM 表面重建的观测颜色和形状替换。这就是“先用观测历史，仅对从未看到的像素使用幻觉生成”的思想，并带有在线自适应切换。", "what_remains_different": "它使用单个移动相机及其自身视图的 AR 输出。没有多视角阵列，没有新视角 3D 视频，没有隐私目标，也没有动态场景或人物。"}, {"title": "InpaintFusion: Incremental RGB-D Inpainting for 3D Scenes", "url": "https://doi.org/10.1109/TVCG.2020.3003768", "venue": "IEEE TVCG 2020", "year": "2020", "overlap": "medium", "what_overlaps": "这是一种实时 DR：修复后的颜色和深度通过 RGB-D SLAM 融合进全局 surfel 地图，再投影回来进行渲染。因此填充锚定在 3D 中，并在视角变化时保持一致，即“通过 3D 锚定填充在构造上实现视角一致”的论证。", "what_remains_different": "填充是修复（幻觉生成）而来，而非从观测历史中检索。它使用单个手持相机，没有隐私目标，没有多视角自由视点视频，也没有动态内容。"}, {"title": "Observation-based diminished reality: a systematic literature review", "url": "https://doi.org/10.1007/s10055-024-01074-0", "venue": "Virtual Reality (Springer) 2024", "year": "2024", "overlap": "medium", "what_overlaps": "对 2000 至 2024 年间 67 篇关键论文的综述，涵盖以真实背景观测（多视角、预录制或累积）进行填充的 DR。它表明“用观测数据进行真实填充而非幻觉生成”是一个成熟的 DR 子领域，任何围绕这一点的新颖性主张都会被 ISMAR/IEEE VR 审稿人拒绝。", "what_remains_different": "这是一篇综述。就其范围而言，所综述的工作针对的是采集用户自身视图的 AR 透视，而非渲染到远程自由视点的实时多视角 3D 视频。"}, {"title": "Mobile Diminished Reality for Preserving 3D Visual Privacy / Utility-Privacy Aware Mobile DR Framework for 3D Visual Privacy / AI-Enhanced Mobile DR for Preserving 3D Visual Privacy (Tabet, Kayssi, Elhajj)", "url": "https://doi.org/10.1109/iMETA59369.2023.10294436", "venue": "iMETA 2023; IEEE TPS-ISA 2024 (https://doi.org/10.1109/TPS-ISA62245.2024.00015); iMETA 2024", "year": "2023-2024", "overlap": "medium", "what_overlaps": "一个实时 DR 框架，旨在在实时 MR 画面中隐藏隐私 3D 物体，并在围绕敏感物体做 3D 旋转时保持有效。它报告了 PSNR 以及超过 90% 的隐私指标，TPS-ISA 版本还加入了自由相机运动下的隐私-效用权衡指标。因此“在视角变化下仍有效的隐私移除”加隐私指标已在移动 MR 中发表。", "what_remains_different": "填充使用单个移动相机上的 2D 修复加光流跟踪。没有基于观测历史的填充，没有多相机阵列，没有为远程观看者渲染新视角，也没有几何或深度泄漏标准。"}]}}]}</script>
<script>
(function () {

  function safeUrl(u) { if (typeof u !== "string") return null; var s = u.trim(); return /^https:\/\/[^\s"'<>]+$/i.test(s) ? s : null; }

    if (attrs) for (var k in attrs) {

      var v = attrs[k];

      if (k === "class") n.className = v;

      else if (k === "href") { var u = safeUrl(v); if (u) { n.setAttribute("href", u); n.setAttribute("target", "_blank"); n.setAttribute("rel", "noopener noreferrer"); } }
      else if (k.slice(0, 2) === "on" && typeof v === "function") n.addEventListener(k.slice(2), v);

      else if (k.slice(0, 2) === "on" && typeof v === "function") n.addEventListener(k.slice(2), v);

  }
  function arr(x) { return Array.isArray(x) ? x : []; }

  function align(id) {

      if (typeof p._activate === "function") p._activate();

  // Internal link: a real <a href> (works across pages, middle-click opens a tab); same-page clicks also open details and flash.
  function internalLink(targetId, cls, text, title) {
    var a = el("a", { class: cls, text: text, title: title || null });

  function refChip(targetId, label, ghost) { return internalLink(targetId, "cchip" + (ghost ? " ghost" : ""), label); }

      var id = m[1], prev = m.index > 0 ? s.charAt(m.index - 1) : "", next = s.charAt(m.index + id.length);
      var target = conceptName[id] ? "concept-" + id : (advName[id] ? "adv-" + id : null);
      if (!target || /[A-Za-z0-9_\-]/.test(prev) || /[A-Za-z0-9_]/.test(next)) continue;
      if (m.index > last) out.push(document.createTextNode(s.slice(last, m.index)));

  function paras(text) { return str(text).split(/\n\s*\n/).map(function (t) { return t.trim(); }).filter(Boolean).map(function (t) { return el("p", null, rich(t)); }); }

  function link(title, url) { return safeUrl(url) ? el("a", { href: url, text: title }) : el("span", { text: title }); }
  function ul(items, map) { return el("ul", { class: "plain" }, arr(items).map(function (x) { return el("li", null, [map ? map(x) : str(x)]); })); }

  function fmtCit(n) { n = Number(n); if (!(n >= 0)) return "—"; if (n >= 1000) return (n / 1000).toFixed(n >= 10000 ? 0 : 1) + "k"; return String(n); }

  var mathReady = false, mathQueue = [];

  // ---------- shared components ----------
  function makeTabs(views, storageKey) {
    var tabs = el("div", { class: "tabs", role: "tablist" });
    var holder = el("div");
    var panels = {};
    function show(id) {
      Array.prototype.forEach.call(tabs.children, function (b) { b.setAttribute("aria-selected", b.getAttribute("data-id") === id ? "true" : "false"); });
