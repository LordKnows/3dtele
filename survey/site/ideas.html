 S\\{c} 中最近的 K 个。损失：I_c 上的 L1 + 0.2 LPIPS，带有效性掩码。循环正则项：在 S 凸包外、部署头部活动区域内采样的虚拟位姿 v 处渲染 I_v，然后用 {I_v, D_v} 加缩减后的源集合重渲染相机 c，再与真实 I_c 计算 L1/LPIPS。这把阵列上的误差反传回阵列外的渲染。另外在 v 处加一个小的 EMA-teacher LPIPS 锚点以限制漂移。\n\n安全措施，作为借用的工程手段呈现（如 FSM/ETTT 中的 EWC/EMA；回放）：对预训练权重的 L2/EWC 先验；一个从不参与训练的哨兵相机，若其 PSNR 下降超过 0.3 dB 则触发回滚；以及场景/人物变化检测，触发学习率 warmup 重置。\n\n运行时：渲染路径在 TensorRT fp16 下约 40-60 ms/帧。自适应在低优先级 CUDA stream（单 GPU 设置）或第二块 GPU 上以 2-5 步/秒运行。LoRA 每 10 s 合并并热替换。报告有无自适应时的 p50/p99 渲染延迟。\n\n预训练：ScanNet + DyNeRF（基础方案），外加使用 DNA-Rendering/MVHumanNet++ 的扩展变体，用于“规模是否消除 TTA”的测试。可选的 MAML 风格初始化仅作为消融。", "why_not_engineering": "本文围绕可被受控相机划分证伪的研究问题组织，而非围绕一个系统。Q1：来自阵列上插值视角的自监督能否迁移到阵列外的外推视角？在何种基线或凸包几何下成立？我们给出经验迁移图（增益随评估相机到 S 凸包角距离的变化）。Q2：应该用何种监督信号为视角合成自适应几何——经由软 TSDF 的渲染损失，还是立体重投影？这是与 MADNet/MAD++ 在同等计算量下的直接对比。Q3：当预训练数据规模扩大后，test-time adaptation 是否仍然值得？负面和混合结果，例如朴素留一相机损害 E_ext，或仅颜色自适应就恢复了 X% 的增益，都作为发现报告。循环正则项是唯一的算法贡献，其价值在 E_ext 上衡量，而此前没有任何流式 NVS 工作评估过 E_ext。如果只得出“微调对留出相机有帮助”，那就是工程；本文成败取决于 Q1 和 Q2。", "differentiation": "MADNet/MAD++（arXiv 2007.05233；CVPR'19/TPAMI）用重投影损失对立体视差做持续自适应。我们用新视角渲染损失自适应整个渲染器（深度和混合），并直接将其损失作为深度网络的 baseline 分支进行比较。IBRNet (2102.13090) 和 Deep Blending 留出一个视角来离线微调混合网络，每个静态场景一次。我们在动态流上持续进行，带遗忘控制和延迟解耦，并研究阵列外迁移，这是它们从未评估的。LookinGood (1811.05029) 在采集阵列上使用见证相机离线训练 2D 重渲染器。我们用它们做部署时包括几何在内的自适应，并加入一个安装时变体：临时见证相机在自适应后被移除。NSTM (2607.15271) 运行 test-time-training 记忆，在低分辨率下将输入视角的 key 绑定到 value，与合成解耦。其损失是记忆化，而非留出相机光度误差，且不自适应几何。解耦速率的思路是共享的，并予以致谢。FSM/ETTT (2604.07350) 是 EWC/EMA 稳定器的来源，本文引用并使用它，不将其作为贡献。MVS-TTA (2511.18120)、Free Geometry (2604.14048) 和 Self-Geometry (2608.10708) 做逐场景、仅几何的 test-time adaptation，没有渲染器也没有流式处理。StreamTTO (2603.01765) 做传感器深度监督的 test-time optimisation，不做渲染。3DGStream (2403.01444) 和 IGS (2503.16979) 每帧优化耗时数秒，作为质量-代价上限出现。本文明确不主张备用相机自监督是新的。"}, "experiments": {"datasets": ["ENeRF-Outdoor（18 个同步相机，室外，对基础模型而言是域外；主要 OOD 测试，在全分辨率和半分辨率下评分）", "CMU Panoptic Studio HD 相机（穹顶上 31 个 HD 相机，多分钟序列，外加用于深度误差的 Kinect RGB-D）。是正面监督弧之外真实真值（E_ext）以及长时程数据的最佳公开来源", "ActorsHQ（密集 160 相机、高分辨率人体采集；监督弧 vs 穹顶 E_ext；高频细节）", "DNA-Rendering（60 相机人体序列；被摄者众多，通过拼接序列用于被摄者变化流，也用于扩展预训练变体）", "DyNeRF / Neural 3D Video（域内对照：增益应较小且不应出现遗忘）", "PackUV-2B（50+ 相机，序列长达 30 分钟；若可获取，用于 30 分钟遗忘研究；公开可用性尚未验证）", "MVHumanNet++（可选；用于与 NSTM 的分钟级协议比较以及扩展预训练）"], "baselines": ["冻结的基础渲染器（重新实现的几何引导 pipeline）", "冻结的 ENeRF 和 GPS-Gaussian（公开 checkpoint），作为冻结的可泛化参考", "仅颜色仿射自适应（关键的干扰 baseline：增益是否只是光度标定？）", "朴素持续留一相机自适应（无循环正则项，无 EWC）", "MADNet/MAD++ 风格的在线深度自适应，使用立体重投影损失（同等计算量），blend 网络冻结或同时自适应", "使用全部 S 相机在前 N 分钟上进行的离线逐安装微调（IBRNet 风格上界，无延迟约束）", "扩展预训练的冻结模型（DNA-Rendering + MVHumanNet++）：数据规模是否消除了 test-time adaptation 的必要？", "逐帧优化流式方法（3DGStream、IGS），作为质量-延迟上限", "NSTM，若代码或数值允许，在其 MVHumanNet++ 协议上报告；否则仅讨论而不运行"], "metrics": ["E_int 和 E_ext 上分别计算的 PSNR / SSIM / LPIPS，仅在未来帧上（从未进入回放缓冲区）", "增益随评估相机到 S 凸包角距离的变化（迁移图）", "质量-墙钟时间曲线及其面积；达到 +0.5 dB 所需时间", "遗忘：自适应 30 分钟后重新评估前 5 分钟的质量；被摄者变化后的恢复", "与基础论文相同的时序指标（TCC/STED 风格闪烁）加 EPI 视角一致性", "相对 Panoptic Kinect 深度或 ActorsHQ 重建的深度/几何误差，总体以及在高光或弱纹理区域掩码上", "自适应线程与渲染同 GPU 时的渲染延迟 p50/p99；每 dB 的自适应 GPU 秒数"], "key_ablations": ["自适应参数集：仅颜色 / blend-LoRA / depth-LoRA / 两者 / + 可学习 tau", "深度的监督：经由软 TSDF 的渲染损失 vs 重投影损失 vs 两者（同等计算量）", "循环正则项开/关，以及虚拟位姿采样分布（头部活动区域 vs 随机）", "监督相机数量 |S| ∈ {4, 6, 8, 12} 以及 K；N = K+1 的留一边界情形", "回放缓冲区开/关、EWC 开/关、哨兵回滚开/关（遗忘）", "扩展 vs 小规模预训练（test-time adaptation 增益能否在规模下保留？）", "单 GPU 共享 vs 专用自适应 GPU；热替换周期", "安装时见证相机变体：用额外相机自适应 10 分钟，然后移除并测量保留的增益"], "needs_custom_capture": false, "capture_notes": "核心主张可以在公开数据上检验。Panoptic Studio 和 ActorsHQ 提供位于正面、类似远程临场的监督弧之外的穹顶相机，为外推视角提供真实真值。Panoptic 还有 Kinect 深度和多分钟录制，用于遗忘和时程研究；ENeRF-Outdoor 提供域外室外设定。公开数据集缺乏刻意的光照变化、强高光道具以及真实的“安装”（隔间、显示器上安装的相机、数天内许多不同用户）。推荐进行一次小型 8-12 相机隔间采集（机器视觉或同步消费级相机，约 USD 5-10k，1-2 周），包含灯光或日光变化和高光物体，以支撑远程临场叙事和安装时见证相机变体，但验证论点并不需要它。基础论文未发布代码，因此重新实现（2-3 个月）处于关键路径上。ENeRF 或 GPS-Gaussian 的公开代码可作为早期实验的替代渲染器。"}, "first_two_week_test": "使用公开的 ENeRF（在 DTU 上预训练的可泛化 checkpoint；可微深度加混合）替代基础渲染器，暂时跳过软 TSDF。在两个流上运行：ENeRF-Outdoor，以及一个 Panoptic HD（或 ActorsHQ）序列。将相机划分为正面监督弧 S（约 8 个相机）、交错的无监督 E_int（2-3 个）和 E_ext（3-4 个，位于 S 凸包外，超出 20-60 度）。离线模拟流式处理：在前 60-120 s 上建立蓄水池缓冲区，在 S 上做留一相机自适应，仅在自适应窗口之后的帧上于 E_int 和 E_ext 评估。五个分支：冻结、仅颜色仿射、blend/最后一层 LoRA、depth+blend LoRA，以及离线完整微调（上界）。加入耗时 1 天的第六个分支：在头部活动区域内使用虚拟视角的循环正则项。另外在深度模块上运行一个 MADNet 风格重投影损失分支。成本：约 1 块 GPU 运行 2 周，1 名学生。成功信号：在未来帧上 E_int 相比冻结 以及 仅颜色 都提升至少 1 dB；带正则项时 E_ext 显示正向、非平凡的增益（至少 0.3-0.5 dB 或至少 5% LPIPS）；且朴素留一相机在 E_ext 上的表现明显差于在 E_int 上。", "kill_criteria": "若在至少 2 个域外数据集上出现以下任一情况，则放弃或并入其他项目。(a) 即使使用循环正则项，10 分钟后未来帧上的 E_ext 增益仍低于 0.3 dB PSNR 且低于 5% LPIPS：阵列外迁移论点失败。(b) 仅颜色仿射自适应恢复了至少 70% 的总增益：结果是光度标定，而非渲染器自适应。(c) 未见过的未来帧上的增益不到回放帧增益的 50%：这是记忆化，属于 NSTM 的范畴。(d) 在 DNA-Rendering/MVHumanNet 规模预训练下，增益坍缩到 0.3 dB 以下：规模胜过 test-time adaptation，因此至多作为短篇负面结果或 workshop 论文发表。(e) 经由软 TSDF 的渲染损失深度自适应并不优于同等计算量的 MADNet 风格重投影自适应。此时放弃几何主张，论文退化为 blend 网络微调，无法在顶会发表。此外，若尽管有安全措施，30 分钟遗忘仍超过 0.5 dB，也应终止，因为部署系统将无法使用它。", "reviewer_objections": [{"objection": "不新颖：留一视角微调是 IBRNet/Deep Blending，见证相机是 LookinGood，实时深度的在线自监督自适应是 MADNet/MAD++。这只是已知部件的组合。", "rebuttal": "在信号层面同意，论文在引言中就说明了这一点，并显著引用了所有这些工作。贡献在于它们都未报告的发现：(i) 在真实阵列外真值上的插值到外推迁移图，表明朴素留一相机不能迁移而循环正则项可以；(ii) 同等计算量的正面对比，表明经由软 TSDF 的渲染损失比 MADNet 的重投影损失能更好地为视角合成修正几何；(iii) 一个带互不相交的监督、插值和外推相机集合以及随时间遗忘的部署协议。已有工作作为 baseline 分支运行，而不仅是讨论。"}, {"objection": "增益只是颜色标定或白平衡，或者是对当前人物或姿态的过拟合。", "rebuttal": "仅颜色仿射自适应是一个独立 baseline，论文报告它所解释的增益比例。所有评估都在从未进入回放缓冲区的未来帧上进行。被摄者变化流（拼接的 DNA-Rendering 序列）同时衡量保留程度和重新自适应速度。终止标准 (b) 已预先设定。"}, {"objection": "留出的阵列相机靠近监督相机，所以插值增益是平凡的。远程临场中重要的视点在阵列之外，而那里你没有真值。", "rebuttal": "这正是本文的核心问题。穹顶数据集（Panoptic HD、ActorsHQ）让我们用类似远程临场的正面弧进行监督，并在其凸包外 20-60 度的真实相机上评估。我们绘制增益随到凸包角距离的变化，并报告增益在何处变为负值。E_ext 结果是主要结论，而非 E_int。"}, {"objection": "真实的远程临场隔间没有备用相机，且自适应会从延迟关键的渲染器中抢占 GPU 时间。", "rebuttal": "留一相机只需要 N = K+1，我们在 4 到 12 之间扫描 |S|。在安装时见证相机变体中，额外相机仅在最初几分钟存在，然后被移除，我们测量保留的增益。计算方面，我们报告自适应在同一 GPU 低优先级 stream 上运行时的 p50/p99 渲染延迟，以及每自适应 GPU 秒的 dB 数，并与每帧耗时数秒的 3DGStream/IGS 比较。"}, {"objection": "为什么不直接在更多数据上预训练（DNA-Rendering、MVHumanNet++）？Test-time adaptation 的增益通常会随规模消失。", "rebuttal": "我们包含一个扩展预训练变体，并如实报告剩余增益。预期的剩余部分是安装特定的：光照、相机 ISP、背景、高光道具和室外远场深度，任何预训练集都无法覆盖。如果增益坍缩，那是终止标准，而不是需要隐藏的东西。"}], "synergies": "C09（在视频上训练的可学习、递归、可微 image-TSDF）：共享同一个软 TSDF 模块，因此只需构建一次。C09 提供原则性的融合状态，C08 提供调节它的部署时信号（tau、置信度）。二者合在一起构成更强的联合论文或双论文系列。C05（结合 4D/视频扩散先验的阵列外 self-forcing）：最自然的合并。真实留出相机在阵列上监督，蒸馏的生成先验在阵列外正则化，替代或补充循环损失。若 C08 单独的 E_ext 增益有限，“阵列上用真实教师、阵列外用先验教师”是一个有吸引力的统一叙事。C03（带长录制和移动/双目真值的截止期限感知 benchmark）：互不相交的 S/E_int/E_ext 划分和随时间遗忘的协议可以成为该 benchmark 的一个赛道。C06（高光鲁棒性）：经由渲染损失的深度 test-time adaptation 是显式双层反射模型的数据驱动补充，高光区域掩码和指标可以共享。C02（感知一致性指标）：改进对权重热替换所引入闪烁的评估。C01（非同步消费级阵列）：留出相机光度损失也可以在线自适应同步偏移和颜色标定。", "effort": {"months": "8-10（2-3 个月重新实现基础 pipeline 加软 TSDF，因为代码未发布；1 个月替代 ENeRF 研究；3-4 个月自适应循环、协议与实验；1 个月写作与演示）", "people": "2 人（一名博士生负责渲染器和可微 TSDF，一名负责自适应循环和 benchmark 协议），加兼职导师支持", "compute": "2-4 块 24-80 GB GPU，预训练约 3-4 GPU 周（扩展的 DNA-Rendering/MVHumanNet 变体需更多，约额外 2-3 GPU 周）。自适应实验代价低（每个流 1 块 GPU，离线模拟中达到实时或更快）。可选的 8-12 相机隔间阵列 USD 5-10k。"}, "venue": "ICCV 2027（主会；截稿约 2027 年 3 月）。备选：3DV 2027，或若论文侧重安装时隔间研究和延迟测量，则投 ISMAR 2027（TVCG 期刊轨道）。考虑到重新实现，CVPR 2027（2026 年 11 月截稿）太早。", "novelty": {"verdict": "partially_scooped", "remaining_novel_angle": "检索到的工作中没有一个做到以下这点：实时、feed-forward、几何引导的多视角动态渲染器的预训练模型（深度网络加混合网络，经由可微 image-based TSDF 自适应）在部署时持续自适应数分钟到数小时，监督来自从渲染集合中留出的、时间同步的备用阵列相机上的光度损失。自适应在与延迟关键路径解耦的后台线程中运行。每个部件单独都已确立：留一视角渲染监督（IBRNet、Deep Blending）、在远程临场阵列上将见证相机作为自监督目标（LookinGood，仅离线）、实时深度网络的持续在线自监督自适应（MADNet/MAD++）、EWC/EMA 稳定的持续 TTT（FSM 2026）、用于 MVS 的元学习 TTA（MVS-TTA 2025），以及解耦的更新与渲染速率（NSTM 2026）。因此“备用阵列相机是持续自适应的免费目标”这一核心洞见作为原则并不新。仍可辩护且可发表的部分是经验性和系统层面的。(1) 研究由阵列内插值视角监督的自适应是否以及何时能迁移到外推的阵列外视点、何时会损害它们，以及使其能够迁移的循环一致性或虚拟视角正则项。(2) 经由软 image-based TSDF 将梯度传入几何，使高光或室外深度误差由渲染损失修正，而非仅靠立体重投影。(3) 一个长时程部署 benchmark 和协议，报告随时间变化的质量、遗忘、人物或场景变化，以及一个同时从自适应和评估中留出的相机。论文应显著引用 MADNet、IBRNet、Deep Blending 和 LookinGood，并将自己定位为把持续自适应从立体扩展到完整新视角渲染。不应主张来自备用相机的自监督是新的。", "threats": [{"title": "Continual Adaptation for Deep Stereo (MADNet / MAD++; CVPR 2019 'Real-time self-adaptive deep stereo', extended in TPAMI)", "url": "https://arxiv.org/abs/2007.05233", "year": "2019/2021", "venue": "CVPR 2019 / TPAMI", "overlap": "high", "what_overlaps": "部署时范式本身：实时网络在部署流中无标签地通过自监督（阵列相机之间的光度 warping）持续在线自适应。它仅自适应网络的一部分（模块化）以满足延迟预算，后续工作加入了遗忘和域变化处理。构想者未引用此工作，而它正是“系统运行越久越好”的经典先前工作。Federated Online Adaptation for Deep Stereo（arXiv 2405.14873, 2024）延续了这一方向。", "what_remains_different": "其任务仅为立体视差。自监督是左右重投影，而非来自留出相机的新视角渲染。没有混合或 TSDF 渲染器，也没有对阵列外视角外推的分析。"}, {"title": "IBRNet: Learning Multi-View Image-Based Rendering (per-scene fine-tuning by treating one input view as target)", "url": "https://arxiv.org/abs/2102.13090", "year": "2021", "venue": "CVPR 2021", "overlap": "high", "what_overlaps": "核心监督信号：在新场景上用其自身采集的视角微调可泛化的 image-based rendering 混合网络，留出一个作为目标、其余作为源。预训练和自适应使用相同目标。Deep Blending (SIGGRAPH Asia 2018) 同样从留出的真实照片学习混合权重。因此留一视角渲染自监督并不新。", "what_remains_different": "它离线微调，每个静态场景一次，耗时数小时。不是持续的或流式的，没有动态内容、遗忘保护或延迟解耦，也不通过融合 TSDF 自适应几何。"}, {"title": "LookinGood: Enhancing Performance Capture with Real-time Neural Re-Rendering", "url": "https://arxiv.org/abs/1811.05029", "year": "2018", "venue": "SIGGRAPH Asia 2018 (TOG)", "overlap": "medium", "what_overlaps": "它在实时远程临场或表演采集阵列上安装额外的“见证”相机。这些相机被排除在实时 pipeline 之外，作为神经重渲染器的自监督真值。这是“阵列备用相机是免费新视角目标”的远程临场特定版本。LookinGood-pi（arXiv 2112.08037）使其与人物无关。", "what_remains_different": "见证相机仅用于离线训练（v1 中逐人），而非部署时的持续自适应。重渲染器是 2D 后处理，几何不被自适应。"}, {"title": "Fast Spatial Memory with Elastic Test-Time Training (FSM / ETTT)", "url": "https://arxiv.org/abs/2604.07350", "year": "2026", "venue": "arXiv (Apr 2026)", "overlap": "medium", "what_overlaps": "它利用围绕 EMA 锚点的 Fisher 加权弹性（EWC）先验，稳定用于 4D 重建和新视角/新时刻渲染的持续 test-time-training 更新，防止灾难性遗忘。这抢先占据了所提方案中“EWC + EMA 遗忘保护”这一组件。", "what_remains_different": "它是大型 transformer 内部的 LaCT 风格 fast-weight 记忆，而非对已部署几何引导渲染器慢权重的自适应。其监督不是留出的阵列相机，也未研究安装或长时程部署。"}, {"title": "Online Neural Space Time Memory for Dynamic NVS (NSTM)", "url": "https://arxiv.org/abs/2607.15271", "year": "2026", "venue": "arXiv (Jul 2026, Google/UW)", "overlap": "medium", "what_overlaps": "它在在线多视角动态 NVS（远程临场风格的立体对输入）中执行基于梯度的测试时更新。更新与逐帧合成路径解耦（以较低速率记忆，每帧合成），与所提的带热替换的后台自适应线程是同一思路。", "what_remains_different": "其内层损失是输入 token 上的 key-value 绑定（记忆），而非留出真实相机上的光度损失。它与表示无关且分辨率低（256-512 px），没有对几何或混合网络的修正，也没有域自适应研究。"}]}}, {"id": "C10", "name": "Rig-native streaming geometry foundation model / geometry-biased view-synthesis transformer with change-gated per-camera-patch KV reuse", "decision": "pursue_with_repositioning", "scores": {"novelty": 5, "significance": 6, "feasibility": 5, "telepresence_fit": 8, "overall": 5}, "sharpened": {"title_zh": "RigCache：面向固定相机阵列流式多视图几何的变化门控持久化 Token 表", "title_en": "RigCache: Change-Gated Persistent Token Tables for Streaming Multi-View Geometry on Fixed Camera Rigs", "one_liner": "在固定、已标定、向内拍摄的相机阵列上，几何 transformer 可以维护一张持久化的、按（相机, patch）索引的 token 与 KV 表。一个感知陈旧度的三级学习门控只刷新那些深层特征确实会漂移的 token，包括由其他相机中的变化所引起的漂移。其结果是计算开销随场景运动量变化的度量级多视图深度，并且天然具备时间稳定性。同一张表还被一个覆盖全部 N 个相机的目标射线深度头为每个观看者查询。", "core_claim": "设定：同步、已标定、向内拍摄的相机阵列（8-16 个相机），场景中有动态人物。在类似视频会议的运动下（至少 70% 的 patch 为静态），RigCache 相对于每帧稠密重算的同一 student 模型同时满足以下各项。(i) 骨干网络 FLOPs 至少降低 3 倍，wall-clock 时间至少降低 2 倍。(ii) 深度精度：AbsRel 相对差距在 5% 以内，delta1 差距在 1 个点以内。(iii) 静态区域的时间深度闪烁（TAE/OPW）至少降低 30%。在相同计算量下，在注入曝光与光照变化时，它在深度误差和误刷新率上优于三种免训练的复用方案（Eventful 式阈值、VLA-Cache 式静态 token KV 复用，以及 RGB 差分门控）。其全 N 目标射线深度头沿扫动的观看者轨迹，相比 K 近邻 TSDF 融合（base paper），将新视角深度跳变（popping）减少至少 40%。如果两周测试中的 oracle 门控模拟在 70% 复用率下无法保持深度误差，则该主张不成立。", "key_insight": "在固定相机阵列中，一个 patch token（相机 c，位置 u）随时间保持其身份，因此自然的流式记忆是一张按相机和 patch 索引的表，而不是按时间索引的序列缓存。Eventful Transformers 和 VLA-Cache 从未遇到的一个非显然问题是跨视图陈旧性（cross-view staleness）。在全局注意力几何模型中，相机 A 中像素静止的 patch，其深层特征仍依赖于相机 B-N 中确实发生了变化的 patch（例如一个人在它所观察的背景前移动）。因此，“输入没有变化”并不意味着“token 不需要更新”。研究问题是：这种变化会通过跨视图注意力传播多远；以及一个以 teacher 特征漂移为训练目标的门控，配合一个廉价的仅注意力刷新层级，能否以全量开销的一小部分捕捉这种传播。答案决定了多视图几何模型中计算量究竟能否随运动变化。一个次要结果是：这张持久化、大部分冻结的表本身是一个稳定的场景表示。通过关注全部 N 个相机从中读取的新视角深度，既没有逐帧重算带来的闪烁，也没有 K 近邻视图集合切换带来的跳变。", "method": "骨干网络（student）。\n- 约 300M 参数，由多视图 DA3-Base 级或 VGGT 蒸馏模型初始化。\n- 在 14 px patch 上交替进行逐相机注意力和全局注意力，每个相机约 518x294（每个相机约 780 个 token，8-16 个相机约 6-12k 个 token）。\n- 标定以 Plücker 射线图 token 注入。对 RGB-D 阵列可选加入传感器深度 prompt token。\n- DPT head 输出每个相机的度量深度和置信度。\n\n持久化表。\n- 对每一层 l 和每个 (c, u)，存储 token 状态 x_l、其 K_l 和 V_l，以及一个陈旧年龄（staleness age）。\n\n三级门控。\n- 门控是作用于曝光归一化浅层特征上的小型 conv 加 MLP：patch embedding 差分、逐相机增益补偿后的 RGB 差分，以及对数色度差分。它还读取表中的年龄和置信度。\n- 它为每个 token 输出以下三个层级之一：\n  - T0 冻结：在所有层复用 x_l、K_l 和 V_l（无开销）。\n  - T1 注意力刷新：复用该 token 自身的投影和 MLP，但以 Eventful delta 形式针对新的 key 重新计算其全局注意力输出。开销约为完整 token 的 1/4。此层级处理跨视图污染。\n  - T2 在所有层完整重算。\n- 强制轮询刷新保证每个 token 至少每 R 帧（R 约 30）被刷新一次，置信度随年龄衰减。\n\n门控监督。\n- 目标是 teacher 漂移：离线运行稠密 student，如果某 token 在指定层的第 l 层特征变化超过 eps_input 或 eps_ctx，则标记为 T2 或 T1。\n- 损失：层级标签上的交叉熵，加上基于 Gumbel straight-through 的期望 FLOPs 预算损失。\n\n感知陈旧度的训练。\n- 8 帧截断 rollout，门控 on-policy 运行，使 student 学会消费陈旧的 KV 条目。\n- 每帧对一个离线双向 teacher 做蒸馏损失：在已知标定下的窗口化 DA3 或 MapAnything，并加一个时间平滑步骤（Video-Depth-Anything 式窗口对齐）。\n- 附加损失：跨视图重投影一致性、在光流 warp 后动态区域上的时间 warp 一致性，以及尺度不变加度量 L1 和梯度项。\n\n目标射线深度头。\n- 每个目标 patch token 是一个 Plücker embedding，加上从上一帧目标深度重投影得到的粗深度，或在初始化时使用平面扫描。\n- 它对全部 N 个相机的最后一层 token，沿极线段在正负 k·sigma 范围内每个相机取 s = 8 个采样做可变形交叉注意力，另加 32 个全局 token。\n- 输出：1/4 目标分辨率的深度、法线和不确定性，然后以 splat 后的 RGB 为引导做联合双边上采样。\n- 每个观看者的开销只有这个 head（低于 3 ms），因此 M 个观看者或眼睛共享一次骨干前向。\n- 监督：留出相机上的 teacher 深度，以及有传感器深度时的传感器深度。\n\n渲染。\n- 接入 base 流水线：由 student 深度（置信度门控）前向 splat 像素级 Gaussian，然后接 base U-Net blender，此时它还额外接收目标射线不确定性。\n- 刻意不构建 LVSM 式渲染器（超出计算范围，且 NSTM 已占据该方向）。\n\n训练数据：DNA-Rendering、MVHumanNet++、Panoptic Studio（HD 加 Kinect）、PackUV-2B 训练序列和 N3DV 训练场景。\n\n计算：在 4-8 块 A100/H100 GPU 上约 2-4k GPU 小时（对 student 做 LoRA 或部分微调，冻结的 teacher 离线运行一次）。\n\n运行时目标（RTX 4090 或 A100 级，8 个相机）：\n- 30% 运动时骨干最多 20 ms，而稠密约为 60-80 ms。\n- 目标 head 每个观看者最多 3 ms。\n- 端到端（含深度）最多 50 ms。base paper 的运行时不含深度；本目标包含。", "why_not_engineering": "本文回答了先前工作从未需要回答的问题：在每个 token 都关注每个相机的模型中，局部变化是否保持局部？Eventful Transformers 和 VLA-Cache 作用于单相机，在那里静态输入 patch 意味着 token 静态（仅差自注意力上下文）。这里需要测量和建模的是其他相机中静态 token 通过跨视图注意力受到的污染。本文的贡献将是：\n(1) 对多视图几何 transformer 中变化传播的逐层、逐相机的实证刻画。这是一项新分析，无论方法最终数值如何都成立。\n(2) 一个由 teacher 漂移监督的分级门控，带有专为这种污染设计的注意力刷新层级。\n(3) 感知陈旧度的 on-policy 训练，表明可以教会 student 容忍陈旧的 KV 条目。免训练复用做不到这一点，本文通过对比加以展示。\n(4) 一条可证伪的精度-计算-稳定性权衡曲线（随运动比例变化），以先前的门控方案为基线。\n\n如果跨视图传播被证明可以忽略，本文诚实的结论就是“Eventful 式复用可以迁移到相机阵列”。那是一个 workshop 级别的结果，kill criteria 就是为了尽早发现这种情况而设定的。", "differentiation": "- Eventful Transformers (ICCV 2023) 和 VLA-Cache (NeurIPS 2025)：单相机、免训练或阈值门控，且没有跨视图的陈旧 token 消费者。它们被采用为基线，而非声称超越的对象。新的部分是跨视图陈旧性层级、对曝光变化鲁棒的漂移监督门控，以及 on-policy 感知陈旧度训练。\n- StreamVGGT、OVGGT、StreamCacheVGGT、STAC 和 InfiniteVGGT：它们处理的是对单个移动相机应保留哪些过去的 token。RigCache 处理的是当相机身份固定时可以跳过计算哪些当前 token。两者正交，本文不声称有界内存是新贡献。\n- KV-Tracker 和 RnG (CVPR 2026)：将几何模型的 KV 缓存或查询为场景表示，但为关键帧级、静态且单相机。RigCache 的表是持久化且动态的，并按 patch 刷新。\n- RaySt3R 和 Z3D：由射线查询得到新视角深度的方法已存在。目标射线 head 作为一个组件提出。其具体主张是通过在时间持久化的表上进行全 N 极线注意力来消除 K 切换跳变，并用新的轨迹跳变指标度量。\n- DriveVGGT 和 Rig3R：标定多相机，但向外拍摄、自车运动且没有 token 复用。在那里没有静态 patch，因此前提不适用。\n- NSTM、Efficient-LVSM 和 Tele360：属于渲染器侧或逐帧方法。RigCache 是几何前端，NSTM 或 U-Net 可以消费它的输出。"}, "experiments": {"datasets": ["Neural 3D Video / DyNeRF (N3DV)：公开。采用 base paper 的测试协议，并使用干净的场景划分，因为训练场景共享同一厨房。", "ENeRF-Outdoor：公开，户外光照变化。", "D3DMV（已压缩）：用于与 base paper 可比。", "Panoptic Studio：公开的 HD 相机加同步 Kinect 深度。是动态多相机阵列上唯一大规模公开的真实传感器深度来源。用作深度精度的 ground truth。", "DNA-Rendering：申请后公开，60 个相机。主要训练来源和分钟级评估。", "MVHumanNet++：申请后公开。用于训练以及与 NSTM 可比的分钟级协议。", "PackUV-2B（CVPR 2026 发布）：50+ 个同步相机，长达 30 分钟。用于长时漂移和陈旧性测试。依赖之前需核实许可证和下载体量。", "ScanNet++（静态）：针对激光扫描 ground truth 的绝对深度精度合理性检查。"], "baselines": ["Base paper 流水线：RAFT-Stereo 加颜色差分门控的 TSDF，使用 K 近邻视图。由于未发布代码，需要复现。", "Fast-FoundationStereo 加 base TSDF；Stereo Any Video 加 base TSDF（强力的“仅替换深度模块”基线）。", "逐帧稠密 student（相同权重，无复用）；带标定的逐帧 DA3 或 MapAnything（teacher，作为上界）。", "适配到多相机输入的 StreamVGGT 和 OVGGT（将相机展平进流中）。", "将 Eventful Transformers 门控应用于同一 student（免训练，逐层阈值）。", "VLA-Cache 式静态 token KV 复用（免训练）以及 RGB 差分门控（以 base paper 的公式作为门控）。", "在 K 近邻相机上的 RnG / RaySt3R 式射线查询深度，作为目标 head 变体的对照检查。"], "metrics": ["深度：以 Panoptic Kinect 或 ScanNet++ ground truth 计算 AbsRel、delta1 和 RMSE；以 teacher 伪 GT 计算仅作为次要指标。", "时间：TAE/OPW 深度闪烁，静态与动态 mask 分别报告。", "跨视图：相机间重投影深度一致性误差。", "计算：骨干 FLOPs、wall-clock ms 和 GPU 显存随实测运动比例（分箱）的变化；各层级的刷新率。", "门控质量：注入曝光、增益和闪烁下的误刷新率；慢速运动上的漏检率（重影）；冻结 token 的跨视图污染误差。", "长时：1-10 分钟内深度误差和重影随时间的变化，有无强制刷新两种情况。", "新视角：按 base paper 协议的 PSNR、SSIM、LPIPS、TCC、STED、SDT、SDV 和 EPI；MEt3R。", "新的轨迹跳变指标：在静态帧上沿平滑虚拟相机扫动，新视角深度和颜色的时间导数。它隔离出 K 切换伪影。", "含深度的端到端延迟，以及 M = 1、2、8 和 32 个目标视图时每个观看者的边际开销。"], "key_ablations": ["门控类型（相同 FLOPs）：学习的漂移监督门控 vs Eventful 阈值 vs RGB 差分 vs oracle teacher 漂移。", "层级结构：2 级（冻结或完整）vs 带注意力刷新层级的 3 级。这是核心的跨视图污染测试。", "感知陈旧度的 on-policy 训练 vs 仅在测试时施加同一门控。", "复用预算扫描（50/70/85/95%）以及强制刷新周期 R。", "标定 token 开 vs 关；传感器深度 prompt 开 vs 关。", "目标射线 head：全 N vs K 近邻相机；极线偏置 vs 完整注意力；head vs TSDF raymarch vs 带一步 TSDF 细化的混合方案。", "相机数量（4/8/16），展示污染和节省如何随 N 缩放。", "光照鲁棒性：合成的全局增益与自动曝光阶跃、局部台灯开关，以及类火焰闪烁（N3DV Flame Steak）。"], "needs_custom_capture": false, "capture_notes": "核心主张可在公开数据上检验。Panoptic Studio 提供动态阵列上的真实传感器深度；DNA-Rendering、MVHumanNet++ 和 PackUV-2B 提供长时、多相机序列；光照和曝光变化可以合成注入。\n\n一次小规模可选采集（6-8 个同步工业相机或 RGB-D 相机，开启自动曝光，受控台灯开关，每段 5 分钟）会增加三点：真实世界光照鲁棒性结果、端到端实时延迟 demo，以及真实远程临场的运动比例分布（坐着说话 vs 站立）。它能增强 IEEE VR / SIGGRAPH Asia 投稿，但对 CVPR/ICCV 论文不是必需的。\n\n隐私注意：人体数据集需要签署申请协议。不要再分发可识别受试者的衍生深度。"}, "first_two_week_test": "在现成模型上进行免训练的 oracle 研究，只需 1 块 GPU，无需训练。\n\n步骤 1：稠密运行。\n- 在 N3DV（Coffee Martini、Flame Steak）、2-3 个 Panoptic HD+Kinect 序列和 2 个 DNA-Rendering 序列的 100 帧、8 相机片段上，逐时间步稠密运行 VGGT（或多视图 DA3）。\n- 记录每一层的 token 特征。\n\n步骤 2：刻画漂移。\n(a) 每层中帧间特征漂移低于 eps 的 token 比例，按其自身输入 patch 是否变化分开统计。\n(b) 跨视图污染：对像素静止的 token，漂移如何随深度增长，以及与其他相机中变化量的相关性。\n(c) RGB 差分和 Eventful 阈值对漂移的预测能力（AUROC），分别在原始帧和注入全局增益或曝光阶跃的情况下。\n\n步骤 3：在 50/70/90% 复用率下模拟复用。使用三种门控冻结 token 并复用其 KV：oracle 漂移门控、RGB 差分门控和 Eventful 门控。同时模拟 3 级变体，其中冻结 token 仍在全局层重新做注意力。对每种情况测量：\n- 相对 Kinect 和相对稠密输出的深度 AbsRel；\n- 静态区域闪烁；\n- FLOPs。\n\n另外对 70% 复用率下一个全局层的 block-sparse 实现（FlashAttention varlen gather）计时，检查节省在真实 GPU 硬件上是否依然存在。\n\n若以下四点全部成立，则该想法得到验证：\n1. 使用 oracle 门控时，超过 70% 的 token 可以在可接受误差下复用。\n2. 3 级变体明显优于 2 级变体，这表明跨视图污染真实存在且可以处理。\n3. oracle 门控以明显优势胜过 RGB 差分和 Eventful 门控，尤其是在曝光变化下，从而给学习门控留有空间。\n4. block-sparse 层实测 wall-clock 加速至少 2 倍。", "kill_criteria": "若以下任一成立，则放弃或转向：\n(1) 在 Panoptic 或 DNA-Rendering 上，即使 oracle 门控也无法在 70% 复用率下把 AbsRel 相对劣化控制在 5% 以内。这意味着全局注意力将变化传播得过广，相机阵列无法利用。\n(2) 在相同复用率下（包括曝光变化时），免训练的 Eventful 或 RGB 差分门控与 oracle 的差距在约 1% AbsRel 和约 10% 闪烁以内。那么学习门控和感知陈旧度训练就没有提升空间，本文退化为“把 Eventful 应用到 VGGT”。\n(3) 在目标 GPU 上 70% 复用率下 block-sparse wall-clock 加速低于 1.5 倍。\n(4) 到第 3 个月，在 N = 8 时 Fast-FoundationStereo 或 Stereo Any Video 加 TSDF 在精度 / 闪烁 / 延迟 Pareto 前沿上全面优于 student。\n(5) 出现一篇在几何 FM 中做变化门控多相机 token 复用的论文。该领域发展很快，因此每月重新检查一次 arXiv。\n\n如果 (1) 不满足但较小的 4 相机设置可行，可考虑收窄为 workshop 或 3DV 论文。", "reviewer_objections": [{"objection": "这就是把 Eventful Transformers 或 VLA-Cache 应用到 VGGT 上，是已知机制换了一个新骨干。", "rebuttal": "我们把它们的门控作为基线采用，并不声称该机制是我们的。新的、经过测量的现象是跨视图陈旧性：像素静止的 token 因为其他相机发生变化而漂移。我们按层和按相机数量对其进行量化，并展示单相机门控在此会误触发。我们用注意力刷新层级和感知陈旧度的 on-policy 训练来处理它，并在相同 FLOPs 下展示相对两种方法的提升。逐层传播分析本身就是一项独立贡献。"}, {"objection": "token 稀疏带来的 FLOP 节省很少能在 GPU 上转化为 wall-clock 加速，gather 和 scatter 开销会把它吃掉。", "rebuttal": "我们报告实测延迟（而不仅是 FLOPs），使用 block-sparse、变长注意力 kernel 和 patch 粒度的 gather，并按数据集中真实的运动比例分箱。两周测试在任何训练投入之前包含了一个 kernel 计时关卡（70% 复用率下至少 2 倍）。"}, {"objection": "冻结静态 token 会冻结其误差，并在门控漏掉慢速运动时产生重影。“比特级稳定”是 bug，不是特性。", "rebuttal": "我们使用强制轮询刷新、随年龄衰减的置信度和漂移训练的门控，并在分钟级（最长 10 分钟）序列上以显式的重影和漏检率指标进行评估。一致的静态误差在感知上远比闪烁危害小，这一点由 NVS 评估中的 TCC 和 STED 支撑。刷新周期会被扫描，以如实揭示这一权衡。"}, {"objection": "实时立体匹配基础模型加 TSDF 已经能给出准确、快速、一致的深度，因此不需要新的几何 FM。", "rebuttal": "Fast-FoundationStereo 和 Stereo Any Video 加 TSDF 是主要基线，且计入了深度时间，而 base paper 忽略了这一点。RigCache 提供成对立体匹配做不到的东西：无需选择相机对、全 N 跨视图一致性、以标定为条件的度量尺度、消除 K 切换跳变的逐观看者目标射线 head，以及随静态内容增多而下降的开销。如果基线主导 Pareto 前沿，这是一条已声明的 kill criterion。"}, {"objection": "以 teacher 的伪 GT 做监督和评估是循环论证，而留出的阵列相机只能测试插值。", "rebuttal": "主要深度指标使用真实传感器 ground truth（Panoptic Kinect、ScanNet++ 激光扫描）。跨视图重投影和闪烁指标不需要 teacher。新视角评估在 base paper 的 100 帧和留出相机之外，还加入了虚拟轨迹跳变指标和分钟级序列。"}], "synergies": "- 面向在线 3D 视频的、与运动成比例的流式扩散或光流修复器：同一套门控和层级 mask 可以驱动增强器中的 latent 和 KV 缓存，因此一个变化信号服务整个技术栈。\n- 深度不确定性作为一等输入：目标射线 head 的不确定性和 token 年龄置信度输入给 blender 或修复器。\n- 多观看者与光场显示的摊销：一次骨干前向，然后 M 个廉价的目标射线 head。这是 GeoLVSM-Stream 中值得保留的部分。\n- Gaussian 与体积流式编解码器：逐（相机, patch）的刷新 mask 就是免费的 delta 编码和带宽 mask，只传输变化的几何。\n- 长时远程临场 benchmark（分钟级、传感器深度、头部跟踪轨迹、跳变指标）：本文可以作为其种子。\n- NSTM 式渲染器：RigCache 的持久化深度表可以提供 NSTM 缺少的几何先验。\n- 可以形成论文系列：(1) 传播分析加 RigCache 几何；(2) 基于该表的几何偏置流式渲染器；(3) 在 IEEE VR 或 SIGGRAPH Asia 上的端到端实时阵列远程临场。", "effort": {"months": "8-10（约 1 个月做 oracle 研究和 kernel，3-4 个月做带感知陈旧度训练的 student 和门控，2 个月做目标射线 head 和流水线集成，2 个月做评估和写作）", "people": "2 人（一名博士生负责模型和训练，另一名负责 kernel、流水线、评估协议和可选采集）", "compute": "4-8 块 A100/H100 级 GPU；总计约 2-4k GPU 小时。teacher 伪 GT 离线生成一次（最大的单项开销，DNA-Rendering 和 MVHumanNet++ 子集约 500-1000 GPU 小时）。无 LVSM 规模的训练。"}, "venue": "ICCV 2027（首选；2026 年 11 月的 CVPR 2027 对完整系统来说太早）。备选：3DV 2027，投传播分析加复用方法；若配合实时阵列 demo 和真实采集，则投 IEEE VR 2028 或 SIGGRAPH Asia 2027。", "novelty": {"verdict": "partially_scooped", "remaining_novel_angle": "已被占据的是机制本身：跨帧的变化门控逐 token 重算加缓存 KV 复用。Eventful Transformers (ICCV 2023) 在 ViT 上做过，VLA-Cache (NeurIPS 2025) 对静态 patch 的 KV 做过跨帧复用。将缓存的几何 transformer KV 作为场景表示来查询以得到新视角 RGB-D 也已被占据（RnG, CVPR 2026；KV-Tracker, CVPR 2026）。有界内存的流式几何同样如此（OVGGT、STAC、StreamCacheVGGT）。\n\n剩下的（我没有找到做这件事的论文）是针对固定、已标定、同步、向内拍摄且含动态内容的相机阵列的特定组合：\n- 在跨视图全局注意力几何 FM（或视图合成编码器）内部的持久化逐（相机, patch）KV 表。相机 A 的陈旧静态 token 被相机 B 的新 query 消费。\n- 一个以 teacher 特征漂移为训练目标（且对光照和曝光鲁棒）的门控，而不是免训练的阈值。\n- 一个由该时间持久化表驱动的、覆盖全部 N 个相机的深度偏置极线目标射线深度 head，证明它能消除 K 近邻视图切换，并给出构造上比特级稳定的静态几何。\n- 对于 GeoLVSM 变体：在动态场景上的解耦视图合成 transformer 中做时间维度的输入 KV 复用，编码器在大量同时观看者或眼睛之间摊销。NSTM、Efficient-LVSM 和 SVSM 各自具备其中一部分，但没有一个具备这种组合。\n\n该主张必须表述为具有扎实测量的系统与架构贡献，而非新机制。有用的测量包括：计算量随场景运动比例的变化；跨视图陈旧性和误差传播的失效模式；学习门控 vs Eventful 式 vs RGB 差分门控；光照鲁棒性；以及包含深度在内的全流水线延迟。必须引用 Eventful Transformers 和 VLA-Cache 并与之做消融对比。", "threats": [{"title": "Eventful Transformers: Leveraging Temporal Redundancy in Vision Transformers", "url": "https://arxiv.org/abs/2308.13494", "year": "2023", "venue": "ICCV 2023", "overlap": "high", "what_overlaps": "这正是两个想法的核心计算机制。逐 token 的门控模块监测时间变化，只重算变化了的 token，并对 query-key 和 attention-value 乘积施加 delta 稀疏更新，其余部分复用上一帧。计算量在运行时随变化自适应，并且可以改装到预训练 ViT 上。", "what_remains_different": "它面向单相机视频上的视频识别与检测，没有几何、没有多相机标定注意力，也没有新视角输出。它的门控是阈值化的特征差分，而不是以 teacher 特征漂移为目标训练的 head。任何“计算量与变化成正比”的主张都必须表述为将 Eventful 式门控应用并扩展到多视图几何与 NVS transformer，而不是新机制。"}, {"title": "VLA-Cache: Efficient Vision-Language-Action Manipulation via Adaptive Token Caching", "url": "https://arxiv.org/abs/2502.02175", "year": "2025", "venue": "NeurIPS 2025", "overlap": "high", "what_overlaps": "识别固定相机或机器人相机相邻帧之间变化极小的 patch token，复用它们缓存的 KV，并逐层自适应复用比例。这就是“逐相机 patch 跨时间 KV 复用”的想法，已在机器人领域发表，并已有一系列后续工作（VLN-Cache 2603.07080、Neural Introspection Gating 2608.10824）。", "what_remains_different": "单相机、LLM 式 VLA 骨干、输出动作。没有跨视图全局注意力（即一个相机的陈旧 KV 被其他相机的 query 消费），没有几何或深度输出，也没有学习的漂移训练门控。Neural Introspection Gating 的门控是免训练的，基于 logit margin。"}, {"title": "RnG: A Unified Transformer for Complete 3D Modeling from Partial Observations", "url": "https://arxiv.org/abs/2603.01194", "year": "2026", "venue": "CVPR 2026", "overlap": "medium", "what_overlaps": "将几何 transformer 的 KV cache 视为隐式 3D 表示，任意目标位姿查询它以生成新视角 RGB-D。这与 RigStream 的“在共享场景 token 上的目标射线深度 head”以及 GeoLVSM 的“编码一次、从缓存 KV 解码多个目标”直接重叠。", "what_remains_different": "静态场景，侧重补全与生成，没有时间复用。它没有几何偏置或极线受限的目标注意力，也没有固定阵列标定。留给 RigStream 的新部分是在时间持久化、变化门控的 KV 表上的全 N 相机目标射线深度 head，用于消除 K 近邻切换。"}, {"title": "KV-Tracker: Real-Time Pose Tracking with Transformers", "url": "https://arxiv.org/abs/2512.22581", "year": "2025/2026", "venue": "CVPR 2026", "overlap": "medium", "what_overlaps": "在关键帧上缓存多视图几何网络（pi^3）的全局注意力 KV 对，并将其复用为场景表示以进行实时在线处理，加速约 15 倍且无需重新训练。", "what_remains_different": "单个移动的单目相机，关键帧级缓存，用于位姿跟踪。没有逐 patch 变化门控、没有同步多相机阵列、没有动态内容刷新，也没有深度/NVS 时间一致性。"}, {"title": "OVGGT / StreamCacheVGGT / STAC / InfiniteVGGT (bounded and compressed KV caches for streaming geometry transformers)", "url": "https://arxiv.org/abs/2603.05959", "year": "2026", "venue": "ECCV 2026 (OVGGT); arXiv (StreamCacheVGGT 2604.15237, STAC 2603.20284 CVPR 2026, InfiniteVGGT 2601.02281)", "overlap": "medium", "what_overlaps": "这些工作都给出了固定预算或常数内存的流式几何 FM，包括 token 重要性评分、淘汰和合并。STAC 将被淘汰的 token 组织到体素网格中以便空间复用。这使得“有界内存而非 StreamVGGT 不断增长的缓存”不再能作为贡献。", "what_remains_different": "全部是单个移动相机，且都关注保留哪些过去的 token，而不是跳过对未变化的当前帧 token 的重算。没有一个利用了固定阵列下（相机, patch）token 的稳定身份。"}]}}, {"id": "C14", "name": "Latency-hiding split rendering with layered RGB-D view bundles for standalone headsets", "decision": "pursue_with_repositioning", "scores": {"novelty": 5, "significance": 6, "feasibility": 6, "telepresence_fit": 8, "overall": 5}, "sharpened": {"title_zh": "为显示而渲染，而非为帧而渲染：面向独立头显上隐藏延迟远程临场的重投影稳定几何引导视图合成", "title_en": "Render for the Display, Not the Frame: Reprojection-Stable Geometry-Guided View Synthesis for Latency-Hidden Telepresence on Standalone Headsets", "one_liner": "对实时多视角 IBR 的训练和评估，都以头显在真实位姿预测误差下经 late reprojection 后实际显示的帧为准。由此表明：跨时间与跨视角的深度一致性在直接渲染图像时几乎看不出影响，但一旦 split rendering 被用来隐藏网络延迟，它在很大程度上决定了闪烁（shimmer）和空洞伪影。", "core_claim": "我们提出一个可证伪的论断。对于在边缘服务器上按预测位姿渲染、并在独立 HMD 上做 late reprojection 的实时采集人体，时间一致的多视角融合深度（带时间滤波的 TSDF）能大幅降低显示刷新率下的闪烁（目标为 warping 误差或 FovVideoVDP 时间增益至少降低 30%），并降低相对真实位姿真值的 LPIPS。该效应相对单帧精度相同的逐帧立体或 MVS 深度成立。差距随预测时域（RTT + 渲染时间，20 到 150 ms）增大，而同样的深度变化在直接以真实位姿渲染帧时几乎不可见（低于 0.1 dB，与基础论文的消融一致）。第二个论断是：在采样的位姿误差下，对重投影后输出施加损失来训练融合或着色网络，优于在渲染位姿下训练。预计 2 层 IBR 着色的 bundle 只有在平移误差超过某个阈值后，才能在相同码率下胜过更宽 FoV 的单层方案，我们将测量这一阈值。", "key_insight": "Late reprojection 会把深度误差转化为图像运动。warp 位移约为 f·|Δt_pose|·δz/z²。因此逐帧深度噪声会变成显示刷新率下的闪烁，并按位姿预测误差成比例放大。在渲染位姿下的逐帧指标看不到这一点，这解释了基础论文中 TSDF 消融看起来毫无作用的原因。采集装置确实观测到了从预测视点看被遮挡的表面，因此与合成 G-buffer 的 PVS/QuadStream 流式传输不同，被遮挡层既可以被提取（多次命中 TSDF raymarch），也可以由真实相机做光度着色。正确的优化目标是重投影后实际显示的 90 Hz 流，并在位姿误差分布上积分。", "method": "服务器（边缘 GPU，30 Hz 预算即 33 ms 以内，每眼约 1K 的 2x bundle）：(a) 基础的几何引导管线，或其开源重新实现（前向 splat 的逐视角深度、时间滤波、基于图像的 TSDF）。前一帧深度反馈被重新定义在固定的世界或装置坐标系中并显式重投影，修复了基础论文中目标移动的缺口。(b) 多次命中 TSDF raymarching 产生 L≤2 层：第一表面，以及越过深度不连续后的下一个表面，仅在去遮挡保护区域内提取。(c) 融合网络扩展了层索引和逐源可见性（每台装置相机对该层做深度测试），使被遮挡层由看到它们的相机着色，并带 alpha/边缘带。(d) 一个位姿预测器（Kalman 滤波或带异方差输出的小型 GRU）在 RTT+渲染时长上做预测。其协方差决定保护带宽度以及是否发出第 2 层。这部分是系统组件，不作为新颖性声明。传输：分块 HEVC 10-bit 纹理+深度图集，类 MIV，复用而不声明为贡献。客户端（Quest 3，OpenXR/Vulkan compute，双眼合计 3 ms 以内）：每个 vsync 做分层前向 warp 并由前到后合成，立体由一个 bundle 加 IPD 偏移得到，再做廉价的空洞填充。训练：位姿误差 Δ 从预测器在记录的 HMD 头部轨迹上的残差中采样。在稠密公开装置上，真实位姿 p 是一个留出相机，预测位姿为 p̂ = p − Δ。bundle 在 p̂ 渲染并 warp 到 p。损失：相对 p 处真值的 L1+LPIPS；显示刷新率时间损失（在真实位姿 p 固定、p̂ 与采集时间变化时，相邻 warp 输出之间遮挡掩码的光流 warping 误差）；以及世界坐标下的深度时间一致性正则项。训练数据：ActorsHQ 和 DNA-Rendering（稠密人体装置），外加用于场景的 DyNeRF 和 ENeRF-Outdoor。", "why_not_engineering": "贡献是一个经测量的现象、一项方法改变和一个指标，而不是一条管线。(1) 一条经实证验证的定量规律，把深度时间噪声和位姿预测时域与采集内容的显示闪烁联系起来。它解释了为何深度一致性在标准 NVS 评估下看似无用，而在重投影下却起主导作用。(2) 重投影感知训练改变了 IBR 网络学到的东西。它应当减少对轮廓处不稳定深度的依赖，我们用消融来检验这一点。(3) 一个面向隐藏延迟远程临场的评估协议：在稠密装置上以显示刷新率对照重投影真值，并采用 FovVideoVDP 风格的时间评分，现有实时采集 NVS 论文都没有用过。编解码器、预测器和客户端 warper 明确定位为支撑性的系统工作。", "differentiation": "对比 QuadStream (TOG 2022)、PVHV (Kim & Lee, TOG 2023) 和 Disocclusion Buffer PVS (SIGGRAPH Asia 2025)：它们假设合成场景具有精确 G-buffer 和无噪声深度，因此对它们来说不存在深度噪声引起的闪烁，被遮挡层是光栅化得到的，而非从真实相机估计并做 IBR 着色。我们继承了它们的 view-cell 思想并如实引用。对比 MeshReduce (IEEE VR 2024)、IMX 2026 的体积视频远程渲染工作和 MetaStream：它们以网格、点云或平面投影的形式把实时采集传给轻量客户端，没有研究重投影闪烁，也没有针对它训练。对比 Gul et al.（2020-22 年的云端体积视频加 Kalman 预测加单应 late-warp）：他们用的是预录内容和平面 warp，没有深度层。对比 CPSL (arXiv 2511.14927)：用于回放的离线 2.5D 分层体积视频，没有按预测位姿生成的实时 bundle，也没有延迟回路。对比 Streaming-3DGS (arXiv 2604.02851)、EdgeGaussian (MobiCom 2025) 和 CAGS (SIGGRAPH 2026)：它们传输合成或离线内容的完整 3D 表示，作为 Pareto 基线（码率、客户端 ms），而不是相冲突的论断。对比基础论文 (Ha et al., CVPR 2025)：它从未测量头部跟踪或显示刷新率下的输出，没有时间损失，也没有定义目标移动时的反馈重投影。"}, "experiments": {"datasets": ["ActorsHQ（160 台相机，12MP，人体；稠密的留出相机在许多邻近位姿处提供真值，这对重投影真值协议至关重要）", "DNA-Rendering（60 台相机 + Kinect 深度；用于以重投影损失训练融合网络的大型人体视频集）", "CMU Panoptic Studio（31 台 HD 相机 + 10 台 Kinect v2 RGB-D；真实传感器深度，用于测试 RGB-D 装置变体和多人场景）", "Neural 3D Video / DyNeRF（18-21 台相机，含人物的场景；与基础论文保持连续性）", "ENeRF-Outdoor（与基础论文保持连续性；户外，相机较少）", "10-15 名参与者在坐姿对话中录制的 Quest 3 6DoF 头部位姿轨迹，自采的小型数据集，将会发布", "自建：小型 6-8 台相机立体或 RGB-D 装置加边缘 GPU 加 Quest 3，用于实时端到端延迟测量和用户实验"], "baselines": ["Oracle：服务器以真实位姿、零延迟渲染（上界）", "视频加旋转 timewarp 或单应 late-warp（Gul et al. ICIP 2022 风格）", "使用原始逐帧立体或 MVS 深度的单层 DIBR（闪烁基线）", "使用 TSDF 一致深度的单层 DIBR（将深度一致性效应与分层分离）", "FoV 保护带加宽到相同码率的单层方案（分层对比 FoV）", "使用原始深度的 QuadStream/MIV 风格分层流式传输（有分层无一致性）", "由融合深度生成网格并在客户端渲染的网格流式传输（MeshReduce 风格）", "流式传输并在客户端渲染的逐帧 feed-forward Gaussians（Streaming-3DGS 2604.02851 / GPS-Gaussian 风格），用于码率与客户端 ms 的 Pareto 比较", "对重投影输出做事后时间去闪烁或 EMA（检验简单修补是否就够了）"], "metrics": ["重投影帧相对真实位姿真值（留出相机）的 PSNR/SSIM/LPIPS，按预测时域 20/50/100/150 ms 分组", "显示刷新率闪烁：90 Hz 输出流上遮挡掩码的光流 warping 误差（Lai et al. 2018）以及静态区域的时间标准差", "显示流上的 FovVideoVDP / ColorVideoVDP 感知时间质量", "去遮挡空洞率（无有效层的像素百分比）随位姿误差的变化", "相同质量下的码率（Mbps）；服务器 ms；Quest 3 上的客户端 GPU ms 与功耗", "实时系统的实测 motion-to-photon 延迟（光电二极管）；完整延迟分解", "用户实验：2AFC 闪烁偏好、SSQ、共在感，以及 3 种 RTT 下的注视或眼神接触准确度"], "key_ablations": ["深度来源：原始逐帧 vs 时间滤波 vs TSDF 融合 vs TSDF+反馈（带正确的目标移动重投影）", "训练目标：渲染位姿处的损失 vs 重投影输出损失 vs 再加显示刷新率时间损失", "相同码率下 L=1 vs 2 vs 3 层，作为平移位姿误差的函数", "保护带与层数：固定 vs 按协方差确定", "被遮挡层着色：最近相机拷贝 vs 可见性加权 IBR 融合 vs 学习得到", "位姿预测器：无（上一位姿）、恒速、Kalman、学习的异方差模型", "立体：单 bundle 加 IPD 偏移 vs 两个 bundle"], "needs_custom_capture": true, "capture_notes": "核心科学论断（深度一致性 x 预测时域 -> 显示闪烁；重投影感知训练）可以完全在公开稠密多视角数据集（ActorsHQ、DNA-Rendering、Panoptic、DyNeRF）上用模拟的延迟回路来检验。真实位姿是一个留出相机，预测位姿按真实 HMD 头部轨迹的残差偏移，且真值只在采集帧率下存在。因此显示刷新率闪烁用无需真值的 warping 误差和 VDP 指标测量，并在采集时刻与真值比较。只有以下两项需要自建：(a) 在 Quest 3 上录制头部位姿轨迹（便宜，几天即可）；(b) 带光电二极管 motion-to-photon 延迟测量的实时端到端演示和用户实验，需要一个小型 6-8 台相机同步装置、一块边缘 GPU 以及带网络模拟（tc/netem）的 WiFi 6。IEEE VR/ISMAR 的审稿人会期望看到 (b)。"}, "first_two_week_test": "在 DyNeRF（2 个场景）加 ActorsHQ（2 名演员，稠密相机）上做离线模拟，不涉及网络或头显。第 1-3 天：在 Quest 3 上录制约 10 分钟的坐姿对话 6DoF 头部轨迹，或使用任意已有的 HMD 轨迹，并计算 33、66、100 和 150 ms 时域下恒速或 Kalman 预测的残差。第 3-8 天：对每个留出相机 p，用残差构造虚拟预测位姿 p̂ = p − Δ。用相同的 IBR 颜色（有代码则用基础管线，否则用简单的可见性加权融合）在 p̂ 渲染 RGB-D，比较三种深度来源：(i) 逐帧立体/MVS 深度，(ii) 逐帧深度加时间滤波，(iii) 跨视角与时间融合的基于图像的 TSDF。然后将单层前向 warp 到 p。第 8-12 天：用多次命中 TSDF raymarching 加一个朴素的第二层，颜色取最近可见相机。测量相对 p 处真值的 LPIPS、空洞率，以及在 p 固定而 p̂ 随轨迹抖动时的光流 warping 闪烁。同时测量相同深度来源直接在 p 渲染的结果，即“不可见”条件。第 12-14 天：绘制闪烁和 LPIPS 随预测时域的曲线，并与对原始深度输出做事后 EMA 去闪烁进行比较。成功标准：一致性差距在重投影下很大（66-100 ms 时闪烁降低 ≥30%），无重投影时很小，且随时域增大；EMA 无法在不引入重影的情况下弥合它。同时确定第 2 层在多大时域下能显著降低空洞率。", "kill_criteria": "出现以下任一情况即放弃或转向。(1) 在现实时域（66-100 ms）下，一致深度使显示闪烁的相对降低不足约 15%，或差距不随时域增大；此时核心论断为假。(2) 对原始深度重投影做简单的事后时间 EMA 或去闪烁，在噪声范围内达到与一致深度相同的效果，且没有可见重影。(3) 对话式头部运动下 100 ms 的平移位姿误差非常小（例如低于 1 cm，去遮挡为亚像素级），以至于旋转 timewarp 加更宽 FoV 就能匹配分层 bundle。此时舍弃分层和 bundle 的叙事，只保留“重投影下的一致性”这一发现，作为短论文或基准中的一节。(4) 客户端渲染流式传输的逐帧 Gaussians 或网格（2604.02851 或 MeshReduce 风格）在 Quest 3 预算内以相同或更低码率达到相同质量；此时 bundle 没有 Pareto 优势。(5) 第 3 个月之前出现一篇 2026 年论文，测量了使用一致深度的实时采集人体的重投影闪烁。", "reviewer_objections": [{"objection": "这就是把 QuadStream/PVS/MIV 加 MeshReduce 用到远程临场上。带分层抗去遮挡表示和 view cell 的 split rendering 早已有之，所以这是工程。", "rebuttal": "我们承认该架构并如实引用。贡献在于那些工作无法观察到的东西：对于实时人体的估计含噪深度，主导伪影是显示刷新率下的闪烁而不是空洞，且其大小与预测时域乘以深度时间噪声成比例。我们对此做了量化，表明一致性融合深度加重投影感知训练能解决它，而使用原始深度的 QuadStream/MIV 风格分层则不能。被遮挡层是从真实相机估计并做 IBR 着色的，而不是从 G-buffer 光栅化得到的。"}, {"objection": "50-100 ms 内头部平移只有几厘米。旋转 ATW/ASW 已经解决了延迟问题，深度分层是不必要的。", "rebuttal": "我们用录制的 Quest 3 对话轨迹直接测量这一点，并报告空洞率和闪烁随时域的变化，包括第 2 层的收支平衡点。在 WiFi/5G 加 33 ms 渲染的情况下，80-150 ms 的时域很常见。即使分层被证明不必要，对于 0.5-1.5 m 处的近场人脸，仍需要基于深度（而非旋转）的 warp 来产生视差，而无论层数多少，深度一致性在那里都很重要。论文的主要论断不依赖分层。"}, {"objection": "为什么不像 2604.02851、MeshReduce 或 SqueezeMe 那样流式传输 3D 表示（逐帧 Gaussians、网格）并完全在客户端渲染？", "rebuttal": "我们把这些作为码率 / 客户端 ms / 质量 Pareto 上的基线纳入。来自 8 台相机装置的稠密逐视角 Gaussians 每帧达数百万个 splat，会给 Quest 3 的带宽和 GPU 带来压力。网格会丢失视角相关的 IBR 外观和头发。bundle 在每个 vsync 的客户端开销是固定的（低于 3 ms），与场景复杂度无关。如果某个基线占优，我们会如实报告；重投影下一致性的结论对那些管线同样有用。"}, {"objection": "显示刷新率下、任意头部位姿处的真值并不存在，所以评估缺乏说服力。", "rebuttal": "稠密装置（ActorsHQ 160 台相机、Panoptic）在每个预测位姿附近的许多真实位姿处都有真值。位姿误差从真实头部轨迹残差中采样，因此重投影输出是与真实图像比较的。显示刷新率闪烁使用成熟的无真值度量（光流 warping 误差、FovVideoVDP），并在实时系统上以 2AFC 闪烁偏好和 SSQ 的用户实验闭环验证。我们将把协议和轨迹作为基准发布。"}, {"objection": "基础论文自己的消融表明 TSDF 几乎无关紧要（31.16 vs 31.17 dB），为什么认为深度一致性在这里会重要？", "rebuttal": "这正是被检验的假设。在真实位姿直接渲染会掩盖深度误差，因为 IBR 融合对其有容忍度；而重投影会把深度误差按位姿误差成比例地转化为像素运动。我们预测并检验一种交互效应：无重投影时效应接近零，有重投影时效应很大。证实这一交互效应也能解释为何标准 NVS 基准低估了几何一致性对远程临场的价值。"}], "synergies": "(1) 移动与双目观看者一致性（左右立体一致性加视角 x 时间一致性基准）：重投影显示指标与稠密装置重投影真值协议是同一套基础设施，因此可以形成一篇基准论文加本方法论文。(2) 发送端/接收端计算拆分放置（传输什么：RGB-D vs Gaussians vs latents）：本工作提供了该权衡中的延迟与一致性维度，按位姿不确定性确定大小的 bundle 是设计空间中的一个点。(3) 在线 3D 视频的 glass-to-glass 延迟测量：光电二极管 motion-to-photon 测量装置可复用。(4) 鲁棒 RGB-D 装置（飞点、ToF 干扰）：含噪的轮廓深度恰恰是驱动重投影闪烁的因素，因此深度清洗前端可以直接接入。(5) 流式 one-step diffusion 或 transformer 修复器（如 arXiv 2603.05507 的实时 3D 流式修补）：作为客户端或边缘端的轻量去遮挡填充器处理残留空洞。(6) 注视点远程临场压缩：可利用头显眼动追踪对保护带和层预算做注视点分配。一个论文系列可以是：基准/指标（显示刷新率一致性）-> 本方法 -> 计算拆分优化。", "effort": {"months": "7-9（2 周 go/no-go 模拟；约 3 个月在公开数据上做离线方法与重投影感知训练；2-3 个月做 Quest 3 客户端、实时装置集成与延迟测量；约 1.5 个月做用户实验与写作）", "people": "2 人（一名博士生负责视觉/学习部分：深度一致性、分层 IBR、训练；一名负责系统/图形部分：Quest 3 Vulkan/OpenXR warper、编解码器、网络模拟、光电二极管装置）。仅当实时系统缩减为最小演示时，一人才可行。", "compute": "1-2 块 RTX 4090 / A6000 级 GPU 用于训练和边缘服务器；总计约 2-4 GPU 周。另需一台 Quest 3（可选 Vision Pro）、一台带 netem 的 WiFi 6 路由器、一个光电二极管或示波器，以及一套 6-8 台相机的同步立体或 RGB-D 装置（约 $5-15k）用于实时演示。"}, "venue": "首选：IEEE ISMAR 2027（TVCG 期刊轨），因为 IEEE VR 2027 的截稿实际上已过，下一个现实目标是 IEEE VR 2028。重点应放在显示流一致性发现、Quest 3 系统和用户实验上。备选：若重投影感知训练带来大而干净的提升且分析扎实，则投 SIGGRAPH Asia 2027 (TOG)。除非把系统部分缩减为基准与协议贡献，否则避免投 CVPR。", "novelty": {"verdict": "partially_scooped", "remaining_novel_angle": "系统骨架是被充分探索的先前工作：预测位姿，在服务器或边缘渲染，发送按视点区域确定大小的抗去遮挡分层或 PVS 表示，再在瘦客户端上 late-reproject。见 QuadStream 2022、Kim & Lee PVHV 2023、SIGGRAPH Asia 2025 Disocclusion Buffer、Gul et al. 2020-22、Vues 和 CollabVR。图集编解码器本质上就是 MPEG Immersive Video (MIV)。实时多深度传感器远程临场的 split rendering 也已存在（MeshReduce, IEEE VR 2024；IMX 2026 中带全息传送用户的远程渲染工作）。这些组件单独来看都不新。\n\n仍然成立的是：\n(1) 基于采集数据的分层 bundle。被遮挡层来自对实时、时间滤波 TSDF 的多次命中 raymarching，并由学习的多视角 IBR 融合网络依据实际观测到这些表面的装置相机着色。先前的 PVS 与分层流式传输假设合成场景具有精确 G-buffer。\n(2) 把时间一致性作为 late reprojection 的一等要求。无论是合成场景流式传输文献还是实时采集系统，都没有测量或优化闪烁。要检验的论断是：跨帧与跨视角的深度一致性正是使实时人体的基于深度重投影无闪烁的关键；这需要在重投影输出上使用显示刷新率（90 Hz）的闪烁指标。\n(3) 在采样的真实位姿下以重投影输出上的损失端到端训练 IBR 融合或着色网络（重投影感知训练）。所调研的工作中没有一个对采集内容这样做。\n(4) 由概率位姿预测器的协方差确定保护带大小和层数。这是在固定 view cell 之上的一小步，也是四个论断中最弱的。\n\n论文应定位为 QuadStream/PVS 流式传输的“采集内容、时间一致”对应物，而不是一种新的 split rendering 架构。它必须引用并胜过 QuadStream 风格和 MeshReduce 风格的基线，以及使用原始深度的单层 DIBR。", "threats": [{"title": "QuadStream: A Quad-Based Scene Streaming Architecture for Novel Viewpoint Reconstruction (Hladky et al.)", "url": "https://doi.org/10.1145/3550454.3555524", "year": "2022", "venue": "ACM TOG (SIGGRAPH Asia 2022)", "overlap": "high", "what_overlaps": "核心系统洞见。服务器流式发送一个抗去遮挡的分层或近似几何表示，覆盖可能客户端位姿的一个 view cell。随后瘦 VR/手机客户端重建并渲染当前及邻近视角，降低 motion-to-photon 延迟，同时避免视频加重投影带来的去遮挡空洞。“按位姿范围确定额外层或覆盖范围”正是 view-cell 或潜在可见集（PVS）思想，其谱系可追溯到 Camera Offset Space 和 Shading Atlas Streaming。", "what_remains_different": "为具有完整 G-buffer 和已知被遮挡几何的合成场景而构建。它不使用实时多相机采集、含噪估计深度或被遮挡层的 IBR 着色，也不处理逐帧深度噪声引起的时间闪烁。"}, {"title": "Potentially Visible Set Generation with the Disocclusion Buffer (Kunzel et al.)", "url": "https://doi.org/10.1145/3757377.3763981", "year": "2025", "venue": "SIGGRAPH Asia 2025", "overlap": "medium", "what_overlaps": "在稀疏、分层、深度量化的场景表示上计算基于区域的 PVS。它把流式渲染和帧率上采样列为目标用途，并直接计算在一定相机运动范围内哪些内容会被去遮挡。这就是“为预测位姿区域发送哪些被遮挡层”这一步。", "what_remains_different": "仅限合成渲染。不含采集数据、不确定性驱动的大小确定、网络系统或远程临场评估。"}, {"title": "Potentially Visible Hidden-Volume Rendering for Multi-View Warping (Kim & Lee)", "url": "https://doi.org/10.1145/3592108", "year": "2023", "venue": "ACM TOG (SIGGRAPH 2023)", "overlap": "medium", "what_overlaps": "深度剥离的被遮挡层，限定为在源视角被遮挡、但在新视角范围内可能可见的片元，用于多视角 warp。这本质上是“按视角范围确定层数与范围”，由多层提取为 warp 提供输入。", "what_remains_different": "没有流式传输或网络延迟，几何是合成的，没有基于不确定性的范围，也没有实时采集。"}, {"title": "MeshReduce: Split Rendering of Live 3D Scene for Virtual Teleportation / MeshReduce: Scalable and Bandwidth Efficient 3D Scene Capture (Jin, Lu, Dasari, ... Rowe, CMU)", "url": "https://doi.org/10.1109/vrw62533.2024.00387", "year": "2024", "venue": "IEEE VR 2024 (full paper https://doi.org/10.1109/vr58804.2024.00026) + VRW demo", "overlap": "medium", "what_overlaps": "对人物和场景做实时多深度传感器采集，通过 split rendering 框架流式传输到移动 AR/VR 和浏览器用于远程临场。它直接占据了“面向轻量客户端的实时 3D 采集 split rendering 用于远程传送”这一定位。", "what_remains_different": "流式传输带纹理网格并在客户端渲染。没有来自学习型 IBR 管线的分层 RGB-D bundle，没有按位姿不确定性确定的保护带或层，也没有研究重投影闪烁或显示刷新率时间一致性。"}, {"title": "Towards Interactive Volumetric Video experiences on Lightweight VR Devices through Remote Rendering (Fernandez-Dasi et al.)", "url": "https://doi.org/10.1145/3788851.3815052", "year": "2026", "venue": "ACM IMX 2026", "overlap": "medium", "what_overlaps": "将包含全息传送用户实时体积视频流的 VR 场景端到端远程渲染到独立头显和浏览器。它使用超出视场留有余量的视口感知立体投影，并报告 motion-to-photon 延迟（本地低于 40 ms，经互联网约 180 ms）。", "what_remains_different": "以视频投影方式传输，没有分层深度或 late depth reprojection。源内容是传统体积视频，而非几何引导的 IBR，也没有报告时间一致性分析。"}]}}, {"id": "C09", "name": "Principled learnable recursive geometry state: motion-compensated Bayesian image-TSDF, stability/contraction analysis, differentiable TSDF trained over video", "decision": "pursue_with_repositioning", "scores": {"novelty": 5, "significance": 5, "feasibility": 7, "telepresence_fit": 8, "overall": 5}, "sharpened": {"title_zh": "闪烁、滞后与鬼影：面向分钟级在线 3D 视频的一致递归几何状态", "title_en": "Flicker, Lag and Ghosts: Consistent Recursive Geometry State for Minute-Long Online 3D Video", "one_liner": "在每个固定阵列相机中保持一个运动补偿的 Kalman 深度后验，并将其融合到图像空间 TSDF 中，使任何证据都不被重复计算。其结果位于一个可预测的闪烁-滞后-鬼影 Pareto 前沿上，这是基础论文的颜色门控 EMA 加 η 上限新视角反馈无法达到的。", "core_claim": "我们在分钟级多视角人体序列（Panoptic Kinect、使用立体深度的 ActorsHQ/DNA-Rendering、合成的事件注入 Blender 序列）上，以及留出和移动的虚拟相机上进行测试。在相同滞后或鬼影半衰期下，一致递归状态使动态人脸和手部区域的闪烁相对基础递归降低至少 25%（渲染 RGB 与 TSDF 深度两者的光流 warp 时序误差）。当所有 pipeline（包括无状态 baseline）都配备时序一致的视频立体前端时，它仍至少好 15%。PSNR 和 LPIPS 保持在基础的 0.2 dB / 0.01 以内，额外开销至多 5 ms/帧。最后，由（过程噪声 Q、测量方差 R、门控漏检率）预测的闭式鬼影半衰期和稳态闪烁，与注入事件（开关灯、移除物体、无纹理运动）后测得的值在 ±30% 以内吻合。相比之下，基础递归取决于 β 和 η，要么平滑不足（闪烁），要么过度自信（光照和遮挡事件后的持久鬼影）。若前两个数字任一不满足，该主张即被证伪。", "key_insight": "基础论文的时序机制是两个互不协调的递归。第一个是颜色门控的逐相机 EMA；其掩码下限 M ≥ 0.6 意味着它几乎不做滤波，因此移动的人基本得不到平滑而产生闪烁。第二个把上一帧渲染的新视角深度以至多 η = 15 的权重反馈进 TSDF，而逐视角权重至多为 1。该渲染深度是 TSDF 中已有的同一批逐相机测量的确定性函数。因此反馈它就是“数据乱伦”（data incest，去中心化估计中已知的重复计数）：它在没有新信息的情况下抬高置信度，而正是这种过度自信使误差在颜色掩码漏检的事件后以鬼影形式持续存在。该状态还存在于移动的目标视角中，因此对移动观看者或双眼而言是未定义的。修正方法是把状态放在阵列固定的地方——每个源相机的像素网格中，作为运动补偿的逐像素后验 (μ, σ²)。于是一个后验方差承担三项工作：它设定 TSDF 权重 ω = 1/σ²、逐样本截断 τ = cσ（去掉度量常数 0.02 m），以及一个区分“移动”与“重新光照”的几何 χ² 新息门控。新视角反馈要么被移除，要么仅作为协方差交叉（covariance-intersection）伪测量引入，可证明它不会把方差缩小到逐相机后验以下。于是回路的闪烁-滞后-鬼影行为由稳态 Riccati 增益决定，因此可以预测和调节，而非手工设定。", "method": "状态：对每个固定阵列相机 n，在深度分辨率下维护逐像素后验（μ_n、σ²_n、年龄、运行中的新息统计量）。\n\n(1) 测量。使用两种前端。(a) 快速立体网络（例如 RAFT-Stereo-realtime），在合成数据加阵列自身数据上用 Laplace/Gaussian NLL 方差头微调。(b) 传感器深度（Kinect/Orbbec），采用标准的深度相关噪声模型 σ ∝ z² 加边缘项。\n\n(2) 预测。逐相机光流（RAFT-small 或类似的快速光流网络）加后验深度得到 3D 场景流。用软 z-buffering 前向 splat μ 和 σ²。过程噪声 Q = q0 + q1·‖场景流‖² + q2·光流不确定性。去遮挡像素重置为 σ² = ∞ 的先验。\n\n(3) 更新。增益 K = σ²_pred/(σ²_pred + R)。χ² 新息门控（1 自由度，p = 0.99）在失败时（拓扑变化或遮挡）重置 σ²，并有用于鲁棒性的 Student-t 变体。颜色变化仅用于增大 Q，从不用于判断哪些像素是静态的。\n\n(4) 图像空间 TSDF，保留 Starline/基础论文的 raymarch。逐样本权重 ω_k = 1/σ²_k（截断），逐样本截断 τ_k = clip(c·σ_k, τmin, τmax)，返回的表面还携带融合方差 σ²_TSDF。\n\n(5) 反馈，三种变体：(A) 无；(B) 基础论文的 η 上限反馈，作为参考；(C) 将重投影的上一帧新视角深度与融合的逐相机估计做协方差交叉，通过 TSDF 深度利用目标相机运动进行重投影。\n\n(6) 与基础论文相同的 Blend U-Net，以 σ_TSDF 和新息图作为额外输入。它在 8 帧片段上训练，使用基础损失加光流 warp 时序 L1（单时刻训练是基础论文的缺口）。滤波器本身保持闭式。学习增益的 ConvGRU（在 on-policy rollout 上训练）是一个消融，而非主要结果。\n\n(7) 理论。逐像素地看，回路是一个切换线性系统 x_{t+1} = (1 − K_t)x_t + K_t z_t（+ 反馈项）。稳态 Riccati 增益 K∞(Q, R) 给出鬼影半衰期 h = ln2 / −ln(1 − K∞) 和稳态闪烁方差 K∞R/(2 − K∞)。基础递归的同样代数用（掩码下限、β、η、Σω_k、掩码漏检率 p）表示。一个命题表明，没有协方差交叉（CI）时，反馈比例 η/(η + Σω_k) 充当正反馈置信项，持久性随 p → 1 增长。有 CI 时回路是压缩的，谱半径 ≤ 1 − K_min。\n\n运行时预算：四分之一分辨率光流加后验 splatting 加更新，在 RTX 4090 级 GPU 上 4 视角 1352x1014 约 3-5 ms，而基础 pipeline 使用 TensorRT 约 40 ms。深度估计单独如实报告，不同于基础论文。", "why_not_engineering": "贡献不是“我们插入了一个 Kalman 滤波器”。它依赖于三点。(i) 一个诊断：把渲染几何反馈回自身融合的递归 image-based rendering pipeline 会重复计数证据，而决定鬼影持久性和闪烁行为的是这一点，而非深度噪声。该主张被形式化，并可在事件注入序列上证伪。(ii) 一个单一方差，取代四个互不相关的手工常数（掩码 0.7/0.6、0.001 置信权重、τ = 0.02 m、η = 15），并给出鬼影半衰期和闪烁的闭式预测。(iii) 对显式几何在线 NVS pipeline 进行的首个分钟级、事件注入评估，报告闪烁-滞后-鬼影 Pareto 前沿，而非 100 帧 PSNR。审稿人可以检查理论与测量对比图。工程调整不会伴随一个可能失败的定量预测。", "differentiation": "FILT3R（arXiv 2603.18493, ECCV 2026）和 TTT3R/ReCal3R/TTSA3R 对来自单个移动相机的潜在 CUT3R token 施加 Kalman 或置信度门控，用于位姿和点图。我们不主张 Kalman 门控。我们的状态是显式的，存在于固定标定阵列的像素中，跨相机融合进图像空间 TSDF，并通过渲染的新视角深度反馈。该反馈回路及其重复计数在所有这些工作中都不存在。CODD (2111.09337) 和 Khan et al. CVPR'23（2304.07435，基础论文所在团队）已经对单个立体或单目流做了运动补偿或学习不确定性的时序深度融合。我们引用二者作为逐相机构建模块，区别在于跨相机 TSDF 融合、方差推导的截断、一致的新视角反馈以及渲染。“Rethinking the State Update Gate”（2605.16981）从门控幅值推导潜在递归重建的记忆时程。我们为显式估计器推导半衰期，并在渲染输出中用注入事件验证。NSTM (2607.15271) 已经为在线多视角 NVS 分析了分钟级漂移，使用 256-512 px 的隐式 TTT 记忆和约 1 FPS 的记忆化。我们不主张首个长时程评估，只主张首个针对显式几何实时 IBR、带闪烁、鬼影和滞后指标及理论的评估。若代码可用，我们加入 NSTM 风格记忆作为 baseline。GeoStream (2606.15162) 在生成式视频中点明了几何反馈回路，并用 on-policy 训练修正。我们以解析方式（协方差交叉）修正，不使用生成模型，面向忠实采集。Stereo Any Video / TC-Stereo / Video Depth Anything 提供逐相机时序一致性。我们将它们用作前端，并报告来自跨相机一致状态的剩余增益。"}, "experiments": {"datasets": ["CMU Panoptic Studio：HD 相机加同步 Kinect v2 RGB-D，分钟级序列。真实传感器深度，属于 Holoportation/Starline 类 RGB-D 情形，用于长时程 RGB-D 测试。", "ActorsHQ：160 个相机，多分钟单演员高分辨率序列。可选择立体对，人脸和手部尺寸大，用于人脸和手部闪烁。", "DNA-Rendering 和 MVHumanNet++：多相机人体视频。NSTM 使用 MVHumanNet++ 做分钟级测试，因此可以正面对比。仅 RGB；深度来自在阵列相机中选取的立体对。", "Neural 3D Video / DyNeRF：全部 300 帧，而非仅前 100 帧，以便与基础论文可比（火焰 = 光照变化情形）。", "ENeRF-Outdoor 和 D3DMV：基础论文的测试集，作为短时程 PSNR 未损失的合理性检查。", "PackUV-2B（序列长达 30 分钟，50+ 相机）：若下载规模允许，作为漂移压力测试。仅 RGB。", "带真值深度和真值鬼影起始的合成 Blender 序列：房间中的动画扫描人体（THuman 或类似扫描加重定向动作），注入事件（开关灯、自动曝光渐变、物体出现与移除、无纹理移动物体、某相机丢失 N 帧）。之所以需要，是因为鬼影半衰期需要真值。", "可选自定义采集：4-6 台 Orbbec/Azure Kinect 相机，2-3 段 5 分钟会话，带脚本化的开关灯。能增强远程临场叙事，但核心主张不需要。"], "baselines": ["基础论文（Ha et al. CVPR'25），因无代码发布而忠实重新实现。包括颜色门控 EMA 加 η 上限反馈，在 β 和 η 上扫描以绘制其自身的前沿。", "无状态：相同的 splat、TSDF 和 blend pipeline，无时序状态（滞后的下界，闪烁的上界）。", "带时序一致视频深度前端的基础 pipeline（每对用 Stereo Any Video 或 TC-Stereo；Video Depth Anything streaming 按立体尺度缩放）。这是“状态是否仍有必要”的关键 baseline。", "CODD / Khan'23 风格的逐相机时序融合（运动补偿、学习不确定性）接入 TSDF，但无跨相机一致性。用于隔离来自融合并反馈的状态的增益。", "关键帧重置启发式（周期性或残差触发的重置）。", "在 rollout 上训练的学习式 ConvGRU 增益（Self-Forcing 风格 on-policy 输入），检验学习是否优于闭式解。", "在可运行的情况下：GPS-Gaussian+ 或类似的逐帧 feed-forward 人体渲染器（无状态），以及若代码发布则在 MVHumanNet++ 上以其分辨率运行 NSTM（隐式记忆）。"], "metrics": ["渲染 RGB 和 TSDF 深度的光流 warp 时序误差，总体以及在人脸、手部和背景掩码中（来自现成的人体解析）。", "TCC / STED / SDT，与基础论文相同，以便比较。", "注入事件后的鬼影半衰期和恢复时间：事件区域中深度/RGB 误差降到 50% 和 10% 以下所需的帧数（合成真值；带脚本化事件的真实序列）。", "漂移斜率：误差对时间在 1-10 分钟上的回归。", "滞后：深度响应相对真值运动起始的相位延迟（合成），与闪烁一起绘制闪烁-滞后 Pareto 前沿。", "理论与测量：预测 vs 测得的半衰期与稳态闪烁方差。", "σ 的校准：相对真值深度的 NLL、sparsification/AUSE 和可靠性图。", "留出阵列相机上的 PSNR / SSIM / LPIPS；ColorVideoVDP 作为已有的可微感知视频指标。", "移动观看者协议：阵列相机之间的平滑类头部轨迹，伪 GT 来自逐场景 4DGS 拟合，以及双眼立体一致性。", "运行时间分解，包括深度估计。"], "key_ablations": ["反馈：无 vs 基础 η 上限 vs 协方差交叉。这是核心的重复计数测试，在光照事件和无纹理运动下进行。", "新息门控：几何 χ² 门控 vs 颜色差分掩码 vs 两者，在光照变化、火焰和自动曝光下。", "运动补偿：开/关（关等价于仅静态滤波，与基础相同）vs 光流质量（RAFT-small vs 完整 RAFT vs 真值光流）。", "方差用法：仅 1/σ² 权重、仅自适应 τ、两者，或都不用（基础启发式 7x7 方差与 τ = 0.02 m）。", "前端：带噪逐帧立体 vs 时序一致视频立体 vs 传感器深度。报告有多少增益得以保留。", "闭式 Kalman 增益 vs 学习式 ConvGRU 增益，使用 teacher-forced vs on-policy rollout 训练。", "Blend net 在单时刻上训练（与基础相同）vs 在带时序损失的 8 帧片段上训练，区分几何状态增益与混合增益。", "时程：100 帧 vs 1 分钟 vs 5-10 分钟。"], "needs_custom_capture": false, "capture_notes": "核心主张不需要自定义采集。Panoptic Studio 提供分钟级真实同步 RGB-D。ActorsHQ、DNA-Rendering 和 MVHumanNet++ 提供多相机 RGB，可从中选择立体对。合成 Blender 序列提供任何真实数据集都无法提供的真值鬼影和滞后测量。主要数据风险：(1) Panoptic 的 Kinect v2 深度噪声大，且与 HD 相机仅松散同步（是真实世界噪声情形，但必须检查同步）；(2) 仅 RGB 的数据集需要逐对立体，除非在各方法间固定前端，否则会混淆结果。一个带脚本化开关灯和 5 分钟对话的小型 4-6 相机 RGB-D 阵列（约 $3-5k）会让远程临场主张对 IEEE VR/TVCG 审稿人更有说服力。仅在 2 周测试通过后再搭建。"}, "first_two_week_test": "一个仅几何的测试，不含 blend 网络，也不需训练。(1) 第 1-4 天：用 PyTorch/CUDA 或纯 PyTorch 重新实现基础论文的逐相机颜色门控 EMA、图像空间 TSDF raymarch 和 η 上限的上一帧新视角反馈；不需要实时速度。同时实现带 RAFT 光流的逐相机运动补偿 Kalman 状态、1/σ² 权重、τ = cσ、χ² 门控和协方差交叉反馈。测量方差使用简单的启发式 σ（立体左右一致性，或 Kinect z² 模型）；学习留到以后。(2) 第 5-8 天：数据。(a) 3-4 个合成 Blender 序列（房间中的扫描人体、4 个相机、1-2 分钟），带真值深度和注入事件：开关灯、物体移除、无纹理移动箱子。(b) 2 个各约 2 分钟的 Panoptic Kinect 序列。(3) 第 9-12 天：在留出相机和移动虚拟轨迹上为三个 pipeline 渲染 TSDF 深度（基础在 β ∈ {0.5, 1, 2} 和 η ∈ {5, 15, 30} 上扫描、无状态、以及我们的方法带与不带 CI 反馈），每个都分别使用原始立体深度和时序一致视频立体前端。测量动态区域（人脸/手部）光流 warp 深度误差、每个事件后的鬼影半衰期、运动起始时的滞后以及闪烁-滞后前沿。计算闭式预测半衰期。(4) 第 13-14 天：决策。若满足以下条件则继续：我们的方法支配基础前沿（相同滞后下动态区域闪烁至少低 25%，或相同闪烁下鬼影明显更短）；在视频立体前端下保留至少 15% 的增益；在至少一种事件类型下显示基础反馈存在可测量的鬼影或过度自信失败；且预测半衰期与测量值在 ±30% 以内。使用 TSDF 深度而非 RGB 是有意为之。它更便宜，而且如果几何状态增益在那里不存在，blend 网络也不会凭空创造它。", "kill_criteria": "若 2 周测试后出现以下任一情况，则放弃方法论文，或将分析并入 benchmark 或感知指标论文。\n\n(a) 在时序一致视频立体前端（Stereo Any Video / TC-Stereo）下，递归状态相对无状态 pipeline 在相同滞后下使动态区域 TSDF 深度闪烁降低不足 15%。那说明视频立体已经吸收了该问题。\n\n(b) 在 β/η 扫描中，基础递归已位于我们的前沿上或其 10% 以内，且没有任何事件类型下其反馈产生比 CI 或无反馈明显更长的鬼影。那说明重复计数诊断在经验上无关紧要。\n\n(c) 即使使用真值光流，合成序列上测得的鬼影半衰期和闪烁与闭式预测偏差超过 50%。那说明理论只是装饰，论文退化为 CODD+Khan'23+Starline。\n\n(d) 分钟级运行在任何 pipeline 中都未显示漂移或鬼影累积。那说明“长时程”不是一个值得写论文的问题。\n\n此外，若到第 4 个月，渲染 RGB 闪烁增益（光流 warp 误差、ColorVideoVDP）低于 10% 而深度增益存在，也应终止，因为 blend net 会掩盖几何改进。每月重新检查 arXiv，关注是否有 Starline/Meta/Google 的后续工作分析 image-TSDF pipeline 中的反馈。", "reviewer_objections": [{"objection": "这是深度的 Kalman 滤波，自 Matthies-Kanade 以来就是教科书内容。CODD 和 Khan et al. CVPR'23 已经做了运动补偿或不确定性加权的时序深度融合，FILT3R 为流式 3D 做了 Kalman 状态更新。有什么新东西？", "rebuttal": "我们不主张这些组件中的任何一个，并显著引用了全部三者。新的是：(i) 将渲染的新视角几何反馈回多视角融合状态的重复计数诊断，以及可证明防止过度自信的协方差交叉修正；(ii) 在跨相机图像空间 TSDF 中，一个后验方差同时设定 TSDF 权重、截断和几何门控；(iii) 闭式的闪烁、滞后和鬼影预测，在真实帧率下以注入事件在分钟尺度上验证。一个消融把 CODD/Khan 风格的逐相机滤波器接入同一 TSDF，但不含跨相机一致性或 CI 反馈，并展示剩余增益。"}, {"objection": "所谓“理论”只是一个标量稳态 Kalman 增益。这很平凡，而且忽略遮挡和拓扑变化的线性化对真实失败毫无解释力。", "rebuttal": "标量情形是刻意保持简单的，以便其预测可被证伪。非平凡部分在于切换系统（门控重置、K 近邻视角集合随观看者运动变化、掩码漏检率 p 驱动持久性），以及 η 上限反馈充当正置信回路的证明。遮挡和拓扑变化被显式处理为由新息门控触发的重置，并且我们报告预测失效的区间（快速手部、细结构）。论文的证据是预测与测量对比图，而非代数。"}, {"objection": "时序一致的视频立体和深度基础模型使显式时序状态变得不必要。有了更好的前端，整个贡献就会消失。", "rebuttal": "我们将其作为一等实验，而非隐藏它。每种方法都用原始逐帧立体、视频立体和传感器深度运行。逐对视频立体在时间上一致，但在相机之间不一致，因此观看者运动下的视角集合切换和跨相机不一致仍会在融合 TSDF 中产生闪烁。我们的终止标准要求在该前端下保留至少 15% 的增益。传感器深度阵列（Kinect/Orbbec，Starline 类）根本没有时序模型。"}, {"objection": "这是一个小众 pipeline（Starline 风格 image TSDF 加没有公开代码的基础论文）。重新实现可能不忠实，而且在单一方法之外的相关性不明确。", "rebuttal": "重新实现将被发布，并且在提出任何主张之前，我们会在声明的容差内复现基础论文报告的 DyNeRF/ENeRF/D3DMV 数值。状态模块与 pipeline 无关。它输出逐相机 (μ, σ²) 和带方差的融合 TSDF 深度，我们将其接入第二个无状态 feed-forward 渲染器（GPS-Gaussian+ 风格）以展示迁移性。作为目标应用的 Starline 类 RGB-D 远程临场系统都共享这种递归融合结构。"}, {"objection": "增益只体现在自定义时序指标上。PSNR 不变，也没有证据表明观看者能察觉。", "rebuttal": "我们在新的鬼影和滞后指标之外同时报告已确立的指标（TCC/STED、光流 warp 误差、ColorVideoVDP）。我们还在带人脸和手部特写的分钟级片段上进行小规模 2AFC 偏好研究（n ≈ 15-20，桌面加 HMD）。PSNR 不变是预期之中的，其本身也很有信息量：它解释了基础论文 TSDF 消融无差异的结果（31.17 vs 31.16 dB），因为逐帧指标看不到时序状态带来的收益。"}], "synergies": "(1) 感知/HMD 闪烁指标（本簇中的构想 3 以及任何心理物理学簇）。校准的 TFV 指标将取代此处临时的闪烁代理指标，并把 Pareto 前沿变成感知前沿；二者合在一起可形成一篇 TVCG/IEEE VR 论文，或共享数据的两篇论文。(2) 长时程远程临场 benchmark / 数据集簇。事件注入合成套件和分钟级协议是天然的 benchmark 组件，可由本项目产出一篇 benchmark 论文。(3) 面向标定阵列的视频立体 / 几何基础模型前端。逐相机 σ 输出正是一个阵列感知深度模型应当提供的。(4) 移动观看者 / 立体 HMD 渲染与延迟补偿。Kalman 预测步给出前向外推深度，用于 motion-to-photon 补偿；源相机状态与观看者无关，因此双眼和多个观看者可以共享。(5) 流式传输与压缩。后验方差和新息图是对深度和高斯流进行码率分配或关键帧选取的天然信号。(6) 显式加学习的混合记忆（以显式几何状态为条件的 NSTM 风格 TTT 记忆）。显式后验可作为隐式记忆所缺乏的稳定锚点。", "effort": {"months": "6-8（2 周 go/no-go；约 2 个月重新实现和滤波器；2 个月长时程 benchmark 与理论验证；1-2 个月 blend-net 视频训练、用户研究和写作）", "people": "1 名全职博士生加 1 名兼职人员（理论/估计方向，或熟悉 CUDA 的工程师）；具有状态估计背景的导师会有帮助", "compute": "1-4 块 24-48 GB GPU（RTX 4090/A6000/A100 级）。滤波器无需训练。方差头微调和 8 帧 blend-net 训练每次运行约 1-3 GPU 日，外加 Panoptic/ActorsHQ/MVHumanNet++ 子集约 1-2 TB 存储。可选 RGB-D 阵列约 $3-5k。"}, "venue": "首选：ICCV 2027 或 3DV 2027（方法加分析）。备选或替代：若 HMD 用户研究和自定义 RGB-D 采集足够强，则投 IEEE TVCG / IEEE VR 2027。除非与感知指标工作合并，否则不投 SIGGRAPH。", "novelty": {"verdict": "partially_scooped", "remaining_novel_angle": "C09 的每个构建模块都已在别处发表。用于长时程稳定性的 Kalman 增益状态更新已被占据（FILT3R, ECCV 2026）。运动补偿的递归深度融合已被占据（CODD）。带偶然（aleatoric）不确定性融合权重的学习式动态掩码已被占据，且由基础论文自己的团队完成（Khan et al., CVPR 2023）。由门控推导的记忆时程分析已被占据（Rethinking the State Update Gate, 2026）。通过几何反馈回路的 on-policy 训练已被占据（GeoStream）。在线多视角 NVS 的分钟级漂移分析已被占据（NSTM）。可微学习式 TSDF 融合（NeuralFusion）和可微感知视频损失（ColorVideoVDP）已被占据。\n\n仍可辩护的是面向几何引导 IBR 的显式、像素空间版本。其状态是一个在（逐相机滤波深度、图像空间 TSDF 权重、重新注入的上一帧新视角深度）上的闭环递归。其后验方差同时承担三项工作：设定 TSDF 权重、设定深度相关截断，以及提供区分运动与重新光照的几何（而非光度）新息门控。该递归随后获得一个可证明的压缩或鬼影半衰期界，并在真实帧率下以分钟尺度、以闪烁和鬼影指标、在移动观看者下得到验证。检索到的工作中没有一个分析渲染的新视角深度反馈进融合状态的问题，也没有一个为显式几何在线 NVS pipeline 给出稳定性保证。一个次要的独立角度是远程临场特定的心理物理闪烁阈值（HMD；人脸、手部、离心率；真实 IBR 伪影），既用作指标也用作损失。", "threats": [{"title": "FILT3R: Latent State Adaptive Kalman Filter for Streaming 3D Reconstruction", "url": "https://arxiv.org/abs/2603.18493", "year": "2026", "venue": "ECCV 2026", "overlap": "high", "what_overlaps": "将流式 3D 重建的递归状态更新重新表述为 Kalman 滤波。它保持逐元素方差和在线估计的过程噪声，所得增益随不确定性收缩而减小、在场景变化时增大。其明确目标是超越训练时程的长时程稳定性，覆写/门控策略作为特例被恢复。这是构想 1 和 2 的概念核心：以稳定性为依据、用 Kalman 增益取代启发式门控。", "what_remains_different": "它对来自单个移动相机的潜在 CUT3R token 做滤波。没有像素/图像空间深度状态、没有场景流运动补偿、没有多视角 TSDF、没有渲染或 NVS，也没有闪烁指标。"}, {"title": "Temporally Consistent Online Depth Estimation Using Point-Based Fusion (Khan, Penner, Lanman, Xiao; the base paper's group)", "url": "https://arxiv.org/abs/2304.07435", "year": "2023", "venue": "CVPR 2023", "overlap": "high", "what_overlaps": "已经用学习式动态掩码 alpha 取代了手工设定的静态/动态混合。它在图像空间中以来自学习偶然不确定性（exp(-Phi)）的权重融合深度，并维护一个持久的全局点云状态。这移除了构想 1 中“学习方差取代手调权重”和“学习门控”的主张，以及构想 3 中的“学习门控”。", "what_remains_different": "运动区域直接采用当前估计（没有运动补偿预测，也没有 Kalman/新息测试）。它仅是单目或立体深度，没有多视角图像空间 TSDF、没有新视角渲染、没有方差推导的截断，也没有稳定性分析。"}, {"title": "CODD: Temporally Consistent Online Depth Estimation in Dynamic Scenes", "url": "https://arxiv.org/abs/2111.09337", "year": "2021/2023", "venue": "WACV 2023", "overlap": "high", "what_overlaps": "其运动网络预测对齐先前观测的逐像素 SE3 变换（场景流），然后由学习式融合网络聚合过去与当前视差，以在动态区域实现时序一致性。这就是构想 1 的运动补偿递归深度滤波器，包括其“学习式 ConvGRU 增益”变体。", "what_remains_different": "它作用于单个立体对，没有显式高斯方差或卡方新息门控。没有跨相机 TSDF 融合、没有渲染，也没有长时程稳定性研究。"}, {"title": "Rethinking the State Update Gate for Long-Sequence Recurrent 3D Reconstruction", "url": "https://arxiv.org/abs/2605.16981", "year": "2026", "venue": "arXiv", "overlap": "medium", "what_overlaps": "将递归 3D 重建的门控作为记忆系统进行剖析，并从门控幅值推导出每个状态 token 约 3 帧的有效记忆时程。随后提出一个原则性的帧级门控（关键帧选择的松弛），并在长达 4,541 帧的序列上评估。这在方法上接近构想 2 的“由门控/谱半径得出鬼影半衰期”诊断。", "what_remains_different": "它无需训练，使用来自单个移动相机的潜在状态，目标是位姿和深度而非渲染外观。没有显式 TSDF、没有渲染深度反馈回路、没有压缩界，也没有闪烁或鬼影指标。"}, {"title": "TTT3R / TTSA3R / ReCal3R / Mem3R family (confidence-calibrated state updates for streaming reconstruction)", "url": "https://arxiv.org/abs/2607.05356", "year": "2025-2026", "venue": "ICLR 2026 (TTT3R); arXiv (TTSA3R 2601.22615, ReCal3R 2607.05356, Mem3R 2604.07279)", "overlap": "medium", "what_overlaps": "它们共同确立了置信度或可靠性门控的状态更新可以修复长时程漂移和遗忘，并以长序列漂移曲线作为评估。因此构想 2 的“置信度门控状态更新修复漂移”已是标准做法。", "what_remains_different": "全部作用于用于位姿和点图估计的潜在 token。没有一个具有显式图像空间几何、渲染、多视角采集阵列或形式化的压缩保证。"}]}}, {"id": "C18", "name": "Error-propagation theory of when geometry-guided IBR beats learned renderers (bias/variance, flicker)", "decision": "pursue_with_repositioning", "scores": {"novelty": 5, "significance": 5, "feasibility": 7, "telepresence_fit": 6, "overall": 5}, "sharpened": {"title_zh": "几何引导视图合成的闪烁预算：深度误差的时间偏差-方差传播，以及学习型渲染器何时胜出", "title_en": "A Flicker Budget for Geometry-Guided View Synthesis: Temporal Bias-Variance Propagation of Depth Error, and When Learned Renderers Win", "one_liner": "我们把经典的 DIBR 合成失真静态模型扩展到时间维度和学习型渲染器。扩展后的模型能根据深度误差统计量预测逐像素保真度误差和闪烁，并预测几何引导渲染器与学习型渲染器的交叉点。由此得到两个设计工具：一个 Kalman 最优的时间深度滤波器，以及一个相机阵列/传感器闪烁计算器。", "core_claim": "将逐像素深度误差拆分为时间上静态的偏差和 AR(1) 相关的波动（方差 sigma_nu^2，相关系数 rho），并在遮挡处加入可见性翻转项。于是一个闭式一阶模型可以做到两件事。(i) 在合成数据和真实 ActorsHQ 图像上超过 1000 个受控配置中，它以 R^2 >= 0.8 预测 K 视图 warp-and-blend 渲染器实测的帧 MSE 和帧差闪烁能量，而静态失真模型（Kim-Ortega 2009、Fang 2014）预测闪烁的 R^2 < 0.5。(ii) 它预测时间滤波和 TSDF 融合带来的 PSNR 变化及 STED/warping 误差变化：PSNR 增益约为 10log10((b^2+v)/(b^2+gamma*v))，偏差主导时接近零；而闪烁约按 gamma*(1-rho_eff)*v 缩放。该模型能在随机种子方差范围内解释基础论文的消融模式（PSNR 无变化，STED 变化大）。(iii) 给定每个渲染器的两个测量量——偏差图和噪声传递增益——它能预测几何引导渲染器不再优于学习型或无几何渲染器的深度噪声水平 sigma_z*，在至少 75% 的留出配置上误差在 1.5 倍以内。其中任何一条不成立即证伪该主张。", "key_insight": "PSNR 和闪烁指标度量的是同一误差过程的不同矩。帧 MSE 是 bias^2 + variance。帧差指标（STED、光流 warping 误差、TCC）只看到方差中去相关的部分 2(1-rho)v，外加视图集切换。深度一致性机制（EMA 滤波、TSDF、上一帧反馈）是一个具有可计算增益 gamma 的方差缩减器，永远不触及偏差。因此只要 bias^2 >> v（即基础论文的情形），它在 PSNR 上就应当不可见。于是渲染器可以用两个可测量的量而非架构来比较。几何引导 warp 偏差低但增益高：其增益按 ||grad I|| * f * b_eff / z^2 缩放。学习型和无几何渲染器偏差较高（向条件均值模糊）而增益较低。由此得到每个像素类别的闭式交叉点 sigma_z*^2 = (b_L^2 + V_L - b_G^2)/G_G^2。同一分解还给出每个像素的最小方差时间滤波增益，取代人工设定的下限 M >= 0.6。", "method": "理论。目标颜色为 I_hat(x,t) = sum_k w_k I_k(pi_k(X + eps_k))。在真实表面附近线性化。逐视图位移为 du_k = J_k eps_k，其中 ||J_k|| ~ f*b_eff,k/z^2，含倾斜项。逐视图深度误差为 eps_k(x,t) = beta_k(x) + nu_k(x,t)，其中 nu 是参数为 (sigma_nu, rho) 的 AR(1)，跨视图相关性 c 是显式参数；c 很重要，因为只有视图误差去相关时 TSDF 平均才有帮助。闭式结果：E[e^2] = bias^2 + v；闪烁能量 F = E[(e_t - e_{t-1})^2] = 2(1-rho)v + 移动观看者的 K 集合切换项。另加三项。(a) 遮挡：Bernoulli 可见性翻转项 p(1-p)*Delta_c^2，其中 p = Phi(depth_gap/sigma_z)。(b) 视角相关性：随源-目标夹角乘以镜面瓣锐度增长的颜色差异。(c) 算子：下限为 alpha 的 EMA 滤波给出 gamma_EMA = alpha/(2-alpha) * (1+(1-alpha)rho)/(1-(1-alpha)rho)；image-based TSDF 是带截断裁剪的 K 视图加权平均；学习到的融合权重逐像素视为固定，其时间变化单独测量。学习型渲染器通过经验刻画，而非抽象建模。偏差图来自 GT 深度或干净输入与 GT 图像的比较。噪声传递增益 G 来自对输出关于输入深度和图像扰动的有限差分或 JVP 探测（Hutchinson 估计，每帧约 32 次探测）。固有时间方差 V_L 来自相同输入的抖动。覆盖 ENeRF、GPS-Gaussian、IBRNet，以及在相同数据上训练的一个小型无几何 LVSM 类模型。真实数据上的参数估计：sigma_nu、rho 和 c 由真实双目和 ToF 流（RAFT-Stereo、FoundationStereo 类、Stereo Any Video、Kinect）拟合，在 ActorsHQ 上对照网格 GT，在 DyNeRF 上对照静态区域统计量。应用（为推导所得，并非核心新颖性）。(1) 逐像素最小 MSE 时间滤波器（由估计的 v、运动概率和 rho 得到的标量 Kalman 增益），可直接替换基础论文的颜色差 EMA，GPU 上每帧开销低于 1 ms。(2) 相机阵列/传感器闪烁计算器：给定 sigma_z(z)（双目 sigma_z = z^2 sigma_d/(f B)，或 ToF 模型）、相机数量、基线和观看体积，输出预测的保真度/闪烁图，以及达到闪烁目标所需的最小 K 或相机密度。(3) 可选的逐像素交叉点图（原 Geometry Advantage Index），用于在几何引导与学习型输出之间路由。只有 (1) 和 (2) 是核心结果。分析离线进行；唯一的运行时组件是滤波器 (1)。", "why_not_engineering": "交付物是一个带闭式解、可证伪的预测模型，而不是管线微调。它在做任何实验之前就给出定量预测：滤波带来的 PSNR 变化和闪烁变化、交叉点 sigma_z*，以及达到闪烁目标所需的最小相机数。它解决了文献中一个观察到的矛盾：一致性机制改善时间指标却使 PSNR 不变，而 TCC 不敏感。它还把两个人工调节的启发式——掩码下限和固定 K——变成可推导的量。检验标准是在超过 1000 个配置和多个渲染器家族上，测量值是否落在预测曲线上。这是分析型论文的标准，而非系统论文的标准。", "differentiation": "Kim & Ortega (ICIP 2009)、Fang et al. (TIP 2014)、TIP 2016 虚拟视点位置模型以及 Bi & Liang (arXiv 2510.17037) 将静态合成视图失真建模为深度误差乘以纹理梯度乘以基线，用于 2 视图 DIBR 编码。我们引用它们作为一阶构件，并加入时间统计量（偏差 vs AR(1) 方差、跨视图相关性、K 集合切换）、遮挡翻转、K 视图学习型融合以及学习型渲染器。我们通过实验表明它们的静态模型无法预测闪烁。Pujades et al. (CVPR 2014) 针对单个静态帧从几何不确定性推导融合权重；我们是时间性的，推导的是滤波增益而非融合权重。Lin & Shum (IJCV 2004) 和 Plenoptic Sampling 是静态采样界；我们的阵列计算器面向真实传感器噪声模型下的时间闪烁预算。Liu et al. (TIP 2015) 和时间 IV-PSNR 指标在经验上把闪烁与空间失真区分开；我们给出生成式解释，说明各指标为何响应哪个误差矩。LVSM、SVSM 和“From Rays to Projections”论文（arXiv 2601.05116，已核查）在静态基准上以经验方式主张减少 3D 偏置，没有时间分析，也没有交叉点分析。基础论文 (arXiv 2505.18932) 和 3DTV (arXiv 2604.11211) 是该模型所分析的实例。"}, "experiments": {"datasets": ["用 Blender 或 Kubric 渲染的合成受控套件：带 GT 深度、法线和 BRDF 粗糙度扫描的动画人体和物体，4-24 台相机的虚拟阵列，基线 0.1-1 m，注入可控偏差、sigma_nu、rho 和跨视图相关性的深度噪声。超过 1000 个配置；主要验证平台。", "ActorsHQ（HumanRF, arXiv 2305.06356；已核实 160 台相机、12 MP、逐帧网格重建）：带网格导出深度的真实图像。对相机下采样以模拟 4-16 台相机的远程呈现阵列。以接近 GT 的几何进行真实图像验证。", "DyNeRF / Neural 3D Video：用多个随机种子复现基础论文的 TSDF 和时间滤波消融，检验预测的 PSNR 和 STED 变化。真实双目深度，无 GT 深度，因此使用静态区域统计量。", "ENeRF-Outdoor：大 z、远背景区域。检验 ENeRF 胜过几何引导管线的预测交叉点（基础论文 Table 2）。", "DNA-Rendering 和/或 MVHumanNet：服装有镜面反射、视角多的人体数据，用于视角相关项和学习型渲染器探测的泛化。需检查许可和下载可用性。", "CMU Panoptic Kinect 子集：为阵列/传感器计算器提供真实 ToF 传感器噪声统计。需核实同步的 Kinect 流和标定仍可下载。", "D3DMV（基础论文的第三个数据集），为完整性可选。"], "baselines": ["分阶段重实现基础管线：距离融合，然后 + 学习型融合网络、+ 时间滤波、+ image-based TSDF、+ 上一帧反馈。没有官方代码，必须重实现。", "ENeRF（深度引导的学习型渲染器）", "GPS-Gaussian（像素对齐 Gaussian，人体阵列）", "IBRNet（学习型 IBR）", "无几何 LVSM 类渲染器（Efficient-LVSM，或在相同合成与 ActorsHQ 数据上以 256-512 px 重训的小型 LVSM/SVSM）", "3DTV (arXiv 2604.11211)，若有代码", "预测器基线：静态失真模型（Kim-Ortega 2009；Fang et al. TIP 2014）、Pujades 2014 不确定性权重，以及一个学习型无参考闪烁预测器（在相同特征上训练的小 CNN），作为理论的上界检验", "滤波器基线：基础论文的颜色差 EMA（M >= 0.6）、固定增益 Kalman 滤波器，以及应用于渲染器输出的后处理视频去闪烁方法"], "metrics": ["帧 MSE、bias^2、方差和闪烁能量的预测-实测 R^2 与回归斜率，按区域（可见、遮挡边界、去遮挡）", "交叉点预测：|log(sigma_z*_pred / sigma_z*_meas)| 及落在 1.5 倍以内的比例", "保真度：PSNR、SSIM、LPIPS", "时间：STED、TCC（同基础论文）、基于光流的 warping 误差（Lai et al. 2018）、时间 IV-PSNR，以及 x-t 切片方差", "滤波器应用：匹配 PSNR 下的 STED 和 warping 误差，以及每帧毫秒数", "阵列计算器：在 ActorsHQ 和 DyNeRF 相机子集上，对达到闪烁目标所需最小相机数的预测与实测对比", "所有真实数据结果至少 3 个随机种子，并给出置信区间"], "key_ablations": ["一阶仅可见区域模型 vs + 遮挡可见性翻转项 vs + 视角相关项：每项解释了多少方差，按区域", "i.i.d. 时间噪声 vs AR(1) (rho) vs AR(1) + 跨视图相关性 c（检验“TSDF 仅在去相关时有帮助”的预测）", "静止观看者 vs 移动观看者，有无 K 集合切换项", "学习型渲染器仅以偏差刻画 vs 偏差 + 增益 vs 偏差 + 增益 + 固有方差", "合成注入噪声 vs 拟合参数的真实双目/ToF 估计器噪声（理论能否迁移到结构化的真实误差？）", "理论最优逐像素滤波增益 vs 基础论文启发式 vs 以 GT 调优的 oracle 增益", "预测对 sigma_nu 和 rho 估计误差的敏感性（计算器的鲁棒性）"], "needs_custom_capture": false, "capture_notes": "核心论文无需自采数据。合成场景提供完全可控性。ActorsHQ 提供带网格 GT 深度的真实图像。DyNeRF、ENeRF-Outdoor 和 DNA-Rendering 覆盖真实渲染器的各种工况。Panoptic Kinect 提供真实 ToF 噪声。一个可选的小型阵列（4-6 台相机加 1-2 台双目或 ToF 传感器，约 2 周）可通过前瞻性测试加强阵列计算器主张：先预测达到闪烁目标所需的相机数，再实际搭建并测量。仅当期刊或 IEEE VR 版本需要硬件验证时才值得做。"}, "first_two_week_test": "第 1 周。在两段 ActorsHQ 序列（8 相机子集，100 帧，深度由提供的网格渲染）和一个带动画角色的 Blender 场景上，实现一个最小的 K=4 前向 warp-and-blend 渲染器，使用角度/距离权重和可选 EMA 滤波。纯 PyTorch，约 3 天。在网格上注入深度噪声 eps = beta + nu(t)：sigma_beta 和 sigma_nu 各取 {0, 0.5, 1, 2, 4} cm，rho 取 {0, 0.5, 0.9}，三种基线，有无 EMA（alpha = 0.6）。约 150 个配置，每个在单张 GPU 上耗时几分钟。由 GT 梯度、b_eff 和 z 逐像素计算 MSE、bias^2、方差和闪烁能量的闭式预测。按区域报告 R^2。\n\n第 2 周。(a) 检验核心预测。对每个配置，预测开启 EMA 带来的 PSNR 变化和闪烁变化，并与实测比较。目标模式即基础论文的模式：当 bias^2/v > 3 时，PSNR 变化低于 0.1 dB 而闪烁大幅下降。(b) 用有限差分深度和图像扰动探测一个预训练的 GPS-Gaussian（人体阵列）或 ENeRF，在相同帧上估计其偏差和增益。预测 sigma_z* 并与沿噪声扫描实测的交叉点比较。(c) 拟合 Fang/Kim-Ortega 静态模型作为闪烁的基线预测器。\n\n继续的条件：可见区域闪烁 R^2 >= 0.8，整体 >= 0.65；预测的滤波 PSNR 变化误差在 0.2 dB 以内，闪烁变化误差在 25% 以内；静态模型在闪烁上明显更差（R^2 至少低 0.25）；GPS-Gaussian 实测增益跨帧稳定（CV < 30%）。", "kill_criteria": "出现以下任一情况即终止，或降级为 workshop 短文。(1) 即便在可见区域闪烁 R^2 < 0.6，意味着一阶时间模型不具预测力。(2) 遮挡边界和去遮挡像素承载超过 60% 的闪烁能量，且 Bernoulli 可见性翻转项无法把整体 R^2 提高到 0.65 以上。(3) 带朴素逐帧方差代入的静态 Fang/Kim-Ortega 模型预测闪烁与我们一样好（R^2 差距 < 0.1）；此时时间扩展是平凡的，新颖性坍缩为先前工作。(4) 学习型渲染器的噪声传递增益或偏差在场景或帧之间变化过大（CV > 50%），导致交叉点预测在超过一半配置上偏差超过 2 倍。(5) 在 ActorsHQ 的真实双目误差上，拟合的 AR(1)+偏差模型解释的实测误差自协方差不足 50%。(6) 理论最优滤波器在匹配 PSNR 下的光流 warping 误差上未能胜过基础论文启发式，失去实际收益。(7) 同期论文（需检查 MPEG MIV/沉浸式视频和编码文献，此前的检索因 API 限流未能完全覆盖）已发表了带闪烁预测的时间偏差/方差合成失真模型。", "reviewer_objections": [{"objection": "核心传播模型——位移 ~ f*b*eps/z^2 乘以纹理梯度——是教科书级的 DIBR 失真建模（Kim-Ortega 2009、Fang TIP 2014、Pujades CVPR 2014）。这是旧调重弹。", "rebuttal": "我们引用这些工作作为一阶构件，对其不作任何主张。贡献在于时间矩（偏差 vs AR(1) 方差、跨视图相关性、K 集合切换）、滤波器和 TSDF 的算子增益、遮挡翻转，以及学习型渲染器交叉点。正面对比实验显示，静态模型预测闪烁的 R^2 低于 0.5，而我们的为 0.8 或以上，且静态模型无法解释 PSNR/STED 的分离现象。"}, {"objection": "线性化恰恰在误差集中之处失效：遮挡边界、去遮挡、细结构和镜面表面。", "rebuttal": "模型包含显式的可见性翻转（Bernoulli）项和视角相关项。结果按区域（可见、边界、去遮挡）报告解释方差，读者可以看到理论在哪里成立、在哪里退化。终止条件已预先登记：若边界占主导且翻转项失效，我们会如实说明。"}, {"objection": "用一个玩具估计器不可能有意义地“建模”学习型或无几何 transformer；交叉点主张是空谈。", "rebuttal": "我们不对学习型渲染器做抽象。每个渲染器都以三个测量量经验刻画：偏差图、由 JVP 或有限差分探测得到的噪声传递增益，以及固有时间方差。理论只需这些量即可预测交叉点 sigma_z*，随后在四个渲染器家族的留出噪声水平和场景上检验。"}, {"objection": "合成的 i.i.d. 或 AR(1) 深度噪声不真实；真实双目误差是结构化、沿边缘分布且依赖内容的。", "rebuttal": "噪声参数由真实估计器（RAFT-Stereo、FoundationStereo 类模型、Stereo Any Video、Kinect ToF）在 ActorsHQ 上对照网格 GT 拟合，包括空间变化的偏差图。一项专门的消融比较注入误差与真实估计器误差。理论使用的是逐像素统计量，而非全局噪声模型。"}, {"objection": "一篇没有新 SOTA 方法的分析论文；作为动机的谜题只建立在一次未复现的消融上。", "rebuttal": "我们用多个随机种子重跑该消融；理论的预测并不依赖于这个谜题有多大。理论带来两个具体收益：一个逐像素最小 MSE 时间滤波器，以低于 1 ms 的开销在匹配 PSNR 下降低 warping 误差；以及一个在相机子集上验证过的阵列/传感器计算器。两者都是远程呈现系统构建者目前缺少的实用工具。"}], "synergies": "(1) 不确定性感知的深度融合与时间一致的视频双目（Stereo Any Video、流式几何基础模型）：理论指出应当减少哪个误差矩（去相关方差 vs 偏差）并给出 Kalman 增益，因此可作为学习型时间深度滤波方法论文的分析部分。(2) 时间一致性基准与指标：它解释了为何 PSNR 和 TCC 对一致性机制不敏感，从而为新的闪烁敏感指标套件（如 warping 误差或时间 IV-PSNR）提供依据。(3) 带 TSDF 先验的混合几何引导 transformer 渲染器（LVSM/SVSM）：交叉点图指示在哪里投入神经计算或路由像素。(4) 压缩感知的 RGB-D 远程呈现：编解码器引入的深度噪声以已知频谱作为 nu 进入模型，从而可针对闪烁目标进行码率分配。(5) 移动和双目观看者：K 集合切换项可预测视角变化闪烁和左右眼不一致。(6) 置信度门控的生成式修复器：预测的逐像素方差和偏差可作为免费且有原理支撑的置信度信号。最佳包装是两篇论文的系列。论文 A 为本分析加最优滤波器。论文 B 为方法论文（学习型时间状态或不确定性感知融合），以论文 A 的预测作为设计依据和评估协议。", "effort": {"months": "6-8（2 个月用于理论加 2 周关卡测试，2-3 个月用于基础管线重实现和渲染器探测，2 个月用于真实数据验证、滤波器和阵列计算器）", "people": "1 名具备扎实数学和统计背景的博士生，加 0.5 名第二人员负责渲染器重实现、重训和合成数据生成器", "compute": "2-4 张 GPU（24-80 GB）用于扫描和探测；以 256-512 px 重训一个小型 LVSM 类无几何模型，约需 4-8 张 A100 级 GPU 运行 1-2 周。合成渲染在 CPU/GPU 集群上进行，约 1-2 TB 存储。"}, "venue": "首选：ICCV 2027（截稿约 2027 年 3 月），定位为分析论文，以理论最优滤波器和阵列计算器作为经验证的应用。CVPR 2027（2026 年 11 月）太早，来不及完成完整验证。备选：3DV 2028，或 IEEE TVCG（期刊，或 IEEE VR/ISMAR 期刊轨道），那里看重远程呈现的阵列设计角度，理论性强且验证充分的论文表现良好。包含渲染器交叉点和阵列计算器的完整版本适合 TPAMI。", "novelty": {"verdict": "partially_scooped", "remaining_novel_angle": "静态一阶核心并不新。位移 ~ f·b·ε_z/z² 乘以纹理梯度、其对基线的依赖，以及由深度不确定性导出的融合权重，已在 3D 视频编码文献（Kim & Ortega 2009；Fang et al. TIP 2014；TIP 2016；D-NOSE 2011；Bi & Liang 2025）、Pujades et al. CVPR 2014 和 Lin & Shum IJCV 2004 中确立。DIBR 质量评估文献（Liu et al. TIP 2015；ICIP 2016）已在经验上把闪烁与空间失真区分开。\n\n我没有找到（包括 2024-2026 年）以下内容：\n(a) 多视角深度误差的时间偏差/方差分解，带自相关和 K 集合视图切换，分别预测 PSNR（偏差）和闪烁指标（STED、TCC；方差）；\n(b) 对带学习型融合权重的在线 K 视图 IBR 中时间滤波和 TSDF 融合的解析刻画（它们减少方差，而非偏差）；\n(c) 几何引导 warp-and-blend 与学习型或无几何渲染器（LVSM 类、ENeRF、GPS-Gaussian）之间的形式化交叉点，将后者建模为条件均值估计器，并通过合成动态场景上的受控深度噪声扫描验证；\n(d) 由理论导出的逐像素 Geometry Advantage Index，以及面向闪烁目标的相机阵列与传感器设计指南。\n\n论文必须定位为将经典 DIBR 合成失真模型扩展到时间统计量和学习型渲染器，引用 Fang 2014、Kim-Ortega 2009 和 Pujades 2014，而不是声称传播模型本身。两点注意。作为动机的“谜题”建立在一次未复现的 DyNeRF 消融上，其中只有 STED 发生变化。单独的 GAI 混合路由器与现有置信度门控混合方法很接近。覆盖范围注意：WebSearch 已用尽，Semantic Scholar、OpenAlex 和 arXiv API 被限流，因此可能遗漏了沉浸式视频（MPEG MIV）或编码社区的同期分析论文。", "threats": [{"title": "Bayesian View Synthesis and Image-Based Rendering Principles (Pujades, Devernay, Goldluecke)", "url": "https://openaccess.thecvf.com/content_cvpr_2014/html/Pujades_Bayesian_View_Synthesis_2014_CVPR_paper.html", "venue": "CVPR", "year": "2014", "overlap": "high", "what_overlaps": "一个基于物理的 IBR 生成模型，系统地考虑了几何代理不确定性引入的误差。它推导出融合权重（MAP 估计），并解析地解释了 ULR 启发式。这覆盖了“从几何不确定性到 K 视图融合的误差传播”这一核心，并直接削弱了“ULR 式融合只有启发式”的说法。", "what_remains_different": "它是静态、单帧的，没有时间深度噪声统计量，没有闪烁，没有学习型渲染器或交叉点分析，也没有时间滤波或 TSDF 分析。"}, {"title": "An Analytical Model for Synthesis Distortion Estimation in 3D Video (Fang, Cheung, Au, et al.)", "url": "https://doi.org/10.1109/TIP.2013.2287608", "venue": "IEEE TIP", "year": "2014", "overlap": "high", "what_overlaps": "一个关于深度误差如何传播为合成视图失真的解析模型，是纹理特性（纹理的频率和梯度内容）和视角偏移几何的函数。这本质上就是 Δu·||∇I|| 一阶模型。", "what_remains_different": "它面向 2 视图 DIBR 的深度编码码率分配，而非 K 视图学习型融合。没有时间偏差/方差拆分，没有闪烁预测，也没有与学习型渲染器的比较。"}, {"title": "Depth map distortion analysis for view rendering and depth coding (Kim, Ortega, et al.)", "url": "https://doi.org/10.1109/ICIP.2009.5414304", "venue": "ICIP", "year": "2009", "overlap": "high", "what_overlaps": "推导出渲染视图误差等于深度误差乘以局部纹理梯度，并按相机参数和基线缩放。这与该想法关键洞见中的一阶“位移乘梯度”关系相同。", "what_remains_different": "静态的，用于压缩。没有时间统计量，没有多视角融合，没有 TSDF 或滤波分析，也没有学习型渲染器。"}, {"title": "Estimation of Virtual View Synthesis Distortion Toward Virtual View Position", "url": "https://doi.org/10.1109/TIP.2016.2535345", "venue": "IEEE TIP", "year": "2016", "overlap": "medium", "what_overlaps": "建模了由深度误差引起的合成失真如何随虚拟视点位置（有效基线）缩放，对应该想法中的 b_eff 项。", "what_remains_different": "没有时间维度，没有学习型融合，也没有几何与学习型之间的交叉点。"}, {"title": "A Low-Complexity View Synthesis Distortion Estimation Method for 3D Video with Large Baseline Considerations (Bi & Liang)", "url": "https://arxiv.org/abs/2510.17037", "venue": "arXiv", "year": "2025", "overlap": "medium", "what_overlaps": "近期（2025 年 10 月）的免训练视图合成失真 (VSD) 估计方法，带基线距离指示量、纹理-深度区域分类，以及包含重叠和去遮挡区域的分区融合。它表明这一研究线仍然活跃，并覆盖了该想法列为风险的遮挡与去遮挡项。", "what_remains_different": "面向 3D 视频编码的帧级失真估计。没有时间闪烁模型，没有偏差/方差拆分，也没有学习型渲染器。"}]}}, {"id": "C15", "name": "Room-as-light-probe: live relighting of remote participant into receiver lighting using the sender rig TSDF room radiance", "decision": "pursue_with_repositioning", "scores": {"novelty": 5, "significance": 5, "feasibility": 4, "telepresence_fit": 8, "overall": 4.5}, "sharpened": {"title_zh": "采集装置即光场舞台：利用观测到的近场光照与已知显示器发光源为实时多视角远程临场视频去光照", "title_en": "Rig-as-Light-Stage: De-lighting Live Multi-View Telepresence Video with Observed Near-Field Illumination and a Known Display Emitter", "one_liner": "一个经过标定的远程临场隔间能测量其自身光照的很大一部分：它通过 TSDF 看到房间，并确切知道自己的显示器正在发出什么光。让一个 feed-forward、与身份无关的本征分解网络以这一观测到的源光照为条件，所得 albedo 比基于图像估计光照的方法更准确，且在视角、双眼和时间上更一致；该 albedo 随后可在约 25 ms 内被重新打光到接收端的光照中。", "core_claim": "该对比除源光照的获取方式外保持一切不变。在相同的网络和数据预算下，以装置观测到的源光照（HDR TSDF 房间辐射、逐帧已知的显示器发光，以及对未观测方向的学习补全）为条件进行去光照，应当优于以图像估计的光照（单图或全景估计器，或由同一房间扫描压缩得到的 EgoRelight 式远场环境贴图）为条件。它应当 (a) 相对成对真值将尺度不变 albedo 误差降低至少 20%、将重打光 LPIPS 降低至少 15%，(b) 将跨视角和左右眼 albedo 不一致以及时间闪烁降低至少 30%，(c) 在单块 RTX 4090 级 GPU 上每帧额外开销不超过 25 ms。若观测光照在 (a) 上未能比估计光照好至少 10%，则核心论点不成立。", "key_insight": "从图像去光照是病态的，因为入射光是一个隐变量。固定、标定好的隔间是一个特殊情形，其中这个变量的很大一部分可以被测量。在被摄者身后和周围，装置的 TSDF 保存了房间近场、空间变化的辐射。在被摄者前方，也就是装置看不到、而主光通常所在的位置，隔间自己的显示器是一个大面积发光源，由于系统在渲染它，其辐射在每一帧都是精确已知的。显示器还随时间变化，因此它充当了一个免费的、被动的主动照明信号，类似“A Light Stage on Every Desk”。剩下未观测的部分（天花板灯具、显示器后的台灯）很小，且其大小可以被测量。问题由“猜测全部光照”变为“补全一个已知、可测的残差”。一旦以这种方式恢复 albedo，它变化缓慢且锚定在 TSDF 表面上。于是基础论文的静态/动态掩码和前一帧深度反馈就成为 albedo 记忆，重打光闪烁归结为管线已经解决的时间滤波问题。", "method": "(0) 会话设置，约 30 s，每个会话一次。用装置相机对空房间做曝光包围扫描，并可选地在显示器边框上安装一个廉价的外向鱼眼相机。将结果融合为 HDR 辐射 TSDF。检测饱和的发光源并用包围曝光标定其强度。对显示器做一次辐射度标定（逐像素辐射关于 RGB 值的函数，使用手机照度计或色卡）。(1) 源光场。在人体体积上构建一个粗糙 3D 探针网格，例如 6x6x6 个探针，每个存储 32 个球面高斯瓣或 L2 球谐，外加逐瓣可见性和已观测掩码。房间项由 TSDF 辐射网格渲染，仅在静态掩码变化处刷新，从而摊销其开销。显示器项每帧从 16x9 下采样的帧缓冲中作为面光源加入，线性且廉价。一个小型补全网络（作用于瓣网格的 3D CNN）修补未观测的瓣。它在合成房间上训练并输出不确定性。(2) 本征分解网络。它与基础论文的 4 层融合 U-Net 共享编码器。对每个 warp 后的输入视角，它接收 warp 后的 RGB、TSDF 法线与深度、从网格采样的辐照度 E_src(x)、主导瓣方向和已观测程度。它预测 albedo A、残差 R（高光、遮挡和阴影误差）和置信度 c，并施加成像约束 I ≈ A·E_src + R。(3) TSDF 与重投影锚定的 albedo 记忆。背景 albedo 融合进 TSDF 体素。人体 albedo 来自前一帧，利用基础论文的前一帧深度反馈重投影，并通过由差分掩码 M 和置信度 c 门控的 EMA 融合。M 的光照不变变体在 A 而非 RGB 上计算，修复了基础论文把“移动了”与“光照变了”混淆的已知失败模式。(4) 目标光照。当两端都是对称隔间时使用接收端自己的隔间 TSDF，在 AR 中则使用实时的 HMD 透视光照估计器，均以相同的探针网格表达。(5) 重渲染。I' = A·E_tgt + h(R, 目标瓣, 视线方向)，其中 h 是一个小型残差网络。重打光后的视角用现有的几何引导权重融合，从构造上保证跨视角与双眼一致。可选地在接收端地面投射接触阴影。训练数据：(i) 路径追踪的合成隔间。即 Blender 房间加带 albedo 的纹理人体扫描或绑定资产，以 8-12 台相机的正面弧形阵列渲染，包含播放视频内容的发光显示器、随机化台灯，以及真值 albedo、辐照度和重打光目标。(ii) 公开的多视角多光照人体数据（HumanOLAT、UltraStage），在由房间推导的光照下合成，用于真实皮肤监督。(iii) 在 6-8 台相机装置上的小规模真实成对采集。DMX 或智能 LED 面板隔帧频闪并与相机触发同步（Relightables 式），缓慢的台灯与显示内容变化提供成对光照。损失：重打光 L1+LPIPS；albedo L1（合成数据）；在无配对真实数据上的重建约束 I = A·E_src + R；通过深度重投影的跨视角 albedo 一致性；时间 albedo warp 损失；R 上的稀疏先验。运行时间预算：探针网格约 5 ms（显示器项加摊销的房间项），共享编码器上的本征头 10-15 ms，重打光与融合约 5 ms。在基础管线 40-100 ms 之上合计 20-25 ms。范围限定为上半身参与者以及漫反射光照加学习残差；精确的眼睛和眼镜高光不在范围内。", "why_not_engineering": "论文检验一个关于逆问题的可测假设：部分观测的近场光照加上一个精确已知的发光源，是否能使人体的 feed-forward 去光照比学习型光照估计约束更好，以及按观测立体角和辐照度覆盖率计，好多少。它提供了分析工具：跨装置布局与房间的辐照度覆盖研究，展示隔间实际观测到被摄者入射光的多少；以及一个消融阶梯（估计、由扫描得到的远场、近场、加显示器、加补全），分离出每一种约束来源。把已知显示器发光源用作实时去光照的被动主动照明，是针对远程临场隔间的新观察。光照不变的静态/动态门控（掩码作用于 albedo 而非 RGB）是对基础方法一个已记录失败模式的原理性修复，而不是外挂滤波器。此外还有一项基准贡献：真实房间中带房间扫描的成对多光照多视角动态人体视频，目前没有公开的同类数据。", "differentiation": "EgoRelight (arXiv 2605.28401, TOG 2026) 已经展示了观测发送端周围环境、恢复 HDR 光照并将远端用户重打光到接收端房间的概念。它使用的是特定个人、光场舞台训练的虚拟形象和一次性的远场环境贴图，由 HMD 驱动。本工作是对实时多视角 RGB-D 的与身份无关的基于图像渲染。其源光照是近场、空间变化且时间变化的，并包含已知显示器发光源，恰好覆盖了 HMD 房间扫描同样遗漏的正面半球。论文不会声称“首个重打光远程临场”。它将包含一个用同一房间扫描构建的“EgoRelight 式远场”消融，以表明近场的重要性。URAvatar 和 Relightable Full-Body Gaussian Codec Avatars 基于虚拟形象与先验，需要光场舞台预训练和逐用户注册，且不使用实时 IBR。Relightable Holoported Characters (arXiv 2512.00255) 和 GRGS (arXiv 2505.21502) 是 feed-forward 多视角人体重打光方法，但它们在光场舞台数据上训练、非实时，且估计或假设源光照而非观测它。TexIR (arXiv 2211.10206) 和 NeILF++ 把场景当作近场发光源，但它们是离线的、针对静态场景并求解场景自身的材质。本工作把“场景即发光源”模型实时地应用于动态人物。LiveLight (arXiv 2608.01771)、Comprehensive Relighting (arXiv 2504.03011)、Lux Post Facto 和 IC-Light 式重打光器都是单目的，基于幻觉出的或用户指定的光照工作，且不具备跨视角或立体一致性；它们作为基线。A Light Stage on Every Desk (arXiv 2105.08051) 用显示器作为单视角人脸的光场舞台，需要逐用户训练。本工作把这一思想推广到多视角隔间，与房间辐射相结合，并以与身份无关的方式实时运行。ISMAR 2022 的阴影感知远程临场重打光论文是单视角的，面向虚拟背景。"}, "experiments": {"datasets": ["合成隔间基准（新建，将发布）：路径追踪的 Blender 房间，8-12 台相机的正面弧形阵列、发光显示器、随机化台灯以及人体扫描或绑定资产；提供真值 albedo、辐照度和重打光目标；主要定量测试平台", "HumanOLAT (arXiv 2508.09137；公开的多视角全身 OLAT，含 HDR 帧)：在由房间推导的光照下合成，提供真实皮肤的重打光监督与评估。需核实是否含动态序列；假设以静态姿态为主", "UltraStage (arXiv 2212.07648)：2000+ 名对象，多视角，含梯度光照；用于 albedo 与法线预训练。可用性须通过许可申请核实", "基础论文数据集 DyNeRF/Neural 3D Video 和 D3DMV：无光照真值，因此仅用于无标签一致性指标（跨视角与立体 albedo 一致性、闪烁）和定性重打光，以表明方法能在基础管线的真实输入上运行", "自建真实采集（必需）：6-8 台同步相机（或 RGB-D 传感器）加一台显示器，2-3 个房间，6-10 名对象，LED 面板隔帧频闪并播放脚本化显示内容，得到成对光照；另有房间 HDR 包围扫描和一个外向鱼眼相机；作为基准发布"], "baselines": ["不含重打光的基础管线 (Ha et al. 2025)，加全局颜色迁移和一个 harmonisation 网络（下界）", "在基础管线输出上逐视角应用 IC-Light 或人像重打光（单图、估计的源光照）", "若代码或权重发布，则逐输出视角或逐眼应用 LiveLight (arXiv 2608.01771)；否则使用逐视角的 DiffusionRenderer 式逆/正向渲染器（离线，作为质量上参考）", "Comprehensive Relighting (arXiv 2504.03011)，逐视角", "以单图或全景光照估计为条件的同一本征网络（关键对照基线）", "以由同一房间扫描压缩得到的 EgoRelight 式远场环境贴图为条件的同一网络（EgoRelight 的受控代理；其虚拟形象管线本身无法复现）", "若有代码，则使用 GRGS (arXiv 2505.21502) 或 Relightable-Holoported-Characters 式的 feed-forward 重打光器（离线参考）"], "metrics": ["Albedo：相对真值 albedo 的尺度不变 L1/si-MSE 与 LPIPS（合成与 OLAT）", "重打光图像：相对成对真值的 PSNR/SSIM/LPIPS（合成、OLAT 合成、台灯成对真实数据）", "跨视角与左右眼 albedo 及重打光一致性：使用真值或 TSDF 深度在留出视角之间的重投影误差", "时间：warping 误差、tOF/tLP 闪烁，以及基础论文的 SDV 式时间指标", "光探针覆盖率：被摄者入射辐照度（及其方差）中来自已观测房间、显示器和未观测方向的比例，按装置布局统计", "运行时开销（1080p 下每帧 ms）与端到端延迟", "AR 用户实验（n 约 20-24，2AFC 加 Likert）：“同处一室”的可信度、共在感，以及相对 harmonisation 与逐视角扩散基线的偏好"], "key_ablations": ["源光照阶梯：估计、由扫描得到的远场、仅近场 TSDF、加已知显示器、加补全网络、加外向鱼眼，以真值光照为 oracle", "在昏暗与明亮环境房间下开/关显示器项，确定已知发光源何时重要", "Albedo 记忆开/关，以及在台灯变化下基于 RGB 差分掩码与基于 albedo 差分掩码的门控对比", "装置相机数量与布局（正面弧形 vs 部分环形），测量覆盖率及其对 albedo 误差的影响", "HDR 包围曝光 vs 单曝光 LDR 加学习型逆色调映射", "训练数据：仅合成、加 OLAT 合成、加台灯成对真实数据", "残差分支 h 开/关（仅漫反射重打光），量化高光与阴影误差"], "needs_custom_capture": true, "capture_notes": "没有公开数据集包含普通房间中带成对光照和房间扫描的动态多视角人体，因此真实评估不可避免地需要自建采集。最小可行装置为：正面弧形布置的 6-8 台全局快门或 RGB-D 相机（硬件同步），一台显示器作为显示发光源，2-4 块与相机同步触发的 DMX 或可控 LED 面板，以 60 fps 频闪交替光照（对相邻帧做光流对齐以得到成对数据），以及一个外向鱼眼相机。另加每个房间的 HDR 包围扫描和一张色卡。预算约 $4-8k，一间小型实验室，6-10 名对象的 IRB 知情同意，约 2 周采集。合成基准与 OLAT 合成承担大部分定量论断；真实成对数据集用于验证迁移。需考虑频闪带来的不适（备选方案为缓慢交替或保持姿态）。"}, "first_two_week_test": "在 Blender 中构建一个探针覆盖率与 oracle 着色研究，不做网络训练。使用 3 个来自免费 Blender 或 Poly Haven 场景的房间，每个 3 种光照设置（天花板灯具、显示器后的台灯、窗户），5 个带纹理的人体扫描，一个 8 台相机的正面弧形阵列，以及一台播放视频的 27 英寸发光显示器。渲染真值 albedo、法线、辐照度和图像。对被摄者表面每个点，把入射辐照度拆分为三部分：TSDF 中装置相机观测到的方向、显示器、未观测方向。报告观测到的比例。然后用真值法线和五种辐照度来源以闭式解求 albedo（A = (I - 0)/E）：(a) 仅已观测房间，(b) 已观测房间加显示器，(c) (b) 加朴素补全（均值填充或最近已观测瓣），(d) 来自一台装置相机的现成单图或全景光照估计，(e) 真值。比较尺度不变 albedo 误差与跨视角 albedo 一致性。若在典型设置中 (b) 或 (c) 捕获至少 60% 的辐照度，并在 albedo 误差上比 (d) 好至少 20%，则继续推进。若手头有真实装置，另做一个额外的合理性检查：在一人静坐时把显示器在白与黑之间切换，确认预测的仅显示器辐照度差异能解释面部观测到的大部分像素变化（R² 高于约 0.7）。", "kill_criteria": "出现以下任一情况即放弃或转向。(1) 在现实的隔间布局中，已观测房间加显示器占被摄者辐照度的比例不足约 50%，且补全其余部分后在 albedo 误差上未能比单图光照估计器好至少 10%；此时“观测源光照”论点失败，转向普通 harmonisation 或放弃。(2) 在相同网络下，观测光照条件化相比估计光照条件化，在合成与 OLAT 基准上对重打光 LPIPS 和 albedo 误差的改进不足 10%。(3) 管线无法把开销控制在约 30 ms 以下，或跨视角与时间一致性未能比逐视角扩散重打光器好至少 30%。(4) 4 个月后，尽管不一致，逐视角扩散重打光（IC-Light 或 LiveLight 式）在 AR 2AFC 中被偏好的比例仍超过 60%；此时实际价值在于生成式精修器，而不在于本路线。(5) 出现一篇新论文，利用观测到的房间光照做与身份无关的实时多视角重打光。", "reviewer_objections": [{"objection": "EgoRelight (TOG 2026) 已经从房间扫描中恢复发送端的环境光照，并把远端用户重打光到接收端房间用于远程临场，所以这个概念并不新。", "rebuttal": "我们同意概念上如此，论文也这样表述。贡献不同之处在于：与身份无关、无需逐用户光场舞台、对任意人物的实时 IBR、近场且空间变化与时间变化的源光照而非一次性的远场环境贴图，以及覆盖正面半球的已知显示器发光源。一个受控的“由同一扫描得到的远场”消融（即 EgoRelight 的光照模型）量化了近场与显示器项带来的增益。"}, {"objection": "装置相机朝向被摄者，因此占主导的正面和顶部光照未被观测。“观测光探针”在最关键的地方大多缺失，问题仍然是病态的。", "rebuttal": "这一点通过跨布局与房间的覆盖率研究直接测量，且论断限定为“约束更好”，而非“适定”。正面半球部分由辐射精确已知的显示器覆盖，并可选地由廉价的外向鱼眼覆盖。其余部分由带显式不确定性的网络补全。消融阶梯展示每一项帮助多大以及在何处失效。"}, {"objection": "LDR 相机无法测量发光源辐射；饱和的灯会使 HDR 房间辐射乃至源辐照度出现数量级的偏差。", "rebuttal": "装置固定且房间静态，因此在会话开始时做一次曝光包围扫描即可得到灯的 HDR 辐射。显示器只需标定一次。论文报告单曝光 LDR 加逆色调映射相对包围曝光的敏感性，并用尺度不变指标加一个全局白平衡与曝光项来处理 albedo 尺度歧义。"}, {"objection": "这是一个本征分解加着色的工程堆栈。现代扩散重打光器（LiveLight、IC-Light、DiffusionRenderer）能生成好看得多的重打光效果。", "rebuttal": "扩散重打光器会幻觉出源光照，且在视角或双眼间不一致，这在立体 AR 中是致命的。这一点通过一致性指标和用户实验测量。科学问题是观测光照的价值，而观测光照条件化是互补的：日后可以为一个 one-step 生成式精修器提供输入。扩散基线以其最佳设置纳入。"}, {"objection": "评估依赖合成数据和小规模自建采集；没有成熟的基准，且重打光对远程临场的益处尚未得到证明。", "rebuttal": "三层证据：带完整真值的合成基准、在合成光照下的真实公开多视角 OLAT 人体数据（HumanOLAT、UltraStage），以及一个发布的真实成对光照多视角隔间数据集。在此之上还有 AR 共在感用户实验。已有远程临场工作（ISMAR 2022 阴影感知重打光、EgoRelight）确立了光照不匹配的重要性。"}], "synergies": "(1) 运动与光照感知的静态/动态分离（领域空白：基础论文的颜色差分掩码把“移动了”与“光照变了”混淆）。本工作的 albedo 空间掩码直接解决这一问题，两者可以合并为一篇论文或形成系列。(2) 传输格式中的持久 TSDF 或 Gaussian 状态，即静态内容只发送一次、流式传输动态残差。只传输一次 albedo 和法线再加逐帧动态残差，使接收端重打光变得自然并降低码率，构成一个有力的联合“可重打光流式状态”叙事。(3) IBR 回路中的流式 one-step 生成式修复器（领域空白）。观测光照 G-buffer（A、E_src、E_tgt、法线）是蒸馏重打光或精修模型的理想条件输入，兼得物理一致性与生成质量。(4) 处理视角相关与高光外观，这是基础论文的已知弱点。残差分支 R 是迈向这一目标的第一步。(5) 几何基础模型与深度先验（MapAnything、Video Depth Anything、Stereo Any Video）。更好的法线直接降低着色误差。(6) 接收端的 AR 合成、遮挡与接触阴影，以及与其他远程临场方向共享的共在感用户实验基础设施。", "effort": {"months": "10-12（2 个月合成数据加覆盖率研究，2 个月采集装置与数据，4-5 个月模型、记忆与实时集成，2 个月用户实验与写作）", "people": "2 人（一名博士生负责逆渲染与学习，一名负责装置、采集与 AR 系统）；单个学生约需 15 个月，或缩减范围、舍弃 AR 实验", "compute": "2-4 块 24-80 GB GPU，总训练量约 2-3 GPU 周；路径追踪合成数据生成是主要开销（在小型渲染农场或云上约 50-100k 多视角帧）；一块 RTX 4090 用于实时演示；$4-8k 采集硬件（6-8 台同步相机、带 DMX 或触发的 LED 面板、一个鱼眼相机、一台显示器、色卡）"}, "venue": "考虑到系统、用户实验与一致性的定位，IEEE VR 2027 / ISMAR 2027（期刊轨，TVCG）是最现实的目标。若覆盖率分析加真实成对基准足够强，可冲刺 SIGGRAPH Asia 2027 (TOG)。只有定位为去光照与基准论文、并相对估计光照基线有强定量提升时，才可能投 CVPR 2027。", "novelty": {"verdict": "partially_scooped", "remaining_novel_angle": "最可辩护的论断是：对实时基于图像渲染的多视角 RGB-D 远程临场视频做与身份无关、无需光场舞台的在线重打光。源光照取自由发送端装置 TSDF 房间重建持续更新的近场、空间变化辐射场，而非逐人可重打光虚拟形象（EgoRelight、URAvatar）或幻觉出的环境贴图（LiveLight、Relit-LiVE、Comprehensive Relighting）。重打光输出通过由基础论文静态/动态掩码门控的 TSDF 锚定 albedo 记忆，在视角、双眼与时间上保持一致。在同一装置上用切换台灯进行的成对多光照采集是一项无人声称的次要贡献。不新颖的部分：(a)“重建的房间辐射就是入射近场光”（TexIR CVPR 2023、NeILF++）；(b)“观测发送端周围环境以恢复源光照，再把远端用户重打光到接收端环境中用于 MR 远程临场”（EgoRelight, TOG 2026，正是用 HMD 房间扫描做了这件事）。论文必须明确相对 EgoRelight 定位。关键区别是：无逐用户光场舞台模型、近场且时间变化的源光照、实时 IBR，以及多视角或立体一致性。一个削弱“适定去光照”说法的技术注意点：远程临场装置的相机朝向人物，因此它们主要观测被摄者身后和周围的房间，而相机后方的正面半球（通常包含主光、屏幕和天花板灯具）未被观测。因此光探针恰恰在主导光照来源处大多不完整，需要学习补全或专门的外向相机。审稿人会提出这一点，所以论断应弱化为“部分观测、约束更好”的源光照。", "threats": [{"title": "EgoRelight: Egocentric Human Capture and Illumination Recovery for Relightable and Photoreal Avatar Rendering", "url": "https://arxiv.org/abs/2605.28401", "year": "2026", "venue": "ACM TOG 2026 (doi 10.1145/3811346)", "overlap": "high", "what_overlaps": "它用设备相机重建发送端自己的房间（由 360 度扫描构建的 3D 场景，再反投影为全景图），通过针对人物外观的逆渲染将其提升为 HDR，并在混合现实远程临场演示中用恢复的光照把远端参与者重打光到接收端的真实环境中。这就是问题陈述、“观测发送端周围环境从而测量而非猜测源光照”的洞见，以及重打光到接收端的应用。", "what_remains_different": "它基于虚拟形象且针对特定个人，需要对每个身份做多视角光场舞台训练。房间是一次性 10 s 扫描压缩成的远场环境贴图，而非持续更新的近场、空间变化辐射场。它没有对实时多视角 RGB-D 的基于图像渲染，没有与身份无关的 feed-forward 去光照，没有重打光 IBR 输出的多视角或立体一致性，没有 TSDF 锚定的时间 albedo 记忆，也没有端到端延迟论断（只有虚拟形象以 46 FPS 运行）。"}, {"title": "Multi-view Inverse Rendering for Large-scale Real-world Indoor Scenes (TexIR, texture-based lighting)", "url": "https://arxiv.org/abs/2211.10206", "year": "2023", "venue": "CVPR 2023", "overlap": "medium", "what_overlaps": "它确立了带 HDR 纹理的重建房间网格就是近场入射光照（“场景几何本身作为光源”），这恰好是“房间辐射就是光探针”的思想。NeILF++ (https://arxiv.org/abs/2303.17147) 等相关静态场景工作用可互反射的光场做了同样的事。", "what_remains_different": "仅限离线和静态场景；它恢复场景自身的材质，并不实时地为房间中的动态人体去光照。把“场景即发光源”模型应用于远程临场装置中的实时人物是新的。"}, {"title": "URAvatar: Universal Relightable Gaussian Codec Avatars", "url": "https://arxiv.org/abs/2410.24223", "year": "2024", "venue": "SIGGRAPH Asia 2024", "overlap": "medium", "what_overlaps": "通过逆渲染微调，从手机扫描个性化得到的实时可重打光头部虚拟形象。这隐式地分离出采集环境的光照，并支持在任意环境下重打光，是 Codec-Avatar 路线下的“把远端人物重打光到接收端光照中”。全身版本 (https://arxiv.org/abs/2501.14726, SIGGRAPH 2025) 对此做了扩展。", "what_remains_different": "基于虚拟形象与先验模型（在数百个身份上做光场舞台训练），没有实时多视角 IBR，也没有把发送端房间用作显式近场光探针。"}, {"title": "BEAM: Bridging Physically-based Rendering and Gaussian Modeling for Relightable Volumetric Video", "url": "https://arxiv.org/abs/2502.08297", "year": "2025", "venue": "ACM MM 2025", "overlap": "medium", "what_overlaps": "从多视角 RGB 素材中恢复几何与材质，生成可重打光的体积视频，支持实时延迟着色回放，并明确把远程临场列为应用。", "what_remains_different": "逐序列优化（离线重建）；它不把观测到的房间用作源光照，也不是在线的 feed-forward 管线。"}, {"title": "Real-time Shadow-aware Portrait Relighting in Virtual Backgrounds for Realistic Telepresence", "url": "https://doi.org/10.1109/ismar55827.2022.00091", "year": "2022", "venue": "IEEE ISMAR 2022", "overlap": "medium", "what_overlaps": "对远程临场参与者做实时重打光以匹配新的（虚拟）背景，即面向远程临场的光照一致合成。", "what_remains_different": "单视角 2D 人像合成到虚拟背景；没有多视角或 3D 一致性，也没有观测房间光探针。"}]}}, {"id": "C16", "name": "Kinematics-aware geometry-guided IBR with fixed + robot-mounted moving cameras for teleoperation", "decision": "pursue_with_repositioning", "scores": {"novelty": 4, "significance": 5, "feasibility": 5, "telepresence_fit": 6, "overall": 4.5}, "sharpened": {"title_zh": "以机器人为锚点：融合运动学的固定相机与腕部相机操作工作空间在线 3D 视频", "title_en": "Robot-as-Anchor: Kinematics-Fused Online 3D Video of the Manipulation Workspace from Fixed and Wrist Cameras", "one_liner": "把机器人视为场景中唯一完全已知的动态物体。它的 URDF 加关节状态提供了精确的接触区域几何、腕部相机的位姿，以及一个始终在视野内的配准目标。将这些信息融合进 Ha et al. 风格的 image-space TSDF，即可得到变化中工作空间的照片级、时间稳定的自由视点视频。与 Dincer et al. 2026 的“点云 + 腕部面板”界面相比，这种视频可量化地提升精细操作遥操作的表现。", "core_claim": "（C1，几何）在末端执行器区域（TCP 周围 15 cm 球体投影到目标视图的区域）内，融合 (i) 由运动学定位并经光度优化的腕部 RGB-D 相机，以及 (ii) 作为高置信度 TSDF 输入的光栅化机器人网格，在留出的固定相机上相对仅用固定相机的几何引导 IBR 实现三点：深度误差降低至少 25%，飞点（flying pixel）率降低至少 40%，EE 裁剪区域 LPIPS 改善至少 10%。在夹爪-物体遮挡边界上，它还要胜过强基线“把机器人分割掉再合成 URDF 渲染”。（C2，人因）在 n≈20-24 的被试内研究中，与延迟匹配的“融合点云 + 悬浮腕部 RGB 面板”相比，该界面在紧间隙任务（间隙 ≤2 mm 的轴孔装配、向缝隙中放置）上的成功率提高至少 15 个百分点，并减少碰撞。跨条件来看，接触区域深度误差和时间一致性指标（TCC/STED）比全帧 PSNR 更能预测任务成功。若 C1 不成立，论文就没有技术核心；若 C2 不成立，它相对点云就没有存在的理由。", "key_insight": "在遥操作中，操作者的决策发生在夹爪与物体的接触处。而这恰恰是通用多视角 IBR 表现最差的地方：手指细、自遮挡、飞点，以及固定相机距离远或被遮挡。这里也恰恰是机器人能免费提供精确信息的地方：每一帧它自身的度量几何、近距离腕部相机的位姿，以及一个始终可见的移动标定目标。几何引导 IBR 暴露了一个显式的逐像素几何阶段（image-space TSDF 加深度反馈），这正是注入该先验的自然位置。端到端 feed-forward Gaussians 和点云无法联合解决机器人-物体可见性问题，因为它们要么忽略机器人，要么事后合成。render-and-compare 运动掩码并不声称是新的（ReFusion 2019、Embodied Gaussians 2024），它是让 Ha et al. 基于颜色差的时间滤波在移动相机下仍能工作的必要适配。", "method": "输入：4-6 台已标定的固定 RGB-D 相机（或双目），1 台腕部 RGB-D 相机，100+ Hz 的关节状态，以及 URDF。(1) 腕部位姿：由关节状态和手眼标定得到 FK 位姿，每帧再通过一次 6-DoF Gauss-Newton 光度与深度对齐（对齐目标为固定相机阵列的 TSDF 预测，仅限静态背景像素，≤3 ms，2 层金字塔）进行优化。残差过高时回退到 FK。(2) 机器人感知深度：在时间戳插值后的关节状态下，把机器人网格光栅化到每个输入视图中。标记落在膨胀后机器人轮廓内的传感器深度像素，以置信度 w_robot 和较窄的截断距离用网格深度替换，使夹爪边缘永远不会产生飞点。将网格深度作为额外的“视图”输入加入目标视图的 image-space TSDF。(3) 移动相机时间滤波：把 Ha et al. 的帧差门控替换为残差门控 M = sigmoid(a|I - Î| + b|D - D̂|)，其中 Î 和 D̂ 是把上一帧 TSDF 渲染到当前（移动）相机位姿的结果，且机器人轮廓始终强制标为“动态”。固定相机保留原始门控，便于做消融。(4) 融合网络：Ha et al. 的 4 层 U-Net，外加两个输入通道：机器人掩码和逐视图“到 TCP 距离”权重。先在类 DyNeRF 的多视角数据上预训练，再在 RH20T 上以留出的固定相机作为监督进行微调。损失为 L1 + LPIPS + 时间 warping 损失，外加 EE 裁剪区加权的 L1（×4）。(5) 视图选择：按位姿接近度选 K = 4 台固定相机，当 TCP 从目标视点可见时始终加入腕部相机。不主张 foveation，至多作为运行时消融。(6) 显示：通过基于深度的后期重投影输出到双目 HMD。机器人位姿按最新关节状态渲染，从而实现近零延迟的自身运动显示。预算：在 RTX 4090 上 1280x720、K = 5 时渲染 ≤50 ms，另加传感器延迟，并测量和报告端到端 motion-to-photon 延迟。Ha et al. 没有代码，因此需要重新实现（约 4-6 周）。", "why_not_engineering": "贡献在于一个可检验的主张：在实时 3D 视频中，决定任务成败的信息位于何处；以及一套测量它的评估方法。它引入了留出相机上的接触区域深度误差、飞点率和遮挡边界精度，并把它们与操作结果联系起来，而不是追求 PSNR 的提升。技术问题并不平凡且尚未解决：如何把一个由运动学定位的近距离移动相机，以及一个精确但没有外观的网格，逐帧融合进 image-space TSDF 而不产生鬼影。FK 误差（廉价机械臂上 5-15 mm）与 2 cm 的 TSDF 截断处于同一量级，而且机器人既遮挡被操作物体，也被它遮挡。与以往遥操作系统所用的“分割并合成 URDF”管线的消融对比，回答了一个系统类论文一直默认绕过的问题。审稿人仍会把它看作系统 + 人因论文，论文应在机器人或 VR 会议上坦然接受这一定位，而不是包装成一个 CV 基础方法。", "differentiation": "Dincer et al. 2026 (arXiv 2604.03730) 使用相同设定：固定 RGB-D 加腕部相机，用 YOLO 去除机器人并从 URDF 重新渲染，foveated 细节，以及 31 人的用户研究。它渲染点云，把腕部相机作为 2D 面板，且没有时间滤波。我们在几何上融合腕部相机，在 TSDF 内部而非通过分割与合成来解决机器人-物体可见性，并把他们的界面作为用户研究的主要基线。Embodied Gaussians (arXiv 2406.10788) 和 ReFusion (arXiv 1905.02082)：render-vs-observe 残差是他们的；我们引用并将其作为一个组件使用。他们的目标是状态估计或静态地图，而非未建模物体的照片级自由视点视频。HIL-GS (RA-L 2025)、Du et al. RA-L 2026、Wilder-Smith et al. IROS 2024 (2407.20194) 和 Boehringer et al. 2025 (2504.15229) 使用在线优化或静态 GS，对移动物体的更新约为 2 Hz 或根本不更新。我们是逐帧 feed-forward，10-30 Hz，并具有时间一致性。cuMotion/nvblox 为碰撞建图而屏蔽机器人像素，不做渲染；我们超越了屏蔽，把网格作为几何插入。GHOST 2026 (2608.29080) 仅使用机载相机的点云。Tefera 2024 和 Dincer 2026 已经使用 foveation，因此我们不再把它作为贡献。Ha et al. (CVPR 2025) 假设静态相机阵列和通用场景，他们自己的消融显示 TSDF 引导几乎不改变 PSNR（31.16 到 31.17）。我们认为其价值体现在接触区域几何和一致性上，并直接检验这一主张。"}, "experiments": {"datasets": ["RH20T (https://rh20t.github.io/, arXiv 2307.00595)：8-10 台固定全局 RGB-D 相机加 1-2 台手上相机，1280x720、10 Hz，提供内外参、关节角和夹爪位姿。这是主要的公开基准：在腕部相机移动时，留出 1-2 台固定相机作为真值。注意事项：10 Hz、软件时间戳同步，以及 RealSense 在细或暗物体上的深度噪声。", "DROID（聚类文件中提及；本次会话未重新核实可获取性）：2 台外部双目相机加 1 台腕部相机，仅作为泛化的稀疏压力测试。", "DyNeRF / Neural 3D Video 和 D3DMV（基础论文的基准）：仅用于确认 Ha et al. 的重实现达到论文报告的数值（±0.5 dB），不用于支撑主张。", "自采数据（必需）：一台桌面机械臂（Franka、xArm 或 UR），配 4-6 台硬件同步、30 Hz 的 RGB-D 或双目相机，一台 D405 级腕部相机，以及第 7 台留出相机。30 Hz 评估和细物体任务（线缆、销钉、无透明物体）需要它，也是开展闭环用户研究的唯一途径。"], "baselines": ["融合点云 + 悬浮腕部 RGB 面板（重实现 2604.03730 的界面），用户研究的主要基线", "Ha et al. 2025 重实现，仅固定相机（静态阵列原版）", "Ha et al. + 腕部相机 + 帧差门控（表明静态阵列掩码在自身运动下失效）", "从深度中分割掉机器人（运动学掩码，cuMotion 风格）+ 事后合成 URDF 网格渲染（最强的“为什么不直接渲染机器人”基线）", "GPS-Gaussian+ 或可泛化的 feed-forward Gaussian 模型（如 GS-LRM 风格方法），在 RH20T 上微调", "在线优化的 3DGS SLAM 式地图 + 实时腕部视频（代表 HIL-GS/Boehringer 类界面）"], "metrics": ["留出相机上 EE 区域（15 cm TCP 球体，投影）的深度 AbsRel 和 RMSE，以留出传感器深度加机器人像素上的机器人网格深度为真值", "飞点率：EE 区域内渲染深度与前景和背景表面均相差超过 2 cm 的像素比例", "夹爪-物体接触处的遮挡边界 F-score", "PSNR/SSIM/LPIPS，全帧与 EE 裁剪", "TCC 和 STED（时间一致性），全帧与 EE 裁剪", "腕部位姿误差：FK 与优化后对比，在自采
