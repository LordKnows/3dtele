每像素单一虚深度建模（镜面方程，凸光泽用 R/2 近似）。它通过 oracle 空间研究和同等容量的视角条件残差基线来检验。\n\n(b) 一个时间动态发现：分离的层允许各自最优的时间滤波器。以 Pareto 曲线（闪烁 vs 滞后）展示，这是任何单一共享滤波器都达不到的折中。以往的双层反射 IBR（Sinha 2012；Xu 2021）是静态的，从未揭示这一点。\n\n(c) 一个解释几何引导何时有用的失效分析。它表明被镜面污染的 TSDF 深度是原论文 TSDF 消融结果为零（31.16 vs 31.17 dB）的原因之一，因为 (1 − s) 加权恰好在几何出错的地方改变了几何。\n\n(d) 首个在远程呈现内容（眼镜、屏幕、光泽皮肤）上、具有留出相机 GT 且视角 × 时间一致性指标限定于镜面区域的基准。\n\n没有任何组件只是更大的网络。消融分别隔离了表示、估计器、时间模型和几何加权。", "differentiation": "vs Sinha et al. SIGGRAPH 2012 (https://dl.acm.org/doi/10.1145/2185520.2185596) 与 Xu et al. SIGGRAPH 2021 (http://www.cad.zju.edu.cn/home/weiweixu/wwxu2021.files/ReflectiveIBR.pdf)：\n- 相同的双层（前表面加虚拟反射几何）表示。必须作为先驱引用，且不得声称其新颖。\n- 它们是离线、静态、基于网格和优化的。我们是 feed-forward、逐帧在线估计、在动态视频上运行，并加入分层时间滤波和镜面感知几何融合。\n\nvs Broxton et al. 2020 (https://dl.acm.org/doi/10.1145/3386569.3392485) 与 Quark 2024 (https://arxiv.org/abs/2411.16680)：\n- 它们的多层表示只是把反射隐式地作为通用的额外层来捕获。\n- 它们没有显式镜面检测、没有反射深度估计、没有漫反射/镜面拆分、没有分层时间模型，也没有镜面掩膜一致性评测。\n- 必须纳入 Quark 式分层基线，以展示在相同运行时下显式反射深度在 EPI 和时间指标上优于通用层。\n\nvs IBGS (https://arxiv.org/abs/2511.14357) 与 ViewSplat (https://arxiv.org/abs/2603.25265)：\n- 它们的视角条件残差提升了单帧镜面 PSNR，但没有视差模型，也没有时间项。IBGS 是逐场景的；ViewSplat 是静态且逐帧的。\n- 我们的关键消融用同等容量的残差头替换我们的镜面层。\n\nvs Soft3D (https://dl.acm.org/doi/10.1145/3130800.3130855)、Self-Supervised Visibility Learning (https://arxiv.org/abs/2103.15407) 与 NeuRay (https://arxiv.org/abs/2107.13421)：\n- 沿目标光线的概率深度融合已经成熟，因此我们不声称它。\n- 我们只把反射扫描的代价体熵用作光泽回退的门控。\n\nvs 逐场景动态镜面方法 NeRF-DS (https://arxiv.org/abs/2303.14435) 与 TraceFlow (https://arxiv.org/abs/2512.10095)：\n- 它们基于优化且离线。它们作为质量上界，而非竞争方法。\n\nvs Ref-GeNVS (https://arxiv.org/abs/2609.05382)：\n- 生成式、仅限镜子、离线。\n\nvs Stereo Anywhere (https://arxiv.org/abs/2412.04472) 与 Fast-FoundationStereo (https://arxiv.org/abs/2512.11130)：\n- 仅作为深度来源。它们用作我们的前端，我们会展示仅靠更好的深度并不能修复高光重影和闪烁。这就是基线“base + FM stereo”。"}, "experiments": {"datasets": ["DyNeRF / Neural 3D Video（公开；金属平底锅和锅、coffee_martini 中的玻璃杯、镜面厨房表面；原论文协议，也是主要的可比真实基准）", "D3DMV 与 ENeRF-Outdoor（公开；仅用于全帧无退化数值，因为它们镜面内容很少）", "Technicolor light-field video，4x4 阵列（公开；稠密阵列，适合留二的“更宽间隙”留出视角；需逐序列检查镜面内容）", "DNA-Rendering 和/或 ActorsHQ（申请后公开；多视角人体，部分有光泽衣物或配饰，可能有眼镜；依赖之前需逐序列核实眼镜和光泽材质的存在）", "自渲染的合成 PBR 多视角视频（约 200 段，12-16 台相机，Blender Cycles 漫反射与光泽通道：戴眼镜的扫描人体、反射动画房间的屏幕、金属道具、移动光源）。提供 GT 层拆分、GT 反射深度和自由轨迹 GT", "自建远程呈现镜面采集（10-15 段，每段 30-60 s）：眼镜、笔记本和显示器屏幕、主光下的光泽皮肤、光泽桌面和一面小镜子。8-12 台 genlock 同步相机（机器视觉相机或同步线连接的 RGB-D，如 Azure Kinect / Orbbec Femto），2-4 台留出相机，包括一个留二宽间隙。作为基准发布"], "baselines": ["原论文（Ha et al. CVPR 2025），因未发布代码而复现：使用 RAFT-Stereo，以及使用 Fast-FoundationStereo / Stereo Anywhere 深度（“仅更好的深度”）", "同一 backbone 上同等容量的视角条件残差头（ViewSplat/IBGS 式）；关键的消融基线", "Quark 式或 DeepView 式分层深度基线（如无代码则复现），用于“通用层 vs 显式反射深度”", "ENeRF 与 GPS-Gaussian+（公开代码；feed-forward 可泛化基线）", "逐场景上界：IBGS（静态、逐帧）、4DGS，以及在代码允许时的 NeRF-DS 或 TraceFlow", "扫描惯性的单一共享时间滤波器（相对分层滤波器的 Pareto 基线）"], "metrics": ["全帧 PSNR / SSIM / LPIPS（无退化检查）", "镜面掩膜 PSNR / LPIPS（mask 来自合成光泽通道；真实数据上来自检测器，并由人工标注子集审核）", "镜面掩膜视角一致性：沿相机扫掠的 EPI 不连续性 / SDV、MEt3R", "镜面掩膜时间一致性：tOF、STED/SDT、TCC，以及闪烁频谱能量度量", "滞后指标：高光位置相对 GT 的时间互相关延迟（合成数据），用于绘制闪烁-滞后 Pareto 曲线", "高光位置误差（像素）与反射深度误差（合成 GT）", "几何：有无 (1 − s) 加权时镜面像素上的深度误差（合成 GT；真实数据上在可用处使用传感器深度）", "端到端延迟，包括立体前端，注明 GPU；逐模块分解", "在 HMD / 头部追踪显示器上的 2AFC 用户研究：高光真实感与闪烁偏好"], "key_ablations": ["Oracle 空间：GT 层拆分 + GT 反射深度 vs 单层表面扭曲（该想法的上界）", "无层拆分（base）vs 双层且镜面层由表面深度扭曲 vs 由反射深度扭曲（隔离视差模型）", "用同等容量的视角条件残差头替换显式镜面层", "共享 vs 分层时间滤波（关于惯性的 Pareto 曲线）", "有无 (1 − s) TSDF 加权，包括它是否能把原论文为零的 TSDF 消融变成镜面内容上的可测量增益", "熵门控光泽回退开/关，按合成粗糙度分层", "输入视角数 K ∈ {2,4,6,8}（高光覆盖大多数视角时中位数漫反射失效）", "深度前端：RAFT-Stereo vs Fast-FoundationStereo vs 传感器深度 vs 单目-立体融合"], "needs_custom_capture": true, "capture_notes": "公开多视角视频数据集中，与远程呈现相关且带留出相机的镜面内容很少。DyNeRF 有平底锅、锅和玻璃杯。眼镜和屏幕在 DNA-Rendering / ActorsHQ 中至多是偶然出现，需要核实。因此远程呈现主张和基准需要一个小规模的自建采集。\n\n预算：\n- 8-12 台 genlock 全局快门机器视觉相机，或同步线连接的 RGB-D 相机，约 4-10k 美元。\n- 一台采集 PC、一块色卡和一块标定板。\n\n协议：\n- 10-15 段序列，包含眼镜、笔记本和显示器屏幕、主光下的光泽皮肤和光泽桌面。\n- 多种光照设置，包括一个移动光源。\n- 2-4 台留出相机，包括一个留二宽间隙，以免反射视差误差被极小的插值基线掩盖。\n\n合成 PBR 数据集对于层和反射深度 GT 以及自由轨迹是必不可少的。它需要约 2-3 周的搭建，外加在几块 GPU 上的渲染时间。\n\n知情同意与隐私：发布基准前，实验室志愿者的面部需要签署授权书。"}, "first_two_week_test": "一个非学习的 oracle 与估计器空间研究（不训练网络）。\n\n第 1-4 天，合成数据：\n- 在 Blender Cycles 中渲染 3 段短合成片段：12 台相机、60 帧，漫反射和光泽通道分离，带 GT 深度。\n- 片段 (a)：移动主光下戴眼镜的头部。片段 (b)：反射动画房间的显示器。片段 (c)：旋转的光泽金属锅。\n\n第 3-6 天，真实深度：\n- 在 DyNeRF cook_spinach / flame_steak（平底锅区域）和合成片段上计算 Fast-FoundationStereo（或 RAFT-Stereo）深度。\n\n第 5-10 天，一个固定权重的最小渲染器：\n- 基于图像的 TSDF raymarch，K=4 个最近视角，前向扭曲，Unstructured Lumigraph 融合权重。四个变体：\n  - (i) 单层表面扭曲（类原论文，但无学习融合器）；\n  - (ii) oracle 双层：GT 漫反射/光泽拆分，光泽通道由用 GT 选出的最佳扫描虚深度扭曲，作为上界；\n  - (iii) 估计双层：K 个视角中位数作为漫反射，残差在表面后方扫 32 个深度，取跨视角方差的 argmin；\n  - (iv) (iii) 加 (1 − s) TSDF 加权。\n\n第 9-12 天，时间滤波器：\n- 在镜面层上以一系列 α 运行 EMA，对比在整幅图像上使用一个共享 α。绘制闪烁（tOF）对滞后（合成数据上的高光位置延迟）的曲线。\n\n第 12-14 天，测量：\n- 留出相机（包括一个留二间隙）上的镜面掩膜 PSNR、EPI 不连续性、tOF 和高光位置误差。\n- 真实检测到的镜面像素中，扫描代价体呈尖峰（低熵）而非平坦的比例。\n\n一名学生加一块 GPU 即可完成。", "kill_criteria": "若出现以下任一情况，放弃显式双层方向。\n\n(1) 没有空间。在合成片段上（包括留二间隙），ORACLE 双层变体相比单层表面扭曲的镜面掩膜 PSNR 提升不足 1 dB，且镜面 EPI / 高光位置误差降低不足 25%。这意味着在阵列基线下反射视差不是主要误差。\n\n(2) 估计器是瓶颈。估计变体（K 中位数加扫描）在 K=4 时恢复不足 40% 的 oracle 增益，在 K=8 时仍不足 50%。这说明在远程呈现规模的阵列上中位数漫反射分离不可行。\n\n(3) 真实镜面几乎都是光泽型。在真实 DyNeRF 平底锅区域以及一次快速的 4-6 台手机或网络摄像头（眼镜加屏幕）测试中，超过 70% 的检测到的镜面像素具有平坦的反射扫描代价体（熵高于最大值的 0.8）。贡献于是退化为“门控的视角条件回退”，相对 ViewSplat/IBGS 过于单薄。\n\n(4) 没有时间收益。分层 EMA 在闪烁-滞后 Pareto 曲线上没有支配所有共享 α 设置。\n\n若 (1) 和 (4) 不成立但 (3) 通过，则转向基准/诊断论文：在线 IBR 的镜面视角 × 时间一致性，加上 (1 − s) 几何加权发现。目标为 3DV/TVCG 级别的会议或期刊。", "reviewer_objections": [{"objection": "双层反射 IBR 就是 Sinha et al. 2012 和 Xu et al. 2021（原想法都没有引用）；这是把已知表示做快了，即工程。", "rebuttal": "我们把两者都作为先驱引用，不主张该表示。我们的主张有三点：\n- 在 feed-forward 多视角视频管线中逐帧在线估计反射深度，两位先驱都没有。\n- 分离的层允许各自最优动态这一时间发现，以相对任何共享滤波器的 Pareto 改进展示，静态方法甚至无法提出这个问题。\n- 可测量地修复 TSDF 深度的镜面感知几何加权。\noracle 空间研究加同等容量消融，使其成为一个经过检验的建模主张，而不是加速。"}, {"objection": "更大的融合网络，或视角条件残差头（ViewSplat/IBGS 式），无需任何显式反射深度就能吸收镜面性。", "rebuttal": "这是我们在相同参数量和运行时下进行的核心消融。在 kill criteria 中预先登记的假设是：残差头能恢复单帧掩膜 PSNR，但无法恢复 EPI 或时间一致性。它们没有高光应往哪里移动的模型，因此误差表现为视角扫掠不连续和闪烁，尤其在留二宽间隙和合成自由轨迹上。如果残差头在 EPI 和 tOF 上与我们持平，则论文主张被证伪，我们会如实报告。"}, {"objection": "大多数远程呈现中的镜面（皮肤、粗糙塑料）是光泽型而非镜面型；单一虚深度没有良好定义，并且高光覆盖大多数视角时 4 视角中位数漫反射估计会失败。", "rebuttal": "镜面方程给出凸光泽表面后方约 R/2 的一阶虚深度，因此对眼镜镜片、角膜和平底锅而言，高光视差仍近似于深度型。在不满足时，扫描的代价体熵会门控到视角条件回退。我们按粗糙度（合成）和 K 分层报告结果，包括方法不再有帮助的地方。我们还为高光覆盖至少 K/2 个视角的情况加入学习的校正，并量化其失败率。"}, {"objection": "镜面像素只占画面很小一部分；增益在标准指标中看不出来，而且基准（合成加自采）有自说自话之嫌。", "rebuttal": "我们在区域掩膜指标之外报告全帧指标并要求无退化，这是针对局部伪影的既定做法。2AFC HMD 研究度量感知显著性，因为眼镜和眼睛上闪烁或重影的高光在人脸上非常显眼。真实采集会连同留出相机和标定一起发布，供他人评测。DyNeRF 的平底锅区域提供第三方真实测试。"}, {"objection": "在近邻之间的留出阵列相机上评测会掩盖视差误差，而且“在线”主张没有包含深度估计（与原论文一样）。", "rebuttal": "我们在自建和 Technicolor 阵列上加入留二宽间隙留出相机，并加入带 GT 的合成自由轨迹。我们在注明的 GPU 上报告端到端延迟，包括立体基础模型前端，附逐模块分解，目标是相对原管线开销不超过 12 ms。"}], "synergies": "1. 视角 × 时间一致性基准与指标簇：镜面掩膜 EPI、tOF 和滞后指标以及留出相机的远程呈现采集属于更广的在线远程呈现基准，因此可合并为一篇数据集论文。\n\n2. 立体基础模型 / 不确定性前端簇：单目-立体不一致和跨视角离散度线索（该簇概率深度想法中有用的遗留部分）同时可作为通用的“不可靠几何”信号，而 (1 − s) 加权有助于解释原论文为零的 TSDF 消融。\n\n3. 长时记忆与漂移簇：分层记忆可自然推广，例如静态漫反射背景用长记忆，动态或视角相关层用短记忆。\n\n4. 光场与多视角显示渲染：稀疏镜面层逐视角重渲染代价低，因此漫反射层可以在 32-45 个显示视角间摊销。\n\n5. 注视与眼神接触保真度：正确的角膜和眼镜高光是感知注视线索，天然适合联合用户研究。\n\n6. 远程呈现的重光照与合成：在线漫反射/镜面拆分使得可以把远端人物近似地进行光照协调后合成到本地场景中。\n\n7. 带宽与压缩：镜面层是稀疏的，可以以更低的分辨率或速率传输，或使用单独的编解码器。", "effort": {"months": "9-11 个月（0.5 个月空间研究；1.5 个月原管线复现，因为没有官方代码；1.5 个月合成 PBR 数据加阵列搭建与采集；3-4 个月方法；2 个月评测、用户研究和写作）", "people": "2 人（一名博士生负责方法，一名负责合成数据、采集阵列和基准；导师约 20% 的时间）", "compute": "4-8 块 24-48 GB GPU（RTX 4090/5090 或 A6000/L40 级）用于训练和 Cycles 渲染，外加一块带 TensorRT 的 RTX 级 GPU 用于延迟测量。8-12 台 genlock 阵列的相机与同步硬件约 4-10k 美元。"}, "venue": "首选：SIGGRAPH Asia 2027 / ACM TOG。备选：ICCV 2027 或 CVPR 2028。若结果收缩为基准与诊断，则投 IEEE TVCG / IEEE VR 2028（用户研究和 HMD 评测很契合）。", "novelty": {"verdict": "partially_scooped", "remaining_novel_angle": "我没有找到任何 2024-2026 年的工作在一个在线、FEED-FORWARD、固定阵列的多视角视频管线中结合以下内容：\n(i) 只对 TSDF 表面点处的跨视角不一致（镜面）残差做 plane-sweep，显式估计逐帧的第二个“反射深度”；\n(ii) 用各自的深度前向 splat 漫反射层和镜面层；\n(iii) 给它们不同的时间滤波器：漫反射用重的 TSDF 记忆，镜面用低惯性、由反射深度扭曲的记忆；\n(iv) 在远程呈现内容（眼镜、皮肤、屏幕）上用限定于镜面区域的时间和视角一致性指标（高光 mask 上的 EPI/STED/TCC）评测。\n\n双层表示本身并不新颖（Sinha 2012；Xu 2021，构思者未引用后者）。从固定阵列视频中隐式地用多层处理反射也不新颖（DeepView/Broxton 2020；实时方面有 Quark 2024）。用跨视角光度离散度作为镜面检测器是教科书式 MVS。\n\n因此可辩护的主张是狭窄的：首个在线、带时间滤波的双层反射 IBR，其分层时间动态解决了滞后与闪烁的权衡，外加一个镜面远程呈现一致性基准。\n\nIdea B 更弱。沿目标光线融合并端到端训练的逐视角概率深度分布已经成熟：Soft3D 2017、Self-Supervised Visibility Learning CVPR 2021、NeuRay CVPR 2022。逐像素 Kalman 深度滤波和立体不确定性头也是经典方法。剩下的是一个系统层面的发现：经校准的立体基础模型不确定性（单目-立体不一致），通过一个时间上 Kalman 滤波的实时融合传递，门控几何扭曲与 Unstructured-Lumigraph 式回退之间的切换。它最可发表的部分大概是解释原论文 TSDF 消融为零的诊断，而不是融合算子本身。", "threats": [{"title": "Scalable Image-based Indoor Scene Rendering with Reflections (Xu et al.)", "url": "http://www.cad.zju.edu.cn/home/weiweixu/wwxu2021.files/ReflectiveIBR.pdf", "year": "2021", "venue": "ACM TOG / SIGGRAPH 2021", "overlap": "high", "what_overlaps": "Idea A 的核心表示洞见：前层（RGB-D 表面）加后层（位于虚深度的反射几何），二者都用于 IBR 扭曲，并合成以最小化新视角误差。在已发表的双层反射 IBR 中它是最接近的先驱，比 Sinha 2012 更接近，而构思者没有引用它。", "what_remains_different": "它是离线的，使用全局网格引导的交替优化，针对静态室内场景。没有 feed-forward 推理，没有在线逐帧反射深度，没有时间滤波，也没有动态内容。"}, {"title": "Immersive Light Field Video with a Layered Mesh Representation (Broxton et al.)", "url": "https://dl.acm.org/doi/10.1145/3386569.3392485", "year": "2020", "venue": "ACM TOG / SIGGRAPH 2020", "overlap": "medium", "what_overlaps": "一种从固定相机阵列学习得到（DeepView）的 feed-forward 多层表示，用于多视角视频。它通过把内容放在位于虚深度的额外层上，显式地再现视角相关的反射和半透明，这是 Idea A “第二视差层”的隐式版本。", "what_remains_different": "这些层是通用的（MPI/shell 压缩为 RGBA+深度）。没有显式镜面检测或反射深度估计，没有漫反射/镜面拆分，没有分层时间滤波，没有 TSDF 几何，也不是在线远程呈现管线。"}, {"title": "Quark: Real-time, High-resolution, and General Neural View Synthesis", "url": "https://arxiv.org/abs/2411.16680", "year": "2024", "venue": "ACM TOG / SIGGRAPH Asia 2024", "overlap": "medium", "what_overlaps": "从稀疏视频流进行实时（1080p，30 fps）feed-forward 分层深度图视角合成。半透明层可以隐式地在虚深度表示反射。它是“每像素多于一个深度”方面最强的实时 feed-forward 基线。", "what_remains_different": "摘要和项目页面没有显式的反射或镜面建模主张，也没有描述时间一致性机制。没有在镜面残差上的反射深度扫描，没有镜面感知几何融合，也没有分离的时间滤波器。"}, {"title": "Self-Supervised Visibility Learning for Novel View Synthesis", "url": "https://arxiv.org/abs/2103.15407", "year": "2021", "venue": "CVPR 2021", "overlap": "high", "what_overlaps": "Idea B 的“概率目标光线融合”：逐源视角可见性构建共识体，软光线投射得到目标视角深度的概率分布。源像素用它扭曲并融合，由合成损失端到端训练。这是硬融合的一种学习的、可微的推广。", "what_remains_different": "它是静态且逐帧的，没有来自立体基础模型的校准逐视角不确定性，没有时间（Kalman）滤波，没有光场回退模式，也不关注镜面。"}, {"title": "Neural Rays for Occlusion-aware Image-based Rendering (NeuRay)", "url": "https://arxiv.org/abs/2107.13421", "year": "2022", "venue": "CVPR 2022", "overlap": "medium", "what_overlaps": "逐输入视角的像素特征被解码为 mixture-of-logistics 深度分布，用于在可泛化 IBR 中计算沿目标光线的逐视角可见性。这本质上就是“沿目标光线融合逐视角深度分布”。", "what_remains_different": "它是 NeRF 式体渲染，非实时，静态，没有时间滤波，没有光场回退，也没有针对立体基础模型的不确定性校准。"}]}}, {"id": "C01", "name": "Asynchronous / unsynchronized / staggered consumer camera rigs (online sub-frame sync, rolling shutter, continuous-time state, latency gain)", "decision": "pursue_with_repositioning", "scores": {"novelty": 5, "significance": 6, "feasibility": 6, "telepresence_fit": 8, "overall": 5.5}, "sharpened": {"title_zh": "从几何中恢复时钟：基于深度融合残差的在线亚帧同步，用于非同步采集阵列上的实时 3D 视频", "title_en": "Clocks from Geometry: Online Sub-Frame Synchronization from Depth-Fusion Residuals for Live 3D Video on Unsynchronized Rigs", "one_liner": "实时 image-based TSDF 本就会计算的有符号距离残差，可以作为每台相机亚帧时钟偏移的传感器。递归估计这些偏移，并将每个视角 splat 到同一个公共时间戳，就能让非同步的消费级深度设备以每帧不到 5 ms 的额外开销获得接近 genlock 的 3D 视频质量，并让渲染器可以在显示时刻查询场景。", "core_claim": "设定：6-8 台具备深度能力的设备，每台内部自同步（RGB-D、立体模组或带 LiDAR 的手机），但彼此之间不同步，以 30 fps 运行，未知偏移服从 U(0, 33 ms)，另有缓慢的时钟漂移。\n\n主张 1（估计器）：一个仅由管线在动态像素上的 TSDF 残差驱动的递归估计器，能将每台相机的偏移恢复到中位误差低于 2 ms（第 90 百分位低于 4 ms）。它在对话或手势运动开始后 1 s 内收敛，并能跟踪时钟漂移和跳变，全部在线完成。\n\n主张 2（渲染）：运动补偿的前向 splatting 到公共时间戳，能弥补未补偿管线与 genlock oracle 之间动态区域 LPIPS/PSNR 差距的至少 75%。其结果与同一管线输入离线 VisualSync 偏移或真值偏移时的差距在 0.3 dB 以内，且每帧最多增加 5 ms。\n\n主张 3（可辨识性）：由深度噪声和法向投影场景速度分布以闭式推导出的偏移 Cramér-Rao 界，在不同运动强度和深度来源下预测的偏移误差与实测值相差在 2 倍以内。\n\n若在相位降采样的真实基准上出现以下任一情况，则上述主张被证伪：\n- 偏移误差超过 5 ms；\n- 补偿弥补的差距不足 50%；\n- 在远程呈现的运动速度下，未补偿的差距本身在感知上可忽略（低于 0.3 dB 且无显著 2AFC 偏好）。", "key_insight": "在 image-based TSDF 中，视角 k 与融合表面之间的逐射线有符号距离残差可以围绕偏移线性化。对于具有 3D 速度 v 的动态表面点，它约为 n^T v · δ_k；对于静态点，它只依赖于外参误差。\n\n由此得出三点：\n- 基础管线已有的静态/动态划分将时间与位姿分离开来。静态像素提供 SE(3) 漂移的信息，运动像素提供 δ 的信息。\n- 关于 δ 的信息量为 Σ (n^T v)^2 / σ_z^2。这给出了一个闭式可观测性检验：仅在场景运动足够时更新时钟，否则保持不变；这样做无害，因为静止时偏移本来就无关紧要。\n- 一旦 δ 已知，使 δ 可观测的同一速度场也能消除它的影响。每个 pixel-Gaussian 沿 v·(t* − τ_k) 平流，t* 可以是任意查询时刻，包括显示 vsync。\n\n这一线索与 VisualSync 的运动点对极误差是同一个物理线索，估计器则是 VINS-Mono t_d 的套路。新的部分在于：这个测量是稠密的、三维的且免费的——它来自渲染器本就在运行的融合。这使亚帧同步成为实时渲染的副产品，而不是离线预处理。", "method": "以下所有数字均为 RTX 4090/5090 级 GPU、每视角 960x540、K=6-8 下的目标值。\n\n(1) 逐相机运动。同一相机连续帧之间的光流使用快速网络（NeuFlow-v2/RAFT-small 级别，批处理约 3-6 ms）。结合该相机自己的深度对，得到逐像素 3D 速度 v 和速度协方差 Σ_v。深度始终是设备内同步的：RGB-D 传感器、立体模组，或作为压力测试的单目度量深度。这消除了在不同步相机间做多视图立体的鸡生蛋问题。\n\n(2) 时间戳模型。τ_k(u) = t_k^arrival + δ_k + ρ_k·row(u)。卷帘快门斜率 ρ_k 是可选消融，对全局快门设备为已知或固定。δ_k 以较小过程噪声作随机游走漂移（时钟漂移为数十 ppm），另加针对丢帧和时钟重置的跳变检测器。\n\n(3) 测量。在约 10-20k 个降采样像素上，将视角 k 的点平流到融合时刻后，复用管线的 TSDF 有符号距离残差 s_k。雅可比 ∂s_k/∂δ_k = n^T v。对 [δ_k, ρ_k] 做 Huber 鲁棒的逐相机 Gauss-Newton 或 EKF 更新，开销远低于 1 ms。固定参考相机以消除规范自由度。\n\n(4) 分离位姿与时间。静态像素驱动每台相机低频（约 1 Hz）的 SE(3) 漂移更新。静态/动态权重在场景空间中根据 TSDF 残差幅值和速度重新推导，取代图像差分。\n\n(5) 可观测性门控。仅当累积 Fisher 信息超过阈值时才更新。将 Cramér-Rao 界作为逐相机置信度报告。\n\n(6) 不确定性感知的运动补偿前向 splatting。每个 pixel-Gaussian 位移 v·(t* − τ_k)，其足迹按 (t* − τ_k)^2 Σ_v 膨胀，使不确定的运动产生柔和的模糊而不是重影。时间深度滤波和 TSDF 在补偿后的点上运行。\n\n(7) Blend U-Net。增加逐视角 |t* − τ_k| 和速度置信度通道。使用由相位降采样或合成数据生成的随机偏移和卷帘快门增强进行微调，保持与基础论文相同的 L1 + 感知损失。\n\n(8) 显示时刻模式。以预测的 vsync 时刻作为 t* 查询，即最多一个帧间隔的短时外推。报告相对于采集时刻渲染的延迟/质量权衡曲线。\n\n不涉及新的大型网络。总附加开销目标为 5 ms 或更低，主要来自光流。除非作者代码可用，否则必须重新实现基础管线（image-based TSDF、pixel-Gaussian splatting、4 层 U-Net）。", "why_not_engineering": "有三项贡献超出了系统层面的调整：\n- 一个可辨识性结果：在动态场景中，由稠密深度融合残差得到的相机间亚帧偏移的闭式 Cramér-Rao 界，并对位姿和时间做静态/动态解耦。它经过实证验证，可预测何时能够在线同步（运动强度、深度噪声、视角数量）。\n- 估计与渲染的耦合。使时钟可观测的速度场同时抵消了时钟的影响，而不确定性膨胀的 splat 把估计误差转化为平缓的模糊而非重影。这带来了对场景有原则的连续时间查询，包括在显示时刻。\n- 第一个为实时多视角视图合成提供精确亚帧偏移真值的基准，通过对 genlock 高帧率采集做相位降采样构建，再加上一个带 LED 时间码参考的真实非同步消费级阵列。\n\n审稿人仍会看到较强的系统色彩。论文必须以该界和基准为主导，并把估计器呈现为它们的推论，而不是贡献本身。", "differentiation": "与主要先前工作对比：\n- Bradley et al. 2009（PROCAMS）。他们将同步和卷帘快门联合视为逐扫描行时间，用 2D 光流 warping 离线处理。我们引用它作为逐像素时间戳视角的起源，只主张在线、3D、由融合残差驱动的估计以及渲染器内补偿。\n- VisualSync（NeurIPS 2025）。它使用相同的运动点几何线索，但作为基于 tracklet 和 SfM 的离线批量优化，其报告的中位同步误差低于 50 ms。我们是递归在线的，使用稠密 3D TSDF 残差而不是稀疏对极距离，目标低于 2 ms。VisualSync 作为离线上界基线。\n- VINS-Mono t_d 与 Li & Mourikis。我们承认 EKF 加速度雅可比这一套路。他们估计静态世界中自运动的相机到 IMU 偏移；我们估计固定阵列观察运动场景时的相机间偏移，场景本身携带定时信号。我们加入一个稀疏特征的 VINS 式移植作为基线，以说明稠密融合残差为何重要。\n- Sync-NeRF、2511.11175、SyncTrack4D 和 ASTRA。这些是逐场景离线优化，作为质量上限。ASTRA 已撤稿，因此我们不依赖它。\n- 4DSloMo 和 Si Lu（WACV 2019）。为时间分辨率而错开触发，使用离线已知的触发偏移。错开触发只作为一个实验出现（等预算延迟），而不作为主张。\n- AMV-SLAM。其连续时间异步状态用于自运动；我们引用它作为连续时间框架的来源。\n- FusionMLS。它利用设备时间戳对非同步 RGB-D 做实时插值，没有偏移估计，也没有基于图像的渲染（IBR）。它是直接的“已知时间戳”基线。\n- RS-Avatar（2026）。它在 avatar 优化中给出逐扫描行的多相机定时。卷帘快门对我们来说是消融，而非主打。\n- Tele360、LiveStre4m 和 NoPo4D。它们是实时或 feed-forward 的，但假设流同步（NoPo4D 并不处理异步，与某个聚类想法中所说的相反）。我们的模块与之互补，可以插入其中。\n- SPARK。它只做在线外参自标定，没有时间建模。"}, "experiments": {"datasets": ["Sync-NeRF 'Unsynchronized Dynamic Blender' 数据集（https://arxiv.org/abs/2310.13356）：合成数据，偏移已知。另加我们自己用 Blender 渲染的动画人体（例如 Mixamo/AMASS 驱动），240 fps，带 GT 深度和模拟卷帘快门。它们提供精确的偏移真值，用于 CRB 验证和两周测试。", "DyNeRF / Neural 3D Video（30 fps）：帧级偏移与合成卷帘快门。通过插值得到的亚帧偏移单独报告并标注为近似，因为插值伪影会渗入真值。", "ENeRF-Outdoor：真实、不受控的同步和颜色误差，在全分辨率下评估，这是基础论文未能做到的。没有 GT 偏移，因此只报告 NVS 质量。", "DNA-Rendering 和 CMU Panoptic（硬件同步、稠密视角、约 30 fps）：帧级加合成亚帧扰动，测试跨视角数量的泛化。投入前需核实帧率和许可。", "D3DMV（与基础论文保持连续性），采用相同的合成扰动协议。", "4DSloMo 错开采集数据（https://github.com/OpenImagingLab/4DSloMo），仅在发布后使用。我查看的 README 仍将数据集上传列为待定，因此不要依赖它做计划。", "CUSTOM（必需）：一个 genlock 的 6-8 台全局快门相机阵列，120-240 fps，相位降采样到每台相机 30 fps 以提供精确亚帧 GT，另有 2 台 genlock 相机留出用于 NVS。再加一个真实的非同步消费级阵列（4-6 台 RGB-D 设备或 LiDAR 手机和网络摄像头），配 LED 时间码面板提供 GT 偏移，以及一个光电二极管测量采集到光子的延迟。"], "baselines": ["基础论文（Ha et al. 2025，重新实现），不做补偿，即朴素的最新帧融合", "基础论文 + oracle GT 偏移和运动补偿（上界）", "基础论文 + 离线 VisualSync 偏移（https://arxiv.org/abs/2512.02017），一个非在线的离线上界", "软件时间戳对齐（主机到达时间 / NTP / UVC 时间戳）+ 最近帧或 FusionMLS 式插值（已知时间戳基线）", "逐相机视频帧插值（RIFE/FILM）到公共时刻，然后运行基础管线", "稀疏特征在线 EKF 时间偏移估计器（在被跟踪运动特征的对极残差上移植 VINS-Mono t_d），用于分离稠密融合残差的价值", "离线逐场景优化上限：Sync-NeRF、Dynamic Gaussian from Unsynchronized Videos（2511.11175）、SyncTrack4D", "在非同步条件下假设同步的实时系统（Tele360 / LiveStre4m，若代码可用），以说明该失效模式具有普遍性"], "metrics": ["偏移误差（ms，中位数、第 90 百分位）、运动开始后的收敛时间、时钟跳变后的恢复时间、漂移跟踪误差", "实测偏移方差与预测 Cramér-Rao 界的对比，按运动速度和深度噪声分层", "在留出相机上全帧和动态区域掩码的 PSNR / SSIM / LPIPS", "运动边界上的重影/双边缘指标，以及用于时间一致性的光流 warping 误差、TCC 和 STED", "附加运行时间（ms/帧）与内存；端到端 fps", "采集到光子的延迟分布，用光电二极管或高速相机测量，对比显示时刻渲染与采集时刻渲染", "在显示器或 HMD 上的小规模 2AFC 用户研究（重影 / 感知延迟）"], "key_ablations": ["仅动态 vs 仅静态 vs 残差角色划分（时间与位姿的可辨识性）", "可观测性门控开/关（静止时段和慢速运动下的行为）", "卷帘快门项开/关（全局快门 vs 卷帘快门阵列）", "不确定性膨胀的 splat 足迹 vs 单纯位移", "Blend 网络时间/置信度通道和偏移增强开/关", "深度来源：传感器 RGB-D vs 立体模组 vs 单目度量深度（线性化失效）", "运动模型：匀速 vs 匀加速；偏移幅度扫描 0-33 ms；按运动速度分层（说话头部 / 手势 / 快速手部）", "相机数量 K=4/6/8 以及光流网络质量", "显示时刻外推时长 vs 质量（延迟/质量 Pareto 曲线）", "等预算实验：有意错开触发 vs genlock 阵列配合显示时刻渲染，作为次要结果而非主打"], "needs_custom_capture": true, "capture_notes": "公开的多视角动态数据集几乎都约为 30 fps 且 genlock。我能核实的数据集中，没有一个提供相位降采样所需的 120 fps 以上 genlock 采集来得到精确亚帧偏移 GT，而 4DSloMo 的数据在其 GitHub 上看起来尚未发布。因此公开数据上的亚帧 GT 只能来自合成渲染（Sync-NeRF Blender 集、自制 Blender 人体）或近似插值。\n\n要写出一篇可信的 CVPR/ICCV 论文，团队应搭建两套阵列：\n(a) 6-8 台硬件触发的全局快门机器视觉相机，120-240 fps（含镜头和触发盒约 USD 3-6k），标定一次，采集约 10-20 段对话和手势运动序列，留出 2 个视角。\n(b) 一个由 4-6 台 RGB-D 设备、LiDAR 手机或网络摄像头组成的非同步消费级阵列，配一块可见的 LED 时间码面板（微控制器驱动，1 ms 分辨率）提供 GT 偏移，并在显示器上放置光电二极管测量延迟。\n\n基准应当公开发布，因为它是核心贡献。为阵列搭建、标定和采集预留 4-6 周的学生时间。"}, "first_two_week_test": "第 1 周：用 Blender 渲染包含 1-2 个做手势的动画人体的场景（加上 Sync-NeRF Unsynchronized Dynamic Blender 场景），从 8 台固定相机以 240 fps 渲染，带 GT 深度和 2 个留出视角。将每台训练相机相位降采样到 30 fps，随机偏移服从 U(0, 33 ms)。实现一个最小的 image-based TSDF（沿目标射线的投影有符号距离融合）和一个点/pixel-Gaussian 前向 splatter。每台相机用 RAFT/NeuFlow 光流加该相机自己的深度得到速度。基于动态像素 TSDF 残差对 δ 运行逐相机的 Gauss-Newton/EKF 更新。\n\n第 2 周：在真实的深度噪声下重复（GT 深度加类 Kinect 噪声模型，以及单目度量深度），并使用较慢的“说话头部”运动。\n\n测量：\n(i) 偏移误差随时间的变化，以及与闭式 CRB 的对比；\n(ii) 在留出视角上，无补偿、估计 δ 补偿、GT δ 补偿和 genlock 采集的动态区域 PSNR/LPIPS；\n(iii) 未补偿差距随运动速度的变化。\n\n不需要 blend 网络；使用简单的深度测试加权混合即可。这足以表明残差是否携带时钟信息，以及消除时钟误差是否重要。", "kill_criteria": "若出现以下任一情况，则放弃该想法，或降级为 workshop 或系统短文：\n(1) 在真实深度噪声下，经过 2 s 手势级运动后中位偏移误差仍高于 5 ms（一帧的 15%），或 CRB 与实测方差相差超过 3 倍，说明线性残差模型不能描述现实。\n(2) 估计 δ 补偿弥补的动态区域差距（相对于 GT δ 补偿）不足 50%。\n(3) 在远程呈现的运动速度下（头部、躯干、手部最高约 1.5 m/s），未补偿的半帧失同步差距在动态区域低于 0.3 dB PSNR 且低于 0.01 LPIPS，且没有可见重影。若如此，该问题对远程呈现不值得写一篇论文，离线同步或软件时间戳就足够了。\n(4) 简单的软件时间戳 + 插值基线，或稀疏特征 VINS 式估计器，在噪声范围内与稠密融合残差估计器持平。那样贡献就退化为工程。\n(5) 投稿前出现一篇 2026 年的论文，在实时 NVS/融合循环内做在线相机间亚帧同步。需重新做 arXiv 检索，因为新颖性检索对 2026 年 7-9 月的覆盖受限流影响而减弱，我的检索也是如此。", "reviewer_objections": [{"objection": "直接用硬件同步就行。RGB-D 传感器和机器视觉相机的 genlock 或触发线很便宜，所以这是在解决一个不存在的问题。", "rebuttal": "手机、笔记本、网络摄像头以及大多数消费级 RGB-D 或立体设备无法一起触发。UVC 和主机时间戳有几 ms 的抖动并且会漂移。这些设备上不支持跨设备 PTP。即使是 genlock 的卷帘快门阵列也存在逐行定时。\n\n我们将测量消费级阵列真实的时间戳抖动和偏移来支撑这一点。同一套机制还带来显示时刻渲染，对同步阵列同样能降低采集到光子的延迟，因此贡献并不依赖于阵列不同步。"}, {"objection": "这就是把 VINS-Mono 的在线时间偏移 EKF 加上 VisualSync 的运动点对极线索移植到渲染器里，是增量式工程。", "rebuttal": "我们明确承认两者。贡献在于：\n(a) 动态场景中由稠密融合残差得到的相机间偏移的闭式可辨识性界，带有位姿与时间的静态/动态解耦，并经过实证验证；\n(b) 可观测性来源（速度场）同时驱动不确定性感知补偿的耦合；\n(c) 一个精确 GT 基准。\n\n实验将直接的 VINS 式稀疏特征移植和 VisualSync（中位误差低于 50 ms，离线）作为基线，并表明稠密 3D 残差可在线达到低于 2 ms 的精度。"}, {"objection": "鸡生蛋问题：由非同步相机计算出的深度本身就被污染了，所以残差是有偏的。", "rebuttal": "设定限定在深度为设备内同步的单元（RGB-D、立体模组、LiDAR 手机或单目度量深度），这正是现实的消费级情形。只有设备间时钟未知。对深度来源的消融显示了线性化在哪里失效，而 CRB 能预测这种退化。"}, {"objection": "收益只出现在快速运动中；远程呈现大多是缓慢的说话头部，而且匀速外推在突然的手势上会失败。", "rebuttal": "结果按运动速度分层。在 1.5 m/s 手速下，半帧偏移约为 25 mm，在 1 m 处相当于数十像素，由此产生的重影正是用户会注意到的。补偿在帧间隔内做插值而非外推，只有可选的显示时刻模式例外，对此我们报告明确的延迟/质量 Pareto 曲线。不确定性膨胀的 splat 会平缓退化，而在慢速运动中，门控会保持偏移固定，此时偏移是无害的。"}, {"objection": "把卷帘快门加同步视为逐像素时间是老观点（Bradley 2009），多相机卷帘快门 Gaussian 也已存在（RS-Avatar）；基准依赖合成或插值偏移。", "rebuttal": "我们不主张时间戳模型的新颖性；卷帘快门只是消融，两项工作均被引用。基准的真实部分使用相位降采样的 120-240 fps genlock 采集，具有精确 GT，另加一个 LED 时间码消费级阵列。基于插值的公开数据结果标注为近似，不用于主打主张。"}], "synergies": "与其他远程呈现方向的协同：\n- 端到端（glass-to-glass）延迟、后期重投影和异步空间扭曲（asynchronous spacewarp）：同一个连续时间查询支撑显示时刻渲染。这自然形成一个两篇论文的系列：“从几何中恢复时钟”，然后“在 vsync 时刻渲染”。\n- 在线标定漂移与自标定工作（SPARK 式）：静态像素 SE(3) 分支将时间与位姿自标定统一为一篇“自维护阵列”论文。\n- 无位姿的 feed-forward 实时系统（Tele360、LiveStre4m、NoPo4D）：同步模块可直接修复它们的同步流假设。\n- 长时程时间一致性与循环状态：时钟漂移和跳变是一个长时程鲁棒性维度。\n- 混合帧率和传感器的异构阵列，包括手机加 RGB-D 设备以及事件相机：逐像素时间戳模型可以直接推广。\n- 带宽感知流式传输：错开的异步到达平滑了网络和计算的突发性，时间元数据支持接收端补偿。\n- 在合成失同步、卷帘快门和外参抖动退化上训练的鲁棒性“修复”网络：该基准为其提供成对训练数据。", "effort": {"months": "6-8（约 1 个月重新实现基础管线，1-1.5 个月搭建阵列和采集，3-4 个月做方法、实验和用户研究，再加写作）", "people": "1 名全职博士生加 1 名兼职人员（阵列、采集、延迟测量），导师需熟悉状态估计", "compute": "适中：1-4 块 RTX 4090/5090 级 GPU。只微调 blend U-Net（数十 GPU 小时）。估计器是经典方法。硬件方面，genlock 高帧率阵列约 USD 3-6k，消费级阵列约 USD 1-2k，LED 时间码板和光电二极管远低于 USD 200。"}, "venue": "如果 CRB/可辨识性分析和精确 GT 基准足够强，投 ICCV 2027（截稿约 2027 年 3 月）。否则投 IEEE ISMAR 2027（TVCG 期刊轨道）或 IEEE VR 2028，这些会议看重消费级阵列和延迟方面的叙事。3DV 作为后备。考虑到所需的采集，CVPR 2027（2026 年 11 月）太早。", "novelty": {"verdict": "partially_scooped", "remaining_novel_angle": "几乎每个组件都已存在，但在我能检索到的范围内，没有找到 2024-2026 年的工作做到以下这些：逐帧在线递归地估计每台相机的亚帧时间偏移，以及可选的卷帘快门读出；以实时多视角深度融合（image-based TSDF）的残差作为测量，依靠本已将外参漂移（静态像素）与定时（动态像素）分开的静态/动态像素划分；并通过运动补偿前向 splatting 到任意渲染或显示时间戳，将这些估计直接反馈给实时的几何引导 IBR 渲染器。\n\n不能作为新贡献辩护的部分：\n- 同步加卷帘快门的逐像素时间戳视角及光流 warping（Bradley 2009）。\n- 运动点对极线索（VisualSync）。\n- 带速度雅可比的时间偏移在线 EKF 估计（VINS-Mono 和 Li & Mourikis，相机-IMU）。\n- 为时间分辨率而错开采集（4DSloMo、Si Lu 2019）。\n- 连续时间异步多相机状态（AMV-SLAM）。\n- 非同步 RGB-D 的实时插值（FusionMLS）。\n\n可辩护的次要贡献：\n- 通过对高帧率 genlock 采集做相位降采样构建的、具有精确偏移真值的基准。DyNeRF 是 30 fps，因此需要 120 fps 以上的来源。\n- 在多相机 3D 远程呈现中，于显示时间戳渲染所带来的实测采集到光子延迟收益。该原理在 VR timewarp 中已知，但显然尚未在实时多视角 IBR 中量化。\n\n定位必须是“面向实时 3D 视频的在线、在环、由几何残差驱动的同步”，而不是“首个建模失同步或卷帘快门”。", "threats": [{"title": "Synchronization and Rolling Shutter Compensation for Consumer Video Camera Arrays", "url": "https://www.cs.ubc.ca/labs/imager/tr/2009/Bradley-PROCAMS-2009/", "year": "2009", "venue": "CVPR Workshops (PROCAMS) 2009", "overlap": "high", "what_overlaps": "相同的问题陈述：没有 genlock 且存在卷帘快门的消费级相机阵列。它将同步和卷帘快门联合视为单一的时间剪切问题，通过沿光流的亚帧 warp 同时修正二者，每条扫描行使用不同的时间偏移。这就是想法 1 和 4 中“每个像素都有时间戳，沿光流平流”的思路，只是在 2D 中。", "what_remains_different": "离线后处理，由频闪或光流驱动，没有基于 3D 融合残差的在线偏移估计，没有对 splat 的 3D 场景流平流，也没有实时 NVS 或延迟角度。任何关于卷帘快门加同步作为单一时间戳模型的主张都必须引用它，且不能被表述为新贡献。"}, {"title": "VisualSync: Multi-Camera Synchronization via Cross-View Object Motion", "url": "https://arxiv.org/abs/2512.02017", "year": "2025", "venue": "NeurIPS 2025", "overlap": "high", "what_overlaps": "其核心线索是运动点违反对极几何的程度与时间偏移成正比，而静态点约束位姿，它借此为非同步消费级视频恢复逐相机的毫秒级偏移。想法 2 和 4 的关键洞察正是对同一线索的线性化。", "what_remains_different": "批量且离线：它依赖 tracklet、现成的 SfM 和全局优化。不使用在线或递归估计、TSDF 或深度融合残差、卷帘快门，也没有面向渲染的在环补偿。"}, {"title": "Online Temporal Calibration for Monocular Visual-Inertial Systems (VINS-Mono td), and Li & Mourikis 2014 'Online temporal calibration for camera-IMU systems'", "url": "https://arxiv.org/abs/1808.00692", "year": "2018", "venue": "IROS 2018 / IJRR 2014", "overlap": "medium", "what_overlaps": "想法 1、2 和 4 的估计机制在这里已经确立。时间偏移进入在线 EKF 或滑动窗口优化器的状态，测量按像平面特征速度乘以 td 平移，因此残差对 td 是线性的，额外开销可忽略。", "what_remains_different": "这些工作针对自运动的相机到 IMU 偏移（稀疏特征、静态世界）。本提案针对场景在运动时的相机间偏移，由稠密深度融合残差估计，通过静态/动态划分区分位姿与时间，并用于补偿渲染。因此“以速度为雅可比的 delta_c 上的 EKF”是移植过来的已知套路，而不是新的估计器。"}, {"title": "4DSloMo: 4D Reconstruction for High Speed Scene with Asynchronous Capture", "url": "https://arxiv.org/abs/2507.05163", "year": "2025", "venue": "SIGGRAPH Asia 2025", "overlap": "medium", "what_overlaps": "想法 3 的“用错开代替 genlock”前提：有意错开相机触发，使 N 台 f fps 的相机变成等效 N*f fps 的采集，用于动态 3D 重建。经典先驱是 Si Lu 的 'High-speed Video from Asynchronous Camera Array'（WACV 2019，https://arxiv.org/abs/1901.06034）以及 Wilburn et al. 的相机阵列。", "what_remains_different": "偏移由硬件触发已知，重建是逐场景 4DGS 加扩散修复器，目标是慢动作。没有在线状态、没有未知偏移估计，也没有显示时刻或延迟目标。"}, {"title": "Asynchronous Multi-View SLAM", "url": "https://arxiv.org/abs/2101.06562", "year": "2021", "venue": "ICRA 2021", "overlap": "medium", "what_overlaps": "想法 3 的“将阵列视为异步传感器网络、以每帧相机更新连续时间状态”正是这篇论文的定义性思想，它在异步多帧之间使用连续时间运动模型。", "what_remains_different": "它建模的是静态世界中刚性阵列的自运动，而不是固定阵列观察的动态场景。没有稠密 TSDF、没有场景流，也没有视图合成。"}]}}, {"id": "C12", "name": "Renderer-aware rate control and rate-distortion-flicker co-design for streaming multi-camera RGB-D", "decision": "pursue_with_repositioning", "scores": {"novelty": 5, "significance": 6, "feasibility": 7, "telepresence_fit": 8, "overall": 5.5}, "sharpened": {"title_zh": "一致性可压缩：面向有状态几何引导视图合成的多相机 RGB-D 码率-失真-闪烁编码", "title_en": "Consistency Is Compressible: Rate-Distortion-Flicker Coding of Multi-Camera RGB-D for Stateful Geometry-Guided View Synthesis", "one_liner": "当 RGB-D 远程临场运行在现实码率下时，渲染新视角中闪烁的最大来源是深度的有损编码，而不是渲染器。本项目测量这一效应，然后针对在 TSDF 融合与混合之后计算的“码率 + 视图失真 + 闪烁”目标对 RGB-D 输入进行编码。它把时间一致性移到发送端，并利用渲染器反投影的混合权重决定深度比特分配到哪里。", "core_claim": "可证伪的主张，分两部分。\n(i) 刻画。设定：4-8 相机 RGB-D 远程临场，总码率 5-30 Mbit/s，以低延迟设置的 HEVC 或 AV1 编码。在这些码率下，相对于从未压缩输入渲染，编解码器引起的深度误差造成了渲染新视角时间误差（光流 warping 误差 / tOF）增量的大部分（至少 50%）。接收端的时间深度滤波器（如 base paper 的颜色门控滤波器）去除的不到这一增量的一半，因为它无法区分编码噪声与运动。\n(ii) 补救。系统结合了发送端时间预滤波、基于渲染器敏感度的逐 CTU 深度 QP，以及一个以闪烁项训练的小型循环后滤波器。相对于朴素编解码器 + base 渲染器，它在匹配渲染闪烁时实现至少 25% 的 BD-rate 节省，在匹配 LPIPS 时至少 10%。相对于逐帧 Sandwiched-RGB-D 式预/后处理器，在匹配码率下闪烁至少降低 20%。整个系统保持与标准编解码器兼容，每帧增加不到 5 ms。\n如果 (i) 不成立，这篇论文就不存在。如果 (ii) 只在匹配 LPIPS 时成立而在匹配闪烁时不成立，工作就退化为 VSO/Sandwiched，应当放弃。", "key_insight": "在有状态的 IBR 流水线中（逐视图 splat，然后时间深度滤波 + 基于图像的 TSDF，然后混合网络），时间一致性与可压缩性是一致的。\n- 在发送端、使用接收端会计算的相同 TSDF/静态区域状态进行时间稳定化后的深度视频，具有更低的时间熵。因此它编码更便宜，也不会留下被接收端误认为运动的编码噪声。\n- 剩余的编码误差应当被塑形，而不是被均匀最小化。在渲染器给某像素权重很小的地方（低 混合权重 × alpha，反投影到源），或 TSDF 已经得到充分支撑的地方，误差是无害的。在轮廓处和新出现的动态区域，误差是有害的，因为它会改变哪个像素赢得不透明 splat，从而产生时间跳变。\n- 3D-HEVC VSO/VSD 为解析 DIBR 在空间上建模了这一点。还没有人为带持久状态的学习式渲染器在时间上建模它。由于编解码器 GOP 结构（I 帧呼吸效应、intra-refresh、QP 级联）本身是时间性的，闪烁是一个编码决策，而不只是渲染伪影。", "method": "阶段 0。刻画框架（主要贡献；也作为 benchmark 发布）。\n- 内容：带传感器或估计深度的多视图序列。\n- 编码：x265 / SVT-AV1 / NVENC，低延迟 P 模式，扫描 QP、GOP 长度、intra-refresh vs 周期性 IDR、深度位深打包（8-bit 逆深度 vs 10/12-bit，Starline 式亮度打包），以及颜色/深度码率拆分。\n- 渲染：在留出的阵列相机上，以及沿阵列相机之间的合成头部运动轨迹上。两者都使用 base 流水线，若 base 代码不可用则使用忠实复现（Starline 式基于图像的 TSDF + 4 级混合 U-Net）。\n- 分解：通过替换输入，把渲染闪烁拆分为渲染器固有、深度编码和颜色编码三部分。\n\n阶段 1。发送端一致性预滤波器。\n- 在编码之前，在发送端运行时间深度滤波器和一个轻量置信度网络。\n- 编码稳定化后的深度，外加一个可选的 1-bit、游程编码的轮廓/边缘旁路通道。\n- 预算：发送端 GPU 上至多 3 ms。\n\n阶段 2。基于渲染器敏感度的码率控制。\n- 对 M 个采样的目标位姿（阵列的留出相机，或预测的观看者位姿云），只运行廉价的前向 splat 和权重阶段。把 w·alpha 反投影到每个源相机。\n- 分别为深度（按轮廓邻近度和动态 mask 加权）和颜色累积逐 CTU 敏感度图。\n- 用闭式 Lagrangian 规则把敏感度映射为逐 CTU delta-QP。该规则离线标定，方法是按敏感度分箱拟合 d(LPIPS + μ·flicker)/d(rate)，即一个参数少于 50k 的学习式 R-D 斜率回归器。\n- 交付：x265 --qpfile/zones 或 NVENC QP-delta 图。无需修改解码器。\n\n阶段 3。接收端循环后滤波器。\n- 一个作用于解码深度的小型 ConvGRU（每视图至多 0.5 GMAC），以解码颜色和接收端上一帧融合 TSDF 深度 warp 到源视图的结果为条件。\n- 通过可微编解码器代理训练：Sandwiched 风格的学习式 HEVC/AV1 代理，在最后几个 epoch 使用 straight-through 的真实编解码器前向传播以限制失配。\n- 冻结的 base 渲染器置于损失之中：\n  L = λ·R_est + L1/LPIPS(novel view) + μ·||W_{t←t-1}(I_{t-1}) − I_t||_occ（渲染新视角上的光流 warp 时间误差，光流由 RAFT 在 GT 上计算）+ η·depth-edge loss。\n- 可选变体：联合训练一个预处理器（完整 Sandwiched 风格），以表明收益来自时间项而不是 sandwich 结构。\n\n训练数据：\n- DNA-Rendering 和 MVHumanNet（多视图人体；深度来自现成的 MVS/立体 FM）。\n- Panoptic Studio Kinect 序列（真实 ToF 深度）。\n- 在 DyNeRF / ENeRF-Outdoor / D3DMV（base paper 的协议）以及 Panoptic 上做留出测试。\n\n运行时预算：\n- 发送端：增加至多 5 ms。\n- 接收端：在 RTX 4090 级 GPU 上增加至多 5 ms，以真实编码/解码端到端测量。", "why_not_engineering": "1. 它提出一个可测量的科学主张，目前未知且结果可能朝任一方向：渲染远程临场中的闪烁有多少由编码造成，以及接收端的时间机制能否将其消除。还没有人测量过这一点。Sandwiched RGB-D 是逐帧的且没有时间指标，LiVo/ReVo 只报告 SSIM/MOS。DSGS (arXiv 2605.17002) 甚至报告了相反的效应——对纯纹理 atlas 而言压缩会稳定 splat 预测。因此结果是不确定的，而且这种不确定性是可以解决的。\n2. 它引入一个新的优化目标：在有状态渲染器之后测量的 码率 + 视图失真 + 闪烁。其对源像素编码误差的梯度由渲染器本身导出。这用时间性的、学习式渲染器敏感度取代了仅空间的解析 VSD。\n3. 它推翻了 base paper 的一个设计假设，即时间滤波应放在接收端，并表明反转后在码率和闪烁两方面都更好。\n\n逐 CTU QP 图和 WebRTC 管线是交付机制，不是贡献。", "differentiation": "- vs Sandwiched RGB-D (arXiv 2404.09979) 和 Sandwiched Video (2303.11473, 2407.07395)：它们独立处理每帧，使用 warp/JPEG 代理，没有时间损失或指标，也没有 TSDF 状态。我们加入了在有状态渲染器之后测量的闪烁项、利用接收端状态的循环后滤波器，以及发送端一致性。闪烁收益在匹配码率下展示，并有一个消融在有无我们时间项的情况下重新训练 Sandwiched。\n- vs 3D-HEVC VSO/VSD 和基于区域的 VSD 估计 (arXiv 2510.17037)：它们是解析的、仅空间的双视图 DIBR 模型。我们直接与 HTM VSO 编码的深度比较，并表明它不能降低渲染闪烁。\n- vs IMVS 导航感知分配 (arXiv 1802.08994)：该工作针对预编码内容以逐视图粒度选择视图。我们只在实时低延迟编码中做流内 CTU 级决策，位姿分布积分是可选的，不是主打。\n- vs LiVo (CoNEXT 2025, doi 10.1145/3768981)：LiVo 在各流之间分配带宽并剔除视野外内容。其全文无法访问，因此其分配是否使用渲染质量模型尚未核实；团队必须在投稿前读到它。我们不声称跨流分配是新的。我们以 LiVo 式视锥剔除 + 流拆分分配器为基线，并在其上加入我们的流内敏感度和闪烁目标。\n- vs PD-4DGS (arXiv 2605.11427)、V^3 (arXiv 2409.13648)、4DGC：它们把闪烁或时间项放入离线 4DGS 的表示侧编码中。我们为 feed-forward 渲染器编码实时 RGB-D 输入。\n- vs DeltaStream (MobiSys 2025) 和 LiveVV (arXiv 2310.08205)：它们发送变化检测得到的 delta。我们不声称跳过传输。感知接收端状态的跳过留给后续的系统论文。\n- vs DSGS (arXiv 2605.17002) 和 GS-SCNet (arXiv 2604.25330)：它们是替代的传输格式（纯纹理 atlas、语义 latent）。在代码允许时将它们作为锚点纳入，并在 RGB-D 设置下明确检验 DSGS 的“压缩带来稳定”发现。"}, "experiments": {"datasets": ["CMU Panoptic Studio：唯一一个带真实同步 Kinect RGB-D（10 台 Kinect v2）的大型公开多视图数据集。用于真实 ToF 噪声以及编码误差下的飞点。需核实深度/颜色标定工具（panoptic-toolbox）。", "DyNeRF / Neural 3D Video：18-21 个相机，每场景 300 帧。深度来自 base 流水线的立体/MVS 或立体基础模型。与 base paper 协议一致；评估全部 300 帧，而不仅是前 100 帧。", "ENeRF-Outdoor 和 D3DMV：base paper 的其他测试集。D3DMV 已被压缩（640x360），因此作为“二次压缩”情况单独报告。", "DNA-Rendering 和 MVHumanNet：多相机人体采集，用于训练后滤波器和 R-D 斜率回归器，伪深度来自 MVS。", "可选自定义采集：4-6 台 Azure Kinect / Orbbec Femto Bolt 围绕一位坐着的说话者，2-3 分钟对话，外加 2 台留出 RGB 相机。约 3-5k 美元。不是严格必需，但 IEEE VR/MM 的审稿人会看重真实的远程临场式 ToF 内容，并且需要分钟级序列来测试长 GOP 下的漂移。"], "baselines": ["对所有 RGB 和深度流做均匀 HEVC/AV1（x265、SVT-AV1、NVENC 低延迟）编码，后接未修改的 base 流水线（类 Starline 锚点）", "启用 VSO 深度编码的 MV-HEVC / 3D-HEVC HTM（解析 VSD 码率控制锚点）", "仅接收端时间滤波：在解码深度上使用 base paper 的颜色门控滤波器 + TSDF 反馈（检验接收端状态是否已经消除编码闪烁）", "对渲染输出施加的事后视频去闪烁或时间一致性方法（例如盲视频时间一致性网络）", "Sandwiched RGB-D 式逐帧预/后处理器，以相同渲染器置于损失中重新训练，但不含时间项", "LiVo 式分配：视锥剔除 + 动态颜色/深度流拆分，在获得全文后根据论文复现", "在代码可用时作为传输格式锚点：DSGS 式纯纹理 atlas + 解码端 splat 预测，以及 GS-SCNet（仅人体立体子集）"], "metrics": ["匹配新视角质量下的 BD-rate：留出相机上的 PSNR、SSIM、LPIPS 和 IV-PSNR", "匹配闪烁下的 BD-rate，核心指标：渲染新视角上的光流 warping 误差（遮挡 mask，光流由 ground truth 计算）、tOF / tLP、时间 IV-PSNR，以及新报告的匹配码率下的“BD-flicker”", "沿移动视点轨迹的闪烁（在阵列相机之间插值的合成头部路径，若有则加上录制的 HMD 轨迹），无 ground truth，使用相邻渲染帧之间的 warping 误差", "通过替换输入得到的闪烁分解（渲染器固有 vs 深度编码 vs 颜色编码）", "轮廓处的深度边缘误差和飞点率", "端到端新增延迟（发送端预滤波 + 敏感度计算，接收端后滤波）以及在指定 GPU 上的编解码时间", "小型感知研究：16-20 名受试者在 3 个码率下的 2AFC 闪烁偏好，包括渲染轨迹的立体 HMD 回放，用于验证客观闪烁指标对各条件的排序是否正确"], "key_ablations": ["匹配码率下，发送端 vs 接收端 vs 两端时间滤波", "后滤波器训练中有 vs 无闪烁项（μ=0）", "敏感度 QP 来源：渲染器 混合权重 × alpha vs 仅视锥 vs 3D-HEVC VSO vs 显著性 vs 均匀", "编解码器结构：GOP 长度、周期性 IDR vs 渐进 intra refresh，以及深度打包（8-bit 逆深度 vs 10-bit vs Starline 亮度打包），每项都以渲染闪烁衡量（刻画的核心）", "循环后滤波器以前一帧 TSDF 深度为条件 vs 无状态", "代理编解码器训练 vs straight-through 真实编解码器微调（代理失配）", "敏感度图向第二个渲染器的泛化（例如 GPS-Gaussian 或不带混合网络的简单 Starline TSDF）", "位姿分布积分（带预测噪声的 M 个采样位姿）vs 仅留出相机敏感度"], "needs_custom_capture": false, "capture_notes": "自定义采集并非严格需要。Panoptic Studio 提供真实的多 Kinect 深度，DyNeRF、ENeRF-Outdoor、D3DMV 和 DNA-Rendering 提供多视图颜色，深度按 base paper 的方式估计。\n\n缺口在于：\n- 没有带留出相机的公开远程临场式数据集（坐着的说话者、ToF 传感器、分钟级时长）；\n- 没有这些场景的公开头部跟踪观看者轨迹数据集。\n\n一个小型阵列（4-6 台 Azure Kinect 或 Femto Bolt 加 2 台 RGB 见证相机，约 3-5k 美元，2-3 周采集工程）加上 10-20 条录制的 Quest 3 观看轨迹，会增强 IEEE VR/MM 投稿，并可作为 benchmark 发布。应在两周测试通过之后再安排，而不是之前。\n\n另外应尽早检查 base paper 的代码和权重是否公开。如果没有，需预留约 3-4 周复现一个 Starline 式基于图像的 TSDF + 4 级混合 U-Net 作为冻结渲染器。这对该主张已经足够，因为主张针对的是一般的有状态几何引导 IBR。"}, "first_two_week_test": "一项无学习的刻画加两个 oracle 干预，在两个 DyNeRF 场景（例如 flame_steak、coffee_martini；全部 300 帧）和一个 Panoptic Kinect 序列上进行。\n\n准备：\n- 第 1-3 天：让渲染器跑起来（base 代码，或 Starline 式基于图像的 TSDF + 简单视图加权混合，足以完成测试）。获取每个相机的深度：DyNeRF 来自现成的多视图立体 / 立体基础模型；Panoptic 来自原始 Kinect。\n- 第 4-6 天：用 x265 低延迟 P 在 5 个 QP × {GOP 30 带 IDR，无限 GOP 带 intra-refresh} 下编码深度（和颜色）。渲染留出相机和 2 条合成移动轨迹。测量渲染视频相对于 (a) ground truth 和 (b) 未压缩输入渲染结果的 LPIPS 与遮挡 mask 光流 warping 误差。\n- 通过换入未压缩的深度或颜色来分解闪烁。\n\nOracle 干预（第 7-11 天）：\n- (1) 发送端预滤波：在编码前运行时间深度滤波器，对比在接收端对解码深度施加同一滤波器，码率匹配。\n- (2) Oracle 敏感度 QP：由留出相机计算 混合权重 × alpha 图，反投影到各源，用手调线性规则通过 x265 --qpfile/zones 转为逐 CTU delta-QP，对比匹配码率下的均匀 QP。\n\n第 12-14 天：计算匹配闪烁和匹配 LPIPS 下的 BD-rate。\n\n成功信号（继续推进）：\n- 在 5-30 Mbit/s 下，深度编码闪烁占渲染闪烁增量的至少 40-50%。\n- 仅接收端滤波后仍残留至少一半。\n- 两个未训练的干预合计在匹配闪烁下带来至少 15% 的 BD-rate。\n\n任何训练组件都将在此基础上叠加。", "kill_criteria": "若以下任一成立，则放弃或转向。\n1. 在现实的远程临场码率下（4-8 个相机 5-30 Mbit/s，QP 22-37），深度编码误差造成的渲染闪烁增量不到 25%，即闪烁主要由渲染器或混合网络本身主导。此时转向一篇渲染器侧的时间训练论文。\n2. base paper 的接收端颜色门控滤波器 + TSDF 反馈在匹配码率下已经去除了超过 70% 的编码引起的闪烁。\n3. 发送端预滤波 + oracle 敏感度 QP 合计在匹配闪烁下带来少于 10% 的 BD-rate，并且在匹配码率下闪烁降低少于 10%，意味着塑形并不优于均匀编码。\n4. 带 VSO 的 3D-HEVC HTM 在闪烁上已经达到敏感度 QP 的收益，此时学习式渲染器敏感度相对解析 VSD 没有增益。\n5. LiVo 全文（需在第 2 周前读完）表明它已经在流内分配中使用带时间项的渲染视图失真模型。此时放弃码率控制主张，只保留刻画部分（MM 短文 / QoMEX）。\n6. 以闪烁项训练的循环后滤波器在留出场景上、匹配码率下，未能在闪烁上比逐帧 Sandwiched 式变体好至少 15%。此时论文退化为仅刻画研究。", "reviewer_objections": [{"objection": "这是 3D-HEVC VSO/VSD 加 Sandwiched 压缩，只是换了一个更新的渲染器，因此新颖性是增量式的。", "rebuttal": "VSO/VSD 是仅空间的、面向双视图 DIBR 的解析模型，Sandwiched RGB-D 是逐帧独立的且没有时间指标。主打的是时间维度。我们首次测量编解码器的 GOP/QP/intra-refresh 选择如何通过持久 TSDF 状态传播为渲染闪烁，并表明 HTM-VSO 和逐帧 Sandwiched 都不能减少它。两者都作为基线纳入，且 Sandwiched 以我们的时间项重新训练作为消融，从而隔离收益来源。"}, {"objection": "闪烁指标（warping 误差、tOF）没有经过感知验证，移动视点闪烁也没有 ground truth。", "rebuttal": "我们报告多个互补指标（遮挡 mask 光流 warping 误差、tOF/tLP、时间 IV-PSNR），并通过 16-20 名受试者（包括立体 HMD 回放）的 2AFC 研究验证其排序。对于移动视点，我们使用渲染视频相邻帧间的 warping 误差，用渲染器自身的 TSDF 几何做 warp，并以未压缩输入的渲染作为参照进行比较。近期的质量评估工作（GScomp-QA、压缩 vs 时间一致性研究 arXiv 2605.18378）恰恰说明了这一空白。"}, {"objection": "结果绑定于一个特定渲染器（Ha et al.），敏感度图和后滤波器可能无法迁移。", "rebuttal": "敏感度对任何前向传播暴露逐源贡献（混合权重、splat alpha）的渲染器都有定义，否则可通过梯度获得。我们在两个渲染器上评估：base 流水线或 Starline 式 TSDF，以及一个 feed-forward Gaussian 渲染器如 GPS-Gaussian。我们还报告 QP 规则的跨渲染器迁移。刻画部分不依赖于渲染器。"}, {"objection": "通过可微编解码器代理训练并不反映真实编解码器行为，而部署需要标准解码器和低延迟。", "rebuttal": "所有报告的数字都使用低延迟配置下真实的 x265/SVT-AV1/NVENC 码流。代理只用于提供梯度，之后在前向中使用真实编解码器做 straight-through 微调。码率控制使用标准 QP 图接口，因此码流保持标准兼容。我们测量并报告发送端和接收端开销（各低于 5 ms）以及指定 GPU 上的完整编解码延迟。"}, {"objection": "为什么还要传 RGB-D？Gaussian/latent 传输格式（GS-SCNet、Tele360、DSGS）避免了深度编码，而 LiVo 已经实现了带宽自适应的 RGB-D 会议。", "rebuttal": "由于硬件编解码器和 RTC 传输，已部署的系统和研究系统仍在通过 2D 编解码器发送 RGB-D 或几何（Starline 亮度打包深度、ReVo、LiVo）。我们在代码允许时将 DSGS/GS-SCNet 作为锚点纳入，并在 RGB-D 设置下检验 DSGS 的“压缩带来稳定”发现。对于 LiVo，我们不声称跨流分配或剔除。LiVo 式分配器是一个基线，我们的流内、闪烁感知塑形可以与它组合。"}], "synergies": "1. 持久状态 / 传输格式方向（静态区域 TSDF 或 Gaussian 状态只发送一次，之后流式传输残差）。这里的发送端预滤波器和接收端状态后滤波器是第一步。二者合起来形成两篇论文的系列：(a) 本文的 RDF 刻画与编码论文，然后 (b) 一篇感知接收端状态的跳过/隐藏 + 位姿预测分配的系统论文。\\n2. 头部跟踪评估 benchmark（移动视点 + 动态场景闪烁、HMD 轨迹）。移动轨迹闪烁指标和录制轨迹是共享基础设施，可以一起发布。\\n3. 面向相机阵列的基础模型或传感器 prompt 深度（Prompt Depth Anything、StreamTTO）。学习得到的深度在压缩下与 ToF 有不同的误差统计，在两种深度来源上都做刻画会增强两篇论文。\\n4. 渲染器侧时间训练（给混合网络加时间损失）。闪烁分解告诉该方向有多少闪烁是固有的、有多少由输入造成。\\n5. 远程临场闪烁的感知质量评估（一个小型主观数据集），用户研究同时作为数据集贡献。\\n6. 注视点 / 视线驱动编码与丢包恢复（ReVo 式 FEC）。敏感度图可以自然扩展到视线加权，以及对高敏感度 CTU 优先施加 FEC。", "effort": {"months": "6-8（约 1 个月做渲染器和测试框架，1.5 个月做刻画，3 个月做学习式后滤波器、R-D 回归器和消融，1-1.5 个月做用户研究和写作）。若包含自定义采集，再加约 1 个月。", "people": "1 名全职博士生，加 1 名具有视频编码或系统背景的兼职合作者（编解码器配置、HTM-VSO 基线、延迟测量）", "compute": "2-4 块 GPU（RTX 4090 或 A100 级）。编解码扫描是 CPU 密集型（x265/HTM），因此 32-64 核 CPU 节点有帮助。后滤波器训练每种配置约 1-3 GPU 天。可选 3-5k 美元的 RGB-D 传感器阵列，加一台 Quest 3 用于轨迹录制和用户研究。"}, "venue": "首选：ACM Multimedia 2027（主会），编解码器在环和带刻画研究的 QoE 工作最契合。备选：若头部跟踪轨迹评估和立体 HMD 用户研究足够强，则投 IEEE VR 2027 / TVCG；扩展期刊版投 IEEE TCSVT。只有当学习式 R-D-闪烁后滤波器在两个渲染器上都显示出大幅、干净的收益时，CVPR 才有可能。应视为冲刺目标，因为该贡献读起来像是压缩 + 远程临场。后续的系统论文（基于 WebRTC 的位姿预测分配 + 接收端状态跳过）将投 MMSys/NOSSDAV 或 CoNEXT，但只能在与 LiVo 仔细比较之后。", "novelty": {"verdict": "partially_scooped", "remaining_novel_angle": "高层框架已经被发表。“按观看者导航分布上的期望合成视图失真来分配比特和相机”是 IMVS / VSD 文献（Toni, Frossard, Ortega；3D-HEVC VSO）。“在实时多相机 RGB-D 2D 编解码流之间做观看者剔除式带宽分配”是 LiVo (CoNEXT 2025)。“围绕标准编解码器、以新视角损失训练的学习式预处理和后处理器”是 Sandwiched RGB-D。“码率-失真损失中的闪烁正则项”是 PD-4DGS 和 V^3。“不要重发静态区域”是 DeltaStream 和 LiveVV。\n\n站得住的新颖性更窄，分三部分：\n(a) 把渲染新视角的时间闪烁作为有状态、学习式 IBR 渲染器输入 RGB-D 流的一等编码目标（码率 + λ·视图失真 + μ·闪烁，在 TSDF 融合和混合之后测量）。这包括首次对深度编码噪声、GOP/QP/intra-refresh 选择与 TSDF 时间状态如何相互作用产生闪烁的实证刻画。没有找到任何工作为输入 IBR 的编码 RGB-D 测量闪烁：Sandwiched RGB-D 逐帧独立且无时间指标，ReVo/LiVo 只报告 SSIM/MOS。\n(b) 使用学习式渲染器的 混合权重 × alpha，反投影到源相机并在预测的 HMD 位姿分布上积分，作为可微的逐 CTU 敏感度，取代解析 DIBR VSD 模型。这是相对 VSD 和 LiVo 式剔除的适度但具体的升级，前提是 LiVo 全文尚未使用渲染质量模型。\n(c) 复用接收端的持久 TSDF/背景状态，同时作为跳过或隐藏模型以及闪烁抑制器，采用置信度门控刷新。这与 DeltaStream 的变化检测 delta 不同，因为什么可以被跳过由接收端渲染器已经能够解释的内容决定。\n\n审稿人会认为单独的 (b) 相对 VSD/IMVS 加 LiVo 是增量式的。论文需要以 (a) 为主打，(b) 和 (c) 作为机制。", "threats": [{"title": "LiVo: Toward Bandwidth-adaptive Fully-Immersive Volumetric Video Conferencing", "url": "https://doi.org/10.1145/3768981", "year": "2025", "venue": "Proc. ACM Netw. (CoNEXT 2025)", "overlap": "high", "what_overlaps": "基于标准 2D 编解码器和 RTC 传输的实时多相机 RGB-D 会议，在颜色和深度流之间动态分配带宽，并做观看者视场剔除。这就是 Idea 1（由观看者驱动的相机与流分配）的系统骨架。合著者（Ortega）来自视图合成失真码率分配的传统，因此其分配可能已经使用了渲染质量模型；我无法核实，因为全文返回 403。", "what_remaining_different": "", "what_remains_different": "没有学习式 IBR 渲染器。重要性来自几何剔除，而非渲染器反投影的混合权重敏感度。（就摘要所示）没有流内的逐 CTU QP 塑形，没有时间一致性或闪烁项，也没有用于隐藏或跳过的持久 TSDF 接收端状态。"}, {"title": "Adaptive Streaming in Interactive Multiview Video Systems (Zhang, Toni, Frossard et al.), plus the earlier IMVS line (e.g. arXiv 1506.07823)", "url": "https://arxiv.org/abs/1802.08994", "year": "2018", "venue": "arXiv cs.MM / IEEE TCSVT line", "overlap": "high", "what_overlaps": "Idea 1 的核心概念洞察已经在这里：在带宽预算下，选择发送哪些相机视图和质量等级，以最大化用户导航分布上的期望合成视图质量，在编码伪影与合成伪影之间权衡。Idea 1 的“在预测观看者位姿分布上积分重要性并做 Lagrangian 分配”重复了这一表述。", "what_remains_different": "基于解析或实测视图合成失真（VSD）的 DIBR，逐视图粒度，离线或预编码内容，没有学习式渲染器、没有逐 CTU 敏感度、没有闪烁项，也没有实时 6DoF HMD 位姿预测。"}, {"title": "View-synthesis-distortion (VSD) estimation for 3D video coding and rate allocation (Bi and Liang 2025; auto-weighted layer VSD 2022)", "url": "https://arxiv.org/abs/2510.17037", "year": "2025", "venue": "arXiv eess.IV", "overlap": "medium", "what_overlaps": "建模纹理和深度编码误差如何传播到 DIBR 合成视图中，包括基于区域的混合估计，明确“为实时应用优化资源分配”，如交互式 FVV。“在渲染器忽略的地方深度误差无害，因此应塑形而非最小化”这一想法是长期存在的 3D-HEVC VSO/VSD 原则，削弱了 Idea 2 的码率控制部分。", "what_remains_different": "免训练的解析 DIBR 模型，使用两个参考视图。不使用学习式混合网络或 TSDF 融合，没有时间或闪烁成分，也没有端到端学习的预处理或后处理。"}, {"title": "Sandwiched RGB-D Video Compression / Sandwiched Video Compression (Hu, Guleryuz, Chou et al.)", "url": "https://arxiv.org/abs/2404.09979", "year": "2024", "venue": "CVPR 2024 Workshop", "overlap": "medium", "what_overlaps": "Idea 2 的架构正是这个：围绕 HEVC/H.264 的神经预处理和后处理器，通过可微编解码器代理、以新视角（视差 warp）渲染损失训练，为远程临场学习跨视图和跨模态的隐式比特分配。姊妹论文 arXiv 2303.11473 对视频做了同样的事。", "what_remains_different": "逐帧独立处理，没有闪烁或时间损失，损失中是简单 warp 而非学习式 IBR 加 TSDF 渲染器，没有利用解码端状态的循环后滤波器，也没有显式的 CTU 级码率控制。"}, {"title": "PD-4DGS: Progressive Decomposition of 4D Gaussian Splatting for Bandwidth-Adaptive Dynamic Scene Streaming", "url": "https://arxiv.org/abs/2605.11427", "year": "2026", "venue": "arXiv", "overlap": "medium", "what_overlaps": "明确把闪烁纳入码率-失真目标：一个“Gaussian 熵属性码率-失真损失，配合时间 mask 一致性正则项……抑制低码率闪烁”。连同 V^3（Gaussian 视频编码中的时间损失），这意味着“码率-失真-闪烁”作为概念在表示侧并不新。", "what_remains_different": "面向 ABR 的离线 4DGS 表示编码。不是实时的，不是 RGB-D 输入编码，也没有 IBR 渲染器敏感度或观看者位姿驱动的分配。"}]}}, {"id": "C07", "name": "Hair / thin structures via online background-memory difference matting and two-layer soft-alpha Gaussians", "decision": "pursue_with_repositioning", "scores": {"novelty": 5, "significance": 5.5, "feasibility": 6, "telepresence_fit": 8, "overall": 5.5}, "sharpened": {"title_zh": "Plate Memory：面向在线、发丝保真多视角远程临场的可见性门控背景记忆与软占据融合", "title_en": "Plate Memory: Visibility-Gated Background Memory and Soft-Occupancy Fusion for Online Hair-Faithful Multi-View Telepresence", "one_liner": "在固定的远程临场（telepresence）相机阵列中，由 pipeline 自行构建并维护的逐相机颜色+深度背景记忆，把轮廓处的在线抠图（matting）转化为已知背景问题。随后，双层 alpha splatting 与 alpha 加权的软占据（soft-occupancy）image-based TSDF 可在无需空场景采集的情况下消除光晕（halo）、飞点（flying pixels）和“头盔发型”（helmet hair），并且 pipeline 会报告哪些像素来自真实的历史观测、哪些是幻觉生成的。", "core_claim": "在固定阵列的多视角序列上，通过以下方式维护一个自举（self-bootstrapped）的记忆：只在 image-based TSDF 表明光线看到的位置位于已存表面处或其后方时才写入；通过深度重投影在视角之间补全；并通过陈旧度（staleness）与增益模型使其失效。将该记忆输入已知背景抠图、双高斯混合像素 splatting 与软占据 TSDF，会产生四个可证伪的推论。(i) 与在相同数据上重新训练的基础几何引导 pipeline 相比，边界带 LPIPS（10 像素宽的轮廓带）相对下降至少 10%，边界闪烁（带内 tOF/tLP）相对下降至少 20%，且每帧额外开销不超过 +15 ms。(ii) 在同一 backbone 上，二者都优于固定空场景背景板（plate）的 BGMv2 变体和逐帧学习的软边界分解方法（alphaDepth 风格）。(iii) 在光照漂移或背景物体被移动时，alpha SAD 的退化幅度不到固定背景板的一半。(iv) 由记忆填充的去遮挡像素 PSNR 高于 blend net 幻觉生成的结果。若重新训练的基础 blend net 已经弥合了其与 oracle-alpha 双层渲染之间边界带差距的一半以上，则该主张被证伪。", "key_insight": "静态阵列确实使抠图问题变为适定（well posed）；这一点已由 BGMv2、DART 和 Capture Stage Matting 揭示。尚未解决的是：在有人占据场景的情况下，在线地确定背景板从何而来、何时可以信任。几何引导 pipeline 已具备回答这两个问题所需的一切。其逐视角 TSDF ray-march 提供了可见性测试，用以判断背景写入是否安全。其标定的多视角深度允许一个相机填补另一个相机在头部后方的背景板，因此即使被摄者几乎不动，背景板也能在数秒内完成自举。同一个显式记忆随后服务于三个使用者：alpha 估计、每个混合像素的背景层，以及用真实历史内容填补去遮挡区域。由于它是显式的，它还能产生逐像素的来源（provenance）图（当前观测、较早观测及其时长，或幻觉生成）。NSTM 等隐式记忆无法提供这种图，而它对远程临场中的可信度至关重要。", "method": "(1) 逐相机背景板记忆：在输入分辨率下存储颜色、深度、置信度和最后观测时间戳。仅当像素 u 处 TSDF 渲染的前景深度比观测深度靠前至少裕量 δ，或不存在前景且观测深度位于已存深度处或其后方时，才在 u 处写入。跨视角补全利用已存深度，将其他相机中置信的背景样本前向 warp 过来。光照漂移通过逐相机、逐 tile 的仿射增益/偏移处理，该增益在置信的静态像素上在线拟合。失效机制采用带迟滞（hysteresis）的深度或颜色残差测试，并对置信度施加陈旧度衰减。4-8 个相机在 GPU 上的开销约为 2-3 ms。(2) 抠图头：BGMv2 风格的两阶段网络。低分辨率粗略阶段输入 (I, B, |I-B|, 深度边缘图, 背景板置信度)，全分辨率 patch 细化仅在不确定带内运行，预测 α 和 F。跨视角一致性项通过将前景估计投影到相邻视角来三角化 F。当背景板置信度低时，该头回退到其自然抠图先验；训练中使用背景板 dropout 增强，使其学会这种回退。(3) 双层反投影：0<α<1 的像素发射一个前景高斯（颜色 F、不透明度 α、由时序滤波器细化的深度）和一个背景高斯（颜色 B、不透明度 1、深度取自记忆）。α≈1 或 α≈0 的像素行为与基础论文相同。混合像素仅占约 3-8%，使 splat 开销保持较小。(4) 软占据 image-based TSDF：SDF 样本以 α 加权，每条光线累积模糊不透明度 1-Π(1-α_i)。仅在累积不透明度高于 τ 处才判定表面零交叉。低于 τ 时，头发作为 alpha 层渲染，而不会被吸附到硬表面上；前一帧深度反馈使用 α 加权深度。(5) Blend net：基础的 4 层 U-Net 增加额外输入通道 α、背景板渲染、背景板置信度和陈旧度。它将前景合成到记忆背景之上，仅在背景板置信度低的区域预测自己的背景图像。它还输出来源图。(6) 训练：在采集或 HDR 背景上合成的发丝级（strand-hair）人体多视角合成数据，提供真值 α、F、B 和分层深度。真实数据为 DNA-Rendering 和 MVHumanNet++，使用自监督合成损失（利用记忆背景板，I≈αF+(1-α)B），外加带边界带加权的端到端留出视角渲染损失，以及经 TSDF 重投影的时序 alpha 一致性损失。运行时目标：在 RTX 4090、1080p、4-8 视角下，相对基础的每帧 40-100 ms 至多增加 +15 ms。", "why_not_engineering": "本文提出的是一个关于 pipeline 各部分之间信息如何流动的可检验主张。几何推导出的可见性，正是使在线已知背景先验能够自我维护所缺失的监督信号。当该先验可用时，双层 alpha 表示加软占据融合能修复一类学习式混合无法修复的伪影，因为不透明的单深度高斯在 blend net 看到之前就已丢弃了混合像素信息。论文以如下内容支撑这一点：oracle-alpha 上界分析；覆盖与自举分析（背景板收敛速度随被摄者运动和视角数量的变化）；按前景-背景颜色对比度分层的失败分析；以及未找到先例的软 TSDF 公式。论文还贡献了一个真实真值 alpha 的多视角头发 benchmark，采用双背景（三角化抠图）采集，目前在远程临场阵列上尚不存在此类数据。", "differentiation": "Zitnick et al. SIGGRAPH 2004：离线立体、贝叶斯边界抠图、静态 LDI 层，无时序记忆。我们在高斯上在线重新实现其边界层，并加入已知背景记忆。BGMv2 (CVPR 2021) 和 DART (2024)：单视角、手动采集的固定背景板、无 3D。我们将其用作组件和 baseline。Capture Stage Matting (2507.07623)：从不更新的固定空舞台背景板、逐视角抠图、离线 NeRF。我们无需空场景采集，并在线维护、跨视角补全和失效背景板。ISMAR 2026 多层 360 远程临场 (2608.05570)：带 BGMv2 的 2D 全景静态层，无 3D 新视角合成。HairGuard (2601.03362) 和 alphaDepth (2606.00386)：单视角学习式软边界分解，属于病态的自然情形。我们表明阵列记忆优于这些先验，尤其在时序评估下，并将 alphaDepth 风格分解作为 baseline。NSTM (2607.15271)：低分辨率的隐式 fast-weight 记忆，无抠图、无来源信息。我们的方法是显式的、全分辨率的且可审计。2023 年 VR 可能背景网格（Springer 10.1007/s10055-023-00921-w）：仅用于去遮挡的背景累积，无 alpha 或抠图。基础论文 (2505.18932)：不透明各向同性像素高斯和硬 TSDF。我们在混合像素处改变表示，软 TSDF 也使其薄弱的 TSDF 消融变得有意义。"}, "experiments": {"datasets": ["DyNeRF / Neural 3D Video（静态室内背景，18-21 个固定相机；基础论文协议：留出阵列相机；火焰和细工具提供混合像素压力测试）", "DNA-Rendering（固定穹顶，长发和宽松衣物；被摄者较居中，因此用于测试跨视角背景板补全；需检查许可证以及是否有空背景帧）", "MVHumanNet++（更长序列；分钟级记忆稳定性与陈旧度）", "CMU Panoptic Studio（人在静态穹顶中走进走出，提供自然的背景板自举和失效事件；需检查 HD 相机子集的分辨率）", "ENeRF-Outdoor（室外光照漂移，作为增益模型的压力测试；若失败，需如实报告为部分失败案例）", "合成数据：Blender 多视角渲染的发丝级人体，背景为真实 HDR 或采集背景，带 GT alpha、F、B 和分层深度，并包含脚本化的光照变化和移动道具", "自定义采集（需要）：4-8 相机同步 RGB-D 或立体阵列，配可切换背景（显示器墙或两块彩色布）。对近静态被摄者进行双背景三角化抠图，可获得头发、毛发、眼镜框和网眼织物上的真实 GT alpha。另有 2-5 分钟的说话人头像会话，其间调暗一盏灯并移动一把椅子。"], "baselines": ["基础论文 (2505.18932)，重新实现或使用已发布代码，在相同数据上重新训练（关键对比）", "基础论文 + 使用固定空场景背景板的 BGMv2（Capture-Stage-Matting 风格），输入同一双层 splat", "基础论文 + 逐帧自然抠图（RVM 或 MatAnyone 类视频抠图），无背景板", "逐视角 alphaDepth 风格单次软边界分层分解 (2606.00386)，输入同一 splatting", "Zitnick-2004 风格边界层（深度边缘处的贝叶斯抠图），重新实现", "NSTM (2607.15271)，用于去遮挡与记忆对比（若代码或权重发布）；否则使用 CUT3R/token 记忆代理", "GPS-Gaussian+ / Tele360 类 feed-forward 人体方法（仅报告边界伪影）", "Oracle-alpha 双层渲染（合成数据上用 GT alpha，真实数据上用三角化抠图 alpha）作为上界"], "metrics": ["边界带 PSNR / LPIPS / SSIM（GT 轮廓周围 5、10 和 20 像素带；头发分割子集）", "在合成数据和真实三角化抠图 GT 上的 Alpha SAD、MSE、Grad 和 Conn", "时序边界稳定性：带内 tOF / tLP 和闪烁能量；与基础论文相同的 TCC 和 STED", "按来源划分（记忆填充 vs 幻觉生成）的去遮挡区域 PSNR/LPIPS，以及来源校准（“已观测”像素是否确实更准确）", "背景板覆盖率随时间变化（N 秒后具有置信背景板的带内像素百分比），比较单视角与跨视角补全", "鲁棒性曲线：alpha SAD 和带内 LPIPS 随光照变化幅度的变化，以及背景变化后的恢复时间", "运行时间分解（记忆更新、抠图、双层 splat、软 TSDF）和高斯数量开销", "关于头部追踪观看中边缘（fringe）与闪烁可见性的小规模 2AFC 用户研究（可选，但对 IEEE VR 很有价值）"], "key_ablations": ["无记忆（仅自然抠图先验）vs 固定背景板 vs 自维护背景板", "TSDF 可见性门控 vs 朴素时间中值背景板（表明几何信号是必要的）", "有 vs 无跨视角背景板补全（近静态被摄者下的自举速度）", "双层反投影 vs 带预测 α 的单个不透明高斯（背景层是否重要？）", "软占据 TSDF vs 硬 TSDF（头发深度误差、飞点数量、带内 LPIPS）", "光照与道具变化下增益/失效模型开启 vs 关闭", "Blend net 有 vs 无 α/背景板输入（学习式混合器是否已能恢复？）", "按前景-背景颜色对比度分层（量化差分抠图的失败模式）"], "needs_custom_capture": true, "capture_notes": "公开多视角数据集在留出相机处提供渲染 GT 和静态背景，因此主要渲染主张无需采集即可检验。但没有一个数据集在类似远程临场的阵列上提供真实真值 alpha、光照漂移事件或背景移动事件。需要一个小型自定义数据集完成两件事。第一是真实 alpha benchmark：4-8 个同步相机，例如 Orbbec Femto Bolt 或 ZED X，或带硬件同步的机器视觉相机，加一块大显示器或两块可切换的彩色背景，对近静态被摄者在两种背景下采集，以获得头发和毛发上的三角化抠图 alpha。第二是 2-5 分钟的对话会话，其中包含脚本化的调暗灯光、移动椅子和有人从后方走过。预算约为 $3-8k 硬件，以及 3-4 周的采集与标定。发丝级合成数据可在 Blender 中生成，在此期间覆盖训练和 alpha-GT 指标。将采集数据作为 benchmark 发布以增强论文。"}, "first_two_week_test": "这是一个无需训练的 go/no-go 测试，在 DyNeRF（2-3 个场景）以及一个 CMU Panoptic 或 DNA-Rendering 序列上进行，采用基础论文的留出阵列相机协议。第 1 周，记忆前提测试：在线构建逐相机背景板。门控使用任意现成立体或 MVS 模型的逐视角深度，TSDF 可用简单的多视角深度一致性测试代替。加入跨视角补全。测量 10 像素轮廓带随时间的背景板覆盖率，然后运行预训练 BGMv2，分别使用 (a) 在线背景板、(b) 时间中值背景板和 (c) 无背景板（预训练 RVM/MatAnyone 类模型）。从视觉和定量上检查带内 alpha 稳定性（闪烁能量）。第 2 周，表示测试：实现不透明单层 vs 双层 alpha 前向 splatting（纯 CUDA 或 PyTorch splat）到留出视角，使用简单的深度加权合成。然后仅训练基础风格的 4 层 blend U-Net 约一天，使用相同数据，分别带与不带 α/背景板通道，包括一个使用最佳可用 alpha 的 oracle 变体。报告 opaque+blendnet vs two-layer+blendnet vs oracle 的带内 LPIPS 和带内闪烁。Go 条件：在线背景板在约 10 s 内（带跨视角补全）达到至少 80% 的带内覆盖率；two-layer+blendnet 相比 opaque+blendnet 的带内 LPIPS 相对提升至少 8%、带内闪烁提升至少 15%；且在线背景板弥合了其与 oracle alpha 之间差距的至少一半。", "kill_criteria": "若出现以下任一情况，放弃该方向，或将其缩减为短 workshop 或 IEEE VR poster。(1) 即使使用 oracle 或三角化质量的 alpha，双层表示在留出视角带内 LPIPS 上相对重新训练的不透明基础 pipeline 的提升不足 5%，意味着学习式 blend net 已经掩盖了混合像素误差，表示的改变无关紧要。(2) 在真实的远程临场序列上，即使带跨视角补全，自维护背景板在 10-20 s 后的带内覆盖率仍低于 70%，因此记忆前提在实践中不成立。(3) 在线背景板在 alpha SAD 或带内闪烁上，相对强大的无背景板视频抠图模型（如 MatAnyone/RVM 类）或 alphaDepth 风格逐帧分解，没有可测量的提升。(4) 在 1080p、4-8 视角下，完整系统的开销超过约 25 ms/帧且无法降低。(5) 出现一篇 2026 年论文，为多视角 splat IBR 实现了可见性门控的在线背景板维护。在投入之前，应在恢复检索预算后重新做一次新颖性检查，因为本报告的检查因速率限制而被中断。", "reviewer_objections": [{"objection": "这就是 Zitnick et al. 2004（边界层）加 BGMv2（已知背景抠图）加 Starline 风格 TSDF 的组合。这是一篇系统论文，而非研究贡献。", "rebuttal": "双层边界和已知背景抠图被明确表述为对已有工作的重新实现。所主张的贡献是：(a) 带跨视角补全和失效机制的在线可见性门控背景板维护，无需空场景采集（Capture Stage Matting 使用固定背景板）；(b) 软占据 image-based TSDF，未找到先例。二者都通过消融加以隔离（可见性门控 vs 时间中值、软 vs 硬 TSDF），并由 oracle-alpha 分析给出上界。论文还直接与重新实现的 Zitnick 风格边界层以及固定背景板 BGMv2 变体进行比较。"}, {"objection": "基础论文中的学习式 blend net 已经抑制了光晕，全图 PSNR 几乎不变。提升只是表面的。", "rebuttal": "基础论文自己的消融表明，全帧 PSNR 对几何变化几乎无反应（31.16 vs 31.17），因此我们预先登记边界带和时序指标，并加入 2AFC 用户研究。Oracle-alpha 实验显示了不透明表示损失了多少。Blend net 无法恢复在它看到之前就已被单深度不透明高斯破坏的混合像素信息，而为 blend net 加入 α/背景板输入的消融使这一点具体化。"}, {"objection": "静态背景假设很脆弱。真实房间有光照变化、移动物体、屏幕以及从后面走过的人。", "rebuttal": "目标是固定隔间或桌面阵列，这是远程临场的主要部署形态。鲁棒性被作为一个测量维度而非假设：增益建模、带迟滞的基于残差的失效、陈旧度衰减，以及回退到自然抠图先验的背景板 dropout 训练。论文报告在脚本化的灯光和道具变化下的退化与恢复曲线，以 ENeRF-Outdoor 作为压力测试，并如实说明失败区间。"}, {"objection": "没有真实的真值 alpha，因此抠图主张依赖合成数据，而公开多视角数据集（DyNeRF、DNA-Rendering）并不隔离头发。", "rebuttal": "在阵列上通过双背景三角化抠图采集的小型真实 benchmark 提供头发、毛发和眼镜的真实 GT alpha，并将被发布。公开数据集用于头发分割边界带上的留出视角渲染指标。发丝级合成数据仅用于训练和 alpha 指标。"}, {"objection": "当前景和背景颜色相同时（深色头发配深色墙壁），差分抠图会失败，而这恰恰是头发最难的地方。", "rebuttal": "结果按前景-背景颜色对比度分层。在这种情况下，方法结合深度边缘线索、F 的多视角三角化以及学习到的自然抠图先验，分析表明它会平缓地退化到至少与无背景板 baseline 持平，而不会低于它。背景板置信度通道让网络在差分线索无信息的地方降低其权重。"}], "synergies": "(1) 去遮挡修复（例如 Bonn 实时 transformer 修复器，2603.05507）和扩散修复器（diffusion-fixer）方向：来源图告诉修复器应在何处作用，记忆填充区域为其提供真实条件，从而形成一篇关于真实像素 vs 幻觉像素的更强联合论文。(2) 长时程记忆与漂移（NSTM 风格混合方案）：显式背景板是显式+学习式混合记忆中的静态部分，分钟级 MVHumanNet++ 评估可同时服务于两者。(3) 流式传输与压缩：静态背景板只发送一次，每帧只流式传输前景和 alpha 带，这对远程临场是直接的带宽收益，也是自然的第二篇论文。(4) Foundation-stereo / 传感器深度方向：更好的逐视角深度使可见性门控更锐利，软 TSDF 为其提供模糊几何输出。(5) 针对头发、手部和眼睛的人体先验与区域感知增强：alpha 带是分配身份先验预算的天然区域掩码。(6) 远程临场 benchmark 工作：真实 alpha 头发数据集加上光照和道具变化划分，可直接纳入带时序和边界指标的统一在线远程临场 benchmark。", "effort": {"months": "7-9（约 1 个月用于 go/no-go 测试和合成数据，3 个月用于方法与训练，1-1.5 个月用于采集和 benchmark，2 个月用于实验、消融、用户研究和写作）", "people": "1 名全职博士生，外加 1 名兼职合作者负责阵列、采集和合成头发渲染", "compute": "2-4 块 24-48 GB GPU（RTX 4090 / A6000 / L40S），用于训练抠图头和 blend net（每次运行几个 GPU 日）；1 块桌面 GPU 用于实时计时；约 $3-8k 用于 4-8 相机同步阵列，外加用于三角化抠图 GT 的可切换背景或显示器"}, "venue": "若 go/no-go 测试显示出明确的带内 LPIPS 和闪烁提升，且真实 alpha benchmark 被发布，则投 CVPR/ICCV/3DV。仅在有成熟的实时系统演示时投 SIGGRAPH Asia / TOG。IEEE VR / ISMAR / TVCG 是现实且有力的备选，特别是配合用户研究和来源图，因为远程临场受众重视边缘和闪烁质量以及可审计的幻觉。", "novelty": {"verdict": "partially_scooped", "remaining_novel_angle": "核心洞见的前两部分已经确立。(1) 已知背景使抠图可解：Background Matting 和 BGMv2（2020-21）、DART（RGB-D，2024）以及 Capture Stage Matting（2025），后者明确针对多相机舞台做了这一点。(2) 双层边界抠图表示可消除多视角视频视角合成中的光晕和飞点：Zitnick et al. SIGGRAPH 2004 和 Hasinoff et al. 2006，其学习式单视角版本见 HairGuard（2026 年 1 月）和 alphaDepth（2026 年 5 月）。带实时 BGMv2 的远程临场静态背景层也出现在 ISMAR 2026，但仅限 2D。仍可辩护的是一个更窄的主张：一个自举、持续维护的逐相机颜色+深度+陈旧度背景记忆，仅在 image-based TSDF 表明光线看到的位置位于已存背景处或其后方时写入。它无需空场景采集，并处理光照漂移和记忆失效。一个显式记忆在在线、feed-forward、标定的多视角时序 IBR pipeline 内服务三个使用者：带 F 多视角三角化的已知背景抠图、双高斯混合像素前向 splatting，以及用真实历史观测内容填补去遮挡。Alpha 加权的软占据 image-based TSDF 阻止头发在 Starline 风格 ray-march 融合中被融合成硬表面，是技术上最独特的子组件；检索中未发现它。论文应将自己定位为弥合离线视角合成边界抠图与在线、基于阵列的 splat IBR 之间 20 年的空白。它必须击败 alphaDepth/HairGuard 风格的学习式软边界分解和 BGMv2 固定背景板 baseline，并展示静态背景板无法带来的边界带和时序提升，例如在光照漂移或家具移动时。新颖性依赖于在线记忆维护和软 TSDF 机制以及评估，而非“静态阵列使抠图适定”这一观察，后者并不新。", "threats": [{"title": "High-quality video view interpolation using a layered representation (Zitnick, Kang, Uyttendaele, Winder, Szeliski)", "url": "https://www.microsoft.com/en-us/research/publication/high-quality-video-view-interpolation-using-a-layered-representation/", "venue": "SIGGRAPH 2004 / ACM TOG", "year": "2004", "overlap": "high", "what_overlaps": "多相机视频中深度不连续处附近的混合像素被自动抠图，并拆分为边界层（前景颜色、alpha、深度）和主层（背景颜色和深度），然后以交互速率渲染。这正是“双层混合像素反投影”贡献，只是用分层深度图代替了高斯。", "what_remains_different": "它没有 Gaussian splatting、没有学习式混合，也没有背景的时序记忆。其抠图是立体不连续处的贝叶斯式抠图，而非已知背景差分抠图；它运行离线立体而非在线；也没有 image-based TSDF。每个混合像素两个高斯的思路应被表述为对该工作的现代在线重新实现，而非一种新表示。"}, {"title": "Capture Stage Matting: Challenges, Approaches, and Solutions for Offline and Real-Time Processing (Droge et al.)", "url": "https://arxiv.org/abs/2507.07623", "venue": "arXiv cs.GR (Jul 2025, rev. Nov 2025)", "year": "2025", "overlap": "high", "what_overlaps": "它明确利用多相机采集舞台（40 个相机）的静态背景，以空舞台参考作为抠图背景板，支持离线和实时，并将 alpha 输入 NeRF 重建。这正是构想者的关键洞见：静态阵列通过已知背景使抠图适定。", "what_remains_different": "背景板只采集一次、从不更新；作者指出阴影和反射会导致偏差，但并未随时间维护背景。抠图是逐视角的，没有 F 的多视角三角化。下游使用是离线 NeRF，而非在线 feed-forward 双层 splat 渲染器。没有无需空场景采集的 TSDF 驱动背景板自举。"}, {"title": "Real-Time High-Resolution Background Matting (BackgroundMattingV2, Lin et al.)", "url": "https://openaccess.thecvf.com/content/CVPR2021/papers/Lin_Real-Time_High-Resolution_Background_Matting_CVPR_2021_paper.pdf", "venue": "CVPR 2021", "year": "2021", "overlap": "high", "what_overlaps": "这是经典的实时“已知背景使抠图可解”方法（与 Background Matting, CVPR 2020 一起）。所提出的“输入 (I, B, 差分) 的在线抠图头”本质上就是 BGMv2 的条件输入方式，而 BGMv2 已被用于远程临场和多视角头部采集 pipeline。", "what_remains_different": "它是单视角 2D 合成，背景板需手动采集。没有 3D、没有多视角一致性、没有在线背景板记忆，也没有与渲染的集成。"}, {"title": "Guardians of the Hair: Rescuing Soft Boundaries in Depth, Stereo, and Novel Views (HairGuard; Zhang, Mehl, Gross, Schroers et al., DisneyResearch|Studios / ETH)", "url": "https://arxiv.org/abs/2601.03362", "venue": "arXiv (Jan 2026)", "year": "2026", "overlap": "medium", "what_overlaps": "它明确针对基于深度的新视角合成中的头发和软边界，使用 alpha 合成模型 I = aF + (1-a)B、软边界处的深度修复器、前向 warping、用于去遮挡的生成式绘制器和颜色融合器。问题设定（视角变化下头发处的光晕和错误深度）相同。", "what_remains_different": "它是单视角、每帧约 95 s、离线运行。不使用已知背景、多视角阵列或时序记忆，也没有高斯或 TSDF 表示。"}, {"title": "alphaDepth: Learning Single-Pass Soft Boundary Decomposition for Stereo Conversion (Zhang et al.)", "url": "https://arxiv.org/abs/2606.00386", "venue": "arXiv (May 2026)", "year": "2026", "overlap": "medium", "what_overlaps": "它在单次前向中预测软边界处（头发、失焦）的分层颜色和深度，相当于为视角合成做逐像素带 alpha 的双层前景/背景分解。这是双层混合像素思路的学习式版本，发布于四个月前。", "what_remains_different": "它是单视角立体转换，没有已知背景、没有多视角标定阵列、没有时序或在线记忆。它用先验解决病态的自然抠图情形，而本方向利用阵列的背景记忆。它是该构想在边界带上必须击败的最强 baseline。"}]}}, {"id": "C11", "name": "Source-space directional blending for amortized multi-viewer / light-field-display rendering", "decision": "pursue_with_repositioning", "scores": {"novelty": 4.5, "significance": 6, "feasibility": 6, "telepresence_fit": 8, "overall": 5.5}, "sharpened": {"title_zh": "一次混合，多视共享：面向时间稳定光场远程临场的视角无关源空间混合", "title_en": "Blend Once, View Many: Viewer-Invariant Source-Space Blending for Temporally Stable Light-Field Telepresence", "one_liner": "在静态标定相机阵列上，把学习式 IBR 混合从目标图像移到源像素上的一个低阶方向场中。该场每帧只预测一次，并在固定的相机坐标系中进行滤波。于是每增加一只眼睛、一个观看者或一个光场视图，只需一次光栅化，既没有 K 集合跳变，也没有观看者运动引起的闪烁。", "core_claim": "在静态标定的 RGB-D/立体相机阵列上，一旦可见性由 z-buffer 光栅化处理，几何引导的目标空间 IBR blender（Ha et al. 风格）所学到的逐相机混合权重在目标方向上是低带宽的。每个源像素上的方向场，每相机至多 16 个系数（SH 3 阶或 8 个球面 lobe），每帧 feed-forward 预测一次，在留出的真实相机上与逐视图 teacher 的差距在 0.5 dB PSNR 和 0.015 LPIPS 以内。它们在单块消费级 GPU 上能以 30 fps 或更高渲染至少 45 个显示视图（每视图 512p）。在跨视图和观看者运动下，它们严格比逐视图目标空间混合更一致：EPI/MEt3R 视图间误差和沿移动观看者轨迹的闪烁都降低 30% 或更多。即使目标空间基线获得软性全 N 加权和 K 集合迟滞（hysteresis），这一结论依然成立。如果拟合的 oracle 场需要超过 16 个系数才能达到距 teacher 0.5 dB 以内，或者加了迟滞的目标空间 blender 能达到相同的一致性提升，则该主张被证伪。", "key_insight": "把可见性与偏好分开。从目标射线看哪些源采样可见是一个几何问题。z-buffer（加上每帧计算一次的共享 TSDF）对每个视图都能精确且廉价地回答它。去掉可见性后，学习式 blender 输出的剩余部分——对一个可见表面点应偏好哪个相机——是目标方向的平滑低频函数。这是全光采样（plenoptic sampling）的直觉：带宽由相机间距和表面反射决定，而不是由观看者决定。由于阵列是静态的，每个源像素都是一个持久实体。偏好场可以驻留在那里：计算一次、所有观看者共享，并在一个永不移动的坐标系中做时间滤波。目标空间流水线做不到这一点，因为它们的混合坐标系随每个观看者移动，且在 K 集合切换时权重会突变。观看者位姿只在光栅化时进入，因此可以 late-latch，这也降低了 motion-to-photon 延迟。", "method": "输入：N（4-10）路标定、同步的 RGB-D 流；深度来自传感器或实时立体前端，并报告其开销。(1) 共享的逐帧几何阶段只运行一次：每个源视图的像素大小 Gaussian（如 Ha et al.）、在全部 N 个相机（而非 K 近邻）上融合的低分辨率基于图像的 TSDF，以及由 TSDF 一致性得到的逐源可见性与置信度图。(2) 源空间偏好网络是每相机一个轻量 2D CNN，对几何上最近的 2-3 个相机做极线或跨视图注意力。输入为 RGB、深度、深度置信度、TSDF 一致性残差、表面法线，以及编码为指向其他相机方向的阵列几何。对每个源像素，它输出一个方向偏好场 w_n(p, d)：SH 2-3 阶，或 M=8 个球面 lobe（其轴初始化为阵列的相机方向）。它还输出一个小的 SH 颜色残差（1-2 阶）和一个边缘柔化/不透明度项以抑制飞点。(3) 渲染逐视图进行，不使用神经网络。以 z-test（软深度测试带）光栅化所有源的 Gaussian。累加 颜色 × alpha × softplus(w_n(p, d_target)) 并在相机间归一化。用一个持久化、TSDF 门控的背景板（因为阵列静态而成为可能）加上每个显示帧一个共享的低分辨率补洞器来填补去遮挡区域。后端是一个相干 LFD 光栅化器（CoherentRaster 式属性复用或 LFDPR 式点 splatting），直接渲染 32-45 个视图或子像素交织输出。(4) 时间：一个置信度门控的 EMA 在每个源像素上对系数（而非颜色）做滤波。该门控由 TSDF 残差、深度变化和颜色变化学习得到。背景像素采用长时平均。(5) 训练：从一个复现的 Ha 式目标空间 U-Net teacher（K=4，带 TSDF 和深度反馈）蒸馏。每帧在阵列凸包内及略超出范围采样约 100 个虚拟目标，使用逐相机权重匹配损失和光度损失。另加留出真实相机上的光度损失、相邻虚拟视图间的 EPI 梯度平滑损失，以及 4-8 帧片段上的时间 warping 损失。测试时丢弃 teacher。在 RTX 4090/5090 上的运行时预算：逐帧源阶段低于 15 ms（N=8，每个源 512x384），加上每视图约 0.3-0.6 ms 的光栅化，因此 45 个视图约 40 ms 内完成。", "why_not_engineering": "本文的贡献超越了一个更快的流水线，包括三点。第一，一个可测量的实证主张及其原理性解释：在剥离可见性后，学习式 IBR 混合的角度带宽。它通过 oracle SH/lobe 拟合研究（所需系数 vs 误差，作为相机基线和材质高光程度的函数）来量化，并与全光采样理论联系起来。还没有人测量过学习式 blender 实际使用了多少角度自由度。第二，目标空间 IBR 的一种新失效模式和指标：观看者运动引起的闪烁，K 近邻流水线即使在静态内容上也会产生。本文表明源空间参数化在构造上消除了它。第三，一个关于时间滤波的表示层面论证：在静态源坐标系中，滤波无需重投影且与观看者无关。它在观看者运动下与目标空间深度反馈进行比较。系统（45 视图实时 LFD、多方）是演示，而非主张。每个主张都有 kill 条件。", "differentiation": "NoPo4D (arXiv 2605.22190) 已经从静态阵列多视图视频中预测每个源像素的 Gaussian，带有 SH 视角相关不透明度，作为一种学习的跨相机置信度。我们将其视为该表示最接近的先前工作并予以致谢，并把它作为直接的消融基线（端到端训练的不透明度 SH，无蒸馏、无源空间时间滤波器、无 TSDF 可见性）。NoPo4D 是无位姿的、非实时的，也没有在多视图显示一致性上评估。我们的贡献是带宽研究、视角不变性与时间滤波分析，以及实时多视图显示系统。ViewSplat (2603.25265) 为静态、无位姿场景预测视角条件的属性残差；它没有时间模型，也没有多视图显示研究，其 View-MLP 作为基函数选择的基线。GPS-Gaussian/GPS-Gaussian+ (2312.02155, 2411.11363) 已经让额外视图只需光栅化开销，但只有标量不透明度，没有跨相机偏好；它们展示了我们在相同开销下增加的质量。扫描平面 LFD 渲染 (2508.18540)、CoherentRaster (2605.04509)、DirectL (2407.14053) 和 LFDPR (2601.19901) 为静态优化场景摊销光栅化，并丢弃或忽略学习式视角相关混合。我们把它们用作后端，不声称它们的任何贡献。目标空间实时 IBR 包括 Ha et al. (2505.18932)、3DTV (2604.11211)、VirtualCube (2112.06730) 和 Tele-Aloha (2405.14866)。我们在相同每秒视图数下比较，并为它们加上迟滞和软性全 N 加权，使收益可归因于源空间参数化。LentiAvatar (2606.10550) 专用于 avatar 且为单目；我们的方法面向通用场景、多相机且真实。"}, "experiments": {"datasets": ["Technicolor 光场视频（4x4 相机阵列；留出内部相机以模拟稠密 LFD 角度采样；显示视图评估的最佳公开替代）", "DyNeRF / Neural 3D Video（18-21 个相机；与 base paper 协议直接比较，留出相机）", "CMU Panoptic Studio（HD 相机加 10 个 Kinect RGB-D；真实的传感器深度设置，大量留出视图）", "DNA-Rendering 和 MVHumanNet++（围绕人体 48-60 个相机；用于多观看者和角度带宽研究的稠密留出视图；人体远程临场内容）", "ActorsHQ（160 个相机，12MP；在相机子集上做带宽-基线研究的非常稠密的角度 ground truth）", "ENeRF-Outdoor（次要，用于与 base paper 比较；注意其低分辨率协议）", "自定义：6-8 相机 RGB(-D) 阵列加一台 Looking Glass（16 或 32 英寸），仅用于实时端到端 demo 和用户研究"], "baselines": ["Ha et al. 2025（复现），逐视图运行，K=4；另加 K 集合迟滞和软性全 N 权重（强化的目标空间基线）", "以扫描平面在相邻视图间共享来摊销的 Ha et al. teacher（arXiv 2508.18540 风格），最强的目标空间摊销", "NoPo4D 式不透明度 SH（端到端训练的逐像素 SH 不透明度，相同骨干，无蒸馏或时间滤波）", "ViewSplat 式 View-MLP 残差，作为另一种方向基函数", "GPS-Gaussian+（标量不透明度加 SH 颜色；相同光栅化开销）", "3DTV (arXiv 2604.11211) 和 ENeRF，作为 feed-forward 目标空间 IBR", "基于距离/角度的非结构化 lumigraph 混合（Buehler 式），在全部 N 上软加权，作为非学习的方向性基线"], "metrics": ["留出真实相机上的 PSNR / SSIM / LPIPS（teacher-student 差距是关键数字）", "视图间一致性：跨稠密虚拟或留出视图集的 EPI 切片误差、MEt3R、SDV", "时间：TCC、STED、静态观看者下的光流 warping 误差", "新指标：观看者运动闪烁，即在静态和动态内容上沿平滑虚拟观看者轨迹的 warping 误差，用于隔离 K 集合跳变", "角度带宽：权重重建误差和渲染 PSNR 随系数数量（SH 0-4 阶，lobe 2-16）的变化，作为相机基线和高光区域 mask 的函数", "运行时：ms/帧 随同时视图数（1、2、8、32、45、100）的变化，拆分为源阶段和逐视图光栅化；GPU 显存；实时 demo 中 late-latch 位姿下的 motion-to-photon 延迟", "LFD 上的用户研究：相同帧率下相对逐视图基线的跳变与闪烁 2AFC；可选的三方注视方向判断准确率"], "key_ablations": ["基函数类型与阶数（SH 0-4、lobe 4/8/16、View-MLP），用于质量/开销 Pareto", "可见性：仅 z-buffer vs z-buffer 加 TSDF 一致性输入 vs 无（检验可见性/偏好分离）", "蒸馏 vs 直接光度训练 vs 两者兼用", "源空间系数 EMA（学习门控 vs 颜色门控 vs 无）vs 目标空间深度反馈，在静态和移动观看者下", "源空间中的全 N 软加权 vs K 近邻", "背景板加共享低分辨率补洞器 vs 逐视图补洞器", "换入不透明度 SH（NoPo4D 式）并保持其他一切不变，以表明收益并非来自方向性不透明度本身", "源分辨率 vs 光栅化开销 vs 质量（45 视图的可行性边界）"], "needs_custom_capture": true, "capture_notes": "核心科学主张（角度带宽、teacher-student 差距、视图间与观看者运动一致性、每秒视图数缩放）都可在公开数据上完成。Technicolor 和 ActorsHQ/DNA-Rendering 提供稠密留出视图，Panoptic 提供 Kinect RGB-D。只有实时主张需要自定义硬件：一个 6-8 相机同步阵列（例如硬件触发的工业相机或 ZED/RealSense 设备）加一块 Looking Glass 面板（约 16-32 英寸，几千美元），用于端到端延迟测量和一个小型用户研究（约 15-20 名参与者，需 IRB）。没有它，论文就降为 CVPR 式方法论文，并失去面向 SIGGRAPH Asia 或 IEEE VR 最有力的卖点。"}, "first_two_week_test": "Oracle 带宽拟合，暂不涉及 student 网络。（第 1-4 天）在 DyNeRF（2-3 个场景）和 Technicolor（2 个场景）上，使用离线立体或提供的深度，训练或复现一个简化的 Ha 式目标空间 U-Net blender（K=4，深度加相机特征输入；几个 GPU 天）。如果时间紧，可用 ENeRF 的逐源混合权重作为替代 teacher。（第 5-8 天）对 10 帧，在阵列凸包内稠密采样约 150 个虚拟目标并渲染 teacher。对每个目标像素，把每个相机的权重归属到它所 splat 自的源像素（z-buffer 胜出者），然后用加权最小二乘拟合每个源像素的 SH（0-4 阶）和 8 个 lobe。（第 9-12 天）仅用 z-test Gaussian 光栅化器，以拟合的场重新渲染留出真实相机和一次稠密虚拟扫动。测量：(a) 与 teacher 的 PSNR/LPIPS 差距；(b) 沿扫动的 EPI 误差和观看者运动闪烁，与有无 K 集合迟滞的 teacher 比较；(c) 用 8 x 512x384 源 Gaussian 渲染 45 个 512p 视图的光栅化 ms。（第 13-14 天）绘制系数 vs 差距曲线并做决定。若至多 3 阶（16 个系数）落在 0.5 dB 和 0.015 LPIPS 以内、闪烁相对加迟滞的 teacher 下降 30% 或更多，且 45 视图光栅化在 50 ms 以内，则 GO。这是 feed-forward student 能达到的上界，因此此处失败可以低成本地否决该想法。", "kill_criteria": "若以下任一成立，则放弃或重新界定范围。(1) oracle 拟合需要每相机每像素超过 16 个系数才能达到距目标空间 teacher 0.5 dB PSNR / 0.015 LPIPS 以内。那么学习式混合在方向上并非低带宽，核心前提不成立。(2) 以软性全 N 权重加 K 集合迟滞强化的目标空间 teacher，在 EPI/MEt3R 和观看者运动闪烁数值上达到源空间方法的 10% 以内。那么一致性主张就只是一个调参技巧。(3) 3 个月后，即使给予 teacher 的输入，feed-forward student 在留出相机上仍比 teacher 低 1 dB 以上。(4) 在同一骨干中端到端训练的 NoPo4D 式不透明度 SH 在质量、EPI 和时间指标上与完整方法在噪声范围内持平。那么远程临场特有的部分（蒸馏、源空间时间滤波、TSDF 可见性）没有任何增益，论文将只是一次复现。(5) 即使使用相干 LFD 光栅化器，在有用的源分辨率下，单块消费级 GPU 也无法以 30 fps 或更高渲染 45 个 512p 视图。那么摊销这一卖点就落空，只剩一致性结果，或许只够一篇 workshop 论文。", "reviewer_objections": [{"objection": "这就是 NoPo4D 的视角相关不透明度 SH，加上 GPS-Gaussian 的“额外视图只需光栅化”，应用到光场显示上：一个工程组合。", "rebuttal": "我们明确致谢两者，并不声称该表示是我们的。贡献在于：(i) 首次测量剥离可见性后学习式 IBR 混合的角度带宽，附带相机基线和高光程度分析，告诉从业者一个阵列需要多少系数；(ii) 将观看者运动闪烁确立为目标空间 IBR 的失效模式，并给出指标和构造上的修复；(iii) 源坐标系中的系数滤波，无需重投影且与观看者无关。在其他一切固定的情况下换入 NoPo4D 式不透明度 SH 的消融，隔离了我们远程临场特有部分的增益。带有实测延迟的实时 45 视图显示结果在先前工作中并不存在。"}, {"objection": "源像素上的方向权重无法表示依赖于目标视图的遮挡。从一个同时看到全部 K 张 warp 图像的目标空间 U-Net 蒸馏，必然在深度边缘和去遮挡区域损失质量。", "rebuttal": "这正是可见性/偏好分离要解决的问题。遮挡由 z-test 光栅化器和共享 TSDF 逐视图解决，每视图不产生额外开销。只有平滑的偏好被摊销。我们在边缘带和去遮挡 mask 内单独报告差距，并包含每个显示帧一个共享的低分辨率补洞器。如果差距集中在边缘，这个结果本身就有信息量，补洞器的逐视图开销也会如实报告在 Pareto 图中。"}, {"objection": "只需给目标空间 blender 加上迟滞或软加权，并在较低分辨率运行即可，没有必要引入新的参数化。", "rebuttal": "这个基线是按设计包含在内的：带软性全 N 权重加 K 集合迟滞的 Ha et al.，并额外以扫描平面摊销。迟滞能减少跳变，但会让权重依赖于观看者的历史。因此同一时刻的不同观看者会看到不一致的内容，而且网络开销仍随视图数缩放。我们在相同每秒视图数和相同分辨率下比较，并有一条 kill criterion 覆盖该基线追平我们的情况。"}, {"objection": "高光和高频视角相关效果无法用 2 阶或 3 阶 SH 拟合，因此在真实远程临场内容（眼镜、皮肤光泽、屏幕）上质量会崩溃。", "rebuttal": "带宽研究按高光 mask 和相机基线分层，并报告低阶在何处失效。模型保留了一个单独的 SH 颜色残差，lobe 基函数初始化为阵列的相机方向，从而把容量集中在需要的地方。对于稀疏阵列，观测到的角度信号本身就被相机间距带限（全光采样），因此更高阶的基函数也无法恢复相机从未看到的内容。我们用不同密度的 ActorsHQ 子集在实证上展示这一点。"}, {"objection": "评估主要在稀疏的留出阵列相机上进行；关于 45 视图光场质量和用户感知跳变的主张没有 ground truth 支撑。", "rebuttal": "Technicolor 的 4x4 阵列和稠密的 ActorsHQ/DNA-Rendering 子集在类显示器的基线上提供了 ground truth 角度采样。EPI 和 MEt3R 无需 ground truth 即可度量视图间一致性。实时 Looking Glass demo 包含一个相同帧率下关于跳变与闪烁的受控 2AFC 用户研究，以及实测的 motion-to-photon 延迟。我们还会发布渲染的视图集，以便他人核查一致性指标。"}], "synergies": "(1) 多方通话的流式传输与计算拆分：逐帧源空间系数图是紧凑、与观看者无关的载荷。发送端计算一次，每个接收端只做光栅化，这自然形成发送端/接收端拆分，并适合观看者自适应的逐相机码率分配；是一篇有力的姊妹论文。(2) 静态阵列的持久背景与长期记忆：同样的“静态阵列意味着持久源像素”论证支撑背景板和基于记忆的去遮挡填补（参见 arXiv 2607.15271）。(3) 学习式实时深度前端（Fast-FoundationStereo、时间一致的立体方法如 PPMStereo），其置信度输入到可见性和时间门控中。(4) 低延迟或 HMD 远程临场：观看者位姿只在光栅化时进入，因此 late-latch 和双目一致渲染是免费获得的。这可以与立体一致的生成式修复器结合，后者同样必须在视图间摊销。(5) 以相干 LFD 光栅化器（CoherentRaster、LFDPR、扫描平面）为后端：本方向提供了它们缺少的实时、学习式、时间稳定的前端。论文系列可以是：oracle 带宽研究与方法（本文），然后是源空间流式传输与压缩，再然后是多方注视正确的部署。", "effort": {"months": "6-8（2 周 oracle 研究；约 3 个月在公开数据上做 student 网络加时间滤波；约 2 个月做实时阵列、LFD 后端集成和用户研究；1 个月写作）", "people": "1 名全职博士生，加 1 名兼职学生或工程师负责阵列、LFD 光栅化器和用户研究", "compute": "2-4 块 24-48 GB GPU（RTX 4090/5090 或 A6000 级）用于 teacher 和 student 训练；1 块消费级 GPU 用于实时 demo；硬件约 5-12k 美元（Looking Glass 16-32 英寸加 6-8 个同步相机，或复用现有阵列）"}, "venue": "SIGGRAPH Asia / ACM TOG（以系统加分析的框架配合实时 LFD demo）。备选：IEEE VR 或 ISMAR（TVCG track），强调多观看者、多方注视和用户研究。只有在没有实时 demo 时才可能投 CVPR，并且会因为与 NoPo4D 的重叠而较弱。", "novelty": {"verdict": "partially_scooped", "remaining_novel_angle": "机制本身已经发表，因此不能作为主要主张。NoPo4D (arXiv 2605.22190, 2026 年 5 月) 从静态阵列多视图视频 feed-forward 预测每个源像素的 Gaussian，其视角相关不透明度以 SH 参数化，并明确地将其用作学习的跨相机置信度/混合权重。ViewSplat (2603.25265) 一次性预测逐基元的视角条件不透明度和颜色残差，并对每个视图廉价求值。像素对齐的 feed-forward Gaussian（GPS-Gaussian）已经让额外视图只需光栅化开销。\n\n仍然站得住的是面向实时远程临场显示的系统与评估贡献：\n(1) 首个实时（<50-100 ms）、时间一致的实时采集 IBR，驱动 32-45 视图的光场或柱透镜显示器，或 P-1 个注视正确的多方视图。它将包括一条相对于逐视图目标空间 blender（base paper、3DTV、VirtualCube 式）的质量 vs 每秒视图数的实测 Pareto 前沿。\n(2) 将时间稳定化实现为在固定源像素坐标系中对方向系数的置信度门控滤波。这对观看者运动不变，且没有先前工作这样做；NoPo4D 建模的是速度，而不是系数滤波。\n(3) 将目标空间、遮挡感知的 IBR blender（Ha et al. 风格，TSDF 可见性）蒸馏为源空间方向场，并量化 teacher 与 student 之间的差距。\n(4) 一项明确的研究，表明软性全 N 方向权重消除了 K 集合跳变，用跨稠密显示视图的 EPI/MEt3R 度量。\n(5) 与相干 LFD 光栅化器（CoherentRaster 或扫描平面）耦合，使开销的两半都得到摊销。\n\n审稿人会要求以 NoPo4D 式不透明度 SH 作为直接消融基线，因此论文必须表明收益来自远程临场特有的部分（源空间时间滤波、TSDF 可见性、蒸馏、显示流水线），而非方向性不透明度本身。", "threats": [{"title": "No Pose, No Problem in 4D (NoPo4D): Feed-Forward Dynamic Gaussians from Unposed Multi-View Videos", "url": "https://arxiv.org/abs/2605.22190", "year": "2026", "venue": "arXiv (May 2026)", "overlap": "high", "what_overlaps": "这篇论文实现了核心机制。从静态阵列上的同步多视图视频中，一个 feed-forward 网络为每个源相机预测逐像素 Gaussian。它们的不透明度被参数化为 k 阶球谐函数，而不是标量。论文称不透明度 SH“充当学习的置信度度量”，使来自某相机的未对齐 Gaussian 在跨相机几何不一致的视点下变得透明。这就是逐源像素的方向性跨相机混合权重场，而渲染任意视图都是纯光栅化。去掉不透明度 SH 的消融损失 7.5 dB PSNR。它在 N3DV (DyNeRF) 和 Immersive Light Field 上评估，其局限性部分提到了静态阵列假设。", "what_remains_different": "没有摊销、多观看者或光场显示的框架，也没有每秒视图数缩放研究。它是无位姿的，不使用标定 RGB-D 或 TSDF，也不是为实时远程临场延迟而构建。其时间模型是速度与运动，而不是源空间中的系数滤波。没有从目标空间 IBR blender 的蒸馏，没有通过共享 TSDF 可见性的显式遮挡处理，没有持久背景板，也没有对 K 集合跳变、EPI 或光场显示质量的评估。"}, {"title": "ViewSplat: View-Adaptive 3D Gaussian Splatting for Feed-Forward Synthesis", "url": "https://arxiv.org/abs/2603.25265", "year": "2026", "venue": "arXiv (Mar 2026, v2 Jun 2026)", "overlap": "medium", "what_overlaps": "feed-forward 像素对齐 Gaussian 加上预测的逐场景 View MLP。这些 MLP 将目标视图坐标映射为不透明度、颜色、位置、尺度和旋转的视角相关残差。网络只运行一次，每个额外视图只是一次廉价的逐基元求值加光栅化（90 FPS 渲染）。这是相同的“在源/基元空间预测一次，按视图做方向性求值”的分解，且基函数比 SH 更具表达力。", "what_remains_different": "静态场景、无位姿图像、无视频。没有时间一致性，没有多视图或光场显示摊销研究，也没有远程临场或 RGB-D 阵列。"}, {"title": "CoherentRaster: Efficient 3D Gaussian Splatting for Light Field Displays", "url": "https://arxiv.org/abs/2605.04509", "year": "2026", "venue": "arXiv (May 2026)", "overlap": "medium", "what_overlaps": "在光场显示器的众多视图间摊销 3DGS 光栅化，采用跨视图相干属性复用和子像素级光栅化，在消费级 GPU 上实时运行。这覆盖了所提开销模型中“O(#视图 x 光栅化)”那一半以及光场显示渲染贡献。", "what_remains_different": "逐场景优化的静态 3DGS。没有实时多相机采集，没有学习式跨相机混合，也没有时间一致性。它是互补的：可以作为所提方法的光栅化后端。"}, {"title": "Real-time 3D Visualization of Radiance Fields on Light Field Displays", "url": "https://arxiv.org/abs/2508.18540", "year": "2025", "venue": "ACM (arXiv 2508.18540)", "overlap": "medium", "what_overlaps": "在 45 个光场显示视图间共享中间计算（扫描平面）以实现实时渲染：200+ FPS，比逐视图单独渲染快至多 22 倍。", "what_remains_different": "静态、优化得到的辐射场。它明确丢弃了视角相关性。没有实时采集，没有学习式 IBR 混合，也没有时间稳定化。"}, {"title": "DirectL: Efficient Radiance Fields Rendering for 3D Light Field Displays", "url": "https://arxiv.org/abs/2407.14053", "year": "2024", "venue": "ACM TOG (SIGGRAPH Asia 2024)", "overlap": "low", "what_overlaps": "通过子像素重新利用（subpixel repurposing）直接从 NeRF 或 3DGS 渲染光场显示，避免完整的 45 视图渲染开销。", "what_remains_different": "静态的逐场景辐射场。没有实时 IBR、混合或时间模型。"}]}}, {"id": "C05", "name": "Off-rig self-forcing: distilling 4D/video diffusion priors into a real-time geometry-guided renderer without GT", "decision": "pursue_with_repositioning", "scores": {"novelty": 5, "significance": 6, "feasibility": 5, "telepresence_fit": 8, "overall": 5}, "sharpened": {"title_zh": "在部署处训练：面向移动远程呈现观看者的在线几何引导渲染器的 on-policy、置信度门控判别器训练", "title_en": "Train Where You Deploy: On-Policy, Confidence-Gated Critic Training of Online Geometry-Guided Renderers for Moving Telepresence Viewers", "one_liner": "沿移动的、阵列外的头部轨迹对实时阵列渲染器做展开 rollout 训练，并通过 TSDF 回馈其自身的前一帧深度。一个只在阵列置信度低处起作用的视频判别器（critic）在没有 ground truth 的地方提供监督。在一个新的移动观看者基准上评测，该基准的阵列外 ground truth 来自稠密采集穹顶。", "core_claim": "设定为稠密穹顶人体采集（DNA-Rendering、ActorsHQ）中的 4 相机正面阵列子集。学生模型只用阵列相机数据训练，外加由置信度门控视频判别器监督的阵列外 rollout。在运行时不变（40 ms 以内）且阵列内留出相机 PSNR 损失不超过 0.2 dB 的前提下，须满足三点：\n(a) 在这些阵列外相机上，它弥补了基础单时刻训练配方与直接使用穹顶 ground truth 训练的 oracle 之间至少 50% 的阵列外 LPIPS/FVD 差距。\n(b) 在阵列外 LPIPS 和时间指标（tLPIPS、TCC）上，它优于使用同一冻结 diffusion 先验的 FreeGen 式伪标签回归。\n(c) 与 teacher-forced 训练相比，通过前一帧深度/TSDF 反馈的 on-policy 展开训练将长时漂移降低至少 30%。漂移以 1 分钟移动观看者序列上 PSNR/tLPIPS 的衰减斜率度量。\n若 (a) 或 (c) 不成立，则论文的核心论点不成立。", "key_insight": "在线几何引导渲染器存在一个从未被测量过的训练/部署失配：\n- 训练使用阵列相机上的单个时刻，输入为 ground-truth 几何。\n- 部署是一个连续移动、位于阵列外的观看者，其自身的前一帧渲染深度被回馈到融合中。这是一个循环的闭环系统，会遭受 exposure bias，也就是 Self Forcing 和 GeoStream 为生成器修复的同一种失效。\n\n两个观察使得这一情形无需逐阵列 ground truth 也能训练：\n(i) 管线本身会指出哪里缺乏监督。TSDF 累积权重和可见计数就是免费的逐像素置信度图。\n(ii) 置信度高处，阵列像素就是真值。置信度低处（去遮挡、外推），分布层面的视频判别器才是正确的信号，因为来自随机先验的逐像素伪标签会被平均化，导致模糊和闪烁。\n\n结果是：将管线展开为生成器，用管线自身置信度掩膜的判别器，并以阵列锚定保真度，测试时不使用 diffusion。", "method": "学生模型\n- 原管线的复现（无官方代码）：逐视角像素大小的不透明 Gaussian 前向 splatting，然后是颜色门控深度滤波，然后是带前一帧新视角深度反馈的基于图像的 TSDF，然后是带 I_BG 的 U-Net 融合。\n- 升级 1：目标视角空间中的 ConvGRU 状态，由前一帧渲染深度扭曲。预算：不超过 5 ms。\n- 升级 2：通过软松弛使融合超参数可学习：TSDF 截断 tau、反馈增益 beta、上限 eta，以及颜色 mask 的斜率/偏移。\n- 升级 3：可微的 TSDF 过零点。前向 ray-march 和二分保持不变；反向传播在最终过零点处使用隐函数梯度 dz/dθ = −(∂s/∂θ)/(∂s/∂z)。\n- 该配方与学生模型无关。它也被应用于第二个学生——一个像素对齐的 feed-forward GS 预测器（如 GPS-Gaussian），以展示通用性。\n\nROLLOUT\n- 沿采样的 6-DoF 头部轨迹截取 16-24 帧片段：坐姿前倾、侧向摆动、环绕，以及最高到 2 倍阵列基线的外推。\n- 轨迹统计来自可获得许可的公开 HMD 观看轨迹，否则使用与坐姿远程呈现头部运动范围匹配的合成路径。\n- 截断 BPTT，梯度窗口 4-8 帧。窗口之外状态 detach，与 Self Forcing 的梯度截断一致。\n- 课程学习：仅阵列内，然后近阵列，然后远离阵列。\n\n损失\n- 阵列内锚定：留出阵列相机上的 L1、SSIM 和 LPIPS，加上原有的深度和 mask 项，再加上光流扭曲的时间损失。\n- 阵列外，按像素用 g = 1 − normalize(TSDF 权重 × 可见性) 门控：\n  (1) 主要且廉价：条件时空判别器。真样本为阵列相机片段；假样本为渲染的阵列外片段。二者都以源帧为条件。判别器以 projected-GAN 方式构建在冻结的视频 backbone 特征上。\n  (2) 完整版：DMD，配一个冻结的相机条件多视角/视频 diffusion 教师（每个时间步用 SEVA 级模型，人体则用 Diffuman4D），以及一个在降低分辨率下在线训练的 fake-score 网络。\n  (3) 立体/多视角一致性项：MEt3R 式，或双眼渲染间的视差扭曲误差。\n- 使用完全相同教师的基线目标：FreeGen 式伪标签回归（以 Difix/Fixer 精修的渲染作为 L1/LPIPS 目标）。\n\n运行时\n- 不变：1K 下不超过 40 ms（TensorRT），加 ConvGRU 时不超过 45 ms。\n- 推理时无 diffusion。\n\n数据\n- 训练：DNA-Rendering 加 MVHumanNet(++) 序列。在无 GT 设定下，只使用 4-6 台“阵列”相机作为输入和监督。\n- 同一采集中的远端穹顶相机保留用于 (i) 评测和 (ii) oracle 上界。\n- 保留 DyNeRF 和 ENeRF-Outdoor 以便与原论文可比，阵列内正常评测，阵列外用 FVD / 用户偏好评测。", "why_not_engineering": "论文提出并检验三个科学主张，而非系统调参：\n(1) 确定性在线渲染器中的循环几何反馈会造成可测量的 exposure-bias 漂移，而 on-policy 展开能修复它。这是一个可证伪、可测量、尚未在 IBR/TSDF 管线中被刻画的现象。\n(2) 对于外推和去遮挡区域，由重建置信度门控的分布层面判别器优于来自同一先验的伪标签回归。这是在固定学生和教师下对监督类型的正面比较。\n(3) 无 GT 的阵列外训练弥补了与穹顶监督 oracle 之间可量化比例的差距。oracle 上界把“看起来更好”变成一个校准过的数字。\n\n该基准包含移动观看者与移动场景轨迹、来自稠密穹顶的阵列外 ground truth，以及分钟级片段上的漂移指标，是可复用的社区资产。它揭示了一个当前所有在线方法（原论文、Tele360、LiveStre4m、NSTM）都没有评测过的情形。", "differentiation": "FreeGen（arXiv 2512.04830）：\n- FreeGen：静态驾驶场景；逐帧，无循环；伪标签回归；推理时有生成分支；每帧需数秒。\n- 我们：动态人体/场景，以 on-policy 方式训练的循环 TSDF 反馈环，由管线置信度门控的分布判别器，测试时零 diffusion，40 ms。在相同教师下，FreeGen 式伪标签是必需的基线。\n\nLyra（2509.19296）与 FlashWorld（2510.13678）：\n- 它们从单张图像或单目视频出发，蒸馏到生成器。\n- 我们是基于已标定阵列的忠实重建，有阵列内保真度锚定和留出 GT 评测。\n\nInstantViR（2511.14208）：\n- 它把视频 diffusion 模型蒸馏为具有已知退化算子的因果 2D 逆问题求解器。\n- 我们有 3D、新视点和几何闭环。我们引用它作为因果实时蒸馏可行的证据。\n\nGeoStream（2606.15162）与 MV-Forcing（2607.05376）：\n- 它们通过 3D 缓存处理 on-policy 训练，但针对的是 diffusion 生成器。\n- 我们把 exposure-bias 诊断迁移到确定性重建渲染器上，并用 ground truth 量化。\n\nDifix3D+（2503.01774）、4DGS-Fixer（2609.21176）与 DriveX（2412.01717）：\n- 这些是逐场景优化。\n- 我们是可泛化且在线的。Difix/Fixer 作为运行时精修基线（以延迟为代价的质量上界）。\n\n用于稀疏多相机 3D 流式传输的 Transformer 补全（2603.05507）：GT 监督的运行时后处理，作为运行时基线。\n\nMEt3R：仅用作一致性奖励/指标。"}, "experiments": {"datasets": ["DNA-Rendering。主数据集：约 60 相机穹顶，部分带 Kinect 深度。阵列为 4-6 相机的正面子集；远端穹顶相机（偏轴 30-90 度）提供阵列外 ground truth；立体深度来自相邻阵列相机对或多视角深度基础模型。", "ActorsHQ。约 160 台高分辨率相机，序列较少。用作留出测试集，具有稠密的阵列外 ground truth，并可通过相机链构造近似连续的伪轨迹。", "MVHumanNet / MVHumanNet++。大规模多视角人体训练数据。需核对各子集的相机数量和分钟级序列。", "CMU Panoptic（HD 相机加 Kinect）。多人和近距离交互，适合去遮挡压力测试。", "DyNeRF / Neural 3D Video 与 ENeRF-Outdoor。用于与原论文可比；阵列内指标；阵列外因无 ground truth 仅用 FVD / 判别器分数 / 用户偏好评分。", "D3DMV。可选，用于对齐原论文的第三个基准。", "用于轨迹统计的公开 6-DoF HMD 观看轨迹（需核实许可），以合成的坐姿远程呈现路径作为备选。"], "baselines": ["基础配方：仅用阵列相机 ground truth 的单时刻训练（复现）。", "Base + 仅时间扭曲损失（无阵列外监督）。", "带 teacher-forced 多帧训练（ground-truth 深度反馈）的 Base，对比 on-policy。", "FreeGen 式伪标签回归：同一个冻结的 Difix/Fixer 或视频 diffusion 教师，离线将阵列外渲染精修为 L1/LPIPS 目标。", "Oracle：来自远端穹顶相机的直接监督（学生可吸收内容的上界）。", "运行时精修器：base + Difix3D+ 单步修复器、base + NVIDIA Fixer、base + transformer 时空补全（2603.05507）。每个都报告其延迟。", "有代码的 feed-forward 在线竞争方法：GPS-Gaussian（重训）、Tele360 / LiveStre4m / NSTM（若发布）。在新的移动观看者协议下评测。", "第二个学生：同一训练配方应用于 GPS-Gaussian 式像素对齐 GS 预测器。"], "metrics": ["在穹顶 ground-truth 相机上的阵列外保真度，按与阵列的角度距离分箱（0-15、15-30、30-60、60-90 度）：PSNR、SSIM、LPIPS，以及仅限低置信度（去遮挡）像素的掩膜指标。", "无 ground truth 处的分布式阵列外质量：FVD / FID 式视频指标。", "时间：沿移动观看者、移动场景轨迹的 tLPIPS、光流扭曲误差、TCC、STED、SDT。", "漂移：1-5 分钟序列上的 PSNR/tLPIPS 衰减斜率与失效时间，分有无关键帧重置。", "视角/立体一致性：SDV、EPI 稳定性、MEt3R、双眼渲染间的视差扭曲误差。", "忠实度与幻觉：阵列内 PSNR 退化、阵列外视角的人脸身份相似度，以及高置信度像素中的幻觉率（应约为 0）。", "目标 GPU 上的端到端延迟，深度估计单独报告。", "自由头动的 HMD 用户研究：2AFC 偏好与舒适度（n≈20）。"], "key_ablations": ["On-policy 展开 vs teacher-forced 训练，以及 rollout/BPTT 长度（4/8/16）。", "判别器类型：对抗视频判别器 vs DMD vs 伪标签回归 vs 组合，均使用同一教师。", "置信度门控：无 vs TSDF 权重门控 vs 可见计数门控；对阵列内保真度和幻觉率的影响。", "可学习 vs 固定融合超参数（tau、beta、eta、mask），以及 ConvGRU 状态开/关。", "轨迹分布：仅近阵列 vs 课程学习至 2 倍基线；合成路径 vs 由 HMD 轨迹导出的路径。", "教师选择：Difix/Fixer（单步图像）vs SEVA 级多视角 vs Diffuman4D（4D 人体）。", "学生容量：U-Net 宽度 vs 阵列外增益 vs 延迟（Pareto 曲线），以回应容量上限质疑。", "弥补的 oracle 差距比例随阵列相机数量（2/4/6）的变化。"], "needs_custom_capture": false, "capture_notes": "核心论文不需要自建采集。稠密穹顶人体数据集（DNA-Rendering、ActorsHQ、MVHumanNet）同时提供阵列子集和远端阵列外 ground truth，DyNeRF/ENeRF-Outdoor 覆盖一般场景。\n\n注意事项：\n- DNA-Rendering 和 MVHumanNet 需要签署许可协议，耗时较长。\n- 阵列子集的深度必须计算（在相邻相机对上用立体基础模型，或用多视角深度基础模型），并单独报告其延迟。\n- 穹顶相机是静态的，因此不存在真正的移动相机 ground truth。用相机链伪轨迹近似，逐帧与最近的穹顶相机比较，并辅以无参考的时间指标。\n\n可选：一个小型 4 相机桌面阵列（约 2-4k 美元）可以加强 HMD 用户研究，以及“无需穹顶、直接在部署阵列上训练”的主张。它不是被接收的必要条件。"}, "first_two_week_test": "一个跳过 DMD 的容量与监督探针实验。\n\n第 1-5 天：在 10-20 个 DNA-Rendering 序列上搭建最小学生模型：\n- 4 台正面阵列相机，深度来自立体或多视角深度基础模型，预先计算。\n- 逐视角前向 splatting，然后在 512 px 下用带 I_BG 的 U-Net 融合。\n- 先跳过 TSDF，使用最近视角深度。\n\n第 6-12 天：训练四个变体，每个约 30k 次迭代、各用一块 GPU：\n- (A) 仅阵列 ground truth：基础配方。\n- (B) A 加 FreeGen 式伪标签，由冻结的 Difix/Fixer 在偏离 15-60 度的相机位置的阵列外渲染上生成。\n- (C) A 加在相同阵列外渲染上、由可见计数门控的条件 patch/视频判别器。\n- (D) Oracle：A 加来自这些位置真实穹顶相机的直接监督。\n\n在留出的远端穹顶相机和去遮挡像素掩膜上评测 LPIPS/PSNR。\n\n并行（第 8-14 天）：加入朴素的前一帧深度反馈并展开 300 帧。在漂移斜率上比较 teacher-forced 与 2k 次迭代的 on-policy 微调（8 帧 BPTT）。\n\n结果解读：\n- 若 D 不优于 A，学生已达容量上限；放弃该想法或加宽学生模型。\n- 若 C 和 B 都无法缩小 A-D 差距，则先验无济于事。\n- 若 B 弥补了大部分差距而 C 不优于 B，则判别器主张失效；重新定位为基准加 on-policy 论文。\n- 漂移实验告诉你 exposure bias 在这个闭环中是否可测量。", "kill_criteria": "若在至少 2 个随机种子上出现以下任一情况，则放弃或重新定位：\n(1) 容量终止。在 40 ms 以内，穹顶 GT oracle 相比仅阵列配方在阵列外 LPIPS 上的相对改善不足 10%。快速学生无法吸收阵列外知识，因此任何先验都帮不上。转向运行时精修器论文。\n(2) 先验终止。在远端（30-60 度）相机上，判别器训练和伪标签训练都无法弥补仅阵列到 oracle 差距的至少 25%。\n(3) 判别器终止。置信度门控判别器在 LPIPS 上未能以至少 0.01 的优势、或在时间指标（tLPIPS/TCC）上优于 FreeGen 式伪标签回归。贡献于是退化为“面向远程呈现的 FreeGen”；只保留基准加 on-policy 部分，目标改为 TVCG/IEEE VR。\n(4) On-policy 终止。1 分钟序列上 teacher-forced 与 on-policy 的漂移差异小于 10%，说明 exposure bias 在这个闭环中不是真实现象。删除 self-forcing 主张。\n(5) 保真度终止。阵列内 PSNR 退化超过 0.3 dB，或高置信度像素中的幻觉率不可忽略，这对远程呈现不可接受。\n(6) 投稿前的撞车检查：出现一篇 2026-27 年的论文，用阵列外 diffusion 判别器和 on-policy 循环 rollout 训练在线人体或场景渲染器。", "reviewer_objections": [{"objection": "这就是把 FreeGen / Lyra / DriveX 用到远程呈现上：在没有 ground truth 的视角上将生成先验蒸馏到快速渲染器中已经发表过。", "rebuttal": "这一通用思路我们承认并引用。新的、并经实验证明的内容是：\n(i) 在动态场景中通过循环几何反馈环进行 on-policy 训练，并测量到漂移降低。FreeGen、Lyra 和 DriveX 都没有循环。\n(ii) 在相同教师和学生下对监督类型的正面比较：置信度门控的分布判别器在去遮挡像素 LPIPS 和时间指标上优于 FreeGen 式伪标签。\n(iii) 推理时零 diffusion，40 ms 以内，而 FreeGen 和 GIFSplat 保留生成分支。\n(iv) 带 oracle 上界的移动观看者基准。"}, {"objection": "稠密穹顶提供了阵列外 ground truth。为什么要无 GT？直接用额外的穹顶相机监督就行了。", "rebuttal": "我们确实训练了这个 oracle，它是上界。我们的主张是仅用阵列数据能弥补多少 oracle 差距。这很重要，因为部署阵列（4 相机桌面阵列、类 Beam 的隔间）没有穹顶，穹顶只覆盖影棚中的人体，而且穹顶相机是离散且静态的，无法监督连续的移动观看者视频。我们还展示了组合：在穹顶相机之间的连续轨迹上，oracle 加判别器在时间指标上优于单独的 oracle。"}, {"objection": "幻觉出内容对远程呈现的保真度是危险的：判别器会编造细节并改变身份。", "rebuttal": "判别器梯度由管线自身的 TSDF 和可见性置信度门控，并保留阵列内 ground-truth 锚定。我们报告 (a) 阵列内 PSNR 退化不超过 0.2 dB，(b) 仅限高置信度像素的幻觉率与误差，(c) 阵列外视角的人脸身份相似度。对门控的消融展示了门控所避免的保真度代价。"}, {"objection": "一个很小的逐帧 U-Net 吸收不了视频 diffusion 先验，而用强条件多视角教师做 DMD 对小实验室来说既不稳定又耗算力。", "rebuttal": "容量-延迟 Pareto 曲线和穹顶 oracle 直接度量可吸收的空间。我们还加入了 ConvGRU 状态。主要判别器是基于冻结特征的廉价条件视频判别器；DMD 是降分辨率下的消融。我们报告随机种子、教师选择（Difix/Fixer vs SEVA 级 vs Diffuman4D）和 GPU 小时。论文的主张并不特别依赖 DMD。"}, {"objection": "原管线已经过时：启发式 TSDF、640 px、无代码，而竞争方法（Tele360、LiveStre4m、NSTM）是无位姿 feed-forward。结果可能无法迁移。", "rebuttal": "该配方与学生模型无关，并在两个学生上展示：几何引导 IBR 复现和像素对齐 GS 预测器。无位姿竞争方法在新的移动观看者协议下评测，而它们都没有报告过该协议。无论哪个学生胜出，基准和漂移发现都成立。"}], "synergies": "- 学习的时间记忆与长时漂移（用 ConvGRU 或 TTT 状态替代 TSDF 加颜色 mask 启发式这一领域空白）。本文提供了这种记忆所需的 on-policy 训练，二者可合并为一篇更强的论文：“在自身 rollout 上训练的循环在线渲染器”。\\n- 运行时 diffusion 修复器方向（Difix/Fixer 精修器）。它是天然的基线和教师，因此二者构成一个系列：运行时修复器 vs 被蒸馏掉的修复器。\\n- 概率/不确定性感知融合。校准更好的置信度直接改善判别器门控。\\n- 统一的在线远程呈现基准（分钟级序列、失同步和光照压力测试）。这里的移动观看者、阵列外 GT 协议可以作为其核心。\\n- 立体/HMD 渲染与发送端/接收端分离设计。接收端零额外开销适合一体式 HMD 以及经编解码器传输的 RGB-D 或 Gaussian 图。\\n- 无位姿 feed-forward 实时 NVS（Tele360、LiveStre4m）。与学生无关的配方可迁移到它们上。\\n\\n本次审阅中打开或看到的来源：\\n- FreeGen https://arxiv.org/abs/2512.04830\\n- Streaming4D https://arxiv.org/abs/2609.00610（Self-Forcing 生成器加增量重建；不构成威胁）\\n- 用于稀疏多相机 3D 流式传输的 Transformer 补全 https://arxiv.org/abs/2603.05507\\n- 另加新颖性报告中经核实的 URL：2509.19296、2511.14208、2606.15162、2607.05376、2506.08009、2503.01774、2609.21176、2412.01717、2507.13344\\n- 领域条目：Tele360 2609.15032、LiveStre4m 2604.06740、NSTM 2607.15271\\n\\nWebSearch 预算已用尽，arXiv/Semantic Scholar API 返回 429，因此 2026 年人体化身文献未在新颖性报告之外重新检索。", "effort": {"months": "7-9 个月（约 1.5 个月复现原管线，因为没有官方代码；另约 1 个月用于数据许可和深度预计算）", "people": "2 人（一名博士生负责渲染器和 on-policy 训练，一名负责判别器/教师以及基准和用户研究）", "compute": "4-8 块 80 GB GPU（A100/H100 级），总计约 3-6k GPU 小时。仅判别器路径可在 4 块 48 GB GPU 上运行；带 1-2B 视频教师的 DMD 变体需要 80 GB 显卡，并占据预算的主要部分。"}, "venue": "ICCV 2027（首选）。CVPR 2027 截稿对复现加新基准来说太近。若 HMD 用户研究和系统部分有力，SIGGRAPH Asia 2027 为备选。若结果主要是移动观看者基准加用户研究，则投 IEEE VR / TVCG。", "novelty": {"verdict": "partially_scooped", "remaining_novel_angle": "通用思路已被占据。FreeGen（ECCV 2026）已在静态驾驶场景中做到：在采集轨迹之外采样视点，用冻结的视频 diffusion 先验在那里监督可泛化 feed-forward 渲染器，并在真实视角上用 GT 锚定。InstantViR（CVPR 2026）已把双向视频 diffusion 模型蒸馏为无需干净数据的实时因果学生。GeoStream 和 MV-Forcing 已发表通过几何反馈缓存、结合 DMD 的 on-policy（self-forcing）训练。\n\n仍可辩护的是交集，我找到的论文中没有一篇主张它：\n(1) 学生是一个无 diffusion、实时（40 ms 以内）、已标定多视角 RGB-D 几何引导 IBR 渲染器，用于动态人体或场景。与 FreeGen、GIFSplat 和 Leveling3D 不同，测试时不运行 diffusion。\n(2) 它在自身通过物理循环几何闭环（带前一帧深度反馈的 TSDF、可学习融合超参数）的展开 rollout 上训练。rollout 在场景运动的同时沿阵列外移动观看者的头部轨迹进行，针对的是确定性重建闭环而非生成器中的 exposure-bias 漂移。\n(3) 训练使用分布层面的判别器（DMD、视频判别器或一致性奖励）而非伪标签回归，并由管线自身的置信度（TSDF 权重）做空间门控，使先验只在阵列无信息处起作用。\n(4) 新的移动观看者、移动场景评测协议，使用来自稠密穹顶的阵列外 GT（DNA-Rendering 或 MVHumanNet++ 相机子集）以及时间和漂移指标。\n\n贡献 (4) 和 on-policy TSDF 反馈消融最可辩护。单独的“把 DMD 蒸进渲染器”会被看作“FreeGen/Lyra 用于远程呈现”。论文必须引用 FreeGen、InstantViR、GeoStream 和 MV-Forcing，并用实验证明 DMD 或判别器训练优于 FreeGen 式伪标签回归，且 on-policy rollout 优于 teacher-forced 训练。", "threats": [{"title": "FreeGen: Feed-Forward Reconstruction-Generation Co-Training for Free-Viewpoint Driving Scene Synthesis", "url": "https://arxiv.org/abs/2512.04830", "year": "2025 (arXiv Dec 2025; ECCV 2026 per papernotes)", "venue": "ECCV 2026", "overlap": "high", "what_overlaps": "这是与核心配方最接近的工作，而构思者遗漏了它。它采样没有 ground truth 的轨迹外视点（±3 m 横向平移），并用可泛化 feed-forward 3DGS 重建器渲染。一个冻结的视频 diffusion 模型把这些渲染精修为伪标签，伪标签与轨迹内 ground-truth 损失一起监督 feed-forward 重建网络（辅助损失权重 0.1）。因此“用视频 diffusion 先验、在无 GT 的阵列外视角上训练可泛化渲染器，并以真实视角 GT 锚定”已经发表。", "what_remains_different": "FreeGen 在推理时保留 diffusion 精修分支，因此不是零代价。它使用伪标签回归而非 DMD 或分布层面判别器。场景是静态驾驶场景：动态参与者被烘焙进静态 Gaussian，没有循环状态或 on-policy 反馈环。它不是实时的（数秒），不是已标定 RGB-D IBR，也不是人体远程呈现。"}, {"title": "InstantViR: Real-Time Video Inverse Problem Solver with Distilled Diffusion Prior", "url": "https://arxiv.org/abs/2511.14208", "year": "2025 (CVPR 2026)", "venue": "CVPR 2026", "overlap": "medium", "what_overlaps": "将双向视频 diffusion 教师蒸馏为以超过 35 FPS 运行的因果自回归单遍学生。蒸馏由先验驱动，无需成对或干净数据，并明确针对流式传输、远程呈现和 AR/VR。这覆盖了“视频 diffusion 先验可以在无 GT 的情况下蒸馏为实时因果网络，包括流式补全”的主张。", "what_remains_different": "它求解具有已知退化算子的 2D 逆问题（补全、去模糊、SR）。没有 3D，没有新视点，没有几何引导渲染器，没有多视角阵列，也没有 TSDF 反馈。"}, {"title": "Lyra: Generative 3D Scene Reconstruction via Video Diffusion Model Self-Distillation", "url": "https://arxiv.org/abs/2509.19296", "year": "2025 (ICLR 2026)", "venue": "ICLR 2026", "overlap": "medium", "what_overlaps": "在没有多视角 GT 的情况下把视频 diffusion 蒸馏为 feed-forward 3DGS 解码器，并从单目视频扩展到动态 4D。这在一般意义上覆盖了“把生成先验蒸馏为快速 3D 一致网络”。", "what_remains_different": "任务是从单张图像或视频生成，而非基于已标定阵列的忠实重建。没有阵列内保真度锚定，没有循环几何反馈，没有实时在线流式处理，也没有移动观看者协议。"}, {"title": "GeoStream: Toward Precise Camera Controlled Streaming Video Generation", "url": "https://arxiv.org/abs/2606.15162", "year": "2026", "venue": "arXiv", "overlap": "medium", "what_overlaps": "识别出由自刷新 3D 缓存引起的几何诱导 exposure bias：来自自身输出的深度被反投影并重新渲染。它通过镜像推理时反馈的完全 on-policy 训练来修复。这在概念上就是该想法中“通过循环 TSDF/前一帧深度反馈环进行 on-policy 训练”的主张。", "what_remains_different": "学生是 AR 视频 diffusion 生成器，而不是输入真实阵列帧的确定性几何引导 IBR 渲染器。它不是已标定多视角重建，也没有在留出相机上评测保真度。"}, {"title": "MV-Forcing: Long Multi-View Video Generation via 4D-Grounded Spatio-Temporal Self-Forcing", "url": "https://arxiv.org/abs/2607.05376", "year": "2026", "venue": "arXiv", "overlap": "medium", "what_overlaps": "DMD 结合时空 self-forcing，并在环中加入 4D 重建，用于多视角一致的动态视频。这把 Self Forcing 与 DMD 和 4D 几何反馈结合在一起。", "what_remains_different": "学生是多视角视频的 few-step diffusion 生成器。它不是由采集阵列帧驱动的实时确定性渲染器，也不是远程呈现。"}]}}, {"id": "C08", "name": "Deployment-time continual self-supervision from spare rig cameras (leave-one-camera-out TTA)", "decision": "pursue_with_repositioning", "scores": {"novelty": 5, "significance": 6, "feasibility": 6, "telepresence_fit": 8, "overall": 5}, "sharpened": {"title_zh": "阵列能教会它自身之外的视角吗？实时几何引导 3D 视频的持续留出相机自适应，以及何时能迁移到阵列之外", "title_en": "Does the Rig Teach Beyond Itself? Continual Held-Out-Camera Adaptation of Real-Time Geometry-Guided 3D Video, and When It Transfers Off-Rig", "one_liner": "已部署的多相机渲染器利用未用于渲染的阵列相机上的光度损失，在线自适应其深度网络和混合网络。我们展示这种基于插值视角的自监督何时能迁移到外推的、阵列之外的视点，何时会损害它们，并表明经由软 image-based TSDF 传递的渲染损失比 MADNet 风格的立体重投影自适应能更好地修正几何。", "core_claim": "设定：域外阵列（ENeRF-Outdoor、Panoptic/ActorsHQ 穹顶子集），包含三组互不相交的相机：监督池 S、位于 S 凸包内的无监督插值相机 E_int、以及位于凸包外的无监督外推相机 E_ext。(1) 对几何引导实时渲染器进行持续的留一相机（leave-one-camera-out）自适应，并加入阵列外循环正则项，可在 10 分钟流式运行内使 E_int 提升至少 1.0 dB PSNR，E_ext 提升至少 0.5 dB PSNR（或至少 10% LPIPS），均在从未被回放的未来帧上测量。30 分钟后对较早内容的遗忘保持在 0.3 dB 以下。(2) 不带正则项的朴素留一相机自适应能提升 E_int，但对 E_ext 没有显著提升，甚至使其退化。(3) 在同等计算量下，通过可微软 image-based TSDF 用渲染损失自适应深度网络，比 MADNet/MAD++ 风格的立体重投影自适应获得更高的 E_int/E_ext 质量。(4) 当基础模型在大规模多视角人体数据（DNA-Rendering 规模）上预训练时，以上三点仍然成立，只是增益更小。(1)-(3) 中任一失败即证伪本文论点。", "key_insight": "部署时的固定阵列拥有渲染器未使用视点上的时间同步真实图像，因此每一帧都能无限期地提供与任务对齐的监督（渲染新视角）。这一信号是已知的（IBRNet 逐场景微调、LookinGood 见证相机、MADNet 在线立体自适应）。未知的是，它能否提升远程临场观看者实际使用的视点。这些视点位于阵列之外，在显示器前方的头部活动区域（head box）内，那里没有真值。有两点洞见。(a) 留一相机任务比部署查询基线更宽、插值性更强，因此朴素自适应会专门化到阵列相机位姿。一种“先渲染虚拟视角、再重渲染真实视角”的循环，把留出相机的误差经由阵列外虚拟视角反传，从而将阵列上的真值转化为阵列外视角的梯度信号。(b) 部署目标是视角质量，而非视差。因此通过软 TSDF 监督深度网络，会把修正放在深度误差在渲染中可见的地方（高光、弱纹理、室外远景背景），而重投影损失则会忽略这些，或奖励匹配高光。", "method": "渲染器，由于未发布代码而重新实现基础论文：逐视角深度来自实时立体网络（Fast-FoundationStereo 或 Lite Any Stereo V2 类，约 20-50 ms）、不透明像素大小的 splat、软 image-based TSDF，以及预测权重和背景图像的 4 层 blend U-Net。保留差分门控的时序深度滤波器。\n\n软 TSDF：沿每条目标光线采样约 32-64 个深度。逐视角截断 SDF 为 tanh((D_n(proj) - z_n)/tau_n)，其中 tau_n 可学习且依赖深度（tau = tau0 + tau1*z^2，修正了基础论文固定的 0.02 m）。各视角以置信度权重融合，表面深度为软零交叉，即 NeuS 风格 logistic 密度的期望。该过程对输入深度、置信度和 tau 可微。\n\n自适应参数，总计少于 1M：(i) 逐相机 3x4 颜色仿射，作为独立的干扰吸收器，单独报告；(ii) blend U-Net 上的 rank-8 LoRA；(iii) 仅在立体网络最后的细化/上采样头上的 LoRA；(iv) tau0、tau1 和置信度缩放。\n\n在后台线程中的自适应循环：以 1-2 Hz 存储 (时间, 全部相机帧) 的蓄水池（reservoir）回放缓冲区。每步采样 t、S 中的目标相机 c，输入为
