    --mile: #F0B45A; --mile-soft: #37280F; --good: #62D38F; --good-soft: #10301D; --warn: #F0B45A;

.anchors-line { display: flex; flex-wrap: wrap; gap: 10px; }

.stack { display: grid; gap: 0; border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; background: var(--surface); }

.mat .bar i { height: 8px; border-radius: 2px; background: var(--surface-2); }
.mat .bar i.f1 { background: var(--v1); } .mat .bar i.f2 { background: var(--v2); } .mat .bar i.f3 { background: var(--v3); } .mat .bar i.f4 { background: var(--v4); } .mat .bar i.f5 { background: var(--v5); }

.area-body { padding: 18px 20px 22px; display: grid; gap: 22px; border-top: 1px solid var(--rule); min-width: 0; }

.btn:hover { background: var(--accent-soft); }

.db-controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }

.obj span { color: var(--ink-2); }

.path { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 14px; }
.path ol { margin: 0; padding-left: 1.3em; display: grid; gap: 10px; font-size: 13.5px; }
.path ol li small { display: block; color: var(--muted); }
.note { font-size: 13px; color: var(--muted); max-width: 80ch; }

/* ---------- learning part ---------- */
.cchip { appearance: none; font: inherit; font-size: 12.5px; padding: 1px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); border: 1px solid transparent; cursor: pointer; white-space: nowrap; }
.cchip:hover { border-color: var(--accent); }
.cchip.ghost { background: transparent; border-color: var(--rule); color: var(--ink-2); }
.cchip.ghost:hover { border-color: var(--accent); color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chips .lbl { font-size: 12px; color: var(--muted); margin-right: 2px; }
.flash { animation: flash 1.6s ease-out 1; }
@keyframes flash { 0% { background-color: var(--flash); } 100% { background-color: transparent; } }
@media (prefers-reduced-motion: reduce) { .flash { animation: none; outline: 2px solid var(--accent); } }

.math-block { overflow-x: auto; overflow-y: hidden; padding: 8px 12px; background: var(--surface-2); border-radius: 6px; font-family: var(--mono); font-size: 13px; color: var(--ink); }
.math-block mjx-container { margin: 4px 0 !important; }
.eq { display: grid; gap: 6px; }
.eq p { font-size: 13.5px; color: var(--ink-2); white-space: pre-line; }
.eqs { display: grid; gap: 14px; }
.aside { background: var(--surface-2); border-radius: 8px; padding: 10px 14px; font-size: 14px; color: var(--ink-2); display: grid; gap: 2px; }
.aside b { font-size: 12px; color: var(--muted); letter-spacing: .05em; font-weight: 700; }
.aside span { white-space: pre-line; }
.idref { appearance: none; background: none; border: 0; padding: 0 1px; font: inherit; font-family: var(--mono); font-size: .86em; color: var(--accent); cursor: pointer; text-decoration: underline dotted; text-underline-offset: 3px; }
.idref:hover { text-decoration-style: solid; }

.roadmap { display: grid; gap: 10px; }
details.stage { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; min-width: 0; }
details.stage > summary { list-style: none; cursor: pointer; padding: 14px 18px; display: grid; grid-template-columns: 40px minmax(0,1fr) auto; gap: 12px; align-items: start; }
details.stage > summary::-webkit-details-marker { display: none; }
details.stage .num { font-family: var(--mono); width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: 13px; }
details.stage .head { display: grid; gap: 4px; }
details.stage .head h3 { font-size: 16.5px; }
details.stage .head p { font-size: 13.5px; color: var(--ink-2); }
details.stage .dur { font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: nowrap; }

.mods { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.mod { appearance: none; text-align: left; font: inherit; cursor: pointer; background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 12px 14px; display: grid; gap: 4px; align-content: start; color: var(--ink); }
.mod:hover { border-color: var(--accent); }
.mod i { font-style: normal; font-family: var(--mono); font-size: 11px; color: var(--muted); }
.mod b { font-family: var(--serif); font-size: 14.5px; }
.mod span { font-size: 12.5px; color: var(--ink-2); }

details.concept { border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); min-width: 0; }
details.concept > summary { list-style: none; cursor: pointer; padding: 12px 16px; display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 4px 12px; }
details.concept > summary::-webkit-details-marker { display: none; }
details.concept .nm { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
details.concept .nm b { font-family: var(--serif); font-size: 15.5px; }
details.concept .nm span { font-family: var(--mono); font-size: 11px; color: var(--muted); }
details.concept .tl { grid-column: 1 / -1; font-size: 13.5px; color: var(--ink-2); }
details.concept .uses { display: flex; gap: 6px; align-items: center; }
.concept-body { border-top: 1px solid var(--rule); padding: 16px 16px 20px; display: grid; gap: 18px; min-width: 0; }
.anchor-use { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }
.anchor-use > div { border: 1px solid var(--rule); border-radius: 8px; padding: 10px 12px; display: grid; gap: 6px; align-content: start; }
.anchor-use h5 { margin: 0; font-family: var(--sans); font-size: 12.5px; font-weight: 700; color: var(--ink); display: flex; gap: 8px; align-items: center; }
.anchor-use p { font-size: 13.5px; color: var(--ink-2); }
.anchor-use small { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
details.qa { border-top: 1px dashed var(--rule); }
details.qa > summary { list-style: none; cursor: pointer; padding: 8px 0; font-size: 14px; color: var(--ink); display: flex; gap: 8px; }
details.qa > summary::before { content: "问"; font-size: 11.5px; color: var(--accent); background: var(--accent-soft); border-radius: 4px; padding: 0 6px; height: fit-content; margin-top: 3px; }
details.qa > p { font-size: 13.5px; color: var(--ink-2); padding: 0 0 10px 30px; white-space: pre-line; }
.res { display: grid; gap: 6px; font-size: 13.5px; }
.res div { display: grid; grid-template-columns: 58px minmax(0,1fr); gap: 8px; }
.res .ty { font-family: var(--mono); font-size: 11px; color: var(--muted); padding-top: 3px; }
.res small { color: var(--muted); display: block; }

.diagram-wrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: 10px; background: var(--surface); padding: 10px; }
svg.diagram { display: block; width: 100%; min-width: 860px; height: auto; }
.dnode rect { fill: var(--surface-2); stroke: var(--rule); stroke-width: 1; }
.dnode.data rect { fill: var(--surface); stroke-dasharray: 4 3; }
.dnode.click { cursor: pointer; }
.dnode.click:hover rect, .dnode.click:focus rect { stroke: var(--accent); stroke-width: 1.6; }
.dnode.click:focus { outline: none; }
.dnode .t { fill: var(--ink); font-family: var(--sans); font-size: 13px; font-weight: 500; }
.dnode .s { fill: var(--muted); font-family: var(--sans); font-size: 11px; }
.dnode .k { fill: var(--accent); font-family: var(--mono); font-size: 10.5px; font-weight: 500; }
.dedge { stroke: var(--muted); stroke-width: 1.4; fill: none; }
.dedge.fb { stroke: var(--accent); stroke-dasharray: 5 4; }
.dhead { fill: var(--muted); }
.dhead.fb { fill: var(--accent); }
.dloop { fill: var(--accent-soft); fill-opacity: .45; stroke: var(--accent); stroke-width: 1; }
.dlabel { fill: var(--accent); font-family: var(--sans); font-size: 12px; font-weight: 700; }
.dnote { fill: var(--muted); font-family: var(--sans); font-size: 11.5px; }

details.step { border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); min-width: 0; }
details.step > summary { list-style: none; cursor: pointer; padding: 12px 16px; display: grid; grid-template-columns: 44px minmax(0,1fr) auto; gap: 10px; align-items: baseline; }
details.step .sid { font-family: var(--mono); font-size: 12px; color: var(--accent); }
details.step .st { display: grid; gap: 2px; }
details.step .st b { font-size: 15px; font-weight: 500; color: var(--ink); }
details.step .st small { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.step-body { border-top: 1px solid var(--rule); padding: 16px; display: grid; gap: 16px; min-width: 0; }
.checklist { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; }
.checklist div { border: 1px solid var(--rule); border-radius: 8px; padding: 8px 12px; display: grid; gap: 4px; font-size: 13px; color: var(--ink-2); align-content: start; }

.lanes-wrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: 10px; background: var(--surface); padding: 12px 12px 6px; position: relative; }
svg.lanes { display: block; width: 100%; min-width: 820px; height: auto; }
.lanes .grid { stroke: var(--rule); stroke-width: 1; }
.lanes .axis { fill: var(--muted); font-family: var(--mono); font-size: 11px; }
.lanes .lane-l { fill: var(--ink-2); font-family: var(--sans); font-size: 12px; }
.lanes .dot { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.lanes .dot.hollow { fill: var(--surface); stroke: var(--accent); stroke-width: 1.6; }
.lanes .hit { fill: transparent; cursor: pointer; }
.lanes g.m:hover .dot, .lanes g.m:focus .dot { stroke: var(--ink); }
.lanes g.m:focus { outline: none; }
.lanes .brk { stroke: var(--muted); stroke-width: 1; }
.vtip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; color: var(--ink); max-width: 320px; box-shadow: 0 4px 16px rgba(0,0,0,.12); display: grid; gap: 2px; z-index: 3; }
.vtip small { color: var(--muted); font-family: var(--mono); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--muted); align-items: center; padding: 4px 4px 0; }
.legend svg { vertical-align: middle; }
.classic-list { display: grid; gap: 10px; }
details.classic { border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); min-width: 0; }
details.classic > summary { list-style: none; cursor: pointer; padding: 10px 16px; display: grid; grid-template-columns: 52px minmax(0,1fr) auto; gap: 10px; align-items: baseline; }
details.classic > summary::-webkit-details-marker { display: none; }
details.classic .yr { font-family: var(--mono); font-size: 13px; color: var(--ink); }
details.classic .ti { display: grid; gap: 2px; }
details.classic .ti b { font-size: 14.5px; font-weight: 500; }
details.classic .ti small { font-size: 12px; color: var(--muted); }
details.classic .cit { font-family: var(--mono); font-size: 12px; color: var(--ink-2); text-align: right; white-space: nowrap; }
.classic-body { border-top: 1px solid var(--rule); padding: 12px 16px 16px; display: grid; gap: 12px; }

.gl-wrap { max-height: 72vh; overflow: auto; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); }
.gl td.en { font-weight: 500; color: var(--ink); min-width: 170px; }
.gl td.zh { min-width: 110px; }
.gl td.def { min-width: 300px; color: var(--ink-2); }

@media (max-width: 1000px) {
  .shell { grid-template-columns: minmax(0,1fr); gap: 20px; padding-top: 0; }
  .toc { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); max-height: none; overflow-x: auto; overflow-y: hidden; padding-block: 10px; border-bottom: 1px solid var(--rule); margin-inline: -20px; padding-inline: 20px; }
  .toc .brand, .toc .ramp, .toc li.grp, .toc ol.sub { display: none; }
  .toc ol { display: flex; gap: 4px; margin: 0; white-space: nowrap; }
  .toc a { border-left: 0; border-bottom: 2px solid transparent; padding: 4px 8px; }
  .toc a.on, .toc a.page.cur { border-bottom-color: var(--accent); }
  .toc-mobile { display: grid; gap: 6px; }
  :root { --jump-offset: 72px; }
  .toc { scrollbar-width: none; }
  .toc::-webkit-scrollbar { display: none; }
  .pager { grid-template-columns: minmax(0, 1fr); }
  .pager a.next { grid-column: 1; }
  .layer { grid-template-columns: minmax(0,1fr); gap: 10px; }
  .two, .idea-grid, .path, .anchor-use { grid-template-columns: minmax(0,1fr); }
  .mods { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .starts { grid-template-columns: minmax(0,1fr); }
}
@media (max-width: 560px) {
  .shell { padding-inline: 16px; }
  .toc { margin-inline: -16px; padding-inline: 16px; }
  .panel { padding: 16px; }
  details.idea > summary { grid-template-columns: minmax(0,1fr) auto; }
  details.idea .rank { display: none; }
  details.step > summary { grid-template-columns: minmax(0,1fr) auto; }
  details.step .sid { display: none; }
  details.classic > summary { grid-template-columns: 44px minmax(0,1fr); }
  details.classic .cit { grid-column: 2; text-align: left; }
  .mods { grid-template-columns: minmax(0,1fr); }
  .area-body, .idea-body, .concept-body, .step-body { padding-inline: 12px; }
}

/* ---------- overflow guards: long labels wrap inside cards instead of widening the page ---------- */
.cchip, .chip { max-width: 100%; }
.chips .cchip, .classic-body .chip, .card .chip { white-space: normal; overflow-wrap: anywhere; text-align: left; }
.toc-mobile .chips > * { white-space: nowrap; }
.card, .anchor-use > div, .classic-body, .concept-body, .step-body, .area-body, .idea-body, .blk, .subcard { grid-template-columns: minmax(0, 1fr); }
@media (min-width: 1001px) { .page-head.only-mobile { display: none; } }
@media (max-width: 1000px) { .page-head { margin-bottom: -40px; } }
main { overflow-wrap: break-word; }
.prose, .sec-head, .hero, .threat, .obj, .eqs, .eq, .kv div, .checklist div, .layer .body, .anchor-body, .classic-list, .roadmap { grid-template-columns: minmax(0, 1fr); }
mjx-container[jax="SVG"]:not([display="true"]) { display: inline-block; max-width: 100%; overflow-x: auto; overflow-y: hidden; vertical-align: middle; }
ul.plain, .path ol, .res, .timeline, .stages, .subgrid > *, .cards > * { grid-template-columns: minmax(0, 1fr); }
ul.plain li, .res span, .threat span { overflow-wrap: anywhere; }

</style>
</head>

<div class="shell">

<script type="application/json" id="data">{"meta": {"date": "2026-09-28", "subtitle": "以 Quark（Google，SIGGRAPH Asia 2024）与 Ha et al.（KAIST + Meta，CVPR 2025）两篇实时多视角新视角合成论文为出发点，分三部分展开。第一部分帮你入门：基础知识、进阶专题、经典论文，以及把基础知识和两篇论文逐步对上的精读导读。第二部分梳理 3D 临场（telepresence）的全栈调研：采集、几何、表示、渲染、传输、显示与感知。第三部分给出 18 个经过对抗式查新和模拟 AC 评审的研究方向。", "learn_lede": "面向刚进入 3D 视觉 / 临场方向的研究生，默认你有本科线代、概率、Python 和基础深度学习。建议的用法：按“学习路线”推进；遇到不懂的词查“术语表”；读两篇锚点论文时开着“精读导读”，每一步都能点回需要的基础概念。基础概念卡片也会反过来标出它在 Quark 和 Ha et al. 的哪一步用到。", "foundations_lede": "8 个模块按学习顺序排列。每个概念都有：一句话要点、直觉解释、类比、逐项拆解的公式、带数字的例子、易错点、它在两篇锚点论文中的具体位置、学习资源和自测题。标签“Quark 用到 / Ha 用到”表示该概念是否直接出现在对应论文中。", "guided_lede": "把两篇论文按流水线拆成若干步。每一步写清楚：做什么（输入 → 输出）、白话解释、类比、论文公式逐项拆解、具体超参、为什么这样设计、容易误解的地方和自测题，并链接到需要的基础概念。点击流程图的方框可以直接跳到对应步骤。内容写完后由另一个 agent 对照论文原文逐条核查，并修正了发现的错误。", "advanced_lede": "16 个进阶专题，每个包含核心思想、关键公式、演进时间线、按优先级排序的奠基论文（附 Semantic Scholar / OpenAlex 引用数）、与两篇锚点论文的关系、争论与开放问题。", "classics_lede": "按 6 个主题收录 2025 年及以前发表的高影响论文。入选标准是引用数高或改变了领域走向，并且偏重两篇锚点论文所依赖的工作。每篇都由另一个 agent 复核了是否存在、年份与会议，以及引用数（来源为 Semantic Scholar 或 OpenAlex，2026 年 9 月）。上图横轴 2010 年以前做了压缩。", "survey_lede": "以两篇锚点论文为坐标原点，覆盖 10 个子方向、350 余条论文 / 产品 / 标准，以及全栈地图、范式对比、趋势与挑战。", "ideas_lede": "这些方向来自 5 个独立视角（失败模式、基础模型、系统、问题重构/评测、跨领域）共 30 个 idea，聚类为 18 个方向。每个方向先由一个 agent 专门找“已经被做过”的证据，再由一个模拟 AC 的 agent 重新定位、打分、设计实验。结论：没有一个方向是完全空白的，18 个全部判定为“部分已被做，需要重新定位”。综合分 5 分约等于一篇普通录用论文的水平。列表按综合分排序，点开可看核心论点、查新找到的撞车工作、两周验证实验和止损标准。", "method_zh": "本报告由多 agent 工作流生成，所有 agent 都能联网检索（arXiv API、Semantic Scholar、OpenAlex、网页搜索）。\n\n调研部分：先精读两篇锚点论文（含附录），并对照原文逐条核查未言明的问题，例如 Ha et al. 的运行时间没算立体深度估计，TSDF 消融几乎没有增益。然后分 10 个子方向检索，每个方向 25–45 篇带真实链接的工作，分为里程碑 / 重要 / 相关三档，再由一个综合 agent 写出全景图、范式对比、趋势、重大挑战和阅读清单。\n\n研究方向部分：5 个视角各自提出 idea，聚类为 18 个方向。每个方向先做对抗式查新（抽查引用是否真实存在，至少 10 组检索），再做模拟 AC 评审。\n\n使用说明：这些内容由 AI agent 检索和撰写，可能有遗漏、过时或数字不准，2026 年 7–9 月的新论文覆盖尤其有限。引用或投稿前请务必打开原文核实，尤其是 2026 年的 arXiv 编号、性能数字和引用数。评分只用于比较方向之间的相对强弱，不代表真实的录用概率。\n\n入门学习部分：先固定一份课程骨架（8 个模块、40 个概念、16 个进阶专题），所有内容都用同一套 ID 互相链接。基础知识每个模块由一个 agent 撰写，再由技术编辑 agent 核查公式、数值例子、链接以及与两篇论文的对应关系，共修正 145 处。进阶专题同样经过撰写与复核，修正 95 处。经典论文由 6 个主题检索 agent 汇总并去重，再分批逐篇复核：保留 152 篇，更正 115 篇，剔除 0 篇。精读导读共 26 步，由对抗式核查 agent 对照论文原文修正 70 处。术语表 195 条。", "learn_method_zh": "入门学习部分：先固定一份课程骨架（8 个模块、{concepts} 个概念、{advanced} 个进阶专题），所有内容都用同一套 ID 互相链接。基础知识每个模块由一个 agent 撰写，再由技术编辑 agent 核查公式、数值例子、链接以及与两篇论文的对应关系，共修正 {foundation_fixes} 处。进阶专题同样经过撰写与复核，修正 {advanced_fixes} 处。经典论文由 6 个主题检索 agent 汇总并去重，再分批逐篇复核：保留 {classics} 篇，更正 {classics_corrected} 篇，剔除 {classics_removed} 篇。精读导读共 {steps} 步，由对抗式核查 agent 对照论文原文修正 {guide_fixes} 处。术语表 {glossary} 条。"}, "xref": {"concepts": {"f-linalg": "线性代数、齐次坐标与刚体变换", "f-optim": "优化、鲁棒估计与梯度下降", "f-prob": "概率、加权平均与递归滤波", "f-image": "数字图像：颜色、采样、插值与金字塔", "g-pinhole": "针孔相机模型：内参、外参、投影与反投影", "g-epipolar": "对极几何、三角化与单应", "g-depth": "深度、视差与逆深度采样", "g-sfm": "运动恢复结构（SfM）与光束法平差", "g-rig": "多相机阵列：标定、同步与卷帘快门", "d-stereo": "双目立体匹配：从 SGM 到 RAFT-Stereo", "d-mvs": "多视角立体（MVS）与平面扫描", "d-mono": "单目与视频深度估计", "d-flow": "光流、场景流与图像 warping", "d-tsdf": "截断符号距离场（TSDF）与深度融合", "d-sensors": "深度传感器与噪声特性", "r-raster": "光栅化、z-buffer 与点溅射（splatting）", "r-alpha": "Alpha 合成与 over 算子", "r-volume": "体渲染方程与离散化", "r-raymarch": "光线步进、球面追踪与隐式表面求交", "r-appearance": "反射模型、视角相关外观与光照", "r-reps": "三维表示总览：点、网格、体素、隐式场、高斯", "i-lightfield": "全光函数、光场与 Lumigraph", "i-blending": "视角相关纹理映射与混合权重（ULR）", "i-warping": "基于深度的渲染：前向/后向 warping、空洞与飞点", "i-layered": "分层表示：MPI、LDI 与分层深度图（LDM）", "i-psv": "平面扫描体与学习式视图合成", "l-cnn": "卷积网络、残差块与 U-Net", "l-attention": "注意力机制与 Transformer", "l-encoding": "位置编码、傅里叶特征与射线编码", "l-loss": "损失函数与训练实践", "l-iterative": "学习式迭代细化与展开优化", "l-diffusion": "扩散模型入门", "n-nerf": "神经辐射场（NeRF）", "n-3dgs": "3D Gaussian Splatting（3D 高斯溅射）", "n-generalizable": "可泛化 / 前馈式新视角合成", "n-dynamic": "动态场景与 4D 表示", "v-temporal": "时间一致性、闪烁与时域滤波", "v-metrics": "图像与视频质量指标", "v-codec": "视频编码、传输与延迟预算", "v-perception": "立体视觉感知与 3D 显示"}, "adv": {"a-learned-stereo": "从深度立体匹配到立体基础模型", "a-learned-mvs": "学习式多视角立体与代价体", "a-geo-fm": "前馈三维几何基础模型", "a-nerf-fast": "NeRF 的加速与抗锯齿", "a-3dgs-ext": "3D Gaussian Splatting 的扩展", "a-layered-nvs": "学习式分层表示：从 Stereo Magnification 到 Quark", "a-generalizable-ibr": "可泛化 NeRF 与学习式 IBR", "a-ff-3dgs": "前馈 3DGS 与大重建模型", "a-geometry-free": "无几何 Transformer 渲染器", "a-dynamic-4d": "动态 NeRF、4D 高斯与流式重建", "a-human-capture": "人体表演捕捉与数字人", "a-diffusion-3d": "扩散模型与三维/新视角生成先验", "a-temporal-video": "视频时间一致性方法", "a-telepresence-sys": "三维临场系统设计", "a-compression": "体积视频与神经表示的压缩传输", "a-diff-render": "可微渲染与逆渲染"}}, "site": {"brand": "3D 临场研究图谱", "current": "ideas", "pages": [{"key": "home", "file": "index.html", "label": "概览", "group": null}, {"key": "roadmap", "file": "roadmap.html", "label": "学习路线", "group": "入门学习"}, {"key": "foundations", "file": "foundations.html", "label": "基础知识", "group": "入门学习"}, {"key": "guided", "file": "guided.html", "label": "精读导读", "group": "入门学习"}, {"key": "advanced", "file": "advanced.html", "label": "进阶专题", "group": "入门学习"}, {"key": "classics", "file": "classics.html", "label": "经典论文", "group": "入门学习"}, {"key": "glossary", "file": "glossary.html", "label": "术语表", "group": "入门学习"}, {"key": "anchors", "file": "anchors.html", "label": "锚点论文", "group": "领域调研"}, {"key": "landscape", "file": "landscape.html", "label": "领域全景", "group": "领域调研"}, {"key": "areas", "file": "areas.html", "label": "分方向与论文库", "group": "领域调研"}, {"key": "ideas", "file": "ideas.html", "label": "研究机会", "group": "研究"}, {"key": "method", "href": "index.html#method", "label": "方法与说明", "group": "研究", "alias": true}], "sectionPage": {"top": "index.html", "summary": "index.html", "sitemap": "index.html", "method": "index.html", "roadmap": "roadmap.html", "roadmap-resources": "roadmap.html", "foundations": "foundations.html", "guided": "guided.html", "advanced": "advanced.html", "classics": "classics.html", "reading": "classics.html", "glossary": "glossary.html", "anchors": "anchors.html", "map": "landscape.html", "paradigms": "landscape.html", "trends": "landscape.html", "areas": "areas.html", "papers": "areas.html", "ideas": "ideas.html"}, "prefixPage": [["concept-", "foundations.html"], ["module-", "foundations.html"], ["walk-", "guided.html"], ["guide-", "guided.html"], ["adv-", "advanced.html"], ["classic-", "classics.html"], ["stage-", "roadmap.html"], ["area-", "areas.html"], ["idea-", "ideas.html"], ["anchor-", "anchors.html"]]}, "ideas": [{"id": "C13", "name": "Latency-compensated forecasting of live 3D video (geometry-grounded 3D motion forecasting, audio-conditioned mouth)", "decision": "pursue_with_repositioning", "scores": {"novelty": 6, "significance": 6.5, "feasibility": 5.5, "telepresence_fit": 9, "overall": 6}, "sharpened": {"title_zh": "渲染“当下”：面向实时自由视点远程临场的延迟感知评估与无悔、音频引导预测", "title_en": "Rendering the Present: Latency-Aware Evaluation and No-Regret, Audio-Led Forecasting for Live Free-Viewpoint Telepresence", "one_liner": "评估在线 3D 视频时，应以帧被显示那一刻远端场景的真实样子为准，而不是以采集时刻为准。用一个 feed-forward 因果预测器缩小其中一部分差距：它把真实采集的 RGB-D pixel-Gaussians 在时间上向前推移，保证不会比过时帧更差，并利用已经到达的语音音频驱动嘴部。", "core_claim": "该论断在公开多视角人体视频（DyNeRF、DNA-Rendering、MVHumanNet++）的留出机位相机上成立。在端到端延迟 Δ = 100-167 ms 下，一个带无悔对冲（no-regret hedge）的 feed-forward、几何约束的预测器必须满足三个条件。(a) 它能恢复过时渲染与 oracle 未来渲染之间动态区域感知差距的至少 40%，指标为 t+Δ 时刻的运动掩码 LPIPS 与 2D 手部/身体关键点误差。(b) 在任何测试序列上，它比过时重投影差的幅度都不超过 0.5% LPIPS。(c) 在单块消费级 GPU 上每帧额外开销不超过 10 ms。第二个论断关于音频：当音频立即播放（不为唇形同步而延迟）时，音频引导的嘴部预测应使显示时刻的唇形同步误差（LSE-D）相比过时嘴部降低至少 50%。在 HMD 实验中，参与者对视听不同步的评分应不差于为唇形同步而延迟音频的情形。若在 Δ = 100 ms 时差距恢复或无悔上界任一不成立，或音频引导的嘴部在 LSE-D 和不同步评分上未能优于过时嘴部，则该论断被证伪。", "key_insight": "1. 时间对齐的评估。Glass-to-glass 延迟使每一种在线 NVS 方法都在渲染过去，而标定好的采集装置为“当下”提供了精确且免费的监督：在 t+Δ 时刻对留出相机打分。一旦用各方法的实测延迟设定其 Δ，延迟-质量权衡就成为一等分析对象，“慢但准”与“快”的方法之间的排名可能翻转。这在 NVS 与远程临场文献中是新的。\n\n2. 无悔预测。基于图像的远程临场必须看起来真实，因此预测器应当移动已观测的像素，而非生成像素。它利用 TSDF 约束的 3D 场景流和三角化得到的 3D 关键点轨迹，对基础管线的逐视角 pixel-Gaussians 做平流（advect），而采集装置的差分掩码意味着静态像素完全无需预测。一个学习得到的对冲机制在预测不确定时回退到过时重投影。因此目标不是“预测未来”，而是“永远不比显示过去更差，并在运动可预测之处更好”。\n\n3. 音频先到。3D 视频管线引入了音频所没有的采集、深度、融合与编码延迟，所以在渲染第 t 帧时，接收端已经拥有直到约 t+Δ_a 时刻的音频。于是显示时刻的嘴部以已到达的音频为条件，这是适定的音频到运动合成，而非猜测。接收端可以不再为唇形同步而延迟音频，从而从对话路径上去掉一段延迟。", "method": "基础：Ha et al. 的管线或等价的重新实现。它对逐视角 pixel-Gaussians 做前向 splat，运行颜色门控的时间深度滤波，执行图像空间 TSDF ray-marching，并应用 4 层 U-Net 融合器。\n\n1. 状态（k = 4 帧历史）。逐视角滤波深度与 TSDF 渲染深度、差分掩码、RGB，以及 t-1 与 t 之间的快速光流（1/4 分辨率的 NeuFlow/RAFT-small）。光流与深度被提升为逐像素 3D 场景流。2D 身体、手部与面部关键点来自流式 RTMPose 级检测器，并利用已知标定三角化为 3D 关键点轨迹。\n\n2. 预测器，仅作用于动态掩码内的像素：\n   - (a) 一个作用于 3D 关键点轨迹的小型因果 transformer，预测 Δ ∈ {33..233} ms 时的关键点位置。它输出 Laplace 不确定性，并通过 FiLM 以 Δ 为条件。\n   - (b) 关键点运动通过学习的软蒙皮权重传递到 Gaussians，即由网络细化的最近关键点权重，不使用参数化人体模型。\n   - (c) 一个 1/4 分辨率的逐视角 ConvGRU 预测残差 3D 位移和逐像素对数方差，用于覆盖衣物、头发和手持物体。\n\n3. 音频分支。一个因果蒸馏的 HuBERT/wav2vec 编码器读取直到 t+Δ_a 的音频，其中 Δ_a 是运行时实测的音频领先量。它与由面部关键点选出的嘴部区域 Gaussians 做 cross-attention，预测唇部和下颌的 3D 位移以及一个小的口腔内部外观残差，经由融合器的背景/残差头输出。嘴部是唯一合成外观的地方。\n\n4. 渲染。平流后的 Gaussians 被 splat 到为 t+Δ 预测的观看者位姿，使用标准 Kalman 头部预测器。TSDF 在平流后的深度上做 ray-march。\n\n5. 无悔对冲。融合 U-Net 接收额外通道：过时重投影（在新位姿下渲染的过时内容，即 ATW 基线）、不确定性图和 Δ。它输出逐像素门控 α。最终图像是预测渲染与过时重投影的 α 加权组合。\n\n损失：\n- 在 t+Δ 时刻留出相机上的 L1 + SSIM + LPIPS，在运动区域加权。\n- 相对未来 TSDF 深度的深度 L1。\n- 3D 关键点上的 Laplace NLL。\n- 无悔 hinge：max(0, LPIPS_patch(out) - LPIPS_patch(stale) + m)。\n- 时间 warping 损失。\n- 嘴部使用 SyncNet 特征唇形同步损失加 L1。\n\n训练。在 DyNeRF/N3DV、DNA-Rendering 和 MVHumanNet++ 上对 Δ 做课程学习，测试对象与测试相机均留出。音频分支在 Multiface 语音序列（多视角、30 fps、带音频）上预训练，并在小规模自采数据上微调。\n\n在 RTX 4090、640x352、K = 4 下的运行时预算：关键点 3 ms，光流 3 ms，预测器加蒙皮 3 ms，音频 2 ms，相对基础管线合计 ≤ 10 ms。\n\n自适应预测时域由对冲机制自然得出：有效领先时间就是 α 降到 0.5 以下的位置。", "why_not_engineering": "这里有三项科学贡献，而不是一次提速。\n\n1. 一个新的评估原则。自由视点视频质量应在显示时刻测量。论文实证表明这会改变结论：一旦计入实测延迟，在线 NVS 方法的排名会变化，帧率与质量之间的最优点也会移动。\n\n2. 对照片级自由视点视频中人体运动可预测性的刻画。包括延迟-质量曲线、过时渲染与 oracle 之间的提升空间随 Δ 和身体部位的变化，以及 3D 约束相比 2D 在何处有帮助。同时给出一个带显式无悔保证的预测器，其训练目标使“永不比过时更差”变得可测量、可检验。\n\n3. 关于 3D 远程临场延迟结构的新观察：音频领先于体积视频。它把唇形同步从“延迟音频”变为“让视频追上来”，论文在 HMD 实验中对此做了感知验证。\n\n每一项都可以独立证伪，没有一项是基础管线的实现细节。", "differentiation": "GaussianPrediction (SIGGRAPH 2024, https://arxiv.org/abs/2405.19745)、ODE-GS (ICLR 2026, https://arxiv.org/abs/2506.05480)、MoGaF (https://arxiv.org/abs/2602.21668) 和 ParticleGS (https://arxiv.org/abs/2505.20270) 都是在逐场景优化后离线外推 Gaussian 动态，且没有延迟视角。本文并不声称 3D 预测优于 2D，这一点只作为支撑证据，且在可行时把这些方法作为逐场景因果窗口基线运行。本文新增的是一个带无悔对冲的 feed-forward、跨对象、实时预测器，外加时间对齐评估协议。\n\nVEST (ECCV 2024, https://arxiv.org/abs/2407.21450) 已经表明 3D 提升的预测有帮助，但针对的是离线单目驾驶场景。引用它正是为了说明 3D 对比 2D 的论断在此不算贡献。\n\nGFFE (https://arxiv.org/abs/2406.18551) 及其后续工作针对带 G-buffer 的合成游戏引擎渲染内容做隐藏延迟的帧外推。本文面向采集的多视角人体、新视点和音频。将一个 GFFE 风格的 2D 外推器作用于渲染输出作为基线。\n\n预测显示（predictive display）工作 (https://arxiv.org/abs/2605.09670, https://arxiv.org/abs/2409.09921, https://doi.org/10.1007/s11263-025-02550-z) 在 2D 中预测，或只补偿自身运动。面向延迟的流式 3DGS (https://arxiv.org/abs/2604.02851) 补偿的是视点延迟，而不是内容的运动。NoPo4D (https://arxiv.org/abs/2605.22190) 仅在观测时间窗内用速度做插值。\n\n音频驱动的远程临场人脸 (https://arxiv.org/abs/2510.01176) 和 DyStream (https://arxiv.org/abs/2512.24408) 合成虚拟形象，并把音频前瞻视为延迟代价。本文保留真实采集像素，并利用本已存在的音频前瞻。\n\n虚拟形象位姿预测 (https://doi.org/10.1007/978-3-032-03805-0_3) 和 Mon3tr (https://arxiv.org/abs/2601.07518) 作用于参数化虚拟形象，而非基于图像的真实 3D 视频。"}, "experiments": {"datasets": ["DyNeRF / Neural 3D Video（公开，约 18-21 台相机，30 fps）。烹饪和手部运动场景是基础论文自己的基准，可直接对比。", "DNA-Rendering（申请后公开，相机众多）。人体运动与手持物体多样；帧率较低（需核实），对于以整帧倍数取 Δ 来说可以接受。", "MVHumanNet++（申请后公开，大规模多视角人体）。用于跨对象训练和留出对象测试。", "ENeRF-Outdoor（公开）。在户外多人场景上做鲁棒性检验。", "CMU Panoptic Studio。social 和 haggling 序列提供对话中的身体运动；需核实哪些序列有可用音频和 HD 同步。", "Multiface（公开，https://github.com/facebookresearch/multiface）：带音频的多视角人脸（约 40-160 个视角，30 fps）。用于预训练和评估音频引导的嘴部分支；对齐音频时须处理缺失帧。", "NeRSemble（https://arxiv.org/abs/2305.03027：16 台相机，73 fps，含语音）。高帧率允许为面部取细粒度 Δ；是否发布音频尚未确认，依赖前须核实。", "自采数据（需要）：一个小型装置，8-12 台同步 RGB 相机加 2-4 台 RGB-D 相机，配一支 genlock 同步麦克风。10-20 名参与者进行上半身对话、做手势和递交物体。联合身体+音频评估与 HMD 用户实验需要该数据。"], "baselines": ["过时渲染：基础管线在 t+Δ 时刻显示第 t 帧（现状）。", "过时重投影：利用 TSDF 深度，将过时内容在 t+Δ 时刻的观看者位姿下重新渲染（ATW/late-latching 的类比）。", "在渲染输出上做 2D 外推：恒速光流 warp，外加在相同数据上重新训练的 GFFE 风格学习型 2D 外推器。", "在渲染输出上运行蒸馏的因果 2D 视频预测器，即 2605.09670 中的模型族，作为生成式预测显示的代表。", "pixel-Gaussians 的恒速 3D 平流（NoPo4D 速度的类比，无学习）。", "逐场景 Gaussian 预测器 GaussianPrediction 与 ODE-GS，在因果窗口上拟合，用以展示精度/运行时/泛化的权衡。", "骨架预测加 LBS warp，无残差（虚拟形象位姿预测的类比）。", "Oracle：在真实未来输入上运行基础管线（上界）。", "音频：过时嘴部；延迟音频的唇形同步（现状）；逐视角独立应用的现成 2D 唇形同步编辑器（检验多视角一致性）。"], "metrics": ["在 t+Δ 时刻留出相机上的时间对齐 PSNR、SSIM 与 LPIPS，全帧和运动掩码两种，绘制为 Δ ∈ {33..233} ms 上的延迟-质量曲线。", "恢复的提升空间 = (Q_forecast - Q_stale) / (Q_oracle - Q_stale)，按 Δ 和按身体部位统计。", "t+Δ 时刻的 2D 手部/身体关键点误差，由检测器分别在渲染结果和真值上运行得到。", "最坏情况遗憾：在序列和 patch 上取 (LPIPS_out - LPIPS_stale) 的最大值。另有虚假运动率：预测出手势起始而真值中没有的帧所占比例。", "时间一致性（TCC/STED 或 warping 误差）与闪烁。", "唇形同步：显示时刻的 LSE-D 和 LSE-C；嘴部 landmark 误差。", "预测结果的跨视角一致性（如 MEt3R 或极线一致性）。", "在指定 GPU 上的额外运行时间（ms）与显存；装置系统的实测 glass-to-glass 延迟。", "用户实验（HMD，模拟延迟 0/100/200/300 ms）：拍手与递物同步误差、话轮转换间隙与重叠、视听不同步评分、感知滞后（通过阶梯法测 JND）、伪影与自然度评分、共在感问卷。", "对现有在线 NVS 方法（基础论文、GPS-Gaussian、ENeRF 类方法）做延迟感知排名，各自计入其实测延迟。"], "key_ablations": ["3D（TSDF 提升）与 2D 预测的对比，在新视点上评估。", "关键点蒙皮先验、仅稠密光流的预测器、二者兼用的对比。", "无悔 hinge 与门控开/关：对平均质量和最坏情况遗憾的影响。", "Δ 条件化与每个 Δ 单独建模的对比；固定与自适应预测时域的对比。", "音频引导嘴部、仅视频的嘴部预测、过时嘴部的对比，扫描音频领先量 Δ_a ∈ {0, 50, 100, 150} ms。", "历史长度 k 与预测器分辨率。", "利用装置差分掩码跳过静态像素：运行时间与质量。", "训练数据：仅 DyNeRF 与加入 DNA-Rendering 和 MVHumanNet++ 的对比，在留出对象上测试。"], "needs_custom_capture": true, "capture_notes": "核心预测论断（C1、无悔论断和时间对齐协议）完全可以在公开数据上检验：DyNeRF、DNA-Rendering、MVHumanNet++ 和 Panoptic。音频分支可以在 Multiface（多视角带音频，已在 GitHub 页面确认）上做面部层面的预训练和评估。NeRSemble 是否提供音频须核实。\n\n自采数据用于三件事：全身/上半身加音频的联合对话数据、在可运行管线中测量真实的音频与 3D 视频延迟不对称，以及 HMD 用户实验。小型装置即可：8-12 台 genlock 同步的工业相机加 2-4 台 RGB-D 相机（如 Azure Kinect 或 Orbbec）和一支同步麦克风，约 15-30k USD。需要 2-4 周采集 10-20 名知情同意的参与者，采集和实验都需要 IRB 批准。（经同意后）将采集数据作为延迟感知远程临场基准发布，以增强论文。"}, "first_two_week_test": "在 DyNeRF（cook_spinach 和 flame_steak 场景，或其他含手部运动的场景）以及 3-5 个含快速手臂和手部运动的 DNA-Rendering 序列上，做一个无需训练的提升空间与可行性探测。若有代码则使用基础管线；否则使用前向点 splat 加 TSDF 的重新实现，或用 GPS-Gaussian 作为替代渲染器。\n\n对 Δ ∈ {33, 67, 100, 167, 233} ms，在留出相机上渲染：\n- (1) 过时：第 t 帧；\n- (2) 过时重投影；\n- (3) 对过时渲染做 2D 恒速光流 warp；\n- (4) 逐视角深度点的 3D 恒速平流，使用 t-1 与 t 的深度加提升到 3D 的 RAFT 光流，再重新 splat；\n- (5) oracle：t+Δ 时刻的真实输入。\n\n相对 t+Δ 的真值计算运动掩码 LPIPS 与 RTMPose 手部/手腕关键点误差。报告提升空间（oracle 对比过时）以及 (3) 和 (4) 恢复的比例。\n\n并行地，用 2-3 天测量延迟不对称。对一个简单的 采集→深度→融合→编码→网络→渲染 回路逐阶段计时，并与 20 ms 的 Opus 式音频路径对比，得到现实的 Δ_a。在 20 个 Multiface 语音片段上，在 100 ms 领先量下，计算过时嘴部与逐视角应用、由显示时刻音频驱动的现成 2D 唇形同步编辑器的 LSE-D。\n\n继续推进的信号：\n- Δ = 100 ms 时提升空间清晰可见，运动掩码 LPIPS 差距 ≥ 0.03，且在 640 px 宽度下手腕误差 ≥ 8 px；\n- 3D 恒速平流在无学习情况下恢复其中 ≥ 25%；\n- 在留出视角上 3D 平流优于 2D warping；\n- 实测 Δ_a ≥ 50 ms。", "kill_criteria": "出现以下任一情况即放弃或转向。\n\n1. 在公开人体数据的动态区域上，Δ = 100 ms 时的提升空间可忽略：在 640 px 下运动掩码 LPIPS 差距低于约 0.02 且关键点误差低于约 5 px。此时延迟对指标不可见，论文将完全依赖用户实验；转向纯 IEEE VR/CHI 感知研究。\n\n2. 学习约 6 周后，预测器在留出对象上于 Δ = 100 ms 时恢复的提升空间不足 35%。\n\n3. 预测器无法满足无悔上界，即在超过 10% 的序列上比过时重投影差，除非在所有地方退化为过时帧（α ≈ 0）。\n\n4. 在留出视角上 3D 预测相比 2D 光流外推没有优势。这会去掉几何约束这条主线；协议仍可作为基准或 workshop 论文挽救。\n\n5. 在现实管线中实测的音频领先量 Δ_a 低于约 40 ms，或音频引导嘴部相比过时嘴部未能将 LSE-D 降低至少 30%。此时舍弃音频分支，保留身体预测器。\n\n6. 一次预实验感知测试（N ≈ 8，注入 150 ms 延迟）显示参与者更偏好过时但真实的画面而非预测画面，或在同步任务中无法分辨差异。", "reviewer_objections": [{"objection": "这就是把 GaussianPrediction、ODE-GS 或 VEST（在 Gaussians 或点上做 3D 预测，再重新渲染）拼接到一个 IBR 管线上。“3D 优于 2D”这一洞见是已知的。", "rebuttal": "论文明确承认这一点，并不把 3D 优于 2D 作为贡献。新的部分有四个：\n- 一个因果、feed-forward、跨对象、运行时间 ≤ 10 ms 的预测器，而逐场景离线方法每个场景需要数分钟到数小时，且这些方法以因果窗口的形式作为基线纳入；\n- 一个会改变方法排名的时间对齐、计入延迟的评估协议；\n- 一个最坏情况遗憾经过测量的无悔对冲；\n- 音频领先的观察和嘴部预测。\n先前工作中没有任何一项出现这些内容。"}, {"objection": "超过约 100 ms 的人体运动基本不可预测，所以预测器要么幻觉出手势，损害真实性；要么退化为过时帧，毫无收益。", "rebuttal": "论文正是用按身体部位拆分的延迟-质量曲线来量化这一点。对冲机制使系统退化到现状而不是低于现状，并报告最坏情况遗憾与虚假运动率。即便只是部分补偿，比如 50-80 ms 的手臂和手部运动或基于音频的嘴部，在感知上也有意义。HMD 实验测量净感知收益是否为正。只预测运动，像素保持真实。"}, {"objection": "t+Δ 时刻的 PSNR 或 LPIPS 会奖励模糊，而且由于大部分像素是静态的，过时帧是非常强的基线。收益要么很小，要么是指标伪影。", "rebuttal": "主要指标是运动掩码的感知误差、t+Δ 时刻的关键点误差，以及恢复的过时到 oracle 提升空间比例，而不是全帧 PSNR。锐度与时间指标会惩罚模糊，用户实验直接测量交互时序。始终报告 oracle 上界，因此差距大小是透明的。"}, {"objection": "“音频先于视频到达”是你们系统的伪影。RTC 协议栈会在 jitter buffer 中同步两路流，而超低延迟 3D 管线会消除这种不对称。", "rebuttal": "这种不对称是结构性的：体积视频需要采集、深度估计、融合、编码和视角相关渲染，而音频不需要。论文在可运行管线中逐阶段测量它，并以 Δ_a 的函数形式报告结果，包括 0。如今接收端通过延迟音频来保持唇形同步，从而为这种不对称付出代价。本文的贡献把这一权衡反转过来，用户实验对比了延迟音频与“音频立即播放加预测嘴部”。"}, {"objection": "在远程临场中显示合成的、预测的帧存在伦理问题（伪造表情），而且在 30 fps 离线数据集上的评估与真实部署的通话相去甚远。", "rebuttal": "只有口腔内部的外观是合成的。其余全部是真实采集像素，移动幅度至多 Δ ≤ 233 ms，并且门控在不确定时回退到真实内容。系统可以暴露置信度或来源标记，与可信度和内容溯源方向相衔接。论文包括一个带模拟网络延迟和实测 glass-to-glass 延迟的实时装置演示，而不仅是离线数据集。"}], "synergies": "延迟感知基准（统一远程临场基准方面的领域空白）：时间对齐的 t+Δ 协议和采集的视听装置数据成为一个更大远程临场基准（保真度、时间与立体一致性、延迟）中的一个赛道。\n\n面向远端内容的基于 TSDF 的 late reprojection / ASW：同一预测器在 Δ 小于一个采集间隔时，可把 30 fps 采集内容上采样到 72-90 Hz 的 HMD 刷新率，并共享过时重投影基线。可以合写一篇论文或形成系列。\n\n丢包与丢帧隐藏，以及带宽感知的接收端合成：在接收端做预测可以掩盖丢失或迟到的帧。\n\n流式几何基础模型（StreamVGGT 等）：可以更低成本地提供场景流与深度历史。\n\n计算拆分与云渲染：预测使 150-300 ms 往返时间的云渲染变得可用。\n\n合成内容的溯源与可信标注：预测置信度图可兼作溯源信号。\n\n音频驱动的 codec avatars：音频领先原则可迁移到 Mon3tr 这类 IBR-虚拟形象混合系统。", "effort": {"months": "8-10：2 个月用于探测与协议，3-4 个月用于预测器，2 个月用于音频分支与采集，2 个月用于用户实验与写作", "people": "2 人（一名博士生负责预测器与协议；一名负责装置、音频分支与用户实验），外加一位有 HCI/感知经验的导师负责实验设计", "compute": "2-4 块 GPU（A100 或 RTX 4090 级）。预测器很小；大部分算力用于在各数据集上运行基础管线和 oracle 渲染。一套由 8-12 台 RGB 加 2-4 台 RGB-D 相机和一支麦克风组成的小型装置（约 15-30k USD），或借用采集实验室；实验需要一台 HMD（Quest 3 或 Vision Pro 级）。"}, "venue": "SIGGRAPH Asia 2027 (ACM TOG)，方法加用户实验；备选为 ISMAR 2027 或 IEEE VR 2028 (TVCG)。如果提升空间探测结果强但用户实验延期，可以将协议加预测器投 CVPR 2027 或 3DV，用户实验留给 TVCG 扩展版。", "novelty": {"verdict": "partially_scooped", "remaining_novel_angle": "在任何社区中，我都没有找到用因果预测来隐藏实时采集的多视角 RGB-D 人体 3D 视频 glass-to-glass 延迟的工作。可辩护的组合包括五部分：\n\n1. 任务与协议：在留出机位相机上，以显示时刻 t+Δ 的真值评估自由视点远程临场，并报告延迟-质量曲线，表明时间对齐评估会改变方法排名。\n2. 一个 feed-forward 实时预测器。它沿 TSDF 提升的场景流平流逐视角 pixel-Gaussians，并保留观测到的外观。它以未来的留出相机帧作为免费监督进行训练，不同于 GaussianPrediction、ODE-GS、MoGaF 和 ParticleGS 中离线的逐场景优化。\n3. 在不确定性下在预测帧与过时帧之间做对冲，并分析最优预测时域。\n4. 利用音频包先于体积视频到达这一事实，使真实采集 3D 视频的嘴部区域以已到达的音频为条件。现有音频驱动工作要么合成虚拟形象，要么把音频前瞻视为延迟代价。\n5. 关于交互时序的 HMD 用户实验。\n\n“在 Gaussians 上做 3D 预测再重新 splat 比 2D 更能处理视差和遮挡”这一论断并不新颖。GaussianPrediction、ODE-GS 和 VEST 已经确立了这一点，GFFE 式帧外推也已将生成未来帧定位为隐藏延迟。因此论文应把 3D 对比 2D 的收益作为支撑证据，而不是贡献。", "threats": [{"title": "GaussianPrediction: Dynamic 3D Gaussian Prediction for Motion Extrapolation and Free View Synthesis", "url": "https://arxiv.org/abs/2405.19745", "year": "2024", "venue": "SIGGRAPH 2024", "overlap": "high", "what_overlaps": "这是该方向的核心技术洞见。它预测 3D Gaussians 的未来运动（关键点 GCN 加形变）并重新渲染，从任意视点渲染照片级的未来帧。它明确地打通了视频预测与新视角合成。", "what_remains_different": "它逐场景优化、离线运行。它不使用实时 RGB-D 或 TSDF 管线，不把任何东西定位为延迟补偿，没有回退到过时帧的不确定性机制，没有音频，没有为 feed-forward 模型提供留出相机未来监督，也没有用户实验。"}, {"title": "ODE-GS: Latent ODEs for Dynamic Scene Extrapolation with 3D Gaussian Splatting", "url": "https://arxiv.org/abs/2506.05480", "year": "2025", "venue": "ICLR 2026", "overlap": "high", "what_overlaps": "它将 Gaussian 轨迹外推到未来（transformer 加 latent neural ODE），并在任意未来时间戳渲染。这是相同的“在 Gaussians 上做 3D 预测再渲染”的思路。", "what_remains_different": "它是逐场景、离线的，在 D-NeRF、NVFi 和 HyperNeRF 上评估。没有实时流式处理，没有远程临场延迟预算，没有过时与预测之间的对冲，也没有音频。"}, {"title": "Space-Time Forecasting of Dynamic Scenes with Motion-aware Gaussian Grouping (MoGaF)", "url": "https://arxiv.org/abs/2602.21668", "year": "2026", "venue": "arXiv", "overlap": "medium", "what_overlaps": "它在 4DGS 基础上加入轻量预测模块来预测未来 Gaussian 运动，渲染出支持新视角的未来帧。", "what_remains_different": "它针对已重建场景的长期离线外推。它不是在线或 feed-forward 的，不以延迟为出发点，也没有音频。"}, {"title": "ParticleGS / 4DGS-JEPA / R5DGS (Accelerated Spatio-Temporal Gaussian Rendering via Kinematic and Semantic Priors)", "url": "https://arxiv.org/abs/2505.20270", "year": "2025-2026", "venue": "arXiv / ECCV 2026 workshop", "overlap": "medium", "what_overlaps": "2025-2026 年日益增多的一批工作，研究 Gaussian 动态外推和动态 Gaussians 上的多时域因果预测（4DGS-JEPA arXiv 2609.25036；R5DGS arXiv 2605.25909 明确以“预测性系统”为预测的动机）。", "what_remains_different": "这些工作全是逐场景或物理驱动、聚焦于物体、离线运行的。没有一个处理实时采集的人体、远程临场延迟或音频。"}, {"title": "GFFE: G-buffer Free Frame Extrapolation for Low-latency Real-time Rendering (and follow-up Decoupled Motion Prediction for GFFE, ACM MM 2025; Amulet, arXiv 2608.10423)", "url": "https://arxiv.org/abs/2406.18551", "year": "2024-2026", "venue": "SIGGRAPH Asia 2024 / TOG; ACM MM 2025", "overlap": "medium", "what_overlaps": "图形学社区已把“外推未来帧（包括动态物体运动与去遮挡填充）以隐藏延迟”视为一个成熟问题，并已有对动态片元的实时神经外推。", "what_remains_different": "它作用于合成的游戏引擎渲染内容，而非采集的多视角人体视频。它不使用多视角几何提升、不处理采集场景的新视点，也没有音频。"}]}}, {"id": "C02", "name": "Psychophysically calibrated perceptual metric for temporal / cross-view / binocular consistency of synthesized 3D video", "decision": "pursue_with_repositioning", "scores": {"novelty": 6, "significance": 6, "feasibility": 6, "telepresence_fit": 8, "overall": 6}, "sharpened": {"title_zh": "双眼之间的闪烁：在线 3D 视频中时间性、视角耦合与双目不一致的阈值心理物理学及三通道可见度模型", "title_en": "Shimmer Between the Eyes: Threshold Psychophysics and a Three-Channel Visibility Model for Temporal, View-Coupled and Binocular Inconsistency in Online 3D Video", "one_liner": "对在线基于图像的 3D 视频中参数化、由管线注入的不一致性进行 HMD 阈值心理物理实验，表明随时间变化的双眼间不一致是主导且未被度量的失效模式。结果被提炼为一个经过标定的可微指标，将误差分解为时间、视角路径和双目三个通道，并在真实远程呈现方法上优于逐眼 VDP。", "core_claim": "主张 A（心理物理）：在立体 HMD 中，在两眼间去相关且随时间变化的结构化合成不一致（例如以 2-10 Hz 独立施加于每只眼的 blend 权重或幻觉噪声），其被检测到的幅度比以下两种情况至少低 2 倍：(i) 相同的双眼间差异保持静态；(ii) 相同的时间扰动同样施加于双眼。因此逐眼（单目）指标会系统性地低估其可见度。主张 B（指标）：一个具有显式运动补偿时间通道、视角路径（K-set 切换）通道和视差补偿双目通道的模型，仅在阈值数据上标定，在留一方法（leave-one-method-out）下预测 8 个以上真实在线 NVS 方法的 JOD 评分。在立体 HMD 条件下，其 SROCC 至少比现有最佳指标（逐眼 ColorVideoVDP / FovVideoVDP）高 0.10，且去掉双目通道会消除大部分增益。若阈值比低于 1.5 倍，或留一方法增益低于 0.05，则两项主张均被证伪。", "key_insight": "在线基于图像的 3D 视频的伪影不是一般的视频失真。它们由少数几个管线内部变量产生（逐像素深度、blend 权重、K-set 成员、去遮挡掩码），并且在立体 HMD 中每只眼的视图是由这些变量独立合成的。这使三件事成为可能。第一，伪影可以通过管线自身的内部变量被参数化地、精确地注入，因此每个刺激都存在干净的参考，即使沿着没有采集真值的任意头部路径。第二，可见度可以用已知的构件建模：运动补偿后的时间残差用 TCSF/elaTCSF，双目通道用融合极限以及已知的对双眼间时间调制的敏感度（双目光泽或闪烁）。二分视（dichoptic）注视点渲染的数据表明静态双眼间差异可以被很好地容忍。第三，逐眼指标在构造上就对双目交互视而不见。而这种交互恰恰是远程呈现渲染器和逐眼生成式修复器在独立计算两个视图时所制造的。", "method": "(1) 刺激引擎。重新实现一个基础论文风格的管线（像素大小的不透明 Gaussian 前向 splat、带前一帧深度反馈的 image-based TSDF、小型 blend U-Net）；基础论文没有公开代码。同时使用现成的 ENeRF 和 GPS-Gaussian(+)。添加扰动钩子：(a) 可控幅度（以 mm 和视差 arcmin 计）和时间频谱（1-15 Hz）的深度噪声，作用于掩码区域（面部、手部、躯干、背景）；(b) 可控 blend 不连续的强制 K-set 切换事件；(c) 去遮挡掩码边界抖动；(d) blend 权重或深度噪声的逐眼去相关（相关系数 rho 从 1 到 0），静态或时间调制；(e) 背景图像闪烁。干净参考是沿相同脚本化头部路径的未扰动渲染（从 3D 通话中的真人记录的 6DoF 轨迹，按 3 个头部速度等级采样）。刺激离线预渲染为立体 90 Hz 视频，因此管线无需以 HMD 帧率运行。(2) 心理物理。Quest 3（主要）加第二台 HMD（Varjo、Vision Pro 或 Quest Pro）用于迁移测试。用光度计做亮度标定，在可用时记录眼动。实验 1 测量阈值：2AFC 配 QUEST+ 阶梯法，因素为生成器 x 区域（面部/手部/身体/背景）x 离心率（0/10/20 度）x 头部速度（静止/慢/快）x 眼部条件（双眼相同 / 双眼间静态 / 双眼间时间调制 / 仅单眼）。通过预实验裁剪因子设计，目标约 16-20 名参与者 x 1.5 h。实验 2 测量阈上标度：对真实方法输出加注入伪影混合进行成对比较，用 pwcmp/ASAP 主动采样标定到 JOD，约 20-24 名参与者。在子集上加入显示器（2D、单目）条件，以展示结论在 2D 与 HMD 观看之间如何变化。(3) 模型（JNI：just-noticeable inconsistency，恰可察觉不一致）。输入：测试立体视频、参考立体视频、参考深度/视差和头部路径；简化参考变体只使用渲染的深度和光流。E_temp：用参考场景流和头部运动将第 t-1 帧 warp 到第 t 帧后的残差，经频带分解并通过带离心率和亮度项的 elaTCSF 式时间 CSF 汇聚，按注视/离心率加权。E_view：与 K-set 变化事件和头部角速度时间锁定的残差能量，即视角耦合的跳变（popping）。E_bino：用参考视差将左图 warp 到右图，双眼间残差分解为静态部分和时间调制部分，带融合极限 / Panum 区门控，并对双眼间时间调制使用单独的敏感度。E_static：在独眼（cyclopean）平均图上的 ColorVideoVDP。面部和手部的区域权重通过拟合而非手工设定。每个通道先标定到实验 1 的阈值，然后用嵌套交叉验证将少于 10 个参数的汇聚拟合到实验 2 的 JOD。全部在 PyTorch 中实现且可微，1080p 立体在单 GPU 上每帧不到 1 s。(4) 应用。(i) 在 HMD 头部路径下以 JOD 为单位重新评判基础论文的零结果消融（TSDF 引导、时间滤波、K）。(ii) 在 DNA-Rendering 短片段上用 L = L_rgb + lambda * JNI_temp+bino 微调 blend 网络，在相同 PSNR 下与 warping 误差损失和 TCC 式损失对比。(iii) 测试一种低成本的立体一致渲染变体，即通过视差重投影在双眼间共享一个 blend 权重场，以及逐眼生成式修复器的情形。所有结论都通过第二次独立用户研究确认，绝不只依赖该指标本身。", "why_not_engineering": "主要成果是新的感知知识。它包括结构化合成不一致的阈值函数，以及一个具体、可证伪的交互：随时间变化的双眼间不一致远比其静态或单目对应物更可见。当前没有任何 NVS 指标或数据集包含这一点。该指标由心理物理推导而来，具有可解释的通道，而不是作为黑盒回归器调参得到。其价值通过改变结论来体现：它可以推翻或确认被 PSNR/TCC 判为零结果的已发表消融，并可以论证或驳斥逐眼与立体一致的渲染设计。这正是 SIGGRAPH/TOG 感知方向和 IEEE VR 审稿中被视为研究的那类贡献。", "differentiation": "Liang et al.（CGF 2024，Mantiuk 组）和 arXiv 2501.08072 是针对离线 NVS 的 2D 显示器 MOS/JOD 研究。它们没有阈值、没有立体、没有受控生成器，也没有模型。我们增加了 HMD 立体、头部路径观看、参数化生成器和经过标定的模型，并将它们的协议和指标基准作为基线。LIVE-Meta avatar VQA（TIP 2024）是针对网格 avatar 压缩的 HMD MOS，而非合成不一致，且没有双目因素。我们将其引用为最接近的远程呈现质量评估，并在可能时与 HoloQA 式学习型 VQA 比较。SCOPE/iSQoE（2412.21127）是针对静态图像的学习型立体 QoE，没有时间维度。我们增加了时间和视角路径，并且我们的双目通道是可解释的、经过阈值标定的。Dichoptic Foveation（SIGGRAPH 2026）是关于静态双眼间频率差异的 HMD JOD 心理物理。我们明确以其为基础：它关于静态双眼间差异可被容忍的发现，正是我们检验时间调制假设时的零假设。我们不主张是首个双目 HMD 研究。DIBR 闪烁指标（JVCIR 2018、TIP 2019）和 IV-PSNR-YUVM（2025）是针对 MVD 编解码器、与 MOS 相关的工程指标，没有 HMD、没有心理物理标定、没有双目-时间项。它们被纳入基线。ColorVideoVDP / elaTCSF 是我们扩展的单目构件，逐眼 ColorVideoVDP 是需要超越的主要基线。MEt3R 和 VoluMe 的抖动指标是未经标定的一致性代理，作为基线纳入。"}, "experiments": {"datasets": ["DNA-Rendering（60 视角人体采集，签署许可协议后公开）：主要的远程呈现内容，包含面部和手部。以稀疏的 4-8 相机子集作为方法输入；稠密视角为真实方法验证提供离线伪参考。", "ActorsHQ（160 相机 12MP 人体采集，许可后公开）：稠密阵列伪 GT，来自在全部相机上逐序列离线拟合的 4DGS/3DGS，用于沿头部路径渲染参考立体；稀疏子集作为方法输入。", "MVHumanNet++（大规模多视角人体视频）：为损失微调实验提供额外身份和动作。", "Neural 3D Video / DyNeRF（18-21 台相机，厨房场景）：与基础论文保持连续性并重新评判其消融。", "ENeRF-Outdoor：一个非人体、深度范围更大的条件，用于测试离心率和视差范围效应。", "在 Quest 3 上模拟 3D 通话时，从约 10 人记录的 6DoF 头部轨迹（内部采集；采集很容易，并随数据集发布）。", "可选的小规模自定义采集：6-8 台同步相机加一对安装在滑轨上、间距约 63 mm 的立体相机，为 10-20 段简短的远程呈现片段提供真实立体真值。"], "baselines": ["PSNR / SSIM / LPIPS（逐眼）", "TCC（按基础论文的改编版本）、STED、SDT、SDV", "光流 warping 误差（Lai et al. 2018）以及 tLP / tOF", "逐眼以及在独眼平均图上应用的 FovVideoVDP 和 ColorVideoVDP", "应用于帧差残差的基于 elaTCSF 的闪烁预测器", "IV-PSNR 以及具备时间感知的 IV-PSNR-YUVM", "MEt3R（应用于左右图对和连续帧）", "VMAF", "逐立体帧的 iSQoE（SCOPE），在时间上取平均", "在我们的 JOD 数据上训练的学习型 VQA（例如微调的 FAST-VQA/DOVER 式模型），作为上界黑盒对照", "产生刺激的渲染方法：基础论文风格的重新实现（+/- TSDF 引导，+/- 时间滤波，K=2/4/8）、ENeRF、GPS-Gaussian(+)、一个逐帧 feed-forward Gaussian 方法、一个逐帧 3DGS/4DGS 流式方法，以及一个应用于基础输出的逐眼单步生成式修复器（Difix 式）"], "metrics": ["心理测量阈值（2AFC 75% 点）及 bootstrap 95% 置信区间；双眼间时间调制 vs 双眼间静态 vs 双眼相同条件的阈值比（关键证伪量）", "由成对比较得到的 JOD 标度值及置信区间", "指标性能：在留一方法和留一伪影划分下的 SROCC、PLCC 和以 JOD 计的 RMSE；以对数单位计的阈值预测误差", "跨头显迁移：在 Quest 3 上拟合的指标在第二台 HMD 上测试", "通道消融：去掉 E_bino / E_view / E_temp，测量每个条件下 SROCC 的变化", "应用：JNI 损失微调在相同 PSNR 下的 JOD 增益；立体一致 vs 独立逐眼渲染的 JOD 与计算量对比；基础论文消融的 JOD 差异"], "key_ablations": ["无双目通道的模型（仅逐眼汇聚）：检验主张 B 的机制", "双目通道去掉时间调制项（仅静态双眼间差异，即 Dichoptic-Foveation 式）：分离出新的部分", "E_temp 不做运动补偿（原始帧差，类似 TCC）：说明为何现有时间指标混淆了真实运动与闪烁", "去掉视角路径/K-set 事件锁定", "均匀 vs 拟合的区域权重（面部/手部 vs 身体/背景）", "阈值标定的通道 vs 端到端拟合到 JOD 的通道（过拟合与可解释性检查）", "显示器 vs HMD：方法排名是否改变？", "全参考 vs 简化参考（仅深度/光流）变体"], "needs_custom_capture": true, "capture_notes": "核心心理物理实验不需要自定义采集。刺激注入在公开数据（DNA-Rendering、ActorsHQ）的干净渲染之上，因此每个刺激都有精确参考，包括沿任意头部路径的立体。真实方法验证可以使用稠密阵列伪真值，但来自离线 4DGS 拟合的伪 GT 自带伪影，审稿人会对此提出质疑。因此建议但不强制进行小规模自定义采集：6-8 台同步全局快门相机加一对安装在滑轨上或固定位姿的真实 63 mm 立体对，采集 10-20 段 10-30 s 的说话和手势片段。这能提供瞳距基线下的真实立体参考。头部轨迹必须在 Quest 3 上内部记录（成本低）。人体受试者研究需要 IRB/伦理审批（第 1 周启动）以及 HMD 光度标定（借用光度计或分光辐射计）。"}, "first_two_week_test": "主张 A 的预实验加基线盲区检查。不需要重新实现基础管线。第 1-4 天：取 3 段 DNA-Rendering（或 ActorsHQ）序列，用任意可用渲染器沿 2 条记录的头部路径渲染干净的立体 90 Hz 片段，例如用已发布代码的 GPS-Gaussian，或在单帧上拟合 3DGS 并用简单的刚性头部路径运动驱动。利用渲染深度，直接在图像/深度空间注入 3 种扰动：(a) 双眼相同的 5 Hz 时间深度 warp 噪声；(b) 静态的双眼间 warp 差异；(c) 以 5 Hz 调制的双眼间 warp 差异。每种使用 5-6 个幅度，并区分面部与躯干掩码。第 5-10 天：在 Quest 3 中对 5-6 名实验室参与者进行 2AFC 恒定刺激法测试（在现有豁免协议下进行，或在 IRB 待批时仅由作者参与），每人约 45 min，拟合心理测量函数。第 8-12 天，并行进行：在同样的刺激上计算逐眼 ColorVideoVDP、TCC、warping 误差和 MEt3R，检查它们在相同幅度下能否预测三种条件的检测概率。通过标准：(c) 的阈值比 (a) 和 (b) 都至少低 2 倍（汇总观察者后 bootstrap 置信区间不重叠），并且逐眼 ColorVideoVDP 对 (b) 和 (c) 给出几乎相同的预测可见度或排序错误。任一结果都支持双目-时间的叙事，并表明基线对此是盲目的。", "kill_criteria": "若出现以下任一情况，则放弃或降级项目。(1) 在预实验中，双眼间时间调制的阈值与双眼间静态和双眼相同条件相差在 1.5 倍以内。那么双目通道只是逐眼闪烁，关键新颖性消失；最多退回为一篇显示器加 HMD 的数据集论文。(2) 逐眼 ColorVideoVDP 加一个简单的左右差异项，在真实方法 JOD 数据上的留一方法 SROCC 与完整模型相差在 0.05 以内（约在第 4 个月用前 10-12 名参与者检查）。(3) 真实在线方法的伪影全部远高于阈值，使排序变得平凡且 PSNR 已能排序；或者全部低于阈值，使什么都不可见。无论哪种，该指标在远程呈现中都没有判别作用。(4) 在第 4 个月之前出现 Mantiuk 组或 Meta 的论文，提供针对 NVS 伪影的 HMD 立体-时间 JOD 数据。在这种情况下，将范围缩小到视角路径/K-set 通道和应用结果。", "reviewer_objections": [{"objection": "这不过是 ColorVideoVDP 加几个额外通道，而双目方面刚被 Dichoptic Foveation（SIGGRAPH 2026）和 SCOPE/iSQoE 做过。新在哪里？", "rebuttal": "Dichoptic Foveation 测量静态双眼间频率差异，SCOPE 测量静态立体图像。两者都没有测量随时间变化、由合成变量（blend 权重、逐眼幻觉、去遮挡）构造的双眼间差异。我们的主打结果正是这些工作看不到的交互：时间调制将双眼间阈值降低了一个我们会报告的倍数。我们把它们的静态数据用作零条件。指标增益在留一方法下相对于逐眼 ColorVideoVDP 定量展示，通道消融将增益归因于新的双目-时间项。"}, {"objection": "注入的伪影是合成的，可能无法反映真实渲染器的失败，因此在其上得到的阈值不能迁移。", "rebuttal": "注入是通过管线自身的内部变量（深度、权重、K-set、掩码）进行的，而不是通过图像空间噪声。幅度和时间频谱与从真实方法输出测得的统计量相匹配，即 ENeRF、GPS-Gaussian 和基础管线的深度噪声 PSD 和切换率。模型只在阈值上标定，然后零样本测试于 8 个以上真实方法（包括一个逐眼生成式修复器）的 JOD 评分，采用留一方法。因此迁移是一个被明确检验的主张，而非假设。"}, {"objection": "样本量小、只有一台头显，所以结果无法推广；CV 会议上的感知研究看起来统计功效不足。", "rebuttal": "阈值使用约 16-20 名观察者，JOD 使用约 20-24 名，这是 SIGGRAPH/TOG 感知论文的典型规模，配有 bootstrap 置信区间，并由预实验计算功效。有两台 HMD 并进行跨头显迁移测试，另有显示器条件。所有刺激、原始响应、头部路径和代码都会发布，他人可以扩展数据集。主要投稿目标是对感知研究友好的图形学或 VR 会议，而不是 CVPR。"}, {"objection": "沿头部路径的真实方法验证没有真值立体，而稠密阵列的伪 GT 会让指标偏向与伪 GT 渲染器相似的方法。", "rebuttal": "阈值实验不需要 GT，因为干净渲染就是精确参考。对于真实方法，我们 (a) 只在接近真实相机的视角使用稠密阵列伪 GT，并报告与真实留出相机的一致性作为健全性检查；(b) 提供由渲染深度和光流驱动的简化参考变体；(c) 加入带真实 IPD 立体对的小规模自定义采集。我们还报告方法排名在伪 GT 与真 GT 子集之间是否不同。"}, {"objection": "把该指标用作损失是循环论证（Goodhart），而且应用增益会很有限。", "rebuttal": "每一项应用主张都由第二次独立用户研究评判，使用新的观察者和成对 JOD，绝不用 JNI 本身评判，并在相同 PSNR 下与 warping 误差和 TCC 损失对比。立体一致渲染应用还给出成本上的论据（双眼共用一个权重场），因此即使感知上没有差异，也是有用的结果。"}], "synergies": "(1) 立体一致与多观看者渲染：双目通道直接论证并度量在双眼和多个观看者之间共享 blend 权重或 TSDF 状态。这既消除了双眼竞争，又削减了基础管线每个观看者 2 倍的开销。这是一篇自然的配套方法论文。(2) 用学习型时间记忆取代 TSDF/颜色掩码启发式（ConvGRU/TTT 状态、Stereo Any Video 前端）：JNI 同时作为训练损失和评估，最终可以表明几何引导在感知上是否重要。(3) RGB-D 或 Gaussian 流的码率-失真-闪烁编码（Starline 式 HEVC 深度、DSGS、Tele360 传输格式）：JNI 为码率分配提供感知闪烁项。(4) 在线生成式修复器（Difix/DiffusionHarmonizer/Restereo/SyncFix 式）：逐眼独立修复恰恰产生本工作表明高度可见的随时间变化的双眼间不一致，因此本文为同步立体修复器提供动机并对其进行评估。(5) 长时程、头部跟踪的远程呈现基准：发布的头部路径、刺激和 JOD 数据成为其感知赛道。(6) 注视点相关或 foveated 计算分配：随离心率变化的阈值决定哪里需要时间滤波和 blend 网络容量。自然的系列是：本感知/指标论文，然后是用它训练的立体一致时间渲染器，然后是感知码率控制。", "effort": {"months": "7-9（2 周预实验；第 1-2 个月做刺激引擎、基础论文风格重新实现和 IRB；第 3-4 个月做阈值研究；第 5-6 个月做 JOD 研究和模型拟合；第 7-8 个月做应用和确认性研究；写作）", "people": "2 人：一名博士生负责渲染/刺激引擎和损失实验，一名负责心理物理和建模。强烈建议有一位具有视觉科学或心理物理经验的合作者，例如用于 Panum/TCSF 建模以及增强研究设计的可信度。", "compute": "2-4 块消费级或工作站 GPU（RTX 4090/A6000 级），用于离线 4DGS 伪 GT 拟合、立体刺激渲染和 blend 网络微调；总计低于约 1,500 GPU 小时。硬件：Quest 3 以及可使用的第二台 HMD（Varjo、Vision Pro 或 Quest Pro）、一台光度计，以及可选的 6-8 相机阵列加立体对（约 $5-15k）用于自定义采集。约 40-50 名参与者的报酬。"}, "venue": "SIGGRAPH Asia 2027（ACM TOG，截稿约 2027 年 5 月），与时间线最契合。备选：IEEE VR 2028 期刊轨道（TVCG），或面向重心理物理版本的 ACM TAP / SAP。只有当损失和应用结果很强且数据集规模大时才考虑 CVPR/ICCV；否则视觉方向的审稿人会认为统计功效不足。", "novelty": {"verdict": "partially_scooped", "remaining_novel_angle": "每个要素都有先前工作：NVS 视频感知质量评估（Liang et al. CGF 2024、2501.08072）、HMD avatar VQA（LIVE-Meta TIP 2024）、基于 VR 2AFC 的学习型立体 QoE（SCOPE/iSQoE）、HMD 中双眼间差异的 JOD 心理物理（Dichoptic Foveation，SIGGRAPH 2026）、DIBR 时间闪烁指标（2018-2021）以及运动感知的 IV-PSNR（2025）。诸如“首个针对合成视图时间一致性的感知指标”或“首个针对 3D 人体视频的 HMD 感知研究”这类笼统主张不可辩护。检索没有找到做到以下几点的工作，这是可辩护的核心。(1) 对基于图像/在线 NVS 不一致性的受控参数化生成器进行阈值（JND）心理物理：时间深度噪声的幅度和频谱、沿头部路径的 K-set blend 权重切换（跳变）、去遮挡边界抖动，以及双眼间 blend 权重或幻觉去相关。在立体 HMD 中以区域（面部、手部、身体）、离心率和头部速度为函数进行测量。(2) 一个将误差显式分解为经 TCSF 汇聚的运动补偿时间通道、观看者路径/视角切换通道以及由融合极限阈值化的视差补偿双目通道的指标，每个通道都标定到这些阈值，并在留一方法下与 TCC、STED、ColorVideoVDP、MEt3R 和时间 IV-PSNR 比较评估。(3) 用该指标重新评判一个具体的零结果消融（基础论文的 TSDF 引导，PSNR 31.16 vs 31.17），并作为实时管线中的可微损失或计算分配信号。审稿人会期望相关工作引用 Liang et al. 2024、LIVE-Meta avatar VQA、SCOPE/iSQoE、Dichoptic Foveation 和 DIBR 闪烁文献。双目通道必须定位为将二分视/立体 QoE 心理物理扩展到随时间变化的结构化合成不一致，而不是首个双目研究。", "threats": [{"title": "Perceptual Quality Assessment of NeRF and Neural View Synthesis Methods for Front-Facing Views (Liang, Wu, Hanji, Banterle, Gao, Mantiuk; CGF 2024)", "url": "https://onlinelibrary.wiley.com/doi/10.1111/cgf.15036", "year": "2024", "venue": "Computer Graphics Forum (Eurographics 2024)", "overlap": "medium", "what_overlaps": "首个使用参考视频序列对 NVS 方法进行受控感知质量评估的工作，明确旨在揭示图像指标遗漏的时间伪影。它将许多图像和视频指标与人类评分进行基准对比。这已经提出了“NVS 指标在时间上是盲的；应以视频感知来验证”的论点（Mantiuk 组）。", "what_remains_different": "2D 显示器，仅有 MOS/JOD 标度，没有阈值心理物理。它使用离线逐场景 NeRF，而非在线 IBR。没有双目或 HMD 条件，没有受控伪影生成器（深度抖动、K-set 跳变、双眼间权重不匹配），也没有新的指标或损失。"}, {"title": "Subjective and Objective Quality Assessment of Rendered Human Avatar Videos in Virtual Reality (LIVE-Meta Rendered Human Avatar VQA; Chen, Saha, Chapiro, Häne, Bazin, ..., Bovik)", "url": "https://arxiv.org/abs/2408.07041", "year": "2024", "venue": "IEEE TIP vol. 33, 2024", "overlap": "medium", "what_overlaps": "在 6DoF VR 头显中评分的人体（远程呈现式“全息”）avatar 视频。它发布了一个数据集和一个新的 VQA 模型（HoloQA），并与 Meta 相关。它覆盖了“在 HMD 中观看的 3D 人体视频的感知指标”。", "what_remains_different": "失真是网格 avatar 上的编码/压缩参数，而非合成不一致（时间深度抖动、blend 跳变、去遮挡闪烁）。它使用 MOS 而非 JND 阈值，没有双目不一致因素，也没有将误差分解为时间、视角路径和双目通道。"}, {"title": "Dichoptic Foveation (Kam, Groth, Kang, Saraf, Sun, Chen; SIGGRAPH 2026)", "url": "https://arxiv.org/abs/2609.16385", "year": "2026", "venue": "SIGGRAPH 2026 Conference Papers", "overlap": "medium", "what_overlaps": "针对跨视网膜离心率的双眼间差异（一只眼模糊、另一只眼锐化）的 HMD 心理物理。它标定到 JOD 并拟合一个紧凑的 4D 模型，然后应用于 VR 渲染系统。它表明“拟合到 JOD 的、依赖离心率的心理物理双目通道模型”这一方法是当前的，并且已针对双眼间频率差异做过。", "what_remains_different": "其双眼间差异是为注视点渲染而刻意施加的静态频率操控，而不是随时间变化的、结构化的视图合成不一致（每只眼不同的 blend 权重或幻觉、去遮挡不匹配）。它没有时间或视角切换通道，也不评估 NVS 质量。"}, {"title": "What Makes for a Good Stereoscopic Image? (SCOPE dataset + iSQoE; Tamir et al., Isola, Dekel, Zhang, Farber)", "url": "https://arxiv.org/abs/2412.21127", "year": "2024", "venue": "arXiv 2024 (Dec)", "overlap": "medium", "what_overlaps": "在 VR 头显中对带有多种常见立体伪影的真实和合成立体图像收集 2AFC 偏好标注。它训练了一个学习型立体 QoE 模型（iSQoE），并报告跨头显一致性。它覆盖了“从 HMD 数据学习的双目感知指标”。", "what_remains_different": "仅限静态图像，没有时间或视角路径成分。它不针对 IBR/NVS 特有的不一致生成器，不拟合阈值，也不做心理物理分解。它是学习型黑盒，而不是可解释的 JND 标定模型。"}, {"title": "No-reference quality assessment of DIBR-synthesized videos by measuring temporal flickering (Zhou et al., JVCIR 2018), and related DIBR flicker metrics (TIP 2019, IEEE 2021 reference-free spatio-temporal metric; SIAT/IRCCyN databases)", "url": "https://www.sciencedirect.com/science/article/abs/pii/S1047320318301184", "year": "2018-2021", "venue": "J. Visual Communication and Image Representation 2018 / IEEE TIP 2019", "overlap": "medium", "what_overlaps": "一条长期的前神经网络时代工作线：专门针对基于深度图像渲染（DIBR）合成视频中时间闪烁的指标（闪烁区域检测、时空不一致），在主观数据库上验证（SIAT：140 段合成视频）。带双眼竞争的立体 3D VQA 在 2020 年前也已被充分研究。这削弱了任何“针对合成视图的时间闪烁指标是新的”的主张。", "what_remains_different": "面向 2D 或被动立体显示器上的传统 MVD/DIBR 编解码器，仅 MOS。没有 HMD 头部路径观看，没有神经 blend 权重/K-set 跳变，没有心理物理（TCSF/Panum）标定，也没有可微损失。"}]}}, {"id": "C03", "name": "Deadline-aware benchmark for online 3D video synthesis with moving + binocular ground truth and long takes", "decision": "pursue_with_repositioning", "scores": {"novelty": 5.5, "significance": 6.5, "feasibility": 5.5, "telepresence_fit": 9, "overall": 6}, "sharpened": {"title_zh": "观看者真正看到的：在线多视角 RGB-D 远程呈现合成的流式、阵列外与双目评估", "title_en": "What the Viewer Actually Sees: Streaming, Off-Rig and Binocular Evaluation of Online Multi-View RGB-D Telepresence Synthesis", "one_liner": "一个围绕单一发现构建的两层基准。第 1 层重新划分公开的稠密穹顶 RGB-D 采集数据，按测试视角位于输入阵列之外的距离对其分组。第 2 层是一个小规模自定义采集，其 genlock 见证相机沿回放的 HMD 轨迹运动，其中包括一对 63 mm 立体相机。方法采用一种面向视图合成的流式精度规则打分，该规则分别惩罚场景过时和位姿过时，并对后期重投影给予加分。论文随后表明，来自阵列内插值基准的排名并不能迁移到远程呈现观看者实际看到的效果。", "core_claim": "取至少 8 个在线或可泛化的 NVS 方法，按常用的留出阵列相机 LPIPS/PSNR 排名。该排名与以下任一维度上的排名仅弱相关（Kendall tau 至多 0.5）：(a) 阵列包络之外的视角，(b) 由回放头部轨迹得到的移动观看者视角，(c) 双目视差一致性，(d) 在 33 或 66 ms 截止时间下的流式得分。流式得分还比 PSNR 加一个单独的运行时间列更能预测成对 HMD 偏好（在至少 20 名参与者的 2AFC 研究中一致性更高）。若 tau 在全部四个维度上都超过 0.8，或流式得分在偏好一致性上不优于 PSNR+运行时间，则该主张被证伪。", "key_insight": "远程呈现中真正重要的误差发生在阵列之外、观看者移动时、两眼之间，以及错过截止时间之后。这四者都可以对照真实像素测量。其中一些不需要新硬件：已包含 RGB-D 传感器的稠密穹顶可以被重新划分。其余的则需要一个安装在机械臂或云台上的 genlock 立体见证相机。对视图合成而言，错过截止时间有着检测指标所没有的结构。场景是过时的，但观看者的位姿可以通过基于深度的后期重投影来刷新。将两者分开打分，会奖励几何能够支持 timewarp 的方法，而“最新输出 vs 当前 GT”的检测规则无法表达这一点。", "method": "协议（主要贡献；可在任何数据上运行）。(1) 按包络分层的划分：每个测试相机获得到输入相机凸包的有符号距离以及到最近输入相机的角度，分数按区间报告（插值、0-30 cm 近外推、超过 30 cm 的远外推）。(2) 流式 NVS 得分。每个方法在参考 GPU 级别（例如 RTX 4090）上、在固定 I/O 的计时框架中运行。在显示时刻 t、观看者位姿 P_t 时，显示图像由最新完成的输出构建，该输出使用场景时刻 s < t 和渲染位姿 P_r。模式 A 是按交付时的过时图像。模式 B 是该输出用方法自身的深度重投影到 P_t（若方法暴露深度；由框架提供标准前向 warp 加补洞）。得分是相对 GT(t, P_t) 的误差，在时间上平均，截止时间 B = 33、66 和 100 ms。它还被分解为场景过时项（对照 GT(s, P_t) 打分）和位姿过时项（用见证相机对照 GT(s, P_r) vs GT(s, P_t) 打分）。Li et al. 的流式精度被列为其母规则。(3) 双目赛道：逐眼 LPIPS；视差一致性误差（在渲染图像对上用 RAFT-Stereo 或 FoundationStereo 估计视差，与同一估计器在 GT 图像对上的结果比较）；左右光度 warp 误差；MEt3R。(4) 时间与感知：沿移动观看者路径的光流 warp 误差和 ColorVideoVDP/FovVideoVDP JOD。(5) 长时程：在 5-10 分钟的片段上逐分钟 LPIPS 的漂移斜率。第 1 层数据（公开）：CMU Panoptic/Kinoptic（10 台 Kinect v2 RGB-D 加 31 台 HD 和 480 台 VGA 相机；以 RGB-D 作为输入，大量留出的 HD/VGA 视角位于输入包络内外）；DNA-Rendering 和 ActorsHQ 作为稠密纯 RGB 穹顶，使用立体估计深度；保留 DyNeRF、ENeRF-Outdoor 和 D3DMV 以与基础论文保持连续。HMD 轨迹（约 50 条记录的 Quest 头部路径，将发布）被映射到穹顶坐标。每帧在角度容差内最近的留出相机处打分，从而得到带真实 GT 的“离散移动观看者”。第 2 层数据（自定义，小规模）：8-12 台 genlock 全局快门 RGB 相机加 4 台 RGB-D 传感器，按桌面或隔间式远程呈现布局，以及一个 genlock 的 63 mm 立体见证相机，安装在低成本协作机械臂（例如 xArm 或 UR3 级别）或双轴电动云台-滑轨上，回放记录的头部路径，包括偏离包络 20-60 cm。见证相机位姿先来自机械臂运动学，再由静态阵列进行 Movi-Cam 式标记跟踪，然后用背景 SfM 精化，并做亚像素重投影检查。机械臂在输入视角中被掩码（它也是一个真实的遮挡物）。约有 20 段 2-5 分钟的片段：对话、递物、眼镜、手机屏幕、头发、快速手势，另加 3 段带硬件触发失同步的片段。基线：基于传感器深度的点 splat；Starline 式 TSDF 加投影纹理；基础论文的重新实现（splat + 门控时间 TSDF + U-Net blend，标注为重新实现）；ENeRF；IBRNet；在有代码时使用 GPS-Gaussian(+) 和 EVA-Gaussian；DepthSplat 或 MVSplat 作为 feed-forward 基线；3DGStream 作为逐帧优化；4DGS 作为离线上界。运行时间预算：这是评估而非在线方法，但框架增加的开销低于 1 ms，重投影算子在 1080p 下运行时间低于 3 ms，以使模式 B 具有现实性。", "why_not_engineering": "成果是一个经过测量的科学主张，而不是一次数据集发布：现有 NVS 基准在远程呈现用例上系统性地对方法排错名次。论文指出是哪个维度导致排名翻转（外推、双目或截止时间）以及原因（例如，blend 权重网络过拟合于阵列的插值几何，而没有深度的方法无法使用后期重投影）。它还引入了对流式精度的一个有原则的视图合成扩展，其位姿/场景过时分解在检测中没有对应物，并以人类偏好验证了这一扩展。如果排名翻转成立，它将改变整个在线 NVS 子领域报告结果的方式。采集阵列是证伪该主张的手段，而不是贡献本身。", "differentiation": "Towards Streaming Perception（ECCV 2020）及其 3D 检测和事件相机后续工作定义了“以当前 GT 对最新输出打分”。我们承认这一规则并将其扩展到 NVS，在 NVS 中位姿过时可以通过重投影补偿，因此必须单独打分。MV2（ECCV 2026）有移动相机 GT，但针对室外驾驶、SfM 位姿、离线方法，没有双目对、没有 RGB-D 阵列，也没有延迟。Replay（ICCV 2023，arXiv 2307.12067）有静态单反加表演人体头戴的 GoPro，但其 NVS 基准在静态单反处评估（移动相机是输入）；它没有深度、没有立体对、采用基于音频的同步，也没有延迟。DyCheck 使用单目输入和静态测试相机。M3ISR（2026）有一个合成流式赛道，其中延迟与质量并列报告但未耦合，且没有见证 GT。StereoGenBench 和 Syn4D 提供合成的双目或移动 GT，但没有真实传感器噪声，也没有远程呈现阵列。ViVo、PackUV-2B 和 ImViD 只在固定相机处提供真实 RGB-D 或长时多视角片段。RIFTCast 和 Bringing Telepresence to Every Desk 在静态相机处评估。可辩护的新部分是：围绕固定 RGB-D 远程呈现阵列的真实阵列外移动加双目 GT；带重投影加分的 NVS 特有过时分解；以及带偏好验证的排名翻转研究。长时片段、失同步划分和移动相机配准作为支撑特性被认可，而非主张。"}, "experiments": {"datasets": ["CMU Panoptic / Kinoptic（10 台 Kinect v2 RGB-D + 31 台 HD + 480 台 VGA 相机）：主要的公开第 1 层数据集，因为它是唯一带有真实传感器深度的公开稠密穹顶；重新划分为输入和按包络分层的留出视角", "DNA-Rendering 和 ActorsHQ：稠密纯 RGB 人体穹顶；以立体或单目基础模型深度作为深度来源；用于按包络分层和伪移动观看者赛道", "DyNeRF / Neural 3D Video、ENeRF-Outdoor、D3DMV：与基础论文保持连续；仅用于插值赛道", "自定义第 2 层采集：约 20 段 2-5 分钟的片段，一个桌面或隔间式 RGB-D 阵列加一个 genlock 的 63 mm 立体见证相机，安装在协作机械臂或云台上，回放约 50 条记录的 Quest 头部路径（对于连续移动观看者时间指标、真实 IPD 双目 GT 以及远程呈现内容的长时片段是必需的）"], "baselines": ["基于传感器深度的点 splat（无学习）", "Starline 式 TSDF 融合 + 投影纹理", "基础论文（Ha et al. 2025），重新实现并明确标注，因为未发布代码", "ENeRF", "IBRNet", "GPS-Gaussian / GPS-Gaussian+", "EVA-Gaussian（若代码可用）", "DepthSplat 或 MVSplat（feed-forward 3DGS）", "3DGStream（逐帧流式优化）", "4DGS 作为离线上界（流式得分展示其截止时间惩罚）"], "metrics": ["按包络距离区间的掩码 PSNR / SSIM / LPIPS", "B = 33/66/100 ms 下的流式 NVS 得分，模式 A（过时）和模式 B（后期深度重投影），分解为场景过时项和位姿过时项", "双目：相对 GT 立体对的视差一致性误差、左右 warp 误差、MEt3R", "沿移动路径的时间指标：光流 warp 误差、ColorVideoVDP / FovVideoVDP JOD", "长时程漂移斜率（每分钟 LPIPS）以及失同步事件后的恢复时间", "插值赛道排名与其他各赛道排名之间的 Kendall tau / Spearman rho（主打结果）", "2AFC HMD 用户偏好与各标量得分的一致性"], "key_ablations": ["排名相关性 vs 包络距离：找出翻转从何处开始（偏离包络 0、10、30、60 cm）", "有无重投影加分的流式得分（模式 A vs B）：暴露几何的 IBR 能否超过 PSNR 更高的隐式方法？", "深度来源替换（Kinect/ToF vs RAFT-Stereo vs FoundationStereo vs 单目基础模型）及其对排名的影响", "离散伪移动观看者（第 1 层，吸附到穹顶相机）vs 连续见证相机（第 2 层）：廉价的公开协议能否预测昂贵的协议？若能，它将成为社区默认", "合成干扰项：在 Syn4D 式合成场景中渲染相同轨迹，检验合成排名是否与真实第 2 层排名一致（论证真实采集的必要性）", "截止时间扫描和参考 GPU 替换（4090 vs 笔记本级 GPU）：硬件变化下排名的稳定性"], "needs_custom_capture": true, "capture_notes": "主张的大部分（包络外翻转、流式得分、离散移动观看者、深度来源效应）可以在公开数据上检验，主要是 CMU Panoptic/Kinoptic，它将真实 RGB-D 输入与数百台留出相机配对。只有三件事需要自定义采集：连续移动观看者时间指标、真实 63 mm 双目 GT，以及带受控失同步的远程呈现内容长时片段。最小可行阵列为 8-12 台 genlock 全局快门相机、4 台 RGB-D 传感器（Femto/ZED 级）、一个 genlock 立体见证相机（两台全局快门相机装在 63 mm 横杆上），以及一台低成本协作机械臂或电动滑轨加云台，总计约 USD 15-40k。见证相机位姿先用机械臂运动学，再由静态阵列做标记跟踪（Movi-Cam 式），然后做背景 SfM 精化，并进行亚像素重投影检查。在输入视角中掩码机械臂。获取 IRB 知情同意，只发布同意的参与者。若实验室无法搭建阵列，则将第 1 层协议加流式得分作为较小的 3DV/WACV/TVCG 论文发表，并与采集实验室合作完成第 2 层。"}, "first_two_week_test": "仅使用 CMU Panoptic/Kinoptic；无需采集。第 1-3 天：选择 3-4 段有人说话或做手势的序列。使用 10 路 Kinect RGB-D 流（或 8 台 HD 相机加 Kinect 深度）作为输入阵列。将其余所有 HD 和 VGA 相机按到输入包络的有符号距离分为插值、近外推和远外推。第 4-9 天：运行 6 个有代码或易于搭建的方法：传感器深度点 splat、TSDF 加投影纹理、ENeRF、IBRNet、GPS-Gaussian，以及 DepthSplat 或 MVSplat。在同一 GPU、相同 I/O 下测量每个方法的端到端延迟。第 10-12 天：计算每个区间的 LPIPS/PSNR。计算 33 和 66 ms 下的模拟流式得分：选取按时交付的帧的输出，分别在模式 A（过时）和模式 B（用方法的深度重投影到当前留出相机，在之后的帧打分，见证位姿设为吸附后的头部路径）下计算。在最近的 VGA 相机对上计算伪双目一致性。第 13-14 天：计算插值排名与其他每个排名之间的 Kendall tau，并在序列上做 bootstrap 置信区间。验证标准：至少一个维度上 tau 至多为 0.5，且置信区间不包含 0.8，并至少有一个可由机制解释的定性翻转（例如，某隐式方法赢得插值区间，却在远外推或流式模式 B 上输给基于 TSDF 的 IBR）。", "kill_criteria": "若出现以下任一情况，则放弃或降级为简短的 workshop 或 TVCG 协议短文。(1) 在第 1 层公开数据上，使用 6 个或更多方法，插值排名与外推、流式和双目排名之间的 Kendall tau 全部保持在 0.8 以上，且置信区间不包含 0.6：那么就没有主打结果，该基准只是又一个数据集。(2) 流式模式 B（重投影加分）相对模式 A 没有改变任何排名，这使得对 Li et al. 的 NVS 特定扩展变得空洞。(3) 在预实验 HMD 2AFC 研究（8-10 人，4 个方法）中，流式得分与偏好的一致性不优于 PSNR 加运行时间截断。(4) 在投入第 2 层之前，Syn4D 式合成回放精确复现了第 1 层排名（tau 高于 0.9）。那么真实采集增益甚微，只在公开和合成数据上发表协议即可。(5) 在第一周采集中见证相机位姿精度无法达到平均重投影误差低于 1 px，这将使移动观看者 GT 失效。", "reviewer_objections": [{"objection": "截止时间打分规则不过是把 Streaming Perception（Li et al., ECCV 2020）用在图像上；没有新思想。", "rebuttal": "我们明确将其列为母规则。对 NVS 而言新的是：显示的输出有两个过时来源，场景时刻和观看者位姿，而位姿过时可以通过后期深度重投影部分消除，这在 HMD 中是标准做法。我们对模式 A 和模式 B 打分并分解误差。我们表明这会改变排名（拥有可用深度的方法获益），并且比 PSNR 加运行时间与 HMD 偏好的相关性更好。这些都无法在检测框架中表达。"}, {"objection": "这是一个小实验室做的数据集论文。与 PackUV-2B、MVHumanNet 或 DNA-Rendering 相比，20 段片段和一个见证机械臂规模太小。", "rebuttal": "规模不是主张。贡献是协议加排名翻转发现，其中大部分通过按包络分层的重新划分在现有大型公开数据集（Panoptic、DNA-Rendering、ActorsHQ）上运行。自定义层只提供公开数据集都没有的东西：围绕 RGB-D 远程呈现阵列的连续移动加真实 IPD 双目 GT。我们展示廉价的公开协议能预测昂贵的协议，或展示它在哪里失效，从而让他人无需搭建阵列就能采用。"}, {"objection": "合成数据（Syn4D、StereoGenBench）免费提供移动和双目 GT，且位姿完美。为什么要采集？", "rebuttal": "我们将合成回放作为消融运行。在线 RGB-D 远程呈现方法主要受传感器深度噪声、头发和高光物体上的多径、亚帧失同步以及卷帘曝光影响，而这些都没有被如实模拟。我们报告合成排名是否与真实第 2 层排名一致。如果一致，我们会如实说明并推荐合成数据。真实采集仅由实测的不一致来论证。"}, {"objection": "排名取决于参考 GPU、实现质量和重新实现（基础论文没有代码），所以流式得分衡量的是工程投入，而不是算法。", "rebuttal": "框架固定 I/O 和精度，在两个 GPU 级别和一组截止时间扫描下报告排名，显示排名在何处对硬件稳定。所有插值、外推和双目赛道也会在不含延迟的情况下报告，因此算法效应和系统效应可以分离。重新实现会被标注，其插值数值在使用前与 DyNeRF 上的已发表数值核对。速度在远程呈现中是一等属性，而把它藏在附表里正是我们所反对的现状。"}, {"objection": "移动见证 GT 自身有误差：位姿误差、机械臂在输入视角中的遮挡，以及见证相机与阵列的同步。这些会不会造成虚假的翻转？", "rebuttal": "见证相机与阵列 genlock。位姿经过三重校验（运动学，然后由静态阵列做标记跟踪，然后背景 SfM），我们发布逐帧位姿不确定性。指标被掩码到位姿误差使重投影保持在 1 px 以下的前景区域。机械臂在每个方法的输入中完全相同地存在。我们还报告一个 GT 对 GT 一致性检查的上限（从见证位姿重新渲染的静态场景帧），让读者看到噪声底，低于该噪声底的差异没有意义。"}], "synergies": "它是聚类集中大多数其他方向的评估骨干。(1) 复用基础论文一致 TSDF 深度的后期重投影与 timewarp 方法：流式得分的模式 B 直接奖励它们，因此一篇方法论文加本基准构成一个自然的系列。(2) 立体一致混合和联合双眼生成式修复器（Restereo/SyncFix 式）需要双目赛道来展示收益。(3) 在线失同步和标定漂移鲁棒性：第 2 层的硬件失同步片段提供受控的 GT 扰动。(4) 时间滤波器的长时程漂移与恢复：在多分钟片段上的漂移斜率指标。(5) 感知闪烁指标或 JOD 标定的时间一致性得分：HMD 2AFC 数据同时可作为远程呈现专用质量指标的训练和验证数据。(6) 阵列外外推方法（生成式补全、学习先验）：按包络分层的划分恰好衡量这一点。策略：尽早发布第 1 层协议，让团队自己的方法论文在其上报告结果，在完整基准论文之前积累采用度。", "effort": {"months": "第 1 层公开协议、流式框架和排名翻转研究需 2-3 个月（可单独作为较小的论文发表）；包括第 2 层采集、HMD 用户研究和公开评估服务器在内总计 9-12 个月", "people": "2 人（一人负责协议、框架和基线；一人负责阵列、见证相机标定和采集），外加兼职人员协助用户研究和 IRB", "compute": "4-8 块消费级或数据中心 GPU，用于在长序列上运行约 10 个基线（总计数百 GPU 天，主要是 4DGS/3DGStream 上界）；保留 1 块参考 GPU 用于计时；第 2 层阵列、协作机械臂或云台、立体见证相机和 RGB-D 传感器的硬件约 USD 15-40k，另加一台 Quest 级 HMD 用于轨迹记录和用户研究"}, "venue": "NeurIPS 2027 Datasets & Benchmarks，最自然的归宿，投完整的两层版本。或者，如果排名翻转发现很强且有用户研究支撑，投 CVPR 2027。如果重点是 HMD 偏好验证以及带重投影的流式分析，IEEE VR / TVCG（期刊轨道）很合适。仅含第 1 层的后备版本适合 3DV 2027 或 WACV。", "novelty": {"verdict": "partially_scooped", "remaining_novel_angle": "仍可辩护的是一个面向在线多视角 RGB-D 远程呈现合成的真实采集基准，在非阵列视角处打分。其真值来自回放记录的 HMD 头部轨迹的 genlock 见证相机，包括偏离阵列包络的外推，另加一对真实的 63 mm 双目见证相机。我在视觉、图形学、VR 或多媒体领域都没有找到任何 2023-2026 年的数据集，能为固定标定的人体 RGB-D 采集阵列提供真实采集的移动加双目真值。最接近的是 MV2（驾驶，移动真值，ECCV 2026）、DyCheck（单目输入，静态测试相机）和 StereoGenBench/Syn4D（合成）。\n\n第二个可辩护的部分是一种视图合成特有的流式精度形式。当错过截止时间时，输出在两方面过时：场景时刻是旧的，观看者位姿也是旧的，因为头部已经移动。允许并计分基于深度的后期重投影，因此方法会因支持 timewarp 的几何而获得加分。\n\n经验性的主打结果——阵列内插值基准上的方法排名在移动观看者、双目和截止时间打分下会翻转——尚未经过检验，并将支撑整篇论文。\n\n以下部分不是新的，必须注明出处：\n- 截止时间打分规则本身（Li et al., ECCV 2020 流式精度，及其 3D 检测和事件感知后续工作）；\n- “分钟级多视角片段”（PackUV-2B、ImViD）；\n- “多视角传感器深度人体采集”（ViVo、HUM4D 式 RGB-D）；\n- 失同步扰动划分（Sync-NeRF 失同步 N3DV）；\n- 静态影棚内的移动相机位姿配准（Movi-Cam 式棋盘格跟踪）；\n- 一个 2026 年带延迟赛道的流式 FVV 基准（M3ISR，合成、未耦合）。\n\n存在一个更廉价的干扰项。合成的远程呈现基准（Syn4D 或 StereoGenBench 式）可以免费提供移动和双目真值。因此论文必须论证真实的传感器深度噪声、genlock 或失同步以及非朗伯人体内容会改变排名。", "threats": [{"title": "Towards Streaming Perception (streaming accuracy metric)", "url": "https://arxiv.org/abs/2005.10420", "year": "2020", "venue": "ECCV 2020 (Oral)", "overlap": "high", "what_overlaps": "这篇论文已经有了截止时间感知的打分规则，即该想法的第二个“关键洞察”。在每个时刻，算法已交付的最新输出与该时刻的真值比较打分，使延迟和精度合并为一个数字。它还主张 Pareto 分析，并发现慢而准的方法会输。后续工作将同一规则带入 3D 检测（LASP，https://arxiv.org/abs/2504.19115，2025）和基于事件的感知（STARE，Nature Communications 2026，https://pmc.ncbi.nlm.nih.gov/articles/PMC12993040/）。", "what_remains_different": "它只涵盖检测和分割，从未涉及视图合成。对于新视角视频，错过截止时间会产生两种过时：场景过时，以及因头部移动导致的观看者位姿过时。位姿过时可以通过后期基于深度的重投影部分抵消，因此该指标的 NVS 版本有其自身的实质结构。尽管如此，打分规则必须表述为“面向视图合成的流式精度”，而不是新思想。"}, {"title": "MV2: Multi-View Multi-Vehicle Driving Dataset for Novel View Synthesis", "url": "https://arxiv.org/abs/2608.12442", "year": "2026", "venue": "ECCV 2026", "overlap": "medium", "what_overlaps": "一个真实动态场景 NVS 基准，其真值来自其他移动的同步相机（汽车、滑板车、无人机），专门用于衡量外推而非插值。它已经提出了现有基准只衡量插值这一一般性主张，并用移动见证轨迹回应了这一主张。", "what_remains_different": "它使用室外驾驶场景、SfM 位姿和离线逐场景方法。没有固定标定的 RGB-D 阵列，没有人体远程呈现内容，没有双目对，没有回放的 HMD 轨迹，没有延迟协议，也没有长时片段。"}, {"title": "M3ISR: A Multi-Modal Multi-View Benchmark for 3D/4D Gaussian Splatting and Feedforward Compression", "url": "https://arxiv.org/abs/2608.22465", "year": "2026", "venue": "arXiv (Aug 2026)", "overlap": "medium", "what_overlaps": "一个 2026 年的多视角动态基准，带有深度、掩码和一个专门的流式赛道，为自由视点视频指明端到端延迟、更新开销和带宽。它覆盖了“带延迟的流式 4D FVV 基准”这一定位。", "what_remains_different": "数据是合成的：25 个场景，6 个共享中心的 1080p 视角。质量和速度并列报告，而不是通过截止时间规则耦合。它没有移动或双目见证真值，没有真实传感器深度，没有远程呈现人体，也没有长时片段。"}, {"title": "Monocular Dynamic View Synthesis: A Reality Check (DyCheck iPhone dataset)", "url": "https://arxiv.org/abs/2210.13445", "year": "2022", "venue": "NeurIPS 2022", "overlap": "low", "what_overlaps": "以非阵列插值视角的真值评估动态 NVS 的最著名先例。训练使用移动的手持相机，测试使用独立的宽基线相机。它还批评了虚高分数的基准，在精神上与“排名翻转”假设相似。", "what_remains_different": "输入是单目的，而不是固定多视角 RGB-D 阵列。测试相机是静态的，基准没有双目对、没有延迟、也没有长时片段。"}, {"title": "ImViD / Realizing Immersive Volumetric Video: A Multimodal Framework for 6-DoF VR Engagement", "url": "https://arxiv.org/abs/2604.09473", "year": "2026", "venue": "arXiv 2026 (extension of CVPR 2025 ImViD)", "overlap": "low", "what_overlaps": "一个 5K/60 fps、带深度和音频的多视角动态采集，序列长 1-5 分钟，为 6-DoF VR 观看设计并配有沉浸式用户实验。它使“分钟级、带深度、面向 VR 的多视角采集”不再是新颖性维度。", "what_remains_different": "面向场景的相机阵列采集。评估在阵列视角和用户研究上进行，没有移动或双目见证真值，没有截止时间耦合的打分，也没有在线方法协议。"}]}}, {"id": "C04", "name": "Geometry-gated, geometry-anchored causal one-step diffusion completion (TSDF-anchored noise, provenance / conformal authenticity)", "decision": "pursue_with_repositioning", "scores": {"novelty": 6, "significance": 6, "feasibility": 6, "telepresence_fit": 8, "overall": 6}, "sharpened": {"title_zh": "TRUST-Rig：面向实时多视角 3D 视频的来源认证生成式补全——由采集阵列自身的空闲相机在线标定", "title_en": "TRUST-Rig: Provenance-Certified Generative Completion for Live Multi-View 3D Video, Calibrated Online by the Rig's Own Idle Cameras", "one_liner": "固定的已标定采集阵列中，总有一些相机未被当前视角使用，这些相机免费提供 ground truth。我们利用它们为实时生成式 3D 视频流提供始终有效的逐像素误差界，并按每个像素是被观测到、插值得到还是生成的来分层。diffusion 补全器只填补没有任何相机看到的区域，而误差界则认证被观测像素未被篡改。", "core_claim": "该主张在名义水平 90% 下、满足三个条件时成立：数据为稠密的公开多视角动态数据集（DNA-Rendering、MVHumanNet、Panoptic、DyNeRF、ENeRF-Outdoor）；序列长度为 300-1800 帧；标定只使用阵列的空闲相机，并配合相机丢弃难度阶梯（camera-dropout difficulty ladder）。在这些条件下，按来源分层的自适应共形推断（ACI）达到三项结果。(a) 对每个来源类别，逐像素或 patch 误差的长期经验覆盖率与名义值相差不超过 ±3 个点。这在留出的阵列内目标上成立，也在 off-hull 划分上成立——该划分中最外侧的相机同时从输入和标定中排除。(b) 在相同覆盖率下，OBSERVED 类像素的误差界比不分层、仅依赖视角难度的 split-conformal 基线（VSCP 式）至少紧 2 倍。(c) 加入一个门控 one-step 生成器：与原论文的 I_BG U-Net 相比，它在从未被观测的区域将 LPIPS 降低至少 15%；其在 OBSERVED 像素上经认证的幻觉率不超过 0.5%；在单张 RTX 4090、约 1K 分辨率下额外耗时不超过 25 ms。若覆盖率在 off-hull 划分上失效，或按来源分层相比标量难度协变量没有带来任何收紧，则该主张不成立。", "key_insight": "固定、已标定、同步的采集阵列在结构上与单目、无位姿或静态逐场景设定有三点不同，且每一点都可以被利用。\n\n(1) 免费、连续的 ground truth。对任一目标视角，未被选中的 N−K 台相机就是同一时刻的真实图像。它们构成一个带标签标定点的实时流，因此共形标定可以是在线且自适应的（ACI，Gibbs & Candès 2021），而不是一次性的 split。\n\n(2) 按需生成更难的标定点。在渲染一台留出相机之前丢弃距其最近的若干相机，即可产生难度可控的标定样本。这一难度阶梯覆盖了阵列内留出相机永远达不到的 off-hull 区间，并使基于难度特征的协变量偏移加权共形预测成为可能。\n\n(3) 度量意义上的来源判别器（provenance oracle）。基于图像的 TSDF 加上在全部 N 台相机中的可见性测试，可将每个输出像素划分为 OBSERVED（被 K 台选中相机中至少 2 台看到且光度一致）、INTERPOLATED（弱观测或仅被单台看到，或被看到但不一致）或 GENERATED（无相机看到）。这将误差分布拆分为离散程度差异很大的几种情形。因此按来源类别分层的共形分位数在真实性重要的地方明显更紧，而恰好在内容被凭空生成的地方很宽。\n\n生成器只是这些证书的载体，而不是主张本身。", "method": "BASE。复现原论文：逐视角像素大小的不透明 Gaussian、前向 splatting、颜色门控的时间深度滤波、带前一帧深度反馈的基于图像的 TSDF，以及融合 U-Net。由于大多数数据集没有传感器深度，深度来自在公开数据上训练的 learned stereo 或 MVS 网络。\n\n(1) 来源图 P。\n- 对每个目标像素，取 TSDF 光线命中点 x。\n- 用 K 台选中相机和全部 N 台相机的深度图对 x 做可见性测试（以相对深度为容差）。\n- 类别：O = 在 K 台相机中至少 2 台可见，颜色方差低于 τ_c。I = 恰好 1 台可见，或 TSDF 权重低，或融合熵高。G = K 台中均不可见。可选子类 G_rig 表示在某台未被选中的阵列相机中可见的像素；这些像素通过加入该相机来获取，而不是生成（先检索后生成，retrieve-before-generate）。\n- 代价：约 2-4 ms，复用 TSDF raymarch。\n\n(2) 门控生成器（刻意保持简单）。\n- 一个 one-step 隐空间修复器，从公开的 Difix3D+ / SD-Turbo 权重初始化，配一个 tiny VAE，在 DNA-Rendering、MVHumanNet 和 N3DV 训练划分的留一相机渲染上微调。\n- 输入：IBR 输出、P 图、TSDF 深度，以及用 TSDF 深度（而非光流）重投影的前一帧输出，并带遮挡测试。\n- 合成：O 上 I = IBR；I 上为 IBR + clamp(Δ, ±ε)；G 上为生成器输出。硬合成意味着生成器在构造上无法覆盖观测。\n- 瓦片稀疏执行：只有包含 I 或 G 像素的瓦片才经过 backbone。\n- 立体：双眼作为一个 batch 运行，带跨眼注意力。\n- TSDF 扭曲噪声与 i.i.d. 噪声的对比仅作为消融，不作为贡献。\n- 损失：O 和 I 上用 L1 + LPIPS；仅在 G 上用 DMD 或对抗项；TSDF 重投影时间损失；左右视差扭曲损失。\n- 不使用 Self-Forcing 教师。短的 8 帧 on-policy rollout 足以应对 exposure bias。\n\n(3) 在线认证。\n- 每帧以四分之一分辨率渲染 1-2 台空闲阵列相机，轮流覆盖所有相机。每台都用相同的 K 选择策略渲染，就像它是目标视角一样。\n- 在每台上计算归一化的非一致性分数 s = e / σ̂。其中 e 为 8x8 patch L1 误差（或 patch LPIPS），σ̂ 来自一个很小的异方差预测头，根据 P、TSDF 权重、融合熵和视角预测局部难度。\n- 为每个来源类别 c 和难度桶 b 维护一个 ACI 分位数 q_{c,b,t}。难度桶按到最近输入相机的角度距离和基线距离定义。\n- 难度阶梯：以概率 p 在渲染标定相机之前丢弃最近的 1-3 台输入相机，以填充 off-hull 目标所落入的高难度桶。按难度特征的密度比对这些样本加权（加权共形）。\n- 真实性保证：对误差超过 τ 的 O 像素比例使用共形风险控制（conformal risk control），得到逐帧经认证的幻觉率上界。\n- 输出：逐像素误差上界 σ̂·q，以及可选的、在 HMD 中低显著度显示的来源叠加层。\n- 运行时：标定渲染异步运行，不在关键路径上（+8-15 ms GPU 时间，可摊到第二块 GPU 上）。\n\n预算目标（4090，约 1K）：IBR 40-80 ms，与原论文相同；来源图 3 ms；稀疏瓦片上的生成器不超过 25 ms；认证不在关键路径上。", "why_not_engineering": "贡献是在新设定下的一种新的统计能力，而不是加速。论文将包含：\n- 针对实时生成式 3D 视频流的形式化在线覆盖陈述（任意偏移下的长期 ACI 保证）。\n- 两种只在固定已标定阵列上才存在的新标定机制：空闲相机馈送，以及能为 off-hull 外推提供标定数据的相机丢弃难度阶梯。\n- 一种几何分层（TSDF 来源），并用实验表明它是正确的条件变量。\n- 一种经认证的真实性指标（带风险控制的观测像素幻觉率）。\n\n每一项都可以通过覆盖率-名义值曲线以及与最强非生成式共形基线（VSCP）的宽度对比来证伪。认证层与渲染器无关，并在两个生成器上展示：原论文的 I_BG U-Net 和门控 diffusion 修复器。这排除了“这只是 Difix 加一个 mask”的质疑。一项注入伪造手势的 HMD 信任研究检验这些证书对人是否重要，这是没有任何修复器论文提出过的问题。", "differentiation": "- VSCP（arXiv 2609.10307）：静态逐场景 3DGS、split conformal、视角难度因子、无生成部分。我们的方法在线且自适应，使用实时空闲相机标定馈送，按来源类别分层，加入丢弃阶梯以获得 off-hull 覆盖，并在动态场景中配合生成器。VSCP 式 split CP 作为基线纳入。\n- 共形图像到图像与 diffusion 不确定性量化（Angelopoulos et al. 2202.05265；Conffusion 2211.09795；K-RCPS 2302.03791）：单张图像、离线标定集、无几何。我们借用其风险控制机制，并加入几何来源与在线阵列标定。\n- HAD（2605.16873）与 Hallucination Score（2507.14367）：启发式幻觉分数，无覆盖保证，离线。\n- GenRec（2608.17832）与 ArtiFixer（2603.00492）：静态离线 NVS 中的观测/未观测门控。我们将其作为门控的已有工作引用，对门控本身不作任何主张。\n- DreamStereo（2604.12270）：基于单目估计深度的 one-step、mask 剪枝、保留观测的立体补全，33-40 ms。我们承认稀疏门控 one-step 的速度主张已被占，并使用适配阵列的 DreamStereo 式修复器作为基线或可替换生成器。\n- DiffusionHarmonizer（2602.24096）与 InstantViR（2511.14208）：因果 one-step 修复器，单视角，无几何，无不确定性。我们用 TSDF 重投影替代光流对齐，但不把它作为亮点主张。\n- DiffPBR（ICLR 2026）、GSD（2406.16695）、UniCaMo（2607.02798）、Go-with-the-Flow（2501.08331）：3D 锚定噪声。我们只把 TSDF 扭曲噪声作为消融。\n- Bonn 实时补全 transformer（2603.05507）：相同的管线位置，非生成式，无不确定性。它既是速度基线，也是我们认证的第二个生成器。"}, "experiments": {"datasets": ["DNA-Rendering：60 台相机，带服装和物体的人体；难度阶梯与 off-hull 划分的主要稠密阵列（申请后公开）", "MVHumanNet / MVHumanNet++：48 台相机，大量受试者；生成器训练数据及第二个评测阵列", "CMU Panoptic Studio HD：31 台 HD 相机加 480 台 VGA 相机；极稠密的覆盖使真正的 off-hull ground truth 成为可能；多人，长序列", "ActorsHQ：160 台 12 MP 相机；高分辨率人脸与手部真实性测试（需申请许可）", "DyNeRF / Neural 3D Video：18-21 台相机；原论文协议，扩展到全部 300 帧以及不含 kitchen 的训练划分", "ENeRF-Outdoor：18 台相机，户外动态人体；原论文协议", "Technicolor light field：4x4 阵列；空闲相机池很小的稀疏阵列压力测试", "可选的小型自建阵列（6-8 台同步 RGB-D 或立体相机）：仅用于实时端到端延迟和 HMD 信任研究，不用于主要定量主张"], "baselines": ["原论文（Ha et al. 2025），复现，带 I_BG U-Net，无不确定性", "Base + 逐帧 Difix3D+（无门控），以及 base + 带硬来源门控的 Difix3D+（“Difix + mask”稻草人）", "适配阵列深度的 DreamStereo 式 one-step mask 剪枝补全器（2604.12270）", "DiffusionHarmonizer 式光流对齐的时间 one-step 修复器（2602.24096），如无代码则复现", "Bonn 实时多视角补全 transformer（2603.05507）", "GPS-Gaussian+ / ENeRF 作为可泛化实时 NVS 参考", "同一渲染结果上的不确定性基线：带视角难度因子的 VSCP 式 split conformal（2609.10307）；不分层 ACI；离线标定的 K-RCPS 式风险控制（2302.03791）；阈值化的 HAD 式启发式幻觉分数（2605.16873）；融合网络的 deep-ensemble 或 MC-dropout 方差"], "metrics": ["经验覆盖率减名义值，按来源类别和难度桶，作为随时间的滑动窗口，在阵列内、off-hull 和相机失效划分上", "平均误差界宽度，或在相同覆盖率下相对 VSCP 式 split CP 的紧度比", "经认证与经验幻觉率：误差超过 τ 的 O/I 像素比例，附共形风险控制上界", "按来源类别拆分的保真度：O 和 I 上的 PSNR、SSIM、LPIPS；G 上的 LPIPS、FID、FVD", "真实性划分中的人脸与手部身份：ArcFace 相似度与手部关键点误差，比较生成版本与观测版本", "时间：tOF / flow-warp 误差、TSDF 重投影误差、闪烁（STED），在移动相机加动态场景轨迹上", "立体：左右视差扭曲误差，以及用于多视角一致性的 MEt3R", "延迟：各阶段平均与 p99 时间、标定开销、自建阵列上的端到端 motion-to-photon 时间", "HMD 用户研究（n 约 24）：真实感、信任校准（在有无来源叠加层时检测注入的伪造手势）、双眼舒适度"], "key_ablations": ["分层：无、仅难度（类 VSCP）、仅来源、来源 x 难度", "标定：静态 split、ACI、ACI + 相机丢弃阶梯、ACI + 阶梯 + 密度比加权（决定 off-hull 覆盖的关键消融）", "非一致性分数：原始 L1、patch L1、用学习的 σ̂ 归一化、patch LPIPS", "来源判别器：TSDF 可见性 vs 仅不透明度（ArtiFixer 式）vs 学习的 mask（GenRec 式）；包括因深度误差将 G 误判为 O 这一危险错误的比率", "合成：软门控 vs 硬门控 vs I 上带截断残差的硬门控，在真实性与质量之间权衡", "生成器条件：光流扭曲 vs TSDF 重投影的前一帧输出；i.i.d. vs TSDF 扭曲噪声；立体交叉注意力开或关", "先检索后生成：生成 G_rig 像素 vs 获取额外的阵列相机", "标定预算：每帧 0.5、1 或 2 台空闲相机，1/4 或 1/8 分辨率，对比分布偏移（光照变化、新人进入）后的覆盖率滞后"], "needs_custom_capture": false, "capture_notes": "所有核心主张（覆盖率、紧度、幻觉率、生成器质量、off-hull 划分）都可以在公开稠密阵列上检验。DNA-Rendering、Panoptic、ActorsHQ 和 MVHumanNet 有 31-160 台相机，留有足够的空闲相机用于标定和诚实的 off-hull 留出。\n\n注意事项：\n- 大多数公开阵列没有同步的传感器深度。深度必须来自 learned stereo 或 MVS，深度误差会传递为来源误判，这是一项需测量的消融。\n- DNA-Rendering 和 ActorsHQ 需要签署许可协议；第 1 周就要申请。\n\n小型自建阵列（6-8 台相机，例如 ZED 或 RealSense，或同步的机器视觉立体对）仅在实时延迟和 HMD 信任研究中需要。若没有硬件，可以把 Panoptic 序列回放到 HMD 中替代，代价是失去真正的 motion-to-photon 测量。"}, "first_two_week_test": "不做 diffusion 训练。\n\n第 1-4 天：搭建原渲染器的轻量代理：\n- MVS 或 learned-stereo 深度、从 K=4 个最近相机做前向扭曲 IBR，以及用于来源图（O/I/G）的基于图像的 TSDF raymarch。\n- 数据：DyNeRF（现已公开）和 CMU Panoptic HD（现已公开；每段约 300 帧）。若许可到位则加入 DNA-Rendering。\n\n第 5-8 天：进行不确定性分析。\n- 流式处理空闲相机渲染，计算 patch-L1 非一致性分数，运行四种标定器：(i) 基于难度因子的 VSCP 式 split CP；(ii) 不分层 ACI；(iii) 来源 x 难度 ACI；(iv) (iii) + 带密度比权重的相机丢弃阶梯。\n- 在两个目标集上评测：从未用于标定的阵列内相机，以及 off-hull 划分（最外侧 20% 的相机，同时从输入和标定中排除）。\n\n第 9-12 天：接入现成的 Difix3D+（公开权重）并加硬来源门控作为生成器。\n- 重新计算 O 像素上的覆盖率和经验幻觉率。\n- 测量门控与无门控修复器之间 O 类误差分布的偏移程度。\n\n第 13-14 天：产出 go/no-go 图：按类别和划分的覆盖率-名义值曲线、相对 VSCP 式的宽度比，以及 G 像素被误判为 O 的比率。\n\n若以下三点全部成立，则验证核心洞见：\n- 阶梯 ACI 在 off-hull 目标上的覆盖率与名义值相差在 ±3 个点以内；\n- O 类宽度比不分层至少紧 1.5-2 倍；\n- 无门控修复器可测量地违反 O 类误差界，而门控修复器不违反。", "kill_criteria": "在 2 周测试或首次完整评测后，若出现以下任一情况，则放弃或转向。\n\n(1) off-hull 覆盖率无法修复。加入丢弃阶梯和加权后，90% 名义水平下 off-hull 划分的覆盖率仍比名义值低超过 5 个点。证书将恰好在远程呈现最需要的地方失效。\n\n(2) 来源分层毫无增益。与标量视角难度协变量相比，来源分层使 O 类误差界收紧不足 1.3 倍。VSCP 已经能覆盖，新颖性崩塌。\n\n(3) 误差界太宽无法使用。90% 覆盖率下 O 像素的误差界没有信息量，例如 patch-L1 上界高于 0.08，或比朴素 IBR 本身的误差还宽。\n\n(4) 深度误差破坏判别器。人体序列上由深度误差导致的 G 到 O 误判超过约 2% 的 G 像素，使真实性保证建立在失效的判别器之上。\n\n(5) 认证没有在线的必要。在包含偏移（新人进入、光照变化）的 1000+ 帧序列上，ACI 相比静态 split CP 在覆盖率或宽度上都没有收益。\n\n另外，对于生成器部分：若逐帧门控 Difix3D+ 在 G 区域的 LPIPS 与训练得到的 TSDF 条件因果修复器相差在 5% 以内，则保持论文以认证为中心，并将生成器作为现成组件呈现。\n\n另外每月重新在 arXiv 和 Semantic Scholar 上检索“online / adaptive conformal”加“novel view synthesis / generative video”。若出现实时阵列或在线共形 NVS 的论文，则转向来源分层与 HMD 信任研究。", "reviewer_objections": [{"objection": "生成器只是 DreamStereo / Difix3D+ 加一个 mask。保留观测像素、计算量随空洞面积缩放的门控 one-step diffusion 已经发表（DreamStereo 2604.12270；ArtiFixer 和 GenRec 的观测/未观测门控）。", "rebuttal": "同意，我们也明确这样写。我们对门控和 one-step 速度不作任何主张。贡献在于认证。认证层与渲染器无关，我们在三个生成器上展示有效、紧致、按来源分层的覆盖：原论文的 I_BG U-Net、Bonn transformer 补全器，以及门控 one-step 修复器。门控 Difix 和 DreamStereo 式修复器既作为基线，也作为可替换生成器。"}, {"objection": "共形保证需要可交换性。时序视频不可交换，而阵列内标定相机与阵列外 HMD 视点的分布不同，因此所谓“保证”是空的。", "rebuttal": "ACI（Gibbs & Candès 2021）在任意分布偏移下给出长期平均漏覆盖保证，不需要可交换性。这正是我们主张的陈述，并精确表述为按类别和难度桶的边际覆盖。对于阵列内到阵列外的差距，相机丢弃阶梯在高难度区域生成标定样本，并通过难度特征上的密度比加权进行适配。我们在一个其相机从不进入标定的真正 off-hull 划分上报告经验覆盖率。如果在那里失败，论文会如实说明。这正是我们预先登记的 kill criterion。"}, {"objection": "VSCP（2609.10307）已经为 Gaussian splatting 做了带可迁移视角难度因子的视角结构化共形预测。这只是增量式的在线扩展。", "rebuttal": "VSCP 是静态、逐场景、split-conformal 且非生成式的。我们贡献了 VSCP 缺少的四点：\n(i) 只在同步阵列上才存在的实时标定馈送；\n(ii) 面向外推视角的丢弃阶梯；\n(iii) 按几何来源分层，消融表明它在观测像素上比仅按难度分层至少紧 2 倍（表中包含 VSCP 式基线）；\n(iv) 对生成组件经认证的幻觉率控制，这才是远程呈现真正关心的问题。"}, {"objection": "在生成区域上的逐像素误差界没有意义，因为生成本来就不要求与 ground truth 一致。而且用户真的在乎不确定性叠加层吗？", "rebuttal": "对 G 像素而言确实如此。它们宽的误差界是内容被凭空生成的信号，而不是质量声明。真正重要的保证在 O 和 I 像素上：共形风险控制约束了系统将真实观测像素改动超过 τ 的比例。这是以往任何远程呈现系统都未提供的真实性证书。它对人是否重要，由一项 HMD 研究（n 约 24）直接检验：注入伪造手势，测量有无来源叠加层时的检测准确率与信任校准。"}, {"objection": "原管线假设 RGB-D 或立体输入，但公开动态数据集没有传感器深度。使用估计深度时来源判别器不可靠，而且延迟预算没有算上深度估计。", "rebuttal": "我们使用 learned stereo 或 MVS 深度，与原论文非 RGB-D 实验的设定相同。判别器的可靠性被直接测量：G 像素误判为 O 的比率，以及注入深度噪声时覆盖率的退化。这类误判恰恰会被 O 类共形界捕获，因为误标像素产生的误差会拉宽 O 分位数，而不是悄无声息地通过。延迟在可选的小型阵列上端到端报告，包括深度。标定渲染异步运行，单独报告。"}], "synergies": "1. 阵列外外推与移动视点基准：off-hull 划分、难度阶梯和覆盖率指标是整个论文系列共享的基准贡献。\n\n2. 主动相机选择与阵列设计：每个桶的共形宽度可直接为目标视角应使用哪 K 台相机打分，或决定在哪里增加相机（阵列设计中的 next-best-camera）。\n\n3. 长期背景记忆与先检索后生成：G_rig 和记忆来源类别会在生成之前把像素路由到真实的过去观测或未被选中的观测上。这与持久的静态背景缓存自然结合。\n\n4. 带宽自适应流式传输与压缩：来源图和误差界图可以驱动码率分配，把比特花在误差界宽的地方，对 G 区域发送生成种子而不是像素。\n\n5. HMD 立体渲染与延迟工作：同一个 TSDF 重投影可用于 90 Hz 的 late-warp，经认证的误差界可以调节注视点渲染。\n\n6. 反 deepfake 与真实性标识：经认证的幻觉率加上来源叠加层或水印，可与生成式远程呈现中的签名媒体和知情同意方向结合。\n\n7. 免标定与无位姿阵列（Tele360、LiveStre4m 路线）：一个消融或未来工作是，当位姿为估计值时，空闲相机 ACI 是否仍然成立。\n\n本次会话核查过的参考文献：VSCP https://arxiv.org/abs/2609.10307；ACI https://arxiv.org/abs/2106.00170；Image-to-Image conformal https://arxiv.org/abs/2202.05265；Conffusion https://arxiv.org/abs/2211.09795；K-RCPS https://arxiv.org/abs/2302.03791；Hallucination Score https://arxiv.org/abs/2507.14367；Go-with-the-Flow https://arxiv.org/abs/2501.08331。其余工作均来自经核实的新颖性报告。", "effort": {"months": "总计 8-10 个月。第 0-1 月：渲染器复现加 2 周认证测试。第 2-5 月：门控 one-step 生成器微调与立体。第 5-7 月：完整评测加 off-hull 基准。第 7-9 月：可选小型阵列加 HMD 研究。仅认证版本约 5 个月。", "people": "2 人：一名博士生负责渲染、生成器和系统；一名负责共形/统计、评测和用户研究。强烈建议配一位具备共形预测专长的兼职导师。", "compute": "4-8 块 A100/H100 级 GPU，约 2-3 个月，用于在留一相机渲染上微调 Difix3D+/SD-Turbo 级 one-step 修复器。这刻意避开了对视频教师做 Self-Forcing 蒸馏，那需要 32+ 块 GPU。认证实验需要 1-2 块 GPU，实时基准需要一块 RTX 4090。可选阵列约 3-8k 美元（6-8 台立体或 RGB-D 相机加同步）。"}, "venue": "主要目标为 ICCV 2027（截稿约 2027 年 3 月）。CVPR 2027（2026 年 11 月）对完整系统来说太早。备选：若 HMD 信任研究有力，则投 SIGGRAPH Asia 2027 / TOG。聚焦信任研究的后续工作适合 IEEE VR / TVCG 2028。", "novelty": {"verdict": "partially_scooped", "remaining_novel_angle": "几乎每个组件都已分别发表：\n- 只在去遮挡 token 上运行、保留观测像素、立体一致、33-40 ms 的门控 one-step diffusion：DreamStereo。\n- 3D 锚定或按可见性 splat 的噪声：DiffPBR（ICLR 2026）、GSD、MultiDiff、UniCaMo、CameraNoise。\n- 观测与生成的门控：ArtiFixer 的不透明度混合和 GenRec。\n- 因果 one-step 流式修复器：DiffusionHarmonizer 和 InstantViR，后者已提到远程呈现。\n- 带视角难度因子的新视角合成共形误差界：VSCP。\n\n仍然成立的部分：\n\n(1) 在线、阵列自标定的认证。固定已标定阵列的 N−K 台空闲相机充当免费、连续的标定流。按 TSDF 导出的来源类别（observed / interpolated / generated）分层的自适应共形推断，实时为生成式 3D 视频流给出逐像素误差界。检索到的工作中没有一篇为流式新视角合成做在线或自适应共形标定，也没有按几何来源对覆盖率分层。VSCP 是静态的、split-conformal 的，且没有生成部分。\n\n(2) 将一个度量对象——已标定阵列的基于图像的 TSDF——作为同时承担三件事的单一算子：来源判别器、前一帧输出的重投影，以及跨时间和跨 HMD 双眼的噪声与隐变量对应。其目标是实时多视角 RGB-D IBR 闭环中的自由视点。DreamStereo 使用单目估计深度和固定的右眼视角；DiffPBR 是静态逐场景的。\n\n(3) 基准与评测贡献：观测像素上的幻觉率、经验与名义覆盖率、立体视差一致性和阵列外外推划分，以及注入伪造手势的 HMD 信任研究。\n\n表面锚定噪声本身作为亮点贡献站不住脚。它只是把 DiffPBR/GSD 式 3D 一致噪声直接移植到 TSDF 上，而强条件的 one-step 修复器可能对噪声基本不敏感。系统层面“在线已标定多视角管线中首个门控因果 one-step 修复器”的主张在技术上尚无人占据，但与 DreamStereo 加 DiffusionHarmonizer 相比显得增量。它需要硬性的延迟数据以及清晰的真实性与认证结果，才能撑起一篇 CVPR 论文。", "threats": [{"title": "DreamStereo: Towards Real-Time Stereo Inpainting for HD Videos", "url": "https://arxiv.org/abs/2604.12270", "year": "2026", "venue": "arXiv preprint (Apr 2026)", "overlap": "high", "what_overlaps": "它已经展示了 C04 所依赖的系统主张：仅对去遮挡区域做 one-step（1 NFE）diffusion 补全（Wan2.1-1.3B 加 LoRA 和蒸馏 VAE）。它利用去遮挡 mask 剪枝到约 25.6% 的 token，使计算量随空洞面积缩放（10.7 倍加速）。它通过基于 mask 的融合保留观测像素，立体一致且时间一致，在 768x1280 下 A100 上 40 ms/帧、4090 上 33 ms。这推翻了三块基石：“门控 one-step diffusion 能满足远程呈现预算”“计算量随去遮挡面积缩放”以及“观测像素被复制而非重新生成”。", "what_remaining_different": "", "what_remains_different": "单目视频，使用估计的 DepthCrafter 深度，转换为一个固定的右眼视角。没有已标定多相机阵列，没有 TSDF，没有自由或阵列外视点，没有 K 视角参考条件，没有几何扭曲噪声，没有多视角来源类别，也没有认证。"}, {"title": "DiffPBR: Point-Based Rendering via Spatial-Aware Residual Diffusion", "url": "https://mlanthology.org/iclr/2026/xie2026iclr-diffpbr/", "year": "2026", "venue": "ICLR 2026", "overlap": "high", "what_overlaps": "直接预见了 idea 2 的“表面锚定噪声”。它用从点云 splat 出来、受场景几何和可见性约束的 3D 一致噪声替代 i.i.d. 噪声，以在相机运动下保持视角一致。它有一个约 10 fps 的 one-step 变体。", "what_remains_different": "静态场景、逐场景重渲染。没有 TSDF 流式处理，没有动态表面平流，没有立体双眼或多观看者共享，没有因果时间状态，也达不到 50 ms 以下。"}, {"title": "Geometry-Aware Score Distillation via 3D Consistent Noising and Gradient Consistency Modeling (GSD)", "url": "https://arxiv.org/abs/2406.16695", "year": "2024", "venue": "arXiv 2024 (KAIST)", "overlap": "medium", "what_overlaps": "通过对加噪点云做 3D 条件上采样并对投影噪声做离散积分，构建严格保持标准 Gaussian 的 3D 一致 2D 噪声图。这正是 idea 2 所提出的“保面积 splat 使噪声保持 i.i.d. Gaussian”的机制。MultiDiff（CVPR 2024）类似地把参考噪声扭曲到重叠的目标视角，一个 Lacuna 方向页面还列出了更多在 3D 中锚定噪声的工作（Flow Score Distillation、Consistent Flow Distillation、MAS、4D-from-3D）。", "what_remains_different": "为 SDS 文本到 3D 优化而设计，不是流式视频，不是因果的，也不是渲染修复器。"}, {"title": "Track the Noise, Move the World: 3D-Grounded Motion-Consistent Noise (UniCaMo)", "url": "https://arxiv.org/abs/2607.02798", "year": "2026", "venue": "arXiv (Jul 2026)", "overlap": "medium", "what_overlaps": "将 diffusion 噪声提升到共享的 3D 表示中：噪声沿 3D 点轨迹扭曲，并对每个视点采样球面噪声场。这使噪声在相机运动和时间上保持一致，是 Go-with-the-Flow 的 3D 推广。CameraNoise（arXiv 2605.30774）同样用几何引导的重投影流扭曲噪声。", "what_remains_different": "单视频可控生成，多步，没有立体对，没有度量 TSDF 表面，也没有实时修复器。"}, {"title": "ArtiFixer: Enhancing and Extending 3D Reconstruction with Auto-Regressive Diffusion Models", "url": "https://arxiv.org/abs/2603.00492", "year": "2026", "venue": "arXiv (NVIDIA)", "overlap": "medium", "what_overlaps": "将观测与未观测的生成门控（不透明度混合）与修复器的因果自回归蒸馏相结合。这正是三个 idea 中都有的“门控加因果学生”配方。", "what_remains_different": "在静态逐场景 3DGS 上的离线轨迹。没有实时阵列，没有动态人体，没有 TSDF 信号，没有立体，没有延迟预算。"}]}}, {"id": "C06", "name": "Non-Lambertian / specular robustness: two-layer reflection IBR or probabilistic depth with light-field fallback", "decision": "pursue_with_repositioning", "scores": {"novelty": 5.5, "significance": 6, "feasibility": 5, "telepresence_fit": 8, "overall": 5.5}, "sharpened": {"title_zh": "高光有自己的视差：面向多视角 3D 视频的、具有分层时间动态的在线双层反射感知 IBR", "title_en": "Highlights Have Their Own Parallax: Online Two-Layer Reflection-Aware IBR with Layer-Specific Temporal Dynamics for Multi-View 3D Video", "one_liner": "把每一帧几何引导 IBR 拆成漫反射层和镜面层。漫反射层由经过强时间滤波的 TSDF 表面扭曲；镜面层由在线逐帧估计的虚拟反射深度扭曲，并使用低惯性记忆。于是高光以正确的视差移动，不再出现跨视角重影和时间闪烁，每帧额外开销约 10 ms。", "core_claim": "在相同网络容量和运行时（相对 Ha et al. 式管线开销不超过 12 ms）下，四项改动共同使镜面掩膜像素上的视角和时间不一致性降低至少 25%，以留出相机上的 EPI 不连续性和光流扭曲时间误差（tOF/STED）度量。四项改动为：(a) 由反射深度扭曲的第二个镜面层；(b) 分层时间滤波；(c) 镜面感知的 (1 − s) TSDF 加权；(d) 针对光泽像素、由熵门控的视角条件回退。镜面掩膜 PSNR 也提升至少 0.7 dB。三个对照作为参照：(i) 单层表面扭曲，(ii) 同等容量的视角条件残差头（ViewSplat/IBGS 式），(iii) 任何单一共享时间滤波器，它无法达到同样的闪烁-滞后 Pareto 点。全帧指标不得退化。若 oracle 双层拆分（GT 分离加最佳反射深度）无法以上述幅度优于单层扭曲，或同等容量残差头在 EPI 和时间指标上与本方法持平，则该主张被证伪。", "key_insight": "几何引导 IBR 中镜面外观之所以失败，是因为它与表面有不同的运动学，而不是因为表面深度有噪声。反射是一个具有自身深度的虚像：\n- 对平面屏幕或镜子，虚深度是反射距离。\n- 对远处光源照亮的凸光泽表面（眼镜镜片、角膜、颧骨、金属锅），由镜面方程，虚像位于表面后方约 R/2 处。\n因此逐像素虚深度是高光视差的一个有物理依据的一阶模型，并且可以通过只对 TSDF 表面后方的跨视角不一致残差做 plane-sweep 在线估计。\n\n层的分离同时也分离了它们的时间统计：表面几何变化缓慢，应该有长记忆；而高光随观看者、光源和头部的小幅转动而移动，需要由自身深度扭曲的短记忆。单一时间滤波器必须在滞后与闪烁之间折中；两个滤波器则不必。\n\n在反射深度代价体平坦的地方（粗糙光泽），其熵就是回退到视角条件角度融合的信号。这种回退吸收了“概率深度加光场回退”思路中有用的部分，而不把概率融合声称为新颖。", "method": "前端（在延迟预算之内，这一点与原论文不同）：\n- 逐视角深度来自在自动选择的相邻相机对上运行的 Fast-FoundationStereo，或来自传感器 RGB-D。\n- 一个对齐到立体尺度的廉价单目先验（流式 Video Depth Anything 或类似方法）。单目-立体不一致图 u_n 保留为不可靠性线索。\n\n(1) 镜面与不可靠性检测（免训练核心加一个很小的 CNN）：\n- 对每个目标像素 raymarch 原论文的基于图像的 TSDF，并将表面点重投影到 K 个视角。\n- 计算跨视角的鲁棒颜色离散度（按曝光和传感器噪声归一化），以及饱和度、u_n 和反射向量对齐度 dot(reflect(target ray, n), input ray_k)。\n- 一个 3 层 CNN 将这些特征映射为 s ∈ [0,1]。监督：合成的 GT 光泽通道 mask，以及真实数据上的留一视角一致性损失。\n\n(2) 镜面感知几何：\n- TSDF 融合权重变为 ω_k·(1 − s_k)，使反射不会把表面拉向虚像。\n\n(3) 逐输入视角的层分离：\n- 漫反射 D = 表面处重投影跨视角样本的鲁棒低分位数或中位数（Lambertian 共识）。\n- 镜面残差 S = max(I − D, 0)，并对高光覆盖至少 K/2 个视角的情况加入学习的校正。\n\n(4) 反射深度：\n- 只在 s > τ 的像素上（通常为 3-15% 的像素），沿反射光线参数化在表面后方扫 24-32 个虚深度，对 S 的跨视角一致性打分。\n- Soft-argmin 给出 d_r。保留归一化代价体熵 h。\n\n(5) 渲染：\n- 原论文的像素大小不透明 Gaussian 被前向 splat 两次：漫反射层使用表面深度，镜面层（仅稀疏像素）使用 d_r。\n- 光泽回退路径在表面深度处用视角角度（Unstructured Lumigraph 式）权重融合 S。\n- U-Net 融合器接收两个层、s、h、法线和反射向量特征。它输出漫反射权重、镜面权重，以及由 h 门控的回退混合比例。\n\n(6) 时间：\n- 漫反射层保留原论文的 TSDF 反馈和颜色差门控滤波；长记忆没有问题。\n- 镜面层保留一个短的指数记忆，帧间由 d_r 诱导的光流（而非表面光流）扭曲。其学习到的惯性以 s 和 h 为条件。\n\n损失：\n- L1 + SSIM + LPIPS，加上镜面掩膜损失（权重 2-4 倍）。\n- 逐层施加的光流扭曲时间损失：漫反射层由表面诱导光流扭曲，镜面层由反射诱导光流扭曲。\n- 在合成 GT 漫反射和光泽通道上的层监督 L1。\n- 合成数据上的反射深度损失，其 GT 虚深度可由镜面方程或路径追踪计算。\n\n训练数据：\n- 原论文的数据：ScanNet、DyNeRF 训练场景和 Spaces。\n- 约 200 段合成 PBR 多视角视频片段（12-16 台相机，Blender Cycles，漫反射与光泽通道分离）：佩戴眼镜的 THuman/RenderPeople 式扫描人体、反射动画房间的笔记本和显示器屏幕、金属厨具、光泽皮肤着色器，以及带 HDRI 的移动光源。\n\n运行时预算：\n- 基础在 1352x1014、TensorRT 下约 39 ms。\n- 检测器 2 ms，稀疏扫描 3-5 ms，第二次稀疏 splat 2-3 ms，融合器额外通道约 2 ms。\n- 目标开销不超过 12 ms，立体前端时间单独并端到端报告。", "why_not_engineering": "有四点使其成为研究贡献而非系统调优：\n\n(a) 一个有物理依据、并与强学习替代方案对比检验的建模主张。该主张是：高光视差可以很好地由
