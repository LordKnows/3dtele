<script type="application/json" id="data">{"site": {"brand": "3D 临场研究图谱", "root": "../", "path": "future/C05.html", "nav": [{"key": "overview", "label": "Overview", "items": [["Introduction", "index.html"], ["Methodology", "overview/methodology.html"], ["How to use", "overview/how-to-use.html"]]}, {"key": "basics", "label": "Basics", "items": [["Routes", "basics/routes/index.html"], ["Foundations", "basics/foundations/index.html"], ["Advanced topics", "basics/advanced/index.html"], ["Classics", "basics/classics/index.html"], ["Glossary", "basics/glossary.html"]]}, {"key": "works", "label": "Works", "items": [["Papers", "works/papers/index.html"], ["Walkthrough", "works/walkthrough/index.html"], ["Field map", "works/field-map.html"], ["Sub areas", "works/areas/index.html"]]}, {"key": "future", "label": "Future", "items": [["Directions", "future/index.html"], ["Trends & Challenges", "future/trends.html"]]}], "navCur": "future", "navItem": "future/index.html", "crumbs": [["Future", ""], ["Directions", "future/index.html"]], "date": "2026-09-28"}, "xref": {"idea-C08": {"u": "future/C08.html", "t": "阵列能教会它自身之外的视角吗？实时几何引导 3D 视频的持续留出相机自适应，以及何时能迁移到阵列之外", "e": "Does the Rig Teach Beyond Itself? Continual Held-Out-Camera Adaptation of Real-Time Geometry-Guided 3D Video, and When It Transfers Off-Rig", "m": "Directions · 第 11 名 · 综合 5", "s": "已部署的多相机渲染器利用未用于渲染的阵列相机上的光度损失，在线自适应其深度网络和混合网络。"}, "idea-C11": {"u": "future/C11.html", "t": "一次混合，多视共享：面向时间稳定光场远程临场的视角无关源空间混合", "e": "Blend Once, View Many: Viewer-Invariant Source-Space Blending for Temporally Stable Light-Field Telepresence", "m": "Directions · 第 9 名 · 综合 5.5", "s": "在静态标定相机阵列上，把学习式 IBR 混合从目标图像移到源像素上的一个低阶方向场中。"}}, "page": {"id": "idea-C05", "head": {"title": "在部署处训练：面向移动远程呈现观看者的在线几何引导渲染器的 on-policy、置信度门控判别器训练", "sub": "Train Where You Deploy: On-Policy, Confidence-Gated Critic Training of Online Geometry-Guided Renderers for Moving Telepresence Viewers", "meta": ["第 10 名", "重新定位后推进", "查新：部分已被做"], "epigraph": "沿移动的、阵列外的头部轨迹对实时阵列渲染器做展开 rollout 训练，并通过 TSDF 回馈其自身的前一帧深度。一个只在阵列置信度低处起作用的视频判别器（critic）在没有 ground truth 的地方提供监督。在一个新的移动观看者基准上评测，该基准的阵列外 ground truth 来自稠密采集穹顶。", "prereqs": [], "lede": "", "minutes": 13}, "body": [{"b": "sec", "h": "评分", "id": "scores"}, {"b": "kv", "items": [["综合", "5"], ["新颖", "5"], ["意义", "6"], ["可行", "5"], ["临场契合", "8"]]}, {"b": "sec", "h": "核心论点（可证伪）", "id": "claim"}, {"b": "p", "t": "设定为稠密穹顶人体采集（DNA-Rendering、ActorsHQ）中的 4 相机正面阵列子集。学生模型只用阵列相机数据训练，外加由置信度门控视频判别器监督的阵列外 rollout。在运行时不变（40 ms 以内）且阵列内留出相机 PSNR 损失不超过 0.2 dB 的前提下，须满足三点：\n(a) 在这些阵列外相机上，它弥补了基础单时刻训练配方与直接使用穹顶 ground truth 训练的 oracle 之间至少 50% 的阵列外 LPIPS/FVD 差距。\n(b) 在阵列外 LPIPS 和时间指标（tLPIPS、TCC）上，它优于使用同一冻结 diffusion 先验的 FreeGen 式伪标签回归。\n(c) 与 teacher-forced 训练相比，通过前一帧深度/TSDF 反馈的 on-policy 展开训练将长时漂移降低至少 30%。漂移以 1 分钟移动观看者序列上 PSNR/tLPIPS 的衰减斜率度量。\n若 (a) 或 (c) 不成立，则论文的核心论点不成立。"}, {"b": "sec", "h": "关键洞察", "id": "insight"}, {"b": "p", "t": "在线几何引导渲染器存在一个从未被测量过的训练/部署失配：\n- 训练使用阵列相机上的单个时刻，输入为 ground-truth 几何。\n- 部署是一个连续移动、位于阵列外的观看者，其自身的前一帧渲染深度被回馈到融合中。这是一个循环的闭环系统，会遭受 exposure bias，也就是 Self Forcing 和 GeoStream 为生成器修复的同一种失效。\n\n两个观察使得这一情形无需逐阵列 ground truth 也能训练：\n(i) 管线本身会指出哪里缺乏监督。TSDF 累积权重和可见计数就是免费的逐像素置信度图。\n(ii) 置信度高处，阵列像素就是真值。置信度低处（去遮挡、外推），分布层面的视频判别器才是正确的信号，因为来自随机先验的逐像素伪标签会被平均化，导致模糊和闪烁。\n\n结果是：将管线展开为生成器，用管线自身置信度掩膜的判别器，并以阵列锚定保真度，测试时不使用 diffusion。"}, {"b": "sec", "h": "方法", "id": "method"}, {"b": "p", "t": "学生模型\n- 原管线的复现（无官方代码）：逐视角像素大小的不透明 Gaussian 前向 splatting，然后是颜色门控深度滤波，然后是带前一帧新视角深度反馈的基于图像的 TSDF，然后是带 I_BG 的 U-Net 融合。\n- 升级 1：目标视角空间中的 ConvGRU 状态，由前一帧渲染深度扭曲。预算：不超过 5 ms。\n- 升级 2：通过软松弛使融合超参数可学习：TSDF 截断 tau、反馈增益 beta、上限 eta，以及颜色 mask 的斜率/偏移。\n- 升级 3：可微的 TSDF 过零点。前向 ray-march 和二分保持不变；反向传播在最终过零点处使用隐函数梯度 dz/dθ = −(∂s/∂θ)/(∂s/∂z)。\n- 该配方与学生模型无关。它也被应用于第二个学生——一个像素对齐的 feed-forward GS 预测器（如 GPS-Gaussian），以展示通用性。\n\nROLLOUT\n- 沿采样的 6-DoF 头部轨迹截取 16-24 帧片段：坐姿前倾、侧向摆动、环绕，以及最高到 2 倍阵列基线的外推。\n- 轨迹统计来自可获得许可的公开 HMD 观看轨迹，否则使用与坐姿远程呈现头部运动范围匹配的合成路径。\n- 截断 BPTT，梯度窗口 4-8 帧。窗口之外状态 detach，与 Self Forcing 的梯度截断一致。\n- 课程学习：仅阵列内，然后近阵列，然后远离阵列。\n\n损失\n- 阵列内锚定：留出阵列相机上的 L1、SSIM 和 LPIPS，加上原有的深度和 mask 项，再加上光流扭曲的时间损失。\n- 阵列外，按像素用 g = 1 − normalize(TSDF 权重 × 可见性) 门控：\n  (1) 主要且廉价：条件时空判别器。真样本为阵列相机片段；假样本为渲染的阵列外片段。二者都以源帧为条件。判别器以 projected-GAN 方式构建在冻结的视频 backbone 特征上。\n  (2) 完整版：DMD，配一个冻结的相机条件多视角/视频 diffusion 教师（每个时间步用 SEVA 级模型，人体则用 Diffuman4D），以及一个在降低分辨率下在线训练的 fake-score 网络。\n  (3) 立体/多视角一致性项：MEt3R 式，或双眼渲染间的视差扭曲误差。\n- 使用完全相同教师的基线目标：FreeGen 式伪标签回归（以 Difix/Fixer 精修的渲染作为 L1/LPIPS 目标）。\n\n运行时\n- 不变：1K 下不超过 40 ms（TensorRT），加 ConvGRU 时不超过 45 ms。\n- 推理时无 diffusion。\n\n数据\n- 训练：DNA-Rendering 加 MVHumanNet(++) 序列。在无 GT 设定下，只使用 4-6 台“阵列”相机作为输入和监督。\n- 同一采集中的远端穹顶相机保留用于 (i) 评测和 (ii) oracle 上界。\n- 保留 DyNeRF 和 ENeRF-Outdoor 以便与原论文可比，阵列内正常评测，阵列外用 FVD / 用户偏好评测。"}, {"b": "sec", "h": "为什么不是工程改进", "id": "not-engineering"}, {"b": "p", "t": "论文提出并检验三个科学主张，而非系统调参：\n(1) 确定性在线渲染器中的循环几何反馈会造成可测量的 exposure-bias 漂移，而 on-policy 展开能修复它。这是一个可证伪、可测量、尚未在 IBR/TSDF 管线中被刻画的现象。\n(2) 对于外推和去遮挡区域，由重建置信度门控的分布层面判别器优于来自同一先验的伪标签回归。这是在固定学生和教师下对监督类型的正面比较。\n(3) 无 GT 的阵列外训练弥补了与穹顶监督 oracle 之间可量化比例的差距。oracle 上界把“看起来更好”变成一个校准过的数字。\n\n该基准包含移动观看者与移动场景轨迹、来自稠密穹顶的阵列外 ground truth，以及分钟级片段上的漂移指标，是可复用的社区资产。它揭示了一个当前所有在线方法（原论文、Tele360、LiveStre4m、NSTM）都没有评测过的情形。"}, {"b": "sec", "h": "与已有工作的区分", "id": "differentiation"}, {"b": "p", "t": "FreeGen（arXiv 2512.04830）：\n- FreeGen：静态驾驶场景；逐帧，无循环；伪标签回归；推理时有生成分支；每帧需数秒。\n- 我们：动态人体/场景，以 on-policy 方式训练的循环 TSDF 反馈环，由管线置信度门控的分布判别器，测试时零 diffusion，40 ms。在相同教师下，FreeGen 式伪标签是必需的基线。\n\nLyra（2509.19296）与 FlashWorld（2510.13678）：\n- 它们从单张图像或单目视频出发，蒸馏到生成器。\n- 我们是基于已标定阵列的忠实重建，有阵列内保真度锚定和留出 GT 评测。\n\nInstantViR（2511.14208）：\n- 它把视频 diffusion 模型蒸馏为具有已知退化算子的因果 2D 逆问题求解器。\n- 我们有 3D、新视点和几何闭环。我们引用它作为因果实时蒸馏可行的证据。\n\nGeoStream（2606.15162）与 MV-Forcing（2607.05376）：\n- 它们通过 3D 缓存处理 on-policy 训练，但针对的是 diffusion 生成器。\n- 我们把 exposure-bias 诊断迁移到确定性重建渲染器上，并用 ground truth 量化。\n\nDifix3D+（2503.01774）、4DGS-Fixer（2609.21176）与 DriveX（2412.01717）：\n- 这些是逐场景优化。\n- 我们是可泛化且在线的。Difix/Fixer 作为运行时精修基线（以延迟为代价的质量上界）。\n\n用于稀疏多相机 3D 流式传输的 Transformer 补全（2603.05507）：GT 监督的运行时后处理，作为运行时基线。\n\nMEt3R：仅用作一致性奖励/指标。"}, {"b": "sec", "h": "查新后剩余的可辩护新意", "id": "novel-angle"}, {"b": "p", "t": "通用思路已被占据。FreeGen（ECCV 2026）已在静态驾驶场景中做到：在采集轨迹之外采样视点，用冻结的视频 diffusion 先验在那里监督可泛化 feed-forward 渲染器，并在真实视角上用 GT 锚定。InstantViR（CVPR 2026）已把双向视频 diffusion 模型蒸馏为无需干净数据的实时因果学生。GeoStream 和 MV-Forcing 已发表通过几何反馈缓存、结合 DMD 的 on-policy（self-forcing）训练。\n\n仍可辩护的是交集，我找到的论文中没有一篇主张它：\n(1) 学生是一个无 diffusion、实时（40 ms 以内）、已标定多视角 RGB-D 几何引导 IBR 渲染器，用于动态人体或场景。与 FreeGen、GIFSplat 和 Leveling3D 不同，测试时不运行 diffusion。\n(2) 它在自身通过物理循环几何闭环（带前一帧深度反馈的 TSDF、可学习融合超参数）的展开 rollout 上训练。rollout 在场景运动的同时沿阵列外移动观看者的头部轨迹进行，针对的是确定性重建闭环而非生成器中的 exposure-bias 漂移。\n(3) 训练使用分布层面的判别器（DMD、视频判别器或一致性奖励）而非伪标签回归，并由管线自身的置信度（TSDF 权重）做空间门控，使先验只在阵列无信息处起作用。\n(4) 新的移动观看者、移动场景评测协议，使用来自稠密穹顶的阵列外 GT（DNA-Rendering 或 MVHumanNet++ 相机子集）以及时间和漂移指标。\n\n贡献 (4) 和 on-policy TSDF 反馈消融最可辩护。单独的“把 DMD 蒸进渲染器”会被看作“FreeGen/Lyra 用于远程呈现”。论文必须引用 FreeGen、InstantViR、GeoStream 和 MV-Forcing，并用实验证明 DMD 或判别器训练优于 FreeGen 式伪标签回归，且 on-policy rollout 优于 teacher-forced 训练。"}, {"b": "sec", "h": "主要撞车风险（查新找到的相近工作）", "id": "threats"}, {"b": "refs", "items": [{"left": "高", "url": "https://arxiv.org/abs/2512.04830", "t": "FreeGen: Feed-Forward Reconstruction-Generation Co-Training for Free-Viewpoint Driving Scene Synthesis", "sub": "2025 (arXiv Dec 2025; ECCV 2026 per papernotes) · ECCV 2026 · 重叠度 高", "gloss": "重叠：这是与核心配方最接近的工作，而构思者遗漏了它。它采样没有 ground truth 的轨迹外视点（±3 m 横向平移），并用可泛化 feed-forward 3DGS 重建器渲染。一个冻结的视频 diffusion 模型把这些渲染精修为伪标签，伪标签与轨迹内 ground-truth 损失一起监督 feed-forward 重建网络（辅助损失权重 0.1）。因此“用视频 diffusion 先验、在无 GT 的阵列外视角上训练可泛化渲染器，并以真实视角 GT 锚定”已经发表。\n差异：FreeGen 在推理时保留 diffusion 精修分支，因此不是零代价。它使用伪标签回归而非 DMD 或分布层面判别器。场景是静态驾驶场景：动态参与者被烘焙进静态 Gaussian，没有循环状态或 on-policy 反馈环。它不是实时的（数秒），不是已标定 RGB-D IBR，也不是人体远程呈现。"}, {"left": "中", "url": "https://arxiv.org/abs/2511.14208", "t": "InstantViR: Real-Time Video Inverse Problem Solver with Distilled Diffusion Prior", "sub": "2025 (CVPR 2026) · CVPR 2026 · 重叠度 中", "gloss": "重叠：将双向视频 diffusion 教师蒸馏为以超过 35 FPS 运行的因果自回归单遍学生。蒸馏由先验驱动，无需成对或干净数据，并明确针对流式传输、远程呈现和 AR/VR。这覆盖了“视频 diffusion 先验可以在无 GT 的情况下蒸馏为实时因果网络，包括流式补全”的主张。\n差异：它求解具有已知退化算子的 2D 逆问题（补全、去模糊、SR）。没有 3D，没有新视点，没有几何引导渲染器，没有多视角阵列，也没有 TSDF 反馈。"}, {"left": "中", "url": "https://arxiv.org/abs/2509.19296", "t": "Lyra: Generative 3D Scene Reconstruction via Video Diffusion Model Self-Distillation", "sub": "2025 (ICLR 2026) · ICLR 2026 · 重叠度 中", "gloss": "重叠：在没有多视角 GT 的情况下把视频 diffusion 蒸馏为 feed-forward 3DGS 解码器，并从单目视频扩展到动态 4D。这在一般意义上覆盖了“把生成先验蒸馏为快速 3D 一致网络”。\n差异：任务是从单张图像或视频生成，而非基于已标定阵列的忠实重建。没有阵列内保真度锚定，没有循环几何反馈，没有实时在线流式处理，也没有移动观看者协议。"}, {"left": "中", "url": "https://arxiv.org/abs/2606.15162", "t": "GeoStream: Toward Precise Camera Controlled Streaming Video Generation", "sub": "2026 · arXiv · 重叠度 中", "gloss": "重叠：识别出由自刷新 3D 缓存引起的几何诱导 exposure bias：来自自身输出的深度被反投影并重新渲染。它通过镜像推理时反馈的完全 on-policy 训练来修复。这在概念上就是该想法中“通过循环 TSDF/前一帧深度反馈环进行 on-policy 训练”的主张。\n差异：学生是 AR 视频 diffusion 生成器，而不是输入真实阵列帧的确定性几何引导 IBR 渲染器。它不是已标定多视角重建，也没有在留出相机上评测保真度。"}, {"left": "中", "url": "https://arxiv.org/abs/2607.05376", "t": "MV-Forcing: Long Multi-View Video Generation via 4D-Grounded Spatio-Temporal Self-Forcing", "sub": "2026 · arXiv · 重叠度 中", "gloss": "重叠：DMD 结合时空 self-forcing，并在环中加入 4D 重建，用于多视角一致的动态视频。这把 Self Forcing 与 DMD 和 4D 几何反馈结合在一起。\n差异：学生是多视角视频的 few-step diffusion 生成器。它不是由采集阵列帧驱动的实时确定性渲染器，也不是远程呈现。"}]}, {"b": "sec", "h": "实验设计", "id": "experiments"}, {"b": "h3", "t": "数据集"}, {"b": "ul", "items": ["DNA-Rendering。主数据集：约 60 相机穹顶，部分带 Kinect 深度。阵列为 4-6 相机的正面子集；远端穹顶相机（偏轴 30-90 度）提供阵列外 ground truth；立体深度来自相邻阵列相机对或多视角深度基础模型。", "ActorsHQ。约 160 台高分辨率相机，序列较少。用作留出测试集，具有稠密的阵列外 ground truth，并可通过相机链构造近似连续的伪轨迹。", "MVHumanNet / MVHumanNet++。大规模多视角人体训练数据。需核对各子集的相机数量和分钟级序列。", "CMU Panoptic（HD 相机加 Kinect）。多人和近距离交互，适合去遮挡压力测试。", "DyNeRF / Neural 3D Video 与 ENeRF-Outdoor。用于与原论文可比；阵列内指标；阵列外因无 ground truth 仅用 FVD / 判别器分数 / 用户偏好评分。", "D3DMV。可选，用于对齐原论文的第三个基准。", "用于轨迹统计的公开 6-DoF HMD 观看轨迹（需核实许可），以合成的坐姿远程呈现路径作为备选。"]}, {"b": "h3", "t": "对比基线"}, {"b": "ul", "items": ["基础配方：仅用阵列相机 ground truth 的单时刻训练（复现）。", "Base + 仅时间扭曲损失（无阵列外监督）。", "带 teacher-forced 多帧训练（ground-truth 深度反馈）的 Base，对比 on-policy。", "FreeGen 式伪标签回归：同一个冻结的 Difix/Fixer 或视频 diffusion 教师，离线将阵列外渲染精修为 L1/LPIPS 目标。", "Oracle：来自远端穹顶相机的直接监督（学生可吸收内容的上界）。", "运行时精修器：base + Difix3D+ 单步修复器、base + NVIDIA Fixer、base + transformer 时空补全（2603.05507）。每个都报告其延迟。", "有代码的 feed-forward 在线竞争方法：GPS-Gaussian（重训）、Tele360 / LiveStre4m / NSTM（若发布）。在新的移动观看者协议下评测。", "第二个学生：同一训练配方应用于 GPS-Gaussian 式像素对齐 GS 预测器。"]}, {"b": "h3", "t": "指标"}, {"b": "ul", "items": ["在穹顶 ground-truth 相机上的阵列外保真度，按与阵列的角度距离分箱（0-15、15-30、30-60、60-90 度）：PSNR、SSIM、LPIPS，以及仅限低置信度（去遮挡）像素的掩膜指标。", "无 ground truth 处的分布式阵列外质量：FVD / FID 式视频指标。", "时间：沿移动观看者、移动场景轨迹的 tLPIPS、光流扭曲误差、TCC、STED、SDT。", "漂移：1-5 分钟序列上的 PSNR/tLPIPS 衰减斜率与失效时间，分有无关键帧重置。", "视角/立体一致性：SDV、EPI 稳定性、MEt3R、双眼渲染间的视差扭曲误差。", "忠实度与幻觉：阵列内 PSNR 退化、阵列外视角的人脸身份相似度，以及高置信度像素中的幻觉率（应约为 0）。", "目标 GPU 上的端到端延迟，深度估计单独报告。", "自由头动的 HMD 用户研究：2AFC 偏好与舒适度（n≈20）。"]}, {"b": "h3", "t": "关键消融"}, {"b": "ul", "items": ["On-policy 展开 vs teacher-forced 训练，以及 rollout/BPTT 长度（4/8/16）。", "判别器类型：对抗视频判别器 vs DMD vs 伪标签回归 vs 组合，均使用同一教师。", "置信度门控：无 vs TSDF 权重门控 vs 可见计数门控；对阵列内保真度和幻觉率的影响。", "可学习 vs 固定融合超参数（tau、beta、eta、mask），以及 ConvGRU 状态开/关。", "轨迹分布：仅近阵列 vs 课程学习至 2 倍基线；合成路径 vs 由 HMD 轨迹导出的路径。", "教师选择：Difix/Fixer（单步图像）vs SEVA 级多视角 vs Diffuman4D（4D 人体）。", "学生容量：U-Net 宽度 vs 阵列外增益 vs 延迟（Pareto 曲线），以回应容量上限质疑。", "弥补的 oracle 差距比例随阵列相机数量（2/4/6）的变化。"]}, {"b": "h3", "t": "采集说明"}, {"b": "p", "t": "核心论文不需要自建采集。稠密穹顶人体数据集（DNA-Rendering、ActorsHQ、MVHumanNet）同时提供阵列子集和远端阵列外 ground truth，DyNeRF/ENeRF-Outdoor 覆盖一般场景。\n\n注意事项：\n- DNA-Rendering 和 MVHumanNet 需要签署许可协议，耗时较长。\n- 阵列子集的深度必须计算（在相邻相机对上用立体基础模型，或用多视角深度基础模型），并单独报告其延迟。\n- 穹顶相机是静态的，因此不存在真正的移动相机 ground truth。用相机链伪轨迹近似，逐帧与最近的穹顶相机比较，并辅以无参考的时间指标。\n\n可选：一个小型 4 相机桌面阵列（约 2-4k 美元）可以加强 HMD 用户研究，以及“无需穹顶、直接在部署阵列上训练”的主张。它不是被接收的必要条件。"}, {"b": "sec", "h": "两周内的验证实验", "id": "two-weeks"}, {"b": "p", "t": "一个跳过 DMD 的容量与监督探针实验。\n\n第 1-5 天：在 10-20 个 DNA-Rendering 序列上搭建最小学生模型：\n- 4 台正面阵列相机，深度来自立体或多视角深度基础模型，预先计算。\n- 逐视角前向 splatting，然后在 512 px 下用带 I_BG 的 U-Net 融合。\n- 先跳过 TSDF，使用最近视角深度。\n\n第 6-12 天：训练四个变体，每个约 30k 次迭代、各用一块 GPU：\n- (A) 仅阵列 ground truth：基础配方。\n- (B) A 加 FreeGen 式伪标签，由冻结的 Difix/Fixer 在偏离 15-60 度的相机位置的阵列外渲染上生成。\n- (C) A 加在相同阵列外渲染上、由可见计数门控的条件 patch/视频判别器。\n- (D) Oracle：A 加来自这些位置真实穹顶相机的直接监督。\n\n在留出的远端穹顶相机和去遮挡像素掩膜上评测 LPIPS/PSNR。\n\n并行（第 8-14 天）：加入朴素的前一帧深度反馈并展开 300 帧。在漂移斜率上比较 teacher-forced 与 2k 次迭代的 on-policy 微调（8 帧 BPTT）。\n\n结果解读：\n- 若 D 不优于 A，学生已达容量上限；放弃该想法或加宽学生模型。\n- 若 C 和 B 都无法缩小 A-D 差距，则先验无济于事。\n- 若 B 弥补了大部分差距而 C 不优于 B，则判别器主张失效；重新定位为基准加 on-policy 论文。\n- 漂移实验告诉你 exposure bias 在这个闭环中是否可测量。"}, {"b": "sec", "h": "止损标准", "id": "kill"}, {"b": "p", "t": "若在至少 2 个随机种子上出现以下任一情况，则放弃或重新定位：\n(1) 容量终止。在 40 ms 以内，穹顶 GT oracle 相比仅阵列配方在阵列外 LPIPS 上的相对改善不足 10%。快速学生无法吸收阵列外知识，因此任何先验都帮不上。转向运行时精修器论文。\n(2) 先验终止。在远端（30-60 度）相机上，判别器训练和伪标签训练都无法弥补仅阵列到 oracle 差距的至少 25%。\n(3) 判别器终止。置信度门控判别器在 LPIPS 上未能以至少 0.01 的优势、或在时间指标（tLPIPS/TCC）上优于 FreeGen 式伪标签回归。贡献于是退化为“面向远程呈现的 FreeGen”；只保留基准加 on-policy 部分，目标改为 TVCG/IEEE VR。\n(4) On-policy 终止。1 分钟序列上 teacher-forced 与 on-policy 的漂移差异小于 10%，说明 exposure bias 在这个闭环中不是真实现象。删除 self-forcing 主张。\n(5) 保真度终止。阵列内 PSNR 退化超过 0.3 dB，或高置信度像素中的幻觉率不可忽略，这对远程呈现不可接受。\n(6) 投稿前的撞车检查：出现一篇 2026-27 年的论文，用阵列外 diffusion 判别器和 on-policy 循环 rollout 训练在线人体或场景渲染器。"}, {"b": "sec", "h": "审稿人可能的质疑与回应", "id": "objections"}, {"b": "p", "t": "这就是把 FreeGen / Lyra / DriveX 用到远程呈现上：在没有 ground truth 的视角上将生成先验蒸馏到快速渲染器中已经发表过。", "label": "质疑"}, {"b": "p", "t": "这一通用思路我们承认并引用。新的、并经实验证明的内容是：\n(i) 在动态场景中通过循环几何反馈环进行 on-policy 训练，并测量到漂移降低。FreeGen、Lyra 和 DriveX 都没有循环。\n(ii) 在相同教师和学生下对监督类型的正面比较：置信度门控的分布判别器在去遮挡像素 LPIPS 和时间指标上优于 FreeGen 式伪标签。\n(iii) 推理时零 diffusion，40 ms 以内，而 FreeGen 和 GIFSplat 保留生成分支。\n(iv) 带 oracle 上界的移动观看者基准。", "label": "回应"}, {"b": "p", "t": "稠密穹顶提供了阵列外 ground truth。为什么要无 GT？直接用额外的穹顶相机监督就行了。", "label": "质疑"}, {"b": "p", "t": "我们确实训练了这个 oracle，它是上界。我们的主张是仅用阵列数据能弥补多少 oracle 差距。这很重要，因为部署阵列（4 相机桌面阵列、类 Beam 的隔间）没有穹顶，穹顶只覆盖影棚中的人体，而且穹顶相机是离散且静态的，无法监督连续的移动观看者视频。我们还展示了组合：在穹顶相机之间的连续轨迹上，oracle 加判别器在时间指标上优于单独的 oracle。", "label": "回应"}, {"b": "p", "t": "幻觉出内容对远程呈现的保真度是危险的：判别器会编造细节并改变身份。", "label": "质疑"}, {"b": "p", "t": "判别器梯度由管线自身的 TSDF 和可见性置信度门控，并保留阵列内 ground-truth 锚定。我们报告 (a) 阵列内 PSNR 退化不超过 0.2 dB，(b) 仅限高置信度像素的幻觉率与误差，(c) 阵列外视角的人脸身份相似度。对门控的消融展示了门控所避免的保真度代价。", "label": "回应"}, {"b": "p", "t": "一个很小的逐帧 U-Net 吸收不了视频 diffusion 先验，而用强条件多视角教师做 DMD 对小实验室来说既不稳定又耗算力。", "label": "质疑"}, {"b": "p", "t": "容量-延迟 Pareto 曲线和穹顶 oracle 直接度量可吸收的空间。我们还加入了 ConvGRU 状态。主要判别器是基于冻结特征的廉价条件视频判别器；DMD 是降分辨率下的消融。我们报告随机种子、教师选择（Difix/Fixer vs SEVA 级 vs Diffuman4D）和 GPU 小时。论文的主张并不特别依赖 DMD。", "label": "回应"}, {"b": "p", "t": "原管线已经过时：启发式 TSDF、640 px、无代码，而竞争方法（Tele360、LiveStre4m、NSTM）是无位姿 feed-forward。结果可能无法迁移。", "label": "质疑"}, {"b": "p", "t": "该配方与学生模型无关，并在两个学生上展示：几何引导 IBR 复现和像素对齐 GS 预测器。无位姿竞争方法在新的移动观看者协议下评测，而它们都没有报告过该协议。无论哪个学生胜出，基准和漂移发现都成立。", "label": "回应"}, {"b": "sec", "h": "投入", "id": "effort"}, {"b": "kv", "items": [["周期", "7-9 个月（约 1.5 个月复现原管线，因为没有官方代码；另约 1 个月用于数据许可和深度预计算）"], ["人力", "2 人（一名博士生负责渲染器和 on-policy 训练，一名负责判别器/教师以及基准和用户研究）"], ["算力", "4-8 块 80 GB GPU（A100/H100 级），总计约 3-6k GPU 小时。仅判别器路径可在 4 块 48 GB GPU 上运行；带 1-2B 视频教师的 DMD 变体需要 80 GB 显卡，并占据预算的主要部分。"], ["目标会议", "ICCV 2027（首选）。CVPR 2027 截稿对复现加新基准来说太近。若 HMD 用户研究和系统部分有力，SIGGRAPH Asia 2027 为备选。若结果主要是移动观看者基准加用户研究，则投 IEEE VR / TVCG。"]]}, {"b": "sec", "h": "可组合的方向", "id": "synergies"}, {"b": "p", "t": "- 学习的时间记忆与长时漂移（用 ConvGRU 或 TTT 状态替代 TSDF 加颜色 mask 启发式这一领域空白）。本文提供了这种记忆所需的 on-policy 训练，二者可合并为一篇更强的论文：“在自身 rollout 上训练的循环在线渲染器”。\\n- 运行时 diffusion 修复器方向（Difix/Fixer 精修器）。它是天然的基线和教师，因此二者构成一个系列：运行时修复器 vs 被蒸馏掉的修复器。\\n- 概率/不确定性感知融合。校准更好的置信度直接改善判别器门控。\\n- 统一的在线远程呈现基准（分钟级序列、失同步和光照压力测试）。这里的移动观看者、阵列外 GT 协议可以作为其核心。\\n- 立体/HMD 渲染与发送端/接收端分离设计。接收端零额外开销适合一体式 HMD 以及经编解码器传输的 RGB-D 或 Gaussian 图。\\n- 无位姿 feed-forward 实时 NVS（Tele360、LiveStre4m）。与学生无关的配方可迁移到它们上。\\n\\n本次审阅中打开或看到的来源：\\n- FreeGen https://arxiv.org/abs/2512.04830\\n- Streaming4D https://arxiv.org/abs/2609.00610（Self-Forcing 生成器加增量重建；不构成威胁）\\n- 用于稀疏多相机 3D 流式传输的 Transformer 补全 https://arxiv.org/abs/2603.05507\\n- 另加新颖性报告中经核实的 URL：2509.19296、2511.14208、2606.15162、2607.05376、2506.08009、2503.01774、2609.21176、2412.01717、2507.13344\\n- 领域条目：Tele360 2609.15032、LiveStre4m 2604.06740、NSTM 2607.15271\\n\\nWebSearch 预算已用尽，arXiv/Semantic Scholar API 返回 429，因此 2026 年人体化身文献未在新颖性报告之外重新检索。"}], "toc": false, "series": {"prev": {"k": "idea-C11"}, "next": {"k": "idea-C08"}, "up": {"u": "future/index.html", "t": "Directions 目录"}}}}</script>
<script>
(function () {

  var DATA;
  try { DATA = JSON.parse(document.getElementById("data").textContent); } catch (e) { DATA = {}; }
  var meta = DATA.meta || {};

  // ---------- DOM helpers: all text goes through textContent; external links are https-only ----------
  function safeUrl(u) { if (typeof u !== "string") return null; var s = u.trim(); return /^https:\/\/[^\s"'<>]+$/i.test(s) ? s : null; }
  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (!Object.prototype.hasOwnProperty.call(attrs, k)) continue;
      var v = attrs[k];
      if (v === null || v === undefined || v === false) continue;
      if (k === "class") n.className = v;
      else if (k === "text") n.textContent = String(v);
      else if (k === "href") { var u = safeUrl(v); if (u) { n.setAttribute("href", u); n.setAttribute("target", "_blank"); n.setAttribute("rel", "noopener noreferrer"); } }
      else if (k.slice(0, 2) === "on" && typeof v === "function") n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, String(v));
    }
    (kids || []).forEach(function (c) { if (c === null || c === undefined || c === false) return; n.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return n;
  }
  var SVGNS = "http://www.w3.org/2000/svg";
  function sv(tag, attrs, kids) {
    var n = document.createElementNS(SVGNS, tag);
    if (attrs) for (var k in attrs) {
      if (!Object.prototype.hasOwnProperty.call(attrs, k)) continue;
      var v = attrs[k];
      if (v === null || v === undefined || v === false) continue;
      if (k === "text") n.textContent = String(v);
      else if (k.slice(0, 2) === "on" && typeof v === "function") n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, String(v));
    }
    (kids || []).forEach(function (c) { if (c) n.appendChild(c); });
    return n;
  }
  function arr(x) { return Array.isArray(x) ? x : []; }
  function str(x) { return typeof x === "string" ? x : (x === null || x === undefined ? "" : String(x)); }
  function paras(text) { return str(text).split(/\n\s*\n/).map(function (t) { return t.trim(); }).filter(Boolean).map(function (t) { return el("p", null, rich(t)); }); }
  function link(title, url) { return safeUrl(url) ? el("a", { href: url, text: title }) : el("span", { text: title }); }

        art.appendChild(box);
        return;
      }
      render(b).forEach(function (n) { if (n) cur().appendChild(n); });
    });

    var S = PG.series || {};
    if (S.prev || S.next || S.up) {
      var nav = el("nav", { class: "series", "aria-label": "同系列" });
      nav.appendChild(el("div", { class: "prev" }, S.prev ? [el("small", { text: "上一篇" }), part(S.prev)] : []));
      nav.appendChild(el("div", { class: "up" }, S.up ? [part(S.up)] : []));
      nav.appendChild(el("div", { class: "next" }, S.next ? [el("small", { text: "下一篇" }), part(S.next)] : []));
      art.appendChild(nav);
    }
  })();

  finishPage();
})();
</script>
</body>
</html>
