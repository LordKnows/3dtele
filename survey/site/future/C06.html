<script type="application/json" id="data">{"site": {"brand": "3D 临场研究图谱", "root": "../", "path": "future/C06.html", "nav": [{"key": "overview", "label": "Overview", "items": [["Introduction", "index.html"], ["Methodology", "overview/methodology.html"], ["How to use", "overview/how-to-use.html"]]}, {"key": "basics", "label": "Basics", "items": [["Routes", "basics/routes/index.html"], ["Foundations", "basics/foundations/index.html"], ["Advanced topics", "basics/advanced/index.html"], ["Classics", "basics/classics/index.html"], ["Glossary", "basics/glossary.html"]]}, {"key": "works", "label": "Works", "items": [["Papers", "works/papers/index.html"], ["Walkthrough", "works/walkthrough/index.html"], ["Field map", "works/field-map.html"], ["Sub areas", "works/areas/index.html"]]}, {"key": "future", "label": "Future", "items": [["Directions", "future/index.html"], ["Trends & Challenges", "future/trends.html"]]}], "navCur": "future", "navItem": "future/index.html", "crumbs": [["Future", ""], ["Directions", "future/index.html"]], "date": "2026-09-28"}, "xref": {"idea-C01": {"u": "future/C01.html", "t": "从几何中恢复时钟：基于深度融合残差的在线亚帧同步，用于非同步采集阵列上的实时 3D 视频", "e": "Clocks from Geometry: Online Sub-Frame Synchronization from Depth-Fusion Residuals for Live 3D Video on Unsynchronized Rigs", "m": "Directions · 第 6 名 · 综合 5.5", "s": "实时 image-based TSDF 本就会计算的有符号距离残差，可以作为每台相机亚帧时钟偏移的传感器。"}, "idea-C04": {"u": "future/C04.html", "t": "TRUST-Rig：面向实时多视角 3D 视频的来源认证生成式补全——由采集阵列自身的空闲相机在线标定", "e": "TRUST-Rig: Provenance-Certified Generative Completion for Live Multi-View 3D Video, Calibrated Online by the Rig's Own Idle Cameras", "m": "Directions · 第 4 名 · 综合 6", "s": "固定的已标定采集阵列中，总有一些相机未被当前视角使用，这些相机免费提供 ground truth。"}}, "page": {"id": "idea-C06", "head": {"title": "高光有自己的视差：面向多视角 3D 视频的、具有分层时间动态的在线双层反射感知 IBR", "sub": "Highlights Have Their Own Parallax: Online Two-Layer Reflection-Aware IBR with Layer-Specific Temporal Dynamics for Multi-View 3D Video", "meta": ["第 5 名", "重新定位后推进", "查新：部分已被做"], "epigraph": "把每一帧几何引导 IBR 拆成漫反射层和镜面层。漫反射层由经过强时间滤波的 TSDF 表面扭曲；镜面层由在线逐帧估计的虚拟反射深度扭曲，并使用低惯性记忆。于是高光以正确的视差移动，不再出现跨视角重影和时间闪烁，每帧额外开销约 10 ms。", "prereqs": [], "lede": "", "minutes": 14}, "body": [{"b": "sec", "h": "评分", "id": "scores"}, {"b": "kv", "items": [["综合", "5.5"], ["新颖", "5.5"], ["意义", "6"], ["可行", "5"], ["临场契合", "8"]]}, {"b": "sec", "h": "核心论点（可证伪）", "id": "claim"}, {"b": "p", "t": "在相同网络容量和运行时（相对 Ha et al. 式管线开销不超过 12 ms）下，四项改动共同使镜面掩膜像素上的视角和时间不一致性降低至少 25%，以留出相机上的 EPI 不连续性和光流扭曲时间误差（tOF/STED）度量。四项改动为：(a) 由反射深度扭曲的第二个镜面层；(b) 分层时间滤波；(c) 镜面感知的 (1 − s) TSDF 加权；(d) 针对光泽像素、由熵门控的视角条件回退。镜面掩膜 PSNR 也提升至少 0.7 dB。三个对照作为参照：(i) 单层表面扭曲，(ii) 同等容量的视角条件残差头（ViewSplat/IBGS 式），(iii) 任何单一共享时间滤波器，它无法达到同样的闪烁-滞后 Pareto 点。全帧指标不得退化。若 oracle 双层拆分（GT 分离加最佳反射深度）无法以上述幅度优于单层扭曲，或同等容量残差头在 EPI 和时间指标上与本方法持平，则该主张被证伪。"}, {"b": "sec", "h": "关键洞察", "id": "insight"}, {"b": "p", "t": "几何引导 IBR 中镜面外观之所以失败，是因为它与表面有不同的运动学，而不是因为表面深度有噪声。反射是一个具有自身深度的虚像：\n- 对平面屏幕或镜子，虚深度是反射距离。\n- 对远处光源照亮的凸光泽表面（眼镜镜片、角膜、颧骨、金属锅），由镜面方程，虚像位于表面后方约 R/2 处。\n因此逐像素虚深度是高光视差的一个有物理依据的一阶模型，并且可以通过只对 TSDF 表面后方的跨视角不一致残差做 plane-sweep 在线估计。\n\n层的分离同时也分离了它们的时间统计：表面几何变化缓慢，应该有长记忆；而高光随观看者、光源和头部的小幅转动而移动，需要由自身深度扭曲的短记忆。单一时间滤波器必须在滞后与闪烁之间折中；两个滤波器则不必。\n\n在反射深度代价体平坦的地方（粗糙光泽），其熵就是回退到视角条件角度融合的信号。这种回退吸收了“概率深度加光场回退”思路中有用的部分，而不把概率融合声称为新颖。"}, {"b": "sec", "h": "方法", "id": "method"}, {"b": "p", "t": "前端（在延迟预算之内，这一点与原论文不同）：\n- 逐视角深度来自在自动选择的相邻相机对上运行的 Fast-FoundationStereo，或来自传感器 RGB-D。\n- 一个对齐到立体尺度的廉价单目先验（流式 Video Depth Anything 或类似方法）。单目-立体不一致图 u_n 保留为不可靠性线索。\n\n(1) 镜面与不可靠性检测（免训练核心加一个很小的 CNN）：\n- 对每个目标像素 raymarch 原论文的基于图像的 TSDF，并将表面点重投影到 K 个视角。\n- 计算跨视角的鲁棒颜色离散度（按曝光和传感器噪声归一化），以及饱和度、u_n 和反射向量对齐度 dot(reflect(target ray, n), input ray_k)。\n- 一个 3 层 CNN 将这些特征映射为 s ∈ [0,1]。监督：合成的 GT 光泽通道 mask，以及真实数据上的留一视角一致性损失。\n\n(2) 镜面感知几何：\n- TSDF 融合权重变为 ω_k·(1 − s_k)，使反射不会把表面拉向虚像。\n\n(3) 逐输入视角的层分离：\n- 漫反射 D = 表面处重投影跨视角样本的鲁棒低分位数或中位数（Lambertian 共识）。\n- 镜面残差 S = max(I − D, 0)，并对高光覆盖至少 K/2 个视角的情况加入学习的校正。\n\n(4) 反射深度：\n- 只在 s > τ 的像素上（通常为 3-15% 的像素），沿反射光线参数化在表面后方扫 24-32 个虚深度，对 S 的跨视角一致性打分。\n- Soft-argmin 给出 d_r。保留归一化代价体熵 h。\n\n(5) 渲染：\n- 原论文的像素大小不透明 Gaussian 被前向 splat 两次：漫反射层使用表面深度，镜面层（仅稀疏像素）使用 d_r。\n- 光泽回退路径在表面深度处用视角角度（Unstructured Lumigraph 式）权重融合 S。\n- U-Net 融合器接收两个层、s、h、法线和反射向量特征。它输出漫反射权重、镜面权重，以及由 h 门控的回退混合比例。\n\n(6) 时间：\n- 漫反射层保留原论文的 TSDF 反馈和颜色差门控滤波；长记忆没有问题。\n- 镜面层保留一个短的指数记忆，帧间由 d_r 诱导的光流（而非表面光流）扭曲。其学习到的惯性以 s 和 h 为条件。\n\n损失：\n- L1 + SSIM + LPIPS，加上镜面掩膜损失（权重 2-4 倍）。\n- 逐层施加的光流扭曲时间损失：漫反射层由表面诱导光流扭曲，镜面层由反射诱导光流扭曲。\n- 在合成 GT 漫反射和光泽通道上的层监督 L1。\n- 合成数据上的反射深度损失，其 GT 虚深度可由镜面方程或路径追踪计算。\n\n训练数据：\n- 原论文的数据：ScanNet、DyNeRF 训练场景和 Spaces。\n- 约 200 段合成 PBR 多视角视频片段（12-16 台相机，Blender Cycles，漫反射与光泽通道分离）：佩戴眼镜的 THuman/RenderPeople 式扫描人体、反射动画房间的笔记本和显示器屏幕、金属厨具、光泽皮肤着色器，以及带 HDRI 的移动光源。\n\n运行时预算：\n- 基础在 1352x1014、TensorRT 下约 39 ms。\n- 检测器 2 ms，稀疏扫描 3-5 ms，第二次稀疏 splat 2-3 ms，融合器额外通道约 2 ms。\n- 目标开销不超过 12 ms，立体前端时间单独并端到端报告。"}, {"b": "sec", "h": "为什么不是工程改进", "id": "not-engineering"}, {"b": "p", "t": "有四点使其成为研究贡献而非系统调优：\n\n(a) 一个有物理依据、并与强学习替代方案对比检验的建模主张。该主张是：高光视差可以很好地由每像素单一虚深度建模（镜面方程，凸光泽用 R/2 近似）。它通过 oracle 空间研究和同等容量的视角条件残差基线来检验。\n\n(b) 一个时间动态发现：分离的层允许各自最优的时间滤波器。以 Pareto 曲线（闪烁 vs 滞后）展示，这是任何单一共享滤波器都达不到的折中。以往的双层反射 IBR（Sinha 2012；Xu 2021）是静态的，从未揭示这一点。\n\n(c) 一个解释几何引导何时有用的失效分析。它表明被镜面污染的 TSDF 深度是原论文 TSDF 消融结果为零（31.16 vs 31.17 dB）的原因之一，因为 (1 − s) 加权恰好在几何出错的地方改变了几何。\n\n(d) 首个在远程呈现内容（眼镜、屏幕、光泽皮肤）上、具有留出相机 GT 且视角 × 时间一致性指标限定于镜面区域的基准。\n\n没有任何组件只是更大的网络。消融分别隔离了表示、估计器、时间模型和几何加权。"}, {"b": "sec", "h": "与已有工作的区分", "id": "differentiation"}, {"b": "p", "t": "vs Sinha et al. SIGGRAPH 2012 (https://dl.acm.org/doi/10.1145/2185520.2185596) 与 Xu et al. SIGGRAPH 2021 (http://www.cad.zju.edu.cn/home/weiweixu/wwxu2021.files/ReflectiveIBR.pdf)：\n- 相同的双层（前表面加虚拟反射几何）表示。必须作为先驱引用，且不得声称其新颖。\n- 它们是离线、静态、基于网格和优化的。我们是 feed-forward、逐帧在线估计、在动态视频上运行，并加入分层时间滤波和镜面感知几何融合。\n\nvs Broxton et al. 2020 (https://dl.acm.org/doi/10.1145/3386569.3392485) 与 Quark 2024 (https://arxiv.org/abs/2411.16680)：\n- 它们的多层表示只是把反射隐式地作为通用的额外层来捕获。\n- 它们没有显式镜面检测、没有反射深度估计、没有漫反射/镜面拆分、没有分层时间模型，也没有镜面掩膜一致性评测。\n- 必须纳入 Quark 式分层基线，以展示在相同运行时下显式反射深度在 EPI 和时间指标上优于通用层。\n\nvs IBGS (https://arxiv.org/abs/2511.14357) 与 ViewSplat (https://arxiv.org/abs/2603.25265)：\n- 它们的视角条件残差提升了单帧镜面 PSNR，但没有视差模型，也没有时间项。IBGS 是逐场景的；ViewSplat 是静态且逐帧的。\n- 我们的关键消融用同等容量的残差头替换我们的镜面层。\n\nvs Soft3D (https://dl.acm.org/doi/10.1145/3130800.3130855)、Self-Supervised Visibility Learning (https://arxiv.org/abs/2103.15407) 与 NeuRay (https://arxiv.org/abs/2107.13421)：\n- 沿目标光线的概率深度融合已经成熟，因此我们不声称它。\n- 我们只把反射扫描的代价体熵用作光泽回退的门控。\n\nvs 逐场景动态镜面方法 NeRF-DS (https://arxiv.org/abs/2303.14435) 与 TraceFlow (https://arxiv.org/abs/2512.10095)：\n- 它们基于优化且离线。它们作为质量上界，而非竞争方法。\n\nvs Ref-GeNVS (https://arxiv.org/abs/2609.05382)：\n- 生成式、仅限镜子、离线。\n\nvs Stereo Anywhere (https://arxiv.org/abs/2412.04472) 与 Fast-FoundationStereo (https://arxiv.org/abs/2512.11130)：\n- 仅作为深度来源。它们用作我们的前端，我们会展示仅靠更好的深度并不能修复高光重影和闪烁。这就是基线“base + FM stereo”。"}, {"b": "sec", "h": "查新后剩余的可辩护新意", "id": "novel-angle"}, {"b": "p", "t": "我没有找到任何 2024-2026 年的工作在一个在线、FEED-FORWARD、固定阵列的多视角视频管线中结合以下内容：\n(i) 只对 TSDF 表面点处的跨视角不一致（镜面）残差做 plane-sweep，显式估计逐帧的第二个“反射深度”；\n(ii) 用各自的深度前向 splat 漫反射层和镜面层；\n(iii) 给它们不同的时间滤波器：漫反射用重的 TSDF 记忆，镜面用低惯性、由反射深度扭曲的记忆；\n(iv) 在远程呈现内容（眼镜、皮肤、屏幕）上用限定于镜面区域的时间和视角一致性指标（高光 mask 上的 EPI/STED/TCC）评测。\n\n双层表示本身并不新颖（Sinha 2012；Xu 2021，构思者未引用后者）。从固定阵列视频中隐式地用多层处理反射也不新颖（DeepView/Broxton 2020；实时方面有 Quark 2024）。用跨视角光度离散度作为镜面检测器是教科书式 MVS。\n\n因此可辩护的主张是狭窄的：首个在线、带时间滤波的双层反射 IBR，其分层时间动态解决了滞后与闪烁的权衡，外加一个镜面远程呈现一致性基准。\n\nIdea B 更弱。沿目标光线融合并端到端训练的逐视角概率深度分布已经成熟：Soft3D 2017、Self-Supervised Visibility Learning CVPR 2021、NeuRay CVPR 2022。逐像素 Kalman 深度滤波和立体不确定性头也是经典方法。剩下的是一个系统层面的发现：经校准的立体基础模型不确定性（单目-立体不一致），通过一个时间上 Kalman 滤波的实时融合传递，门控几何扭曲与 Unstructured-Lumigraph 式回退之间的切换。它最可发表的部分大概是解释原论文 TSDF 消融为零的诊断，而不是融合算子本身。"}, {"b": "sec", "h": "主要撞车风险（查新找到的相近工作）", "id": "threats"}, {"b": "refs", "items": [{"left": "高", "url": "http://www.cad.zju.edu.cn/home/weiweixu/wwxu2021.files/ReflectiveIBR.pdf", "t": "Scalable Image-based Indoor Scene Rendering with Reflections (Xu et al.)", "sub": "2021 · ACM TOG / SIGGRAPH 2021 · 重叠度 高", "gloss": "重叠：Idea A 的核心表示洞见：前层（RGB-D 表面）加后层（位于虚深度的反射几何），二者都用于 IBR 扭曲，并合成以最小化新视角误差。在已发表的双层反射 IBR 中它是最接近的先驱，比 Sinha 2012 更接近，而构思者没有引用它。\n差异：它是离线的，使用全局网格引导的交替优化，针对静态室内场景。没有 feed-forward 推理，没有在线逐帧反射深度，没有时间滤波，也没有动态内容。"}, {"left": "中", "url": "https://dl.acm.org/doi/10.1145/3386569.3392485", "t": "Immersive Light Field Video with a Layered Mesh Representation (Broxton et al.)", "sub": "2020 · ACM TOG / SIGGRAPH 2020 · 重叠度 中", "gloss": "重叠：一种从固定相机阵列学习得到（DeepView）的 feed-forward 多层表示，用于多视角视频。它通过把内容放在位于虚深度的额外层上，显式地再现视角相关的反射和半透明，这是 Idea A “第二视差层”的隐式版本。\n差异：这些层是通用的（MPI/shell 压缩为 RGBA+深度）。没有显式镜面检测或反射深度估计，没有漫反射/镜面拆分，没有分层时间滤波，没有 TSDF 几何，也不是在线远程呈现管线。"}, {"left": "中", "url": "https://arxiv.org/abs/2411.16680", "t": "Quark: Real-time, High-resolution, and General Neural View Synthesis", "sub": "2024 · ACM TOG / SIGGRAPH Asia 2024 · 重叠度 中", "gloss": "重叠：从稀疏视频流进行实时（1080p，30 fps）feed-forward 分层深度图视角合成。半透明层可以隐式地在虚深度表示反射。它是“每像素多于一个深度”方面最强的实时 feed-forward 基线。\n差异：摘要和项目页面没有显式的反射或镜面建模主张，也没有描述时间一致性机制。没有在镜面残差上的反射深度扫描，没有镜面感知几何融合，也没有分离的时间滤波器。"}, {"left": "高", "url": "https://arxiv.org/abs/2103.15407", "t": "Self-Supervised Visibility Learning for Novel View Synthesis", "sub": "2021 · CVPR 2021 · 重叠度 高", "gloss": "重叠：Idea B 的“概率目标光线融合”：逐源视角可见性构建共识体，软光线投射得到目标视角深度的概率分布。源像素用它扭曲并融合，由合成损失端到端训练。这是硬融合的一种学习的、可微的推广。\n差异：它是静态且逐帧的，没有来自立体基础模型的校准逐视角不确定性，没有时间（Kalman）滤波，没有光场回退模式，也不关注镜面。"}, {"left": "中", "url": "https://arxiv.org/abs/2107.13421", "t": "Neural Rays for Occlusion-aware Image-based Rendering (NeuRay)", "sub": "2022 · CVPR 2022 · 重叠度 中", "gloss": "重叠：逐输入视角的像素特征被解码为 mixture-of-logistics 深度分布，用于在可泛化 IBR 中计算沿目标光线的逐视角可见性。这本质上就是“沿目标光线融合逐视角深度分布”。\n差异：它是 NeRF 式体渲染，非实时，静态，没有时间滤波，没有光场回退，也没有针对立体基础模型的不确定性校准。"}]}, {"b": "sec", "h": "实验设计", "id": "experiments"}, {"b": "h3", "t": "数据集"}, {"b": "ul", "items": ["DyNeRF / Neural 3D Video（公开；金属平底锅和锅、coffee_martini 中的玻璃杯、镜面厨房表面；原论文协议，也是主要的可比真实基准）", "D3DMV 与 ENeRF-Outdoor（公开；仅用于全帧无退化数值，因为它们镜面内容很少）", "Technicolor light-field video，4x4 阵列（公开；稠密阵列，适合留二的“更宽间隙”留出视角；需逐序列检查镜面内容）", "DNA-Rendering 和/或 ActorsHQ（申请后公开；多视角人体，部分有光泽衣物或配饰，可能有眼镜；依赖之前需逐序列核实眼镜和光泽材质的存在）", "自渲染的合成 PBR 多视角视频（约 200 段，12-16 台相机，Blender Cycles 漫反射与光泽通道：戴眼镜的扫描人体、反射动画房间的屏幕、金属道具、移动光源）。提供 GT 层拆分、GT 反射深度和自由轨迹 GT", "自建远程呈现镜面采集（10-15 段，每段 30-60 s）：眼镜、笔记本和显示器屏幕、主光下的光泽皮肤、光泽桌面和一面小镜子。8-12 台 genlock 同步相机（机器视觉相机或同步线连接的 RGB-D，如 Azure Kinect / Orbbec Femto），2-4 台留出相机，包括一个留二宽间隙。作为基准发布"]}, {"b": "h3", "t": "对比基线"}, {"b": "ul", "items": ["原论文（Ha et al. CVPR 2025），因未发布代码而复现：使用 RAFT-Stereo，以及使用 Fast-FoundationStereo / Stereo Anywhere 深度（“仅更好的深度”）", "同一 backbone 上同等容量的视角条件残差头（ViewSplat/IBGS 式）；关键的消融基线", "Quark 式或 DeepView 式分层深度基线（如无代码则复现），用于“通用层 vs 显式反射深度”", "ENeRF 与 GPS-Gaussian+（公开代码；feed-forward 可泛化基线）", "逐场景上界：IBGS（静态、逐帧）、4DGS，以及在代码允许时的 NeRF-DS 或 TraceFlow", "扫描惯性的单一共享时间滤波器（相对分层滤波器的 Pareto 基线）"]}, {"b": "h3", "t": "指标"}, {"b": "ul", "items": ["全帧 PSNR / SSIM / LPIPS（无退化检查）", "镜面掩膜 PSNR / LPIPS（mask 来自合成光泽通道；真实数据上来自检测器，并由人工标注子集审核）", "镜面掩膜视角一致性：沿相机扫掠的 EPI 不连续性 / SDV、MEt3R", "镜面掩膜时间一致性：tOF、STED/SDT、TCC，以及闪烁频谱能量度量", "滞后指标：高光位置相对 GT 的时间互相关延迟（合成数据），用于绘制闪烁-滞后 Pareto 曲线", "高光位置误差（像素）与反射深度误差（合成 GT）", "几何：有无 (1 − s) 加权时镜面像素上的深度误差（合成 GT；真实数据上在可用处使用传感器深度）", "端到端延迟，包括立体前端，注明 GPU；逐模块分解", "在 HMD / 头部追踪显示器上的 2AFC 用户研究：高光真实感与闪烁偏好"]}, {"b": "h3", "t": "关键消融"}, {"b": "ul", "items": ["Oracle 空间：GT 层拆分 + GT 反射深度 vs 单层表面扭曲（该想法的上界）", "无层拆分（base）vs 双层且镜面层由表面深度扭曲 vs 由反射深度扭曲（隔离视差模型）", "用同等容量的视角条件残差头替换显式镜面层", "共享 vs 分层时间滤波（关于惯性的 Pareto 曲线）", "有无 (1 − s) TSDF 加权，包括它是否能把原论文为零的 TSDF 消融变成镜面内容上的可测量增益", "熵门控光泽回退开/关，按合成粗糙度分层", "输入视角数 K ∈ {2,4,6,8}（高光覆盖大多数视角时中位数漫反射失效）", "深度前端：RAFT-Stereo vs Fast-FoundationStereo vs 传感器深度 vs 单目-立体融合"]}, {"b": "h3", "t": "需要自建采集"}, {"b": "p", "t": "公开多视角视频数据集中，与远程呈现相关且带留出相机的镜面内容很少。DyNeRF 有平底锅、锅和玻璃杯。眼镜和屏幕在 DNA-Rendering / ActorsHQ 中至多是偶然出现，需要核实。因此远程呈现主张和基准需要一个小规模的自建采集。\n\n预算：\n- 8-12 台 genlock 全局快门机器视觉相机，或同步线连接的 RGB-D 相机，约 4-10k 美元。\n- 一台采集 PC、一块色卡和一块标定板。\n\n协议：\n- 10-15 段序列，包含眼镜、笔记本和显示器屏幕、主光下的光泽皮肤和光泽桌面。\n- 多种光照设置，包括一个移动光源。\n- 2-4 台留出相机，包括一个留二宽间隙，以免反射视差误差被极小的插值基线掩盖。\n\n合成 PBR 数据集对于层和反射深度 GT 以及自由轨迹是必不可少的。它需要约 2-3 周的搭建，外加在几块 GPU 上的渲染时间。\n\n知情同意与隐私：发布基准前，实验室志愿者的面部需要签署授权书。"}, {"b": "sec", "h": "两周内的验证实验", "id": "two-weeks"}, {"b": "p", "t": "一个非学习的 oracle 与估计器空间研究（不训练网络）。\n\n第 1-4 天，合成数据：\n- 在 Blender Cycles 中渲染 3 段短合成片段：12 台相机、60 帧，漫反射和光泽通道分离，带 GT 深度。\n- 片段 (a)：移动主光下戴眼镜的头部。片段 (b)：反射动画房间的显示器。片段 (c)：旋转的光泽金属锅。\n\n第 3-6 天，真实深度：\n- 在 DyNeRF cook_spinach / flame_steak（平底锅区域）和合成片段上计算 Fast-FoundationStereo（或 RAFT-Stereo）深度。\n\n第 5-10 天，一个固定权重的最小渲染器：\n- 基于图像的 TSDF raymarch，K=4 个最近视角，前向扭曲，Unstructured Lumigraph 融合权重。四个变体：\n  - (i) 单层表面扭曲（类原论文，但无学习融合器）；\n  - (ii) oracle 双层：GT 漫反射/光泽拆分，光泽通道由用 GT 选出的最佳扫描虚深度扭曲，作为上界；\n  - (iii) 估计双层：K 个视角中位数作为漫反射，残差在表面后方扫 32 个深度，取跨视角方差的 argmin；\n  - (iv) (iii) 加 (1 − s) TSDF 加权。\n\n第 9-12 天，时间滤波器：\n- 在镜面层上以一系列 α 运行 EMA，对比在整幅图像上使用一个共享 α。绘制闪烁（tOF）对滞后（合成数据上的高光位置延迟）的曲线。\n\n第 12-14 天，测量：\n- 留出相机（包括一个留二间隙）上的镜面掩膜 PSNR、EPI 不连续性、tOF 和高光位置误差。\n- 真实检测到的镜面像素中，扫描代价体呈尖峰（低熵）而非平坦的比例。\n\n一名学生加一块 GPU 即可完成。"}, {"b": "sec", "h": "止损标准", "id": "kill"}, {"b": "p", "t": "若出现以下任一情况，放弃显式双层方向。\n\n(1) 没有空间。在合成片段上（包括留二间隙），ORACLE 双层变体相比单层表面扭曲的镜面掩膜 PSNR 提升不足 1 dB，且镜面 EPI / 高光位置误差降低不足 25%。这意味着在阵列基线下反射视差不是主要误差。\n\n(2) 估计器是瓶颈。估计变体（K 中位数加扫描）在 K=4 时恢复不足 40% 的 oracle 增益，在 K=8 时仍不足 50%。这说明在远程呈现规模的阵列上中位数漫反射分离不可行。\n\n(3) 真实镜面几乎都是光泽型。在真实 DyNeRF 平底锅区域以及一次快速的 4-6 台手机或网络摄像头（眼镜加屏幕）测试中，超过 70% 的检测到的镜面像素具有平坦的反射扫描代价体（熵高于最大值的 0.8）。贡献于是退化为“门控的视角条件回退”，相对 ViewSplat/IBGS 过于单薄。\n\n(4) 没有时间收益。分层 EMA 在闪烁-滞后 Pareto 曲线上没有支配所有共享 α 设置。\n\n若 (1) 和 (4) 不成立但 (3) 通过，则转向基准/诊断论文：在线 IBR 的镜面视角 × 时间一致性，加上 (1 − s) 几何加权发现。目标为 3DV/TVCG 级别的会议或期刊。"}, {"b": "sec", "h": "审稿人可能的质疑与回应", "id": "objections"}, {"b": "p", "t": "双层反射 IBR 就是 Sinha et al. 2012 和 Xu et al. 2021（原想法都没有引用）；这是把已知表示做快了，即工程。", "label": "质疑"}, {"b": "p", "t": "我们把两者都作为先驱引用，不主张该表示。我们的主张有三点：\n- 在 feed-forward 多视角视频管线中逐帧在线估计反射深度，两位先驱都没有。\n- 分离的层允许各自最优动态这一时间发现，以相对任何共享滤波器的 Pareto 改进展示，静态方法甚至无法提出这个问题。\n- 可测量地修复 TSDF 深度的镜面感知几何加权。\noracle 空间研究加同等容量消融，使其成为一个经过检验的建模主张，而不是加速。", "label": "回应"}, {"b": "p", "t": "更大的融合网络，或视角条件残差头（ViewSplat/IBGS 式），无需任何显式反射深度就能吸收镜面性。", "label": "质疑"}, {"b": "p", "t": "这是我们在相同参数量和运行时下进行的核心消融。在 kill criteria 中预先登记的假设是：残差头能恢复单帧掩膜 PSNR，但无法恢复 EPI 或时间一致性。它们没有高光应往哪里移动的模型，因此误差表现为视角扫掠不连续和闪烁，尤其在留二宽间隙和合成自由轨迹上。如果残差头在 EPI 和 tOF 上与我们持平，则论文主张被证伪，我们会如实报告。", "label": "回应"}, {"b": "p", "t": "大多数远程呈现中的镜面（皮肤、粗糙塑料）是光泽型而非镜面型；单一虚深度没有良好定义，并且高光覆盖大多数视角时 4 视角中位数漫反射估计会失败。", "label": "质疑"}, {"b": "p", "t": "镜面方程给出凸光泽表面后方约 R/2 的一阶虚深度，因此对眼镜镜片、角膜和平底锅而言，高光视差仍近似于深度型。在不满足时，扫描的代价体熵会门控到视角条件回退。我们按粗糙度（合成）和 K 分层报告结果，包括方法不再有帮助的地方。我们还为高光覆盖至少 K/2 个视角的情况加入学习的校正，并量化其失败率。", "label": "回应"}, {"b": "p", "t": "镜面像素只占画面很小一部分；增益在标准指标中看不出来，而且基准（合成加自采）有自说自话之嫌。", "label": "质疑"}, {"b": "p", "t": "我们在区域掩膜指标之外报告全帧指标并要求无退化，这是针对局部伪影的既定做法。2AFC HMD 研究度量感知显著性，因为眼镜和眼睛上闪烁或重影的高光在人脸上非常显眼。真实采集会连同留出相机和标定一起发布，供他人评测。DyNeRF 的平底锅区域提供第三方真实测试。", "label": "回应"}, {"b": "p", "t": "在近邻之间的留出阵列相机上评测会掩盖视差误差，而且“在线”主张没有包含深度估计（与原论文一样）。", "label": "质疑"}, {"b": "p", "t": "我们在自建和 Technicolor 阵列上加入留二宽间隙留出相机，并加入带 GT 的合成自由轨迹。我们在注明的 GPU 上报告端到端延迟，包括立体基础模型前端，附逐模块分解，目标是相对原管线开销不超过 12 ms。", "label": "回应"}, {"b": "sec", "h": "投入", "id": "effort"}, {"b": "kv", "items": [["周期", "9-11 个月（0.5 个月空间研究；1.5 个月原管线复现，因为没有官方代码；1.5 个月合成 PBR 数据加阵列搭建与采集；3-4 个月方法；2 个月评测、用户研究和写作）"], ["人力", "2 人（一名博士生负责方法，一名负责合成数据、采集阵列和基准；导师约 20% 的时间）"], ["算力", "4-8 块 24-48 GB GPU（RTX 4090/5090 或 A6000/L40 级）用于训练和 Cycles 渲染，外加一块带 TensorRT 的 RTX 级 GPU 用于延迟测量。8-12 台 genlock 阵列的相机与同步硬件约 4-10k 美元。"], ["目标会议", "首选：SIGGRAPH Asia 2027 / ACM TOG。备选：ICCV 2027 或 CVPR 2028。若结果收缩为基准与诊断，则投 IEEE TVCG / IEEE VR 2028（用户研究和 HMD 评测很契合）。"]]}, {"b": "sec", "h": "可组合的方向", "id": "synergies"}, {"b": "p", "t": "1. 视角 × 时间一致性基准与指标簇：镜面掩膜 EPI、tOF 和滞后指标以及留出相机的远程呈现采集属于更广的在线远程呈现基准，因此可合并为一篇数据集论文。\n\n2. 立体基础模型 / 不确定性前端簇：单目-立体不一致和跨视角离散度线索（该簇概率深度想法中有用的遗留部分）同时可作为通用的“不可靠几何”信号，而 (1 − s) 加权有助于解释原论文为零的 TSDF 消融。\n\n3. 长时记忆与漂移簇：分层记忆可自然推广，例如静态漫反射背景用长记忆，动态或视角相关层用短记忆。\n\n4. 光场与多视角显示渲染：稀疏镜面层逐视角重渲染代价低，因此漫反射层可以在 32-45 个显示视角间摊销。\n\n5. 注视与眼神接触保真度：正确的角膜和眼镜高光是感知注视线索，天然适合联合用户研究。\n\n6. 远程呈现的重光照与合成：在线漫反射/镜面拆分使得可以把远端人物近似地进行光照协调后合成到本地场景中。\n\n7. 带宽与压缩：镜面层是稀疏的，可以以更低的分辨率或速率传输，或使用单独的编解码器。"}], "toc": false, "series": {"prev": {"k": "idea-C04"}, "next": {"k": "idea-C01"}, "up": {"u": "future/index.html", "t": "Directions 目录"}}}}</script>
<script>
(function () {

  // ================= lib: DOM, text and math helpers shared by every page =================

  var DATA;
  try { DATA = JSON.parse(document.getElementById("data").textContent); } catch (e) { DATA = {}; }
  var meta = DATA.meta || {};

  // ---------- DOM helpers: all text goes through textContent; external links are https-only ----------
  function safeUrl(u) { if (typeof u !== "string") return null; var s = u.trim(); return /^https:\/\/[^\s"'<>]+$/i.test(s) ? s : null; }
  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (!Object.prototype.hasOwnProperty.call(attrs, k)) continue;
      var v = attrs[k];
      if (v === null || v === undefined || v === false) continue;
      if (k === "class") n.className = v;
      else if (k === "text") n.textContent = String(v);
      else if (k === "href") { var u = safeUrl(v); if (u) { n.setAttribute("href", u); n.setAttribute("target", "_blank"); n.setAttribute("rel", "noopener noreferrer"); } }
      else if (k.slice(0, 2) === "on" && typeof v === "function") n.addEventListener(k.slice(2), v);

          el("tbody", null, arr(b.rows).map(function (r) { return el("tr", null, arr(r).map(function (c) { return cell("td", c); })); }))
        ])])];
        case "timeline": return [el("ul", { class: "refs timeline" }, arr(b.items).map(function (x) {
          return el("li", null, [el("span", { class: "yr", text: str(x[0]) }), el("div", null, rich(x[1]))]);
        }))];
        case "kv": return [el("table", { class: "kv" }, [el("tbody", null, arr(b.items).map(function (x) {
          return el("tr", null, [el("th", { text: x[0] }), el("td", null, rich(x[1]))]);
        }))])];
        case "mtoc": return [marginToc(b.items)];
        case "slot": return typeof SLOTS[b.name] === "function" ? [SLOTS[b.name](b)] : [];
        default: return [];
      }
    }
    // Long articles: a table of contents at the top of the margin (a folding list on phones).
    function marginToc(items) {
      var d = el("details", { class: "mtoc" }, [el("summary", { text: "本文目录" }), el("ol", null, arr(items).map(function (x) { return el("li", null, [part(x)]); }))]);
      var wide = window.matchMedia("(min-width: 761px)");
      d.open = wide.matches;
      return d;
    }
    arr(PG.body).forEach(function (b) {
      if (b.b === "sec") {
        box = el("section", { id: b.id || null });
        if (b.h) box.appendChild(heading("h2", { t: b.h, sn: b.sn }));
        art.appendChild(box);
        return;
      }
      render(b).forEach(function (n) { if (n) cur().appendChild(n); });
    });

    var S = PG.series || {};
    if (S.prev || S.next || S.up) {
      var nav = el("nav", { class: "series", "aria-label": "同系列" });
      nav.appendChild(el("div", { class: "prev" }, S.prev ? [el("small", { text: "上一篇" }), part(S.prev)] : []));
      nav.appendChild(el("div", { class: "up" }, S.up ? [part(S.up)] : []));
      nav.appendChild(el("div", { class: "next" }, S.next ? [el("small", { text: "下一篇" }), part(S.next)] : []));
      art.appendChild(nav);
    }
  })();

  finishPage();
})();
</script>
