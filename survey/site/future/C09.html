:root {

}

/* ---------- base ---------- */

/* ---------- side notes & margin notes (floated into the right margin) ---------- */
.sidenote, .marginnote {

.table-wrap { overflow-x: auto; margin: 1rem 0; }

/* Long articles: the table of contents sits at the top of the margin. */

.vtip { position: absolute; z-index: 20; max-width: 20rem; padding: .45rem .7rem; background: var(--bg); border: 1px solid var(--rule-2); font-family: var(--note); font-size: .82rem; line-height: 1.5; pointer-events: none; }

<script type="application/json" id="data">{"site": {"brand": "3D 临场研究图谱", "root": "../", "path": "future/C09.html", "nav": [{"key": "overview", "label": "Overview", "items": [["Introduction", "index.html"], ["Methodology", "overview/methodology.html"], ["How to use", "overview/how-to-use.html"]]}, {"key": "basics", "label": "Basics", "items": [["Routes", "basics/routes/index.html"], ["Foundations", "basics/foundations/index.html"], ["Advanced topics", "basics/advanced/index.html"], ["Classics", "basics/classics/index.html"], ["Glossary", "basics/glossary.html"]]}, {"key": "works", "label": "Works", "items": [["Papers", "works/papers/index.html"], ["Walkthrough", "works/walkthrough/index.html"], ["Field map", "works/field-map.html"], ["Sub areas", "works/areas/index.html"]]}, {"key": "future", "label": "Future", "items": [["Directions", "future/index.html"], ["Trends & Challenges", "future/trends.html"]]}], "navCur": "future", "navItem": "future/index.html", "crumbs": [["Future", ""], ["Directions", "future/index.html"]], "date": "2026-09-28"}, "xref": {"idea-C14": {"u": "future/C14.html", "t": "为显示而渲染，而非为帧而渲染：面向独立头显上隐藏延迟远程临场的重投影稳定几何引导视图合成", "e": "Render for the Display, Not the Frame: Reprojection-Stable Geometry-Guided View Synthesis for Latency-Hidden Telepresence on Standalone Headsets", "m": "Directions · 第 13 名 · 综合 5", "s": "对实时多视角 IBR 的训练和评估，都以头显在真实位姿预测误差下经 late reprojection 后实际显示的帧为准。"}, "idea-C18": {"u": "future/C18.html", "t": "几何引导视图合成的闪烁预算：深度误差的时间偏差-方差传播，以及学习型渲染器何时胜出", "e": "A Flicker Budget for Geometry-Guided View Synthesis: Temporal Bias-Variance Propagation of Depth Error, and When Learned Renderers Win", "m": "Directions · 第 15 名 · 综合 5", "s": "我们把经典的 DIBR 合成失真静态模型扩展到时间维度和学习型渲染器。"}}, "page": {"id": "idea-C09", "head": {"title": "闪烁、滞后与鬼影：面向分钟级在线 3D 视频的一致递归几何状态", "sub": "Flicker, Lag and Ghosts: Consistent Recursive Geometry State for Minute-Long Online 3D Video", "meta": ["第 14 名", "重新定位后推进", "查新：部分已被做"], "epigraph": "在每个固定阵列相机中保持一个运动补偿的 Kalman 深度后验，并将其融合到图像空间 TSDF 中，使任何证据都不被重复计算。其结果位于一个可预测的闪烁-滞后-鬼影 Pareto 前沿上，这是基础论文的颜色门控 EMA 加 η 上限新视角反馈无法达到的。", "prereqs": [], "lede": "", "minutes": 15}, "body": [{"b": "sec", "h": "评分", "id": "scores"}, {"b": "kv", "items": [["综合", "5"], ["新颖", "5"], ["意义", "5"], ["可行", "7"], ["临场契合", "8"]]}, {"b": "sec", "h": "核心论点（可证伪）", "id": "claim"}, {"b": "p", "t": "我们在分钟级多视角人体序列（Panoptic Kinect、使用立体深度的 ActorsHQ/DNA-Rendering、合成的事件注入 Blender 序列）上，以及留出和移动的虚拟相机上进行测试。在相同滞后或鬼影半衰期下，一致递归状态使动态人脸和手部区域的闪烁相对基础递归降低至少 25%（渲染 RGB 与 TSDF 深度两者的光流 warp 时序误差）。当所有 pipeline（包括无状态 baseline）都配备时序一致的视频立体前端时，它仍至少好 15%。PSNR 和 LPIPS 保持在基础的 0.2 dB / 0.01 以内，额外开销至多 5 ms/帧。最后，由（过程噪声 Q、测量方差 R、门控漏检率）预测的闭式鬼影半衰期和稳态闪烁，与注入事件（开关灯、移除物体、无纹理运动）后测得的值在 ±30% 以内吻合。相比之下，基础递归取决于 β 和 η，要么平滑不足（闪烁），要么过度自信（光照和遮挡事件后的持久鬼影）。若前两个数字任一不满足，该主张即被证伪。"}, {"b": "sec", "h": "关键洞察", "id": "insight"}, {"b": "p", "t": "基础论文的时序机制是两个互不协调的递归。第一个是颜色门控的逐相机 EMA；其掩码下限 M ≥ 0.6 意味着它几乎不做滤波，因此移动的人基本得不到平滑而产生闪烁。第二个把上一帧渲染的新视角深度以至多 η = 15 的权重反馈进 TSDF，而逐视角权重至多为 1。该渲染深度是 TSDF 中已有的同一批逐相机测量的确定性函数。因此反馈它就是“数据乱伦”（data incest，去中心化估计中已知的重复计数）：它在没有新信息的情况下抬高置信度，而正是这种过度自信使误差在颜色掩码漏检的事件后以鬼影形式持续存在。该状态还存在于移动的目标视角中，因此对移动观看者或双眼而言是未定义的。修正方法是把状态放在阵列固定的地方——每个源相机的像素网格中，作为运动补偿的逐像素后验 (μ, σ²)。于是一个后验方差承担三项工作：它设定 TSDF 权重 ω = 1/σ²、逐样本截断 τ = cσ（去掉度量常数 0.02 m），以及一个区分“移动”与“重新光照”的几何 χ² 新息门控。新视角反馈要么被移除，要么仅作为协方差交叉（covariance-intersection）伪测量引入，可证明它不会把方差缩小到逐相机后验以下。于是回路的闪烁-滞后-鬼影行为由稳态 Riccati 增益决定，因此可以预测和调节，而非手工设定。"}, {"b": "sec", "h": "方法", "id": "method"}, {"b": "p", "t": "状态：对每个固定阵列相机 n，在深度分辨率下维护逐像素后验（μ_n、σ²_n、年龄、运行中的新息统计量）。\n\n(1) 测量。使用两种前端。(a) 快速立体网络（例如 RAFT-Stereo-realtime），在合成数据加阵列自身数据上用 Laplace/Gaussian NLL 方差头微调。(b) 传感器深度（Kinect/Orbbec），采用标准的深度相关噪声模型 σ ∝ z² 加边缘项。\n\n(2) 预测。逐相机光流（RAFT-small 或类似的快速光流网络）加后验深度得到 3D 场景流。用软 z-buffering 前向 splat μ 和 σ²。过程噪声 Q = q0 + q1·‖场景流‖² + q2·光流不确定性。去遮挡像素重置为 σ² = ∞ 的先验。\n\n(3) 更新。增益 K = σ²_pred/(σ²_pred + R)。χ² 新息门控（1 自由度，p = 0.99）在失败时（拓扑变化或遮挡）重置 σ²，并有用于鲁棒性的 Student-t 变体。颜色变化仅用于增大 Q，从不用于判断哪些像素是静态的。\n\n(4) 图像空间 TSDF，保留 Starline/基础论文的 raymarch。逐样本权重 ω_k = 1/σ²_k（截断），逐样本截断 τ_k = clip(c·σ_k, τmin, τmax)，返回的表面还携带融合方差 σ²_TSDF。\n\n(5) 反馈，三种变体：(A) 无；(B) 基础论文的 η 上限反馈，作为参考；(C) 将重投影的上一帧新视角深度与融合的逐相机估计做协方差交叉，通过 TSDF 深度利用目标相机运动进行重投影。\n\n(6) 与基础论文相同的 Blend U-Net，以 σ_TSDF 和新息图作为额外输入。它在 8 帧片段上训练，使用基础损失加光流 warp 时序 L1（单时刻训练是基础论文的缺口）。滤波器本身保持闭式。学习增益的 ConvGRU（在 on-policy rollout 上训练）是一个消融，而非主要结果。\n\n(7) 理论。逐像素地看，回路是一个切换线性系统 x_{t+1} = (1 − K_t)x_t + K_t z_t（+ 反馈项）。稳态 Riccati 增益 K∞(Q, R) 给出鬼影半衰期 h = ln2 / −ln(1 − K∞) 和稳态闪烁方差 K∞R/(2 − K∞)。基础递归的同样代数用（掩码下限、β、η、Σω_k、掩码漏检率 p）表示。一个命题表明，没有协方差交叉（CI）时，反馈比例 η/(η + Σω_k) 充当正反馈置信项，持久性随 p → 1 增长。有 CI 时回路是压缩的，谱半径 ≤ 1 − K_min。\n\n运行时预算：四分之一分辨率光流加后验 splatting 加更新，在 RTX 4090 级 GPU 上 4 视角 1352x1014 约 3-5 ms，而基础 pipeline 使用 TensorRT 约 40 ms。深度估计单独如实报告，不同于基础论文。"}, {"b": "sec", "h": "为什么不是工程改进", "id": "not-engineering"}, {"b": "p", "t": "贡献不是“我们插入了一个 Kalman 滤波器”。它依赖于三点。(i) 一个诊断：把渲染几何反馈回自身融合的递归 image-based rendering pipeline 会重复计数证据，而决定鬼影持久性和闪烁行为的是这一点，而非深度噪声。该主张被形式化，并可在事件注入序列上证伪。(ii) 一个单一方差，取代四个互不相关的手工常数（掩码 0.7/0.6、0.001 置信权重、τ = 0.02 m、η = 15），并给出鬼影半衰期和闪烁的闭式预测。(iii) 对显式几何在线 NVS pipeline 进行的首个分钟级、事件注入评估，报告闪烁-滞后-鬼影 Pareto 前沿，而非 100 帧 PSNR。审稿人可以检查理论与测量对比图。工程调整不会伴随一个可能失败的定量预测。"}, {"b": "sec", "h": "与已有工作的区分", "id": "differentiation"}, {"b": "p", "t": "FILT3R（arXiv 2603.18493, ECCV 2026）和 TTT3R/ReCal3R/TTSA3R 对来自单个移动相机的潜在 CUT3R token 施加 Kalman 或置信度门控，用于位姿和点图。我们不主张 Kalman 门控。我们的状态是显式的，存在于固定标定阵列的像素中，跨相机融合进图像空间 TSDF，并通过渲染的新视角深度反馈。该反馈回路及其重复计数在所有这些工作中都不存在。CODD (2111.09337) 和 Khan et al. CVPR'23（2304.07435，基础论文所在团队）已经对单个立体或单目流做了运动补偿或学习不确定性的时序深度融合。我们引用二者作为逐相机构建模块，区别在于跨相机 TSDF 融合、方差推导的截断、一致的新视角反馈以及渲染。“Rethinking the State Update Gate”（2605.16981）从门控幅值推导潜在递归重建的记忆时程。我们为显式估计器推导半衰期，并在渲染输出中用注入事件验证。NSTM (2607.15271) 已经为在线多视角 NVS 分析了分钟级漂移，使用 256-512 px 的隐式 TTT 记忆和约 1 FPS 的记忆化。我们不主张首个长时程评估，只主张首个针对显式几何实时 IBR、带闪烁、鬼影和滞后指标及理论的评估。若代码可用，我们加入 NSTM 风格记忆作为 baseline。GeoStream (2606.15162) 在生成式视频中点明了几何反馈回路，并用 on-policy 训练修正。我们以解析方式（协方差交叉）修正，不使用生成模型，面向忠实采集。Stereo Any Video / TC-Stereo / Video Depth Anything 提供逐相机时序一致性。我们将它们用作前端，并报告来自跨相机一致状态的剩余增益。"}, {"b": "sec", "h": "查新后剩余的可辩护新意", "id": "novel-angle"}, {"b": "p", "t": "C09 的每个构建模块都已在别处发表。用于长时程稳定性的 Kalman 增益状态更新已被占据（FILT3R, ECCV 2026）。运动补偿的递归深度融合已被占据（CODD）。带偶然（aleatoric）不确定性融合权重的学习式动态掩码已被占据，且由基础论文自己的团队完成（Khan et al., CVPR 2023）。由门控推导的记忆时程分析已被占据（Rethinking the State Update Gate, 2026）。通过几何反馈回路的 on-policy 训练已被占据（GeoStream）。在线多视角 NVS 的分钟级漂移分析已被占据（NSTM）。可微学习式 TSDF 融合（NeuralFusion）和可微感知视频损失（ColorVideoVDP）已被占据。\n\n仍可辩护的是面向几何引导 IBR 的显式、像素空间版本。其状态是一个在（逐相机滤波深度、图像空间 TSDF 权重、重新注入的上一帧新视角深度）上的闭环递归。其后验方差同时承担三项工作：设定 TSDF 权重、设定深度相关截断，以及提供区分运动与重新光照的几何（而非光度）新息门控。该递归随后获得一个可证明的压缩或鬼影半衰期界，并在真实帧率下以分钟尺度、以闪烁和鬼影指标、在移动观看者下得到验证。检索到的工作中没有一个分析渲染的新视角深度反馈进融合状态的问题，也没有一个为显式几何在线 NVS pipeline 给出稳定性保证。一个次要的独立角度是远程临场特定的心理物理闪烁阈值（HMD；人脸、手部、离心率；真实 IBR 伪影），既用作指标也用作损失。"}, {"b": "sec", "h": "主要撞车风险（查新找到的相近工作）", "id": "threats"}, {"b": "refs", "items": [{"left": "高", "url": "https://arxiv.org/abs/2603.18493", "t": "FILT3R: Latent State Adaptive Kalman Filter for Streaming 3D Reconstruction", "sub": "2026 · ECCV 2026 · 重叠度 高", "gloss": "重叠：将流式 3D 重建的递归状态更新重新表述为 Kalman 滤波。它保持逐元素方差和在线估计的过程噪声，所得增益随不确定性收缩而减小、在场景变化时增大。其明确目标是超越训练时程的长时程稳定性，覆写/门控策略作为特例被恢复。这是构想 1 和 2 的概念核心：以稳定性为依据、用 Kalman 增益取代启发式门控。\n差异：它对来自单个移动相机的潜在 CUT3R token 做滤波。没有像素/图像空间深度状态、没有场景流运动补偿、没有多视角 TSDF、没有渲染或 NVS，也没有闪烁指标。"}, {"left": "高", "url": "https://arxiv.org/abs/2304.07435", "t": "Temporally Consistent Online Depth Estimation Using Point-Based Fusion (Khan, Penner, Lanman, Xiao; the base paper's group)", "sub": "2023 · CVPR 2023 · 重叠度 高", "gloss": "重叠：已经用学习式动态掩码 alpha 取代了手工设定的静态/动态混合。它在图像空间中以来自学习偶然不确定性（exp(-Phi)）的权重融合深度，并维护一个持久的全局点云状态。这移除了构想 1 中“学习方差取代手调权重”和“学习门控”的主张，以及构想 3 中的“学习门控”。\n差异：运动区域直接采用当前估计（没有运动补偿预测，也没有 Kalman/新息测试）。它仅是单目或立体深度，没有多视角图像空间 TSDF、没有新视角渲染、没有方差推导的截断，也没有稳定性分析。"}, {"left": "高", "url": "https://arxiv.org/abs/2111.09337", "t": "CODD: Temporally Consistent Online Depth Estimation in Dynamic Scenes", "sub": "2021/2023 · WACV 2023 · 重叠度 高", "gloss": "重叠：其运动网络预测对齐先前观测的逐像素 SE3 变换（场景流），然后由学习式融合网络聚合过去与当前视差，以在动态区域实现时序一致性。这就是构想 1 的运动补偿递归深度滤波器，包括其“学习式 ConvGRU 增益”变体。\n差异：它作用于单个立体对，没有显式高斯方差或卡方新息门控。没有跨相机 TSDF 融合、没有渲染，也没有长时程稳定性研究。"}, {"left": "中", "url": "https://arxiv.org/abs/2605.16981", "t": "Rethinking the State Update Gate for Long-Sequence Recurrent 3D Reconstruction", "sub": "2026 · arXiv · 重叠度 中", "gloss": "重叠：将递归 3D 重建的门控作为记忆系统进行剖析，并从门控幅值推导出每个状态 token 约 3 帧的有效记忆时程。随后提出一个原则性的帧级门控（关键帧选择的松弛），并在长达 4,541 帧的序列上评估。这在方法上接近构想 2 的“由门控/谱半径得出鬼影半衰期”诊断。\n差异：它无需训练，使用来自单个移动相机的潜在状态，目标是位姿和深度而非渲染外观。没有显式 TSDF、没有渲染深度反馈回路、没有压缩界，也没有闪烁或鬼影指标。"}, {"left": "中", "url": "https://arxiv.org/abs/2607.05356", "t": "TTT3R / TTSA3R / ReCal3R / Mem3R family (confidence-calibrated state updates for streaming reconstruction)", "sub": "2025-2026 · ICLR 2026 (TTT3R); arXiv (TTSA3R 2601.22615, ReCal3R 2607.05356, Mem3R 2604.07279) · 重叠度 中", "gloss": "重叠：它们共同确立了置信度或可靠性门控的状态更新可以修复长时程漂移和遗忘，并以长序列漂移曲线作为评估。因此构想 2 的“置信度门控状态更新修复漂移”已是标准做法。\n差异：全部作用于用于位姿和点图估计的潜在 token。没有一个具有显式图像空间几何、渲染、多视角采集阵列或形式化的压缩保证。"}]}, {"b": "sec", "h": "实验设计", "id": "experiments"}, {"b": "h3", "t": "数据集"}, {"b": "ul", "items": ["CMU Panoptic Studio：HD 相机加同步 Kinect v2 RGB-D，分钟级序列。真实传感器深度，属于 Holoportation/Starline 类 RGB-D 情形，用于长时程 RGB-D 测试。", "ActorsHQ：160 个相机，多分钟单演员高分辨率序列。可选择立体对，人脸和手部尺寸大，用于人脸和手部闪烁。", "DNA-Rendering 和 MVHumanNet++：多相机人体视频。NSTM 使用 MVHumanNet++ 做分钟级测试，因此可以正面对比。仅 RGB；深度来自在阵列相机中选取的立体对。", "Neural 3D Video / DyNeRF：全部 300 帧，而非仅前 100 帧，以便与基础论文可比（火焰 = 光照变化情形）。", "ENeRF-Outdoor 和 D3DMV：基础论文的测试集，作为短时程 PSNR 未损失的合理性检查。", "PackUV-2B（序列长达 30 分钟，50+ 相机）：若下载规模允许，作为漂移压力测试。仅 RGB。", "带真值深度和真值鬼影起始的合成 Blender 序列：房间中的动画扫描人体（THuman 或类似扫描加重定向动作），注入事件（开关灯、自动曝光渐变、物体出现与移除、无纹理移动物体、某相机丢失 N 帧）。之所以需要，是因为鬼影半衰期需要真值。", "可选自定义采集：4-6 台 Orbbec/Azure Kinect 相机，2-3 段 5 分钟会话，带脚本化的开关灯。能增强远程临场叙事，但核心主张不需要。"]}, {"b": "h3", "t": "对比基线"}, {"b": "ul", "items": ["基础论文（Ha et al. CVPR'25），因无代码发布而忠实重新实现。包括颜色门控 EMA 加 η 上限反馈，在 β 和 η 上扫描以绘制其自身的前沿。", "无状态：相同的 splat、TSDF 和 blend pipeline，无时序状态（滞后的下界，闪烁的上界）。", "带时序一致视频深度前端的基础 pipeline（每对用 Stereo Any Video 或 TC-Stereo；Video Depth Anything streaming 按立体尺度缩放）。这是“状态是否仍有必要”的关键 baseline。", "CODD / Khan'23 风格的逐相机时序融合（运动补偿、学习不确定性）接入 TSDF，但无跨相机一致性。用于隔离来自融合并反馈的状态的增益。", "关键帧重置启发式（周期性或残差触发的重置）。", "在 rollout 上训练的学习式 ConvGRU 增益（Self-Forcing 风格 on-policy 输入），检验学习是否优于闭式解。", "在可运行的情况下：GPS-Gaussian+ 或类似的逐帧 feed-forward 人体渲染器（无状态），以及若代码发布则在 MVHumanNet++ 上以其分辨率运行 NSTM（隐式记忆）。"]}, {"b": "h3", "t": "指标"}, {"b": "ul", "items": ["渲染 RGB 和 TSDF 深度的光流 warp 时序误差，总体以及在人脸、手部和背景掩码中（来自现成的人体解析）。", "TCC / STED / SDT，与基础论文相同，以便比较。", "注入事件后的鬼影半衰期和恢复时间：事件区域中深度/RGB 误差降到 50% 和 10% 以下所需的帧数（合成真值；带脚本化事件的真实序列）。", "漂移斜率：误差对时间在 1-10 分钟上的回归。", "滞后：深度响应相对真值运动起始的相位延迟（合成），与闪烁一起绘制闪烁-滞后 Pareto 前沿。", "理论与测量：预测 vs 测得的半衰期与稳态闪烁方差。", "σ 的校准：相对真值深度的 NLL、sparsification/AUSE 和可靠性图。", "留出阵列相机上的 PSNR / SSIM / LPIPS；ColorVideoVDP 作为已有的可微感知视频指标。", "移动观看者协议：阵列相机之间的平滑类头部轨迹，伪 GT 来自逐场景 4DGS 拟合，以及双眼立体一致性。", "运行时间分解，包括深度估计。"]}, {"b": "h3", "t": "关键消融"}, {"b": "ul", "items": ["反馈：无 vs 基础 η 上限 vs 协方差交叉。这是核心的重复计数测试，在光照事件和无纹理运动下进行。", "新息门控：几何 χ² 门控 vs 颜色差分掩码 vs 两者，在光照变化、火焰和自动曝光下。", "运动补偿：开/关（关等价于仅静态滤波，与基础相同）vs 光流质量（RAFT-small vs 完整 RAFT vs 真值光流）。", "方差用法：仅 1/σ² 权重、仅自适应 τ、两者，或都不用（基础启发式 7x7 方差与 τ = 0.02 m）。", "前端：带噪逐帧立体 vs 时序一致视频立体 vs 传感器深度。报告有多少增益得以保留。", "闭式 Kalman 增益 vs 学习式 ConvGRU 增益，使用 teacher-forced vs on-policy rollout 训练。", "Blend net 在单时刻上训练（与基础相同）vs 在带时序损失的 8 帧片段上训练，区分几何状态增益与混合增益。", "时程：100 帧 vs 1 分钟 vs 5-10 分钟。"]}, {"b": "h3", "t": "采集说明"}, {"b": "p", "t": "核心主张不需要自定义采集。Panoptic Studio 提供分钟级真实同步 RGB-D。ActorsHQ、DNA-Rendering 和 MVHumanNet++ 提供多相机 RGB，可从中选择立体对。合成 Blender 序列提供任何真实数据集都无法提供的真值鬼影和滞后测量。主要数据风险：(1) Panoptic 的 Kinect v2 深度噪声大，且与 HD 相机仅松散同步（是真实世界噪声情形，但必须检查同步）；(2) 仅 RGB 的数据集需要逐对立体，除非在各方法间固定前端，否则会混淆结果。一个带脚本化开关灯和 5 分钟对话的小型 4-6 相机 RGB-D 阵列（约 $3-5k）会让远程临场主张对 IEEE VR/TVCG 审稿人更有说服力。仅在 2 周测试通过后再搭建。"}, {"b": "sec", "h": "两周内的验证实验", "id": "two-weeks"}, {"b": "p", "t": "一个仅几何的测试，不含 blend 网络，也不需训练。(1) 第 1-4 天：用 PyTorch/CUDA 或纯 PyTorch 重新实现基础论文的逐相机颜色门控 EMA、图像空间 TSDF raymarch 和 η 上限的上一帧新视角反馈；不需要实时速度。同时实现带 RAFT 光流的逐相机运动补偿 Kalman 状态、1/σ² 权重、τ = cσ、χ² 门控和协方差交叉反馈。测量方差使用简单的启发式 σ（立体左右一致性，或 Kinect z² 模型）；学习留到以后。(2) 第 5-8 天：数据。(a) 3-4 个合成 Blender 序列（房间中的扫描人体、4 个相机、1-2 分钟），带真值深度和注入事件：开关灯、物体移除、无纹理移动箱子。(b) 2 个各约 2 分钟的 Panoptic Kinect 序列。(3) 第 9-12 天：在留出相机和移动虚拟轨迹上为三个 pipeline 渲染 TSDF 深度（基础在 β ∈ {0.5, 1, 2} 和 η ∈ {5, 15, 30} 上扫描、无状态、以及我们的方法带与不带 CI 反馈），每个都分别使用原始立体深度和时序一致视频立体前端。测量动态区域（人脸/手部）光流 warp 深度误差、每个事件后的鬼影半衰期、运动起始时的滞后以及闪烁-滞后前沿。计算闭式预测半衰期。(4) 第 13-14 天：决策。若满足以下条件则继续：我们的方法支配基础前沿（相同滞后下动态区域闪烁至少低 25%，或相同闪烁下鬼影明显更短）；在视频立体前端下保留至少 15% 的增益；在至少一种事件类型下显示基础反馈存在可测量的鬼影或过度自信失败；且预测半衰期与测量值在 ±30% 以内。使用 TSDF 深度而非 RGB 是有意为之。它更便宜，而且如果几何状态增益在那里不存在，blend 网络也不会凭空创造它。"}, {"b": "sec", "h": "止损标准", "id": "kill"}, {"b": "p", "t": "若 2 周测试后出现以下任一情况，则放弃方法论文，或将分析并入 benchmark 或感知指标论文。\n\n(a) 在时序一致视频立体前端（Stereo Any Video / TC-Stereo）下，递归状态相对无状态 pipeline 在相同滞后下使动态区域 TSDF 深度闪烁降低不足 15%。那说明视频立体已经吸收了该问题。\n\n(b) 在 β/η 扫描中，基础递归已位于我们的前沿上或其 10% 以内，且没有任何事件类型下其反馈产生比 CI 或无反馈明显更长的鬼影。那说明重复计数诊断在经验上无关紧要。\n\n(c) 即使使用真值光流，合成序列上测得的鬼影半衰期和闪烁与闭式预测偏差超过 50%。那说明理论只是装饰，论文退化为 CODD+Khan'23+Starline。\n\n(d) 分钟级运行在任何 pipeline 中都未显示漂移或鬼影累积。那说明“长时程”不是一个值得写论文的问题。\n\n此外，若到第 4 个月，渲染 RGB 闪烁增益（光流 warp 误差、ColorVideoVDP）低于 10% 而深度增益存在，也应终止，因为 blend net 会掩盖几何改进。每月重新检查 arXiv，关注是否有 Starline/Meta/Google 的后续工作分析 image-TSDF pipeline 中的反馈。"}, {"b": "sec", "h": "审稿人可能的质疑与回应", "id": "objections"}, {"b": "p", "t": "这是深度的 Kalman 滤波，自 Matthies-Kanade 以来就是教科书内容。CODD 和 Khan et al. CVPR'23 已经做了运动补偿或不确定性加权的时序深度融合，FILT3R 为流式 3D 做了 Kalman 状态更新。有什么新东西？", "label": "质疑"}, {"b": "p", "t": "我们不主张这些组件中的任何一个，并显著引用了全部三者。新的是：(i) 将渲染的新视角几何反馈回多视角融合状态的重复计数诊断，以及可证明防止过度自信的协方差交叉修正；(ii) 在跨相机图像空间 TSDF 中，一个后验方差同时设定 TSDF 权重、截断和几何门控；(iii) 闭式的闪烁、滞后和鬼影预测，在真实帧率下以注入事件在分钟尺度上验证。一个消融把 CODD/Khan 风格的逐相机滤波器接入同一 TSDF，但不含跨相机一致性或 CI 反馈，并展示剩余增益。", "label": "回应"}, {"b": "p", "t": "所谓“理论”只是一个标量稳态 Kalman 增益。这很平凡，而且忽略遮挡和拓扑变化的线性化对真实失败毫无解释力。", "label": "质疑"}, {"b": "p", "t": "标量情形是刻意保持简单的，以便其预测可被证伪。非平凡部分在于切换系统（门控重置、K 近邻视角集合随观看者运动变化、掩码漏检率 p 驱动持久性），以及 η 上限反馈充当正置信回路的证明。遮挡和拓扑变化被显式处理为由新息门控触发的重置，并且我们报告预测失效的区间（快速手部、细结构）。论文的证据是预测与测量对比图，而非代数。", "label": "回应"}, {"b": "p", "t": "时序一致的视频立体和深度基础模型使显式时序状态变得不必要。有了更好的前端，整个贡献就会消失。", "label": "质疑"}, {"b": "p", "t": "我们将其作为一等实验，而非隐藏它。每种方法都用原始逐帧立体、视频立体和传感器深度运行。逐对视频立体在时间上一致，但在相机之间不一致，因此观看者运动下的视角集合切换和跨相机不一致仍会在融合 TSDF 中产生闪烁。我们的终止标准要求在该前端下保留至少 15% 的增益。传感器深度阵列（Kinect/Orbbec，Starline 类）根本没有时序模型。", "label": "回应"}, {"b": "p", "t": "这是一个小众 pipeline（Starline 风格 image TSDF 加没有公开代码的基础论文）。重新实现可能不忠实，而且在单一方法之外的相关性不明确。", "label": "质疑"}, {"b": "p", "t": "重新实现将被发布，并且在提出任何主张之前，我们会在声明的容差内复现基础论文报告的 DyNeRF/ENeRF/D3DMV 数值。状态模块与 pipeline 无关。它输出逐相机 (μ, σ²) 和带方差的融合 TSDF 深度，我们将其接入第二个无状态 feed-forward 渲染器（GPS-Gaussian+ 风格）以展示迁移性。作为目标应用的 Starline 类 RGB-D 远程临场系统都共享这种递归融合结构。", "label": "回应"}, {"b": "p", "t": "增益只体现在自定义时序指标上。PSNR 不变，也没有证据表明观看者能察觉。", "label": "质疑"}, {"b": "p", "t": "我们在新的鬼影和滞后指标之外同时报告已确立的指标（TCC/STED、光流 warp 误差、ColorVideoVDP）。我们还在带人脸和手部特写的分钟级片段上进行小规模 2AFC 偏好研究（n ≈ 15-20，桌面加 HMD）。PSNR 不变是预期之中的，其本身也很有信息量：它解释了基础论文 TSDF 消融无差异的结果（31.17 vs 31.16 dB），因为逐帧指标看不到时序状态带来的收益。", "label": "回应"}, {"b": "sec", "h": "投入", "id": "effort"}, {"b": "kv", "items": [["周期", "6-8（2 周 go/no-go；约 2 个月重新实现和滤波器；2 个月长时程 benchmark 与理论验证；1-2 个月 blend-net 视频训练、用户研究和写作）"], ["人力", "1 名全职博士生加 1 名兼职人员（理论/估计方向，或熟悉 CUDA 的工程师）；具有状态估计背景的导师会有帮助"], ["算力", "1-4 块 24-48 GB GPU（RTX 4090/A6000/A100 级）。滤波器无需训练。方差头微调和 8 帧 blend-net 训练每次运行约 1-3 GPU 日，外加 Panoptic/ActorsHQ/MVHumanNet++ 子集约 1-2 TB 存储。可选 RGB-D 阵列约 $3-5k。"], ["目标会议", "首选：ICCV 2027 或 3DV 2027（方法加分析）。备选或替代：若 HMD 用户研究和自定义 RGB-D 采集足够强，则投 IEEE TVCG / IEEE VR 2027。除非与感知指标工作合并，否则不投 SIGGRAPH。"]]}, {"b": "sec", "h": "可组合的方向", "id": "synergies"}, {"b": "p", "t": "(1) 感知/HMD 闪烁指标（本簇中的构想 3 以及任何心理物理学簇）。校准的 TFV 指标将取代此处临时的闪烁代理指标，并把 Pareto 前沿变成感知前沿；二者合在一起可形成一篇 TVCG/IEEE VR 论文，或共享数据的两篇论文。(2) 长时程远程临场 benchmark / 数据集簇。事件注入合成套件和分钟级协议是天然的 benchmark 组件，可由本项目产出一篇 benchmark 论文。(3) 面向标定阵列的视频立体 / 几何基础模型前端。逐相机 σ 输出正是一个阵列感知深度模型应当提供的。(4) 移动观看者 / 立体 HMD 渲染与延迟补偿。Kalman 预测步给出前向外推深度，用于 motion-to-photon 补偿；源相机状态与观看者无关，因此双眼和多个观看者可以共享。(5) 流式传输与压缩。后验方差和新息图是对深度和高斯流进行码率分配或关键帧选取的天然信号。(6) 显式加学习的混合记忆（以显式几何状态为条件的 NSTM 风格 TTT 记忆）。显式后验可作为隐式记忆所缺乏的稳定锚点。"}], "toc": false, "series": {"prev": {"k": "idea-C14"}, "next": {"k": "idea-C18"}, "up": {"u": "future/index.html", "t": "Directions 目录"}}}}</script>
<script>
(function () {

  function safeUrl(u) { if (typeof u !== "string") return null; var s = u.trim(); return /^https:\/\/[^\s"'<>]+$/i.test(s) ? s : null; }
  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (!Object.prototype.hasOwnProperty.call(attrs, k)) continue;
      var v = attrs[k];
      if (v === null || v === undefined || v === false) continue;
      if (k === "class") n.className = v;
      else if (k === "text") n.textContent = String(v);
      else if (k === "href") { var u = safeUrl(v); if (u) { n.setAttribute("href", u); n.setAttribute("target", "_blank"); n.setAttribute("rel", "noopener noreferrer"); } }
      else if (k.slice(0, 2) === "on" && typeof v === "function") n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, String(v));
    }
    (kids || []).forEach(function (c) { if (c === null || c === undefined || c === false) return; n.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return n;
  }
  var SVGNS = "http://www.w3.org/2000/svg";
  function sv(tag, attrs, kids) {
    var n = document.createElementNS(SVGNS, tag);
    if (attrs) for (var k in attrs) {
      if (!Object.prototype.hasOwnProperty.call(attrs, k)) continue;
      var v = attrs[k];
      if (v === null || v === undefined || v === false) continue;
      if (k === "text") n.textContent = String(v);
      else if (k.slice(0, 2) === "on" && typeof v === "function") n.addEventListener(k.slice(2), v);

    // Long articles: a table of contents at the top of the margin (a folding list on phones).
    function marginToc(items) {
      var d = el("details", { class: "mtoc" }, [el("summary", { text: "本文目录" }), el("ol", null, arr(items).map(function (x) { return el("li", null, [part(x)]); }))]);
      var wide = window.matchMedia("(min-width: 761px)");
      d.open = wide.matches;
      return d;
    }
    arr(PG.body).forEach(function (b) {
      if (b.b === "sec") {
        box = el("section", { id: b.id || null });
        if (b.h) box.appendChild(heading("h2", { t: b.h, sn: b.sn }));
        art.appendChild(box);
        return;
      }
      render(b).forEach(function (n) { if (n) cur().appendChild(n); });
    });

    var S = PG.series || {};
    if (S.prev || S.next || S.up) {
      var nav = el("nav", { class: "series", "aria-label": "同系列" });
      nav.appendChild(el("div", { class: "prev" }, S.prev ? [el("small", { text: "上一篇" }), part(S.prev)] : []));
      nav.appendChild(el("div", { class: "up" }, S.up ? [part(S.up)] : []));
      nav.appendChild(el("div", { class: "next" }, S.next ? [el("small", { text: "下一篇" }), part(S.next)] : []));
      art.appendChild(nav);
    }
  })();

  finishPage();
})();
</script>
