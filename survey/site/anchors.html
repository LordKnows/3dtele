.obj { display: grid; gap: 2px; font-size: 13.5px; }

.obj span { color: var(--ink-2); }

.path { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 14px; }
.path ol { margin: 0; padding-left: 1.3em; display: grid; gap: 10px; font-size: 13.5px; }
.path ol li small { display: block; color: var(--muted); }
.note { font-size: 13px; color: var(--muted); max-width: 80ch; }

/* ---------- learning part ---------- */
.cchip { appearance: none; font: inherit; font-size: 12.5px; padding: 1px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); border: 1px solid transparent; cursor: pointer; white-space: nowrap; }
.cchip:hover { border-color: var(--accent); }
.cchip.ghost { background: transparent; border-color: var(--rule); color: var(--ink-2); }
.cchip.ghost:hover { border-color: var(--accent); color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chips .lbl { font-size: 12px; color: var(--muted); margin-right: 2px; }
.flash { animation: flash 1.6s ease-out 1; }
@keyframes flash { 0% { background-color: var(--flash); } 100% { background-color: transparent; } }
@media (prefers-reduced-motion: reduce) { .flash { animation: none; outline: 2px solid var(--accent); } }

.math-block { overflow-x: auto; overflow-y: hidden; padding: 8px 12px; background: var(--surface-2); border-radius: 6px; font-family: var(--mono); font-size: 13px; color: var(--ink); }
.math-block mjx-container { margin: 4px 0 !important; }
.eq { display: grid; gap: 6px; }
.eq p { font-size: 13.5px; color: var(--ink-2); white-space: pre-line; }
.eqs { display: grid; gap: 14px; }
.aside { background: var(--surface-2); border-radius: 8px; padding: 10px 14px; font-size: 14px; color: var(--ink-2); display: grid; gap: 2px; }
.aside b { font-size: 12px; color: var(--muted); letter-spacing: .05em; font-weight: 700; }
.aside span { white-space: pre-line; }
.idref { appearance: none; background: none; border: 0; padding: 0 1px; font: inherit; font-family: var(--mono); font-size: .86em; color: var(--accent); cursor: pointer; text-decoration: underline dotted; text-underline-offset: 3px; }
.idref:hover { text-decoration-style: solid; }

.roadmap { display: grid; gap: 10px; }
details.stage { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; min-width: 0; }
details.stage > summary { list-style: none; cursor: pointer; padding: 14px 18px; display: grid; grid-template-columns: 40px minmax(0,1fr) auto; gap: 12px; align-items: start; }
details.stage > summary::-webkit-details-marker { display: none; }
details.stage .num { font-family: var(--mono); width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: 13px; }
details.stage .head { display: grid; gap: 4px; }
details.stage .head h3 { font-size: 16.5px; }
details.stage .head p { font-size: 13.5px; color: var(--ink-2); }
details.stage .dur { font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: nowrap; }

.mods { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.mod { appearance: none; text-align: left; font: inherit; cursor: pointer; background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 12px 14px; display: grid; gap: 4px; align-content: start; color: var(--ink); }
.mod:hover { border-color: var(--accent); }
.mod i { font-style: normal; font-family: var(--mono); font-size: 11px; color: var(--muted); }
.mod b { font-family: var(--serif); font-size: 14.5px; }
.mod span { font-size: 12.5px; color: var(--ink-2); }

details.concept { border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); min-width: 0; }
details.concept > summary { list-style: none; cursor: pointer; padding: 12px 16px; display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 4px 12px; }
details.concept > summary::-webkit-details-marker { display: none; }
details.concept .nm { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
details.concept .nm b { font-family: var(--serif); font-size: 15.5px; }
details.concept .nm span { font-family: var(--mono); font-size: 11px; color: var(--muted); }
details.concept .tl { grid-column: 1 / -1; font-size: 13.5px; color: var(--ink-2); }
details.concept .uses { display: flex; gap: 6px; align-items: center; }
.concept-body { border-top: 1px solid var(--rule); padding: 16px 16px 20px; display: grid; gap: 18px; min-width: 0; }
.anchor-use { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }
.anchor-use > div { border: 1px solid var(--rule); border-radius: 8px; padding: 10px 12px; display: grid; gap: 6px; align-content: start; }
.anchor-use h5 { margin: 0; font-family: var(--sans); font-size: 12.5px; font-weight: 700; color: var(--ink); display: flex; gap: 8px; align-items: center; }
.anchor-use p { font-size: 13.5px; color: var(--ink-2); }
.anchor-use small { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
details.qa { border-top: 1px dashed var(--rule); }
details.qa > summary { list-style: none; cursor: pointer; padding: 8px 0; font-size: 14px; color: var(--ink); display: flex; gap: 8px; }
details.qa > summary::before { content: "问"; font-size: 11.5px; color: var(--accent); background: var(--accent-soft); border-radius: 4px; padding: 0 6px; height: fit-content; margin-top: 3px; }
details.qa > p { font-size: 13.5px; color: var(--ink-2); padding: 0 0 10px 30px; white-space: pre-line; }
.res { display: grid; gap: 6px; font-size: 13.5px; }
.res div { display: grid; grid-template-columns: 58px minmax(0,1fr); gap: 8px; }
.res .ty { font-family: var(--mono); font-size: 11px; color: var(--muted); padding-top: 3px; }
.res small { color: var(--muted); display: block; }

.diagram-wrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: 10px; background: var(--surface); padding: 10px; }
svg.diagram { display: block; width: 100%; min-width: 860px; height: auto; }
.dnode rect { fill: var(--surface-2); stroke: var(--rule); stroke-width: 1; }
.dnode.data rect { fill: var(--surface); stroke-dasharray: 4 3; }
.dnode.click { cursor: pointer; }
.dnode.click:hover rect, .dnode.click:focus rect { stroke: var(--accent); stroke-width: 1.6; }
.dnode.click:focus { outline: none; }
.dnode .t { fill: var(--ink); font-family: var(--sans); font-size: 13px; font-weight: 500; }
.dnode .s { fill: var(--muted); font-family: var(--sans); font-size: 11px; }
.dnode .k { fill: var(--accent); font-family: var(--mono); font-size: 10.5px; font-weight: 500; }
.dedge { stroke: var(--muted); stroke-width: 1.4; fill: none; }
.dedge.fb { stroke: var(--accent); stroke-dasharray: 5 4; }
.dhead { fill: var(--muted); }
.dhead.fb { fill: var(--accent); }
.dloop { fill: var(--accent-soft); fill-opacity: .45; stroke: var(--accent); stroke-width: 1; }
.dlabel { fill: var(--accent); font-family: var(--sans); font-size: 12px; font-weight: 700; }
.dnote { fill: var(--muted); font-family: var(--sans); font-size: 11.5px; }

details.step { border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); min-width: 0; }
details.step > summary { list-style: none; cursor: pointer; padding: 12px 16px; display: grid; grid-template-columns: 44px minmax(0,1fr) auto; gap: 10px; align-items: baseline; }
details.step .sid { font-family: var(--mono); font-size: 12px; color: var(--accent); }
details.step .st { display: grid; gap: 2px; }
details.step .st b { font-size: 15px; font-weight: 500; color: var(--ink); }
details.step .st small { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.step-body { border-top: 1px solid var(--rule); padding: 16px; display: grid; gap: 16px; min-width: 0; }
.checklist { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; }
.checklist div { border: 1px solid var(--rule); border-radius: 8px; padding: 8px 12px; display: grid; gap: 4px; font-size: 13px; color: var(--ink-2); align-content: start; }

.lanes-wrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: 10px; background: var(--surface); padding: 12px 12px 6px; position: relative; }
svg.lanes { display: block; width: 100%; min-width: 820px; height: auto; }
.lanes .grid { stroke: var(--rule); stroke-width: 1; }
.lanes .axis { fill: var(--muted); font-family: var(--mono); font-size: 11px; }
.lanes .lane-l { fill: var(--ink-2); font-family: var(--sans); font-size: 12px; }
.lanes .dot { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.lanes .dot.hollow { fill: var(--surface); stroke: var(--accent); stroke-width: 1.6; }
.lanes .hit { fill: transparent; cursor: pointer; }
.lanes g.m:hover .dot, .lanes g.m:focus .dot { stroke: var(--ink); }
.lanes g.m:focus { outline: none; }
.lanes .brk { stroke: var(--muted); stroke-width: 1; }
.vtip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; color: var(--ink); max-width: 320px; box-shadow: 0 4px 16px rgba(0,0,0,.12); display: grid; gap: 2px; z-index: 3; }
.vtip small { color: var(--muted); font-family: var(--mono); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--muted); align-items: center; padding: 4px 4px 0; }
.legend svg { vertical-align: middle; }
.classic-list { display: grid; gap: 10px; }
details.classic { border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); min-width: 0; }
details.classic > summary { list-style: none; cursor: pointer; padding: 10px 16px; display: grid; grid-template-columns: 52px minmax(0,1fr) auto; gap: 10px; align-items: baseline; }
details.classic > summary::-webkit-details-marker { display: none; }
details.classic .yr { font-family: var(--mono); font-size: 13px; color: var(--ink); }
details.classic .ti { display: grid; gap: 2px; }
details.classic .ti b { font-size: 14.5px; font-weight: 500; }
details.classic .ti small { font-size: 12px; color: var(--muted); }
details.classic .cit { font-family: var(--mono); font-size: 12px; color: var(--ink-2); text-align: right; white-space: nowrap; }
.classic-body { border-top: 1px solid var(--rule); padding: 12px 16px 16px; display: grid; gap: 12px; }

.gl-wrap { max-height: 72vh; overflow: auto; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); }
.gl td.en { font-weight: 500; color: var(--ink); min-width: 170px; }
.gl td.zh { min-width: 110px; }
.gl td.def { min-width: 300px; color: var(--ink-2); }

@media (max-width: 1000px) {
  .shell { grid-template-columns: minmax(0,1fr); gap: 20px; padding-top: 0; }
  .toc { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); max-height: none; overflow-x: auto; overflow-y: hidden; padding-block: 10px; border-bottom: 1px solid var(--rule); margin-inline: -20px; padding-inline: 20px; }
  .toc .brand, .toc .ramp, .toc li.grp, .toc ol.sub { display: none; }
  .toc ol { display: flex; gap: 4px; margin: 0; white-space: nowrap; }
  .toc a { border-left: 0; border-bottom: 2px solid transparent; padding: 4px 8px; }
  .toc a.on, .toc a.page.cur { border-bottom-color: var(--accent); }
  .toc-mobile { display: grid; gap: 6px; }
  :root { --jump-offset: 72px; }
  .toc { scrollbar-width: none; }
  .toc::-webkit-scrollbar { display: none; }
  .pager { grid-template-columns: minmax(0, 1fr); }
  .pager a.next { grid-column: 1; }
  .layer { grid-template-columns: minmax(0,1fr); gap: 10px; }
  .two, .idea-grid, .path, .anchor-use { grid-template-columns: minmax(0,1fr); }
  .mods { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .starts { grid-template-columns: minmax(0,1fr); }
}
@media (max-width: 560px) {
  .shell { padding-inline: 16px; }
  .toc { margin-inline: -16px; padding-inline: 16px; }
  .panel { padding: 16px; }
  details.idea > summary { grid-template-columns: minmax(0,1fr) auto; }
  details.idea .rank { display: none; }
  details.step > summary { grid-template-columns: minmax(0,1fr) auto; }
  details.step .sid { display: none; }
  details.classic > summary { grid-template-columns: 44px minmax(0,1fr); }
  details.classic .cit { grid-column: 2; text-align: left; }
  .mods { grid-template-columns: minmax(0,1fr); }
  .area-body, .idea-body, .concept-body, .step-body { padding-inline: 12px; }
}

/* ---------- overflow guards: long labels wrap inside cards instead of widening the page ---------- */
.cchip, .chip { max-width: 100%; }
.chips .cchip, .classic-body .chip, .card .chip { white-space: normal; overflow-wrap: anywhere; text-align: left; }
.toc-mobile .chips > * { white-space: nowrap; }
.card, .anchor-use > div, .classic-body, .concept-body, .step-body, .area-body, .idea-body, .blk, .subcard { grid-template-columns: minmax(0, 1fr); }
@media (min-width: 1001px) { .page-head.only-mobile { display: none; } }
@media (max-width: 1000px) { .page-head { margin-bottom: -40px; } }
main { overflow-wrap: break-word; }
.prose, .sec-head, .hero, .threat, .obj, .eqs, .eq, .kv div, .checklist div, .layer .body, .anchor-body, .classic-list, .roadmap { grid-template-columns: minmax(0, 1fr); }
mjx-container[jax="SVG"]:not([display="true"]) { display: inline-block; max-width: 100%; overflow-x: auto; overflow-y: hidden; vertical-align: middle; }
ul.plain, .path ol, .res, .timeline, .stages, .subgrid > *, .cards > * { grid-template-columns: minmax(0, 1fr); }
ul.plain li, .res span, .threat span { overflow-wrap: anywhere; }

</style>
</head>

<div class="shell">

<script type="application/json" id="data">{"meta": {"date": "2026-09-28", "subtitle": "以 Quark（Google，SIGGRAPH Asia 2024）与 Ha et al.（KAIST + Meta，CVPR 2025）两篇实时多视角新视角合成论文为出发点，分三部分展开。第一部分帮你入门：基础知识、进阶专题、经典论文，以及把基础知识和两篇论文逐步对上的精读导读。第二部分梳理 3D 临场（telepresence）的全栈调研：采集、几何、表示、渲染、传输、显示与感知。第三部分给出 18 个经过对抗式查新和模拟 AC 评审的研究方向。", "learn_lede": "面向刚进入 3D 视觉 / 临场方向的研究生，默认你有本科线代、概率、Python 和基础深度学习。建议的用法：按“学习路线”推进；遇到不懂的词查“术语表”；读两篇锚点论文时开着“精读导读”，每一步都能点回需要的基础概念。基础概念卡片也会反过来标出它在 Quark 和 Ha et al. 的哪一步用到。", "foundations_lede": "8 个模块按学习顺序排列。每个概念都有：一句话要点、直觉解释、类比、逐项拆解的公式、带数字的例子、易错点、它在两篇锚点论文中的具体位置、学习资源和自测题。标签“Quark 用到 / Ha 用到”表示该概念是否直接出现在对应论文中。", "guided_lede": "把两篇论文按流水线拆成若干步。每一步写清楚：做什么（输入 → 输出）、白话解释、类比、论文公式逐项拆解、具体超参、为什么这样设计、容易误解的地方和自测题，并链接到需要的基础概念。点击流程图的方框可以直接跳到对应步骤。内容写完后由另一个 agent 对照论文原文逐条核查，并修正了发现的错误。", "advanced_lede": "16 个进阶专题，每个包含核心思想、关键公式、演进时间线、按优先级排序的奠基论文（附 Semantic Scholar / OpenAlex 引用数）、与两篇锚点论文的关系、争论与开放问题。", "classics_lede": "按 6 个主题收录 2025 年及以前发表的高影响论文。入选标准是引用数高或改变了领域走向，并且偏重两篇锚点论文所依赖的工作。每篇都由另一个 agent 复核了是否存在、年份与会议，以及引用数（来源为 Semantic Scholar 或 OpenAlex，2026 年 9 月）。上图横轴 2010 年以前做了压缩。", "survey_lede": "以两篇锚点论文为坐标原点，覆盖 10 个子方向、350 余条论文 / 产品 / 标准，以及全栈地图、范式对比、趋势与挑战。", "ideas_lede": "这些方向来自 5 个独立视角（失败模式、基础模型、系统、问题重构/评测、跨领域）共 30 个 idea，聚类为 18 个方向。每个方向先由一个 agent 专门找“已经被做过”的证据，再由一个模拟 AC 的 agent 重新定位、打分、设计实验。结论：没有一个方向是完全空白的，18 个全部判定为“部分已被做，需要重新定位”。综合分 5 分约等于一篇普通录用论文的水平。列表按综合分排序，点开可看核心论点、查新找到的撞车工作、两周验证实验和止损标准。", "method_zh": "本报告由多 agent 工作流生成，所有 agent 都能联网检索（arXiv API、Semantic Scholar、OpenAlex、网页搜索）。\n\n调研部分：先精读两篇锚点论文（含附录），并对照原文逐条核查未言明的问题，例如 Ha et al. 的运行时间没算立体深度估计，TSDF 消融几乎没有增益。然后分 10 个子方向检索，每个方向 25–45 篇带真实链接的工作，分为里程碑 / 重要 / 相关三档，再由一个综合 agent 写出全景图、范式对比、趋势、重大挑战和阅读清单。\n\n研究方向部分：5 个视角各自提出 idea，聚类为 18 个方向。每个方向先做对抗式查新（抽查引用是否真实存在，至少 10 组检索），再做模拟 AC 评审。\n\n使用说明：这些内容由 AI agent 检索和撰写，可能有遗漏、过时或数字不准，2026 年 7–9 月的新论文覆盖尤其有限。引用或投稿前请务必打开原文核实，尤其是 2026 年的 arXiv 编号、性能数字和引用数。评分只用于比较方向之间的相对强弱，不代表真实的录用概率。\n\n入门学习部分：先固定一份课程骨架（8 个模块、40 个概念、16 个进阶专题），所有内容都用同一套 ID 互相链接。基础知识每个模块由一个 agent 撰写，再由技术编辑 agent 核查公式、数值例子、链接以及与两篇论文的对应关系，共修正 145 处。进阶专题同样经过撰写与复核，修正 95 处。经典论文由 6 个主题检索 agent 汇总并去重，再分批逐篇复核：保留 152 篇，更正 115 篇，剔除 0 篇。精读导读共 26 步，由对抗式核查 agent 对照论文原文修正 70 处。术语表 195 条。", "learn_method_zh": "入门学习部分：先固定一份课程骨架（8 个模块、{concepts} 个概念、{advanced} 个进阶专题），所有内容都用同一套 ID 互相链接。基础知识每个模块由一个 agent 撰写，再由技术编辑 agent 核查公式、数值例子、链接以及与两篇论文的对应关系，共修正 {foundation_fixes} 处。进阶专题同样经过撰写与复核，修正 {advanced_fixes} 处。经典论文由 6 个主题检索 agent 汇总并去重，再分批逐篇复核：保留 {classics} 篇，更正 {classics_corrected} 篇，剔除 {classics_removed} 篇。精读导读共 {steps} 步，由对抗式核查 agent 对照论文原文修正 {guide_fixes} 处。术语表 {glossary} 条。"}, "xref": {"concepts": {"f-linalg": "线性代数、齐次坐标与刚体变换", "f-optim": "优化、鲁棒估计与梯度下降", "f-prob": "概率、加权平均与递归滤波", "f-image": "数字图像：颜色、采样、插值与金字塔", "g-pinhole": "针孔相机模型：内参、外参、投影与反投影", "g-epipolar": "对极几何、三角化与单应", "g-depth": "深度、视差与逆深度采样", "g-sfm": "运动恢复结构（SfM）与光束法平差", "g-rig": "多相机阵列：标定、同步与卷帘快门", "d-stereo": "双目立体匹配：从 SGM 到 RAFT-Stereo", "d-mvs": "多视角立体（MVS）与平面扫描", "d-mono": "单目与视频深度估计", "d-flow": "光流、场景流与图像 warping", "d-tsdf": "截断符号距离场（TSDF）与深度融合", "d-sensors": "深度传感器与噪声特性", "r-raster": "光栅化、z-buffer 与点溅射（splatting）", "r-alpha": "Alpha 合成与 over 算子", "r-volume": "体渲染方程与离散化", "r-raymarch": "光线步进、球面追踪与隐式表面求交", "r-appearance": "反射模型、视角相关外观与光照", "r-reps": "三维表示总览：点、网格、体素、隐式场、高斯", "i-lightfield": "全光函数、光场与 Lumigraph", "i-blending": "视角相关纹理映射与混合权重（ULR）", "i-warping": "基于深度的渲染：前向/后向 warping、空洞与飞点", "i-layered": "分层表示：MPI、LDI 与分层深度图（LDM）", "i-psv": "平面扫描体与学习式视图合成", "l-cnn": "卷积网络、残差块与 U-Net", "l-attention": "注意力机制与 Transformer", "l-encoding": "位置编码、傅里叶特征与射线编码", "l-loss": "损失函数与训练实践", "l-iterative": "学习式迭代细化与展开优化", "l-diffusion": "扩散模型入门", "n-nerf": "神经辐射场（NeRF）", "n-3dgs": "3D Gaussian Splatting（3D 高斯溅射）", "n-generalizable": "可泛化 / 前馈式新视角合成", "n-dynamic": "动态场景与 4D 表示", "v-temporal": "时间一致性、闪烁与时域滤波", "v-metrics": "图像与视频质量指标", "v-codec": "视频编码、传输与延迟预算", "v-perception": "立体视觉感知与 3D 显示"}, "adv": {"a-learned-stereo": "从深度立体匹配到立体基础模型", "a-learned-mvs": "学习式多视角立体与代价体", "a-geo-fm": "前馈三维几何基础模型", "a-nerf-fast": "NeRF 的加速与抗锯齿", "a-3dgs-ext": "3D Gaussian Splatting 的扩展", "a-layered-nvs": "学习式分层表示：从 Stereo Magnification 到 Quark", "a-generalizable-ibr": "可泛化 NeRF 与学习式 IBR", "a-ff-3dgs": "前馈 3DGS 与大重建模型", "a-geometry-free": "无几何 Transformer 渲染器", "a-dynamic-4d": "动态 NeRF、4D 高斯与流式重建", "a-human-capture": "人体表演捕捉与数字人", "a-diffusion-3d": "扩散模型与三维/新视角生成先验", "a-temporal-video": "视频时间一致性方法", "a-telepresence-sys": "三维临场系统设计", "a-compression": "体积视频与神经表示的压缩传输", "a-diff-render": "可微渲染与逆渲染"}}, "site": {"brand": "3D 临场研究图谱", "current": "anchors", "pages": [{"key": "home", "file": "index.html", "label": "概览", "group": null}, {"key": "roadmap", "file": "roadmap.html", "label": "学习路线", "group": "入门学习"}, {"key": "foundations", "file": "foundations.html", "label": "基础知识", "group": "入门学习"}, {"key": "guided", "file": "guided.html", "label": "精读导读", "group": "入门学习"}, {"key": "advanced", "file": "advanced.html", "label": "进阶专题", "group": "入门学习"}, {"key": "classics", "file": "classics.html", "label": "经典论文", "group": "入门学习"}, {"key": "glossary", "file": "glossary.html", "label": "术语表", "group": "入门学习"}, {"key": "anchors", "file": "anchors.html", "label": "锚点论文", "group": "领域调研"}, {"key": "landscape", "file": "landscape.html", "label": "领域全景", "group": "领域调研"}, {"key": "areas", "file": "areas.html", "label": "分方向与论文库", "group": "领域调研"}, {"key": "ideas", "file": "ideas.html", "label": "研究机会", "group": "研究"}, {"key": "method", "href": "index.html#method", "label": "方法与说明", "group": "研究", "alias": true}], "sectionPage": {"top": "index.html", "summary": "index.html", "sitemap": "index.html", "method": "index.html", "roadmap": "roadmap.html", "roadmap-resources": "roadmap.html", "foundations": "foundations.html", "guided": "guided.html", "advanced": "advanced.html", "classics": "classics.html", "reading": "classics.html", "glossary": "glossary.html", "anchors": "anchors.html", "map": "landscape.html", "paradigms": "landscape.html", "trends": "landscape.html", "areas": "areas.html", "papers": "areas.html", "ideas": "ideas.html"}, "prefixPage": [["concept-", "foundations.html"], ["module-", "foundations.html"], ["walk-", "guided.html"], ["guide-", "guided.html"], ["adv-", "advanced.html"], ["classic-", "classics.html"], ["stage-", "roadmap.html"], ["area-", "areas.html"], ["idea-", "ideas.html"], ["anchor-", "anchors.html"]]}, "anchors": {"quark": {"citation": {"title": "Quark: Real-time, High-resolution, and General Neural View Synthesis", "authors": "John Flynn*, Michael Broxton*, Lukas Murmann* (共同一作), Lucy Chai, Matthew DuVall, Clément Godard, Kathryn Heal, Srinivas Kaza, Stephen Lombardi, Xuan Luo, Supreeth Achar, Kira Prabhu, Tiancheng Sun, Lynn Tsai, Ryan Overbeck", "affiliations": "Google (Mountain View, CA)", "venue": "ACM Transactions on Graphics 43(6) / SIGGRAPH Asia 2024 (DOI 10.1145/3687953; arXiv 注释为 SIGGRAPH Asia 2024 camera ready)", "year": 2024, "url": "https://arxiv.org/abs/2411.16680", "project_page": "https://quark-3d.github.io/", "code_status": "未开源。截至 2026-09 arXiv 仅有 v1 (2024-11-25)；项目主页上的 Code 与 Data 按钮在 HTML 源码中被注释掉，只提供论文、视频 (https://youtu.be/w9Oqhaqbsyo) 和逐数据集的结果对比页。论文也未说明训练/推理所用的深度学习框架。"}, "tldr_zh": "Quark 是 Google 提出的 feed-forward、可泛化的新视角合成网络。输入为 8 路（可扩展到 4–16 路）已标定的 RGB 图像或视频流，每帧在目标视角视锥内即时预测一个分层深度图（LDM：每层含 depth、density、对各输入图像的 blend weights），再用 IBR 方式把全分辨率输入图像混合、over 合成出新视角。重建加渲染合计在单张 A100 上达到 1080p/30fps。它的核心是把 DeepView 的“learned render-and-refine”（学习化梯度下降）嵌入 UNet 式的多尺度结构：由粗到细逐级提高空间分辨率，同时用 layer collapse 减少层数，并用 One-to-many attention（把 K/V 投影折叠进 Q 和输出投影）做低成本的跨视角融合。在 RFF、Shiny、N3DV 上，它的质量和速度都超过 ENeRF、GPNR、SIMPLI；在 DL3DV 上甚至超过逐场景优化的 Zip-NeRF 和 3DGS。代价是没有时间一致性，逐帧逐视角重建带来闪烁，而且只能在有限视角覆盖的范围内工作。", "problem_setting_zh": "任务是从稀疏、宽基线（相机间距最大约 30cm）的已标定多视角图像或同步视频中实时合成任意新视角。“实时”指场景重建与渲染合计，而不像 NeRF/3DGS 那样只有渲染实时、重建仍需离线优化。输入包括 M 张 RGB 图、相机内外参，以及由 SfM 点估计的近/远平面；训练与主实验中 M=8，取离目标视角最近的 8 台相机。输出是目标视角的 RGB，可选输出深度图。方法不做逐场景训练，要求跨数据集泛化。作者把单图/单目/生成式/人体先验类方法视为另一类问题，不做比较。场景对象是通用静态或动态场景，不是专门的人像，论文也没有专门针对 telepresence 做评测。", "pipeline_zh": [{"stage": "1. 输入编码 (Encode Input Images)", "detail": "M 张输入图像经残差 CNN 与带步长的 mean-pooling 编码为 K 级特征金字塔，通道数 C=32（Quark 最高分辨率一级为 288×480，此外有 144×240、72×120、36×60 等级）。同时计算射线方向编码 γ：取输入射线与目标 LDM 视锥近/远平面交点，在投影空间求 2D 差向量，经 tanh 后做 8 个 octave 的正弦编码，再线性投影到 C 维。输入射线与目标射线重合时编码为 0。该编码先在低分辨率计算，再双线性上采样到各级。"}, {"stage": "2. 学习式初始化 (Learned Initialization)", "detail": "用一个可学习的 32 维特征广播成初始 feature volume V(0)，层深度固定为等视差间隔的 anchor，把编码后的图像特征 back-project（Bp）到这些平面上，不做渲染比较。Quark 的初始 LDM 为 24 层×36×64，Quark+ 为 32 层×54×96。"}, {"stage": "3. 迭代 Update & Fuse（共 5 步，UNet 式由粗到细）", "detail": "每步：(a) 解码当前 V 得到中间 LDM（depth、density、appearance c=sigmoid(V·W_a)），用双线性 splat 投到每个输入视角后 over 合成得到 Ĩ，不用光追或光栅化；(b) Update Block 用小型残差 CNN 结合 Ĩ、该级输入特征 I_k 和射线编码，生成每视角 update feature，其中含匹配线索和“渲染 vs 观测”的可见性残差；(c) 用当前深度把 update feature 反投影回 LDM 层空间，得到 Δ（类似 plane-sweep volume）；(d) Fusion Block 反复做 One-to-many attention（V 作为单一 query 对 M 个视角的 Δ 做 cross-attention），与 3×3 残差卷积交替，结构为 pre-LN Transformer。第 1、3、4 步把空间分辨率翻倍；最后两步前各做一次 Layer Collapse（残差 MLP：直通支路取相邻两层均值，残差支路取两层拼接），层数减半。Quark：24 层 36×64 → 24 层 72×128 → 12 层 144×256 → 6 层 288×512；Quark+：32 层 → 16 层 → 8 层 432×768。注意力头数随分辨率递减，依次为 A4、A2、A1。"}, {"stage": "4. 深度参数化", "detail": "每层深度被限制在近/远平面 (η, f) 之间的等视差带内：anchor δ=(ℓ−0.5)/L，d_ℓ = [(δ + 0.5/L·tanh(V W_d))·(1/η − 1/f) + 1/f]^{-1}，即每层只能在自己的视差带内移动。density 为 σ=sigmoid(V W_σ)。"}, {"stage": "5. Upsample & Activate", "detail": "最终 LDM 的未激活属性（depth、density、blend logits）先双线性上采样到输出分辨率，再施加非线性。Quark 上采样 3.75×，Quark+ 论文写 2.4×，但按表 9 的 432→1080 实为 2.5×。这一做法借鉴 ReLU Fields 的 post-activation，可以在平滑区插值的同时保持锐利的遮挡边界。blend weights 由最后一个 Fusion Block 的 One-to-many attention 产生，softmax 推迟到上采样之后才施加。"}, {"stage": "6. IBR 渲染", "detail": "c_target = O(Σ_m β_m · P^T_θ(I, d), σ)：把全分辨率输入图像按各层深度反投影到 LDM 层，用每层每像素的 M 维 blend weights 做凸组合得到每层 RGB，再按 σ 由后向前 over 合成。推理时使用 CUDA 优化渲染器，1080p 约 1.3 ms/帧。每帧、每个目标视角都重新生成 LDM，用完即丢弃。"}, {"stage": "7. One-to-many attention 的复杂度技巧", "detail": "单 query 的 cross-attention 中，把 W_i^K 折叠进 W_i^Q、W_i^V 折叠进 W^O，于是 head_i = Attention(V W_i^q, Δ, Δ)，完全省去对 M 个 Δ 的 K/V 投影矩阵乘。这些逐视角计算主要在图像空间完成后再 lift 到层空间。理论 FLOPs（d_k=32，N=8）：h=1 时为标准 cross-attention 的 1/8.1，h=2 时为 1/4.1，h=4 时为 1/2.0，h=8 时相同。h=4 时输入数从 4 增到 64，标准注意力开销涨 13.0×，本方法只涨 1.9×（接近 O(1)）。但编码与逐视角 update 仍为 O(M)，总运行时间约为 T_V + M·T_image。"}], "key_design_choices_zh": [{"choice": "以目标视角对齐的 LDM（分层深度图）作为逐帧即时生成、即时丢弃的中间表示", "rationale": "LDM 介于全体积表示和表面之间：层数相当于体渲染的采样步，每层深度贴合平滑表面。它是 2D 结构，可以直接使用高效的 2D 网络，而且渲染只需逐像素 over 合成。为每个目标视角单独生成，可以把几何和混合权重“过拟合”到该视角，从而弥补 LDM 本身不能全方向观察的缺点，并在一定程度上模拟反射和折射。", "alternatives_rejected": "平面 MPI/MSI（DeepView、StereoMag）：层数需求大；需显式实例化网格的 layered mesh（Immersive LF Video、SIMPLI）；全局一致的 NeRF/3DGS：需要慢速离线优化；ENeRF 的单层带厚度深度：深度复杂场景下失败。"}, {"choice": "学习式 render-and-refine，并嵌入多尺度 UNet，同时“升分辨率、降层数”", "rationale": "沿用 DeepView 的学习化梯度下降思路：把当前估计渲染回输入视角，比较差异后再更新，约 5 次迭代即可收敛。早期在极低分辨率下用多层密集采样深度、定位表面，后期在高分辨率下用少量层贴合表面，把计算量在空间维和深度维之间取得平衡。消融显示：去掉 render-and-refine（Ĩ 置零）PSNR 从 30.41 降到 29.71；去掉 layer collapse 质量略升（30.56），但运行时间 +115%。", "alternatives_rejected": "单分辨率的 render-and-refine（DeepView、SIMPLI 等）速度太慢，SIMPLI 需 4.4s；一次性前馈、不做迭代：质量更低。"}, {"choice": "IBR 混合输出（对输入像素做 blend weights 凸组合）而非直接回归 RGB", "rationale": "网络只需在约 512×288 的分辨率下求解，高频纹理直接取自全分辨率输入图，因此能用很低的计算代价实现 1080p 到 2K 输出。消融中改为直接输出 RGB 时 PSNR 从 30.41 降到 29.18，LPIPS 从 0.154 升到 0.179，是所有消融中退化最大的一项。", "alternatives_rejected": "网络直接解码 RGB（SIMPLI 式外观）：输出更糊；NeX/Ref-NeRF 式的显式视角相关外观模型：作者留作未来工作。"}, {"choice": "One-to-many attention 做跨视角融合，并用射线方向编码代替位置编码", "rationale": "方法不依赖视角顺序，可支持可变的输入数量，而且表达力强于均值/方差/max-pool 这类聚合。去掉 cross-attention（把 keys 置零，相当于取均值）时 PSNR 从 30.41 降到 29.73。射线编码让网络偏向离目标视角近的射线，有利于非 Lambertian 表面，但在消融中收益很小（30.41 vs 30.32）。", "alternatives_rejected": "NerFormer 的跨视角 self-attention：O(M²)；AggTransformer 的单次 softmax 聚合：表达力不足；简单拼接或 RNN：不具顺序不变性；均值/方差统计量。"}, {"choice": "只选取离目标最近的 8 个视角（训练时从最近 16 个中随机抽 8 个）", "rationale": "控制每帧计算量以保证实时，同时通过随机抽样提升对视角选择的鲁棒性。", "alternatives_rejected": "用全部视角优化一个全局几何（NeRF/3DGS）；学习式视角选择（作者提到可作为未来工作）。"}], "training_zh": "训练数据是 Spaces、RFF (LLFF)、NeX-Shiny、SWORD 四个静态多视角数据集的加权混合，前三者之外各数据集等权，较小的 Shiny 权重为 0.25。训练中没有任何动态或视频数据，也没有 DL3DV、Mip-NeRF360、T&T 或 N3DV。按样本调整内部 LDM 的宽高比，同时保持每层像素总数与 1080p 模型相同。近/远平面按 SfM（COLMAP）点的深度分布逐样本自适应设定。每个样本以 8 个输入视角（从离目标最近的 16 个中随机选取）渲染一个 held-out 目标视角。损失为 10·L1 + LPIPS。batch size 16，单台 16×A100 机器。先在半分辨率输入和半分辨率 LDM 上训练 250K 步，再在全分辨率上训练 350K 步，合计 600K 步。目标图与渲染图随机裁剪：低分辨率阶段 256×256，高分辨率阶段 512×512。学习率 20K 步内 warmup 到 1.5e-4，保持 520K 步，再在“最后 680K 步”内 cosine 衰减到 0。注意 20K+520K+680K=1.22M，与文中总计 600K 步矛盾，原文存在笔误或未说明。全模型使用 residual scaling (GPT-2 式) 以稳定训练。消融模型在半分辨率下只训练 250K 步。另有一个支持 4–16 张可变输入的变体，用于 Spaces 基线距离实验。", "system_perf": [{"item": "主打性能", "value": "1080p (1920×1080) 重建+渲染合计 30fps，单张 NVIDIA A100，8 路输入"}, {"item": "Quark 运行时间（表1，含重建+渲染）", "value": "1024×768: 32.2 ms；2048×1536: 33.0 ms"}, {"item": "Quark+ 运行时间", "value": "1024×768: 91.9 ms；2048×1536: 92.6 ms（约 11 fps，作者称“interactive”）"}, {"item": "基线运行时间（同硬件）", "value": "ENeRF 205 ms (1024×768) / 811 ms (2048×1536)；SIMPLI 4.4 s；GPNR 25 s。Quark 比 ENeRF 快 >6×（2K 下 >20×），比 SIMPLI 快 >100×，比 GPNR 快 >700×"}, {"item": "最终 IBR 渲染器", "value": "CUDA 优化，1080p 约 1.3 ms/帧"}, {"item": "内部 LDM 尺寸 Quark", "value": "初始 24 层×36×64 → 输出 6 层×288×512，C=32，上采样 3.75× 到 1080p"}, {"item": "内部 LDM 尺寸 Quark+", "value": "初始 32 层×54×96 → 输出 8 层×432×768，上采样约 2.5×（论文写 2.4×）"}, {"item": "输入视角数扩展", "value": "运行时间随视角数线性增长 (T_V + M·T_image)；在 32 个输入视角以内保持 >10 fps（图7）"}, {"item": "输入基线", "value": "主实验 8 视角、相距最大约 30 cm；Spaces 实验中基线约 10/20/30 cm"}, {"item": "训练硬件", "value": "单台 16×A100 机器，600K 步（训练总时长未报告）"}, {"item": "未报告项", "value": "显存占用、端到端延迟（采集/编码/传输）、消费级 GPU 上的速度、深度学习框架、立体（双目）渲染的开销均未报告"}], "results_zh": [{"dataset": "Real Forward Facing (RFF/LLFF) @1024×768", "finding": "Quark 26.03 / 0.850 / 0.137 (PSNR/SSIM/LPIPS)，Quark+ 26.53 / 0.861 / 0.127；GPNR 25.42 / 0.816 / 0.218，ENeRF 23.71 / 0.780 / 0.224，SIMPLI 23.35 / 0.812 / 0.191。在 2048×1536 下 Quark 为 25.42 / 0.809 / 0.233，ENeRF 为 23.62 / 0.775 / 0.308。"}, {"dataset": "NeX-Shiny @1024×768", "finding": "Quark 26.51 / 0.866 / 0.108，Quark+ 26.67 / 0.869 / 0.104；ENeRF 25.75 / 0.836 / 0.143，GPNR 25.98 / 0.840 / 0.160，SIMPLI 25.42 / 0.844 / 0.132。在 2048×1536 下 Quark 降为 24.66 / 0.799 / 0.174（LPIPS 明显变差）。"}, {"dataset": "Neural 3D Video (N3DV，动态) @1024×768", "finding": "协议：视频裁剪到 300 帧，每 10 帧评一次，以 0 号相机为目标。Quark 31.57 / 0.942 / 0.127，Quark+ 31.95 / 0.945 / 0.122；ENeRF 29.86 / 0.922 / 0.172，GPNR 29.80 / 0.916 / 0.215，SIMPLI 28.79 / 0.919 / 0.169。在 2048×1536 下 Quark 为 31.46，ENeRF 为 29.62。"}, {"dataset": "DL3DV-10K benchmark（与逐场景优化方法比较，基线数值取自 DL3DV 论文，较低分辨率）", "finding": "Quark 31.31 / 0.932 / 0.103，Quark+ 31.53 / 0.935 / 0.101，高于 Zip-NeRF 31.22 / 0.921 / 0.112、Mip-NeRF360 30.98 / 0.911 / 0.132、3DGS 29.82 / 0.919 / 0.120、Instant-NGP 25.01、Nerfacto 24.61。Quark 未在 DL3DV 上训练。"}, {"dataset": "Mip-NeRF360（3DGS 论文使用的场景）", "finding": "Quark 26.60 / 0.774 / 0.214，Quark+ 26.91 / 0.784 / 0.207；M-NeRF360 27.69 / 0.792 / 0.237，3DGS-30K 27.21 / 0.815 / 0.214。Quark 排第三。"}, {"dataset": "Tanks&Temples", "finding": "Quark 23.60 / 0.852 / 0.138，Quark+ 23.83 / 0.857 / 0.133，高于 3DGS-30K 的 23.14 / 0.841 / 0.183，排名第一。"}, {"dataset": "Deep Blending (Playroom)", "finding": "Quark 23.61 / 0.837 / 0.289，远低于 3DGS-30K 的 30.04 / 0.906 / 0.242 和 M-NeRF360 的 29.66，只优于 Plenoxels 和 INGP。原因是最近 8 个视角覆盖不足；即使改用考虑视角角度差的选择启发式，仍出现硬边伪影。"}, {"dataset": "Spaces（基线距离鲁棒性，4–16 张可变输入模型）", "finding": "小基线（约 10cm）29.03 / 0.9215 / 0.1586，中基线（约 20cm）29.57 / 0.9258 / 0.1541，大基线（约 30cm）29.43 / 0.9241 / 0.1541，三者表现相近。作者称 DeepView 在小基线上最好，但 SSIM 因预处理差异不可直接比较，也未给出 DeepView 的具体数值对比。"}], "ablations_zh": ["设置：以 Quark+ 为基线，在半分辨率上训练 250K 步，在 DL3DV 上以 1080p 评测。基线结果为 PSNR 30.4071 / SSIM 0.9165 / LPIPS 0.1543。运行时间变化为未优化实现下的近似值。", "No layer collapse：运行时间 +115.18%，质量略升（30.5635 / 0.9184 / 0.1531）。说明减层以很小的质量代价换来了超过 2 倍的加速。", "Fewer iterations（去掉前两个 Update & Fuse，初始分辨率翻倍）：运行时间 −17.49%，结果 30.3227 / 0.9153 / 0.1554，几乎不掉点。作者承认这提示存在更优的速度/质量权衡，设计空间没有充分搜索。", "No ray directional encoding（置零）：运行时间 −1.28%，结果 30.3179 / 0.9157 / 0.1555，收益很小。", "No render-and-refine（渲染图 Ĩ 置零）：运行时间 −5.22%，结果 29.7106 / 0.9111 / 0.1599，PSNR 约 −0.7 dB。", "No cross attention（keys 置零，退化为均值；计算 blend weights 时保留完整 keys）：运行时间 −3.09%，结果 29.7289 / 0.9097 / 0.1621。", "RGB Output（直接用 appearance 特征的前 3 通道作为输出，而非 IBR 混合）：运行时间 −4.56%，结果 29.1779 / 0.8926 / 0.1788，是退化最大的一项。", "Quark vs Quark+（附录图9，SWORD）：更大的 LDM 可以捕获更细的深度细节，差异主要体现在深度图特写中。", "作者自述：分数差异很小，因为 DL3DV 多数场景较简单，差异集中在物体边界的少量像素上。"], "limitations_stated_zh": ["不强制时间一致性：视频逐帧独立重建，会产生闪烁。目标相机移动时，作为输入的相机集合会发生切换，这也会引起闪烁；输入之间曝光差异大时尤为明显。在这一点上，离线的全场景方法（NeRF/3DGS）优于 Quark。", "blend weights 是输入颜色的凸组合，无法准确表示视角相关材质，只能借助逐帧优化和射线编码“近似”复现部分反射和折射。", "blend weights 对输入曝光不一致、焦距不同的情况敏感，会产生边缘伪影和闪烁；相机标定有误差时，会产生错误的硬边，而不是其他方法那种较温和的模糊。", "为保证实时只能使用少量输入（8–16 张）。当最近视角覆盖不足时（Mip-NeRF360、Deep Blending），视图边缘附近会出现伪影，失败方式比逐场景优化方法更难看（硬边而非模糊）。需要更好的视角选择或全局几何。", "所有评测指标都不衡量时间闪烁。", "超参数众多，设计空间没有充分探索；可能存在同等质量但更快的配置。", "LDM 与 LM 在历史上的问题是不能从任意方向观看；Quark 靠逐视角重新生成来缓解这一点。", "消融使用未优化的实现，运行时间变化为近似值；消融分数差异很小。"], "limitations_unstated_zh": ["“2K 实时”的含义需要细看。内部 LDM 分辨率是固定的，Quark 为 6 层×288×512，1024×768 与 2048×1536 的运行时间几乎相同（32.2 vs 33.0 ms），说明高分辨率输出主要来自 IBR 取样和双线性上采样，几何分辨率并没有提高。表1中 Quark 从 1024×768 到 2048×1536，Shiny 上 PSNR 从 26.51 降到 24.66、LPIPS 从 0.108 升到 0.174，RFF 上 LPIPS 从 0.137 升到 0.233，高分辨率下的感知质量明显退化。", "“30fps”只是单张 A100 上的纯网络推理吞吐，不含采集、解码、标定、传输和显示。论文没有报告端到端延迟、显存占用和消费级 GPU 上的数据，对 telepresence 部署而言关键信息缺失。", "表示是目标视角相关的：每个新视角（包括 VR/3D 显示器所需的左右眼两个视角，或多个观众）都要完整跑一遍网络，计算量随视点数线性增长。论文全文没有讨论立体或多视点输出（全文检索无 stereo 渲染相关讨论），这与 3DGS 等“一次重建、多视角渲染”的方案有本质差别。", "表1 的比较存在混杂因素：基线是在 RFF+IBRNet 数据上重训的，Quark 则用 Spaces+RFF+Shiny+SWORD 训练，训练数据不同。而且 Quark 在 RFF 和 Shiny 的评测场景是否从训练集中剔除，论文没有说明（训练集包含这两个数据集，评测只说明了 held-out 目标视角）。", "DL3DV 和 3DGS 数据集的比较中，基线数值直接照搬原论文，分辨率和预处理未必与 Quark 一致，作者承认 DL3DV 基线“只在较低分辨率下有分数”。另外，每 8 帧取一帧作为目标、其余相邻帧作为输入，在稠密视频轨迹上是插值式设定，最近邻视角非常接近，这天然有利于 IBR。它与摘要宣称的“稀疏宽基线”场景并不一致。", "没有与同期的 feed-forward 3DGS 路线比较，也没有引用 pixelSplat、MVSplat、GPS-Gaussian（均早于投稿），以及同期的 LVSM/GS-LRM 类大模型。因此“SOTA real-time generalizable”的结论只相对于 ENeRF、GPNR、SIMPLI 这三个较旧的基线成立。", "动态场景评测很薄弱：训练集里没有动态数据，动态评测只有 N3DV 一个数据集，且只以 0 号相机为目标、每 10 帧评一帧，没有任何时间稳定性指标（如 tOF、flicker）。也没有针对人像或人体的评测（面部、头发、快速运动），而这些正是 telepresence 的核心内容。", "方法依赖精确的相机标定，以及由 SfM 点估计的逐场景近/远平面。在实时系统中，深度范围怎样在线获取、视锥外物体怎样处理，论文都没有讨论；深度被硬性限制在各层等视差带内，也意味着 [η, f] 设置不当时会直接失败。", "消融只做了单次训练，没有方差；各项差异很小（例如射线编码只带来 0.09 dB），且是在半分辨率、250K 步的缩短设置下完成的，统计显著性存疑。", "原文存在若干数值不一致：学习率日程（20K+520K+680K=1.22M）与总训练步数 600K 矛盾；Quark+ 输出 LDM 在正文写作 768×438，表9 为 432×768，据此上采样因子应为 2.5× 而非文中的 2.4×；表8 中编码特征为 36×60，而 LDM 为 36×64。这些都是小问题，但会影响复现。", "代码和权重均未开放，复现门槛高。后续工作（iLRM、MVP、AnySplat、LVT 等）基本只在相关工作部分引用 Quark，没有与它做定量对比，Quark 的结论至今缺少独立验证。"], "lineage": {"predecessors": [{"title": "DeepView: View Synthesis with Learned Gradient Descent", "year": 2019, "url": "https://arxiv.org/abs/1906.07316", "note_zh": "同一作者团队（Flynn、Broxton、DuVall、Overbeck）。提出 learned gradient descent / render-and-refine 和 MPI 表示，并用 max-pool 做跨视角聚合，还发布了 Spaces 数据集。Quark 核心思想的直接来源。"}, {"title": "Immersive Light Field Video with a Layered Mesh Representation", "year": 2020, "url": "https://doi.org/10.1145/3386569.3392485", "note_zh": "Google 团队（Broxton、Flynn、Overbeck、Debevec 等）的 SIGGRAPH 2020 论文。先用 MSI 求解再转换为 layered mesh 做沉浸式光场视频，是 LDM/LM 表示的前身，但为离线处理。"}, {"title": "Stereo Magnification: Learning View Synthesis using Multiplane Images", "year": 2018, "url": "https://arxiv.org/abs/1805.09817", "note_zh": "MPI 表示的开山之作，Flynn 为共同作者；Quark 的分层半透明表示源自此线。"}, {"title": "Stereo Magnification with Multi-Layer Images", "year": 2022, "url": "https://arxiv.org/abs/2201.05023", "note_zh": "StereoLayers（Khakhulin 等），用少量非平面层（layered mesh）代替 MPI，Quark 将其列为 LM 类前作。"}, {"title": "Self-improving Multiplane-to-layer Images for Novel View Synthesis", "year": 2022, "url": "https://arxiv.org/abs/2210.01602", "note_zh": "SIMPLI（WACV 2023），同样采用 render-and-refine 与 LDM 几何，是与 Quark 最接近的基线。Quark 通过多尺度和 One-to-many attention 实现了超过 100 倍的加速和更好的质量。"}, {"title": "Efficient Neural Radiance Fields for Interactive Free-viewpoint Video", "year": 2021, "url": "https://arxiv.org/abs/2112.01517", "note_zh": "ENeRF（SIGGRAPH Asia 2022），在 Quark 之前最快的可泛化 NeRF，用单层带厚度深度引导采样。Quark 的主要速度对标对象，在深度复杂场景中不如 Quark。"}, {"title": "Generalizable Patch-Based Neural Rendering", "year": 2022, "url": "https://arxiv.org/abs/2207.10662", "note_zh": "GPNR（ECCV 2022），沿极线取 patch 送入 Transformer 回归颜色。质量强但慢（25s），Quark 比它快 700 倍以上。"}, {"title": "IBRNet: Learning Multi-View Image-Based Rendering", "year": 2021, "url": "https://arxiv.org/abs/2102.13090", "note_zh": "可泛化 IBR 与跨视角特征聚合（均值/方差统计）的代表作；Quark 的基线在其数据上重训。"}, {"title": "Local Light Field Fusion: Practical View Synthesis with Prescriptive Sampling Guidelines", "year": 2019, "url": "https://arxiv.org/abs/1905.00889", "note_zh": "提供 RFF/LLFF 数据集与 MPI 融合思路，Quark 的训练与评测数据之一。"}, {"title": "NeX: Real-time View Synthesis with Neural Basis Expansion", "year": 2021, "url": "https://arxiv.org/abs/2103.05606", "note_zh": "提供 Shiny 数据集与视角相关外观的基函数展开，Quark 把显式视角相关建模列为未来工作。"}, {"title": "ReLU Fields: The Little Non-linearity That Could", "year": 2022, "url": "https://arxiv.org/abs/2205.10824", "note_zh": "“先插值后激活”能在低分辨率网格上得到锐利边界。Quark 的 Upsample & Activate 由此而来。"}, {"title": "An Introduction to Transformers", "year": 2023, "url": "https://arxiv.org/abs/2304.10557", "note_zh": "Turner 的教程，其中指出可把 K/V 投影折叠进 Q 和输出投影的冗余，这是 One-to-many attention 的理论依据。"}, {"title": "GPS-Gaussian: Generalizable Pixel-wise 3D Gaussian Splatting for Real-time Human Novel View Synthesis", "year": 2023, "url": "https://arxiv.org/abs/2312.02155", "note_zh": "并行路线，Quark 未引用：面向人像的实时 feed-forward 3DGS，是 telepresence 场景下的重要对照，锚点论文 B 引用了它。"}], "successors": [{"title": "LVT: Large-Scale Scene Reconstruction via Local View Transformers", "year": 2025, "url": "https://arxiv.org/abs/2509.25001", "note_zh": "SIGGRAPH Asia 2025，与 Quark 团队重叠（Flynn、Chai、Heal、Luo）。沿用“近邻视角信息最有用”的思路，只在局部邻域内做注意力以避免二次复杂度，并用相对几何变换编码代替位置编码。输出带视角相关颜色和不透明度的 3DGS，可一次前向重建任意大的场景。是 Quark 局部视角融合思想的延伸，表示从逐视角 LDM 换成了持久的 3DGS。"}, {"title": "Learning Efficient Fuse-and-Refine for Feed-Forward 3D Gaussian Splatting", "year": 2025, "url": "https://arxiv.org/abs/2503.14698", "note_zh": "NeurIPS 2025，原名 SplatVoxel，作者含 Quark 的 Chai、Luo、Lombardi、Sun。把 pixel-aligned Gaussians 聚合到由粗到细的体素层级，用稀疏体素 Transformer 融合精化，支持带历史记忆的动态场景在线重建，单张 H100 上 15 fps、350 ms 延迟。其附表把 Quark 列为不支持动态和时间融合的方法，直接针对 Quark 的时间一致性缺陷。"}, {"title": "Online Neural Space Time Memory for Dynamic Novel View Synthesis", "year": 2026, "url": "https://arxiv.org/abs/2607.15271", "note_zh": "与 Quark 作者高度重叠（Tsai、Kaza、Sun、Lombardi、Luo，以及 Seitz）。面向多视角流式视频的在线 NVS，用 Test-Time Training 记忆存储长时历史：约 1 FPS 更新记忆，逐帧应用记忆，以 30 FPS 输出新视角；在 256×256、单张 H100 上达到摊销实时，针对动态人体运动和分钟级记忆。可看作 Quark“无时间一致性”问题的团队内后续方案。"}, {"title": "Scaling Transformer-Based Novel View Synthesis Models with Token Disentanglement and Synthetic Data", "year": 2025, "url": "https://arxiv.org/abs/2509.06950", "note_zh": "ICCV 2025，作者含 Kaza、Luo、Lombardi。用扩散模型生成的合成数据扩展 LVSM 类 Transformer NVS 的训练集，并提出 token disentanglement。相关工作中称 Quark 能在高得多的分辨率下达到 SOTA。"}, {"title": "iLRM: An Iterative Large 3D Reconstruction Model", "year": 2025, "url": "https://arxiv.org/abs/2507.23277", "note_zh": "迭代精化的 feed-forward 3DGS 大模型，把场景表示与输入图像解耦以提升可扩展性。明确批评 Quark 的表示局限于目标视角，缺乏显式、持久的 3D 表示。"}, {"title": "Multi-view Pyramid Transformer: Look Coarser to See Broader", "year": 2025, "url": "https://arxiv.org/abs/2512.07806", "note_zh": "采用视角间由局部到全局、视角内由细到粗的双层级结构，可一次前向从数十到数百张图重建大场景（3DGS）。在引言中把 Quark 作为多尺度高效设计的参照。"}, {"title": "AnySplat: Feed-forward 3D Gaussian Splatting from Unconstrained Views", "year": 2025, "url": "https://arxiv.org/abs/2505.23716", "note_zh": "ACM TOG，从无位姿图像集合一次前向预测 3DGS 和相机参数，去掉了 Quark 依赖精确标定的前提；引用 Quark。"}, {"title": "tttLRM: Test-Time Training for Long Context and Autoregressive 3D Reconstruction", "year": 2026, "url": "https://arxiv.org/abs/2602.20160", "note_zh": "CVPR 2026，用 TTT 层实现线性复杂度的长上下文、自回归、流式 3D 重建，可解码为 GS；引用 Quark。"}, {"title": "LiveStre4m: Feed-Forward Live Streaming of Novel Views from Unposed Multi-View Video", "year": 2026, "url": "https://arxiv.org/abs/2604.06740", "note_zh": "面向无位姿多视角视频直播的 feed-forward NVS：先用多视角 ViT 重建关键帧，再用扩散 Transformer 插值以保证时间一致性，并内置相机位姿预测器。在“免标定”和“时序稳定”两点上直接回应 Quark 的限制。"}, {"title": "GaussianNexus: Room-Scale Real-Time AR/VR Telepresence with Gaussian Splatting", "year": 2025, "url": "https://doi.org/10.1145/3746059.3747693", "note_zh": "UIST 2025，房间尺度实时 AR/VR telepresence 系统，基于 3DGS；引用 Quark，属于 HCI/系统侧的应用后继。"}, {"title": "Tele360: Real-Time Feed-Forward Human Reconstruction from Sparse Unposed Cameras", "year": 2026, "url": "https://arxiv.org/abs/2609.15032", "note_zh": "竞争路线（未核实是否引用 Quark）：从稀疏、无位姿 RGB 流实时 feed-forward 重建动态人体 3DGS，用视频编码器把 Gaussian maps 推流到远端，在单张消费级 GPU 上实现 2K 输入到渲染超过 25 FPS。与 Quark 的逐视角服务端渲染形成对照。"}, {"title": "LVSM: A Large View Synthesis Model with Minimal 3D Inductive Bias", "year": 2024, "url": "https://arxiv.org/abs/2410.17242", "note_zh": "同期竞争路线，Quark 未比较：几乎不带 3D 归纳偏置的纯 Transformer NVS。质量强，但分辨率和速度远不及 Quark，是 2025 年后“大模型 NVS”主线的起点，也是上面 Scaling 一文的基座。"}]}, "takeaways_for_telepresence_zh": ["Quark 证明了“无需逐场景优化、每帧 feed-forward 重建+渲染”可以在 1080p/30fps 下达到接近离线 NeRF/3DGS 的质量。对 Project Starline / Google Beam 这类固定多相机舱体（8 路相机、基线 ≤30cm、标定精确）来说，它正好落在舒适区。", "逐目标视角的 LDM 很适合“服务端按观看者头部位姿渲染、再推送 2D 视频”的云端架构。但双目 HMD 或光场显示需要每眼、每视点各推理一次，成本线性增长。若要本地多视点显示，应考虑一次重建、多次渲染的持久表示（如 LVT、SplatVoxel、Tele360 采用的 3DGS）。", "IBR blend weights 用很低的算力换来高分辨率纹理，但对相机之间的曝光和白平衡差异、标定误差非常敏感，出错时是硬边而不是模糊。实际系统必须做严格的颜色标定、同步和在线标定监控；视角相关的高光（眼睛、皮肤油光）也只能近似表现。", "时间闪烁是 Quark 公认的短板：逐帧独立重建，且随目标视角移动切换输入相机。锚点论文 B（几何引导的在线 3D 视频合成，强调多视角时间一致性）和 Google 团队自己的后续 SplatVoxel、NSTM 都在补这一块。做 telepresence 时应把时间稳定性指标（如 flicker、tOF）纳入评测，而不只看逐帧 PSNR。", "有两个可以直接复用的工程技巧。一是 One-to-many attention：单 query 的 cross-attention 把 K/V 投影折叠进 Q/O，融合代价对视角数接近 O(1)。二是由粗到细的“升分辨率、降层数”配合 layer collapse：去掉 layer collapse 会慢 115%，而消融还显示减少迭代次数可再省 17% 且几乎不掉点。这两者都适合移植到实时多视角融合网络中。", "论文没有人像或人体评测，也没有端到端延迟、显存和消费级 GPU 的数据。评估它能否用于通话时，需要自行在多视角人像数据上测试头发、面部、快速手势和遮挡，并在目标硬件上测出含编码与传输的 motion-to-photon 延迟。", "Quark 没有开源，后续论文大多只在相关工作中引用、没有定量对比。若以它为 baseline，需要自己复现（结构细节见附录表8、表9）。复现时还要注意原文中学习率日程与总步数、上采样因子等数值不一致之处。"]}, "ha": {"citation": {"title": "Geometry-guided Online 3D Video Synthesis with Multi-View Temporal Consistency", "authors": "Hyunho Ha, Lei Xiao, Christian Richardt, Thu Nguyen-Phuoc, Changil Kim, Min H. Kim, Douglas Lanman, Numair Khan", "affiliations": "KAIST（一作在 Meta Reality Labs 实习期间完成）；Meta Reality Labs", "venue": "CVPR 2025（DOI 10.1109/CVPR52734.2025.01053；arXiv 2505.18932 仅有 v1，2025-05-25）", "year": 2025, "url": "https://arxiv.org/abs/2505.18932", "project_page": "https://nkhan2.github.io/projects/geometry-guided-2025/", "code_status": "截至 2026-09-24 未发布代码、预训练权重或数据；项目主页只有论文与 bibtex。CVF 提供约 74 MB 的补充材料 zip（多为视频），补充文字已收录在 arXiv HTML 的附录 A.1–A.8。"}, "tldr_zh": "这篇论文面向固定、已标定的多相机阵列，做在线动态场景的新视角视频合成。流程分三步：先把 K 个最近输入视角的每个像素变成与像素等大、完全不透明的各向同性 3D Gaussian，逐视角 forward-splat 到目标相机；再在目标视角的图像空间里用 image-based TSDF（沿用 Project Starline 的做法）融合经颜色差分掩码做过时间滤波的深度，同时融合上一帧渲染出的深度，得到在视角和时间上都一致的引导深度；最后由一个 4 层 U-Net 在这张深度引导下预测每个视角的融合权重，并预测背景图用于补洞。在 DyNeRF 和 D3DMV 上，保真度与时序、视角一致性指标都是最好的（DyNeRF PSNR 31.17，ENeRF 为 29.51；STED 68.76，ENeRF 为 76.14）。但在 ENeRF-Outdoor 上 PSNR、SSIM、L1 都输给 ENeRF。消融显示，TSDF 引导对 PSNR 几乎没有贡献，主要改善的是 STED。运行时间方面，Table 4 各阶段合计约 39 ms（TensorRT），但不含立体深度估计。", "problem_setting_zh": "输入是 N 台位姿固定、时间同步的 RGB 相机拍到的多视角视频。位姿在正文中说由 COLMAP 一次性标定，附录 A.7 却写\"使用数据集提供的相机参数\"，两处没有统一。每个视角每一帧都需要深度 D_n^t：DyNeRF 和 Google Spaces 用 RAFT-Stereo 在\"人工挑选的图像对\"上估计，ScanNet 用传感器深度，RGB-D 相机只作为可选项提及。输出是任一目标视角在时刻 t 的 RGB 图像。目标有三个：(1) 在线、逐帧处理，不做 per-scene 优化；(2) 单帧保真度高；(3) 同时满足视角一致性（相机移动时不跳变）和时间一致性（不闪烁）。作者把已有方法分成两类，各有问题。一类是稀疏相机加全局几何（Fusion4D、Starline），一致性好，但细节和外观表达不足，并且依赖深度传感器。另一类是选取部分视角的 image-based rendering 或 feed-forward 方法（ENeRF、IBRNet、GPS-Gaussian），逐帧独立处理，会闪烁和跳变。本文想把两者结合：用全局几何（TSDF）去引导 IBR 融合。场景假设为\"多样静态环境中的动态演员\"，目标视角落在相机阵列内部（测试视角都是被留出的阵列相机）。", "pipeline_zh": [{"stage": "0. 输入与视角选择", "detail": "每个时刻 t 输入 N 路 H×W RGB 图像 {I_n^t} 和对应的逐视角深度 {D_n^t}（RAFT-Stereo 或传感器）。针对目标视角选出距离最近的 K 个输入相机，并排除被留出的测试相机本身：DyNeRF 和 ENeRF-Outdoor 取 K=4，D3DMV 取 K=2，所有 baseline 使用同一组 K 个视角。立体深度的计算时间不计入运行时间。"}, {"stage": "1. 像素级 3D Gaussian 前向渲染（Sec. 3.1 / A.3）", "detail": "K 个视角里的每个像素都按深度反投影成一个完全不透明（opacity=1）、各向同性的 3D Gaussian。颜色取该像素值，尺度按解析式设定，使其在源图中的投影恰好覆盖 1 个像素。每个视角用原版 3DGS rasterizer 单独渲染到目标相机，得到 K 张前向渲染图 𝓘_k^t、累积 alpha α_k^t 和深度 𝒟_k^t。作者明确不采用两种做法：一是 GPS-Gaussian / GS-LRM 那样把所有视角一次性渲染，会产生 flying pixels 和 Z-fighting（Fig. 4）；二是用网络预测 Gaussian 参数，理由是在稠密像素网格上预测出的尺度、不透明度、旋转会收敛到近似常数，而让尺度可变来填补遮挡洞会降低 PSNR。与传统点溅射相比，这种做法走样更少，不会出现像素间空隙和锯齿边。"}, {"stage": "2a. 颜色差分掩码时间滤波（Sec. 3.2, Eq. 1–2）", "detail": "每个输入视角先算软差分掩码 M_n^t = min(|I_n^t − I_n^{t−1}| / λ_t + β, 1)，其中 λ_t=0.7、β=0.6。掩码在 1/4 分辨率计算，经 3×3 max-pool 后双线性上采样回原尺寸。然后做递归滤波：Ḋ_n^t = M·D_n^t + (1−M)·Ḋ_n^{t−1}。由于 M≥0.6，每帧至少取 60% 的新深度；静态区域相当于系数不超过 0.4 的轻度 EMA。"}, {"stage": "2b. 目标视角 image-based TSDF（A.1）", "detail": "沿目标视角每条射线取采样点 p，投影到 K 个视角，计算有符号距离 s_k = z_k − D_k[u_k, v_k]，截断到 τ=0.02 m（公制单位）。融合公式为 s = Σ ω_k·clamp(s_k, −τ, τ)，权重 ω_k = min(0.001·(ν_k / 49)^{−1/2}, 1)，其中 ν_k 是 7×7 邻域内截断后的深度局部方差；当 s_k < −τ 时令 ω_k = 0（沿用 Lawrence et al.）。射线以 0.8·s 为步长推进，检测到符号变化后再做 3 步二分细化。整个过程不建显式体素网格，用自定义 CUDA 实现。near/far 边界和射线起点在文中没有给出。"}, {"stage": "2c. 融合上一帧深度（A.2, Eq. 13–14）", "detail": "上一帧渲染出的目标视角深度 𝒟^{t−1} 作为额外的 TSDF 输入，权重为 ω_tmp^t = min(β·ω_acc^t·max(1−𝓜^t, 0), η)，其中 η=15，ω_acc^t = ω_tmp^{t−1} + Σ_k ω_k^{t−1}。𝓜^t 的做法是把 K 张差分掩码用 Gaussian splatting 前向投影到目标视角，再逐通道取最大值。这里的 β 与 Eq. 1 的 0.6 不是同一个参数，文中没有给出取值。输出为 𝒟^t = Raymarch(TSDF({Ḋ_k^t}, 𝒟^{t−1}))。目标相机在帧间移动时 𝒟^{t−1} 怎样重投影，文中没有说明。"}, {"stage": "3. 几何引导融合网络（Sec. 3.3 / A.4）", "detail": "网络是 4 层 U-Net，输入 (9K+1) 个通道：3K 通道前向渲染 RGB，K 张深度（A.4 写作 D_k^t，Sec. 3.3 写作 𝒟_k^t，符号不一致），K 张 alpha，1 张 TSDF 深度，以及 4 组各 K 通道的相机特征：输入射线与 TSDF 法线的点积、输入射线与目标方向的点积、相机间距离（空间广播）、输入与目标视线方向的点积。网络输出 K 个逐像素融合权重 w_k、背景权重 w_BG 和一张背景图 I_BG。合成公式为 I_FG = Σ_k 𝓘_k·α_k·w_k / (α_k·w_k)，原文分母漏写了求和，应为笔误；最终 I = (1−w_BG)·I_FG + w_BG·I_BG。"}, {"stage": "4. 损失函数", "detail": "L = 0.8·L1 + 0.2·L_SSIM + 0.1·L_Depth + 0.1·L_Mask。L_Depth 是 TSDF 深度 𝒟^t 与用同一组权重合成的深度 Σ𝒟_k·α_k·w_k / (α_k·w_k) 之间的 L1，作用是软约束，让融合权重去复现一致的 TSDF 深度。L_Mask 是 w_BG 与空洞区域二值掩码之间的 L1。损失中没有任何时间项。"}], "key_design_choices_zh": [{"choice": "用解析参数化的像素级、完全不透明、各向同性 3D Gaussian 做前向 warping，每个视角分别渲染", "rationale": "作者观察到，feed-forward 网络在稠密像素网格上预测的 Gaussian 参数趋于常数，解析计算更省；与点溅射相比，Gaussian 能处理遮挡且走样更少；分开渲染可以避免 Z-fighting 和 flying pixels，让后续融合网络自己决定取舍", "alternatives_rejected": "GPS-Gaussian / GS-LRM 式的网络预测 Gaussian 参数加单次整体渲染；传统点溅射（Aliev et al.）；允许 Gaussian 尺度变化来填补遮挡洞（据称会降低 PSNR，但没有给出消融表）"}, {"choice": "在目标视角图像空间做 image-based TSDF（Starline 式），不建显式 3D 体素网格", "rationale": "不需要体素网格就能高效得到高分辨率深度；在同一时刻，把深度融合进全局结构可以保证视角一致性", "alternatives_rejected": "KinectFusion / Fusion4D 类显式体素 TSDF（分辨率与计算量难以兼顾）；直接使用逐视角原始深度"}, {"choice": "时间一致性只在输入深度端处理：用颜色差分掩码做递归滤波，并把上一帧 TSDF 输出深度回灌", "rationale": "相机位姿固定，因此可以逐像素对比前后两帧，简单区分静态区和动态区，并在静态区保留历史深度", "alternatives_rejected": "时间损失、循环或记忆型网络状态、基于光流的对齐、事后视频去闪烁（均未采用，也未比较）"}, {"choice": "只融合最近的 K 个视角（K=4 或 2），而不是全部 N 个", "rationale": "运行时间随 K 近似线性增长，质量在 K≥4 时趋于饱和（Fig. 8）", "alternatives_rejected": "融合全部 N 个相机，或对视角做软加权（代价高）；作者承认，K 集合切换时 TSDF 深度仍会有微小变化"}, {"choice": "小型 U-Net 融合网络：预测逐视角权重，另外输出背景图 I_BG 用于补洞，并以 TSDF 深度作为输入和 L_Depth 目标", "rationale": "让网络在几何引导下融合，而不是自由生成像素，从而继承 TSDF 的一致性；背景图用来补遮挡洞（Fig. 11）", "alternatives_rejected": "按距离加权融合（Buehler / LLFF 式，产生重影）；不带几何引导的朴素融合网络（无法去除重影，见 Fig. 4c）；生成式先验或扩散模型补洞"}], "training_zh": "训练数据有三部分：ScanNet（静态室内，传感器深度；以目标帧为中心取 ±30 帧作为输入，排除 ±4 帧）；DyNeRF 中的 3 个场景（大基线）；Google Spaces（小基线）。DyNeRF 和 Spaces 的深度由 RAFT-Stereo 在人工挑选的立体对上生成，输入视角和目标视角都在同一时刻随机采样。因此网络从未见过视频序列，时间行为完全来自输入。每次迭代随机选 1 个目标视角和 K=4 个输入视角。优化器为 Adam，学习率 2e-4，权重衰减 1e-5，共 150K 次迭代，batch 12，训练裁剪块 640×352，使用单块 NVIDIA Tesla V100。损失为 0.8·L1 + 0.2·SSIM + 0.1·L_Depth + 0.1·L_Mask，没有时间损失。推理时用 Torch-TensorRT 加速，TSDF 为自定义 CUDA，前向渲染使用原版 3DGS 代码。需要注意：训练用的 DyNeRF 场景与测试场景（Sear Steak、Flame Steak）在同一厨房、同一相机阵列和光照下拍摄，存在域内泄漏的可能。", "system_perf": [{"item": "各阶段耗时（Table 4，DyNeRF 1352×1014，K=4）", "value": "Forward-splatting 10 ms；TSDF 6 ms；融合网络 23 ms（TensorRT）或 65 ms（无 TensorRT）"}, {"item": "合计（按 Table 4 相加）", "value": "TensorRT 约 39 ms（约 25 fps，单目、单视角）；无 TensorRT 约 81 ms。正文却写\"即使没有 TensorRT 也约 100 ms\"，与表中数字对不上"}, {"item": "对比 baseline", "value": "GPS-Gaussian 143.4 ms（正文引用写成 Figure 5，应为引用错误）"}, {"item": "未计入的开销", "value": "RAFT-Stereo 立体深度估计、差分掩码计算、磁盘 I/O 都未计入；测试 GPU 未说明（V100 只在训练部分提到）；没有端到端延迟、显存或 motion-to-photon 数据"}, {"item": "输入视角数", "value": "K=4（DyNeRF、ENeRF-Outdoor），K=2（D3DMV）；运行时间随 K 近似线性增长，质量在 K≥4 时饱和"}, {"item": "评测分辨率", "value": "DyNeRF 1352×1014（2704×2028 下采样 2 倍，阵列 18–22 台相机）；ENeRF-Outdoor 渲染 960×540，但指标在 480×270 计算（原阵列 18 台 1080p 相机）；D3DMV 640×360（压缩版，10 台相机）"}, {"item": "训练硬件", "value": "单块 NVIDIA Tesla V100，150K 次迭代，batch 12"}], "results_zh": [{"dataset": "DyNeRF（Sear Steak、Flame Steak，9 个测试视角，前 100 帧）", "finding": "保真度：PSNR 31.17 / SSIM 0.936 / LPIPS 0.191 / L1 5.09，最强 baseline ENeRF 为 29.51 / 0.927 / 0.196 / 6.06，GPS-Gaussian 为 25.46 / 0.866 / 0.309 / 8.00，IBRNet 为 22.49，FWD 为 16.97。一致性：TCC 0.872（ENeRF 0.867），STED 68.76（ENeRF 76.14，IBRNet 737.7，GPSG 693.0），SDT 0.139（ENeRF 0.147），SDV 1.748（GPSG 2.254，ENeRF 2.710）。四类指标全部最优，但训练集含同一厨房的其他 DyNeRF 场景，存在域内优势。"}, {"dataset": "ENeRF-Outdoor（3 个测试视角，指标在 480×270 计算）", "finding": "本文方法在保真度上输给 ENeRF：PSNR 24.01 对 25.79，SSIM 0.703 对 0.722，L1 12.02 对 9.84，只有 LPIPS 更好（0.155 对 0.167）。一致性方面，TCC 0.897 最高（ENeRF 0.883），STED 44.49 比 ENeRF 的 32.31 差，SDT 0.193 与 IBRNet 持平但比 ENeRF 的 0.189 差，SDV 1.970 最好。正文称在这个数据集上\"显著改善\"，与自己的 Table 2 矛盾；这是唯一真正域外的户外数据集。"}, {"dataset": "D3DMV（4 个测试视角，K=2，640×360）", "finding": "领先幅度最大：PSNR 32.58 / SSIM 0.936 / LPIPS 0.098 / L1 3.60，ENeRF 为 27.79 / 0.879 / 0.157 / 6.01。一致性：TCC 0.915（IBRNet 0.901），STED 15.85（ENeRF 137.0），SDT 0.105，SDV 0.449（ENeRF 0.754）。"}, {"dataset": "定性结果（Fig. 5/6/7/12）", "finding": "EPI 显示相机平移时线条连续，baseline 有突变；x–t 时间切片显示更少闪烁。在 ENeRF-Outdoor 上与 4DGS、4K4D（per-scene 优化，K=17）以及 MVSplat 只做了定性比较，声称更锐利，没有定量数字。"}], "ablations_zh": ["Table 3（仅 DyNeRF，单次运行，无误差条）：No Blending（仿 GPS-Gaussian 一次性渲染全部 Gaussian）PSNR 24.64 / LPIPS 0.264 / TCC 0.743 / STED 483.3。", "Distance-based Blending（按相机距离加权）：26.08 / 0.211 / 0.858 / 235.3。从这一行到完整模型的提升，几乎都来自\"有一个可学习的融合网络\"本身。", "No TSDF Guidance（去掉 𝒟^t 输入后重训）：31.16 / 0.197 / 0.869 / 95.42。与完整模型（31.17 / 0.191 / 0.872 / 68.76）相比，PSNR 只差 0.01，只有 STED 有明显变化（95.4 → 68.8）。", "No Temporal Filtering：31.16 / 0.195 / 0.869 / 89.62。PSNR 同样没有变化，STED 有改善。", "Fig. 8：输入视角数 K 的消融。运行时间随 K 近似线性增长，质量在 K≥4 时饱和。", "Fig. 10/11（定性）：像素级 Gaussian 与点溅射、网络预测 Gaussian 的对比；背景图融合能填补遮挡空洞。", "未做的消融：超参数（λ_t、β、η、τ、w）、融合网络的深度输入和相机特征通道、深度来源和噪声鲁棒性，均没有定量消融。"], "limitations_stated_zh": ["方法高度依赖准确的几何。高光、镜面区域深度差，TSDF 出错后单帧结果仍然合理，但视角和时间一致性会被破坏，在 EPI 中表现为断裂（Fig. 9）。", "需要严格同步、已标定的相机；标定误差会让前向投影错位，导致模糊。ENeRF-Outdoor 就因同步和颜色标定问题，只能降到 480×270 计算指标。", "TSDF 只融合最近的 K 个视角。视点移动导致 K 集合变化时，TSDF 深度仍会有小幅变化；增大 K 能缓解，但运行时间随之线性增加。", "引言中承认，全局几何方法会牺牲局部外观的灵活性，本文只能借助 IBR 部分缓解。", "遮挡和深度误差会在逐视角前向渲染中留下空洞和 flying pixels，这些要靠融合网络修补。"], "limitations_unstated_zh": ["\"在线、实时\"的说法没有把深度估计算进去。RAFT-Stereo 要在\"人工挑选的立体对\"上处理最多 22 台 1352×1014 的相机，这部分不在 Table 4 里；人工选对也无法在线进行，测试时的深度生成流程文中没有交代。对真实的 3D telepresence 系统来说，深度往往是最大的开销。", "运行时间数字前后不一致，也谈不上 VR 实时。Table 4 相加约 39 ms（TensorRT）或约 81 ms（无 TensorRT），正文却写约 100 ms；测试 GPU 未说明，GPSG 的对比引用了错误的图。即便按最好情况（约 25 fps、单目、单视角）算，离 HMD 需要的 72–90 Hz 双眼渲染也很远，motion-to-photon 延迟从未测量。", "ENeRF-Outdoor 上\"显著改善\"的说法与作者自己的 Table 2 矛盾：PSNR 24.01 对 25.79，SSIM 0.703 对 0.722，L1 12.02 对 9.84，只有 LPIPS 更好；STED 44.49 对 32.31，也比 ENeRF 差。在唯一真正域外的户外数据上，本文方法是输的。", "DyNeRF 上存在训练和测试的域泄漏。训练用了 3 个 DyNeRF 场景，测试的 Sear Steak 和 Flame Steak 与之同一厨房、同一阵列、同一光照。而 IBRNet 和 ENeRF 用的是作者发布的预训练权重，只有 FWD 和 GPSG 按本文数据重训。所以头条提升（31.17 对 29.51）混入了域内训练的因素。", "论文标题突出的 TSDF 引导几乎不提升保真度：PSNR 31.16 → 31.17，LPIPS 0.197 → 0.191，TCC 0.869 → 0.872，只有 STED 变化明显；去掉时间滤波时 PSNR 同样不变。消融只在 DyNeRF 上单次运行，没有误差条。", "没有时间损失，也没有时间序列训练数据。融合网络只在单一时刻上训练，ScanNet 还是静态的，时间稳定性完全依赖输入深度；CNN 自身带来的闪烁（例如 I_BG）无法约束。TCC 的提升很小（0.872 对 0.867）。", "背景图 I_BG 让网络具备一定的补洞能力，但它来自一个没有多帧记忆、没有生成先验的 4 层 U-Net，只用粗糙的 mask 损失监督。大面积遮挡（比如远离阵列的视点看人物背后）没有评测。阵列固定、背景持续存在，但\"之前可见、现在被遮挡\"的像素从未被利用，没有长时记忆。", "时间滤波弱且依赖启发式。掩码下限为 0.6，静态区每帧最多保留 40% 的历史深度，记忆很短。阈值是在原始 RGB 差上手工设的：光照变化、阴影、火焰（Flame Steak 里就有火）、自动曝光和传感器噪声都会被误判为运动；无纹理或纯色的运动物体会被误判为静态，导致陈旧深度留下重影。η=15 和未公布数值的第二个 β 也是手调常数。", "回灌上一帧深度默认目标相机不动。𝒟^{t−1} 在目标图像空间融合，视点变化时怎样 warp 没有说明。时间指标只在固定的留出相机上算，视角指标只在固定时刻上算，真实远程临场中\"头动加场景动\"的组合情形从未评测。", "所谓全局几何其实是局部的：只融合 K 个视角，视角一致性只在 K 集合不变时成立。K 集合切换时没有滞回，也没有对全部 N 个相机做软加权，RGB 融合仍可能突变。", "TSDF 截断用固定的 0.02 m 公制值，置信常数固定为 0.001。立体深度误差大致随距离平方增长，固定的 τ 对远处背景（户外）太紧，对细节又太松。这种对公制尺度的依赖与 COLMAP 位姿的尺度任意性存在冲突，射线的 near/far 边界也没有给出。", "完全不透明、各向同性的像素级 Gaussian 表达不了半透明、头发、运动模糊、细结构和视角相关效果。解析尺度忽略了表面倾斜，掠射角下会出现拉伸或空隙。\"网络参数收敛到常数\"只是经验观察，没有消融表支撑。", "视角相关外观只靠对 K 个观测颜色重新加权，没有反射模型，所以即使深度准确，高光也会被烘焙进结果或以重影形式混合。", "没有带宽、压缩或网络传输方面的分析。每个渲染端都需要 K 路全分辨率 RGB 和深度流，也没说明渲染放在发送端还是接收端，而这对 telepresence 是核心问题。", "每个观看者的每个新视角都要单独做一次 splat、TSDF 和 CNN。双目渲染成本翻倍，多人观看线性增长，双目之间的一致性也没有研究。", "训练数据少而窄，没有大规模人物数据，也没有户外动态训练数据，这与 ENeRF-Outdoor 上的差表现是吻合的。深度置信只用局部方差启发式估计，没有使用立体模型给出的逐像素不确定性。", "可复现性差：没有代码和权重，立体对是人工挑选的，多个超参数没有公布。评测只用每段序列的前 100 帧（30 fps 下约 3.3 s），递归滤波和 TSDF 回灌造成的长期漂移没有检验。时间指标里 TCC 是改造版，SDV 衡量的是误差在各视角间的离散程度，没有用基于光流的 warping error；也没有用户研究或 HMD 实测。"], "lineage": {"predecessors": [{"title": "Project Starline: A High-Fidelity Telepresence System", "year": 2021, "url": "https://doi.org/10.1145/3478513.3480490", "note_zh": "本文 image-based TSDF 的直接来源（Lawrence et al.，ACM TOG 40(6)）：在目标视角沿射线实时融合多视角深度，不建体素网格。但 Starline 只处理人物、依赖 RGB-D 传感器，本文把它推广到一般动态场景，并加入了时间回灌。"}, {"title": "Efficient Neural Radiance Fields for Interactive Free-viewpoint Video (ENeRF)", "year": 2021, "url": "https://arxiv.org/abs/2112.01517", "note_zh": "最强 baseline，同时提供 ENeRF-Outdoor 测试集。它属于选取部分视角、做可泛化神经体渲染的路线；在户外数据上的 PSNR、SSIM、L1 仍然优于本文。"}, {"title": "GPS-Gaussian: Generalizable Pixel-wise 3D Gaussian Splatting for Real-time Human Novel View Synthesis", "year": 2023, "url": "https://arxiv.org/abs/2312.02155", "note_zh": "feed-forward 像素级 Gaussian 的代表，也是本文重点对比的对象（重训后作为 baseline，143.4 ms）。本文反对它的两个做法：用网络预测 Gaussian 参数，以及单次整体渲染。"}, {"title": "FWD: Real-time Novel View Synthesis with Forward Warping and Depth", "year": 2022, "url": "https://arxiv.org/abs/2206.08355", "note_zh": "基于深度前向 warping 加融合网络的实时 NVS 前身，本文重训后用作 baseline。"}, {"title": "IBRNet: Learning Multi-View Image-Based Rendering", "year": 2021, "url": "https://arxiv.org/abs/2102.13090", "note_zh": "可泛化的学习型 IBR baseline，使用作者发布的预训练权重。"}, {"title": "3D Gaussian Splatting for Real-Time Radiance Field Rendering", "year": 2023, "url": "https://arxiv.org/abs/2308.04079", "note_zh": "本文直接使用原版 3DGS rasterizer 做逐视角前向渲染。"}, {"title": "RAFT-Stereo: Multilevel Recurrent Field Transforms for Stereo Matching", "year": 2021, "url": "https://arxiv.org/abs/2109.07547", "note_zh": "输入深度的来源。逐帧独立估计，本身不保证时间一致性，因此需要本文的差分掩码滤波；它的耗时也没有计入运行时间。"}, {"title": "Neural 3D Video Synthesis from Multi-view Video (DyNeRF)", "year": 2021, "url": "https://arxiv.org/abs/2103.02597", "note_zh": "提供主要训练和测试数据集（18–22 台相机的厨房场景）。"}, {"title": "View Synthesis of Dynamic Scenes based on Deep 3D Mask Volume (D3DMV)", "year": 2021, "url": "https://arxiv.org/abs/2108.13408", "note_zh": "D3DMV 数据集的来源（10 台户外相机），本文在该数据集上领先幅度最大。"}, {"title": "Tele-Aloha: A Low-budget and High-authenticity Telepresence System Using Sparse RGB Cameras", "year": 2024, "url": "https://arxiv.org/abs/2405.14866", "note_zh": "本文引用的稀疏 RGB 相机远程临场系统（SIGGRAPH 2024）：4 台相机，2K、30 fps，延迟低于 150 ms。它代表\"固定稀疏相机加全局几何\"路线，只处理人物。"}], "successors": [{"title": "REON-NVS: Real-Time Online Novel-View Synthesis from Sparse-View Videos", "year": 2026, "url": "https://doi.org/10.1007/978-3-032-37321-2_18", "note_zh": "POSTECH（Kim, Kim, Kwon, Shin, Cho），ECCV 2026。据 OpenAlex，这是目前唯一在主题上直接引用本文的方法论文，研究方向正是稀疏视角视频的实时在线 NVS，是直接的竞争或后续工作。目前没有找到 arXiv 版本。"}, {"title": "LiveStre4m: Feed-Forward Live Streaming of Novel Views from Unposed Multi-View Video", "year": 2026, "url": "https://arxiv.org/abs/2604.06740", "note_zh": "同期或稍后的竞品，未引用本文。对关键帧用多视角 ViT 处理，再用扩散 Transformer 做时间插值和超分；适用于无位姿的相机阵列，1024×768 分辨率下在 H100 上约 0.07 s/帧；在 Neural3DVideo（即 DyNeRF）和 MeetRoom 上与 3DGStream、IGS 等方法比较。它去掉了本文依赖的预标定前提。"}, {"title": "Online Neural Space Time Memory for Dynamic Novel View Synthesis", "year": 2026, "url": "https://arxiv.org/abs/2607.15271", "note_zh": "Google / UW，未引用本文。通过周期性记忆加逐帧应用，配合跨视角注意力引入长期时空记忆；256×256 下在 H100 上约 28 ms/帧，在 MVHumanNet++ 上训练。它正好补上本文缺少的多帧记忆，即利用\"之前可见、现在被遮挡\"的像素。"}, {"title": "Tele360: Real-Time Feed-Forward Human Reconstruction from Sparse Unposed Cameras", "year": 2026, "url": "https://arxiv.org/abs/2609.15032", "note_zh": "清华，面向远程临场。使用 4–6 台未标定的 2K 相机，在 RTX 5090 上超过 25 FPS，并用可微 Levenberg–Marquardt 在线优化相机参数，针对的正是本文的标定和同步限制，但只处理人物。"}, {"title": "Generalizable 3D Gaussian Splatting enabled Semantic Coding for Real-Time Immersive Video Communications (GS-SCNet)", "year": 2026, "url": "https://arxiv.org/abs/2604.25330", "note_zh": "把多视角编码与 feed-forward 3DGS 联合起来，相比 MV-HEVC + GPS-Gaussian 节省约 75% BD-rate，速度 19.2 FPS，覆盖了本文完全忽略的带宽和传输维度。"}, {"title": "Instant Gaussian Stream: Fast and Generalizable Streaming of Dynamic Scene Reconstruction via Gaussian Splatting (IGS)", "year": 2025, "url": "https://arxiv.org/abs/2503.16979", "note_zh": "CVPR 2025 Highlight，可泛化的流式 4D Gaussian 方法，使用锚点驱动运动和关键帧细化。它是本文比较中缺失的重要同期 baseline。"}, {"title": "StreamSplat: Streaming Feed-Forward 3D Gaussian Splatting", "year": 2026, "url": "https://arxiv.org/abs/2608.01659", "note_zh": "流式 feed-forward Gaussian 重建，带持久 Gaussian 传播和自适应融合，是一种有状态的替代方案，可以取代本文逐帧的 warp 加 blend（只从摘要和检索结果了解）。"}, {"title": "Stereo Any Video: Temporally Consistent Stereo Matching", "year": 2025, "url": "https://arxiv.org/abs/2503.05549", "note_zh": "ICCV 2025，时间一致的视频立体匹配，可以从源头替代本文的逐帧 RAFT-Stereo 加启发式差分掩码滤波。"}, {"title": "PPMStereo: Pick-and-Play Memory Construction for Consistent Dynamic Stereo Matching", "year": 2025, "url": "https://arxiv.org/abs/2510.20178", "note_zh": "基于记忆的时间一致动态立体匹配，是本文深度前端的另一个候选。"}, {"title": "RealCam: Real-Time Novel-View Video Generation with Interactive Camera Control", "year": 2026, "url": "https://arxiv.org/abs/2605.06051", "note_zh": "少步数自回归视频扩散，实现实时、相机可控的 video-to-video 生成，说明因果式生成补洞已经可以做到实时，可以对照本文小 U-Net 背景图的方案。"}, {"title": "FrameCrafter: Novel View Synthesis as Video Completion", "year": 2026, "url": "https://arxiv.org/abs/2604.08500", "note_zh": "ECCV 2026，把 NVS 当作带视频扩散先验的视频补全问题，是用生成先验替代融合和补洞环节的一个方向。"}, {"title": "D-FCGS: Feedforward Compression of Dynamic Gaussian Splatting for Free-Viewpoint Videos", "year": 2025, "url": "https://arxiv.org/abs/2507.05859", "note_zh": "对动态 Gaussian 自由视点视频做 feed-forward 压缩，与本文缺失的流式传输和带宽问题相关。"}]}, "takeaways_for_telepresence_zh": ["一致性优先的 IBR 范式值得借鉴：保留真实像素（前向 warp），用一个在视角和时间上都一致的几何代理（TSDF 深度）去约束融合，而不是让网络自由生成像素。这样兼顾锐度与稳定性，对固定阵列的远程临场是一条轻量、可工程化的路线。", "image-based TSDF 相当便宜（1352×1014 下 6 ms），可以作为一致性模块插到任何多视角 warp 加 blend 系统里（例如 Quark 类方法或 GPS-Gaussian 类方法之后），代价是需要公制尺度，并要调好 τ 和置信权重。", "不过，其实际收益主要体现在 STED 上（68.8 对 95.4），PSNR 几乎不变。如果系统瓶颈在保真度，先把融合网络和深度质量做好，比加 TSDF 更划算。", "深度前端才是真正的系统瓶颈。本文把立体深度排除在计时之外，落地时要换成实时且时间一致的深度，例如 Stereo Any Video、PPMStereo 这类视频立体方法或 RGB-D 传感器，并把它们算进 motion-to-photon 预算。", "时间一致性不能只靠输入滤波。建议加入时间损失或 warping-error 损失、做视频序列训练，以及长时记忆（参考 Online Neural Space Time Memory），并正确处理头动加场景动的情况：上一帧深度需要按新视点重投影。", "评测上应补齐：头显轨迹（阵列外外推、自由路径）、双目一致性、端到端延迟和帧率、多观看者扩展、带宽（参考 GS-SCNet、D-FCGS）、以及长序列（远超 100 帧）的漂移。", "标定和同步的鲁棒性是实际部署的关键。无位姿或在线标定的路线（LiveStre4m、Tele360）正在消除本文预标定、严格同步的前提，值得持续关注。", "对比 Quark（anchor A）：两者都是可泛化、无需 per-scene 优化的实时 NVS。Quark 侧重单帧高分辨率和高质量，本文侧重在线视频的视角和时间一致性。把 Quark 式的高质量渲染器与本文的几何一致性约束和时间机制结合，是一个很自然的研究方向。"]}, "compare": {"comparison_table": [{"dimension": "出处与团队", "quark": "Google（Flynn、Broxton、Murmann 等，DeepView / Immersive LF Video 同一团队），ACM TOG 43(6) / SIGGRAPH Asia 2024，arXiv 2411.16680", "ha": "KAIST + Meta Reality Labs（Ha、Xiao、Richardt、Lanman、Khan 等），CVPR 2025，arXiv 2505.18932"}, {"dimension": "问题设定", "quark": "通用的新视角合成：从稀疏、宽基线（最大约 30cm）的已标定多视角图像或同步视频，逐帧实时合成任意新视角。重建与渲染合计实时，不做逐场景训练。以静态场景为主，视频按逐帧处理", "ha": "在线的新视角视频合成：固定、已标定、严格同步的相机阵列拍摄动态场景（动态演员加多样的静态环境），逐帧在线处理，同时追求单帧保真度、视角一致性和时间一致性"}, {"dimension": "输入", "quark": "离目标最近的 M=8 路 RGB（可变模型支持 4–16 路）、相机内外参，以及由 SfM 点估计的逐场景近/远平面。不需要深度输入", "ha": "最近的 K 路 RGB（DyNeRF、ENeRF-Outdoor 取 K=4，D3DMV 取 K=2），加上每个视角每一帧的深度：RAFT-Stereo 在人工挑选的立体对上估计，或来自传感器。另外用到上一帧的输入图像和上一帧的渲染深度"}, {"dimension": "几何表示", "quark": "目标视角视锥内的分层深度图 LDM：每层含 depth、density，以及对各输入视角的 blend weights；每层深度被限制在各自的等视差带内。由粗到细生成：Quark 从 24 层×36×64 到 6 层×288×512。逐帧、逐目标视角即时生成，用完即丢", "ha": "两级几何：(1) 每个输入像素变成一个完全不透明、各向同性、尺度解析确定的 3D Gaussian，也就是“带深度的像素云”；(2) 在目标视角图像空间做 image-based TSDF（Starline 式，τ=0.02 m），ray-march 得到一张引导深度。同样不保留持久的 3D 模型"}, {"dimension": "几何如何得到", "quark": "网络学出来的：learned render-and-refine（DeepView 式学习化梯度下降）共 5 次 Update & Fuse，把当前 LDM splat 回各输入视角，与观测比较后更新。多视角立体匹配隐含在网络内部", "ha": "外部给定，再做融合：逐视角立体深度经颜色差分掩码时间滤波后，由 TSDF 做加权融合（权重用局部方差置信），并融合上一帧深度。几何本身不经过学习"}, {"dimension": "外观与视角相关效果", "quark": "IBR：对全分辨率输入像素按 blend weights 做凸组合，再 over 合成。射线方向编码让网络偏向离目标近的射线，逐视角重建也能“近似”复现部分反射和折射。没有显式的反射模型", "ha": "IBR：K 张前向 splat 图由 U-Net 预测的逐像素权重融合，另外有背景图 I_BG 用来补洞。相机特征（射线与法线、射线与目标方向的点积等）提供视角相关线索，同样没有反射模型"}, {"dimension": "跨视角融合机制", "quark": "One-to-many attention：以 LDM 特征为单一 query，对 M 个视角的反投影特征做 cross-attention，把 K/V 投影折叠进 Q/O，融合代价对视角数接近 O(1)；与 3×3 卷积交替，形成 pre-LN Transformer 结构", "ha": "4 层 U-Net 通道拼接：输入 9K+1 个通道（K 张 RGB、深度、alpha，TSDF 深度，以及 4 组相机特征），输出 K 个权重加背景权重和背景图。输入顺序依赖视角排序，输入视角数固定为 K"}, {"dimension": "时间处理", "quark": "完全没有。逐帧独立重建；目标相机移动导致输入相机集合切换时也会闪烁。作者在局限中明确承认", "ha": "只在输入深度端处理：颜色差分掩码递归滤波（M≥0.6，静态区最多保留 40% 历史），以及把上一帧 TSDF 深度按权重回灌（上限 η=15）。网络没有时间状态、没有时间损失，也没有在视频上训练"}, {"dimension": "视角一致性", "quark": "没有显式机制。每个目标视角各自生成 LDM，相邻视点之间只靠网络的平滑性保持一致；输入集合切换时会跳变", "ha": "显式机制：同一时刻用 TSDF 全局深度引导融合，L_Depth 约束融合权重去复现 TSDF 深度。但 TSDF 只融合最近 K 个视角，K 集合切换时仍会有小幅变化"}, {"dimension": "运行时间", "quark": "单张 A100 上 1080p 重建加渲染约 30 fps：1024×768 为 32.2 ms，2048×1536 为 33.0 ms；Quark+ 约 92 ms。计入全部网络和渲染，不含采集与传输", "ha": "Table 4：前向 splat 10 ms、TSDF 6 ms、融合网络 23 ms（TensorRT）或 65 ms。按 TensorRT 相加约 39 ms，正文却写约 100 ms，二者不一致。测试 GPU 未说明，RAFT-Stereo 深度估计未计入"}, {"dimension": "分辨率", "quark": "输出 1080p 到 2K，但内部几何固定为 288×512（Quark）或 432×768（Quark+），高频细节来自 IBR 取样和上采样；2K 下 LPIPS 明显变差", "ha": "评测为 DyNeRF 1352×1014、ENeRF-Outdoor 渲染 960×540（指标在 480×270 计算）、D3DMV 640×360。前向 splat 和 TSDF 都在目标分辨率上运行"}, {"dimension": "网络规模与训练", "quark": "较大的多尺度 Transformer/CNN 混合网络。在 Spaces、RFF、Shiny、SWORD（全为静态）上训练 600K 步，16×A100，batch 16，损失为 10·L1+LPIPS", "ha": "小型 4 层 U-Net。在 ScanNet 和 DyNeRF 3 个场景、Google Spaces 上训练 150K 次迭代，单块 V100，batch 12，损失为 0.8 L1+0.2 SSIM+0.1 L_Depth+0.1 L_Mask。没有视频序列和时间损失"}, {"dimension": "评测数据与指标", "quark": "RFF、Shiny、N3DV（动态，只有 1 个目标相机，每 10 帧评一帧）、DL3DV、Mip-NeRF360、T&T、Deep Blending、Spaces。只有 PSNR、SSIM、LPIPS，没有时间指标", "ha": "DyNeRF（只有 Sear/Flame Steak 前 100 帧）、ENeRF-Outdoor、D3DMV。除 PSNR、SSIM、LPIPS、L1 外，还有 TCC、STED（时间）和 SDT、SDV（视角）一致性指标，并给出 EPI 和 x–t 切片的定性结果"}, {"dimension": "对比基线", "quark": "ENeRF、GPNR、SIMPLI（在 RFF+IBRNet 数据上重训），另外引用 Zip-NeRF、3DGS 等逐场景方法的原文数字。未比较 pixelSplat、MVSplat、GPS-Gaussian、LVSM 等", "ha": "IBRNet、ENeRF（使用官方预训练权重）、FWD、GPS-Gaussian（重训）。与 4DGS、4K4D、MVSplat 只有定性比较，未比较 Quark、IGS、3DGStream 等"}, {"dimension": "关键结果", "quark": "N3DV 31.57 dB，ENeRF 为 29.86；DL3DV 31.31，高于 Zip-NeRF 的 31.22；T&T 第一；Deep Blending 23.61，远低于 3DGS 的 30.04（视角覆盖不足）", "ha": "DyNeRF PSNR 31.17，ENeRF 29.51；STED 68.76，ENeRF 76.14。D3DMV 领先幅度最大（32.58 对 27.79）。ENeRF-Outdoor 上 PSNR、SSIM、L1 和 STED 都输给 ENeRF（24.01 对 25.79）"}, {"dimension": "消融揭示的真正贡献", "quark": "IBR 输出贡献最大（改为直接输出 RGB 时 −1.23 dB）；render-and-refine 和 cross-attention 各贡献约 0.7 dB；layer collapse 以不到 0.2 dB 的代价换来超过 2 倍的加速；射线编码几乎没有作用", "ha": "主要提升来自“有一个可学习的融合网络”（distance blending 为 26.08，完整模型为 31.17）。标题所强调的 TSDF 引导对 PSNR 只贡献 0.01 dB，主要改善 STED（95.4 → 68.8）；时间滤波同样只改善 STED"}, {"dimension": "典型失败模式", "quark": "时间闪烁；视角覆盖不足时出现硬边伪影（而非模糊）；对曝光、白平衡、焦距差异和标定误差敏感；深度被限制在等视差带内，近/远平面设错就会失败", "ha": "高光或镜面导致深度错误，进而破坏一致性（EPI 断裂）；遮挡处留下空洞和 flying pixels；差分掩码把光照、火焰、曝光变化误判为运动，无纹理的运动物体又被判为静态，留下重影；域外户外场景明显退化；依赖公制尺度"}, {"dimension": "开源与可复现性", "quark": "没有代码和权重；附录给出结构表（表8、表9），但学习率日程、上采样因子等数值自相矛盾", "ha": "没有代码和权重；立体对由人工挑选，多个超参数（第二个 β 等）未公布，运行时间正文与表格不一致，存在引用错误"}, {"dimension": "最擅长", "quark": "用一张 GPU 从少量已标定视图实时得到高分辨率、高质量的单帧新视角，泛化到多种静态和动态场景；深度复杂、遮挡多的场景仍然稳健", "ha": "在固定阵列上以很低的算力做稳定的视频输出：减少闪烁和视角跳变；把显式几何一致性作为可插拔模块（TSDF 只需 6 ms）"}], "philosophy_zh": "两篇论文都属于“可泛化、无需逐场景优化、实时新视角合成”这一大类，都选择 IBR（直接复用真实输入像素）而不是让网络生成像素，也都放弃了持久的全局 3D 表示，改为按目标视角逐帧即时重建。它们的分歧在于把“学习”放在哪里、优先保证什么。\n\nQuark 的思路是“把几何和融合都交给一个学出来的迭代求解器，追求单帧质量与分辨率”。它继承 Google 从 Stereo Magnification（MPI）、DeepView（learned gradient descent）到 Immersive Light Field Video（layered mesh）的一条线：分层半透明表示加 render-and-refine，把“多视角立体匹配、可见性推理、视角融合”都放进一个端到端网络内部隐式完成。工程上的核心是计算量的分配：由粗到细地“升分辨率、降层数”，用 One-to-many attention 让融合对视角数接近 O(1)，再用 IBR 和 post-activation 上采样把 288×512 的内部解算“放大”到 1080p 甚至 2K。它回答的问题是：前馈网络能否在实时条件下逼近逐场景优化的 NeRF/3DGS 的单帧质量。时间维度被有意放在问题之外。在领域谱系中，它处于“MPI/LDM 分层表示 + 可泛化 IBR”这一支的顶点，与 ENeRF（可泛化体渲染）、GPNR/IBRNet（Transformer IBR）属同一代对手，同时正好位于 2024 年之后两条新主线的交叉口：一条是 feed-forward 3DGS（pixelSplat、MVSplat、GPS-Gaussian、GS-LRM），一条是几乎不带 3D 偏置的大模型 NVS（LVSM）。Quark 团队自己的后续工作（LVT、SplatVoxel/Fuse-and-Refine、Online Neural Space Time Memory）也转向了持久的 3DGS 表示和时间记忆，说明 Quark 的“逐视角、无状态”设计在视频和远程临场场景中已经被团队自己视为需要补足的短板。\n\nHa et al. 的思路则是“几何显式、学习最小化，把一致性作为第一目标”。它来自经典的实时远程临场系统：image-based TSDF 直接沿用 Project Starline；相机阵列固定、逐帧在线处理的假设，与 Fusion4D、Tele-Aloha 这类“稀疏相机加全局几何”系统一脉相承。深度由外部立体网络提供，Gaussian 参数被刻意设成解析常数而非网络预测，时间一致性靠手工设计的差分掩码滤波和深度回灌，网络只负责一件事：在几何引导下决定每个像素取哪个视角、哪里需要补洞。它回答的问题是：怎样让 feed-forward IBR 的输出在相机移动和时间推移时不闪、不跳。为此它接受了较低的单帧上限和对深度质量的强依赖。在领域谱系中，它位于“传统实时 3D 重建系统（TSDF 融合）”与“可泛化神经渲染（ENeRF/GPS-Gaussian）”之间的桥接位置，是少数把时间和视角一致性做成量化指标（TCC/STED/SDT/SDV）来评测的在线 NVS 工作。后续的 IGS、StreamSplat、LiveStre4m、NSTM 等工作则用有状态的持久表示、视频扩散或学习型记忆，去替代它的启发式时间机制。\n\n一句话概括：Quark 是“学习驱动、质量优先、无状态”，Ha et al. 是“几何驱动、一致性优先、弱状态”。前者代表图形学中神经渲染一侧的上限，后者代表远程临场系统一侧对稳定性的工程诉求。", "complementarity_zh": "两者的长处和短处几乎正好互补。\n\n1. 单帧质量与时序稳定性互补。Quark 的强项是单帧：迭代 render-and-refine 让深度复杂、遮挡多的场景也能得到锐利边界，在 N3DV/DyNeRF 同类数据上约 31.6 dB，且不需要外部深度。但它没有任何时间机制，官方承认会闪烁。Ha et al. 的强项是 STED/SDV 这类一致性指标，但单帧质量受限于外部立体深度和一个 4 层 U-Net，在域外户外数据上 PSNR 还不如 ENeRF。它的 TSDF 引导与时间滤波几乎不影响 PSNR，却能把 STED 从 95 降到 69。这说明它的一致性模块基本“正交”于单帧质量，可以叠加到一个更强的单帧渲染器上。\n\n2. 几何来源互补。Quark 的几何在网络内部学出，不需要深度传感器或立体网络，但几何被限制在各自的视差带里，每帧、每个视角各算一次，没有跨时间、跨视角共享。Ha et al. 的几何显式且可跨视角融合、可回灌到下一帧，但质量完全取决于外部深度，并且没有计入深度估计的开销。一个自然的结合是：用 Quark 式网络为每个输入视角或关键视角输出深度或 LDM，作为 TSDF 的输入（替代 RAFT-Stereo），同时把 TSDF 的一致性深度作为 Quark 下一次 render-and-refine 的初始化或条件，以替代它从常数特征开始的学习式初始化。\n\n3. 融合机制互补。Quark 的 One-to-many attention 不依赖视角顺序、支持可变视角数，而且对视角数接近 O(1)，正好能解决 Ha et al. 的两个问题：U-Net 按通道拼接导致 K 固定、顺序敏感，以及 K 集合切换引起的跳变（可以对更多视角做软加权，而不是硬性选最近 K 个）。反过来，Ha et al. 的 L_Depth（让融合权重复现一致深度）和背景图补洞，可以缓解 Quark 在视角覆盖不足时的硬边伪影。\n\n4. 评测体系互补。Quark 的评测覆盖面广（8 个数据集、高分辨率、与逐场景方法比较），但没有时间指标；Ha et al. 引入了 TCC、STED、SDT、SDV 和 EPI、x–t 切片等一致性评测，但数据集只有 3 个、序列只有 100 帧。二者合并，才构成一个面向远程临场的完整评测方案。\n\n5. 需要注意的冲突点。Quark 的“为每个目标视角过拟合几何”本质上以牺牲跨视角一致性来换取单视角质量（例如用来近似反射）；而 Ha et al. 用一个共享的 TSDF 去约束所有视角，会抹平这种视角相关的“作弊”。两者的结合必须在“视角相关外观”和“几何一致性”之间折中，例如只用 TSDF 约束 density 和深度，而让 blend weights 保持视角相关。", "combined_system_sketch_zh": "目标场景：固定多相机舱体或房间阵列（6–12 路 RGB，可选 RGB-D），双向实时通话，观看端为 3D 显示器或 VR/AR 头显。下面是按阶段组织的草图。\n\n阶段 0：采集与标定（发送端）。硬件同步触发、统一锁定曝光和白平衡，这是 Quark 与 Ha et al. 共同的敏感点。离线标定之后加在线标定监控：用重投影残差或类似 Tele360 的可微 LM 做小幅在线校正，残差超阈值时降级到更稳妥的渲染模式。对颜色做跨相机的 CCM 校正，以减轻 IBR 硬边。\n\n阶段 1：时间一致的逐视角深度（发送端）。不再使用逐帧 RAFT-Stereo 加手调差分掩码，改用时间一致的视频立体（如 Stereo Any Video、PPMStereo 类方法）或 RGB-D 传感器，输出深度和逐像素置信度，并计入延迟预算。Ha et al. 的颜色差分掩码只保留为廉价的静态区锁定和兜底。\n\n阶段 2：一致的全局几何代理。在一个共享的“规范视点”（例如观看者头部位姿的预测值，或阵列中心）上做 image-based TSDF 融合，用全部 N 个相机按置信度软加权，而不是硬性只取最近 K 个，以消除集合切换带来的跳变。上一帧的 TSDF 深度先按视点变化重投影，再回灌融合，补上 Ha et al. 未处理的“头动加场景动”情形。若算力允许，把它升级为一个持久的稀疏体素或 3DGS 状态（参考 SplatVoxel/Fuse-and-Refine、IGS、StreamSplat），让“之前可见、现在被遮挡”的背景能长期保留。\n\n阶段 3：Quark 式精化渲染器（服务端或接收端 GPU）。以目标视角 LDM 为输出，但用阶段 2 的一致深度初始化 LDM 的层位置（替代 Quark 的常数特征和等视差 anchor 初始化），这样可以减少迭代次数（Quark 的消融显示去掉前两次迭代只损失约 0.08 dB，却快 17%）。跨视角融合使用 One-to-many attention，支持 6–12 路可变输入，并保留射线编码，以便对眼睛、皮肤高光等做视角相关的权重分配。最终输出仍为 IBR blend weights 加 over 合成，保证 1080p 以上的纹理锐度。\n\n阶段 4：时间与一致性约束（训练期）。训练数据加入多视角人像视频（如 MVHumanNet++ 一类），损失在 Quark 的 10·L1+LPIPS 之外，加入 Ha et al. 的 L_Depth（渲染深度与 TSDF 一致）、基于光流的 temporal warping loss，以及相邻视点的一致性损失；网络中加入轻量时间状态，例如把上一帧 LDM 特征重投影后作为附加输入，或者采用 NSTM 式的 TTT 记忆。补洞在 Ha et al. 的背景图之上，引入长时背景记忆，大面积遮挡在预算允许时再交给少步数的因果视频生成模型（参考 RealCam）。\n\n阶段 5：传输与多视点输出。有两种部署方案。方案 A 是云端或发送端按接收者头部位姿渲染，再推送 2D（或双目）视频：带宽最低，但 motion-to-photon 延迟包含一个往返，需要接收端做 late-stage reprojection（利用 LDM 或深度做 ATW 式补偿）。方案 B 是把紧凑的几何和外观（Gaussian maps 或 LDM 加图像）经视频编码器推流到接收端本地渲染（参考 Tele360、GS-SCNet、D-FCGS）：对双目和多观看者更友好，但接收端需要 GPU。对于双目 HMD，左右眼可以共享阶段 1–2 以及 Quark 前几级的低分辨率计算，只在最后一两级和 IBR 渲染上分开，同时显式约束左右眼一致。\n\n阶段 6：评测与监控。除 PSNR、SSIM、LPIPS 外，必须报告 STED/TCC/SDV、flicker 或 tOF、长序列（分钟级）漂移、阵列外自由头动轨迹、双目一致性、端到端 motion-to-photon 延迟、带宽、显存，以及在目标硬件（消费级或边缘 GPU）上的帧率，并做人像专项测试（头发、眼神接触、快速手势、自遮挡）和用户研究。\n\n大致预算（参考两篇论文的数字，未经实测，仅作量级估计）：视频立体约 10–20 ms，TSDF 约 6 ms，经过 TSDF 初始化后缩减的 Quark 渲染器约 20–30 ms（A100 级），IBR 合成约 1–2 ms，加上编解码和网络传输后，单视角 30 fps 可行，双目 72–90 Hz 仍需进一步蒸馏或专用硬件。", "shared_blindspots_zh": ["都没有计量端到端系统延迟：Quark 的 30 fps 只是 A100 上的网络推理，Ha et al. 的约 39 ms 不含立体深度估计。二者都没有报告采集、编码、传输、显示的 motion-to-photon 延迟，也没有显存和消费级 GPU 的数据，而这些正是远程临场可用性的决定因素。", "都是“每个目标视角完整跑一遍”的逐视角架构：双目 HMD 的成本翻倍，多个观看者或光场显示时线性增长。两篇论文都没有讨论立体渲染、左右眼一致性或多观看者扩展，与“一次重建、多次渲染”的持久表示（3DGS 等）存在根本差异。", "都没有人像或人体专项评测：没有面部、头发、眼神接触、快速手势、自遮挡等远程临场核心内容的测试，也没有用户研究或头显实测。", "都强依赖精确标定和严格同步：Quark 在标定误差下会产生硬边，Ha et al. 在标定误差下出现前向投影错位。二者都没有在线标定、同步漂移检测或无位姿的能力，而后续工作（LiveStre4m、Tele360、AnySplat）正在去掉这一前提。", "都对跨相机的曝光、白平衡差异敏感：IBR 凸组合无法修正颜色不一致，导致接缝和闪烁（Quark 自述；Ha et al. 的 ENeRF-Outdoor 就因颜色标定问题被迫降分辨率评测）。", "都只用最近的少量输入视角（Quark 为 8，Ha et al. 为 K=2–4），并在目标视点移动时硬性切换输入集合，导致跳变；二者都没有滞回或软加权机制，视角覆盖不足时（阵列外外推、大角度转头）的表现没有被系统评测。", "都没有真正的视角相关外观模型：输出是输入颜色的凸组合，高光和镜面反射只能近似（被烘焙或以重影出现），镜面区域还会反过来破坏几何估计。", "都没有长时记忆：Quark 完全无状态，Ha et al. 只有至多 40% 的短时递归滤波。“之前可见、现在被遮挡”的内容无法被利用，大面积遮挡只能靠网络补洞或直接留空，长序列漂移也未检验。", "都没有带宽、压缩与传输架构分析：渲染放在发送端、云端还是接收端，需要传输哪些数据（K 路全分辨率 RGB 加深度，还是紧凑几何），两篇论文都没有讨论。", "评测规模都偏小、统计不充分：动态评测的数据集和序列很短（Quark 的 N3DV 只有 1 个目标相机、每 10 帧评一帧；Ha et al. 只评前 100 帧），消融只做了单次运行、没有误差条；二者都未与同期的 feed-forward 3DGS 或流式 4D Gaussian 方法（GPS-Gaussian 对 Quark，IGS/3DGStream 对 Ha et al.）以及彼此做定量比较。", "都没有开源代码和权重，论文中还存在数值不一致（Quark 的训练日程与上采样因子；Ha et al. 的运行时间正文约 100 ms 与表格合计约 39 ms 不符），独立复现门槛高，结论缺少第三方验证。", "都没有涉及隐私、安全与信任问题：远程临场会传输人脸和人体的三维数据，两篇论文都没有讨论数据保护、深度伪造风险或内容认证。"]}}}</script>
<script>
(function () {
  "use strict";
  // ================= core: shared helpers, cross-links, math, navigation =================
  var DATA;
  try { DATA = JSON.parse(document.getElementById("data").textContent); } catch (e) { DATA = {}; }
  var SITE = DATA.site || {};
  var meta = DATA.meta || {};

  // ---------- DOM helpers: all text goes through textContent; external links are https-only ----------
  function safeUrl(u) { if (typeof u !== "string") return null; var s = u.trim(); return /^https:\/\/[^\s"'<>]+$/i.test(s) ? s : null; }
  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (!Object.prototype.hasOwnProperty.call(attrs, k)) continue;
      var v = attrs[k];
      if (v === null || v === undefined || v === false) continue;
      if (k === "class") n.className = v;
      else if (k === "text") n.textContent = String(v);
      else if (k === "href") { var u = safeUrl(v); if (u) { n.setAttribute("href", u); n.setAttribute("target", "_blank"); n.setAttribute("rel", "noopener noreferrer"); } }
      else if (k.slice(0, 2) === "on" && typeof v === "function") n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, String(v));
    }
    (kids || []).forEach(function (c) { if (c === null || c === undefined || c === false) return; n.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return n;
