(Lc)", "term_zh": "层折叠", "def_zh": "在最后两个 Update & Fuse 步开始时，把相邻两层合并成一层：直通支路取均值，残差支路是拼接后接 MLP（§3.2.2 写 MLP，Fig. 3 图注写 CNN）。层数减半，视差带宽度加倍。"}, {"term_en": "Post-activation upsampling", "term_zh": "上采样后激活", "def_zh": "先对未激活的 logits 做双线性上采样，再施加 sigmoid、tanh、softmax，可以在低分辨率网格上得到锐利边界（ReLU Fields、DVGO）。"}, {"term_en": "Ray directional encoding (γ)", "term_zh": "射线方向编码", "def_zh": "输入射线与目标视锥近、远平面交点在投影空间中的 2D 差向量，经 tanh 和 8 个 octave 的正弦编码后线性投影到 C 维。与目标射线重合时为 0。"}, {"term_en": "Feature pyramid", "term_zh": "特征金字塔", "def_zh": "残差 CNN 加步长 mean-pooling 得到的多分辨率特征图（Quark 为 36×60 到 288×480），供不同分辨率的迭代步使用。"}, {"term_en": "Pre-LN Transformer / RMSNorm", "term_zh": "前置归一化 Transformer / 均方根归一化", "def_zh": "残差分支里先归一化再做注意力或 MLP 的结构。Quark 的 Fusion Block 沿用这种结构，用 3×3 卷积代替 MLP，归一化引用的是 RMSNorm。"}, {"term_en": "Residual scaling", "term_zh": "残差缩放", "def_zh": "GPT-2 提出的初始化技巧：按残差层数缩放残差分支的权重，以稳定深层网络的训练。"}, {"term_en": "LPIPS", "term_zh": "学习式感知图像块相似度", "def_zh": "在预训练网络特征空间里加权比较两张图的感知距离，越低越好。Quark 的损失是 10·L1 + LPIPS。"}, {"term_en": "PSNR / SSIM", "term_zh": "峰值信噪比 / 结构相似度", "def_zh": "逐帧的像素级和结构级指标。PSNR = 10·log10(1/MSE)。二者都不衡量时间闪烁。"}, {"term_en": "Temporal flicker", "term_zh": "时间闪烁", "def_zh": "视频中相邻帧之间不应有的亮度或几何跳变。Quark 逐帧独立重建、输入集合会切换，因此存在闪烁；论文所有指标都不衡量它。"}, {"term_en": "Wide baseline", "term_zh": "宽基线", "def_zh": "输入相机之间间距较大，Quark 中最大约 30 cm，视差大、遮挡多，比小基线的光场插值更难。"}]}, "ha": {"anchor": "ha", "story_zh": "设想一个固定在厨房里的相机阵列：18 到 22 台相机从前方对着灶台拍摄，有人在里面煎牛排（DyNeRF 数据集的场景）。远端用户戴着头显，想从任意一个没有相机的位置看这段直播，而且要求“边拍边看”，也就是在线、逐帧处理，不能像 NeRF 或 4DGS 那样先把整段视频拿去优化几个小时。已有的实时做法大致分两条路。一条是 Project Starline、Fusion4D 这类“稀疏相机 + 全局几何”，用深度传感器重建一个全局表面，结果稳定、不闪烁，但细节和复杂外观不行，而且基本只能拍人。另一条是 ENeRF、IBRNet、GPS-Gaussian 这类“挑几个最近视角 + 前馈网络”，单帧很锐，但每帧、每个视角独立推理，相机一动画面就跳，时间一长就闪。\n\n作者的核心直觉可以用一句话概括：让一个在视角和时间上都一致的几何代理当“裁判”，由它去约束一个只负责挑选和混合真实像素的网络。单帧画质来自 IBR（直接搬运真实像素），一致性来自全局几何（TSDF）。几何本身相对容易做到一致：相机固定不动，静止区域的深度可以跨帧平均；同一时刻把多个视角的深度融合进同一个 TSDF，渲染出来的目标深度基本不会随视角跳变（严格说只融合了 K 个最近视角，K 集合切换时仍有微小跳变，作者在 Sec. 3.2 承认了这一点，并用上一帧深度回灌来缓解）。颜色很难直接做一致，那就让颜色去跟随几何。\n\n具体做法分三步。第一步，把 K 个最近输入视角的每个像素按深度反投影成一个“像素大小、各向同性、完全不透明”的 3D 高斯，逐视角单独 splat 到目标相机，得到 K 张 warp 后的图像、alpha 和深度。第二步，先用颜色差分掩码对每个输入视角的深度做时间 EMA，再在目标视角的图像空间里做 Starline 式的 image-based TSDF，沿每条目标射线融合 K 个视角的深度，同时把上一帧输出的目标深度当作一个额外输入回灌进去，经 raymarching 得到一张在视角和时间上都一致的目标深度 𝒟^t。第三步，一个 4 层 U-Net 读取这 9K+1 个通道，输出 K 个逐像素混合权重、一个背景权重和一张背景图。训练时加一个 L_Depth，让用同一组权重混合出来的深度去逼近 𝒟^t，于是网络会倾向于挑那些几何上正确的视角。\n\n效果是：在 DyNeRF 和 D3DMV 上，保真度和一致性指标全部最好，例如 DyNeRF PSNR 31.17（ENeRF 29.51），STED 68.76（ENeRF 76.14）；按 Table 4 相加，TensorRT 下每帧约 39 ms。代价和隐患也要看清。第一，立体深度（RAFT-Stereo，在人工挑选的图像对上跑）不计入耗时。第二，在存在同步和颜色标定问题的 ENeRF-Outdoor 上（该数据集和 D3DMV 都不在训练集中），PSNR、SSIM、L1 都输给 ENeRF。第三，消融显示去掉 TSDF 引导后 PSNR 只少 0.01 dB，TSDF 的价值主要体现在 STED（95.42 → 68.76）上（TCC 0.869 → 0.872、LPIPS 0.197 → 0.191 只有小幅改善）。第四，损失函数里没有任何时间项，时间稳定性完全来自输入端的滤波和回灌。第五，方法依赖公制尺度（τ = 0.02 m）以及标定精确、严格同步的阵列。\n\n对新人来说，这篇论文很适合用来把“多视几何、深度融合、alpha 合成、学习式混合、视频一致性评测”这几块基础串成一条完整流水线。每一个模块都能追溯到经典方法（Curless–Levoy / KinectFusion 的 TSDF 及其 Starline 图像空间变体、与 ULR 混合权重同类的几何线索、3DGS 光栅化、EMA 滤波），拼在一起就得到一个能在线运行的 3D 视频系统。读完它，再回头看 Quark 的“单帧高画质、render-and-refine”，就能看清两者分别押注在哪一边：Quark 押单帧画质，Ha et al. 押跨视角和跨时间的一致性。", "before_you_read": [{"concept_id": "g-pinhole", "why_zh": "全文的每一步都在做“像素 ↔ 3D 点”的转换：h3 用深度把像素反投影成高斯中心，h6 把目标射线上的采样点用 (x,y,z)=K(Rp+t) 投影回 K 个输入视角。不熟悉内参 K、外参 [R|t]、深度 z 的含义，附录 A.1 的 Eq. 9 基本看不懂。"}, {"concept_id": "g-depth", "why_zh": "深度来自立体视差 Z=fB/d，误差随 Z² 增长。这决定了为什么需要时间滤波和置信权重，也解释了为什么固定的 τ=0.02 m 对远处背景太紧。论文依赖公制尺度，但 COLMAP 位姿只确定到一个尺度因子，这个矛盾也要在这里理解。"}, {"concept_id": "d-stereo", "why_zh": "输入深度 D_n^t 由 RAFT-Stereo 在人工挑选的双目对上估计（Sec. 4、A.5）。要理解双目校正、视差以及逐帧独立估计为什么会闪烁，才能明白 h4/h5 的滤波在修补什么。"}, {"concept_id": "i-warping", "why_zh": "Sec. 3.1 本质上是基于深度的前向 warping。空洞（disocclusion）、飞点（flying pixels）和多视角 Z-fighting 都是前向 warping 的典型问题，Fig. 4 和背景图 I_BG 都是为它们设计的。"}, {"concept_id": "r-alpha", "why_zh": "前向渲染输出的累积 alpha α_k 和混合公式 Eq. 4–5 都属于 alpha 合成与加权平均。不理解 over 算子和累积透射率，就不明白为什么“完全不透明”的高斯仍然会在边缘产生小数 alpha。"}, {"concept_id": "n-3dgs", "why_zh": "论文直接调用原版 3DGS 光栅器（2D 协方差投影、按深度排序、α-blending），只是把高斯参数固定为像素级的解析值。需要知道 3DGS 的高斯参数和光栅化流程，才能看懂 h3 的设计取舍。"}, {"concept_id": "d-tsdf", "why_zh": "论文的核心几何模块是 image-based TSDF（A.1，Eq. 9–12，来自 Project Starline），它是 Curless–Levoy 和 KinectFusion 体素 TSDF 在图像空间里的变体。截断、加权融合、零交叉这三个概念是 h6–h9 的基础。"}, {"concept_id": "r-raymarch", "why_zh": "TSDF 深度靠沿射线以 0.8·s 步进，检测到符号变化后再做 3 步二分细化得到（A.1）。这是 sphere tracing 的思路，要和 NeRF 的体渲染积分区分开。"}, {"concept_id": "f-prob", "why_zh": "Eq. 2 是指数滑动平均（EMA），Eq. 11 是基于局部方差的置信权重，Eq. 13–14 是带上限的累积权重，三者都是加权平均和递归滤波的直接应用。能算出 EMA 的降噪比例，才能判断时间滤波到底有多强。"}, {"concept_id": "i-blending", "why_zh": "混合网络的相机特征（射线夹角、相机距离，A.4 第 5–8 项）与 Unstructured Lumigraph 混合权重使用的几何量属于同一类（论文本身没有引用 ULR）；消融里的 Distance-based Blending（引用 LLFF）就是这类手工权重。"}, {"concept_id": "l-cnn", "why_zh": "混合网络是一个 4 层 U-Net，输入 9K+1 个通道。需要理解编码器-解码器结构、跳连，以及为什么训练裁剪块取 640×352 这样能被 16 整除的尺寸（论文没有解释这个选择，这是我们的推测）。"}, {"concept_id": "v-metrics", "why_zh": "实验同时报告了 PSNR/SSIM/LPIPS/L1（单帧保真度）和 TCC/STED/SDT/SDV（时间与视角一致性），另有 EPI 和 x–t 切片。不先弄清这些指标各自衡量什么，就无法判断“TSDF 引导主要提升 STED”这件事的含义。"}], "walkthrough": [{"id": "h1", "title_zh": "问题设定：固定、已标定、同步的相机阵列，K 个最近 RGB-D 视角，在线逐帧处理", "paper_ref": "Sec. 1（两类已有路线）；Sec. 3 第 3 段（输入/输出定义）；Sec. 3.1 第 1 句（K 个最近视角）；Sec. 4.2、A.6（数据集）；A.7（评测协议、K 的取值）", "what_zh": "输入：t 时刻 N 路 H×W RGB 帧 {I_n^t}，对应逐视角深度 {D_n^t}，一次性标定好的内外参 {K_n, R_n, t_n}，以及目标（虚拟）相机位姿。输出：目标视角的 RGB 图像 𝓘^t。帧间只保留少量状态：上一帧的输入 RGB I_n^{t−1}（用于差分掩码）、滤波后的输入深度 Ḋ^{t−1}、上一帧目标深度 𝒟^{t−1} 和累积权重 ω_acc。", "plain_zh": "这一步定义的是“游戏规则”。相机阵列固定不动，每台相机的位姿只标定一次（g-rig、g-sfm）。每一帧都用针孔模型（g-pinhole）在像素、射线和 3D 点之间来回转换。“在线”指的是第 t 帧只能用到第 t 帧和之前的信息，不能像 DyNeRF、4DGS 那样先看完整段视频再逐场景优化。\n\n对每个目标视角，只从 N 台相机里选 K 台“最近”的（DyNeRF 和 ENeRF-Outdoor 取 K=4，D3DMV 取 K=2），这是 IBR 的经典做法：离目标越近的相机，warp 过去的误差越小（i-warping、i-blending）。相机固定这个前提后面会被反复用到：同一台相机前后两帧的同一个像素对应同一条射线，所以可以直接逐像素做差、做平均（h4、h5），不需要光流对齐（d-flow）。\n\n还有一个容易忽略的点：定量评测里的“新视角”都是阵列上被留出的真实相机（DyNeRF 9 个、ENeRF-Outdoor 3 个、D3DMV 4 个），也就是阵列内部的内插视角，并不包括头显自由移动时的外推视角。", "analogy_zh": "就像一场体育直播：场馆里固定架着二十几台机位，导播想要一个“不存在的机位”画面，于是从离它最近的 4 台机位借画面拼出来，而且只能边播边拼，不能等比赛结束后再剪辑。", "equations": [{"tex": "\\lambda\\begin{bmatrix}u\\\\ v\\\\ 1\\end{bmatrix}=\\mathbf{K}_n\\left(\\mathbf{R}_n\\mathbf{X}+\\mathbf{t}_n\\right)", "explain_zh": "针孔投影。X∈ℝ³ 是世界坐标下的 3D 点；R_n（3×3 旋转）和 t_n（3×1 平移）把它变到第 n 台相机的坐标系；K_n 是 3×3 内参矩阵（焦距 f_x、f_y 以像素为单位，主点 c_x、c_y）；λ 是该点在相机坐标系下的深度 z；(u,v) 是像素坐标。"}, {"tex": "\\mathbf{X}=\\mathbf{R}_n^{\\top}\\left(D_n[u,v]\\,\\mathbf{K}_n^{-1}\\begin{bmatrix}u\\\\ v\\\\ 1\\end{bmatrix}-\\mathbf{t}_n\\right)", "explain_zh": "反投影：已知像素 (u,v) 的深度 D_n[u,v]，先用 K_n^{-1} 得到 z=1 平面上的射线方向，乘以深度得到相机坐标系下的点，再用 R_n^⊤ 和 t_n 变回世界坐标。h3 用这个公式给每个像素的高斯定中心。"}, {"tex": "\\mathcal{S}^t=\\underset{\\mathcal{S}\\subset\\{1..N\\},\\,|\\mathcal{S}|=K}{\\arg\\min}\\;\\sum_{n\\in\\mathcal{S}}\\mathrm{dist}(\\mathrm{cam}_n,\\mathrm{cam}_{\\text{tgt}})", "explain_zh": "K 个最近视角的选择。dist 是相机间的某种距离，论文只写了“closest”，没有说明是光心欧氏距离还是还考虑朝向；评测时还要把被留出的测试相机本身排除（A.7）。所有 baseline 使用同一组 K 个视角（Sec. 4.2）。"}], "numbers_zh": "DyNeRF：原始 18–22 台相机，2704×2028，测试用的两个场景各 22 台相机，降采样到 1352×1014；测试场景为 Sear Steak 和 Flame Steak，9 个测试视角，K=4。ENeRF-Outdoor：18 台 1920×1080 相机，渲染分辨率 960×540，指标在 480×270 计算，3 个测试视角，K=4。D3DMV：10 台相机，640×360 压缩版，4 个测试视角，K=2。每段序列只评测前 100 帧（30 fps 下约 3.3 s）。在线系统在 30 fps 下每帧预算为 33.3 ms。", "why_design_zh": "固定、预标定的阵列让相机位姿成为已知常量，不必每帧估计。只取 K 个视角，是因为 splat、TSDF 和混合的耗时都随 K 近似线性增长，而画质在 K≥4 后趋于饱和（Fig. 8）。作者没有采用的方案有：融合全部 N 个视角（太慢），以及逐场景优化的 4D 表示（4DGS、4K4D，不能在线运行）。", "pitfalls_zh": "1）“在线”不等于“实时”，也不等于“端到端低延迟”：立体深度的耗时不计入（见 h2、h13）。2）关于位姿来源，论文前后说法不一致：Sec. 3 说用 COLMAP 一次性计算，A.7 说“使用数据集提供的相机参数”。3）测试视角都在阵列上，没有外推评测。4）K 集合随视点切换时会带来微小跳变，作者在 Sec. 3.2 中承认了这一点。", "concept_ids": ["g-pinhole", "g-rig", "g-sfm", "i-blending", "n-generalizable"], "check_q_zh": "为什么这篇论文可以直接比较同一相机前后两帧同一像素的颜色来判断“这里动没动”？如果换成手持移动相机还能这样做吗？", "check_a_zh": "因为阵列中每台相机的位姿在时间上固定，同一像素在两帧里对应同一条射线，颜色变化只能来自场景本身（运动或光照）。手持相机在移动，同一像素前后两帧对应不同的射线，需要先用光流或位姿加深度把上一帧对齐（warp）到当前帧，才能做差，否则相机运动本身就会被当成场景运动。", "adv_ids": ["a-telepresence-sys"]}, {"id": "h2", "title_zh": "深度从哪来：RAFT-Stereo（人工选对）或深度传感器", "paper_ref": "Sec. 3 第 3 段（“stereo algorithm [41] … possible to use RGB-D cameras for input [51]”）；Sec. 4 实现细节段；A.5（人工挑选立体对）；Sec. 1（传感器深度分辨率低）", "what_zh": "输入：每台相机与一台人工选定的搭档相机组成的双目对（DyNeRF、Spaces），或传感器深度（ScanNet）。输出：每个视角每一帧的公制深度图 D_n^t（H×W，单位米）。", "plain_zh": "双目立体（d-stereo）的流程是：先把两台相机校正（rectify）到共面、行对齐（g-epipolar），这样同一个 3D 点在两张图里只在水平方向错开 d 个像素，d 就是视差；再用三角关系 Z=fB/d 把视差换成深度（g-depth）。RAFT-Stereo 先为每个像素构建所有候选视差的相关代价体，再用多层卷积 GRU 反复迭代更新视差估计（l-iterative），每次迭代都从代价体里查询当前估计附近的匹配代价。\n\n对这篇论文来说，关键在于 RAFT-Stereo 是逐帧独立运行的。同一个静止的墙面，这一帧估计 2.01 m，下一帧可能是 1.99 m，直接拿去 warp 就会闪烁。深度误差还随距离平方增长，远处背景更不稳定。后面 h4、h5 的时间滤波和 h7 的置信权重，都是为了修补这个问题。\n\n论文也提到可以改用 RGB-D 传感器（引用 Holoportation [51]），但引言认为传感器深度分辨率低，这正是 Starline 类系统只能拍人的原因之一（d-sensors）。", "analogy_zh": "两只眼睛看同一根手指，交替闭眼时手指会“跳”一下，跳得越多说明手指越近。RAFT-Stereo 就是一个反复比对左右图、逐步修正“跳了多少像素”的算法。但它没有记忆，每一帧都从头判断一次，所以同一面墙的判断结果会有轻微抖动。", "equations": [{"tex": "Z=\\frac{f\\,B}{d}", "explain_zh": "校正后双目的深度-视差关系。Z 是深度（米）；f 是校正后的焦距（像素）；B 是两台相机光心之间的基线（米）；d 是视差（像素）。如果两台相机主点不同，还要加一个主点差修正（RAFT-Stereo README 的“Converting Disparity to Depth”一节给出了带 cx1−cx0 项的换算式）。"}, {"tex": "\\delta Z\\approx\\frac{Z^{2}}{f\\,B}\\,\\delta d", "explain_zh": "对上式求导得到的误差传播。δd 是视差误差（像素），δZ 是对应的深度误差。深度误差和 Z² 成正比，和基线、焦距成反比。"}], "numbers_zh": "示例（假设值，不是论文数据）：f=1000 px，B=0.3 m，Z=3 m 时 d=100 px。若 δd=0.5 px，则 δZ≈9/300×0.5=1.5 cm，已经接近 TSDF 的截断阈值 τ=2 cm。同样条件下 Z=6 m 时 δZ≈6 cm，是 τ 的 3 倍，这也是固定的公制 τ 对远处背景不友好的原因。论文数据：DyNeRF 和 Spaces 用 RAFT-Stereo，ScanNet 用传感器深度。立体深度的耗时不计入 Table 4。", "why_design_zh": "论文给出的理由是：相机配置事先已知，所以可以用立体算法估计深度，这也使得方法能在现有的多视角数据集上评测（Sec. 3）；引言还指出基于对应的方法能得到高分辨率深度，而传感器深度分辨率低、限制了场景级重建（Sec. 1）。阵列固定，所以可以事先为每台相机挑好搭档。作者没有采用的方案有：全视角 MVS（开销大）、深度传感器（分辨率低、室外受限）、以及时间一致的视频立体方法（论文完全没有讨论）。", "pitfalls_zh": "1）“人工挑选立体对”意味着这一步无法自动化，测试序列上深度具体怎么生成，论文也没有交代。2）RAFT-Stereo 输出的是校正坐标系下左图的视差，要换回原始相机坐标系下的深度图还需要一次坐标变换，论文没有写。3）很多人以为“这个方法约 39 ms 一帧”包含了深度，其实不包含。22 路 1352×1014 的立体匹配本身就可能是整个系统最大的开销。", "concept_ids": ["d-stereo", "g-epipolar", "g-depth", "d-sensors", "l-iterative"], "check_q_zh": "假设 f=1000 px、B=0.2 m，要让 5 m 处的深度误差小于 τ=0.02 m，视差误差最多能容忍多少像素？", "check_a_zh": "由 δZ≈Z²/(fB)·δd 得 δd≈δZ·fB/Z²=0.02×1000×0.2/25=0.16 px。这比真实场景中学习式立体算法常见的亚像素误差量级（零点几像素到 1 像素左右）还要严格，说明远处区域的深度很难落在截断带内，需要依靠置信权重和时间滤波来弥补。", "adv_ids": ["a-learned-stereo"]}, {"id": "h3", "title_zh": "前向渲染：像素大小、各向同性、完全不透明的高斯，逐视角单独 splat，得到 𝓘_k、α_k、𝒟_k", "paper_ref": "Sec. 3.1；Fig. 4(a)；A.3；Fig. 10", "what_zh": "输入：第 k 个选中视角的 RGB 图 I_k^t、深度 D_k^t（论文写的是 D_k^t，未写 Ḋ_k^t）及其位姿。输出（在目标相机中）：warp 后的图像 𝓘_k^t（3×H×W）、累积不透明度 α_k^t（1×H×W）和深度 𝒟_k^t（1×H×W）。K 个视角分别渲染，共得到 K 组。", "plain_zh": "每个像素用反投影公式（g-pinhole）变成一个 3D 点，作为高斯中心。颜色取该像素的 RGB，不透明度 o=1，协方差取各向同性的 σ²I，σ 按解析式设定，使这个高斯投影回源图时恰好覆盖 1 个像素。一个像素在深度 z 处对应的物理宽度约为 z/f，所以 σ 与 z/f 成正比；论文没有给出具体比例系数。接下来用原版 3DGS 光栅器（n-3dgs、r-raster）把这些高斯投到目标相机：每个高斯变成一个 2D 椭圆，按深度排序，再做前到后的 alpha 合成（r-alpha）。\n\n为什么不用最简单的点溅射（每个点只写一个像素并做 z-buffer）？因为目标相机离得更近时，一个源像素应该覆盖多个目标像素，点溅射会留下针孔状空隙，边缘也会出现锯齿；高斯有面积，会自然覆盖这些位置（Fig. 10）。另一方面，高斯是按深度排序后合成的，前面的高斯会挡住后面的，所以遮挡也能正确处理（A.3：“Gaussians enable occlusion-handling”）。\n\n为什么要逐视角单独渲染，而不是把 K 个视角的高斯放在一起渲染一次？因为 K 个视角的深度彼此不一致，同一块表面在不同视角里可能差几厘米。放在一起渲染时，这些互相交错的表面会争夺同一个像素（Z-fighting），边缘还会出现飞点（Fig. 4a）。分开渲染则保留了 K 个“意见”，交给后面的网络去裁决（i-warping）。", "analogy_zh": "把每个输入视角想成一张由几百万颗彩色小球组成的“浮雕”，每颗小球的大小刚好等于一个像素。从目标相机的位置分别给这 4 张浮雕各拍一张照片，而不是把 4 张叠在一起拍，免得它们互相穿插。", "equations": [{"tex": "\\boldsymbol{\\mu}_{k,uv}=\\mathbf{R}_k^{\\top}\\left(D_k[u,v]\\,\\mathbf{K}_k^{-1}[u,v,1]^{\\top}-\\mathbf{t}_k\\right),\\quad \\Sigma_{k,uv}=\\sigma_{k,uv}^{2}\\mathbf{I}_3,\\quad \\sigma_{k,uv}\\propto\\frac{D_k[u,v]}{f_k},\\quad o=1", "explain_zh": "像素级高斯的参数。μ 是中心，Σ 是各向同性协方差，I_3 是 3×3 单位阵，σ 与“一个像素在深度 D 处的物理宽度 D/f”成正比（比例常数论文未给），o 是不透明度，固定为 1；颜色 c 取像素值 I_k[u,v]。"}, {"tex": "\\Sigma'=\\mathbf{J}\\mathbf{W}\\Sigma\\mathbf{W}^{\\top}\\mathbf{J}^{\\top}\\;(+\\,0.3\\,\\mathbf{I}_2),\\qquad \\alpha_i(\\mathbf{x})=\\min\\!\\left(0.99,\\;o_i\\exp\\!\\left(-\\tfrac12(\\mathbf{x}-\\boldsymbol{\\mu}'_i)^{\\top}\\Sigma_i'^{-1}(\\mathbf{x}-\\boldsymbol{\\mu}'_i)\\right)\\right)", "explain_zh": "3DGS 的 2D 投影与逐像素不透明度。W 是世界到目标相机的旋转，J 是透视投影在高斯中心处的雅可比矩阵，Σ' 是 2×2 的屏幕空间协方差，μ' 是投影后的中心，x 是像素位置。原版 3DGS 代码会在 Σ' 对角线上加 0.3（低通），把 α 截断到 0.99，并跳过 α<1/255 的贡献。所以即使 o=1，边缘处的 α 仍然是小数。"}, {"tex": "\\mathcal{I}_k(\\mathbf{x})=\\sum_{i}c_i\\,\\alpha_i\\prod_{j<i}(1-\\alpha_j),\\qquad \\alpha_k(\\mathbf{x})=1-\\prod_i(1-\\alpha_i),\\qquad \\mathcal{D}_k(\\mathbf{x})=\\sum_i z_i\\,\\alpha_i\\prod_{j<i}(1-\\alpha_j)", "explain_zh": "前到后 alpha 合成。i 按深度从近到远排序，c_i 是颜色，z_i 是高斯在目标相机下的深度，∏(1−α_j) 是累积透射率。α_k 是累积覆盖率，接近 0 的地方就是空洞。深度用同样的权重累积，这是常见做法；论文只说“使用原版 3DGS 代码做前向渲染”，没有说明 𝒟_k 和 α_k 是怎样从光栅器导出的（最初发布的 3DGS 光栅器只返回颜色）。"}], "numbers_zh": "DyNeRF 分辨率下，每个视角 1352×1014=1,370,928 个高斯，K=4 时每帧约 548 万个。Table 4：K 个视角的 forward-splatting 合计 10 ms。示例（假设值）：z=2 m、f=1000 px 时一个像素宽约 2 mm，σ 就在毫米量级。", "why_design_zh": "作者用解析参数，而不用网络预测高斯参数。理由是：在稠密的 H×W 像素网格上，GPS-Gaussian、Tele-Aloha、GS-LRM 一类网络预测的尺度、不透明度和旋转会收敛到近似常数，颜色也等于输入像素，所以直接解析计算更省（Sec. 3.1）。网络预测的一个潜在好处是能放大背景高斯来填补遮挡洞，但作者发现这会降低整体 PSNR（A.3，只有 Fig. 10 的定性证据，没有表格）。空洞改由 h11 的背景图来处理。没有采用的方案：点溅射（Fig. 10）、单次整体渲染（Fig. 4a）、网络预测参数。", "pitfalls_zh": "1）“完全不透明”不代表 α_k 只有 0 和 1。高斯边缘衰减，再加上 0.3 的低通，都会产生小数 alpha，α_k 实际上是一张软覆盖图。2）这是前向 warping，不是反向采样。采样造成的针孔空隙已由像素级高斯基本消除，剩下的空洞和飞点来自去遮挡和深度错误（Sec. 3.1：“disocclusions and errors in the depth maps … lead to holes and flying pixels”）。3）各向同性、按源图像素定尺度的高斯没有考虑表面倾斜，掠射角下会被拉长或留缝；它也表示不了半透明、头发和视角相关的高光。4）论文说用 D_k^t 反投影，没写是否使用了 h5 滤波后的 Ḋ_k^t。", "concept_ids": ["g-pinhole", "r-raster", "r-alpha", "n-3dgs", "i-warping", "r-reps"], "check_q_zh": "如果把 4 个视角的高斯合在一起一次渲染，为什么边缘会比逐视角渲染更差？", "check_a_zh": "4 个视角的深度各有几厘米的误差，同一块表面会变成 4 层互相交错的“薄壳”。合在一起按深度排序时，哪一层在前取决于噪声，前景边缘的高斯还会落到背景前面形成飞点，结果就是 Z-fighting 和锯齿状边缘（Sec. 3.1、Fig. 4a）。逐视角渲染可以保证每张图内部自洽，把“该信哪个视角”的决策留给后面由几何引导的混合网络。", "adv_ids": []}, {"id": "h4", "title_zh": "软差分掩码：M = min(|I_t − I_{t−1}|/λ_t + β, 1)，在 1/4 分辨率计算并做 max-pool", "paper_ref": "Sec. 3.2，Eq. (1) 及其后一段；Fig. 3", "what_zh": "输入：同一台固定相机相邻两帧的 RGB，I_n^t 和 I_n^{t−1}。输出：软掩码 M_n^t∈[0.6,1]（H×W），表示这一帧应该在多大程度上相信新深度。", "plain_zh": "相机不动，所以一个像素颜色没变，基本就说明这里的场景没动。颜色差越大，越像是动了，越应该相信新测到的深度；颜色没变，就可以多沿用历史深度来压制立体噪声（f-prob、v-temporal）。这张掩码不是 0/1 的硬分割，而是一个线性上升、在 1 处截断的软值：颜色差为 0 时 M=β=0.6，差值达到 0.4·λ_t=0.28 时 M 饱和为 1。\n\n计算细节（f-image）：论文只给出了步骤——在 1/4 分辨率计算、3×3 max-pool、双线性上采样回原分辨率，没有解释动机。我们的理解是：降到 1/4 分辨率既省计算，又相当于低通滤波，能抑制单像素噪声和视频压缩噪声；3×3 max-pool 相当于把“动了”的区域膨胀一圈，在 1/4 分辨率下 1 个像素对应原图 4×4 个像素，这样运动物体的边缘会被保守地当成动态处理，避免留下拖影；双线性上采样则得到平滑过渡。\n\n注意，这张掩码是在 RGB 上计算，却用来控制深度的更新。颜色变化并不等价于几何变化，这是整个时间模块最大的启发式假设。", "analogy_zh": "像监控摄像头里的“移动侦测”：画面某块区域变化明显就标记为动了。只不过这里是一个旋钮，而不是开关：最安静的时候旋钮停在 60%（仍然每帧吸收 60% 的新深度），变化越大拧得越满，最多到 100%。", "equations": [{"tex": "M_n^t=\\min\\!\\left(\\frac{\\left|I_n^t-I_n^{t-1}\\right|}{\\lambda_t}+\\beta,\\;1\\right)", "explain_zh": "Eq. (1)。I_n^t 是相机 n 在时刻 t 的图像（取值推测在 [0,1]）；|·| 是逐像素绝对差，RGB 三个通道如何合成一个值（取均值还是最大值）论文没有说明；λ_t=0.7 控制对颜色变化的敏感度；β=0.6 是下限，保证至少 60% 的新深度被采纳；min(·,1) 把结果截断到 1。论文称 β 和 λ_t 为“决定对颜色变化敏感度的经验超参数”。"}, {"tex": "M\\leftarrow\\mathrm{Up}_{\\times4}^{\\text{bilinear}}\\Big(\\mathrm{MaxPool}_{3\\times3}\\big(M^{\\downarrow4}\\big)\\Big)", "explain_zh": "计算流程：M^{↓4} 表示在 1/4 分辨率上计算 Eq. (1)，接着做 3×3 max-pool（相当于形态学膨胀），再双线性上采样 4 倍回到原分辨率。下采样方式和 pooling 步长论文没有写，按“保持尺寸”的 stride=1 理解最合理。"}], "numbers_zh": "λ_t=0.7，β=0.6。颜色差 0 → M=0.6；0.07 → 0.7；0.14 → 0.8；≥0.28 → 1.0。换成 8-bit 约为 71 个灰度级。相机噪声如果在 0.01 左右，M≈0.614，基本就是下限。DyNeRF 1352×1014 在 1/4 分辨率下约为 338×254。", "why_design_zh": "相机固定，所以逐像素做差是最便宜的运动检测方法，几乎不耗时（Table 4 也没有单独列出这一步）。没有采用的方案：光流（d-flow，更准但更贵）、背景建模（如 GMM）、学习式运动分割，以及直接加时间损失。下限 β=0.6 可以理解为一种保守设计（论文未解释取值）：宁可少滤波，也不让陈旧深度拖住运动物体。", "pitfalls_zh": "1）M 不是“运动概率”。它的最小值是 0.6，所以静止区域也只保留 40% 的历史，滤波力度并不大（见 h5）。2）光照变化、阴影、火焰（Flame Steak 里就有火）、自动曝光和 mp4 压缩噪声都会被当作运动。反过来，一个无纹理的纯色物体在移动时，内部像素颜色可能不变，会被误判为静止，从而沿用旧深度产生拖影。3）Eq. (1) 的 β 和附录 Eq. (13) 的 β 用的是同一个符号，但 A.2 对后者的描述是“控制前几帧的相对贡献”，论文没有说明两者是否取同一数值（β=0.6 只在 Eq. (1) 处给出）。", "concept_ids": ["f-image", "f-prob", "v-temporal", "d-flow"], "check_q_zh": "如果把 β 从 0.6 调到 0.1，静止区域和运动物体边缘分别会发生什么？", "check_a_zh": "静止区域的 M≈0.1，每帧只吸收 10% 的新深度，滤波强得多，稳态噪声方差比例从 0.6/1.4≈0.43 降到 0.1/1.9≈0.05，闪烁明显减少。代价是：只要掩码漏检了运动（颜色差不够大，或者掩码膨胀没有覆盖到的边缘），旧深度就会残留很多帧，造成拖影和几何滞后。β 实际上是在“去噪强度”和“对运动的响应速度”之间做权衡。", "adv_ids": []}, {"id": "h5", "title_zh": "静止区域的时间深度滤波（EMA）", "paper_ref": "Sec. 3.2，Eq. (2)；Table 3 “No Temporal Filtering” 一行", "what_zh": "输入：当前原始深度 D_n^t、掩码 M_n^t 和上一帧滤波结果 Ḋ_n^{t−1}。输出：滤波后的深度 Ḋ_n^t（H×W），它就是后面 TSDF 使用的输入深度。", "plain_zh": "Eq. (2) 是教科书上的指数滑动平均（EMA），也可以看作增益固定为 M 的稳态卡尔曼滤波（f-prob）：新估计 = 增益 × 新测量 + (1−增益) × 旧估计。增益越小，越相信历史，噪声压得越狠，但对真实变化的反应也越慢。这里的增益是逐像素的 M_n^t，所以动态区域增益接近 1，几乎直接用新深度；静止区域增益为 0.6，做轻度平滑。\n\n这一步完全在输入相机自己的图像空间里完成，前提是相机固定（g-rig）。它治的是立体深度逐帧独立估计带来的抖动（d-stereo），而不是后面几何融合出现的问题。\n\n把 EMA 展开来看：当前输出等于过去所有帧深度的加权和，权重按 (1−M) 的幂次指数衰减。M=0.6 时，各帧权重依次为 0.6、0.24、0.096……有效记忆长度约 1/M≈1.7 帧，是一种很短的记忆。", "analogy_zh": "就像给体重秤读数做平滑：每次新读数占 60%，昨天的平滑值占 40%。站着不动时读数会稳一些；一旦真的胖了或瘦了（场景动了，M→1），就立刻采用新读数。", "equations": [{"tex": "\\dot D_n^t=M_n^t\\cdot D_n^t+\\left(1-M_n^t\\right)\\cdot\\dot D_n^{t-1}", "explain_zh": "Eq. (2)。D_n^t 是 t 时刻的原始深度，Ḋ_n^t 是滤波后的深度，M_n^t 是 h4 的软掩码，所有运算逐像素进行。初始化（t=0 时 Ḋ 取什么值）论文未说明，一般取 Ḋ^0=D^0。"}, {"tex": "\\dot D^t=\\sum_{j\\ge 0}M(1-M)^{j}\\,D^{t-j}\\quad(M\\text{ 恒定时})", "explain_zh": "展开式：历史深度的权重按 (1−M)^j 衰减，所有权重之和为 1。"}, {"tex": "\\frac{\\mathrm{Var}[\\dot D]}{\\mathrm{Var}[D]}=\\frac{M}{2-M}", "explain_zh": "如果每帧深度噪声独立同分布，EMA 的稳态方差与原始方差之比为 M/(2−M)。M=0.6 时为 0.43，标准差降为约 0.65 倍，即闪烁幅度降低约 35%。"}], "numbers_zh": "数值例：某静止像素的真实深度为 2.00 m，RAFT-Stereo 连续三帧给出 2.01、1.99、2.01。M=0.6 时，Ḋ 依次为 2.010 → 0.6×1.99+0.4×2.010=1.998 → 0.6×2.01+0.4×1.998=2.0052，抖动幅度从 ±1 cm 降到约 ±0.5 cm。Table 3（数值对应 DyNeRF）：去掉时间滤波后 PSNR 31.16，完整模型 31.17；STED 89.62，完整模型 68.76。", "why_design_zh": "便宜，在线（只需上一帧），不需要网络。没有采用的方案：时间一致的视频立体网络（例如几乎同期的 Stereo Any Video，arXiv 2025-03；论文未讨论这类方法）、光流对齐后再滤波、卡尔曼滤波加不确定性传播、时间损失。", "pitfalls_zh": "1）很多人以为时间一致性主要来自这一步。实际上时间稳定性有两个来源：这里的输入端 EMA，以及 h9 在 TSDF 中回灌上一帧输出深度。Sec. 4.5 把这项消融描述为“用差分掩码对输入视角深度做时间滤波”，但没有说清“No Temporal Filtering”是否同时去掉了 𝒟^{t−1} 回灌（回灌的权重也依赖差分掩码）。2）EMA 只能压制零均值的随机抖动，压不住系统性偏差，比如高光区域持续错误的深度。3）运动区域 M=1，完全不滤波，所以运动物体上的深度闪烁照样存在。", "concept_ids": ["f-prob", "v-temporal", "d-stereo", "g-rig"], "check_q_zh": "M 恒为 0.6 时，上一帧的深度对当前输出的贡献是多少？5 帧之前的深度呢？", "check_a_zh": "上一帧的权重是 M(1−M)=0.6×0.4=0.24；5 帧之前是 0.6×0.4^5≈0.006，几乎可以忽略。所以这个滤波器的记忆非常短，只能压住逐帧的高频抖动，不能提供长时间的稳定性。", "adv_ids": []}, {"id": "h6", "title_zh": "基于图像的 TSDF：沿目标射线采样，投影到 K 个视角，求 s_k = z_k − D_k", "paper_ref": "Sec. 3.2 第 1 段；A.1，Eq. (9)；来源为 Lawrence et al. [30]（Project Starline）", "what_zh": "输入：目标相机的每条像素射线、K 张滤波后的深度 Ḋ_k^t 及其位姿。输出：射线上任意采样点 p 相对于每个视角的有符号距离 s_k。它们在 h7 中融合成一个标量 s(p)。", "plain_zh": "传统 TSDF（d-tsdf，Curless–Levoy 1996、KinectFusion 2011）先在空间里建一个 3D 体素网格，把每帧深度融合进去，再做光线投射。体素网格的问题是分辨率和显存、计算量难以兼顾。Starline 的 image-based TSDF 换了一个思路：只关心目标相机看到的射线。对每个目标像素，沿射线逐点试探，用到哪个点就当场算出这个点的 TSDF 值，不存任何体素。\n\n怎么当场算？把点 p 投影到第 k 个输入相机（g-pinhole），得到它在那台相机里的深度 z_k 和像素位置 (u_k,v_k)，再查询该相机在这个像素观测到的表面深度 D_k[u_k,v_k]。两者之差就是“点 p 沿相机 k 的视线到观测表面还有多远”。这叫投影符号距离（projective SDF），不是真正的欧氏最近距离。表面倾斜时，它会大于真实距离。\n\n关于符号：按 Eq. (9) 的字面写法，s_k=z_k−D_k，点在表面前方（离相机更近）时为负。但附录同时规定 s_k<−τ 时 ω_k=0，并且以 0.8·s 为步长前进。按字面符号推下去，射线起点处于表面前方的自由空间，所有视角的 s_k 都小于 −τ，权重全部为 0，步长为 0，射线无法前进。只有按 KinectFusion 的常用约定理解（s=D−z，表面前方为正，s<−τ 表示点在该视角表面后方很远，即被遮挡，这时忽略这个视角），三条规则才能互相吻合。这是我们的推断，论文没有说明；读的时候建议按“表面前方为正”来理解。", "analogy_zh": "想象你沿着目标相机的一条视线往前走，每走一步都打电话问 4 台相机：“我现在离你看到的那个表面还有多远？”每台相机只能回答沿它自己视线方向的距离，而且最多报 ±2 cm（截断）。你把 4 个回答加权合起来，正负号一翻转，就说明已经走到表面了。", "equations": [{"tex": "\\mathbf{p}(d)=\\mathbf{o}_{\\text{tgt}}+d\\,\\mathbf{r}_{\\text{tgt}}(u,v)", "explain_zh": "目标射线的参数化。o_tgt 是目标相机光心，r_tgt(u,v) 是经过像素 (u,v) 的射线方向，d 是沿射线的参数。射线从哪里开始、最远走到哪里（near/far），论文没有给出。"}, {"tex": "(x_k,y_k,z_k)^{\\top}=\\mathbf{K}_k\\left(\\mathbf{R}_k\\mathbf{p}+\\mathbf{t}_k\\right),\\qquad (u_k,v_k)=\\left(\\frac{x_k}{z_k},\\frac{y_k}{z_k}\\right)", "explain_zh": "A.1 的投影式。z_k 是点 p 在相机 k 坐标系下的深度，(u_k,v_k) 是它落在相机 k 图像上的像素坐标（论文称为 normalized pixel locations，实际上已经乘过内参，是像素坐标）。"}, {"tex": "s_k=z_k-D_k\\big[u_k,v_k\\big]", "explain_zh": "Eq. (9)。D_k[·] 表示在深度图上采样（插值方式未说明），省略了上标 t；按 Eq. (3)，这里应当使用滤波后的 Ḋ_k^t。符号约定的问题见上文，论文原式如此。"}], "numbers_zh": "数值例（按“表面前方为正”的约定）：目标射线上某点在相机 1 下 z_1=1.970 m，相机 1 观测到的表面深度为 2.000 m，得 s_1=+0.030 m，截断后为 +0.02；在相机 2 下 z_2=2.105 m、观测深度 2.100 m，s_2=−0.005 m，说明已经略微越过表面。Table 4：整个 TSDF 阶段（1352×1014 条射线，K=4）耗时 6 ms，用自定义 CUDA 实现。", "why_design_zh": "没有体素网格，所以分辨率只取决于目标图像分辨率，不需要体素显存，适合每帧都要重建的动态场景（Sec. 3.2：“avoids creating an explicit 3D voxel grid … efficiently generate high-resolution depth maps”）。论文的论点是：把输入深度融合进同一个全局结构，保证了同一时刻渲染出的深度视角一致（Sec. 3.2）；但实际只融合 K 个视角，这个保证是近似的（见 pitfalls 3）。没有采用的方案：KinectFusion、Fusion4D 类显式体素 TSDF（Sec. 2 提到分辨率和计算量难以兼顾），以及直接使用逐视角原始深度。", "pitfalls_zh": "1）image-based TSDF 不是一个可以存储、可以从任意视角重用的 3D 模型。每换一个目标视角都要重新沿射线计算，多名观看者、两只眼睛都要各算一遍。2）s_k 是沿视线的投影距离，不是欧氏距离，掠射角下偏大。3）论文所说的“全局几何”其实只融合了 K 个视角，K 集合一变，TSDF 就会变（Sec. 3.2 中作者承认了这一点）。4）注意 Eq. (9) 的符号问题。", "concept_ids": ["d-tsdf", "g-pinhole", "g-depth", "r-raymarch"], "check_q_zh": "与 KinectFusion 的体素 TSDF 相比，image-based TSDF 省掉了什么，又多付出了什么？", "check_a_zh": "它省掉了 3D 体素网格的显存和“把每帧深度积分进所有体素”的开销，分辨率也不受体素尺寸限制。代价是没有可以复用的全局模型：每个目标视角、每一帧都要沿每条射线重新投影、查询 K 张深度图。对单个观看者很划算，但观看视角越多成本越高，也无法天然积累多帧信息，因此才需要 h9 的时间回灌。", "adv_ids": []}, {"id": "h7", "title_zh": "截断与融合权重（τ = 0.02 m，权重基于 7×7 局部深度方差）", "paper_ref": "A.1，Eq. (10)–(12)；ω_k=0 的规则同样出自 A.1（沿用 Lawrence et al.）", "what_zh": "输入：K 个 s_k，以及每个投影位置周围 7×7 窗口内的深度。输出：点 p 的融合 TSDF 值 s(p)。", "plain_zh": "截断的作用是：距离表面超过 τ 的点，只需要知道它在前面还是在后面，不需要知道具体距离。这样可以防止一个视角里的远处误差主导融合结果（d-tsdf）。\n\n融合权重 ω_k 体现的是“这个视角在这一点有多可信”（f-prob）。论文的说法是：权重用来处理输入深度的噪声，按投影位置周围 7×7 邻域内的深度起伏来计算。深度图在物体边缘处会突变（前景和背景混在一起，容易产生飞点），在立体匹配失败的区域会呈噪声状，这些地方局部起伏都大，就降低权重；平坦表面起伏小，权重为 1。仔细看 Eq. (11)：ν_k/49 是截断后的均方差，开根号后是 RMS，所以权重等于 1 mm 除以局部 RMS 起伏，封顶为 1。这相当于按 1/σ 加权，而不是统计上最优的逆方差 1/σ² 加权。\n\n“s_k<−τ 时 ω_k=0”（按表面前方为正的约定）表示：这个点在视角 k 看来位于其观测表面后方超过 2 cm，也就是被挡住了，视角 k 对它没有发言权。这是处理遮挡的标准做法。", "analogy_zh": "一个评审团投票：每个评委只能投 −2 到 +2 之间的票（截断）；在自己看得清的地方（邻域平坦）投整票，在看不清的地方（边缘、噪声区）只投零点几票；如果某个评委被柱子挡住了视线，就弃权。", "equations": [{"tex": "s=\\sum_{k=1}^{K}\\omega_k\\cdot\\mathrm{clamp}\\left(s_k,-\\tau,\\tau\\right)", "explain_zh": "Eq. (10)。clamp 把 s_k 截断到 [−τ, τ]，τ=0.02 m。注意这是加权和，不是除以 Σω_k 的加权平均，论文原式如此。正负号不受归一化影响，但 h8 的步长 0.8·s 会随之变化。"}, {"tex": "\\omega_k=\\min\\!\\left(0.001\\cdot\\left(\\frac{\\nu_k}{w\\times w}\\right)^{-1/2},\\;1.0\\right)", "explain_zh": "Eq. (11)。w=7，所以 w×w=49；ν_k/49 是局部均方差，开根号取倒数后就是 1/RMS；0.001 与 τ 同为米制常数（1 mm，单位是我们根据 τ 的单位推断的）。局部 RMS≤1 mm 时 ω_k=1。"}, {"tex": "\\nu_k=\\sum_{(p,q)\\in\\mathcal{N}}\\min\\!\\left(\\left(D_k[u_k,v_k]-D_k[p,q]\\right)^{2},\\;\\tau^{2}\\right)", "explain_zh": "Eq. (12)。𝒩 是 (u_k,v_k) 周围的 7×7 邻域；统计的是邻域各像素相对于中心像素的平方差（不是相对于邻域均值的方差），每项截断到 τ²，避免深度边缘处的单个巨大跳变主导结果。"}, {"tex": "\\omega_{\\min}\\approx 0.001\\cdot\\left(\\tau^{2}\\right)^{-1/2}=\\frac{0.001}{0.02}=0.05", "explain_zh": "由截断可以推出权重的下限：ν_k/49 最大约为 τ²（中心像素自身贡献 0，严格上限是 48τ²/49），所以 ω_k 约在 [0.05, 1]。即使在最乱的边缘，权重也不会低于约 0.05。只有遮挡规则能让权重变成 0。"}], "numbers_zh": "τ=0.02 m，w=7，常数 0.001。局部 RMS 为 1 mm 时 ω=1，2 mm 时 0.5，4 mm 时 0.25，≥20 mm 时约 0.05。融合示例（K=4，表面前方为正）：s_k 分别为 +0.012、+0.008、−0.004、+0.030（截断为 +0.02），ω_k 分别为 1、0.5、0.2、1，则 s=0.012+0.004−0.0008+0.02=0.0352>0，该点仍在表面前方。", "why_design_zh": "深度误差最大的地方是物体边缘和立体匹配失败区，局部起伏恰好能反映这两类情况，而且只需要读取深度图，不需要网络，计算也便宜。没有采用的方案：使用立体网络输出的逐像素不确定度（RAFT-Stereo 本身不直接输出置信度）、按 Z² 缩放的误差模型、学习式置信度。", "pitfalls_zh": "1）τ 和 0.001 都是公制常数，隐含要求位姿和深度是真实的米制尺度。COLMAP 位姿只确定到一个尺度因子，论文没有说明如何对齐尺度。2）固定的 τ 对远处（误差可达数厘米）太紧，对近处的细节又偏松。3）ν_k 基于哪张深度计算（原始 D_k 还是滤波后的 Ḋ_k），论文没有区分。4）按 1/σ 加权不是最优的逆方差融合，不能把它当成严格的最大似然估计。", "concept_ids": ["d-tsdf", "f-prob", "g-depth", "d-sensors"], "check_q_zh": "某个视角在投影位置的 7×7 邻域内，一半像素与中心相差 0.5 mm，另一半相差 5 cm（落在深度边缘上）。求 ω_k。", "check_a_zh": "平方差截断后，约 24 个像素贡献 (0.0005)²=2.5e−7，约 24 个像素贡献 τ²=4e−4（5 cm 被截断到 2 cm），中心像素贡献 0。ν≈24×4e−4=9.6e−3（前一部分可忽略），ν/49≈1.96e−4，RMS≈0.014 m，ω≈0.001/0.014≈0.071。边缘处这个视角基本被降权到接近最低值 0.05。", "adv_ids": []}, {"id": "h8", "title_zh": "光线步进求零交叉，再用二分细化，得到一致的新视角深度", "paper_ref": "A.1 最后一段（0.8s 步长，三步二分）；Sec. 3.2，Eq. (3) 中的 Raymarch(·)", "what_zh": "输入：可以在任意点查询的融合 TSDF 值 s(p)。输出：目标视角每个像素的表面深度 𝒟^t（1×H×W），即射线上 s 第一次变号的位置。", "plain_zh": "这里的 raymarch 和 NeRF 的体渲染（r-volume）不是一回事。NeRF 是沿射线积分密度和颜色；这里是找到表面，也就是 SDF 的零点，属于 sphere tracing 一类方法（r-raymarch）。SDF 的值告诉你“离表面还有多远”，所以可以直接前进这么多。步长乘 0.8 可以理解为保险系数（论文没有解释取值）：投影距离并不是真正的最近距离，全速前进可能冲过薄结构。\n\n一旦发现 s 变号，说明表面就在最后一步的区间内。此时在区间里做二分：取中点，看它的符号，保留包含零点的那一半，重复 3 次，区间缩小到原来的 1/8（f-optim 里最简单的一维求根）。\n\n有一个细节论文没有交代：如果 s 是归一化的真实距离，每步走 0.8·s，剩余距离每步缩成 0.2 倍，会无限逼近表面却永远不会越过，符号也就不会改变。因此实际实现要么设置了 |s|<ε 的停止条件，要么依赖 Eq. (10) 未归一化（Σω_k>1.25 时一步的长度会超过剩余距离，从而越过表面）。论文只写了“检测到符号变化”。", "analogy_zh": "在黑暗里朝墙走，手里有个测距仪，读数最多显示 2 cm（截断）。每次只走读数的八成；某一步之后测距仪开始报“你已经在墙里了”（变号），就在最后一步之内来回折半试探 3 次，定出墙的位置。", "equations": [{"tex": "d_{i+1}=d_i+0.8\\cdot s\\big(\\mathbf{p}(d_i)\\big)", "explain_zh": "步进公式。d_i 是第 i 步在射线上的位置，s(·) 由 Eq. (10) 当场计算。按“表面前方为正”的约定，s>0 时向前走。"}, {"tex": "\\text{若 } \\mathrm{sign}\\,s(\\mathbf{p}(d_{i+1}))\\neq\\mathrm{sign}\\,s(\\mathbf{p}(d_i)):\\quad [a,b]\\leftarrow[d_i,d_{i+1}],\\;\\; m=\\tfrac{a+b}{2},\\;\\; \\text{按 } \\mathrm{sign}\\,s(m) \\text{ 更新区间，重复 3 次}", "explain_zh": "三步二分细化。区间长度变为原来的 1/2³=1/8，最终深度取区间内的某一点（论文没说取中点还是做线性插值）。"}, {"tex": "\\mathcal{D}^t=\\mathrm{Raymarch}\\Big(\\mathrm{TSDF}\\big(\\{\\dot D_k^t\\},\\,\\mathcal{D}^{t-1}\\big)\\Big)", "explain_zh": "Eq. (3)，整个几何模块的总式：TSDF 同时融合 K 张滤波深度 Ḋ_k^t 和上一帧的目标深度 𝒟^{t−1}（见 h9），再用 raymarch 求出本帧的目标深度 𝒟^t。"}], "numbers_zh": "数值例（未归一化，K=4，ω 全为 1）：某点离表面 5 cm 时，每个 s_k 都被截断为 0.02，s=0.08，一步走 0.064 m，越过表面 1.4 cm；此时每个 s_k≈−0.014（仍在 −τ 之内，权重不为 0），s≈−0.056，检测到变号。二分区间长 6.4 cm，3 步后缩到 8 mm。归一化的情况下，最大步长为 0.8τ=1.6 cm，3 步二分后区间在 2 mm 以内。TSDF（含 raymarch）合计 6 ms。", "why_design_zh": "sphere tracing 按距离值自适应步进，通常比固定小步长的密集采样需要更少的查询（论文没有报告实际步数），而且每条射线独立，适合在 CUDA 中逐像素并行；输出的是单一表面深度，正好可以作为混合网络的引导和 L_Depth 的目标。没有采用的方案：体渲染式的深度期望（会产生前景和背景之间的“中间深度”）、marching cubes 提取网格（需要体素网格）。", "pitfalls_zh": "1）输出是每个像素的单一不透明表面深度，表示不了半透明或多层结构。2）射线的起点、near/far 以及找不到零交叉时如何处理（例如天空、空洞），论文都没说，而这些在户外数据上很关键。3）如果一步越过表面超过 τ，按 ω_k=0 的规则所有视角的权重可能都变成 0，s=0，变号检测会失效。这是实现时需要自己处理的边界情况。4）不要把 0.8 理解成学习率，它是 sphere tracing 的保守松弛系数。", "concept_ids": ["r-raymarch", "d-tsdf", "f-optim", "r-volume"], "check_q_zh": "为什么这里用 sphere tracing 找零交叉，而不是像 NeRF 那样用体渲染积分出深度期望？", "check_a_zh": "TSDF 编码的是“到表面的距离”，零等值面就是表面，直接找零点得到的是一个确定的表面位置。体渲染的深度期望在前景和背景的交界处，会给出介于两者之间、实际并不存在的深度，拿它去引导混合会导致边缘错位。另外，sphere tracing 按距离自适应步进，通常比密集采样积分需要更少的查询。", "adv_ids": []}, {"id": "h9", "title_zh": "时间反馈：上一帧新视角深度作为额外的 TSDF 输入（ω_tmp，η = 15）", "paper_ref": "Sec. 3.2 第 3–4 段；A.2，Eq. (13)–(14)；Fig. 3", "what_zh": "输入：上一帧的目标深度 𝒟^{t−1}、K 张差分掩码 M_k^t、上一帧的权重。输出：给 𝒟^{t−1} 这个虚拟视角的融合权重 ω_tmp^t。它和 K 个真实视角一起进入 Eq. (10)，得到更稳定的 𝒟^t。", "plain_zh": "只融合 K 个最近视角有一个问题：视点一动，K 集合可能换掉一台相机，TSDF 深度就会轻微跳变。输入深度剩下的噪声也会让 𝒟^t 逐帧抖动。作者的办法是把自己上一帧的答案也当作一个“投票者”：由 𝒟^{t−1} 计算有符号距离，融合进 Eq. (10)（A.2）。可以把它理解成第 K+1 张深度图（它本来就位于目标相机的图像空间），对射线上的点计算 s=z−𝒟^{t−1}（或反号），再加权加入（d-tsdf、v-temporal）。\n\n这个投票者的权重怎么定？分三部分。（1）能不能信：把 K 张差分掩码用高斯 splat 前向投影到目标视角，逐通道取最大值得到 𝓜^t；动了的地方 1−𝓜≈0，历史被清空。（2）历史有多厚：ω_acc 是上一帧所有投票者的权重总和，历史越可靠，这一票越重，这和 KinectFusion 中体素权重的累积是同一个思路（f-prob）。（3）上限：η=15 是 𝒟^{t−1} 的最大融合权重，防止历史权重无限增长，否则画面会冻住，无法跟随真实变化。\n\n与 h5 不同，h5 在输入相机空间滤波深度，h9 在输出空间滤波几何。后者针对的正是 K 集合切换带来的跳变（Sec. 3.2）。", "analogy_zh": "像开会时，上一次会议的决议也算一票，分量取决于上次有多少人赞成（ω_acc），但封顶 15 票，免得旧决议压倒一切。如果议题本身已经变了（场景动了，𝓜 接近 1），旧决议直接作废。", "equations": [{"tex": "\\omega_{\\text{tmp}}^{t}=\\min\\!\\Big(\\beta\\cdot\\omega_{\\text{acc}}^{t}\\cdot\\max\\big(1-\\mathcal{M}^{t},0\\big),\\;\\eta\\Big)", "explain_zh": "Eq. (13)。𝓜^t 是把 K 张 M_k^t 用高斯 splat 到目标视角后逐通道取最大值得到的目标视角掩码；β 控制前几帧的相对贡献（与 Eq. (1) 的 β 同名；论文没有给出这里的取值，也没说明是否就是 0.6）；η=15 是上限。"}, {"tex": "\\omega_{\\text{acc}}^{t}=\\omega_{\\text{tmp}}^{t-1}+\\sum_{k}\\omega_{k}^{t-1}", "explain_zh": "Eq. (14)。累积权重等于上一帧历史项的权重加上一帧 K 个真实视角的权重之和。ω_k 本来依赖 3D 采样点，这里如何汇总成逐像素的量（例如取零交叉处的值），论文未说明。"}, {"tex": "\\omega_{\\text{tmp}}^{*}=\\frac{c\\,S}{1-c},\\qquad c=\\beta\\,(1-\\mathcal{M}),\\;\\; S=\\sum_k\\omega_k\\quad(\\text{当 } c<1 \\text{ 且结果}<\\eta)", "explain_zh": "我们推导的稳态（不是论文公式）：静止区域中各项不变时，递推 ω=c(ω+S) 收敛到 cS/(1−c)。静止区 𝓜≥0.6，所以 1−𝓜≤0.4。如果 β 也取 0.6，那么 c≤0.24，S=4 时 ω*≈1.26，远小于 η=15；要让上限 15 真正起作用，需要 c≥15/19≈0.79，即 β≳2。因此，如果论文希望上限 η=15 在静止区域真正生效，第二个 β 就应当大于 1；这只是我们的推断，论文没有给出数值。"}], "numbers_zh": "η=15；第二个 β 未公布。静止区若 𝓜=0.6，1−𝓜=0.4；运动区 𝓜=1，ω_tmp=0，历史被完全清空。论文没有说明未被任何视角覆盖的像素上 𝓜 取什么值（若取 0，则历史权重最大，相当于让历史去填洞）。", "why_design_zh": "这让“时间一致”从输入端延伸到了输出几何本身，并且直接针对 K 集合切换造成的跳变。作者没有选择增大 K，因为那样会增加计算成本（Sec. 3.2；Fig. 8 显示耗时随 K 近似线性增长）。没有采用的方案：循环网络或记忆状态、时间损失、光流对齐的视频后处理去闪烁。", "pitfalls_zh": "1）𝒟^{t−1} 存放在目标图像空间。如果观看者在两帧之间移动了头部，需要先把它重投影（i-warping）到新视点，论文没有描述这一步。时间一致性评测（Table 1、Fig. 6）用的是固定测试相机，所以这个问题不会暴露。2）反馈回路可能把错误锁住，例如高光区域的错误深度被一直沿用；η 和掩码是仅有的“遗忘”机制。3）Eq. (13) 里的 β 取值未公布，不能默认等于 Eq. (1) 的 0.6。", "concept_ids": ["v-temporal", "f-prob", "d-tsdf", "i-warping"], "check_q_zh": "观看者把头向右平移了 5 cm，而场景完全静止。直接按论文公式使用 𝒟^{t−1} 会出现什么问题？应该怎么改？", "check_a_zh": "𝒟^{t−1} 的每个像素对应的是旧视点的射线。新视点同一个像素的射线已经不同，直接拿来比较 z−𝒟^{t−1}，相当于把错位的深度当成历史，产生错误的 TSDF 值，边缘处可能出现拖影。正确的做法是先把 𝒟^{t−1} 反投影成 3D 点，用新目标位姿前向 warp（或 splat）得到新视点下的历史深度和有效掩码，再参与融合；更稳妥的做法是把历史保存在视点无关的表示里。", "adv_ids": ["a-temporal-video"]}, {"id": "h10", "title_zh": "几何引导混合网络的输入特征（9K+1 个通道）", "paper_ref": "Sec. 3.3 第 2 段；A.4 第 1–8 项", "what_zh": "输入：h3 的 K 组 (𝓘_k, α_k, 深度)、h8 的 𝒟^t，以及相机的几何关系。输出：一个 (9K+1)×H×W 的张量，K=4 时为 37 个通道，送入 4 层 U-Net Θ(·)。", "plain_zh": "输入可以分成三类。第一类是“候选颜色”：3K 通道的 warp 后 RGB。第二类是“这些候选靠不靠谱”：K 张深度（与 TSDF 深度 𝒟^t 对比，就能看出哪个视角在这个像素看到的是前景，哪个看到的是被遮挡的背景）、K 张 alpha（是不是空洞，是不是边缘）。第三类是“这个视角有多合适”，共 4K 通道的相机特征。这些与 Unstructured Lumigraph Rendering（i-blending）手工权重所用的几何量属于同一类（论文本身没有引用 ULR）：输入射线与目标射线的夹角越小，视角相关效应（r-appearance）的差异越小；输入射线与表面法线的夹角越大，说明是掠射观测，该视角的像素被拉伸得越厉害，越不可信；相机之间的距离和朝向夹角则是全局的相似度。\n\n可以把网络（l-cnn）要学的东西理解为一个“由几何条件决定的 ULR 式权重函数”。区别在于 ULR 用手写公式，这里用 U-Net 从数据中学，并且可以看到邻域上下文，比如边缘和空洞的形状。法线从 TSDF 深度图计算，这也是 TSDF 深度作为“几何引导”的第二个用途。", "analogy_zh": "像给评委发的资料袋：每位评委（输入视角）交上自己的照片（RGB）、自己测到的距离（深度）、照片有没有缺角（alpha），再附上自己的座位信息（离主会场多远、朝向差多少、看表面的角度有多斜）。主持人（U-Net）拿着“标准答案的几何”（TSDF 深度）来决定每个人的意见算多少分。", "equations": [{"tex": "C_{\\text{in}}=\\underbrace{3K}_{\\mathcal{I}_k}+\\underbrace{K}_{\\text{depth}_k}+\\underbrace{K}_{\\alpha_k}+\\underbrace{1}_{\\mathcal{D}^t}+\\underbrace{4K}_{\\text{camera feats}}=9K+1", "explain_zh": "通道数核对：K=4 时为 12+4+4+1+16=37，与 A.4 的“(9K+1)×H×W”一致。A.4 和 Sec. 3.3 的输入列表写的是 D_k^t（输入视角深度），而 Sec. 3.3 前文说提供给网络的是“forward-rendered depth maps {𝒟_k^t}”（warp 到目标视角的深度）。与目标像素逐像素对齐的只能是后者，论文记号前后不一致。"}, {"tex": "\\mathbf{n}(u,v)=\\frac{\\left(\\mathbf{X}_{u+1,v}-\\mathbf{X}_{u,v}\\right)\\times\\left(\\mathbf{X}_{u,v+1}-\\mathbf{X}_{u,v}\\right)}{\\left\\lVert\\left(\\mathbf{X}_{u+1,v}-\\mathbf{X}_{u,v}\\right)\\times\\left(\\mathbf{X}_{u,v+1}-\\mathbf{X}_{u,v}\\right)\\right\\rVert}", "explain_zh": "从 TSDF 深度图估计法线的常见做法：X_{u,v} 是用 𝒟^t 反投影得到的 3D 点，两个相邻差分向量做叉积后归一化。论文只写了“normals from the TSDF depth”，具体差分方式未说明。"}, {"tex": "f^{(5)}_k=\\mathbf{r}_k\\cdot\\mathbf{n},\\quad f^{(6)}_k=\\mathbf{r}_k\\cdot\\mathbf{r}_{\\text{tgt}},\\quad f^{(7)}_k=\\lVert\\mathbf{c}_k-\\mathbf{c}_{\\text{tgt}}\\rVert,\\quad f^{(8)}_k=\\mathbf{z}_k\\cdot\\mathbf{z}_{\\text{tgt}}", "explain_zh": "A.4 第 5–8 项相机特征。r_k 是从输入相机 k 指向该像素 3D 点的单位射线，n 是 TSDF 法线，r_tgt 是目标射线（A.4 原文为“target view direction”，也可能指目标相机的光轴方向，论文未细分）；c_k、c_tgt 是相机光心；z_k、z_tgt 是两台相机的光轴方向。f^{(5)} 和 f^{(6)} 逐像素变化；f^{(7)} 和 f^{(8)} 每个视角只有一个标量，在空间上复制成 H×W（A.4：“repeated spatially”）。"}], "numbers_zh": "K=4 时为 37 个通道。1352×1014 分辨率下，一帧输入张量为 37×1,370,928 个 float32，约 203 MB。训练裁剪块为 640×352，能被 2⁴=16 整除；如果“四层”对应 4 次 2× 下采样，这正好适配（论文没有说明层数的具体含义）。推理分辨率 1352×1014 的两条边都不能被 16 整除（1352/16=84.5，1014/16≈63.4），ENeRF-Outdoor 的 960×540 中 540 也不能，需要 padding 或裁剪，论文没有提到。", "why_design_zh": "把这些几何线索显式地交给网络，网络不必自己从图像里推断相机关系，所以一个小网络就可能够用，这也可能是它能在 23 ms 内完成的原因之一。TSDF 深度作为输入，让网络有了“标准答案的几何”作为参照（Fig. 4c 与 4d 的对比）。没有采用的方案：纯距离加权（消融中的 Distance-based Blending）、不带几何引导的朴素混合网络（Fig. 4c，无法去除重影）、IBRNet 式的逐射线 Transformer（论文没有做这种架构对比，也没有报告 IBRNet 的耗时）。", "pitfalls_zh": "1）这是一个 2D 图像空间的网络，不在 3D 中推理。它看到的全部 3D 信息都被编码在这些通道里。2）论文没有给出 U-Net 的通道宽度、激活函数、归一化方式，以及输出权重是否经过 softmax 或 sigmoid，复现时需要自己决定。3）去掉 𝒟^t 输入（“No TSDF Guidance”，Sec. 4.5：“retrain our network without the guidance depth 𝒟^t as input”）时，法线特征 f^{(5)} 是否也一并去掉，论文没有交代。", "concept_ids": ["l-cnn", "i-blending", "r-appearance", "g-pinhole", "l-encoding"], "check_q_zh": "为什么“输入视角深度与 TSDF 深度的差”这条信息能帮助网络去除重影？网络能从哪些通道得到它？", "check_a_zh": "重影来自某个视角在该像素看到的是错误的表面，例如前景物体边缘的飞点，或者本应被遮挡的背景。这时该视角 warp 过来的深度会明显偏离一致的 TSDF 深度。网络同时拿到 K 张 warp 深度和 𝒟^t，就能逐像素比较，把偏离大的视角权重压低。L_Depth 损失（h12）进一步把这种行为变成显式的训练目标。", "adv_ids": []}, {"id": "h11", "title_zh": "混合输出：K 个逐像素权重、一个背景权重和一张背景图", "paper_ref": "Sec. 3.3，Eq. (4)–(5)；Fig. 11（A.8）", "what_zh": "输入：U-Net 的输出，即 K 个权重图 w_k、1 个背景权重 w_BG 和 3 通道背景图 𝓘_BG，按输出内容推算共 K+4 个通道，K=4 时为 8 个（论文没有直接给出输出通道数）；另有 h3 的 𝓘_k 和 α_k。输出：最终图像 𝓘^t（3×H×W）。", "plain_zh": "前景部分是一个加权平均（r-alpha、i-blending）：每个视角在该像素的颜色，乘以它的覆盖率 α_k 和网络给的权重 w_k，再除以所有权重之和做归一化。乘 α_k 的作用是：空洞处 α_k≈0，这个视角自动退出，网络不必学习“空洞里别给权重”。\n\n但如果某个像素所有视角都看不到（去遮挡区域，所有 α_k 都约为 0），加权平均就没有意义了。这时由网络直接生成的背景图 𝓘_BG 顶上，由 w_BG 控制替换多少。所以这个网络不仅是“挑选器”，还带有一个小小的生成器（Fig. 11 展示了它填补空洞的效果）。\n\n论文 Eq. (4) 的分母漏写了求和号，照字面写成 Σ_k (𝓘_k α_k w_k)/(α_k w_k)，会退化为 Σ_k 𝓘_k，这显然不是本意。Eq. (6) 也有同样的问题。", "analogy_zh": "调色时，每个颜料罐（视角）按“罐里还剩多少”（α_k）乘以“配方比例”（w_k）倒入，最后按总量归一化；如果所有罐子都空了（空洞），就用一块预先调好的底色（𝓘_BG）补上。", "equations": [{"tex": "\\mathcal{I}_{\\text{FG}}^t=\\frac{\\sum_{k=1}^{K}\\mathcal{I}_k^t\\,\\alpha_k^t\\,w_k^t}{\\sum_{k=1}^{K}\\alpha_k^t\\,w_k^t}", "explain_zh": "修正后的 Eq. (4)。所有乘除都逐像素进行。原文分母写成 α_k^t·w_k^t，缺少 Σ_k，属于笔误。实现时分母应加一个 ε，防止 0/0。w_k 是否先经过 softmax 等归一化，论文没有说明；由于有显式分母，w_k 的整体缩放不影响结果。"}, {"tex": "\\mathcal{I}^t=\\left(1-w_{\\text{BG}}^t\\right)\\cdot\\mathcal{I}_{\\text{FG}}^t+w_{\\text{BG}}^t\\cdot\\mathcal{I}_{\\text{BG}}^t", "explain_zh": "Eq. (5)。w_BG∈ℝ^{H×W}，按用途应在 [0,1] 内（推测使用 sigmoid，论文未说明）；𝓘_BG 是网络直接输出的 RGB，属于生成出来的内容，不是真实像素。"}], "numbers_zh": "单像素算例（K=2）：𝓘_1=0.8，α_1=1，w_1=0.9；𝓘_2=0.4，α_2=0.5，w_2=0.6。分子=0.72+0.12=0.84，分母=0.9+0.3=1.2，𝓘_FG=0.70。若 w_BG=0.1、𝓘_BG=0.3，则 𝓘=0.9×0.70+0.1×0.3=0.66。输出通道数按推算为 K+4，K=4 时是 8。", "why_design_zh": "预测权重而不是直接预测像素，输出基本由真实像素组合而成，锐度高；只要权重在时间上稳定，颜色也就稳定，这就是“几何引导”能传递到颜色上的途径。背景图用来补遮挡洞，替代 A.3 中被放弃的“放大高斯来补洞”。没有采用的方案（论文未逐一讨论，以下为我们的归纳）：直接回归 RGB（容易模糊和闪烁）、扩散或生成先验补洞（对在线系统太慢）、不设背景分支（空洞无法处理）。", "pitfalls_zh": "1）“输出全是真实像素”并不准确，𝓘_BG 是网络生成的，而且没有任何时间约束，大面积空洞处可能闪烁。2）Eq. (4) 和 Eq. (6) 的分母都漏了求和号。3）h3 光栅器输出的 𝓘_k 如果已经是预乘 alpha 的颜色（Σ c_i α_i T_i），再乘一次 α_k 就相当于把覆盖率计入了两次。论文没有交代颜色是否先除以 α 做了反预乘，复现时要留意。", "concept_ids": ["i-blending", "r-alpha", "l-cnn", "i-warping"], "check_q_zh": "如果一个像素 4 个视角的 α_k 都是 0，Eq. (4) 和 (5) 会怎样？网络应该学到什么？", "check_a_zh": "Eq. (4) 的分母为 0，𝓘_FG 没有定义（实现中靠 ε 得到一个接近 0 的值）。要输出合理的像素，网络必须让 w_BG≈1，完全使用背景图 𝓘_BG。L_Mask 损失（h12）正是在空洞区把 w_BG 往 1 推，把这个行为显式地监督出来。", "adv_ids": []}, {"id": "h12", "title_zh": "损失：0.8·L1 + 0.2·SSIM + 0.1·L_depth + 0.1·L_mask", "paper_ref": "Sec. 3.3，Eq. (6)–(7)", "what_zh": "输入：输出图 𝓘^t、真值图、TSDF 深度 𝒟^t、warp 深度 𝒟_k^t、权重、空洞掩码。输出：标量训练损失。", "plain_zh": "L1 和 SSIM（l-loss、v-metrics）是图像重建损失的常见组合：L1 约束逐像素的颜色，SSIM 约束局部结构和对比度。\n\nL_Depth 是本文的关键一项。把同一组权重 w_k 用来混合 warp 深度 𝒟_k，要求结果等于 TSDF 深度 𝒟^t。换句话说，网络在给颜色分配权重时，必须同时让深度对上一致的几何。这样一来，给错误表面（比如遮挡背景）分配高权重就会被惩罚。论文称它是一种“soft regularization”，用已知的 TSDF 深度作为目标来引导对未知新视角图像的预测。注意 𝒟^t 本身是伪标签，不是真值。\n\nL_Mask 让背景权重 w_BG 在空洞处接近 1、其他地方接近 0（论文：w_BG 与“𝓘^t 中空区域的二值掩码”之间的平均绝对差）。\n\n整个损失里没有任何时间项。按 A.5 的描述，训练样本是 ScanNet 静态场景的不同帧，或 DyNeRF、Spaces 的同一时刻多视角，网络没有在“连续两帧输出”上受到任何约束（见 h13），时间稳定性来自输入端的几何模块。", "analogy_zh": "老师改作业时，除了看答案（颜色）对不对，还要求写出解题过程（深度），并且过程要和标准步骤（TSDF 深度）一致。这样学生就不能靠蒙对答案过关。", "equations": [{"tex": "\\mathrm{L}=0.8\\cdot\\mathrm{L}_1+0.2\\cdot\\mathrm{L}_{\\text{SSIM}}+0.1\\cdot\\mathrm{L}_{\\text{Depth}}+0.1\\cdot\\mathrm{L}_{\\text{Mask}}", "explain_zh": "Eq. (7)。L_1 是 𝓘^t 与真值图的平均绝对误差；L_SSIM 通常取 1−SSIM（论文只写了“SSIM loss”）；各项系数如上。"}, {"tex": "\\mathrm{L}_{\\text{Depth}}=\\frac{1}{HWK}\\left\\lVert\\mathcal{D}^t-\\frac{\\sum_{k}\\mathcal{D}_k^t\\,\\alpha_k^t\\,w_k^t}{\\sum_{k}\\alpha_k^t\\,w_k^t}\\right\\rVert_1", "explain_zh": "修正后的 Eq. (6)。与 Eq. (4) 一样，原文分母漏写 Σ_k。另外，求和之后残差只剩 H×W 个元素，归一化因子里却有 K，这是另一处小的不一致。深度的单位与 τ 一致（米）。"}, {"tex": "\\mathrm{SSIM}(x,y)=\\frac{(2\\mu_x\\mu_y+C_1)(2\\sigma_{xy}+C_2)}{(\\mu_x^2+\\mu_y^2+C_1)(\\sigma_x^2+\\sigma_y^2+C_2)}", "explain_zh": "SSIM 的定义。μ 是局部均值，σ² 是局部方差，σ_xy 是局部协方差，C_1、C_2 是防止除零的常数。它同时衡量亮度、对比度和结构的相似性。"}, {"tex": "\\mathrm{L}_{\\text{Mask}}=\\frac{1}{HW}\\sum_{\\mathbf{x}}\\left|w_{\\text{BG}}^t(\\mathbf{x})-B(\\mathbf{x})\\right|", "explain_zh": "B 是空洞的二值掩码。论文原文说的是“𝓘^t 中空区域的二值掩码”，更可能指所有 α_k 都约为 0 的像素，具体的判定阈值没有给出。"}], "numbers_zh": "系数 0.8 / 0.2 / 0.1 / 0.1 为论文给定值。以下量级是我们的粗略估计，论文没有报告各项损失的大小：若深度以米为单位、残差在 0.01 量级，颜色 L1 在 [0,1] 范围内约为 0.02，乘上系数后深度项在总损失中的量级并不小。", "why_design_zh": "L_Depth 是把“几何一致”传递到“颜色权重一致”的训练手段。没有采用的方案：时间损失、光流 warping 一致性损失、感知损失（LPIPS）或对抗损失。论文没有解释为什么不用它们；一个合理的推测是前两者需要视频训练数据，而对抗损失可能引入幻觉细节。", "pitfalls_zh": "1）L_Depth 的目标是 TSDF 深度，属于伪标签。在高光等深度出错的区域，它会把网络推向错误的权重（对应 Fig. 9 的失败情形）。2）没有时间损失，所以网络自身带来的闪烁（尤其是 𝓘_BG）得不到约束。3）Eq. (6) 有两处书写问题：分母缺 Σ，归一化因子多了 K。", "concept_ids": ["l-loss", "v-metrics", "d-tsdf", "i-blending"], "check_q_zh": "如果把 L_Depth 的系数设为 0，同时保留 𝒟^t 作为网络输入，网络还会受到几何引导吗？", "check_a_zh": "会，但只是“可以用”，不是“必须用”。网络能看到 𝒟^t，可以学着利用它，但只有颜色损失时，它可能会走捷径，只依赖颜色线索做出一个平均意义上更低的 L1。L_Depth 显式要求权重能复现一致的深度，这才把几何一致性强加到权重上。论文的消融只有“完全去掉 𝒟^t 输入”这一种，没有单独去掉 L_Depth，所以两者各自的贡献无法区分。", "adv_ids": []}, {"id": "h13", "title_zh": "训练数据、推理加速（TensorRT）与运行时间拆解", "paper_ref": "Sec. 4 实现段；A.5；Sec. 4.5 末段与 Table 4；Fig. 8", "what_zh": "输入：ScanNet、Google Spaces 和 3 个 DyNeRF 训练场景的多视角样本。输出：训练好的混合网络，以及它在 DyNeRF 1352×1014、K=4 条件下的分阶段耗时。", "plain_zh": "训练集是三类数据的组合。ScanNet 是手持 RGB-D 扫描的静态室内场景，深度来自传感器；先选一个目标帧，再从它前后 ±30 帧范围内选输入帧，但排除 [−4,4] 帧，避免选到离目标最近的帧。DyNeRF 的 3 个场景用来覆盖大基线立体情形；Google Spaces（即 DeepView 数据集，其第一作者 Flynn 也是 Quark 的第一作者）用来覆盖小基线情形。后两者都在固定时刻随机选择目标和输入视角，深度由 RAFT-Stereo 在人工挑选的立体对上生成（l-loss）。\n\n推理时，前向 splat 使用原版 3DGS 代码，TSDF 使用自定义 CUDA，混合网络用 Torch-TensorRT 编译加速（65 → 23 ms，约 2.8 倍）。把 Table 4 的三项加起来约 39 ms，约 25 fps；但这个数字不包括立体深度估计和磁盘读取（论文明确说所有耗时都不含磁盘读取），差分掩码也没有单独列出（v-codec、a-telepresence-sys）。", "analogy_zh": "就像餐厅宣传“出餐只要 39 秒”，计时却从食材已经切好、备好放在台上开始；切菜（立体深度估计）那一步不在计时里。", "equations": [{"tex": "T_{\\text{TRT}}=10+6+23=39\\ \\text{ms}\\;(\\approx 25.6\\ \\text{fps}),\\qquad T_{\\text{noTRT}}=10+6+65=81\\ \\text{ms}", "explain_zh": "按 Table 4 相加。正文写的是“即使不用 TensorRT，总时间也约 100 ms”，比表中三项之和 81 ms 多出约 20 ms，论文没有解释差额（可能包含了表中未列出的步骤）。正文把 GPS-Gaussian 的 143.4 ms 标注为“(Figure 5)”，而 Figure 5 是 EPI 视角一致性对比图，这个引用看起来有误。"}, {"tex": "N_{\\text{samples}}=150\\text{K}\\times 12=1.8\\times10^{6}\\ \\text{crops of }640\\times352", "explain_zh": "训练总共看过的裁剪块数量：迭代次数 × batch 大小。"}], "numbers_zh": "优化器写作 Adam，但引用的 [43] 是 Loshchilov & Hutter 的 AdamW 论文（Decoupled weight decay regularization），结合 weight decay 1e-5 来看，实际可能用的是 AdamW；学习率 2e-4，150K 次迭代，batch 12，裁剪块 640×352，在一块 NVIDIA Tesla V100 上训练。每次迭代随机选 1 个目标视角和 K=4 个输入视角。Table 4（DyNeRF，K=4）：splat 10 ms，TSDF 6 ms，混合 23 ms（TensorRT）或 65 ms。测试用的 GPU 型号未说明。Fig. 8：耗时随 K 近似线性增长，画质在 K≥4 后饱和（正文没有给出具体数值）。对照：VR 头显按 90 Hz 双眼计算，每只眼约 5.6 ms。", "why_design_zh": "混合各种基线和场景类型的数据，是为了泛化，测试时不做任何微调（Sec. 4.2）；网络只用单时刻样本训练，时间一致性交给了几何模块。没有采用的方案：视频序列训练、加入时间损失的训练（论文没有讨论这些选择）。", "pitfalls_zh": "1）DyNeRF 的 3 个训练场景与测试场景（Sear Steak、Flame Steak）来自同一个数据集、同一套采集装置，存在一定的域内优势；IBRNet 和 ENeRF 用的是原作者的预训练权重，没有在这些数据上训练（FWD 和 GPSG 则因预训练模型无法泛化，用与本文相同的数据和策略重训，Sec. 4.1）。2）“实时”要打折扣：不含深度估计，单视角单眼 25 fps，双眼或多名观看者时成本成倍增加。3）正文的 ≈100 ms 与表格三项之和 81 ms 对不上，差额未解释。", "concept_ids": ["l-loss", "l-cnn", "v-codec"], "check_q_zh": "要把这个系统用在 90 Hz 的 VR 头显上（双眼），按 Table 4 的数字，还差多少？还有哪些开销没有算进去？", "check_a_zh": "双眼各需一次 splat、TSDF 和混合，约 2×39=78 ms，而 90 Hz 的预算约为 11.1 ms，差了约 7 倍。这还没有算 22 路立体深度估计、差分掩码、网络传输、编解码、显示以及 motion-to-photon 延迟。实际部署需要大幅降低分辨率或 K、双眼共享计算（例如共用 TSDF），或者借助重投影和异步时间扭曲。", "adv_ids": ["a-telepresence-sys"]}, {"id": "h14", "title_zh": "如何读实验：PSNR/LPIPS 与 TCC/STED/SDT/SDV、EPI、消融", "paper_ref": "Sec. 4.3（Eq. 8）；Table 1、2、3；Fig. 5、6、7、9；A.7", "what_zh": "输入：渲染出的视频（测试相机的前 100 帧）和真值视频。输出：单帧保真度指标、时间一致性指标、视角一致性指标，以及定性可视化（EPI、x–t 切片）。", "plain_zh": "单帧保真度（v-metrics）用 PSNR、SSIM、LPIPS 和 L1，逐帧和真值比较后取平均。它们对闪烁不敏感：两帧各自误差不大，但误差方向来回跳，PSNR 照样可以很高。\n\n时间一致性（v-temporal）用三个指标。TCC 比较“渲染视频的帧差图”与“真值视频的帧差图”之间的 SSIM：闪烁会在渲染帧差里制造真值中没有的变化，TCC 就会下降。STED（引用 Soundararajan & Bovik 的时空熵差，一种降参考视频质量指标）衡量时空统计特性与真值的差距，越低越好。SDT 是 L1 误差随时间的标准差。视角一致性用 SDV，即 L1 误差在不同测试视角之间的标准差。\n\n定性部分：EPI（i-lightfield）是让相机沿水平路径平移，逐个位置渲染新视角，再把各视角图像的同一行像素按相机位置 v 的顺序堆叠起来；每个 3D 点在 EPI 中是一条直线，斜率与 1/Z 成正比，线条断裂或跳变就说明视角不一致（Fig. 5）。x–t 切片是固定相机，把同一行像素按时间堆叠，闪烁会表现为噪点状的纹理（Fig. 6）。", "analogy_zh": "PSNR 像是逐张批改照片，给每张打分；TCC、STED 像是把照片连成动画，看它抖不抖；EPI 像是把相机平移时的画面切成一片，看物体轨迹是一条顺滑的直线，还是一段段断开的锯齿。", "equations": [{"tex": "\\mathrm{PSNR}=10\\log_{10}\\frac{\\mathrm{MAX}^2}{\\mathrm{MSE}}", "explain_zh": "MAX 是像素的最大值（1 或 255），MSE 是均方误差。每提高 1 dB，MSE 降为 10^{-0.1}≈0.79 倍。"}, {"tex": "\\mathrm{TCC}=\\frac{1}{T-1}\\sum_{t=1}^{T-1}\\mathrm{SSIM}\\!\\left(\\left|\\mathcal{I}^{t}-\\mathcal{I}^{t+1}\\right|,\\;\\left|I^{t}-I^{t+1}\\right|\\right)", "explain_zh": "Eq. (8)。𝓘 是渲染帧，I 是真值帧，T 是帧数（这里为 100）。它在 SSIM 意义上比较两个视频的帧差图，越高越好；原始版本来自 Zhang et al. 2019 的视频深度工作，本文把它改成了彩色图版本。"}, {"tex": "\\mathrm{SDT}=\\mathrm{std}_{t}\\big(\\mathrm{L1}_t\\big),\\qquad \\mathrm{SDV}=\\mathrm{std}_{v}\\big(\\mathrm{L1}_v\\big)", "explain_zh": "沿用 Long et al. 2021：L1_t 是第 t 帧的平均 L1 误差，L1_v 是第 v 个测试视角的平均 L1 误差，std 是标准差（论文原文只说“L1 误差在所有帧 / 所有视角上的标准差”，具体聚合方式是我们的理解）。它们衡量误差是否稳定，而不是误差有多小。"}, {"tex": "x(v)=x_0-\\frac{f\\,v}{Z}\\;\\Rightarrow\\;\\frac{\\partial x}{\\partial v}=-\\frac{f}{Z}", "explain_zh": "EPI 的几何原理：相机沿水平方向平移 v 时，深度为 Z 的点在图像上的横坐标 x 线性移动，斜率为 −f/Z，所以在 x–v 图上每个点是一条直线，越近的点斜率绝对值越大。"}], "numbers_zh": "DyNeRF：PSNR 31.17 对 ENeRF 29.51，+1.66 dB，MSE 约降到 0.68 倍；STED 68.76 对 76.14；TCC 0.872 对 0.867。D3DMV：32.58 对 27.79，+4.79 dB，MSE 约降到 0.33 倍；STED 15.85 对 137.0。ENeRF-Outdoor：24.01 对 25.79，−1.78 dB，MSE 约增加到 1.5 倍；STED 44.49 对 32.31，本文更差。消融（数值对应 DyNeRF）：去掉 TSDF 引导后 PSNR 31.16（−0.01 dB），STED 95.42（完整模型 68.76，下降约 28%）。", "why_design_zh": "要证明“一致性”，必须引入保真度以外的指标，因此同时报告时间指标、视角指标和定性切片。作者没有使用基于光流的 warping error（视频一致性工作中常见的指标），也没有做用户研究或头显实测。", "pitfalls_zh": "1）SDT 和 SDV 只衡量误差的离散程度：一个在所有帧、所有视角上都同样模糊的方法，SDT 和 SDV 也会很低。2）TCC 的提升很小（0.872 对 0.867），STED 的提升更明显。3）正文说在 ENeRF-Outdoor 上“shows a marked improvement over the baselines”（指演员边缘和背景去遮挡区域的定性效果），但定量上并不占优：Table 2 四项保真度指标中只有 LPIPS 最好；Table 1 中 TCC 和 SDV 最好，STED 和 SDT 则不如 ENeRF。4）Table 3 的数值与 DyNeRF 上的完整模型一致，说明消融应当是在 DyNeRF 上做的；论文没有报告误差条或多次运行，0.01 dB 的差异不能解读为有意义。5）ENeRF-Outdoor 的指标是在 480×270 这种很低的分辨率下计算的（为减轻该数据集同步和颜色标定问题的影响）。", "concept_ids": ["v-metrics", "v-temporal", "i-lightfield"], "check_q_zh": "为什么说这篇论文的 TSDF 引导主要是一致性工具，而不是画质工具？用 Table 3 的数字说明。", "check_a_zh": "去掉 TSDF 引导后，PSNR 从 31.17 变为 31.16，LPIPS 从 0.191 变为 0.197，TCC 从 0.872 变为 0.869，单帧保真度几乎不变；STED 却从 68.76 恶化到 95.42（差约 39%）。所以 TSDF 引导的作用主要是减少时间上的不一致（论文 Sec. 4.5 也说“most significant gains in temporal consistency”）。画质提升的大头来自“有一个可学习的混合网络”本身：Distance-based Blending 只有 26.08 dB，No Blending 只有 24.64 dB。", "adv_ids": ["a-temporal-video"]}], "tensor_trace": [{"stage_zh": "输入帧（t 时刻，全阵列）", "tensor": "{I_n^t}", "shape": "N×3×1014×1352（DyNeRF 测试场景 N=22，float，推测取值 [0,1]）", "note_zh": "由 2704×2028 下采样 2 倍得到。在固定阵列中，同一相机相邻帧的同一像素对应同一条射线。"}, {"stage_zh": "逐视角深度", "tensor": "{D_n^t}", "shape": "N×1×1014×1352（米）", "note_zh": "RAFT-Stereo 输出校正坐标系下的视差，换算成原相机坐标系下的公制深度（论文未写换算步骤），耗时不计入。"}, {"stage_zh": "差分掩码（1/4 分辨率）", "tensor": "M_n^{t,↓4}", "shape": "N×1×≈254×338", "note_zh": "Eq. (1)，再做 3×3 max-pool（相当于膨胀）。"}, {"stage_zh": "差分掩码（上采样后）", "tensor": "M_n^t", "shape": "N×1×1014×1352，取值范围 [0.6, 1]", "note_zh": "双线性上采样回原分辨率。"}, {"stage_zh": "时间滤波深度（跨帧状态）", "tensor": "Ḋ_n^t", "shape": "N×1×1014×1352", "note_zh": "Eq. (2) 的 EMA，需要保存到下一帧。实际只需对可能被选中的视角计算，论文按全部 N 个视角来写。"}, {"stage_zh": "选取 K 个最近视角", "tensor": "𝒮^t", "shape": "K=4 个索引", "note_zh": "按与目标相机的距离选取，并排除测试相机本身（A.7）。"}, {"stage_zh": "像素级高斯", "tensor": "{μ, σ, c, o=1}_k", "shape": "每视角 1,370,928 个；K=4 时共约 5.48M 个（μ:3，σ:1，c:3）", "note_zh": "解析参数，不需要网络，各视角分别放入光栅器。"}, {"stage_zh": "逐视角前向渲染", "tensor": "𝓘_k^t, α_k^t, 𝒟_k^t", "shape": "K×3×H×W、K×1×H×W、K×1×H×W（H×W=1014×1352）", "note_zh": "Table 4：10 ms（forward-splatting）。α_k 是软覆盖率，空洞处接近 0。"}, {"stage_zh": "掩码 splat 到目标视角", "tensor": "𝓜^t", "shape": "1×1014×1352（K 个通道取最大值）", "note_zh": "A.2：用 Gaussian splatting 把 K 张 M_k^t 前向投影到目标视角，再逐通道取最大值，用来决定历史深度的权重。"}, {"stage_zh": "image-based TSDF 与 raymarch", "tensor": "s(p) → 𝒟^t", "shape": "1,370,928 条射线 × 若干步；每步 K 次深度查询（加上 7×7 邻域读取，除非预先计算）→ 1×1014×1352", "note_zh": "Eq. (9)–(14)，另加上一帧 𝒟^{t−1} 作为额外输入。Table 4：6 ms。𝒟^t 和 ω_acc 作为跨帧状态保存。"}, {"stage_zh": "TSDF 法线与相机特征", "tensor": "n, f^{(5..8)}", "shape": "3×H×W；4K×H×W=16×1014×1352", "note_zh": "f^{(7)} 和 f^{(8)} 是每视角一个标量，在空间上广播成整张图。"}, {"stage_zh": "网络输入", "tensor": "X_in", "shape": "(9K+1)×H×W=37×1014×1352（约 203 MB，float32）；训练时为 12×37×352×640", "note_zh": "若 U-Net 做 4 次 2× 下采样，推理时需要 pad 到能被 16 整除的尺寸（例如 1024×1360），论文未提及。"}, {"stage_zh": "U-Net 输出", "tensor": "{w_k}, w_BG, 𝓘_BG", "shape": "(K+1+3)=8×H×W", "note_zh": "通道数按输出内容推算。Table 4：23 ms（TensorRT）或 65 ms。激活函数和归一化方式论文未给出。"}, {"stage_zh": "混合结果", "tensor": "𝓘_FG^t → 𝓘^t", "shape": "3×1014×1352", "note_zh": "Eq. (4)（分母补上 Σ）和 Eq. (5)。"}, {"stage_zh": "训练损失", "tensor": "L", "shape": "标量", "note_zh": "Eq. (7)：0.8·L1 + 0.2·SSIM + 0.1·L_Depth + 0.1·L_Mask。没有时间项。"}], "reading_experiments": [{"item": "Table 2（保真度：PSNR/SSIM/LPIPS/L1，三个数据集）", "how_to_read_zh": "按数据集分三列来看，每列先看领先的方法，再看领先幅度，dB 差可以换算成 MSE 比例。DyNeRF +1.66 dB（MSE 约为 0.68 倍），D3DMV +4.79 dB（约 0.33 倍），ENeRF-Outdoor −1.78 dB（本文输了，只有 LPIPS 0.155 对 0.167 占优）。再看各 baseline 的训练条件：IBRNet 和 ENeRF 使用原作者的预训练权重，FWD 和 GPSG 用本文的数据重训，而本文的训练集包含 3 个 DyNeRF 场景（与测试场景同一数据集、同一采集装置）。L1 的数值（例如 5.09）看起来是 0–255 量纲，论文没有写明。", "takeaway_zh": "在 DyNeRF（同数据集的其他场景参与了训练）和未参与训练的户外数据集 D3DMV 上优势明显；在存在同步和颜色标定问题的 ENeRF-Outdoor 上，四项保真度指标中只有 LPIPS 领先。正文针对该数据集所说的“marked improvement”指的是定性效果，定量结果并不支持。"}, {"item": "Table 1（一致性：TCC/STED/SDT/SDV）", "how_to_read_zh": "TCC 越高越好，其余越低越好。STED 的数值跨度很大（FWD 2796，本文 68.76），可以按数量级来读。重点看本文与 ENeRF 的对比：DyNeRF 上 STED 68.76 对 76.14、SDV 1.748 对 2.710；D3DMV 上 STED 15.85 对 137.0；ENeRF-Outdoor 上 STED 44.49 对 32.31，SDT 0.193 对 0.189，这两项本文更差。TCC 的差距普遍很小（0.872 对 0.867）。", "takeaway_zh": "一致性优势在 DyNeRF 和 D3DMV 上成立；在 ENeRF-Outdoor 上只有 TCC 和 SDV 领先。SDT 和 SDV 衡量的是误差的离散程度，不是误差大小，要结合 Table 2 一起看。"}, {"item": "Table 3（消融，数值与 DyNeRF 结果一致）", "how_to_read_zh": "五行可以分成两组。第一组是“有没有混合网络”：No Blending（单次渲染全部高斯）24.64 dB、STED 483.3；Distance-based（按距离定权重）26.08 dB、STED 235.3；完整模型 31.17 dB。第二组是“在有网络的前提下，几何和时间模块的作用”：No TSDF Guidance 31.16 dB、STED 95.42；No Temporal Filtering 31.16 dB、STED 89.62；完整模型 STED 68.76。第二组的 PSNR 差异只有 0.01 dB，论文没有报告误差条，可以视为噪声。", "takeaway_zh": "画质几乎全部来自可学习的混合网络；标题强调的 TSDF 引导和时间滤波主要改善 STED（分别约 −28% 和 −23%）。没有单独去掉 L_Depth、去掉 𝒟^{t−1} 回灌、去掉背景图的消融，也没有对超参数（λ_t、β、τ、η）做消融。"}, {"item": "Table 4 与 Fig. 8（耗时，以及 K 的消融）", "how_to_read_zh": "把三项相加（39 ms 或 81 ms），和正文的“≈100 ms”对照（差额论文未解释）；确认哪些环节不在表中（立体深度、差分掩码；论文明确说所有耗时不含磁盘读取）。测试 GPU 型号未说明，所以不能直接和 GPSG 的 143.4 ms 做严格比较（正文还把出处标为 Figure 5，看起来有误）。Fig. 8 只给出趋势：耗时随 K 近似线性增长，画质在 K≥4 后饱和，正文没有给出具体数值。", "takeaway_zh": "几何模块（splat + TSDF，16 ms）很便宜，瓶颈在混合网络和未计入的深度估计。对远程临场系统来说，应该按端到端 motion-to-photon 延迟来重新做预算。"}, {"item": "Fig. 4（四种混合方式的对比）", "how_to_read_zh": "(a) 单次渲染全部高斯：出现飞点和空洞；(b) 按距离加权：重影；(c) 不带几何引导的朴素网络：重影仍然存在；(d) 本文。重点看 (c) 与 (d) 的差别，这是“几何引导”在单帧上最直接的视觉证据。", "takeaway_zh": "几何引导在视觉上确实能去除单帧的重影。但 Table 3 中去掉 TSDF 后 PSNR 几乎不变，说明这种改善在全图平均指标里占比很小，集中在边缘等局部区域。"}, {"item": "Fig. 5（EPI）与 Fig. 6（x–t 时间切片）", "how_to_read_zh": "EPI：相机沿水平路径平移，每个 3D 点应该是一条斜率为 −f/Z 的直线，要找的是线条的断裂、跳变和锯齿。x–t 切片：相机固定，静止物体应该是竖直的直条，要找的是噪点和闪烁纹理，以及像 IBRNet 那样的整体模糊（模糊本身也会显得“稳定”）。", "takeaway_zh": "这两张图是视角和时间一致性最直观的证据，但它们是挑选过的切片。EPI 用的是连续平移的相机路径，而 SDV 只在离散的测试相机上计算，两者衡量的并不是同一件事。"}, {"item": "Fig. 7（三个数据集的定性对比）", "how_to_read_zh": "关注四类现象：整体模糊（IBRNet、ENeRF）、前景颜色渗到背景上（ENeRF、GPSG）、边缘扭曲（GPSG）、远处背景细节丢失（IBRNet、ENeRF）。再对照 Table 2 中 ENeRF-Outdoor 的数字：图上看起来更锐利，数值却更差，这可能与该数据集的同步和颜色标定误差、以及在 480×270 评测有关。", "takeaway_zh": "锐利不等于数值更高。在同步有误差的数据上，锐利但错位的结果反而会被 PSNR 惩罚。"}, {"item": "Fig. 9（失败情形：高光区域）", "how_to_read_zh": "看 TSDF 深度出错的区域在 EPI 中表现为断裂；论文指出单帧输出依然合理，但出现了时间和视角一致性伪影。", "takeaway_zh": "这个方法的一致性上限取决于几何的正确性（Sec. 4.6：“relies strongly on accurate geometry reconstruction”）：几何错了，一致性也随之失效；而且因为有 L_Depth，网络在训练中被推向跟随错误的几何。高光（论文明确提到）以及透明物体（我们的推断）是它的天然弱点。"}, {"item": "Fig. 10 与 Fig. 11（A.3 / A.8：像素级高斯与背景图）", "how_to_read_zh": "Fig. 10 对比三种做法：点溅射（空隙、锯齿）、网络预测高斯（为了补洞会改变尺度，PSNR 下降）、本文的像素级高斯。Fig. 11 展示背景图 𝓘_BG 对空洞的填补效果。两者都只有定性结果，没有数字。", "takeaway_zh": "“网络预测高斯参数会收敛到常数，补洞会损害 PSNR”这个说法只有这张图作为证据，缺少定量消融，读的时候应当视为作者的经验观察。"}, {"item": "Fig. 12（与 4DGS、4K4D、MVSplat 的定性对比）", "how_to_read_zh": "注意比较条件：4DGS 和 4K4D 是逐场景优化方法，使用 K=17 个视角；MVSplat 是稀疏视角的前馈方法。只有定性图，没有指标。", "takeaway_zh": "这张图只能说明在这个数据集上看起来更锐利，不能据此认为本文在画质上超过了逐场景优化的 4D 方法。"}], "tradeoffs": [{"choice_zh": "逐视角前向 warp 真实像素，由网络预测权重（IBR），而不是直接回归像素", "gain_zh": "锐度高，保留真实纹理；只要权重稳定，颜色也就稳定；网络小，速度快", "cost_zh": "依赖深度的准确性，深度错误会直接表现为重影和飞点；视角相关的高光只能靠重新加权 K 个观测来近似；遮挡洞需要额外的背景分支"}, {"choice_zh": "解析的像素级不透明高斯，不用网络预测高斯参数", "gain_zh": "不需要训练，省时间（10 ms），在稠密网格上大多数区域的效果与前馈模型相当，并且比点溅射少走样", "cost_zh": "表示不了半透明、头发和运动模糊；各向同性、按源图定尺度的高斯忽略表面倾斜；不能借助放大高斯来补洞"}, {"choice_zh": "image-based TSDF，而不是体素 TSDF", "gain_zh": "无体素网格、不需要体素显存，分辨率等于目标图像分辨率，6 ms", "cost_zh": "没有可复用的 3D 模型，每个观看者、每只眼都要重新计算；只融合 K 个视角，K 集合切换时会跳变；依赖公制尺度和手工设定的 τ"}, {"choice_zh": "时间一致性只在输入和几何端处理（EMA + 回灌），没有时间损失", "gain_zh": "训练只需要单时刻数据，不需要视频训练集，实现简单，在线运行", "cost_zh": "网络自身带来的闪烁（尤其是 𝓘_BG）无法约束；EMA 记忆只有约 1.7 帧，偏短；颜色掩码会把光照变化误判为运动；头动时历史深度如何重投影没有说明"}, {"choice_zh": "只用 K 个最近视角（K=4 或 2）", "gain_zh": "耗时随 K 线性增长，K 小就快；画质在 K≥4 时已饱和", "cost_zh": "“全局几何”其实是局部的；视点连续移动、K 集合切换时，几何和颜色都可能跳变，而且没有滞回机制"}, {"choice_zh": "立体深度作为外部输入，并且不计入耗时", "gain_zh": "方法和深度来源解耦，可以替换为传感器（论文提到可用 RGB-D 相机）或更好的立体网络", "cost_zh": "系统层面的实时性没有得到证明；人工挑选立体对无法自动化；深度噪声的鲁棒性没有定量评测"}, {"choice_zh": "训练数据混合 ScanNet、Spaces 和 DyNeRF，不做逐场景微调", "gain_zh": "可以泛化到新场景，适合在线部署", "cost_zh": "DyNeRF 的训练和测试场景来自同一数据集和采集装置，存在一定的域内优势；训练集中没有户外动态数据。ENeRF-Outdoor 上的落败，论文归因于该数据集的同步和颜色标定问题，而本文在同样是户外、同样未参与训练的 D3DMV 上表现很好，所以不能简单归结为训练数据缺少户外场景"}], "faq": [{"q_zh": "这篇论文和 NeRF、3DGS 有什么关系？它训练的是场景表示吗？", "a_zh": "它不训练任何场景表示。3DGS 在这里只被当作一个现成的光栅器，用来把每个像素 splat 到目标相机；高斯参数由深度解析计算，每帧重新生成。唯一需要训练的是混合 U-Net，而且只训练一次，就能用于所有测试场景（前馈、可泛化），测试时不做任何微调。"}, {"q_zh": "TSDF 不是 KinectFusion 那种 3D 网格吗？这里的 image-based TSDF 到底存了什么？", "a_zh": "它不存体素。它是一种按需计算：只沿目标相机的射线逐点计算 TSDF 值，每个点投影到 K 个输入视角，当场查询这些视角的深度图，算完就丢。跨帧保留的几何状态只有滤波后的输入深度 Ḋ、上一帧的目标深度 𝒟^{t−1} 和累积权重。"}, {"q_zh": "既然有了一致的 TSDF 深度，为什么不直接用它把颜色 warp 过来，还要一个网络？", "a_zh": "TSDF 深度只给出每个像素的一个表面位置，还需要决定从哪个视角取颜色：有的视角在该点被遮挡，有的视角是掠射观测，有的视角带有高光。另外，去遮挡区域所有视角都没有颜色。网络的任务就是在几何条件下做这些取舍并补洞。消融中的 Distance-based Blending（26.08 dB）说明手工权重远远不够。"}, {"q_zh": "训练时网络没有见过连续两帧的约束，为什么输出能做到时间稳定？", "a_zh": "时间稳定性来自输入端：输入深度经过 EMA 滤波，TSDF 回灌了上一帧深度，所以 𝒟^t 在静止区域跨帧稳定；网络是一个确定性的函数，输入稳定、几何稳定，权重也就基本稳定。但网络对微小输入变化的敏感度没有受到任何约束，𝓘_BG 这类生成内容仍可能闪烁，这是论文的弱点之一。"}, {"q_zh": "为什么差分掩码的下限 β 是 0.6 而不是 0？", "a_zh": "论文只说 β 和 λ_t 是决定颜色变化敏感度的经验超参数，没有解释取值。我们的理解是，这是一种保守设计：即使颜色完全没变，也要吸收至少 60% 的新深度。这样掩码漏检运动时（例如无纹理物体在移动），陈旧深度的权重每帧至少乘以 0.4 迅速衰减（两帧后不到 0.16），不会产生长时间的拖影。代价是静止区域的降噪有限，标准差只降低约 35%。"}, {"q_zh": "τ = 0.02 m 是怎么来的？换一个数据集要不要改？", "a_zh": "论文没有解释来源，也没有消融。它隐含了两个假设：位姿和深度是真实的米制尺度，并且深度误差在厘米量级。远距离户外场景的深度误差可能远大于 2 cm；场景尺度不是米制时（例如 COLMAP 的任意尺度），τ 的实际含义也会改变。换数据集时应当按深度误差和尺度重新设定，并做消融。"}, {"q_zh": "论文的公式里有哪些笔误或不一致，读的时候要注意？", "a_zh": "（1）Eq. (4) 和 Eq. (6) 的分母漏写 Σ_k。（2）Eq. (6) 的归一化因子里多了 K。（3）Eq. (9) 的符号 s_k=z_k−D_k，与“s_k<−τ 时权重为 0”以及“步长 0.8s”放在一起无法自洽，按“表面前方为正”理解更合理。（4）Eq. (1) 和 Eq. (13) 都用 β，但描述的作用不同，第二个 β 的取值也未给出。（5）网络输入的深度，Sec. 3.3 前文写 𝒟_k^t（前向渲染深度），输入列表和 A.4 写 D_k^t。（6）位姿来源一处说 COLMAP，另一处说使用数据集提供的参数。（7）不用 TensorRT 的运行时间正文写 ≈100 ms，表格三项相加是 81 ms（差额未解释），并且 GPSG 耗时的出处标为 Figure 5，看起来是引用错误。（8）优化器写作 Adam，却引用了 AdamW 的论文。"}, {"q_zh": "它和 Quark 是什么关系？该先读哪篇？", "a_zh": "两者都是可泛化、无需逐场景优化的实时 NVS。Quark 押单帧画质：用分层深度图加迭代 render-and-refine，在 1080p 下追求最高画质，每一帧独立处理。Ha et al. 押一致性：几何与时间都有跨帧状态，画质依靠 IBR。建议先读本文，它的模块更经典，更容易和基础知识对应起来；再读 Quark，更容易看清“迭代细化”和“分层表示”解决的是什么问题。两者结合，例如给 Quark 式的渲染器加上 TSDF 一致性约束和时间回灌，是一个自然的研究方向。"}, {"q_zh": "这个方法能直接用在远程临场（telepresence）产品里吗？", "a_zh": "离产品还有一段距离。需要补齐：实时且时间一致的深度前端（并计入耗时）、头动时的历史重投影、双眼和多人观看的计算复用、带宽和编解码方案（论文完全没有涉及）、对标定和同步误差的鲁棒性（论文 Sec. 4.6 承认标定误差会导致模糊），以及阵列外视点的补洞能力。它更适合作为一个一致性模块，插入其他 warp 加 blend 系统中使用。"}, {"q_zh": "代码开源了吗？复现最大的难点在哪？", "a_zh": "截至 2026-09-28 我们查看时，项目主页（https://nkhan2.github.io/projects/geometry-guided-2025/）提供了 arXiv 链接、bibtex 和结果对比视频，没有代码和权重的链接。复现难点包括：人工挑选的立体对、第二个 β 以及 U-Net 宽度等未公布的超参数、TSDF 符号约定和 raymarch 的边界处理、3DGS 光栅器输出深度和 alpha 的具体修改方式，以及训练数据的具体组合。"}, {"q_zh": "为什么时间一致性指标里 TCC 提升这么小，STED 却变化很大？", "a_zh": "TCC 是帧差图之间的 SSIM，对大面积、低幅度的闪烁不太敏感，而且各方法都集中在 0.77–0.92 这个窄区间里。STED 基于时空熵差，对局部统计特性的跳变更敏感，所以更能拉开差距。两者衡量的侧面不同，应该一起看，最好再补充一个基于光流的 warping error。"}], "exercises": [{"title_zh": "EMA 与软差分掩码的数值实验", "level": "入门", "task_zh": "用 NumPy 实现 Eq. (1)–(2)。（a）合成数据：一个 64×64 的静止平面，真实深度 2 m，每帧加 σ=1 cm 的独立高斯噪声，再让一个 10×10 的方块以每帧 2 像素的速度水平移动（深度 1.5 m，颜色与背景不同）。运行 100 帧，统计静止区的深度标准差，以及方块后方拖影持续的帧数。（b）真实数据：从 DyNeRF 数据集（https://github.com/facebookresearch/Neural_3D_Video）下载一段 cam 视频，按论文参数（1/4 分辨率、3×3 max-pool、双线性上采样）计算掩码并可视化，找出光照、火焰或压缩噪声被误判为运动的区域。（c）把 β 分别设为 0.2、0.6、0.9，重复实验。", "expected_zh": "静止区标准差之比接近理论值 sqrt(M/(2−M))：β=0.6 时约 0.65，β=0.2 时约 0.33。β 越小，拖影越长。在 DyNeRF 视频中，Flame Steak 的火焰和金属反光区域的 M 明显偏高。你应当能写出一段结论：β 控制的是去噪强度和对运动的响应速度之间的权衡。", "hint_zh": "颜色差可以先对 RGB 三个通道取均值或最大值，两种都试一试；max-pool 用 scipy.ndimage.maximum_filter(size=3)；上采样用 cv2.resize(INTER_LINEAR)。", "concept_ids": ["f-prob", "f-image", "v-temporal"]}, {"title_zh": "像素级高斯与点溅射：前向 warping 对比", "level": "入门", "task_zh": "使用 TUM RGB-D 数据集（https://cvg.cit.tum.de/data/datasets/rgbd-dataset）中带真值位姿和深度的序列（例如 freiburg1_xyz）。取一帧作为源、相隔约 10 帧的另一帧作为目标。（a）用 NumPy 实现反投影加最近像素点溅射（带 z-buffer）。（b）用 gsplat 的 rasterization 接口（https://docs.gsplat.studio/main/apis/rasterization.html）把每个像素变成各向同性、不透明度为 1 的高斯，σ=c·D/f，c 取 0.5、1.0、2.0，渲染得到 RGB、alpha 和深度。（c）取两个源视角，分别比较“逐视角渲染后取 alpha 较大者”和“合并后单次渲染”。计算空洞比例（alpha<0.5）和有效区域的 PSNR。", "expected_zh": "点溅射在目标相机靠近物体时会出现针孔状空隙；高斯在 c≈1 时空隙基本消失，边缘更平滑；c 过大时画面变糊，PSNR 下降。合并单次渲染在深度边缘处会出现更多的飞点和交错条纹，对应论文 Fig. 4a。", "hint_zh": "TUM 的深度 png 需要除以 5000 才得到米；位姿是 camera-to-world 的四元数加平移，要转换成 world-to-camera 的 viewmat。注意颜色渲染输出是否已经预乘了 alpha。", "concept_ids": ["g-pinhole", "n-3dgs", "r-alpha", "i-warping"]}, {"title_zh": "在 PyTorch 中实现 image-based TSDF 与 raymarch", "level": "进阶", "task_zh": "继续使用 TUM RGB-D：选 K=3 帧作为输入视角（用传感器深度），另取一帧作为目标视角。实现 A.1 的 Eq. (9)–(12)：沿目标射线采样，投影到 K 个视角，用 grid_sample 采样深度，计算 7×7 邻域的截断平方差得到权重，然后按 0.8·s 步进，检测到变号后做 3 步二分。分别实现两种符号约定，并记录哪一种能正常收敛。把得到的深度与目标帧的传感器深度比较，计算 MAE 和有效覆盖率；再用 Open3D 的体素 TSDF（https://www.open3d.org/docs/release/tutorial/pipelines/rgbd_integration.html）融合同样的 K 帧并做 raycast，比较结果。最后比较 Eq. (10) 加权和与加权平均两种写法对收敛步数的影响。", "expected_zh": "按“表面前方为正”（s=D−z）的约定可以正常收敛；按字面的 s=z−D，射线起点处权重全部为 0，无法前进。在平坦区域，深度 MAE 应当在厘米以内，边缘处误差较大。和 Open3D 相比，image-based 的结果不受体素尺寸限制，更锐利，但每换一个视角都要重新计算。加权平均写法需要设定 |s|<ε 的终止条件，否则步进会越来越慢而不会变号。", "hint_zh": "先把所有射线并行化成 (H·W, S) 的张量，固定最多 64 步。邻域平方差可以先对整张深度图用 unfold 预先计算，再按投影位置采样，避免每步都读 49 个像素（这是近似：预计算以整数像素为中心）。near 可以设为 0.3 m。", "concept_ids": ["d-tsdf", "r-raymarch", "g-pinhole", "f-prob"]}, {"title_zh": "RAFT-Stereo 深度与时间闪烁诊断", "level": "进阶", "task_zh": "在 DyNeRF 的某个场景中选两台相邻相机，从 poses_bounds.npy（LLFF 格式，见 https://github.com/bmild/nerf）读取位姿和焦距，用 OpenCV 的 stereoRectify 做校正。用 RAFT-Stereo（https://github.com/princeton-vl/RAFT-Stereo，demo.py 配合 --save_numpy）估计 60 帧的视差，按 Z=fB/d 换算成深度，再转换回原相机坐标系。统计静止背景像素深度的时间标准差与深度 Z 的关系，并和 δZ≈Z²δd/(fB) 的预测对比。然后套用练习 1 的 EMA，报告闪烁的降低幅度。", "expected_zh": "时间标准差大致随 Z² 增长，远处背景最不稳定；EMA（M=0.6）后标准差理论上降低约 35%。你还会看到有些区域的误差是系统性的（例如反光的锅具），EMA 对它们没有帮助。", "hint_zh": "LLFF 的位姿采用 [down, right, back] 的轴约定，需要转换成 OpenCV 约定；DyNeRF 的 poses_bounds 里没有畸变参数，可以先假设无畸变。实时性不是这个练习的目标，可以使用 README 推荐的 Middlebury 预训练模型。", "concept_ids": ["d-stereo", "g-epipolar", "g-depth", "v-temporal"]}, {"title_zh": "迷你版几何引导混合网络：验证 L_Depth 和 TSDF 输入的作用", "level": "挑战", "task_zh": "在练习 2 和练习 3 的基础上，对 DyNeRF 的 1–2 个场景（训练时只取单一时刻）和另一个场景（测试时取连续 30 帧）生成 K=4 的输入：warp 后的 RGB、α、深度、TSDF 深度以及 4 组相机特征，共 37 通道。实现一个 4 层 U-Net，输出 K+4 个通道，按 Eq. (4)–(5) 合成图像，并按 Eq. (7) 计算损失（分母补上 Σ 并加 ε）。训练四个版本：完整版、去掉 𝒟^t 输入、L_Depth 系数设为 0、按距离加权（不用网络）。报告 PSNR、TCC 和 SDT。", "expected_zh": "大致能复现论文 Table 3 的规律：有网络与无网络之间差距很大；去掉 TSDF 输入或 L_Depth 后 PSNR 变化很小，但一致性指标变差，在边缘的重影区域尤其明显。如果你的结果与此不同，要分析是因为深度质量、数据量，还是训练和测试同域的程度不同。", "hint_zh": "先降到 1/4 分辨率（约 338×254）加快实验；预先计算好所有 warp 结果，缓存到磁盘；相机特征 f^{(7)} 和 f^{(8)} 要记得在空间上广播。单卡数小时即可看到趋势。", "concept_ids": ["l-cnn", "i-blending", "l-loss", "d-tsdf"]}, {"title_zh": "一致性评测工具箱：TCC、SDT、SDV、EPI 与 x–t 切片", "level": "挑战", "task_zh": "实现 Eq. (8) 的 TCC（SSIM 可以用 kornia 或 skimage），以及 SDT 和 SDV，并实现两种可视化：固定相机的 x–t 切片，和水平平移路径的 EPI。设计对照实验：（a）在真值视频上逐帧加入 ±2% 的随机亮度闪烁；（b）对每一帧都做同样的高斯模糊；（c）只在一半帧上做模糊。观察四个指标分别怎么变化。再用 LPIPS（https://github.com/richzhang/PerceptualSimilarity）补充感知指标。", "expected_zh": "（a）TCC 明显下降，PSNR 下降不多，说明时间指标能捕捉单帧指标漏掉的闪烁。（b）PSNR 下降，但 SDT 变化不大，说明 SDT 衡量的是误差的稳定性而不是误差的大小。（c）SDT 明显上升。你应当能据此写出一份如何正确解读论文 Table 1 的说明。", "hint_zh": "TCC 的输入是帧差的绝对值图，建议先转成灰度或逐通道计算后取平均；EPI 需要沿路径渲染密集的视角，可以先用练习 2 的 warp 结果生成。", "concept_ids": ["v-metrics", "v-temporal", "i-lightfield"]}], "glossary": [{"term_en": "Online view synthesis", "term_zh": "在线视角合成", "def_zh": "第 t 帧只用当前帧和少量历史状态生成新视角，不需要看完整段视频，也不做逐场景优化。在线不等于实时，也不等于低延迟。"}, {"term_en": "Image-based rendering (IBR)", "term_zh": "基于图像的渲染", "def_zh": "直接搬运和混合输入照片中的真实像素来合成新视角，而不是从一个 3D 模型渲染。锐度高，但依赖几何的准确性。"}, {"term_en": "Forward warping / splatting", "term_zh": "前向 warping / 溅射", "def_zh": "把源图的每个像素按深度投射到目标图上。会产生空洞和重叠，需要 z 排序和补洞；与之相对的是从目标像素反查源图的 backward warping。"}, {"term_en": "Disocclusion", "term_zh": "去遮挡区域", "def_zh": "在目标视角中可见、但在输入视角中被挡住的区域，前向 warp 之后表现为空洞，本文用背景图 𝓘_BG 填补。"}, {"term_en": "Flying pixels", "term_zh": "飞点", "def_zh": "深度图在物体边缘把前景和背景插值成中间值，反投影后这些点悬浮在两者之间，warp 之后成为散落的噪点。"}, {"term_en": "Z-fighting", "term_zh": "深度冲突", "def_zh": "两个几乎重合的表面争夺同一个像素，谁在前取决于噪声，画面会闪烁或出现条纹。本文用逐视角单独渲染来避免它。"}, {"term_en": "Pixel-sized isotropic Gaussian", "term_zh": "像素级各向同性高斯", "def_zh": "以像素反投影点为中心、协方差为 σ²I 的 3D 高斯，σ 取值使它在源图中覆盖约 1 个像素，不透明度为 1，颜色取像素值。"}, {"term_en": "Accumulated alpha", "term_zh": "累积不透明度", "def_zh": "α=1−∏(1−α_i)，表示该像素被多少“物质”覆盖。接近 0 表示空洞，小数值表示边缘。"}, {"term_en": "Rectification", "term_zh": "立体校正", "def_zh": "把双目图像重新投影到共面、行对齐的平面上，使对应点只在水平方向上相差视差 d。"}, {"term_en": "Disparity", "term_zh": "视差", "def_zh": "校正后同一 3D 点在左右图中的水平像素差，与深度的关系为 Z=fB/d。"}, {"term_en": "RAFT-Stereo", "term_zh": "RAFT-Stereo", "def_zh": "基于相关代价体和多层卷积 GRU 迭代更新视差的双目网络（3DV 2021）。本文用它生成输入深度，但它逐帧独立，不保证时间一致。"}, {"term_en": "Soft difference mask", "term_zh": "软差分掩码", "def_zh": "M=min(|I_t−I_{t−1}|/λ_t+β, 1)，本文 λ_t=0.7、β=0.6，取值范围 [0.6, 1]，表示当前帧应该在多大程度上相信新深度。"}, {"term_en": "Exponential moving average (EMA)", "term_zh": "指数滑动平均", "def_zh": "新值 = 增益 × 新测量 + (1−增益) × 旧值。独立噪声下，稳态方差降为原来的 M/(2−M)。"}, {"term_en": "TSDF (truncated signed distance field)", "term_zh": "截断符号距离场", "def_zh": "空间中每一点到最近表面的有符号距离，超过 ±τ 的部分被截断。零等值面就是表面。"}, {"term_en": "Image-based TSDF", "term_zh": "基于图像的 TSDF", "def_zh": "Project Starline 的做法：不建体素，只沿目标射线按需计算 TSDF，每个采样点投影到输入视角查询深度。"}, {"term_en": "Projective signed distance", "term_zh": "投影符号距离", "def_zh": "沿输入相机视线方向的距离差 z−D（或 D−z），用来近似真正的欧氏距离，表面倾斜时会偏大。"}, {"term_en": "Truncation threshold τ", "term_zh": "截断阈值", "def_zh": "本文取 0.02 m，为公制常数。它同时决定权重的下限（约 0.05）和遮挡判定（论文写作 s_k<−τ 时权重为 0；按“表面前方为正”的约定理解，即该点在该视角的观测表面后方超过 τ）。"}, {"term_en": "Sphere tracing / raymarching", "term_zh": "球面追踪 / 光线步进", "def_zh": "沿射线按 SDF 值决定步长前进以寻找零交叉，本文的步长为 0.8·s；与 NeRF 的体渲染积分不同。"}, {"term_en": "Bisection refinement", "term_zh": "二分细化", "def_zh": "检测到符号变化后，在最后一步的区间内折半 3 次，区间缩小到原来的 1/8。"}, {"term_en": "Temporal feedback (ω_tmp, η)", "term_zh": "时间回灌", "def_zh": "把上一帧输出的目标深度作为额外的 TSDF 输入，权重取决于累积置信度和目标视角运动掩码，上限 η=15。"}, {"term_en": "Unstructured Lumigraph Rendering (ULR)", "term_zh": "非结构化 Lumigraph 渲染", "def_zh": "Buehler 等人提出的经典 IBR 混合方法，按射线夹角、分辨率等几何量为各视角分配权重。本文输入网络的相机特征（射线夹角、相机距离等）与这些量属于同一类，但论文本身没有引用 ULR。"}, {"term_en": "Blending weights w_k", "term_zh": "混合权重", "def_zh": "网络为每个视角在每个像素预测的权重，与 α_k 相乘后归一化，用于加权平均 warp 后的颜色。"}, {"term_en": "Background image 𝓘_BG", "term_zh": "背景图", "def_zh": "网络直接生成的 RGB，由 w_BG 混入最终图像，用来填补去遮挡空洞。它不是真实像素，也没有时间约束。"}, {"term_en": "U-Net", "term_zh": "U-Net", "def_zh": "带跳连的编码器-解码器卷积网络。本文使用四层 U-Net，输入 9K+1 个通道，输出按内容推算为 K+4 个通道（K 个权重、1 个背景权重、3 通道背景图）。"}, {"term_en": "SSIM", "term_zh": "结构相似性", "def_zh": "同时比较局部亮度、对比度和结构的图像相似度，取值 [−1, 1]；本文既把它用作损失，也用于构造 TCC。"}, {"term_en": "LPIPS", "term_zh": "学习式感知相似度", "def_zh": "比较两张图在深度网络特征上的距离，越低越好，比 PSNR 更接近人眼感受。"}, {"term_en": "TCC (temporal change consistency)", "term_zh": "时间变化一致性", "def_zh": "渲染视频帧差图与真值视频帧差图之间的 SSIM 平均值，越高说明闪烁越少。"}, {"term_en": "STED", "term_zh": "时空熵差", "def_zh": "基于 Soundararajan 与 Bovik 的降参考时空熵差视频质量指标，越低说明时空统计特性越接近真值。"}, {"term_en": "SDT / SDV", "term_zh": "时间 / 视角误差标准差", "def_zh": "L1 误差分别在帧之间和测试视角之间的标准差（沿用 Long et al. 2021），衡量的是误差的稳定性，不是误差大小。"}, {"term_en": "Epipolar plane image (EPI)", "term_zh": "极平面图像", "def_zh": "相机沿水平路径平移时，把各个位置渲染出的图像的同一行像素按相机位置堆叠成 x–v 图像。3D 点表现为斜率为 −f/Z 的直线，断裂说明视角不一致。"}, {"term_en": "Torch-TensorRT", "term_zh": "Torch-TensorRT", "def_zh": "把 PyTorch 模型编译成 TensorRT 推理引擎的工具，本文用它把混合网络从 65 ms 加速到 23 ms。"}]}}}</script>
<script>
(function () {
  "use strict";
  // ================= core: shared helpers, cross-links, math, navigation =================
  var DATA;
  try { DATA = JSON.parse(document.getElementById("data").textContent); } catch (e) { DATA = {}; }
  var SITE = DATA.site || {};
  var meta = DATA.meta || {};

  // ---------- DOM helpers: all text goes through textContent; external links are https-only ----------
  function safeUrl(u) { if (typeof u !== "string") return null; var s = u.trim(); return /^https:\/\/[^\s"'<>]+$/i.test(s) ? s : null; }
  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (!Object.prototype.hasOwnProperty.call(attrs, k)) continue;
      var v = attrs[k];
      if (v === null || v === undefined || v === false) continue;
      if (k === "class") n.className = v;
      else if (k === "text") n.textContent = String(v);
      else if (k === "href") { var u = safeUrl(v); if (u) { n.setAttribute("href", u); n.setAttribute("target", "_blank"); n.setAttribute("rel", "noopener noreferrer"); } }
      else if (k.slice(0, 2) === "on" && typeof v === "function") n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, String(v));
    }
    (kids || []).forEach(function (c) { if (c === null || c === undefined || c === false) return; n.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return n;
  }
  var SVGNS = "http://www.w3.org/2000/svg";
  function sv(tag, attrs, kids) {
    var n = document.createElementNS(SVGNS, tag);
    if (attrs) for (var k in attrs) {
      if (!Object.prototype.hasOwnProperty.call(attrs, k)) continue;
      var v = attrs[k];
      if (v === null || v === undefined || v === false) continue;
      if (k === "text") n.textContent = String(v);
      else if (k.slice(0, 2) === "on" && typeof v === "function") n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, String(v));
    }
    (kids || []).forEach(function (c) { if (c) n.appendChild(c); });
    return n;
  }
  function arr(x) { return Array.isArray(x) ? x : []; }
  function str(x) { return typeof x === "string" ? x : (x === null || x === undefined ? "" : String(x)); }

  // ---------- pages & cross-page links ----------
  var PAGES = arr(SITE.pages);
  var CUR_FILE = "";
  PAGES.forEach(function (p) { if (p.key === SITE.current) CUR_FILE = p.file; });
  function pageOf(id) {
    var sp = SITE.sectionPage || {};
    if (Object.prototype.hasOwnProperty.call(sp, id)) return sp[id];
    var pre = arr(SITE.prefixPage);
    for (var i = 0; i < pre.length; i++) if (id.indexOf(pre[i][0]) === 0) return pre[i][1];
    return null;
  }
  function hrefFor(id) { var f = pageOf(id); return (!f || f === CUR_FILE) ? "#" + id : f + "#" + id; }
  function align(id) {
    var t = document.getElementById(id);
    if (!t) return;
    var root = document.documentElement, prev = root.style.scrollBehavior;
    root.style.scrollBehavior = "auto";
    t.scrollIntoView({ block: "start" });
    root.style.scrollBehavior = prev;
  }
  function goTo(id, instant) {
    var t = document.getElementById(id);
    if (!t) {
      var f = pageOf(id);
      if (f && f !== CUR_FILE) window.location.href = f + "#" + id;
      return;
    }
    var p = t;
    while (p && p !== document.body) {
      if (typeof p._activate === "function") p._activate();
      if (p.tagName === "DETAILS") p.open = true;
      p = p.parentElement;
    }
    typeset(t);
    if (instant) align(id); else t.scrollIntoView({ block: "start" });
    t.classList.remove("flash"); void t.offsetWidth; t.classList.add("flash");
  }
  // Internal link: a real <a href> (works across pages, middle-click opens a tab); same-page clicks also open details and flash.

        el("thead", null, [el("tr", null, ["阶段", "张量", "形状", "说明"].map(function (h) { return el("th", { text: h }); }))]),
        el("tbody", null, arr(g.tensor_trace).map(function (r) { return el("tr", null, [el("td", { text: r.stage_zh }), el("td", { class: "code", text: r.tensor }), el("td", { class: "code", text: r.shape }), el("td", { text: r.note_zh })]); }))
      ])])]) : null,
      arr(g.reading_experiments).length ? blk("怎么读实验部分", [el("div", { class: "cards" }, arr(g.reading_experiments).map(function (r) { return el("div", { class: "card" }, [el("h4", { text: r.item }), el("p", { text: r.how_to_read_zh }), el("span", { class: "lbl", text: "真正说明了什么" }), el("p", { text: r.takeaway_zh })]); }))]) : null,
      arr(g.tradeoffs).length ? blk("设计取舍", [el("div", { class: "tbl-wrap" }, [el("table", null, [
        el("thead", null, [el("tr", null, ["选择", "换来的", "付出的"].map(function (h) { return el("th", { text: h }); }))]),
        el("tbody", null, arr(g.tradeoffs).map(function (r) { return el("tr", null, [el("td", { class: "dim", style: "white-space:normal", text: r.choice_zh }), el("td", { text: r.gain_zh }), el("td", { text: r.cost_zh })]); }))
      ])])]) : null,
      arr(g.faq).length ? blk("新手常问", [qaList(g.faq, "q_zh", "a_zh")]) : null,
      arr(g.exercises).length ? blk("动手练习", [el("div", { class: "cards" }, arr(g.exercises).map(function (x) { return el("div", { class: "card" }, [el("div", { class: "chips" }, [el("span", { class: "pill " + (x.level === "入门" ? "should" : x.level === "进阶" ? "must" : "drop"), text: x.level })]), el("h4", { text: x.title_zh }), el("p", { text: x.task_zh }), x.expected_zh ? el("p", { class: "note", text: "预期结果：" + x.expected_zh }) : null, x.hint_zh ? el("p", { class: "note", text: "提示：" + x.hint_zh }) : null, chipRow("概念", arr(x.concept_ids).map(function (c) { return cChip(c, true); }))]); }))]) : null
    ]);
  }
  if (guides.quark || guides.ha) {
    addSection("guided", "精读导读", [
      secHead("Guided reading", "精读导读：用基础知识读懂两篇锚点论文", meta.guided_lede || ""),
      el("div", { class: "panel" }, [makeTabs([
        { id: "quark", label: "Quark 导读", node: function () { return guideView("quark"); } },
        { id: "ha", label: "Ha et al. 导读", node: function () { return guideView("ha"); } }
      ], "atlas.guideTab")])
    ]);
    if (guides.quark) addTocItem("guide-quark", "Quark 导读");
    if (guides.ha) addTocItem("guide-ha", "Ha et al. 导读");
  }

  finishPage();
})();
