Ĩ（Eq. 2）。论文原话是 “Splatting avoids expensive ray tracing or rasterization”。可见性靠层的顺序（画家算法式的 over）来处理，而不是靠深度测试。\n\n这样做成立有一个几何前提（论文没有明说，是推论）。Eq. 3–4 把每层限制在互不重叠的等视差带内，而带的边界是目标相机的等深平面。只要输入相机的光心位于近平面之前、射线朝深度增大的方向前进，射线穿过各带的先后次序就不会改变，所以在输入视角里按层号合成仍然正确。\n\n最终渲染（Eq. 1）方向相反：用 P 的伴随 P^T，把全分辨率输入图像反投影到各层深度上，也就是对每个 LDM 像素去输入图中双线性取值（gather）。因此最终输出没有前向 splat 那样的空洞，只在投影落到输入图外时才缺值。Sec. 1 和 Sec. 2.1 还指出，以往的 layered mesh 方法要先把 LDM 转成网格才能渲染到其他视角，而 Quark 直接渲染 LDM，从不实例化网格。不理解 scatter/gather 和伴随关系，就读不懂 P 与 P^T 这对记号。"}, "in_ha": {"used": true, "where": "Sec. 3.1、附录 A.3、图 4、图 10、表 3（No Blending）、表 4（Forward-splatting 10 ms）；A.2（差分掩码同样用高斯 splat 投到目标视角）", "how_zh": "Ha 的第一阶段就是点溅射。取最近的 K 个输入视角（DyNeRF 上 K = 4），把每个像素按深度反投影成一个完全不透明、各向同性、在源图中的投影恰好覆盖 1 个像素的 3D 高斯。然后用原版 3DGS 光栅器逐视角单独渲染到目标相机，得到 K 张前向渲染图 𝓘_k、累积不透明度 α_k 和深度 𝒟_k。在 DyNeRF（1352×1014）上这一步耗时 10 ms（表 4）。\n\n作者给出两条光栅化层面的理由。(1) 与传统点溅射相比，高斯足迹能处理遮挡，并减少“像素间空隙和锯齿边”（Sec. 3.1、A.3、图 10）。(2) 把所有视角的高斯一次性渲染会产生飞点和去遮挡空洞，还会因 Z-fighting 让边缘变差（Sec. 3.1、图 4a），所以必须分视角渲染，由融合网络决定取舍。表 3 中，单遍渲染的 No Blending 为 PSNR 24.64、STED 483.3。另外，A.2 中的 K 张差分掩码也用高斯 splat 投到目标视角，再取逐通道最大值。不理解 z-buffer 和 splat 足迹，就看不出“分开渲染”为什么是这篇论文的关键设计。"}, "in_field_zh": "(1) 基于 3DGS 的实时临场系统都依赖 tile 光栅化，例如房间尺度 AR/VR 临场系统 GaussianNexus，以及在接收端渲染推流来的 Gaussian maps 的 Tele360。排序方式和足迹近似直接决定边缘质量和 popping。(2) Project Starline（Sec. 4.6）用点溅射把输入深度图光栅化到低分辨率的目标视角，做 2D min/max 滤波后得到每条射线的 TSDF 搜索区间。它还为 4 台彩色相机各算一张 shadow map（用 raycasting 得到该相机视角的深度图），再用深度比较加 percentage closer filtering 判断某表面点对哪台相机可见，这和 z-buffer 是同一类深度测试。(3) 头显的 late-stage reprojection：ATW 只做旋转重投影；利用深度的 positional timewarp 类方法按新的头部位姿把上一帧 RGB-D 前向 warp，同样会遇到空洞和飞点。(4) 光场屏和裸眼 3D 显示每帧要渲染几十个视角，光栅化吞吐量是硬约束。", "resources": [{"title": "Scratchapixel: Rasterization: a Practical Implementation", "url": "https://www.scratchapixel.com/lessons/3d-basic-rendering/rasterization-practical-implementation/overview-rasterization-algorithm.html", "type": "tutorial", "note_zh": "从 edge function、重心坐标、透视校正插值一直讲到 depth buffer，附 C++ 代码。先读 overview 一章，再读 “The Visibility Problem, the Depth Buffer Algorithm and Depth Interpolation” 和 “Perspective Correct Interpolation and Vertex Attributes”。"}, {"title": "tinyrenderer (Dmitry Sokolov)", "url": "https://github.com/ssloy/tinyrenderer/wiki", "type": "code", "note_zh": "用约 500 行代码从零写一个软件光栅化器。前几课依次实现画线（Lesson 1）、三角形填充（Lesson 2）和 z-buffer（Lesson 3），最适合动手练习。"}, {"title": "EWA Splatting (Zwicker, Pfister, van Baar, Gross, IEEE TVCG 2002)", "url": "https://www.cs.umd.edu/~zwicker/publications/EWASplatting-TVCG02.pdf", "type": "paper", "note_zh": "EWA splatting 的完整推导，包括 3D 高斯重建核、投影的局部仿射近似（雅可比）和屏幕空间低通。3DGS 官方光栅器 computeCov2D 的注释直接引用了本文的公式 (29) 和 (31)。"}, {"title": "3D Gaussian Splatting for Real-Time Radiance Field Rendering (Kerbl et al., SIGGRAPH 2023)", "url": "https://arxiv.org/abs/2308.04079", "type": "paper", "note_zh": "建议读：Sec. 2.3（点渲染与体渲染是同一成像模型，Eq. 1–3）；Sec. 4（Eq. 4 高斯定义、Eq. 5 协方差投影、Eq. 6 Σ = RSSᵀRᵀ）；Sec. 6 与附录 C（16×16 tile、按深度加 tile 排序、α 上限 0.99、1/255 阈值、0.9999 提前终止）。配合官方光栅器 https://github.com/graphdeco-inria/diff-gaussian-rasterization 中的 cuda_rasterizer/forward.cu 一起看。"}], "self_check": [{"q_zh": "用 1 像素点溅射把一张 RGB-D 图前向 warp 到一个更靠近物体的相机，为什么会出现规则的裂缝？有哪些修复办法，各自代价是什么？", "a_zh": "放大时，相邻源像素在目标图中的间距 f·Δ/z' 超过 1 px。例如世界间距 2 mm、f = 1000、z' = 1 m 时间距为 2 px，1 像素的点写不满。修复办法有三种。(a) 用随深度自适应的足迹（EWA 或高斯 splat，即 Ha 的做法），代价是要排序并做 alpha 混合。(b) 把像素连成三角网格再光栅化，代价是深度不连续处会拉出“橡皮膜”三角形，必须按深度差把网格断开。(c) 事后补洞，或改用后向 warping，但后者需要先知道目标深度。"}, {"q_zh": "Ha et al. 为什么不把 K 个视角的像素高斯一次性渲染？", "a_zh": "同一表面在不同视角的深度估计有毫米级噪声。单遍渲染时，每个像素由更近者以 α ≈ 0.99 占据，而谁更近随噪声随机切换，于是产生 z-fighting。错误深度的飞点还会遮住正确的背景，而且事后无法纠正（图 4a）。分开渲染能保留 K 个候选以及各自的 α_k 和深度，让几何引导的融合网络决定每个像素该信谁。表 3 中，单遍渲染的 PSNR 为 24.64，完整方法为 31.17。"}, {"q_zh": "Quark 的 P 与 P^T 分别是 scatter 还是 gather？为什么最终渲染用 P^T 不会出现前向 warp 那样的空洞？", "a_zh": "P（Eq. 2）把 LDM 各层按深度双线性 splat 到输入视角，是 scatter。P^T 是它的伴随：对每个 LDM 像素，按其深度投到输入图中双线性取值，是 gather。gather 能为每个目标像素都取到一个值（投影落到输入图外时除外），所以没有空洞。代价是必须先知道目标视角的几何，也就是 LDM 的深度，而这正是网络要求解的量。"}], "prereqs": ["g-pinhole"]}, {"id": "r-alpha", "name_zh": "Alpha 合成与 over 算子", "name_en": "Alpha compositing & the over operator", "tldr_zh": "alpha 表示一个像素被前景覆盖的比例。over 算子 C = C_F + (1−α_F)·C_B 把前景叠在背景上；沿深度反复应用它，就得到分层表示、3DGS 和 NeRF 共用的合成公式。", "intuition_zh": "一个像素里常常只有一部分被前景覆盖，例如发丝、物体边缘和运动模糊；也可能前景本身是半透明的，例如玻璃和烟。alpha ∈ [0,1] 就是这个覆盖率（或不透明度）。Porter 与 Duff 在 1984 年把图像合成形式化为一组算子，最常用的是 over：把前景叠在背景上，透过前景还能看到比例为 (1−α_F) 的背景。\n\n预乘（premultiplied）alpha 是一条关键的工程约定：像素存 (αc, α)，而不是 (c, α)。预乘之后，over 变成线性的 C = C_F + (1−α_F)·C_B，满足结合律，可以任意分组计算。插值、滤波和降采样也只有在预乘空间里做才正确；在非预乘空间里做，透明像素的“颜色”会渗进边缘，形成黑边或彩边。\n\n多层合成有两种顺序。后到前（画家算法）从最远层开始，每层做一次 C ← α_ℓ·c_ℓ + (1−α_ℓ)·C，实现简单，但必须处理完所有层。前到后则维护一个透射率 T，表示到这一层为止还剩多少“视线”没被挡住：每层贡献 T·α·c，然后更新 T ← T·(1−α)。T 足够小时可以提前终止，3DGS 光栅器就是这么做的。两种顺序在数学上等价。前到后的形式还直接给出每层的可见权重 w_i = T_i·α_i，它们的和就是累积不透明度 A = 1 − T_最终；用同一组权重去合成深度，就得到期望深度。\n\n另一类常被混淆的运算是归一化加权平均 Σw_k·c_k / Σw_k。它与顺序无关，也不表达遮挡，常用来融合多个候选，例如多视角 IBR 中的多个输入颜色。Ha et al. 的 Eq. 4 属于这一类，Eq. 5 的背景补洞才是 over 形式。", "analogy_zh": "像在灯箱上叠几张印了图案的透明胶片。从观察者这一侧看过去，每张胶片按自己的不透明度盖住后面的内容。透射率 T 就是视线穿过前面几张胶片后剩下的“余额”，每张胶片从余额里分走 α 的份额，染上自己的颜色。", "equations": [{"tex": "C_o = C_F + (1-\\alpha_F)\\,C_B,\\qquad \\alpha_o = \\alpha_F + (1-\\alpha_F)\\,\\alpha_B", "explain_zh": "预乘形式的 Porter–Duff over。C_F = α_F·c_F 是预乘的前景颜色，C_B 是预乘的背景颜色，α_F、α_B 分别是前景和背景的覆盖率，C_o、α_o 是结果（仍为预乘）。非预乘形式要写成 c_o = (α_F·c_F + (1−α_F)·α_B·c_B)/α_o，多了一次除法，也不再是线性的。"}, {"tex": "C^{(\\ell)} = \\alpha_\\ell\\,\\mathbf{c}_\\ell + (1-\\alpha_\\ell)\\,C^{(\\ell-1)},\\qquad \\ell = 1,\\dots,L,\\quad C^{(0)} = \\mathbf{0}", "explain_zh": "后到前递推：ℓ = 1 是最远层，ℓ = L 是最近层。c_ℓ 是第 ℓ 层的（非预乘）颜色，α_ℓ 是它的不透明度，C^{(ℓ)} 是合成到第 ℓ 层为止的预乘结果。Quark 的 over 算子 𝒪 在 Sec. 3.1 中定义为从后到前合成，就是这种形式。"}, {"tex": "C = \\sum_{i=1}^{N} T_i\\,\\alpha_i\\,\\mathbf{c}_i,\\qquad T_i = \\prod_{j=1}^{i-1}(1-\\alpha_j),\\qquad A = \\sum_{i=1}^{N} T_i\\alpha_i = 1 - T_{N+1}", "explain_zh": "前到后形式：i = 1 是最近层。T_i 是视线到达第 i 层时的透射率（T_1 = 1），T_i·α_i 是第 i 层的可见权重，A 是累积不透明度。3DGS 官方光栅器在内部保存每个像素最终的 T（final_T），所以 A = 1 − final_T。把 c_i 换成深度 t_i，就得到期望深度 Σ T_i·α_i·t_i。"}, {"tex": "\\mathcal{I}_{FG} = \\frac{\\sum_{k=1}^{K} \\mathcal{I}_k\\,\\alpha_k\\,w_k}{\\sum_{k=1}^{K} \\alpha_k\\,w_k},\\qquad \\mathcal{I} = (1-w_{BG})\\,\\mathcal{I}_{FG} + w_{BG}\\,\\mathcal{I}_{BG}", "explain_zh": "Ha et al. 的 Eq. 4–5。原文把求和号写在整个分式外面、分母里没有求和，照字面会退化成 Σ𝓘_k，应为笔误，这里按本意改写。𝓘_k 是第 k 个输入视角前向渲染到目标视角的图像，α_k 是它的累积不透明度（覆盖掩码），w_k 是网络预测的逐像素混合权重，𝓘_BG 是网络生成的背景图，w_BG 是背景权重。前一式是以 α_k·w_k 为权重的归一化加权平均，不表达遮挡；后一式是非预乘形式的 over，前景的 alpha 为 1−w_BG，背景视为不透明。"}], "worked_example_zh": "三层，从近到远：\n- 层 1：蓝色 (0,0,1)，α = 0.2，深度 1 m；\n- 层 2：绿色 (0,1,0)，α = 0.5，深度 2 m；\n- 层 3：红色 (1,0,0)，α = 1.0，深度 5 m（不透明背景）。\n\n后到前：\n- 从红色开始，C = (1,0,0)；\n- 叠上层 2：0.5·(0,1,0) + 0.5·(1,0,0) = (0.5, 0.5, 0)；\n- 叠上层 1：0.2·(0,0,1) + 0.8·(0.5, 0.5, 0) = (0.4, 0.4, 0.2)。\n\n前到后：\n- T1 = 1，w1 = 0.2；\n- T2 = 0.8，w2 = 0.8×0.5 = 0.4；\n- T3 = 0.8×0.5 = 0.4，w3 = 0.4×1 = 0.4。\n权重之和 Σw = 1.0 = 1 − T4（T4 = 0）。C = 0.2·蓝 + 0.4·绿 + 0.4·红 = (0.4, 0.4, 0.2)，与后到前的结果一致。\n\n期望深度：0.2×1 + 0.4×2 + 0.4×5 = 3.0 m。这个深度上没有任何表面。半透明边缘处合成出的深度会“浮”在前景和背景之间，这是深度图出现飞点的来源之一。\n\n预乘陷阱：3DGS 光栅器输出 C + T·bg，在黑背景（bg = 0）下就是 C = Σ c_i·α_i·T_i，本身是预乘颜色。于是一个覆盖率 A = 0.5 的纯红边缘像素，输出是 (0.5, 0, 0)。Ha 的 Eq. 4 又乘了一次 α_k，把 𝓘_k 当作非预乘颜色做加权平均。如果只有这一个视角有效，结果就是 (0.5·0.5)/0.5 = (0.5, 0, 0)，而不是应有的 (1, 0, 0)，边缘会变暗发黑。复现时要先确认 𝓘_k 是否已经预乘（必要时除以 A 还原），论文没有说明。好在像素高斯内部的 α_k ≈ 1，这个问题只出现在边缘。", "pitfalls_zh": ["预乘与非预乘混用。对非预乘图像做双线性插值或下采样，透明像素的颜色会渗进边缘，形成黑边或彩边；反过来，把预乘颜色当作非预乘颜色使用，边缘会变暗。处理之前先统一约定。", "合成顺序写反。over 不满足交换律，后到前必须从最远层开始。对 Quark 的 LDM，由 Eq. 3–4 的视差 anchor δ = (ℓ−0.5)/L 可以推出：层号 ℓ 越大，视差越大、离相机越近，所以后到前就是 ℓ = 1 → L。", "把累积不透明度 α_k 当作深度置信度。它只说明这个像素被多少高斯覆盖，飞点的 α 同样约等于 1。只有 α_k ≈ 0 才能可靠地说明这里是空洞。", "把 over 和归一化加权平均混为一谈。前者表达遮挡、依赖顺序；后者对称、不表达遮挡。多视角 IBR 融合通常用后者；如果用 over 把多个视角的结果叠起来，输出会随视角的排列顺序而变。"], "in_quark": {"used": true, "where": "Sec. 3.1 Eq. (1)；Sec. 3.2.2 Eq. (2)；Sec. 3 开头（可选的深度输出）；Sec. 1（density 的作用）", "how_zh": "Quark 的整个渲染器就是 over 算子 𝒪。Sec. 3.1 把 𝒪:(c, σ)↦I 定义为“标准 over 合成算子”，按从后到前的顺序对各层做 alpha 合成。最终图像是 c_target = 𝒪(Σ_m β_m·P^T_θ(I, d), σ)（Eq. 1）：每层先用 M 维 blend weights 把 M = 8 张反投影的输入图混成一个颜色（这一步是归一化凸组合），再按 σ 从后往前 over。迭代中的 Ĩ = 𝒪(P_θ(a, d), P_θ(σ, d))（Eq. 2）同样是 over。\n\n注意，σ 虽然叫 density，但 Sec. 3.1 明确说它存的是 transparency（即 alpha）值，由 sigmoid 得到，取值在 [0,1]；Sec. 1 说 density map 负责“遮挡和抗锯齿边缘”。需要深度图时，用各层的深度代替颜色做 over 合成即可（Sec. 3 开头），得到的正是期望深度。推理时的 CUDA over 渲染器在 1080p 下约 1.3 ms/帧。"}, "in_ha": {"used": true, "where": "Sec. 3.1（累积不透明度 α_k）、Sec. 3.3 Eq. 4–6、Eq. 7 中的 L_Mask、附录 A.4（alpha maps 作为网络输入）", "how_zh": "3DGS 光栅器内部做的是前到后的 alpha 合成。Ha 的每个前向渲染视角除了 RGB，还输出累积不透明度 α_k^t（即 1−T），作用是覆盖掩码：α_k ≈ 0 的像素就是该视角的去遮挡空洞。官方 main 分支的光栅器只在内部保存 final_T，不直接返回 α 图和深度图，复现时需要自己导出（不少衍生版本已经支持）。\n\nEq. 4 的 𝓘_FG = Σ_k 𝓘_k·α_k·w_k / Σ_k α_k·w_k 是以 α_k·w_k 为权重的归一化加权平均（原文分母漏写了求和），α_k 让空洞处自动失去权重。Eq. 6 的 L_Depth 用同一组权重合成深度，再与 TSDF 深度比较。Eq. 5 的 𝓘 = (1−w_BG)·𝓘_FG + w_BG·𝓘_BG 则是非预乘形式的 over：前景的 alpha 是 1−w_BG，背景图 𝓘_BG 由网络生成，用来补洞；L_Mask 让 w_BG 逼近“空区域”的二值掩码。A.4 中，K 张 alpha 图还直接作为 U-Net 的输入通道。"}, "in_field_zh": "(1) 抠像与背景替换：临场系统常把远端人物从背景中分离出来（例如 Starline 用背光帮助立体深度得到清晰的剪影），再合成进本地环境。头发边缘的 alpha 和预乘处理决定会不会出现白边或黑边。(2) AR 头显把远端人物叠加到真实场景里，本质上也是 over 合成。光学透视式显示只能往视野里“加光”，无法真正用 α 遮住背后的真实物体，这是另一个难点。(3) MPI、MSI、LDM、3DGS、NeRF 都以 over 或其前到后形式作为渲染核心。(4) 期望深度在边缘处会“浮空”，影响所有依赖深度的后续模块，例如 TSDF 融合和基于深度的重投影。", "resources": [{"title": "Compositing Digital Images (Porter & Duff, SIGGRAPH 1984)", "url": "https://keithp.com/~keithp/porterduff/p253-porter.pdf", "type": "paper", "note_zh": "提出 alpha 通道的代数和一整套合成算子（over、in、out、atop、xor 等），也是预乘颜色的原始表述。只有 7 页，建议全文精读。"}, {"title": "Alpha and the History of Digital Compositing (Alvy Ray Smith, Microsoft Tech Memo 7, 1995)", "url": "https://alvyray.com/Memos/CG/Microsoft/7_alpha.pdf", "type": "paper", "note_zh": "alpha 通道的共同发明者讲清楚三件事：alpha 是覆盖率，为什么要预乘，over 是怎么推出来的。"}, {"title": "Premultiplied alpha (Shawn Hargreaves)", "url": "https://shawnhargreaves.com/blog/premultiplied-alpha.html", "type": "blog", "note_zh": "从工程角度解释为什么预乘 alpha 能让纹理滤波和混合同时正确，附有非预乘滤波导致边缘变暗的数值示例。续篇 “Premultiplied alpha and image composition” 讲结合律。"}, {"title": "Stereo Magnification: Learning View Synthesis using Multiplane Images (Zhou, Tucker, Flynn, Fyffe, Snavely, SIGGRAPH 2018)", "url": "https://arxiv.org/abs/1805.09817", "type": "paper", "note_zh": "MPI 是一组固定深度的 RGBA 平面，渲染等于单应 warp 加 over 合成。Flynn 是作者之一，这篇是 Quark LDM 这条线的源头。"}], "self_check": [{"q_zh": "两层：近层 α = 0.6、白色 (1,1,1)，远层 α = 1、黑色 (0,0,0)。(a) 输出颜色是多少？(b) 如果把顺序弄反，把远层当成最后叠上去的那层，会得到什么？", "a_zh": "(a) 0.6×1 + 0.4×0 = 0.6，即灰色。(b) 先放白层得到 0.6，再用 α = 1 的黑层 over 上去：1×0 + 0×0.6 = 0，结果全黑，远处的不透明背景把前景完全盖住了。这说明 over 不可交换，顺序必须正确。"}, {"q_zh": "3DGS 用前到后合成，Quark 描述的是后到前。两者输出一致吗？各自为什么这样选？", "a_zh": "数学上一致，例题已经验证。前到后可以在 T 足够小时提前终止（3DGS 在透射率将低于 10⁻⁴ 时停），适合每个像素要叠很多高斯的情况。Quark 最终只有 6 层（Quark+ 为 8 层），后到前实现简单，提前终止也省不了多少。"}, {"q_zh": "Ha 的 Eq. 4 如果去掉 α_k，只用 w_k 做权重，会怎样？", "a_zh": "空洞像素（α_k ≈ 0，𝓘_k 在那里是背景色或黑色）仍会按 w_k 参与平均，把黑色混进结果。乘上 α_k 后，没有被任何高斯覆盖的视角会自动退出该像素的平均，网络只需要学在有效候选之间信谁。"}], "prereqs": ["f-image"]}, {"id": "r-volume", "name_zh": "体渲染方程与离散化", "name_en": "The volume rendering equation & its discretization", "tldr_zh": "体渲染把场景看成一团既发光又吸收的介质。像素颜色是沿射线对“各处发出的光 × 这些光到达相机前剩下的透射率”的积分；离散化之后，它恰好就是前到后的 alpha 合成，其中 α_i = 1 − exp(−σ_i·δ_i)。", "intuition_zh": "先看发射-吸收模型。射线穿过介质时，每一小段 dt 以概率 σ(t)·dt 被“挡住”，这里体密度 σ 的单位是 1/长度；在被挡住的地方，介质发出颜色 c。从相机出发一直到 t 处都没被挡住的概率是透射率 T(t) = exp(−∫σ)。于是像素颜色等于 ∫T(t)·σ(t)·c(t) dt，其中 T·σ 是“视线恰好在 t 处第一次被挡住”的概率密度。\n\n离散化时，在射线上取样点 t_i，相邻间隔为 δ_i，并假设每段内 σ 和 c 都是常数。这一段的不透明度是 α_i = 1 − exp(−σ_i·δ_i)，前面各段的透射率连乘得到 T_i，结果正好是 alpha 合成公式。NeRF 的 Eq. 3 和 3DGS 论文 Sec. 2.3 的 Eq. 1–3 都明确指出了这种等价。权重 w_i = T_i·α_i 构成“射线第一次命中位置”的离散分布，所以可以用同一组权重求期望深度和累积不透明度，也可以按权重重采样（NeRF 的分层采样就是这么做的）。\n\n这一点之所以重要，是因为体渲染对任何 σ 都可微。优化或训练时，梯度能流到射线上所有位置，NeRF 正是靠这一点从图像中学出几何。代价是每条射线要取很多样本：NeRF 先用 64 个粗采样查询 coarse 网络，再按权重补 128 个细采样，用全部 192 个点查询 fine 网络。而真实场景的 σ 大多只是几个尖峰（表面），大量样本浪费在空旷处。\n\n分层表示可以看作体渲染的稀疏近似。MPI 用 D 个固定深度的平面作为固定的求积节点。Quark 的 LDM 让每个节点在自己的视差带内移动，相当于自适应求积；每层直接给出 α，不再经过 σ·δ，于是 6–8 层就能表示大部分表面。Quark Sec. 2.1 的说法是：层可以看作体积光线步进的步，而每层内的深度图贴合平滑表面。极限情况下，σ→∞ 的一层就是不透明表面，此时体渲染退化为 z-buffer。", "analogy_zh": "就像在起雾的夜里看一排路灯。每盏灯本身发光（c），你看到它有多亮，取决于你和它之间那段雾有多浓（透射率 T）。离散化就是把连续的雾切成一片片薄纱，每片纱的遮挡率是 α = 1 − e^{−浓度×厚度}，然后一片片叠起来看。", "equations": [{"tex": "C(\\mathbf{r}) = \\int_{t_n}^{t_f} T(t)\\,\\sigma(\\mathbf{r}(t))\\,\\mathbf{c}(\\mathbf{r}(t),\\mathbf{d})\\,dt,\\qquad T(t) = \\exp\\!\\Big(-\\int_{t_n}^{t}\\sigma(\\mathbf{r}(s))\\,ds\\Big)", "explain_zh": "连续体渲染方程（NeRF Eq. 1）。r(t) = o + t·d 是从相机中心 o 出发、方向为 d 的射线；t_n、t_f 是近/远边界；σ 是体密度，单位 m⁻¹；c 是发出的颜色，在 NeRF 中还依赖观察方向 d；T(t) 是从 t_n 到 t 一直未被遮挡的概率（透射率）。"}, {"tex": "\\hat{C} = \\sum_{i=1}^{N} T_i\\,\\alpha_i\\,\\mathbf{c}_i,\\quad \\alpha_i = 1-e^{-\\sigma_i\\delta_i},\\quad T_i = \\exp\\!\\Big(-\\sum_{j<i}\\sigma_j\\delta_j\\Big) = \\prod_{j<i}(1-\\alpha_j)", "explain_zh": "分段常数求积（NeRF Eq. 3，引自 Max 1995）。δ_i = t_{i+1} − t_i 是相邻样本的间隔，σ_i、c_i 是第 i 段内的密度和颜色，α_i 是这一段的不透明度，T_i 是到达第 i 段时的透射率。它与 r-alpha 中前到后合成的公式逐项相同。"}, {"tex": "w_i = T_i\\,\\alpha_i,\\qquad A = \\sum_i w_i = 1 - T_{N+1},\\qquad \\hat{D} = \\sum_i w_i\\,t_i,\\quad \\hat{D}_{\\text{norm}} = \\hat{D}/A", "explain_zh": "w_i 是第 i 个样本对像素的贡献权重，也可以理解为第一次命中发生在第 i 段的概率；A 是累积不透明度；D̂ 是期望深度。A < 1（射线没有被完全挡住）时，用 D̂/A 做归一化。NeRF 的分层采样把 w_i 归一化后当作分段常数 PDF，从中抽取细采样点（Sec. 5.2）。"}, {"tex": "\\mathbf{c}_{\\text{target}} = \\mathscr{O}\\Big(\\sum_{m=1}^{M}\\beta_m\\cdot\\mathscr{P}^{T}_{\\theta}(\\mathbf{I},\\mathbf{d}),\\ \\boldsymbol{\\sigma}\\Big)", "explain_zh": "Quark 的 Eq. 1，可以读成只有 L 个求积节点的体渲染。𝒪 是后到前的 over；d 是 L 层的深度，也就是节点位置，由网络在各自的等视差带内给出；σ 在 Quark 里直接就是每层的 α（sigmoid 输出），不需要再乘 δ；P^T_θ 把 M 张输入图像 I 按层深度反投影到各层，其第 m 个分量对应第 m 张输入图；β_m 是每层每像素对第 m 张输入图的混合权重（上采样后才做 softmax，Σ_m β_m = 1），给出这个节点的颜色 c_ℓ。"}], "worked_example_zh": "(1) 用体密度表示一个表面。设一个 σ = 100 m⁻¹ 的壳层厚 5 cm，起点在 t = 2.00 m，采样间隔 δ = 1 cm。每个样本的 α = 1 − e^{−1} = 0.632。五个样本的权重依次为 0.632、0.232、0.085、0.031、0.012，合计 0.993（剩余透射率 T = e^{−5} = 0.0067）。归一化期望深度 = (0.632×2.00 + 0.232×2.01 + 0.085×2.02 + 0.031×2.03 + 0.012×2.04) / 0.993 ≈ 2.005 m。连续情形下，首次命中位置的期望约在壳层前表面之后 1/σ ≈ 1 cm 处（考虑 5 cm 截断后为 2.0097 m）。离散求积把每段的贡献都记在段起点 t_i 上，所以少算了约 4 mm，这就是求积偏差，δ 越小越接近连续值。同样的内容用 LDM 表示只需一层：d ≈ 2.00 m，α = 0.993。\n\n(2) 采样量对比。NeRF 每条射线查询 coarse 网络 64 次、fine 网络 64 + 128 = 192 次，共 256 次。1080p 有 1920×1080 = 2,073,600 条射线，每帧约 5.3 亿次 MLP 查询。Quark 的最终 LDM 只有 6×288×512 = 884,736 个“层像素”，上采样 3.75 倍到 1080p 后，用约 1.3 ms 的 over 渲染器合成。\n\n(3) Quark 把求积节点放在哪里。Eq. 3–4 把第 ℓ 层限制在一个等视差带内。取 L = 6、近平面 η = 1 m、远平面 f = 10 m，视差范围 [0.1, 1.0] m⁻¹ 等分为 6 份，每份宽 0.15 m⁻¹。\n- 最近的一层 ℓ = 6：视差 [0.85, 1.0]，覆盖深度 [1.000, 1.176] m，anchor 在 1.081 m；\n- 最远的一层 ℓ = 1：视差 [0.1, 0.25]，覆盖深度 [4, 10] m，anchor 在 5.71 m。\n也就是说，近处一层只有 17.6 cm 厚，远处一层有 6 m 厚。等视差采样把节点集中在近处，这与立体视觉的规律一致：视差误差大致恒定，深度误差随距离平方增长。反过来，一个像素在同一视差带内只能表示一个表面。如果人脸和耳后的头发都落在 [1.0, 1.176] m 内，就只能用一层去近似。", "pitfalls_zh": ["混淆 σ 与 α。NeRF 的 σ 单位是 1/长度，要乘以 δ 再取 1−exp 才得到 α。Quark 的 σ 虽然叫 density，但 Sec. 3.1 说明它存的是 alpha（sigmoid 输出，取值在 [0,1]），直接用于 over，不乘任何间隔。", "把期望深度当成表面深度。遇到半透明或多峰分布时，Σw_i·t_i 会落在两个表面之间（见 r-alpha 例题中的 3.0 m）。应用里常改用中位深度或权重最大的样本；用期望深度做监督时也要留意这一点。", "最后一个间隔 δ_N 的约定。NeRF 官方实现把它设成 1e10，相当于强制射线在最后一个样本处被完全吸收，累积不透明度恒为 1。如果场景有已知的背景色（例如合成数据的白背景），或者需要输出 alpha，就要保留剩余透射率 T_{N+1}，再加上 T_{N+1}·c_bg。两种约定都可以，但训练和推理必须一致，否则背景色会被错误地混入或丢掉。", "采样太稀，会漏掉或错放薄表面。σ 很大而 δ 较大时，α 直接饱和到 1，表面位置精度只有 δ，出现台阶伪影。这正是 NeRF 分层采样的动机，也是 Quark “先用多层粗定位、再用少层贴合”的动机。"], "in_quark": {"used": true, "where": "Sec. 2.1（layers as steps of a volumetric ray march）、Sec. 3.1 Eq. 1、Sec. 3.2.3 Eq. 3–4、Sec. 1（层数由多到少的理由）、Sec. 4.2（layer collapse 消融）", "how_zh": "Quark 不做连续体渲染，但它的 LDM 要借体渲染来理解。Sec. 2.1 明确写道：质量最高的方法大多使用全体积表示和体积光线步进，擅长“像树叶那样的多重遮挡”，但慢；表面表示渲染快，但表达力弱；LDM/LM 想兼得二者，“层可以看作体积光线步进的步，而层内深度图贴合平滑表面”。\n\n因此 Eq. 1 可以读成一种离散体渲染：\n- 求积节点只有 L 个（Quark 最终 6 层，Quark+ 8 层）；\n- 节点位置由网络在各自的等视差带内学出（Eq. 3–4）；\n- 每个节点直接给出 α（σ = sigmoid(V·W_σ)）；\n- 颜色由 IBR 混合给出。\n\nSec. 1 解释了层数为什么由多到少（Quark 为 24 → 12 → 6）：多数场景的深度维最适合用少量冲激（表面）表示，早期迭代用多层密集采样来定位表面，后期用少量层贴合表面。消融显示，去掉 layer collapse（保留更多层）只让 PSNR 从 30.41 升到 30.56，运行时间却增加 115%，说明少数自适应节点已经够用。"}, "in_ha": {"used": true, "where": "Sec. 3.1（3DGS 光栅器与累积不透明度）、附录 A.3；与 Sec. 3.2 的 TSDF（表面，而非密度）对照", "how_zh": "Ha 没有体密度场，但在两个地方与体渲染相关。(1) 它用的 3DGS 光栅器就是体渲染求积的前到后形式，3DGS 论文 Sec. 2.3 的 Eq. 1–3 明确说二者成像模型相同。Ha 把每个高斯的不透明度设为 1，中心处 α 被截到 0.99，体渲染因此退化成一个带软边的 z-buffer，输出的累积不透明度 α_k = 1 − T 只起覆盖掩码的作用。(2) 它的几何是 TSDF 的零等值面，用光线步进求根得到（见 r-raymarch），而不是对密度做积分。这正是“表面方法”和“体方法”的根本区别：表面方法每条射线只返回一个深度，表达不了半透明和头发这类体积效应。\n\n两篇锚点论文共同的比较基线 ENeRF 是一种可泛化 NeRF：它用一张带厚度的深度图引导采样，只在单个表面附近取少量样本做体渲染。读懂它需要完整的体渲染知识。"}, "in_field_zh": "(1) Neural Volumes、MVP（Lombardi 等，Meta Codec Avatars 一系）用体渲染表示人头，能处理头发这类半透明结构，是高保真数字人临场的一条主线。(2) 可泛化 NeRF（ENeRF、IBRNet 等）是两篇锚点论文的直接基线，它们的速度瓶颈就在每条射线的采样数。(3) 3DGS 系列（包括前馈 3DGS 和 4D 高斯）的渲染公式与体渲染的离散求积相同，理解 T 和 w 才能看懂其中的深度/法线渲染和各种正则项。(4) 期望深度常被当作其他模块的几何代理，例如给重投影或 TSDF 融合提供深度，要注意它在边缘处会“浮空”。", "resources": [{"title": "Volume Rendering Digest (for NeRF) (Tagliasacchi & Mildenhall, 2022)", "url": "https://arxiv.org/abs/2209.02417", "type": "tutorial", "note_zh": "从概率角度推导透射率、分段常数求积，以及它与 alpha 合成的等价性。篇幅短，是这个概念最好的单篇读物。CMU 16-825 Fall 2026 的 Volume Rendering 一讲也把它列为阅读材料。"}, {"title": "NeRF: Representing Scenes as Neural Radiance Fields for View Synthesis (Mildenhall et al., ECCV 2020)", "url": "https://arxiv.org/abs/2003.08934", "type": "paper", "note_zh": "读 Sec. 4（Eq. 1–3：连续体渲染与求积）和 Sec. 5.2（分层采样，把 w_i = T_i·(1−exp(−σ_i·δ_i)) 当作分段常数 PDF；fine 网络在全部 N_c + N_f 个点上求值）。Sec. 5.3 给出 N_c = 64、N_f = 128。"}, {"title": "Optical Models for Direct Volume Rendering (Nelson Max, IEEE TVCG 1995)", "url": "https://courses.cs.duke.edu/spring03/cps296.8/papers/max95opticalModelsForDirectVolumeRendering.pdf", "type": "paper", "note_zh": "NeRF Eq. 3 引用的经典综述，系统比较了纯吸收、纯发射、发射加吸收、单次散射、多次散射等光学模型。读完就明白被积函数为什么是 T·σ·c。"}, {"title": "Physically Based Rendering 4th ed., §11.2 Transmittance", "url": "https://pbr-book.org/4ed/Volume_Scattering/Transmittance", "type": "book", "note_zh": "从物理渲染的角度讲透射率的定义、Beer–Lambert 定律和透射率的估计方法。想继续深入可以读 §14.1 The Equation of Transfer。"}], "self_check": [{"q_zh": "某样本 σ = 20 m⁻¹、δ = 5 cm，求 α。如果把同一段拆成两个 δ = 2.5 cm 的样本（σ 不变），合成后的总不透明度是多少？", "a_zh": "α = 1 − e^{−1} = 0.632。拆开后每个样本 α' = 1 − e^{−0.5} = 0.393，总不透明度为 1 − (1 − 0.393)² = 1 − e^{−1} = 0.632，与不拆时相同。指数形式保证离散化结果不受切分方式影响；如果直接把 σ·δ 当作 α，就没有这个性质。"}, {"q_zh": "为什么说 Quark 的 LDM 是体渲染的稀疏自适应近似？什么情况下它会失效？", "a_zh": "每层相当于一个求积节点，节点深度由网络在自己的视差带内决定（Eq. 3–4），α 直接预测；表面稀疏时，少量节点就够了。失效有两种情况：同一像素在同一视差带内有两个需要区分的表面（细密的多重遮挡，如树叶、头发、网格），或者存在真正的体积效应（烟、半透明），需要很多节点。这时就需要更多层（Quark+ 用 8 层），或者改用体表示。"}, {"q_zh": "给定权重 w = (0.1, 0.1, 0.8)、对应深度 (1, 2, 3) m，求期望深度和中位深度。哪个更适合当作表面深度？", "a_zh": "期望深度 = 0.1 + 0.2 + 2.4 = 2.7 m。累积权重依次为 0.1、0.2、1.0，第一次越过 0.5 的是第 3 个样本，所以中位深度是 3 m。中位深度（或权重最大的样本）更接近真实表面的 3 m，期望深度被前面两个弱响应拉近了。"}], "prereqs": ["r-alpha"]}, {"id": "r-raymarch", "name_zh": "光线步进、球面追踪与隐式表面求交", "name_en": "Ray marching, sphere tracing & implicit surface intersection", "tldr_zh": "光线步进就是沿射线一步步查询一个场（密度或符号距离）。对 SDF，可以把当前的距离值当作安全步长（球面追踪）；检测到符号变化后，再用二分把零交叉（表面）定准。Ha 的 TSDF 深度就是这样求出来的。", "intuition_zh": "很多三维表示不会直接告诉你射线在哪里碰到表面，只提供一个可以在任意点查询的函数：体密度 σ(x)、占用概率，或者符号距离 f(x)（表面外为正、内为负，零等值面就是表面）。通用的求交办法是沿射线 p(t) = o + t·d，从近边界 t_near 一路走到远边界 t_far，边走边查询。对密度场，这就是 r-volume 中的采样求积；对 SDF，要找的是第一个零交叉。\n\n固定步长很浪费：步长大了会跨过薄物体，步长小了又要在空旷处走很多步。球面追踪（Hart 1996）的关键观察是：如果 f 是真正的距离函数，或者满足 Lipschitz 常数为 λ 的界，那么 f(p) 的值说明以 p 为球心、半径 f(p)/λ 的球内没有表面，可以放心往前走这么远。离表面远时步子大，靠近表面时步子自动变小。\n\nTSDF 里的“距离”并不是真正的欧氏距离。KinectFusion、Starline 和 Ha 用的都是投影式距离：把点投到某个输入相机，比较它的 z 与该相机测到的深度，差值是沿该相机光轴方向量出的距离。对倾斜表面，这个值与“沿目标射线到表面的距离”可以相差很大，常常偏大；再加上截断（clamp 到 ±τ），离表面较远处的值会饱和。所以不能放心地按 s 走满一步。Starline 和 Ha 乘了一个 0.8 的系数（两篇论文都没有解释它的来由，可以理解为保守系数）。走到 s 变号，说明已经越过表面，再在最后这段区间 [t_a, t_b] 内做几次二分（每次区间减半），把交点定准。\n\n近/远边界决定要走多少步。离表面较远时 s 饱和在 Σω·τ，每步最多 0.8·Σω·τ（Σω = 1 时是 1.6 cm）；从 0.3 m 走到 2 m 处的人身上，要走上百步。Starline 的做法是先用点溅射把输入深度光栅化到低分辨率的目标视角，做 2D min/max 滤波并略微膨胀，得到每条射线保守的 [下界, 上界]，只在这个区间里步进。", "analogy_zh": "像蒙着眼在黑屋里朝墙走。每迈一步之前，有人告诉你“离障碍物大概还有多远”，你先走那段距离的 80%，留点余量，因为这个“距离”可能报多了。一旦发现自己已经“穿墙”（距离变号），就退回半步、再调半步……三次之后，墙的位置就定到了最后那一步长度的 1/8 以内。", "equations": [{"tex": "\\mathbf{p}(t) = \\mathbf{o} + t\\,\\mathbf{d},\\quad t\\in[t_{\\text{near}},\\, t_{\\text{far}}],\\qquad t_{k+1} = t_k + \\frac{f(\\mathbf{p}(t_k))}{\\lambda}", "explain_zh": "o 是相机中心，d 是目标像素的单位射线方向，t 是沿射线的距离，t_near、t_far 是搜索区间。f 是 SDF，λ 是它的 Lipschitz 常数（真正的 SDF 有 λ = 1）。只要 f 满足 |f(a) − f(b)| ≤ λ·|a − b|，按这个步长前进就不会穿过表面，这就是球面追踪。"}, {"tex": "s_k = D_k[u_k, v_k] - z_k,\\qquad s(\\mathbf{p}) = \\sum_{k=1}^{K}\\omega_k\\,\\mathrm{clamp}(s_k,-\\tau,\\tau),\\qquad \\omega_k = \\min\\!\\Big(\\frac{0.001}{\\sigma_k},\\,1\\Big)", "explain_zh": "image-based TSDF，这里按 Starline 的语义（点在表面前方时 s_k > 0），写成 z 朝前为正的形式。(x_k, y_k, z_k) = K_k(R_k·p + t_k) 是点 p 在输入相机 k 中的齐次像素坐标（这里的 K_k 是内参矩阵，别和视角数 K 混淆），u_k = x_k/z_k、v_k = y_k/z_k，z_k 是 p 在相机 k 中的深度；D_k 是相机 k 的深度图，方括号表示在 (u_k, v_k) 处采样。τ = 0.02 m 是截断距离。ω_k 是置信权重：σ_k = √(ν_k/49)，ν_k 是 7×7 邻域内各像素深度与中心深度之差的平方和，每项截断到 τ²（Ha Eq. 11–12）。深度以米计时，σ_k ≤ 1 mm 才能得到满权重 1；σ_k = 5 mm 时 ω_k = 0.2。点投不进相机 k 的视锥时，令 ω_k = 0；s_k < −τ（点远在表面后方）时也令 ω_k = 0，以免过度挖空（overcarving）。注意，Starline 正文和 Ha Eq. 10 写的都是加权和，没有除以 Σω。Ha A.1 Eq. 9 把 s_k 写成 z_k − D_k，见陷阱 1。"}, {"tex": "t_{k+1} = t_k + 0.8\\, s(\\mathbf{p}(t_k)) \\quad \\text{until}\\ \\ \\operatorname{sign} s(\\mathbf{p}(t_{k+1})) \\neq \\operatorname{sign} s(\\mathbf{p}(t_k))", "explain_zh": "Starline 和 Ha 的步进规则：以 0.8·s 为步长前进，直到 s 变号。若表面附近 s ≈ Σω·g·(t* − t)（g 是投影距离相对沿射线距离的放大系数），则当 0.8·Σω·g > 1 时，一步就会越过表面；否则 s 只会从一侧逼近表面，永远不变号。"}, {"tex": "m = \\tfrac{a+b}{2},\\quad [a,b] \\leftarrow \\begin{cases}[a,m] & \\operatorname{sign}s(m)\\neq\\operatorname{sign}s(a)\\\\ [m,b] & \\text{otherwise}\\end{cases},\\qquad |b-a|_{n} = \\frac{|b-a|_{0}}{2^{n}}", "explain_zh": "二分细化。[a, b] 是最后一步前后两点构成的变号区间，m 是中点；n 次二分后，区间宽度缩小为原来的 1/2^n。Ha 用 n = 3，即缩小 8 倍。另一种做法是线性插值（regula falsi）：t* ≈ a − s(a)·(b − a)/(s(b) − s(a))，KinectFusion（Eq. 15）等体素 TSDF 的 raycasting 实现就用它来近似零交叉。"}], "worked_example_zh": "设目标射线上的真实表面在 t* = 1.500 m 处，表面附近每个相机的投影距离近似为 s_k(t) = g·(t* − t)（Starline 语义，表面前方为正）。截断 τ = 0.02 m。\n\n情形 A：Σω = 1，g = 1.5，即表面倾斜，投影距离把沿射线的距离放大了 50%。\n- 从 t0 = 1.400 出发，s = clamp(0.15) = 0.02，步长 0.016。\n- 依次到达 t = 1.416、1.432、1.448、1.464、1.480。在这些点上 1.5·(1.5 − t) 都不小于 0.03，被截断为 0.02，所以步长一直是 0.016。\n- 到 1.496 时 s = 1.5×0.004 = 0.006，步长 0.0048，到达 t = 1.5008，此时 s = −0.0012，变号。\n- 变号区间为 [1.496, 1.5008]，宽 4.8 mm。\n\n三次二分：\n- m = 1.4984，s = +0.0024，区间变为 [1.4984, 1.5008]；\n- m = 1.4996，s = +0.0006，区间变为 [1.4996, 1.5008]；\n- m = 1.5002，s = −0.0003，区间变为 [1.4996, 1.5002]。\n最终区间宽 0.6 mm（= 4.8/8），取中点 1.4999 m，误差 0.1 mm。整个过程是 7 次前进（8 次 TSDF 求值）加 3 次二分，每次求值都要查 K = 4 张深度图。\n\n情形 B：Σω = 1，g = 1，即投影距离恰好等于沿射线的距离。到 1.496 之后，每一步都把剩余距离乘以 (1 − 0.8) = 0.2：0.004 → 0.0008 → 0.00016……s 永远不会变号，只会从一侧无限逼近表面。所以实际实现还需要 |s| < ε 或最大步数这样的终止条件，论文没有写。Σω = 1 时，只有 g > 1/0.8 = 1.25，一步才会越过表面。\n\n情形 C：Σω = 4（4 个相机都拿到满权重），g = 1，严格按“加权和”实现。\n- 远处 s 饱和在 4×0.02 = 0.08，步长 6.4 cm：1.400 → 1.464 → 1.528。\n- 到 1.528 时每个 s_k = −0.028 < −τ，4 个权重全部置 0，s = 0，落进“无信息区”。\n- 如果实现把 s ≤ 0 当作变号，就在 [1.464, 1.528] 上二分三次：1.496（s = +0.016）→ 1.512（s = −0.048）→ 1.504（s = −0.016），最后区间 [1.496, 1.504] 宽 8 mm，精度比情形 A 差一个数量级。\n- 如果实现只认 s < 0，射线就停在 s = 0 处不动。\n按同样的线性模型可以推出：用加权和时，只有 0.8·Σω·g ≤ 2，才能保证一步不会越过表面超过 τ。把 s 归一化成加权平均（Starline 图 8 的图注正是这么描述的）不改变零交叉的位置，却把条件放宽到 g ≤ 2.5。", "pitfalls_zh": ["符号约定。Starline 原文的做法是用点在深度相机坐标中的 z 减去 d_j 得到 s_j，并声明 s_j > 0 当且仅当点位于该相机看到的最前表面之前；s_j < −T 时权重置零，以防过度挖空（沿用 Curless & Levoy）。“z − d 为正即在表面前方”只有在相机看向 −z 的 OpenGL 式约定下才自洽（这是推断，原文没有说明坐标约定）。Ha 的 A.1 把同一个式子 s_k = z_k − D_k 搬进了用 u = x/z 取像素坐标、z 朝前为正的约定，语义随之反转，变成表面前方 s < 0。照字面实现会出两个问题：射线起点在表面前方远处时，所有 s_k < −τ，ω_k 全为 0，s = 0，步长为 0，射线原地不动；进入截断带后 s < 0，0.8·s 又让射线往回走。所以字面写法不可能是作者的实际实现，应取 s_k = D_k − z_k。KinectFusion 论文 Eq. 6 的印刷写法 λ⁻¹‖t − p‖ − R_k(x) 同样与它正文里“自由空间为正”的描述相反，可见这类符号笔误在 TSDF 文献中很常见，务必对照文字描述自行核对。", "投影距离不等于沿射线的距离。在倾斜表面上，投影 TSDF 常常高估到表面的距离，按满步长走会越过表面；离表面较远时，s 饱和在 ±τ，步长上限被 τ 卡死。", "加权和还是加权平均。Ha Eq. 10 和 Starline 正文的 s = Σω·clamp(s_k) 没有归一化，Starline 图 8 的图注却说是 weighted average。两种写法的零交叉位置相同，但步长相差 Σω 倍。Σω = 4 时一步可达 6.4 cm，可能直接跨过比步长还薄的结构（手指、眼镜框），也可能落到所有 ω_k = 0 的无信息区（例题情形 C）；Σω 很小时，步子又极小，步数暴增。实现时建议归一化，并把 Σω = 0 单独当作“未知”处理，不能当成 s = 0 的表面。", "近/远边界、起点和实现细节。Ha 没有给出射线的 near/far 和起点。边界设得太近会漏掉相机前方的物体，设得太远则步数过多；Starline 用光栅化得到的逐射线 min/max 区间解决这个问题。点投不进某个相机的视锥时，必须令该相机的 ω = 0。另外，Ha Eq. 11–12 把 ω_k 写成在投影位置实时计算 7×7 邻域的形式；Starline 则为每个深度像素预先算好权重图。实时实现应当预计算，否则每次求值都要多读 49 个深度值。"], "in_quark": {"used": false, "where": "不使用；相关表述见 Sec. 2.1、Sec. 2.2、Sec. 3.2.2、Sec. 4.1", "how_zh": "Quark 刻意避开了光线步进。Sec. 3.2.2 说，渲染到输入视角时用双线性 splat，理由是 “Splatting avoids expensive ray tracing or rasterization”；最终渲染也只是逐像素的 over 合成。不过，理解光线步进有助于读懂几处：\n(1) Sec. 2.1 把 LDM 的层解释为“体积光线步进的步”，相当于每条射线只走 L 步（最终 6 层），而且每步的位置由网络学出；\n(2) Sec. 2.2 说 ENeRF 靠“只在单个表面附近采样”来加速 ray march，Quark 在 1024×768 下比它快 6 倍以上（32.2 ms 对 205 ms）；这个速度差的一部分可以从“不做逐射线采样”来理解，但论文本身没有做这样的归因；\n(3) Sec. 4.1 在 DL3DV 上与逐场景方法比较时指出，NeRF 类方法（Instant-NGP、Zip-NeRF 等）的斑点伪影是 ray march 渲染常见的副作用。"}, "in_ha": {"used": true, "where": "Sec. 3.2 Eq. 3（𝒟^t = Raymarch(TSDF(·))）、附录 A.1 Eq. 9–12、A.2 Eq. 13–14、表 4（TSDF 6 ms）、图 9", "how_zh": "Ha 的第二阶段就是光线步进。对目标视角的每条射线，在点 p 处把 p 投到 K = 4 个输入视角，按 Eq. 9–10 求截断到 τ = 0.02 m 的加权 TSDF 值 s，权重按 Eq. 11–12 由 7×7 邻域的深度起伏决定。然后按 A.1 的描述，“以 0.8·s 为步长前进，直到 s 变号、表明检测到表面交点，再做三步二分搜索细化交点深度”。这一过程几乎逐字照搬 Starline：不建体素网格，用自定义 CUDA 实现，在 DyNeRF（1352×1014）上 TSDF 加步进共 6 ms。A.2 还把上一帧的目标深度 𝒟^{t−1} 作为额外的一路输入并入 Eq. 10。得到的 𝒟^t 既是后续融合网络的几何引导，也是 L_Depth 的监督目标。\n\n论文有几处没有交代：射线的 near/far 与起点（Starline 用光栅化得到逐射线区间）；s 一直不变号时怎样终止；s 是否归一化。A.1 的符号写法也与 Starline 的语义相反（见陷阱 1）。图 9 显示，高光区域深度出错时，TSDF 求出的零交叉也跟着出错，导致 EPI 断裂。"}, "in_field_zh": "(1) KinectFusion、DynamicFusion、Fusion4D、Holoportation 等实时重建和临场系统，都靠对 TSDF 体素做 raycasting 得到预测深度，用于跟踪和渲染。(2) Project Starline 每帧做 6 次 raycast（4 张 shadow map 加左右眼 2 个视角）。在 Titan RTX 上，体素融合方案总共要 10.0 ms，加上光栅化求区间后降到 4.3 ms，改用 image-based 融合后只要 1.5 ms，而每帧预算是 16.6 ms。(3) IDR 等神经 SDF 方法用球面追踪求射线与表面的交点；NeuS、VolSDF 则把 SDF 转换成密度做体渲染训练，但在提取表面或做快速渲染时仍可以用球面追踪。基于 SDF 的数字人也常用它。(4) 光线步进的步数，以及相邻射线之间步数的差异（线程发散），直接决定 GPU 上的延迟抖动，这就是实时系统必须求搜索区间并提前终止的原因。", "resources": [{"title": "Sphere Tracing: A Geometric Method for the Antialiased Ray Tracing of Implicit Surfaces (John C. Hart, The Visual Computer 1996)", "url": "https://graphics.stanford.edu/courses/cs348b-20-spring-content/uploads/hart.pdf", "type": "paper", "note_zh": "球面追踪的原始论文：用距离界（Lipschitz 常数）保证步进不会穿过表面，并给出了多种基本图元及其组合的距离界。"}, {"title": "Project Starline: A High-Fidelity Telepresence System (Lawrence et al., ACM TOG 40(6), 2021)", "url": "https://hhoppe.com/starline.pdf", "type": "paper", "note_zh": "读 Sec. 4.6 Rendering 中的 “Raycasting for geometry fusion”：image-based TSDF、符号约定、0.8·s 步进加三步二分、置信权重 min(0.001/σ, 1)、用光栅化求逐射线搜索区间，以及体素方案与图像方案的计时对比。Ha 的附录 A.1 几乎逐字沿用了这一节。"}, {"title": "KinectFusion: Real-Time Dense Surface Mapping and Tracking (Newcombe et al., ISMAR 2011)", "url": "https://www.microsoft.com/en-us/research/wp-content/uploads/2016/02/ismar2011.pdf", "type": "paper", "note_zh": "经典的实时体素 TSDF 融合与 raycasting：在截断带内步进、用 Eq. 15 对零交叉做线性插值、跳过空区域。读它能看清体素版与 Starline 图像版的区别。顺便对照它 Eq. 6 的印刷符号和正文“自由空间为正”的描述，体会 TSDF 符号约定有多容易出错。"}, {"title": "Inigo Quilez: distance functions", "url": "https://iquilezles.org/articles/distfunctions/", "type": "tutorial", "note_zh": "各种基本体的 SDF 公式和组合操作。配合 Shadertoy 自己写一个 sphere tracer，是建立直觉最快的办法。"}], "self_check": [{"q_zh": "为什么 Starline 和 Ha 用 0.8·s 而不是 1.0·s 作为步长？这个系数在什么条件下会导致“永不变号”或“一步越过”？", "a_zh": "论文没有解释 0.8。合理的理解是：投影 TSDF 是沿输入相机光轴量的，在倾斜表面上常常高估沿射线的距离（例题中 g = 1.5），按满步长走可能越过表面，甚至越过整个截断带，所以取 0.8 更保守。设 s ≈ Σω·g·(t* − t)：当 0.8·Σω·g ≤ 1（Σω = 1 时即 g ≤ 1.25）时，s 永远不变号，只从一侧逼近，需要额外的 |s| < ε 或最大步数来终止；当 0.8·Σω·g > 1 时，一步就会越过表面，靠变号检测加二分来补救。"}, {"q_zh": "三次二分后区间缩小多少？如果变号前最后一步长 4.8 mm，最终误差上界是多少？如果最后一步长 6.4 cm 呢？", "a_zh": "缩小 2³ = 8 倍。4.8 mm 时最终区间宽 0.6 mm，取中点的误差不超过 0.3 mm。6.4 cm（例题情形 C，Σω = 4 的未归一化加权和）时区间还剩 8 mm，误差上界 4 mm。所以步长上限直接决定了三次二分能达到的精度。"}, {"q_zh": "Ha 的 A.1 写 s_k = z_k − D_k，同时规定 s_k < −τ 时 ω_k = 0。在 z 朝前为正的 OpenCV 约定下，照字面实现会发生什么？应该怎样实现？", "a_zh": "z_k 是点在相机 k 中的深度，z_k < D_k 表示点在观测表面前方，此时 s_k < 0。照字面实现会有两个后果。第一，射线起点在表面前方远处时，所有 s_k < −τ，权重全为 0，s = 0，步长为 0，射线原地不动。第二，即使进入截断带，s < 0 也会让射线往回走。同时，被丢掉的是表面前方的自由空间证据，远在后方（被遮挡、不可知）的点反而保留了权重，恰好与 Curless & Levoy 和 Starline“防止过度挖空”的本意相反。应按 Starline 的语义取 s_k = D_k − z_k（表面前方为正），在 s_k < −τ（远在后方）时置零。"}], "prereqs": ["d-tsdf", "g-pinhole"]}, {"id": "r-appearance", "name_zh": "反射模型、视角相关外观与光照", "name_en": "Reflectance, view-dependent appearance & lighting", "tldr_zh": "表面颜色等于入射光乘以材质的反射分布（BRDF），再在半球上积分。漫反射（Lambertian）与视角无关；高光和菲涅尔反射随视角剧烈变化。这就是多视角图像里同一点颜色不一致、IBR 出现重影、立体匹配在高光处失败的根源。", "intuition_zh": "相机测到的是出射辐亮度 L_o(x, ω_o)。来自各个方向的入射光 L_i 按材质的 BRDF f_r(ω_i, ω_o) 反射到观察方向，还要乘上入射角的余弦，因为斜射的光摊在更大的面积上。BRDF 相当于材质的指纹。Lambertian（理想漫反射）的 f_r 是常数 ρ/π，从任何方向看都一样亮。镜面或光泽材质的 f_r 集中在镜面反射方向附近，高光只在特定视角出现，并且会随观察者移动在表面上滑动。\n\n再看菲涅尔效应。电介质在正对着看时只反射约 2%–4% 的光：按 F_0 = ((n−1)/(n+1))² 计算，水（n ≈ 1.33）约 0.02，折射率约 1.4 的皮肤约 0.028，塑料和玻璃（n ≈ 1.5）约 0.04。到了掠射角，反射率会急剧上升。所以人脸轮廓边缘、眼睛里的高光和皮肤油光都强烈依赖视角。真实的人脸还有次表面散射（光透进皮肤再出来），简单的 BRDF 描述不了。\n\n这对多视角方法有三重影响。(a) 立体匹配和 MVS 假设同一点在各视角颜色相同（光度一致性），高光违反了这一假设，匹配到的其实是光源的虚像，深度因此出错。(b) IBR 把多个输入视角的颜色做凸组合，结果只能落在输入颜色的范围内，无法生成任何输入都没拍到的高光峰值；高光在两个视角中位置不同时，还会混出两个半亮的高光（重影）。(c) 除了物理原因，相机本身也会造成颜色不一致：曝光、白平衡、增益、暗角各不相同。这类“伪视角相关”同样会让 IBR 出现接缝和闪烁。\n\n神经渲染里常用的视角相关颜色模型有三种。NeRF 把方向 d 作为 MLP 的输入。3DGS 用球谐函数（SH）把颜色写成方向的低阶球面函数，3 阶 SH 每个通道 16 个系数；训练时先只优化 0 阶，每 1000 次迭代加一个频带，直到 4 个频带全部启用（3DGS Sec. 7.1）。Ref-NeRF 则显式地用反射方向来参数化。重光照（relighting）更进一步，要把几何、材质和光照拆开，才能让远端人物在本地光照下重新着色，这是临场系统里让人物“融入环境”的难题。", "analogy_zh": "Lambertian 表面像一张磨砂纸，从哪边看都一样灰。光泽表面像一把抛光的金属勺子，光斑会随着你的脑袋移动在勺面上滑动。IBR 做凸组合，相当于把从两个位置拍的勺子照片叠在一起取平均：你看到的是两个半亮的光斑，而不是中间那一个。", "equations": [{"tex": "L_o(\\mathbf{x},\\omega_o) = L_e(\\mathbf{x},\\omega_o) + \\int_{\\Omega} f_r(\\mathbf{x},\\omega_i,\\omega_o)\\,L_i(\\mathbf{x},\\omega_i)\\,(\\mathbf{n}\\cdot\\omega_i)\\,d\\omega_i", "explain_zh": "反射方程（渲染方程中的局部反射部分）。x 是表面点，n 是它的单位法线，ω_o 是指向观察者的方向，ω_i 是入射方向，Ω 是法线一侧的半球。L_e 是自发光，L_i 是入射辐亮度，f_r 是 BRDF（单位 sr⁻¹），n·ω_i 是入射角余弦。相机像素值近似等于 L_o 经过相机响应映射后的结果。"}, {"tex": "f_r = \\frac{\\rho}{\\pi}\\ \\Rightarrow\\ L_o = \\frac{\\rho}{\\pi}\\,E,\\qquad E = \\int_{\\Omega} L_i(\\omega_i)\\,(\\mathbf{n}\\cdot\\omega_i)\\,d\\omega_i", "explain_zh": "Lambertian 表面。ρ ∈ [0,1] 是反照率（albedo），E 是辐照度，即到达该点的总入射光。此时 L_o 与 ω_o 无关，所有相机看到的颜色相同（忽略相机之间的差异）。立体匹配的光度一致性假设，以及 IBR 可以任意混合输入颜色，都依赖这一点。"}, {"tex": "L_{\\text{spec}} \\propto k_s\\,(\\mathbf{n}\\cdot\\mathbf{h})^{p},\\quad \\mathbf{h} = \\frac{\\omega_i+\\omega_o}{\\lVert\\omega_i+\\omega_o\\rVert},\\qquad F(\\theta) = F_0 + (1-F_0)(1-\\cos\\theta)^5", "explain_zh": "Blinn–Phong 高光与 Schlick 菲涅尔近似。h 是入射方向与观察方向的半程向量；p 是光泽指数，越大高光越尖锐；k_s 是高光强度。F(θ) 是反射率，θ 是观察方向与法线（微表面模型中为与 h）的夹角；F_0 是正入射时的反射率，对折射率 n 有 F_0 = ((n−1)/(n+1))²，n = 1.5 时约为 0.04。"}, {"tex": "\\mathbf{c}(\\mathbf{d}) = \\sum_{l=0}^{3}\\sum_{m=-l}^{l} \\mathbf{k}_{lm}\\,Y_{lm}(\\mathbf{d})", "explain_zh": "用球谐函数表示视角相关颜色（3DGS 的做法）。d 是单位观察方向，Y_lm 是 l 阶 m 次的实球谐基函数（例如 Y_00 = 1/(2√π) ≈ 0.2821 为常数，l = 1 的三项与方向分量成线性关系），k_lm 是每个颜色通道的系数。l 取 0 到 3，每个通道 16 个系数，每个高斯共 48 个。阶数决定了能表示的视角变化频率上限。"}], "worked_example_zh": "(1) Quark 的相机几何。输入相机最远相距约 30 cm，被摄物在 1.5 m 处，两台相机对同一点的视线夹角约为 2·atan(0.15/1.5) = 11.4°。光源方向不变时，半程向量 h 相应转过约 5.7°。\n\n(2) 高光强度。设颜色 = 0.3（漫反射）+ 0.7·(n·h)^100（光泽高光）。\n- 相机 A 恰好在高光峰值：0.3 + 0.7×1 = 1.0。\n- 相机 B 的 h 偏了 5.71°：(cos 5.71°)^100 = e^{100·ln 0.99504} ≈ 0.608，颜色为 0.3 + 0.7×0.608 = 0.726。\n- 两者正中间的目标视角，h 偏 2.86°：(cos 2.86°)^100 ≈ 0.883，真值为 0.918。\n\n(3) 凸组合。\n- 等权 0.5/0.5 得 0.863，误差 0.055（约 14/255）。\n- 如果权重偏向 A，取 w_A = 0.70，得 0.70×1.0 + 0.30×0.726 = 0.918，恰好等于真值。这就是 Quark 说的“逐帧、针对目标视角优化 blend weights，可以令人信服地复现部分反射”。\n- 但如果目标视角正好落在高光峰值，而两个输入都偏离 5.7°（颜色都是 0.726），任何凸组合都只能得到 0.726，高光直接消失。凸组合不能外推。\n\n(4) 菲涅尔（Schlick 近似，F_0 = 0.04）。\n- 正视时 F = 0.04；\n- 视线与法线成 60° 时，F = 0.04 + 0.96×0.5⁵ = 0.07；\n- 成 80° 时，(1 − 0.174)⁵ = 0.385，F = 0.04 + 0.96×0.385 = 0.41。\n人脸轮廓处的反射率约为正面的 10 倍，这是侧脸和边缘在不同相机里颜色差异大的原因之一。", "pitfalls_zh": ["把多视角颜色差异全部归因于材质。相机之间的曝光、白平衡、增益、暗角差异同样会表现为“视角相关”，而且无法用任何 BRDF 解释。实际系统必须先做颜色标定；Quark 自己也提到（Sec. 4.1、4.3），输入曝光差异会造成边缘伪影和闪烁。", "以为学出来的 blend weights 能表示任意视角相关效果。凸组合 Σβ_m·c_m 的结果被限制在输入颜色的凸包内，外推不出任何输入都没拍到的高光。", "忽略高光对几何的破坏。光度一致性失效 → 立体深度出错（匹配到反射虚像）→ 基于深度的 TSDF 和 warping 全部跟着错。这种错误比单纯的颜色偏差更难补救，见 Ha 图 9。", "SH 阶数与频率不匹配。3 阶 SH 只能表示较平滑的视角变化，(n·h)^100 这样尖锐的高光需要高得多的阶数；低阶 SH 会把高光“摊平”成一种随视角缓慢变化的发光。"], "in_quark": {"used": true, "where": "Sec. 1（逐视角重建有利于反射/折射材质）、Sec. 3.2.1（射线方向编码）、Sec. 4.1（Fig. 5 的反射/折射物体；曝光差异引起闪烁）、Sec. 4.2（射线编码消融）、Sec. 4.3（局限）；Table 1 中的 Shiny", "how_zh": "Quark 没有显式的反射模型，视角相关外观全靠两件事来“近似”。(1) 表示是针对每个目标视角即时生成的，blend weights 可以对这一个视角“过拟合”。Sec. 1 说，这“尤其有助于含反射和折射材质的场景，而 LDM 表示本身并不显式建模这些材质”。(2) 射线方向编码 γ 让网络偏向离目标视角近的输入射线，Sec. 3.2.1 说这改善了反射和非 Lambertian 表面的结果。\n\nSec. 4.3 明确承认了局限：每像素颜色是输入颜色的凸组合，blend weights 无法准确表示视角相关材质；并把 NeX、Ref-NeRF 那样的显式视角相关建模列为未来工作。数据上，在 1024×768 的 Shiny（视角相关很强的数据集）上，Quark 为 26.51 dB，ENeRF 为 25.75 dB，GPNR 为 25.98 dB；去掉射线编码只让 PSNR 从 30.41 降到 30.32。另外，Sec. 4.1 和 4.3 指出，输入曝光差异大时会出现闪烁和边缘伪影，这属于相机层面的“伪视角相关”。"}, "in_ha": {"used": true, "where": "Sec. 4.6 与图 9（高光处失败）、Sec. 3.3 与附录 A.4（相机和角度特征）", "how_zh": "Ha 的主要局限，正是外观问题引发的几何问题。Sec. 4.6 指出，方法强依赖准确的几何，在“深度通常很差的高光区域”会失败：融合网络对单帧仍能给出合理结果，但视角一致性和时间一致性被破坏，EPI 出现断裂（图 9）。根源是 RAFT-Stereo 依赖的光度一致性假设在高光处不成立。\n\n视角相关性只能靠融合网络对 K 个观测颜色重新加权。A.4 中给网络的相机特征里，“输入射线与 TSDF 法线的点积”对应 BRDF 中的 n·ω，“输入射线与目标方向的点积”和“输入与目标视线方向的点积”对应视角差。Starline 用“表面法线与相机方向夹角余弦的平方”来调制混合权重，Ha 的思路相同，只是交给网络去学。由于结果仍是加权平均，高光同样受“不能外推”的限制。"}, "in_field_zh": "(1) 眼神交流：角膜上的高光（catchlight）和眼白的湿润反射对真实感极其敏感，而它们正是强视角相关的。(2) 皮肤的油光和次表面散射、头发的各向异性高光，都是临场系统的典型难点。(3) 多相机颜色标定：各相机的曝光、白平衡和响应曲线必须统一，否则 IBR 会出现接缝和闪烁，两篇锚点论文都受此影响。(4) 重光照：把远端人物放进本地 AR 场景时，需要按本地光照重新着色（Google 的 Total Relighting 属于这类工作），前提是能把 albedo、法线和光照拆开。(5) 显示端：光场屏和裸眼 3D 屏要为每个视角正确呈现高光，否则视差感和材质感会冲突。", "resources": [{"title": "Physically Based Rendering 4th ed., Ch. 9 Reflection Models", "url": "https://pbr-book.org/4ed/Reflection_Models", "type": "book", "note_zh": "读 §9.1 BSDF Representation、§9.2 Diffuse Reflection、§9.3 Specular Reflection and Transmission（菲涅尔方程）、§9.6 Roughness Using Microfacet Theory。需要辐射度量基础的话，先读 §4.3 Surface Reflection。"}, {"title": "Szeliski, Computer Vision: Algorithms and Applications 2nd ed., §2.2 Photometric image formation", "url": "https://szeliski.org/Book/", "type": "book", "note_zh": "从计算机视觉的角度讲光照（2.2.1）、反射与着色（2.2.2：BRDF、漫反射、镜面反射、Phong 模型）以及光学成像（2.2.3）。篇幅短，适合入门。官网可免费下载 PDF。"}, {"title": "An Efficient Representation for Irradiance Environment Maps (Ramamoorthi & Hanrahan, SIGGRAPH 2001)", "url": "https://graphics.stanford.edu/papers/envmap/", "type": "paper", "note_zh": "证明 Lambertian 表面在远场光照下的辐照度只需 9 个球谐系数（到 2 阶）就能高精度表示。读完能理解 SH 为什么适合低频外观，又为什么不适合尖锐高光。"}, {"title": "Ref-NeRF: Structured View-Dependent Appearance for Neural Radiance Fields (Verbin et al., CVPR 2022)", "url": "https://arxiv.org/abs/2112.03907", "type": "paper", "note_zh": "把 NeRF 的视角相关颜色改为以反射方向参数化，并加入法线正则，显著改善了光泽表面。Quark Sec. 4.3 把它列为显式视角相关建模的方向之一。"}], "self_check": [{"q_zh": "为什么 Lambertian 假设对立体匹配和 IBR 都很关键？", "a_zh": "在 Lambertian 假设下，L_o 与 ω_o 无关，同一表面点在所有视角中颜色相同：立体匹配的光度一致性成立，IBR 的任意凸组合也都正确。一旦出现高光，匹配会被反射虚像误导而得到错误深度，IBR 混合则会产生重影，或者让高光消失。"}, {"q_zh": "如果目标视角看到的高光比所有输入视角都亮，Quark 能复现吗？为什么？", "a_zh": "不能。输出是输入颜色的凸组合（Sec. 4.3），不可能超过输入颜色中的最大值；它只能在输入颜色的范围内，借助射线编码偏向近邻视角，做内插式的近似。"}, {"q_zh": "3DGS 的每个高斯用多少个 SH 系数表示颜色？为什么 Ha 的像素高斯不需要 SH？", "a_zh": "3 阶 SH，4 个频带，每个通道 16 个，每个高斯共 48 个系数。Ha 的高斯每帧从输入像素解析生成，只在它所属输入视角附近的目标视角下被观看，颜色直接取像素值；视角相关性交给后面跨 K 个视角的融合权重处理，代价是同样无法外推。"}], "prereqs": ["f-linalg"]}, {"id": "r-reps", "name_zh": "三维表示总览：点、网格、体素、隐式场、高斯", "name_en": "3D representations: points, meshes, voxels, implicit fields, Gaussians", "tldr_zh": "点、网格、体素、隐式场、高斯和分层图像，在存储、渲染、编辑和时间一致性上各有取舍。另一条同样关键的轴是“全局持久表示”还是“逐视角即时表示”，两篇锚点论文都选了后者。", "intuition_zh": "选择哪种表示决定了三件事：怎么渲染（光栅化、splat、体渲染还是求根），怎么从图像得到它（优化、前馈预测还是融合），以及在时间上怎么维护。显式表示直接存几何元素，常见的有四种：\n- 点云：位置加颜色，渲染快，没有拓扑，会有空洞；\n- 三角网格：表面加拓扑，光栅化最成熟，但难以处理拓扑变化和头发；\n- 体素：规则网格，可以存密度、TSDF 或颜色，内存随分辨率按立方增长；\n- 3D 高斯：带协方差和不透明度的“软点”，既能 splat，又可微。\n隐式表示存的是一个函数：SDF 或占用场的表面是零等值面，需要求根才能渲染；神经场则是一个 MLP，或者特征网格加一个小网络。\n\n另一条常被忽略的轴是全局与逐视角。全局表示（NeRF、3DGS、TSDF 体素、网格）在世界坐标里描述整个场景，重建一次后可以从任意视角渲染，双目或多名观众只需多渲染几次；但重建要么很慢（逐场景优化），要么需要跨帧维护一致的状态。逐视角表示（深度图、MPI、LDM、像素对齐高斯）绑定在某个相机上，可以用 2D 网络高效预测，还能针对这个视角“作弊”，比如把视角相关外观烘焙进混合权重；但它只在该视角附近有效，每个新视角都要重新生成。\n\n对 telepresence 来说，起决定作用的往往是时间和带宽。全局持久表示天然有时间连续性，上一帧的状态可以延续下去，也便于压缩传输（例如只传更新的部分）。逐帧逐视角的即时表示每帧从零开始，时间一致性要靠额外机制，计算量还随观看视点数线性增长。\n\n两篇锚点论文都选了“逐视角、用完即丢”。Quark 的 LDM 每帧在目标视锥里生成一次；Ha 的像素高斯绑定在输入视角上，TSDF 只沿目标射线即时求值。两者都没有持久的 3D 模型，这是它们快的原因，也是它们会闪烁、难以扩展到双目和多观众的原因。后续工作正沿着这条轴移动，例如与 Quark 团队重叠的 LVT 和 SplatVoxel/Fuse-and-Refine，都转向了全局的 3DGS 表示，后者还带有跨帧的历史记忆。", "analogy_zh": "全局表示像一座实体雕塑：做一次很费劲，但谁从哪个角度看都行。逐视角表示像给每位观众现场画一张透视画：画得快，还能按这位观众的角度“美化”；但每多一位观众就要多画一张，而且下一秒重画时笔触未必一样（闪烁）。", "equations": [{"tex": "S = \\{\\mathbf{x}\\in\\mathbb{R}^3 \\mid f(\\mathbf{x}) = 0\\},\\qquad \\lVert\\nabla f(\\mathbf{x})\\rVert = 1\\ \\ (\\text{SDF})", "explain_zh": "隐式表面。f: ℝ³→ℝ 是标量场，表面 S 是它的零等值面。若 f 是符号距离函数（SDF），则梯度模长处处为 1（几乎处处成立），|f(x)| 就是 x 到表面的距离，梯度方向就是法线方向。TSDF 是把 f 截断到 [−τ, τ] 的版本。渲染隐式表面需要沿射线求根，见 r-raymarch。"}, {"tex": "G(\\mathbf{x}) = o\\cdot\\exp\\!\\Big(-\\tfrac{1}{2}(\\mathbf{x}-\\boldsymbol{\\mu})^{\\top}\\Sigma^{-1}(\\mathbf{x}-\\boldsymbol{\\mu})\\Big),\\qquad \\Sigma = R\\,S\\,S^{\\top}R^{\\top}", "explain_zh": "3D 高斯图元（3DGS Eq. 4 与 Eq. 6；论文的 Eq. 4 不含 o，不透明度在混合时再乘上）。μ ∈ ℝ³ 是中心（3 个数）；R 是旋转矩阵，由单位四元数给出（4 个数）；S = diag(s) 是三轴尺度（3 个数）；o 是不透明度（1 个数）。颜色另用 48 个 SH 系数，合计每个高斯 59 个 float。把 Σ 写成 RSSᵀRᵀ，可以保证它在梯度下降过程中始终是半正定的。"}, {"tex": "\\mathrm{LDM} = \\{(\\mathbf{d}_\\ell,\\ \\boldsymbol{\\sigma}_\\ell,\\ \\boldsymbol{\\beta}_\\ell)\\}_{\\ell=1}^{L},\\quad \\mathbf{d},\\boldsymbol{\\sigma}\\in\\mathbb{R}^{L\\times H\\times W},\\ \\ \\boldsymbol{\\beta}\\in\\mathbb{R}^{L\\times H\\times W\\times M}", "explain_zh": "Quark 的分层深度图（Sec. 3.1）。L 是层数，H×W 是每层的分辨率，全部定义在目标视锥里。d 是每层每像素的深度，σ 是每层每像素的 alpha，β 是每层每像素对 M 张输入图的混合权重。它是一种逐视角表示，只对这一个目标视角有意义。"}, {"tex": "\\text{Mem}_{\\text{voxel}} = N_x\\,N_y\\,N_z\\cdot b", "explain_zh": "稠密体素网格的内存。N_x、N_y、N_z 是三个方向的体素数，b 是每个体素的字节数（例如 fp16 TSDF 加 fp16 权重共 4 字节）。分辨率每翻一倍，内存乘以 8，所以实时系统要么用稀疏或分层体素，要么像 Starline 和 Ha 那样完全不建网格。"}], "worked_example_zh": "比较同一个临场场景用不同表示时，每帧需要的存储和计算。\n\n(1) 稠密 TSDF 体素。Starline 的对比实验用了 1152×896×768 ≈ 7.93 亿个体素；按每体素 4 字节估算约 3.2 GB，还要靠一个 32³ 超体素的占用网格来跳过空区域。改用 image-based TSDF 后，只需要存输入深度图：Starline 是 3 张深度图；Ha 在 DyNeRF 上是 4 张 1352×1014 的深度图，按 16 位存约 11 MB。\n\n(2) Ha 的像素高斯。每帧有 K = 4 × 1352×1014 = 5,483,712 个高斯。如果像 3DGS 那样每个高斯存 59 个 float（位置 3、尺度 3、四元数 4、不透明度 1、SH 48），需要约 1.29 GB。而 Ha 的参数都是解析的：尺度由深度决定，各向同性所以旋转无关，不透明度固定为 1，颜色就是像素值。实际只需要 RGB-D，每像素 3 字节颜色加 2 字节深度，未压缩约 27 MB。\n\n(3) Quark 的 LDM。最终 6 层 × 288×512，每个层像素存 1 个深度、1 个 density 和 M = 8 个 blend logits，共 884,736 × 10 ≈ 885 万个值，fp32 约 35 MB。它在 GPU 上生成，渲染完就丢弃，不需要传输；要传输的是 8 路输入图像。\n\n(4) 渲染成本与观看者数量。3DGS 重建一次后，左右眼各光栅化一次即可。Quark 和 Ha 每多一个视点（左右眼、多名观众、光场屏的几十个视角），就要把整条管线再跑一遍。Quark 单视点在 A100 上约 32 ms。输入图像的编码可以在两眼之间共享，但附录图 8 显示大部分时间花在依赖目标视角的 Update & Fuse 上，所以双目粗略估计接近 64 ms，已经超出 30 fps 的预算。", "pitfalls_zh": ["把“显式/隐式”和“全局/逐视角”混为一谈。TSDF 是隐式表面，但 Ha 的 image-based TSDF 实际存的是一组深度图（逐视角、显式）；3DGS 是显式的全局表示；像素对齐高斯（GPS-Gaussian、Ha）是显式的逐视角表示。", "只看单帧质量，不看时间维度。逐帧即时表示没有状态，即使每帧 PSNR 很高也可能闪烁。Quark 自己承认这一点（Sec. 4.3），Ha 则专门用 STED 等指标来度量。", "忽略视点数的扩展成本。逐视角表示的成本与视点数成正比，这对双目头显和光场显示是硬约束，而两篇论文都没有评测双目。", "以为表示越“通用”越好。LDM 不能从任意方向观看（Quark Sec. 2.1 承认这是历史缺点），只能靠逐视角重新生成来规避；网格难以表达头发和半透明；体素的内存按立方增长。应当从“采集 → 传输 → 渲染”整条链路出发来选表示。"], "in_quark": {"used": true, "where": "Sec. 2.1（Physical Representations for View Synthesis）、Sec. 1（LDM 段落）、Sec. 3.1、Sec. 4.3", "how_zh": "Sec. 2.1 本身就是一份表示综述，列出了隐式表面、点云、体素、3D 高斯、三角网格、MPI、MSI、layered mesh，以及对神经场的体积光线步进，并给出了权衡：全体积表示质量最高，擅长“像树叶那样的多重遮挡”，但慢；表面表示渲染高效；LDM/LM 想兼得二者。论文不用 3DGS 的理由是，它“和 NeRF 一样需要缓慢的离线逐场景过程”；而 LDM 是 2D 结构，可以直接用高效的 2D 网络求解。\n\nLDM 的历史缺点是“不能从所有方向观看”，Quark 靠“为每个新视角重新生成 LDM”来规避（Sec. 1：每帧重建、渲染、丢弃）。代价写在 Sec. 4.3：没有时间一致性，逐帧独立重建会闪烁；而且需要最近的 8–16 个输入视角有足够的覆盖。"}, "in_ha": {"used": true, "where": "Sec. 3 开头、Sec. 3.1（像素高斯）、Sec. 3.2（image-based TSDF）、附录 A.3", "how_zh": "Ha 用了两种逐视角表示。(1) 输入视角上的像素对齐高斯：显式，参数解析得到。A.3 说，对这种由深度图反投影得到的稠密高斯点云，用网络预测参数没有观察到优势。(2) 目标视角上的 image-based TSDF：隐式表面，但不建体素网格，而是从 K 张深度图即时求值。\n\nSec. 3 开头把 TSDF 称为“全局几何结构”，说它能保证同一时刻的视角一致性。但 Sec. 3.2 也承认，它只融合最近的 K 个视角，K 集合切换时深度仍会小幅变化，严格说只是“局部的全局”。时间一致性靠把上一帧的目标深度作为额外的 TSDF 输入，近似出一个持久状态。与 Quark 一样，Ha 没有持久的 3D 模型，每个视点都要单独做 splat、步进和融合。"}, "in_field_zh": "(1) 传输什么，是临场系统的第一个设计问题。Holoportation（以 Fusion4D 做重建）传网格加多路彩色图像；Starline 传 3 张深度图加 4 张彩色图，在接收端渲染左右眼；Tele360 用视频编码器推流 Gaussian maps；GS-SCNet 传经过语义编码的多视角潜变量，在接收端直接解码成 3DGS 参数；Quark 式方案则适合在服务端按观看者位姿渲染，再传 2D 视频。(2) 表示决定压缩方式：视频编码器擅长 2D 图像（深度图、MPI/LDM 层、Gaussian maps），点云需要 MPEG V-PCC/G-PCC，网格需要 Draco 或 MPEG V-DMC 这类专门的编码。(3) 表示决定可扩展性：多观众、双目和光场显示更适合“一次重建、多次渲染”的全局表示。(4) 表示决定时间上怎么处理：有持久状态（体素、4D 高斯、记忆模块）时便于做时间滤波，逐帧表示则需要额外的时间机制。", "resources": [{"title": "MIT 6.S980 Machine Learning for Inverse Graphics (Vincent Sitzmann, Fall 2023)", "url": "https://scenerepresentations.org/courses/2023/fall/inverse-graphics/", "type": "course", "note_zh": "Module 2 “3D Scene Representations & Neural Rendering” 中有 Scene Representations I–III 三讲，依次讲 2.5D 与深度图、表面与离散场（点云、网格、体素）、神经场与混合表示，并比较运行时间和内存；同一模块还有 Light Transport（渲染方程）和 Gaussian Splatting 两讲。有录像和讲义。"}, {"title": "CMU 16-825 Learning for 3D Vision (Fall 2026 schedule)", "url": "https://learning3d.github.io/schedule.html", "type": "course", "note_zh": "Fall 2026 课表里的 “3D Representations I/II”“Volume Rendering”（附 Volume Rendering Digest）“Differentiable Primitive Rendering (Meshes, Gaussians)” 几讲，与本模块几乎一一对应。"}, {"title": "Advances in Neural Rendering (Tewari et al., Eurographics 2022 STAR)", "url": "https://arxiv.org/abs/2111.05849", "type": "paper", "note_zh": "神经渲染综述，按表示（体素、点、网格、神经场）和渲染方式组织，适合用来建立整张地图。Quark 的相关工作部分也引用了它。"}, {"title": "Szeliski, Computer Vision: Algorithms and Applications 2nd ed., Ch. 13 §13.3–13.5", "url": "https://szeliski.org/Book/", "type": "book", "note_zh": "依次讲表面表示（13.3：插值、简化、geometry images）、点表示（13.4）、体素表示（13.5，其中 13.5.1 为隐式表面与水平集），从经典视觉的角度讨论各种表示的取舍。"}], "self_check": [{"q_zh": "为什么说 Quark 和 Ha 用的都是逐视角表示？这对双目头显意味着什么？", "a_zh": "Quark 的 LDM 建在目标视锥里，每帧、每个视角重建一次，用完即丢；Ha 的高斯绑定在输入视角上，TSDF 只沿目标射线求值。双目需要左右眼两个目标视角，两条管线都要各跑一遍，成本约翻倍；左右眼之间也不共享状态，结果可能不一致。全局表示（如 3DGS）只需多光栅化一次。"}, {"q_zh": "Ha 为什么不需要像 3DGS 那样为每个高斯存 59 个参数？", "a_zh": "它的高斯是从 RGB-D 像素解析生成的：位置由深度和位姿决定，尺度由深度和焦距决定（覆盖 1 个源像素），各向同性所以旋转没有意义，不透明度固定为 1，颜色就是像素值。因此表示本身就是 RGB-D 图，每像素约 5 字节。"}, {"q_zh": "分别举一种“隐式但逐视角”的表示和一种“显式但全局”的表示。", "a_zh": "隐式但逐视角：Ha 和 Starline 的 image-based TSDF，SDF 由多张深度图即时定义，不存网格。显式但全局：3DGS 场景、带纹理的三角网格、体素网格。"}], "prereqs": ["r-raster", "r-volume"]}]}, {"id": "M5", "title_zh": "基于图像的渲染（IBR）", "title_en": "Image-based rendering", "goal_zh": "理解“直接复用输入像素”的新视角合成思路：光场、混合权重、前向 warping 的洞与飞点、分层表示。", "intro_zh": "本模块回答一个问题：新视角里的像素从哪里来？两篇锚点论文的答案相同：从输入相机的像素里挑出来，再加权混合，而不是让网络凭空生成。Quark 的最终渲染（Sec. 3.1, Eq. 1）先按 LDM 各层深度把 M=8 张全分辨率输入图反投影到各层，再用逐层、逐像素的 blend weights 做凸组合，最后按 density 从后往前做 over 合成。Ha et al. 的最终输出（Sec. 3.3, Eq. 4–5）是 K 张逐视角前向 splat 图的逐像素加权平均，只有去遮挡洞交给网络预测的背景图来填。消融实验说明了这种做法的分量。Quark 的消融（Sec. 4.2 Table 4，以 Quark+ 为基线）中，改成由网络直接输出 RGB 后，PSNR 从 30.41 降到 29.18，是所有消融中退化最大的一项。Ha et al. 把所有视角一次性渲染（No Blending）只有 24.64 dB，改用按相机距离加权也只有 26.08 dB，而学习式、几何引导的混合达到 31.17 dB。\n\n这种“基于图像的渲染（IBR）”思路很适合临场系统。网络只需在低分辨率下求解几何代理和权重（Quark 内部只有 6 层 × 288×512），皮肤、发丝、衣物纹理这类高频细节直接取自真实照片，因此能用很低的算力输出 1080p 乃至 2K 画面。它的代价同样来自“只能复用”这一点。输入里没有的内容无法凭空生成，例如去遮挡区域和出现在新位置的高光。相机之间的曝光和白平衡差异、标定误差会直接表现为接缝、硬边和闪烁。相机过于稀疏时，几何代理一旦出错就会出现重影。\n\n五个概念按依赖顺序排列：\n1. 光场与 plenoptic sampling：稀疏相机为什么必须依赖几何，相机应该放多密（i-lightfield）。\n2. 多个候选像素怎样加权（i-blending）。\n3. 像素怎样借助深度搬到新视角，空洞和飞点从哪里来（i-warping）。\n4. 怎样用少量半透明层同时表示遮挡和软边缘（i-layered）。\n5. 深度未知时，网络怎样通过平面扫描“看到”多视角匹配（i-psv）。\n\n学完本模块，应当能逐个符号读懂 Quark 的 Eq. (1)–(4) 和 Fig. 3，以及 Ha et al. 的 Sec. 3.1、3.3 和附录 A.1–A.4。", "study_tips_zh": "1）先手算，再写代码。取焦距 f=1000 像素，人距相机 0.8 m，背景墙 3 m，计算 Chai 的最大相机间距和最优渲染深度。再取相机间距 10 cm，计算前景与背景的视差，以及去遮挡带的宽度。把这些数字和 Quark（每帧 8 张输入图，彼此最远相距约 30 cm，见其 Sec. 1）、Ha et al.（每帧只融合最近的 K=4 路，D3DMV 上 K=2）的设定放在一起比较，体会“用几何代理替代密集采样”的含义。\n\n2）用 NumPy 或 PyTorch 写一个 100 行以内的 DIBR。输入一张 RGB-D 图（可以用 Blender 渲染，也可以用任何带深度的公开数据），分别实现两种 warping：前向 warping（逐像素投影加 z-buffer）和后向 warping（给定目标深度，用 grid_sample 采样）。把裂缝、去遮挡空洞和边缘飞点可视化。然后把每个点改成世界空间半径约 z/f 的高斯 splat（z 为深度、f 为以像素计的焦距，投影回源图恰好约 1 像素），再让目标相机向前靠近，观察裂缝有什么变化。\n\n3）实现 ULR 权重：取 k=3 个近邻，以第 k 个角度惩罚作为阈值，线性衰减后归一化（注意第 k 台相机的权重恰好为 0，实际起作用的只有 k−1 台）。让虚拟相机沿一条路径移动，画出每台输入相机的权重曲线，并与“k 近邻等权”以及 LLFF 的 exp(−γℓ) 距离权重对比，看哪种方案在相机集合切换时出现跳变。\n\n4）实现一个 D=32、在视差上等间隔（1 m 到 100 m）的 MPI 渲染器：对每个平面计算平面诱导单应，warp 后从后往前做 over 合成。然后把平面深度改成 Quark Eq. (4) 的“带内可移动”形式，取 L=6，验证各层深度带的数值。\n\n5）实现平面扫描。取两到三张已标定图像，在目标视角建立 PSV，逐平面计算跨视角方差，取 argmin 得到深度图。把输出颜色取为最优平面上各视角颜色的均值，就得到最简单的“PSV 视图合成”。接着思考：把 RGB 换成 CNN 特征、把方差换成注意力，会得到什么？答案就是 Quark 的 Δ 和 One-to-many attention。\n\n6）建议的阅读顺序：\n- Szeliski 第 14 章（14.1–14.3）和 12.1.2 节\n- ULR 第 3–4 节\n- Stereo Magnification 第 3 节\n- LLFF 第 3–4 节\n- DeepView 第 3 节\n- 最后回到 Quark 的 Sec. 3 和 Ha et al. 的 Sec. 3、附录 A.1–A.4，给每个符号标注它对应本模块的哪个概念。\n\n检验是否真正掌握：能不看论文，徒手画出 Quark Fig. 3 的数据流（哪一步是前向 splat，哪一步是后向投影，哪一步是 PSV），以及 Ha et al. 的通道表（9K+1 个通道各自是什么）。", "concepts": [{"id": "i-lightfield", "name_zh": "全光函数、光场与 Lumigraph", "name_en": "Plenoptic function, light fields & the Lumigraph", "tldr_zh": "一张照片是全光函数的一个二维切片。在自由空间里辐亮度沿光线不变，全光函数可以降为 4D 光场，新视角合成就是对已记录的光线重新采样；相机稀疏时，必须借助几何（深度）这个“代理”才能正确插值。", "intuition_zh": "全光函数（plenoptic function，Adelson & Bergen 1991）描述的是：空间中任意一点、沿任意方向、任意波长、任意时刻的光线辐亮度，共 7 个自变量。任何一台相机拍下的照片，都是在固定光心、固定时刻下对方向 (θ, φ) 的一次采样，RGB 三个通道则是对波长 λ 的三段积分。换个角度看，新视角合成不必重建材质与光照，只要回答一个问题：从新相机光心发出的每条光线，在已记录的样本里对应什么颜色。这就是基于图像的渲染（IBR）的出发点。\n\n维度可以一步步降下来。逐帧处理可去掉时间 t，用 RGB 代替 λ，得到 5D，对应 McMillan & Bishop 1995 的 Plenoptic Modeling。再假设观察者位于场景凸包之外、空气不衰减光，则辐亮度沿光线恒定，光线方向上的那一维就是冗余的，于是得到 4D 光场（Levoy & Hanrahan 1996）和 Lumigraph（Gortler et al. 1996）。常用的是双平面参数化：一条光线由它与相机平面的交点 (u, v) 和与焦平面的交点 (s, t) 确定，记作 L(u, v, s, t)。在相机阵列中，每台相机是 (u, v) 平面上的一个样本，它的每个像素是 (s, t) 平面上的一个样本。渲染新视角时，对每条新光线求出 (u, v, s, t)，再在相邻样本间做四线性插值。插值本身就是对输入像素加权求和，这和两篇锚点论文的输出形式完全一致。\n\n难点在于采样率。Plenoptic sampling（Chai et al. 2000）在 Lambertian、无遮挡的假设下做了傅里叶分析，结论是：光场的频谱只受场景最小深度和最大深度的约束，所需的最大相机间距与视差范围 h_d = 1/z_min − 1/z_max 成反比。如果在最优常深度 1/z_opt = (1/z_min + 1/z_max)/2 上渲染，那么相邻相机之间，场景点相对这个平面的残余视差不超过约 1 像素时才不会混叠，也就不会出现重影。这篇论文的第二个结论更重要，称为“最小采样曲线”：几何信息越多（深度层数越多、深度越准），需要的图像就越少。Lumigraph 与后来的 ULR 用近似几何来修正光线查找。LLFF 把这一点量化为 d_max ≤ min(D, W/2)：每个视角升级为 D 层 MPI 之后，相邻视角间允许的最近点视差就从 1 像素放宽到 D 像素。\n\n两篇锚点论文都处在这条曲线上“少图像、多几何”的一端。Quark 每帧只用 8 张输入图，彼此最远相距约 30 cm（Quark Sec. 1）；Ha et al. 只融合最近的 K=4 台（D3DMV 上 K=2）。两者都远低于奈奎斯特采样密度，只能依靠几何代理。Quark 的代理是网络推出的 LDM 层深度；Ha et al. 的代理是 RAFT-Stereo 深度，再加上 TSDF 融合出的目标深度。最终颜色仍然是输入像素（即光线样本）的加权组合，几何只负责指出该到哪个输入像素去取值。因此几何出错时，这类方法的失败表现为重影或硬边，而不是像直接回归颜色的网络那样发糊。", "analogy_zh": "把光场想成一座“光线图书馆”：每台相机是一个书架，每个像素是一本书，记录着“从这个方向来的光是什么颜色”。新视角合成是去图书馆借书，而不是自己写书。书架摆得足够密（奈奎斯特采样）时，随手借相邻的几本拼一拼就行。书架很稀疏时，你得先知道目标光线打在场景的哪一点（几何代理），才能找到记录同一点的那几本书。", "equations": [{"tex": "P(\\theta,\\phi,\\lambda,t,V_x,V_y,V_z)\\;\\longrightarrow\\;P(\\theta,\\phi,V_x,V_y,V_z)\\;\\longrightarrow\\;L(u,v,s,t)", "explain_zh": "P 是全光函数：(V_x, V_y, V_z) 是观察点位置，(θ, φ) 是光线方向，λ 是波长，t 是时刻，函数值是这条光线的辐亮度。第一步：逐帧处理时固定 t，用 RGB 三个通道代替对 λ 的连续描述，剩下 5D（位置 3 维加方向 2 维）。第二步：在场景凸包之外的自由空间里，辐亮度沿光线不变，光线上的位置参数是冗余的，4 个数就能确定一条有向直线。在双平面参数化中，(u, v) 是光线与相机平面的交点（决定用哪台相机），(s, t) 是光线与焦平面的交点（决定该相机里的哪个像素方向）。注意：这里的 t 是焦平面坐标，和时刻 t 不是同一个量，沿用了原文记号。"}, {"tex": "\\Delta t_{\\max} = \\frac{1}{K_{\\Omega_v}\\, f\\, h_d},\\qquad h_d = \\frac{1}{z_{\\min}} - \\frac{1}{z_{\\max}}", "explain_zh": "对应 Chai et al. 的 Eq. 8。Δt_max 是相邻相机允许的最大间距，也就是最小采样率的倒数。f 是焦距，与像素间距 Δv 用同一单位（例如都用像素）。h_d 是场景的逆深度（视差）范围，z_min 和 z_max 分别是最近和最远深度。K_{Ω_v} 是需要保留的最高图像频率，取以下三者的最小值：场景纹理带宽、采样相机的奈奎斯特频率 1/(2Δv)、输出分辨率的奈奎斯特频率。直观理解：深度范围越大（前景越近），同样的相机移动造成的视差差异就越大，相机就得排得越密。若考虑遮挡（Zhang & Chen 2003；LLFF Eq. 1），允许的间距还要再减半。"}, {"tex": "\\frac{1}{z_{\\mathrm{opt}}} = \\frac{1}{2}\\left(\\frac{1}{z_{\\min}} + \\frac{1}{z_{\\max}}\\right)", "explain_zh": "z_opt 是用单一常深度平面做光场插值时的最优深度，等于 z_min 与 z_max 的调和平均，也就是在视差上取中点。在这个平面上渲染时，场景点的残余视差 f·Δt·|1/z − 1/z_opt| 最大为 f·Δt·h_d/2。由上一式（取 K = 1/(2Δv)）可知，它不超过 1 个像素，这就是 Chai 的 Eq. 9。光场“重新对焦”时，也应该选这个平面作为焦平面。"}, {"tex": "d_{\\max} = \\frac{\\Delta u\\, f}{\\Delta x\\, z_{\\min}} \\le \\min\\left(D, \\frac{W}{2}\\right)", "explain_zh": "对应 LLFF 的 Eq. 7。Δu 是相邻相机的基线（米），f 是焦距（米），Δx 是像素尺寸（米），所以 f/Δx 就是以像素计的焦距。z_min 是最近的场景深度。d_max 是最近点在相邻视角之间的像素视差，这里假设 z_max = ∞。D 是每个视角展开成 MPI 时的平面数，W 是图像宽度（像素）。D = 1 时，式子退化为奈奎斯特条件：相邻视角间最多 1 像素视差（这个界已经计入了遮挡带来的减半）。有了 D 层几何，就可以放宽到 D 像素。W/2 这一项来自立体几何估计所需的视场重叠。"}], "worked_example_zh": "设定：一个桌面临场舱。相机焦距 f = 1000 像素（对 1920 像素宽的画面约为 88° 水平视场），人离相机最近 z_min = 0.8 m，背景墙 z_max = 3.0 m。像素间距 Δv = 1 像素，取 K = 1/(2Δv) = 0.5 周期/像素。\n\n（1）视差范围：h_d = 1/0.8 − 1/3.0 = 1.25 − 0.333 = 0.917 m⁻¹。\n\n（2）Chai 的最大相机间距：Δt_max = 1/(0.5 × 1000 × 0.917) ≈ 2.18 mm。验证：相邻相机之间的视差范围 f·Δt·h_d = 1000 × 0.00218 × 0.917 ≈ 2 像素，也就是相对最优平面的残余视差在 ±1 像素以内。\n\n（3）最优渲染深度：1/z_opt = (1.25 + 0.333)/2 = 0.792，即 z_opt ≈ 1.26 m。这比深度的算术平均 1.9 m 近得多，原因是像素位移与逆深度成正比，而不是与深度成正比。\n\n（4）如果用纯光场覆盖 30 cm × 30 cm 的观看范围，需要 (0.30/0.00218)² ≈ 138² ≈ 1.9 万台相机，显然不可行。\n\n（5）换成 Quark 式的设定：相机间距约 10 cm，相邻相机之间最近点的视差 d_max = 1000 × 0.1 / 0.8 = 125 像素。按 LLFF 的界，固定平面的 MPI 至少需要约 125 层。Quark 的最终 LDM 只有 6 层，但每层都有逐像素深度，可以贴着物体表面走。它用“更精确的几何”替代了“更密的平面或更密的相机”，这正是 plenoptic sampling 最小采样曲线所说的“用几何换图像”。\n\n（6）再对照 Quark 的由粗到细（附录 C Table 8）。初始 LDM 网格只有 36×64，相当于把 1920 宽的画面缩小 30 倍，等效焦距约 1000/30 ≈ 33 像素；此时最近点在相距 10 cm 的相邻视角间的视差只有 33.3 × 0.1 / 0.8 ≈ 4 像素，24 个等视差平面按 LLFF 的界绰绰有余。到最终的 288×512（缩小 3.75 倍，等效焦距约 267 像素），同样的视差约为 33 像素，而层数只剩 6 层，远不满足 d_max ≤ D，这时靠的是每层的逐像素深度去贴合表面，而不是平面数。这里只是粗略套用 LLFF 的界（它针对单个参考视角的 MPI），但足以说明 Quark 为什么在低分辨率用多层扫描、在高分辨率用少量可弯曲的层。", "pitfalls_zh": ["把“光场是 4D”当成普遍成立的结论。降到 4D 依赖两个前提：观察者位于场景凸包之外，传播介质不衰减光。VR 中头部伸进场景内部，或者场景里有雾、烟、火焰时，这两个前提就不成立，需要显式的几何与遮挡推理。", "混淆几种“1 像素”的说法。Chai 的条件（无遮挡，取 K = 1/(2Δv)）是相邻视角之间的视差范围 f·Δt·h_d 不超过 2 像素，即相对最优深度平面的残余视差不超过 ±1 像素（Chai Eq. 9）。LLFF Eq. 1 考虑了遮挡（Zhang & Chen 2003），允许的间距减半，即 f·Δu·h_d ≤ 1 像素；它的 Eq. 7 在 z_max = ∞ 时写成“最近点视差不超过 1 像素”，这个 1 像素已经包含了遮挡带来的减半，不要再减一次。两者恰好差 2 倍，差的就是遮挡项。换算之前，先确认用的是哪一种定义。", "以为光场 IBR 不需要几何。这只在达到奈奎斯特采样密度时才成立。稀疏相机阵列必须依赖几何代理，代理的误差会直接变成重影（如 Ha et al. Fig. 4b 中的距离加权混合）或错误的硬边（Quark Sec. 4.3）。", "默认表面是 Lambertian。plenoptic sampling 给出的频谱界假设表面为 Lambertian 且没有遮挡。高光和透明物体的光场频谱更宽，需要更密的采样。两篇锚点论文都只能用输入颜色的凸组合来近似高光。"], "in_quark": {"used": true, "where": "Sec. 1、Sec. 2（Related Work 开篇）、Sec. 2.1、Sec. 3.1 Eq. (1)、Sec. 4.1（Table 3）、Sec. 4.3", "how_zh": "Quark 在 Sec. 1 写明，实验中每帧使用 8 张输入图，彼此最远相距约 30 cm，这远低于奈奎斯特密度。Sec. 2 开篇把经典的新视角合成方法归为 IBR（引用 Chen & Williams 1993 和 McMillan & Bishop 1995），并说明自己是“使用 IBR 的神经渲染方法”。Sec. 2.1 引用 Chai et al. 2000（Plenoptic Sampling）和 Lin & Shum 2004，指出合成质量高度依赖“物理表示”，也就是几何代理的准确度。\n\nEq. (1) 写作 c_target = O(Σ_m β_m · P^T_θ(I, d), σ)。它的含义是：按 LDM 各层深度，从 M = 8 张全分辨率输入图中取出光线样本，做凸组合，再做 over 合成。用光场的语言说，LDM 就是为每个目标视角即时求解的几何代理。网络只在 288×512 的内部分辨率上求解代理，高频细节由输入光线直接提供，所以 1024×768 与 2048×1536 两种分辨率的耗时几乎相同（32.2 ms 对 33.0 ms，Table 1）。\n\nSec. 4.1 Table 3 中，Quark 在 Deep Blending（Playroom）上只有 23.61 dB，远低于 3DGS-30K 的 30.04 dB。原因是最近的 8 个视角覆盖不足，需要的光线样本根本不在输入里。不理解光场，就会困惑 Quark 为什么不直接输出 RGB，也不明白为什么视角覆盖比网络容量更能决定效果的上限。"}, "in_ha": {"used": true, "where": "Sec. 1（Introduction）、Sec. 3.1、Sec. 3.3 Eq. (4)–(5)、Sec. 4.6", "how_zh": "Sec. 1 在分析已有系统时，直接用了 plenoptic sampling 的语言。一类是固定稀疏相机的系统，它们“依赖额外的深度传感器来克服奈奎斯特采样极限”（引用 Chai et al. 2000 [7] 和 LLFF [45]）。另一类方法用基于对应关系的技术估计高分辨率深度，以克服“传统 IBR 所需的奈奎斯特采样极限”（引用 Wilburn 等人的大规模相机阵列 [68, 69]）。两者本质上都是用几何换采样。\n\n方法本身就是 IBR。每个输入像素是一条已记录的光线，先按 RAFT-Stereo 深度放到 3D 空间（几何代理），再 splat 到目标视角（Sec. 3.1）。最终颜色是 K = 4 个视角（D3DMV 上 K = 2）光线样本的加权组合（Sec. 3.3, Eq. 4），只有去遮挡区域由网络预测的背景图来补（Eq. 5）。\n\nDyNeRF 阵列有 18–22 台相机，每帧却只用最近的 4 台，远低于奈奎斯特密度，所以深度质量和 TSDF 引导才是关键。深度一旦出错（例如在高光区域），视角一致性就会被破坏，在 EPI 中表现为断裂（Sec. 4.6, Fig. 9）。"}, "in_field_zh": "设计相机阵列时（需要几台相机、间距多大、人离相机多近），可以直接用 plenoptic sampling 估算。人越靠近屏幕，h_d 越大，所需相机就越密，或者对深度精度的要求越高（见 d-sensors、d-stereo）。Starline 类舱体、Tele-Aloha 等少相机系统，都是依靠深度来越过奈奎斯特密度要求的。显示端同样是光场问题：光场屏和裸眼 3D 屏需要一次输出几十个视角，相当于在显示端重新采样光场（见 v-perception）。传输端，MPEG 沉浸式视频（MIV）等方案用“多视角纹理 + 深度”表示光场，其压缩率同样受采样密度与几何精度之间权衡的制约（见 a-compression）。", "resources": [{"title": "Computer Vision: Algorithms and Applications, 2nd ed. (Szeliski), §14.3 Light fields and Lumigraphs", "url": "https://szeliski.org/Book/", "type": "book", "note_zh": "作者提供免费电子版，下载前需登记，限个人使用。第 14 章是 IBR 的教科书式综述，14.3 节讲 4D 光场与 Lumigraph。建议连同 14.1（View interpolation）和 14.2（Layered depth images）一起读。"}, {"title": "Light Field Rendering (Levoy & Hanrahan, SIGGRAPH 1996)", "url": "https://graphics.stanford.edu/papers/light/", "type": "paper", "note_zh": "光场的原始论文。它把输入图像解释为一个 4D 函数的二维切片，提出双平面（light slab）参数化，靠重采样已有图像生成新视角，不需要深度，也不需要特征匹配。"}, {"title": "Plenoptic Sampling (Chai, Tong, Chan & Shum, SIGGRAPH 2000)", "url": "https://cseweb.ucsd.edu/~viscomp/classes/cse274/wi18/readings/plenoptic.pdf", "type": "paper", "note_zh": "免费 PDF，来自 UCSD CSE 274 的课程阅读材料（正式出版版本 DOI 为 10.1145/344779.344932）。推导了最小采样率（Eq. 8 给出最大相机间距，Eq. 9 把它解释为“残余视差不超过 1 像素”）、最优常深度，以及第 3 节的“最小采样曲线”：几何越准，需要的图像越少。Quark 的 Sec. 2.1 和 Ha et al. 的 Sec. 1 都引用了这篇论文。"}, {"title": "UCSD CSE 274: Sampling and Reconstruction of Visual Appearance (Ravi Ramamoorthi, Winter 2018)", "url": "https://cseweb.ucsd.edu/~viscomp/classes/cse274/wi18/274.html", "type": "course", "note_zh": "Ravi Ramamoorthi 的研究生课程页。光场部分的阅读清单包括 Light Field Rendering、The Lumigraph，频率分析一讲指定阅读 Plenoptic Sampling；页面下方还保留了早期开课时 “Image-Based Rendering and Light Fields” 一讲的讲义链接。适合系统地补习光场采样理论。"}], "self_check": [{"q_zh": "为什么自由空间中的全光函数可以从 5D 降到 4D？在临场系统中，这个假设什么时候会失效？", "a_zh": "在不衰减光的介质中，同一条光线上各点的辐亮度相同，所以光线上的位置参数是冗余的，4 个参数（例如光线与两张平面的交点）就足以确定一条光线。当观察者进入场景凸包内部时（例如 VR 中把头伸到两个物体之间），同一条直线会被中间的物体截断，光线“前段”和“后段”的颜色不同，4D 参数化就不再成立，需要显式的几何与遮挡处理。场景中有雾、烟、火焰等参与介质时，辐亮度也不再沿光线守恒。"}, {"q_zh": "在上面的例子里，如果人往后退到 z_min = 1.5 m（背景仍为 3 m），Chai 的最大相机间距变成多少？这对临场舱的设计说明了什么？", "a_zh": "h_d = 1/1.5 − 1/3 = 0.333 m⁻¹，Δt_max = 1/(0.5 × 1000 × 0.333) ≈ 6.0 mm，是原来 2.18 mm 的 2.75 倍。这说明所需的采样密度主要由最近的物体决定：人越贴近屏幕和相机，相机就要排得越密，或者几何要估得越准。近距离的一对一通话恰恰是最难的情形，这也是 Starline 类系统必须依赖精确深度的原因。"}, {"q_zh": "Quark 和 Ha et al. 为什么都自称 IBR？它们各自的几何代理是什么？几何出错时，典型的失败表现是什么？", "a_zh": "两者的最终颜色都是输入像素的加权组合。Quark 用 Eq. (1) 中的 blend weights 对反投影后的输入图做凸组合；Ha et al. 用 Eq. (4) 对前向 splat 图做加权平均。Quark 的几何代理是网络为每个目标视角求出的 LDM 层深度（外加 density）。Ha et al. 的几何代理有两部分：RAFT-Stereo 给出的逐视角深度决定像素高斯放在哪里，TSDF 融合出的目标深度用来引导权重。几何出错时，从各输入视角取到的像素并不对应同一个表面点，结果表现为重影、错位的硬边（Quark Sec. 4.3）或 EPI 中的断裂（Ha et al. Fig. 9），而不是回归式网络常见的整体模糊。"}], "prereqs": ["g-pinhole", "g-depth", "f-image"]}, {"id": "i-blending", "name_zh": "视角相关纹理映射与混合权重（ULR）", "name_en": "View-dependent texture mapping & blending weights (ULR)", "tldr_zh": "当多个输入相机都看到目标像素对应的表面点时，混合权重决定每个相机贡献多少。ULR 把好权重的准则归纳为：角度偏差小、分辨率匹配、随视点连续变化、点可见且在视场内。Quark 与 Ha et al. 则让网络从数据中学出这些权重。", "intuition_zh": "有了几何代理，就能从目标像素找到对应的表面点 p，再求出 p 在每个输入相机中的像素位置，得到 K 个候选颜色。如果表面是理想的 Lambertian、几何完美、各相机曝光一致，这些颜色应该相同，怎么平均结果都一样。现实中它们并不相同，原因有四个：高光随视角移动（r-appearance）；深度误差让不同相机取到的其实是不同的点；遮挡让某些相机看到的是前景；离得远或斜着看的相机分辨率更低。混合权重就是在这些不一致之间做裁决。\n\n视角相关纹理映射（VDTM，Debevec, Taylor & Malik 1996）把多张照片投影到粗糙的建筑模型上。每个像素的权重与“新视线方向和该照片拍摄方向之间的夹角”成反比，并且在照片边界附近逐渐降到 0，以避免接缝。这样，高光和模型中缺失的几何细节会在接近拍摄视角时正确出现。\n\n非结构化 Lumigraph（ULR，Buehler et al. 2001）把理想 IBR 算法应满足的目标列成了一张清单：\n- 利用几何代理；\n- 支持任意（非网格）的相机布置；\n- epipole consistency：目标光线恰好穿过某台输入相机的光心时，只用这台相机；\n- 最小角度偏差；\n- 连续性：某台相机的贡献在其视场边界或可见性边界必须平滑降到 0，否则会产生时空伪影；\n- 分辨率敏感：离表面远的相机，一个像素覆盖的表面面积更大，用它会发糊；\n- 等价光线一致性；\n- 实时。\n具体做法是：对每条目标光线，求出它与代理的交点 p，计算每台相机的角度惩罚；只保留惩罚最小的 k 台，以其中第 k 台的惩罚作为自适应阈值；权重从 1 线性降到 0，再归一化。按这个定义，第 k 台相机的权重恰好为 0，真正起作用的只有 k−1 台；不少实现因此取 k+1 个近邻，用第 k+1 个的惩罚作阈值。角度、分辨率、视场三项惩罚可以加权合成为一个总惩罚。\n\n学习式混合把这些手工准则变成网络的输入特征，让网络从数据中学会处理几何误差与遮挡。Deep Blending（Hedman et al. 2018）用 CNN 预测逐像素权重；IBRNet（2021）在每个 3D 采样点上聚合多视角特征，预测颜色混合权重；LLFF 在不规则采样时，用 exp(−γℓ) 形式的相机距离权重乘以累积 alpha。混合权重通常是凸组合，即非负且和为 1。它的好处是输出不会超出输入颜色的范围，纹理保持锐利。坏处是不能产生输入中不存在的颜色，比如出现在新位置的高光；而且当各相机曝光不一致时，权重一变化就会出现接缝和闪烁。", "analogy_zh": "混合权重就像一个评审团的计分规则。几位评委（输入相机）看同一场表演（同一个表面点），各自打一个分（颜色）。坐得越正对舞台（角度偏差小）、离得越近（分辨率高）、视线没被柱子挡住（可见）的评委越可信。ULR 按固定规则给评委分配话语权；学习式混合则是训练一位主审，看着每位评委的位置和打分来决定听谁的。规则的关键之一是：评委离席（相机移出 k 近邻）之前，他的话语权必须先平滑地降到 0，否则总分会突然跳一下，这就是闪烁。", "equations": [{"tex": "w_{\\mathrm{ang}}(i) = 1 - \\frac{\\mathrm{penalty}_{\\mathrm{ang}}(i)}{\\mathrm{thresh}_{\\mathrm{ang}}},\\qquad \\tilde{w}_{\\mathrm{ang}}(i) = \\frac{w_{\\mathrm{ang}}(i)}{\\sum_{j=1}^{k} w_{\\mathrm{ang}}(j)}", "explain_zh": "penalty_ang(i) 是一个夹角：从代理交点 p 指向相机 i 光心的射线 r_i，与目标射线 r_d 之间的夹角。thresh_ang 是自适应阈值：在惩罚最小的 k 台相机中，取第 k 大的惩罚，也就是这 k 台里最大的那个。w_ang(i) 是未归一化的权重：惩罚为 0 时等于 1，线性降到阈值处为 0，所以第 k 台相机的权重恰好为 0；k 近邻之外的相机权重也是 0。w̃_ang(i) 是归一化后的权重，k 台相机的权重之和为 1。自适应阈值保证了相机进出 k 近邻集合时权重连续变化，代价是实际只有 k−1 台相机的权重非零。原文指出，这个形式不严格满足 epipole consistency，可以再乘以 1/penalty_ang(i) 来加强。"}, {"tex": "\\mathrm{penalty}_{\\mathrm{comb}}(i) = \\alpha\\,\\mathrm{penalty}_{\\mathrm{ang}}(i) + \\beta\\,\\mathrm{penalty}_{\\mathrm{res}}(i) + \\gamma\\,\\mathrm{penalty}_{\\mathrm{fov}}(i),\\qquad \\mathrm{penalty}_{\\mathrm{res}}(i) = \\max\\left(0,\\ \\lVert\\mathbf{p}-\\mathbf{C}_i\\rVert - \\lVert\\mathbf{p}-\\mathbf{D}\\rVert\\right)", "explain_zh": "总惩罚是三项惩罚的加权和。α、β、γ 是 ULR 的常数，与 alpha 通道、Quark 的 blend weights β 都无关；把某个常数设为 0，就忽略对应的那一项。penalty_res(i) 是简化的分辨率惩罚，其中 p 是代理上的点，C_i 是输入相机的光心，D 是目标相机的光心。输入相机比目标相机离 p 更远时，它的一个像素覆盖更大的表面面积，会造成欠采样和模糊，因此受罚；离得更近的相机不受罚，过采样可以用 mip-map 处理。penalty_fov(i) 在 p 位于相机 i 视场内时为 0，否则为 ∞，并且在接近图像边界时平滑增大，以保持连续。算出总惩罚后，再套用上面的 k 近邻权重公式。"}, {"tex": "\\mathcal{I}_{\\mathrm{FG}} = \\frac{\\sum_{k=1}^{K}\\mathcal{I}_k\\,\\alpha_k\\,w_k}{\\sum_{k=1}^{K}\\alpha_k\\,w_k},\\qquad \\mathcal{I} = (1-w_{\\mathrm{BG}})\\,\\mathcal{I}_{\\mathrm{FG}} + w_{\\mathrm{BG}}\\,\\mathcal{I}_{\\mathrm{BG}}", "explain_zh": "这是 Ha et al. 的 Eq. (4)–(5)。原文分母漏写了求和号，这里按 LLFF Eq. 8 补全。𝓘_k 是第 k 个视角前向 splat 到目标视角的图像；α_k 是该视角 splat 的累积不透明度，在空洞处约为 0；w_k 是 U-Net 预测的逐像素权重。先乘 α_k，再除以 Σα_k w_k，没有有效像素的视角就会自动退出，其余视角重新归一化；这一项起到了 ULR 中“可见性/视场”惩罚的作用。𝓘_FG 是前景混合结果；w_BG 是背景权重；𝓘_BG 是网络预测的背景图，用来填补去遮挡空洞。LLFF 的 Eq. 8 形式相同，只是权重取 w_{t,k} ∝ exp(−γ ℓ(p_t, p_k))，其中 ℓ 是目标相机与第 k 个相机中心的距离，γ = f/(D·z_min)。Ha et al. Table 3 中的 Distance-based Blending 引用的正是 LLFF，按目标相机到各输入相机的距离定权重（原文没有写出具体的函数形式）。"}, {"tex": "\\mathbf{c}_{\\ell}(\\mathbf{x}) = \\sum_{m=1}^{M}\\beta_{\\ell,m}(\\mathbf{x})\\, I_m\\!\\left(\\pi_m\\big(\\mathbf{x},\\, d_{\\ell}(\\mathbf{x})\\big)\\right),\\qquad \\beta_{\\ell,m}(\\mathbf{x}) = \\frac{\\exp z_{\\ell,m}(\\mathbf{x})}{\\sum_{m'=1}^{M}\\exp z_{\\ell,m'}(\\mathbf{x})}", "explain_zh": "这是把 Quark Eq. (1) 中的“混合”部分按层写开的形式，记号为本文所设。x 是目标像素，d_ℓ(x) 是第 ℓ 层在该像素处的深度。π_m 把目标射线上深度 d_ℓ 处的 3D 点投影到第 m 张输入图，I_m(·) 在全分辨率输入图上取值（原文没有写明插值核，这里按常规写作双线性采样）；这两步合起来就是算子 P^T_θ(I, d)。β_{ℓ,m} 是第 ℓ 层对第 m 个输入的混合权重。z_{ℓ,m} 是最后一个 Fusion Block 的 One-to-many attention 给出的 logit，先双线性上采样到输出分辨率，再在 M 个视角上做 softmax，所以 β 非负且和为 1。得到的 c_ℓ 随后与 density σ_ℓ 一起做 over 合成（见 i-layered）。与 ULR 不同，Quark 的权重是逐层给出的：同一个像素在前景层和背景层可以偏好不同的相机，从而隐式地处理遮挡。"}], "worked_example_zh": "（1）ULR 权重。目标光线打到代理上的点 p，4 台相机的角度惩罚分别为 C1 = 2°、C2 = 5°、C3 = 9°、C4 = 14°，取 k = 3。k 近邻是 C1、C2、C3，阈值取第 3 个，即 9°。未归一化权重为：C1 = 1 − 2/9 = 0.778，C2 = 1 − 5/9 = 0.444，C3 = 1 − 9/9 = 0；C4 不在集合内，权重为 0。归一化后 C1 = 0.778/1.222 = 0.636，C2 = 0.364。若 C1、C2 在 p 处的红色通道值分别为 200 和 180，则输出为 0.636 × 200 + 0.364 × 180 ≈ 192.7。\n\n（2）连续性。虚拟相机继续移动，C4 的角度逐渐变小，最终与 C3 交换名次。交换发生时，两者的惩罚都等于阈值，权重都为 0，所以输出连续变化。如果改用“k 近邻等权”：交换前输出为 (200 + 180 + 150)/3 = 176.7（C3 = 150），交换后为 (200 + 180 + 170)/3 = 183.3（C4 = 170）。一帧之内跳了 6.7 个灰度级，在视频里就表现为闪烁。Quark 取最近的 8 台、Ha et al. 取最近的 K 台，都属于硬选择。Quark 在 Sec. 4.1 末尾承认，目标相机移动时输入图像随之切换，会造成明显闪烁；Ha et al. 在 Sec. 3.2 承认，K 个最近视角变化时 TSDF 深度仍会有微小变化。\n\n（3）分辨率惩罚。目标相机 D 到 p 的距离为 1.5 m。C1 到 p 为 1.6 m，惩罚为 0.1；另一台相机 C5 到 p 为 3.0 m，惩罚为 1.5。即使 C5 的角度更小，只要 β 足够大，它的权重也会被压低。\n\n（4）Ha et al. 如何把这些准则变成特征（附录 A.4）。K = 4 时，U-Net 的输入共 9K + 1 = 37 个通道：前向渲染 RGB 12 个（3K），逐视角深度 4 个，alpha 4 个，TSDF 深度 1 个，另有四组、每组 K 个通道的相机特征共 16 个。这四组特征是：① 输入射线与 TSDF 法线的点积，反映掠射程度，与分辨率敏感性相关；② 输入射线与目标方向的点积，逐像素计算，最接近 ULR 的角度惩罚；③ 输入相机与目标相机的距离，空间广播成整张图，对应 LLFF 式的距离权重，也粗略反映分辨率差异；④ 输入与目标视线方向的点积，同样空间广播，反映相机朝向差异，对应 ULR Fig. 3 所说的“光心近不等于角度近”。α_k 则扮演可见性/视场惩罚的角色。这些量不再代入固定公式，而是交给网络去学怎样组合。\n\n（5）Quark 的权重规模。输出 LDM 为 6 层 × 288×512，每个位置有 M = 8 个 logit。上采样 3.75 倍到 1080×1920 后再做 softmax，共 6 × 1080 × 1920 × 8 ≈ 9950 万个权重，而且每帧、每个目标视角都要重新计算一次。", "pitfalls_zh": ["权重没有经过可见性调制，也没有重新归一化。前向 splat 之后，空洞里的像素是无效值，直接参与平均会让画面变暗，或者出现黑边。Ha et al. Eq. (4) 中的 α_k 和分母就是为了解决这个问题。注意原文分母漏写了求和号，按 LLFF Eq. 8 应为 Σ_k α_k w_k。", "硬切换相机集合。k 近邻集合变化时，如果被移出的相机权重不为 0，输出就会跳变，在视频中表现为闪烁。ULR 以第 k 个惩罚作为阈值来保证连续。Quark 取最近的 8 台、Ha et al. 取最近的 K 台，都是硬选择：Quark 在 Sec. 4.1 末尾承认，输入图像随目标相机移动而切换会造成明显闪烁，输入曝光差异大时尤甚；Ha et al. 在 Sec. 3.2 承认，K 集合变化时 TSDF 深度仍会有小幅变化。", "用相机中心距离代替视线夹角。相机朝向差异大时，“光心最近”不等于“视线最接近”（ULR Fig. 3）。Quark 默认按相机中心 L2 距离选最近的 8 台，在 Deep Blending 数据集上就因此改用了同时考虑视角夹角的选择启发式（Sec. 4.1）。", "高估凸组合的表达能力。权重非负且和为 1，输出永远落在输入颜色的凸包之内：相机之间曝光和白平衡不一致，会直接变成接缝；高光只能在输入之间“滑动”，无法出现在新位置。所以要先做相机颜色标定，再谈混合。"], "in_quark": {"used": true, "where": "Sec. 3.1 Eq. (1)、Sec. 3.2.1（射线方向编码）、Sec. 3.2.3（blend weights 由 One-to-many attention 产生，softmax 推迟到上采样之后）、Sec. 3.4、Sec. 4.1（视角选择与切换闪烁）、Sec. 4.2（RGB Output 消融）、Sec. 4.3", "how_zh": "LDM 在每层每个像素上存 M = 8 维的 blend weights β，形状为 [L, H, W, M]，Quark 输出时为 6 × 288 × 512 × 8。这些权重的 logit 由最后一个 Fusion Block 的 One-to-many attention 计算，先双线性上采样 3.75 倍到 1080p，再在 M 个视角上做 softmax（Sec. 3.2.3）。因此每个输出像素的权重非负且和为 1，是标准的凸组合 IBR。\n\n射线方向编码 γ（Sec. 3.2.1）在输入射线与目标射线重合时为 0，使网络“偏向离目标视角近的射线”，可以看作 ULR“最小角度偏差”准则的学习版本，但消融显示收益很小（30.41 对 30.32）。与 VDTM/ULR 不同，Quark 的权重是逐层给出的：同一个像素在前景层和背景层可以偏好不同的相机，从而隐式处理可见性。\n\n消融 RGB Output（Sec. 4.2 Table 4，以 Quark+ 为基线、半分辨率训练 250K 步，直接取网络 appearance 特征的前 3 个通道作输出）中，PSNR 从 30.41 降到 29.18，LPIPS 从 0.154 升到 0.179，是所有消融中退化最大的一项。\n\n视角选择是硬的：取相机中心 L2 距离最近的 8 台；训练时从最近的 16 台中随机抽 8 台（Sec. 3.4）。在相机朝向变化大的 Deep Blending 上，必须改用同时考虑视角夹角的启发式（Sec. 4.1），这正对应 ULR 所说的“距离近不等于角度近”。Sec. 4.1 末尾还承认，目标相机移动时输入图像随之切换，会造成明显闪烁，输入曝光差异大时尤其严重，这正是 ULR 连续性准则所警告的情况。\n\nSec. 4.3 承认了三点局限：凸组合无法准确表示视角相关的材质；输入曝光或焦距不同时，会产生边缘伪影和闪烁；标定误差会产生错误的硬边。"}, "in_ha": {"used": true, "where": "Sec. 3.3 Eq. (4)–(7)、附录 A.4、Sec. 4.5 Table 3、Fig. 4", "how_zh": "Eq. (4) 写作 𝓘_FG = Σ_k 𝓘_k α_k w_k / Σ_k α_k w_k（原文分母漏写了求和号），结构与 LLFF 的 Eq. (8) 完全相同。α_k 是逐视角前向渲染的累积不透明度，起到 ULR 中“可见性/视场”项的作用：空洞处 α_k ≈ 0，该视角自动退出。w_k 由 4 层 U-Net 预测（Sec. 3.3）。\n\n附录 A.4 列出的网络输入，相当于把 ULR 的惩罚项变成了特征：\n- 输入射线与目标方向的点积（逐像素），对应角度偏差；\n- 输入射线与 TSDF 法线的点积，反映掠射程度，与分辨率敏感性相关；\n- 输入相机与目标相机的距离（空间广播），对应 LLFF 式的距离权重；\n- 输入与目标视线方向的点积（空间广播），反映相机朝向差异。\nK = 4 时，网络输入共 9K + 1 = 37 个通道。Eq. (5) 再用 w_BG 与背景图 𝓘_BG 混合，以填补去遮挡区域。\n\nTable 3 表明，学习式混合是质量提升的主要来源。Distance-based Blending 按目标到各输入相机的距离定权重（引用 LLFF），PSNR 26.08、STED 235.3，Fig. 4(b) 显示它会产生重影。完整模型为 31.17 和 68.76。把所有高斯一次性渲染（No Blending）只有 24.64。\n\nL_Depth（Eq. 6）用同一组权重混合各视角的深度，再用 L1 损失把结果拉向 TSDF 深度（权重 0.1，属于软约束），这样就把“几何一致”的约束直接施加到了权重上。"}, "in_field_zh": "多相机临场系统的纹理阶段，本质上都是混合权重问题。Holoportation 一类系统在融合出的网格上，把多个彩色相机的图像按视角加权投影上去；Montage4D（2018）专门研究如何让这些权重在时间上平滑变化，以消除接缝和闪烁。在工程上，权重的效果高度依赖相机的颜色标定：统一曝光和白平衡，并做颜色校正矩阵（CCM）之后，混合才能无缝。另外，双目显示或多观看者时，每只眼睛的权重都不同，需要注意左右眼之间的一致性（见 v-perception）。", "resources": [{"title": "Unstructured Lumigraph Rendering (Buehler, Bosse, McMillan, Gortler & Cohen, SIGGRAPH 2001)", "url": "https://groups.csail.mit.edu/graphics/pubs/siggraph2001_ulr.pdf", "type": "paper", "note_zh": "原论文，MIT 存档的 PDF。第 3 节列出理想 IBR 应满足的 8 条目标，第 4 节给出 k 近邻角度权重、分辨率惩罚、视场惩罚以及组合惩罚的公式。本概念的核心读物。"}, {"title": "Modeling and Rendering Architecture from Photographs (Debevec, Taylor & Malik, SIGGRAPH 1996)", "url": "https://www.pauldebevec.com/Research/debevec-siggraph96-paper.pdf", "type": "paper", "note_zh": "VDTM 的起点。第 3 节把每张照片当作一台幻灯机，投影到模型上；多张照片按与新视线的夹角成反比加权，并在照片边界附近把权重逐渐降到 0，以避免接缝。"}, {"title": "Computer Vision: Algorithms and Applications, 2nd ed. (Szeliski), §14.1.1 View-dependent texture maps", "url": "https://szeliski.org/Book/", "type": "book", "note_zh": "教科书中对 VDTM 和多视角混合的讲解，建议与 14.3 节的光场部分对照阅读。"}, {"title": "IBRNet: Learning Multi-View Image-Based Rendering (Wang et al., CVPR 2021)", "url": "https://arxiv.org/abs/2102.13090", "type": "paper", "note_zh": "学习式混合权重的代表作：在每个 3D 采样点上用均值和方差聚合多视角特征，预测源视角颜色的混合权重。Quark 的对比基线在 RFF 和 IBRNet 数据上重训；它也是 Ha et al. 的对比方法（使用作者发布的预训练权重）。"}], "self_check": [{"q_zh": "ULR 为什么把阈值设为 k 近邻中第 k 台相机的角度惩罚，而不是用一个全局常数？", "a_zh": "在非结构化输入下，全局阈值两头不讨好。相机稀疏的区域需要足够大的阈值才能找到可用的相机，但同样的阈值放到相机密集的区域，又会把太多相机混在一起，导致模糊。用第 k 台相机的惩罚作为阈值，既能适应局部的相机密度，又能保证第 k 台相机的权重恰好为 0。这样，相机进出 k 近邻集合时，权重都是从 0 开始连续变化的，不会跳变，满足连续性目标。"}, {"q_zh": "在 Ha et al. 的 Eq. (4) 中，假设某像素 4 个视角的网络权重都是 0.25，第 3、4 个视角在该处是空洞（α = 0），第 1、2 个视角的颜色分别为 200 和 190（α = 1）。输出是多少？如果不除以 Σα_k w_k，结果会怎样？", "a_zh": "归一化后，𝓘_FG = (0.25 × 200 + 0.25 × 190)/(0.25 + 0.25) = 195。如果不归一化，结果为 0.25 × 200 + 0.25 × 190 = 97.5，亮度减半，会在去遮挡区域的边缘形成暗色光晕。α_k 和分母的作用，是让没有有效像素的视角自动退出，其余视角重新归一化。这与 LLFF Eq. (8) 用累积 alpha 调制权重是同一个道理。"}, {"q_zh": "Quark 改为直接输出 RGB 时 PSNR 下降 1.23 dB，但它又承认 blend weights 无法准确表示视角相关的材质。这两件事该如何统一理解？", "a_zh": "Quark 的网络只在低分辨率的内部 LDM 上求解（Quark 为 6 层 × 288×512，消融所用的 Quark+ 为 8 层 × 432×768）。如果直接回归 RGB（消融中取 appearance 特征的前 3 个通道），颜色的分辨率就被限制在内部分辨率，再上采样到 1080p（Quark 3.75 倍，Quark+ 约 2.5 倍）时高频细节会丢失；blend weights 则直接从全分辨率输入图中取纹理，所以结果更锐利（LPIPS 0.154 对 0.179）。但 blend weights 是凸组合，输出颜色只能落在 M 个输入颜色的凸包之内。如果目标视角中高光的位置或强度与所有输入都不同，就无法正确合成，只能在输入之间“滑动”，或者以重影的形式出现。换句话说，IBR 用“不能创造新颜色”换来了“不丢失高频细节”。"}], "prereqs": ["i-lightfield", "r-appearance"]}, {"id": "i-warping", "name_zh": "基于深度的渲染：前向/后向 warping、空洞与飞点", "name_en": "Depth-image-based rendering: forward/backward warping, holes & flying pixels", "tldr_zh": "有了逐像素深度，就能把一张图“搬”到新视角。前向 warping 把每个源像素推到它在目标图中的位置，会产生裂缝、去遮挡空洞、多对一冲突和飞点。后向 warping 从每个目标像素出发，回到源图里取值，不会产生裂缝，但必须事先知道目标视角的深度。", "intuition_zh": "基于深度图的渲染（DIBR）的核心是一条 3D warping 公式：给源像素 (u, v) 配上深度 z，反投影成 3D 点，变换到目标相机坐标系，再投影到目标图像上。McMillan & Bishop 1995、Mark et al. 1997（post-rendering 3D warping），以及 3D-TV 领域中 Fehn 2004 的 DIBR，都建立在这条公式上。最关键的规律是：视差与深度成反比。相机平移同样的距离，近处的物体在图像中移动得多，远处的移动得少。新视角中“前景盖住背景、背景从前景后面露出来”的现象，都源于此。\n\n前向 warping（也叫 splatting）遍历源像素，算出每个像素在目标图中的位置，再写进去。这样做会遇到四类问题：\n(a) 裂缝：目标位置通常不是整数；源像素网格变形后（例如放大或落在斜面上），不再能铺满目标网格，于是出现针孔状的洞。\n(b) 多对一：多个源像素落到同一个目标像素上，需要用 z-buffer 保留最近的那个。\n(c) 去遮挡（disocclusion）：有些背景在新视角中可见，在源视角中却被挡住，根本没有对应的源像素，于是形成成片的空洞，只能靠其他视角或补全算法来填。\n(d) 飞点（flying pixels）：立体匹配会把深度边缘抹平，ToF 传感器在物体边缘会得到前景与背景的混合像素。这些像素被反投影到前景与背景之间的“半空中”，warp 之后就成了悬浮的彩色斑点或条纹。\n治裂缝的办法是给每个点一个面积，即用圆盘或 EWA 高斯做 splat，世界空间尺寸与 z/f 成正比。\n\n后向 warping 反过来遍历目标像素：用目标深度把像素反投影成 3D 点，投影到源图，再做双线性采样。它不会产生裂缝，而且天然可微（例如 PyTorch 的 grid_sample）。问题在于，它需要的恰恰是我们不知道的量：目标视角的深度。常见解法有两种。第一种是枚举深度假设，对每个假设深度都做一次后向 warp，这就是平面扫描与 MPI/LDM（见 i-layered、i-psv），也是 Quark 的做法。第二种是先把深度前向 warp 或融合到目标视角，再用它后向取颜色。Ha et al. 用 TSDF 在目标视角融合出了一张深度图，但只把它当作融合网络的引导，颜色仍然来自前向 splat。\n\n多个视角同时 warp 时，还会出现 z-fighting。同一个表面被多个视角各自重建，每个视角的深度都带噪声。把它们全部放进同一个 z-buffer 后，每个像素由哪个视角胜出几乎是随机的，结果就是斑驳的纹理，边缘处还叠加了各视角的飞点。Ha et al. 的对策是：把每个像素变成一个 3D 高斯，它完全不透明、各向同性，在源图中的投影恰好覆盖 1 个像素；然后用 3DGS 光栅器对每个视角单独渲染，得到各自的图像、alpha 和深度，再交给网络融合，而不是把所有视角一次性渲染出来。", "analogy_zh": "前向 warping 像从侧面看一面贴满便利贴的墙，而且每张便利贴都按深度钉在离墙不同远的位置。换个角度后，便利贴之间会露出缝（裂缝）；原本被前排便利贴挡住的墙面露了出来，却是一片空白（去遮挡）；钉歪了、悬在半空的便利贴会飘在前景和背景之间（飞点）。后向 warping 则像站在新的位置上，对每条视线问一句“你打到哪儿了？”，再回到原照片里找那一点的颜色。前提是，你已经知道每条视线打出去有多远。", "equations": [{"tex": "\\tilde{\\mathbf{x}}_t \\sim \\mathbf{K}_t\\left(\\mathbf{R}\\, z_s\\, \\mathbf{K}_s^{-1}\\tilde{\\mathbf{x}}_s + \\mathbf{t}\\right)", "explain_zh": "这是前向 3D warping。x̃_s = (u_s, v_s, 1)ᵀ 是源像素的齐次坐标。z_s 是该像素的深度，指相机坐标系中的 z 分量，不是沿射线的欧氏距离。K_s⁻¹x̃_s 是 z = 1 处的射线方向，乘以 z_s 就得到源相机坐标系中的 3D 点。[R | t] 把源相机坐标变换到目标相机坐标，K_t 再把点投影到目标像平面。“∼”表示两边相差一个尺度因子：把结果向量除以它的第三个分量，就得到目标像素坐标；而第三个分量本身正是该点在目标视角中的深度 z_t，用于在 z-buffer 中判断遮挡。"}, {"tex": "\\Delta u = \\frac{f\\,b}{z},\\qquad w_{\\mathrm{hole}} \\approx f\\,b\\left(\\frac{1}{z_{\\mathrm{fg}}} - \\frac{1}{z_{\\mathrm{bg}}}\\right)", "explain_zh": "对于矫正后的双目或纯水平平移，3D warping 退化为一个水平位移 Δu（像素）。f 是焦距（像素），b 是基线（米），z 是深度（米）。去遮挡带的宽度 w_hole 近似等于前景与背景的视差之差：f·b 越大（相机移得越远）、前景越近、背景越远，露出来的空洞就越宽。"}, {"tex": "I_t(\\mathbf{x}_t) = I_s\\!\\left(\\pi_s\\!\\left(\\mathbf{R}^{\\top}\\big(z_t(\\mathbf{x}_t)\\,\\mathbf{K}_t^{-1}\\tilde{\\mathbf{x}}_t - \\mathbf{t}\\big)\\right)\\right)", "explain_zh": "这是后向 warping。对每个目标像素 x_t，先用目标深度 z_t(x_t) 反投影，得到目标坐标系中的 3D 点 z_t K_t⁻¹x̃_t。再用 [R | t] 的逆变换 Rᵀ(· − t) 把它变回源相机坐标。π_s(X) 表示先算 K_s X、再除以第三个分量，得到源像素坐标；I_s(·) 在该坐标处做双线性采样。每个目标像素恰好取一次值，所以不会有裂缝；但前提是 z_t 已知，也就是必须知道目标视角的深度。如果 z_t 取一组假设值（例如一组平面或 LDM 的各层），就得到平面扫描，或者 Quark 中的 P^T。"}, {"tex": "s_{\\mathrm{world}} \\approx \\frac{z_s}{f_s},\\qquad r_t \\approx \\frac{f_t\\, s_{\\mathrm{world}}}{z_t} = \\frac{f_t}{f_s}\\cdot\\frac{z_s}{z_t}", "explain_zh": "s_world 是深度 z_s 处一个源像素在世界空间中覆盖的边长，f_s 是源相机焦距（像素）。按 Ha et al. 的描述，高斯在源图中的投影要恰好覆盖 1 个像素，它的尺度就应在 s_world 这个量级；原文没有给出具体常数。r_t 是这个 splat 投到目标视角后的像素尺寸，f_t 是目标相机焦距，z_t 是该点在目标视角中的深度。目标相机更靠近物体（z_t < z_s）或焦距更长时，r_t > 1，只占 1 个像素的点 splat 就会留下裂缝。此外，表面倾斜时，实际的足迹还会沿倾斜方向拉长，而各向同性的高斯忽略了这一点。"}], "worked_example_zh": "设定：矫正双目，焦距 f = 1000 像素，相邻相机基线 b = 0.10 m。人（前景）在 z_fg = 1.0 m，背景墙在 z_bg = 4.0 m。\n\n（1）视差：前景为 1000 × 0.1 / 1.0 = 100 像素，背景为 1000 × 0.1 / 4.0 = 25 像素。\n\n（2）去遮挡：目标相机相对源相机右移 10 cm，场景在图像中整体左移，前景移动 100 像素，背景只移动 25 像素。人物右侧有一段背景在源图中被人挡住，宽 75 像素。于是在目标图中，人物右侧会出现一条约 w_hole = 1000 × 0.1 × (1 − 0.25) = 75 像素宽的空洞，只能靠其他视角或补洞算法来填。\n\n（3）飞点：设人物右边缘在源图第 1000 列。目标图中，人物右边缘左移 100 像素到第 900 列；边缘右侧紧邻的背景（源图第 1001 列起）只左移 25 像素，到第 976 列。所以空洞带大约是第 901–975 列。边缘上某个像素的深度被立体网络平滑成了 2.0 m，视差为 50 像素，warp 后落在第 950 列，正好在空洞带内部，成为悬在人与墙之间的彩色斑点。\n\n（4）z-fighting：两个视角都看到 z = 4 m 的墙，深度噪声的标准差为 2 cm。在同一个目标像素上，两者的深度差会随机变号。如果一次性放进 z-buffer，每个像素会随机取其中一个视角的颜色。若两台相机的曝光相差 5 个灰度级，画面上就会出现椒盐状的斑块，而且每帧都在变，形成闪烁。\n\n（5）裂缝：目标相机向人靠近，使深度从 1.0 m 变为 0.8 m，焦距不变。源像素的足迹为 s_world = 1.0/1000 = 1 mm，投到目标视角为 r_t = 1000 × 0.001 / 0.8 = 1.25 像素。如果每个点只写 1 个像素，按面积粗估，约有 1 − 1/1.25² ≈ 36% 的目标像素不会被覆盖。Ha et al. 的像素高斯有平滑的尾部，可以部分填补这类针孔（附录 A.3, Fig. 10），但填补不了（2）中那种大块的去遮挡。", "pitfalls_zh": ["把前向 warp 的结果直接当作图像使用。空洞处没有有效像素，必须同时输出有效性掩码或 alpha 掩码（即 Ha et al. 的 α_k）。否则黑色的空洞会参与后续混合，形成暗边。", "后向 warping 时用源视角的深度代替目标视角的深度。相机移动越大，错位就越大；在遮挡边界处，还会把前景的颜色拉到背景上。后向查找需要的是目标深度。", "把多个视角放进同一个 z-buffer 一次性渲染。有深度噪声时，会出现 z-fighting，多个视角的飞点也会叠加在一起（Ha et al. Fig. 4a；Table 3 中 No Blending 的 PSNR 为 24.64、STED 为 483.3）。逐视角渲染再用网络学习融合，结果更稳定。", "忽视深度边缘与 splat 尺寸。立体匹配或 ToF 得到的深度在物体轮廓处是混合值，这是飞点的主要来源，应当降低边缘处的置信度或直接剔除（Ha et al. 的 TSDF 权重用 7×7 邻域的局部深度方差来降低边缘置信度）。splat 固定为 1 像素时，在放大或掠射角下会留下裂缝；splat 太大又会糊掉细节。Ha et al. 的各向同性解析尺度没有考虑表面倾斜。"], "in_quark": {"used": true, "where": "Sec. 3.1 Eq. (1)（P^T，后向）、Sec. 3.2.2 Eq. (2) 与 Fig. 3(a)（Render to Input Views，双线性 splat，前向）", "how_zh": "Quark 两个方向的 warping 都用到了。\n\n（1）最终渲染时，Eq. (1) 中的 P^T_θ(I, d) 是后向 warping。LDM 位于目标视锥内，每层每个像素都已有深度 d，所以可以对每个目标像素、每一层，把对应的 3D 点投影到 8 张输入图上取值（原文未写明插值核，通常为双线性采样）。正是因为 LDM 提供了目标一侧的深度，才能使用不产生裂缝的后向查找；整个 Eq. (1) 渲染器（反投影、混合、over 合成）经 CUDA 优化后，1080p 下约 1.3 ms（Sec. 3.1）。去遮挡由多层结构和 blend weights 共同处理：在前景层上，看不到该点的相机得到较低的权重；在背景层上，则从能看到该点的相机取色。\n\n（2）迭代过程中的 Render to Input Views（Sec. 3.2.2, Eq. 2, Fig. 3a）是前向方向：把中间 LDM 各层的 density 和 appearance（直接由 c = sigmoid(V W_a) 解码，不用 blend weights）用双线性 splat 投影到每个输入视角，再做 over 合成，得到渲染图 Ĩ。论文指出，splat 可以避免昂贵的光线追踪或光栅化。Ĩ 与观测 I_k 之间的差异揭示了遮挡与可见性信息；消融实验中去掉 Ĩ 后，PSNR 从 30.41 降到 29.71，约 0.7 dB。\n\n不懂 warping，就读不懂 Eq. (1)、(2) 中 P（前向投影）与 P^T（它的伴随，即后向投影）的含义。"}, "in_ha": {"used": true, "where": "Sec. 3.1、Fig. 4、附录 A.3 与 Fig. 10、附录 A.2、Table 3 与 Table 4", "how_zh": "Ha et al. 流程的第一阶段就是 DIBR 前向 warping（Sec. 3.1）。取 K 个最近视角，把其中每个像素用 RAFT-Stereo 深度 D_k 和相机位姿反投影成一个 3D 高斯。这个高斯完全不透明、各向同性，尺度设为在源图中恰好覆盖 1 个像素，颜色等于该像素的值。随后用原版 3DGS 光栅器逐视角渲染到目标相机，得到 𝓘_k、α_k、𝒟_k。在 DyNeRF（1352×1014）上取 K = 4 时，这一步约需 10 ms（Table 4）。\n\n与传统点溅射（Aliev et al. 的 NPBG [1]）相比，高斯减少了像素间的空隙和锯齿（附录 A.3, Fig. 10）。但作者明确承认，去遮挡和深度误差仍然会造成空洞与飞点。\n\n关键设计在于：不像 GS-LRM [79] 或 GPS-Gaussian [82] 那样把所有视角的高斯一次性渲染。一次性渲染既消除不了飞点和空洞，还会因为 Z-fighting 让边缘变差（Fig. 4a；Table 3 中 No Blending 的 PSNR 为 24.64、STED 为 483.3）。作者选择对每个视角单独渲染，保留各自的空洞和深度，交给几何引导的融合网络去裁决。\n\n附录 A.3 还解释了为什么不用网络预测高斯尺度、把背景“撑大”来填洞：那样会降低 PSNR，所以空洞改由背景图 𝓘_BG 处理。附录 A.2 中，K 张颜色差分掩码同样是用 Gaussian splatting 前向投影到新视角，再逐通道取最大值。"}, "in_field_zh": "DIBR 是 3D-TV、自由视点视频和 MPEG 沉浸式视频（纹理加深度）的标准渲染方式。VR 头显中的异步时间扭曲和空间扭曲（ATW/ASW），以及临场系统中“用最新的头部位姿重投影上一帧”的延迟补偿，本质上也都是深度 warping，同样要处理去遮挡空洞（见 v-perception、v-codec）。RGB-D 传感器（尤其是 ToF）在物体轮廓处产生的混合像素，是临场画面中飞点的主要来源（见 d-sensors）。在发送端清理边缘深度，往往比在渲染端补救更省事。", "resources": [{"title": "Computer Vision: Algorithms and Applications, 2nd ed. (Szeliski), §14.1 View interpolation", "url": "https://szeliski.org/Book/", "type": "book", "note_zh": "教科书对“深度图 + 参考图像”视图插值的讲解，涵盖前向与后向映射、空洞处理，以及 14.1.1 节的视角相关纹理。"}, {"title": "Depth-image-based rendering (DIBR), compression, and transmission for a new approach on 3D-TV (Fehn, SPIE 2004)", "url": "https://doi.org/10.1117/12.524762", "type": "paper", "note_zh": "3D-TV 中 DIBR 的经典论文。发送端传输单目彩色视频加逐像素深度，接收端（例如机顶盒）实时合成若干个虚拟视图。文中介绍了 DIBR 算法、立体视图的生成，以及兼容现有系统的压缩与传输方案，是后续大量补洞与深度预处理工作的起点。"}, {"title": "Softmax Splatting for Video Frame Interpolation (Niklaus & Liu, CVPR 2020)", "url": "https://arxiv.org/abs/2003.05534", "type": "paper", "note_zh": "前向 warping 的可微实现。多个源像素落到同一个目标像素时，按一个可学习的重要性度量做 softmax 加权，相当于一个“软 z-buffer”。文中对前向与后向 warping 的对比讨论很适合入门。"}, {"title": "FWD: Real-time Novel View Synthesis with Forward Warping and Depth (Cao, Rockwell & Johnson, CVPR 2022)", "url": "https://arxiv.org/abs/2206.08355", "type": "paper", "note_zh": "基于深度前向 warping 加学习式融合的实时新视角合成方法。Ha et al. 把它重新训练后作为 baseline，它在 DyNeRF 上的 PSNR 为 16.97，适合与 Ha et al. 的像素高斯加几何引导方案直接对照。"}], "self_check": [{"q_zh": "焦距 f = 1000 像素，相机平移 5 cm，前景在 0.8 m、背景在 2.5 m，去遮挡带大约有多宽？如果边缘上有一个深度被平滑成 1.5 m 的像素，它会落在哪里？", "a_zh": "前景视差为 1000 × 0.05/0.8 = 62.5 像素，背景视差为 1000 × 0.05/2.5 = 20 像素，所以空洞宽约 42.5 像素。深度为 1.5 m 的边缘像素，视差为 33.3 像素，介于前景与背景之间，正好落进空洞带内部，成为一个悬在空中的飞点。"}, {"q_zh": "为什么 Quark 的最终渲染可以用不产生裂缝的后向 warping，而 Ha et al. 的第一阶段却用前向 splat？", "a_zh": "后向 warping 需要目标视角的深度。Quark 的 LDM 本身就定义在目标视锥内，每层每个像素都有深度，所以 P^T 可以对每个目标像素、每一层，直接回到输入图中采样。Ha et al. 手头只有输入视角的深度（来自 RAFT-Stereo），必须先把像素推到目标视角。它的 TSDF 深度虽然是目标视角的深度，但作者只把它用作融合网络的引导和 L_Depth 的目标，颜色仍然来自逐视角的前向 splat。"}, {"q_zh": "z-fighting 与飞点有什么区别？Ha et al. 为什么对每个视角单独渲染？", "a_zh": "飞点是单个视角内部的问题：边缘像素的深度估错了，像素被放到了前景与背景之间的半空中。z-fighting 是多个视角之间的问题：同一个表面被几个视角以略有差异的深度重建出来，一次性放进 z-buffer 时，每个像素由哪个视角胜出是随机的，于是形成斑驳的纹理，而且每帧都在变，造成闪烁。Ha et al. 把 K 个视角分别渲染成 𝓘_k、α_k、𝒟_k，避免了 z-fighting，并把“该相信哪个视角”交给以 TSDF 深度为引导的融合网络来判断。Table 3 中，一次性渲染（No Blending）的 PSNR 只有 24.64，STED 高达 483.3；完整模型分别为 31.17 和 68.76。"}], "prereqs": ["g-pinhole", "g-depth", "r-raster"]}, {"id": "i-layered", "name_zh": "分层表示：MPI、LDI 与分层深度图（LDM）", "name_en": "Layered representations: MPI, LDI & layered depth maps", "tldr_zh": "分层表示把场景切成若干张带透明度的图层。MPI 由固定深度的平面组成；LDI 在每个像素上存多个深度样本；MSI 由同心球面组成；LDM 的每一层都带逐像素深度。渲染时，只需把每层 warp 到新视角，再从后往前做 over 合成。因此，遮挡、半透明和软边缘都可以交给 2D 网络处理。", "intuition_zh": "单张深度图的根本限制在于每个像素只能有一个深度。前景边缘的混合像素、被前景挡住的背景都无法表示，所以 warp 之后会出现空洞和飞点（见 i-warping）。分层表示让每个像素可以同时拥有多个位置。分层深度图像（LDI，Shade et al. 1998）沿同一条视线存储多个（颜色，深度）样本，前景背后的背景也被记录下来。新视角中背景露出来时，就有内容可用。\n\n多平面图像（MPI）来自 Zhou et al. 2018 的 Stereo Magnification。它在参考相机的视锥里放置 D 个前平行平面，通常在视差（逆深度）上等间隔分布，每个平面是一张 RGBA 图。渲染时，每个平面到新视角的映射是一个单应变换；warp 完之后，从后往前做 over 合成。借助 alpha，MPI 能表示软边缘和半透明，甚至可以把反射放在更远处的“虚平面”上。它的代价有三点：一是需要很多平面，Stereo Magnification 用了 D = 32，而按 LLFF 的界，相邻视角间允许的视差与平面数成正比；二是绝大多数平面上的绝大多数像素都是透明的，存储和计算都被浪费；三是偏离参考视角太远时，会露出“一张张卡片”的感觉。多球面图像（MSI，Broxton et al. 2020、MatryODShka 2020）把平面换成同心球面，用于 360° 场景。\n\n分层深度图（LDM）和 layered mesh 更进一步：每层的深度不再是常数，而是一张逐像素深度图，可以贴着物体表面走。这样只用很少的层，就能达到上百个平面才有的深度精度。Immersive Light Field Video（Broxton et al. 2020）先求解 MSI，再把大量球壳层压缩成少量带深度的 RGBA 层；StereoLayers 和 SIMPLI 用少量非平面层；Quark 则直接渲染 LDM，不建网格。可以把 LDM 看作体渲染的稀疏近似（见 r-volume）：每一层就是射线上的一个采样点，只是位置可以学习、数量极少；每层的 density 就是该采样点的 alpha。\n\n所有分层表示的渲染，最终都归结为 over 合成：C = Σ_i c_i α_i Π_{j>i}(1 − α_j)，其中 i 从远到近编号。它与 NeRF 的离散体渲染、3DGS 的从前到后 alpha 混合本质相同，区别只在于采样点放在哪里：MPI 放在固定平面上，LDM 放在网络预测的曲面上，NeRF 沿射线随机或分层采样，3DGS 放在各个高斯的中心。", "analogy_zh": "分层表示很像迪士尼动画用的多平面摄影台（Stereo Magnification 论文里也用了这个类比）。前景的树叶、中景的人物、远景的山峦分别画在不同距离的透明玻璃板上。镜头平移时，各层以不同速度滑动，于是产生了视差。MPI 相当于“很多块平的玻璃板”；LDM 相当于“少数几块可以弯曲、贴着物体表面走的玻璃板”。", "equations": [{"tex": "C = \\sum_{i=1}^{D} c_i\\,\\alpha_i \\prod_{j=i+1}^{D}\\left(1-\\alpha_j\\right)", "explain_zh": "从后往前的 over 合成。D 是层数，i = 1 是最远的一层，i = D 是最近的一层。c_i 和 α_i 是第 i 层在该像素处的颜色和不透明度。Π_{j>i}(1 − α_j) 是第 i 层前方所有层的累积透射率，表示第 i 层的颜色有多少能穿过前面的层到达相机。如果 α_D = 1，后面的层就全被挡住了。这个公式与 NeRF 的离散体渲染完全同构（见 r-volume、r-alpha）。"}, {"tex": "\\tilde{\\mathbf{x}}_s \\sim \\mathbf{K}_s\\left(\\mathbf{R} + \\frac{\\mathbf{t}\\,\\mathbf{n}^{\\top}}{d_i}\\right)\\mathbf{K}_t^{-1}\\,\\tilde{\\mathbf{x}}_t", "explain_zh": "平面诱导的单应变换。平面写在“发起查找的相机”坐标系中，这里指目标相机 t，形式为 nᵀX = d_i，其中 n 是单位法向（前平行平面时 n = (0, 0, 1)ᵀ），d_i 是平面到光心的距离。[R | t] 把目标相机坐标变换到源相机坐标。由 X_s = R X_t + t，以及平面上的点满足 nᵀX_t/d_i = 1，可得 X_s = (R + t nᵀ/d_i) X_t；两边再分别乘上内参，就得到上式。构建 PSV 时就是这种情形。渲染 MPI 时，平面固定在参考相机中，需要先把 (n, d_i) 变换到目标相机坐标系，再代入同一个公式；Stereo Magnification 的 Sec. 3.3（Eq. 2）给出了展开后的形式。每一层只需一个 3×3 矩阵，所以 MPI 渲染极快。"}, {"tex": "\\delta_{\\ell} = \\frac{\\ell - 0.5}{L},\\qquad d_{\\ell} = \\left[\\left(\\delta_{\\ell} + \\frac{0.5}{L}\\tanh(\\mathbf{V}W_{d})\\right)\\left(\\frac{1}{\\eta} - \\frac{1}{f}\\right) + \\frac{1}{f}\\right]^{-1}", "explain_zh": "Quark 的 Eq. (3)–(4)。L 是层数，ℓ 取 1 到 L。δ_ℓ 是第 ℓ 层的锚点（anchor），即它在归一化视差 [0, 1] 中所占区间（带）的中心。η 和 f 分别是目标视锥的近平面和远平面，由 SfM 点的深度分布逐样本确定。注意这里的 f 指远平面，不是焦距。V 是该层的特征，W_d 是一个线性投影。tanh 的取值范围是 (−1, 1)，因此这一层只能在自己的带内移动，幅度为 ±0.5/L。方括号里算出的是视差，取倒数就得到深度。ℓ = 1 是最远的一层，ℓ = L 是最近的一层。当 tanh = 0 时，各层退化为在视差上等间隔的 MPI 平面，这也正是初始化时使用的平面。"}, {"tex": "C_d = w_d \\odot I_1 + (1 - w_d) \\odot \\hat{I}_b", "explain_zh": "Stereo Magnification 的颜色参数化（原文 Eq. 1）。C_d 是第 d 个平面的 RGB 图。I_1 是参考输入图，相当于“前景”。Î_b 是网络预测的一张全局背景图，用来表示在参考视角中被遮挡的表面。w_d 是该平面的逐像素混合权重，⊙ 表示逐元素相乘。这样网络只需输出 D 张 alpha 图、D 张权重图和 1 张背景图，共 WH(2D + 3) 个数，而不必直接输出 RGBA 的 4DWH 个数。LLFF 把这种参数化换成 5 个输入视角 PSV 的凸组合，以便利用参考视角看不到、但其他视角能看到的内容。Quark 进一步推广为每层对 M 张输入图的 blend weights。Ha et al. 的背景图 𝓘_BG 与这里的 Î_b 思路同源。"}], "worked_example_zh": "（1）over 合成。三层从后往前依次是：背景 c = 100、α = 1；中层 c = 200、α = 0.5；前层 c = 50、α = 0.2。结果为 C = 100 × 1 × 0.5 × 0.8 + 200 × 0.5 × 0.8 + 50 × 0.2 = 40 + 80 + 10 = 130。\n\n（2）Quark 的深度带。取 η = 1 m，f = 100 m，L = 6，则 1/η − 1/f = 0.99，每层的带宽是归一化视差的 1/6。\n- 最近层 ℓ = 6：δ = 0.917，视差范围为 (0.833 至 1.0) × 0.99 + 0.01 = 0.835 至 1.0 m⁻¹，对应深度 1.0 至 1.20 m。\n- ℓ = 4：视差 0.505 至 0.670，深度 1.49 至 1.98 m。\n- ℓ = 3：视差 0.340 至 0.505，深度 1.98 至 2.94 m。\n- 最远层 ℓ = 1：视差 0.01 至 0.175，深度 5.7 至 100 m。\n可见近处的层在深度上很薄，远处的层很厚，这与像素位移正比于逆深度是一致的。站在 1.5 m 处的人（视差 0.667）落在第 4 层带内、靠近前沿的位置。\n\n（3）存储量对比。在 288×512 分辨率下，D = 32 的 RGBA MPI 共有 32 × 4 × 147,456 ≈ 1887 万个数。Quark 的 6 层 LDM 每层存 depth、density 和 8 个 blend weights，共 10 个数，总计 6 × 10 × 147,456 ≈ 885 万个数。而且 LDM 的颜色直接取自全分辨率输入图，不需要单独存储。", "pitfalls_zh": ["平面数不够。视角远离参考视角时，会出现分层阶梯和重影。LLFF 的 d_max ≤ D 给出了量化指引：视差有多大，就需要多少层。", "在深度上等间隔放置各层。透视投影下，像素位移正比于逆深度，所以应当在视差上等间隔放置（Stereo Magnification 和 Quark Eq. 3–4 都是这样做的）。近平面和远平面如果设错，物体会落到所有层之外。Quark 靠 SfM 点来确定 η 和 f，实时系统则需要在线估计深度范围。", "混淆 LDI、MPI、LDM 与 NeRF 中的密度。LDI 每个像素沿视线存可变个数的样本，每个样本存 RGBA 颜色、深度和 splat 索引，按 McMillan 的 warp 顺序从后往前 splat，不需要 z-buffer。MPI 各层深度固定、每层是一张 RGBA 图，用单应变换渲染。Quark 的 density 经 sigmoid 输出，原文直接称之为 transparency（即 alpha）；NeRF 的体密度 σ 则不同，要经过 1 − exp(−σδ) 才能变成 alpha。", "忽视逐视角表示的观看范围。单个 MPI 或 LDM 不能从任意方向观看，Quark 在 Sec. 2.1 中也承认这一点。Quark 通过为每个目标视角重建一次来绕开这个限制，代价是双目或多观看者时，计算量随视点数线性增长。"], "in_quark": {"used": true, "where": "Sec. 1、Sec. 2.1、Sec. 3.1 Eq. (1)、Sec. 3.2.2（Layer Collapse、Initialization）、Sec. 3.2.3 Eq. (3)–(4)、Sec. 3.4、Sec. 4.2、附录 C 表 8/9", "how_zh": "LDM 是 Quark 的核心表示（Sec. 1、2.1、3.1）。它有 L 层，每层的空间尺寸为 [H, W]，位于目标视锥内。每层有三种属性：depth d，形状 [L, H, W, 1]；density σ，形状 [L, H, W, 1]，也就是 alpha；blend weights β，形状 [L, H, W, M]。\n\n渲染按 Eq. (1) 进行：先把输入图按每层深度做后向投影（P^T），再用 β 混合成每层的 RGB，最后按 σ 从后往前做 over 合成。深度参数化 Eq. (3)–(4) 把每层限制在近平面与远平面 (η, f) 之间的等视差带内。这是在 MPI（固定平面）和 LDM（深度可动）之间的折中，保证各层的顺序不会交叉。\n\n由粗到细，层数和分辨率这样变化（附录 C Table 8/9）：\n- Quark：24 层 36×64 → 24 层 72×128 → 12 层 144×256 → 6 层 288×512；\n- Quark+：32 层 54×96 → 32 层 108×192 → 16 层 216×384 → 8 层 432×768。\n最后两次 Update & Fuse 之前各做一次 Layer Collapse。它是一个残差 MLP：直通支路取相邻两层的均值，残差支路把两层拼接起来。去掉它之后质量略有上升（30.56 对 30.41），但运行时间增加 115%（Sec. 4.2）。初始化时，各层取平坦的 anchor 平面，也就是一个标准的 MPI（Sec. 3.2.2 Initialization）。\n\nSec. 2.1 说明了选择 LDM 的理由。每一层相当于体渲染中的一个射线步长，每层的深度又贴合平滑的表面，因此兼顾了体表示的质量和表面表示的效率。LDM 是 2D 结构，可以使用高效的 2D 网络。相比之下，MPI 类方法（DeepView、Stereo Magnification）需要大量的层。LDM/LM 不能从任意方向观看，这个缺点由逐目标视角重新生成来弥补。"}, "in_ha": {"used": false, "where": "未使用分层表示；最接近的是 Sec. 3.3 Eq. (5)", "how_zh": "Ha et al. 没有使用分层的体表示。每个输入视角只有一张单层深度（来自 RAFT-Stereo），目标视角只有一张 TSDF 深度，前向渲染的像素高斯完全不透明（opacity = 1）。\n\n与分层思路最接近的是 Sec. 3.3 的 Eq. (5)：它用 w_BG 在前景混合图 𝓘_FG 和网络预测的背景图 𝓘_BG 之间插值，相当于一个极简的“前景 + 背景”两层模型。这与 Stereo Magnification 用“参考图 + 预测背景图”来参数化每个平面的颜色（C_d = w_d ⊙ I_1 + (1 − w_d) ⊙ Î_b）同出一源。区别在于，𝓘_BG 没有深度，也不参与 over 合成，只用来填补去遮挡空洞。\n\n因此，Ha et al. 在几何层面无法表示半透明、发丝和软边缘：每个像素只对应一个完全不透明的高斯，软过渡只能靠 2D 融合网络的权重去近似。而这恰恰是 alpha 分层表示的强项。读 Ha et al. 时理解了这一点，才能看清“完全不透明、各向同性”这一设计的代价。"}, "in_field_zh": "分层表示是沉浸式视频和临场系统的重要数据载体。Immersive Light Field Video（Broxton et al. 2020）用 46 台同步相机采集，把 MSI 压缩成少量的 RGBA + 深度层，再用纹理图集和常规视频编码压缩，可以在移动 VR/AR 设备和浏览器中渲染（见 v-codec、a-compression）。MatryODShka 用 MSI 从 360° 立体视频实时合成 6DoF 视图；3D Photo（Shih et al. 2020）用 LDI 加补全，把单张照片变成 3D 照片。对临场系统来说，LDM 这种“少量层、每层带深度”的格式，既适合在显示端做多视点或双目渲染，也适合在头显中做低延迟的视点补偿（见 v-perception）。", "resources": [{"title": "Stereo Magnification: Learning View Synthesis using Multiplane Images (Zhou, Tucker, Flynn, Fyffe &
