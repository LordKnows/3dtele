按深度从近到远编号。d_i 是像素中心到第 i 个斑中心的 2D 偏移（单位为像素）。o_i∈(0,1) 是学到的不透明度，经 sigmoid 激活。α_i 是这个高斯在该像素处的实际 alpha，上限截断为 0.99，小于 1/255 的直接跳过（论文附录 C）。c_i(v) 是沿观察方向 v 由球谐算出的颜色，c(v)=Σ_{l=0}^{3}Σ_{m=−l}^{l} k_{lm} Y_{lm}(v)，每个通道 16 个系数。Π(1−α_j) 是透射率 T_i；论文要求累计不透明度不超过 0.9999，代码里表现为 T 降到 0.0001 以下就停止累加。这个式子与 NeRF 的离散体渲染完全同形（见 n-nerf 第 3 个公式），区别只在 α 从哪里来：NeRF 由 σδ 算出，3DGS 由 2D 高斯的衰减乘以不透明度算出。"}, {"tex": "\\boldsymbol{\\mu}_{k}(u,v) = R_k^{\\top}\\Big(D_k(u,v)\\,K_k^{-1}[u,\\,v,\\,1]^{\\top} - \\mathbf{t}_k\\Big),\\qquad \\Sigma = s^{2}\\mathbf{I}_3,\\ \\ s = c\\,\\frac{D_k(u,v)}{f_k}\\ \\big(c=\\mathcal{O}(1)\\big),\\ \\ o = 1,\\ \\ \\mathbf{c} = I_k(u,v)", "explain_zh": "这是 Ha et al. Sec. 3.1 和附录 A.3 的解析像素高斯，公式由本文按针孔模型整理。k 表示第 k 个输入视角；(u, v) 是像素坐标；D_k(u, v) 是该像素沿光轴的 z 深度（附录 A.1 用 s_k=z_k−D_k 定义有符号距离，说明 D 是 z 深度而不是沿射线的距离），来自 RAFT-Stereo 或深度传感器；K_k 是内参，[R_k|t_k] 是世界到相机的外参；μ_k 是反投影得到的世界坐标中心。s 是各向同性的尺度（标准差）。论文只说尺度“使其在源图中的投影恰好覆盖一个像素”，没有给出公式。按针孔模型，一个像素在深度 z 处对应的物理宽度约为 z/f，所以 s=c·D/f，c 是 1 左右的常数（c=1 时源图中投影标准差为 1 px，c=0.5 时为 0.5 px），确切取值以作者实现为准。由于光栅器会加 0.3 px² 的低通，无论 c 取多小，投影斑的标准差都不低于约 0.55 px。o=1 表示完全不透明；颜色直接取像素值，不用球谐；旋转取单位阵（各向同性时旋转没有意义）。每个视角单独光栅化，输出 warp 图 𝓘_k^t、累计 alpha α_k^t 和深度 𝒟_k^t。"}], "worked_example_zh": "(a) 一般的 3DGS。相机焦距 f=1000 px，某个高斯直接在相机坐标系中给出（即 W=I）：中心 (0, 0, 2) m，尺度 s=(0.02, 0.005, 0.005) m，R=I，不透明度 o=0.8。于是 Σ=diag(4×10⁻⁴, 2.5×10⁻⁵, 2.5×10⁻⁵) m²。中心在光轴上（x=y=0），J 的第三列为 0，J=(f/z)[I₂ | 0]，其中 f/z=500 px/m，所以 Σ'=diag(500²×4×10⁻⁴, 500²×2.5×10⁻⁵)=diag(100, 6.25) px²，即横向 σ=10 px、纵向 σ=2.5 px 的扁椭圆。官方实现加上 0.3 的低通后变为 diag(100.3, 6.55)，半径为 ceil(3×√100.3)=31 px。注意代码按最大特征值取一个正方形外接框 63×63 px，所以即使椭圆很扁，它也会被登记到 4–5 个 16 px 宽的 tile 行和列上。考虑距中心 d=(5, 2) px 的像素：指数项为 −½(25/100.3 + 4/6.55)=−0.430，α=0.8×e^{−0.430}=0.52。如果这个红色高斯后面还有一个在该像素处 α=0.9 的蓝色高斯，像素颜色为 0.52×红 + (1−0.52)×0.9×蓝 = 0.52 红 + 0.43 蓝，剩余透射率 0.48×0.1=0.048。\n(b) Ha 的像素高斯（取 c=1）。输入相机 f=1000 px，某像素深度 z=2.0 m，于是 s≈2 mm，在源图中投影标准差为 1 px。目标相机就在旁边，看这个点的深度 z'=2.2 m，f'=1000 px，投影后 σ≈1000×0.002/2.2≈0.91 px，方差 0.83，加 0.3 低通后为 1.13 px²（σ≈1.06 px），半径 ceil(3×1.2)=4 px（代码求特征值时有一个 0.1 的下限，所以按 √1.44 计，结果仍是 4 px）。中心处 α=min(0.99, 1×1)=0.99，偏离 1 px 处 α=e^{−0.5/1.13}=0.64。相邻源像素在目标图中相距约 0.91 px，而每个斑的 σ≈1.06 px，所以斑与斑大量重叠。即使目标相机靠近到 z'=1.0 m，相邻源像素在目标图中相距约 2 px，斑的 σ 也放大到约 2 px，依然连成一片；“一点一像素”的点溅射此时会每隔一个像素留下一个空洞，形成网状空洞。另一方面，如果两个视角看到的同一表面因深度误差相差几毫米，放在一次渲染里时两者会按深度交替“胜出”，形成 z-fighting 斑点。这就是 Ha 坚持每个视角单独渲染的原因。\n(c) 成本对比。3DGS 在 Mip-NeRF360 上迭代 7K 步用时 6m25s，PSNR 25.60；迭代 30K 步用时 41m33s，PSNR 27.21，渲染 134 fps，模型 734 MB。Ha 对 K=4 个 1352×1014 视角做前向 splat 共 10 ms（表 4）。它不做任何优化，只剩下“渲染”这一半。", "pitfalls_zh": ["误以为 3DGS 的“实时”包括重建。3DGS 的 30 fps 以上只指渲染；在 Mip-NeRF360 上重建仍要 6–41 分钟，而且需要 SfM 点和密集视角。Quark 在 Sec. 2.1 明确说，Gaussian splats“像 NeRF 一样需要缓慢、离线的逐场景过程”。表 2 中 3DGS 的 29.82 dB 与 Quark 的 31.31 dB 相比时要记住：前者是离线优化的结果，后者是 32 ms 前馈推理的结果。", "混淆不透明度 o 与像素上的 alpha。o 是高斯本身的属性；像素上的 α 还要乘以 2D 高斯的衰减，并被截断到 0.99。Ha 所说“完全不透明”（o=1）的高斯，在斑的边缘 α 依然很小，在中心也只有 0.99。不过相邻斑大量重叠，所以 Ha 的累计 alpha 图 α_k^t 在有数据的表面处接近 1、在空洞处接近 0，正好可以当作“这个视角在这里有没有数据”的掩码，送进融合网络。", "以为排序是逐像素精确的。3DGS 每帧按“tile ID + 高斯中心的视空间深度”做一次全局排序，并不对每个像素单独排序。视角变化时，两个重叠高斯的前后顺序可能突然交换，产生跳变（popping），这是 3DGS 视频闪烁的来源之一。这也说明，把多个视角的高斯放在一起渲染，会在深度相近处产生 z-fighting。", "忽视 EWA 近似和各向同性假设的适用范围。雅可比 J 只在高斯中心处线性化，所以大高斯或广角画面边缘处误差较大。0.3 px² 的固定低通会在拉近或拉远时引起锯齿或变粗，Mip-Splatting 专门处理了这个问题（见 a-3dgs-ext）。Ha 的像素高斯是各向同性的，忽略了表面倾斜：在掠射角下，真实足迹应该是拉长的椭圆，用圆斑近似就可能出现拉伸或缝隙。"], "in_quark": {"used": false, "where": "Sec. 2.1（表示综述）；Sec. 3.2.2（Render to Input Views 中的双线性 splat）；Sec. 4.1 表 2、表 3 与图 5、图 6", "how_zh": "Quark 不使用 3D 高斯，3DGS 在文中扮演三种角色。① 对照路线。Sec. 2.1 指出，Gaussian splats 虽然渲染快，但“和 NeRF 一样需要缓慢、离线的逐场景计算”；相比之下，LDM 的二维层结构可以用高效的 2D 网络来求解。② 数字对照。表 2 中，DL3DV 上 3DGS 为 29.82/0.919/0.120，Quark 为 31.31/0.932/0.103。表 3 的数值取自 3DGS 论文：3DGS-30K 在 Mip-NeRF360 上为 27.21（Quark 26.60），在 Tanks&Temples 上为 23.14（Quark 23.60），在 Deep Blending 的 Playroom 场景上为 30.04（Quark 23.61）。Sec. 4.1 说 Quark、Quark+ 与 3DGS 看起来同样清晰，但 3DGS 需要昂贵的离线优化。③ 相似的算子。Sec. 3.2.2 中，把中间 LDM 渲染回输入视角时用的是“双线性 splat 加 over 合成”，作者强调 splat 避开了昂贵的光线追踪或光栅化。它和 3DGS 的斑一样，都是“把基元往图像上抹”，只是核函数是双线性而不是高斯；而且 LDM 的层本身已按视差带排好顺序，按层 over 合成即可，不需要对基元排序。懂了 3DGS，就能看清两者的取舍：3DGS 重建一次、之后任意视点都能廉价渲染；Quark 每个目标视角都要重新推理，换来的是完全不需要优化。"}, "in_ha": {"used": true, "where": "Sec. 3.1（Forward Warping with 3D Gaussians）；附录 A.3（Dense Pixel-sized 3D Gaussians，图 10）；图 4；Sec. 4 实现说明；Sec. 4.5 消融 No Blending；表 4", "how_zh": "这是 Ha et al. 流程的第一步。按 Sec. 3.1，对 K 个最近输入视角中的每个像素，用深度 D_k^t 和相机位姿确定一个各向同性、完全不透明的 3D 高斯的位置，颜色取该像素值，尺度使其在源图中恰好覆盖 1 个像素，由此得到每个视角的前向渲染图 𝓘_k^t、累计 opacity α_k^t 和深度 𝒟_k^t。Sec. 4 写明“用原版 3D Gaussian splatting 代码做前向渲染”，表 4 中这一步耗时 10 ms（DyNeRF，1352×1014，K=4）。作者做了两个与主流相反的选择。① 不用网络预测高斯参数，这一点不同于 GPS-Gaussian、Tele-Aloha、GS-LRM。他们观察到，在稠密像素网格上，网络预测的尺度、不透明度、旋转会收敛到近似常数，预测的颜色也与输入图一致。附录 A.3 还说，网络可以学会放大背景高斯的尺度去填补遮挡空洞，但这往往会降低整体 PSNR，所以补洞交给后面的融合网络。② 不把所有视角一次性渲染。图 4(a) 和消融 No Blending（单次渲染全部高斯，图 4 与 Sec. 4.5 引用 GPS-Gaussian；Sec. 3.1 正文则把这种做法归于 GS-LRM）表明，这样会产生飞点、空洞，边缘还会因 z-fighting 变差，PSNR 只有 24.64，STED 为 483.3。为什么用高斯而不用传统点溅射？附录 A.3 和图 10 给出的理由是：高斯能处理遮挡，像素之间不留缝，边缘也不出锯齿。如果不理解 3DGS 的 α 是怎么算的、又是怎样从前到后混合的，就读不懂 α_k^t 为什么能充当空洞掩码，也读不懂融合公式 I_FG 为什么要用 α_k·w_k 加权。"}, "in_field_zh": "3DGS 是 2024 年后远程临场系统最常用的持久表示。一旦得到高斯集合，无论是左右眼双目、多个观众，还是 HMD 要求的 72–90 Hz，都只是多做几次廉价的光栅化。而 Quark、Ha 这类与目标视角绑定的方法，每多一个视点就要多跑一次网络。由此出现了三条延伸。① 前馈 3DGS（GPS-Gaussian、pixelSplat、MVSplat）：每帧从少量相机直接预测像素对齐的高斯，适合人像实时采集（a-ff-3dgs）。② 高斯的压缩与流式传输：锚点资料中的 Tele360 用视频编码器把高斯参数图（Gaussian maps）推流到远端，GS-SCNet 把多视角编码与前馈 3DGS 联合设计以节省码率（见 a-compression）。③ 动态高斯（见 n-dynamic）。工程上还要注意三点：3DGS 的存储与显存开销（大场景模型数百 MB，渲染时光栅器还需额外 30–500 MB，原型实现的训练峰值显存可超过 20 GB）、排序跳变带来的时间不稳定，以及抗锯齿（见 a-3dgs-ext）。", "resources": [{"title": "3D Gaussian Splatting for Real-Time Radiance Field Rendering (Kerbl et al., SIGGRAPH 2023)", "url": "https://arxiv.org/abs/2308.04079", "type": "paper", "note_zh": "原论文。Sec. 4 讲可微 3D 高斯与 EWA 投影（式 5、6）；Sec. 5.2 讲自适应致密化（τ_pos=0.0002，每 100 步一次，分裂时尺度除以 φ=1.6，每 3000 步重置 α）；Sec. 6 讲 tile 光栅器；附录 C 给出数值细节（α 上限 0.99，跳过阈值 1/255，累计不透明度上限 0.9999）；表 1 列出训练时间、fps 和模型存储。项目页见 https://repo-sam.inria.fr/fungraph/3d-gaussian-splatting/"}, {"title": "Mathematical Supplement for the gsplat Library (Ye & Kanazawa, 2023)", "url": "https://arxiv.org/abs/2312.02121", "type": "tutorial", "note_zh": "逐式推导投影、2D 协方差和 alpha 合成的前向与反向传播，适合对照代码亲手推一遍梯度。配套开源库见 https://github.com/nerfstudio-project/gsplat"}, {"title": "MIT 6.S980 Machine Learning for Inverse Graphics (Sitzmann, Fall 2023)", "url": "https://www.scenerepresentations.org/courses/2023/fall/inverse-graphics", "type": "course", "note_zh": "看 “Differentiable Rendering”（球面追踪、体渲染、光场渲染）和 “Differentiable Rendering II: Gaussian Splatting” 两讲，都有录像和幻灯片，可以把 NeRF 与 3DGS 放在同一个可微渲染框架下理解。"}, {"title": "graphdeco-inria/diff-gaussian-rasterization（官方 CUDA 光栅器）", "url": "https://github.com/graphdeco-inria/diff-gaussian-rasterization", "type": "code", "note_zh": "Ha et al. 用的就是这套代码。建议读 cuda_rasterizer/forward.cu：computeCov2D（其中的 +0.3 低通）、以 ceil(3√λ_max) 作为半径决定覆盖哪些 tile，以及逐 tile 从前到后的混合（α 截断到 0.99，小于 1/255 跳过，T<0.0001 时停止）。"}, {"title": "CMU 16-825 Learning for 3D Vision — Lecture 12: Differentiable Primitive Rendering (Meshes, Gaussians)", "url": "https://learning3d.github.io/schedule.html", "type": "course", "note_zh": "2026 秋季课表第 12 讲，建议阅读 Soft Rasterizer 和 3DGS 原文。适合在学完第 9–10 讲的体渲染与 NeRF 后，对照理解“基元光栅化”这条路线。"}], "self_check": [{"q_zh": "一个各向同性高斯，s=1 cm，位于相机正前方 z=4 m 的光轴上，焦距 f=800 px。忽略 0.3 的低通，它在屏幕上的标准差和 3σ 半径各是多少像素？如果相机前移到 z=1 m 呢？", "a_zh": "σ'=f·s/z=800×0.01/4=2 px，3σ 半径为 6 px。z=1 m 时 σ'=8 px，半径 24 px。斑的尺寸按 1/z 缩放，这正是雅可比 J 中 f/z 一项的作用。"}, {"q_zh": "Ha 为什么说“用网络预测像素高斯的参数没有必要”？这个结论成立的前提是什么？", "a_zh": "在稠密的像素网格上，相邻像素的高斯本来就铺满了表面，网络预测出的尺度、不透明度、旋转趋于常数，颜色也等于像素值（Sec. 3.1），所以解析设定更省事。这有两个前提：一是有足够好的逐像素深度，因为高斯的位置完全来自深度；二是空洞交给后续的融合网络和背景图 I_BG 处理（附录 A.3 提到让网络靠放大尺度来补洞会降低 PSNR）。在深度较差、半透明、头发或掠射角表面等情况下，常数参数就不够用了。"}, {"q_zh": "Ha 为什么要把 K 个视角分别光栅化，而不像 GPS-Gaussian 那样把所有高斯放进一次光栅化？这样做的代价是什么？", "a_zh": "各视角的深度都有误差。同一表面来自不同视角的高斯深度很接近、互相穿插，一次性按深度混合就会出现 z-fighting 和飞点（图 4a；消融 No Blending 的 PSNR 为 24.64、STED 为 483.3）。分开渲染后，由融合网络逐像素决定该相信哪个视角。代价是：光栅化次数和后续网络的输入都随 K 线性增长（图 8），并且必须有一个学出来的融合网络。"}], "prereqs": ["r-raster", "r-alpha", "r-appearance"]}, {"id": "n-generalizable", "name_zh": "可泛化 / 前馈式新视角合成", "name_en": "Generalizable / feed-forward novel view synthesis", "tldr_zh": "可泛化（前馈式）新视角合成先在大量场景上训练一个网络，推理时只做一次前向：输入几张已标定的邻近视图，直接输出新视角图像，或者输出一个可以渲染的中间表示，全程不做逐场景优化。Quark 和 Ha et al. 都属于这一类，它们的基线 IBRNet、ENeRF、GPNR、GPS-Gaussian 也是。", "intuition_zh": "在 NeRF 和 3DGS 里，“学习”是针对单个场景的：参数 φ 就是这个场景本身，训练完换一个场景就作废。可泛化方法把学习挪到了“跨场景”这一层：训练一个网络 F_θ，让它学会“如何从几张照片推断几何和外观”这种通用能力，推理时 θ 固定不变。好处是新场景来了只需一次前向（几十毫秒到几秒），而且只用 2–8 张稀疏的图就够。代价是质量受训练数据分布的限制，遇到训练中没见过的场景类型会退化。\n\n这条路线的代表方法，可以按“网络在哪里利用几何”分成四类。① 像素对齐特征加 NeRF：pixelNeRF（CVPR 2021）把 3D 点投影到每张输入图上，取出 CNN 特征喂给 NeRF 的 MLP，多个视角的特征取均值；MVSNeRF 用平面扫描代价体提供几何线索（见 i-psv、d-mvs）。② 学习式 IBR：IBRNet（CVPR 2021）不直接回归颜色，而是为邻近视图的像素颜色预测混合权重，并用一个 ray transformer 沿射线推理密度；ENeRF（SIGGRAPH Asia 2022）先用级联代价体估计深度，只在表面附近采少量点，比此前的可泛化辐射场方法至少快 60 倍。③ 无几何 Transformer：GPNR 沿极线取 patch 送进 Transformer；LVSM（2024）连极线和平面扫描都不用，只用 Plücker 射线嵌入标记像素 patch，由 Transformer 直接输出目标视图（见 a-geometry-free）。④ 前馈 3DGS：pixelSplat、MVSplat（代价体加深度，22 fps）、GPS-Gaussian（面向人像，2K 分辨率）为每个输入像素预测一个高斯，得到一个能从任意视点廉价渲染的持久表示（见 a-ff-3dgs）。\n\n这些方法都要回答同一个核心问题：多个视角的信息怎么聚合？常见的选项有：直接拼接（依赖视角顺序，视角数也必须固定）；取均值或方差（pixelNeRF、IBRNet，简单、与顺序无关，但表达力弱）；反复 max-pool（DeepView）；跨视角自注意力（NerFormer，代价为 O(M²)）。Quark 在 Sec. 2.2 逐一分析了这些选项，并在 Sec. 3.3 给出自己的 One-to-many attention；Ha 则用 U-Net 做通道拼接（视角数固定为 K）。另一个核心问题是“输出什么”：直接回归颜色，还是对输入像素做凸组合（即 IBR）。两篇锚点论文都选了 IBR：高频细节直接取自全分辨率的输入像素，网络只需在低分辨率上决定每个像素“取谁的颜色”。\n\n在这张地图上，两篇锚点论文的位置很清楚。Quark 是学习式 IBR，加上与目标视角对齐的分层表示（LDM），再加上学习式迭代细化（见 l-iterative、i-layered），几何完全是端到端学出来的。Ha 的几何由外部给定（立体深度加 TSDF），用解析的像素高斯做前向 warp，只用一个小 U-Net 学融合权重，把“学习”压到了最少。两者都在每一帧、每个目标视角上重新计算，不保留持久的 3D 模型，这与前馈 3DGS“重建一次、渲染多次”的做法形成对照。", "analogy_zh": "逐场景优化像是给每座城市单独背一张地图。可泛化方法像是培养一位经验丰富的向导：他没来过这座城市，但看几张街景照片，就能推断出街道怎么连、哪栋楼挡住了哪栋。向导的本事取决于他以前走过多少种城市，也就是训练数据。到了完全陌生的地形，比如训练时只见过室内、测试时却是户外，他就会出错。", "equations": [{"tex": "\\text{per-scene: }\\ \\phi^{*} = \\arg\\min_{\\phi}\\sum_{i=1}^{N_{\\mathrm{img}}}\\mathcal{L}\\big(R(\\phi, P_i),\\, I_i\\big)\\qquad \\text{feed-forward: }\\ \\theta^{*} = \\arg\\min_{\\theta}\\ \\mathbb{E}_{\\mathcal{S}}\\Big[\\mathcal{L}\\big(F_{\\theta}(\\{I_m, P_m\\}_{m=1}^{M},\\ P_t),\\ I_t\\big)\\Big]", "explain_zh": "逐场景优化中，φ 是某一个场景的参数（NeRF 的 MLP 权重或 3DGS 的高斯集合），R 是可微渲染器，P_i 是第 i 张训练图的相机参数，I_i 是这张图，𝓛 是光度损失，N_img 是该场景的图片数，通常为几十到数百张。前馈式中，θ 是网络参数，𝒮 是训练场景的分布（期望对场景和目标视角的随机抽样取），{I_m, P_m} 是 M 张输入图及其相机（Quark 中 M=8，Ha 中 K=4 或 2），P_t、I_t 是留出的目标视角及其真值，F_θ 一次前向就输出目标图。两者的区别在于：φ* 每换一个场景都要重新求解，θ* 只需训练一次，推理时保持固定。"}, {"tex": "\\mathbf{c}(\\mathbf{x}) = \\sum_{m=1}^{M} w_m(\\mathbf{x})\\, I_m\\big(\\pi_m(\\mathbf{x})\\big),\\quad w_m = \\frac{\\exp(s_m)}{\\sum_{m'=1}^{M}\\exp(s_{m'})},\\qquad \\mathbf{c}_{\\mathrm{target}} = \\mathcal{O}\\Big(\\sum_{m=1}^{M}\\beta_m\\cdot\\mathcal{P}^{T}_{\\theta}(\\mathbf{I},\\mathbf{d}),\\ \\sigma\\Big)", "explain_zh": "前两式是学习式 IBR 的通用形式。x 是一个 3D 点（或 LDM 某层上的某个像素）；π_m 是把点投影到第 m 张输入图的函数（见 g-pinhole）；I_m(π_m(x)) 是用双线性插值取到的输入颜色；s_m 是网络给视角 m 的打分，经 softmax 后得到非负且和为 1 的权重 w_m，所以输出颜色是输入颜色的凸组合。第三式是 Quark 的式 (1)：𝒫^T_θ(I, d) 把全分辨率输入图按每层深度 d 反投影到 LDM 的各层（θ 在这里指相机参数，不是网络权重）；β_m 是每层每个像素对 M 个视角的混合权重，由最后一个 Fusion Block 的 One-to-many attention 给出，softmax 推迟到上采样到目标分辨率之后才施加（Sec. 3.2.3）；σ 是各层的 alpha；𝒪 是从后往前的 over 合成。"}, {"tex": "I_{\\mathrm{FG}} = \\frac{\\sum_{k=1}^{K}\\mathcal{I}_k\\,\\alpha_k\\,w_k}{\\sum_{k=1}^{K}\\alpha_k\\,w_k},\\qquad I = (1-w_{\\mathrm{BG}})\\,I_{\\mathrm{FG}} + w_{\\mathrm{BG}}\\,I_{\\mathrm{BG}}", "explain_zh": "这是 Ha et al. Sec. 3.3 式 (4)–(5)。原文把式 (4) 写成对“分式”求和，分子分母中的 α_k w_k 会直接约掉，显然是漏写了分母的求和号，这里按语义补上。𝓘_k 是第 k 个视角前向 splat 到目标相机后的图；α_k 是它的累计 alpha，在空洞处约为 0；w_k 是 U-Net 预测的逐像素权重；w_BG 是背景权重；I_BG 是网络直接生成的背景图，用来填补所有视角都看不到的遮挡空洞。乘上 α_k，是为了让“在这里没有数据”的视角不参与融合。整张输出中，只有 I_BG 这一项的像素是网络“生成”的，其余都是真实像素重新加权的结果。"}, {"tex": "\\boldsymbol{\\mu}_m(u,v) = \\mathbf{C}_m + D_m(u,v)\\,\\mathbf{r}_m(u,v),\\qquad \\big(\\mathbf{s},\\,\\mathbf{q},\\,o,\\,\\mathbf{c}\\big)_m(u,v) = h_{\\theta}\\big(\\mathbf{f}_m(u,v)\\big)", "explain_zh": "这是前馈 3DGS（pixelSplat、MVSplat、GPS-Gaussian）中的“像素对齐高斯”。C_m 是第 m 个输入相机的光心；r_m(u, v) 是像素 (u, v) 的射线方向（如果 D 是 z 深度，r 应取 z 分量为 1 的未归一化方向；如果 D 是沿射线的距离，r 取单位向量）；D_m 是网络预测的深度（或由代价体、立体匹配得到），它决定了高斯中心 μ；f_m 是该像素的特征；h_θ 是预测头，输出尺度 s、旋转四元数 q、不透明度 o 和颜色 c。整个场景由 M×H×W 个高斯组成，可以用 3DGS 光栅器从任意视点渲染。Ha 取同样的 μ，但把 (s, q, o, c) 换成了解析常数（见 n-3dgs 第 4 个公式）。"}], "worked_example_zh": "(1) 时间预算。远程临场要求 30 fps，即每帧 33 ms。逐场景方法：NeRF 每个场景 1–2 天，3DGS 在 Mip-NeRF360 上 41 分钟；即使是流式逐帧优化的 3DGStream，每帧也要约 12 s。前馈方法（同一张 A100，Quark 表 1，1024×768，重建加渲染）：Quark 32.2 ms，Quark+ 91.9 ms，ENeRF 205 ms，SIMPLI 4.4 s，GPNR 25 s。Ha 的表 4：splat 10 ms + TSDF 6 ms + 融合 23 ms（TensorRT）≈ 39 ms，但不含 RAFT-Stereo 深度估计；Ha 文中测得 GPS-Gaussian 为 143.4 ms。只有前馈路线有可能挤进 33 ms。\n(2) 为什么要学混合权重。设某个目标像素在 3 个输入视角中取到的颜色为 I₁=(0.80, 0.20, 0.20)、I₂=(0.78, 0.22, 0.20)，两者都看到了红色表面；I₃=(0.20, 0.20, 0.80)，它被前景的蓝色物体挡住了。如果取均值：R=(0.80+0.78+0.20)/3=0.59，G=0.21，B=(0.20+0.20+0.80)/3=0.40，结果是偏紫的重影。如果网络识别出视角 3 被遮挡，给出打分 s=(2.0, 1.5, −1.0)，softmax 计算为 e²=7.389、e^{1.5}=4.482、e^{−1}=0.368，总和 12.239，得到 w=(0.604, 0.366, 0.030)。输出 R=0.604×0.80+0.366×0.78+0.030×0.20=0.775，G=0.207，B=0.218，接近真实的红色。两篇论文的消融正好量化了这一点：Quark 把跨视角注意力退化为均值（No cross attention）后，PSNR 从 30.41 降到 29.73；Ha 改用按相机距离的固定权重（Distance-based Blending）只有 26.08 dB，完整模型为 31.17 dB。\n(3) Ha 式融合如何处理空洞。设 K=2，某个像素处 𝓘₁ 为红色，α₁=1，w₁=0.7；𝓘₂ 在此处是空洞，α₂=0，w₂=0.3。I_FG=(红×1×0.7 + 任意×0×0.3)/(1×0.7+0×0.3) = 红。可见没有数据的视角会自动退出。如果两个 α 都是 0，分母为 0（实现中需加一个小 ε），这时就要靠 w_BG→1，用背景图 I_BG 来填补；损失 L_Mask 正是鼓励 w_BG 在空洞处变大。", "pitfalls_zh": ["以为“可泛化”就没有域差。Quark 的训练集是 Spaces、RFF、Shiny、SWORD（全是静态场景），而 RFF 和 Shiny 同时也是它的测试集，论文没有说明是否剔除了测试场景。Ha 用 3 个 DyNeRF 场景训练，却在同一厨房、同一相机阵列下的另外两个 DyNeRF 场景上测试，而 IBRNet、ENeRF 用的是官方预训练权重。在训练中未出现的户外数据 ENeRF-Outdoor 上，Ha 的 PSNR 为 24.01，反而低于 ENeRF 的 25.79（不过在同样未参与训练的 D3DMV 上，Ha 领先最多：32.58 对 27.79）。读结果表时，先看“谁在什么数据上训练”。", "忽视视角选择。两篇论文都只用离目标最近的少数视角：Quark 用 M=8，训练时从最近的 16 个中随机抽 8 个；Ha 用 K=4 或 2。这既是速度的来源，也是失败的来源。Quark 在视角覆盖差的 Deep Blending（Playroom 场景）上只有 23.61 dB（3DGS 为 30.04）。目标相机移动导致输入视角集合切换时，两者都会跳变或闪烁。", "比较运行时间时不问“算了哪些环节”。Quark 的 32.2 ms 包括重建和渲染，但不含采集和传输；Ha 的约 39 ms 不含立体深度估计；LVSM 的 FPS 是在物体级、256×256 下测的。此外，Quark 和 Ha 的表示都绑定在目标视角上，双目 HMD 或多个观众需要成倍计算；前馈 3DGS 生成一次高斯，就能供多个视点渲染。", "以为 IBR 的凸组合什么都能表达。输出颜色只能落在输入颜色的凸包之内：输入中从未出现过的高光位置、所有视角都被遮挡的区域，都无法正确生成。Quark 靠每个视角重新生成加射线编码来“近似”反射（Sec. 4.3），Ha 靠一张背景图 I_BG 补洞。无几何的 LVSM 可以“想象”出内容，但目前分辨率较低（场景级评测在 256×256 上进行）。"], "in_quark": {"used": true, "where": "全文定位（标题中的 General、Sec. 1）；Sec. 2.2 Generalizable Neural Algorithms；Sec. 3（输入编码、迭代更新、Sec. 3.3 One-to-many attention、IBR 渲染）；Sec. 3.4 训练；Sec. 4.1 表 1；Sec. 4.2 消融", "how_zh": "Quark 本身就是一个可泛化前馈网络。它在 Spaces、RFF、Shiny、SWORD 的混合数据上训练（Sec. 3.4，16×A100，600K 步），推理时对任何新场景只做一次前向。Sec. 2.2 把“generalizable”定义为两层意思：不需要按场景训练，而且只用少量宽基线图像也能得到高质量结果。该节的主题是多视角聚合，逐一分析了各种做法：拼接依赖视角顺序、视角数也要固定；RNN 允许可变数量但不具备顺序不变性；均值（pixelNeRF）和方差（IBRNet）与顺序无关但表达力有限；反复 max-pool（DeepView）是强大的集合聚合器；AggTransformer 只做一次 softmax 聚合；NerFormer 的代价是 O(M²)。Quark 的 One-to-many attention（Sec. 3.3）目标是兼得 AggTransformer 的效率与 Transformer 的大部分表达力。它直接比较了三个可泛化基线（在 RFF+IBRNet 数据上重训）：GPNR（极线 patch 加 Transformer，25 s）、ENeRF（单层带厚度的深度，205 ms）和 SIMPLI（同样采用 render-and-refine 加 LDM，4.4 s）。在 RFF、Shiny、N3DV 上 Quark 都更好，例如 N3DV 上 Quark 31.57，ENeRF 29.86。输出方式属于学习式 IBR：式 (1) 对全分辨率输入像素做凸组合。消融中把它换成直接回归 RGB 后，PSNR 从 30.41 降到 29.18，是所有消融项里退化最大的一项。需要注意，Quark 没有与 pixelSplat、MVSplat、GPS-Gaussian、LVSM 等同期前馈方法做比较。"}, "in_ha": {"used": true, "where": "Sec. 1；Sec. 2（Neural-based / Point-based View Synthesis 段）；Sec. 3.1–3.3；Sec. 4 实现说明与 4.1 Baselines；附录 A.4、A.5、A.7", "how_zh": "Ha et al. 同样不做逐场景优化（Sec. 2 的 Neural-based View Synthesis 段末写道 “does not require per-scene optimization”），但它是一个“半学习”的前馈系统。几何来自外部（RAFT-Stereo 或传感器深度，再加 TSDF），高斯参数解析设定，只有融合网络是学出来的。融合网络是一个 4 层 U-Net，输入 9K+1 个通道，包括 K 张 warp 后的 RGB（3K）、K 张深度、K 张 alpha、1 张 TSDF 深度，以及 4 组各 K 通道的相机特征（附录 A.4）；输出 K 个逐像素权重、背景权重和背景图，对应上面的第 3 个公式。训练数据是 ScanNet、Google Spaces 和 3 个 DyNeRF 场景，单张 V100 迭代 150K 次，每次迭代随机选 1 个目标视角和 K=4 个输入视角（Sec. 4、附录 A.5）。Sec. 4.1 的四个基线全是可泛化方法：FWD（深度前向 warp 加融合）、IBRNet、ENeRF，以及 GPS-Gaussian（前馈像素高斯）；其中 IBRNet 和 ENeRF 用作者发布的预训练权重，FWD 和 GPS-Gaussian 的预训练模型无法泛化到测试集，作者按本文数据和训练策略重训。Sec. 2 还把 pixelNeRF、MuRF、FWD、IBRNet 归为“难以处理动态场景”的可泛化方法，把 pixelSplat、MVSplat、LaRa、Splatter Image、GS-LRM 等归为面向稀疏静态场景的前馈模型，并指出这些方法连同 GPS-Gaussian、Tele-Aloha 这类动态人像前馈模型，都没有显式处理输入深度的噪声，因而会出现时间和视角上的不一致。消融显示，按距离加权的融合只有 26.08 dB，完整模型为 31.17 dB：几乎全部提升都来自“有一个学出来的融合网络”。"}, "in_field_zh": "这是实时远程临场的主战场。无论是 Project Starline/Google Beam 这类固定多相机舱体，还是 Tele-Aloha 的 4 相机方案，都必须在每帧 33 ms 内用当下的图像给出结果。系统设计上有三个取舍。① 表示绑定目标视角，还是用像素对齐的持久 3DGS。前者如 Quark、Ha，适合“服务端按观看者头部位姿渲染，再推送 2D 视频”；后者如 GPS-Gaussian、LVT、Tele360，适合把表示推送到端侧，再做多视点渲染。② 几何是学出来的（Quark、MVSplat），还是外部给定的（Ha、Starline 式 TSDF）。外部给定的几何可解释、可调参，但受深度前端的限制。③ 训练数据要覆盖目标域，包括人像、头发、快速手势和户外场景。2025 年之后的前沿方向有：无位姿或在线标定（AnySplat、LiveStre4m）、无几何的大模型（LVSM 及其扩展），以及带时间记忆的前馈模型（见 n-dynamic、a-generalizable-ibr、a-ff-3dgs、a-geometry-free）。", "resources": [{"title": "IBRNet: Learning Multi-View Image-Based Rendering (Wang et al., CVPR 2021)", "url": "https://arxiv.org/abs/2102.13090", "type": "paper", "note_zh": "学习式 IBR 的代表作。读 Sec. 3 的多视角特征聚合（均值和方差）与 ray transformer，理解“预测混合权重而不是颜色”这一设计。Quark 在相关工作中把它作为方差聚合的代表，Ha 用它作基线。项目页见 https://ibrnet.github.io/"}, {"title": "MVSplat: Efficient 3D Gaussian Splatting from Sparse Multi-View Images (Chen et al., ECCV 2024)", "url": "https://arxiv.org/abs/2403.14627", "type": "paper", "note_zh": "前馈 3DGS 的代表作：用平面扫描代价体估计深度，再逐像素预测高斯，推理 22 fps，参数量只有 pixelSplat 的 1/10。建议与 Ha 的解析像素高斯对照阅读，看清“网络预测”与“解析设定”的区别。"}, {"title": "LVSM: A Large View Synthesis Model with Minimal 3D Inductive Bias (Jin et al., 2024)", "url": "https://arxiv.org/abs/2410.17242", "type": "paper", "note_zh": "无几何 Transformer 的代表作：只用 Plücker 射线嵌入加图像 patch token，不用极线或平面扫描。注意它的场景级评测在 256×256 分辨率下进行，FPS 也是在物体级 256×256 下测的，与 Quark 1080p 实时的定位不同。"}, {"title": "MIT 6.S980 Machine Learning for Inverse Graphics — Prior-Based Reconstruction I–III", "url": "https://www.scenerepresentations.org/courses/2023/fall/inverse-graphics", "type": "course", "note_zh": "三讲内容涵盖自编码与 auto-decoding、全局与局部条件化（即 pixelNeRF 式的像素对齐特征）、基于体渲染和光场渲染的极线推理，以及基于注意力的条件化，都有录像和幻灯片，正好覆盖本概念的理论脉络。"}, {"title": "CMU 16-825 Learning for 3D Vision — Lecture 15: Multi-view Transformers: View Synthesis", "url": "https://learning3d.github.io/schedule.html", "type": "course", "note_zh": "2026 秋季课表第 15 讲，建议阅读 pixelNeRF、Scene Representation Transformer、LVSM 和 TokenGS，从像素对齐条件化一路讲到无几何 Transformer。"}], "self_check": [{"q_zh": "Quark 的内部分辨率只有 288×512，为什么能输出 1080p 的图？为什么直接回归 RGB 的变体会变糊？", "a_zh": "因为输出是对全分辨率输入像素的凸组合（式 1）。网络只需在低分辨率上确定深度、alpha 和混合权重，双线性上采样 3.75 倍后，再逐像素到全分辨率输入图里取颜色，高频纹理来自真实像素。直接回归 RGB 时，结果受限于网络的输出分辨率和容量；消融中 PSNR 从 30.41 降到 29.18，LPIPS 从 0.154 升到 0.179。"}, {"q_zh": "Ha 的融合网络输入视角数固定为 K，而 Quark 可以做成支持 4–16 个可变输入的版本。这是由什么设计决定的？", "a_zh": "Ha 把 K 个视角的 RGB、深度、alpha 等按通道拼接后送进 U-Net（9K+1 个通道），通道数随 K 固定，而且依赖视角的排列顺序。Quark 用 One-to-many attention 对视角集合做注意力聚合，对视角顺序不敏感，可以接受可变数量的输入。主模型用 M=8 训练，论文另训练了一个支持 4–16 张输入的变体，用于 Spaces 上的基线距离实验。"}, {"q_zh": "一个 VR 远程临场场景需要为双眼各渲染 72 Hz 的图像。粗略比较 Quark 和一个前馈 3DGS 方法的计算量。", "a_zh": "Quark 的 LDM 与目标视角绑定，每只眼睛都要完整推理一次：每秒 2×72=144 次，每次约 32–33 ms（A100，表 1），合计每秒约需 4.6–4.8 秒的 GPU 时间，单卡跑不动。前馈 3DGS 每个采集帧（例如 30 fps）只需预测一次高斯，之后双眼 72 Hz 只做光栅化，而 3DGS 的渲染速度可达每秒上百帧；网络推理次数与观看视点数无关。"}], "prereqs": ["n-nerf", "i-psv", "l-attention"]}, {"id": "n-dynamic", "name_zh": "动态场景与 4D 表示", "name_en": "Dynamic scenes & 4D representations", "tldr_zh": "动态场景方法首先要回答“时间怎么表示”。一种做法是把整段视频拟合成一个 4D 表示，比如变形场加规范空间、时间条件 NeRF、4D 高斯，质量高但只能离线处理。另一种做法是逐帧或流式处理，可以在线、实时，但要另外设法保证时间一致性。Quark 属于逐帧、无状态；Ha et al. 属于逐帧处理、只在深度上保留少量状态的在线方法。", "intuition_zh": "静态的 NeRF 和 3DGS 都默认“同一个空间点在所有照片里都是同一个东西”。场景一动，这个假设就不成立了。最朴素的做法是把每一帧都当作一个独立的静态场景重建一遍（逐帧重建），但对 NeRF 来说这极其昂贵。DyNeRF 论文估算过：一段 18 台相机、30 fps、10 秒长的视频，逐帧训练 NeRF 每帧约需 50 GPU 小时，共约 15,000 GPU 小时，而且得到的只是一串互不相干的快照，帧与帧之间会闪烁。\n\n第一大类思路是“把整段视频拟合成一个 4D 表示”，利用时间上的冗余。① 规范空间加变形场（D-NeRF、Nerfies、HyperNeRF）：假设存在一个处于“标准姿态”的场景，时刻 t 的每个点 x 先由一个网络 Δ(x, t) 映射回规范空间，再去查询颜色和密度。这些方法主要针对单目视频（一台移动的手机拍摄），与多相机阵列是不同的问题。② 时间条件场：DyNeRF（Neural 3D Video，CVPR 2022）为每一帧学一个 1024 维的潜码 z_t，MLP（结构同 NeRF，但前 8 层加宽到 512 通道）以 (x, d, z_t) 为输入，并按帧间差异做重要性采样。它在 8 张 V100 上训练约一周（论文自报约 1.3K GPU 小时，K-Planes 论文折算为 1344 GPU 小时），10 秒视频的模型只有 28 MB。K-Planes 和 HexPlane 把 4D 场分解成 6 个 2D 特征平面，在同一数据上把训练降到 GPU 小时量级：K-Planes（hybrid）约 1.8 小时，HexPlane 约 12 小时（10 万步的短训版约 2 小时）。③ 4D 高斯：4DGS（Wu et al., CVPR 2024）用 HexPlane 式的特征加一个小 MLP，预测每个高斯随时间的位移、旋转和缩放，在 800×800 下达到 82 fps（RTX 3090）；Dynamic 3D Gaussians 让高斯的颜色、不透明度和大小保持不变、只移动和旋转，顺带得到稠密跟踪；Spacetime Gaussians 加入了随时间变化的不透明度；4K4D 用 4D 点云加硬件光栅化，在 ENeRF-Outdoor 上以 4K 分辨率渲染可达 80 fps（RTX 4090）。这些方法渲染都是实时的，但都必须先拿到整段视频再离线优化，所以“渲染实时”不等于“在线”。进阶内容见 a-dynamic-4d。\n\n第二大类是“在线/流式”：每来一帧就更新一次，不能看到未来的帧。3DGStream（CVPR 2024）在上一帧高斯的基础上，只学一个小的“神经变换缓存”（平移和旋转），并自适应地添加新高斯。它每帧约需 12 秒，渲染 200 fps，已经是在线的了，但离 33 ms 还差约 360 倍。完全前馈的方法（ENeRF、Quark、GPS-Gaussian）则把每一帧当作一个新场景，一次推理完成。速度足够，但没有任何时间状态，逐帧误差的随机波动在画面上就表现为闪烁。折中的办法是给前馈系统加一个轻量的递归状态：S^t = U(S^{t−1}, 新观测)。Ha et al. 正是在深度这一层做了最小化的递归：用差分掩码滤波深度，并回灌上一帧的 TSDF 深度。\n\n数据集也要认清楚。最常用的多视角动态数据集是 Li et al. 的 Neural 3D Video：用 21 台 GoPro Black Hero 7 拍摄，2028×2704，30 fps，个别序列剔除了同步失败的相机；官方协议用 18 个视角训练、留出上排中间的 1 个相机评测，场景包括 Sear Steak、Flame Steak 等厨房片段。Quark 称它为 N3DV，Ha 称它为 DyNeRF，其实是同一套数据。此外还有 ENeRF-Outdoor（18 台 1080p 户外相机）和 D3DMV（10 台户外相机）。不同论文在同一个数据集上的评测协议（分辨率、帧段、测试相机）往往不同，数字不能直接横向比较。", "analogy_zh": "想把一段舞蹈拍给远方的人看，有三种做法。① 先录完整段，回去慢慢做一个“会动的雕塑”，这相当于 4D 表示：最精致，但只能事后观看。② 每一帧现场捏一个新泥人，这相当于逐帧前馈：够快，但每个泥人都有些随机差异，连起来看就会“抖”。③ 捏新泥人时参考上一个泥人，只改动变了的地方，这相当于流式或递归状态。Quark 用的是第二种；Ha 在第二种的基础上加了一点第三种，但它只参考上一帧的“骨架”（深度），不参考“表皮”（颜色和融合权重）。", "equations": [{"tex": "\\mathbf{x}_c = \\mathbf{x} + \\Delta_{\\psi}(\\mathbf{x}, t),\\qquad (\\sigma, \\mathbf{c}) = F_{\\Theta}\\big(\\gamma(\\mathbf{x}_c),\\ \\gamma(\\mathbf{d})\\big)", "explain_zh": "规范空间加变形场，这里写的是 D-NeRF 的形式；Nerfies 用 SE(3) 场（每点一个刚体变换），思想相同。x 是时刻 t 观测空间中的一个点；Δ_ψ 是参数为 ψ 的变形网络，输出位移；x_c 是 x 在规范空间中的对应位置；F_Θ 是规范空间里的一个静态 NeRF。所有帧共享同一个 F_Θ，时间上的变化全部由 Δ 来解释，所以天然具备跨帧对应关系。缺点是拓扑变化（比如张嘴、新物体出现）很难用连续形变来描述。"}, {"tex": "(\\sigma, \\mathbf{c}) = F_{\\Theta}\\big(\\gamma(\\mathbf{x}),\\ \\gamma(\\mathbf{d}),\\ \\mathbf{z}_t\\big),\\qquad \\mathbf{z}_t \\in \\mathbb{R}^{1024}", "explain_zh": "这是 DyNeRF 的时间条件辐射场。z_t 是第 t 帧可学习的潜码，与网络参数一起优化（潜码学习率是其他参数的 10 倍）；其余符号与 NeRF 相同。它不假设存在规范空间，所以能表达火焰、液体这类拓扑变化。但所有帧的潜码必须在整段视频上联合优化，无法在“下一帧”到来时即时推理。"}, {"tex": "\\boldsymbol{\\mu}(t) = \\boldsymbol{\\mu} + \\Delta\\boldsymbol{\\mu}(t),\\quad \\mathbf{q}(t) = \\mathbf{q} + \\Delta\\mathbf{q}(t),\\quad \\mathbf{s}(t) = \\mathbf{s} + \\Delta\\mathbf{s}(t),\\qquad (\\Delta\\boldsymbol{\\mu},\\Delta\\mathbf{q},\\Delta\\mathbf{s}) = \\mathrm{MLP}\\big(\\mathbf{f}(\\boldsymbol{\\mu}, t)\\big)", "explain_zh": "这是 4DGS 式的高斯变形。μ、q、s 分别是规范高斯的中心、旋转四元数和尺度；Δ(t) 是时刻 t 的偏移量；f(μ, t) 是从 4D 分解特征平面（HexPlane 式，xy、xz、yz、xt、yt、zt 共 6 个 2D 平面）中取出的特征；MLP 是一个小型解码器。渲染时先变形，再用 3DGS 光栅器渲染（见 n-3dgs 第 2、3 个公式）。颜色和不透明度通常不随时间变化。"}, {"tex": "\\mathcal{S}^{t} = U\\big(\\mathcal{S}^{t-1},\\ \\{I_n^{t}\\}\\big),\\quad \\hat{I}^{t} = R\\big(\\mathcal{S}^{t}, P_t\\big);\\qquad \\dot{D}_n^{t} = M_n^{t} D_n^{t} + (1-M_n^{t})\\,\\dot{D}_n^{t-1},\\quad M_n^{t} = \\min\\!\\Big(\\frac{|I_n^{t}-I_n^{t-1}|}{\\lambda_t} + \\beta,\\ 1\\Big)", "explain_zh": "前半是流式处理的一般形式。𝒮^t 是时刻 t 的状态，可以是一组高斯、一段记忆，也可以只是滤波后的深度；U 是更新函数；R 是从状态渲染目标视角 P_t 的函数。无状态的前馈方法（如 Quark）相当于 𝒮^t 只依赖当前帧。后半是 Ha et al. Sec. 3.2 式 (1)–(2) 的具体实例。D_n^t 是视角 n 当前帧的立体深度，Ḋ_n^t 是滤波后的深度，M_n^t 是软差分掩码，其中 λ_t=0.7、β=0.6，掩码在 1/4 分辨率上计算，经 3×3 max-pool 后再双线性上采样。颜色变化大的像素 M→1，只相信新深度；静止像素的 M 至少为 0.6，仍然至少取 60% 的新深度。这个公式依赖“相机位姿固定”，才能逐像素比较同一台相机的前后两帧。Ha 还把上一帧渲染出的目标视角深度 𝒟^{t−1} 作为额外输入，按权重融入 TSDF（附录 A.2），这是它仅有的第二个时间状态。"}], "worked_example_zh": "(1) 成本账。考虑一段 10 秒、30 fps、约 18 台相机的 DyNeRF 序列，共 300 帧。逐帧训练 NeRF 每帧约 50 GPU 小时，共约 15,000 GPU 小时；DyNeRF 约需 1.3K GPU 小时（8 张 V100 训练一周）；K-Planes hybrid 约 1.8 小时；3DGStream 每帧约 12 s，300 帧约 1 小时，但每帧 12 s 是实时预算 33 ms 的约 360 倍；Quark 每帧 32.2 ms（1024×768，A100）；Ha 每帧约 39 ms（不含立体深度估计）。只有最后两者能在线跟上 30 fps。\n(2) Ha 的差分掩码滤波。假设颜色已归一化到 [0,1]。静止像素若 |ΔI|=0.02，M=min(0.02/0.7+0.6, 1)=0.629，新深度占 62.9%，历史深度占 37.1%。运动像素若 |ΔI|=0.30，M=min(1.03, 1)=1，只用新深度；实际上 |ΔI| 达到 (1−0.6)×0.7=0.28 时 M 就已经等于 1。再算降噪效果：对静止像素，设每帧立体深度等于真值加上独立噪声（方差 σ²），递归 Ḋ^t=M D^t+(1−M)Ḋ^{t−1} 在稳态下的方差 V 满足 V=M²σ²+(1−M)²V，解得 V=M/(2−M)·σ²。M=0.6 时 V=0.43σ²，标准差只降到 0.65σ，最多约 35% 的降噪。记忆很短，这也解释了为什么它主要改善的是 STED（去掉时间滤波后 STED 从 68.76 升到 89.62），而 PSNR 几乎不变（31.17 对 31.16）。\n(3) 同一数据、不同协议。Quark 在 N3DV 上的协议是：视频裁到 300 帧，每 10 帧评一次，以 0 号相机为目标，分辨率 1024×768，M=8，结果为 31.57 dB。Ha 在 DyNeRF 上的协议是：Sear Steak 和 Flame Steak 的前 100 帧，9 个测试视角，分辨率 1352×1014，K=4，结果为 31.17 dB。一个直接的证据是：同一个 ENeRF，在 Quark 的协议下得到 29.86 dB，在 Ha 的协议下得到 29.51 dB。数据集相同，但帧段、目标相机、分辨率、输入视角数都不同，而且 Ha 还用同一厨房的 3 个 DyNeRF 场景训练过。这两个数不能拿来比高低。", "pitfalls_zh": ["把 N3DV 和 DyNeRF 当成两个数据集，或者直接横比两篇论文的数字。它们是同一套 Neural 3D Video 数据（Li et al., CVPR 2022），而 Quark 与 Ha 的评测协议完全不同（见上例）。", "把“渲染实时”的 4D 方法当成在线方法。4DGS 的 82 fps（800×800，RTX 3090）和 4K4D 的 4K 80 fps（RTX 4090），都是在整段视频离线优化之后才达到的。它们需要先看到全部帧，不能用于直播式远程临场。Ha 在附录 A.8 图 12 中只和 4DGS、4K4D（逐场景优化，使用 K=17 个视角）以及 MVSplat 做了定性比较，没有给出定量数字。", "混淆单目动态与多视角动态。D-NeRF、Nerfies、HyperNeRF 处理的是一台移动相机拍的视频，靠变形先验来解决严重欠约束的问题。远程临场用的是固定多相机阵列，每帧都有多视角约束，难点在于实时和时间一致，而不在于能不能观测到。Quark 在 Sec. 2.3（Single-view Methods）里也把这类“随时间变化的多个视角”的方法和单图、生成式方法归为另一类，不做比较。", "以为逐帧 PSNR 高就不会闪烁。PSNR、SSIM、LPIPS 都是逐帧计算的，对帧间的随机抖动不敏感。Quark 承认所有指标都不衡量时间闪烁（Sec. 4.1），Ha 才额外报告了 TCC、STED 等时间指标（见 v-temporal、v-metrics）。另外，Ha 只在深度上有状态，融合网络和背景图 I_BG 仍然逐帧独立，它们自身带来的闪烁不受约束。"], "in_quark": {"used": false, "where": "Sec. 1 与图 1 说明（视频流、每个时间步、每帧生成并丢弃 LDM）；Sec. 2.3（Single-view Methods）；Sec. 4.1 表 1 的 Neural 3D Video 列与评测协议；Sec. 4.1 末段与 Sec. 4.3 Limitations", "how_zh": "Quark 没有任何 4D 表示或时间状态，它处理动态场景的方式是“每一帧都当作新场景”。图 1 的说明写到，网络在每个时间步都重新编码输入、推断 LDM；Sec. 1 说 LDM 每帧重建、渲染后即丢弃。它在 Neural 3D Video（即 DyNeRF 数据）上评测，按 Li et al. 的协议把视频裁到 300 帧，每 10 帧评一次，以 0 号相机为目标。在 1024×768 下，Quark 为 31.57/0.942/0.127，ENeRF 为 29.86，GPNR 为 29.80，SIMPLI 为 28.79。注意 Quark 的训练集里没有任何动态数据。Sec. 4.3 明确承认，Quark 不强制帧间一致，逐帧独立重建会产生闪烁。Sec. 4.1 末段补充了两点：所有指标都不衡量闪烁，在视频中 NeRF、3DGS 这类离线全场景方法表现更好；目标相机移动导致输入相机切换时也会闪烁，输入曝光差异大时更明显。Sec. 2.3 把 D-NeRF、Nerfies、HyperNeRF 等“随时间的多视角”方法与单图、生成式方法一起归为另一类，不做比较。理解了动态表示的谱系，就能看清 Quark 选择的是“逐帧前馈”这一端：换来了 30 fps 和零预处理，付出的是时间一致性。"}, "in_ha": {"used": true, "where": "标题与 Sec. 1（online 3D video synthesis）；Sec. 2（Voxel-based 段的 4D 扫描、Neural-based 段的 4D 体渲染、Point-based 段的动态高斯）；Sec. 3.2 式 (1)–(3)；附录 A.2 式 (13)–(14)；Sec. 4.2、4.3、4.5；附录 A.6–A.8（图 12）", "how_zh": "Ha et al. 的任务就是多视角视频的在线新视角合成，但它刻意不建 4D 表示。Sec. 2 把三类动态方法列为对照：4D 扫描方法（DynamicFusion、Fusion4D 等，在规范 TSDF 空间里估计运动）必须在体素分辨率和计算量之间折中；4D 体渲染方法（DyNeRF、HexPlane、K-Planes、4K4D 等）逐场景训练代价太高；动态高斯方法（Deformable 3DGS、Dynamic 3D Gaussians、4DGS、Spacetime Gaussians、3DGStream、ST-4DGS、GauFRe 等）“需要昂贵的逐场景优化”。它的时间机制只有两条，都作用在深度上。① Sec. 3.2 式 (1)–(2) 的颜色差分掩码递归滤波（λ_t=0.7，β=0.6），即上面的第 4 个公式。② 附录 A.2 把上一帧渲染出的目标视角深度 𝒟^{t−1} 作为 TSDF 的额外输入，权重上限 η=15，权重大小由前向 splat 到目标视角、再逐通道取最大值的差分掩码决定。网络本身没有状态，也没有时间损失，训练样本都取自单一时刻。评测在 DyNeRF（Sear Steak 和 Flame Steak 的前 100 帧）、ENeRF-Outdoor 和 D3DMV 上进行，除保真度外还报告 TCC、STED 和视角一致性指标 SDT、SDV。消融中去掉时间滤波后 PSNR 几乎不变（31.16），STED 从 68.76 恶化到 89.62。附录 A.8 图 12 与逐场景优化的 4DGS、4K4D（K=17）以及 MVSplat 做了定性比较。这个设计有两个隐含前提：相机阵列固定，这样才能逐像素比较前后两帧；回灌上一帧深度时，默认目标相机没有移动（论文没有说明目标相机移动时 𝒟^{t−1} 如何重投影）。"}, "in_field_zh": "远程临场本质上是一个“流式动态”问题：人在动，观看者的头也在动，而系统只能看到过去和现在。实践中常把场景拆成两部分：静态背景可以用 NeRF/3DGS 离线预建，动态前景逐帧前馈处理，再用时间机制抑制闪烁。几种做法各有取舍：无状态逐帧处理简单、不会漂移，但会闪烁；短期递归（如 Ha 的深度滤波）很便宜，但记忆短，而且依赖相机固定；长期记忆或持久高斯可以利用“之前看到过、现在被挡住”的像素，但要处理漂移和新物体出现的问题。锚点资料中的 Online Neural Space Time Memory、SplatVoxel 等工作正沿着这个方向补 Quark 的短板。带宽方面，4D 高斯可以压缩后流式传输（见 a-compression），而与目标视角绑定的方法需要把 K 路 RGB（和深度）实时送到渲染端。评测上必须补上时间指标、长序列漂移，以及“头在动、场景也在动”的组合情形（见 v-temporal、a-temporal-video、a-dynamic-4d）。", "resources": [{"title": "Neural 3D Video Synthesis from Multi-view Video (Li et al., CVPR 2022)", "url": "https://arxiv.org/abs/2103.02597", "type": "paper", "note_zh": "N3DV/DyNeRF 数据集（21 台 GoPro Black Hero 7，2028×2704，30 fps，18 个训练视角，留出上排中间相机评测）的来源，也是时间潜码方法 DyNeRF 的原文。读 Sec. 3（潜码、层级训练、重要性采样）和 Sec. 4.1 的评测协议（长度不少于 300 帧的视频每 10 帧评一次），Quark 沿用的正是这套协议。数据下载见 https://github.com/facebookresearch/Neural_3D_Video"}, {"title": "4D Gaussian Splatting for Real-Time Dynamic Scene Rendering (Wu et al., CVPR 2024)", "url": "https://arxiv.org/abs/2310.08528", "type": "paper", "note_zh": "用 HexPlane 式分解的 4D 神经体素特征加小 MLP 预测高斯变形，800×800 下 82 fps（RTX 3090）。它是 Ha 附录 A.8 定性对比的逐场景基线之一。可对照第 3 个公式阅读，理解“离线 4D”这一端。"}, {"title": "3DGStream: On-the-Fly Training of 3D Gaussians for Efficient Streaming of Photo-Realistic Free-Viewpoint Videos (Sun et al., CVPR 2024)", "url": "https://arxiv.org/abs/2403.01444", "type": "paper", "note_zh": "流式逐帧优化的代表作：用神经变换缓存（平移、旋转）加自适应新增高斯，每帧约 12 s，渲染 200 fps。读它可以理解“在线但不实时”处在地图上的什么位置。"}, {"title": "CMU 16-825 Learning for 3D Vision — Lecture 14: Dynamic 3D Representations", "url": "https://learning3d.github.io/schedule.html", "type": "course", "note_zh": "2026 秋季课表第 14 讲，建议阅读 Neural Scene Flow Fields 和 Nerfies。可以配合 MIT 6.S980（https://www.scenerepresentations.org/courses/2023/fall/inverse-graphics）的 Dynamic Scene Representations I–II 两讲录像（光流、场景流，以及把运动建模进场景表示）一起学。"}], "self_check": [{"q_zh": "Ha 的差分掩码滤波为什么必须以“相机固定”为前提？如果用在手持移动的相机上会怎样？", "a_zh": "式 (1) 逐像素比较同一台相机前后两帧的差 |I^t−I^{t−1}|。相机固定时，像素颜色不变基本就意味着场景在那里是静止的，可以复用历史深度。相机一动，几乎所有像素的颜色都会变，M 全部饱和为 1，滤波就失效了。更糟的是，如果某些像素恰好颜色相近而没有变化，错位的历史深度会被混进来。正确的做法是先按运动做 warping（用光流或位姿，见 d-flow），再做比较。"}, {"q_zh": "4DGS 在 800×800 下能以 82 fps 渲染，为什么仍然不适合直播式远程临场？", "a_zh": "82 fps 只是渲染速度。它的变形场和规范高斯要在整段多视角视频上离线优化，必须先拿到全部帧，每段序列还要花训练时间。直播则要求每一帧在采集后几十毫秒内就能看到。"}, {"q_zh": "Quark 在 N3DV 上得到 31.57 dB，Ha 在 DyNeRF 上得到 31.17 dB。能否据此说 Quark 更好？请至少给出三个理由。", "a_zh": "不能。① 评测协议不同：Quark 用 300 帧、每 10 帧评一次、以 0 号相机为目标；Ha 用两个场景的前 100 帧、9 个测试视角。同一个 ENeRF 在两种协议下分别是 29.86 和 29.51，说明协议本身就会带来差异。② 分辨率和输入视角数不同：前者为 1024×768、M=8，后者为 1352×1014、K=4。③ 训练数据不同：Ha 用同一厨房的 3 个 DyNeRF 场景训练过，Quark 的训练集里没有动态数据。④ 两篇论文都没有与对方直接比较；而且 PSNR 不反映闪烁，Ha 的优势主要体现在 STED 等时间指标上。"}], "prereqs": ["n-nerf", "n-3dgs"]}]}, {"id": "M8", "title_zh": "视频、时间一致性、评测与系统", "title_en": "Video, temporal consistency, evaluation & systems", "goal_zh": "理解“闪烁”从哪来、如何度量，以及实时 3D 临场系统在延迟、带宽和人眼感知上的约束。", "intro_zh": "前七个模块解决的是“单帧怎么做对”：几何、深度、渲染和网络。M8 讨论的是把单帧方法放进真实的远程临场系统后才会暴露的四个问题：帧与帧之间是否稳定；怎样用数字证明它稳定；数据怎样在一百毫秒左右从一端送到另一端；人眼和 3D 显示器到底需要什么。\n\n这一模块正好对应两篇锚点论文最大的分歧。Quark 单帧质量很高（N3DV 上 1024×768 时 PSNR 31.57，32.2 ms/帧，1080p 约 30 fps），但作者在 Sec. 4.1 末段和 Sec. 4.3 承认，每帧独立重建、目标相机移动时输入集合切换，都会产生闪烁，而表中所有指标都不衡量闪烁。Ha et al. 则整篇围绕时间与视角一致性展开：Eq. (1)–(2) 用颜色差分掩码做递归滤波，附录 A.2 把上一帧深度回灌进 TSDF，Sec. 4.3 采用 TCC、STED、SDT、SDV 四个一致性指标。不掌握本模块，就很难判断“PSNR 只涨 0.01 dB、STED 从 95.42 降到 68.76”意味着什么，也看不出两篇论文都没有计入的开销：立体深度估计、编解码、网络传输和双目渲染。\n\n系统层面以 Project Starline（Lawrence et al., ACM TOG 2021）为参照。它传输 7 路 H.265 视频流，合计 30–100 Mbit/s，视频处理全链路 60 Hz；回环实测端到端延迟 105.8 ms（标准差 9.1 ms）；头部跟踪延迟约 33 ms，靠外推补偿；显示器是 65 英寸 8K 头部跟踪裸眼 3D 屏，每只眼约 45 像素/度。把 Quark 的 32.2 ms/视角和 Ha 的约 39 ms/视角（不含深度估计）填进这张预算表，才能看清“实时”在远程临场里的真实含义。\n\n四个概念按顺序排列：v-temporal 讲闪烁从哪来、怎样滤除以及其代价；v-metrics 讲怎样量化单帧保真度和时间/视角一致性，以及读实验表时要核对的口径；v-codec 讲编码、传输和端到端延迟预算；v-perception 讲双目视差、辐辏-调节冲突、运动到光子延迟和 3D 显示对渲染器的约束。学完后应能独立读懂两篇论文的实验表，并能为一个组合系统写出延迟和带宽预算。", "study_tips_zh": "1. 手算 EMA。取 α=0.6（Ha 掩码的下限 β）和 α=0.1（TAA 常用值），分别算四样东西：稳态噪声方差比 α/(2−α)、相邻帧差方差比 α²/(2−α)、阶跃响应降到 10% 所需的帧数 ln0.1/ln(1−α)、匀速变化下的稳态滞后 (1−α)v/α。再换算成 30 fps 和 60 fps 下的毫秒数，体会降噪和滞后是怎样互换的。\n\n2. 写一个约 50 行的 NumPy 小实验。合成一段深度视频：静止背景加一个移动方块，每帧加 σ=2 cm 的高斯噪声。实现 Ha 的 Eq. (1)–(2)：λ_t=0.7、β=0.6，在 1/4 分辨率上计算，经 3×3 max-pool 后双线性上采样。然后人为加入一段全局亮度渐变，或让方块与背景颜色相同但深度不同，观察掩码何时误判、何时留下拖影和悬空的中间深度。\n\n3. 做指标实验。用 scikit-image 计算 PSNR/SSIM，用 pip 安装 lpips 计算 LPIPS，用 torchvision 自带的 RAFT 光流计算 warping error。复现本模块的“±0.02 交替偏移”玩具例子，确认两段视频逐帧 PSNR 完全相同，而 TCC 和 warping error 相差极大；再把偏移幅度降到 ±0.002，观察 TCC 为什么变得迟钝（SSIM 的稳定常数 C_1）。最后给同一段视频画 x–t 切片：固定一行像素，按时间堆叠，直接用眼睛看闪烁。\n\n4. 做编码实验。用 ffmpeg 的 libx265 以 10-bit（yuv420p10le）和不同的固定 QP 编码一段深度视频，分别试线性深度映射和逆深度映射。解码后反投影成点云，统计边缘处的飞点数量和平均深度误差，并与 Ha 的 TSDF 截断 τ=0.02 m 对比。\n\n5. 做一张延迟预算表，列出采集、深度估计、编码、传输、抖动缓冲、解码、重建渲染、显示各段。分别填入 Starline、Quark（32.2 ms/视角）和 Ha（约 39 ms/视角，另加未计入的立体深度）的数字，再改成双目 90 Hz，看哪一项最先超标。粗测自己设备的 glass-to-glass 延迟：用手机慢动作录像，同时拍下一个毫秒计时器和它在视频通话里的画面（Starline 用 LED 加回环模式测量）。\n\n6. 动手做立体与重投影。拿一张 RGB-D 图，用视差公式渲染左右眼图像，放进手机 VR 盒或配红蓝眼镜观看。再实现两种 timewarp：只含旋转的版本（单应 K R K⁻¹），以及带逐像素深度的平移 warp，观察后者出现的遮挡空洞。这正是 i-warping 和 Ha 的前向 splatting 要解决的问题。", "concepts": [{"id": "v-temporal", "name_zh": "时间一致性、闪烁与时域滤波", "name_en": "Temporal consistency, flicker & temporal filtering", "tldr_zh": "逐帧独立预测时，每帧误差互不相关，这些误差会直接表现为闪烁。时域滤波用历史帧做加权平均来压低噪声，但必须靠静止/运动判别或运动补偿，避免把真实变化抹成拖影。这是降噪、滞后和鬼影三者之间的权衡。", "intuition_zh": "闪烁是“误差的时间结构”问题，不是“误差大小”问题。设一个静止像素的真值不变，每帧估计为 \\(x_t = x + e_t\\)，误差 \\(e_t\\) 在帧间独立。这时单帧误差可以很小，PSNR 很高，但相邻帧差 \\(e_t - e_{t-1}\\) 的方差是单帧误差方差的 2 倍，而人眼对大面积平坦区和边缘处的时间变化非常敏感。制造这种帧间独立误差的来源很多：逐帧独立的网络（Quark、ENeRF、GPS-Gaussian）、逐帧独立的立体匹配（RAFT-Stereo）、随视点移动而切换的输入视角集合，以及相机之间的曝光差。\n\n最简单的时域滤波是递归（指数滑动）平均 EMA：新估计 = α × 当前观测 + (1−α) × 上一时刻估计。它只需存一帧历史。α 越小，降噪越强，但对真实变化的响应越慢：物体移走后旧值还会残留若干帧，形成鬼影（ghosting）或滞后（lag）。卡尔曼滤波是 EMA 的推广，增益由“预测不确定度”与“观测噪声”之比自动决定（见 f-prob）；对“随机常数/随机游走”这类最简单的模型，稳态卡尔曼增益是常数，滤波器退化成固定 α 的 EMA。所以核心问题变成：每个像素应该信任历史多少？\n\n有两类办法回答这个问题。第一类是静止/运动判别：相机固定时，逐像素比较前后两帧颜色，差得多就认为在动，放弃历史。第二类是运动补偿：先用光流，或用深度加相机位姿，把历史帧对齐到当前帧（见 d-flow）再平均，并把历史值裁剪到当前邻域的颜色范围内，以拒绝过时数据；实时图形学中的 TAA 就是这样做的。第一类很便宜，但会把光照变化、自动曝光误判为运动，把颜色与背景相近或无纹理的运动物体误判为静止。第二类适用于移动相机，但依赖光流质量，遮挡暴露区仍要拒绝历史。\n\n滤波放在哪一级同样关键。可以滤输入（深度），可以滤中间表示（TSDF、特征、Gaussian 状态），也可以滤输出图像（盲视频时间一致性，Lai et al. 2018）。滤输入只能消除输入带来的闪烁，网络自己引入的闪烁管不到；滤输出最通用，但可能让画面与几何脱节。Ha et al. 选了前两级：对输入深度做 EMA，再把上一帧 TSDF 深度回灌。", "analogy_zh": "手机夜景模式的多帧降噪就是一个例子。三脚架上拍静物，多拍几张平均，画面就干净了；但如果画面里走过的人也被平均进去，就会留下半透明的残影。时域滤波器像一个逐像素把关的门卫，判断“这里没变，可以继续平均”还是“这里变了，赶紧清空历史”。门卫太松，会出鬼影；太严，降噪无效，画面照样闪。", "equations": [{"tex": "\\hat{x}_t = \\alpha\\,x_t + (1-\\alpha)\\,\\hat{x}_{t-1},\\qquad \\operatorname{Var}(\\hat{x}) = \\frac{\\alpha}{2-\\alpha}\\,\\sigma^2,\\qquad N_{\\text{eff}} = \\frac{2-\\alpha}{\\alpha}", "explain_zh": "EMA 及其稳态降噪能力。x_t 是当前帧观测（如某像素深度），\\hat{x}_t 是滤波输出，α∈(0,1] 是新观测的权重（在 Ha 中就是掩码 M）。若观测等于真值加独立噪声（方差 σ²），稳态输出方差为 α/(2−α)·σ²，相当于对 N_eff 帧做等权平均。α=1 即不滤波；α=0.1 时 N_eff=19，与 TAA 综述 Sec. 3.3 给出的“最多约 19 个等效样本”一致；α=0.6 时 N_eff≈2.3。相邻两帧输出之差的方差为 2σ²·α²/(2−α)，即原始帧差方差的 α²/(2−α) 倍。"}, {"tex": "M_n^t = \\min\\!\\left(\\frac{|I_n^t - I_n^{t-1}|}{\\lambda_t} + \\beta,\\; 1\\right),\\qquad \\dot{D}_n^t = M_n^t\\, D_n^t + \\left(1 - M_n^t\\right)\\dot{D}_n^{t-1}", "explain_zh": "Ha et al. Eq. (1)–(2)。I_n^t 是第 n 个输入相机第 t 帧的颜色，D_n^t 是该帧的 RAFT-Stereo 深度，\\dot{D} 是滤波后的深度。λ_t=0.7 控制对颜色变化的敏感度；β=0.6 是下限，因此每帧至少取 60% 的新深度。M 在 1/4 分辨率上计算（降采样顺带平均掉一部分传感器噪声），经 3×3 max-pool 扩张后再双线性上采样。这实际上是一个逐像素 α 的 EMA：当颜色差 ≥ λ_t(1−β)=0.28 时 M=1，完全不用历史。论文没有说明像素值范围，也没说明 RGB 三通道如何合并成一个差值，本模块按 [0,1] 范围的单通道差值理解。"}, {"tex": "\\hat{x}_t(\\mathbf{p}) = \\alpha\\, x_t(\\mathbf{p}) + (1-\\alpha)\\,\\operatorname{clip}\\!\\left(\\hat{x}_{t-1}\\big(\\mathbf{p} + \\mathbf{u}_{t\\to t-1}(\\mathbf{p})\\big),\\, [a_{\\mathbf{p}}, b_{\\mathbf{p}}]\\right)", "explain_zh": "运动补偿滤波（TAA 式）。p 是像素坐标；u_{t→t−1}(p) 是从当前帧指向上一帧的运动向量，可以是光流，也可以由深度和相机位姿算出的重投影位移。历史值先按运动取样（后向 warping，见 d-flow），再裁剪到当前帧 p 邻域观测值的最小/最大范围 [a_p, b_p] 内，以拒绝已经过时的历史（遮挡、光照变化）。Ha 因为输入相机固定，省去了 u 这一项；但如果目标视点随头部移动，回灌的上一帧深度就需要做这种重投影。"}, {"tex": "e_n = (1-\\alpha)^n\\,\\Delta,\\qquad n_{90\\%} = \\frac{\\ln 0.1}{\\ln(1-\\alpha)},\\qquad e_{\\text{ramp}} = \\frac{1-\\alpha}{\\alpha}\\,v", "explain_zh": "滞后与鬼影的持续时间。真值在某帧突变 Δ（物体移入或移出）后，如果滤波器没识别出变化、仍用固定 α，第 n 帧的残留误差是 (1−α)^n·Δ。n_{90%} 是误差降到 10% 所需的帧数：α=0.1 时约 21.9 帧（60 fps 下约 364 ms），α=0.6 时约 2.5 帧（30 fps 下约 84 ms）。若真值匀速变化、每帧变化 v（例如物体朝相机缓慢移动），输出会稳定地落后 e_ramp=(1−α)v/α。三式与第一个公式合起来说明：降噪越强，拖影越长、滞后越大。"}], "worked_example_zh": "设一个静止背景像素的真值深度为 2.00 m，RAFT-Stereo 每帧的独立噪声 σ=2 cm。\n(1) 不滤波。单帧误差标准差为 2 cm，相邻帧深度差的标准差为 √2×2≈2.83 cm，已经超过 Ha 的 TSDF 截断 τ=2 cm。于是 TSDF 零交叉会逐帧跳动，表现为表面和边缘的抖动。\n(2) 静止区颜色几乎不变（|ΔI|≈0），此时 M=β=0.6。稳态方差比为 0.6/1.4≈0.43，误差标准差降到约 1.31 cm。相邻帧差的方差比为 α²/(2−α)=0.36/1.4≈0.26，帧间抖动的标准差从 2.83 cm 降到约 1.43 cm，大约减半，相当于只平均了约 2.3 帧，所以 Eq. (2) 的记忆很短。作为对照，TAA 常用的 α=0.1 能把帧间抖动降到约 0.07 倍，但阶跃响应要 21.9 帧。\n(3) 快速移动的手。颜色差 0.3 时 M=min(0.3/0.7+0.6, 1)=1，直接用新深度，不会拖影。\n(4) 失败情形一：颜色相近的前景和背景。穿白衬衫的人站在白墙前并向侧面走开，衬衫内部某像素的深度从 1.5 m（人）跳到 3.0 m（墙），颜色却几乎不变（|ΔI|=0.02），M=0.02/0.7+0.6≈0.63。下一帧滤波后的深度为 0.63×3.0+0.37×1.5≈2.44 m，误差约 0.56 m，悬在人和墙之间，形成一个“飞点”；误差按 0.37^n×1.5 m 衰减，第 4 帧仍有 2.9 cm，要到第 5 帧（30 fps 下约 167 ms）才降到 τ=2 cm 以内。3×3 max-pool 只能扩张已经检测到颜色变化的区域，救不了这种情况。慢速运动则表现为稳定滞后：纯色衬衫以 0.6 m/s 朝相机前倾（30 fps 下每帧 2 cm），|ΔI|≈0 时 M=0.6，稳态滞后 e_ramp=0.4×2/0.6≈1.3 cm，已达 τ 的三分之二。\n(5) 失败情形二：自动曝光让整幅画面亮度跳变 0.3，所有像素 M=1，整帧滤波失效，闪烁又回来了。\n(6) TSDF 回灌（A.2 Eq. 13–14）。把 A.2 中那个未公布数值的系数记为 β′（它与 Eq. 1 的 β=0.6 不是同一个参数）。𝓜 是把输入视角的 M splat 到目标视角后取最大值，而 M 的下限是 0.6，所以静止区 max(1−𝓜,0) 最多为 0.4。设每帧输入权重之和 W=Σω_k 不变，记 c=β′(1−𝓜)，稳态时 ω_tmp=c(ω_tmp+W)，解得 ω_tmp=cW/(1−c)，回灌深度在 TSDF 中所占的权重比例恰好等于 c，即不超过 0.4β′。再受上限 η=15 约束，比例不超过 15/(15+W)。输入权重 ω_k=min(0.001·(ν_k/49)^{−1/2}, 1)：7×7 邻域内深度起伏的均方根为 1 cm 时 ω_k=0.1，为 2 mm 时为 0.5，要小于 1 mm 才到 1；起伏被截断在 τ，所以 ω_k≥0.05。K=4 时 W 约在 0.2–4 之间，对应的比例上限在 79%（W=4）到约 99%（W=0.2）之间。若 β′=1，静止区历史占比就是 40%，与 Eq. (2) 的记忆相当；若 β′ 大到使 c 接近或超过 1，ω_tmp 会一路增长到 η 封顶，时间记忆远强于 Eq. (2)。β′ 没有公布，所以回灌到底有多强，读者无法从论文算出。", "pitfalls_zh": ["把“单帧误差小”当成“视频稳定”。独立误差的帧间差方差是单帧的 2 倍，而 PSNR 对闪烁完全不敏感（Quark 在 Sec. 4.1 末段明说其指标都不测闪烁）。", "颜色差分判断静/动只在相机固定、光照稳定时成立。自动曝光、阴影、火焰（DyNeRF 的 Flame Steak）、视频编码噪声会被误判为运动，从而关掉滤波；颜色与背景相近或纯色的运动物体会被误判为静止，留下旧深度、悬空的中间深度和鬼影。", "回灌上一帧结果（Ha 的 𝒟^{t−1}）默认目标视点不动。头部移动时，必须先按新旧位姿把历史重投影（公式 3 中的 u 项），否则历史本身就是错位的，一致性反而变差；论文没有描述这一步。", "只滤输入，管不住网络自己带来的闪烁。Ha 的融合网络没有任何时间损失，只在单一时刻上训练，背景图 I_BG 等输出的时间稳定性不受控制；递归滤波和 TSDF 回灌还可能在长序列上累积漂移，而论文只评测了前 100 帧。Starline 也是一样：渲染器逐帧独立、没有时间历史，残余闪烁只能靠边缘混合来减弱。"], "in_quark": {"used": false, "where": "摘要与 Fig. 1（每帧生成并丢弃 LDM）；Sec. 3.4（只用静态数据训练，损失 10·L1+LPIPS）；Sec. 4.1 末段；Sec. 4.3 Limitations", "how_zh": "Quark 没有任何时域滤波或时间状态。每个时间步都重新编码 8 路输入，从可学习的常数特征初始化 LDM，经 5 次 Update & Fuse 得到目标视角的 LDM，渲染后立即丢弃（摘要原话是每帧动态创建并丢弃内部 3D 几何）。训练数据 Spaces、RFF、Shiny、SWORD 全是静态多视角图像，损失 10·L1+LPIPS 中也没有时间项。作者在 Sec. 4.1 末段承认，表中指标都不衡量时间闪烁，离线的 NeRF/3DGS 在这一点上优于 Quark；目标相机移动时，最近 8 个输入视角会切换，输入之间曝光差异大时闪烁尤其明显。Sec. 4.3 再次说明每帧独立重建会产生闪烁，并把时间域列为未来工作。有了本概念，就能把 Quark 的闪烁分成两个来源：一是网络在相邻帧上的独立误差，需要时间状态或时间损失来解决；二是输入集合切换造成的 blend weights 突变，需要平滑的视角加权或滞回机制，以及输入之间的颜色标定。团队后续的 Fuse-and-Refine（SplatVoxel）和 Online Neural Space Time Memory 正是在补这一块。"}, "in_ha": {"used": true, "where": "Sec. 3.2 Eq. (1)–(3)；附录 A.1 Eq. (10)–(11)、A.2 Eq. (13)–(14)；Sec. 4.5 Table 3 消融", "how_zh": "Ha et al. 把时间一致性完全放在几何端，分两步。第一步是 Eq. (1)–(2)：利用输入相机固定这一点，对每个输入视角计算软差分掩码 M=min(|I_t−I_{t−1}|/0.7+0.6, 1)。掩码在 1/4 分辨率上计算，经 3×3 max-pool 扩张（相当于把运动区向外扩约 4 个全分辨率像素，再加上双线性上采样的软过渡；宁可当作动态，也不留拖影），然后对 RAFT-Stereo 深度做逐像素 α=M 的 EMA。第二步是 Eq. (3) 与 A.2：把上一帧在目标视角 ray-march 得到的 TSDF 深度 𝒟^{t−1} 作为额外输入融进当前 TSDF，权重为 ω_tmp=min(β′·ω_acc·max(1−𝓜, 0), η)，η=15，ω_acc 是上一帧的总权重；其中 𝓜 是把 K 张差分掩码 splat 到目标视角后逐通道取最大值。因为 M≥0.6，静止区的稳态历史占比等于 β′(1−𝓜)≤0.4β′，并受 η 封顶（推导见例题 (6)）；β′ 的数值论文没有给出。Table 3 显示：去掉时间滤波，PSNR 从 31.17 变为 31.16，基本不变，STED 则从 68.76 变差到 89.62；去掉 TSDF 引导，STED 为 95.42。也就是说，这些模块改变的是误差的时间结构，而不是误差大小。不懂 EMA 的方差与滞后关系，就读不出 β=0.6 意味着“至多保留 40% 历史、记忆约 2 帧”，也看不出掩码误判为什么会造成鬼影。"}, "in_field_zh": "远程临场里几乎每个环节都要做时域处理。深度前端：Starline 的时空立体用 5 对 NIR 图像的重叠时间窗生成 60 Hz 深度；Stereo Any Video、PPMStereo 等视频立体方法在网络内部做时间一致性。头部/眼睛跟踪：Starline 对 120 Hz 的人脸特征点做外推，外推会放大噪声、导致渲染视点抖动，所以再用双指数平滑和“change band”滞回滤波去抖。渲染端：Starline 的渲染逐帧独立、不带时间历史，承认仍有残余闪烁，用边缘混合减弱。表示层：3DGStream、IGS、StreamSplat 等流式 4D 高斯方法维护持久状态（见 a-dynamic-4d）。输出层：盲视频去闪烁（Lai et al. 2018）、实时渲染中的 TAA 和时间超分。编解码器本身的帧间预测也属于时域处理，连 RTP 的到达抖动估计都是一个增益 1/16 的 EMA（见 v-codec）。系统设计上还要处理输入视角集合的切换：对更多视角做软加权或加滞回，避免 K 近邻集合跳变。进阶内容见 a-temporal-video。", "resources": [{"title": "Learning Blind Video Temporal Consistency (Lai et al., ECCV 2018)", "url": "https://arxiv.org/abs/1808.00449", "type": "paper", "note_zh": "输出端去闪烁的代表作。Sec. 3.2 给出带可见性掩码的短期/长期光流 warping 时间损失，Sec. 4.3 的 Eq. (5)–(6) 定义 warping error 指标，都可以直接用来给 Quark 这类逐帧方法加时间约束。"}, {"title": "A Survey of Temporal Antialiasing Techniques (Yang, Liu, Salvi, Eurographics 2020 STAR)", "url": "http://behindthepixels.io/assets/files/TemporalAA.pdf", "type": "paper", "note_zh": "作者自存的免费全文（该站点只有 http 访问）。实时图形学对“历史累积加历史校验”的系统总结：Sec. 3.2 讲帧间重投影，Sec. 3.3 讲指数平滑与有效样本数（α=0.1 时稳态最多约 19 个等效样本），Sec. 4.1/4.2 讲历史拒绝与历史校正（邻域裁剪），Sec. 6.2 讲鬼影与时间滞后。"}, {"title": "An Introduction to the Kalman Filter (Welch & Bishop, UNC TR 95-041)", "url": "https://www.cs.utexas.edu/~pstone/Courses/393Rfall15/readings/Welch+Bishop-TR-95.pdf", "type": "tutorial", "note_zh": "从“预测—更新”的角度理解 EMA 的 α 为什么应由噪声方差决定。重点读第 1 节“The Discrete Kalman Filter”和第 3 节“A Kalman Filter in Action: Estimating a Random Constant”的数值例子。"}, {"title": "Geometry-guided Online 3D Video Synthesis with Multi-View Temporal Consistency (Ha et al., CVPR 2025)", "url": "https://arxiv.org/html/2505.18932v1", "type": "paper", "note_zh": "对照本概念精读 Sec. 3.2 的 Eq. (1)–(3)、附录 A.1–A.2 的 Eq. (10)–(14)，以及 Sec. 4.5 Table 3 的消融。"}], "self_check": [{"q_zh": "一个静止像素的深度每帧叠加独立噪声 σ，用 α=0.6 的 EMA 滤波。滤波后单帧误差和相邻帧差的标准差分别变为原来的多少倍？这个 α 对应 Ha 的哪个参数？", "a_zh": "稳态方差比 α/(2−α)=0.6/1.4≈0.43，单帧误差标准差约为原来的 0.65 倍。相邻帧差方差比（相对原始的 2σ²）为 α²/(2−α)≈0.26，帧差标准差约为原来的 0.51 倍。α=0.6 就是 Ha Eq. (1) 中的 β=0.6：静止区颜色差≈0 时，M 取下限 0.6。"}, {"q_zh": "为什么 Ha 对输入深度的时间滤波可以不用光流？而如果观看者戴头显自由移动，回灌上一帧的 TSDF 深度 𝒟^{t−1} 为什么就需要重投影？", "a_zh": "输入相机固定，同一像素在前后两帧对应同一条射线，只需判断这条射线上的颜色有没有变（Eq. 1–2 在输入视角上进行）。𝒟^{t−1} 却在目标视角的图像空间里，目标视点一动，同一像素对应的射线就变了。必须先按帧间的 R、t 和深度把上一帧深度重投影（公式 3 中的 u 项）再融合，否则会把错位的历史当成“静止区”融进来。论文没有描述这一步。"}, {"q_zh": "一个与背景同色的物体移开，使某像素深度从 1.5 m 跳到 3.0 m，而颜色差只有 0.02。Ha 的 Eq. (1)–(2) 会怎样？需要几帧误差才小于 τ=2 cm？", "a_zh": "M=0.02/0.7+0.6≈0.63，每帧只取 63% 新深度。第 1 帧后误差约 0.37×1.5≈0.56 m，深度悬在两者之间；误差按 0.37^n×1.5 m 衰减，第 4 帧约 2.9 cm，第 5 帧约 1.1 cm，即要 5 帧（30 fps 下约 167 ms）。这说明颜色差分只能检测“颜色变了”，检测不到“颜色没变但深度变了”。"}, {"q_zh": "Quark 的视频闪烁有哪两个来源？各需要什么手段来解决？", "a_zh": "一是每帧从头独立推理，网络误差在帧间独立，需要引入时间状态（记忆，或把上一帧 LDM/特征重投影后作为输入）或时间损失。二是目标相机移动时最近 8 个输入视角切换，而输入之间曝光不同，blend weights 随之突变，需要平滑的视角加权或滞回机制，以及输入之间的颜色标定。依据是 Sec. 4.1 末段和 Sec. 4.3。"}], "prereqs": ["f-prob", "d-flow"]}, {"id": "v-metrics", "name_zh": "图像与视频质量指标", "name_en": "Image & video quality metrics", "tldr_zh": "单帧指标（PSNR、SSIM、LPIPS、FLIP）回答“这一帧像不像真值”；时间与视角指标（warping error、tOF、TCC、STED、SDT/SDV、EPI）回答“误差随时间、随视点是否稳定”。两类互相不能替代，读实验表时必须两类一起看，并核对分辨率、帧采样方式和计时口径。", "intuition_zh": "单帧指标分三个层次。像素层是 PSNR：对 MSE 取对数，简单、可加，但它惩罚小位移和模糊的方式与人眼不同，一张轻微错位的锐利图，PSNR 可能比一张模糊图还低。结构层是 SSIM：在局部窗口里分别比较亮度、对比度和结构（协方差），对整体亮度偏移较宽容，对结构破坏敏感。感知层是 LPIPS：把两张图送进预训练网络（AlexNet、VGG 或 SqueezeNet），在多层特征上做加权 L2，即 \\( d(x,x_0)=\\sum_l \\frac{1}{H_lW_l}\\sum_{h,w}\\|w_l\\odot(\\hat{y}^l_{hw}-\\hat{y}^l_{0hw})\\|_2^2 \\)，其中 \\(\\hat{y}^l\\) 是第 l 层按通道归一化的特征，\\(w_l\\) 是用人类二选一判断数据校准出的通道权重。因此 LPIPS 对模糊特别敏感，排序通常更接近人眼。另有两个常用指标：FLIP 专为渲染图设计，模拟人在两张图之间来回切换时看到的差异，输出误差热图；VMAF 用在主观打分上训练的回归器，把 VIF、细节损失、运动量等传统特征融合起来，是视频编码业界的常用指标。\n\n时间指标回答另一个问题：误差是否在时间上稳定。最直接的是光流 warping error：用光流把第 t+1 帧拉回第 t 帧，在非遮挡区域比较输出的差异；静止场景下它就是相邻帧差。tOF（TecoGAN）比较输出视频和真值视频各自估计出的光流之差，tLP 比较两者相邻帧 LPIPS 之差。TCC 把“输出的帧差图”与“真值的帧差图”做 SSIM：真值在变的地方输出也该变，真值不变的地方输出也不该变；它来自 Zhang et al. 2019 的视频深度估计论文（ICCV），Ha 改成了彩色版。STED 即 ST-RRED（Soundararajan & Bovik）：在小波域比较参考视频与测试视频（及其帧差）的局部熵，把空间项和时间项相乘。SDT/SDV 是 L1 误差在帧间/视角间的标准差，Ha 沿用了 Long et al. 2021（CVPR，多视角深度估计）的做法。FVD 是生成模型常用的分布级指标（I3D 特征上的 Fréchet 距离），不需要逐像素真值，但也不检查与某个具体真值是否一致。\n\n视角一致性可以用 EPI（极平面图像）直观检查。让相机沿水平方向平移 v，渲染一串新视角；固定一行 y，把各视角的这一行按 v 堆起来，就得到 x–v 图。深度为 Z 的点在 x–v 图里是一条斜率为 \\(-f/Z\\) 的直线（见 g-depth），直线断裂或抖动就说明视角之间不一致。同理，固定视点、按时间堆叠一行像素，得到 x–t 切片：静止物体应是竖直直线，闪烁表现为横向的噪点。Ha 的 Fig. 5（EPI）和 Fig. 6（x–t）就是这样画出来的。\n\n读实验表时还要核对口径：分辨率（LPIPS 随分辨率变化很大）、评测了哪些帧（隔帧采样就算不了时间指标）、测试数据与训练数据是否同域、LPIPS 用的是哪种骨干网络、运行时间包含哪些阶段。指标只是有偏的测量工具，最终仍需要主观评测或用户研究。Starline 就做了 117 人参与、历时 9 个月、共 308 次会议的部署研究，外加 N=25 的对照实验。", "analogy_zh": "指标像体检报告。PSNR 像体重秤：客观、便宜，但体重正常不等于健康。SSIM 像体脂和体型测量。LPIPS 像一位经验丰富的医生看一眼你的气色。时间指标则像心电图：测一次看不出心律不齐，必须看随时间变化的节律。一个人可以每项静态指标都优秀却心律不齐，就像一段视频逐帧 PSNR 很高，却一直在闪。", "equations": [{"tex": "\\mathrm{PSNR} = 10\\log_{10}\\frac{\\mathrm{MAX}^2}{\\mathrm{MSE}},\\qquad \\mathrm{MSE} = \\frac{1}{N}\\sum_{i=1}^{N}\\big(\\hat{I}(i) - I(i)\\big)^2", "explain_zh": "\\hat{I} 是渲染图，I 是真值图，N 是像素（乘通道）数，MAX 是像素最大值（归一化到 [0,1] 时为 1，8-bit 时为 255）。单位是 dB，越高越好。每提高约 3 dB，MSE 约减半；提高 10 dB，MSE 降到 1/10。视频通常逐帧计算 PSNR 后取平均，这与先平均 MSE 再取对数并不相等。"}, {"tex": "\\mathrm{SSIM}(x,y) = \\frac{(2\\mu_x\\mu_y + C_1)(2\\sigma_{xy} + C_2)}{(\\mu_x^2 + \\mu_y^2 + C_1)(\\sigma_x^2 + \\sigma_y^2 + C_2)}", "explain_zh": "x、y 是两张图同一位置的局部窗口（常用 σ=1.5 的 11×11 高斯窗）。μ 是窗口均值，σ² 是方差，σ_xy 是协方差。C_1=(K_1L)²、C_2=(K_2L)² 是防止分母为零的稳定常数，默认 K_1=0.01、K_2=0.03，L 是动态范围；L=1 时 C_1=10⁻⁴、C_2=9×10⁻⁴。第一个因子比较亮度，第二个因子比较对比度与结构；对所有窗口取平均得到整图 SSIM，上限为 1。当两个窗口的均值和起伏都远小于 √C_1=0.01、√C_2=0.03 时，SSIM 接近 1，这一点决定了 TCC 对小幅闪烁的灵敏度。Ha 的训练损失 Eq. (7) 含 0.2·L_SSIM，TCC 也建立在 SSIM 之上。"}, {"tex": "\\mathrm{TCC} = \\frac{1}{T-1}\\sum_{t=1}^{T-1}\\mathrm{SSIM}\\big(|\\mathcal{I}^{t} - \\mathcal{I}^{t+1}|,\\ |I^{t} - I^{t+1}|\\big)", "explain_zh": "Ha et al. Eq. (8)。𝓘^t 是第 t 帧渲染结果，I^t 是同一视点的真值，T 是帧数。它比较渲染视频的帧差图与真值视频的帧差图的结构相似度。两种错误都会拉低 TCC：真值在变而渲染不变（过度平滑、拖影），或真值不变而渲染在变（闪烁）。越高越好，上限为 1。"}, {"tex": "E_{\\text{warp}} = \\frac{1}{T-1}\\sum_{t=1}^{T-1}\\frac{1}{\\sum_{i} M_t^{(i)}}\\sum_{i=1}^{N} M_t^{(i)}\\,\\big\\| V_t^{(i)} - \\hat{V}_{t+1}^{(i)} \\big\\|_2^2", "explain_zh": "Lai et al. 2018 Eq. (5)–(6)。V_t 是输出视频第 t 帧；\\hat{V}_{t+1} 是用光流把第 t+1 帧 warp 到第 t 帧的结果；M_t^{(i)}∈{0,1} 是像素 i 的非遮挡掩码；N 是像素数；‖·‖²₂ 对像素的 RGB 三个分量求平方和。它衡量“按运动对齐后，相邻两帧还差多少”，越低越好。注意两点：它只奖励稳定，不检查与真值是否一致，一段全黑视频的 E_warp 为 0，因此必须与 PSNR/LPIPS 一起报告；数值还取决于光流是从哪段视频（输出本身还是输入/真值）估计的，报告时要写清楚。"}], "worked_example_zh": "(1) 把 dB 换成直觉。Ha 在 DyNeRF 上 PSNR 为 31.17，ENeRF 为 29.51。取 MAX=1，对应 MSE 分别约为 10^{−3.117}≈7.64×10⁻⁴ 和 10^{−2.951}≈1.12×10⁻³，RMSE 约 0.0276 和 0.0335，即 8-bit 下平均误差约 7.0 和 8.5 个灰阶。1.66 dB 的差距对应 MSE 降低约 32%。（因为表中是逐帧 PSNR 的平均，这样反推 MSE 只是近似。）\n(2) PSNR 相同，观感截然不同。静止场景下，视频 A 每帧都比真值整体亮 0.02；视频 B 奇数帧亮 0.02、偶数帧暗 0.02。两者每帧的 MSE 都是 0.02²=4×10⁻⁴，PSNR 都是 33.98 dB。但 A 完全稳定，B 在 30 fps 下以 15 Hz 闪烁。时间指标马上能区分两者。静止场景光流为零、没有遮挡：A 的 E_warp=0；B 的相邻帧每通道差 0.04，按 Eq. (5) 对 RGB 求平方和，E_warp=3×0.04²=0.0048（若实现里按通道平均，则为 0.0016）。TCC 中，真值帧差图全为 0：A 的帧差图也全为 0，SSIM=1；B 的帧差图恒为 0.04，亮度项为 (0+C_1)/(0.04²+C_1)=10⁻⁴/1.7×10⁻³≈0.059（两者方差都为 0，对比度—结构项等于 1），所以 TCC≈0.06。\n(3) TCC 对小幅闪烁不灵敏。把 B 的闪烁幅度降到 ±0.005（帧差 0.01，约 2.5 个 8-bit 灰阶），亮度项变为 10⁻⁴/(10⁻⁴+10⁻⁴)=0.5；降到 ±0.002（帧差 0.004，约 1 个灰阶），亮度项约 0.86。帧差低于 √C_1=0.01 的闪烁，TCC 基本“看不见”。这解释了为什么各方法之间的 TCC 差距很小（DyNeRF 上 0.872 对 ENeRF 的 0.867），STED 差距却很大（68.76 对 76.14）。\n(4) 读 Ha 的消融 Table 3。把 No TSDF Guidance 这一行与完整模型比较，加入 TSDF 引导后 PSNR 从 31.16 到 31.17，只差 0.01 dB；LPIPS 从 0.197 到 0.191，TCC 从 0.869 到 0.872；STED 却从 95.42 降到 68.76，下降 28%。可见该模块几乎不改变单帧误差的大小，只改变误差的时间结构，正是 (2) 中 A 与 B 的区别。\n(5) 分辨率与协议口径。Quark 在 N3DV 上从 1024×768 升到 2048×1536，PSNR 只从 31.57 降到 31.46，LPIPS 却从 0.127 升到 0.187；Shiny 上 LPIPS 从 0.108 升到 0.174。跨分辨率比较 LPIPS 没有意义。另外，N3DV（Neural 3D Video）和 Ha 所说的 DyNeRF 是同一个数据集，但 Quark 的 31.57 是在 1024×768、以 0 号相机为目标、300 帧中每 10 帧评一帧、M=8 路输入下得到的；Ha 的 31.17 是在 1352×1014、Sear Steak 和 Flame Steak 两个场景、9 个测试视角、前 100 帧、K=4 路输入下得到的。两个数字不能直接比。", "pitfalls_zh": ["只看 PSNR/SSIM/LPIPS 就宣称“视频质量更好”。这三个指标逐帧计算，对闪烁完全不敏感，Quark 在 Sec. 4.1 自己也承认；N3DV 的评测协议是每 10 帧评一帧，根本算不了时间指标。", "时间指标可以被“作弊”，灵敏度也各不相同。E_warp、SDT 只奖励稳定，过度平滑甚至静止不动的输出也能拿高分，所以必须与保真度指标一起看；TCC 这类与真值帧差比较的指标更不容易被骗，但受 SSIM 稳定常数影响，对 1–2 个灰阶的小幅闪烁几乎不敏感。另外，SDV 衡量的是误差在视角间的离散程度，所有视角误差都大但大得一样时，SDV 也会很小。", "口径不一致。LPIPS 用 AlexNet 和用 VGG 骨干的数值不可比，而且强烈依赖分辨率。同名数据集的协议也可能完全不同：Quark 的 N3DV 与 Ha 的 DyNeRF 是同一数据，但测试场景、视角、帧和分辨率都不同。Ha 在 ENeRF-Outdoor 上因同步与颜色标定问题，把指标降到 480×270 计算，这会掩盖错位。Quark 在 DL3DV 上的基线数字直接取自原论文，分辨率更低。训练时用了 LPIPS 损失（Quark 的 10·L1+LPIPS），再用 LPIPS 评测，结果会偏向自己。", "运行时间也是指标，必须说明包含什么。Quark Table 1 的 TIME 包含重建加渲染，不含采集和解码。Ha 的 Table 4 不含 RAFT-Stereo 深度、差分掩码和磁盘读取，而且正文写的“约 100 ms”与表中各阶段之和（约 39 ms 或 81 ms）对不上。"], "in_quark": {"used": true, "where": "Sec. 3.4（训练损失）；Sec. 4.1 Tables 1–3 及末段；Sec. 4.2 Table 4 消融", "how_zh": "Quark 用 10·L1+LPIPS（Zhang et al. 2018）训练，评测全部用 PSNR/SSIM/LPIPS 加运行时间，Table 1 的 TIME 包含重建和渲染。例如 1024×768 下 N3DV 为 31.57/0.942/0.127、32.2 ms；与逐场景优化方法比较时，DL3DV 为 31.31/0.932/0.103（Table 2，基线数值取自 DL3DV 论文，分辨率更低）。消融（Table 4）在 DL3DV 1080p 上完成，作者提醒差异集中在物体边界的少量像素上，所以分数差异小，但肉眼可见。动态数据只用了 N3DV：按 Li et al. 的协议裁到 300 帧、每 10 帧评一次、以 0 号相机为目标，因此不可能计算任何时间指标；Sec. 4.1 末段也明确写道，表中指标都不衡量时间闪烁。懂得本概念，才能正确划定“Quark 单帧最强”这一结论的适用范围。还要注意：2K 下 LPIPS 明显变差（RFF 从 0.137 到 0.233），运行时间却几乎不变（32.2 到 33.0 ms），说明高分辨率主要来自 IBR 取样，而不是几何分辨率提高。"}, "in_ha": {"used": true, "where": "Sec. 4.3 Eq. (8)；Sec. 4.4 Table 1、Table 2；Sec. 4.5 Table 3；Fig. 5（EPI）、Fig. 6（x–t 切片）；A.6–A.7", "how_zh": "Ha et al. 同时报告两类指标。保真度（Table 2）用 PSNR、SSIM、LPIPS、L1，DyNeRF 上为 31.17/0.936/0.191/5.09。一致性（Table 1）有四项：TCC（Eq. 8，把 Zhang et al. ICCV 2019 的 TCC 改成彩色版的帧差 SSIM）；STED（Soundararajan & Bovik 在 IEEE TCSVT 23(4) 提出的时空熵差，越低越好）；SDT 与 SDV（沿用 Long et al. CVPR 2021，即 L1 误差在帧间/视角间的标准差）。DyNeRF 上 TCC 0.872、STED 68.76、SDT 0.139、SDV 1.748，ENeRF 为 0.867/76.14/0.147/2.710。定性上，用 EPI（相机水平平移、固定一行的 x–v 切片）展示视角一致性，用固定视点的 x–t 切片展示闪烁。所有指标都只在前 100 帧、固定的留出阵列相机上计算（A.7）；ENeRF-Outdoor 因同步和颜色标定问题，在 480×270 上计算（Sec. 4.2、A.6）。需要注意：时间指标只在固定视点上算，视角指标只在固定时刻上算，“头动加场景动”的组合没有被评测；论文也没有用基于光流的 warping error、tOF，没有做用户研究。"}, "in_field_zh": "远程临场系统的评测远不止图像指标。编码与传输用 VMAF 和 BD-rate（同等质量下的码率节省）衡量；生成式补洞和扩散类 NVS 常用 FVD、FID 等分布指标（见 a-diffusion-3d）；实时渲染用 FLIP 查看误差热图；系统层面要报告帧率、端到端延迟及其抖动、显存和带宽；双目显示还要检查左右眼是否一致。最终仍要回到人：Starline 让 117 名员工在 9 个月里开了 308 次会议做部署研究，并做了 N=25 的对照实验，评估在场感、注意力、会议内容回忆和非语言行为。为自己的方法设计评测时，至少要同时报告一种保真度指标、一种与真值比较的时间指标，并附一段 x–t 切片或 EPI 可视化。", "resources": [{"title": "Image Quality Assessment: From Error Visibility to Structural Similarity (Wang et al., IEEE TIP 2004)", "url": "https://www.cns.nyu.edu/pub/eero/wang03-reprint.pdf", "type": "paper", "note_zh": "SSIM 原始论文。Sec. III-B“The SSIM Index”推导亮度、对比度、结构三项，Sec. III-C 给出 11×11 高斯窗（σ=1.5）和 K_1=0.01、K_2=0.03 的取法。"}, {"title": "The Unreasonable Effectiveness of Deep Features as a Perceptual Metric (LPIPS, Zhang et al., CVPR 2018)", "url": "https://arxiv.org/abs/1801.03924", "type": "paper", "note_zh": "LPIPS 原始论文。Quark 的训练损失和两篇论文的评测都用到它；要搞清楚它的线性校准层和 2AFC 人类判断数据集是怎么来的。"}, {"title": "Learning Temporal Coherence via Self-Supervision for GAN-based Video Generation (TecoGAN, Chu et al., ACM TOG 2020)", "url": "https://arxiv.org/abs/1811.09393", "type": "paper", "note_zh": "Sec. 5 的 Eq. (2) 定义了 tOF 和 tLP 两个时间指标，并讨论了为什么基于 warp 后像素差的传统时间指标（T-diff）会被很模糊的结果骗过。"}, {"title": "On the Robust Performance of the ST-RRED Video Quality Predictor (LIVE, UT Austin)", "url": "https://live.ece.utexas.edu/research/Quality/ST-RRED/", "type": "code", "note_zh": "Ha 所用 STED（时空熵差）的原作者实验室页面，介绍 ST-RRED 的背景并提供代码下载链接，可以用来复现 Table 1 的 STED 列。"}], "self_check": [{"q_zh": "Ha 的 Table 3 中，去掉 TSDF 引导后 PSNR 只差 0.01 dB。为什么不能据此说这个模块没用？", "a_zh": "PSNR 是逐帧误差的平均，只衡量误差大小；该模块改变的是误差在时间上的结构，STED 从 95.42 降到 68.76。这就像恒定偏移与 ±0.02 交替偏移，PSNR 完全相同，但一个稳定一个闪烁。不过 TCC 只从 0.869 升到 0.872：SSIM 的稳定常数让 TCC 对小幅闪烁不敏感，不同时间指标的灵敏度差别很大，最好再配合视频或 x–t 切片判断。"}, {"q_zh": "一段完全冻结的输出视频（永远显示第一帧），在 E_warp、TCC、PSNR 上分别会得到什么结果？", "a_zh": "E_warp 取决于光流从哪来：若光流从输出本身估计，冻结视频的光流为零，E_warp=0，看上去“最稳定”；若用输入或真值视频的光流去 warp，冻结帧会被按真实运动错位，E_warp 反而不为零。TCC 在静止区域的窗口里接近 1，在运动区域的窗口里很低（真值帧差不为零、输出帧差为零），整体随运动区域所占比例下降。场景在动时，PSNR 会随时间下降。结论：只奖励稳定的指标可以被作弊，而且必须写清楚计算约定，并与和真值相关的指标一起看。"}, {"q_zh": "在 EPI 中，一条直线的斜率代表什么？直线“断开”又说明什么？", "a_zh": "相机沿 x 方向平移 v 时，深度为 Z 的点在图像上的位置是 x(v)=x₀−f·v/Z，斜率为 −f/Z，绝对值与深度成反比，越近越陡。直线断开或跳变，说明该点在相邻视点间的渲染位置或颜色发生突变，即视角不一致；常见原因是输入视角集合切换或深度错误（Ha Fig. 5、Fig. 9）。"}], "prereqs": ["f-image", "d-flow"]}, {"id": "v-codec", "name_zh": "视频编码、传输与延迟预算", "name_en": "Video coding, transport & latency budgets", "tldr_zh": "远程临场要在约百毫秒内把多路彩色和深度视频送到对端并渲染出来。编码器（H.264/HEVC/AV1）靠帧内/帧间预测把码率降低一到两个数量级，但 GOP 结构、参考未来帧带来的重排序、I 帧突发，以及深度图的高位宽和锐利边缘，都会直接转化为延迟、带宽或几何误差，所以必须按“采集→编码→网络→解码→重建渲染→显示”逐项做预算。", "intuition_zh": "先看为什么必须压缩。一路 1080p、60 fps、8-bit YUV420 的原始视频约 1.49 Gbit/s；Starline 仅 4 路 1600×1200、60 Hz 的彩色流不压缩就约 5.5 Gbit/s，加上 3 路深度更多，压缩后 7 路合计只有 30–100 Mbit/s。主流编码器（H.264/AVC、H.265/HEVC、AV1）的骨架相同：把画面分块，块内用帧内预测，或参考已编码的帧做运动补偿预测，只编码残差。残差依次经过变换（DCT 类）、量化和熵编码；量化参数 QP 决定步长，在 H.264/HEVC 中 QP 每增加 6，步长翻倍。编码器用率失真优化 J=D+λR 逐块在画质损失和比特数之间做选择。HEVC 的设计目标是在同等主观质量下比 H.264 省约 50% 码率（Sullivan et al. 2012）。\n\n帧类型和 GOP 决定了延迟与码率的形状。I 帧只做帧内编码，可以独立解码，但体积大；P 帧参考过去的帧；传统 B 帧同时参考过去和未来，编码器必须等未来的参考帧采集到才能编码，解码端也要重排序：两个参考帧之间每插入一个连续 B 帧，至少多等一个帧间隔（60 fps 下约 16.7 ms），分层 GOP 会多出好几帧。严格地说，延迟来自“参考未来帧”，而不是 B 这个名字：HEVC 的 low-delay B 配置用只参考过去帧的 B slice，不引入重排序延迟。低延迟模式通常关掉参考未来帧的 B 帧（Starline 就是这样做的），并用周期性帧内刷新（intra refresh）把 I 帧的比特摊到多帧里，避免一个巨大的 I 帧在网络上形成突发，推高排队延迟。丢包或超时后需要重发 I 帧（Starline 超时后对全部 7 路流发 I 帧），画面会出现一次“刷新”。\n\n深度图不是普通视频。它是单通道，需要高位宽（毫米级精度），在物体边缘处有很陡的不连续。编码器的 DCT 和量化会在边缘产生振铃和模糊，反投影后就变成悬在前景与背景之间的飞点（见 i-warping、d-sensors）。常见对策有：用 10-bit 通道（Starline 把深度放在 HEVC 的 Y 通道，UV 置为 512）；按每条射线穿过工作体积的深度区间 [min, max] 做线性重映射（Starline 的做法；它指出因为捕获体积浅，不需要逆深度），或在深度范围大时采用逆深度映射以匹配误差特性；给深度更低的 QP（Starline 深度用 QP 14，彩色用 QP 22）；把 16-bit 深度打包进 8-bit 三通道（Pece et al. 2011）。3D-HEVC、MPEG MIV 等标准则把多视角加深度联合编码（见 a-compression）。\n\n实时媒体通常走 RTP/UDP。WebRTC 在其上加了拥塞控制、加密、抖动缓冲和重传/前向纠错；连 RTP 的到达抖动估计本身都是一个增益 1/16 的 EMA（RFC 3550 Sec. 6.4.1）。端到端延迟是流水线各段之和：采集（曝光和读出）→ 预处理和深度估计 → 编码 → 网络（光纤中传播约 5 µs/km，另加串行化和排队）→ 抖动缓冲 → 解码 → 重建和渲染 → 显示（等待刷新和扫描输出）。对话能容忍的端到端延迟约为 150–250 ms：ITU-T G.114 对通话建议单向时延尽量不超过约 150 ms，Starline 引用的上限是 250 ms。但“观看者头动到画面更新”的运动到光子延迟必须在本地做到几十毫秒以内（见 v-perception）。这就引出一个架构选择：要么在发送端或云端按观看者位姿渲染，再推送 2D 视频，带宽低，但头动响应要走一次网络往返；要么把多路彩色加深度或紧凑的 3D 表示推到接收端本地渲染，带宽高、接收端需要 GPU，但头动延迟只取决于本地。", "analogy_zh": "这条数据链像冷链快递。采集是装箱；编码是真空压缩，把重复的“空气”（帧间冗余）抽掉；GOP 是“整箱发货加后续补件单”；参考未来帧的 B 帧是“等下一批货到了一起发”，省空间但要等；网络传播是运输距离，决定最短时效；带宽是车厢大小；排队是高速拥堵；抖动缓冲是中转仓暂存；解码和渲染是拆箱组装；显示是送到门口后还要等主人开门（屏幕刷新）。总时效是每一环之和，一个超大包裹（I 帧）就能把整条线路堵住。深度图则像易碎的精密仪器，不能按普通货物那样狠压。", "equations": [{"tex": "R_{\\text{raw}} = W \\cdot H \\cdot b \\cdot f", "explain_zh": "原始码率。W×H 是分辨率；b 是每像素比特数，8-bit YUV420 为 12 bit/像素（亮度 8 bit，加上两路 1/4 分辨率的色度）；f 是帧率。例如 1920×1080×12×60≈1.49 Gbit/s，1600×1200×12×60≈1.38 Gbit/s。压缩比 = R_raw / 实际码率。"}, {"tex": "J = D + \\lambda R,\\qquad Q_{\\text{step}} \\approx 2^{(QP-4)/6}", "explain_zh": "编码器对每个块在候选模式（帧内/帧间、运动向量、分块方式）中选出拉格朗日代价 J 最小的一个。D 是失真（如 SSE），R 是该模式需要的比特数，λ 是随 QP 增大的拉格朗日乘子。H.264/HEVC 中量化步长 Q_step 随 QP 指数增长：QP 每加 6，步长翻倍；QP=4 时步长为 1（8-bit 尺度）。HEVC 对高位深扩展了负 QP 范围，同一 QP 在 8-bit 与 10-bit 下对应大致相同的“相对满量程”步长。按这个口径，Starline 深度用 QP=14、彩色用 QP=22，步长相差 2^{8/6}≈2.5 倍。"}, {"tex": "T_{\\text{e2e}} = T_{\\text{cap}} + T_{\\text{proc}} + T_{\\text{enc}} + \\underbrace{\\frac{d}{v} + \\frac{S}{B} + T_{\\text{queue}}}_{T_{\\text{net}}} + T_{\\text{jitter}} + T_{\\text{dec}} + T_{\\text{render}} + T_{\\text{disp}}", "explain_zh": "端到端延迟分解。各项依次是：采集（曝光加读出）、预处理（深度估计、分割等）、编码、网络、抖动缓冲、解码、重建与渲染、显示（等待刷新加扫描输出）。网络项中，d 是传输距离，v≈2×10⁸ m/s 是光在光纤中的速度（约 5 µs/km），S 是一帧的比特数，B 是链路带宽，T_queue 是排队时间。每一项都是随机变量，报告时应同时给出均值和方差，如 Starline 的 105.8±9.1 ms。"}, {"tex": "\\Delta z_{\\text{lin}} = \\frac{z_{\\max} - z_{\\min}}{2^{n}-1},\\qquad \\Delta z_{\\text{inv}} \\approx z^{2}\\,\\frac{1/z_{\\min} - 1/z_{\\max}}{2^{n}-1}", "explain_zh": "深度量化步长。n 是深度通道的位宽，[z_min, z_max] 是编码的深度范围。线性映射下步长处处相同；逆深度（视差）映射下步长随 z² 增长（对 1/z 求导即得），近处精细、远处粗糙，与立体深度误差随 z² 增长的特性相匹配（见 g-depth）。这里只算了量化步长；编码器在给定 QP 下的有损误差还要叠加在上面，且在边缘处最大。"}], "worked_example_zh": "(1) Starline 的码率（论文 Table 1）。共 4 路彩色（每个 pod 一台 1600×1200 相机，外加一路人脸特写）和 3 路深度，全部 60 Hz、HEVC、无 B 帧。穿纯色衬衫静坐时总计 28.0 Mbit/s：深度 7.7/7.9/8.1，彩色 1.4/0.9/1.1，特写 0.9。穿高频纹理衬衫大幅挥臂时达 102.3 Mbit/s。码率随运动和纹理成倍变化。静坐时深度流占了 23.7/28.0≈85% 的码率，一方面因为深度用了更细的 QP 14 和 10-bit，另一方面因为逐帧立体深度的噪声很难被帧间预测消掉；换成纹理衬衫时彩色份额明显上升（静坐时彩色合计 11.9 Mbit/s）。\n(2) 深度量化。Starline 的捕获体积深度约 0.9 m，并按每条射线的 [min, max] 区间线性映射，10-bit 步长不超过约 0.9/1023≈0.88 mm，远小于 Ha 的 TSDF 截断 τ=20 mm。如果把户外场景 0.5–10 m 的深度线性塞进 8 bit，步长≈9.5/255≈3.7 cm，已大于 τ，TSDF 会出现台阶。改用 8-bit 逆深度：z=1 m 处步长≈1²×(2−0.1)/255≈7.5 mm，z=5 m 处约 25×0.00745≈18.6 cm。\n(3) 一个 Quark 式接收端渲染的延迟预算。以下均为假设值，用于估算：60 Hz 采集 16.7 ms；编码 5 ms；1000 km 光纤传播 5 ms；平均一帧约 0.8 Mbit，在 100 Mbit/s 链路上串行化 8 ms；抖动缓冲 20 ms；解码 5 ms；Quark 单视角重建加渲染 32.2 ms（A100，1024×768，Table 1）；显示等待刷新平均 8.3 ms，扫描到屏幕中部约 8.3 ms。合计约 108 ms，与 Starline 回环实测的 105.8 ms 同一量级（但后者不含广域网）；若双目逐眼渲染，再加 32 ms，约 141 ms。如果某个 I 帧有 5 Mbit，在 100 Mbit/s 链路上仅串行化就要 50 ms，这就是低延迟编码要避免大 I 帧的原因。\n(4) 两种架构的带宽对比。接收端渲染时，要把 Quark 的 8 路全分辨率输入流（IBR 要取全分辨率像素）传过去；对 Ha 则要传全部 N 路彩色加深度，因为任意视点都可能用到任意 K 台相机，DyNeRF 阵列有 18–22 台。发送端渲染时，每个观看者只需一路双目 2D 视频，但头动到画面更新要走一次网络往返，接收端需要做基于深度的重投影来掩盖这段延迟（见 v-perception）。", "pitfalls_zh": ["把“网络推理 30 fps”当成“系统实时”。Quark 的 32.2 ms 和 Ha 的约 39 ms 都不含采集、深度估计（Ha 没有计入 RAFT-Stereo）、编解码、网络和显示。另外，30 fps 的吞吐不等于 33 ms 的延迟：流水线并行能提高吞吐，但不能降低延迟。", "低延迟编码是有代价的。关掉参考未来帧的 B 帧、限制 I 帧大小和缓冲，会让同等画质下的码率上升。码率还随纹理和运动剧烈变化（Starline 从 28 到 102 Mbit/s），带宽预算要按最坏情况留余量，或者做码率控制。", "直接用普通 8-bit 视频编码压深度。精度不足、色度下采样和边缘振铃会造成台阶和飞点；编码器的率失真是针对人眼看颜色优化的，并不关心几何误差。应该用 10-bit 或专门的打包方案，并在反投影后度量几何误差（Starline 附录 E 的 Figure 16 消融显示，10-bit H.265 深度对最终渲染影响不大）。", "多路流之间的编码差异本身也是一种跨相机不一致。各路的 QP 和 I 帧时刻不同，会让 IBR 混合在帧间和视角间跳变。对依赖颜色差分的方法（如 Ha 的掩码）来说，I 帧处量化噪声的突变还可能被误判为运动；这是推断，论文没有测试。"], "in_quark": {"used": false, "where": "全文未讨论（Fig. 1 只说输入可以是 video streams；Sec. 4.3 讨论曝光差与标定误差）", "how_zh": "Quark 假定 8 路已标定、已同步的全分辨率 RGB 已经在 GPU 上。Table 1 的 TIME 只含重建加渲染：1024×768 为 32.2 ms，2048×1536 为 33.0 ms。论文没有讨论压缩、传输、在哪一端渲染，也没有端到端延迟。与本概念相关的隐含约束有三点。其一，IBR 在最后一步用 blend weights 混合全分辨率输入像素，渲染端必须拿到全部 M=8 路全分辨率帧；若在接收端渲染，带宽约等于 8 路高清视频。其二，作者在 Sec. 4.3 说 blend weights 对输入间的曝光差、焦距差敏感，会产生边缘伪影和闪烁，各路编码失真不同属于同一类问题。其三，每个目标视点都要重跑网络，LDM 用完即丢，不适合作为传输的中间表示。有了本概念，才能把 Quark 的“1080p/30fps”放进一张真实的系统延迟与带宽预算表里。"}, "in_ha": {"used": false, "where": "全文未讨论（Sec. 4.5 Table 4 运行时间不含深度估计和磁盘读取）", "how_zh": "Ha et al. 同样没有任何压缩、传输或端到端延迟分析。Table 4 的 10 ms（splat）+6 ms（TSDF）+23 ms（TensorRT 融合网络）不含 RAFT-Stereo 深度、差分掩码和磁盘读取。在系统层面，它比 Quark 多需要一路深度：每个目标视点要 K 路 RGB 加 K 路深度，任意视点则需要全部 N 路（DyNeRF 为 18–22 台）。如果深度在发送端估计后编码传输，量化精度必须远小于 TSDF 截断 τ=0.02 m：10-bit 在 1 m 范围内约 1 mm 步长就足够，8-bit 在 10 m 户外范围约 3.7 cm 就不够了。边缘处的编码振铃会变成论文 Sec. 3.1 所说的 flying pixels。此外，Eq. (1) 的颜色差分掩码作用在解码后的图像上，编码噪声和 I 帧刷新都会改变 |I_t−I_{t−1}|，这种交互论文没有考虑。"}, "in_field_zh": "这是 a-telepresence-sys 和 a-compression 的核心内容。Starline 选择传输多路彩色加深度视频，在接收端按双眼位置融合渲染，理由是在这样高的分辨率和帧率下，还无法对纹理网格、点云或占据体做利用时间相关性的实时压缩。它使用 GPU 硬件编码器 NVENC/NVDEC 和 HEVC，不用 B 帧，用 WebRTC 打包 7 路视频流和人脸特征点；音频用 Opus，256 kbit/s。后续工作在探索更紧凑的传输方式：Tele360 用视频编码器推流 Gaussian maps；GS-SCNet 把多视角编码与 feed-forward 3DGS 联合，相对 MV-HEVC+GPS-Gaussian 约省 75% BD-rate；D-FCGS 对动态高斯做前馈压缩。标准方面有 MPEG 的 MIV（沉浸式视频）和 V-PCC/G-PCC（点云）。做算法研究至少要清楚两件事：自己方法的输入能否被现有编码器高效压缩，输出是否需要为每个观看者单独渲染。", "resources": [{"title": "Project Starline: A High-Fidelity Telepresence System (Lawrence et al., ACM TOG 40(6), 2021)", "url": "https://hhoppe.com/starline.pdf", "type": "paper", "note_zh": "本概念的系统标杆。Sec. 4.5 讲 7 路 HEVC 流的编码设置（无 B 帧、10-bit 深度、逐射线线性映射、QP、Table 1 码率），Sec. 5.5 讲端到端延迟 105.8 ms 的测法，Sec. 4.4 讲约 33 ms 的跟踪延迟与外推。"}, {"title": "Overview of the High Efficiency Video Coding (HEVC) Standard (Sullivan, Ohm, Han, Wiegand, IEEE TCSVT 2012)", "url": "https://www.microsoft.com/en-us/research/publication/overview-of-the-high-efficiency-video-coding-hevc-standard/", "type": "paper", "note_zh": "HEVC 编码器结构的权威综述，涵盖块划分、帧内/帧间预测、变换量化、环路滤波和并行工具，是理解 QP、GOP 和低延迟配置的基础读物。页面上有多个 PDF 下载链接。"}, {"title": "RFC 3550: RTP: A Transport Protocol for Real-Time Applications", "url": "https://www.rfc-editor.org/rfc/rfc3550.html", "type": "tutorial", "note_zh": "实时媒体传输的基础协议。重点读 Sec. 5.1（RTP 头部与时间戳）和 Sec. 6.4.1 的到达抖动估计：它就是增益 1/16 的 EMA，附录 A.8 给出了实现。"}, {"title": "Adapting Standard Video Codecs for Depth Streaming (Pece, Kautz, Weyrich, EGVE/JVRC 2011)", "url": "https://diglib.eg.org/handle/10.2312/EGVE.JVRC11.059-066", "type": "paper", "note_zh": "经典的深度视频编码论文：把单通道高位宽深度编码成标准 8-bit 三通道视频，再用 VP8/H.264 传输，并分析为什么简单做法会严重失真。"}], "self_check": [{"q_zh": "为什么低延迟通话编码通常关掉 B 帧？60 fps 下会多出多少延迟？", "a_zh": "传统 B 帧要参考未来帧，编码器必须等后面的参考帧采集完才能编码，解码端也要重排序。两个参考帧之间每插入一个连续 B 帧，至少增加一个帧间隔，即 1/60≈16.7 ms；分层 GOP 会多出好几帧。Starline 明确省去 B 帧来降低编解码延迟。注意 HEVC 的 low-delay B 配置只参考过去帧，没有这部分延迟。"}, {"q_zh": "把 0.5–10 m 的深度线性量化到 8 bit，步长多大？对 Ha 的 TSDF（τ=0.02 m）有什么影响？改用 10-bit 或逆深度映射各能改善多少？", "a_zh": "8-bit 线性步长为 9.5/255≈3.7 cm，大于 τ：表面会出现台阶，截断带内的信息被量化误差淹没。10-bit 线性步长为 9.5/1023≈9.3 mm。8-bit 逆深度在 1 m 处约 7.5 mm、5 m 处约 19 cm；10-bit 逆深度在 1 m 处约 1.9 mm。实际还要叠加编码器 QP 带来的有损误差，边缘处最严重。"}, {"q_zh": "Starline 实测的 105.8 ms 包含什么、不包含什么？为什么“在 250 ms 以内”并不代表对头部运动的响应足够快？", "a_zh": "它是回环模式下从 LED 由灭变亮到画面出现在显示器上的时间，包含采集、深度、编码、完整的 WebRTC 栈、解码、融合渲染和显示；但两个网络端点在同一台 PC 上，不含真实广域网的传播和排队。250 ms 是对话同步感的上限。观看者自己头动到画面更新是另一条本地链路，必须快得多；Starline 的跟踪延迟约 33 ms，靠外推来补偿。"}], "prereqs": ["f-image"]}, {"id": "v-perception", "name_zh": "立体视觉感知与 3D 显示", "name_en": "Stereo perception & 3D displays", "tldr_zh": "人靠双眼视差、辐辏、调节和运动视差感知深度。3D 显示（头显、头部跟踪裸眼屏、光场屏）必须为每只眼睛或每个视点各渲染一幅图，并在几十毫秒内跟上头部运动，否则会出现重影、辐辏-调节冲突带来的不适和画面拖动。这些约束意味着，逐视角渲染的 Quark 和 Ha 一旦接上 3D 显示，成本要翻倍，甚至翻几十倍。", "intuition_zh": "先看双眼视差。两眼相距约 6.3 cm（瞳距，IPD），同一个点在左右视网膜上的位置不同，大脑把两幅略有差异的图融合成一个有深度的像，这就是立体视觉。落到屏幕上，它对应左右眼图像中同一点的水平位移，即屏幕视差 p：点在屏幕平面上时 p=0，在屏后为正（非交叉视差），在屏前为负（交叉视差）。这与立体匹配中的视差 d=f·b/Z 是同一套几何（见 g-depth），只是相机换成了眼睛。视差太大时两眼图像融合失败，出现重影（复视）。如果左右眼图像不一致，比如只有一只眼有伪影，或两眼的闪烁不同步，就会引起双眼竞争，比单眼伪影更扎眼，也更容易疲劳。\n\n再看辐辏-调节冲突（VAC）。看真实物体时，两眼的会聚角（辐辏）和晶状体的对焦距离（调节）指向同一个距离，两者在神经上是耦合的。在普通 3D 显示上，辐辏被视差驱动，指向虚拟物体；但所有光都来自一个固定的焦面（屏幕或头显的虚像面），调节只能对准这个焦面。两者的不一致常用屈光度（1/米）来衡量。Hoffman et al. 2008 的实验表明，这种冲突会降低立体视觉表现，并引起视觉疲劳。实践中的对策是把注意焦点放在显示平面附近：Starline 就把远端用户的脸放在屏幕平面附近，同时减小 VAC、串扰和跟踪延迟的影响。\n\n然后是运动到光子延迟（motion-to-photon）。观看者转头或平移时，画面必须立即按新视点更新，否则静止的虚拟物体会“跟着头走”，破坏稳定感并诱发晕动。画面错位的像素数约等于像素密度 × 角速度 × 延迟（LaValle《Virtual Reality》7.4 节）。据 LaValle，现代头显的延迟约 15–25 ms，再靠姿态预测把有效延迟压到接近零，最后用“渲染后图像 warp”兜底。ATW 只按最新的头部旋转对已渲染的图像做单应变换，对绕眼睛光心的纯旋转是精确的；但人转头时绕颈部转动，眼睛也会平移几厘米，这部分以及真正的位置移动需要逐像素深度（positional timewarp），而且会暴露原来被遮挡的区域，留下空洞（见 i-warping）。ASW 则在应用只能以半帧率渲染时，用前面两帧估计画面运动并外推出中间帧，能覆盖场景动画和位置移动，但在去遮挡处会拉伸。裸眼 3D 屏同样受延迟约束：它要按跟踪到的眼睛位置，把左右图分别“投”向两只眼，眼睛位置滞后会造成左右串扰，甚至立体反转。\n\n最后，3D 显示的类型决定了要渲染多少个视点。头显每只眼一幅，刷新率常见 72–120 Hz，高于常规视频。头部/眼睛跟踪的裸眼 3D 屏（Starline、Tele-Aloha）用柱镜阵列把不同像素送往左右眼，只需渲染跟踪到的两个视点，但依赖低延迟的眼睛跟踪。多视点光场屏不跟踪观看者，要同时显示几十个视点，每个视点都要渲染。还要区分两种“闪烁”：显示器刷新造成的亮度闪烁，只要刷新率高于临界闪烁融合频率就察觉不到；前面讲的“内容闪烁”（时间不一致）是另一回事。人眼对两者都在大面积、低空间频率的区域最敏感。", "analogy_zh": "立体显示像给两只眼睛各讲一个略有不同的故事，让大脑自己拼出 3D。两个故事的细节必须严丝合缝，否则“串供”会被识破，出现重影和不适。辐辏-调节冲突像让你盯着 1 米外的手指，却要求把焦点对在 1.25 米外的墙上。运动到光子延迟像在晃动的船舱里看一幅画：画面如果不能随你的头同步反向移动，整个世界就会“飘”起来。", "equations": [{"tex": "p = I_{\\text{pd}}\\,\\frac{Z - D}{Z}", "explain_zh": "屏幕视差，即左右眼图像中同一点的水平间距（由相似三角形得到）。I_pd 是瞳距（约 0.063 m），D 是眼睛到屏幕（或头显虚像面）的距离，Z 是希望观看者感知到的点的距离。Z=D 时 p=0，点在屏幕上；Z>D 时 p>0，Z→∞ 时 p→I_pd（非交叉视差，屏后）；Z<D 时 p<0（交叉视差，屏前）。它与 g-depth 中的 d=f·b/Z 同源：眼睛就是一台基线为 I_pd 的双目相机。"}, {"tex": "\\Delta_{\\text{VA}} = \\left|\\frac{1}{Z_{\\text{v}}} - \\frac{1}{Z_{\\text{a}}}\\right|", "explain_zh": "辐辏-调节冲突的大小，单位是屈光度 D（1/米）。Z_v 是视差驱动的辐辏距离（虚拟物体的距离），Z_a 是调节距离（屏幕或头显焦面的距离）。之所以用屈光度而不用米，是因为人眼的景深和对焦误差在屈光度尺度上近似均匀，这与逆深度采样（Quark 按等视差放置各层）是同一个道理。"}, {"tex": "\\Delta x = d\\,\\omega\\,\\ell", "explain_zh": "LaValle《Virtual Reality》7.4 节给出的延迟误差估计。d 是显示器的像素密度（像素/度），ω 是头部角速度（度/秒），ℓ 是运动到光子延迟（秒），Δx 是画面错位的像素数。它说明延迟的代价随显示分辨率和头动速度线性增长。"}, {"tex": "\\mathbf{x}' \\simeq K R_{\\Delta} K^{-1}\\mathbf{x},\\qquad \\mathbf{x}' \\simeq K\\big(R_{\\Delta}\\, z(\\mathbf{x})\\, K^{-1}\\mathbf{x} + \\mathbf{t}_{\\Delta}\\big)", "explain_zh": "渲染后重投影（timewarp）。x 是已渲染图像的齐次像素坐标，K 是内参，R_Δ、t_Δ 是从渲染时刻到显示时刻、以渲染相机为参考的旋转与平移增量，z(x) 是像素深度，≃ 表示齐次意义下相等。纯旋转时，映射是与深度无关的单应（ATW），结果精确；有平移时必须用逐像素深度（positional timewarp），而且会暴露原图中被遮挡的区域，出现空洞。这与 Ha 的前向 splatting、i-warping 面对的是同一个问题。"}], "worked_example_zh": "(1) Starline 的几何。观看距离 D=1.25 m，瞳距取 63 mm（Starline 的柱镜正是按 1.25 m 处 63 mm IPD 设计的）。远端人脸放在屏幕平面上：Z=1.25 m，p=0，Δ_VA=0。远端的人把手伸到 Z=0.95 m：p=63×(0.95−1.25)/0.95≈−19.9 mm（交叉视差），Δ_VA=|1/0.95−1/1.25|≈0.25 D。远端身后的墙在 Z=2.5 m：p=63×1.25/2.5=31.5 mm，Δ_VA=|0.4−0.8|=0.4 D。内容离显示平面越远，视差和冲突越大，这就是 Starline 把人脸放在屏幕平面附近的原因。\n(2) 延迟的像素代价。取头显约 20 像素/度（Starline 论文称多数常见 VR 头显低于 20 像素/度），头部以 50°/s 转动。延迟 ℓ=50 ms 时，Δx=20×50×0.05=50 像素；把 ℓ 压到 20 ms，是 20 像素。裸眼屏的情形：头部以 0.3 m/s 横向移动，跟踪延迟 33 ms，眼睛位置就滞后约 0.3×0.033≈1 cm，约为瞳距的 16%，足以引起左右串扰。因此 Starline 对跟踪点做外推，再用双指数平滑去抖。\n(3) 渲染成本。Quark 单视角 32.2 ms（A100，1024×768）。90 Hz 双目头显每帧预算 11.1 ms，要出两只眼，两次推理约 64.4 ms，需要约 5.8 倍加速；即使借助 ASW 以 45 Hz 渲染（预算 22.2 ms），也还需要约 2.9 倍。Ha 与目标视点相关的阶段每只眼约 39 ms（10+6+23，TensorRT），输入端的深度滤波（Eq. 1–2）可以两眼共享，所以两眼约 78 ms，约 12.8 fps。若换成多视点光场屏，假设需要 N=45 个视点（仅为示例值），Quark 约 45×32.2 ms≈1.45 s/帧，完全不可行，必须改用“一次重建、多次渲染”的持久表示（3DGS、持久 LDM 或网格）。相比之下，Starline 的头部跟踪裸眼屏只需 60 Hz 下的两个视点，每帧 16.6 ms 预算中基于图像的融合（含 4 张阴影图和两只眼的射线投射）只占 1.5 ms。", "pitfalls_zh": ["把单目指标当成立体质量。左右眼分别渲染时，两眼的伪影、闪烁以及所选的 K 近邻相机都可能不同（Ha 的目标视角 TSDF 对两只眼各算一次，最近 K 台相机可能不一样），从而引起双眼竞争。需要显式评测或约束左右一致性。", "以为更好的渲染能解决辐辏-调节冲突。VAC 由显示器的光学结构决定，渲染只能靠内容布局（把关注对象放在焦面附近）和限制视差预算来缓解；真正解决要靠变焦、多焦面、光场或全息显示。", "只看平均延迟，或以为 timewarp 能兜住一切。可变延迟比固定延迟更难适应（LaValle 7.4）；ATW 只对绕光心的纯旋转精确，转头时眼睛的平移和真正的位置移动都需要深度，而且会暴露遮挡空洞；发送端渲染方案中，头动延迟包含一次网络往返，接收端必须做重投影。", "混淆两种“闪烁”。显示器刷新带来的亮度闪烁（与刷新率、占空比有关）和渲染内容的时间不一致（v-temporal）是两个不同的问题；两篇锚点论文讨论的都是后者。"], "in_quark": {"used": false, "where": "全文未讨论立体或多视点显示（Fig. 1 称可为 dynamic viewpoint 按需渲染；Sec. 2.1 称每个新视角都重新生成 LDM）", "how_zh": "Quark 每次推理只为一个目标视点生成 LDM 并渲染，论文没有提到双目、头显或 3D 显示，也没有测量运动到光子延迟。接到 3D 显示上，左右眼需要两次完整推理：1024×768 下约 2×32.2≈64 ms，即约 15 fps 双目；光场屏的成本则按视点数线性增长。两眼之间能共享的只有与目标视点无关的输入图像特征编码；射线方向编码依赖目标 LDM 的视锥，Update & Fuse 依赖目标视锥中的 LDM，每只眼都要单独做一次。Sec. 2.1 提到 LDM 的历史缺点是不能从所有方向观看，Quark 靠为每个视角重新生成来规避。这意味着可以考虑用一只眼的 LDM 为另一只眼（相距约 6.3 cm）做近距离重投影或 ATW 式补偿，但论文没有验证。此外，IBR blend weights 在标定误差下会产生“错误的硬边”（Sec. 4.3），如果这种伪影只出现在一只眼里，在双目观看中会比单目更显眼。"}, "in_ha": {"used": false, "where": "全文未讨论（Sec. 1 以 VR/AR 中的 immersive 3D video 为动机；Sec. 4.5 Table 4 为单视角运行时间）", "how_zh": "Ha et al. 的一作在 Meta Reality Labs 实习期间完成本文，引言以 VR/AR 中的沉浸式 3D 视频为动机，但没有头显或立体实验，没有双目一致性指标，也没有测运动到光子延迟。它的一致性定义有两条：单目视点移动时不跳变（EPI），固定视点时不闪烁（x–t 切片）。这两条都是双目舒适的必要条件，但并不充分。计算上，Eq. (1)–(2) 的输入端深度滤波（以及 RAFT-Stereo 深度本身）与目标视点无关，可以由两只眼和多个观看者共享；而 splat（10 ms）、TSDF（6 ms）、融合网络（23 ms，TensorRT）都要按每只眼重复一遍，双目合计约 78 ms。两只眼各自选最近的 K 台相机、各自 ray-march TSDF，K 集合不同就会导致两眼深度不一致；论文在 Sec. 3.2 也承认，K 集合变化会让 TSDF 深度出现小幅变化。"}, "in_field_zh": "显示端决定了整个系统的渲染预算和表示选择。Starline 用的是 65 英寸 8K、60 Hz 的头部跟踪柱镜裸眼 3D 屏，每只眼约分到 5M 像素、约 45 像素/度；它用 4 台 120 Hz 单色相机三角化眼睛、嘴和耳朵的位置，测得跟踪延迟约 33 ms 并用外推补偿，还把远端人脸放在屏幕平面附近，以减轻 VAC 和串扰。Tele-Aloha 同样采用裸眼 3D 屏和低延迟虹膜跟踪，报告的端到端延迟低于 150 ms。头显方案（如基于 3DGS 的 GaussianNexus）受 72–120 Hz 双目刷新、运动到光子延迟和 ATW/ASW 的约束，更适合“一次重建、多次渲染”的持久表示。眼神接触、空间音频（Starline 用跟踪到的耳朵位置做双耳渲染）也属于感知层面的系统需求。进阶内容见 a-telepresence-sys。", "resources": [{"title": "Virtual Reality (Steven M. LaValle, Cambridge University Press 2023, free online)", "url": "http://lavalle.pl/vr/", "type": "book", "note_zh": "免费开放的教材。对应读：5.4 节中的“Vergence-accommodation mismatch”；6.1.2 节“Stereo depth cues”；6.2.2 节“Stroboscopic apparent motion”及其中的帧率与闪烁讨论；7.4 节“Improving Latency and Frame Rates”（运动到光子延迟、预测、post-rendering image warp 及其缺陷）。注意 7.4 节的数值例子（d=40 像素/度、ω=50°/s、ℓ=0.02 s）写成 4 像素，按公式 dωℓ 应为 40 像素（300°/s 时应为 240 像素而非 24）。"}, {"title": "Vergence–accommodation conflicts hinder visual performance and cause visual fatigue (Hoffman, Girshick, Akeley, Banks, Journal of Vision 8(3):33, 2008)", "url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC2879326/", "type": "paper", "note_zh": "辐辏-调节冲突的经典实验论文（PMC 免费全文）。用多焦面显示对比焦点线索正确与错误两种条件，量化 VAC 对立体融合时间、立体视锐度、深度感知失真和视觉疲劳的影响。"}, {"title": "Stanford EE267: Virtual Reality (Gordon Wetzstein)", "url": "https://stanford.edu/class/ee267/", "type": "course", "note_zh": "课程主页的 Syllabus 列出各讲主题与阅读材料：Lecture 5 讲人类视觉系统（深度、颜色、对比度、分辨率感知），Lecture 6 讲 Stereo Rendering，Lecture 7 讲头显光学与头显中的立体渲染；Lab 3 是立体渲染与景深练习。"}, {"title": "Asynchronous Spacewarp (Oculus/Meta developer blog, 2016)", "url": "https://developers.meta.com/horizon/blog/asynchronous-spacewarp/", "type": "blog", "note_zh": "说明 ATW 擅长处理头部旋转，而 ASW 在应用以刷新率一半（如 45 fps 对 90 Hz）渲染时，用前两帧估计运动并外推出中间帧，覆盖场景动画和位置移动；并列举亮度快速变化、去遮挡拉伸、重复纹理误预测等伪影，指出渲染帧率低于刷新率一半时效果变差。"}], "self_check": [{"q_zh": "观看距离 1.25 m、瞳距 63 mm，要让一个点显示在屏幕后方 1.25 m 处（即 Z=2.5 m），屏幕视差是多少？VAC 是多少屈光度？", "a_zh": "p=63×(2.5−1.25)/2.5=31.5 mm（非交叉视差）；Δ_VA=|1/2.5−1/1.25|=0.4 D。"}, {"q_zh": "ATW 为什么能精确修正头部旋转，却修正不了平移？这与 Ha 的前向 splatting 有什么共同点？", "a_zh": "绕光心的纯旋转不改变光心位置，射线只是换了方向，像素映射 x'≃K R K⁻¹ x 与深度无关。平移会引入视差，每个像素的位移量取决于自身深度，还会暴露原图中被遮挡的区域（真实转头时眼睛也有小幅平移，所以 ATW 只是近似）。带深度的平移 warp 与 Ha 用深度把输入像素 splat 到目标视角本质上是同一件事，都要处理空洞和飞点；Ha 靠多视角融合和背景图 I_BG 来补洞。"}, {"q_zh": "用 Quark 驱动一台 90 Hz 双目头显还差多少？哪些计算可以在两眼间共享？", "a_zh": "90 Hz 下每帧 11.1 ms 要出两只眼的图像。Quark 单视角 32.2 ms（A100，1024×768），两只眼约 64.4 ms，需要约 5.8 倍加速；借助 ASW 以 45 Hz 渲染也还差约 2.9 倍。两眼间能共享的只有输入图像的特征编码；每只眼的 Update & Fuse 和 IBR 渲染都必须重复。可行的方向有：接收端用 ATW 或位置重投影补帧；用一只眼的 LDM 重投影出另一只眼（未经验证）；或改用一次重建、多次渲染的持久表示。"}], "prereqs": ["g-depth"]}]}], "rev": {"walkBy": {"g-pinhole": [{"anchor": "quark", "id": "q1", "title": "问题设定与输入：M=8 个最近视角，近/远平面由 SfM 点估计"}, {"anchor": "quark", "id": "q4", "title": "学习式初始化：可学习特征广播 + back-projection 到锚定平面"}, {"anchor": "quark", "id": "q5", "title": "Render：把当前 LDM 双线性 splat 到每个输入视角并 over 合成得到 Ĩ"}, {"anchor": "ha", "id": "h1", "title": "问题设定：固定、已标定、同步的相机阵列，K 个最近 RGB-D 视角，在线逐帧处理"}, {"anchor": "ha", "id": "h3", "title": "前向渲染：像素大小、各向同性、完全不透明的高斯，逐视角单独 splat，得到 𝓘_k、α_k、𝒟_k"}, {"anchor": "ha", "id": "h6", "title": "基于图像的 TSDF：沿目标射线采样，投影到 K 个视角，求 s_k = z_k − D_k"}, {"anchor": "ha", "id": "h10", "title": "几何引导混合网络的输入特征（9
