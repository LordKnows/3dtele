视差成反比（Z = f·b/d），所以固定的像素匹配误差会变成随 Z² 增长的深度误差。这就是分层表示和平面扫描按等视差（逆深度均匀）放层的原因；同时，任何带固定米制阈值的算法（如 Ha 的 τ = 0.02 m）都要求深度具有真实尺度。", "intuition_zh": "视差是同一个点在两台相机中的像素位置之差。近处的物体在两个视角里差得多，远处的几乎不差：Z = f·b/d，其中 f 是以像素计的焦距，b 是基线（两个相机中心的距离）。视差 d 与 1/Z 成正比，所以图像能直接测到的量是逆深度 1/Z，深度只是它的倒数。\n\n对 Z = f·b/d 求导，得到 |δZ| ≈ Z²/(f·b)·|δd|。匹配误差 δd 通常在亚像素量级，而且与距离关系不大，于是深度误差随 Z² 增长：距离加倍，误差变成 4 倍。想让远处也保持精度，只能增大基线 b、增大焦距 f（即提高分辨率），或者降低匹配误差 δd。Kinect v1 这类结构光深度传感器本质上也是三角测量，同样表现出这种二次关系；ToF 传感器的误差机理不同（见 d-sensors）。\n\n这直接决定了深度应该怎么采样。如果在 [near, far] 内按深度均匀放 L 个平面，近处相邻两层在图像上对应很大的视差跳变，会漏掉细节；远处相邻两层的视差差还不到一个像素，纯属浪费。按逆深度均匀放层（等视差），相邻两层在输入图像上的位移大致相同，每层分到的像素证据也差不多。Stereo Magnification（32 个平面，等视差，近 1 m、远 100 m）、DeepView 的 MPI 和 Quark 的 LDM 都这样做；NeRF 在前向场景中使用的 NDC 空间，也是在视差上线性采样。\n\n最后是尺度问题。只用图像（单目网络，或没有额外约束的 SfM）只能得到相差一个全局尺度的几何：把场景和所有相机平移同时放大 s 倍，拍到的图像完全不变（见 g-sfm）。MiDaS 这类单目深度网络更进一步，只输出相差“尺度加平移”的相对逆深度。要得到米制深度，必须引入已知的物理量，例如标定板的方格尺寸、已知的基线、深度传感器或 IMU。只依赖比值的方法天然不受全局尺度影响，例如 Quark 的等视差层：η、f 与深度用同一种单位。带固定米制常数的方法则必须在米制下运行，例如 Ha 的 τ = 0.02 m 和置信常数 0.001。", "analogy_zh": "伸直手臂竖起大拇指，交替闭左右眼：拇指会大幅跳动，远处的山却几乎不动。用这种“跳动幅度”来量距离，近处一厘米的差别看得清清楚楚，远处一百米的差别却只剩一丝抖动。所以刻度应该按相等的跳动量来划分，而不是按相等的米数，这就是逆深度采样。", "equations": [{"tex": "Z = \\frac{f\\, b}{d}", "explain_zh": "校正双目中的深度-视差关系。Z 是 z-depth，f 是以像素计的焦距，b 是基线（两个相机中心的距离），d 是视差（像素，d = u_left − u_right）。视差与逆深度 1/Z 成正比，比例系数为 f·b。Z 的单位由 b 决定：b 用米，Z 就是米；b 来自尺度任意的 SfM，Z 也就是任意尺度。"}, {"tex": "\\delta Z \\approx \\frac{Z^{2}}{f\\, b}\\, \\delta d", "explain_zh": "对上式求导得到的一阶误差传播。δd 是视差（匹配）误差，δZ 是相应的深度误差。Z² 项说明误差随距离平方增长。增大 f（更高分辨率或更长焦距）或 b（更宽基线）都能降低误差，但宽基线会带来更多遮挡，匹配也更难。Gallup 等人（CVPR 2008）正是利用这一关系，让基线和分辨率随深度变化，从而得到恒定的深度误差。"}, {"tex": "\\delta_\\ell = \\frac{\\ell - 0.5}{L},\\qquad d_\\ell = \\left[\\left(\\delta_\\ell + \\frac{0.5}{L}\\tanh(\\mathbf{V} W_d)\\right)\\left(\\frac{1}{\\eta} - \\frac{1}{f}\\right) + \\frac{1}{f}\\right]^{-1}", "explain_zh": "Quark 的深度参数化（Sec. 3.2.3，Eq. 3–4）。注意：这里 f 是远平面深度，η 是近平面深度，都不是焦距；d_ℓ 是第 ℓ 层的深度，不是视差。ℓ = 1..L 是层编号，δ_ℓ 是第 ℓ 个视差带的中心（0 到 1 之间的归一化视差）。V W_d 是网络对该层每个像素输出的线性投影，tanh 把偏移限制在 ±0.5/L 以内，即每层只能在自己那段宽 1/L 的视差带内移动。方括号内是逆深度：归一化视差 0 对应 1/f（远平面），1 对应 1/η（近平面）；取倒数即得深度 d_ℓ。因此各层在逆深度上等间隔排列，δ 最小的第 1 层位于最远处。"}, {"tex": "\\frac{1}{Z_{\\text{metric}}} \\approx s \\cdot \\hat{d}_{\\text{rel}} + c", "explain_zh": "相对（仿射不变）逆深度与米制逆深度之间的关系。d̂_rel 是 MiDaS 一类单目网络输出的相对逆深度；尺度 s 和平移 c 对每张图都是未知的，需要用稀疏的米制观测（带已知尺度的 SfM 点、深度传感器、已知基线的双目）做最小二乘拟合。SfM 的情况更简单：只差一个全局尺度，即 c = 0。"}], "worked_example_zh": "(1) 误差随 Z² 增长。设 f = 1000 px，视差误差 δd = 0.25 px（示意值）。取 Spaces 阵列中相邻相机约 10 cm 的间距，b = 0.1 m：Z = 1 m 时视差 100 px、δZ ≈ 2.5 mm；Z = 3 m 时视差约 33 px、δZ ≈ 22.5 mm；Z = 10 m 时视差 10 px、δZ ≈ 250 mm。换成 Quark 实验中最大约 30 cm 的基线（b = 0.3 m），Z = 3 m 时 δZ ≈ 7.5 mm。拿 Ha 的截断 τ = 0.02 m 对照：b = 0.1 m、3 m 处，单视角的深度噪声已与 τ 相当；户外 10 m 远景的噪声约为 τ 的 12 倍，固定的 τ 明显过紧；而 1 m 处的噪声只有 2.5 mm，截断带比噪声宽 8 倍，前后相距不到 2 cm 的表面（如贴着身体的手指）会在融合中互相干扰，τ 对近景细节又偏松。\n(2) 等视差与等深度放层。取近平面 η = 0.5 m、远平面 f = 4 m、L = 6（Quark 最终 LDM 的层数）。逆深度范围为 1/0.5 − 1/4 = 1.75 m⁻¹，每个视差带宽约 0.29 m⁻¹。6 个视差带的深度边界依次为 4.0、1.85、1.20、0.89、0.71、0.59、0.50 m。按 Eq. 4 取 tanh 项为 0，各层中心深度分别为 2.53、1.45、1.02、0.79、0.64、0.54 m。最远一层覆盖 1.85–4 m，宽 2.15 m；最近一层只覆盖 0.50–0.59 m，宽约 8.5 cm。换算成像素更直观：用一台 f = 1000 px、与目标相机水平相距 b = 0.1 m 的输入相机来看，整个 [η, f] 对应 f·b·1.75 = 175 px 的视差，每个视差带恰好约 29 px。如果改成按深度均匀放层，边界是 0.5、1.08、1.67、2.25、2.83、3.42、4.0 m：最近一层（0.5–1.08 m）对应约 108 px 的视差，最远一层（3.42–4 m）只有约 4 px。在初始化阶段（层是平的，等价于平面扫描），前者把 0.5–1 m 处的整张人脸压在同一个候选深度上，而等视差放层时同一区间跨了约 4 个视差带；后者则把层浪费在几乎没有视差变化的远处。\n(3) 尺度。假设 COLMAP 重建的 1 个单位实际等于 0.5 m。这时 Ha 的 τ = 0.02“米”实际只相当于 1 cm。它的置信权重 ω_k = min(0.001·(ν_k/49)^{-1/2}, 1) 等价于 min(1 mm / 局部深度 RMS 偏差, 1)，其中的“1 mm”同样会被缩放，实际只相当于 0.5 mm。Quark 的 Eq. 4 只用到 η、f 与深度的比值，只要三者单位一致，整体缩放不会改变各层在图像上的位置。", "pitfalls_zh": ["把 Quark 公式里的 f 当成焦距。Eq. 4 中的 f 是远平面，η 是近平面；同一篇论文做投影时还要用真正的焦距（包含在相机参数 θ 里）。同理，d 在双目公式中是视差，在 Quark 中是层深度，在单应公式中又是平面距离。", "近/远平面设置不当。Quark 的每层都被硬性限制在自己的视差带内，场景中超出 [η, f] 的部分没有层可以放；远平面设得过远（比如 100 m），又会把大部分层浪费在视差接近零的区域。训练时 η、f 由 SfM 点分布给出（Sec. 3.4），但实时系统中如何持续可靠地获得它们，论文没有讨论，这是部署时要自己解决的问题。", "默认了米制。Ha 的 τ = 0.02 m、置信常数 0.001、相机距离特征都隐含米制，而 DyNeRF 的位姿来自 COLMAP，尺度是任意的；论文没有说明如何换算成米。换数据集时，先确认位姿与深度的单位，再决定 τ 是否需要缩放。", "把相对深度当米制用。单目网络输出的相对逆深度与米制之间，差一个未知的尺度和一个未知的平移（在逆深度空间里）。直接当深度使用，不同视角、不同帧的几何会对不上；送进 TSDF 融合之前，必须逐帧对齐到米制。"], "in_quark": {"used": true, "where": "Sec. 3.2.3 Eq. 3–4（等视差带）、Sec. 3.4（近/远平面来自 SfM 点的深度分布）、Sec. 3.2.1（射线编码以近/远平面为参照）、Sec. 3.2.2（Layer Collapse 与由粗到细）", "how_zh": "Quark 把每层深度限制在目标视锥近/远平面 (η, f) 之间的等视差带内（Sec. 3.2.3，Eq. 3–4）：第 ℓ 层的中心为 δ = (ℓ−0.5)/L，网络只能通过 tanh 在 ±0.5/L 的范围内微调。Quark 从 24 层（36×64）开始，经过两次 Layer Collapse（相邻两层合并）减到 6 层（288×512）；Quark+ 则从 32 层减到 8 层。等视差放置使每层在输入视角中对应大致相同的像素位移（当输入相机相对目标相机的平移平行于像平面时严格成立）：粗分辨率下用 24 层密集采样来“找到表面”，高分辨率下用 6 层来“贴合表面”。η 和 f 在训练时按每个样本 SfM 重建点的深度分布自适应设定（Sec. 3.4），射线方向编码也以视锥的近/远平面为参照（Sec. 3.2.1）。由于所有量都用同一种 SfM 单位表示，公式又只依赖比值，Quark 原则上不需要米制尺度；但它完全依赖 [η, f] 设得合适。"}, "in_ha": {"used": true, "where": "附录 A.1 Eq. 9–12（z-depth 符号距离、τ = 0.02 m 与置信权重）、Sec. 3 与附录 A.5（RAFT-Stereo 视差换算深度；大/小基线训练数据）、附录 A.4（相机距离特征）", "how_zh": "Ha 的 TSDF 用 z-depth 求差，s_k = z_k − D_k[u_k, v_k]，并截断到 τ = 0.02 m（附录 A.1，Eq. 9–10）。置信权重为 ω_k = min(0.001·(ν_k/49)^{-1/2}, 1)（Eq. 11–12），其中 ν_k 是 7×7 邻域内各像素与中心像素深度差的平方（各项截断到 τ²）之和，所以整个式子等价于 min(1 mm / 局部深度 RMS 偏差, 1)。这两个常数都是米制的，意味着输入的深度和位姿必须是真实尺度，至少要与训练数据的尺度一致。输入深度要么来自 RAFT-Stereo 的视差（需要用基线和焦距按 Z = f·b/d 换算），要么来自 ScanNet 的传感器深度（米制）；训练时 DyNeRF 提供大基线样本，Spaces 提供小基线样本（附录 A.5）。立体深度误差随 Z² 增长，因此固定的 τ 对远景偏紧、对近景细节偏松。Ha 在户外的 ENeRF-Outdoor 上 PSNR 输给 ENeRF（24.01 对 25.79），与这一推测方向一致；但它在同样是户外的 D3DMV 上大幅领先，论文也没有做 τ 的消融，所以无法确认因果。融合网络的“相机间距离”特征（附录 A.4）同样依赖尺度。"}, "in_field_zh": "深度精度预算是 telepresence 相机布局的首要约束：给定需要的深度精度（例如 1–2 m 处的人脸要求几毫米）和相机分辨率，可以用 δZ ≈ Z²·δd/(f·b) 反推出最小基线（g-rig、d-stereo）。等视差采样出现在 MPI/LDM（i-layered、a-layered-nvs）、平面扫描代价体（d-mvs、i-psv），以及 NeRF 的 NDC 与逆深度采样（n-nerf、r-raymarch）中。度量尺度问题贯穿单目与视频深度（d-mono）、前馈几何模型（a-geo-fm）和 TSDF 融合（d-tsdf）。结构光和主动立体传感器的噪声同样随 Z² 增长，ToF 传感器的误差特性则不同（d-sensors）。", "resources": [{"title": "CMU 16-385 (Spring 2020), Lecture 13: Stereo", "url": "https://www.cs.cmu.edu/~16385/lectures/lecture13.pdf", "type": "course", "note_zh": "讲视差、立体校正以及视差与深度的关系，推导配有图解。"}, {"title": "Gallup, Frahm, Mordohai, Pollefeys: Variable Baseline/Resolution Stereo (CVPR 2008)", "url": "https://mordohai.github.io/public/Gallup_VariableBaselineResolutionStereo08.pdf", "type": "paper", "note_zh": "摘要指出，传统立体的深度误差随深度二次增长；论文让基线和分辨率随深度成比例变化，得到恒定的深度误差。适合用来理解 δZ ∝ Z² 在工程上意味着什么。"}, {"title": "Zhou et al.: Stereo Magnification: Learning View Synthesis using Multiplane Images (SIGGRAPH 2018)", "url": "https://arxiv.org/abs/1805.09817", "type": "paper", "note_zh": "默认用 32 个平面，按等视差（逆深度）放在近 1 m、远 100 m 之间。Flynn 是该文作者之一；Quark 正文没有引用它，但 Quark 的直接前作 DeepView 的 MPI 同样“按逆深度等间隔”放置平面，Quark 的等视差层沿袭的正是这条 MPI 路线。"}, {"title": "Ranftl et al.: Towards Robust Monocular Depth Estimation: Mixing Datasets for Zero-shot Cross-dataset Transfer (MiDaS)", "url": "https://arxiv.org/abs/1907.01341", "type": "paper", "note_zh": "提出对深度范围和尺度都不变的训练目标，是理解“相对深度与米制深度”区别最直接的例子。"}], "self_check": [{"q_zh": "基线 b = 0.2 m、f = 1500 px、视差误差 0.5 px，Z = 2 m 处的深度误差是多少？要在 4 m 处保持同样的精度，基线需要多大？", "a_zh": "δZ ≈ 2²/(1500·0.2)·0.5 = 4/300·0.5 ≈ 6.7 mm。到 4 m 处 Z² 变为 4 倍，所以基线也要变为 4 倍，即 0.8 m（或者把 f 提高到 4 倍）。"}, {"q_zh": "在 Quark 的 Eq. 4 中，为什么第 1 层位于最远处？如果场景有一部分在远平面之外，会发生什么？", "a_zh": "δ_1 = 0.5/L 最小，归一化视差接近 0，对应的逆深度接近 1/f，也就是在远平面附近。深度超过 f 的内容没有层可放，因为每层被 tanh 限制在自己的带内，最远一层最多只能退到 f；这些内容只能被“压”到最远一层上，得到偏大的视差。同理，比 η 更近的内容最多只能放到 η。两种情况在渲染时都会造成错位，表现为重影或错误的硬边。"}, {"q_zh": "为什么 Ha et al. 的 τ = 0.02 m 与 COLMAP 位姿放在一起会有隐患，而 Quark 的等视差层没有这个问题？", "a_zh": "COLMAP 的重建只确定到一个全局尺度，而 τ 和 0.001 是固定的米制常数，尺度一变，它们的物理含义就跟着变。Quark 的 η、f 与深度使用同一种单位，公式只依赖比值，整体缩放后各层在图像上的位置不变。"}], "prereqs": ["g-pinhole", "g-epipolar"]}, {"id": "g-sfm", "name_zh": "运动恢复结构（SfM）与光束法平差", "name_en": "Structure-from-Motion & bundle adjustment", "tldr_zh": "SfM 只从一组照片出发，同时求出每台相机的内外参和一组稀疏 3D 点：先做特征匹配和几何验证，再逐步注册相机、三角化新点，并反复用光束法平差（BA）最小化重投影误差。两篇锚点论文的相机位姿，以及 Quark 的近/远平面，都来自这一步（通常用 COLMAP）。", "intuition_zh": "前面几节都假设相机参数已知。实际中这些参数从哪里来？SfM 的回答是：只看照片。先在每张图里提取关键点（如 SIFT），在图像对之间匹配描述子；再用 RANSAC 估计基础矩阵或本质矩阵，剔除错误的匹配，这一步叫几何验证。有了一对可靠的视角后，分解本质矩阵 E 得到相对位姿，并三角化出第一批 3D 点。\n\n增量式 SfM（COLMAP 的默认方式）像拼图：从一对好的初始图像开始，每次选一张与已有 3D 点有足够多 2D–3D 对应的新图，用 PnP（Perspective-n-Point）加 RANSAC 求出它的位姿，再三角化这张图新带来的点。每加入若干张图，就做一次光束法平差：把所有相机参数和 3D 点放在一起调整，使每个观测的重投影误差（观测到的像素与预测投影之差）的平方和最小。BA 是一个大规模的稀疏非线性最小二乘问题，通常用 Levenberg–Marquardt 配合 Schur 补求解（f-optim）。\n\nSfM 的输出有固有的歧义：把场景和所有相机一起旋转、平移、缩放，拍到的图像完全不变。这是一个 7 自由度的相似变换，称为 gauge freedom。所以 COLMAP 输出的单位是任意的，除非额外提供已知尺寸或已知基线。SfM 还有一个副产品：稀疏点云，以及每个点在哪些相机中可见、深度是多少。LLFF 代码对每张图取可见点深度的 0.1% 和 99.9% 分位数，作为该图的近/远平面；Quark 训练时同样根据 SfM 重建点的深度分布，逐样本设定近/远平面（没有说明具体用哪个分位数）。\n\n对固定的 telepresence 相机阵列，SfM/BA 一般只在安装后离线运行一次（也可以借助标定物），得到精确的内外参后每帧直接复用，两篇论文都是这种设定。与之相对的是“无位姿”方法：每帧用前馈网络（如 DUSt3R、VGGT，见 a-geo-fm）或在线优化来估计相机，代价是精度或速度。", "analogy_zh": "一群游客各自拍了同一座广场，事后想弄清每个人当时站在哪。先在不同照片里找出同一扇窗、同一块招牌（特征匹配）；再从两张照片的差别推算这两个人的相对位置（本质矩阵）；然后把其他游客一个个“插”进来（PnP）；最后让所有人一起挪动微调，直到每扇窗在每张照片里的位置都对得上（BA）。至于广场到底有多大，照片本身回答不了，这就是尺度歧义。", "equations": [{"tex": "\\min_{\\{K_i, R_i, t_i\\},\\,\\{X_j\\}} \\sum_{(i,j)\\in\\mathcal{O}} \\rho\\!\\left( \\left\\| \\mathbf{x}_{ij} - \\pi\\big(K_i, R_i, t_i, X_j\\big) \\right\\|^2 \\right)", "explain_zh": "光束法平差的目标函数。i 遍历相机，j 遍历 3D 点；𝒪 是所有“点 j 在相机 i 中被观测到”的组合。x_ij 是观测到的像素位置，π(·) 是包含畸变的针孔投影（见 g-pinhole），‖·‖² 是以像素计的平方误差，即重投影误差。ρ 是鲁棒核（如 Huber、Cauchy），用来压低残留误匹配的影响。未知量是所有相机的内外参和所有点的坐标。每个残差只依赖一台相机和一个点，所以雅可比矩阵高度稀疏，可以用 LM 加 Schur 补高效求解。"}, {"tex": "\\pi\\big(K, R, s\\,t, s\\,X\\big) = \\pi\\big(K, R, t, X\\big),\\quad \\forall\\, s > 0", "explain_zh": "尺度歧义。把所有 3D 点 X 和所有相机平移 t 同时乘以 s，有 K(R·sX + s·t) = s·K(RX + t)，透视除法会把 s 消掉，投影结果不变。所以仅凭图像无法确定米制尺度；再加上整体旋转和平移，共有 7 个自由度不受图像约束。要得到米制，需要已知的基线、标定板尺寸或深度传感器。"}, {"tex": "N = \\frac{\\log(1 - p)}{\\log\\!\\left(1 - (1 - \\epsilon)^{m}\\right)}", "explain_zh": "RANSAC 所需的迭代次数。p 是希望至少抽到一次全内点样本的概率（如 0.99），ε 是外点比例，m 是最小样本的大小：五点法求 E 为 5，八点法求 F 为 8，PnP 常用 3 或 4 点。N 随 m 指数增长，所以内参已知时用五点法，比用八点法快得多。"}, {"tex": "\\eta_i = \\operatorname{pct}_{0.1\\%}\\{z_{ij}\\},\\qquad f_i = \\operatorname{pct}_{99.9\\%}\\{z_{ij}\\},\\qquad z_{ij} = \\big[R_i X_j + t_i\\big]_z", "explain_zh": "用 SfM 点估计近/远平面，即 LLFF 代码 pose_utils.py 的做法。z_ij 是在相机 i 中可见的点 j 的 z-depth，pct 表示分位数。之所以取 0.1% 和 99.9% 分位数而不是最小值和最大值，是为了排除少量三角化错误的离群点。Quark 训练时按 SfM 点的深度分布逐样本设定 η 和 f，但论文没有给出具体分位数，这里以 LLFF 的实现为例。"}], "worked_example_zh": "(1) RANSAC：假设 50% 的匹配是外点，要以 99% 的概率至少抽到一次全内点样本，五点法需要 N = log(0.01)/log(1 − 0.5⁵) ≈ 146 次，八点法需要约 1177 次。外点比例降到 30% 时，两者分别只需 26 次和 78 次。\n(2) BA 的规模：以 Spaces 那样的 16 相机阵列为例，假设内参共享、每台相机有 6 个外参自由度、重建出 10,000 个点，未知量约为 16×6 + 10,000×3 ≈ 30,096 个。用 Schur 补先消去点，只需解一个 96×96 的相机块方程，再逐点回代求出各点坐标。这就是 BA 能处理海量点的原因。\n(3) 近/远平面（假设数据）：某个目标相机可见 5,000 个 SfM 点，其 z-depth 的 0.1% 分位数为 0.62 个 SfM 单位，99.9% 分位数为 7.9 个单位，则取 η = 0.62、f = 7.9。代入 Quark 的 Eq. 4，24 个初始层在逆深度 1/7.9 ≈ 0.127 到 1/0.62 ≈ 1.613 之间均匀分布。整个过程不需要知道 1 个 SfM 单位等于多少米。\n(4) 读取位姿：COLMAP images.txt 中每行的 QW QX QY QZ TX TY TZ 表示 world-to-camera 变换，相机中心为 C = −Rᵀt。Quark 按相机中心的 L2 距离选最近 8 个输入视角，Ha 按距离选最近 K 个，都需要先算出 C。", "pitfalls_zh": ["尺度是任意的。COLMAP 输出的单位不是米，Ha 的 τ = 0.02 m 这类米制常数不能直接套用；需要用已知基线或标定物把重建缩放到米制。论文 Sec. 3 说位姿用 COLMAP 计算，附录 A.7 又说使用数据集提供的参数，两处都没有交代尺度如何处理。", "弱纹理、重复纹理和动态内容会让特征匹配失败或出错。人站在纯色背景前、白墙会议室这类场景，SfM 可能根本注册不上。多相机阵列应该在无人时对着纹理丰富的场景标定，或者投射随机纹理（Panoptic Studio 用 5 台投影仪把随机图案投到白色帐篷上，再对 521 台相机做 SfM），而不是对着要拍摄的动态人物标定。", "内参共享与否要谨慎。同型号但彼此独立的相机，焦距、主点和畸变仍然各不相同；强行共享内参，会把误差转嫁到外参上。反过来，每帧都自由估计内参又可能不稳定。固定阵列的常见做法是：每台相机单独标定内参，同一台相机的参数在不同时刻共享（DyNeRF 的 COLMAP 参数在整个采集过程中保持不变）。", "用 min/max 作为近/远平面。少量三角化错误的离群点，会把 near 拉到接近 0，或把 far 推到极远，使等视差层几乎全部浪费掉。应该使用分位数并留一点余量。还要注意，动态场景中的 SfM 点只反映标定时的静态结构。"], "in_quark": {"used": true, "where": "Sec. 3.4 Training（近/远平面来自 SfM 点的深度分布，引用 Schönberger & Frahm 2016）、Sec. 4.1（按相机中心距离选视角）、Sec. 4.3（标定误差导致硬边）", "how_zh": "Quark 本身不估计位姿，它要求输入是“已标定的多视角图像”（Sec. 3.4）。训练和评测数据集的位姿都来自 SfM：RFF/LLFF 的位姿由 COLMAP 求出；Spaces 由 DeepView 的作者以名义阵列布局为先验、用 SfM 标定。Sec. 3.4 明确写到，每个样本的近/远平面根据 SfM（COLMAP，Schönberger & Frahm 2016）重建点的深度分布自适应选取，这直接决定了 Eq. 4 中各视差带的位置。Sec. 4.1 用相机中心的 L2 距离选出最近的 8 个输入视角（在 Deep Blending 上还加入了视角夹角）。Sec. 4.3 承认，标定有误差时，IBR 混合会产生错误的硬边，而不是模糊。至于实时部署时近/远平面和位姿如何在线获得，论文没有讨论。"}, "in_ha": {"used": true, "where": "Sec. 3（“相机位姿固定，用 COLMAP 计算一次”）、附录 A.7（“使用数据集提供的相机参数”）、附录 A.1 与 Sec. 3.1（投影与反投影依赖内外参）", "how_zh": "Ha et al. 在 Sec. 3 中写道，每台相机的位姿随时间固定，只需用 COLMAP 计算一次；附录 A.7 却说三个测试集都使用数据集提供的相机参数，两处说法没有统一。以 DyNeRF 为例，其原论文说明内外参由 COLMAP 求得，并在整个采集过程中保持不变。固定且预先标定的阵列是 Ha 方法成立的前提：逐像素的颜色差分掩码（Sec. 3.2）要求相机不动；TSDF 的逐视角投影（附录 A.1）和像素高斯的反投影（Sec. 3.1）都依赖准确的内外参。另外，COLMAP 的尺度是任意的，而 TSDF 的截断 τ = 0.02 m 是米制常数，论文没有说明如何把 COLMAP 位姿换算到米制（详见 g-depth）。"}, "in_field_zh": "在 telepresence 中，SfM/BA 主要用于相机阵列的离线标定和维护：安装完成后用 COLMAP（或带阵列先验的 BA）求出精确的内外参，运行期间持续监控重投影误差，以发现松动的相机（g-rig）。另一个方向是去掉预标定：前馈几何基础模型（DUSt3R、VGGT，见 a-geo-fm），以及 AnySplat、LiveStre4m、Tele360 等方法，尝试每帧估计相机，或用可微 LM 在线精化相机参数（a-telepresence-sys）。NeRF/3DGS 的逐场景优化（n-nerf、n-3dgs）同样以 COLMAP 的位姿为起点，3DGS 还用 COLMAP 的稀疏点初始化高斯。", "resources": [{"title": "Szeliski, Computer Vision: Algorithms and Applications 2nd ed., Ch. 11 Structure from motion and SLAM（§11.1 Geometric intrinsic calibration、§11.2 Pose estimation、§11.3 Two-frame structure from motion、§11.4.2 Bundle adjustment、§11.4.3 Exploiting sparsity）", "url": "https://szeliski.org/Book/", "type": "book", "note_zh": "从标定、PnP 位姿估计与三角化（§11.2.4）讲到两视角 SfM 和多视角 BA，并讲如何利用稀疏性加速求解；免费 PDF。"}, {"title": "Schönberger & Frahm: Structure-from-Motion Revisited (CVPR 2016)", "url": "https://openaccess.thecvf.com/content_cvpr_2016/papers/Schonberger_Structure-From-Motion_Revisited_CVPR_2016_paper.pdf", "type": "paper", "note_zh": "COLMAP 的论文，Quark 设定近/远平面时引用的正是这一篇。文中依次讲清增量式 SfM 的对应搜索、初始化、图像注册、三角化和 BA。"}, {"title": "COLMAP Tutorial", "url": "https://colmap.github.io/tutorial.html", "type": "tutorial", "note_zh": "官方教程，覆盖特征提取、匹配与几何验证、稀疏重建和稠密重建。建议亲手跑一遍，再对照 https://colmap.github.io/format.html 读取 cameras.txt、images.txt 和 points3D.txt。"}, {"title": "LLFF code (imgs2poses / llff/poses/pose_utils.py)", "url": "https://github.com/Fyusion/LLFF", "type": "code", "note_zh": "调用 COLMAP 之后，按每张图可见点深度的 0.1% 和 99.9% 分位数写出 near/far 边界（保存在 poses_bounds.npy），是“用 SfM 点设定近/远平面”的现成实现。"}], "self_check": [{"q_zh": "为什么 SfM 无法恢复米制尺度？对固定阵列，给出两种恢复尺度的办法。", "a_zh": "把所有点和所有相机平移同时缩放，投影结果不变（尺度歧义），所以图像本身无法确定尺度。恢复办法：(1) 在场景中放一个已知尺寸的标定板或标记物；(2) 测量两台相机中心之间的实际距离，据此缩放整个重建；此外也可以借助深度传感器或其他米制深度来对齐。"}, {"q_zh": "外点比例为 40% 时，用八点法估计 F，要达到 99% 的置信度需要多少次 RANSAC 迭代？换成五点法呢？", "a_zh": "八点法：log(0.01)/log(1 − 0.6⁸) ≈ 272 次。五点法：log(0.01)/log(1 − 0.6⁵) ≈ 57 次。"}, {"q_zh": "直接用 SfM 点的最小/最大深度作为 Quark 的近/远平面，会有什么问题？", "a_zh": "离群点会把区间拉得过大，而各层在逆深度上是等间隔的，于是大部分层落在没有内容的深度上，有效层数减少，深度分辨率变差。应该改用分位数（如 0.1% 和 99.9%），并留一些余量。"}], "prereqs": ["g-epipolar", "f-optim"]}, {"id": "g-rig", "name_zh": "多相机阵列：标定、同步与卷帘快门", "name_en": "Multi-camera rigs: calibration, synchronization & rolling shutter", "tldr_zh": "多相机阵列需要让所有相机在三方面对齐：几何上（内外参）、颜色上（曝光、白平衡、响应曲线）、时间上（同一时刻曝光）。常用手段是用张正友平面标定求内参，用共视标定物或带阵列先验的 BA 求外参，用 genlock 或硬件触发做同步，同时注意卷帘快门逐行曝光带来的时间差。两篇锚点论文都把这些当成前提，一旦不满足，就会出现硬边、模糊和闪烁。", "intuition_zh": "前面的几何默认所有相机在同一时刻、用准确的参数、以相同的颜色响应拍摄。真实阵列里，这三件事都可能出错。先看几何标定。张正友方法让相机拍摄一块已知尺寸的平面棋盘格：每个姿态下，棋盘平面到图像的映射是一个单应 H = K[r1 r2 t]；由于 r1、r2 互相正交且长度相等，每个 H 能给出关于 K 的两个约束。有 3 个以上姿态就能闭式解出 K，再通过最小化重投影误差（连同畸变参数）精化。阵列外参则让多台相机同时看到标定物，或者直接用 SfM/BA（DeepView 的 Spaces 阵列就是以名义布局为先验做 SfM 标定）。最好在一个全局 BA 中联合求解所有相机，避免两两串联时误差逐级累积。\n\n再看同步。在动态场景中，如果相机 A 比相机 B 晚 Δt 曝光，运动物体在两张图中的位置就不属于同一时刻，三角化和 IBR 混合都会出错。常见的同步方式有三种。硬件触发或 genlock：所有相机由同一个时钟信号触发曝光，可以达到亚毫秒级。时间码（timecode）：给每一帧打上来自同一时钟的时间戳，DyNeRF 的 GoPro 阵列就用 timecode 系统同步。软件同步：按网络时间戳，或者按音频、闪光等事件对齐帧，精度通常只到帧级，还带有抖动。Panoptic Studio 用两套硬件时钟，分别让 480 台 VGA 相机（25 fps）和 31 台 HD 相机（29.97 fps）在快门级同步，再把两套时钟产生的时间码录成一个立体声音频信号来对齐二者，精度达到亚毫秒级。\n\n然后是卷帘快门（rolling shutter）。多数 CMOS 相机是逐行依次曝光的，图像顶部和底部的曝光时刻相差一整个读出时间，从几毫秒到几十毫秒不等，取决于传感器和拍摄模式。GoPro 这类运动相机就是卷帘快门（DyNeRF 的阵列正是 GoPro）。所以即使两台相机的帧起始时刻完全同步，运动物体仍会被“斜切”，而且每台相机的行时间各不相同。全局快门（global shutter）相机没有这个问题，是高端采集阵列的首选；如果只能用卷帘快门相机，就要在标定时估计行读出时间（例如 Kalibr，或 Oth 等人 2013 年的方法），并在重建中对它建模。\n\n最后是颜色标定。IBR 直接混合来自不同相机的像素；如果各相机的曝光、白平衡、增益或响应曲线不一致，混合权重一变，画面上就会出现接缝和闪烁。通常的做法是锁定曝光和白平衡，用色卡为每台相机求一个颜色校正矩阵；也可以像 DeepView 那样，在后处理中校正曝光差异。", "analogy_zh": "多相机阵列像一个合唱团。几何标定是让每个人站到排练好的位置，颜色标定是让每个人唱同一个调，同步是让所有人跟着同一个指挥的节拍开口。卷帘快门则像每个人唱一句歌词都要花一点时间：就算大家同时开口，每个字唱出来的时刻仍然错开。只要有一项没对齐，观众听到的（也就是新视角合成的结果）就是重影和走音。", "equations": [{"tex": "H = [\\,\\mathbf{h}_1\\;\\mathbf{h}_2\\;\\mathbf{h}_3\\,] \\simeq K\\,[\\,\\mathbf{r}_1\\;\\mathbf{r}_2\\;t\\,],\\qquad \\mathbf{h}_1^{\\top} B\\, \\mathbf{h}_2 = 0,\\quad \\mathbf{h}_1^{\\top} B\\, \\mathbf{h}_1 = \\mathbf{h}_2^{\\top} B\\, \\mathbf{h}_2,\\quad B = K^{-\\top} K^{-1}", "explain_zh": "张正友平面标定。标定板位于世界系的 Z = 0 平面上，板上的点为 (X, Y, 0)。r_1、r_2 是旋转矩阵的前两列，t 是平移，因此从板到图像的映射是单应 H，H 与 K[r_1 r_2 t] 只差一个尺度。在相差尺度的意义下有 r_1 = K^{-1}h_1、r_2 = K^{-1}h_2，二者正交且模长相等，由此得到两条关于 B = K^{-ᵀ}K^{-1} 的线性约束。B 是 3×3 对称矩阵，6 个元素在相差一个尺度的意义下有 5 个自由度（对应 f_x、f_y、c_x、c_y 和 skew），所以至少需要 3 个板姿态才能闭式求解；如果假设 skew = 0，则至少需要 2 个。闭式解之后，再做包含畸变系数的非线性精化。"}, {"tex": "\\min_{K,\\,\\mathbf{k},\\,\\{R_i,t_i\\}} \\sum_{i}\\sum_{j} \\left\\| \\mathbf{x}_{ij} - \\pi\\big(K, \\mathbf{k}, R_i, t_i, P_j\\big) \\right\\|^2", "explain_zh": "标定的最终目标：最小化重投影误差。P_j 是标定板上已知的 3D 角点，x_ij 是在第 i 张图中检测到的角点（亚像素精度），k 是畸变系数（如 k_1, k_2, p_1, p_2, k_3），(R_i, t_i) 是第 i 个板姿态。收敛后的 RMS 重投影误差是衡量标定质量的主要指标（OpenCV 的 calibrateCamera 直接返回这个值），好的标定通常在亚像素量级。多相机标定时，把所有相机和所有板姿态放进同一个目标函数联合优化。"}, {"tex": "T_{c_2 \\leftarrow c_1} = T_{c_2 \\leftarrow b}\\; T_{c_1 \\leftarrow b}^{-1},\\qquad T = \\begin{bmatrix} R & t \\\\ \\mathbf{0}^{\\top} & 1 \\end{bmatrix}", "explain_zh": "阵列外参。T_{c←b} 是 4×4 刚体变换，把标定板 b 坐标系中的点变到相机 c 的坐标系，可由单应分解或 PnP 求得。两台相机同时看到同一块板时，它们之间的相对位姿就是上式的乘积。沿阵列逐个串联（1→2→3→…）会累积误差，所以这个结果通常只作为初值，最后再用覆盖所有相机的全局 BA 联合精化。"}, {"tex": "t_{\\text{row}}(v) = t_0 + v\\, t_{\\text{line}},\\qquad \\Delta u \\approx \\frac{f\\, v_{\\perp}\\, \\Delta t}{Z}", "explain_zh": "卷帘快门和同步误差的影响。第一式：t_0 是一帧开始曝光的时刻，v 是行号，t_line 是单行读出时间（整帧读出时间约为 H·t_line），所以同一帧中不同行对应不同时刻。第二式估计时间差 Δt（来自同步误差或行时间差）造成的像素错位：物体以垂直于视线的速度 v_⊥ 运动、距离为 Z、焦距为 f 像素时，错位约为 Δu ≈ f·v_⊥·Δt/Z。"}], "worked_example_zh": "(1) 同步误差：DyNeRF 的视频是 30 fps，帧间隔 33.3 ms。如果相机各自自由运行，即使按时间戳把每路视频对齐到最近的一帧，残余的相位差最坏也有半帧，即 16.7 ms。一只以 1 m/s 横向挥动的手，在 2 m 远、f = 1000 px 的相机中错位约 Δu ≈ 1000·1·0.0167/2 ≈ 8.3 px，手在 3D 中移动了 1.67 cm。对手掌内部的平滑表面，横向移动几乎不改变沿射线的深度；但在手的轮廓附近，宽约 8 px 的一条带子里，这台相机看到的是背景，其他相机看到的是手，深度相差远超 τ = 0.02 m，TSDF 在这里会得到错误的零交叉，融合结果在轮廓处出现重影。如果手是朝相机方向运动，1.67 cm 的位移就直接与 τ 相当。差一整帧时，错位变成 16.7 px、3.3 cm。用 genlock 把 Δt 压到 1 ms 以内后，同一只手的错位不到 0.5 px。\n(2) 卷帘快门：假设整帧读出时间为 20 ms（示意值），同一帧中顶行和底行的曝光时刻相差 20 ms。沿用上例的 2 m 距离和 f = 1000 px，一个纵贯整幅画面、以 1 m/s 横向运动的物体，顶部与底部之间会被“斜切”约 10 px；只占画面高度 1/5 的手，内部斜切约 2 px，但它相对另一台相机的整体错位，取决于它在两台相机中各自落在哪些行，最多可达 20 ms 对应的约 10 px。而且每台相机的扫描方向取决于它的安装朝向。\n(3) 张正友标定：用内角点 9×6、方格边长 25 mm 的棋盘，拍 15–20 张不同姿态的图像，OpenCV 的 calibrateCamera 会返回 RMS 重投影误差。如果它大于 1 px，通常说明角点检测、图像模糊或畸变模型有问题。接着让相邻相机同时看到棋盘，用第三个式子求相对位姿作为初值，最后做全局 BA。\n(4) 颜色：两台相机 A、B 曝光相差 1/3 档，B 的线性亮度是 A 的 2^{1/3} ≈ 1.26 倍。设 A 看到的亮度为 a，当 IBR 的混合权重从 (A, B) = (0.3, 0.7) 变到 (0.7, 0.3) 时，像素亮度从 0.3a + 0.7·1.26a ≈ 1.18a 变到 0.7a + 0.3·1.26a ≈ 1.08a，跳变约 9%。这就是 Quark 在 Sec. 4.1 和 4.3 中所说的“输入之间曝光差异大时，切换输入相机会引起明显闪烁”。", "pitfalls_zh": ["只看单台相机的重投影误差。每台相机内参标定的 RMS 都很小，不代表阵列外参就准确，还要检查跨相机的重投影误差和极线误差。Quark 指出标定误差会产生错误的硬边（Sec. 4.3），Ha 指出会导致前向投影错位和模糊（Sec. 4.6）。", "用帧号代替真实时间。软件时间戳和网络时间戳有抖动，自由运行的相机之间相位是随机的，动态区域的对应关系会随时间漂移。ENeRF-Outdoor 的同步不完美，Ha 只能把指标降到 480×270 计算（附录 A.6），这样做同时也会掩盖高频细节上的差异。", "忽略卷帘快门。静态标定时看不出问题，拍动态场景或手持相机时才暴露出来。两篇锚点论文全文都没有提到卷帘快门；而消费级 CMOS 相机大多是卷帘快门，两篇都用来评测的 DyNeRF（N3DV）数据就是用 GoPro 拍的。用这类相机搭阵列、拍快速运动时需要格外注意。", "开着自动曝光或自动白平衡。每台相机各自调整，IBR 混合结果会随视角变化出现亮度跳变和闪烁（Quark Sec. 4.1）。Ha 的颜色差分掩码 M = min(|I_t − I_{t−1}|/0.7 + 0.6, 1)（Sec. 3.2）也会把曝光变化误判为运动，从而少保留历史深度。采集时应锁定曝光和白平衡，并做颜色标定。"], "in_quark": {"used": true, "where": "Sec. 3.4（在已标定的多视角图像上训练）、Sec. 4.1（切换输入相机加上曝光差异导致闪烁）、Sec. 4.3（曝光/焦距差异与标定误差导致边缘伪影）；数据集 Spaces（16 相机阵列）与 N3DV（timecode 同步的 GoPro 阵列）", "how_zh": "Quark 假设输入已经标定和同步，自身不做任何标定或同步处理。它在“已标定的多视角图像”上训练（Sec. 3.4），推理时把多路视频流逐帧当作静态多视角输入处理。训练数据之一 Spaces 来自一个 16 台相机的阵列，相邻相机相距约 10 cm；DeepView 的作者用 SfM 加阵列先验标定了它，并校正了曝光差异。动态评测用的 N3DV（即 DyNeRF 数据）来自用 timecode 同步的 GoPro 阵列。论文在 Sec. 4.1 承认，目标相机移动时输入相机集合会切换，输入之间曝光差异大时会引起明显闪烁。Sec. 4.3 进一步说明，blend weights 对曝光或焦距不同的输入很敏感，会产生边缘伪影和闪烁；标定有误差时，得到的是错误的硬边，而不是较温和的模糊。卷帘快门在全文中完全没有讨论。"}, "in_ha": {"used": true, "where": "Sec. 3（位姿固定、只标定一次）、Sec. 3.2（颜色差分掩码依赖相机固定不动）、Sec. 4.6 Limitations（需要同步良好且已标定的相机）、附录 A.6（ENeRF-Outdoor 的同步与颜色标定问题，导致在 480×270 下评测）", "how_zh": "Ha et al. 明确要求相机同步良好且已标定（Sec. 4.6），否则前向投影得到的 𝓘_k^t 彼此不对齐，融合结果会发糊。它的时间机制也建立在固定阵列之上：相机位姿不随时间变化（Sec. 3），才能逐像素比较 I_n^t 和 I_n^{t−1}，计算颜色差分掩码（Sec. 3.2）。附录 A.6 写到，ENeRF-Outdoor（18 台 1080p 相机）存在不完美的相机同步和颜色标定误差；为减弱它们对定量指标的影响，作者把渲染结果进一步降到 480×270 再计算指标。DyNeRF 则被描述为同步良好。即便如此，在 ENeRF-Outdoor 上，Ha 的 PSNR、SSIM 和 L1 仍然输给 ENeRF。卷帘快门和在线标定，论文都没有讨论。"}, "in_field_zh": "这是 telepresence 系统工程中最容易被低估的一环。Project Starline 这类通话舱、Panoptic Studio 这类采集穹顶，都依赖硬件同步和精确标定；人像的颜色一致性（尤其是肤色）对观感影响极大。系统需要定期或在线重新标定，因为温度和振动会让外参漂移，并用重投影残差做健康监控。免标定或在线标定的方法（Tele360 的可微 LM、LiveStre4m、AnySplat，见 a-geo-fm、a-telepresence-sys）正在放宽这个前提。同步误差还会和视频编码、网络传输中的时间戳误差叠加（v-codec），影响端到端延迟和多路视频流的对齐；很多时间一致性问题（v-temporal）的根源也是曝光漂移。", "resources": [{"title": "Zhang: A Flexible New Technique for Camera Calibration (MSR-TR-98-71; IEEE TPAMI 2000)", "url": "https://www.microsoft.com/en-us/research/wp-content/uploads/2016/02/tr98-71.pdf", "type": "paper", "note_zh": "张正友标定的原始论文：只需让相机在至少 2 个不同姿态下拍摄平面图案，先求闭式解，再做最大似然精化，并对径向畸变建模。"}, {"title": "OpenCV: Camera Calibration (Python tutorial)", "url": "https://docs.opencv.org/4.13.0/dc/dbb/tutorial_py_calibration.html", "type": "tutorial", "note_zh": "包含 findChessboardCorners、cornerSubPix、calibrateCamera、undistort 和重投影误差计算的完整示例；畸变系数的顺序为 (k1, k2, p1, p2, k3)。"}, {"title": "Kalibr (ETH Zurich ASL)", "url": "https://github.com/ethz-asl/kalibr", "type": "code", "note_zh": "支持视野不完全重叠的多相机内外参标定、相机与 IMU 的时空标定，以及卷帘快门相机的完整内参标定（包括快门参数）。"}, {"title": "Joo et al.: Panoptic Studio: A Massively Multiview System for Social Interaction Capture", "url": "https://arxiv.org/abs/1612.03153", "type": "paper", "note_zh": "一个装有 480 台 VGA 相机、31 台 HD 相机和 10 台 Kinect v2 的采集穹顶。论文详细介绍了基于硬件时钟、genlock 和时间码的同步方案（达到亚毫秒级），以及用投影仪投射纹理、对 521 台相机做 SfM 标定的方法，是大型阵列工程的范本。"}, {"title": "Oth, Furgale, Kneip, Siegwart: Rolling Shutter Camera Calibration (CVPR 2013)", "url": "https://www.cv-foundation.org/openaccess/content_cvpr_2013/papers/Oth_Rolling_Shutter_Camera_2013_CVPR_paper.pdf", "type": "paper", "note_zh": "把逐行曝光的时间偏移（line delay）与内参一起标定，是 Kalibr 卷帘快门标定功能的方法来源；读完能理解 t_row(v) = t_0 + v·t_line 这个模型怎样从数据中估计出来。"}], "self_check": [{"q_zh": "为什么在张正友标定中，每个棋盘姿态只提供两个关于内参的约束？至少需要几张图？", "a_zh": "每个单应 H 有 8 个自由度，其中 6 个被这个姿态的外参 (R, t) 占用，只剩 2 个用来约束内参，分别来自 r1 ⊥ r2 和 |r1| = |r2|。B 在相差一个尺度的意义下有 5 个自由度（含 skew），所以至少需要 3 个姿态；如果假设 skew = 0，至少需要 2 个。实践中通常拍 15–20 张，以获得稳健的精化结果。"}, {"q_zh": "在一个 30 fps 的阵列中，某台相机晚了一帧。一个以 0.5 m/s 横向移动、距离 1.5 m 的人，在 f = 1200 px 的图像中错位多少？这对 Ha 的 TSDF 意味着什么？", "a_zh": "Δt = 33.3 ms，人在 3D 中横向移动了 1.67 cm，图像中错位约 Δu ≈ 1200·0.5·0.0333/1.5 ≈ 13.3 px。对 TSDF 来说，影响集中在人体轮廓附近那条十几像素宽的带子：这台相机在那里看到背景而其他相机看到人，符号距离无法在截断带（τ = 2 cm）内达成一致，零交叉位置出错；同时它前向 warp 出来的颜色在目标图上也错开十几个像素，融合网络若给它权重，就会出现重影。"}, {"q_zh": "Quark 和 Ha 都会因为曝光差异而闪烁，但机理有什么不同？", "a_zh": "两者都用凸组合混合来自不同相机的真实像素，曝光不一致时，随视角或时间变化的权重都会造成亮度跳变：Quark 发生在输入相机集合切换时，Ha 发生在 K 集合切换或融合权重变化时。Ha 还多一个问题：它靠逐帧颜色差分判断哪里在运动，曝光变化会被误判为运动，从而削弱它的时间滤波。由于掩码下限 M ≥ 0.6，这种削弱有上限：静态区本来每帧最多也只保留 40% 的历史深度。"}], "prereqs": ["g-pinhole"]}]}, {"id": "M3", "title_zh": "深度估计与三维重建", "title_en": "Depth estimation & 3D reconstruction", "goal_zh": "理解深度从哪里来、有多不准，以及如何把多张不一致的深度图融合成一致的几何。", "intro_zh": "远程临场系统里的三维效果，包括运动视差、双眼立体和任意新视角，都建立在同一个量上：每个像素离相机有多远。本模块回答三个问题。第一，深度从哪里来：被动的双目或多视角匹配、单目网络、主动传感器。第二，深度有多不准：误差随距离的平方增长；在遮挡边缘、弱纹理和高光处会失效；逐帧独立估计会闪烁。第三，怎样把多张彼此矛盾的深度图融合成在视角和时间上都一致的几何，也就是 TSDF。\n\n两篇锚点论文正好代表两种对待深度的方式。\n\nHa et al. 把深度当作外部输入。每个视角每帧先由 RAFT-Stereo 在“人工挑选的图像对”上估计深度（训练集 ScanNet 则直接用传感器深度），再用颜色差分掩码做时间滤波，最后用 Project Starline 式的 image-based TSDF 融合出目标视角的一致深度。它的主要失败（Sec. 4.6 / Fig. 9：高光区域的 EPI 断裂）来自深度前端，它没计入的开销（Table 4 不含立体匹配时间）也在深度前端。\n\nQuark 不需要任何深度输入。它在目标视锥里按等视差放置 24 个初始层，把图像特征反投影上去，这本质上是学习式的平面扫描；然后用 render-and-refine 迭代出分层深度。深度只是渲染损失的副产品，从未被直接监督。\n\n学完本模块，你应该能做到：\n(1) 用 Z=fb/d 和 σ_Z≈Z²σ_d/(fb) 估算任意相机阵列的深度误差，并判断 Ha 的 τ=0.02 m 是否合理；\n(2) 看懂 Quark 为什么说 update feature Δ “类似平面扫描体”；\n(3) 逐行复现 Ha 附录 A.1–A.2 的 TSDF raymarch，并识别其中的符号约定问题和步长隐患；\n(4) 知道什么时候该用传感器、立体、单目或视频深度模型，以及它们各自会带来什么伪影（飞点、尺度漂移、闪烁）。\n\n建议主线按 d-stereo → d-mvs → d-tsdf 精读，d-mono、d-flow、d-sensors 作为横向补充。", "study_tips_zh": "1) 手算误差曲线。取 f=1000 px、b=0.2 m、σ_d=0.25 px，画出 Z 从 0.5 m 到 6 m 的 σ_Z=Z²σ_d/(fb) 曲线，再画一条 τ=0.02 m 的水平线。两者交点约在 4 m，由此可以体会 Ha 的固定公制截断为什么对户外远景不友好。\n\n2) 立体匹配。对同一对校正图像分别跑 OpenCV StereoSGBM 和 RAFT-Stereo 官方代码（github.com/princeton-vl/RAFT-Stereo），做左右一致性检查，把不一致的像素标红。再找一张含镜面或玻璃的图，比较两者失败的方式。\n\n3) 平面扫描。用 NumPy 写一个三视角平面扫描（约 50 行）：对每个深度平面用单应做 warp，以 RGB 方差为代价，WTA 取深度。分别用等深度和等视差各放 32 个平面，对比近处物体边缘的阶梯感。\n\n4) TSDF。照 Ha 附录 A.1 实现 image-based TSDF raymarch。s_k 统一取“表面前方为正”，也就是 D_k − z_k。输入 2–4 张深度图（ScanNet 帧或自己渲染的合成场景），扫描 τ ∈ {0.5, 2, 8} cm，并对比开关置信权重的效果，观察零交叉的位置和飞点被压制的程度。步进时设一个最小步长（如 1 mm），并把 s≤0 都当作“已越过表面”，然后比较原文未归一化的 s 与除以 Σω 的归一化版本在步数和漏检率上的差别（原因见 d-tsdf 的例题与易错点）。再用 Open3D 的体素 TSDF 做对照，比较内存和速度。\n\n5) 时间一致性。用 Depth Anything V2 逐帧处理一段固定机位的视频，画出背景上某个像素的深度随时间的变化。再换成 Video Depth Anything，或者套用 Ha 的差分掩码 EMA，比较两者的标准差。最后用 RAFT 光流计算 Lai et al. 的 warping error。\n\n6) 传感器。如果手边有 RealSense、Azure Kinect 或 iPhone LiDAR，拍一只挡在墙前的手，把深度反投影成点云并从侧面观察，找出飞点形成的“幕帘”。然后用深度梯度阈值或 Ha 式的 7×7 局部方差权重把它们压下去。\n\n7) 对照精读。把 Ha 的 Sec. 3.2 和附录 A.1–A.2、Starline 的 §4.6 “Raycasting for geometry fusion”、Curless & Levoy 1996 三者对照着读；再把 Quark 的 Sec. 3.2.2–3.2.3 与 Collins 1996、MVSNet 对照着读。每读一段，都用本模块的公式把论文里的数字重新算一遍。", "concepts": [{"id": "d-stereo", "name_zh": "双目立体匹配：从 SGM 到 RAFT-Stereo", "name_en": "Stereo matching: from SGM to RAFT-Stereo", "tldr_zh": "在校正后的左右图同一行上找对应像素得到视差 d，再用 Z=fb/d 换算成深度。经典方法（SGM）靠“匹配代价 + 平滑先验”，学习方法（RAFT-Stereo）靠“相关体 + 迭代更新”。两者都会在遮挡、弱纹理和高光处失败，误差也都随深度的平方增长。", "intuition_zh": "两台相机从不同位置看同一点，这个点在两张图里的位置会有偏移，这个偏移就是视差。校正（rectification，见 g-epipolar）把两张图变换到对应点位于同一行的状态，于是原本的二维搜索变成一维：对左图每个像素，只需沿同一行在右图里找最像的那个像素。物体越近视差越大，越远越小，关系是 d=fb/Z。\n\n“最像”要靠匹配代价来衡量，常用的有像素绝对差（AD）、窗口平方差（SSD）、归一化互相关（NCC）和 Census 变换。对每个像素、每个候选视差都算一次代价，就得到 H×W×D 的代价体（cost volume）。如果每个像素只取代价最小的视差（winner-take-all），结果会在白墙这类弱纹理区、格子衬衫这类重复纹理区以及高光处乱跳，因为那里的代价曲线要么很平坦，要么有多个极小值。SGM（Hirschmüller 2008）的办法是在代价体上沿 8 或 16 个方向各做一次一维动态规划，相邻像素视差变化 1 时罚 P1，跳变更大时罚 P2。这样就以接近线性的时间（与代价体大小 H×W×D 成正比）引入了近似全局的平滑先验。因为计算规则、易于并行，SGM 及其变体至今仍是许多嵌入式和 FPGA 立体实现的基础。\n\n学习式立体用 CNN 特征取代手工代价。GC-Net 和 PSMNet 构建 4D 特征代价体，用 3D 卷积做正则化，再用 soft-argmin 回归视差。RAFT-Stereo（Lipson et al., 3DV 2021）沿用光流网络 RAFT 的思路：对同一行里所有像素对的特征求点积，得到 H×W×W 的 3D 相关体，并构建 4 级金字塔；视差从 0 开始，由 1/8、1/16、1/32 三个分辨率上互相连接的卷积 GRU 反复“查表、更新”（训练时迭代 22 次，评测默认 32 次），最后用凸组合上采样到全分辨率。发表时它在 Middlebury 榜单排名第一，在 ETH3D 双目榜上超过所有已发表方法，而且只用合成数据（SceneFlow）训练就有很好的零样本泛化。Ha et al. 正是选它为每个视角生成深度。\n\n网络再强，也消除不了立体的几个根本限制。(a) 深度误差 σ_Z≈Z²σ_d/(fb)，远处必然不准。(b) 半遮挡区域只有一台相机看得到，根本不存在对应点，网络只能靠猜，常把前景的视差涂到背景上（edge fattening），反投影后就成了飞点。(c) 镜面和高光违反 Lambertian 假设：两台相机看到的反射其实是位于“镜子后面”的虚像，虚像的深度还会随视点变化。(d) 逐帧独立估计会让同一面静止的墙每帧抖动几毫米到几厘米。置信度通常靠左右一致性检查或代价曲线的尖锐程度来估计；RAFT-Stereo 本身不输出置信度。", "analogy_zh": "两个人站在不同位置，各自伸手指向远处同一棵树。两根手指的方向相差越大，树就越近。立体匹配要做的，就是在另一个人的视野里认出同一棵树。如果树前挡着路灯（遮挡），所有树都长得一样（重复纹理），或者看到的其实是湖面上的倒影（高光），这种找法就会出错。", "equations": [{"tex": "Z = \\frac{f\\,b}{d}, \\qquad \\sigma_Z \\approx \\left|\\frac{\\partial Z}{\\partial d}\\right|\\sigma_d = \\frac{Z^2}{f\\,b}\\,\\sigma_d", "explain_zh": "Z 是深度（米）；f 是焦距（像素），必须与视差所在的图像分辨率一致；b 是基线，即两个相机光心之间的距离（米）；d 是视差（像素）；σ_d 是视差估计的标准差（像素），好的立体算法约为 0.1–0.5 px；σ_Z 是由此引起的深度标准差。第二式是对 Z=fb/d 求导得到的一阶误差传播：深度误差随 Z² 增长，与基线和焦距成反比。"}, {"tex": "L_r(\\mathbf{p},d) = C(\\mathbf{p},d) + \\min\\Big(L_r(\\mathbf{p}-\\mathbf{r},d),\\; L_r(\\mathbf{p}-\\mathbf{r},d-1)+P_1,\\; L_r(\\mathbf{p}-\\mathbf{r},d+1)+P_1,\\; \\min_i L_r(\\mathbf{p}-\\mathbf{r},i)+P_2\\Big) - \\min_k L_r(\\mathbf{p}-\\mathbf{r},k),\\qquad S(\\mathbf{p},d) = \\sum_{\\mathbf{r}} L_r(\\mathbf{p},d)", "explain_zh": "SGM 的路径代价。p 是当前像素；r 是扫描方向（8 或 16 个方向之一），p−r 是该方向上的前一个像素；C(p,d) 是像素 p 取视差 d 时的局部匹配代价（如 Census 距离）；L_r 是沿方向 r 累积的路径代价；P_1 惩罚相邻像素视差相差 1 的情况，这是个小惩罚，用来容许斜面；P_2 惩罚大于 1 的跳变，只有在真实的深度边界上才值得付出。式末减去 min_k L_r(p−r,k) 只是为了防止数值无限增长，不改变最优解。S(p,d) 是所有方向求和后的聚合代价，最终视差取 argmin_d S(p,d)。"}, {"tex": "C_{ijk} = \\sum_{h} f_{ijh}\\, g_{ikh},\\qquad \\mathbf{d}_{n+1} = \\mathbf{d}_n + \\Delta\\mathbf{d}_n,\\qquad \\mathcal{L} = \\sum_{n=1}^{N}\\gamma^{N-n}\\,\\lVert \\mathbf{d}_{gt} - \\mathbf{d}_n \\rVert_1", "explain_zh": "RAFT-Stereo 的三个核心式子（相关体是原文 Eq. 1，损失是 Eq. 2；中间的迭代更新式是对文字描述的概括）。f 和 g 是左、右图的 CNN 特征图，分辨率为原图的 1/4 或 1/8，通道数为 256；下标 i 是行，j 是左图的列，k 是右图的列，h 是通道。C∈R^{H×W×W} 是同一行内所有像素对的特征点积，即相关体；再沿最后一维（右图列）反复做核为 2、步长为 2 的一维平均池化，得到 4 级金字塔。d_n 是第 n 次迭代的视差场，初值 d_0=0；Δd_n 是卷积 GRU 根据三类信息预测的增量：在当前视差附近从金字塔里查到的相关值、上下文特征和隐状态。损失对所有中间结果都加监督，γ=0.9 使越靠后的迭代权重越大；N 是训练时的迭代次数（最终模型为 22），评测默认迭代 32 次（ETH3D 最终提交用了 80 次）。"}, {"tex": "\\big|\\, d_L(x,y) - d_R\\big(x - d_L(x,y),\\, y\\big) \\big| \\le \\epsilon", "explain_zh": "左右一致性检查。d_L 和 d_R 分别是以左图、右图为参考估计出的视差图。把左图像素按它的视差移到右图，再读取右图在该位置估计的视差，两者应当一致，ε 通常取 1 px。不满足的像素多半对应遮挡、误匹配或高光，应标为无效或降低其置信度。"}], "worked_example_zh": "设想从一个相机阵列中选出一对相机（数值为示意）：f=1000 px（按处理分辨率计），b=0.20 m，σ_d=0.25 px。\n(1) 人在 Z=2 m 处：d=fb/Z=100 px；σ_Z=2²/(1000×0.2)×0.25=0.005 m=5 mm，远小于 Ha 的截断距离 τ=0.02 m。\n(2) 背景墙在 Z=5 m 处：d=40 px；σ_Z=25/200×0.25≈0.031 m=3.1 cm，已经超过 τ；而在 Z=1 m 处只有 1.25 mm。这就是固定的公制 τ 对远景不友好的原因。\n(3) 如果先把图像下采样 2 倍再跑立体，f 和 d 都减半；若 σ_d 按新像素计仍为 0.25 px，σ_Z 就翻倍。\n(4) 手算一步 SGM（P_1=1，P_2=4）。前一像素的路径代价为 L(p−r,·)=[4,0,4,8]，说明它很确定 d=1。当前像素在白墙上，局部代价 C(p,·)=[1,1.5,1,3]：d=0 和 d=2 一样好，WTA 只能随机挑一个。代入公式，min_k L(p−r,k)=0：\n• d=0：1+min(4, 0+1, 0+4)−0=2\n• d=1：1.5+0=1.5\n• d=2：1+1=2\n• d=3：3+min(8, 4+1, 4)=7\n仅沿这一个方向，d=1 就以 1.5 胜出；完整的 SGM 还要把 8 或 16 个方向的 L_r 相加成 S(p,d) 再取 argmin。平滑先验把邻居的判断传进了无纹理区。RAFT-Stereo 的多分辨率 GRU 想更高效地做同一件事：在 1/32 分辨率上迭代一步，信息就能传过一大片白墙。", "pitfalls_zh": ["视差以像素为单位，依赖分辨率和校正。RAFT-Stereo 输出的是校正后图像上的视差，换算深度必须用校正后的 f 和真实基线 b。基线误差 1% 会让所有深度按比例偏差 1%，直接破坏 Ha 这种依赖公制 τ 的融合。相机阵列一般没有预先校正，需要逐对校正、估计，再把深度映射回原视角。Ha 的论文没有交代这一流程，也没说明“人工挑选的立体对”是如何选的。", "单帧看起来好，不代表能直接用于视频。逐帧独立的立体网络在静止区域也会有毫米到厘米级的抖动，渲染出来就是闪烁。这正是 Ha 需要差分掩码滤波的原因，也是 Stereo Any Video、PPMStereo 等视频立体方法要解决的问题（见 a-learned-stereo）。", "遮挡边缘的视差会外溢。无论是窗口代价，还是网络的上采样，都会在深度边界处把前景和背景混在一起，得到介于两者之间的深度，反投影后就成了悬在空中的飞点。使用前应做左右一致性检查，或按边缘置信度降权；Ha 的 7×7 局部方差权重间接实现了这一点。", "高光和透明物体会误导匹配。算法匹配到的是反射虚像或透明物体后面的东西，而且不同立体对会给出不同答案，多视角融合就在这些答案之间跳变。Ha Sec. 4.6 / Fig. 9 中的 EPI 断裂就是这种情况。"], "in_quark": {"used": false, "where": "无显式立体模块；Sec. 3.2.2 的迭代更新与 Sec. 3.3 的注意力隐式承担匹配", "how_zh": "Quark 没有任何显式的双目匹配、代价体或视差输出。它的输入是 8 张 RGB 和相机位姿，匹配线索隐含在 One-to-many attention 中；Sec. 3.3 原文说这种注意力 implicitly incorporating both image matching cues and occlusion。\n\n理解双目仍然有两点帮助。\n(1) Quark 的 5 次 Update & Fuse（Sec. 3.2.2）与 RAFT-Stereo 的迭代 GRU 属于同一类学习式迭代细化（见 l-iterative）：都是按当前几何去查找或渲染，再比较，再预测增量。区别在于 RAFT-Stereo 查的是相关体，Quark 则把当前中间 LDM splat 回各输入视角、over 合成出 Ĩ，再与该视角的观测特征比较。\n(2) 双目在高光处的失败，在 Quark 里换了一种表现形式。Quark 为每个目标视角单独求解 LDM 的深度、密度和混合权重，这种“按视角优化”让它能较好地复现部分反射和折射（Sec. 1、Sec. 4.3；NeX-Shiny 上 1024×768 为 26.51 dB）；但几何不跨视角、跨帧共享，逐帧独立重建本身会闪烁（Sec. 4.3），目标相机移动导致输入相机切换时也会闪烁（Sec. 4.1）。"}, "in_ha": {"used": true, "where": "Sec. 3 方法概述；Sec. 4 开头的实现细节段与附录 A.5；Sec. 4.6 / Fig. 9；Table 4", "how_zh": "每个输入视角每帧的深度 D_n^t 由 RAFT-Stereo 在“人工挑选的图像对”上估计，用于 DyNeRF 和 Google Spaces；ScanNet 则用传感器深度。这些深度是整个方法的地基：Sec. 3.1 用它把像素反投影成 3D Gaussian，Sec. 3.2 用它构建 TSDF。\n\n有三点必须知道。\n(1) Table 4 只列出 forward-splatting、TSDF、blending 三个阶段（10+6+23 ms），不包含 RAFT-Stereo 的耗时。Eq. 2 要对全部 N 个输入视角维护时间滤波状态，所以在 1352×1014 分辨率下，每帧都要为阵列中的每台相机（DyNeRF 测试场景最多 22 台）估计深度，这很可能是真实系统里最大的开销。\n(2) 作者在 Sec. 4.6 承认方法依赖准确的几何，在深度通常很差的高光区域会失败，Fig. 9 中表现为 EPI 断裂。这是立体匹配的 Lambertian 假设被破坏后，误差传到 TSDF 的结果。\n(3) RAFT-Stereo 不输出置信度，Ha 只能用深度图的 7×7 局部方差（附录 A.1 Eq. 11–12）间接估计可信度。\n\n如果不了解立体匹配的误差特性，就无法理解 τ 为什么取 2 cm、为什么还需要时间滤波、为什么在高光处会崩溃。"}, "in_field_zh": "立体是远程临场系统最常见的深度来源。Project Starline（Lawrence et al. 2021，§4.3）认为商用 RGBD 相机分辨率不足、在深度边界附近质量差，于是自建 3 个采集舱，每舱用一对 1280×1024 的近红外相机做主动 spacetime stereo（ESPReSSo，Nover et al. 2018），以 60 Hz 输出深度。Tele-Aloha 只用 4 台 RGB 相机，核心是一个级联视差估计器；GPS-Gaussian 则把深度估计模块与 Gaussian 参数回归联合训练。对系统设计来说，立体匹配决定了三项预算：由 Z² 定律决定的基线与精度，帧率与延迟（RAFT-Stereo 评测用 32 次迭代，实时版在 1248×384 下为 26 FPS），以及时间稳定性（逐帧立体还是视频立体）。进一步阅读见 a-learned-stereo。", "resources": [{"title": "Szeliski, Computer Vision: Algorithms and Applications (2nd ed.), Ch. 12 Depth estimation", "url": "https://szeliski.org/Book/", "type": "book", "note_zh": "免费 PDF。§12.1 讲对极几何与校正，§12.3–12.5 讲稠密对应、局部方法和全局优化（含 SGM 一类方法），§12.6 讲深度网络。"}, {"title": "CMU 16-385 Computer Vision, Lecture 13: Stereo", "url": "https://www.cs.cmu.edu/~16385/lectures/lecture13.pdf", "type": "course", "note_zh": "从视差与深度的关系、窗口匹配一直讲到能量最小化，图示直观，适合在读论文之前先过一遍。"}, {"title": "Stereo Processing by Semiglobal Matching and Mutual Information (Hirschmüller, TPAMI 2008)", "url": "https://doi.org/10.1109/TPAMI.2007.1166", "type": "paper", "note_zh": "SGM 原论文，讲清了路径代价、P1/P2 惩罚和多方向聚合，是理解代价体加平滑先验的范本。"}, {"title": "RAFT-Stereo: Multilevel Recurrent Field Transforms for Stereo Matching", "url": "https://arxiv.org/abs/2109.07547", "type": "paper", "note_zh": "Ha et al. 的深度来源。重点读 Sec. 3（3D 相关体、多级 GRU、凸组合上采样）和实时版本；代码见 https://github.com/princeton-vl/RAFT-Stereo 。"}], "self_check": [{"q_zh": "f=1200 px、b=0.1 m、σ_d=0.3 px 时，Z=3 m 处的 σ_Z 是多少？如果要在 3 m 处达到 5 mm 的精度，基线至少要多大？", "a_zh": "σ_Z=Z²σ_d/(fb)=9×0.3/(1200×0.1)=2.7/120=0.0225 m，即 2.25 cm。要达到 0.005 m，需要 b=Z²σ_d/(f·σ_Z)=2.7/(1200×0.005)=0.45 m。代价是遮挡区域变大、两个视角的外观差异变大，匹配更难。"}, {"q_zh": "SGM 的 P_2 为什么要比 P_1 大？为什么又常根据图像梯度自适应地减小 P_2？", "a_zh": "P_1 容许斜面上视差逐像素缓慢变化；P_2 惩罚视差跳变，只有在真实的深度边界处才值得付出。深度边界通常与颜色边界重合，所以在强梯度处降低 P_2，允许视差在那里跳变，而在均匀区域保持强平滑。"}, {"q_zh": "Ha et al. 在高光区域失败时，为什么单帧仍然看起来合理，而一旦播放视频或切换视角就出现断裂？", "a_zh": "单帧里，融合网络可以通过调整权重和背景图把颜色拼得合理。但在高光处，立体深度对应的是随视点变化的反射虚像，不同立体对、不同的 K 集合会给出不一致的深度。TSDF 的零交叉随之跳变，引导深度在时间和视角上都不稳定，于是 EPI 出现断裂（Sec. 4.6、Fig. 9）。"}], "prereqs": ["g-epipolar", "g-depth"]}, {"id": "d-mvs", "name_zh": "多视角立体（MVS）与平面扫描", "name_en": "Multi-view stereo & plane sweep", "tldr_zh": "把双目推广到 N 个视角：先假设一组深度（一叠平面），把所有视角 warp 到参考视角或目标视角，看哪个深度上各视角的颜色或特征最一致。平面扫描把这种“假设—检验”组织成规整的体数据，它也是 Quark 内部特征体的原型。", "intuition_zh": "双目只比较两张图，MVS 同时利用多张图。多出来的视角带来两个好处：弱纹理处有更多约束；某个视角被遮挡时，总有别的视角能看到。MVS 的核心量是光度一致性（photo-consistency）：如果三维点 X 确实在物体表面上且没被遮挡，那么在所有能看到它的视角里，它投影出的颜色应当相同（Lambertian 假设）。MVS 就是在所有候选三维点中，找出光度一致性最好的那些。\n\n平面扫描（plane sweep，Collins 1996）把候选三维点组织得很规整。在参考相机（或要合成的目标相机）前方放一叠平行于成像面的平面 d_1…d_D。对每个平面，用平面诱导单应把每张输入图 warp 到参考视角；这只是一次 2D 图像变换，在 GPU 上很快。这样就得到 H×W×D（再乘 N 个视角）的平面扫描体（PSV）：对某个像素而言，在正确深度的那个平面上，N 个 warp 后的颜色应当一致。沿 D 维为每个像素挑出一致性最好的平面，就得到了深度。平面按等视差（逆深度）而不是等深度排列，因为像素位移与 1/Z 成正比（见 g-depth）。\n\n学习式 MVS 的代表是 MVSNet（Yao et al., ECCV 2018）。它把颜色换成 CNN 特征，以 N 个视角特征的方差作为代价，这个代价与视角数量和顺序无关；再用 3D CNN 正则化代价体，沿深度维 softmax 得到每个像素的深度概率，取期望得到亚平面精度的深度。平面扫描同样是学习式新视角合成的起点：DeepStereo（Flynn et al. 2016，Flynn 也是 Quark 的一作）直接把 PSV 送进网络预测新视角；Stereo Magnification 的 MPI 可以看成在每个平面上存 RGBA 的扫描体；Quark 的初始化和每一次 Update 都在目标视锥内做特征反投影，是学习式平面扫描的变体。\n\n可见性（visibility）是 MVS 的第二个核心问题。发生遮挡时，有些视角看到的是前景，把它们计入一致性就会污染代价。经典方法靠深度排序、视角选择或鲁棒统计来处理；MVSNet 的方差代价不显式处理遮挡；Quark 让注意力对视角做软选择，同时把当前 LDM 渲染回每个输入视角、与观测比较，从而得到“这个视角在此处是否被遮挡”的线索。最后，多个参考视角的深度图还要经过几何一致性检查并融合，这一步衔接 d-tsdf。", "analogy_zh": "在暗房里用 N 台幻灯机，把 N 张照片同时投到一块可以前后移动的屏幕上。屏幕移到某个距离时，某个物体在所有投影里恰好重合成一个清晰的像；在其它距离上看到的都是重影。平面扫描就是把这块屏幕从近到远扫一遍，记下每个像素在哪个位置重影最少。", "equations": [{"tex": "H_i(d) = \\mathbf{K}_i\\Big(\\mathbf{R}_i + \\frac{\\mathbf{t}_i\\,\\mathbf{n}^{\\top}}{d}\\Big)\\mathbf{K}_{\\mathrm{ref}}^{-1}", "explain_zh": "平面诱导单应，是一个 3×3 矩阵，把参考视角的像素（齐次坐标）映射到第 i 个视角的像素。平面在参考相机坐标系中写作 n^T X = d；对 fronto-parallel 平面，n=(0,0,1)^T，d 就是平面的深度。R_i、t_i 是从参考相机坐标到第 i 个相机坐标的旋转和平移（X_i = R_i X + t_i）；K_ref、K_i 是两台相机的内参。推导：平面上的点满足 n^T X/d = 1，因此 R_i X + t_i = (R_i + t_i n^T/d) X。对每个 d 用 H_i(d) 对第 i 张图采样，就得到它在该平面上的 warp 结果。"}, {"tex": "\\mathbf{C}(\\mathbf{p},d) = \\frac{1}{N}\\sum_{i=1}^{N}\\big(\\mathbf{V}_i(\\mathbf{p},d) - \\bar{\\mathbf{V}}(\\mathbf{p},d)\\big)^{2}", "explain_zh": "MVSNet 的方差代价。V_i(p,d) 是第 i 个视角的特征图经 H_i(d) warp 到参考视角后，在像素 p 处的特征向量；V̄ 是 N 个视角的均值；平方按元素计算，所以 C 仍是一个 C 维向量，之后由 3D CNN 压成标量代价。方差小说明各视角一致，这个深度可能正确。该代价与视角顺序无关，可以接受任意 N。"}, {"tex": "P(\\mathbf{p},d) = \\mathrm{softmax}_d\\big(-\\tilde{C}(\\mathbf{p},d)\\big),\\qquad \\hat{D}(\\mathbf{p}) = \\sum_{d} d\\,P(\\mathbf{p},d)", "explain_zh": "C̃ 是经 3D CNN 正则化后的代价；沿深度维做 softmax 得到概率体 P（MVSNet 直接对正则化网络的输出做 softmax，“代价越小概率越大”的符号由网络学到，这里写成 −C̃ 只是为了强调这一点）；D̂ 是深度的期望（soft argmin），它可微，能给出落在两个平面之间的亚平面深度。P 的峰值越尖锐，置信度越高：MVSNet 取最近 4 个深度假设的概率之和作为置信度，低于 0.8 的像素视为外点。"}, {"tex": "d_\\ell = \\Big[\\Big(\\delta_\\ell + \\frac{0.5}{L}\\tanh(\\mathbf{V}W_d)\\Big)\\Big(\\frac{1}{\\eta} - \\frac{1}{f}\\Big) + \\frac{1}{f}\\Big]^{-1},\\qquad \\delta_\\ell = \\frac{\\ell - 0.5}{L}", "explain_zh": "Quark 的 Eq. 3–4。L 是层数（初始为 24），ℓ=1…L；η、f 是目标视锥的近、远平面，由 SfM 点的深度分布逐样本设定；δ_ℓ 是第 ℓ 个等视差带的中心（归一化视差，取值 0–1）；V W_d 是特征体经线性层得到的逐像素偏移，tanh 把它限制在 ±0.5/L 以内，也就是说每层只能在自己那条视差带内移动；最外层的倒数把视差变回深度。当 tanh 项为 0 时，这就是一组经典的等视差平面扫描平面。注意编号方向：ℓ=1 时归一化视差最小，是离相机最远的一层；ℓ=L 是最近的一层。"}], "worked_example_zh": "(1) 为什么按逆深度放平面。参考相机 f=1000 px，另一视角相对它做纯水平平移 b=0.1 m。深度为 d 的 fronto-parallel 平面诱导的水平位移是 fb/d：\n• d=1 m 时为 100 px，d=1.1 m 时为 90.9 px，两个平面相差 9.1 px；\n• d=10 m 时为 10 px，d=11 m 时为 9.09 px，只差 0.9 px。\n等深度间隔在远处几乎分辨不出，在近处又太粗，所以平面要按 1/d 等间隔放置。\n(2) 代入 Quark 的 Eq. 3–4。设 η=1 m、f=100 m、L=24，tanh 项为 0，归一化视差为 δ_ℓ(1/η−1/f)+1/f。ℓ=1 到 24 的初始平面深度依次为：32.7, 13.9, 8.84, 6.48, 5.11, 4.22, 3.60, 3.13, 2.77, 2.49, 2.26, 2.07, 1.90, 1.76, 1.64, 1.54, 1.45, 1.37, 1.29, 1.23, 1.17, 1.12, 1.07, 1.02 m。其中一半（12 层）落在 2 m 以内，只有 2 层在 10 m 以外，这就是等视差采样的效果。每层只能在自己的带内移动：最远一层的带覆盖 19.5–100 m，最近一层只覆盖 1.00–1.04 m。所以如果 η、f 设错，表面会落到所有带之外，无法表达。\n(3) 代价体有多大。MVSNet 在 DTU 上训练时，深度假设从 425 mm 到 935 mm，间隔 2 mm，共 D=256 个平面。以 640×512 的裁剪图为例，1/4 分辨率是 160×128，特征 32 通道，代价体约有 160×128×256×32≈1.7 亿个数。所以才需要级联方案（如 CasMVSNet），或者像 Quark 那样先在 36×64、24 层的极低分辨率上扫描，再逐级升分辨率、降层数。", "pitfalls_zh": ["区分参考视角和目标视角。MVS 通常在某个输入（参考）相机里建代价体，输出的是该相机的深度；新视角合成（DeepStereo、MPI、Quark）则在要渲染的目标相机视锥里建体。读 Quark 时不要把它的 LDM 当成某个输入相机的深度图。", "光度一致性依赖 Lambertian 假设和可见性。高光、透明物体、曝光不一致的相机会让正确深度处也显得不一致；被遮挡的视角会让正确深度处的方差变大。如果只把所有视角简单平均（取均值或方差）而不做可见性推理，物体边界处就会出错。Quark 的消融显示，把注意力退化为均值后，PSNR 从 30.41 降到 29.73。", "平面数、分辨率和内存是乘积关系（H×W×D×C），所以必须用由粗到细、级联或稀疏假设。平面太少则会出现阶梯状的深度和 MPI 式的分层伪影。", "近、远平面必须覆盖整个场景，落在等视差带之外的物体无法表示。Quark 依赖 SfM 点逐场景设定 [η, f]；实时系统需要另外在线估计这两个值。"], "in_quark": {"used": true, "where": "Sec. 3.2.2 Iterative Updates（Learned Initialization、Update Block、Backproject）；Sec. 3.2.3 Eq. 3–4；Sec. 3.3；Sec. 4.2 消融", "how_zh": "Quark 的几何求解本质上是学习式平面扫描加迭代细化。\n• 初始化：层深度取等视差锚点（Quark 为 24 层×36×64，Quark+ 为 32 层×54×96），把编码后的图像特征反投影到这些平面上，得到目标视锥内的特征平面扫描体。\n• 每次 Update & Fuse：用当前已经弯曲的层深度，把每个视角的 update feature 反投影回层空间，得到 Δ。原文明确说 Δ bears some similarity to a plane sweep volume；Δ 同时还编码了渲染图 Ĩ 与观测 I_k 比较所得的可见性信息。\n• One-to-many attention：以单个 query 对 M=8 个视角的 Δ 做交叉注意力，相当于可学习的光度一致性加可见性选择。\n• Eq. 3–4：把每层限制在自己的等视差带内。\n\n与 MVSNet 的关键区别在于，Quark 没有任何深度监督，损失只有 10·L1+LPIPS（Sec. 3.4）。深度是为了把图渲染好而涌现出来的，所以在高光或无纹理处可能出现几何错误但渲染正确的情况。"}, "in_ha": {"used": false, "where": "没有 MVS 匹配；附录 A.1 的 image-based TSDF 相当于 MVS 流程中的深度图融合阶段", "how_zh": "Ha 的深度来自两视角立体（RAFT-Stereo）或传感器，没有构建多视角代价体。但它的 image-based TSDF 与 MVS 流程的后半段同构：把目标射线上的点投影到 K 个视角，比较该点在视角中的深度 z_k 与该视角的观测深度 D_k。这可以看作 MVSNet 后处理中几何一致性检查的连续版本：MVSNet 用重投影误差阈值筛点，Ha 则把截断有符号距离加权求和。此外，融合网络输入里的两类特征（输入射线与 TSDF 法线的点积、输入视线与目标视线的点积，见附录 A.4）也是经典 MVS 视角选择中常用的几何线索。"}, "in_field_zh": "平面扫描是实时多视角系统里对 GPU 最友好的几何求解方式，因为每个平面只需要一次单应 warp。学习式 NVS 从 DeepStereo、Stereo Magnification（MPI）、DeepView 一直到 Quark，都保留了这个骨架；可泛化 NeRF（MVSNeRF、ENeRF）用 MVSNet 式代价体来引导采样，其中 ENeRF 还是 Quark 与 Ha 共同的 baseline。在远程临场中，可见性推理尤其重要：手臂和头发频繁遮挡身体，一旦可见性判断出错，前景颜色就会被涂到背景上。Ha Fig. 7 中 ENeRF、GPS-Gaussian 的前景颜色溢出就是这类问题。进一步阅读见 a-learned-mvs、a-layered-nvs。", "resources": [{"title": "Multi-View Stereo: A Tutorial (Furukawa & Hernández, Foundations and Trends in CGV, Vol. 9, No. 1-2, 2013; 2015 年出版)", "url": "https://carlos-hernandez.org/papers/fnt_mvs_2015.pdf", "type": "book", "note_zh": "免费 PDF。第 2 章讲光度一致性（2.1 一致性度量，2.2 可见性估计）；第 3 章的 3.1 讲深度图重建，3.3 讲体积数据融合。"}, {"title": "Szeliski, Computer Vision (2nd ed.), §12.1.2 Plane sweep & §12.7 Multi-view stereo", "url": "https://szeliski.org/Book/", "type": "book", "note_zh": "平面扫描与 MVS 的教科书讲解，§12.7.2 讲体积与三维表面重建，可接着读 d-tsdf。"}, {"title": "A space-sweep approach to true multi-image matching (Collins, CVPR 1996)", "url": "https://doi.org/10.1109/CVPR.1996.517097", "type": "paper", "note_zh": "平面扫描的原始论文，思想非常简单，适合手工复现。"}, {"title": "MVSNet: Depth Inference for Unstructured Multi-view Stereo", "url": "https://arxiv.org/abs/1804.02505", "type": "paper", "note_zh": "学习式 MVS 的奠基之作：可微单应 warp、方差代价、soft argmin，以及基于概率和几何一致性的深度图过滤。"}], "self_check": [{"q_zh": "为什么说 MPI（Stereo Magnification）本质上是一个平面扫描体？它和 MVSNet 的代价体有什么不同？", "a_zh": "两者都在一叠 fronto-parallel 的等视差平面上组织信息，都通过单应把输入图映射到这些平面。区别在于存的内容：MVSNet 的代价体存各视角在某个深度上是否一致，最后取 argmin 或期望，为每个像素得到一个深度；MPI 存每个平面的 RGBA，渲染时用 over 合成，不需要选出唯一的深度，因此能表达半透明和软边界，但需要很多层。Quark 的 LDM 介于两者之间：层数少，每层带有可弯曲的深度、密度和混合权重。"}, {"q_zh": "用 N 个视角特征的方差作为代价，当某个视角被遮挡时会发生什么？Quark 用什么机制缓解？", "a_zh": "被遮挡的视角在正确深度处看到的是前景，它的特征与其它视角差异很大，方差被抬高，正确深度可能输给错误深度。Quark 用两种机制缓解：One-to-many attention 对各视角加权，可以给被遮挡的视角低权重；每次迭代把当前 LDM 渲染回各输入视角并与观测比较，得到显式的可见性残差。消融中，去掉注意力（退化为均值）PSNR 约降 0.68 dB，去掉 render-and-refine 约降 0.70 dB。"}, {"q_zh": "在 Quark 的 Eq. 4 中，如果近平面 η 设得比场景中最近的物体还远，会发生什么？", "a_zh": "所有层的深度都被限制在 [η, f] 对应的视差区间内，tanh 只允许每层在自己的带内移动，所以比 η 更近的物体不能被任何层表示，只能被压到最近的那一层附近。结果是该物体的视差错误，渲染时出现错位或重影。因此 Quark 需要可靠的逐场景近、远平面（论文用 SfM 点的深度分布来设定），实时系统则需要另外在线估计。"}], "prereqs": ["d-stereo", "g-epipolar"]}, {"id": "d-mono", "name_zh": "单目与视频深度估计", "name_en": "Monocular & video depth estimation", "tldr_zh": "从单张图像或单路视频预测深度，依靠的是从海量数据中学到的先验，而不是几何三角化。它在每个像素上都能给出答案，但通常只确定到一个未知的尺度和偏移（即仿射不变的逆深度），逐帧运行时还会闪烁。", "intuition_zh": "单张照片里没有视差，在几何上无法确定绝对距离：一间真实的客厅和一个 1:10 的精致模型完全可能拍出一模一样的照片。单目深度网络依靠学到的线索来推断相对远近，包括透视、遮挡顺序、纹理梯度、物体的常见尺寸和空气透视。在弱纹理和高光区域，这些线索反而比立体匹配更稳，因为网络不需要寻找对应点。\n\nMiDaS（Ranftl et al., TPAMI 2020）的关键贡献在于训练目标。不同数据集的真值形式不同：有的是公制深度，有的只有相对深度，有的是尺度和偏移都未知的视差（例如来自 3D 电影）。MiDaS 的做法是在视差（逆深度）空间里，先对预测和真值分别做尺度和偏移归一化，再进行比较，即 scale-and-shift-invariant loss。这使它能混合多个数据集训练并获得零样本泛化，代价是输出也只是仿射不变的逆深度：d_pred ≈ s·(1/Z)+t，其中 s、t 对每张图都未知。后续工作沿几个方向推进：DPT 把骨干网络换成 ViT；Depth Anything（CVPR 2024）用约 6200 万张无标注图像做伪标签自训练；Depth Anything V2 用合成数据训练教师模型；Depth Pro、Metric3D、UniDepth 等则尝试直接输出公制深度。\n\n视频带来了另一个问题。逐帧运行单目模型时，同一面静止的墙在相邻帧会得到不同的 s、t，因为网络会随画面内容整体重新归一化，渲染出来就是整体的呼吸和闪烁。Consistent Video Depth Estimation（Luo et al. 2020）在测试时利用 SfM 位姿和光流约束来微调网络。Video Depth Anything（2025）在 Depth Anything V2 的基础上加入时空头和时间梯度一致性损失，可以处理长达数分钟的视频，最小的模型能跑到约 30 FPS。\n\n对多相机远程临场来说，单目深度的主要价值是提供先验。它能填补立体匹配在高光、无纹理和遮挡区域留下的空洞，也能为稀疏甚至单相机的场景提供几何。但每台相机独立预测的相对深度彼此并不一致；要送进 Ha 这样的公制 TSDF，必须逐帧、逐视角地用公制锚点（立体、SfM 点或传感器）求出 s、t。近两年的趋势是把单目先验融入立体或多视角网络：FoundationStereo 用视觉基础模型的单目先验做侧调，Stereo Any Video 把单目视频深度模型的先验与卷积特征结合。这样既保留了几何上的正确性，又利用了先验的完整性（见 a-geo-fm、a-learned-stereo）。", "analogy_zh": "就像看一幅写实油画判断远近：你能说出人在树前、树在山前，也能大致猜出房间有多深；但如果没人告诉你画里门的真实高度，你就说不出以米为单位的距离。而且让你连续看 30 张只略有差别的画，你每次对整体远近的估计都会有些飘。", "equations": [{"tex": "(s^{*},t^{*}) = \\arg\\min_{s,t}\\sum_{i=1}^{M}\\big(s\\,d_i + t - d_i^{*}\\big)^2", "explain_zh": "MiDaS Eq. 2 中的最小二乘对齐。d_i 是第 i 个有效像素的预测视差（仿射不变的逆深度）；d_i^* 是真值视差，也可以是来自立体、SfM 或传感器的公制逆深度 1/Z；M 是有效像素数；s、t 分别是尺度和偏移。这个问题有闭式解（解一个 2×2 线性方程组）。对齐之后，1/(s^*d_i+t^*) 才是以米为单位的深度。"}, {"tex": "\\mathcal{L}_{ssi} = \\frac{1}{2M}\\sum_{i=1}^{M}\\rho\\big(\\hat d_i - \\hat d_i^{*}\\big),\\qquad \\hat{\\mathbf d} = \\frac{\\mathbf d - \\mathrm{median}(\\mathbf d)}{\\frac{1}{M}\\sum_{i}\\lvert d_i - \\mathrm{median}(\\mathbf d)\\rvert}", "explain_zh": "MiDaS 的鲁棒尺度—偏移不变损失（原文 Eq. 1、5、6）。对预测 d 和真值 d^* 分别做两步归一化：减去中位数以去掉偏移，再除以平均绝对偏差以去掉尺度，得到 d̂ 和 d̂^*；然后逐像素比较。ρ 取绝对值；在 L_ssitrim 版本中，每张图丢弃 20% 最大的残差（U_m=0.8M）。结果是网络只需学对相对形状，不必为绝对尺度和偏移负责。"}, {"tex": "Z_i = \\frac{1}{s^{*}d_i + t^{*}},\\qquad \\lvert\\Delta Z\\rvert \\approx Z^{2}\\,\\lvert\\Delta t\\rvert", "explain_zh": "第一式把对齐后的逆深度变回深度。第二式由对 1/x 求导得到：逆深度空间里一个很小的偏移误差 Δt，会被放大 Z² 倍反映到深度上，远处受影响最大。这与立体误差的 Z² 定律同源。"}], "worked_example_zh": "一台固定相机拍一个房间。墙、桌子、人三个锚点由立体或传感器测得深度 4 m、2 m、1.333 m，对应逆深度 q=[0.25, 0.5, 0.75] m⁻¹。\n第 1 帧：单目网络输出的相对视差 p=[0.10, 0.30, 0.50]。最小二乘解得 s=1.25、t=0.125，正好复原 4 m、2 m、1.333 m。\n第 2 帧：人向前走了一步（真值从 1.333 m 变为 1.25 m，逆深度 0.8 m⁻¹），网络对整张图重新归一化，输出变成 [0.12, 0.31, 0.54]；没动的墙和桌子的输出也变了。\n• 如果沿用第 1 帧的 s、t：人 = 1/(1.25×0.54+0.125)=1.25 m，碰巧是对的；但墙 = 1/(1.25×0.12+0.125)=3.64 m，桌子 = 1.95 m。静止的墙向前跳了 36 cm，远超 Ha 的 τ=0.02 m，TSDF 会认为场景变了，渲染时背景就会闪烁。\n• 如果每帧都用静止的锚点（墙、桌子）重新对齐，解得 s=1.316、t=0.092，墙和桌子恢复为 4 m 和 2 m，人为 1.246 m。但前提是每帧都有可靠的公制测量，而那时你其实已经有深度了。\n再看偏移误差的放大：t 偏了 0.02 m⁻¹ 时，墙的深度落在 3.70–4.35 m 之间（约 ±8%），人只落在 1.30–1.37 m 之间（约 ±3%）。", "pitfalls_zh": ["不要把相对深度当成米。MiDaS 和 Depth Anything 的相对深度版本输出的是仿射不变的逆深度，不能直接反投影成点云，也不能直接送进公制 TSDF。所谓 metric 版本，其公制精度也随场景类型变化，需要在目标场景中标定验证。", "对齐要在正确的空间里做。模型在逆深度空间训练，就应在逆深度空间求 s、t；在深度空间拟合会让远处的点主导误差。如果锚点只覆盖近处（例如只有人身上的点），外推到远处背景时误差会很大。", "逐帧处理不等于视频处理。单目模型的整体尺度会随画面内容漂移，产生低频的呼吸式闪烁。Ha 式的颜色差分滤波在静止区每帧仍接收至少 60% 的新深度，只能把这种“图像没变但深度变了”的漂移打个折扣，无法消除，需要视频深度模型或额外的时间约束。", "多个视角之间不一致。每台相机独立预测的单目深度在重叠区域不会自动一致，融合前必须逐视角对齐。另外，单目网络在深度边界处通常过度平滑，反投影后会产生飞点。"], "in_quark": {"used": false, "where": "Sec. 2.3 Single-view Methods（明确划为另一类问题，不做比较）", "how_zh": "Quark 只使用多视角 RGB 和位姿，没有任何单目深度先验。Sec. 2.3 把单图、单目视频、生成式先验以及人体或人头先验的方法都列为另一类问题。\n\n了解单目深度有助于理解 Quark 的失败模式。当最近的 8 个视角覆盖不足时（例如 Deep Blending，见 Sec. 4.1/4.3），Quark 没有先验可以用来补全，只会产生硬边伪影；而单目先验和生成式先验正是后续工作用来补这块短板的手段。另外，Quark 的深度与输入位姿处在同一个（可能是任意的）SfM 尺度下，[η, f] 也来自同一批 SfM 点；它不需要公制尺度，因为它不做 TSDF 那样依赖公制阈值的运算。"}, "in_ha": {"used": false, "where": "Sec. 3 方法概述只列出立体与 RGB-D 两种深度来源", "how_zh": "Ha 的深度来自 RAFT-Stereo 或传感器，没有用到单目深度。如果想把单目或视频深度模型接进来（例如为没有合适立体对的相机提供深度），必须解决三个问题。\n(1) 公制化：TSDF 的 τ=0.02 m 和置信常数 0.001 都是公制量，相对深度必须逐帧、逐视角地对齐。\n(2) 时间一致：Eq. 1–2 的颜色差分滤波假设颜色不变则深度不变，而单目模型恰恰会在颜色不变时整体漂移，至少要换成 Video Depth Anything 这类视频模型。\n(3) 多视角一致：各视角独立预测的相对深度在 TSDF 中互相矛盾，零交叉会随 K 集合变化而跳动。\n\n这也解释了为什么后续工作更倾向于把单目先验融入立体网络（FoundationStereo、Stereo Any Video），而不是直接使用单目深度。"}, "in_field_zh": "单目深度在远程临场中主要有三种用途。(1) 低成本采集：单摄像头或手机上的 2D 转 3D、背景深度估计。(2) 作为立体或多视角网络的先验，补高光、无纹理和遮挡区域（FoundationStereo、Stereo Any Video）。(3) 前馈几何基础模型（DUSt3R、VGGT、Depth Anything 3 等，见 a-geo-fm）把单目与多视角统一起来，并开始同时输出位姿，有望去掉对预标定阵列的依赖。评估单目深度时，不能只看单帧 AbsRel，还要看公制误差、边缘锐度（是否产生飞点）和时间稳定性这三项。", "resources": [{"title": "Foundations of Computer Vision (Torralba, Isola, Freeman), Ch. 43: Learning to Estimate Depth from a Single Image", "url": "https://visionbook.mit.edu/3d_learning.html", "type": "book", "note_zh": "免费在线教材，从单目线索讲到学习方法，适合入门。"}, {"title": "Towards Robust Monocular Depth Estimation: Mixing Datasets for Zero-shot Cross-dataset Transfer (MiDaS)", "url": "https://arxiv.org/abs/1907.01341", "type": "paper", "note_zh": "尺度—偏移不变损失和多数据集混合训练的出处。Sec. 5（Training on diverse data）讲清了为什么要在视差（逆深度）空间里做尺度—偏移不变，Eq. 2 给出最小二乘对齐，Eq. 5–7 给出鲁棒版本。"}, {"title": "Video Depth Anything: Consistent Depth Estimation for Super-Long Videos", "url": "https://arxiv.org/abs/2501.12375", "type": "paper", "note_zh": "分析逐帧单目深度的闪烁问题，并给出时空头与时间梯度一致性损失，适合与 Ha 的时间滤波对照阅读。"}, {"title": "Depth Anything V2 (official code)", "url": "https://github.com/DepthAnything/Depth-Anything-V2", "type": "code", "note_zh": "可直接运行的单目深度基础模型，提供相对深度和公制深度两类权重，适合做 study tips 里的闪烁实验。"}], "self_check": [{"q_zh": "MiDaS 为什么选择在逆深度（视差）空间，而不是深度空间里做尺度—偏移不变？", "a_zh": "一部分训练数据（如 3D 电影、未标定的立体对）只提供尺度和偏移都未知的视差，这个偏移来自未知的基线和主点平移，只有在视差空间里它才是加上一个常数。此外，逆深度对远处（天空、无穷远）的数值是有界的，数值上更稳定。在深度空间里，这样的偏移没有对应的物理意义。"}, {"q_zh": "想用单目深度补 Ha 流程中高光区域的深度空洞，最少需要做哪些处理？", "a_zh": "对每个视角的每一帧，用该视角里可靠区域（立体结果一致、非高光）的公制深度，在逆深度空间求出 s、t 并完成对齐。只在高光和空洞区域用对齐后的单目深度替换，并给它较低的 TSDF 权重。为了时间稳定，改用视频深度模型，或者对 s、t 做时间平滑。同时检查不同视角在重叠区的一致性，避免 TSDF 零交叉随 K 集合跳变。"}, {"q_zh": "同样是 0.02 m⁻¹ 的逆深度偏移误差，对 1 m 处和 5 m 处的物体分别造成多大的深度误差？", "a_zh": "按 ΔZ≈Z²Δt 计算：1 m 处约 2 cm，5 m 处约 25×0.02=0.5 m。精确计算时，5 m 处的深度落在 4.55–5.56 m 之间。可见远景对对齐误差极其敏感。"}], "prereqs": ["g-depth"]}, {"id": "d-flow", "name_zh": "光流、场景流与图像 warping", "name_en": "Optical flow, scene flow & image warping", "tldr_zh": "光流是相邻两帧之间每个像素的二维位移，场景流是与之对应的三维运动。有了位移场，就能把一帧 warp 到另一帧，用于对齐、滤波或度量闪烁。但遮挡处没有对应点，亮度恒定假设也会被光照变化和高光打破。", "intuition_zh": "光流回答的问题是：这个像素下一帧去了哪里。最基本的假设是亮度恒定，即同一个物点在相邻两帧里颜色不变。把这个假设做一阶泰勒展开，每个像素只得到一个方程，却有两个未知数 (u,v)，只能确定沿图像梯度方向的运动分量。这就是孔径问题：透过一个小孔看一条移动的斜线，你分不清它是横着动还是竖着动。因此需要引入平滑先验（Horn–Schunck）或局部窗口假设（Lucas–Kanade），思路与立体匹配的“代价加平滑”相同。事实上，双目立体就是一种特殊的光流：只允许水平位移，而且位移大小由深度决定。\n\nRAFT（Teed & Deng, ECCV 2020）是深度光流的里程碑。它对两帧之间每一对像素的特征求点积，得到多尺度的 4D 相关体；从零流开始，用 GRU 迭代更新，在 KITTI 和 Sintel 上大幅领先。RAFT-Stereo 就是把 RAFT 的 4D 相关体压缩成同一行内的 3D 相关体。所以学会 RAFT，也就读懂了 Ha 的深度来源。\n\n有了光流就可以做 warping，分两种方向。后向 warping：对目标帧的每个像素 x，到源帧的 x+w(x) 处做双线性采样；它不会产生空洞，但需要从目标指向源的流。前向 warping（splatting）：把源帧的每个像素推到 x+w(x)；这会产生空洞（没有像素落到的位置）和冲突（多个像素落到同一位置，需要按深度决定谁在前面）。Ha 用 3D Gaussian 把输入视角前向 splat 到目标相机，Quark 把 LDM 双线性 splat 到各输入视角，都属于同一类操作，只是位移场由深度和相机位姿决定（刚性流），而不是由光流决定。遮挡检测最常用的方法是前向—后向一致性检查：从 A 流到 B 再流回来，应当回到原处；回不来的像素多半被遮挡了。\n\n场景流是三维点的运动向量，光流是它在图像上的投影。对多相机远程临场来说，“人的手移动了多少”要用场景流才能如实描述，RAFT-3D 等方法用 RGB-D 来估计它。时间一致性的评测同样离不开光流：Lai et al.（ECCV 2018）提出的 warping error 用光流把第 t+1 帧的输出 warp 回第 t 帧，在非遮挡区域比较差异，差异越大说明闪烁越严重。", "analogy_zh": "光流就像给视频里每个像素贴一张便利贴，上面写着“我下一帧去这里”。后向 warping 是目标图上的每个格子主动去源图取货，保证每格都有货；前向 warping 是源图上的每个像素送货上门，结果有的门口没人送（空洞），有的门口挤了好几个（冲突），这时要看谁离得近。", "equations": [{"tex": "I_x\\,u + I_y\\,v + I_t = 0", "explain_zh": "光流约束方程，由亮度恒定假设 I(x+u, y+v, t+1) = I(x,y,t) 做一阶展开得到。I_x、I_y 是图像在 x、y 方向的空间梯度，I_t 是时间差分，(u,v) 是待求的位移（单位为像素/帧）。每个像素只有一个方程、两个未知数，只能确定沿梯度方向的法向流 −I_t/|∇I|，这就是孔径问题。"}, {"tex": "\\tilde I_s(\\mathbf x) = I_s\\big(\\mathbf x + \\mathbf w(\\mathbf x)\\big),\\qquad \\mathbf x_j = \\pi\\Big(\\mathbf K_j\\big(\\mathbf R\\,D_i(\\mathbf x)\\,\\mathbf K_i^{-1}\\tilde{\\mathbf x} + \\mathbf t\\big)\\Big)", "explain_zh": "第一式是后向 warping：w(x) 是从目标帧指向源帧的位移场，I_s 在非整数位置上做双线性采样。第二式是由深度诱导的刚性流：像素 x（齐次坐标写作 x̃）先用深度 D_i(x) 反投影成相机 i 坐标系中的三维点，经相对位姿 (R,t) 变换到相机 j，再用内参 K_j 投影；π 表示除以第三个分量的透视除法。对静态场景和运动相机而言，刚性流就是光流。Ha 的前向 splat 和 Quark 的层投影用的都是这个式子，而不是光流。"}, {"tex": "\\big\\lvert \\mathbf w_f(\\mathbf x) + \\mathbf w_b(\\mathbf x + \\mathbf w_f(\\mathbf x)) \\big\\rvert^2 < \\alpha_1\\Big(\\lvert \\mathbf w_f(\\mathbf x)\\rvert^2 + \\big\\lvert \\mathbf w_b(\\mathbf x + \\mathbf w_f(\\mathbf x))\\big\\rvert^2\\Big) + \\alpha_2", "explain_zh": "前向—后向一致性检查。w_f 是从 t 到 t+1 的流，w_b 是从 t+1 到 t 的流；在可见像素处两者应近似相反，和接近 0。常用阈值是 α_1=0.01、α_2=0.5（Sundaram et al. 2010）。不满足该条件的像素标为遮挡或不可靠。"}, {"tex": "E_{warp}(V_t,V_{t+1}) = \\frac{1}{\\sum_{i=1}^{N} M_t^{(i)}}\\sum_{i=1}^{N} M_t^{(i)}\\,\\big\\lVert V_t^{(i)} - \\hat V_{t+1}^{(i)}\\big\\rVert_2^2", "explain_zh": "Lai et al. 2018 的时间稳定性指标（原文 Eq. 5）。V_t 是第 t 帧的输出图像；V̂_{t+1} 是用光流把第 t+1 帧的输出 warp 到第 t 帧的结果；M_t∈{0,1} 是非遮挡掩码；i 遍历全部 N 个像素。整段视频的指标取所有相邻帧对的平均（原文 Eq. 6）。数值越小，视频越稳定。"}], "worked_example_zh": "(1) 孔径问题。某像素 I_x=0.1/px、I_y=0、I_t=−0.3，代入 I_x u+I_y v+I_t=0 得 u=3 px，而 v 完全不受约束：一条竖直边缘上下滑动，在局部是看不出来的。\n(2) 前向—后向检查。设 w_f=(5,0)。\n• 落点处 w_b=(−4.8,0.1)：左边为 |(0.2,0.1)|²=0.05，右边为 0.01×(25+23.05)+0.5≈0.98，检查通过。\n• 落点被背景占据，w_b=(0,0)：左边为 25，右边为 0.01×25+0.5=0.75，判为遮挡。\n(3) Ha 的颜色差分掩码，其实是假设 w=0 时的亮度恒定残差：M=min(|I^t−I^{t−1}|/0.7+0.6, 1)。\n• |ΔI|=0 时 M=0.6，每帧取 60% 的新深度；\n• |ΔI|=0.05（传感器噪声量级）时 M=0.671；\n• |ΔI|≥0.28 时 M=1，全部取新深度。\n设一只穿纯色袖子的手臂沿视线方向朝相机移动。袖子内部相邻两帧的颜色几乎不变（这是孔径问题的极端形式），于是 M≈0.6，Eq. 2 退化成系数 α=0.6 的 EMA。对匀速变化的输入，EMA 的稳态滞后是 v(1−α)/α：手臂以 0.3 m/s 运动（30 fps 下每帧 1 cm）时，滤波后的深度落后约 0.67 cm；以 0.9 m/s 运动（每帧 3 cm）时落后 2 cm，已等于 τ。横向运动时，袖子的前缘若盖住颜色相近的背景，该处的 M 也接近 0.6，旧的背景深度会被混进前景。有了光流或场景流，就可以先沿运动轨迹对齐再滤波，但 Ha 没有这样做。\n(4) 这种 EMA 的降噪能力有多大？设静态区的深度噪声逐帧独立、方差为 σ²，则系数为 α=M 的递归滤波，稳态标准差为 σ√(α/(2−α))。α=0.6 时约为 0.65σ，只把抖动降低了约 35%。", "pitfalls_zh": ["流的方向和 warping 的方向很容易搞反。后向 warping 要用从目标指向源的流，在源图上采样。方向用错时，静态区看起来仍然正确，运动区的错位却会翻倍。PyTorch 的 grid_sample 还要求把像素坐标归一化到 [−1,1]，并注意 align_corners 的设置。", "遮挡区没有真正的对应点。如果不做前向—后向检查就把 warp 结果用于时间滤波或损失，运动边界处会出现拖影；计算 warping error 时同样要用非遮挡掩码。", "亮度恒定假设经常不成立。自动曝光、闪烁光源、阴影、高光和火焰（DyNeRF 的 Flame Steak 场景里就有明火）都会造成颜色变了但几何没变；反过来，纯色物体运动时是颜色没变但几何变了。Ha 的颜色差分掩码对这两种错误都很敏感。", "光流不等于场景流。沿视线方向运动的物体，在图像上的位移很小，深度却变了；二维运动为零也不代表三维静止。多相机系统需要场景流，或者对多视角深度做时间对齐。"], "in_quark": {"used": false, "where": "没有光流；Sec. 4.1 和 Sec. 4.3 承认缺少时间一致性；Sec. 3.2.2 的 splat 与投影属于深度诱导的 warping", "how_zh": "Quark 逐帧独立重建，既不估计光流，也不做帧间对齐。Sec. 4.3 明确承认视频会闪烁；Sec. 4.1 指出所有评测指标都不衡量时间闪烁，而且目标相机移动时输入相机会切换，这也会引起闪烁。\n\n不过 Quark 大量使用 warping。中间 LDM 先用双线性 splat 前向投到每个输入视角，再做 over 合成（Eq. 2）；最终的 IBR 则把全分辨率输入图按层深度投影到 LDM 各层上采样，这是后向的。理解前向和后向 warping 各自的空洞与冲突问题，有助于看懂 Quark 为什么选择在输入视角里渲染、在层空间里融合。如果要给 Quark 加上时间一致性，最直接的手段有两种：加入光流 warping 损失（Lai et al.），或者把上一帧的 LDM 按场景流或刚性流重投影到当前帧。"}, "in_ha": {"used": false, "where": "Sec. 3.2 Eq. 1–2（颜色差分掩码）；附录 A.2（掩码前向 splat）；Sec. 4.3 Eq. 8（TCC）", "how_zh": "Ha 全文没有用到光流。它的时间机制可以理解为零光流假设下的特例：相机固定，静态背景的光流恒为 0，所以只要比较同一像素前后两帧的颜色（Eq. 1）就能区分动静，然后对深度做递归滤波（Eq. 2）。附录 A.2 用 Gaussian splatting 把 K 张掩码前向投影到目标视角，再逐通道取最大值，这属于深度诱导的前向 warping。\n\n评测同样绕开了光流。TCC（Eq. 8）比较渲染图与真值各自帧差图之间的 SSIM；STED、SDT、SDV 也不依赖光流；论文没有使用 Lai et al. 的 warping error。\n\n懂了光流，就能看出这一设计的适用边界：一旦相机移动（例如头戴显示器的观看视角），或者物体颜色均匀，零光流假设就失效了。"}, "in_field_zh": "在远程临场中，光流和场景流主要用于四件事。(1) 时间滤波与去闪烁：沿运动轨迹对齐后再平滑深度或颜色（见 a-temporal-video）。(2) 帧插值与延迟补偿：用光流把渲染结果外推到最新的头部位姿，类似 VR 中的 reprojection。(3) 动态重建：4D 表示和流式高斯常用场景流来初始化运动（见 n-dynamic、a-dynamic-4d）。(4) 评测：warping error 是衡量闪烁的常用客观指标（见 v-temporal、v-metrics）。光流网络本身的开销也要计入预算，RAFT 在 1080p 下的计算量并不小。", "resources": [{"title": "Foundations of Computer Vision (Torralba, Isola, Freeman), Ch. 48: Optical Flow Estimation", "url": "https://visionbook.mit.edu/optical_flow.html", "type": "book", "note_zh": "免费在线教材，从亮度恒定、孔径问题讲到经典与学习式光流；第 49 章接着讲学习式运动估计。"}, {"title": "Stanford CS231A Course Notes 9: Optical and Scene Flow", "url": "https://web.stanford.edu/class/cs231a/course_notes/09-optical-flow.pdf", "type": "course", "note_zh": "篇幅短，把光流和场景流放在一起讲，便于理解二者之间的投影关系。"}, {"title": "RAFT: Recurrent All-Pairs Field Transforms for Optical Flow", "url": "https://arxiv.org/abs/2003.12039", "type": "paper", "note_zh": "4D 相关体加 GRU 迭代更新的范式，读懂它就能直接看懂 RAFT-Stereo。"}, {"title": "Learning Blind Video Temporal Consistency (Lai et al., ECCV 2018)", "url": "https://arxiv.org/abs/1808.00449", "type": "paper", "note_zh": "提出基于光流的 warping error 指标（Eq. 5–6）和时间一致性损失，是评测闪烁的标准参考。"}], "self_check": [{"q_zh": "为什么说双目立体匹配是光流的一个特例？RAFT-Stereo 相对 RAFT 改了什么？", "a_zh": "在校正后的双目里，对应点只沿水平方向移动，位移（视差）由深度决定，相当于一种只有一个自由度、方向已知的光流。RAFT-Stereo 把 RAFT 的全像素对 4D 相关体改为只在同一行内计算的 3D 相关体（H×W×W），并加入多分辨率 GRU，以便更快地在大片无纹理区域传播信息。"}, {"q_zh": "头戴显示器用户的视角在移动时，Ha 的“上一帧深度回灌”会遇到什么问题？光流或刚性流怎样帮忙？", "a_zh": "𝒟^{t−1} 是上一帧目标相机图像空间里的深度图。视角移动后，像素不再一一对应，直接融合会把错位的深度混进 TSDF。正确做法是先用上一帧深度和两帧目标相机之间的相对位姿做刚性流前向 warp，并处理空洞和遮挡；动态区域还需要场景流。论文没有说明这一步。"}, {"q_zh": "warping error 为什么需要非遮挡掩码？", "a_zh": "被遮挡或新出现的像素在另一帧里没有对应点，warp 过来的是别的物体的颜色，这种差异并不是闪烁造成的。如果不排除这些像素，指标会被遮挡边界主导，从而误判方法的优劣。"}], "prereqs": ["f-image", "g-pinhole"]}, {"id": "d-tsdf", "name_zh": "截断符号距离场（TSDF）与深度融合", "name_en": "Truncated signed distance fields & depth fusion", "tldr_zh": "把每张深度图转成空间中各点到表面的有符号距离，截断到 ±τ 后按置信度在空间中加权平均，零等值面就是融合后的表面。它把多张彼此矛盾的深度图变成一个一致的几何，是 Ha et al. 的核心。", "intuition_zh": "多张深度图的问题在于：各自有噪声、各自有空洞，在重叠处给出的表面位置也略有不同。直接把点云堆在一起，得到的表面又厚又毛糙；逐像素取平均，又得先知道谁和谁对应。SDF 换了个问法：不问表面在哪里，而问空间中每个点离表面多远、在表面前面还是后面。对一张深度图来说，沿它的视线，一个点的有符号距离就是“观测深度减去该点深度”：在表面前方（自由空间）为正，在后方为负，恰在表面上为 0。把各视角给出的这个值加权平均，零交叉处就是大家共同投票选出的表面。Curless & Levoy（SIGGRAPH 1996）证明，这样得到的等值面在加权最小二乘意义下是最优的。\n\n为什么要截断？有两个原因。第一，离表面太远的点，距离值既无意义也不可靠，远处另一面墙的观测会干扰当前表面。第二，落在某视角可见表面后方很远处的点，该视角其实看不到（被遮挡），不应让它投负票，否则会把其它视角看到的物体挖掉，这叫 overcarving。所以要把距离夹到 [−τ, τ] 之间，并把“在表面后方超过 τ”的样本权重置零。τ 必须大于深度噪声，同时又要小于你想分辨的最小结构厚度。\n\n经典做法把 TSDF 存进三维体素网格：每个体素存一个距离值和一个累计权重，每来一帧深度就做一次滑动加权平均（Curless & Levoy）。KinectFusion（Newcombe et al., ISMAR 2011）在 GPU 上实时完成这件事，同时用 ICP 跟踪相机，并给累计权重设上限 W_max，让融合变成有限记忆，从而能适应缓慢变化的场景。要得到图像，就从目标相机发射射线，在网格中步进，直到距离变号（raycasting），也可以用 Marching Cubes 提取网格。体素网格的缺点是内存：1024³ 个体素、每个 8 字节，就需要约 8.6 GB。\n\nProject Starline（Lawrence et al. 2021，§4.6 Rendering 中 “Raycasting for geometry fusion” 一段）提出了 image-based TSDF：不建网格，沿每条目标射线边走边算。把射线上的采样点投影到每张输入深度图上，现场计算有符号距离并加权求和；步长取 0.8·s，离表面越远走得越快，类似球面追踪（见 r-raymarch）；检测到变号后再做 3 次二分。Starline 还先把输入深度图点溅射到低分辨率的输出视图并做 min/max 滤波，得到每条射线保守的搜索区间，避免从头走到尾。当输入只有几张深度图、输出也只有几张视图时，这比先填满整个体素网格快得多：在 Titan RTX 上，体素方案“积累 + 6 次 raycast”共 10.0 ms，加上光栅化搜索区间后为 4.3 ms，换成 image-based 融合后只要 1.5 ms。Ha et al. 沿用了这个算法及其参数（τ=2 cm、7×7 局部方差权重、常数 0.001、0.8·s 步长、3 步二分），但没有提到搜索区间的光栅化，也没有给出射线的 near/far；它另外把上一帧的输出深度作为额外输入，以获得时间一致性。", "analogy_zh": "几个人各拿一台激光测距仪，从不同位置测同一面墙。每人只报告“这个位置在墙前多少厘米或墙后多少厘米”，而且只报 ±2 cm 以内的数：离得太远的不报，自己看不到的也不报。仪器抖得厉害的人，说话声音就小一点。把这些报数加权平均，数值由正变负的地方，就是大家公认的墙面。", "equations": [{"tex": "D_{i+1}(\\mathbf x) = \\frac{W_i(\\mathbf x)\\,D_i(\\mathbf x) + w_{i+1}(\\mathbf x)\\,d_{i+1}(\\mathbf x)}{W_i(\\mathbf x) + w_{i+1}(\\mathbf x)},\\qquad W_{i+1}(\\mathbf x) = \\min\\big(W_i(\\mathbf x) + w_{i+1}(\\mathbf x),\\; W_{\\max}\\big)", "explain_zh": "Curless & Levoy 的累积加权平均（KinectFusion 加入了 W_max 上限）。x 是体素中心；D_i(x) 是融合前 i 张深度图后的 TSDF 值；d_{i+1}(x) 是第 i+1 张深度图给出的截断有符号距离；w_{i+1}(x) 是这次观测的权重，通常与视线夹角和深度置信度有关；W_i 是累计权重。不设上限时，它等价于所有观测的加权平均；设了上限后，新观测总能占到至少 w/W_max 的份额，相当于指数滑动平均（EMA，见 f-prob）。"}, {"tex": "s_k = D_k[u_k,v_k] - z_k,\\qquad s = \\sum_{k=1}^{K}\\omega_k\\,\\mathrm{clamp}(s_k,-\\tau,\\tau),\\qquad \\omega_k = 0\\ \\text{if}\\ s_k < -\\tau", "explain_zh": "image-based TSDF，对应 Ha 附录 A.1 的 Eq. 9–10。这里的符号按 Starline 的“表面前方为正”约定写出，与原文字面不同，原因见易错点。p 是目标射线上的三维采样点；(x_k,y_k,z_k)=K_k(R_k p+t_k)，z_k 是 p 在第 k 个输入相机中的深度，(u_k,v_k)=(x_k/z_k, y_k/z_k) 是投影像素；D_k[u_k,v_k] 是第 k 张深度图在该处的采样值（原文只说 sampling，没有指定插值方式；在深度边界上做双线性插值会造出介于前景和背景之间的假深度）；若 p 落在第 k 个相机的视锥之外，Starline 令该视角权重为 0；τ=0.02 m 是截断距离；ω_k 是置信权重。当 p 位于第 k 个视角可见表面之后超过 τ 时，该视角看不到 p，权重置零以防 overcarving。沿射线从近到远步进，步长为 0.8·s，s 变号后二分 3 次，得到目标像素的深度。"}, {"tex": "\\omega_k = \\min\\Big(0.001\\cdot\\Big(\\frac{\\nu_k}{w\\times w}\\Big)^{-1/2},\\,1\\Big),\\qquad \\nu_k = \\sum_{(p,q)\\in\\mathcal N}\\min\\Big(\\big(D_k[u_k,v_k] - D_k[p,q]\\big)^2,\\,\\tau^2\\Big)", "explain_zh": "Ha 的 Eq. 11–12，与 Starline 相同。𝒩 是投影点周围 w×w=7×7 的邻域；ν_k 是邻域内深度差的平方和，每一项截断到 τ²，以免在边缘处被无限放大。ν_k/49 开平方，就是局部深度的粗糙度 σ（单位为米）；权重 ω=min(0.001/σ, 1)：σ≤1 mm 的平坦可靠区域得满权重 1，σ=1 cm 时只剩 0.1。注意两点：权重正比于 1/σ，而不是最优线性融合所用的 1/σ²；它度量的是空间粗糙度（包括真实的斜面和深度边界），而不是时间噪声。"}, {"tex": "\\omega_{\\mathrm{tmp}}^{t} = \\min\\Big(\\beta\\,\\omega_{\\mathrm{acc}}^{t}\\,\\max(1-\\mathcal M^{t},0),\\;\\eta\\Big),\\qquad \\omega_{\\mathrm{acc}}^{t} = \\omega_{\\mathrm{tmp}}^{t-1} + \\sum_{k}\\omega_k^{t-1}", "explain_zh": "Ha 附录 A.2 的 Eq. 13–14。把上一帧渲染出的目标深度 𝒟^{t−1} 当作第 K+1 个输入视角融合进 TSDF，它的权重 ω_tmp^t 由上一帧的累计权重 ω_acc^t 决定。𝓜^t 是把 K 张颜色差分掩码前向 splat 到目标视角后逐通道取最大值得到的；动态区的 𝓜^t 接近 1，所以历史权重接近 0。β 控制历史的相对贡献，它和 Eq. 1 中取 0.6 的 β 不是同一个参数，论文没有给出取值。η=15 是上限，作用与 KinectFusion 的 W_max 相同。另外，由于 Eq. 1 的掩码下限是 0.6，1−𝓜^t 最大只有 0.4。还有两处细节：正文 Sec. 3.2 的措辞是“把各视角掩码的最大值用作 𝒟^{t−1} 的融合权重”，字面上与这里的 max(1−𝓜^t, 0) 方向相反，应以附录为准；ω_k^{t−1} 本来随射线上的采样点变化，论文没说 ω_acc 取哪一点的值，合理的实现是取上一帧零交叉处的权重。"}], "worked_example_zh": "设目标射线近似垂直于墙面，各输入视角也近似正对墙面，于是在墙面附近，p 在各视角中的深度 z_k 都约等于它在目标射线上的深度 t。符号按“表面前方为正”，即 s_k = D_k − t。\n视角 1：D_1=2.000 m，局部粗糙度 σ=1 mm，ω_1=min(0.001/0.001,1)=1。\n视角 2：D_2=2.010 m，σ=1 cm，ω_2=0.1。\n(1) 融合就是加权平均。零交叉附近两者都在截断带内（|D_k−t|≤2 cm），s(t)=1·(2.000−t)+0.1·(2.010−t)，零交叉在 t*=(2.000+0.201)/1.1≈2.0009 m；若等权则为 2.005 m。置信权重把噪声视角的影响压到了 0.1/1.1=1/11。如果两者相差超过 τ（例如 D_2=2.030 m），视角 2 在零交叉处被夹在 +τ，只贡献常数 0.1×0.02，零交叉变为 2.002 m，而不是线性公式给出的 2.0027 m：截断让融合自动对离群值稳健。\n(2) 截断限制了外点，但零交叉本质上是加权投票。再加入视角 3，它在这里误匹配成 D_3=2.50 m（ω_3=1）。在 t≈2 m 处 s_3=+0.5，被截断为 +0.02，于是 s(t)=2.221−1.1t，零交叉移到 2.019 m，只偏了 1.8 cm；如果不截断、直接对深度做加权平均，结果是 (2.000+0.201+2.50)/2.1≈2.24 m，偏了 24 cm。但此时 s_1=−0.019 m，已经贴近 −τ。若再来一个同样的外点视角（两个 ω=1、D=2.50 m），它们的正票共 +0.04，而视角 1 在被置零之前最多只能投 −0.02，s 在 2 m 附近始终为正，射线会穿过墙面，停在 2.50 m 处。\n(3) 被遮挡的视角不投票。遮挡需要视线不平行：设一只手挡在视角 3 与墙上这一点之间，但不在目标射线上，于是在 t≈2 m 处视角 3 读到 D_3=1.50 m（ω_3=1），s_3=−0.5<−τ，ω_3=0，这个观测被忽略，零交叉仍在 2.0009 m。如果不置零、而是把 s_3 夹到 −0.02，零交叉满足 (2.000−t)+0.1×0.02−0.02=0（此时视角 2 已被夹在 +τ），墙面被挖到 1.982 m。\n(4) 步长与 Σω。自由空间里所有视角都被夹到 +τ，s=τΣω。本例 Σω=1.1，步长 0.8s≈1.76 cm。进入截断带后 s≈Σω·(剩余距离)，每步只走剩余距离的 0.88 倍，只会从前方无限逼近零点、永远不变号，所以实现里要设最小步长，或在 |s| 足够小时停止。DyNeRF 设置下 K=4、权重都接近 1 时 Σω≈4：自由空间步长 6.4 cm，比整个截断带（±2 cm，共 4 cm）还宽；进入带内后一步走 3.2 倍剩余距离，会冲到表面后方 2.2 倍剩余距离处，一旦超过 τ，所有视角 ω=0、s=0。这时必须把 s≤0 当作越过，再二分 3 次，区间缩小为最后一步的 1/8（6.4 cm 对应 8 mm）。\n(5) 边缘降权。投影点落在 1 m 前景与 2 m 背景的交界处，7×7 窗口中有 24 个邻居在边界另一侧，每项截断为 τ²=4×10⁻⁴，所以 ν=9.6×10⁻³，σ=√(ν/49)≈1.4 cm，ω≈0.07。Ha 和 Starline 就是这样抑制飞点的。\n(6) 时间项的权重。β 没有公布，这里取 β=1 做示意。静止像素上 𝓜=0.6（掩码下限），K=4 个视角的权重都为 1，则 ω_tmp 按 x←min(0.4·(x+4), 15) 逐帧递推，收敛到 x≈2.67，历史深度约占总权重的 40%；若 β=2，递推会一直增长到上限 η=15，历史约占 15/19≈79%。动态区 𝓜=1，ω_tmp=0，完全不用历史。\n(7) 为什么不用体素网格。1024³ 个体素、每个存 4 字节距离加 4 字节权重，约 8.6 GB。Starline 的对照实验（Titan RTX）使用 1152×896×768 的网格：积累耗时 2.5 ms，6 次 raycast 耗时 7.5 ms，合计 10.0 ms；image-based 融合总共只要 1.5 ms。", "pitfalls_zh": ["符号约定前后矛盾。Ha 附录 A.1 的 Eq. 9 字面写的是 s_k = z_k − D_k，并明确给出 (x_k,y_k,z_k)=K_k(R_k p+t_k)、(u_k,v_k)=(x_k/z_k, y_k/z_k)，这是相机前方 z>0 的 OpenCV 式投影；在这个约定下，z_k − D_k 在表面前方为负。可同一节又沿用了 Starline 的两条规则：s_k<−τ 时权重置零，以 0.8·s 为步长前进。按字面符号，这会丢掉自由空间的票、保留被遮挡点的票，步长也会变成负数。Starline 原文同样写成“用相机坐标的 z 减去 d_j”，但明确说明 s_j 为正当且仅当 p 位于可见表面之前，这只有在 OpenGL 式约定（相机看向 −z，z 和深度都取负值）下才成立。复现时请统一写成 s_k = D_k − z_k。", "τ 夹在噪声和结构尺寸之间。τ 必须大于深度噪声，否则各视角在截断带内没有交集，表面会破碎；τ 又必须小于最薄的结构（手指约 1–2 cm），否则前后两面的距离场互相干扰，细结构被抹平。立体噪声随 Z² 增长，固定的 τ=0.02 m 在 5 m 处已经小于 σ_Z（见 d-stereo 的例子）。", "公制尺度。τ=0.02 m 和常数 0.001 都以米为单位。COLMAP 位姿的尺度是任意的，如果不先把重建尺度对齐到米，这些参数就没有意义。", "“全局”一致只在输入集合不变时成立。image-based TSDF 只融合当前的 K 个视角，观看位置变化导致 K 集合切换时，零交叉会跳变（Ha Sec. 3.2 自己承认，增大 K 可以缓解但更慢）。时间回灌项能缓解这一点，但 𝒟^{t−1} 是在目标图像空间融合的，默认目标相机不动。", "步长和终止条件要自己补全。Eq. 10 没有除以 Σω，这不影响零交叉的位置，但步长 0.8·s 会随 Σω 缩放，自由空间步长为 0.8·τ·Σω。Σω<1.25 时，进入截断带后每步只走剩余距离的一部分，永远不会变号，需要最小步长；K=4 个满权重视角时步长 6.4 cm，已宽于整个截断带，落点可能在表面后方超过 τ，此时所有权重为零、s=0，若实现只认 s<0 就会漏掉表面；若时间项权重再达到上限 η=15，自由空间步长可达 0.8×0.02×19≈0.3 m，可能一步跨过手指这样的薄结构。建议：除以 Σω 做归一化（步长不超过 0.8τ=1.6 cm，代价是步数更多），把 s≤0 或“所有权重为零”都视为越过，并像 Starline 那样先用光栅化求出每条射线的搜索区间。"], "in_quark": {"used": false, "where": "没有 TSDF；LDM 是体渲染式的 density 加 over 合成（Sec. 2.1、3.1、3.2.3）", "how_zh": "Quark 不维护任何距离场，也不在帧间或视角间融合深度。它的 LDM 每层包含 depth、density（σ=sigmoid(V W_σ)）和 blend weights，用 over 合成渲染。原文把各层看作体渲染光线步进中的采样步（Sec. 2.1），所以它更接近体密度表示（见 r-volume、r-alpha），而不是 SDF。\n\n与 TSDF 对比，能看清 Quark 的核心短板：它为每个目标视角、每一帧重新生成 LDM，用完即丢，没有一个由所有视角共同投票得出的几何。因此逐帧重建本身会闪（Sec. 4.3），目标相机移动导致输入相机切换时几何也会变（Sec. 4.1）。Ha 的 TSDF 正是用来补这一块的：可以把 Ha 的 image-based TSDF 看作一个一致性模块，接在 Quark 这类方法之后，这也是两篇锚点对比中提出的组合方向。"}, "in_ha": {"used": true, "where": "Sec. 3.2（Eq. 3）；附录 A.1（Eq. 9–12）；附录 A.2（Eq. 13–14）；Sec. 3.3（L_Depth）；Table 3；Table 4", "how_zh": "这是 Ha 的核心，可以分四步看。\n(1) 附录 A.1：对目标视角的每条射线，按 Eq. 9–10 把采样点投影到 K 个最近视角（DyNeRF 取 K=4，D3DMV 取 K=2），以 τ=0.02 m 截断，用 Eq. 11–12 的 7×7 局部方差权重融合，按 0.8·s 步进，变号后二分 3 次。这部分用自定义 CUDA 实现，DyNeRF 1352×1014 分辨率下耗时 6 ms（Table 4）。\n(2) 附录 A.2：把上一帧的输出深度 𝒟^{t−1} 作为额外输入，其权重按 Eq. 13–14 累积，上限为 η=15；动态区的权重由前向 splat 的差分掩码压低。最终得到 Eq. 3 的 𝒟^t = Raymarch(TSDF({Ḋ_k^t}, 𝒟^{t−1}))。\n(3) 这张深度作为融合网络的输入，并通过 L_Depth 软约束融合权重（Sec. 3.3），论文称之为视角—时间滤波器。\n(4) 实测收益主要体现在时间一致性上：去掉 TSDF 引导后，PSNR 只从 31.17 变为 31.16，STED 却从 68.76 恶化到 95.42（Table 3）。\n\n不懂 TSDF，就读不懂 Sec. 3.2 为什么说“融合进全局结构即可保证同一时刻的视角一致性”，也发现不了附录 A.1 的符号约定问题。"}, "in_field_zh": "TSDF 融合是三维远程临场的老骨干。Holoportation（Orts-Escolano et al. 2016）和 Fusion4D 用体素 TSDF 融合多台深度相机，并做非刚性对齐；Montage4D 等工作在此基础上改进纹理。Project Starline 在接收端用 image-based TSDF 实时融合 3 个采集舱的深度，每帧做 6 次 raycast（左右眼各一次，外加 4 路彩色相机各一张阴影图），在 16.6 ms 的帧预算中只占 1.5 ms（Titan RTX）。Ha et al. 把这一方法推广到了一般动态场景。TSDF 还有其它用途：渲染出的一致深度可以作为新视角合成的几何引导，也可以作为深度监督信号；用 Marching Cubes 导出的网格则可以用于传输。进一步阅读见 a-human-capture、a-telepresence-sys。", "resources": [{"title": "A Volumetric Method for Building Complex Models from Range Images (Curless & Levoy, SIGGRAPH 1996)", "url": "https://graphics.stanford.edu/papers/volrange/", "type": "paper", "note_zh": "体素 TSDF 与累积加权平均的出处。论文讲清了有符号距离如何构造、如何沿视线截断和加权，以及为什么零等值面是加权最小二乘意义下的最优解。"}, {"title": "Project Starline: A High-Fidelity Telepresence System (Lawrence et al., SIGGRAPH Asia 2021)", "url": "https://hhoppe.com/starline.pdf", "type": "paper", "note_zh": "§4.6 Rendering 中的 “Raycasting for geometry fusion” 一段是 image-based TSDF 的原始描述，包括符号约定（s_j 为正当且仅当点在可见表面之前）、τ=2 cm、7×7 方差权重、0.8·s 步长、3 步二分和光栅化搜索区间，Ha 附录 A.1 几乎逐字沿用。§4.3 讲主动立体采集，§4.5 讲把深度编码为 10-bit H.265 视频流。"}, {"title": "Szeliski, Computer Vision (2nd ed.), §13.2.1 Range data merging & §13.5 Volumetric representations", "url": "https://szeliski.org/Book/", "type": "book", "note_zh": "教科书视角下的深度融合与体表示，把 TSDF 与其它表面表示放在一起比较。"}, {"title": "Open3D tutorial: RGBD integration (ScalableTSDFVolume)", "url": "https://www.open3d.org/docs/release/tutorial/pipelines/rgbd_integration.html", "type": "code", "note_zh": "用几行代码就能把 RGB-D 序列融合成网格，可作为体素 TSDF 的基线，与自己实现的 image-based 版本做对照。"}], "self_check": [{"q_zh": "为什么远在表面后方的样本要把权重置零，而远在表面前方的样本只是截断到 +τ？", "a_zh": "表面前方是该视角亲眼看到的自由空间，“这里是空的”是可靠信息，截断成 +τ 保留“在表面前面”这一票即可。表面后方超过 τ 的点被该视角的可见表面挡住了，该视角对那里一无所知；如果让它投 −τ 的票，就会把其它视角看到的物体挖掉（overcarving）。"}, {"q_zh": "两个视角都在截断带内，权重分别为 ω_1、ω_2，观测深度为 D_1、D_2，视线近似平行。TSDF 的零交叉在哪里？这说明了什么？", "a_zh": "令 s(t)=ω_1(D_1−t)+ω_2(D_2−t)=0，解得 t*=(ω_1D_1+ω_2D_2)/(ω_1+ω_2)，也就是加权平均深度。这说明 TSDF 融合在局部就是一次加权平均（见 f-prob），截断和置零规则只是在外点和遮挡处修改了这个平均。"}, {"q_zh": "Ha 的消融显示，去掉 TSDF 引导后 PSNR 几乎不变，STED 却明显变差。如何解释？", "a_zh": "单帧的保真度主要取决于融合网络和前向 splat 得到的像素，没有 TSDF，网络也能拼出合理的单帧。TSDF 提供的是跨视角、跨时间都稳定的几何参照，它约束的是帧与帧、视角与视角之间的变化。因此收益体现在时间一致性指标 STED 上（95.42→68.76），而逐帧计算的 PSNR 反映不出来。"}], "prereqs": ["g-pinhole", "f-prob", "d-stereo"]}, {"id": "d-sensors", "name_zh": "深度传感器与噪声特性", "name_en": "Depth sensors & noise characteristics", "tldr_zh": "主动深度相机（结构光、主动立体、ToF、LiDAR）自带光源，所以在无纹理处也能测出深度，但各有典型误差：三角测量类误差随距离平方增长，ToF 有多路径干扰和相位混叠，所有类型都会在物体边缘产生飞点，而且都怕阳光、深色或高光材质以及彼此之间的干扰。", "intuition_zh": "被动立体在白墙上找不到对应点。主动传感器的思路是自己往场景上“画”纹理，或者自己计时。结构光（Kinect v1、iPhone 前置 Face ID）投射已知的红外散斑图案，用一台红外相机观察图案的偏移；这本质上是投影仪与相机之间的三角测量，公式与双目相同（Z=fb/d）。主动立体（RealSense D4xx、Starline 的采集舱）投射随机红外纹理，再用两台红外相机做普通立体匹配，没有纹理的表面也被画上了纹理；在室外阳光下，投射的图案会失效，这时仍可退化为被动立体。\n\n飞行时间（ToF）直接测量光往返的时间，分两类。直接 ToF（dToF，如 iPhone/iPad 的 LiDAR、车载激光雷达）发射短脉冲并计时，1 cm 的深度差只对应约 67 ps 的往返时间差，所以像素少、分辨率低。间接 ToF（AMCW，如 Kinect v2、Azure Kinect）发射调制光，测量回波的相位差，深度 = c·Δφ/(4πf_mod)。相位超过 2π 会绕回，因此最大无歧义距离是 c/(2f_mod)，需要用多个频率来解缠。ToF 的深度与相位（或时间）成线性关系，没有三角测量里“视差→深度”的 1/d 放大，所以没有那种纯几何的 Z² 误差增长；它的随机误差主要由回波信噪比决定，距离越远回波越弱，误差也会增加。此外它还会受多路径干扰（光在墙角反弹两次再回来）和混合像素的影响。\n\n所有深度传感器都有几类共同的“脏数据”。\n(a) 飞点（flying pixels）：一个像素同时看到前景边缘和背景，ToF 得到的是两者相位的混合，立体得到的是窗口内的混合，结果是一个悬在空中、不属于任何物体的点，在点云侧视图中像一道幕帘。\n(b) 无效像素：饱和、信号太弱或多路径检测失败，通常用深度=0 表示。Azure Kinect 文档列出了五类：照明掩码之外、IR 饱和、IR 信号过弱、滤波判定的外点、多路径。\n(c) 材质相关的问题：头发和黑色衣物吸收红外，镜面和玻璃把光反射走。\n(d) 多传感器互扰：多台结构光的图案会叠加，多台 ToF 的调制会互相污染，需要时分复用或错开频率。\n(e) 深度相机与彩色相机不在同一位置，需要配准，而且两者的分辨率往往相差很大。\n\n深度传感器对远程临场有直接影响。早期系统（Holoportation、Fusion4D）依赖多台主动深度相机。Starline 认为商用 RGBD 相机分辨率不够、深度边界附近质量差，于是自建近红外主动 spacetime stereo 采集舱。Ha et al. 的引言也指出，依赖深度传感器的“稀疏相机 + 全局几何”路线受传感器分辨率限制，基本只能重建人。近年的趋势是用纯 RGB 阵列加学习式立体或前馈网络取代传感器，但传感器深度仍是最好的训练监督来源（Ha 就用 ScanNet 的传感器深度训练），也是系统中的安全网。", "analogy_zh": "结构光就像在黑暗中用手电筒照出一张网格，再看网格怎么弯曲；ToF 就像在山谷里喊一声，听回声隔了多久。飞点则像你同时对着近处的墙和远处的山喊，两个回声混在一起，你便以为声音来自两者之间的某个地方，可那里其实什么都没有。", "equations": [{"tex": "\\sigma_Z \\approx \\frac{Z^{2}}{f\\,b}\\,\\sigma_d", "explain_zh": "适用于结构光和主动立体这类三角测量传感器。Z 是深度；f 是焦距（像素）；b 是基线，即投影仪与相机之间或两台红外相机之间的距离；σ_d 是视差测量误差（像素）。Khoshelham & Oude Elberink（2012）对 Kinect v1 的实测表明，随机误差按距离平方增长，从 0.5 m 处的几毫米增加到最大量程（5 m）处的约 4 cm。"}, {"tex": "Z = \\frac{c\\,\\Delta t}{2}\\ \\ (\\text{dToF}),\\qquad Z = \\frac{c\\,\\Delta\\varphi}{4\\pi f_{\\mathrm{mod}}},\\quad Z_{\\max} = \\frac{c}{2 f_{\\mathrm{mod}}}\\ \\ (\\text{AMCW ToF})", "explain_zh": "c 是光速（3×10⁸ m/s）；Δt 是脉冲往返时间；Δφ∈[0,2π) 是调制信号的相位差；f_mod 是调制频率；Z_max 是无歧义量程，超出后相位绕回，例如在 Z_max=3 m 时，5.5 m 处的物体会被读成 2.5 m。公式中除以 2，是因为光走的是往返路程。"}, {"tex": "\\hat c = \\sum_{j} a_j\\, e^{\\,i\\,4\\pi f_{\\mathrm{mod}} Z_j / c},\\qquad Z_{\\mathrm{meas}} = \\frac{c}{4\\pi f_{\\mathrm{mod}}}\\,\\arg\\hat c", "explain_zh": "AMCW ToF 中混合像素与多路径的模型。一个像素收到的信号是若干回波的复数（相量）之和：a_j 是第 j 条路径的回波幅度，随反射率增大、随距离平方减小；Z_j 是这条路径对应的等效距离，多路径时取半程路径长度。测得的深度由合成相量的相位决定。当像素跨越前景边缘和背景（飞点），或光在墙角多次反射（多路径）时，结果会落在各条路径之间，对应一个并不存在的表面。"}], "worked_example_zh": "(1) dToF 为什么难。深度差 1 cm，对应的往返时间差只有 Δt=2×0.01/(3×10⁸)≈66.7 ps。所以消费级 LiDAR 只有很少的发射点，要再和 RGB 用学习方法融合成稠密深度。ARKit 的 sceneDepth 常见分辨率为 256×192，帧率 60 Hz，附带低、中、高三档置信图。\n(2) AMCW 的量程。f_mod=20 MHz 时 Z_max=7.5 m；100 MHz 时 1.5 m；200 MHz 时 0.75 m。频率越高精度越好，量程却越短，所以需要多个频率组合使用。\n(3) 飞点。取 f_mod=50 MHz，此时 Z_max=3 m，每米对应相位 2.094 rad。一个像素一半看到 1.0 m 处的手，一半看到 2.0 m 处的墙。\n• 若两者回波幅度相等，合成相位为 π，读数是 1.50 m，正好落在两者中间的空中。\n• 更真实的情况是墙更远、回波更弱（幅度取 0.25），读数约为 1.12 m，也就是悬在手后方 12 cm 处的一个假点。\n把这样的像素反投影成 Ha 的逐像素 Gaussian，就是 Sec. 3.1 所说的 flying pixels。\n(4) 结构光的误差。按 Kinect v1 这类模型，Z 从 1 m 增到 4 m，σ_Z 放大 16 倍。在房间尺度的远程临场中，人在 1–2 m，背景在 3–5 m，背景墙的深度噪声往往比人身上的高一个数量级。", "pitfalls_zh": ["深度=0 表示无效，而不是物体贴在相机上。做双线性插值、下采样、TSDF 采样或计算局部方差之前，必须先屏蔽无效像素，否则插值会在有效值与 0 之间造出假深度，把边缘拉向相机，产生新的飞点。", "飞点要在融合之前处理。可以用深度梯度阈值、或法线与视线夹角阈值把它们剔除，也可以像 Ha 和 Starline 那样用局部方差降低其权重。如果直接反投影再渲染，人物轮廓外会出现幕帘和光晕。", "深度与彩色没有对齐。两者来自不同的相机，位置、分辨率和快门时刻都不同，需要外参配准和时间同步。物体运动时，ToF 的多相位曝光还会在边缘产生额外的无效或错误像素；Azure Kinect 文档专门提到，快速运动时边缘的无效像素会增多。", "场景本身的限制。阳光中的红外会淹没结构光和主动投射的图案；头发、深色衣物、镜面和玻璃的回波要么很弱，要么是错的；多台主动传感器同时工作会相互干扰。而这些恰恰是远程临场中常见的内容：头发、眼镜、屏幕。"], "in_quark": {"used": false, "where": "Sec. 3.4（近/远平面来自 SfM 点）；全文不使用深度传感器", "how_zh": "Quark 只用 RGB，训练数据（Spaces、RFF、Shiny、SWORD）和评测都不涉及深度传感器；唯一的几何先验是由 COLMAP 重建的 SfM 点逐样本估计出的近、远平面（Sec. 3.4）。它代表的是完全不用传感器、靠网络从 RGB 推出几何的路线。\n\n从传感器的角度看 Quark，有两点值得注意。\n(1) Quark 没有外部深度，也就没有飞点的来源；它的失败更多来自视角覆盖不足和输入之间的曝光差异。\n(2) 同属 Google 远程临场脉络的 Project Starline 走的是相反的路，自建了主动立体传感器（Supreeth Achar 同时是 Starline、其立体算法 ESPReSSo 和 Quark 的作者之一）。两者的对照正好说明了“传感器深度”与“学习式几何”之间的工程取舍。"}, "in_ha": {"used": true, "where": "Sec. 1 引言；Sec. 3 方法概述；Sec. 3.1；Sec. 4 开头的实现细节段与附录 A.5（ScanNet）", "how_zh": "深度传感器在 Ha 中有四处出现。\n(1) 训练：ScanNet 的深度来自传感器（Sec. 4 实现细节段与附录 A.5），它是三个训练集之一。\n(2) 输入：Sec. 3 提到，也可以直接用 RGB-D 相机作为输入。\n(3) 动机：引言指出，“稀疏相机 + 全局几何”的系统依赖额外的深度传感器，而传感器分辨率低，限制了场景尺度下的质量，基本只能重建人。这是作者选择立体深度加 IBR 的理由。\n(4) 飞点：Sec. 3.1 承认，遮挡和深度误差会在前向渲染图中产生空洞和 flying pixels；如果把所有视角的 Gaussian 一次性渲染，Z-fighting 还会让边缘更差（Fig. 4）。因此作者改为逐视角分别渲染，再由融合网络在 TSDF 深度引导下取舍。\n\n此外，附录 A.1 的 7×7 局部方差权重会自动压低深度边缘处的权重，而边缘正是飞点的高发区域。"}, "in_field_zh": "深度传感器在很大程度上决定了临场系统的形态。Holoportation 和 Fusion4D 用多台主动深度相机做体素融合。Project Starline（§4.3）自建 3 个采集舱，每舱配 1 台 1600×1200 的 RGB 相机和一对 1280×1024 的近红外相机（下方舱另有一台长焦彩色相机，共 4 路彩色流）；16 个衍射光学元件投影器投射近红外点阵，每次用 5 对近红外图像组成的滑动时间窗口计算深度（4 对带不同点阵，1 对是无图案的导引图像），以 60 Hz 输出，并专门设计了导引照明来改善深度边界。§4.5 还介绍了把深度编码为 10-bit 视频流进行传输的做法。消费端设备（iPhone/iPad LiDAR 等）提供低分辨率深度，适合做粗几何或先验。实践中，传感器深度仍是训练数据（ScanNet、各类人像数据）和评测真值的重要来源。相关概念见 g-rig（多传感器同步与标定）和 v-codec（深度视频编码）。", "resources": [{"title": "Szeliski, Computer Vision (2nd ed.), §13.2 3D scanning", "url": "https://szeliski.org/Book/", "type": "book", "note_zh": "主动测距（结构光、ToF、激光扫描）的教科书讲解，§13.2.1 接着讲多次扫描的融合，可衔接 d-tsdf。"}, {"title": "Accuracy and Resolution of Kinect Depth Data for Indoor Mapping Applications (Khoshelham & Oude Elberink, Sensors 2012)", "url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC3304120/", "type": "paper", "note_zh": "结构光深度误差按距离平方增长的理论模型与实测，从 0.5 m 处的几毫米到最大量程处的约 4 cm；全文免费。"}, {"title": "Kinect Range Sensing: Structured-Light versus Time-of-Flight Kinect", "url": "https://arxiv.org/abs/1505.05459", "type": "paper", "note_zh": "用七组实验系统对比 Kinect v1（结构光）与 Kinect v2（ToF），覆盖多路径、环境光、材质等误差源，其实验框架可以直接套用到其它传感器上。"}, {"title": "Azure Kinect DK depth camera (Microsoft Learn)", "url": "https://learn.microsoft.com/en-us/previous-versions/azure/kinect-dk/depth-camera", "type": "tutorial", "note_zh": "官方文档讲清了 AMCW ToF 原理、系统误差与随机误差的定义，以及五类无效像素，其中包括墙角多路径和运动边缘的混合像素。"}], "self_check": [{"q_zh": "为什么 ToF 的误差通常不像结构光那样随距离平方增长？它又有哪些结构光没有的问题？", "a_zh": "ToF 直接由时间或相位线性地得到距离，不经过“视差→深度”的反比换算，所以没有三角测量那种由几何决定的 Z² 放大。它的随机误差主要取决于回波信噪比：回波强度大致随距离平方衰减，距离越远误差越大，增长快慢取决于信号光子噪声与环境光哪个占主导，而不是一个固定的几何比例。ToF 特有的问题包括：相位绕回（超过 c/(2f_mod) 就有歧义）、多路径干扰（墙角、镜面）、前景与背景的混合像素，以及多台 ToF 之间的调制干扰。"}, {"q_zh": "在 Ha 的流程中，如果把 RAFT-Stereo 深度换成 Azure Kinect 的 ToF 深度，哪几个环节需要改动？", "a_zh": "(1) 处理无效像素（深度=0），在 splat、TSDF 采样和 7×7 方差计算中都要屏蔽。(2) 深度相机与 RGB 相机不在同一位置，要先把深度重投影到 RGB 视角再使用。(3) 重新选择 τ 和置信常数：ToF 的噪声特性与立体不同，边缘飞点和多路径需要单独过滤。(4) 多台 ToF 同时工作时，要错开触发时刻或调制频率，避免互扰。(5) 深度分辨率通常低于 RGB，前向 splat 时逐像素 Gaussian 的尺度要相应调整。"}, {"q_zh": "为什么飞点对“逐视角前向 splat 再融合”的方法比对体素 TSDF 更致命？", "a_zh": "在体素 TSDF 中，一个飞点只是众多观测中的一个，经过截断和加权平均后影响有限。逐像素前向 splat 则会把每个飞点都渲染成一个完全不透明的小 Gaussian，悬在目标视角的空中并遮挡背景，只能靠融合网络去识别和修复。Ha 正因如此才把各视角分开渲染再融合，并用 TSDF 深度引导网络取舍。"}], "prereqs": ["g-depth"]}]}, {"id": "M4", "title_zh": "图形学与渲染基础", "title_en": "Graphics & rendering fundamentals", "goal_zh": "理解光栅化、alpha 合成、体渲染和光线步进，这是读懂所有神经渲染论文的共同语言。", "intro_zh": "M4 讲的是“把三维内容变成像素”的几种基本算法。3D telepresence 的每一帧都要做一次渲染：在几十毫秒内，把远端人物的几何和颜色投到本地观看者的眼睛位置。神经渲染论文里反复出现的 splat、z-buffer、alpha、over、透射率 T、体渲染权重、ray march、零交叉、SH、Lambertian 等词，都来自这里。\n\n两篇锚点论文的渲染器几乎都由这些经典算子搭成。Quark 的最终输出是 Sec. 3.1 式 (1) 的 over 合成：把全分辨率输入图像反投影到 LDM 各层，用 blend weights 混合，再从后向前合成，1080p 下 CUDA 实现约 1.3 ms。迭代中的 Render to Input Views（Sec. 3.2.2，式 (2)）则是“双线性 splat + over”。Ha et al. 分三步：\n- 第一步直接调用原版 3DGS 光栅器，把像素大小的高斯逐视角前向 splat 到目标视角（Sec. 3.1；表 4：10 ms）；\n- 第二步在目标射线上对 image-based TSDF 做光线步进，步长 0.8·s，再做 3 次二分（附录 A.1；表 4：6 ms）；\n- 第三步用累积 alpha 做归一化混合，并以 over 的形式混入背景图来补洞（Eq. 4–5）。\n\n不掌握这些，读锚点论文会在几处卡住：\n- Quark 为什么说“层可以看作体积光线步进的步”；σ 明明叫 density，为什么取值在 [0,1]；\n- Ha 为什么坚持逐视角分别渲染，而不是一次渲染所有高斯（z-fighting 与飞点）；\n- 两篇为什么都在高光处出问题（凸组合无法外推视角相关外观）；\n- 两者为什么都选“逐视角、用完即丢”的表示，而不是 3DGS 那样的全局表示，以及这对双目头显、多观众和时间一致性意味着什么。\n\n本模块 6 个概念按依赖顺序分五步：\n1. 两种基本的“画到屏幕上”的方式：光栅化/splatting（r-raster）与 alpha 合成（r-alpha）；\n2. 用体渲染方程把二者统一起来（r-volume）；\n3. 隐式表面求交，即光线步进（r-raymarch）；\n4. 颜色为什么随视角变，即反射模型（r-appearance）；\n5. 把所有三维表示放到同一张权衡表上（r-reps）。\n\n学完后你应能做到：\n- 手算一条射线上的合成颜色、累积不透明度和期望深度；\n- 逐行解释 3DGS 光栅器的关键代码；\n- 复现 Ha 的 TSDF 光线步进，并发现其符号约定和未归一化加权和带来的问题；\n- 说清 LDM、MPI、3DGS、NeRF、TSDF 在存储、速度、时间一致性和视点扩展上的差别。", "study_tips_zh": "建议用约 2 周时间，纸笔推导、小段代码和读源码交替进行。CMU 16-825（Learning for 3D Vision）Fall 2026 课表中的 Volume Rendering 与 Differentiable Primitive Rendering (Meshes, Gaussians) 两讲可作配套。\n\n1. 纸笔（半天）：\n   - 取 3 个半透明层，分别按后到前和前到后合成一遍，验证结果相同、权重之和等于 1−T；\n   - 算期望深度，观察半透明边缘出现的“浮空深度”；\n   - 对同一段介质比较“一个 δ”和“两个 δ/2”的 α，理解为什么要用 1−exp(−σδ)。\n\n2. 光栅化（1–2 天，numpy 或 C++）：跟着 tinyrenderer 写三角形填充和 z-buffer。然后把一张 RGB-D 图前向 warp 到平移 10 cm 的新相机，依次做三次：\n   - 1 像素点 splat：看网格状裂缝；\n   - Ha 式像素大小、各向同性、不透明的高斯，按深度排序后从前到后混合：看裂缝消失、边缘抗锯齿；\n   - 把两张不同视角的 RGB-D 一次性 splat，并给其中一张的深度加 ±5 mm 噪声：亲眼看到 z-fighting。\n\n3. 体渲染（1 天）：写一个 composite(sigmas, colors, ts) 函数。\n   - 验证 σ→∞ 时它退化为 z-buffer；\n   - 用 64 个采样表示一个表面，再只用 6 个位置可学的层去拟合，体会 LDM 是“稀疏自适应求积”。\n\n4. 光线步进（1–2 天）：用 2–3 张合成深度图（一个平面加一个球）实现 image-based TSDF，s = Σω·clamp(D−z, −τ, τ)，按 0.8·s 步进，再做 3 次二分。\n   - 画出每条射线的步数热图；\n   - 把 0.8 改成 1.0 和 0.5，比较步数和失败情况；\n   - 再照 Ha A.1 的字面写法（s_k = z_k − D_k，且 s_k < −τ 时 ω_k = 0）实现一遍，观察射线为什么停住或往回走；\n   - 比较 s 用“加权和”与“加权平均”两种写法：在 Σω > 1.25 时，前者会不会一步越过表面、落进 s = 0 的无信息区；\n   - 最后加上 Starline 式的逐射线 min/max 搜索区间，看步数下降多少。\n\n5. 外观（半天）：用 Blinn-Phong 加 Schlick 菲涅尔渲染一个球的 8 个视角，取最近两个视角做 IBR 混合，观察高光重影以及“凸组合不能外推”；再用 3 阶 SH 拟合某一点的视角相关颜色，看尖锐高光怎样被抹平。\n\n6. 读源码（1 天）：读 graphdeco-inria/diff-gaussian-rasterization 的 cuda_rasterizer/forward.cu。重点看 computeCov2D 里的 J、W 和 +0.3，getRect 前的半径计算 ceil(3·√λ_max)，以及 renderCUDA 里的 0.99、1/255 和 T < 1e-4。逐行对照 3DGS 论文 Eq. 4–6 和附录 C。\n\n7. 回到锚点论文：\n   - 精读 Quark Sec. 2.1、3.1–3.2.3、4.3，以及 Ha Sec. 3.1–3.3、A.1–A.4；\n   - 在论文 PDF 上标注每个公式对应本模块的哪个概念；\n   - 参照 r-reps 的表格，为两篇各写一段“为什么选这个表示、代价是什么”。", "concepts": [{"id": "r-raster", "name_zh": "光栅化、z-buffer 与点溅射（splatting）", "name_en": "Rasterization, z-buffer & point splatting", "tldr_zh": "光栅化以图元为中心：把三角形或点投到屏幕上，再用 z-buffer 为每个像素保留最近的那个图元。splatting 把每个点换成有面积的足迹核（例如 2D 高斯）。二者都是 scatter 式的前向渲染，速度快，但可见性、空洞和走样都要自己处理。", "intuition_zh": "渲染有两种基本的循环顺序。光线追踪以像素为中心：每个像素发出一条射线，问它先碰到什么（gather）。光栅化以图元为中心：对每个三角形或点，先用针孔模型把顶点投影到屏幕，找出它覆盖了哪些像素，再把颜色写进去（scatter）。多个图元落在同一像素时，用 z-buffer 决定谁留下：每个像素存一个当前最近深度，新片元只有更近才能覆盖。GPU 图形管线就是这样一条链：顶点变换 → 裁剪与图元装配 → 覆盖测试（edge function）→ 透视校正的属性插值 → 片元着色 → 深度测试 → 写帧缓冲。\n\n点云没有三角形那样的连接关系。最朴素的做法是每个点只写一个像素，但这会造成采样率失配。新视角比原视角更近（放大）时，相邻点投影后的间距超过 1 像素，出现裂缝和空洞；缩小时，多个点挤进同一像素，产生锯齿和闪烁。Splatting 给每个点一个有面积的核（圆盘或 2D 高斯）。EWA splatting（Zwicker 等，2001/2002）给出了有原理依据的做法：把点看作 3D 高斯，用投影在该点处的雅可比 J 做局部线性化，把 3D 协方差变成 2D 屏幕协方差，再叠加一个屏幕空间低通滤波，从而同时解决空洞和走样。3DGS 就是 EWA splatting 的可微 GPU 实现：把屏幕切成 16×16 的 tile，按“视空间深度 + tile ID”对全部高斯做一次基数排序，然后逐像素从前到后做 alpha 混合。\n\n可见性是 splatting 的核心难点。硬 z-buffer 对深度噪声很脆弱。两个来自不同相机、对应同一表面的点，深度只差几毫米，谁胜出完全由噪声决定，输出就在两者之间随机跳变，这就是 z-fighting。一个深度错误的“飞点”（落在前景和背景之间）一旦通过深度测试，就会遮住正确的背景，而且之后无法挽回。因此实际系统有两种选择：用软 z-buffer，让深度差小于阈值的片元做混合而不是覆盖；或者像 Ha et al. 那样把每个输入视角分开渲染，把“该信谁”留给后面的融合网络去判断。\n\nscatter 与 gather 是一对伴随算子。在几何固定时，双线性 splat 把一个值按双线性权重分给 4 个邻近像素，它的转置恰好是双线性采样，也就是按同样的权重从 4 个邻近像素取值。Quark 用的正是这一对：迭代中用 splat（记为 P）把 LDM 投到输入视角；最终渲染时用它的伴随 P^T，把输入图像“反投影”到 LDM 各层上。", "analogy_zh": "光栅化像用镂空模板往墙上喷漆。每个图形按自己的位置喷一遍；z-buffer 相当于给墙上每个格子记下当前那层漆离观察者多远，后喷的漆只有“更靠前”才能盖住原来的。点溅射则像往纸上甩水彩点：点太稀会露白（空洞）；只有晕染半径（高斯核）随远近调得合适，才能既不露白，又不糊成一片。", "equations": [{"tex": "E_{ab}(\\mathbf{p}) = (p_x - a_x)(b_y - a_y) - (p_y - a_y)(b_x - a_x),\\qquad \\lambda_2 = \\frac{E_{v_0 v_1}(\\mathbf{p})}{E_{v_0 v_1}(\\mathbf{v}_2)}", "explain_zh": "Edge function。a、b 是三角形某条边两个端点的屏幕坐标，p 是像素中心。E_ab(p) 是 2D 叉积，等于 p 与这条边构成的平行四边形的有向面积（三角形面积的 2 倍）。三条边的 E_{v0v1}、E_{v1v2}、E_{v2v0} 同号时，p 在三角形内。面积之比就是重心坐标：λ2 = E_{v0v1}(p)/E_{v0v1}(v2)，λ0、λ1 同理，且 λ0+λ1+λ2 = 1。GPU 的覆盖测试就是对每个像素并行求这三个值。"}, {"tex": "a(\\mathbf{p}) = \\frac{\\sum_i \\lambda_i\\, a_i / z_i}{\\sum_i \\lambda_i / z_i},\\quad z(\\mathbf{p}) = \\Big(\\sum_i \\lambda_i / z_i\\Big)^{-1};\\qquad \\text{if } z(\\mathbf{p}) < Z[\\mathbf{p}]:\\ \\ Z[\\mathbf{p}] \\leftarrow z(\\mathbf{p}),\\ \\ C[\\mathbf{p}] \\leftarrow a(\\mathbf{p})", "explain_zh": "透视校正插值加深度测试。a_i 是三个顶点的属性（颜色、纹理坐标等），z_i 是顶点在相机坐标下的深度，λ_i 是屏幕空间重心坐标。透视投影之后，在屏幕上线性变化的是 1/z 和 a/z，而不是 a 本身，所以要先插值 a/z 与 1/z，再相除；像素深度 z(p) 也由插值后的 1/z 取倒数得到。Z 是 z-buffer，每像素存当前最近的深度；C 是颜色缓冲。只有新片元的 z(p) 更小时，才同时更新两者。"}, {"tex": "\\Sigma_{2D} = J\\,W\\,\\Sigma\\,W^{\\top}J^{\\top} + 0.3\\,I_2,\\qquad J = \\begin{pmatrix} f_x/z & 0 & -f_x x/z^2 \\\\ 0 & f_y/z & -f_y y/z^2 \\end{pmatrix}", "explain_zh": "EWA 协方差投影，即 3DGS 论文 Eq. 5 的 Σ' = JWΣWᵀJᵀ（取前两行两列）。Σ 是高斯在世界坐标下的 3×3 协方差；W 是世界到相机变换的旋转部分；(x, y, z) 是高斯中心在相机坐标下的位置；f_x、f_y 是以像素为单位的焦距。J 是透视投影在高斯中心处的雅可比，即局部仿射近似：1/z 项让足迹随距离缩小，含 x/z²、y/z² 的项体现离轴时的拉伸。结果 Σ_2D 是 2×2 的屏幕协方差，单位 px²。+0.3·I 是官方光栅器 computeCov2D 里加的屏幕空间低通，使每个高斯在屏幕上的标准差至少约 √0.3 ≈ 0.55 px。"}, {"tex": "\\alpha_i(\\mathbf{p}) = \\min\\!\\Big(0.99,\\ o_i \\exp\\!\\big(-\\tfrac{1}{2}(\\mathbf{p}-\\boldsymbol{\\mu}_i)^{\\top}\\Sigma_{2D,i}^{-1}(\\mathbf{p}-\\boldsymbol{\\mu}_i)\\big)\\Big),\\qquad C(\\mathbf{p}) = \\sum_i \\mathbf{c}_i\\,\\alpha_i \\prod_{j<i}(1-\\alpha_j)", "explain_zh": "高斯 splat 的逐像素混合。μ_i 是第 i 个高斯中心在屏幕上的投影；o_i 是不透明度参数（Ha 设为 1）；α_i(p) 是它在像素 p 处的有效不透明度，上限截到 0.99；c_i 是颜色；i 按深度从近到远排序。按 3DGS 附录 C 和 forward.cu，α < 1/255 的贡献直接跳过；如果加上当前高斯后透射率会低于 10⁻⁴，就提前终止。完全不透明的高斯在中心处 α = 0.99，几乎把后面全部遮住，此时整个过程近似一个带软边的 z-buffer。"}], "worked_example_zh": "设源相机和目标相机的焦距都是 f = 1000 px。\n\n(1) 像素高斯的屏幕足迹。源图中某像素的深度为 2.0 m。Ha 的论文只说高斯尺度要让它在源图中的投影恰好覆盖 1 个像素，没有给出常数因子；这里取 s = z/f = 2 mm。设该点在目标相机坐标系下为 (x, y, z) = (0.2, 0, 2.0) m，投影在距主点 u = f·x/z = 100 px 处。雅可比 J = [[500, 0, −50], [0, 500, 0]]。各向同性时 Σ = s²·I = 4×10⁻⁶·I m²，旋转 W 不影响结果，于是 Σ_2D = s²·J·Jᵀ = 4×10⁻⁶ × [[500²+50², 0], [0, 500²]] = [[1.01, 0], [0, 1.00]] px²。加上 0.3 的低通后为 [[1.31, 0], [0, 1.30]]，标准差约 1.14 px。光栅器按 λ_max = mid + √max(0.1, mid² − det) 估计最大特征值：这里 mid = 1.305，mid² − det ≈ 0，被 max(0.1, ·) 抬到 0.1，得 λ_max ≈ 1.62，包围半径 ceil(3·√1.62) = 4 px。可见对近似各向同性的高斯，这个 max(0.1, ·) 会把半径略微放大。\n\n(2) 该高斯在各像素的 α（o = 1）：\n- 中心处 min(0.99, 1) = 0.99；\n- 水平偏 1 px 时 exp(−0.5·1/1.31) = 0.68；\n- 偏 2 px 时 0.22；\n- 偏 3 px 时 0.03，仍大于 1/255，参与混合；\n- 偏 4 px 时 0.002，小于 1/255，被跳过。\n可见“完全不透明”的像素高斯在中心就把透射率压到了 0.01，效果相当于一个带约 1 px 抗锯齿边缘的软 z-buffer。\n\n(3) 空洞。改用 1 像素点溅射，并把目标相机前移，使同一表面的深度变为 1.0 m。相邻源像素在世界中相距 2 mm，在目标图中相距 1000×0.002/1.0 = 2 px，于是每隔一个像素就空一个，出现网格状裂缝。高斯足迹会按 1/z 放大，此时标准差约 √(2² + 0.3) ≈ 2.1 px，裂缝被填上。这就是 Ha 在附录 A.3 和图 10 中说点溅射有“像素间空隙和锯齿边”的原因。\n\n(4) z-fighting。同一表面点在视角 A 的深度估计为 2.003 m，在视角 B 为 1.998 m（立体噪声在 ±5 mm 量级）。如果像 GPS-Gaussian 那样一次性渲染所有视角的高斯，每个像素都由更近者以 α ≈ 0.99 占据，而“谁更近”随噪声逐像素随机切换。只要 A、B 之间有 1 px 的配准误差或一点曝光差，输出就是两张图的椒盐式拼贴。Ha 表 3 中，单遍渲染的 No Blending 为 PSNR 24.64、STED 483.3，完整方法为 31.17、68.76。这个差距里也包含融合网络本身的贡献；但作者在 Sec. 3.1 和图 4 中给出的直接原因，就是单遍渲染造成的飞点、空洞和 Z-fighting。", "pitfalls_zh": ["把 splat 半径当成常数。足迹必须随深度和视角变化：EWA 的 J 同时含 1/z 项和 x/z²、y/z² 项。固定 1 px 的点溅射在放大时必然开裂。Ha 用解析尺度，但高斯是各向同性的，忽略了表面倾斜，在掠射角下仍会拉伸或留缝。", "以为 3DGS 光栅器逐像素排序。它只按“中心深度 + tile ID”全局排一次序，3DGS Sec. 6 原话是 no additional per-pixel ordering，所以大高斯交叠时会错序并出现 popping。论文同一段指出，只有高斯接近像素大小时，这个近似的误差才可以忽略，而这恰好是 Ha 选择像素级高斯的前提。", "硬 z-test 对深度噪声没有容错。多台相机拍到的同一表面会在 z-buffer 中互相 z-fighting；飞点一旦通过深度测试，就会遮住正确内容，之后无法纠正。多视角融合要么用软 z-buffer 或按深度阈值混合，要么像 Ha 那样逐视角分开渲染后再融合。", "混淆 scatter 与 gather。前向 splat（源 → 目标）会产生空洞，但不需要目标深度；后向采样（目标 → 源）不产生空洞，但要先知道目标深度。Quark 的最终渲染（式 (1) 中的 P^T）属于后者，深度由 LDM 给出；迭代内部的 Render to Input Views（式 (2)）属于前者。"], "in_quark": {"used": true, "where": "Sec. 3.2.2（Render to Input Views，Eq. 2）；Sec. 3.1 Eq. 1 中的 P^T；Sec. 1 与 Sec. 2.1（LDM 与 layered mesh 的区别）", "how_zh": "Quark 既不用三角形光栅化，也不用 z-buffer。每个 Update & Fuse 步里，它按当前深度 d，把中间 LDM 每层的 density 和 appearance 双线性 splat 到 M = 8 个输入视角（投影算子 P_θ），再逐层 over 合成得到
