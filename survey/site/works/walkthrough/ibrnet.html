/* ---------- fonts: ET Book for Latin (self-hosted), Noto Serif SC for Chinese text, LXGW WenKai for notes ---------- */
/* ET Book leaves curly quotes, dashes and ellipses to the Chinese font so they keep full width in Chinese prose,
   and single guillemets (› ‹), which it lacks. */
@font-face { font-family: "et-book"; font-weight: 400; font-style: normal; font-display: swap;
  src: url("../../fonts/et-book/et-book-roman-line-figures.woff") format("woff");
  unicode-range: U+0000-2013, U+2015-2017, U+201A-201B, U+201E-2025, U+2027-2038, U+203B-FFFF; }
@font-face { font-family: "et-book"; font-weight: 400; font-style: italic; font-display: swap;
  src: url("../../fonts/et-book/et-book-display-italic-old-style-figures.woff") format("woff");
  unicode-range: U+0000-2013, U+2015-2017, U+201A-201B, U+201E-2025, U+2027-2038, U+203B-FFFF; }
@font-face { font-family: "et-book"; font-weight: 700; font-style: normal; font-display: swap;
  src: url("../../fonts/et-book/et-book-bold-line-figures.woff") format("woff");
  unicode-range: U+0000-2013, U+2015-2017, U+201A-201B, U+201E-2025, U+2027-2038, U+203B-FFFF; }
/* Notes pair Latin italic with upright Kai (the "italic ↔ 楷体" rule): the italic cut is registered as an upright
   family so the browser never slants the Chinese glyphs. */
@font-face { font-family: "et-book-note"; font-weight: 400; font-style: normal; font-display: swap;
  src: url("../../fonts/et-book/et-book-display-italic-old-style-figures.woff") format("woff");
  unicode-range: U+0000-2013, U+2015-2017, U+201A-201B, U+201E-2025, U+2027-2038, U+203B-FFFF; }
@font-face { font-family: "et-book-osf"; font-weight: 400; font-style: normal; font-display: swap;
  src: url("../../fonts/et-book/et-book-roman-old-style-figures.woff") format("woff"); }

:root {
  --bg: #fffff8;
  --ink: #111111;
  --ink-2: #3c3c36;
  --muted: #74746a;
  --rule: #d8d6c8;
  --rule-2: #b9b6a4;
  --accent: #a8322d;
  --serif: "et-book", "Noto Serif SC", "Source Han Serif SC", "Songti SC", "STSong", "SimSun", Palatino, Georgia, serif;
  --note: "et-book-note", "LXGW WenKai", "Kaiti SC", "STKaiti", "KaiTi", "et-book", serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --side: clamp(12rem, 21vw, 17rem);
  --gap: 2.75rem;
  --main: calc(100% - var(--side) - var(--gap));
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161614; --ink: #e2e0d6; --ink-2: #c3c1b6; --muted: #979589; --rule: #34332e; --rule-2: #4d4b44; --accent: #e8836f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161614; --ink: #e2e0d6; --ink-2: #c3c1b6; --muted: #979589; --rule: #34332e; --rule-2: #4d4b44; --accent: #e8836f;
  color-scheme: dark;
}

/* ---------- base ---------- */
* { box-sizing: border-box; }
html { font-size: 16px; -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--serif); font-size: 1.15625rem; line-height: 1.85;
  font-kerning: normal; font-variant-numeric: lining-nums;
  /* Space between Chinese and Latin text where the source has none; squeeze adjacent CJK punctuation
     (text-spacing-trim applies the fonts' halt / chws features). Browsers without them keep the source spacing. */
  text-autospace: normal; text-spacing-trim: normal;
  overflow-wrap: break-word;
  padding-top: env(safe-area-inset-top, 0px);
}
[hidden] { display: none !important; }
a { color: inherit; text-decoration-line: underline; text-decoration-thickness: 1px; text-underline-offset: .18em; text-decoration-color: var(--rule-2); }
a:hover { color: var(--accent); text-decoration-color: currentColor; }
a:focus-visible, button:focus-visible, summary:focus-visible, label:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }
.skip { position: absolute; left: -999px; top: 0; }
.skip:focus { left: 1rem; top: .5rem; background: var(--bg); padding: .2rem .5rem; z-index: 60; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
p { margin: 0; }
p + p { margin-top: .9em; }

/* ---------- top bar ---------- */
.topbar { border-bottom: 1px solid var(--rule); }
.bar-in { max-width: 67rem; margin: 0 auto; padding: 0 1.5rem; display: flex; align-items: center; gap: 2.2rem; min-height: 3.1rem; }
.brand { font-size: 1rem; text-decoration: none; letter-spacing: .02em; white-space: nowrap; }
.site-nav { flex: 1; }
.menus { list-style: none; margin: 0; padding: 0; display: flex; gap: 1.6rem; }
.menu { position: relative; }
.menu-btn, .theme-btn, .burger {
  font-family: "et-book", var(--serif); font-variant-caps: all-small-caps; letter-spacing: .08em; font-size: 1.12rem;
  color: var(--ink-2); line-height: 3.1rem;
}
.menu-btn:hover, .theme-btn:hover, .burger:hover, .menu.open > .menu-btn { color: var(--accent); }
.menu.cur > .menu-btn { color: var(--ink); box-shadow: inset 0 -1px 0 var(--ink); }
.drop {
  display: none; position: absolute; left: -1rem; top: 100%; z-index: 40; min-width: 13rem;
  list-style: none; margin: 0; padding: .45rem 0; background: var(--bg); border: 1px solid var(--rule);
}
.menu.open > .drop { display: block; }
.drop a { display: block; padding: .15rem 1rem; text-decoration: none; font-size: 1.02rem; color: var(--ink-2); white-space: nowrap; }
.drop a:hover, .drop a:focus-visible { color: var(--accent); }
.drop a.cur { color: var(--ink); }
.drop a.cur::before { content: "›"; position: absolute; margin-left: -.7rem; color: var(--accent); }
.theme-btn { margin-left: auto; }
.burger { display: none; }

/* ---------- article column + margin ---------- */
main { display: block; }
.art { max-width: 67rem; margin: 0 auto; padding: 2.6rem 1.5rem 3rem; counter-reset: sidenote-counter; }
.art > *, .art section > * { width: var(--main); }
.art > section { width: 100%; }
.art .fullwidth { width: 100%; }
section { padding-top: .6rem; }

.crumbs { font-size: .86rem; color: var(--muted); letter-spacing: .01em; }
.crumbs a { color: var(--muted); text-decoration: none; }
.crumbs a:hover { color: var(--accent); }
.crumbs .sep { margin: 0 .45em; color: var(--rule-2); }
h1, h2, h3 { font-family: var(--serif); color: var(--ink); text-wrap: balance; }
h1 { font-size: 2.3rem; font-weight: 400; line-height: 1.3; margin: .9rem 0 0; letter-spacing: .01em; }
.subtitle { font-family: "et-book", var(--note); font-style: italic; font-size: 1.45rem; line-height: 1.3; color: var(--ink-2); margin-top: .35rem; }
.meta { font-size: .92rem; color: var(--muted); margin-top: 1.1rem; }
.meta a { color: var(--muted); }
h2 { font-size: 1.42rem; font-weight: 600; line-height: 1.4; margin: 2.6rem 0 .9rem; }
h3 { font-size: 1.12rem; font-weight: 600; line-height: 1.5; margin: 1.8rem 0 .5rem; }
h3 .used { font-family: var(--note); font-weight: 400; font-size: .86rem; color: var(--muted); margin-left: .6em; }

.epigraph { margin: 2.2rem 0 .6rem; }
.epigraph blockquote { margin: 0; padding: 0 0 0 1.6rem; border-left: 1px solid var(--rule-2); }
.epigraph p { font-family: var(--note); font-size: 1.12rem; line-height: 1.85; color: var(--ink-2); }

.art ol, .art ul { margin: .6rem 0 0; padding-left: 1.6em; }
.art li + li { margin-top: .45rem; }
li::marker { font-family: "et-book-osf", var(--serif); color: var(--muted); }

/* Equations: display math in the text column, scrolling sideways on narrow screens. */
.eqs { display: block; }
.eq + .eq { margin-top: 1.6rem; }
.math-block { overflow-x: auto; overflow-y: hidden; margin: .4rem 0 .6rem; padding: .2rem 0; font-size: 1rem; }
.math-block mjx-container { margin: 0 !important; }

/* ---------- side notes & margin notes (floated into the right margin) ---------- */
.sidenote, .marginnote {
  float: right; clear: right; position: relative;
  width: var(--side); margin-right: calc(-1 * (var(--side) + var(--gap))); margin-top: .3rem; margin-bottom: .6rem;
  font-family: var(--note); font-size: .88rem; line-height: 1.6; color: var(--ink-2); text-align: left;
  font-style: normal; font-weight: 400; letter-spacing: 0;
}
h3 .sidenote { margin-top: .2rem; }
.sidenote-number { counter-increment: sidenote-counter; }
.sidenote-number::after, .sidenote::before { font-family: "et-book-osf", var(--serif); position: relative; vertical-align: baseline; }
.sidenote-number::after { content: counter(sidenote-counter); font-size: .75rem; top: -.55em; left: .08em; color: var(--ink-2); }
.sidenote::before { content: counter(sidenote-counter) " "; font-size: .8rem; top: -.4em; }
.note-label { font-family: var(--serif); font-weight: 600; font-size: .82rem; color: var(--muted); margin-right: .5em; }
.marginnote .note-label { display: block; margin: 0 0 .1rem; }
input.margin-toggle { display: none; }
label.sidenote-number { display: inline; cursor: default; }
label.margin-toggle:not(.sidenote-number) { display: none; }

/* ---------- quiz, further reading, series ---------- */
.quiz details { margin-top: .3rem; }
.quiz summary { font-family: var(--note); font-size: .92rem; color: var(--muted); cursor: pointer; list-style: none; display: inline-block; }
.quiz summary::-webkit-details-marker { display: none; }
.quiz summary::before { content: "+ "; font-family: "et-book", var(--serif); }
.quiz details[open] summary::before { content: "− "; }
.quiz summary:hover { color: var(--accent); }
.quiz details > p { margin-top: .3rem; padding-left: 1rem; border-left: 1px solid var(--rule); color: var(--ink-2); }

/* Reference lists: a narrow label column (kind / year) and a hanging text column. */
.art ul.refs { list-style: none; padding-left: 0; }
.refs li { display: grid; grid-template-columns: 2.8rem minmax(0, 1fr); column-gap: .5rem; line-height: 1.6; }
.refs li > :not(.kind):not(.yr) { grid-column: 2; }
.refs .kind, .refs .yr { grid-column: 1; font-family: var(--note); font-size: .86rem; color: var(--muted); padding-top: .12rem; }
.refs .yr { font-family: "et-book-osf", var(--serif); font-size: .95rem; padding-top: .05rem; }
.refs .en { font-family: "et-book", var(--serif); font-style: italic; color: var(--muted); font-size: .92rem; line-height: 1.5; }
.refs .gloss { font-family: var(--note); font-size: .88rem; color: var(--ink-2); margin-top: .1rem; }
.art .refs li + li { margin-top: .75rem; }
.art .papers li + li { margin-top: .35rem; }
/* Without a label column the list is a plain stack (no grid, so nothing can land in a phantom second column). */
.refs.noleft li { display: block; }
.refs.wide-kind li { grid-template-columns: 6.2rem minmax(0, 1fr); }
.refs .used { font-family: var(--note); font-size: .82rem; color: var(--muted); margin-left: .5em; }
.refs.terms .plain-t { font-weight: 600; }
.refs.terms .en { display: inline; margin-left: .6em; }
.timeline li { line-height: 1.7; }
.art .timeline li + li { margin-top: .4rem; }

/* ---------- blocks: lede, run-in labels, notes ---------- */
.lede { margin-top: 1.6rem; color: var(--ink-2); }
.run-in { font-weight: 600; color: var(--ink); }
p.note { font-family: var(--note); font-size: .9rem; color: var(--muted); margin-top: .1rem; }
h2 .en, h3 .en { font-family: "et-book", var(--serif); font-style: italic; font-weight: 400; color: var(--muted); margin-left: .6em; font-size: .92em; }
h2 a, h3 a { text-decoration-color: var(--rule); }
.quiz-h { font-family: var(--note); font-size: .88rem; color: var(--muted); margin-top: 1.4rem; }
.quiz-h + ol.quiz { margin-top: .2rem; }

/* Index pages: a table of contents instead of a card grid. */
.art ol.toc { list-style: none; padding-left: 0; margin-top: .4rem; }
.art ol.toc > li + li { margin-top: .85rem; }
.toc-t { line-height: 1.55; }
.toc-t .en { font-family: "et-book", var(--serif); font-style: italic; color: var(--muted); margin-left: .6em; font-size: .95em; }
.toc-meta { font-family: var(--note); font-size: .82rem; color: var(--muted); margin-left: .7em; white-space: nowrap; }
.toc-s { font-family: var(--note); font-size: .9rem; line-height: 1.65; color: var(--ink-2); margin-top: .1rem; }
.toc-lede { font-family: var(--note); color: var(--ink-2); font-size: .95rem; }
h2.toc-h, h3.toc-h { margin-bottom: .3rem; }

/* Tables: booktabs rules (top, under the header, bottom), no vertical lines, no fills. */
.table-wrap { overflow-x: auto; margin: 1rem 0; }
table.booktabs { border-collapse: collapse; width: 100%; font-size: .9rem; line-height: 1.6; border-top: 1.5px solid var(--ink); border-bottom: 1.5px solid var(--ink); }
table.booktabs th { text-align: left; font-weight: 600; padding: .45rem .7rem .35rem 0; border-bottom: 1px solid var(--ink); white-space: nowrap; vertical-align: bottom; }
table.booktabs td { padding: .45rem .9rem .45rem 0; vertical-align: top; border-top: 1px solid var(--rule); }
table.booktabs tbody tr:first-child td { border-top: 0; }
table.rank td { white-space: nowrap; font-variant-numeric: tabular-nums; }
table.rank td:nth-child(2) { white-space: normal; }
.art table.kv { border-collapse: collapse; margin: .6rem 0; font-size: .95rem; width: auto; }
table.kv th { text-align: left; font-weight: 400; color: var(--muted); padding: .25rem 1.2rem .25rem 0; vertical-align: top; min-width: 5em; max-width: 12em; font-family: var(--note); }
table.kv td { padding: .25rem 0; vertical-align: top; }

/* Long articles: the table of contents sits at the top of the margin. */
/* It sits in a full-width section, so it floats into the margin without a negative offset. */
details.mtoc {
  float: right; clear: right; width: var(--side); margin-right: 0; margin-bottom: 1rem;
  font-family: var(--note); font-size: .86rem; line-height: 1.55; color: var(--ink-2);
}
details.mtoc summary { font-family: var(--serif); font-weight: 600; font-size: .82rem; color: var(--muted); list-style: none; cursor: default; }
details.mtoc summary::-webkit-details-marker { display: none; }
.art details.mtoc ol { list-style: none; padding: 0; margin: .3rem 0 0; }
.art details.mtoc li + li { margin-top: .25rem; }
details.mtoc a { text-decoration: none; }
details.mtoc a:hover { text-decoration: underline; }

/* Tools: search and filters with underlined inputs. */
.tool { margin-top: 1rem; }
.filters { display: flex; flex-wrap: wrap; gap: .6rem 1.6rem; align-items: baseline; font-family: var(--note); font-size: .92rem; color: var(--muted); }
.filters label { display: inline-flex; gap: .5rem; align-items: baseline; }
.filters input, .filters select {
  font: inherit; color: var(--ink); background: transparent; border: 0; border-bottom: 1px solid var(--rule-2); border-radius: 0;
  padding: .15rem .1rem; min-width: 7rem;
}
.filters input[type="search"] { min-width: 14rem; }
.filters select { max-width: 16rem; }
.filters input:focus, .filters select:focus { outline: none; border-bottom-color: var(--accent); }
.filters select option { background: var(--bg); color: var(--ink); }
.filters .count { margin-left: auto; font-family: var(--mono); font-size: .8rem; }
table.gl td.en { font-family: "et-book", var(--serif); width: 20%; }
table.gl .abbr { color: var(--muted); }
table.gl td.zh { white-space: nowrap; }
table.gl td.def { color: var(--ink-2); min-width: 20rem; }
table.gl td.c { font-size: .85rem; min-width: 9rem; padding-right: 0; }
table.gl tr:target td { background: color-mix(in srgb, var(--accent) 8%, transparent); }
table.db td.y { font-family: "et-book-osf", var(--serif); white-space: nowrap; }
table.db td.t { min-width: 16rem; }
table.db td.t small { display: block; color: var(--muted); font-size: .8rem; line-height: 1.45; margin-top: .15rem; }
table.db td.tags { min-width: 7rem; font-family: var(--note); font-size: .8rem; color: var(--muted); }
table.db td.tags span { display: block; }
table.db .tier.milestone { color: var(--ink); font-weight: 600; }
table.db td.s { min-width: 18rem; color: var(--ink-2); }
table.db td.n { min-width: 12rem; font-size: .82rem; color: var(--ink-2); }

/* Figures: the pipeline diagram and the timeline of classic papers, drawn in ink with one accent for interaction. */
figure { margin: 1.4rem 0; }
svg a { text-decoration: none; }
.diagram-wrap, .lanes-wrap { position: relative; overflow-x: auto; }
svg.diagram { width: 100%; min-width: 760px; height: auto; display: block; font-family: var(--note); }
svg.diagram .dnode rect { fill: var(--bg); stroke: var(--ink-2); stroke-width: 1; }
svg.diagram .dnode rect.data { stroke-dasharray: 4 3; }
svg.diagram .dnode:hover rect, svg.diagram .dnode:focus rect { stroke: var(--accent); stroke-width: 1.5; }
svg.diagram .dnode:focus { outline: none; }
svg.diagram text { fill: var(--ink); }
svg.diagram text.k { font-family: var(--mono); font-size: 10px; fill: var(--muted); }
svg.diagram text.t { font-family: var(--serif); font-size: 13px; font-weight: 600; }
svg.diagram text.s { font-size: 11px; fill: var(--ink-2); }
svg.diagram .dedge { fill: none; stroke: var(--ink-2); stroke-width: 1; }
svg.diagram .dedge.fb { stroke-dasharray: 4 3; }
svg.diagram .dhead { fill: var(--ink-2); }
svg.diagram .dloop { fill: none; stroke: var(--rule-2); stroke-dasharray: 2 3; }
svg.diagram .dlabel { font-size: 12px; fill: var(--muted); }
svg.diagram .dnote { font-size: 11px; fill: var(--muted); }
svg.diagram a.dnode:hover .dnote { fill: var(--accent); }
svg.lanes { width: 100%; min-width: 720px; height: auto; display: block; font-family: var(--note); }
svg.lanes .grid { stroke: var(--rule); stroke-width: 1; }
svg.lanes .axis { font-family: "et-book-osf", var(--serif); font-size: 12px; fill: var(--muted); }
svg.lanes .lane-l { font-size: 12px; fill: var(--ink-2); }
svg.lanes .brk { stroke: var(--muted); fill: none; }
svg.lanes .hit { fill: transparent; }
svg .dot { fill: var(--ink); }
svg .dot.hollow { fill: var(--bg); stroke: var(--ink-2); stroke-width: 1.2; }
svg.lanes a.m:hover .dot, svg.lanes a.m:focus .dot { fill: var(--accent); stroke: var(--accent); }
svg.lanes a.m:focus { outline: none; }
.vtip { position: absolute; z-index: 20; max-width: 20rem; padding: .45rem .7rem; background: var(--bg); border: 1px solid var(--rule-2); font-family: var(--note); font-size: .82rem; line-height: 1.5; pointer-events: none; }
.vtip b { display: block; font-family: "et-book", var(--serif); font-weight: 400; font-size: .92rem; }
.vtip small { display: block; color: var(--muted); }
.vtip span { color: var(--accent); }
figcaption { font-family: var(--note); font-size: .85rem; color: var(--muted); margin-top: .4rem; }
figcaption svg { vertical-align: -1px; }

.series { display: grid; grid-template-columns: 1fr auto 1fr; gap: 1rem; align-items: end; margin-top: 3.2rem; padding-top: 1rem; border-top: 1px solid var(--rule); font-size: .98rem; }
.series small { display: block; font-family: var(--note); font-size: .8rem; color: var(--muted); }
.series .up { text-align: center; font-size: .88rem; }
.series .up a { color: var(--muted); }
.series .next { text-align: right; }

.site-foot { max-width: 67rem; margin: 0 auto; padding: 1.2rem 1.5rem 2.5rem; font-size: .82rem; color: var(--muted); }

RNet 导读", "sub": "IBRNet: Learning Multi-View Image-Based Rendering", "meta": ["13 步", {"k": "anchor-ibrnet", "t": "IBRNet 精读"}], "epigraph": "", "prereqs": [], "lede": "", "minutes": 49}, "body": [{"b": "sec", "h": null, "id": "story"}, {"b": "mtoc", "items": [{"u": "#walk-ibrnet-ib1", "t": "IB1 问题设定：从 N=10 个邻近源视角插值新视角，泛化与逐场景微调两种用法"}, {"u": "#walk-ibrnet-ib2", "t": "IB2 源视角选择：测试取最近 10 个，训练从 n·N 候选池里随机抽 8–12 个"}, {"u": "#walk-ibrnet-ib3", "t": "IB3 源图特征提取：截断 ResNet34 的 U-Net，输出 1/4 分辨率 64 通道，拆成 32+32"}, {"u": "#walk-ibrnet-ib4", "t": "IB4 沿目标射线逆深度均匀采样 64 点，投影到 N 个源视角取 RGB、特征与相对方向 Δd"}, {"u": "#walk-ibrnet-ib5", "t": "IB5 跨视角聚合：方向调制 + 加权均值/方差 + 共享 MLP（105→64→32），PointNet 式集合函数"}, {"u": "#walk-ibrnet-ib6", "t": "IB6 可见性与加权池化：两级可见性打分后重新求均值/方差，得到 16 维密度特征 f_σ"}, {"u": "#walk-ibrnet-ib7", "t": "IB7 Ray transformer：同一射线上 64/128 个采样点做单层 4 头自注意力，再输出密度 σ"}, {"u": "#walk-ibrnet-ib8", "t": "IB8 颜色混合：每视角一个 logit，softmax 后对源像素颜色做凸组合"}, {"u": "#walk-ibrnet-ib9", "t": "IB9 体渲染：论文 Eq.(2) 含间距 δ，官方代码 α = 1 − exp(−σ) 不乘 δ；有效射线才计入损失"}, {"u": "#walk-ibrnet-ib10", "t": "IB10 粗细两级采样：coarse 权重构成逆深度 PDF，再采 64 点，128 点送入独立的 fine 网络"}, {"u": "#walk-ibrnet-ib11", "t": "IB11 训练：5 个数据源混合，coarse+fine MSE，Adam 1e-3/5e-4，8×V100 约一天"}, {"u": "#walk-ibrnet-ib12", "t": "IB12 泛化 vs 逐场景微调：同一网络在测试场景继续训练，前向场景 25.13 → 26.73"}, {"u": "#walk-ibrnet-ib13", "t": "IB13 怎么读实验：Table 1、消融、视角密度，以及 ENeRF、Du et al.、Ha et al. 的复测"}]}, {"b": "p", "t": "2020 年春天，NeRF 让新视角合成的画质上了一个台阶：给一个场景拍几十张照片，训练一个 MLP，把场景的颜色和密度“记”在网络权重里，再用体渲染画出任意视角。代价是每个场景都要从头优化一到两天，换一个场景就得重来。这对“拍完就想看”的应用完全不可用，更别说远程临场这种每帧都在变的视频。另一方面，图形学里早就有一条不需要训练的老路：基于图像的渲染（IBR），直接从附近的照片里“借”像素，按几何关系混合出新视角，比如 Unstructured Lumigraph 按射线夹角给每张照片打分。颜色都是真实像素，细节锐利，但权重是手工规则，几何稍有误差就出现重影。2019 年前后的学习式方法（LLFF、Free View Synthesis）把网络引进来，却要么依赖离散的平面表示，要么依赖事先重建好的几何代理。\n\nIBRNet 的出发点是把这两条路接起来：保留 NeRF 的“沿射线采样 + 体渲染”，因为它可微、只用照片就能训练；但不再把场景存进网络，而是在渲染时现场从附近的源视角取信息。这样网络学到的就不再是“某个场景长什么样”，而是一个通用的规则：给定一个 3D 点在 10 张源图里的样子，判断它是不是表面、该从哪几张图取颜色。规则是通用的，所以训练一次就能用于新场景。\n\n具体怎么判断？先看颜色从哪里来。对目标射线上的每个采样点，把它投影到 10 张源图，取出这 10 个位置的颜色和 CNN 特征。如果这个点正好在物体表面上，10 张图看到的应该是同一个东西，特征彼此接近、方差小；如果它悬在空中或藏在物体里面，10 张图看到的是各自身后的不同东西，方差就大。这就是多视角立体里的光度一致性。IBRNet 用一个 PointNet 式的小网络实现它：先算 10 个特征的均值和方差作为“全局意见”，再与每个视角自己的特征拼接，经共享 MLP 得到每个视角的新特征，同时估计每个视角的“可见性”，也就是它是否被别的东西挡住。按可见性加权后，再算一次均值和方差，得到这个点的密度特征。整个过程对视角顺序不敏感，视角数也可以变化。\n\n但只看单个点还不够。在遮挡边界附近，前景和背景的特征混在一起，单点判断经常出错，渲染出来是一块块“黑洞”。作者的关键直觉是：一个点是不是表面，要看同一条射线上它前后的点。于是他们在同一射线的 64 个（精细阶段 128 个）采样点之间加了一层自注意力，即 ray transformer，让每个点在决定自己的密度前先“看一眼”整条射线。这一层在消融里最关键：去掉后 PSNR 从 25.13 掉到 21.31。\n\n颜色则完全沿用 IBR 的思路。网络不直接输出 RGB，而是为 10 个源视角各输出一个分数，经 softmax 变成权重，对 10 个源像素颜色做加权平均。分数的输入除了特征和可见性，还有“目标射线和这个源视角射线的方向差”，夹角越小，这个源像素越可能和目标颜色一致，这正是 Unstructured Lumigraph 的原则，只不过权重由网络学出来。最后按 NeRF 的方式先用粗网络估一遍、再在可能有表面的位置加密采样，由精细网络再算一遍，沿射线合成像素颜色。训练只需要多视角照片：挑一张当目标，用附近的 8–12 张当源视角，比较渲染结果和真实照片。作者混合了 5 个数据源，在 8 张 V100 上训练约一天（补充材料）。\n\n结果如何？在前向拍摄的真实场景上，从未见过测试场景的预训练模型 PSNR 25.13，高于同样“训练一次到处用”的 LLFF（24.13）；在测试场景上再微调后达到 26.73，略高于逐场景训练的 NeRF。但在 360° 的合成物体上，视角稀疏、夹角大，微调后也只有 28.14，比 NeRF 低近 3 dB。更大的问题是速度：每个像素 192 个采样点，每个点要在 10 张图上取样并跑网络，官方 README 说一张 1000×800 的图要半分钟到一分钟；论文 Table 3 只比较了每像素 FLOPs（不到 NeRF 的 20%），没有给出实际耗时。\n\n所以读 IBRNet，要同时看到它开启了什么和留下了什么。它开启了“可泛化 NeRF / 学习式 IBR”这条线：GNT、NeuRay、GeoNeRF 直接复用它的代码或数据，GPNR 用它的数据训练，DynIBaR 把它推广到动态视频。它留下的问题，正是后来的工作要解决的：ENeRF 用代价体只在表面附近采样，快了至少 60 倍；pixelSplat、MVSplat 改为一次预测 3D 高斯再光栅化；GPNR、LVSM 干脆去掉体渲染，让 Transformer 直接出像素；站内重点论文 Quark 保留了“混合源像素”的输出方式，却用分层深度图和 One-to-many attention 取代了逐射线采样和均值/方差聚合，做到 1080p/30fps；Ha et al. 则把 IBRNet 当作基线，发现它在动态阵列上既不够清晰（DyNeRF 22.49 dB），也不稳定（STED 737.7）。对想做 3D 临场的读者，IBRNet 是理解“为什么输出层要混合真实像素、为什么几何推断必须变便宜、为什么要加时间维度”这三个问题的最好起点。"}, {"b": "sec", "h": "流水线", "id": "pipeline"}, {"b": "p", "t": "点击方框跳到对应步骤。"}, {"b": "slot", "name": "diagram", "which": "ibrnet", "label": "IBRNet 流程图", "spec": {"w": 960, "nodes": [{"x": 10, "y": 48, "w": 135, "h": 64, "t": "源图与相机", "s": "10 视角+深度范围", "step": "ib1", "data": true}, {"x": 10, "y": 160, "w": 135, "h": 64, "t": "源视角选择", "s": "按相机中心距离", "step": "ib2"}, {"x": 10, "y": 272, "w": 135, "h": 64, "t": "采样与投影", "s": "逆深度 64 点×N 视角", "step": "ib4"}, {"x": 167, "y": 48, "w": 135, "h": 64, "t": "特征提取", "s": "ResUNet，1/4 分辨率", "step": "ib3"}, {"x": 323, "y": 48, "w": 135, "h": 64, "t": "可见性池化", "s": "加权均值方差→f_σ", "step": "ib6"}, {"x": 323, "y": 160, "w": 135, "h": 64, "t": "均值/方差聚合", "s": "PointNet 式共享 MLP", "step": "ib5"}, {"x": 323, "y": 272, "w": 135, "h": 64, "t": "颜色混合权重", "s": "softmax 凸组合", "step": "ib8"}, {"x": 480, "y": 48, "w": 135, "h": 64, "t": "射线注意力", "s": "单层 4 头 → σ", "step": "ib7"}, {"x": 480, "y": 272, "w": 135, "h": 64, "t": "体渲染", "s": "代码中 α 不乘 δ", "step": "ib9"}, {"x": 637, "y": 48, "w": 135, "h": 64, "t": "训练损失", "s": "粗+细 MSE，8×V100", "step": "ib11"}, {"x": 637, "y": 272, "w": 135, "h": 64, "t": "新视角与评测", "s": "PSNR/SSIM/LPIPS", "step": "ib13", "data": true}, {"x": 793, "y": 48, "w": 135, "h": 64, "t": "逐场景微调", "s": "可选，60K 次迭代", "step": "ib12"}], "edges": [{"d": "M78,112 L78,160"}, {"d": "M78,224 L78,272"}, {"d": "M145,192 C156,192 156,80 167,80"}, {"d": "M302,80 C312,80 312,192 323,192"}, {"d": "M145,304 C234,304 234,192 323,192"}, {"d": "M390,160 L390,112"}, {"d": "M390,224 L390,272"}, {"d": "M458,80 L480,80"}, {"d": "M548,112 L548,272"}, {"d": "M458,304 L480,304"}, {"d": "M615,304 L637,304"}, {"d": "M615,304 C626,304 626,80 637,80"}, {"d": "M772,80 L793,80"}, {"d": "M704,336 L704,362"}], "loop": {"x": 311, "y": 16, "w": 316, "h": 346, "label": "粗 64 点 → 细 128 点，共两遍", "noteK": "ib10", "note": "fine 网络参数独立，按粗权重重采样"}, "out": {"x": 704, "y": 380, "text": "新视角图像（LLFF 1008×756，约 30–60 s/帧）"}, "h": 392}}, {"b": "sec", "h": "读之前先掌握", "id": "before"}, {"b": "refs", "items": [{"k": "concept-g-pinhole", "gloss": "IBRNet 的每个采样点都要用 K·[R|t] 投影到 N 个源视角取颜色和特征（projection.py），相机向量里存的是 4×4 内参和 camera-to-world 矩阵。不熟悉投影与反投影，就看不懂 ib4 的张量从哪里来。"}, {"k": "concept-g-epipolar", "gloss": "一条目标射线上的采样点投影到某张源图后排成一条极线。逆深度均匀采样对应极线上大致等距的像素位移，ray transformer 本质上是在比较这条极线上的一串观测。"}, {"k": "concept-g-depth", "gloss": "粗采样在 [near, far] 之间按逆深度（视差）均匀取点，精细采样也在逆深度空间里做 PDF 反演；深度范围来自 COLMAP 的逐图深度界。"}, {"k": "concept-d-mvs", "gloss": "均值/方差聚合就是多视角立体的光度一致性度量：表面上的点在各视角看起来一致、方差小。理解 MVSNet 的方差代价体，就理解了 ib5 为什么能“找到”表面。"}, {"k": "concept-i-blending", "gloss": "IBRNet 的颜色是源视角颜色的 softmax 加权平均，权重依据相对视角方向 Δd。这是 Unstructured Lumigraph 混合权重的学习版，也决定了它表达不了源图里没有的颜色。"}, {"k": "concept-r-volume", "gloss": "密度和颜色沿射线用体渲染合成。论文 Eq.(2) 与 NeRF 相同，但官方代码的 α = 1 − exp(−σ) 不乘样本间距，要先懂标准离散体渲染，才能看出这个差别对 σ 含义的影响。"}, {"k": "concept-n-nerf", "gloss": "粗细两级采样、三个评测基准、PSNR 对比对象都来自 NeRF。IBRNet 的核心卖点就是“不做 NeRF 那样的逐场景优化也能接近 NeRF”。"}, {"k": "concept-l-attention", "gloss": "ray transformer 是单层 4 头自注意力（d_k=4），加上按样本序号的正弦位置编码。需要熟悉 Q/K/V、多头、残差与 LayerNorm 才能读懂 mlp_network.py 里的 MultiHeadAttention。"}, {"k": "concept-l-cnn", "gloss": "源图特征来自截断在 layer3 的 ResNet34 加两级上采样解码的 U-Net，输出 1/4 分辨率、64 通道。要理解步长、跳连与输出尺寸的关系。"}, {"k": "concept-n-generalizable", "gloss": "IBRNet 是可泛化 / 前馈式新视角合成的早期代表。弄清“泛化”和“逐场景微调”两种设定的区别，才能正确读 Table 1 的上下两半。"}, {"k": "concept-f-prob", "gloss": "精细采样把粗网络的渲染权重当作沿射线的离散概率分布，用逆 CDF 采样新样本点（sample_pdf）。"}]}, {"b": "sec", "h": "IB1 · 问题设定：从 N=10 个邻近源视角插值新视角，泛化与逐场景微调两种用法", "id": "walk-ibrnet-ib1", "sn": {"label": "论文位置", "t": "§1、§3 开头（学习通用视角插值函数）；§4 评测数据与 Table 1；代码 ibrnet/data_loaders/llff_test.py、ibrnet/projection.py（相机向量格式）、configs/eval_llff.txt"}}, {"b": "p", "t": "输入：一个静态场景的已标定图像集合，目标相机的内外参，以及深度范围 [near, far]。每渲染一个目标视角，从集合里取 N 张源图（评测时 N=10）。代码把每台相机编码成 34 维向量：图像高宽 2 维、4×4 内参 16 维、4×4 camera-to-world 矩阵 16 维。输出：目标视角每个像素的 RGB（附带期望深度与累积不透明度）。两种设定：泛化（预训练一次，测试场景不做任何优化）和微调（IBRNet_ft，在测试场景的训练图上继续训练）。", "label": "这一步做什么", "mn": {"label": "需要的基础", "links": [{"k": "concept-g-pinhole"}, {"k": "concept-g-sfm"}, {"k": "concept-g-rig"}, {"k": "concept-n-generalizable"}, {"k": "adv-a-generalizable-ibr"}]}}, {"b": "p", "t": "先把 IBRNet 要解决的问题说清楚。NeRF 为每个场景训练一个网络，把场景存进权重里；IBRNet 想要的是一个不属于任何场景的网络：给它一堆附近的照片和它们的相机参数，它就能渲染出这些照片之间的新视角。作者把这叫作学习一个“通用的视角插值函数”。\n\n“插值”两个字很重要。IBRNet 的训练集和评测集都是稠密采集：真实前向场景每个有 20–62 张照片，测试时每 8 张留 1 张作目标，其余作为源视角池，从中按相机中心距离选最近的 10 张（g-pinhole、g-rig）。所以目标视角周围总有很近的照片，这与只给 2–3 张宽基线照片的稀疏设定（后来 pixelSplat、MVSplat 研究的问题）完全不同。\n\n深度范围也是输入的一部分。LLFF 类场景用 COLMAP（g-sfm）为每张图估出的近/远深度，代码取整个场景的最小值乘 0.9、最大值乘 1.6 作为 [near, far]；NeRF 合成数据固定为 2 到 6，RealEstate10K 固定为 1 到 100，Spaces 为 0.7 到 100。射线只在这个区间内采样，区间外的物体无法表示。\n\n两种用法的区别在于参数是否针对测试场景更新。泛化设定下，网络参数完全来自训练场景，这是 IBRNet 的主打（n-generalizable）；微调设定下，用测试场景自己的训练图继续训练一段时间，质量可以追上或超过 NeRF，但渲染时仍要从源视角取像素，网络并没有变成场景表示。后面 ib12 会专门讨论这一点。\n\n对 3D 临场来说，这个设定有一半是对的：固定阵列的相机参数已知，场景每帧在变，需要不做逐场景优化的方法。另一半不对：临场阵列往往只有 4–8 台相机，间距较大，而且要求 30 fps 以上，IBRNet 在这两点上都不满足（见 ib13）。", "mn": {"label": "类比", "t": "像一个经验丰富的修图师：给他任意一组从附近拍的照片，他都能“脑补”出两张照片之间的画面。他不需要事先认识这个房间，但前提是照片足够多、拍得足够近。"}}, {"b": "eqs", "eqs": [{"tex": "\\mathbf{cam}=\\big[H,\\;W,\\;\\mathrm{vec}(\\mathbf{K}_{4\\times4}),\\;\\mathrm{vec}(\\mathbf{T}_{c2w})\\big]\\in\\mathbb{R}^{34}", "explain_zh": "代码中的相机编码（projection.py 注释：34 = img_size(2) + intrinsics(16) + extrinsics(16)）。H、W 为图像高宽；K 是扩展成 4×4 的内参矩阵；T_c2w 是相机到世界的 4×4 变换。按代码改写。"}, {"tex": "(\\mathbf{c},\\sigma)=F_\\theta\\Big(\\mathbf{x},\\mathbf{d};\\;\\{(\\mathbf{I}_i,\\mathbf{P}_i)\\}_{i=1}^{N}\\Big)", "explain_zh": "IBRNet 学的函数：输入 3D 点 x、目标射线方向 d，以及 N 张源图 I_i 和相机参数 P_i，输出该点的颜色 c 和密度 σ。θ 是所有场景共享的网络参数，场景信息全部来自源图。F 对源视角的排列不变，N 可变。"}, {"tex": "[z_{\\text{near}},\\,z_{\\text{far}}]=\\big[0.9\\min_j b_j^{\\text{near}},\\;1.6\\max_j b_j^{\\text{far}}\\big]", "explain_zh": "LLFF 测试集的深度范围（llff_test.py:54-55、144）。b_j 是 COLMAP 为第 j 张图估计的近/远深度，min/max 在整个场景所有图像上取，包括被留出的测试图。按代码改写。"}]}, {"b": "p", "t": "评测：Real Forward-Facing 8 个场景，每个 20–62 张，1008×756，每 8 张留 1 张；Realistic Synthetic 360° 800×800，100 训练/200 测试视角；Diffuse Synthetic 360°（DeepVoxels）512×512，479 训练/1000 测试视角（论文 §4.1）。N=10（config.py 默认 num_source_views=10，评测配置未改）。LLFF 原图下采样 4 倍（factor=4）。代码评测配置默认 NeRF 合成 testskip=8、DeepVoxels testskip=10。", "label": "具体数字"}, {"b": "p", "t": "论文的动机是摆脱 NeRF 的逐场景优化，同时保留体渲染“可微、只用照片监督”的优点；选择“从源视角取信息”而不是“把场景编码成隐向量”，是为了让网络学到的东西与具体场景无关。深度范围作为输入给定，而不是让网络预测，这是沿用 NeRF 协议的做法，论文没有专门讨论替代方案。", "label": "为什么这样设计"}, {"b": "p", "t": "（1）“泛化”指网络参数不针对测试场景更新，不等于不需要测试场景的信息：位姿和深度范围来自包含测试图在内的整场景 COLMAP 重建，这是 NeRF 协议的惯例，但真实系统里目标视角没有照片参与标定。（2）“插值”依赖稠密视角；只给 2 张宽基线图时 IBRNet 很差（Du et al. 测得 15.99 dB，见 ib13）。（3）微调后的 IBRNet_ft 不是 NeRF 那样的自包含场景模型，渲染时仍要读源图。", "label": "容易误解的地方"}, {"b": "qa", "items": [{"q": "为什么说 IBRNet 的网络参数里“没有场景”，而 NeRF 的网络参数里“就是场景”？这个区别对新场景意味着什么？", "a": "NeRF 的 MLP 输入只有坐标和方向，场景的全部外观和几何都只能存在权重里，所以换场景必须重训。IBRNet 的输入里包含源图的颜色和特征，网络只需学会“如何根据多张图判断表面和取色”，场景内容在推理时由源图提供。因此新场景只要有足够近的源视角，就可以直接渲染；代价是渲染时离不开源图，而且源视角离得远时效果变差。"}]}, {"b": "sec", "h": "IB2 · 源视角选择：测试取最近 10 个，训练从 n·N 候选池里随机抽 8–12 个", "id": "walk-ibrnet-ib2", "sn": {"label": "论文位置", "t": "§3.1 View selection；§3.4 实现细节（训练时的 n·N 候选池）；代码 ibrnet/data_loaders/data_utils.py: get_nearest_pose_ids；llff.py:88-107；realestate.py；spaces_dataset.py:405-419"}}, {"b": "p", "t": "输入：目标相机位姿、候选图像的位姿列表。输出：N 个源视角的索引。测试：按距离排序取最近的 N=10 个。训练：先取最近的 min(10·n, 上限) 个作为候选池，再从中随机抽 N 个；有 0.5% 概率把目标图本身放进去。", "label": "这一步做什么", "mn": {"label": "需要的基础", "links": [{"k": "concept-i-blending"}, {"k": "concept-g-rig"}, {"k": "concept-g-sfm"}, {"k": "concept-n-generalizable"}]}}, {"b": "p", "t": "IBR 的质量首先取决于源视角离目标有多近（i-blending）：离得近，同一个 3D 点在两张图里的样子更像，遮挡关系也更接近。所以第一步是挑源视角。\n\n代码提供三种“距离”。'dist' 是相机中心的欧氏距离，用于 LLFF 和作者自采的前向场景；'vector' 是两台相机相对场景中心的方向夹角，用于绕物体一圈拍摄的 DeepVoxels、NeRF 合成数据和 Google Scanned Objects；'matrix' 是旋转矩阵之间的角度，没有被默认配置使用。测试时直接取最近的 10 个。论文 §3.1 的描述略有不同：先找空间上接近的候选视角，再从中选观察方向与目标最相近的 N 个；代码对前向场景只按光心距离排序。\n\n训练时如果也总是取最近的 10 个，网络只会见到“最理想”的视角分布，测试时一旦视角稀一点就会失配。所以作者故意随机化：先定一个倍数 n，从最近的 n·N 张里随机抽 N 张，n 越大，抽到的视角越分散，相当于模拟更稀疏的采集。论文 §3.4 写 n 在 [1,3] 上均匀、N 在 [8,12] 上均匀；代码里 n 取 1、2、3 的概率是 0.2、0.45、0.35，候选池还有 20–28 张的上限，而且只有 LLFF 和自采数据的 N 在 8–12 之间变化，其余数据集固定取 10。\n\n几个数据集有特殊处理。RealEstate10K 是视频，不按位姿排序，而是在以目标帧为中心、宽约 64 帧（前后各约 32 帧）的窗口里随机抽 10 帧，并以 99% 的概率排除目标帧本身。Spaces 的加载器虽然按相机朝向排了序，却从全部其他视角里随机抽 10 个，排序实际上没有起作用。另外所有加载器都有 0.5% 的概率把目标图本身混进源视角，大概是让网络学会“源视角与目标重合时直接照抄”（论文未解释，这是合理的解读）。\n\n视角选择在推理时是逐帧、逐目标视角独立进行的。eval/render_llff_video.py 沿 120 帧的螺旋路径渲染视频时，每一帧都重新挑最近的 10 张。这一点对后面讨论时间一致性很重要：论文 §3.2.1 自己也承认，相机移动时工作集突变会引起闪烁，并用 ib5 的方向加权池化来缓解。", "mn": {"label": "类比", "t": "像请 10 位证人描述案发现场：优先找站得最近的人；但训练侦探时，故意有时只给站得远一点的证人，逼他学会在信息不理想时也能推理。"}}, {"b": "eqs", "eqs": [{"tex": "\\mathcal{S}_{\\text{test}}=\\operatorname{argsort}_j\\;\\lVert\\mathbf{o}_j-\\mathbf{o}_t\\rVert_2\\,[1{:}N]", "explain_zh": "测试时的 'dist' 选择：o_j 是第 j 个候选相机的光心，o_t 是目标相机光心，取距离最小的 N 个。按代码改写（data_utils.py:248-251）。"}, {"tex": "\\theta_j=\\arccos\\frac{(\\mathbf{o}_t-\\mathbf{c})\\cdot(\\mathbf{o}_j-\\mathbf{c})}{\\lVert\\mathbf{o}_t-\\mathbf{c}\\rVert\\,\\lVert\\mathbf{o}_j-\\mathbf{c}\\rVert}", "explain_zh": "'vector' 选择用的角度：c 是场景中心（默认原点），θ_j 是两台相机相对中心的方向夹角，适合环绕拍摄的物体数据。按代码改写（data_utils.py:207-211、241-247）。"}, {"tex": "\\mathcal{S}_{\\text{train}}\\sim\\mathrm{Choose}\\Big(\\operatorname{argsort}(\\text{dist})[1{:}\\min(nN_0,\\,C)],\\;N\\Big),\\quad n\\in\\{1,2,3\\},\\;N\\in[8,12]", "explain_zh": "训练时的选择：N_0=10，C 是候选池上限（LLFF 20、自采 22、LLFF 测试场景微调时 28），Choose 表示无放回随机抽取。n 的分布代码为 0.2/0.45/0.35，论文 §3.4 写均匀；微调时 LLFF 测试场景的 N 只取 8–11。"}]}, {"b": "p", "t": "测试 N=10。训练：n∈{1,2,3}，概率 0.2/0.45/0.35（代码）；LLFF 与自采数据 N=8–12（LLFF 测试场景微调时 N=8–11，代码为 randint(−2, 2)），Google Scanned Objects 的 n∈{1,…,5}（概率 0.3/0.25/0.2/0.2/0.05）、N=10；DeepVoxels 训练时 N=6–11；RealEstate10K 在宽约 64 帧的窗口内随机抽 10 帧；0.5% 概率混入目标图。视频渲染：120 帧螺旋路径，每帧重选。", "label": "具体数字"}, {"b": "p", "t": "论文给出的理由是：随机化候选池模拟不同的视角密度，帮助网络在不同视角密度之间泛化（§3.4）。Fig. 4 在 Diffuse Synthetic 360° 上测了视角变稀时的退化，但没有“训练时不随机化”的对照。README 也承认这种选择方法很简单，只适合物体中心或前向拍摄，其他相机分布需要自己实现。没有采用的方案：学习式视角选择、按可见性或覆盖率选择。", "label": "为什么这样设计"}, {"b": "p", "t": "（1）论文与代码的采样分布不一致：论文 §3.4 写 n、N 都均匀采样，代码的 n 不是均匀分布，N 只在两个数据集上变化。（2）Spaces 加载器的排序没有生效，源视角是全场景随机抽取，这与“邻近视角”的叙述不符。（3）deepvoxels.py 在打开 rectify_inplane_rotation 时，把旋转后的位姿赋给了 src_pose，后面却仍用未旋转的 train_pose（默认配置不打开这个选项）。（4）测试时逐帧重选源视角，视点连续移动时源集合会突然变化，这是视频闪烁的来源之一，论文 §3.2.1 也这样说。（5）论文 §3.1 的“先按空间、再按方向”两步选法，代码没有实现第二步。", "label": "容易误解的地方"}, {"b": "qa", "items": [{"q": "如果训练时总是精确地取最近的 10 个源视角，而测试时相机只有训练时一半那么密，会发生什么？IBRNet 用什么办法缓解？", "a": "网络只见过相邻视角很近、视差很小的输入，学到的“一致性”判断标准偏严，测试时视差变大，同一表面在各视角的外观差异变大，网络会误判表面、混合出重影。IBRNet 在训练时从 n·N 的更大候选池里随机抽 N 个，n 越大视角越分散，相当于在训练中覆盖了不同的视角密度。"}]}, {"b": "sec", "h": "IB3 · 源图特征提取：截断 ResNet34 的 U-Net，输出 1/4 分辨率 64 通道，拆成 32+32", "id": "walk-ibrnet-ib3", "sn": {"label": "论文位置", "t": "§3.1 与补充材料的网络结构图（Conv、Upconv 定义）；代码 ibrnet/feature_network.py: ResUNet；ibrnet/model.py:47-49"}}, {"b": "p", "t": "输入：N 张源图 [N, 3, H, W]。输出：coarse 特征 [N, 32, H', W'] 与 fine 特征 [N, 32, H', W']，H'≈H/4、W'≈W/4。LLFF 756×1008 输入时为 [10, 32, 192, 252]（在 CPU 上实例化官方网络前向验证）。每个源视角只算一次，所有射线共用。", "label": "这一步做什么", "mn": {"label": "需要的基础", "links": [{"k": "concept-l-cnn"}, {"k": "concept-f-image"}, {"k": "adv-a-generalizable-ibr"}]}}, {"b": "p", "t": "这一步给每张源图算一张“特征图”，让后面比较各视角时不只看 RGB，还能看局部纹理和上下文（l-cnn）。\n\n结构是 U-Net 式的。编码器是 ResNet34 截掉 layer4：7×7、步长 2 的 conv1 之后，layer1、layer2、layer3 各由 3、4、6 个 BasicBlock 组成，每层第一个块步长为 2（标准 ResNet 的 layer1 前是 maxpool，这里改成 layer1 自己下采样）。于是分辨率依次是 1/2、1/4、1/8、1/16，通道 64、64、128、256。解码器做两次“双线性上采样 + 3×3 卷积”，每次与编码器对应层拼接（跳连），回到 1/4 分辨率，再用 1×1 卷积输出 64 通道，前 32 通道给 coarse 网络，后 32 通道给 fine 网络。\n\n实现细节：归一化全部用 InstanceNorm（BatchNorm 被注释掉，track_running_stats=False，训练与测试行为一致）；补充材料只说仿照 Attention-aware Multi-view Stereo 把 BatchNorm 全部换成 InstanceNorm，没有解释原因；每步只有约 10 张源图，BatchNorm 统计量不稳，这可能是原因之一（合理的解读）。padding 用 reflect 模式。补充材料 Table 1 说 Conv 是“卷积 + ReLU + InstanceNorm”，代码的 conv 类却是卷积、InstanceNorm 再接 ELU。\n\n参数量几乎都在这里：在 CPU 上实例化官方代码统计，这个 CNN 有 8,917,120 个参数，后面每个逐点聚合网络只有 20,136 个（论文 Table 3 的“0.04M”就是两个聚合网络之和，不含这个 CNN）。但特征图每张源图只算一次，真正耗时的是后面对每个采样点、每个视角的取样和 MLP。\n\n输入尺寸不能被 16 整除时，以 756×1008 为例，跳连特征的 95 行和 189 行会被 pad 到 96 行和 192 行，最终特征图是 192×252；投影取样把归一化坐标 [−1, 1] 映射到整张特征图，纵向会有约 1–2 个特征像素的错位（按代码推算，未实测）。", "mn": {"label": "类比", "t": "像给每张照片配一份“注释版”：原图只告诉你每个点的颜色，注释版还告诉你这里是不是边缘、周围是什么纹理。注释比原图粗 4 倍，但信息更丰富。"}}, {"b": "eqs", "eqs": [{"tex": "H_{\\text{out}}=\\left\\lfloor\\frac{H_{\\text{in}}+2p-k}{s}\\right\\rfloor+1", "explain_zh": "卷积输出尺寸公式：p 为 padding，k 为卷积核大小，s 为步长。代入 756：conv1（k=7,p=3,s=2）得 378，之后每级（k=3,p=1,s=2）得 189、95、48。"}, {"tex": "\\mathbf{F}_i=\\mathrm{ResUNet}(\\mathbf{I}_i)\\in\\mathbb{R}^{64\\times H'\\times W'},\\qquad \\mathbf{F}_i^{c}=\\mathbf{F}_i[0{:}32],\\;\\;\\mathbf{F}_i^{f}=\\mathbf{F}_i[32{:}64]", "explain_zh": "按代码改写（feature_network.py:260-267）。I_i 是第 i 张源图，F_i 是 64 通道特征，前 32 通道 F^c 供 coarse 网络使用，后 32 通道 F^f 供 fine 网络使用。两份特征来自同一个网络，梯度同时来自 coarse 和 fine 两路损失。"}]}, {"b": "p", "t": "编码器通道 64/128/256，块数 3/4/6；输出 64 通道 = 32（coarse）+ 32（fine）；分辨率 1/4。LLFF 756×1008 → 特征 192×252；训练裁剪 400×600 → 特征 100×152（均为实例化后前向验证）。参数（实例化统计）：编码器 8,174,528，解码器 742,592，合计 8,917,120。补充材料 Table 1 以 640×480 输入为例，输出 160×120×64。", "label": "具体数字"}, {"b": "p", "t": "论文补充材料给出的结构是“ResNet34 截断到 layer3 作编码器，加两层带跳连的上采样作解码器”。1/4 分辨率是速度和细节的折中：颜色本身在后面直接从全分辨率源图取，特征只需要提供匹配和可见性线索，不必很精细（合理的解读）。没有采用的方案：直接用 RGB 做一致性判断（对光照和纹理缺失不鲁棒）、全分辨率特征（显存与计算太大）。", "label": "为什么这样设计"}, {"b": "p", "t": "（1）RGB 和特征的取样分辨率不同：RGB 在原图上取，特征在 1/4 图上取，两者用同一组归一化坐标。（2）输入尺寸不能被 16 整除时跳连处有 pad，特征与图像会有轻微错位。（3）补充材料写“卷积 → ReLU → InstanceNorm”，代码是“卷积 → InstanceNorm → ELU”，激活和顺序都不同，复现以代码为准。（4）coarse 和 fine 特征共享同一个编码器，并不是两个独立的特征网络。", "label": "容易误解的地方"}, {"b": "qa", "items": [{"q": "IBRNet 约 8.96M 参数里 99% 以上在特征 CNN 中，但渲染一帧要半分钟到一分钟。为什么参数量不能反映它的速度？", "a": "特征 CNN 每张源图只跑一次，与像素数和采样点数无关。慢的是后面的逐点部分：每个像素 192 个采样点，每个点要在 10 张源图上投影、取样，再跑聚合 MLP 和 ray transformer，一帧约 1.46×10⁹ 次“点 × 视角”运算。这部分网络很小，但调用次数巨大，而且大量中间张量要读写显存。"}]}, {"b": "sec", "h": "IB4 · 沿目标射线逆深度均匀采样 64 点，投影到 N 个源视角取 RGB、特征与相对方向 Δd", "id": "walk-ibrnet-ib4", "sn": {"label": "论文位置", "t": "§3.2 开头与 §3.3（等视差采样，“adjacent point projections 在像素空间等间隔”）；代码 ibrnet/sample_ray.py: get_rays_single_image；ibrnet/render_ray.py: sample_along_camera_ray；ibrnet/projection.py: compute_projections、compute_angle、compute"}}, {"b": "p", "t": "输入：目标像素射线（原点 o、方向 d）、深度范围、N 个源视角的图像、相机与特征图。输出：rgb_feat [R, M, N, 35]（3 维 RGB + 32 维特征）、ray_diff [R, M, N, 4]（3 维方向差 + 1 维点积）、mask [R, M, N, 1]（投影在图内且在相机前方）。评测时 R 为一个 chunk 的射线数 4096，coarse 阶段 M=64，fine 阶段 M=128。", "label": "这一步做什么", "mn": {"label": "需要的基础", "links": [{"k": "concept-g-pinhole"}, {"k": "concept-g-epipolar"}, {"k": "concept-g-depth"}, {"k": "concept-i-psv"}, {"k": "concept-r-raymarch"}, {"k": "concept-f-image"}]}}, {"b": "p", "t": "对目标图的每个像素，射线方向 d = R·K⁻¹·[u, v, 1]ᵀ，原点是目标相机光心（g-pinhole）。代码里像素坐标没有加 0.5 的半像素偏移（这一行被注释掉了）。\n\n沿射线在 [near, far] 之间取 64 个深度。配置里 inv_uniform=True，即在逆深度（视差）上等间隔取（g-depth）。论文解释了原因：等视差采样使相邻采样点投影到源图上的像素间距大致相等（g-epipolar）。直观地说，近处一点点深度变化就对应很大的像素位移，所以近处要采得密，远处可以稀。训练时每个样本在自己的区间里随机抖动（分层采样），测试时取固定位置。\n\n每个 3D 点 x 投影到每个源视角：先乘相机外参的逆把点变到源相机坐标系，再乘内参，除以 z 得到像素坐标。z≤0（点在相机背后）或投影落在图外的，mask 记为 0。然后用 grid_sample 在源图原分辨率上双线性取 RGB，在 1/4 分辨率特征图上双线性取 32 维特征，拼成 35 维。一条射线的 64 个点投影到同一张源图上，恰好排成一段极线，所以后面的 ray transformer 可以理解为在比较“这段极线上的一串观测”（i-psv）。\n\n相对方向 Δd 是颜色和池化权重的关键输入。代码的做法是：从点 x 指向目标相机中心的单位向量，减去从 x 指向第 i 个源相机中心的单位向量，差向量再归一化作为 3 维方向，另加两个单位向量的点积（即夹角余弦）作为第 4 维。夹角越小，这个源视角越像是“从同一方向看同一个点”。论文 §3.2.2 写成 Δd_i = d − d_i（目标观察方向减源观察方向，3 维，不归一化），代码用的是指向相机的向量，符号相反，而且把差向量归一化后另加点积，共 4 维。\n\n这一步的计算量很大：1008×756 的图像有 762,048 条射线，每条 64 个点，每个点投影到 10 个视角，coarse 阶段就要做约 4.9×10⁸ 次投影和取样。", "mn": {"label": "类比", "t": "像在目标像素的视线上插 64 根等“视差”间隔的小旗，然后从 10 台相机分别看每根小旗，记下每台相机在那个位置看到的颜色和纹理，以及那台相机相对目标相机偏了多少角度。"}}, {"b": "eqs", "eqs": [{"tex": "z_k=\\left(\\frac{1}{z_{\\text{near}}}+\\frac{k}{M-1}\\Big(\\frac{1}{z_{\\text{far}}}-\\frac{1}{z_{\\text{near}}}\\Big)\\right)^{-1},\\quad k=0,\\dots,M-1", "explain_zh": "逆深度均匀采样（render_ray.py:94-98，按代码改写）。z_k 是第 k 个样本沿射线的参数（射线方向未归一化，d 的 z 分量为 1 时即深度），M=64。训练时在相邻样本中点之间均匀抖动。"}, {"tex": "\\lambda_i\\begin{bmatrix}u_i\\\\v_i\\\\1\\end{bmatrix}=\\mathbf{K}_i\\,\\mathbf{T}_{c2w,i}^{-1}\\begin{bmatrix}\\mathbf{x}\\\\1\\end{bmatrix},\\qquad m_i=[\\lambda_i>0]\\cdot[0\\le u_i\\le W-1]\\cdot[0\\le v_i\\le H-1]", "explain_zh": "投影与有效掩码（projection.py:55-60、32-35）。x 是 3D 采样点，T_c2w,i 是第 i 个源相机的 camera-to-world 矩阵，K_i 为内参，λ_i 为该点在源相机下的深度，(u_i, v_i) 为像素坐标，m_i 为有效标记。"}, {"tex": "\\Delta\\mathbf{d}_i=\\frac{\\hat{\\mathbf{r}}_t-\\hat{\\mathbf{r}}_i}{\\lVert\\hat{\\mathbf{r}}_t-\\hat{\\mathbf{r}}_i\\rVert},\\;\\; \\cos\\theta_i=\\hat{\\mathbf{r}}_t\\cdot\\hat{\\mathbf{r}}_i,\\;\\; \\hat{\\mathbf{r}}_t=\\frac{\\mathbf{o}_t-\\mathbf{x}}{\\lVert\\mathbf{o}_t-\\mathbf{x}\\rVert},\\;\\hat{\\mathbf{r}}_i=\\frac{\\mathbf{o}_i-\\mathbf{x}}{\\lVert\\mathbf{o}_i-\\mathbf{x}\\rVert}", "explain_zh": "相对方向特征（projection.py:64-87，按代码改写）。o_t、o_i 分别是目标相机和第 i 个源相机的光心；r̂ 是从点 x 指向相机的单位向量。ray_diff = [Δd_i, cosθ_i] 共 4 维。"}]}, {"b": "p", "t": "M_c=64（coarse），fine 阶段再加 64，共 128。N=10。LLFF 一帧 762,048 条射线，chunk_size=4096（评测配置），共 187 个 chunk。coarse 阶段每个 chunk 的 rgb_feat 为 [4096, 64, 10, 35]，float32 约 367 MB。", "label": "具体数字"}, {"b": "p", "t": "逆深度采样的理由论文有明确说明：让相邻采样点在源图上的投影间隔相等。直接在源图上双线性取样而不是先重建几何，是 IBRNet 区别于 Free View Synthesis、Stable View Synthesis 的地方：不需要 MVS 预处理。没有采用的方案：线性深度采样（代码可选，但发布的配置都用逆深度）、先建平面扫描代价体再查询（MVSNeRF、ENeRF 的做法）。", "label": "为什么这样设计"}, {"b": "p", "t": "（1）像素坐标没有加 0.5，射线穿过像素角点而不是像素中心，和部分其他代码库的约定不同，混用位姿时要注意。（2）投影落在图外时 grid_sample 返回 0，这些值虽然被 mask 标记，但在 anti-alias 池化的 min 运算里仍会参与（见 ib5）。（3）Δd 是点到相机的向量之差，不是观察方向之差，符号与论文相反；自己实现时只要训练和推理一致即可。（4）射线方向 d 没有归一化，z_k 是沿光轴的深度而不是沿射线的欧氏距离。", "label": "容易误解的地方"}, {"b": "qa", "items": [{"q": "近平面 1 m、远平面 100 m、64 个样本时，按逆深度均匀采样，第 2 个样本和倒数第 2 个样本分别在多远？这说明了什么？", "a": "逆深度从 1 到 0.01 等分 63 段，每段 0.99/63≈0.0157。第 2 个样本逆深度 1−0.0157=0.9843，深度约 1.016 m；倒数第 2 个逆深度 0.01+0.0157=0.0257，深度约 38.9 m。近处样本间隔只有约 1.6 cm，远处相邻样本相差约 61 m。这正是视差均匀的效果：远处物体在源图上的位移很小，采得再密也看不出区别，采样预算应集中在近处。"}]}, {"b": "sec", "h": "IB5 · 跨视角聚合：方向调制 + 加权均值/方差 + 共享 MLP（105→64→32），PointNet 式集合函数", "id": "walk-ibrnet-ib5", "sn": {"label": "论文位置", "t": "§3.2.1 Multi-view feature aggregation 与 Fig. 2（PointNet 式 MLP 聚合局部与全局信息，得到多视角感知特征和池化权重）；§3.2.1 Improving temporal visual consistency 与 Eq.(1)；代码 ibrnet/mlp_network.py: IBRNet.forward 第 228–245 行、fused_mean_variance（第 145–149 行）"}}, {"b": "p", "t": "输入：每个采样点在 N 个源视角上的 35 维特征 f_i（RGB+CNN 特征）、4 维相对方向、有效掩码。输出：每个视角的 32 维“多视角感知”特征 f'_i，以及池化权重 w_i。张量形状从 [R, M, N, 35] 变为 [R, M, N, 32]。", "label": "这一步做什么", "mn": {"label": "需要的基础", "links": [{"k": "concept-d-mvs"}, {"k": "concept-i-psv"}, {"k": "concept-i-blending"}, {"k": "adv-a-generalizable-ibr"}, {"k": "adv-a-learned-mvs"}]}}, {"b": "p", "t": "现在每个采样点手里有 N 份“证词”：第 i 个源视角在这个点的投影处看到了什么。要判断这个点是不是表面，最直接的线索是这些证词是否一致（d-mvs）。表面上的点被各视角看到的是同一块物体，特征接近；空中或物体内部的点，各视角看到的是各自视线后方的不同东西，特征分散。均值代表共识，逐通道方差衡量分歧，这与 MVSNet 用特征方差构造代价体是同一个道理，只是这里不建代价体，而是逐点计算。\n\n代码分三步。第一步，方向调制：把 4 维 ray_diff 过一个小 MLP（4→16→35），直接加到 35 维特征上，让每份证词带上“我是从哪个角度看的”这一信息。注意这会改动 RGB 那 3 个通道的数值，但原始 RGB 事先另存了一份，最后混合颜色时用的是原始值。\n\n第二步，池化权重。默认配置 anti_alias_pooling=1：每个视角的权重由它与目标射线的夹角余弦决定，w_i ∝ exp(|s|(cosθ_i − 1)) 减去所有视角里的最小值，再乘有效掩码并归一化。s 是可学习的标量，初值 0.2。直观上，方向越接近目标射线的视角权重越大；减去最小值意味着夹角最大的那个视角权重恰好为 0。这就是论文 §3.2.1 的 Eq.(1)，借自 Sun et al. 的 Light Stage Super-Resolution；代码里这个选项叫 anti_alias_pooling。论文给出的理由是时间稳定性：相机移动时工作集里的视角会进出，最远的视角权重本来就是 0，进出时全局特征不会突变；同时近视角权重更大，全局特征也更合理。\n\n第三步，PointNet 式聚合：用权重算逐通道的加权均值 μ 和方差 v（各 35 维），拼到每个视角自己的特征后面，成为 105 维，过共享 MLP（105→64→32，ELU）。“共享”意味着同一套参数对每个视角做同样的事，所以输出对视角顺序不变，N 也可以随意变化，训练时 8–12 个、测试时 10 个都能用（a-generalizable-ibr）。每个视角的新特征 f'_i 既知道自己看到了什么，也知道大家整体看到了什么，下一步可以据此判断“我是不是那个被挡住的少数派”。", "mn": {"label": "类比", "t": "像陪审团讨论：先让每位陪审员说出自己的观察，统计大家的平均意见和分歧程度，再把统计结果发回给每个人，让每个人对照全体意见重新整理自己的立场。离案发现场角度最接近的陪审员，统计时发言权更大。"}}, {"b": "eqs", "eqs": [{"tex": "\\tilde{\\mathbf{f}}_i=\\mathbf{f}_i+\\phi_{\\text{dir}}\\big([\\Delta\\mathbf{d}_i,\\cos\\theta_i]\\big),\\qquad \\phi_{\\text{dir}}:\\mathbb{R}^4\\to\\mathbb{R}^{16}\\to\\mathbb{R}^{35}", "explain_zh": "方向调制（mlp_network.py:229-231，按代码改写）。f_i 是第 i 个视角的 35 维 RGB+特征，φ_dir 是两层带 ELU 的 MLP。"}, {"tex": "w_i=\\frac{m_i\\big(e^{|s|(\\cos\\theta_i-1)}-\\min_j e^{|s|(\\cos\\theta_j-1)}\\big)}{\\sum_k m_k\\big(e^{|s|(\\cos\\theta_k-1)}-\\min_j e^{|s|(\\cos\\theta_j-1)}\\big)+10^{-8}}", "explain_zh": "论文 Eq.(1) 的代码实现（mlp_network.py:232-236）。论文写作 w̃_i = max(0, e^{s(d·d_i−1)} − min_j e^{s(d·d_j−1)}) 再归一化；代码用 |s|，并乘有效掩码 m_i。s 为可学习标量（代码初值 0.2），min 在全部 N 个视角上取（包括无效视角）。anti_alias_pooling=0 时退化为有效视角上的均匀权重 w_i = m_i / Σm_k。"}, {"tex": "\\boldsymbol{\\mu}=\\sum_i w_i\\tilde{\\mathbf{f}}_i,\\qquad \\mathbf{v}=\\sum_i w_i\\big(\\tilde{\\mathbf{f}}_i-\\boldsymbol{\\mu}\\big)^{\\odot 2}", "explain_zh": "逐通道加权均值与方差（fused_mean_variance）。⊙2 表示逐元素平方，μ 和 v 都是 35 维。方差小说明各视角一致，是“这里可能是表面”的信号。"}, {"tex": "\\mathbf{f}'_i=\\mathrm{MLP}_{\\text{base}}\\big([\\boldsymbol{\\mu},\\mathbf{v},\\tilde{\\mathbf{f}}_i]\\big),\\qquad \\mathrm{MLP}_{\\text{base}}:\\mathbb{R}^{105}\\to\\mathbb{R}^{64}\\to\\mathbb{R}^{32}", "explain_zh": "PointNet 式共享 MLP（mlp_network.py:166-169、244-245）。[·] 表示拼接，同一个 MLP 作用于每个视角，因此输出对视角排列不变。"}]}, {"b": "p", "t": "输入 35 维（3 RGB + 32 特征），方向 MLP 4→16→35，全局统计 70 维，拼接后 105 维，输出 32 维。s 初值 0.2：cosθ 从 1 降到 0.9 时 exp 项只从 1 降到 0.980，初始时权重接近均匀，靠训练把 |s| 调大后才有明显的方向偏好。一个 coarse chunk 的拼接张量 [4096, 64, 10, 105]，float32 约 1.1 GB；fine 阶段翻倍。", "label": "具体数字"}, {"b": "p", "t": "论文强调网络要对视角排列不变、能接受可变数量的源视角，因此采用 PointNet 式的“逐元素统计 + 共享 MLP”。§3.2.1 的推理是：表面上的点在多视角下外观更一致，用方差作全局池化就能检查一致性，但有遮挡时这种简单检查会误判真实表面，所以要加一个小网络输出池化权重；作者称加权池化比直接平均或 max-pooling 更能处理遮挡，但没有给出数字。方差与 MVS 代价体的对应是我们的解读。没有采用的方案：按固定顺序拼接所有视角（依赖顺序和固定 N）、只用 max-pool（DeepView 的做法，丢掉分歧信息）、跨视角自注意力（O(N²)，GNT 等后续工作采用）。站内的 Quark 恰好反过来，明确放弃均值/方差聚合，改用 One-to-many attention，其消融中把注意力退化成均值后 PSNR 从 30.41 降到 29.73。", "label": "为什么这样设计"}, {"b": "p", "t": "（1）方差是逐通道的 35 维向量，不是一个标量代价。（2）anti-alias 权重减去了全体视角的最小值，所以夹角最大的视角在统计里权重为 0；而 min 也在无效视角上取，若无效视角恰好是最小值，所有有效视角的权重都为正。（3）方向调制加在了 RGB 通道上，调试时打印 rgb_feat 的前 3 维会发现它们已经不是颜色。（4）这一步没有任何显式的遮挡处理，遮挡信息要到下一步的可见性模块才开始建模。（5）“anti-alias pooling”是代码里的名字，论文称之为加权池化，写明的目的是时间稳定性，而不是抗混叠。", "label": "容易误解的地方"}, {"b": "qa", "items": [{"q": "如果把源视角的顺序打乱，这一步的输出会变吗？如果把源视角从 10 个改成 12 个，网络结构需要改吗？为什么？", "a": "输出只会随之重新排列，每个视角得到的 f'_i 不变，因为均值、方差、归一化权重对求和顺序无关，共享 MLP 对每个视角做同样的运算。视角数变成 12 也不需要改结构：统计量的维度与 N 无关，共享 MLP 只是多跑两次。这正是 PointNet 式集合函数的好处，也是 IBRNet 能在训练时随机化 N 的前提。"}]}, {"b": "sec", "h": "IB6 · 可见性与加权池化：两级可见性打分后重新求均值/方差，得到 16 维密度特征 f_σ", "id": "walk-ibrnet-ib6", "sn": {"label": "论文位置", "t": "§3.2.1 与 Fig. 2（用池化权重对多视角感知特征加权池化，实现多视角可见性推理，得到密度特征 f_σ）；代码 mlp_network.py 第 171–186 行、第 247–256 行"}}, {"b": "p", "t": "输入：f'_i（[R, M, N, 32]）、上一步的权重 w_i、有效掩码。输出：每个采样点的 16 维密度特征 f_σ（[R, M, 16]），以及每个视角的第二级可见性 v'_i（[R, M, N, 1]，后面颜色分支还要用）。", "label": "这一步做什么", "mn": {"label": "需要的基础", "links": [{"k": "concept-d-mvs"}, {"k": "concept-i-warping"}, {"k": "concept-l-cnn"}, {"k": "adv-a-generalizable-ibr"}]}}, {"b": "p", "t": "上一步的均值/方差把所有视角一视同仁，但遮挡会破坏这种统计。设想一个前景柱子挡在背景墙前面：对墙上某个点，有 7 个视角看得到墙，3 个视角看到的是柱子。这 3 个视角的证词会拉大方差，让网络误以为这里不是表面。所以需要先判断“哪些视角其实被挡住了”，再只用可信的视角重新统计。论文把这叫作多视角可见性推理。\n\n代码分两级做。第一级：把 f'_i 乘上上一步的池化权重，过 vis_fc（32→32→33），输出拆成两部分，32 维残差加回 f'_i 做一次修正，1 维经 sigmoid 得到初步可见性 v_i（再乘有效掩码）。一个细节：vis_fc 最后一层是 ELU，输出不小于 −1，再过 sigmoid 后 v_i 的取值在约 0.27 到 1 之间，所以第一级可见性永远不会接近 0。第二级：把修正后的特征乘以 v_i，过 vis_fc2（32→32→1，sigmoid）得到 v'_i，乘掩码后在视角维上归一化，作为新的池化权重。\n\n然后用这个权重对修正后的特征重新求加权均值和方差（各 32 维），再拼上“权重在 N 个视角上的均值”（1 维），共 65 维，过 geometry_fc（65→64→16）得到密度特征 f_σ。最后这 1 维有点特别：归一化后的权重在 N 个视角上求和为 1，求均值就恒等于 1/N（只要有有效视角），所以它实际上只告诉网络“有几个源视角”，并不携带可见性信息（按代码推算）。\n\n整个可见性模块没有任何直接监督：训练信号只有最终渲染颜色的误差。网络是否真的学会了“被挡住就降权”，论文用 ray transformer 的消融和定性图间接说明，没有单独检验可见性模块（没有去掉可见性的消融）。后来的 NeuRay 正是针对这一点，显式预测每个 3D 点对各视角的可见性。", "mn": {"label": "类比", "t": "陪审团第一轮统计后发现分歧很大，于是主持人追问：“有没有人其实没看清？”几位承认视线被柱子挡了的陪审员被降低发言权，然后只按看清的人重新统计一次。"}}, {"b": "eqs", "eqs": [{"tex": "[\\Delta\\mathbf{f}_i,\\,a_i]=\\mathrm{MLP}_{\\text{vis}}(\\mathbf{f}'_i\\,w_i),\\qquad v_i=\\mathrm{sigmoid}(a_i)\\,m_i,\\qquad \\mathbf{f}''_i=\\mathbf{f}'_i+\\Delta\\mathbf{f}_i", "explain_zh": "第一级可见性（mlp_network.py:247-250，按代码改写）。MLP_vis: 32→32→33（ELU），Δf_i 为 32 维残差，a_i 为可见性 logit，m_i 为有效掩码。"}, {"tex": "v'_i=\\mathrm{MLP}_{\\text{vis2}}(\\mathbf{f}''_i\\,v_i)\\,m_i,\\qquad \\hat{w}_i=\\frac{v'_i}{\\sum_j v'_j+10^{-8}}", "explain_zh": "第二级可见性（mlp_network.py:251-252）。MLP_vis2: 32→32→1，末层 sigmoid。ŵ_i 为归一化后的池化权重。"}, {"tex": "\\mathbf{f}_\\sigma=\\mathrm{MLP}_{\\text{geo}}\\Big(\\Big[\\sum_i\\hat{w}_i\\mathbf{f}''_i,\\;\\sum_i\\hat{w}_i\\big(\\mathbf{f}''_i-\\boldsymbol{\\mu}'\\big)^{\\odot2},\\;\\tfrac{1}{N}\\sum_i\\hat{w}_i\\Big]\\Big)", "explain_zh": "密度特征（mlp_network.py:254-256）。μ' 为第一项的加权均值；MLP_geo: 65→64→16。最后一项 (1/N)Σŵ_i 在有有效视角时恒为 1/N。"}]}, {"b": "p", "t": "vis_fc 32→32→33，vis_fc2 32→32→1，geometry_fc 65→64→16。第一级可见性取值约 (0.27, 1)（sigmoid(−1)≈0.269）。f_σ 为 16 维。每个聚合网络（含 ib5 到 ib8 全部 MLP 与注意力）20,136 个参数（实例化统计），两个合计约 0.04M，与论文 Table 3 一致。", "label": "具体数字"}, {"b": "p", "t": "论文的说法是池化权重使网络能够进行多视角可见性推理。两级设计、残差修正和 16 维输出都没有在论文中解释或消融，属于实现选择。没有采用的方案：显式的深度图可见性测试（需要先有深度）、硬阈值剔除离群视角、NeuRay 式的可见性表示。", "label": "为什么这样设计"}, {"b": "p", "t": "（1）“可见性”只是网络内部的一个权重，没有监督，不能把 v'_i 当成真实的遮挡概率来用。（2）第一级 v_i 被 ELU 加 sigmoid 限制在 0.27 以上，真正能压到接近 0 的是第二级。（3）1/N 那一维不携带可见性信息。（4）颜色分支用的是第二级 v'_i，不是第一级 v_i（代码里同名变量 vis 被重新赋值）。（5）补充材料 Fig. 1 中几何 MLP 的输入是 64 维（加权均值 + 方差），代码多拼了一维“权重均值”，是 65 维。", "label": "容易误解的地方"}, {"b": "qa", "items": [{"q": "如果一个背景点只被 10 个源视角中的 2 个真正看到，其余 8 个视角都被前景挡住，均值/方差聚合会给出什么结论？可见性加权能完全解决吗？", "a": "不加权时，8 个被挡视角看到的都是前景，可能彼此相当一致，统计上反而像是“多数派一致”，网络可能把前景特征当成这个点的外观，或者因为 2 个少数派拉大方差而判为非表面。可见性加权希望把被挡的 8 个视角降权，但它没有监督，只能从数据中学到常见的遮挡模式；当多数视角都被遮挡时，“多数派”本身就是错的，这种情况很难靠统计纠正。这也是 ray transformer 要引入整条射线上下文、NeuRay 要显式建模可见性的原因。"}]}, {"b": "sec", "h": "IB7 · Ray transformer：同一射线上 64/128 个采样点做单层 4 头自注意力，再输出密度 σ", "id": "walk-ibrnet-ib7", "sn": {"label": "论文位置", "t": "§3.2 Ray transformer（先对射线上所有密度特征加位置编码，单层多头自注意力，4 个头）；Table 2 的 No ray transformer 一行与补充材料 Fig. 2；代码 mlp_network.py: MultiHeadAttention（第 69–119 行）、posenc（第 208–217 行）、第 257–262 行"}}, {"b": "p", "t": "输入：一条射线上 M 个采样点的密度特征 f_σ（[R, M, 16]）和各点的有效视角数。输出：每个采样点的密度 σ ≥ 0（[R, M, 1]）。coarse 网络 M=64，fine 网络 M=128。", "label": "这一步做什么", "mn": {"label": "需要的基础", "links": [{"k": "concept-l-attention"}, {"k": "concept-l-encoding"}, {"k": "concept-r-volume"}, {"k": "adv-a-generalizable-ibr"}]}}, {"b": "p", "t": "到上一步为止，每个采样点都是孤立判断的。但“这里是不是表面”本质上是一个沿射线的问题：如果射线前面已经有一个很可信的表面，后面的点即使多视角一致（比如被前景遮住的背景在各视角里恰好一致），也不应该再有高密度。反过来，遮挡边界附近单点的统计很乱，只看自己容易误判，看看前后邻居就容易得多。去掉 ray transformer 后渲染图在遮挡边界出现“黑洞”（补充材料 Fig. 2），就是单点判断失败的表现。\n\n做法很直接（l-attention）：先给每个点的 16 维特征加上正弦位置编码，编码的是样本序号（第 0、1、2……个），让注意力知道点的前后顺序（l-encoding）。然后做一层多头自注意力：4 个头，每个头 query/key/value 各 4 维，输出经线性层投回 16 维，加残差后做 LayerNorm。代码里只有注意力子层，没有标准 Transformer 的前馈（FFN）子层，dropout 也被注释掉了。最后一个小 MLP（16→16→1）加 ReLU 输出 σ ≥ 0；没有任何有效视角的点，σ 直接置 0。\n\n注意力按射线独立计算：一个 chunk 有 4096 条射线，每条射线内部 64×64（fine 为 128×128）的注意力矩阵，不同射线之间不交互。\n\n有两个代码细节论文没提。第一，位置编码表在构造网络时按样本数生成（coarse 64、fine 128），推理时改采样数会形状不匹配（我们在 CPU 上实例化后验证：coarse 改成 32 个样本会在相加处报错）；这与论文“ray transformer 允许可变数量的输入”、补充材料“支持可变数量的射线样本”的说法不符；而且 fine 阶段的 128 个点是按粗权重重采样后排序的，序号不再对应固定的逆深度。第二，注意力掩码 (有效视角数 > 1) 在代码里被扩展成 [R, 1, M, 1]，广播到注意力矩阵上屏蔽的是 query 行，而不是 key 列：有效视角不足的点自己的注意力会变成均匀分布，但它们仍然作为 key 被其他点关注（实测：被屏蔽行的注意力每项都是 1/64，其他点对它的注意力权重仍不为零）。", "mn": {"label": "类比", "t": "像沿着一条走廊找门：单看一块地砖很难判断门在哪，但把整条走廊的地砖放在一起比较，门框的位置就很明显。ray transformer 让每个采样点在决定“我是不是门”之前，先看一眼整条走廊。"}}, {"b": "eqs", "eqs": [{"tex": "\\mathrm{PE}(k)_{2j}=\\sin\\!\\Big(\\frac{k}{10000^{2j/16}}\\Big),\\qquad \\mathrm{PE}(k)_{2j+1}=\\cos\\!\\Big(\\frac{k}{10000^{2j/16}}\\Big)", "explain_zh": "按样本序号 k 的正弦位置编码（posenc，d_hid=16），k=0…M−1，j=0…7。编码的是序号而不是深度值。"}, {"tex": "\\mathbf{Z}=\\mathrm{LN}\\Big(\\mathbf{X}+\\mathrm{Concat}_{h=1}^{4}\\big(\\mathrm{softmax}\\big(\\tfrac{\\mathbf{X}\\mathbf{W}^Q_h(\\mathbf{X}\\mathbf{W}^K_h)^{\\top}}{\\sqrt{4}}\\big)\\mathbf{X}\\mathbf{W}^V_h\\big)\\mathbf{W}^O\\Big),\\quad \\mathbf{X}=\\mathbf{F}_\\sigma+\\mathrm{PE}", "explain_zh": "单层多头自注意力（MultiHeadAttention，post-LN）。X ∈ ℝ^{M×16} 是一条射线上的密度特征加位置编码；W^Q_h、W^K_h、W^V_h ∈ ℝ^{16×4}，W^O ∈ ℝ^{16×16}，均无偏置；LN 为 LayerNorm。"}, {"tex": "\\sigma_k=\\mathrm{ReLU}\\big(\\mathrm{MLP}_{\\text{out}}(\\mathbf{Z}_k)\\big)\\cdot\\big[\\textstyle\\sum_i m_{k,i}\\ge 1\\big]", "explain_zh": "密度输出（mlp_network.py:261-262）。MLP_out: 16→16→1；最后的指示函数表示没有任何有效视角的样本 σ 置 0。"}]}, {"b": "p", "t": "4 个头，d_model=16，d_k=d_v=4，单层，无 FFN（代码；论文确认为单层、4 头）。注意力参数 4×16×16=1024，加 LayerNorm 32。fine 阶段每个 chunk 的注意力矩阵 [4096, 4, 128, 128]，float32 约 1.1 GB。消融（Table 2，RFF，预训练模型）：去掉 ray transformer 后 21.31 / 0.675 / 0.355，完整模型 25.13 / 0.817 / 0.205。", "label": "具体数字"}, {"b": "p", "t": "论文 §3.2.1 的理由是：直接从单点的密度特征预测密度，在几何复杂的新场景上不准，只看一个点的特征不够，需要更多上下文，就像平面扫描立体在确定某个像素的深度前会先考察整条射线上的匹配得分；ray transformer 只增加很少的参数和计算。用自注意力而不是 RNN 或 1D 卷积，可以一步看到整条射线（合理的解读）。没有采用的方案：逐点独立预测（NeRF、pixelNeRF 的方式，即消融中的 No ray transformer）、多层 Transformer（论文未讨论层数）。后续的 GNT 把 ray transformer 扩展成直接输出颜色的渲染器，DynIBaR 也沿用了沿射线的 ray transformer。", "label": "为什么这样设计"}, {"b": "p", "t": "（1）位置编码基于序号，不是深度，fine 阶段的序号与深度的对应关系随射线而变。（2）不能在推理时随意修改 N_samples 或 N_importance，位置编码表的长度是写死的，尽管论文说它支持可变数量的样本。（3）掩码屏蔽的是 query 行，不是 key 列，无效样本仍然被当作 key 参与其他样本的注意力。（4）注意力只在单条射线内部，射线之间完全独立，没有任何空间平滑，这也是后来的方法（例如 ENeRF 的代价体）引入图像空间上下文的原因。", "label": "容易误解的地方"}, {"b": "qa", "items": [{"q": "为什么去掉 ray transformer 的消融（21.31 dB）比去掉视角方向（24.20 dB）或改成直接回归颜色（24.73 dB）掉得多得多？", "a": "后两者影响的是颜色：即使颜色的取法差一些，只要几何（密度）对，渲染结果仍然大体正确。ray transformer 影响的是几何：密度一旦错在遮挡边界附近，体渲染会把光线提前终止在错误的位置，或者让射线穿透表面、累积不到任何颜色，于是出现“黑洞”和大片模糊，误差在 PSNR 上是结构性的。这说明 IBRNet 的难点主要在“从多视角统计中推断表面位置”，而不是在取色。"}]}, {"b": "sec", "h": "IB8 · 颜色混合：每视角一个 logit，softmax 后对源像素颜色做凸组合", "id": "walk-ibrnet-ib8", "sn": {"label": "论文位置", "t": "§3.2 颜色预测（与相对方向拼接、预测混合权重、soft-argmax 形式的加权平均）；Table 2 的 No view directions 一行（Direct color regression 一行只见于 arXiv / CVPR 版）；代码 mlp_network.py 第 194–198 行、第 264–269 行"}}, {"b": "p", "t": "输入：每个视角修正后的特征 f''_i（32 维）、第二级可见性 v'_i（1 维）、相对方向 [Δd_i, cosθ_i]（4 维），以及在源图原分辨率上取到的原始颜色 C_i。输出：每个采样点的颜色 c（[R, M, 3]）。", "label": "这一步做什么", "mn": {"label": "需要的基础", "links": [{"k": "concept-i-blending"}, {"k": "concept-i-lightfield"}, {"k": "concept-r-appearance"}, {"k": "concept-r-alpha"}, {"k": "adv-a-generalizable-ibr"}]}}, {"b": "p", "t": "颜色分支完全是经典 IBR 的学习版（i-blending）。网络不输出 RGB，只为每个源视角打一个分数：把 f''_i、v'_i 和 4 维相对方向拼成 37 维，过 rgb_fc（37→16→8→1），得到一个 logit；无效视角的 logit 设为 −10⁹；在视角维上做 softmax 得到权重；颜色等于 N 个源像素颜色的加权平均。论文把这叫作 soft-argmax：权重大的视角主导颜色，但仍保留软混合。\n\n为什么这样做？一是细节：颜色直接来自源图原分辨率的双线性取样，网络不必学会“画”高频纹理，只需学会“挑”。二是泛化：一个“挑选规则”比一个“颜色函数”与具体场景的关系更弱。三是视角相关外观（r-appearance）：相对方向 Δd 告诉网络每个源视角与目标射线有多接近，夹角小的视角更可能看到同样的高光和反射，这正是 Unstructured Lumigraph 的原则（i-lightfield）。\n\n消融给出了这几点的分量（RFF，预训练模型）：改成直接回归颜色，25.13 → 24.73，只少 0.4 dB（arXiv / CVPR 版 Table 2；本次核对的项目主页版只有“直接回归会降低性能”的定性描述）；去掉视角方向（包括 ib5 的加权池化），→ 24.20。IBR 式混合有收益，但不是 IBRNet 最关键的部分，这一点常被高估。站内的 Quark 在高分辨率实时场景里做了同样的消融，改为直接输出 RGB 后掉 1.2 dB，是它所有消融中最大的一项，一种可能的解释是分辨率越高、网络越小，“挑像素”相对于“画像素”的优势越大（合理的解读；两篇论文的数据和设定差别很大，数字不能直接比较）。\n\n这一步的限制同样来自凸组合：每个采样点的颜色一定落在 N 个源像素颜色的凸包里，体渲染后像素颜色仍是源像素的凸组合。源图里都不存在的颜色（例如移动到新位置的高光）无法生成；所有视角都看不到的区域只能给出不相关源像素的平均色；各相机曝光不一致时，差异会直接混进结果。", "mn": {"label": "类比", "t": "像调酒师不自己造新口味，只从 10 瓶现成的酒里按比例调配。调配比例由经验决定：离“客人想要的口味”越近的那瓶放得越多。好处是味道都是真的，坏处是调不出任何一瓶里都没有的味道。"}}, {"b": "eqs", "eqs": [{"tex": "\\ell_i=\\mathrm{MLP}_{\\text{rgb}}\\big([\\mathbf{f}''_i,\\,v'_i,\\,\\Delta\\mathbf{d}_i,\\,\\cos\\theta_i]\\big),\\qquad \\ell_i\\leftarrow-10^{9}\\;\\text{if}\\;m_i=0", "explain_zh": "每个视角的混合 logit（mlp_network.py:265-267）。MLP_rgb: 37→16→8→1（ELU），m_i 为有效掩码。补充材料 Fig. 1 画的是 35→16→8→1（32 维特征 + 3 维方向），代码多了可见性和点积两维。"}, {"tex": "\\mathbf{c}=\\sum_{i=1}^{N}\\frac{\\exp(\\ell_i)}{\\sum_{j=1}^{N}\\exp(\\ell_j)}\\,\\mathbf{C}_i", "explain_zh": "论文的颜色公式（soft-argmax 形式）。C_i 是采样点投影到第 i 个源视角后，在源图原分辨率上双线性取到的 RGB。所有权重非负且和为 1，因此 c 是 {C_i} 的凸组合。"}, {"tex": "\\hat{\\mathbf{C}}(\\mathbf{r})=\\sum_k T_k\\alpha_k\\mathbf{c}_k=\\sum_k\\sum_i \\underbrace{T_k\\alpha_k\\,\\pi_{k,i}}_{\\ge 0}\\,\\mathbf{C}_{k,i}", "explain_zh": "代入体渲染（见 ib9）后，像素颜色是所有采样点、所有视角源像素颜色的非负加权和，权重之和 Σ_k T_k α_k ≤ 1。π_{k,i} 是第 k 个采样点上第 i 个视角的 softmax 权重。这说明最终像素也不会超出源像素颜色的范围（在累积不透明度为 1 时是凸组合）。"}]}, {"b": "p", "t": "rgb_fc 37→16→8→1。消融（RFF，预训练模型，PSNR/SSIM/LPIPS）：完整 25.13/0.817/0.205；Direct color regression 24.73/0.810/0.220（arXiv / CVPR 版）；No view directions 24.20/0.796/0.243。对照：Quark 的 RGB Output 消融 30.41→29.18。", "label": "具体数字"}, {"b": "p", "t": "论文的理由（§3.2.2）：相对视角方向越小，目标颜色越可能与该源视角的颜色相似，因此用它来预测混合权重，并以源颜色的加权平均作为输出；§4.2 还认为，不用位置编码回归颜色而是混合源图颜色，结果更像自然图像，不会出现 NeRF 那种高频伪影。没有采用的方案：直接回归 RGB（消融 24.73）、手工 ULR 权重（不可学习）、在混合后再加一个修正网络（论文没有）。", "label": "为什么这样设计"}, {"b": "p", "t": "（1）颜色是在每个 3D 采样点上混合的，不是在像素上混合；同一像素不同深度的采样点会从各自的投影位置取色。（2）某采样点没有任何有效视角时，logit 全为 −10⁹，softmax 变成均匀分布，颜色是越界取样得到的 0 的平均；好在这类点的 σ 被置 0，对结果无贡献。（3）凸组合无法“去掉”某个视角独有的反光，只能降低它的权重。（4）方向输入只有相对方向，没有绝对方向，所以网络无法学到与世界坐标有关的外观规律，这对泛化是好事。", "label": "容易误解的地方"}, {"b": "qa", "items": [{"q": "一个采样点投影到 3 个源视角，取到的颜色分别是 0.2、0.6、0.9，网络输出的 logit 分别是 0、1、2。这个点的颜色是多少？它能超过 0.9 吗？", "a": "softmax 权重为 e⁰、e¹、e² 归一化：1、2.718、7.389，和为 11.107，权重约 0.090、0.245、0.665。颜色 = 0.090×0.2 + 0.245×0.6 + 0.665×0.9 ≈ 0.018 + 0.147 + 0.599 = 0.764。无论 logit 怎么变，结果都在 0.2 到 0.9 之间，不可能超过 0.9：这就是凸组合的约束。"}]}, {"b": "sec", "h": "IB9 · 体渲染：论文 Eq.(2) 含间距 δ，官方代码 α = 1 − exp(−σ) 不乘 δ；有效射线才计入损失", "id": "walk-ibrnet-ib9", "sn": {"label": "论文位置", "t": "§3.3 Eq.(2)–(3)（C̃(r)=Σ_k T_k(1−exp(−σ_kδ_k))c_k，T_k=exp(−Σ_{j<k}σ_jδ_j)）；补充材料 Training details（有效射线条件）；代码 ibrnet/render_ray.py: raw2outputs（第 123–167 行，注释说明不用间距）、render_image.py:94"}}, {"b": "p", "t": "输入：一条射线上 M 个采样点的颜色 c_k、密度 σ_k 和深度 z_k。输出：像素颜色 Ĉ（3 维）、期望深度（1 维）、各采样点的渲染权重 w_k（M 维，供 fine 采样使用）、射线是否计入损失的掩码。", "label": "这一步做什么", "mn": {"label": "需要的基础", "links": [{"k": "concept-r-volume"}, {"k": "concept-r-alpha"}, {"k": "concept-n-nerf"}, {"k": "concept-g-depth"}]}}, {"b": "p", "t": "这一步是标准的离散体渲染（r-volume、r-alpha），但论文和代码在一处不一致。论文 Eq.(2)–(3) 与 NeRF 相同：不透明度是 α_k = 1 − exp(−σ_k δ_k)，δ_k 是相邻样本的间距，σ 因此有“每单位长度的密度”这一物理含义。官方代码却写成 α_k = 1 − exp(−σ_k)，不乘 δ（raw2outputs 里算了间距 dists，但 sigma2alpha 没有用它）。代码注释给出了原因：不同 COLMAP 场景的尺度差别很大，乘上间距会影响泛化能力，所以训练和评测都不用间距。论文正文没有提到这个改动。\n\n这个选择的含义值得想清楚。代码不乘 δ 后，σ 变成了“这个采样点本身有多不透明”，与场景的绝对尺度无关，网络不需要知道场景有多大，这对泛化确实有利。但代价是 σ 与采样方式绑定：同一个表面，coarse 网络用 64 个点、fine 网络用 128 个点，要达到同样的累积不透明度，每个点需要的 σ 不同；测试时改采样数或深度范围，渲染结果的含义就变了（n-nerf 的 σ 则可以换采样方式重用）。\n\n合成公式是：透射率 T_k = Π_{j<k}(1 − α_j)，权重 w_k = T_k α_k，颜色 Ĉ = Σ w_k c_k，深度 = Σ w_k z_k。权重之和不超过 1；代码没有为剩余的透射率加背景色（white_bkgd 只在 DeepVoxels 配置里打开）。期望深度在遮挡边界处会落在前景和背景之间，这是体渲染深度的通病。\n\n训练时并不是每条射线都计入损失：一个采样点至少要有 2 个有效源视角才算“有效样本”，一条射线的有效样本要超过 8 个，这条射线的颜色误差才计入损失（补充材料的写法是“有效样本少于 3 个的射线不计入损失”，比代码宽松得多）。这样可以避免网络在几乎没有源视角覆盖的区域（图像边缘、视锥外）被迫拟合。评测时，coarse 输出中无效射线的像素被直接置为白色（render_image.py:94），fine 输出没有这样处理。", "mn": {"label": "类比", "t": "像透过一叠有色玻璃看东西：每块玻璃有多不透明（α），前面的玻璃挡掉多少光（T），决定了每块玻璃对最终颜色的贡献。IBRNet 描述每块玻璃时只说“它有多不透明”，不说“玻璃有多厚、材料有多密”，所以换一叠厚度不同的玻璃，描述就要重新来过。"}}, {"b": "eqs", "eqs": [{"tex": "\\tilde{\\mathbf{C}}(\\mathbf{r})=\\sum_{k=1}^{M}T_k\\big(1-\\exp(-\\sigma_k\\delta_k)\\big)\\mathbf{c}_k,\\qquad T_k=\\exp\\Big(-\\sum_{j=1}^{k-1}\\sigma_j\\delta_j\\Big)", "explain_zh": "论文 Eq.(2)–(3)。样本按深度升序排列，σ_k、c_k 为第 k 个样本的密度和颜色，δ_k 为相邻样本的间距。与 NeRF 的离散体渲染完全相同。"}, {"tex": "\\alpha_k=1-\\exp(-\\sigma_k),\\qquad T_k=\\prod_{j<k}(1-\\alpha_j)=\\exp\\Big(-\\sum_{j<k}\\sigma_j\\Big)", "explain_zh": "官方代码的实现（render_ray.py:136-147）：指数里没有 δ_k，这是代码与论文的差别。α_k 为不透明度，T_k 为到达该点之前的透射率。代码中为数值稳定在 (1−α) 上加了 1e−10。"}, {"tex": "\\hat{\\mathbf{C}}(\\mathbf{r})=\\sum_{k=1}^{M}T_k\\alpha_k\\mathbf{c}_k,\\qquad \\hat{D}(\\mathbf{r})=\\sum_{k=1}^{M}T_k\\alpha_k z_k", "explain_zh": "像素颜色与期望深度。c_k 来自 ib8 的混合颜色，z_k 为采样深度。权重 w_k = T_k α_k 之和即累积不透明度（acc map），不超过 1。"}, {"tex": "\\text{valid}(\\mathbf{r})=\\Big[\\sum_{k}\\big[\\textstyle\\sum_i m_{k,i}\\ge 2\\big]>8\\Big]", "explain_zh": "射线是否计入损失（render_ray.py:156、204，按代码改写）。m_{k,i} 为第 k 个样本在第 i 个视角上的有效标记。补充材料的条件是“有效样本（至少被一个源视角看到）不少于 3 个”，与代码不同。"}]}, {"b": "p", "t": "coarse M=64，fine M=128。有效射线阈值：代码要求至少 9 个采样点各有 ≥2 个有效视角；补充材料写的是有效样本少于 3 个的射线不计入损失。数值例：同一段 1 cm 厚的表面，若 coarse 在其中放 1 个样本、fine 放 3 个样本，要让累积不透明度都达到 0.95，coarse 需要 σ≈3.0，fine 每个样本只需 σ≈1.0（因为 1−exp(−3×1.0)=0.95）。这就是 σ 与采样密度耦合的含义（示例为假设值）。", "label": "具体数字"}, {"b": "p", "t": "去掉 δ 的理由只写在代码注释里：COLMAP 重建的场景尺度各不相同，使用间距会影响跨场景泛化。论文公式仍保留 δ，正文没有交代这一改动。没有采用的方案：NeRF 原式（即论文 Eq.(2) 本身，依赖场景尺度）、先把每个场景归一化到统一尺度再用 δ（LLFF 加载器虽用 bd_factor 做了缩放，但作者仍选择不用 δ）。", "label": "为什么这样设计"}, {"b": "p", "t": "（1）IBRNet 的 σ 不是物理密度，不能与 NeRF 的 σ 直接比较，也不能当作 3D 场导出网格。（2）改变 N_samples、N_importance 或深度范围会改变渲染语义，而且位置编码表长度固定，推理时不应改这些参数。（3）期望深度在边界处是前后景的平均，拿来做几何评估要小心。（4）评测时 coarse 的无效像素被置白而 fine 没有，比较 coarse 与 fine 的误差图时要注意。（5）照论文 Eq.(2) 自己写渲染器、再加载官方权重，结果会不对：权重是按不乘 δ 训练的。", "label": "容易误解的地方"}, {"b": "qa", "items": [{"q": "如果把训练好的 IBRNet 在推理时改成 coarse 用 32 个样本（假设位置编码问题已解决），渲染结果会更好、更差，还是不变？为什么？", "a": "大概率变差，而且不只是因为采样变稀。由于 α = 1 − exp(−σ) 不乘间距，网络学到的 σ 是按“64 个样本时每个样本该有多不透明”来标定的。样本减半后，同一段表面只剩一半的样本，累积不透明度会偏低，射线可能“穿透”表面，背景颜色混进来；如果用的是 NeRF 式带 δ 的公式，间距加倍会自动补偿这一点。"}]}, {"b": "sec", "h": "IB10 · 粗细两级采样：coarse 权重构成逆深度 PDF，再采 64 点，128 点送入独立的 fine 网络", "id": "walk-ibrnet-ib10", "sn": {"label": "论文位置", "t": "§3.3 层次化采样（同时优化结构相同的 coarse 与 fine IBRNet，M_c=M_f=64）；代码 ibrnet/render_ray.py: sample_pdf（第 24–70 行）、render_rays（第 210–248 行）；ibrnet/model.py:35-44"}}, {"b": "p", "t": "输入：coarse 渲染权重 w_k（64 维，detach）、coarse 采样的逆深度。输出：64 个新增采样深度；与原 64 个合并排序成 128 个，送入 fine 网络，得到最终颜色和深度。fine 网络有独立参数，使用特征图的后 32 通道。", "label": "这一步做什么", "mn": {"label": "需要的基础", "links": [{"k": "concept-n-nerf"}, {"k": "concept-f-prob"}, {"k": "concept-r-volume"}, {"k": "concept-r-raymarch"}]}}, {"b": "p", "t": "与 NeRF 一样（n-nerf），均匀采样会把大量样本浪费在空气里。IBRNet 先用 coarse 网络在 64 个逆深度均匀的位置算一遍，得到每个样本的渲染权重 w_k，它近似描述了“表面可能在哪里”。然后把这些权重当作一个沿射线的离散概率分布（f-prob），按它再抽 64 个新位置，表面附近抽得多，空气里抽得少。\n\n具体做法（sample_pdf）：在相邻 coarse 样本的逆深度中点之间形成 62 个区间，用去掉首尾的 62 个权重（加 1e-5 防止全零）归一化成 PDF，求累积分布 CDF；训练时抽均匀随机数 u，测试时用 linspace 取等间隔的 u；找到 u 落在哪个区间，在区间内线性插值得到新的逆深度。整个过程在逆深度空间里完成，与 coarse 采样一致；因为逆深度随深度递减，代码先把区间和权重翻转成递增顺序再做。\n\n新旧样本合并排序后共 128 个，送入 fine 网络。fine 网络与 coarse 结构完全相同，但参数独立，而且使用特征 CNN 输出的另外 32 个通道。coarse 权重在送去采样前被 detach，所以 fine 的损失不会通过采样位置回传到 coarse 网络。训练时两路的颜色误差都计入损失，推理时两路都会渲染，最终结果用 fine 的输出。\n\n这一步是 IBRNet 计算量翻倍的主要原因：fine 网络处理 128 个样本，是 coarse 的两倍，而且要重新对 10 个视角做投影和取样。每个像素共 192 次逐点推理。后来的 ENeRF 把这种“先粗后细”换成用代价体直接预测表面附近的窄区间，只采 1–2 个点，这是它能快几十倍的根本原因。", "mn": {"label": "类比", "t": "像考古勘探：先在整片地上每隔一段打一个探孔（coarse），哪几个孔挖出了陶片，就在那附近密集地再打一批孔（fine），并派一支专门做精细发掘的队伍（独立的 fine 网络）去处理。"}}, {"b": "eqs", "eqs": [{"tex": "p_k=\\frac{w_k+10^{-5}}{\\sum_{j=2}^{M_c-1}(w_j+10^{-5})},\\quad k=2,\\dots,M_c-1;\\qquad F(b_k)=\\sum_{j\\le k}p_j", "explain_zh": "由 coarse 权重构造的离散 PDF 与 CDF（sample_pdf，按代码改写）。去掉首尾两个样本的权重，b_k 是相邻 coarse 样本逆深度的中点构成的区间端点。"}, {"tex": "u\\sim\\mathcal{U}[0,1)\\;(\\text{训练}),\\quad u\\in\\mathrm{linspace}(0,1,M_f)\\;(\\text{测试});\\qquad s^{-1}=b_{k}+\\frac{u-F(b_{k})}{F(b_{k+1})-F(b_{k})}\\,(b_{k+1}-b_k)", "explain_zh": "逆 CDF 采样：找到 u 所在的区间 [b_k, b_{k+1}]，在其中线性插值得到新样本的逆深度 s^{-1}；分母小于 1e-5 时用 1 代替以防除零。M_f=64。"}, {"tex": "\\mathcal{L}=\\sum_{\\mathbf{r}\\in\\mathcal{R}_{\\text{valid}}}\\Big(\\lVert\\hat{\\mathbf{C}}_c(\\mathbf{r})-\\mathbf{C}(\\mathbf{r})\\rVert_2^2+\\lVert\\hat{\\mathbf{C}}_f(\\mathbf{r})-\\mathbf{C}(\\mathbf{r})\\rVert_2^2\\Big)", "explain_zh": "coarse 与 fine 两路的颜色损失之和（论文 Eq.(4)；代码见 criterion.py、train.py:142-146）。Ĉ_c、Ĉ_f 为两路渲染颜色，C 为真值像素，只在有效射线上计算（代码实际为带掩码的均值）。"}]}, {"b": "p", "t": "M_c=64，M_f=64，fine 共 128 个样本；coarse 与 fine 各一个聚合网络（各 20,136 个参数），共用一个特征 CNN（输出 32+32 通道）。fine 位置编码表长 128。评测时 det=True，采样确定。", "label": "具体数字"}, {"b": "p", "t": "论文说明沿用 NeRF 的层次化体采样，同时优化结构相同的 coarse 与 fine 两个网络。detach coarse 权重是为了解耦两个网络（代码注释）。没有采用的方案：单一网络同时做粗细两级（Mip-NeRF 的做法，论文未讨论）、代价体预测深度区间（ENeRF 的做法）。", "label": "为什么这样设计"}, {"b": "p", "t": "（1）fine 网络的输入包含 coarse 的 64 个样本，不是只处理新增的 64 个。（2）coarse 和 fine 用的是同一个 CNN 输出的不同通道，不是两个特征网络。（3）fine 阶段样本间距不均匀，而 ray transformer 的位置编码按序号，因此在不同射线上同一序号对应的深度不同。（4）测试时 u 取等间隔，同样的输入会得到完全相同的输出，这对视频的确定性有好处，但不能保证帧间连续。", "label": "容易误解的地方"}, {"b": "qa", "items": [{"q": "如果 coarse 网络在某条射线上把表面位置判断错了（权重集中在错误的深度），fine 阶段能纠正吗？", "a": "部分可以。fine 网络仍然处理全部 64 个 coarse 样本，所以真正的表面附近至少还有 coarse 精度的样本；如果 fine 网络在那里给出高密度，最终渲染仍可能正确。但新增的 64 个样本都集中在错误位置附近，真正表面附近得不到加密，细节会变差。加 1e-5 的做法让每个区间都有极小的概率被抽到，但在 64 个样本的预算下作用很有限。"}]}, {"b": "sec", "h": "IB11 · 训练：5 个数据源混合，coarse+fine MSE，Adam 1e-3/5e-4，8×V100 约一天", "id": "walk-ibrnet-ib11", "sn": {"label": "论文位置", "t": "§3.4 实现细节、§4.1 训练数据、补充材料 Training details；代码 train.py、configs/pretrain.txt、config.py、ibrnet/data_loaders/create_training_dataset.py、criterion.py、README 的 Datasets 与 Training 节"}}, {"b": "p", "t": "输入：5 个训练数据源的多视角图像与位姿。输出：预训练权重（发布版 model_255000.pth）。每一步每张 GPU 取 1 个目标视角、8–12 个源视角，随机取若干条目标射线，计算 coarse 与 fine 两路的颜色 MSE。", "label": "这一步做什么", "mn": {"label": "需要的基础", "links": [{"k": "concept-l-loss"}, {"k": "concept-f-optim"}, {"k": "concept-n-generalizable"}, {"k": "concept-g-sfm"}]}}, {"b": "p", "t": "训练的思路很朴素：任意一个多视角数据集，只要有位姿，就能拆出无数个“目标 + 源视角”的训练样本，不需要深度或 3D 真值，只比较渲染颜色与目标照片（l-loss）。\n\n数据来自 5 个来源。论文 §4.1（项目主页 PDF 版）写的是 Google Scanned Objects 的 1,030 个模型、RealEstate10K、Spaces，以及 95 个手机拍摄场景（LLFF 36 个、自采 59 个）；arXiv / CVPR 版改为 1,023 个模型、102 个场景（35 + 67）。README 和代码对应的是：作者自采的 67 个前向场景；LLFF 发布的场景（README 要求先删掉与测试集重叠的 7 个）；DeepView 发布的 Spaces 数据集（代码用全部 100 个场景）；RealEstate10K 的 200 个视频片段（README 说再多也只有边际提升）；Google Scanned Objects（README 写 1032 个物体），每个渲染 250 个视角。代码按 0.3、0.15、0.35、0.15、0.05 的权重从 LLFF、Spaces、自采、RealEstate10K、Google Scanned Objects 中采样，论文没有给出这组权重。全部是静态场景，没有动态或人物数据。\n\n每一步：从加权采样器取一个样本（1 个目标 + N 个源视角），real_iconic_noface 随机裁剪到约 24 万像素的块，自采数据和 Spaces 固定裁剪 400×600，这三者都随机水平翻转；随机抽 N_rand 条目标射线，N_rand = 500×10/N，源视角少时多抽一些射线，大致保持计算量恒定。损失是 coarse 和 fine 两路颜色 MSE 之和，只在有效射线上计算。\n\n优化器是 Adam，特征 CNN 学习率 1e-3，聚合网络 5e-4（f-optim）。论文写学习率“指数衰减”，代码用 StepLR，每 50K 步乘 0.5；代码默认训练 250K 步，发布的权重是第 255K 步。论文称在 8 张 V100 上训练，每个 batch 3,200–9,600 条射线，补充材料称预训练约一天；按代码配置，8 卡合计约 3.3K–5K 条。README 推荐用 torch.distributed.launch 在 8 卡上训练，单卡也可以，但会慢很多。", "mn": {"label": "类比", "t": "像训练一名“看图补图”的学徒：从各种相册里随手抽一张照片遮住，给他看附近的几张，让他画出被遮住的那张，然后对答案。相册来源越杂（室内、室外、物体、房地产视频），他学到的规则越通用。"}}, {"b": "eqs", "eqs": [{"tex": "N_{\\text{rand}}=\\Big\\lfloor 500\\times\\frac{10}{N}\\Big\\rfloor,\\qquad N\\in\\{8,\\dots,12\\}\\;\\Rightarrow\\;N_{\\text{rand}}\\in[416,625]", "explain_zh": "每张 GPU 每步的射线数（train.py:122，按代码改写）。N 为该样本的源视角数。"}, {"tex": "\\eta_t=\\eta_0\\cdot 0.5^{\\lfloor t/50000\\rfloor},\\qquad \\eta_0^{\\text{feat}}=10^{-3},\\;\\eta_0^{\\text{IBRNet}}=5\\times10^{-4}", "explain_zh": "学习率日程（model.py:69-71 的 StepLR 与 configs/pretrain.txt）。t 为步数。论文描述为指数衰减，这里是它的阶梯版本。"}, {"tex": "P(\\text{来自数据集 }d)=\\omega_d,\\quad (\\omega_{\\text{LLFF}},\\omega_{\\text{Spaces}},\\omega_{\\text{自采}},\\omega_{\\text{RE10K}},\\omega_{\\text{GSO}})=(0.3,0.15,0.35,0.15,0.05)", "explain_zh": "数据集混合权重（configs/pretrain.txt，create_training_dataset.py 中每个样本的权重为 ω_d/|d|，再用 WeightedRandomSampler 采样）。本次核对的论文正文和补充材料都没有给出这组权重。"}]}, {"b": "p", "t": "代码：n_iters 250K（默认），发布权重 255K 步；N_rand 500；lr 1e-3 / 5e-4，每 50K 步 ×0.5；验证 chunk 2000、render_stride 2。论文：8×V100，每个 batch 3,200–9,600 条射线；补充材料：预训练约一天。数据（README）：自采 67 场景（4.1 GB），Google Scanned Objects 1032 个物体 × 250 视角 512×512（7.5 GB），RealEstate10K 200 场景（帧约 29 GB，缩放到 450×800）。", "label": "具体数字"}, {"b": "p", "t": "论文的思路是用多样的数据让网络学到跨场景的先验：合成物体提供完美位姿和大视角变化，真实前向场景和 RealEstate10K 提供真实的光照、材质和位姿噪声。只用光度损失，是因为这些数据都没有可靠的深度真值。没有采用的方案：深度监督、感知损失（LPIPS）、对抗损失。", "label": "为什么这样设计"}, {"b": "p", "t": "（1）论文与代码的若干细节不一致（n 的分布、射线数上限、学习率衰减形式、有效射线阈值、体渲染是否乘 δ），复现以代码为准。（2）训练数据全是静态场景，网络从未见过运动物体或人物，这直接影响它在 DyNeRF 这类动态数据上的表现（Ha et al. 测得 22.49 dB）。（3）每张 GPU 每步只有 1 个目标视角，单卡训练时有效 batch 很小，需要相应延长训练。（4）0.5% 概率把目标图混入源视角，意味着网络偶尔会见到“答案就在输入里”的样本。", "label": "容易误解的地方"}, {"b": "qa", "items": [{"q": "为什么 IBRNet 可以用 RealEstate10K 这种只有视频帧和相机轨迹、没有任何 3D 真值的数据训练？这类数据有什么局限？", "a": "因为监督信号只是“渲染颜色等于留出帧的颜色”，只需要图像和位姿，不需要深度或网格。RealEstate10K 的相机位姿来自 SLAM/SfM，只要足够准确，就能构成“目标 + 源视角”对。局限是：场景基本静止、相机沿视频轨迹移动（视角分布偏窄、多为平移）、位姿有噪声，而且没有人物和动态内容，对临场应用的覆盖不够。"}]}, {"b": "sec", "h": "IB12 · 泛化 vs 逐场景微调：同一网络在测试场景继续训练，前向场景 25.13 → 26.73", "id": "walk-ibrnet-ib12", "sn": {"label": "论文位置", "t": "Table 1（预训练 IBRNet 与微调 IBRNet_ft 两组）；§3.3 Fine-tuning 与 §3.4 微调学习率；补充材料 Training details（微调耗时）；代码 configs/finetune_llff.txt、ibrnet/data_loaders/llff_test.py（mode='train'）、README 的 Finetuning 节"}}, {"b": "p", "t": "输入：预训练权重、测试场景的训练图像（LLFF 中除每 8 张留出的测试图以外的图）。输出：针对该场景的微调权重。渲染方式与泛化设定完全相同，仍从源视角取像素。", "label": "这一步做什么", "mn": {"label": "需要的基础", "links": [{"k": "concept-n-generalizable"}, {"k": "concept-n-nerf"}, {"k": "concept-f-optim"}, {"k": "concept-v-metrics"}, {"k": "adv-a-generalizable-ibr"}]}}, {"b": "p", "t": "IBRNet 同时提供两种用法（n-generalizable）。泛化：直接拿预训练权重渲染新场景，不做任何优化。微调：把测试场景自己的训练图像当训练数据，用同样的“遮住一张、用附近几张补”的方式继续训练。微调不改变网络结构，也不把场景存进网络，只是让“判断表面、挑选像素”的规则更适应这个场景的材质、光照和相机分布。\n\n代码中的微调配置：lrate_feature 5e-4、lrate_mlp 2e-4（论文给出的微调基础学习率也是这两个值），每 20K 步乘 0.5，共 60K 步，N_rand=500（再按 500×10/N 缩放），不加载预训练时的优化器状态。LLFF 测试场景在微调模式下只用训练图做目标和源视角，测试图始终不参与；候选池上限 28 张，N 在 8–11 之间。README 的例子用 2 张 GPU。补充材料说，前向场景每个场景在单张 V100 上约 6 小时达到报告的性能，微调时长随场景而异。\n\n结果（Table 1）：Real Forward-Facing 上从 25.13 / 0.817 / 0.205 提升到 26.73 / 0.851 / 0.175，略高于 NeRF 的 26.50 / 0.811 / 0.250；DeepVoxels 上从 37.17 提升到 42.93 / 0.997 / 0.009（NeRF 40.15）；Realistic Synthetic 360° 上从 25.49 提升到 28.14，但 PSNR 仍比 NeRF 的 31.01 低约 2.9 dB（LPIPS 0.072 反而好于 NeRF 的 0.081）。论文 §4.2 的解释是：这组数据对复杂几何来说训练视角太稀疏，局部源视角的信息可能不足以合成新视角，用全部视角优化全局辐射场的 NeRF 更合适。\n\n对临场系统，微调提供了一个有意思的折中：阵列与环境是固定的，可以事先在该环境的多视角数据上微调，让网络适应这套相机的色彩、分辨率和背景，而动态的人物仍靠泛化能力处理。但要注意，这不会让推理变快：微调后仍然是每像素 192 个采样点、每点 10 个视角的计算。", "mn": {"label": "类比", "t": "像一名通用翻译到一家公司长期驻场：基本功不变，但熟悉了这家公司的术语和习惯后，翻译得更准。他仍然要一句一句地翻，不会因为熟悉了就变快。"}}, {"b": "eqs", "eqs": [{"tex": "\\theta_{\\text{ft}}=\\arg\\min_{\\theta}\\;\\mathbb{E}_{(t,\\mathcal{S})\\subset\\mathcal{D}_{\\text{scene}}^{\\text{train}}}\\;\\mathcal{L}\\big(\\theta;\\,t,\\mathcal{S}\\big),\\qquad \\theta\\;\\text{初始化为}\\;\\theta_{\\text{pre}}", "explain_zh": "逐场景微调的目标（按代码改写）：从测试场景的训练图集合 D 中反复抽取目标视角 t 与源视角集合 S，最小化 ib10 的损失 L。θ_pre 为预训练参数。"}, {"tex": "\\Delta\\mathrm{PSNR}=10\\log_{10}\\frac{\\mathrm{MSE}_1}{\\mathrm{MSE}_2}\\;\\Rightarrow\\;\\frac{\\mathrm{MSE}_{\\text{ft}}}{\\mathrm{MSE}_{\\text{pre}}}=10^{-(26.73-25.13)/10}\\approx 0.69", "explain_zh": "PSNR 差与 MSE 比的换算。前向场景上微调使 MSE 降到预训练模型的约 0.69 倍。"}]}, {"b": "p", "t": "微调配置：60K 步，lr 5e-4（特征）/ 2e-4（IBRNet），每 20K 步 ×0.5，N_rand 500，chunk 2000，render_stride 2（验证时隔行渲染）。Table 1：RFF 25.13→26.73（NeRF 26.50）；DeepVoxels 37.17→42.93（NeRF 40.15）；Realistic Synthetic 25.49→28.14（NeRF 31.01）。耗时：补充材料称前向场景每个场景在单张 V100 上约 6 小时，论文没有给出步数。Table 3：微调模型用 5/8/10 个源视角时 PSNR 25.80/26.56/26.73。", "label": "具体数字"}, {"b": "p", "t": "论文用微调结果说明：同一个框架既能零样本泛化，也能在有时间优化时达到与逐场景方法相当的质量（论文没有与 NeRF 比较收敛速度，只在补充材料给出约 6 小时的微调耗时，并说更好的超参数可以加速）。没有采用的方案：把微调后的场景“烘焙”成独立的辐射场（IBRNet 始终依赖源视角）。", "label": "为什么这样设计"}, {"b": "p", "t": "（1）IBRNet_ft 不是 NeRF 那样的自包含模型，渲染时仍需源图和特征 CNN。（2）Realistic Synthetic 360° 上微调后仍明显落后 NeRF，不能笼统地说“微调后超过 NeRF”。（3）仓库的 eval/finetune_llff.sh 调用了不存在的 run_nerf.py，应改为 train.py；finetune_llff.txt 设置了 distributed=True，单卡运行要改为 False 或用 torch.distributed.launch 启动。（4）Table 1 中 NeRF 等逐场景方法的数字与 NeRF 论文 Table 1 完全相同，应是引用值，不是在同一套代码下重跑的。", "label": "容易误解的地方"}, {"b": "qa", "items": [{"q": "既然微调后 IBRNet 在前向场景上略胜 NeRF，为什么说它仍然不适合“一次重建、多次渲染”的应用？", "a": "因为微调只是调整了网络参数，场景内容依然存放在源图里，每渲染一个新视角都要重新选源视角、投影、取样、跑逐点网络，成本与泛化设定相同，每帧仍是几十秒量级。NeRF 虽然训练慢，但训练好之后场景就在网络里（或可以烘焙成网格、体素），不再需要源图；3DGS 更是可以实时光栅化。IBRNet 的“表示”是即时构造、即时丢弃的。"}]}, {"b": "sec", "h": "IB13 · 怎么读实验：Table 1、消融、视角密度，以及 ENeRF、Du et al.、Ha et al. 的复测", "id": "walk-ibrnet-ib13", "sn": {"label": "论文位置", "t": "Table 1、Table 2（消融）、Table 3（源视角数与每像素 FLOPs）、Fig. 4（源视角密度敏感度）；外部复测：ENeRF（arXiv 2112.01517）DTU 表，Du et al.（arXiv 2304.08463）RealEstate10K 表，Ha et al.（arXiv 2505.18932）Table 1–2；代码 eval/eval.py、configs/eval_*.txt"}}, {"b": "p", "t": "输入：渲染图与真值图。输出：PSNR、SSIM、LPIPS。eval.py 用 TensorFlow 的 tf.image.psnr、tf.image.ssim（max_val=1）和 lpips_tf 的 VGG 版 LPIPS，逐图计算后取场景平均。", "label": "这一步做什么", "mn": {"label": "需要的基础", "links": [{"k": "concept-v-metrics"}, {"k": "concept-v-temporal"}, {"k": "concept-n-generalizable"}, {"k": "adv-a-generalizable-ibr"}, {"k": "adv-a-temporal-video"}]}}, {"b": "p", "t": "Table 1 分两组读（v-metrics）。第一组是没见过测试场景的 IBRNet 与 LLFF：前向场景 25.13 对 24.13，DeepVoxels 37.17 对 34.38，NeRF 合成数据 25.49 对 24.88，这是论文最核心的证据；前向场景上预训练模型的 SSIM 和 LPIPS 甚至已经好于逐场景优化的 NeRF。第二组是逐场景方法（SRN、NV、NeRF）与微调后的 IBRNet_ft，其中 SRN、NV、LLFF、NeRF 的数字与 NeRF 论文 Table 1 完全相同。三个数据集难度差别很大：DeepVoxels 是 4 个漫反射简单物体，PSNR 普遍很高；NeRF 合成数据视角稀、几何复杂，IBRNet 在这里最弱，论文 §4.2 自己也这样解释。\n\n消融（Table 2）只在前向场景上用预训练模型做，单次训练、无误差条：去掉 ray transformer 掉 3.8 dB，去掉视角方向掉 0.9 dB，直接回归颜色只掉 0.4 dB（这一行只见于 arXiv / CVPR 版）。可见性模块、单独的 Eq.(1) 池化、粗细两级、训练数据来源都没有消融。Table 3 在微调模型上比较了 5/8/10 个源视角（25.80/26.56/26.73 dB，每像素 29M/45M/55M FLOPs），并称 IBRNet 所需 FLOPs 不到 NeRF 的 20%；但这些 FLOPs 不含特征提取，也不含投影和取样的访存开销，不能直接换算成耗时。Fig. 4 在 DeepVoxels 上把训练视角子采样 2–10 倍，预训练模型从约 37.2 dB 降到约 31.5 dB（图上读数）。\n\n后续工作的复测更能说明 IBRNet 的适用边界。ENeRF 在 DTU 上测得 IBRNet 26.04 dB，自己 27.61 dB 且快至少 60 倍：同样的可泛化设定，加一个代价体估计几何，质量和速度都上去了。Du et al.（CVPR 2023）在 RealEstate10K 只给 2 个宽基线视角时，IBRNet 只有 15.99 dB：它是为“多个近邻视角插值”设计的。Ha et al. 在 DyNeRF 上用作者发布的权重、每个目标视角取 4 个最近相机，测得 22.49 dB、STED 737.7，定性结果偏糊、远处背景丢失；同时在 D3DMV 上 TCC 有 0.901，与 Ha et al. 的 0.915 相差不大。一种可能的解释是“糊”会让基于帧差的时间指标显得稳定（v-temporal）。\n\n跨论文比较要看清协议：IBRNet 用 VGG 版 LPIPS，很多后续论文用 AlexNet 版；同一方法在不同论文里的数字也可能差很多，例如 GPNR 在 Du et al. 的表中是 18.55，在 pixelSplat 的表中是 24.11。", "mn": {"label": "类比", "t": "像读体检报告：论文自己的报告是在“最擅长的项目”上测的（稠密视角、静态场景），后续论文的复测相当于换了几个医院、换了几个项目再测一遍，哪里强、哪里弱就清楚多了。"}}, {"b": "eqs", "eqs": [{"tex": "\\mathrm{PSNR}=10\\log_{10}\\frac{1}{\\mathrm{MSE}},\\qquad \\mathrm{MSE}=\\frac{1}{3HW}\\sum_{p,c}\\big(\\hat{I}_{p,c}-I_{p,c}\\big)^2", "explain_zh": "像素值在 [0,1] 时的 PSNR。每提高 1 dB，MSE 约降为 0.79 倍；提高 3.8 dB（去掉 ray transformer 的差距），MSE 约为 0.42 倍。"}, {"tex": "\\mathrm{LPIPS}(x,y)=\\sum_{l}\\frac{1}{H_lW_l}\\sum_{h,w}\\big\\lVert \\mathbf{w}_l\\odot(\\hat{\\phi}_l(x)_{hw}-\\hat{\\phi}_l(y)_{hw})\\big\\rVert_2^2", "explain_zh": "LPIPS：φ̂_l 为预训练网络第 l 层归一化后的特征，w_l 为学到的通道权重。IBRNet 评测用 VGG 主干（eval.py:72，net='vgg'），与 AlexNet 主干的数值不可直接比较。"}]}, {"b": "p", "t": "Table 1（PSNR/SSIM/LPIPS）：RFF 预训练 25.13/0.817/0.205，LLFF 24.13/0.798/0.212，NeRF 26.50/0.811/0.250，微调 26.73/0.851/0.175；Realistic Synthetic 预训练 25.49/0.916/0.100，LLFF 24.88/0.911/0.114，NeRF 31.01/0.947/0.081，微调 28.14/0.942/0.072；DeepVoxels 预训练 37.17/0.990/0.017，LLFF 34.38/0.985/0.048，NeRF 40.15/0.991/0.023，微调 42.93/0.997/0.009。Table 2（RFF）：No ray transformer 21.31/0.675/0.355；No view directions 24.20/0.796/0.243；Direct color regression 24.73/0.810/0.220（arXiv / CVPR 版）。Table 3：5/8/10 个源视角 25.80/26.56/26.73 dB，29M/45M/55M FLOPs/像素（NeRF 304M）。复测：ENeRF 等的 DTU 表 26.04/0.917/0.191（ENeRF 27.61/0.957/0.089）；Depth-Guided Bundle Sampling 的表 0.217 FPS（每射线 128 个样本）；GPS-Gaussian-THuman2.0 23.38/0.836/0.212（GPS-Gaussian 25.57），每个新视角约 4000 ms（RTX 3090）；Du et al.-RE10K 15.99/0.484/0.532；Ha et al.-DyNeRF 22.49、STED 737.7，D3DMV TCC 0.901。", "label": "具体数字"}, {"b": "p", "t": "论文选择 NeRF 的三个基准，是为了与当时最强的逐场景方法直接比较，同时展示泛化能力。评测脚本特意用 TensorFlow 实现的 SSIM/PSNR，注释说明是为了与 NeRF 论文的设置一致。", "label": "为什么这样设计"}, {"b": "p", "t": "（1）Table 1 中逐场景方法的数字与 NeRF 论文 Table 1 完全相同，应是引用值（论文没有写明），不是同一代码库重跑的结果。（2）评测配置默认只取 NeRF 合成数据 1/8、DeepVoxels 1/10 的测试视角，论文是否如此未说明。（3）消融只在一个数据集、单次训练上完成，0.4 dB 级别的差异需要谨慎解读。（4）外部复测使用的设定（视角数、分辨率、是否重训）各不相同，只能看趋势，不能拼成一张表。（5）论文没有时间一致性指标，也没有实际耗时（只有 Table 3 的每像素 FLOPs），这部分只能靠后续论文补。", "label": "容易误解的地方"}, {"b": "qa", "items": [{"q": "Ha et al. 的表中 IBRNet 在 D3DMV 上的 TCC 为 0.901，接近 Ha et al. 的 0.915，但 DyNeRF 上的 PSNR 只有 22.49。如何同时解释这两个数字？", "a": "一种可能的解释（Ha et al. 没有做这样的分析）：TCC 比较的是渲染视频与真值视频的帧差图。IBRNet 输出整体偏糊，细节被平均掉，帧与帧之间的高频变化也被抹平，帧差图反而比较“安静”，与真值帧差的结构相似度不低；但糊本身让每帧的 PSNR 很低。所以时间一致性指标必须与保真度指标一起看：一个处处模糊的方法可以“很稳定”，却毫无用处。"}]}, {"b": "sec", "h": "配套文章", "id": "parts"}, {"b": "toc", "groups": [{"items": [{"k": "wpart-ibrnet-tensor-trace", "t": "IBRNet · 张量追踪", "en": "", "s": "逐阶段列出 16 个关键张量的形状与含义。"}, {"k": "wpart-ibrnet-experiments", "t": "IBRNet · 阅读实验", "en": "", "s": "论文里 10 组实验分别怎么读、真正说明了什么。"}, {"k": "wpart-ibrnet-tradeoffs", "t": "IBRNet · 设计权衡", "en": "", "s": "7 个关键设计选择：换来了什么，付出了什么。"}, {"k": "wpart-ibrnet-faq", "t": "IBRNet · 常见问题", "en": "", "s": "初读时最常问的 11 个问题。"}, {"k": "wpart-ibrnet-exercises", "t": "IBRNet · 练习", "en": "", "s": "6 道由浅入深的动手练习。"}, {"k": "wpart-ibrnet-glossary", "t": "IBRNet · 论文术语", "en": "", "s": "读这篇论文会遇到的 28 个术语。"}]}]}], "toc": true, "series": {"prev": {"k": "guide-tele360"}, "next": {"k": "guide-enerf"}, "up": {"u": "works/walkthrough/index.html", "t": "Walkthrough 目录"}}}}</script>
<script>
(function () {
  "use strict";
  // ================= lib: DOM, text and math helpers shared by every page =================
  // A page script defines rich(text) (inline cross-links); paras() and eqList() call it.
  var DATA;
  try { DATA = JSON.parse(document.getElementById("data").textContent); } catch (e) { DATA = {}; }
  var meta = DATA.meta || {};

  // ---------- DOM helpers: all text goes through textContent; external links are https-only ----------
  function safeUrl(u) { if (typeof u !== "string") return null; var s = u.trim(); return /^https:\/\/[^\s"'<>]+$/i.test(s) ? s : null; }
  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (!Object.prototype.hasOwnProperty.call(attrs, k)) continue;
      var v = attrs[k];
      if (v === null || v === undefined || v === false) continue;
      if (k === "class") n.className = v;
      else if (k === "text") n.textContent = String(v);
      else if (k === "href") { var u = safeUrl(v); if (u) { n.setAttribute("href", u); n.setAttribute("target", "_blank"); n.setAttribute("rel", "noopener noreferrer"); } }
      else if (k.slice(0, 2) === "on" && typeof v === "function") n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, String(v));
    }
    (kids || []).forEach(function (c) { if (c === null || c === undefined || c === false) return; n.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return n;
  }
  var SVGNS = "http://www.w3.org/2000/svg";
  function sv(tag, attrs, kids) {
    var n = document.createElementNS(SVGNS, tag);
    if (attrs) for (var k in attrs) {
      if (!Object.prototype.hasOwnProperty.call(attrs, k)) continue;
      var v = attrs[k];
      if (v === null || v === undefined || v === false) continue;
