l", "t": "GPS-Gaussian · 设计权衡", "e": "", "m": "Walkthrough · GPS-Gaussian", "s": "8 个关键设计选择：换来了什么，付出了什么。"}}, "page": {"id": "guide-gpsgaussian", "head": {"title": "GPS-Gaussian 导读", "sub": "GPS-Gaussian: Generalizable Pixel-wise 3D Gaussian Splatting for Real-time Human Novel View Synthesis", "meta": ["12 步", {"k": "anchor-gpsgaussian", "t": "GPS-Gaussian 精读"}], "epigraph": "", "prereqs": [], "lede": "", "minutes": 49}, "body": [{"b": "sec", "h": null, "id": "story"}, {"b": "mtoc", "items": [{"u": "#walk-gpsgaussian-gp1", "t": "GP1 问题设定：环形相机阵列拍人物，每个新视点只用最近的两台相机"}, {"u": "#walk-gpsgaussian-gp2", "t": "GP2 立体校正：用 cv2.stereoRectify 把两台相机转成行对齐的双目，并得到 Tf_x = −fB"}, {"u": "#walk-gpsgaussian-gp3", "t": "GP3 共享图像编码器：两视角一起编码，得到 1/2、1/4、1/8 三级特征（32/48/96 通道）"}, {"u": "#walk-gpsgaussian-gp4", "t": "GP4 双向 1D 相关体：1/8 分辨率上每个像素 128 个水平候选，建 4 级金字塔"}, {"u": "#walk-gpsgaussian-gp5", "t": "GP5 迭代视差更新：单层 ConvGRU 只跑 T=3 次，再用凸组合上采样 8 倍"}, {"u": "#walk-gpsgaussian-gp6", "t": "GP6 视差到深度再到位置图：代码里的 depth 其实是逆深度 1/Z，只有前景像素变成高斯中心"}, {"u": "#walk-gpsgaussian-gp7", "t": "GP7 高斯参数图：深度编码器加 U-Net 解码器，逐像素输出旋转（4）、尺度（3，≤0.01）、不透明度（1），颜色直接取源像素"}, {"u": "#walk-gpsgaussian-gp8", "t": "GP8 合并与渲染：两视角的高斯一次性送进原版 3DGS 光栅器，输出 2048×2048，新视角渲染 0.8 ms"}, {"u": "#walk-gpsgaussian-gp9", "t": "GP9 联合训练：L = L_disp + 0.8·L1 + 0.2·(1−SSIM)，先预训练深度 40K 步，再联合训练 100K 步"}, {"u": "#walk-gpsgaussian-gp10", "t": "GP10 合成训练数据：Twindom 1700 个加 THuman2.0 526 个人体扫描，在虚拟相机圈中渲染（论文 8 台，公开代码 16 台）"}, {"u": "#walk-gpsgaussian-gp11", "t": "GP11 实时性能与真实系统：论文报告 RTX 3090 + TensorRT 下源处理 27 ms、渲染 0.8 ms，表中 25 FPS；演示接入 6 台相机"}, {"u": "#walk-gpsgaussian-gp12", "t": "GP12 如何读实验：Table 1 三个数据集、Table 3 消融，以及第三方重训与复现问题"}]}, {"b": "p", "t": "先看场景。一个人站在一圈相机中间，8 台相机均匀摆在圆周上，相邻两台大约隔 45°。远端的人戴着头显，想从任意角度实时看到他，画面要清晰到能看清衣服褶皱和发丝，还不能卡顿。2023 年底，现成的办法大致有两类，都不理想。第一类是 NeRF 或 3D Gaussian Splatting（3DGS）逐人物优化：每个人、每一帧都要先花几分钟训练，根本谈不上实时；而且 8 个视角对逐场景优化来说太稀疏，在论文的测试里 3DGS 只有 24.18 dB。第二类是 ENeRF、IBRNet 这类可泛化的辐射场或学习式 IBR：不需要逐人物训练，但每个新视角都要沿射线采样、跑网络，ENeRF 每个新视角要 125 ms，IBRNet 要约 4 s。\n\n作者的核心直觉是把两件事拆开：几何让双目立体匹配来做，外观和形状细节让一张“参数图”来做，最后交给 3DGS 光栅器渲染。相机是标定好的，相邻两台的画面重叠很大，这正是立体匹配最擅长的情形：先校正成行对齐的左右图（g-epipolar），再沿同一行找对应点，得到视差，就能换算出每个像素的深度（g-depth、d-stereo）。有了深度，每个前景像素都能反投影成一个 3D 点（g-pinhole），在这个点上放一个高斯。高斯还需要旋转、尺度、不透明度，这些不再靠逐场景优化，而是由一个 U-Net 在源图像平面上逐像素预测出来（l-cnn）。作者把这种与像素一一对应的预测结果叫作高斯参数图（Gaussian parameter maps）。颜色干脆直接用源像素：人体表面大体是漫反射，没必要为每个高斯学球谐系数。\n\n具体流程是这样的。对一个目标视点，从阵列里挑出离它最近的两台相机，做立体校正。两张校正图过一个共享编码器，得到 1/2、1/4、1/8 三级特征。在 1/8 分辨率上，同一行的左右特征两两做点积，得到相关体；一个很小的 RAFT 式循环网络在相关体上迭代 3 次，逐步修正视差（l-iterative、a-learned-stereo），最后凸上采样回 1024×1024。代码里左→右和右→左两个方向的视差在一次前向里同时算出，所以两个视角都能得到深度。深度再和图像特征一起送进参数回归网络，输出旋转、尺度、不透明度三张图。两个视角的所有前景像素都变成高斯后合并，用原版 3DGS 光栅器渲染出 2048×2048 的新视角（n-3dgs、r-raster、r-alpha）。整条管线可微，所以训练时把渲染损失和视差损失加在一起，深度网络也能从“渲染得好不好”中得到梯度。这就是论文强调的联合训练。\n\n训练数据来自 Twindom 和 THuman2.0 的人体扫描：把 2000 多个扫描放进虚拟相机圈里渲染，自然就有了图像、mask、深度真值和任意视角的真值图。在 THuman2.0 上，PSNR 为 25.57，ENeRF 为 24.10，逐人物优化的 3DGS 为 24.18；在 RTX 3090 上（论文用 TensorRT 加速），两个视角的源处理 27 ms，每个新视角渲染只要 0.8 ms，表中帧率为 25 FPS。最后这个数字揭示了一个结构上的优势：高斯一旦生成，就与观看视点无关，头显的双眼、多名观众都只需各做一次 0.8 ms 的光栅化。\n\n但读这篇论文时，有几件事要一起看清楚。第一，它只处理人物，依赖准确的前景抠像，mask 外一个高斯都没有。第二，深度前端要求相邻相机夹角小，论文用 45°，公开代码和权重却是 16 台相机、22.5°，GitHub 上有多位用户反映按论文设定复现不出表格数字。第三，“25 FPS”是 TensorRT 加速后的数字，公开代码里既没有计时脚本也没有 TensorRT 部署；用户用原生 PyTorch 代码在 RTX 3090 上分段实测，三段合计约 112 ms，Ha et al.（CVPR 2025）重训后测得 143.4 ms。第四，两个视角的高斯直接拼在一起渲染，深度不一致时会出现 Z-fighting 和飞点；方法逐帧独立，Ha et al. 在 DyNeRF 上测得的时间一致性指标 STED 是 ENeRF 的约 9 倍。站内另一篇重点论文 Ha et al. 正是把它当作反面参照：改用解析的像素级高斯、逐视角渲染，再用几何引导的网络融合。\n\n对新人来说，这篇论文是把“双目立体、反投影、3D 高斯、可微光栅化”串成一条完整实时管线的最好范例，而且有开源代码可以直接跑。读完它再读 pixelSplat 和 MVSplat，就能看清“深度从哪里来”这个问题在前馈 3DGS 中的三种答案：校正双目加深度真值（本文）、沿射线的概率深度（pixelSplat）、平面扫描代价体（MVSplat）。再对照 Quark 和 Ha et al.，就能看清“重建一次、渲染多次”与“每个视点重新推理”这两种系统形态各自的得失。"}, {"b": "sec", "h": "流水线", "id": "pipeline"}, {"b": "p", "t": "点击方框跳到对应步骤。"}, {"b": "slot", "name": "diagram", "which": "gpsgaussian", "label": "GPS-Gaussian 流程图", "spec": {"w": 960, "nodes": [{"x": 10, "y": 272, "w": 135, "h": 64, "t": "合成扫描数据", "s": "Twindom+THuman", "step": "gp10", "data": true}, {"x": 10, "y": 160, "w": 135, "h": 64, "t": "源视角对", "s": "2×1024²，已抠像", "step": "gp1"}, {"x": 167, "y": 160, "w": 135, "h": 64, "t": "立体校正", "s": "行对齐，Tf_x=−fB", "step": "gp2"}, {"x": 323, "y": 160, "w": 135, "h": 64, "t": "共享编码器", "s": "1/2·1/4·1/8 特征", "step": "gp3"}, {"x": 480, "y": 48, "w": 135, "h": 64, "t": "1D 相关体", "s": "128 候选×4 级", "step": "gp4"}, {"x": 637, "y": 48, "w": 135, "h": 64, "t": "GRU 迭代", "s": "T=3，凸上采样×8", "step": "gp5"}, {"x": 637, "y": 160, "w": 135, "h": 64, "t": "逆深度与位置", "s": "反投影，仅前景", "step": "gp6", "data": true}, {"x": 637, "y": 272, "w": 135, "h": 64, "t": "参数图回归", "s": "旋转·尺度·不透明度", "step": "gp7"}, {"x": 793, "y": 160, "w": 135, "h": 64, "t": "合并渲染", "s": "3DGS 光栅化 2K", "step": "gp8"}, {"x": 793, "y": 272, "w": 135, "h": 64, "t": "联合损失", "s": "L_disp+L1+SSIM", "step": "gp9"}, {"x": 793, "y": 48, "w": 135, "h": 64, "t": "实时性能", "s": "27 ms+0.8 ms", "step": "gp11", "data": true}, {"x": 480, "y": 272, "w": 135, "h": 64, "t": "实验与复现", "s": "Table 1/3，第三方", "step": "gp12", "data": true}], "edges": [{"d": "M78,272 L78,224"}, {"d": "M145,192 L167,192"}, {"d": "M302,192 L323,192"}, {"d": "M458,192 C469,192 469,80 480,80"}, {"d": "M615,80 L637,80"}, {"d": "M704,112 L704,160"}, {"d": "M458,192 C548,192 548,304 637,304"}, {"d": "M704,224 L704,272"}, {"d": "M772,192 L793,192"}, {"d": "M772,304 C782,304 782,192 793,192"}, {"d": "M860,224 L860,272"}, {"d": "M860,160 L860,112"}, {"d": "M860,336 C860,366 390,366 390,224", "fb": true}, {"d": "M145,304 L480,304"}, {"d": "M860,224 L860,240 L939,240 L939,354"}], "loop": {"x": 468, "y": 16, "w": 316, "h": 122, "label": "迭代 × 3", "noteK": "gp5", "note": "每步查相关、更新视差"}, "out": {"x": 883, "y": 372, "text": "新视角图像（2048×2048）"}, "h": 384}}, {"b": "sec", "h": "读之前先掌握", "id": "before"}, {"b": "refs", "items": [{"k": "concept-g-pinhole", "gloss": "gp6 用 X = R^T(Z·K^{-1}[u,v,1]^T − t) 把每个前景像素反投影成高斯中心，gp8 又把高斯投影到新相机。代码 depth2pc 里的每一行都是针孔模型的直接翻译。不熟悉内参 K、外参 [R|t] 和 world-to-camera 的约定，就看不懂为什么旋转图没乘外参是个问题（gp7）。"}, {"k": "concept-g-epipolar", "gloss": "gp2 的立体校正把两台相机旋转到共面、行对齐，使对应点只在水平方向错开，相关搜索由此从 2D 降到 1D（gp4）。需要理解极线、本质矩阵，以及 OpenCV stereoRectify 输出的 R1、R2、P1、P2 各是什么。"}, {"k": "concept-g-depth", "gloss": "视差与深度的关系 Z = fB/d 贯穿 gp4–gp6。代码里名为 depth 的量其实是逆深度 1/Z，它正比于视差；理解逆深度，才能读懂 flow2depth 和合成数据里 z-buffer 的存法。基线 B 越大，同一深度下的视差越大、遮挡越多，这决定了相机夹角的上限。"}, {"k": "concept-d-stereo", "gloss": "本文的几何完全来自双目立体匹配：相关（匹配代价）、代价聚合、视差回归。先理解传统的 SGM 和学习式的代价体方法，再看 gp4、gp5 为什么只用 1D 相关加 3 次迭代就够。"}, {"k": "concept-d-flow", "gloss": "RAFT-Stereo 源自光流网络 RAFT：全对相关体、查表、循环更新都是光流里的概念。代码里视差变量就叫 flow，flow_pred 是“左图像素到右图对应点的水平位移”，并不是真正的深度。"}, {"k": "concept-l-iterative", "gloss": "gp5 的 ConvGRU 每一步查询相关体、预测视差增量，是典型的学习式迭代细化。理解迭代次数与精度、速度的关系，才能判断 T=3（原版 RAFT-Stereo 训练 16–22 次、测试 32 次）意味着什么，以及为什么损失要对每次迭代的输出都加权监督（gp9）。"}, {"k": "concept-n-3dgs", "gloss": "本文输出的是标准 3DGS 表示：位置、旋转四元数、三轴尺度、不透明度、颜色，并调用原版光栅器渲染。要知道协方差 Σ = RSS^TR^T 如何由旋转和尺度构成，以及光栅器如何按深度排序、做 alpha 合成（gp7、gp8）。"}, {"k": "concept-r-alpha", "gloss": "两个视角的高斯合并后一次渲染，前后遮挡由 alpha 合成决定。理解 over 算子和透射率，才能明白两层互相交错的“薄壳”为什么会闪烁（Z-fighting），以及不透明度图在其中起什么作用。"}, {"k": "concept-l-cnn", "gloss": "图像编码器、深度编码器和参数回归解码器都是带残差块和跳连的 U-Net 式 CNN（gp3、gp7），归一化用的是 GroupNorm。要能从代码推出每一级的分辨率和通道数，比如 1024→512→256→128，以及 32/48/96 通道。"}, {"k": "concept-n-generalizable", "gloss": "本文属于“可泛化、前馈”的新视角合成：只训练一次，就能用于没见过的人物，推理时不做任何优化。要把它和逐场景优化的 NeRF/3DGS 区分开，也要把它和 ENeRF、IBRNet 这类每个视点都要推理的可泛化方法区分开。"}, {"k": "concept-g-rig", "gloss": "方法的前提是一圈已标定、已同步的相机，并从中选出相邻的两台组成双目。阵列半径、相机数量、夹角和同步精度，直接决定能否做校正和匹配（gp1、gp11）。"}, {"k": "concept-v-metrics", "gloss": "论文只报告 PSNR、SSIM、LPIPS 和视差 EPE。要能把 dB 差换算成 MSE 比例，并意识到在大片黑背景的整幅图上算 PSNR 会抬高数值，才能正确读 Table 1 和 Table 3（gp12）。"}]}, {"b": "sec", "h": "GP1 · 问题设定：环形相机阵列拍人物，每个新视点只用最近的两台相机", "id": "walk-gpsgaussian-gp1", "sn": {"label": "论文位置", "t": "论文引言与方法概览；方法部分“视角选择与深度估计”（点积选最近两视角）；实验设置（8 台相机、相邻约 45°、两张 1024×1024 源图）；补充材料的实时演示（前方 6 台）；代码 prepare_data/render_data.py（16 台、半径 2.0 m）、test_real_data.py（--src_view 手动指定）"}}, {"b": "p", "t": "输入：N 台围成一圈、已标定且同步的 RGB 相机在某一时刻的图像（论文 N=8），每张图的前景 mask，内外参 {K_i, R_i, t_i}，以及目标视点的位姿。输出：目标视点下只含人物、背景为黑色的 RGB 图像，分辨率 2048×2048。帧与帧之间不保留任何状态。", "label": "这一步做什么", "mn": {"label": "需要的基础", "links": [{"k": "concept-g-rig"}, {"k": "concept-g-pinhole"}, {"k": "concept-d-stereo"}, {"k": "concept-n-generalizable"}, {"k": "adv-a-human-capture"}, {"k": "adv-a-telepresence-sys"}]}}, {"b": "p", "t": "先把游戏规则说清楚。相机固定成一圈，所有相机标定一次（g-rig、g-pinhole），人物站在中间。每一帧、对每一个目标视点，方法只挑两台相机来用：把每台输入相机的中心相对场景中心 O 的向量（V=C−O）与目标视点的同类向量做点积，取最接近的两台，分别叫作左视角 l 和右视角 r。作者称之为双目“工作组”（working set）。之后的所有处理都只看这两张 1024×1024 的图，其余相机这一帧不参与。\n\n为什么只用两台？因为作者想直接借用成熟、快速的双目立体匹配（d-stereo）来拿到深度，而双目天然就是两张图。相邻相机的画面重叠很大，新视点又夹在它们之间，这两张图基本覆盖了新视点能看到的人体表面。代价同样由此而来：相机之间的夹角必须够小，否则匹配不上；两台相机都看不到的地方（比如手臂内侧），新视点也看不到。\n\n论文的实验设定是 8 台相机、相邻约 45°。公开代码的数据生成脚本用的却是 16 台、相邻 22.5°；README 写明发布的训练数据是 16 相机版本，issue 中的用户认为发布的权重同样如此（作者答复未能读取）。按代码的相机布置（到注视点 2 m、俯仰 −8°，水平半径约 1.98 m）推算，45° 对应的基线约 1.52 m，22.5° 约 0.77 m，相差一倍。这对立体匹配的难度影响很大（见 gp12 的复现问题）。另外，公开代码并没有实现“点积选视角”，推理脚本要手动用 --src_view 指定两台相机，新视点则用参数 ratio 在两者之间插值。\n\n最后记住两个隐含前提。第一，只处理前景人物，每帧都需要前景 mask：论文把准确抠像列为必要的预处理，mask 之外不会生成任何高斯。第二，这是逐帧的“静态重建”，视频只是一帧帧独立处理，没有时间建模（v-temporal）。", "mn": {"label": "类比", "t": "像一圈摄影师围着模特拍照。你想要某个角度的照片时，只去找站在那个角度左右两边的两位摄影师，拿他们的照片来拼，其他摄影师这一次不参与。"}}, {"b": "eqs", "eqs": [{"tex": "(l, r) = \\operatorname{top2}_{i\\in\\{1..N\\}}\\;\\langle \\mathbf{v}_i, \\mathbf{v}_{\\text{nov}} \\rangle", "explain_zh": "视角选择。v_i = C_i − O 是第 i 台输入相机中心相对场景中心 O 的向量，v_nov = C_nov − O 是新视点的对应向量（论文记作 V_n、V_tar），⟨·,·⟩ 是点积（方向越一致，值越大），top2 取值最大的两台。论文用文字描述了这条规则，公开代码没有实现，推理时由用户手动指定。"}, {"tex": "B = 2R\\sin\\frac{\\theta}{2}", "explain_zh": "环形阵列相邻相机之间的基线长度。R 是阵列半径，θ 是相邻相机的夹角，B 是两台相机光心之间的距离。代码中相机到注视点 2 m、俯仰 −8°，水平半径 R≈1.98 m，θ=45° 对应 B≈1.52 m，θ=22.5° 对应 B≈0.77 m（按公式推算，论文没有直接给出基线）。"}, {"tex": "\\lambda\\,[u, v, 1]^{\\top} = \\mathbf{K}_i\\,(\\mathbf{R}_i\\mathbf{X} + \\mathbf{t}_i)", "explain_zh": "针孔投影。X 是世界坐标下的 3D 点；R_i、t_i 是第 i 台相机的 world-to-camera 外参（代码里的 extr 就是 3×4 的 [R|t]）；K_i 是 3×3 内参；λ 是点在该相机坐标系下的深度 Z；(u,v) 是像素坐标。后面的反投影、渲染都建立在这个式子上。"}]}, {"b": "p", "t": "论文：8 台相机，相邻约 45°，源图 1024×1024，输出 2048×2048；真实数据 4 个人物，另有 8 台相机提供真值视角；实时演示接入前方 6 台（补充材料）。代码（render_data.py:213-216）：cam_nums=16，scene_radius=2.0，res=(1024,1024)，fx=fy=0.8×1024=819.2 px（:157-158）。按代码参数推算：垂直视场约 64°，2 m 处一个像素约宽 2.4 mm。", "label": "具体数字"}, {"b": "p", "t": "用两视角而不是全部视角，是为了直接套用双目立体匹配：计算量固定，而且与相机总数无关。论文没有讨论三视角以上的融合。只处理前景，是因为人物是远程临场的主体；训练用的合成扫描也只有人物、没有背景。作者没有采用的方案有：逐人物优化（太慢）、在全部视角上建代价体（更慢，也不是双目结构）、人体参数化模板（泛化到宽松衣服和头发时受限，这一点是合理的解读）。", "label": "为什么这样设计"}, {"b": "p", "t": "（1）“稀疏视角”在这里指一圈 8 台、相邻约 45°，并不是 pixelSplat 那种任意两张图。夹角一大，这个方法就失效（EVA-Gaussian 把阈值概括为约 60°）。（2）论文与公开代码的相机数不同（8 对 16），读代码时别把 22.5° 当成论文设定。（3）新视点只能在两台相机之间内插：代码只支持 ratio∈[0,1] 的插值，没有外推评测。（4）没有 mask 就没有结果，抠像误差会直接变成缺块或飞点。", "label": "容易误解的地方"}, {"b": "qa", "items": [{"q": "如果把 8 台相机减到 4 台（相邻 90°），这个方法最先在哪一步出问题？为什么？", "a": "最先出问题的是立体匹配（gp4、gp5）。夹角 90° 时基线约 2.8 m（R=2 m），同一身体部位在两张图里外观差异大、遮挡多，校正后的图像也严重变形，1D 相关很难找到正确的对应点。深度一错，高斯的位置就错，后面的参数回归和渲染都救不回来。这正是 EVA-Gaussian、Tele-Aloha 这些后续工作要解决的“宽基线”问题。"}]}, {"b": "sec", "h": "GP2 · 立体校正：用 cv2.stereoRectify 把两台相机转成行对齐的双目，并得到 Tf_x = −fB", "id": "walk-gpsgaussian-gp2", "sn": {"label": "论文位置", "t": "论文方法部分“视角选择与深度估计”（校正后的双目，视差只沿水平线）；代码 lib/human_loader.py get_rectified_stereo_data（:245-317）、stereo_pts2flow（:64-85）、save_local_stereo_data（:131-163）"}}, {"b": "p", "t": "输入：两张 1024×1024 的源图与 mask，以及它们的内参 K0、K1 和外参 E0、E1。输出：校正后的两张图与 mask（仍为 1024×1024），新内参 K'_0、K'_1（主点可以不同），新外参 R_rect·E，标量 Tf_x = P1[0,3]；训练时还输出由深度真值换算来的水平位移真值 flow 与有效掩码 valid。", "label": "这一步做什么", "mn": {"label": "需要的基础", "links": [{"k": "concept-g-epipolar"}, {"k": "concept-g-pinhole"}, {"k": "concept-d-stereo"}, {"k": "concept-f-image"}, {"k": "concept-g-rig"}]}}, {"b": "p", "t": "两台相邻相机一般既不平行也不等高：它们都朝向圆心，彼此有一个夹角。立体校正（rectification，g-epipolar）的作用，是分别给两台相机套上一个虚拟旋转，把两个像平面转到同一个平面上，并让极线变成水平线。校正之后，左图第 v 行上的点，在右图里一定出现在同一行 v 上，只是水平位置差了一个视差 d。二维搜索由此变成一维搜索，这是整个深度模块能做得又小又快的前提。\n\n代码先由两个外参算出相对位姿 (R, T)，调用 cv2.stereoRectify 得到两台相机的校正旋转 R0、R1 和新投影矩阵 P0、P1，再用 initUndistortRectifyMap 与 remap 把图像和 mask 双线性重采样到新的像平面（f-image）。这里的 flags=0 表示允许两台相机的主点 c_x 不同，好处是图像内容不会被大幅平移出画面，代价是对应关系里多了一个常数偏移 c_x1 − c_x0。所以代码里的 flow 并不等于视差，而是“偏移减视差”。P1[0,3] 在 OpenCV 里等于 −f·B，代码叫它 Tf_x，后面换算深度全靠它。\n\n训练时，同样的校正也作用在深度真值上：先把真值深度（其实是逆深度）反投影成点，再投影到校正后的相机，得到校正坐标系下的逆深度，乘上 −Tf_x 就是真值视差，由此算出真值 flow。背景（逆深度 < 0.05，即 Z > 20）置 0，mask 做 3×3 腐蚀后再按 0.66 取阈值，作为 valid。README 提醒，第一次训练会把这些结果离线存到 rectified_local，要花数小时。推理时则每帧在 CPU 上用 OpenCV 重算一遍。对固定阵列来说，这其实可以只算一次映射表。", "mn": {"label": "类比", "t": "像把两张斜着拍的照片摆正、对齐，让两张照片里的同一条横线高度一致。之后找对应点时，只需要沿着这条横线左右滑动。"}}, {"b": "eqs", "eqs": [{"tex": "\\mathbf{H}_i = \\mathbf{K}'_i\\,\\mathbf{R}^{\\text{rect}}_i\\,\\mathbf{K}_i^{-1},\\qquad i\\in\\{0,1\\}", "explain_zh": "校正对每张图做的是一个单应变换。K_i 是原内参；R^rect_i 是 stereoRectify 给出的校正旋转（代码中的 R0、R1）；K'_i 是新内参（P_i 的左上 3×3）；H_i 把原图像素映射到校正图像素。代码用 initUndistortRectifyMap 预先生成它的逆映射表，再用 remap 双线性采样。"}, {"tex": "x_1 = x_0 + (c'_{x1} - c'_{x0}) - \\frac{f'B}{Z}", "explain_zh": "校正后的对应关系（按代码推导）。x_0、x_1 是同一个 3D 点在左、右校正图里的横坐标；c'_{x0}、c'_{x1} 是两张图的新主点横坐标（flags=0 时可以不同）；f' 是校正后的焦距；B 是基线；Z 是深度。代码中 flow = x_1 − x_0 = offset − disparity，其中 offset = c'_{x1} − c'_{x0}，disparity = f'B/Z。"}, {"tex": "T_{f_x} \\equiv \\mathbf{P}_1[0,3] = -f'B,\\qquad \\frac{1}{Z} = -\\frac{d}{T_{f_x}}", "explain_zh": "OpenCV 把右相机投影矩阵的平移项写成 −f'·B。代码的 flow2depth 用 −disparity/Tf_x 直接得到逆深度 1/Z。对右视角，代码把 Tf_x 取反，并交换两张图的主点，这样同一个公式对两个方向都成立。"}]}, {"b": "p", "t": "图像 1024×1024（src_res，stage yaml）；畸变系数取 0（dist0=dist1=zeros(4)）；背景阈值为逆深度 < 0.05（Z > 20，按合成数据单位）；valid 由 3×3 腐蚀加 0.66 阈值得到。预处理要花数小时，加上原始数据约需 50 GB 空间（README:44、48）。按代码参数，相邻 22.5° 的相机基线约 0.77 m（推算）。", "label": "具体数字"}, {"b": "p", "t": "校正把匹配从 2D 搜索降为 1D，相关体从 H×W×H×W 降为 H×W×W，这是能做到实时的关键（论文强调，校正后每个像素的位移被限制在水平线上）。选 OpenCV 的标准校正而不是网络学出来的对齐，是因为相机已经标定，几何上精确，而且不花训练成本。没有采用的方案：不校正、直接做 2D 光流式匹配（RAFT 那样，搜索空间和误差都更大）；平面扫描代价体（适合多视角，但要为每个深度假设 warp 一次，这是合理的推断）。", "label": "为什么这样设计"}, {"b": "p", "t": "（1）flow 不等于视差：flags=0 时还要减去主点差 offset。自己改成 CALIB_ZERO_DISPARITY 时，数据预处理和 flow2depth 必须一起改。（2）校正后的外参 R_rect·E 仍然是世界坐标系下的相机位姿，反投影出的点在世界系里，可以直接合并两视角。（3）夹角越大，校正旋转越大，校正图的边缘拉伸越严重，有效分辨率下降；代码只处理水平视差，两台相机若主要在竖直方向错开，OpenCV 会做竖直方向的校正，现有代码不支持（issue #21 有用户问及）。（4）测试脚本每帧都在 CPU 上重算校正，这部分时间不在论文的 27 ms 里。", "label": "容易误解的地方"}, {"b": "qa", "items": [{"q": "为什么说立体校正是“把二维问题变成一维问题”？如果不做校正，相关体的尺寸会变成多少（以 1/8 分辨率 128×128 为例）？", "a": "校正后，同一个 3D 点在两张图里位于同一行，只需沿这一行搜索对应点，所以每个像素只有 W=128 个候选，相关体为 128×128×128，约 210 万个元素。不校正时，对应点可能在另一张图的任意位置，每个像素要与 128×128 个位置比较，相关体为 128⁴，约 2.7 亿个元素，大 128 倍。RAFT 光流就是这种 4D 全对相关，它靠查表和多级池化来控制开销。"}]}, {"b": "sec", "h": "GP3 · 共享图像编码器：两视角一起编码，得到 1/2、1/4、1/8 三级特征（32/48/96 通道）", "id": "walk-gpsgaussian-gp3", "sn": {"label": "论文位置", "t": "论文方法部分（图像编码器与 RAFT-Stereo 特征编码器结构相似，1/2、1/4、1/8 分辨率，32、48、96 通道）；代码 core/extractor.py UnetExtractor（:63-91）、lib/network.py forward（:25-33）、config/stage2.yaml encoder_dims"}}, {"b": "p", "t": "输入：校正后的左右图，沿 batch 维拼成 2B×3×1024×1024（像素先归一化到 [−1,1] 再乘 mask，背景为 0）。输出：三级特征 F1 (2B×32×512×512)、F2 (2B×48×256×256)、F3 (2B×96×128×128)。F3 供深度模块使用（gp4），三级特征都作为跳连送进参数回归解码器（gp7）。", "label": "这一步做什么", "mn": {"label": "需要的基础", "links": [{"k": "concept-l-cnn"}, {"k": "concept-f-image"}, {"k": "concept-d-stereo"}, {"k": "adv-a-learned-stereo"}]}}, {"b": "p", "t": "编码器是一个很小的残差 CNN（l-cnn）。先用一个 5×5、步长 2 的卷积把分辨率降到 512，输出 32 通道；再接三组残差块：第一组保持 512 分辨率，第二组、第三组各做一次步长 2 的下采样，分别得到 256 分辨率 48 通道和 128 分辨率 96 通道。每个残差块由两层 3×3 卷积、GroupNorm 和 ReLU 组成。三级输出就是一个小型的特征金字塔（f-image）。\n\n这里有两处“共享”。第一，左右两张图共用同一组权重：它们沿 batch 维拼在一起，只跑一次前向，这是双目网络的标准做法，保证同一个表面在两张图里被编码成相似的特征，后面的点积相关才有意义。第二，同一次编码既服务深度估计，又服务高斯参数回归。深度模块只取 1/8 那一级；参数回归则把三级特征都当作 U-Net 的跳连。在实时系统里，这样可以省掉一次完整的特征提取。\n\n有一个细节值得注意：输入图已经乘过 mask，背景像素是 0，对应 [−1,1] 中间的灰色，而不是黑色。网络看到的是“人物加灰色背景”，所以背景上不会产生有意义的匹配；反正背景最后也不生成高斯（gp6）。代码配置文件里的默认 encoder_dims 是 [64,96,128]，但 stage1.yaml 和 stage2.yaml 都覆盖成了 [32,48,96]，论文报告的也是后者。读代码时以 yaml 为准。", "mn": {"label": "类比", "t": "像两位速记员用同一套速记符号，分别给左右两张照片写下“粗、中、细”三份摘要。后面比对两张照片时，就比对速记，不必比对原图。"}}, {"b": "eqs", "eqs": [{"tex": "\\mathbf{F}^{(s)} = \\mathcal{E}_{\\text{img}}^{(s)}(\\mathbf{I}),\\quad \\mathbf{F}^{(s)}\\in\\mathbb{R}^{C_s\\times\\frac{H}{s}\\times\\frac{W}{s}},\\quad (s, C_s)\\in\\{(2,32),(4,48),(8,96)\\}", "explain_zh": "编码器的三级输出。I 是一张 3×H×W 的校正图（H=W=1024）；s 是下采样倍数；C_s 是该级通道数；ℰ_img 的左右两视角共享权重。"}, {"tex": "\\mathbf{y} = \\operatorname{ReLU}\\!\\Big(\\mathcal{D}(\\mathbf{x}) + \\operatorname{ReLU}\\big(\\operatorname{GN}(\\operatorname{Conv}_{3\\times3}(\\operatorname{ReLU}(\\operatorname{GN}(\\operatorname{Conv}_{3\\times3}(\\mathbf{x})))))\\big)\\Big)", "explain_zh": "按代码改写的残差块（core/extractor.py ResidualBlock）。x 是输入，GN 是 GroupNorm（组数为通道数除以 8），𝒟 是捷径分支：通道数或步长改变时为 1×1 卷积加 GN，否则为恒等映射。"}]}, {"b": "p", "t": "输入 2B×3×1024×1024（训练时 B=2，所以是 4 张；推理时 B=1）。输出 (2B,32,512,512)、(2B,48,256,256)、(2B,96,128,128)，已在 CPU 上实例化代码核对。编码器参数 414,384 个。第一层是 5×5 卷积、步长 2，接 GroupNorm(8 组)；stage2 下编码器在 autocast 中运行（mixed_precision=True）。", "label": "具体数字"}, {"b": "p", "t": "论文说编码器沿用了 RAFT-Stereo 特征编码器的结构。输出三级而不是只输出 1/8，是为了给参数回归提供高分辨率细节（发丝、衣褶）；深度模块只在 1/8 上做匹配，以控制相关体的大小。共享编码器是为了实时。没有采用的方案：两个模块各用一个独立编码器（更慢）；预训练的大骨干，比如 ResNet 或 ViT（参数多、速度慢；这是合理的解读，论文没有讨论）。", "label": "为什么这样设计"}, {"b": "p", "t": "（1）config/stereo_human_config.py 里的默认值 [64,96,128] 会被 yaml 覆盖，实际是 [32,48,96]。（2）左右两图沿 batch 维拼接，所以 batch 维大小是 2B，而不是 B。之后 split 时，前 B 个是左视角、后 B 个是右视角。（3）背景像素在 [−1,1] 空间里是 0（灰色）；最终渲染时背景是黑色（bg_color=[0,0,0]），两者是两回事。", "label": "容易误解的地方"}, {"b": "qa", "items": [{"q": "为什么左右两张图必须共享编码器权重，而不是各用一个编码器？", "a": "后面的相关体是用左右特征的点积来衡量“是不是同一个点”。只有两张图被同一个函数映射到同一个特征空间，同一表面点的特征才会相近，点积才会大。各用一个编码器时，两套特征空间可以任意旋转或缩放，点积就失去了意义。此外，共享权重让左右两个方向的匹配是对称的，也把参数量减半。"}]}, {"b": "sec", "h": "GP4 · 双向 1D 相关体：1/8 分辨率上每个像素 128 个水平候选，建 4 级金字塔", "id": "walk-gpsgaussian-gp4", "sn": {"label": "论文位置", "t": "论文方法部分“视角选择与深度估计”（相关体构建）；代码 core/raft_stereo_human.py forward（:26-51）、core/extractor.py MultiBasicEncoder（:94-117）、core/corr.py CorrBlock1D / CorrBlockFast1D（:110-156、:31-61）、config/stereo_human_config.py（corr_levels=4、corr_radius=4）"}}, {"b": "p", "t": "输入：1/8 特征 F3（2B×96×128×128）。输出：左→右、右→左两个方向的相关金字塔，每个方向每个像素在第 0 级有 128 个候选，之后依次为 64、32、16 个；另有 context 特征（2B×96×128×128）和 GRU 初始隐状态（2B×96×128×128）。", "label": "这一步做什么", "mn": {"label": "需要的基础", "links": [{"k": "concept-d-stereo"}, {"k": "concept-d-flow"}, {"k": "concept-f-linalg"}, {"k": "concept-g-epipolar"}, {"k": "adv-a-learned-stereo"}]}}, {"b": "p", "t": "F3 先经过一个残差块和一个 3×3 卷积，投到 192 通道，得到用于匹配的特征，再按 batch 拆成左 fmap1 和右 fmap2。另有两个分支（各为一个残差块加 3×3 卷积），各输出一组 96 通道特征：一组经 tanh 作为 GRU 的初始隐状态，一组经 ReLU 作为 context，在每次迭代中都会用到（gp5）。这与 RAFT-Stereo 的“特征网络加上下文网络”相同，只是这里两者共享同一个骨干。\n\n相关体（correlation volume）是学习式立体匹配的核心（d-stereo、a-learned-stereo）。对左图第 v 行的每个像素 u，拿它的 192 维特征去和右图同一行的全部 128 个像素逐一做点积，再除以 √192，得到 128 个匹配分数。分数越高，越可能是同一个点。所有行、所有像素一起算，就是一个 128×128×128 的张量，由一次 einsum 完成，没有任何视差范围假设：整行都在搜索范围内。\n\n“双向”是本文代码的一个小巧思。它把 (fmap1, fmap2) 和 (fmap2, fmap1) 沿 batch 维拼接后一起送入相关模块，于是一次前向同时得到“左图每个像素在右图的对应点”和“右图每个像素在左图的对应点”两套结果。两个视角都得到深度，才都能生成高斯；如果只有左视角有深度，右视角的像素就用不上了。\n\n接着沿候选维做 4 级平均池化，得到 128、64、32、16 个候选的金字塔。迭代时按当前的位移估计，在每一级上取以它为中心、半径 4 的 9 个值（线性插值），4 级共 36 个数。这样既能看到细粒度的局部匹配（第 0 级），又能看到很远的粗粒度信息（第 3 级每一格覆盖 8 个原候选）。", "mn": {"label": "类比", "t": "像拿着左图里一小块花纹，沿着右图同一条横线逐格比对，记下每一格有多像，得到一条“相似度曲线”。再把这条曲线分别按 1、2、4、8 格一组求平均，得到从细到粗的四条曲线，方便后面先粗后细地找峰值。"}}, {"b": "eqs", "eqs": [{"tex": "\\mathbf{C}(v, u, u') = \\frac{1}{\\sqrt{D}}\\,\\big\\langle \\mathbf{f}_l(v,u),\\ \\mathbf{f}_r(v,u') \\big\\rangle,\\qquad u,u'\\in\\{0..W_8-1\\}", "explain_zh": "1D 全对相关。f_l、f_r 是左、右图的匹配特征（D=192 维）；v 是行号；u 是左图列号；u' 是右图列号；W_8=128 是 1/8 分辨率下的宽度。代码用 einsum('aijk,aijh->ajkh') 一次算完，右→左方向交换 f_l 与 f_r 即可。"}, {"tex": "\\mathbf{C}^{(k)}(v,u,u') = \\frac{1}{2^k}\\sum_{j=0}^{2^k-1}\\mathbf{C}(v,u,2^k u' + j),\\qquad k=0,1,2,3", "explain_zh": "相关金字塔：沿右图列维做 2^k 倍平均池化，得到 128/2^k 个候选。代码的 CorrBlock1D 其实建了 5 级，但只查前 4 级（corr_levels=4）。"}, {"tex": "\\mathbf{c}_{\\text{look}}(v,u) = \\Big[\\mathbf{C}^{(k)}\\big(v,u,\\ \\tfrac{x(v,u)}{2^k} + \\delta\\big)\\Big]_{k=0..3,\\ \\delta=-4..4}\\in\\mathbb{R}^{36}", "explain_zh": "查表。x(v,u) 是左像素 (v,u) 当前估计的对应点横坐标（1/8 分辨率）；δ 取 −4 到 4 共 9 个偏移（corr_radius=4）；非整数位置用线性插值。4 级×9 个=36 个相关值，作为 gp5 中 motion encoder 的输入。"}]}, {"b": "p", "t": "匹配特征 192 通道（encoder_dim[2]×2）；fmap1、fmap2 各 B×192×128×128；context 与隐状态各 2B×96×128×128。相关体第 0 级：2B·128·128 个像素×128 个候选（B=1 时为 32768×128，已在 CPU 上核对）；金字塔 128/64/32/16（代码多建了第 5 级 8，但不使用）。查表结果 2B×36×128×128。可选的 reg_cuda 是 RAFT-Stereo 的 CUDA 相关采样器，README 说它更快、不影响精度。", "label": "具体数字"}, {"b": "p", "t": "全对相关加金字塔查表（沿用 RAFT/RAFT-Stereo，d-flow）不需要预设视差范围，而且一次建好、多次查询，迭代时只做 O(36) 的查表，适合配合迭代更新。相比之下，3D 代价体加 3D 卷积（PSMNet、GC-Net 式）要对每个视差候选做 3D 卷积，太慢（合理的解读，论文没有对比）。双向相关让两个视角都有深度，覆盖更多表面。代价是相关体的显存随 W² 增长，所以只能在 1/8 分辨率上做。", "label": "为什么这样设计"}, {"b": "p", "t": "（1）“相关体”存的是点积分数，不是深度，也不是概率；把它变成视差要靠后面的 GRU。（2）1/8 分辨率上 1 格等于原图 8 个像素，第 0 级半径 4 只覆盖原图 ±32 像素。真实位移更大时，要靠第 3 级（每格 64 个原图像素）的粗信息把估计拉过去，而本文只迭代 3 次，初值又是 0，大位移是否来得及收敛是一个隐患（合理的推断）。（3）代码里的“flow”带主点偏移，不是纯视差（见 gp2）。", "label": "容易误解的地方"}, {"b": "qa", "items": [{"q": "在 1/8 分辨率下，第 3 级金字塔的一格对应原图多少像素的视差？半径 4 的查询窗口一共能“看到”原图多大的视差范围？", "a": "第 3 级做了 2³=8 倍池化，一格对应 1/8 分辨率下的 8 格，也就是原图 8×8=64 个像素。半径 4 共 9 格，覆盖 ±4 格，即原图 ±256 像素。第 0 级则只覆盖原图 ±32 像素。所以粗级负责“把估计拉到大致正确的位置”，细级负责精确定位。"}]}, {"b": "sec", "h": "GP5 · 迭代视差更新：单层 ConvGRU 只跑 T=3 次，再用凸组合上采样 8 倍", "id": "walk-gpsgaussian-gp5", "sn": {"label": "论文位置", "t": "论文方法部分“视角选择与深度估计”（迭代深度估计，T=3 为性能与代价的折中）；代码 core/raft_stereo_human.py FlowUpdateModule（:54-127）、core/update.py BasicMotionEncoder / ConvGRU / BasicMultiUpdateBlock（:16-138）、config/stage1.yaml 与 stage2.yaml（train_iters=val_iters=3）"}}, {"b": "p", "t": "输入：36 通道相关查表结果、当前位移场（1/8 分辨率，2 通道，只用 x 分量）、GRU 隐状态 h（2B×96×128×128）、context 特征。输出：每次迭代的位移增量，以及用凸组合上采样得到的全分辨率位移 2B×1×1024×1024。训练时输出 3 次迭代的结果（用于加权损失），推理时只上采样最后一次。", "label": "这一步做什么", "mn": {"label": "需要的基础", "links": [{"k": "concept-l-iterative"}, {"k": "concept-d-flow"}, {"k": "concept-l-cnn"}, {"k": "concept-f-image"}, {"k": "adv-a-learned-stereo"}]}}, {"b": "p", "t": "这一步是 RAFT 系列的招牌做法（l-iterative、a-learned-stereo）：不在相关体上一次性回归视差，而是从 0 开始反复修正。每次迭代做四件事。第一，按当前估计去相关金字塔里查 36 个匹配分数（gp4）。第二，motion encoder 把这 36 个分数和当前位移分别卷积、拼接，编码成 128 通道的运动特征。第三，一个 3×3 卷积的 GRU 用运动特征和 context 更新隐状态 h。GRU 的门控让网络自己决定“保留多少旧判断、吸收多少新证据”。第四，一个两层卷积的 FlowHead 从 h 预测位移增量，只保留水平分量（垂直分量强制置 0，因为校正后对应点在同一行），加到当前估计上。\n\n本文把 RAFT-Stereo 削减得很狠：只在 1/8 分辨率上用一层 GRU（原版是 1/4 分辨率、三层多尺度 GRU），隐状态 96 通道（原版 128），只迭代 3 次（原版训练 16–22 次、测试 32 次，连它最快的 realtime 配置也要 7 次）。论文给出的理由是“性能与代价的权衡”。人物前景、背景干净、相邻视角的外观变化有规律，这些都让匹配比通用场景容易，少迭代几次仍然可用（这是合理的解读）；不过论文没有给出不同 T 的定量对比。\n\n最后是凸组合上采样。1/8 分辨率的一个像素对应原图 8×8 个像素，直接双线性放大，会把人物轮廓处的视差“抹”到背景上。RAFT 的做法是让网络为每个高分辨率像素预测 9 个权重（经 softmax），对低分辨率 3×3 邻域的位移（乘 8 换成原图单位）做加权平均。权重由网络学出来，轮廓处可以只取同一侧的邻居，从而保持边缘锐利。mask 头输出 8²×9=576 个通道，乘 0.25 是为了平衡梯度（代码注释）。", "mn": {"label": "类比", "t": "像蒙着眼猜一个数：每次先看看提示（查相关体），在心里更新一下判断（GRU），报出一个修正量（FlowHead）。原版 RAFT-Stereo 允许猜 32 次，本文为了赶时间只让猜 3 次，好在题目比较简单。"}}, {"b": "eqs", "eqs": [{"tex": "\\mathbf{z}=\\sigma\\big(\\operatorname{Conv}([\\mathbf{h},\\mathbf{x}])+\\mathbf{c}_z\\big),\\ \\ \\mathbf{r}=\\sigma\\big(\\operatorname{Conv}([\\mathbf{h},\\mathbf{x}])+\\mathbf{c}_r\\big),\\ \\ \\mathbf{q}=\\tanh\\big(\\operatorname{Conv}([\\mathbf{r}\\odot\\mathbf{h},\\mathbf{x}])+\\mathbf{c}_q\\big),\\ \\ \\mathbf{h}\\leftarrow(1-\\mathbf{z})\\odot\\mathbf{h}+\\mathbf{z}\\odot\\mathbf{q}", "explain_zh": "ConvGRU（core/update.py:16-32）。h 是 96 通道隐状态；x 是 128 通道运动特征；c_z、c_r、c_q 是 context 特征经一次卷积预先算好的三个偏置（每个 96 通道，只算一次、每步复用）；σ 是 sigmoid；⊙ 是逐元素乘；Conv 都是 3×3 卷积。z 控制更新比例，r 控制读取多少旧状态。"}, {"tex": "\\Delta\\mathbf{f}^{t} = \\operatorname{FlowHead}(\\mathbf{h}^{t})\\odot[1,0]^{\\top},\\qquad \\mathbf{f}^{t+1}=\\mathbf{f}^{t}+\\Delta\\mathbf{f}^{t},\\qquad \\mathbf{f}^{0}=\\mathbf{0}", "explain_zh": "位移更新。f 是 1/8 分辨率下左像素到右图对应点的位移（2 通道，只用 x）；FlowHead 为 3×3 卷积 96→256、ReLU、3×3 卷积 256→2；⊙[1,0]^⊤ 表示把 y 分量置 0（代码 delta_flow[:,1]=0）；t=0,1,2。每次迭代前 coords1 都要 detach，梯度不跨迭代传播（沿用 RAFT）。"}, {"tex": "\\mathbf{f}_{\\uparrow}(8i+a,\\,8j+b)=\\sum_{k=1}^{9}\\operatorname{softmax}_k\\big(\\mathbf{m}_{i,j,a,b,k}\\big)\\cdot 8\\,\\mathbf{f}\\big(\\mathcal{N}_k(i,j)\\big)", "explain_zh": "凸组合上采样（upsample_flow）。(i,j) 是低分辨率像素，(a,b)∈{0..7}² 是它内部的高分辨率子像素，𝒩_k 是 (i,j) 的 3×3 邻域中的第 k 个位置，m 是 mask 头输出（576=64×9 通道，已乘 0.25），8f 把位移换算成原图像素单位。softmax 保证权重非负且和为 1，所以结果是邻域位移的凸组合。"}]}, {"b": "p", "t": "T=3（stage1、stage2 的 train_iters 与 val_iters 都是 3）。原版 RAFT-Stereo：默认 train_iters 16、valid_iters 32，README 推荐训练 22 次；realtime 配置 7 次、n_downsample 3、2 层 GRU。本文：n_downsample 3（1/8）、n_gru_layers 1、hidden 96。motion encoder：36→64→64（相关支路），2→64→64（7×7 位移支路），拼接后 128→126，再拼上位移得 128。深度模块（含特征头与 context 头）参数 3,480,832 个，占全网 5.14M 的约 68%；其中 gru16、gru32 共 995,904 个参数虽被实例化，但 n_gru_layers=1 时前向从不调用（core/update.py:105-106，已用前向钩子核对），实际参与计算的约 2.48M。issue #18 中用户在 RTX 3090 上测得 raft_stereo 这部分约 26.8 ms（用户实测）。", "label": "具体数字"}, {"b": "p", "t": "迭代更新比一次性回归更准，也更容易在精度和速度之间调节：迭代次数就是一个旋钮。作者把旋钮调到 3，是为了把深度模块压进实时预算。凸上采样保住了人物轮廓的锐利度，这对后面“按深度把像素抬成高斯”很关键：轮廓处的深度一旦被抹开，就会产生飞在前景与背景之间的高斯。没有采用的方案：3D 代价体加 soft-argmin 回归（慢）；双线性上采样（边缘糊）；更多迭代（慢）。", "label": "为什么这样设计"}, {"b": "p", "t": "（1）迭代次数少，意味着初始估计（0 位移）离真值越远，越可能收敛不到。按代码参数推算，22.5° 相机、2 m 距离下，校正后的位移可达数百像素（部分被主点偏移抵消），全靠粗级相关一次拉到位。夹角加大到 45°（论文设定），这个问题更严重（issue #14、#87 中有用户反映 8 视角训练效果差）。（2）只预测水平位移，前提是校正精确；标定误差会直接变成系统性的深度误差。（3）推理只上采样最后一次迭代，但训练对 3 次都做了上采样和损失，训练显存明显高于推理。", "label": "容易误解的地方"}, {"b": "qa", "items": [{"q": "如果把 T 从 3 改成 12，你预期深度精度（EPE）、速度和显存分别怎么变？为什么这篇论文不这么做？", "a": "EPE 通常会下降，尤其是大位移和细结构区域，因为每次迭代都能根据新的查表结果继续修正；耗时大约线性增加（每次迭代要查表、跑 GRU 和 FlowHead，1/8 分辨率上约 2B×128×128 个位置）；训练显存也随迭代数增加，因为每次输出都要上采样并参与损失。论文追求 25 FPS，深度模块只分到二十多毫秒，所以选了 3 次，并称之为性能与代价的折中。想验证这一点，可以直接改 yaml 里的 val_iters（练习 3）。"}]}, {"b": "sec", "h": "GP6 · 视差到深度再到位置图：代码里的 depth 其实是逆深度 1/Z，只有前景像素变成高斯中心", "id": "walk-gpsgaussian-gp6", "sn": {"label": "论文位置", "t": "论文方法部分“像素级高斯参数预测”（位置图由深度反投影得到）；代码 lib/utils.py flow2depth（:113-120）、depth2pc（:88-110）、lib/network.py flow2gsparms（:64-79）、prepare_data/taichi_three/geometry.py（:66-71，z-buffer 存 1/z）"}}, {"b": "p", "t": "输入：每个视角全分辨率的位移 flow（B×1×1024×1024），校正后的内参 K'、外参 E'，Tf_x，主点偏移，前景 mask。输出：逆深度图 D（B×1×1024×1024，背景为 0）；世界坐标位置图 X（B×1024²×3）；有效掩码 pts_valid（D≠0 的像素）。", "label": "这一步做什么", "mn": {"label": "需要的基础", "links": [{"k": "concept-g-depth"}, {"k": "concept-g-pinhole"}, {"k": "concept-d-stereo"}, {"k": "concept-i-warping"}, {"k": "adv-a-ff-3dgs"}]}}, {"b": "p", "t": "有了位移，就可以换算深度（g-depth）。先减去主点偏移，得到真正的视差 d；再用 Z = f'B/d 求深度。代码用的是等价写法 1/Z = −d/Tf_x，得到的是逆深度。有一点很容易让人困惑：代码里名为 depth 的变量全是逆深度。合成数据生成时 z-buffer 存的是 1/z（乘 2^15 后存成 16 位 png）；flow2depth 返回的是 −disparity/Tf_x；深度编码器的输入（gp7）也是逆深度；直到 depth2pc 里才用 Z = 1/depth 换回真实深度。逆深度正比于视差，数值范围紧凑，远处的点被压缩到接近 0，这对网络输入和匹配都更友好。\n\n然后按针孔模型反投影（g-pinhole）：像素中心 (u+0.5, v+0.5) 减去主点、乘上 Z/f，得到相机坐标系下的点，再用校正后外参的逆变换转到世界坐标系。两个视角各得到一张与图像等大的位置图，每个像素一个 3D 点。因为用的是校正后的外参（R_rect·E），而它描述的仍然是世界系下的位姿，所以两个视角的点天然落在同一个世界坐标系里，可以直接合并。\n\n最后乘前景 mask：背景像素的逆深度被置 0，pts_valid = (depth ≠ 0) 只保留前景像素。每个前景像素对应一个高斯中心，背景不生成任何东西。所以方法“看”不到背景，而人物轮廓处的 mask 精度，直接决定边缘会不会出现飞点或缺口。高斯位置完全由深度决定，没有额外的位置残差（后来的 GPS-Gaussian+ 才加入深度残差）。深度错一点，高斯就放错一点。", "mn": {"label": "类比", "t": "像拿着每张照片的“距离图”，把照片上每个人物像素都沿着自己的视线推到对应的距离上，变成空间里的一颗小珠子。背景像素没有距离，就不放珠子。"}}, {"b": "eqs", "eqs": [{"tex": "d = (c'_{x,\\text{ref}}-c'_{x}) - f_{\\text{low}},\\qquad \\rho \\equiv \\frac{1}{Z} = -\\frac{d}{T_{f_x}}\\cdot M", "explain_zh": "flow2depth。f_low 是网络预测的位移（代码中的 flow_pred）；c'_x、c'_{x,ref} 是本视角和另一视角的校正主点横坐标；d 是视差（像素）；T_{f_x} = −f'B；ρ 是逆深度；M 是二值前景 mask（mask 外 ρ=0）。"}, {"tex": "\\mathbf{X}(u,v) = \\mathbf{R}'^{\\top}\\!\\left(\\frac{1}{\\rho}\\begin{bmatrix}(u+0.5-c'_x)/f'_x\\\\ (v+0.5-c'_y)/f'_y\\\\ 1\\end{bmatrix} - \\mathbf{t}'\\right)", "explain_zh": "depth2pc 按代码改写成的反投影公式。(u,v) 是像素整数坐标，+0.5 取像素中心（代码用 linspace(0.5, S−0.5, S)）；f'_x、f'_y、c'_x、c'_y 是校正后内参；R'、t' 是校正后 world-to-camera 外参的旋转和平移；X 是世界坐标点，也就是这个像素对应的高斯中心 μ。"}, {"tex": "\\delta Z \\approx \\frac{Z^{2}}{f'B}\\,\\delta d", "explain_zh": "视差误差到深度误差的传播。δd 是视差误差（像素），δZ 是对应的深度误差。按代码参数（f'≈819 px 量级，B≈0.77 m，Z≈2 m）估算：1 像素视差误差约对应 6 mm 深度误差，是 2 m 处像素宽度（2.4 mm）的 2–3 倍（推算值，校正后的焦距会略有变化）。"}]}, {"b": "p", "t": "逆深度背景阈值：生成视差真值时 ρ<0.05 的像素置 0（human_loader.py:82-83）。位置图 B×1,048,576×3（每视角）。每个样本两视角合计至多 2,097,152 个候选高斯，实际只取前景像素（论文和代码都没有报告典型的前景比例）。数据里的 z-buffer 编码：png_value = ρ×2^15，按 16 位整数上限推算，最小可表示深度约 0.5 m（推算）。", "label": "具体数字"}, {"b": "p", "t": "位置由几何决定，而不是由网络自由回归，这是本文与“直接回归 3D 点”方法的根本区别：深度有真值监督、可解释，也不容易在新人物上漂移。只保留前景，是因为训练数据只有人物，而且背景对人像远程临场是次要的。用逆深度作为内部量，是沿用双目的自然参数化（ρ 与 d 成正比）。没有采用的方案：位置加可学习偏移（后续的 GPS-Gaussian+ 才加入深度残差）；为背景另建模型（本文完全不处理背景）。", "label": "为什么这样设计"}, {"b": "p", "t": "（1）变量名 depth 是逆深度，自己写可视化或换数据集时千万别当成米。（2）depth2pc 与 depth2pts 都用 S, S = depth.shape，假设图像是正方形；换成 16:9 的真实相机需要改代码。（3）反投影用的是校正后的内外参，而新视点插值（gp8）用的是原始内外参 intr_ori、extr_ori，两者都在同一世界坐标系下，不要混用成校正前的像素坐标。（4）mask 的轮廓若比真实人体大一圈，背景像素会被赋上前景的深度，变成挂在人体边缘的“毛边”高斯。", "label": "容易误解的地方"}, {"b": "qa", "items": [{"q": "两个视角都给同一个肩膀点估计了深度，左视角估计为 2.00 m，右视角估计为 2.01 m。合并后在新视角里会出现什么？这和 Ha et al. 批评的问题是什么关系？", "a": "同一块表面会变成两层相距约 1 cm 的高斯“薄壳”。渲染时，哪一层在前取决于深度误差：边缘处可能交替出现左视角和右视角的颜色（两张图曝光不同时就是色斑），视点移动时还会闪烁，这就是 Z-fighting。Ha et al. 反对“把所有视角的高斯合在一起一次渲染”，正是因为这个问题；他们改为逐视角分别渲染，再由网络决定每个像素信哪个视角。"}]}, {"b": "sec", "h": "GP7 · 高斯参数图：深度编码器加 U-Net 解码器，逐像素输出旋转（4）、尺度（3，≤0.01）、不透明度（1），颜色直接取源像素", "id": "walk-gpsgaussian-gp7", "sn": {"label": "论文位置", "t": "论文方法部分“像素级高斯参数预测”（参数图定义、深度编码器 ℰ_depth、Softplus/Sigmoid/归一化激活、Lambertian 假设下颜色取源图 RGB）；代码 lib/gs_parm_network.py GSRegresser（:7-81）、lib/GaussianRender.py（:18、:31）、config/stage2.yaml gsnet"}}, {"b": "p", "t": "输入：两视角源图 I（2B×3×1024×1024，[−1,1]）、逆深度 ρ（2B×1×1024×1024）、图像编码器的三级特征。输出：旋转图 2B×4×1024×1024（单位四元数）、尺度图 2B×3×1024×1024（每轴，≤0.01）、不透明度图 2B×1×1024×1024（0–1）。颜色图就是源图本身，从 [−1,1] 映射回 [0,1]。", "label": "这一步做什么", "mn": {"label": "需要的基础", "links": [{"k": "concept-n-3dgs"}, {"k": "concept-l-cnn"}, {"k": "concept-r-appearance"}, {"k": "concept-f-linalg"}, {"k": "adv-a-ff-3dgs"}, {"k": "adv-a-3dgs-ext"}]}}, {"b": "p", "t": "有了每个像素的 3D 位置，还缺高斯的形状和透明度。原版 3DGS（n-3dgs）靠对每个场景优化几千步得到这些参数；本文改为用网络一次前向预测（a-ff-3dgs）。关键在于把参数“铺”在源图像平面上：每个像素一组参数，于是一个 2D 卷积网络就能输出整张参数图，而且与图像特征逐像素对齐。\n\n网络结构是一个 U-Net（l-cnn）。深度编码器 ℰ_depth 和图像编码器同构，但输入是 1 通道逆深度，输出 1/2、1/4、1/8 三级深度特征。解码从 1/8 开始：把图像特征、深度特征和上一级的解码结果拼接，过两个残差块，然后双线性放大 2 倍；三级之后回到 1024×1024，再与原图 RGB 和逆深度拼接成 52 通道，经 3×3 卷积得到 32 通道的共享特征。三个小头各自输出一种参数，并用激活函数把数值约束在合法范围：旋转做 L2 归一化，成为单位四元数；尺度用陡峭的 Softplus（β=100）保证为正，再截断到不超过 0.01（场景单位约为米，即 1 cm）；不透明度用 Sigmoid 限制在 0–1。\n\n为什么要单独编码深度？消融给出了答案：去掉深度编码器后，EPE 几乎不变（1.496 对 1.494），渲染的 LPIPS 却从 0.121 恶化到 0.204。尺度和不透明度需要知道“这里的几何是否连续、离相机多远”：深度跳变处应该用小而透明的高斯，平坦处可以用大一些的高斯去填缝。\n\n颜色为什么不预测？论文的理由是人体近似 Lambertian（r-appearance），颜色不随视角变化，直接用源像素就能保留原图的全部高频细节。这也意味着同一表面点在左右两图里的颜色差异（曝光、白平衡、高光）会原样带进结果。最后看代码里的一个细节：旋转是按像素从图像和逆深度预测的，网络输入里没有相机位姿，输出却被直接当作世界坐标系下的旋转使用，没有乘相机外参的旋转（issue #89）。网络只能从图像内容里间接推断世界朝向。尺度上限约为 2 m 处 4 个像素的标准差（按代码参数推算），单个高斯能拉伸的范围有限。", "mn": {"label": "类比", "t": "像给每个像素发一张“小卡片”，写上这颗珠子的朝向、在三个方向上的胖瘦和透明程度。卡片由一个看过大量人体数据的“填表员”根据照片和距离图来填；颜色这一栏不用填，直接照抄照片上的颜色。"}}, {"b": "eqs", "eqs": [{"tex": "\\mathbf{q}=\\frac{\\hat{\\mathbf{q}}}{\\lVert\\hat{\\mathbf{q}}\\rVert_2},\\qquad \\mathbf{s}=\\min\\!\\Big(\\tfrac{1}{\\beta}\\log\\big(1+e^{\\beta\\hat{\\mathbf{s}}}\\big),\\ 0.01\\Big),\\ \\beta=100,\\qquad \\alpha=\\sigma(\\hat{o})", "explain_zh": "三个头的激活（gs_parm_network.py:34-50、:72-79）。q̂、ŝ、ô 是 1×1 卷积的原始输出，分别为 4、3、1 通道；q 是单位四元数（旋转）；s 是三轴尺度（标准差，场景单位）；β 是 Softplus 的陡度，β=100 时在 0 附近取 ln2/100≈0.0069；0.01 是硬上限；α 是不透明度，σ 为 sigmoid。"}, {"tex": "\\boldsymbol{\\Sigma}=\\mathbf{R}(\\mathbf{q})\\,\\mathbf{S}\\mathbf{S}^{\\top}\\mathbf{R}(\\mathbf{q})^{\\top},\\qquad \\mathbf{S}=\\operatorname{diag}(s_1,s_2,s_3)", "explain_zh": "3DGS 由旋转和尺度构成协方差。R(q) 是四元数对应的 3×3 旋转矩阵，S 是尺度对角阵，Σ 是 3D 协方差（由光栅器内部计算）。本文的 q 由看不到相机位姿的网络预测，却直接当作世界坐标系下的旋转使用（代码中没有乘 R'^⊤），见 pitfalls。"}, {"tex": "\\mathcal{G}_{v}=\\Big\\{\\big(\\boldsymbol{\\mu}=\\mathbf{X}(u,v),\\ \\mathbf{c}=\\tfrac{\\mathbf{I}(u,v)+1}{2},\\ \\mathbf{q},\\ \\mathbf{s},\\ \\alpha\\big)\\ :\\ \\rho(u,v)\\neq 0\\Big\\}", "explain_zh": "一个视角 v 生成的高斯集合。μ 是 gp6 的位置图；c 是颜色，直接取源像素并把 [−1,1] 映射回 [0,1]；只对逆深度非零（前景）的像素生成高斯。"}]}, {"b": "p", "t": "解码通道（stage2.yaml gsnet）：encoder_dims [32,48,96]，decoder_dims [48,64,96]，parm_head_dim 32。各级拼接后的输入通道：1/8 级 96+96=192→96；1/4 级 48+48+96=192→64；1/2 级 32+32+64=128→48；全分辨率 48+3+1=52→32。高斯参数回归器参数 1,249,192 个（其中深度编码器 412,784 个），按代码实例化统计。尺度上限 0.01：按代码的相机参数，约等于 2 m 处 4 个像素宽（推算）。issue #18 中用户在 RTX 3090 上测得参数回归约 77.4 ms（用户实测），主要开销来自在 1024² 全分辨率上运行的 3×3 卷积。", "label": "具体数字"}, {"b": "p", "t": "论文强调参数图定义在源视角图像平面上，而不是非结构化点云上：可以直接用 2D CNN，与图像特征对齐，数量固定、不用致密化。深度编码器由消融支持（LPIPS 0.121 对 0.204）。颜色取像素，基于 Lambertian 假设；尺度截断到 0.01 可以防止个别高斯膨胀成大斑块，论文没有解释这个数值，这是合理的解读。没有采用的方案：预测 SH 或视角相关颜色；预测位置残差；把相机位姿作为网络输入（这也是旋转问题的根源）。", "label": "为什么这样设计"}, {"b": "p", "t": "（1）旋转输出没有乘相机外参的旋转就被当作世界系旋转使用（lib/GaussianRender.py:19、:32 直接使用 rot_maps；issue #89 至今未关闭）。网络只能在训练中“凑”出一个在世界系下凑合可用的朝向，换一种相机布局就可能失效。（2）尺度上限是场景单位下的绝对值（约米），不是像素单位；场景尺度一变（例如用毫米为单位的真实标定），这个截断就会失效或过紧。（3）不透明度没有显式监督，只能靠渲染损失间接学习；论文没有展示参数图的统计分布，因此无法判断它们是否真的“因像素而异”。（4）颜色直接取像素：两视角曝光不一致时，合并区域会出现色斑，参数网络对此无能为力。", "label": "容易误解的地方"}, {"b": "qa", "items": [{"q": "假设一个人物像素离相机 2 m、焦距 819 px，网络在这里预测的三轴尺度都是 0.001（1 mm）。渲染到同样距离的新视角时，它大约占多少像素？会出现什么问题？", "a": "像素宽约为 Z/f = 2/819 ≈ 2.4 mm。1 mm 的标准差只有约 0.4 个像素；3DGS 光栅器还会给屏幕空间协方差加 0.3 的低通，所以它会被画成大约 1 像素的小点。如果相邻高斯都这么小，新视角离人物更近或输出分辨率更高（本文输出 2048，是源图的 2 倍）时，像素之间会出现针孔状空隙。网络因此需要把尺度预测得足以覆盖放大后的像素，或者靠两个视角的高斯互相填补。这也解释了为什么尺度是一个需要学习（或按 Z/f 解析设定，Ha et al. 的做法）的量。"}]}, {"b": "sec", "h": "GP8 · 合并与渲染：两视角的高斯一次性送进原版 3DGS 光栅器，输出 2048×2048，新视角渲染 0.8 ms", "id": "walk-gpsgaussian-gp8", "sn": {"label": "论文位置", "t": "论文方法部分“联合训练与可微渲染”（把两视角的参数图反投影后用 3DGS 渲染）；Table 1 新视角渲染时间 0.8 ms；代码 lib/GaussianRender.py pts2render（:6-40）、gaussian_renderer/__init__.py render（:17-67）、lib/utils.py get_novel_calib（:9-55）、lib/graphics_utils.py getProjectionMatrix（:31-48）"}}, {"b": "p", "t": "输入：左右两视角的有效高斯（位置 N×3、颜色 N×3、四元数 N×4、尺度 N×3、不透明度 N×1，N ≤ 2×1024²，只取前景像素）和新视点相机（内参、外参）。输出：新视角 RGB 图像 3×2048×2048，背景为黑色。", "label": "这一步做什么", "mn": {"label": "需要的基础", "links": [{"k": "concept-n-3dgs"}, {"k": "concept-r-raster"}, {"k": "concept-r-alpha"}, {"k": "concept-i-warping"}, {"k": "concept-f-linalg"}, {"k": "adv-a-diff-render"}]}}, {"b": "p", "t": "渲染这一步完全交给原版 3DGS 的可微光栅器（n-3dgs、r-raster、a-diff-render）。每个高斯按相机投影成屏幕上的一个 2D 椭圆；屏幕被切成 16×16 的 tile，每个 tile 内按深度排序；然后逐像素从前往后做 alpha 合成（r-alpha），把颜色乘上不透明度和累积透射率后累加。整个过程可微，所以渲染图与真值图之间的损失可以一路回传到不透明度、尺度、旋转，以及决定位置的深度网络（gp9）。\n\n本文的做法是把左右两个视角的高斯拼成一个集合，一次送进光栅器，由光栅器按深度排序自动处理两视角之间的遮挡：左视角看不到的地方由右视角的高斯补上，反之亦然。这样做简单、快，一次渲染只要 0.8 ms（论文，RTX 3090）。代价是：两视角的深度误差会让同一表面出现两层高斯，形成 Z-fighting 和颜色接缝（见 gp6 的自测题）。这正是 Ha et al. 批评、并改为“逐视角渲染再融合”的地方。\n\n新视点相机怎么给？训练和验证时，直接用合成数据里渲染该真值图的那台相机（内参乘 2，输出 2048×2048），监督就是专门渲染的 2048×2048 高清真值（use_hr_img=True）。推理脚本没有真值相机，就在两个源视角之间插值：旋转用球面线性插值（Slerp），外参平移 t 线性插值，内参线性插值后乘 2，输出同样是源图边长的 2 倍。这正是论文所说的 2K 渲染。注意高斯本身与新视点无关：同一组高斯可以连续渲染任意多个视点，每个视点只多 0.8 ms。这一点对双眼头显和多名观众非常有利。不过官方的 test_view_interp.py 每换一个视点都把整个网络重跑了一遍，没有利用这一性质。", "mn": {"label": "类比", "t": "像把两位摄影师各自捏出的“珠子人像”倒进同一个盒子，再从新的角度拍一张照片。珠子多、渲染快，但两个人捏得不完全一样的地方，会出现两层珠子互相穿插。"}}, {"b": "eqs", "eqs": [{"tex": "\\boldsymbol{\\Sigma}'=\\mathbf{J}\\mathbf{W}\\boldsymbol{\\Sigma}\\mathbf{W}^{\\top}\\mathbf{J}^{\\top},\\qquad \\alpha_i(\\mathbf{x})=\\alpha_i\\exp\\!\\Big(-\\tfrac12(\\mathbf{x}-\\boldsymbol{\\mu}'_i)^{\\top}\\boldsymbol{\\Sigma}_i'^{-1}(\\mathbf{x}-\\boldsymbol{\\mu}'_i)\\Big)", "explain_zh": "3DGS 的投影。W 是新相机的 world-to-camera 旋转，J 是透视投影在高斯中心处的雅可比，Σ' 是 2×2 屏幕空间协方差，μ' 是投影后的中心，x 是像素位置，α_i 是 gp7 预测的不透明度，α_i(x) 是该高斯在像素 x 处的有效不透明度。原版光栅器还会在 Σ' 上加 0.3 的低通，把 α 截断到 0.99，并跳过小于 1/255 的贡献。"}, {"tex": "\\mathbf{C}(\\mathbf{x})=\\sum_{i\\in\\mathcal{G}_l\\cup\\mathcal{G}_r}\\mathbf{c}_i\\,\\alpha_i(\\mathbf{x})\\prod_{j<i}\\big(1-\\alpha_j(\\mathbf{x})\\big)+T(\\mathbf{x})\\,\\mathbf{c}_{\\text{bg}}", "explain_zh": "前到后的 alpha 合成。求和遍历左右两视角高斯的并集，按深度从近到远排序；c_i 是颜色（源像素）；∏(1−α_j) 是累积透射率；T(x) 是剩余透射率；c_bg 是背景色，这里取黑色 [0,0,0]。两视角的高斯在这里第一次“相遇”，谁在前完全由深度排序决定。"}, {"tex": "\\mathbf{R}_{\\text{nov}}=\\operatorname{Slerp}(\\mathbf{R}_0,\\mathbf{R}_1;\\lambda),\\quad \\mathbf{t}_{\\text{nov}}=(1-\\lambda)\\mathbf{t}_0+\\lambda\\mathbf{t}_1,\\quad \\mathbf{K}_{\\text{nov}}=2\\big[(1-\\lambda)\\mathbf{K}_0+\\lambda\\mathbf{K}_1\\big]_{2\\times3}", "explain_zh": "新视点相机（get_novel_calib）。λ 是 ratio∈[0,1]；R_0、R_1、t_0、t_1 是两源视角原始（未校正）的 world-to-camera 旋转和平移；Slerp 是球面线性插值；K 的前两行乘 2，对应 2048×2048 的输出。注意这里插值的是外参里的 t，不是相机中心 C=−R^⊤t。对所有相机都注视同一点、到注视点等距的环形阵列（合成数据正是如此），各相机的 t 完全相同，Slerp 旋转配上这个 t，光心恰好落在圆弧上（已按代码数值验证）；若直接对相机中心线性插值，反而会落在弦上、离人更近。真实阵列不严格满足这一条件时才会有偏差。此插值只在推理脚本中使用。"}]}, {"b": "p", "t": "每个样本的高斯数至多 2×1024²=2,097,152（只取前景）。渲染输出 3×2048×2048；背景 [0,0,0]；znear 0.01、zfar 100（stereo_human_config.py:25-26）；colors_precomp 直接给 RGB（sh_degree=3 参数不起作用）。论文：新视角渲染 0.8 ms（RTX 3090）；issue #18 中用户用 PyTorch 代码实测 render 约 4.8 ms（计时范围是否包含 Python 端的拼接，issue 没有说明）。光栅器只返回 RGB，不返回深度和 alpha。", "label": "具体数字"}, {"b": "p", "t": "用现成的 3DGS 光栅器，天然得到可微渲染、深度排序和极快的速度，还能与 3DGS 生态兼容。两视角合并后一次渲染，比逐视角渲染再融合更简单，只需一次光栅化，也不需要额外的融合网络。作者没有讨论逐视角渲染这一替代方案（Ha et al. 后来专门论证了它的好处）。输出 2 倍分辨率，是为了实现 2K 显示，并让监督包含源图之外的高频细节（合成数据的高清真值）。", "label": "为什么这样设计"}, {"b": "p", "t": "（1）“2K”是 2048×2048 的输出，源图只有 1024×1024，额外的像素靠高斯的连续覆盖“补”出来，并不是真的多出了细节，高频上限仍是源图。（2）两视角直接合并不做去重：两层高斯交错时，Z-fighting 和色斑无法避免。（3）没有任何补洞机制：两视角都看不到的区域透射率为 1，直接露出黑色背景。（4）推理时新视点只能在两源视角之间插值（ratio∈[0,1]）；对 t 线性插值只在“所有相机注视同一点、等距”的理想环形阵列上严格沿圆弧移动，真实阵列会有偏差。（5）test_view_interp.py 对每个新视点都重跑网络，测速时要单独统计“重建一次、渲染多次”的情形。", "label": "容易误解的地方"}, {"b": "qa", "items": [{"q": "一个远程临场头显需要以 90 Hz 同时渲染左右眼。按论文的数字（源处理 27 ms、每个新视角 0.8 ms），在人物静止、只有观众头动的情况下，每秒要做多少次源处理和多少次渲染？与 Quark 这类“每个视点重跑网络”的方法相比有什么差别？", "a": "人物静止时，高斯只需重建一次（或每个采集帧一次，比如 30 fps 就是每秒 30 次源处理，约 810 ms 的 GPU 时间），渲染则要 90×2=180 次，每次 0.8 ms，约 144 ms/s。渲染部分只占很小的预算。但每次头动都可能换一对源视角（选择规则取决于新视点），换对时要么重新算那一对（27 ms），要么提前把所有相邻对都算好。“每个视点重跑网络”的方法则要 180 次完整推理，Quark 按 32 ms 算，需要约 5.8 s 的 GPU 时间，根本做不到。这就是显式 3D 表示在多视点输出上的结构优势。"}]}, {"b": "sec", "h": "GP9 · 联合训练：L = L_disp + 0.8·L1 + 0.2·(1−SSIM)，先预训练深度 40K 步，再联合训练 100K 步", "id": "walk-gpsgaussian-gp9", "sn": {"label": "论文位置", "t": "论文方法部分“联合训练与可微渲染”（L_render、L_disp、μ=0.9）；Table 3 消融（w/o Joint Training）；代码 train_stage1.py（:30、:39-41、:60-74）、train_stage2.py（:40-42、:72）、lib/loss.py sequence_loss / ssim（:8-33、:52-83）"}}, {"b": "p", "t": "输入：3 次迭代输出的全分辨率位移 {f^t}（每视角 B×1×1024×1024）、位移真值与 valid 掩码、渲染的新视角图和 2048×2048 真值图。输出：标量损失。它的梯度流向图像编码器、深度模块和参数回归器。", "label": "这一步做什么", "mn": {"label": "需要的基础", "links": [{"k": "concept-l-loss"}, {"k": "concept-f-optim"}, {"k": "concept-v-metrics"}, {"k": "concept-l-iterative"}, {"k": "adv-a-diff-render"}]}}, {"b": "p", "t": "损失由两部分组成（l-loss）。视差损失 L_disp 直接监督深度模块：对 3 次迭代的每一次输出，都在前景有效区域内与真值算 L1，越靠后的迭代权重越大。这样早期迭代也会被推向正确答案，这是 RAFT 系列的标准做法。渲染损失 L_render 监督最终的图像：渲染出的新视角与真值之间 0.8 份 L1 加 0.2 份 SSIM 损失（v-metrics），前者管逐像素颜色，后者管局部结构和对比度。两者直接相加。\n\n“联合”的含义在于：渲染图的每个像素都依赖高斯的位置，而位置来自深度模块，所以 L_render 的梯度会穿过光栅器（a-diff-render）、穿过反投影，一直传回深度网络和共享编码器。于是深度网络除了“视差要对”，还多了一个目标：“渲染要好看”。比如轮廓附近差一两个像素的深度，视差损失可能不在乎，渲染损失却会惩罚。论文的消融是这样做的：把可微的高斯渲染换成固定半径的点云渲染，模型退化为“深度网络 + 不可微的深度 warping 渲染”，深度只受视差损失训练。结果 PSNR 从 25.05 降到 23.97，EPE 从 1.494 升到 1.587：渲染反过来也改善了深度。\n\n训练分两阶段（f-optim）。第一阶段只训深度（with_gs_render=False），40K 步，只用 L_disp。第二阶段加载第一阶段的权重，打开参数回归和渲染，联合训练 100K 步，L_disp 始终保留，防止几何被渲染损失“带偏”。优化器、学习率调度和梯度裁剪都照搬 RAFT-Stereo 的训练脚本。\n\n有两处代码细节与论文不同。第一，论文写序列损失的衰减系数 μ=0.9，代码沿用 RAFT-Stereo，把它调整为 0.9^{15/(T−1)}，以便“对任意迭代次数保持一致”。T=3 时这个值约为 0.454，三次输出的权重是 0.206、0.454、1；按论文公式则应是 0.81、0.9、1。代码更看重最后一次迭代。第二，第一阶段的 OneCycleLR 总步数写死为 100100，但只训练 40000 步，所以学习率只退火了约四成就结束了。", "mn": {"label": "类比", "t": "像同时有两位老师批改作业：几何老师逐题核对你算出的距离（视差损失），美术老师只看你最后交上来的画像（渲染损失）。美术老师的意见也会影响你怎么算距离，这就是联合训练。"}}, {"b": "eqs", "eqs": [{"tex": "\\mathcal{L}_{\\text{disp}}=\\sum_{t=1}^{T}\\mu^{T-t}\\,\\big\\lVert \\mathbf{d}_{\\text{gt}}-\\mathbf{d}^{t}\\big\\rVert_1,\\qquad T=3,\\ \\mu=0.9\\ (\\text{论文})", "explain_zh": "论文的视差损失。d^t 是第 t 次迭代上采样后的位移（代码中 flow），d_gt 是由深度真值换算得到的真值；‖·‖_1 是在 valid 掩码内的平均绝对误差；μ^{T−t} 让后面的迭代权重更大。左右两个视角都参与。"}, {"tex": "\\mu_{\\text{code}}=0.9^{\\,15/(T-1)}\\approx0.454,\\qquad w_t=\\mu_{\\text{code}}^{\\,T-t}\\in\\{0.206,\\ 0.454,\\ 1\\}", "explain_zh": "代码里的实际权重（lib/loss.py:19-20，照搬 RAFT-Stereo）。T=3 时指数是 15/2=7.5；w_t 是第 1、2、3 次迭代的权重。与论文公式的 {0.81, 0.9, 1} 相比，前两次迭代的监督弱得多。"}, {"tex": "\\mathcal{L}_{\\text{render}}=0.8\\,\\lVert\\hat{\\mathbf{I}}-\\mathbf{I}_{\\text{gt}}\\rVert_1+0.2\\,\\big(1-\\operatorname{SSIM}(\\hat{\\mathbf{I}},\\mathbf{I}_{\\text{gt}})\\big),\\qquad \\mathcal{L}=\\mathcal{L}_{\\text{disp}}+\\mathcal{L}_{\\text{render}}", "explain_zh": "Î 是渲染的新视角（3×2048×2048，值域 [0,1]），I_gt 是合成的高清真值；SSIM 用 11×11 高斯窗口（σ=1.5），常数 C1=0.01²、C2=0.03²；总损失把两项直接相加（代码为 1.0·flow_loss + 0.8·L1 + 0.2·(1−SSIM)）。L1 和 SSIM 都在整幅图上计算，包括大片黑色背景。"}]}, {"b": "p", "t": "第一阶段：40K 步，batch 6，不开混合精度（stage1.yaml）。第二阶段：100K 步，batch 2，RAFT 部分开混合精度（stage2.yaml）。AdamW：lr 2e-4，weight decay 1e-5，eps 1e-8；OneCycleLR 线性退火，pct_start 0.01（即前 1% 的步数 warmup）；梯度裁剪 1.0；随机种子 1314。论文：单卡 RTX 3090 训练全程约 15 小时。按线性退火推算，第一阶段调度总长 100100 步，第 40000 步时学习率约为峰值的 1−(40000−1001)/(100100−1001)≈0.61 倍。", "label": "具体数字"}, {"b": "p", "t": "先预训练深度，是为了给渲染一个靠谱的几何起点：一开始深度全错的话，高斯都飘在空中，渲染损失给出的梯度几乎没有意义。联合阶段保留视差损失，是为了防止网络为了“渲染好看”而扭曲几何（比如靠拉大尺度去糊）。0.8/0.2 的 L1+SSIM 组合是 3DGS 常用的配比（原版 3DGS 用 0.8/0.2 的 L1 与 D-SSIM），这里沿用了它。没有采用的方案：只用渲染损失（后来的 GPS-Gaussian+ 支持这种设定）；感知损失（LPIPS）或对抗损失；时间一致性损失。", "label": "为什么这样设计"}, {"b": "p", "t": "（1）联合训练需要深度真值。真实采集的数据没有深度真值，想在真实数据上微调，要么只用渲染损失，要么先用其他方法估出伪真值，而这正是论文自认的局限之一。（2）L_render 在整幅 2048² 图上计算，背景大面积为黑色且容易拟合，前景只占一部分，前景误差的相对权重被稀释。（3）论文公式与代码的 μ 不同，复现时以代码为准，并注意这会改变早期迭代的监督强度。（4）训练集的 len 被乘了 50（train_boost），所谓“epoch”只是数据迭代器的计数，与训练步数无关，看日志时别被误导。", "label": "容易误解的地方"}, {"b": "qa", "items": [{"q": "为什么论文的消融里，去掉联合训练后，不仅 PSNR 下降，连深度的 EPE 也变差（1.494→1.587）？渲染损失是怎么“教”深度的？", "a": "渲染图的每个像素由高斯位置决定，位置来自深度，所以渲染误差对深度有梯度：如果某个轮廓像素的深度偏了，它的高斯会投影到新视角的错误位置，与真值颜色不符，梯度就会把深度往正确的方向推。这相当于给深度加了一种“多视角光度一致性”监督，在视差真值稀疏、有噪声或 valid 掩码被腐蚀掉的轮廓区域尤其有用。反过来，去掉联合训练后，深度只受 L1 视差约束，缺少这部分信号，EPE 就略差一些。"}]}, {"b": "sec", "h": "GP10 · 合成训练数据：Twindom 1700 个加 THuman2.0 526 个人体扫描，在虚拟相机圈中渲染（论文 8 台，公开代码 16 台）", "id": "walk-gpsgaussian-gp10", "sn": {"label": "论文位置", "t": "论文实验设置（数据集、8 相机约 45°、每对源视角之间随机 3 个新视点、验证集 200/100）；代码 prepare_data/render_data.py、prepare_data/MAKE_DATA.md、README（Dataset Preparation）"}}, {"b": "p", "t": "输入：带纹理的人体扫描网格（.obj 加纹理图）。输出：每个扫描、每个相机位置一组数据，包括 1024×1024 源图、mask、逆深度 png、内外参，以及位于两源视角之间的 3 个新视点的 1024 图和 2048×2048 高清图。", "label": "这一步做什么", "mn": {"label": "需要的基础", "links": [{"k": "concept-g-rig"}, {"k": "concept-g-pinhole"}, {"k": "concept-l-loss"}, {"k": "concept-n-generalizable"}, {"k": "adv-a-human-capture"}]}}, {"b": "p", "t": "本文所有的深度监督和渲染监督都来自合成数据（a-human-capture）。把人体扫描放在虚拟摄影棚里渲染，就能免费得到三样在真实世界里很难同时拿到的东西：像素级精确的深度真值、完美的前景 mask、任意视角的真值图像。论文用了两批扫描：Twindom 的 1700 个（商业数据）和 THuman2.0 的 526 个（公开数据，来自 Function4D 一文），分别随机留出 200 个和 100 个作为验证。\n\n公开的渲染脚本把设定写得很具体。扫描先按高度归一化到 1.80±0.05 m，脚底对齐地面，在水平面上随机平移几厘米；相机注视点在 (0, 0.85, 0)，俯仰 −8°，距人 2 m；焦距为 0.8 倍图像宽度（1024 时为 819.2 px），主点向下偏 25 px；6 盏方向光绕一圈，俯仰随机；THuman2.0 还用 SMPL-X 拟合参数把人体朝向统一。随后，对每个相机位置 pid，渲染它和它右边相邻的相机作为一对源视角（编号 0、1），再在两者之间取 3 个新视点（编号 2、3、4：一个在正中，另两个在前半段和后半段各随机取一个），这 3 个视点另外渲染 2048×2048 的高清图，作为 2K 监督。训练时每步从 2、3、4 中随机选一个新视点；验证固定用正中的 3 号。\n\n关键差异在相机数量：论文写 8 台、约 45°；脚本默认 cam_nums=16，README 也说明发布的数据是“16-camera setting”。GitHub 上，issue #14、#87 的用户反映按约 45° 间隔训练效果差或难收敛，#94 报告用发布权重和按 8 相机重训都复现不出论文数字。要意识到，“相邻夹角”是这个方法最敏感的超参数之一，而论文与代码在这一点上并不一致。\n\n合成数据也有代价：Lambertian 着色、理想的方向光、没有运动模糊、没有传感器噪声和压缩伪影、相机之间颜色完全一致，mask 也是完美的。这些都与真实采集不同（i-blending 在真实数据上最怕的颜色不一致，在合成数据里根本不存在）。", "mn": {"label": "类比", "t": "像给学徒准备的练习册：每道题都来自同一台“完美相机”，附有标准答案（深度和真值图）。学得很快，但真实考试（真实相机）的题目会更脏、更乱。"}}, {"b": "eqs", "eqs": [{"tex": "\\mathbf{K}_{\\text{src}}=\\begin{bmatrix}0.8W&0&0.5W\\\\0&0.8H&0.5H+25\\\\0&0&1\\end{bmatrix},\\qquad \\mathbf{K}_{\\text{hr}}=\\begin{bmatrix}1.6W&0&W\\\\0&1.6H&H+50\\\\0&0&1\\end{bmatrix}", "explain_zh": "按 render_data.py:153-172 写出的内参（W=H=1024）。K_src 是源图和普通新视角图的内参；K_hr 是 2048 高清图的内参（焦距和主点都乘 2）。y 方向主点多出的 25（高清图为 50）像素，来自代码中 y_min=−25，作用是让人物在画面里略微下移（合理的解读）。"}, {"tex": "\\theta_{\\text{src}}^{(0)}=\\theta_0+p\\,\\Delta,\\ \\ \\theta_{\\text{src}}^{(1)}=\\theta_0+(p+1)\\Delta,\\ \\ \\theta_{\\text{nov}}\\in\\Big\\{\\theta^{(0)}+u_1\\tfrac{\\Delta}{2},\\ \\theta^{(0)}+\\tfrac{\\Delta}{2},\\ \\theta^{(0)}+\\Delta-u_2\\tfrac{\\Delta}{2}\\Big\\}", "explain_zh": "相机方位角的采样。Δ=360°/cam_nums 是相邻夹角（代码 16 台时为 22.5°，论文 8 台时为 45°）；θ_0 是在 ±Δ/2 内随机的基准角（THuman 还要加上 SMPL-X 的朝向）；p=0..cam_nums−1 是相机对编号；u_1、u_2 ~ U(0,1)；三个新视点分别落在前半段、正中和后半段。"}, {"tex": "N_{\\text{pairs}}=N_{\\text{scan}}\\times N_{\\text{cam}},\\qquad \\text{例：}\\ 426\\times16=6816", "explain_zh": "训练样本（源视角对）的数量。N_scan 是训练扫描数；N_cam 是每个扫描的相机对数（代码中的 cam_nums）。只用 THuman2.0 的 426 个训练扫描、16 相机时约为 6816 对（按代码推算；论文的训练集组成与相机数不同）。代码中 __len__ 又乘了 50（train_boost），只影响迭代器，不影响样本数。"}]}, {"b": "p", "t": "论文：Twindom 1700 个扫描（验证 200），THuman2.0 526 个（验证 100）；8 台相机，约 45°；每对源视角之间随机取 3 个新视点。代码（render_data.py）：cam_nums=16，scene_radius=2.0，res=(1024,1024)，高清图 2048×2048；人体高度 1.80±0.05 m，注视点 y=0.85 m，俯仰 −8°；6 盏方向光，俯仰 ±30° 随机；随机平移 ±0.1 m（身高低于 1.8 m 时）或 ±0.05 m；逆深度按 ×2^15 存为 uint16。README：发布的 16 相机 THuman2.0 渲染数据加上预处理结果，约需 50 GB。", "label": "具体数字"}, {"b": "p", "t": "真实多视角人体数据很难同时得到稠密深度真值和任意视角真值，合成数据是唯一可行的规模化监督来源。身高归一化和随机平移，是为了与目标真实场景的相机布局对齐；README 明确建议“按目标场景的相机数和半径重新渲染训练数据”。这说明作者把相机布局当作训练分布的一部分，而不是期望网络对任意布局泛化。没有采用的方案：在真实数据上用自监督训练（后来的 GPS-Gaussian+ 支持只用渲染监督）；使用人体参数化模板先验。", "label": "为什么这样设计"}, {"b": "p", "t": "（1）模型与相机布局强绑定：半径、焦距、夹角一变，就要重新渲染数据、重新训练。（2）Twindom 是商业数据，无法获取；只用 THuman2.0 的 426 个训练扫描，数据量会少很多。（3）合成图像没有真实相机的噪声、曝光差异和运动模糊，直接用于真实数据会有域差距；论文的真实数据只有 4 个人物。（4）深度 png 存的是逆深度乘 2^15，读取时要除回来，再取倒数才是米。", "label": "容易误解的地方"}, {"b": "qa", "items": [{"q": "你的真实系统是 12 台相机、半径 1.5 m、1080p 相机。能直接用官方发布的权重吗？应该怎么改数据生成脚本？", "a": "不建议直接用。官方训练数据按 16 台、到注视点 2 m、正方形 1024 图、fx=0.8W 的布局渲染（发布的权重很可能也在这套数据上训练）；夹角（30° 对 22.5°）、基线、视差分布和人物在画面中的大小都不同，立体匹配会受影响；代码还假设图像是正方形。应该在 render_data.py 里把 cam_nums 改成 12、scene_radius 改成 1.5，把焦距和分辨率改成与真实相机一致（必要时修改代码，支持非方形图像，或者裁成方形），再重新渲染数据，并从第一阶段开始重训。README 自己也建议按目标场景的相机数和半径渲染训练数据。"}]}, {"b": "sec", "h": "GP11 · 实时性能与真实系统：论文报告 RTX 3090 + TensorRT 下源处理 27 ms、渲染 0.8 ms，表中 25 FPS；演示接入 6 台相机", "id": "walk-gpsgaussian-gp11", "sn": {"label": "论文位置", "t": "Table 1 的时间列（RTX 3090，两张 1024×1024 源图合成一个新视角）；论文的实时演示（补充材料：前方 6 台相机，需要准确抠像）；代码 test_real_data.py（无计时）；GitHub issue #18、#34、#52"}}, {"b": "p", "t": "输入：两路 1024×1024 源图（已抠像、已标定）。输出：2048×2048 的新视角，以及论文报告的分阶段耗时。本步讨论这些数字的测量条件，以及哪些开销没有算进去。", "label": "这一步做什么", "mn": {"label": "需要的基础", "links": [{"k": "concept-v-codec"}, {"k": "concept-n-3dgs"}, {"k": "concept-g-rig"}, {"k": "concept-n-generalizable"}, {"k": "adv-a-telepresence-sys"}]}}, {"b": "p", "t": "论文 Table 1 把时间拆成两列：源视角处理和新视角渲染。本文的源视角处理包括编码、3 次迭代的双目匹配、深度转换和参数回归，共 27 ms；每个新视角的光栅化只要 0.8 ms；表中帧率为 25 FPS。论文注明本文和 FloRen 的计时都用了 TensorRT。对比方法正好相反：ENeRF 源处理 11 ms、每个新视角 125 ms；FloRen 14 ms + 11 ms；IBRNet 每个新视角要秒级。这张表的真正信息是“把重活放在与视点无关的重建上，渲染几乎免费”（a-telepresence-sys），这对多视点输出特别重要（见 gp8 自测题）。\n\n不过，这些数字要打几个问号。第一，公开代码里既没有计时脚本，也没有 TensorRT 部署。issue #18 中，一位用户在 RTX 3090 上用原生 PyTorch 代码分段测得：深度模块 26.8 ms，参数回归 77.4 ms，渲染 4.8 ms，三段合计约 112 ms；issue #34 另一位用户测得约 4 fps；issue #52 中有用户自行转成 TensorRT FP16，在 2048×1024 输入（像素数是论文设定的 2 倍）下仍需约 60 ms。参数回归慢，很可能是因为回归头在 1024² 全分辨率上跑多层 3×3 卷积（按代码结构推断）。Ha et al. 重训后测得 143.4 ms。第二，27 ms 不含前景抠像、立体校正（测试脚本每帧在 CPU 上重算）、多路采集和数据搬运。第三，“25 FPS”不是端到端延迟（v-codec），而且与毫秒数不能互推：27.8 ms 约合 36 FPS，FloRen、ENeRF 两行也对不上，口径未能核实。\n\n真实系统方面，补充材料描述了一个实时演示：因 RTX 3090 显存限制，只接入了前方 6 台面向人物、均匀分布的相机；方法依赖准确的前景抠像。演示用了哪种抠像方法、抠像耗时和端到端延迟，本次检索都没有找到。所以，这篇论文证明的是“算法核心可以做到每帧几十毫秒”，而不是“一个完整的远程临场系统已经可用”。", "mn": {"label": "类比", "t": "像餐厅宣传“出餐 28 秒”：计时从食材已经洗好、切好、摆上灶台开始（抠像、校正、采集都不算）；而且有顾客用同样的菜谱在家里做，实测要 110 秒。"}}, {"b": "eqs", "eqs": [{"tex": "T_{\\text{frame}}(N_v)=T_{\\text{src}}+N_v\\,T_{\\text{nov}},\\qquad T_{\\text{src}}=27\\ \\text{ms},\\ T_{\\text{nov}}=0.8\\ \\text{ms}", "explain_zh": "每帧耗时模型。N_v 是需要渲染的新视点数（单个显示为 1，双眼为 2，多名观众时更多）；T_src 是与视点无关的重建时间（论文数字）；T_nov 是每个新视角的光栅化时间。N_v=1 时约 27.8 ms（约 36 FPS）；论文报告 25 FPS，而 FloRen、ENeRF 两行同样对不上，说明表中 FPS 按另一种口径计算或包含其他开销（未能核实）。论文自己用这个线性模型换算过 N_v=10：本文 35 ms，FloRen 124 ms，ENeRF 1261 ms。"}, {"tex": "T_{\\text{sys}}=T_{\\text{capture}}+T_{\\text{matting}}+T_{\\text{rectify}}+T_{\\text{src}}+N_v T_{\\text{nov}}+T_{\\text{encode/transmit}}+T_{\\text{display}}", "explain_zh": "端到端系统时间（示意，不是论文公式）。论文只报告了 T_src 和 T_nov；采集、抠像、校正、编码传输和显示都没有报告。做远程临场系统时要把这些都测出来。"}]}, {"b": "p", "t": "论文 Table 1（RTX 3090，本文与 FloRen 用 TensorRT）：本文 27 ms + 0.8 ms，25 FPS；FloRen 14 ms + 11 ms，15 FPS；ENeRF 11 ms + 125 ms，5 FPS；IBRNet 每个新视角约 4000 ms（源视角耗时未能核实）；3D-GS 需要逐人物优化数分钟（具体数值未能核实）。同时合成 10 个新视角：本文 35 ms，FloRen 124 ms，ENeRF 1261 ms。论文：训练约 15 小时（单卡 RTX 3090）。演示：前方 6 台相机。第三方或用户实测：issue #18 约 26.8 + 77.4 + 4.8 ms（RTX 3090，PyTorch）；issue #52 TensorRT FP16、2048×1024 输入约 60 ms；Ha et al. 143.4 ms；Tele360 Table 1（DNA-Rendering，2048×2048 评测，本文方法给 8 个视角）测得约 300 ms。模型总参数 5.14M（按代码统计，其中约 1.0M 从不参与计算）。", "label": "具体数字"}, {"b": "p", "t": "把重活放在“源视角”一侧，是显式 3D 表示的必然结果，也是作者选择 3DGS 而不是神经辐射场的主要理由之一：辐射场每个新视角都要沿射线采样、跑网络。公开代码与论文速度之间的差距，主要来自论文计时用了 TensorRT（论文注明），而这部分部署没有随代码发布；是否还用了半精度或其他改动，未能核实。", "label": "为什么这样设计"}, {"b": "p", "t": "（1）不要把“25 FPS”当作系统帧率：它不含抠像、校正、采集和传输，也不含在线换源视角对的开销。（2）公开的 PyTorch 代码实测明显更慢（issue #18），做基线对比时要写清楚用的是哪个版本、什么精度。（3）演示只接入 6 台相机，背后的视角合成不了；想覆盖 360°，显存和计算都要成倍增加。（4）Table 1 里的 FPS 与 27 + 0.8 ms 换算出的约 36 FPS 对不上；FloRen（25 ms 对 15 FPS）、ENeRF（136 ms 对 5 FPS）同样如此，口径不明。", "label": "容易误解的地方"}, {"b": "qa", "items": [{"q": "用户实测中参数回归占了约 77 ms。只看网络结构，你会从哪里下手提速？各自的代价是什么？", "a": "瓶颈在全分辨率（1024²）上运行的 out_conv 和三个 3×3 卷积头，每个都有 32 通道、每视角约 100 万个位置。可以考虑：（1）在 1/2 分辨率上预测参数图，再上采样，或者每 2×2 像素共享一组参数，代价是细节变粗，高斯数量也可能随之减少；（2）用半精度或 TensorRT 部署（论文的 27 ms 就是在 TensorRT 下测得），基本不掉质量，但需要工程工作；（3）把头部的 3×3 卷积改为 1×1，感受野变小，参数图更“碎”；（4）像 Ha et al. 那样干脆不回归，按 Z/f 解析设定尺度、不透明度取 1，最快，但失去了自适应能力。提速前应先用 profiler 确认真正的瓶颈。"}]}, {"b": "sec", "h": "GP12 · 如何读实验：Table 1 三个数据集、Table 3 消融，以及第三方重训与复现问题", "id": "walk-gpsgaussian-gp12", "sn": {"label": "论文位置", "t": "Table 1（THuman2.0、Twindom、真实数据的 PSNR/SSIM/LPIPS 与耗时）；Table 3（消融：联合训练、深度编码器，含 EPE 与 1 px 准确率）；论文定性比较图与实时演示视频；Ha et al.（CVPR 2025）Table 1–4；GitHub issue #35、#94"}}, {"b": "p", "t": "输入：论文的主表、消融表和定性图，外加第三方的重训结果和用户的复现报告。输出：判断这篇论文到底证明了什么、在什么条件下成立。", "label": "这一步做什么", "mn": {"label": "需要的基础", "links": [{"k": "concept-v-metrics"}, {"k": "concept-v-temporal"}, {"k": "concept-n-generalizable"}, {"k": "adv-a-human-capture"}, {"k": "adv-a-ff-3dgs"}]}}, {"b": "p", "t": "先读 Table 1（v-metrics）。三个数据集上，本文在 PSNR、SSIM、LPIPS 三项指标上都领先：THuman2.0 25.57 对 ENeRF 24.10（+1.47 dB），Twindom 24.79 对 23.64，真实数据 24.64 对 23.26。领先方向一致。要注意三点。第一，这些数字都是在“人物前景、黑色背景、新视点夹在相邻两台相机之间”的设定下得到的，背景像素对 PSNR 的贡献可能很大（论文是否只在前景上计算未能核实）。第二，3D-GS 基线只用 8 个视角逐人物优化，本来就会失败，它的排名不代表 3DGS 的能力上限。第三，论文说明所有可泛化基线都在同一数据集上从头训练、以两个源视角为输入；其中只有 FloRen 和本文用了深度真值监督。\n\n再读 Table 3 消融。它同时给出渲染指标和深度指标（EPE、1 像素准确率）。去掉深度编码器后深度几乎不变、渲染明显变差，说明深度编码器的作用在参数回归一侧；去掉联合训练后两者都变差，说明渲染损失反哺了几何。但要注意：消融的完整模型 PSNR 是 25.05，与 Table 1 对不上；“去掉联合训练”在论文里是把高斯渲染换成固定半径的点云渲染，也去掉了参数回归，混合了两种变化；这一行的 LPIPS（0.115）反而比完整模型（0.121）好，论文没有解释（合理的解读是点渲染没有高斯的平滑模糊）。\n\n最后看两类“外部证据”。一类是第三方重训：Ha et al. 在 DyNeRF（带背景的厨房场景）上重训本文方法，PSNR 只有 25.46（ENeRF 29.51），时间一致性 STED 693.0，说明本文方法离开“人物加干净背景加小夹角”的分布后退化明显（v-temporal）。另一类是复现问题：论文用 8 台相机，发布的数据却是 16 台（用户认为权重也是）；有用户用发布权重在 8 相机 THuman 验证集上只得到 18.10 dB，按 8 相机重训又得到 30.95 dB，都对不上 25.57（issue #94）。这提醒我们：定量结论依赖一个没有完全公开的评测协议。", "mn": {"label": "类比", "t": "像看一份体检报告：先看每项指标和对照组，再看对照组是不是同样空腹、同一台仪器测的，最后看其他医院复查的结果是否一致。"}}, {"b": "eqs", "eqs": [{"tex": "\\frac{\\mathrm{MSE}_{\\text{ours}}}{\\mathrm{MSE}_{\\text{base}}}=10^{-\\Delta\\mathrm{PSNR}/10}", "explain_zh": "把 PSNR 差换算成均方误差比。ΔPSNR 是本文减去基线的 dB 数；+1.47 dB 对应 0.71 倍，+1.15 dB 对应 0.77 倍，+1.38 dB 对应 0.73 倍。"}, {"tex": "\\mathrm{EPE}=\\frac{1}{|\\Omega|}\\sum_{\\mathbf{p}\\in\\Omega}\\big|d(\\mathbf{p})-d_{\\text{gt}}(\\mathbf{p})\\big|,\\qquad \\text{1px}=\\frac{1}{|\\Omega|}\\sum_{\\mathbf{p}\\in\\Omega}\\mathbb{1}\\big[|d-d_{\\text{gt}}|<1\\big]", "explain_zh": "消融表里的深度指标（代码 train_stage2.py:126-132 的验证方式）。Ω 是有效前景像素（valid≥0.5）；d 是预测位移，d_gt 是真值（单位为全分辨率像素）；EPE 是平均端点误差（位移只有一维，所以就是绝对误差）；1px 是误差小于 1 像素的比例。"}, {"tex": "\\mathrm{PSNR}=10\\log_{10}\\frac{1}{\\mathrm{MSE}},\\quad \\mathrm{MSE}=\\frac{|\\mathcal{F}|}{|\\mathcal{A}|}\\mathrm{MSE}_{\\mathcal{F}}+\\frac{|\\mathcal{A}\\setminus\\mathcal{F}|}{|\\mathcal{A}|}\\mathrm{MSE}_{\\text{bg}}", "explain_zh": "整图 PSNR 的分解（示意）。𝒜 是全部像素，ℱ 是前景像素；MSE_ℱ、MSE_bg 分别是前景和背景的均方误差。背景黑色且容易对上时 MSE_bg≈0，整图 MSE 约等于前景 MSE 乘前景占比。前景只占 25% 时，整图 PSNR 会比只在前景上计算高约 10·log10(4)≈6 dB。代码的验证就是在整图上计算 PSNR（train_stage2.py:116，lib/loss.py:86-88）。"}]}, {"b": "p", "t": "Table 1 PSNR/SSIM/LPIPS：THuman2.0 为 本文 25.57/0.898/0.112，ENeRF 24.10/0.869/0.126，3D-GS 24.18/0.821/0.144，IBRNet 23.38/0.836/0.212，FloRen 23.26/0.812/0.184；Twindom 为 24.79/0.880/0.125，ENeRF 23.64/0.847/0.134；真实数据为 24.64/0.917/0.088，ENeRF 23.26/0.893/0.118，FloRen 22.80/0.872/0.136（基线 SSIM/LPIPS 来自检索摘要）。Table 3：完整模型 25.05/0.886/0.121，EPE 1.494，1px 65.94%；w/o Joint Training 23.97/0.862/0.115，EPE 1.587，1px 63.71%；w/o Depth Encoder 23.84/0.858/0.204，EPE 1.496，1px 65.87%。Ha et al.（DyNeRF）：本文方法 25.46/0.866/0.309，STED 693.0。Tele-Aloha 合成数据：本文方法 25.204/0.909/0.112。", "label": "具体数字"}, {"b": "p", "t": "作者选的对比对象是当时主流的可泛化人体或通用方法，以及逐人物优化的 3DGS，这些方法的差距来自“有没有显式几何”和“需不需要逐场景优化”，所以主表能说明路线上的优势。消融只覆盖了两个设计（联合训练、深度编码器），没有覆盖迭代次数、相机夹角、颜色取像素、单次整体渲染这些同样关键的选择。这是阅读时要补上的空白。", "label": "为什么这样设计"}, {"b": "p", "t": "（1）Table 1 只有单帧指标，没有任何时间一致性指标，而逐帧独立的高斯很容易闪烁（Ha et al. 测得 STED 693.0）。（2）新视点都夹在相邻相机之间，是内插而不是外推，不能据此判断头显 6DoF 自由移动时的表现。（3）真实数据只有 4 个人物、一套采集系统，统计意义有限。（4）论文数字与公开代码或权重之间的复现差距，在 issue 中已有多次讨论，作者的答复在本次调研中未能读取。", "label": "容易误解的地方"}, {"b": "qa", "items": [{"q": "为什么说 Table 3 同时报告 EPE 和 PSNR 很有价值？请用“去掉深度编码器”这一行说明。", "a": "因为它能把“几何问题”和“外观/参数问题”分开。去掉深度编码器后，EPE 从 1.494 变为 1.496，几乎不变，说明深度估计本身没受影响；PSNR 却从 25.05 降到 23.84，LPIPS 从 0.121 升到 0.204。高斯位置没变，渲染却明显变差，问题只能出在尺度、不透明度、旋转这些参数上。结论是：参数回归需要显式的深度上下文。只看 PSNR，你就无法判断退化来自几何还是参数。"}]}, {"b": "sec", "h": "配套文章", "id": "parts"}, {"b": "toc", "groups": [{"items": [{"k": "wpart-gpsgaussian-tensor-trace", "t": "GPS-Gaussian · 张量追踪", "en": "", "s": "逐阶段列出 16 个关键张量的形状与含义。"}, {"k": "wpart-gpsgaussian-experiments", "t": "GPS-Gaussian · 阅读实验", "en": "", "s": "论文里 8 组实验分别怎么读、真正说明了什么。"}, {"k": "wpart-gpsgaussian-tradeoffs", "t": "GPS-Gaussian · 设计权衡", "en": "", "s": "8 个关键设计选择：换来了什么，付出了什么。"}, {"k": "wpart-gpsgaussian-faq", "t": "GPS-Gaussian · 常见问题", "en": "", "s": "初读时最常问的 11 个问题。"}, {"k": "wpart-gpsgaussian-exercises", "t": "GPS-Gaussian · 练习", "en": "", "s": "6 道由浅入深的动手练习。"}, {"k": "wpart-gpsgaussian-glossary", "t": "GPS-Gaussian · 论文术语", "en": "", "s": "读这篇论文会遇到的 26 个术语。"}]}]}], "toc": true, "series": {"prev": {"k": "guide-pixelsplat"}, "next": {"k": "guide-mvsplat"}, "up": {"u": "works/walkthrough/index.html", "t": "Walkthrough 目录"}}}}</script>
<script>
(function () {
  "use strict";
  // ================= lib: DOM, text and math helpers shared by every page =================
  // A page script defines rich(text) (inline cross-links); paras() and eqList() call it.
  var DATA;
  try { DATA = JSON.parse(document.getElementById("data").textContent); } catch (e) { DATA = {}; }
  var meta = DATA.meta || {};

  // ---------- DOM helpers: all text goes through textContent; external links are https-only ----------
  function safeUrl(u) { if (typeof u !== "string") return null; var s = u.trim(); return /^https:\/\/[^\s"'<>]+$/i.test(s) ? s : null; }
  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (!Object.prototype.hasOwnProperty.call(attrs, k)) continue;
      var v = attrs[k];
      if (v === null || v === undefined || v === false) continue;
      if (k === "class") n.className = v;
      else if (k === "text") n.textContent = String(v);
      else if (k === "href") { var u = safeUrl(v); if (u) { n.setAttribute("href", u); n.setAttribute("target", "_blank"); n.setAttribute("rel", "noopener noreferrer"); } }
      else if (k.slice(0, 2) === "on" && typeof v === "function") n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, String(v));
    }
    (kids || []).forEach(function (c) { if (c === null || c === undefined || c === false) return; n.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return n;
  }
  var SVGNS = "http://www.w3.org/2000/svg";
  function sv(tag, attrs, kids) {
    var n = document.createElementNS(SVGNS, tag);
    if (attrs) for (var k in attrs) {
      if (!Object.prototype.hasOwnProperty.call(attrs, k)) continue;
      var v = attrs[k];
      if (v === null || v === undefined || v === false) continue;
      if (k === "text") n.textContent = String(v);
      else if (k.slice(0, 2) === "on" && typeof v === "function") n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, String(v));
    }
    (kids || []).forEach(function (c) { if (c) n.appendChild(c); });
    return n;
  }
  function arr(x) { return Array.isArray(x) ? x : []; }
  function str(x) { return typeof x === "string" ? x : (x === null || x === undefined ? "" : String(x)); }
  function paras(text) { return str(text).split(/\n\s*\n/).map(function (t) { return t.trim(); }).filter(Boolean).map(function (t) { return el("p", null, rich(t)); }); }
  function link(title, url) { return safeUrl(url) ? el("a", { href: url, text: title }) : el("span", { text: title }); }
  function ul(items, map) { return el("ul", { class: "plain" }, arr(items).map(function (x) { return el("li", null, [map ? map(x) : str(x)]); })); }
  function fmtCit(n) { n = Number(n); if (!(n >= 0)) return "—"; if (n >= 1000) return (n / 1000).toFixed(n >= 10000 ? 0 : 1) + "k"; return String(n); }

  // ---------- math (MathJax, typeset lazily) ----------
  var mathReady = false, mathQueue = [];
  function mathUsable() { return !!(window.MathJax && typeof window.MathJax.typesetPromise === "function"); }
  function flushMath() { mathReady = true; var q = mathQueue.slice(); mathQueue = []; q.forEach(typeset); }
  window.__atlasMathReady = flushMath;
  // MathJax may finish loading before this script runs (cached/async), so also poll for it.
  var mathPoll = setInterval(function () { if (mathUsable()) { clearInterval(mathPoll); flushMath(); } }, 200);
  setTimeout(function () { clearInterval(mathPoll); }, 30000);
  function typeset(node) {
    if (!node) return;
    if (!mathReady && mathUsable()) mathReady = true;
    if (!mathReady || !mathUsable()) { mathQueue.push(node); return; }
    try { window.MathJax.typesetPromise([node]).catch(function () { /* leave raw TeX visible */ }); } catch (e) { /* leave raw TeX visible */ }
  }
  function eqList(eqs) {
    eqs = arr(eqs).filter(function (q) { return q && str(q.tex).trim(); });
    if (!eqs.length) return null;
    return el("div", { class: "eqs" }, eqs.map(function (q) {
      return el("div", { class: "eq" }, [el("div", { class: "math-block", text: "\\[" + str(q.tex) + "\\]" }), q.explain_zh ? el("p", null, rich(q.explain_zh)) : null]);
    }));
  }
  document.addEventListener("toggle", function (e) { var t = e.target; if (t && t.tagName === "DETAILS" && t.open) typeset(t); }, true);

  // ================= frame (Tufte site): links, notes, hover previews, top bar, theme =================
  var SITE = DATA.site || {};
  var ROOT = str(SITE.root);
  var XREF = DATA.xref || {};
  function hasX(key) { return Object.prototype.hasOwnProperty.call(XREF, key); }
  // Custom page parts (search tools, diagrams, charts) register here; blocks.js calls them for {"b": "slot"} blocks.
  var SLOTS = {};

  // ---------- internal links: urls are relative to the site root; pages sit at different depths ----------
  var SAFE_PATH = /^[A-Za-z0-9][A-Za-z0-9._\/-]*(\?[A-Za-z0-9=&._-]+)?(#[A-Za-z0-9._-]+)?$/;
  function relHref(u) {
    u = str(u);
    if (/^#[A-Za-z0-9._-]+$/.test(u)) return u;
    if (!SAFE_PATH.test(u)) return null;
    var cut = u.indexOf("#"), path = cut < 0 ? u : u.slice(0, cut);
    if (path === SITE.path) return cut < 0 ? "#" : u.slice(cut);
    return ROOT + u;
  }
  function pageLink(u, text, cls) {
    var h = relHref(u);
    if (!h) return el("span", { class: cls || null, text: text });
    var a = el("a", { class: cls || null, text: text });
    a.setAttribute("href", h);
    return a;
  }
  // A link to a known entry (concept, topic, paper, step...). data-xref drives the hover preview.
  function xlink(key, text, cls) {
    if (!hasX(key)) return text ? document.createTextNode(text) : null;
    var x = XREF[key], a = pageLink(x.u, text || x.n || x.t, cls);
    a.setAttribute("data-xref", key);
    return a;
  }

  // Concept / topic ids mentioned in prose ("见 g-pinhole") become links labelled with the entry's short name.
  var ID_RE = /(a-[a-z0-9]+(?:-[a-z0-9]+)*|[fgdrilnv]-[a-z0-9]+)/g;
  var CJK = /[　-〿㐀-鿿＀-￯]/;
  function rich(text) {
    var s = str(text), out = [], last = 0, m;
    ID_RE.lastIndex = 0;
    while ((m = ID_RE.exec(s)) !== null) {
      var id = m[1], prev = m.index > 0 ? s.charAt(m.index - 1) : "", next = s.charAt(m.index + id.length);
      var key = hasX("concept-" + id) ? "concept-" + id : (hasX("adv-" + id) ? "adv-" + id : null);
      if (!key || /[A-Za-z0-9_\-]/.test(prev) || /[A-Za-z0-9_]/.test(next)) continue;
      // The prose spaces ids off from Chinese text; a Chinese label needs no such space.
      var before = s.slice(last, m.index);
      if (/ $/.test(before) && CJK.test(before.charAt(before.length - 2))) before = before.slice(0, -1);
      if (before) out.push(document.createTextNode(before));
      out.push(xlink(key, null, "xref"));
      last = m.index + id.length;
      if (s.charAt(last) === " " && CJK.test(s.charAt(last + 1))) last++;
    }
    if (last < s.length) out.push(document.createTextNode(s.slice(last)));
    return out;
  }
  function lines(text) { return str(text).split(/\n+/).map(function (t) { return t.trim(); }).filter(Boolean).map(function (t) { return el("p", null, rich(t)); }); }

  // ---------- side notes (numbered) and margin notes (unnumbered); on phones they fold behind a toggle ----------
  var noteSeq = 0;
  function sidenote(kids) {
    var id = "sn-" + (++noteSeq);
    return el("span", { class: "note-wrap" }, [
      el("label", { for: id, class: "margin-toggle sidenote-number", "aria-label": "旁注" }),
      el("input", { type: "checkbox", id: id, class: "margin-toggle" }),
      el("span", { class: "sidenote" }, kids)
    ]);
  }
  function marginnote(kids) {
    var id = "mn-" + (++noteSeq);
    return el("span", { class: "note-wrap" }, [
      el("label", { for: id, class: "margin-toggle", "aria-label": "边注", text: "⊕" }),
      el("input", { type: "checkbox", id: id, class: "margin-toggle" }),
      el("span", { class: "marginnote" }, kids)
    ]);
  }
  function noteLabel(text) { return el("span", { class: "note-label", text: text }); }

  // ---------- article scaffolding ----------
  var main = document.getElementById("main");
  var art = main.querySelector("article");
  function section(id, title, kids) {
    var s = el("section", { id: id }, [title ? el("h2", { text: title }) : null].concat(kids));
    art.appendChild(s);
    return s;
  }
  function articleHead(o) {
    var crumbs = el("nav", { class: "crumbs", "aria-label": "位置" });
    arr(SITE.crumbs).forEach(function (c, i) {
      if (i) crumbs.appendChild(el("span", { class: "sep", text: "›", "aria-hidden": "true" }));
      crumbs.appendChild(c[1] ? pageLink(c[1], c[0]) : el("span", { text: c[0] }));
    });
    art.appendChild(el("header", { class: "art-head" }, [
      crumbs,
      el("h1", { text: o.title }),
      o.subtitle ? el("p", { class: "subtitle", text: o.subtitle }) : null,

          return { left: TY[r.type] || r.type || "", url: r.url, t: r.title, gloss: r.note_zh };
        }))];
        case "refs": return [refsList(arr(b.items), b.cls)];
        case "toc": return tocGroups(b.groups, cur().querySelector("h2") ? "h3" : "h2");
        case "table": return [el("div", { class: "table-wrap" + (b.wide ? " fullwidth" : "") }, [el("table", { class: "booktabs" + (b.cls ? " " + b.cls : "") }, [
          el("thead", null, [el("tr", null, arr(b.head).map(function (h) { return el("th", { text: h }); }))]),
          el("tbody", null, arr(b.rows).map(function (r) { return el("tr", null, arr(r).map(function (c) { return cell("td", c); })); }))
        ])])];
        case "timeline": return [el("ul", { class: "refs timeline" }, arr(b.items).map(function (x) {
          return el("li", null, [el("span", { class: "yr", text: str(x[0]) }), el("div", null, rich(x[1]))]);
        }))];
        case "kv": return [el("table", { class: "kv" }, [el("tbody", null, arr(b.items).map(function (x) {
          return el("tr", null, [el("th", { text: x[0] }), el("td", null, rich(x[1]))]);
        }))])];
        case "mtoc": return [marginToc(b.items)];
        case "slot": return typeof SLOTS[b.name] === "function" ? [SLOTS[b.name](b)] : [];
        default: return [];
      }
    }
    // Long articles: a table of contents at the top of the margin (a folding list on phones).
    function marginToc(items) {
      var d = el("details", { class: "mtoc" }, [el("summary", { text: "本文目录" }), el("ol", null, arr(items).map(function (x) { return el("li", null, [part(x)]); }))]);
      var wide = window.matchMedia("(min-width: 761px)");
      d.open = wide.matches;
      return d;
    }
    arr(PG.body).forEach(function (b) {
      if (b.b === "sec") {
        box = el("section", { id: b.id || null });
        if (b.h) box.appendChild(heading("h2", { t: b.h, sn: b.sn }));
        art.appendChild(box);
        return;
      }
      render(b).forEach(function (n) { if (n) cur().appendChild(n); });
    });

    var S = PG.series || {};
    if (S.prev || S.next || S.up) {
      var nav = el("nav", { class: "series", "aria-label": "同系列" });
      nav.appendChild(el("div", { class: "prev" }, S.prev ? [el("small", { text: "上一篇" }), part(S.prev)] : []));
      nav.appendChild(el("div", { class: "up" }, S.up ? [part(S.up)] : []));
      nav.appendChild(el("div", { class: "next" }, S.next ? [el("small", { text: "下一篇" }), part(S.next)] : []));
      art.appendChild(nav);
    }
  })();

  finishPage();
})();
</script>
