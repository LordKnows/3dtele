/* ---------- fonts: ET Book for Latin (self-hosted), Noto Serif SC for Chinese text, LXGW WenKai for notes ---------- */
/* ET Book leaves curly quotes, dashes and ellipses to the Chinese font so they keep full width in Chinese prose,
   and single guillemets (› ‹), which it lacks. */
@font-face { font-family: "et-book"; font-weight: 400; font-style: normal; font-display: swap;
  src: url("../../fonts/et-book/et-book-roman-line-figures.woff") format("woff");
  unicode-range: U+0000-2013, U+2015-2017, U+201A-201B, U+201E-2025, U+2027-2038, U+203B-FFFF; }
@font-face { font-family: "et-book"; font-weight: 400; font-style: italic; font-display: swap;
  src: url("../../fonts/et-book/et-book-display-italic-old-style-figures.woff") format("woff");
  unicode-range: U+0000-2013, U+2015-2017, U+201A-201B, U+201E-2025, U+2027-2038, U+203B-FFFF; }
@font-face { font-family: "et-book"; font-weight: 700; font-style: normal; font-display: swap;
  src: url("../../fonts/et-book/et-book-bold-line-figures.woff") format("woff");
  unicode-range: U+0000-2013, U+2015-2017, U+201A-201B, U+201E-2025, U+2027-2038, U+203B-FFFF; }
/* Notes pair Latin italic with upright Kai (the "italic ↔ 楷体" rule): the italic cut is registered as an upright
   family so the browser never slants the Chinese glyphs. */
@font-face { font-family: "et-book-note"; font-weight: 400; font-style: normal; font-display: swap;
  src: url("../../fonts/et-book/et-book-display-italic-old-style-figures.woff") format("woff");
  unicode-range: U+0000-2013, U+2015-2017, U+201A-201B, U+201E-2025, U+2027-2038, U+203B-FFFF; }
@font-face { font-family: "et-book-osf"; font-weight: 400; font-style: normal; font-display: swap;
  src: url("../../fonts/et-book/et-book-roman-old-style-figures.woff") format("woff"); }

:root {
  --bg: #fffff8;
  --ink: #111111;
  --ink-2: #3c3c36;
  --muted: #74746a;
  --rule: #d8d6c8;
  --rule-2: #b9b6a4;
  --accent: #a8322d;
  --serif: "et-book", "Noto Serif SC", "Source Han Serif SC", "Songti SC", "STSong", "SimSun", Palatino, Georgia, serif;
  --note: "et-book-note", "LXGW WenKai", "Kaiti SC", "STKaiti", "KaiTi", "et-book", serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --side: clamp(12rem, 21vw, 17rem);
  --gap: 2.75rem;
  --main: calc(100% - var(--side) - var(--gap));
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161614; --ink: #e2e0d6; --ink-2: #c3c1b6; --muted: #979589; --rule: #34332e; --rule-2: #4d4b44; --accent: #e8836f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161614; --ink: #e2e0d6; --ink-2: #c3c1b6; --muted: #979589; --rule: #34332e; --rule-2: #4d4b44; --accent: #e8836f;
  color-scheme: dark;
}

/* ---------- base ---------- */
* { box-sizing: border-box; }
html { font-size: 16px; -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--serif); font-size: 1.15625rem; line-height: 1.85;
  font-kerning: normal; font-variant-numeric: lining-nums;
  /* Space between Chinese and Latin text where the source has none; squeeze adjacent CJK punctuation
     (text-spacing-trim applies the fonts' halt / chws features). Browsers without them keep the source spacing. */
  text-autospace: normal; text-spacing-trim: normal;
  overflow-wrap: break-word;
  padding-top: env(safe-area-inset-top, 0px);
}
[hidden] { display: none !important; }
a { color: inherit; text-decoration-line: underline; text-decoration-thickness: 1px; text-underline-offset: .18em; text-decoration-color: var(--rule-2); }
a:hover { color: var(--accent); text-decoration-color: currentColor; }
a:focus-visible, button:focus-visible, summary:focus-visible, label:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }
.skip { position: absolute; left: -999px; top: 0; }
.skip:focus { left: 1rem; top: .5rem; background: var(--bg); padding: .2rem .5rem; z-index: 60; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
p { margin: 0; }
p + p { margin-top: .9em; }

/* ---------- top bar ---------- */
.topbar { border-bottom: 1px solid var(--rule); }
.bar-in { max-width: 67rem; margin: 0 auto; padding: 0 1.5rem; display: flex; align-items: center; gap: 2.2rem; min-height: 3.1rem; }
.brand { font-size: 1rem; text-decoration: none; letter-spacing: .02em; white-space: nowrap; }
.site-nav { flex: 1; }
.menus { list-style: none; margin: 0; padding: 0; display: flex; gap: 1.6rem; }
.menu { position: relative; }
.menu-btn, .theme-btn, .burger {
  font-family: "et-book", var(--serif); font-variant-caps: all-small-caps; letter-spacing: .08em; font-size: 1.12rem;
  color: var(--ink-2); line-height: 3.1rem;
}
.menu-btn:hover, .theme-btn:hover, .burger:hover, .menu.open > .menu-btn { color: var(--accent); }
.menu.cur > .menu-btn { color: var(--ink); box-shadow: inset 0 -1px 0 var(--ink); }
.drop {
  display: none; position: absolute; left: -1rem; top: 100%; z-index: 40; min-width: 13rem;
  list-style: none; margin: 0; padding: .45rem 0; background: var(--bg); border: 1px solid var(--rule);
}
.menu.open > .drop { display: block; }
.drop a { display: block; padding: .15rem 1rem; text-decoration: none; font-size: 1.02rem; color: var(--ink-2); white-space: nowrap; }
.drop a:hover, .drop a:focus-visible { color: var(--accent); }
.drop a.cur { color: var(--ink); }
.drop a.cur::before { content: "›"; position: absolute; margin-left: -.7rem; color: var(--accent); }
.theme-btn { margin-left: auto; }
.burger { display: none; }

/* ---------- article column + margin ---------- */
main { display: block; }
.art { max-width: 67rem; margin: 0 auto; padding: 2.6rem 1.5rem 3rem; counter-reset: sidenote-counter; }
.art > *, .art section > * { width: var(--main); }
.art > section { width: 100%; }
.art .fullwidth { width: 100%; }
section { padding-top: .6rem; }

.crumbs { font-size: .86rem; color: var(--muted); letter-spacing: .01em; }
.crumbs a { color: var(--muted); text-decoration: none; }
.crumbs a:hover { color: var(--accent); }
.crumbs .sep { margin: 0 .45em; color: var(--rule-2); }
h1, h2, h3 { font-family: var(--serif); color: var(--ink); text-wrap: balance; }
h1 { font-size: 2.3rem; font-weight: 400; line-height: 1.3; margin: .9rem 0 0; letter-spacing: .01em; }
.subtitle { font-family: "et-book", var(--note); font-style: italic; font-size: 1.45rem; line-height: 1.3; color: var(--ink-2); margin-top: .35rem; }
.meta { font-size: .92rem; color: var(--muted); margin-top: 1.1rem; }
.meta a { color: var(--muted); }
h2 { font-size: 1.42rem; font-weight: 600; line-height: 1.4; margin: 2.6rem 0 .9rem; }
h3 { font-size: 1.12rem; font-weight: 600; line-height: 1.5; margin: 1.8rem 0 .5rem; }
h3 .used { font-family: var(--note); font-weight: 400; font-size: .86rem; color: var(--muted); margin-left: .6em; }

.epigraph { margin: 2.2rem 0 .6rem; }
.epigraph blockquote { margin: 0; padding: 0 0 0 1.6rem; border-left: 1px solid var(--rule-2); }
.epigraph p { font-family: var(--note); font-size: 1.12rem; line-height: 1.85; color: var(--ink-2); }

.art ol, .art ul { margin: .6rem 0 0; padding-left: 1.6em; }
.art li + li { margin-top: .45rem; }
li::marker { font-family: "et-book-osf", var(--serif); color: var(--muted); }

/* Equations: display math in the text column, scrolling sideways on narrow screens. */
.eqs { display: block; }
.eq + .eq { margin-top: 1.6rem; }
.math-block { overflow-x: auto; overflow-y: hidden; margin: .4rem 0 .6rem; padding: .2rem 0; font-size: 1rem; }
.math-block mjx-container { margin: 0 !important; }

/* ---------- side notes & margin notes (floated into the right margin) ---------- */
.sidenote, .marginnote {
  float: right; clear: right; position: relative;
  width: var(--side); margin-right: calc(-1 * (var(--side) + var(--gap))); margin-top: .3rem; margin-bottom: .6rem;
  font-family: var(--note); font-size: .88rem; line-height: 1.6; color: var(--ink-2); text-align: left;
  font-style: normal; font-weight: 400; letter-spacing: 0;
}
h3 .sidenote { margin-top: .2rem; }
.sidenote-number { counter-increment: sidenote-counter; }
.sidenote-number::after, .sidenote::before { font-family: "et-book-osf", var(--serif); position: relative; vertical-align: baseline; }
.sidenote-number::after { content: counter(sidenote-counter); font-size: .75rem; top: -.55em; left: .08em; color: var(--ink-2); }
.sidenote::before { content: counter(sidenote-counter) " "; font-size: .8rem; top: -.4em; }
.note-label { font-family: var(--serif); font-weight: 600; font-size: .82rem; color: var(--muted); margin-right: .5em; }
.marginnote .note-label { display: block; margin: 0 0 .1rem; }
input.margin-toggle { display: none; }
label.sidenote-number { display: inline; cursor: default; }
label.margin-toggle:not(.sidenote-number) { display: none; }

/* ---------- quiz, further reading, series ---------- */
.quiz details { margin-top: .3rem; }
.quiz summary { font-family: var(--note); font-size: .92rem; color: var(--muted); cursor: pointer; list-style: none; display: inline-block; }
.quiz summary::-webkit-details-marker { display: none; }
.quiz summary::before { content: "+ "; font-family: "et-book", var(--serif); }
.quiz details[open] summary::before { content: "− "; }
.quiz summary:hover { color: var(--accent); }
.quiz details > p { margin-top: .3rem; padding-left: 1rem; border-left: 1px solid var(--rule); color: var(--ink-2); }

/* Reference lists: a narrow label column (kind / year) and a hanging text column. */
.art ul.refs { list-style: none; padding-left: 0; }
.refs li { display: grid; grid-template-columns: 2.8rem minmax(0, 1fr); column-gap: .5rem; line-height: 1.6; }
.refs li > :not(.kind):not(.yr) { grid-column: 2; }
.refs .kind, .refs .yr { grid-column: 1; font-family: var(--note); font-size: .86rem; color: var(--muted); padding-top: .12rem; }
.refs .yr { font-family: "et-book-osf", var(--serif); font-size: .95rem; padding-top: .05rem; }
.refs .en { font-family: "et-book", var(--serif); font-style: italic; color: var(--muted); font-size: .92rem; line-height: 1.5; }
.refs .gloss { font-family: var(--note); font-size: .88rem; color: var(--ink-2); margin-top: .1rem; }
.art .refs li + li { margin-top: .75rem; }
.art .papers li + li { margin-top: .35rem; }
.refs.noleft li { grid-template-columns: minmax(0, 1fr); }
.refs.noleft li > * { grid-column: 1; }
.refs .used { font-family: var(--note); font-size: .82rem; color: var(--muted); margin-left: .5em; }
.refs.terms .plain-t { font-weight: 600; }
.refs.terms .en { display: inline; margin-left: .6em; }
.timeline li { line-height: 1.7; }
.art .timeline li + li { margin-top: .4rem; }

/* ---------- blocks: lede, run-in labels, notes ---------- */
.lede { margin-top: 1.6rem; color: var(--ink-2); }
.run-in { font-weight: 600; color: var(--ink); }
p.note { font-family: var(--note); font-size: .9rem; color: var(--muted); margin-top: .1rem; }
h2 .en, h3 .en { font-family: "et-book", var(--serif); font-style: italic; font-weight: 400; color: var(--muted); margin-left: .6em; font-size: .92em; }
h2 a, h3 a { text-decoration-color: var(--rule); }
.quiz-h { font-family: var(--note); font-size: .88rem; color: var(--muted); margin-top: 1.4rem; }
.quiz-h + ol.quiz { margin-top: .2rem; }

/* Index pages: a table of contents instead of a card grid. */
.art ol.toc { list-style: none; padding-left: 0; margin-top: .4rem; }
.art ol.toc > li + li { margin-top: .85rem; }
.toc-t { line-height: 1.55; }
.toc-t .en { font-family: "et-book", var(--serif); font-style: italic; color: var(--muted); margin-left: .6em; font-size: .95em; }
.toc-meta { font-family: var(--note); font-size: .82rem; color: var(--muted); margin-left: .7em; white-space: nowrap; }
.toc-s { font-family: var(--note); font-size: .9rem; line-height: 1.65; color: var(--ink-2); margin-top: .1rem; }
.toc-lede { font-family: var(--note); color: var(--ink-2); font-size: .95rem; }
h2.toc-h, h3.toc-h { margin-bottom: .3rem; }

/* Tables: booktabs rules (top, under the header, bottom), no vertical lines, no fills. */
.table-wrap { overflow-x: auto; margin: 1rem 0; }
table.booktabs { border-collapse: collapse; width: 100%; font-size: .9rem; line-height: 1.6; border-top: 1.5px solid var(--ink); border-bottom: 1.5px solid var(--ink); }
table.booktabs th { text-align: left; font-weight: 600; padding: .45rem .7rem .35rem 0; border-bottom: 1px solid var(--ink); white-space: nowrap; vertical-align: bottom; }
table.booktabs td { padding: .45rem .9rem .45rem 0; vertical-align: top; border-top: 1px solid var(--rule); }
table.booktabs tbody tr:first-child td { border-top: 0; }
table.rank td { white-space: nowrap; font-variant-numeric: tabular-nums; }
table.rank td:nth-child(2) { white-space: normal; }
.art table.kv { border-collapse: collapse; margin: .6rem 0; font-size: .95rem; width: auto; }
table.kv th { text-align: left; font-weight: 400; color: var(--muted); padding: .25rem 1.2rem .25rem 0; vertical-align: top; min-width: 5em; max-width: 12em; font-family: var(--note); }
table.kv td { padding: .25rem 0; vertical-align: top; }

/* Long articles: the table of contents sits at the top of the margin. */
/* It sits in a full-width section, so it floats into the margin without a negative offset. */
details.mtoc {
  float: right; clear: right; width: var(--side); margin-right: 0; margin-bottom: 1rem;
  font-family: var(--note); font-size: .86rem; line-height: 1.55; color: var(--ink-2);
}
details.mtoc summary { font-family: var(--serif); font-weight: 600; font-size: .82rem; color: var(--muted); list-style: none; cursor: default; }
details.mtoc summary::-webkit-details-marker { display: none; }
.art details.mtoc ol { list-style: none; padding: 0; margin: .3rem 0 0; }
.art details.mtoc li + li { margin-top: .25rem; }
details.mtoc a { text-decoration: none; }
details.mtoc a:hover { text-decoration: underline; }

/* Tools: search and filters with underlined inputs. */
.tool { margin-top: 1rem; }
.filters { display: flex; flex-wrap: wrap; gap: .6rem 1.6rem; align-items: baseline; font-family: var(--note); font-size: .92rem; color: var(--muted); }
.filters label { display: inline-flex; gap: .5rem; align-items: baseline; }
.filters input, .filters select {
  font: inherit; color: var(--ink); background: transparent; border: 0; border-bottom: 1px solid var(--rule-2); border-radius: 0;
  padding: .15rem .1rem; min-width: 7rem;
}
.filters input[type="search"] { min-width: 14rem; }
.filters select { max-width: 16rem; }
.filters input:focus, .filters select:focus { outline: none; border-bottom-color: var(--accent); }
.filters select option { background: var(--bg); color: var(--ink); }
.filters .count { margin-left: auto; font-family: var(--mono); font-size: .8rem; }
table.gl td.en { font-family: "et-book", var(--serif); width: 20%; }
table.gl .abbr { color: var(--muted); }
table.gl td.zh { white-space: nowrap; }
table.gl td.def { color: var(--ink-2); min-width: 20rem; }
table.gl td.c { font-size: .85rem; min-width: 9rem; padding-right: 0; }
table.gl tr:target td { background: color-mix(in srgb, var(--accent) 8%, transparent); }
table.db td.y { font-family: "et-book-osf", var(--serif); white-space: nowrap; }
table.db td.t { min-width: 16rem; }
table.db td.t small { display: block; color: var(--muted); font-size: .8rem; line-height: 1.45; margin-top: .15rem; }
table.db td.tags { min-width: 7rem; font-family: var(--note); font-size: .8rem; color: var(--muted); }
table.db td.tags span { display: block; }
table.db .tier.milestone { color: var(--ink); font-weight: 600; }
table.db td.s { min-width: 18rem; color: var(--ink-2); }
table.db td.n { min-width: 12rem; font-size: .82rem; color: var(--ink-2); }

/* Figures: the pipeline diagram and the timeline of classic papers, drawn in ink with one accent for interaction. */
figure { margin: 1.4rem 0; }
svg a { text-decoration: none; }
.diagram-wrap, .lanes-wrap { position: relative; overflow-x: auto; }
svg.diagram { width: 100%; min-width: 760px; height: auto; display: block; font-family: var(--note); }
svg.diagram .dnode rect { fill: var(--bg); stroke: var(--ink-2); stroke-width: 1; }
svg.diagram .dnode rect.data { stroke-dasharray: 4 3; }
svg.diagram .dnode:hover rect, svg.diagram .dnode:focus rect { stroke: var(--accent); stroke-width: 1.5; }
svg.diagram .dnode:focus { outline: none; }
svg.diagram text { fill: var(--ink); }
svg.diagram text.k { font-family: var(--mono); font-size: 10px; fill: var(--muted); }
svg.diagram text.t { font-family: var(--serif); font-size: 13px; font-weight: 600; }
svg.diagram text.s { font-size: 11px; fill: var(--ink-2); }
svg.diagram .dedge { fill: none; stroke: var(--ink-2); stroke-width: 1; }
svg.diagram .dedge.fb { stroke-dasharray: 4 3; }
svg.diagram .dhead { fill: var(--ink-2); }
svg.diagram .dloop { fill: none; stroke: var(--rule-2); stroke-dasharray: 2 3; }
svg.diagram .dlabel { font-size: 12px; fill: var(--muted); }
svg.diagram .dnote { font-size: 11px; fill: var(--muted); }
svg.diagram a.dnode:hover .dnote { fill: var(--accent); }
svg.lanes { width: 100%; min-width: 720px; height: auto; display: block; font-family: var(--note); }
svg.lanes .grid { stroke: var(--rule); stroke-width: 1; }
svg.lanes .axis { font-family: "et-book-osf", var(--serif); font-size: 12px; fill: var(--muted); }
svg.lanes .lane-l { font-size: 12px; fill: var(--ink-2); }
svg.lanes .brk { stroke: var(--muted); fill: none; }
svg.lanes .hit { fill: transparent; }
svg .dot { fill: var(--ink); }
svg .dot.hollow { fill: var(--bg); stroke: var(--ink-2); stroke-width: 1.2; }
svg.lanes a.m:hover .dot, svg.lanes a.m:focus .dot { fill: var(--accent); stroke: var(--accent); }
svg.lanes a.m:focus { outline: none; }
.vtip { position: absolute; z-index: 20; max-width: 20rem; padding: .45rem .7rem; background: var(--bg); border: 1px solid var(--rule-2); font-family: var(--note); font-size: .82rem; line-height: 1.5; pointer-events: none; }
.vtip b { display: block; font-family: "et-book", var(--serif); font-weight: 400; font-size: .92rem; }
.vtip small { display: block; color: var(--muted); }
.vtip span { color: var(--accent); }
figcaption { font-family: var(--note); font-size: .85rem; color: var(--muted); margin-top: .4rem; }
figcaption svg { vertical-align: -1px; }

.series { display: grid; grid-template-columns: 1fr auto 1fr; gap: 1rem; align-items: end; margin-top: 3.2rem; padding-top: 1rem; border-top: 1px solid var(--rule); font-size: .98rem; }
.series small { display: block; font-family: var(--note); font-size: .8rem; color: var(--muted); }
.series .up { text-align: center; font-size: .88rem; }
.series .up a { color: var(--muted); }
.series .next { text-align: right; }

.site-foot { max-width: 67rem; margin: 0 auto; padding: 1.2rem 1.5rem 2.5rem; font-size: .82rem; color: var(--muted); }
.site-foot a { color: var(--muted); text-decoration: none; }

/* ---------- hover preview ---------- */
.xtip {
  position: absolute; z-index: 50; max-width: min(22rem, calc(100vw - 16px)); padding: .55rem .8rem .6rem;
  background: var(--bg); border: 1px solid var(--rule-2); color: var(--ink);

}

quark", "head": {"title": "Quark 导读", "sub": "Quark: Real-time, High-resolution, and General Neural View Synthesis", "meta": ["12 步", {"k": "anchor-quark", "t": "Quark 精读"}], "epigraph": "", "prereqs": [], "lede": "", "minutes": 39}, "body": [{"b": "sec", "h": null, "id": "story"}, {"b": "mtoc", "items": [{"u": "#walk-quark-q1", "t": "Q1 问题设定与输入：M=8 个最近视角，近/远平面由 SfM 点估计"}, {"u": "#walk-quark-q2", "t": "Q2 输入编码：残差 CNN 特征金字塔 + 射线方向编码 γ"}, {"u": "#walk-quark-q3", "t": "Q3 LDM 表示与深度参数化：等视差锚点，每层只能在自己的视差带内移动"}, {"u": "#walk-quark-q4", "t": "Q4 学习式初始化：可学习特征广播 + back-projection 到锚定平面"}, {"u": "#walk-quark-q5", "t": "Q5 Render：把当前 LDM 双线性 splat 到每个输入视角并 over 合成得到 Ĩ"}, {"u": "#walk-quark-q6", "t": "Q6 Update：比较 Ĩ 与观测特征，生成逐视角 update feature，再按当前深度反投影成 Δ"}, {"u": "#walk-quark-q7", "t": "Q7 Fuse：One-to-many attention 跨视角融合（含 W^K/W^V 折叠技巧）"}, {"u": "#walk-quark-q8", "t": "Q8 由粗到细：分辨率翻倍 + Layer Collapse（24 层 36×64 → 6 层 288×512）"}, {"u": "#walk-quark-q9", "t": "Q9 上采样后再激活（post-activation，借鉴 ReLU Fields）"}, {"u": "#walk-quark-q10", "t": "Q10 IBR 混合与 over 合成：全分辨率输入像素的凸组合"}, {"u": "#walk-quark-q11", "t": "Q11 训练：数据混合、10·L1 + LPIPS、两阶段分辨率、学习率日程"}, {"u": "#walk-quark-q12", "t": "Q12 如何读实验、运行时间与消融"}]}, {"b": "p", "t": "先看问题。远程临场（telepresence）或自由视点视频要求这样一件事：几台固定相机在拍，观众的头在动，系统要在每一帧、每一个观众视角上立刻合成一张照片级的新视角图像。NeRF 和 3DGS 的渲染可以做到实时，但前提是先花几分钟到几小时对每个场景做离线优化。视频里的场景每帧都在变，这条路走不通。Quark 给自己定的目标是：输入 8 路已标定、彼此最远相距约 30 cm 的相机，把“重建 + 渲染”合在一起放进 33 ms 以内，在单张 A100 上输出 1080p/30fps，而且不对任何场景单独训练，要能跨数据集泛化。\n\n第一个关键想法：没必要重建一个完整的 3D 世界，只需要为“当前这一个目标视角”准备刚好够用的几何。Quark 在目标相机的视锥里放几层可以弯曲的“深度片”，也就是分层深度图 LDM。每层每个像素有三样东西：深度、不透明度 σ，以及“这里的颜色该从 8 张输入照片里各取多少”的混合权重 β。颜色本身直接从全分辨率的真实照片里取，这就是基于图像的渲染（IBR）。于是网络只需在低分辨率上回答两个问题：“表面在哪里”和“从哪张图取色”。第二个关键想法来自同一第一作者 2019 年的 DeepView（Flynn et al. 2019）：求这个 LDM 可以像梯度下降一样，先猜一个解，把它渲染回每张输入照片的视角，和真实照片对比，再按差异修正。不同的是，每一步修正由网络学出来，大约 5 步就收敛，而经典优化要上千步。\n\n具体方案是把这种 render-and-refine 嵌进一个 UNet 式的金字塔。迭代从 24 层 × 36×64 的极低分辨率开始，到 6 层 × 288×512 结束：早期用很多层密集扫描深度，把表面“找出来”；后期层数减半再减半（layer collapse），同时空间分辨率翻倍，让少数几层“贴着”表面走。每一步把 8 个视角的信息融合起来，用的是 One-to-many attention：每个 LDM 元素作为唯一的 query，对 8 个视角做 cross-attention，并把 K/V 投影矩阵代数地折叠进 Q 和输出投影，这样对 8 个视角完全不做矩阵乘。最后把未激活的深度、不透明度和混合 logits 双线性放大 3.75 倍，再过非线性（post-activation），边缘可以保持锐利。最终的 IBR 合成在 CUDA 上约 1.3 ms。\n\n效果是：在 RFF、Shiny 和动态的 N3DV 上，Quark 全面超过可泛化基线 ENeRF、GPNR、SIMPLI，速度分别快 6 倍、700 倍和 100 倍以上；在 DL3DV 协议下，它甚至略高于需要逐场景优化的 Zip-NeRF 和 3DGS（31.31 对 31.22 和 29.82）。代价也很明确。第一，逐帧独立求解、没有时间状态，目标视角移动引起输入相机集合切换时会闪烁。第二，颜色只是输入像素的凸组合，对输入之间的曝光、焦距差异和标定误差很敏感，出错时是硬边而不是模糊（§4.3）。第三，只用最近 8 个视角，覆盖不足时会失败，Deep Blending 上是 23.61 对 3DGS 的 30.04。第四，LDM 只属于某一个目标视角，双目 VR 要跑两遍，多个观众要跑多遍（论文没有讨论这一点，这是由其设计推出的）。第五，不论输出分辨率多大，内部 LDM 每层的像素数大致固定（§4.1），2K 输出依赖上采样；2048×1536 下 RFF 的 LPIPS 为 0.233，而 1024×768 下为 0.137（两者评测分辨率不同，不能严格对比）。第六，论文和项目页都没有给出代码链接。\n\n读这篇论文时，可以对照一张“基础知识映射”：针孔相机与视差（g-pinhole、g-depth）决定了 LDM 放在哪里、层怎样按等视差排列；平面扫描与多视角立体（i-psv、d-mvs）解释了初始化和反投影 Δ 为什么能找到表面；splatting 与 over 合成（r-raster、r-alpha）就是 Render to Input Views 和最终合成的全部内容；学习式迭代（l-iterative、f-optim）解释了“渲染—比较—更新”为什么类似于展开的（学习化）梯度下降；注意力（l-attention）加上一点线性代数（f-linalg）就能推出 K/V 折叠；图像插值（f-image）解释了 post-activation 为什么能保边；IBR 混合（i-blending）则决定了 Quark 的上限和典型失败方式。下面 12 步按论文的数据流展开，每一步都标出用到哪块基础。"}, {"b": "sec", "h": "流水线", "id": "pipeline"}, {"b": "p", "t": "点击方框跳到对应步骤。"}, {"b": "slot", "name": "diagram", "which": "quark"}, {"b": "sec", "h": "读之前先掌握", "id": "before"}, {"b": "refs", "items": [{"k": "concept-g-pinhole", "gloss": "Quark 每一步都在“目标视锥中的 LDM 元素 ↔ 3D 点 ↔ 输入图像像素”之间换算（Bp、Render、IBR 采样都要用 K、[R|t] 做投影与反投影）。不熟悉内外参和反投影，Eq.1、Eq.2 里的投影算子 P、P^T 就只是符号。"}, {"k": "concept-g-depth", "gloss": "Eq.3–4 把每层深度约束在近/远平面 η、f 之间的等视差带内，这背后是“视差 ∝ 1/深度、近处需要更密的采样”。另外，在“纯平移、归一化图像坐标”的特例下，射线方向编码的 2D 差向量恰好等于基线乘以视差范围 (1/η−1/f)。这是本导读的推导，论文没有给出。"}, {"k": "concept-g-epipolar", "gloss": "初始化时把特征反投影到平面上等价于平面诱导单应；按本导读的几何解释，射线编码量的是一条输入射线在目标图像上投出的极线段。理解极线才能看懂“为什么与目标射线重合时编码为 0”。"}, {"k": "concept-f-image", "gloss": "特征金字塔、双线性采样和 splat、3.75× 双线性上采样，以及“先插值再激活”为什么能保边，都是数字图像采样与插值的问题。"}, {"k": "concept-r-alpha", "gloss": "LDM 的渲染就是按 σ 由后向前做 over 合成：中间步骤在输入视角里合成 Ĩ，最终在目标视角合成 RGB 和深度。"}, {"k": "concept-r-raster", "gloss": "Render to Input Views 用双线性 splat（前向点溅射）代替光线追踪或光栅化。需要知道 splat 与 gather（后向采样）的区别，以及二者互为转置。"}, {"k": "concept-i-layered", "gloss": "Quark 的核心表示是 LDM，它是 MPI（平面层）与分层网格 LM 之间的折中。不了解 MPI/LDI/LDM 的谱系，很难理解作者为什么这样选。"}, {"k": "concept-i-psv", "gloss": "初始化的 Bp 和每步的 Δ 都是平面扫描体（PSV）思想的变体：把多视角特征堆到同一 3D 位置，看它们是否一致。"}, {"k": "concept-i-blending", "gloss": "Quark 最终不回归 RGB，而是对 8 张全分辨率输入图做逐层逐像素的凸组合（β）。这是 ULR 类混合权重的学习版，也决定了它对曝光与标定误差敏感。"}, {"k": "concept-l-iterative", "gloss": "5 步 Update & Fuse 是 DeepView 的学习式梯度下降（展开优化）。看懂“渲染—比较—反投影—更新”与梯度 J^T·残差的对应关系，是理解 Quark 的主线。"}, {"k": "concept-l-attention", "gloss": "Fusion Block 是 pre-LN Transformer 结构，One-to-many attention 是单 query 对 M 个视角的 cross-attention。必须熟悉 Q/K/V、多头和输出投影，才能推出 Eq.8 的折叠技巧。"}, {"k": "concept-l-encoding", "gloss": "射线方向编码 γ 用 tanh 加 8 个 octave 的正弦编码，替代 Transformer 的位置编码。需要知道傅里叶特征为什么能提高网络对小差异的分辨能力。"}]}, {"b": "sec", "h": "Q1 · 问题设定与输入：M=8 个最近视角，近/远平面由 SfM 点估计", "id": "walk-quark-q1", "sn": {"label": "论文位置", "t": "§1 Introduction；§3.4 Training（视角选择）及其后的数据集段（近/远平面按 SfM 点逐样本设定）；§4.1（每 8 张取 1 张作目标；按相机中心 L2 距离选视角；Deep Blending 的改进启发式）；Fig. 1"}}, {"b": "p", "t": "输入：离目标视角最近的 M=8 张 RGB 图像，每张的内参 K_m 与外参 [R_m|t_m]，目标相机的内外参，以及目标视锥的近平面 η 与远平面 f。输出：目标视角的 RGB 图像（论文主打 1920×1080），可选输出深度图。每帧、每个目标视角独立执行一遍，不保留任何状态。", "label": "这一步做什么", "mn": {"label": "需要的基础", "links": [{"k": "concept-g-pinhole"}, {"k": "concept-g-sfm"}, {"k": "concept-g-depth"}, {"k": "concept-g-rig"}, {"k": "concept-n-generalizable"}]}}, {"b": "p", "t": "先用针孔模型（g-pinhole）把任务说清楚。每台相机用 x ≃ K[R|t]X 把 3D 点 X 投到像素 x。只要所有相机参数已知（论文里来自数据集或 COLMAP 这类 SfM，见 g-sfm），就能在“像素—射线—3D 点”之间自由换算。Quark 不估计相机，它假设标定准确（g-rig）；标定有误时，它会产生错误的硬边，而不是柔和的模糊（§4.3）。\n\n然后是两个“场景范围”参数。视角选择：按相机中心的欧氏距离挑最近的 8 个；训练时从最近的 16 个中随机抽 8 个（§3.4；论文没有说明动机，可以理解为一种数据增强）。近/远平面 η、f：每个样本根据 SfM 重建的稀疏点深度分布自适应设定，论文没有给出具体分位数规则。它们规定了 LDM 能表示的深度区间（g-depth），区间外的物体根本无法表示。\n\n为什么是“最近 8 个”：运行时间约为 T_V + M·T_image，随 M 线性增长（附录 B），8 是实时预算下的折中。近邻视角与目标视角的视差小、遮挡关系相似，IBR 取色也更可靠。反面教材是 Deep Blending：最近 8 个相机覆盖不足，即使改用同时考虑视角夹角的启发式，仍出现硬边伪影。", "mn": {"label": "类比", "t": "好比一位摄影师接到订单“从这个位置给我一张照片”，他不去重建整栋房子，只翻出离这个位置最近的 8 张照片来拼。"}}, {"b": "eqs", "eqs": [{"tex": "\\tilde{\\mathbf{x}}_m \\simeq K_m\\,[\\,R_m \\mid \\mathbf{t}_m\\,]\\,\\tilde{\\mathbf{X}}", "explain_zh": "针孔投影。X̃ 是齐次世界坐标 (X,Y,Z,1)；R_m（3×3 旋转）和 t_m（3 维平移）把世界坐标变到第 m 台相机坐标系；K_m（3×3 内参，含焦距与主点）再映射到像素；≃ 表示相差一个尺度因子，即要做透视除法。Quark 的所有投影和反投影都建立在这个式子上。"}, {"tex": "\\mathcal{S}_t = \\{\\, m : \\lVert \\mathbf{o}_m - \\mathbf{o}_t \\rVert_2 \\ \\text{is among the 8 smallest} \\,\\}", "explain_zh": "视角选择规则的形式化（论文用文字描述）。o_m 是输入相机 m 的光心，o_t 是目标相机光心；取欧氏距离最小的 8 个。训练时先取最近 16 个，再从中随机抽 8 个。"}, {"tex": "\\frac{1}{z} \\in \\left[\\frac{1}{f},\\ \\frac{1}{\\eta}\\right]", "explain_zh": "LDM 的全部可表示范围，用视差（逆深度）表示。z 是目标相机坐标系中的深度，η 是近平面，f 是远平面（注意这里的 f 不是焦距）。后面的 Eq.3–4 把这个区间等分成 L 份。"}]}, {"b": "p", "t": "M=8（训练时从最近 16 个中随机抽 8 个；另有支持 4–16 张输入的可变版本）。输入间距最大约 30 cm；Spaces 实验的基线约 10/20/30 cm。评测时每 8 张取 1 张作目标，目标图不参与输入。N3DV 协议：裁到 300 帧，每 10 帧评一次，以 0 号相机为目标。输出 1920×1080；单张 A100 上重建加渲染 30 fps。", "label": "具体数字"}, {"b": "p", "t": "作者在 §2.3 明确排除单图、单目、生成式和人体先验方法，认为多视角方法质量更高、泛化更广。只取局部视角、不用全部视角做全局优化，是为了保证逐帧实时；NeRF/3DGS 式的全局优化需要离线计算。近/远平面取自 SfM 点而不是让网络预测。论文没有解释原因，合理的解读是：这样能让等视差采样覆盖场景的实际深度范围。作者把学习式视角选择列为未来工作。", "label": "为什么这样设计"}, {"b": "p", "t": "（1）“实时”指重建加渲染的网络时间，不含采集、解码、标定和传输。（2）近/远平面在训练和评测时来自 SfM 点，实时系统里怎么在线获取，论文没有讨论；固定的 telepresence 舱体可以直接用固定值。（3）8 个视角是按目标视角选的，目标一移动，输入集合就可能切换，这正是闪烁的来源之一。（4）Quark 的“稀疏宽基线”指 8 张图、最远约 30 cm，不是 2–3 张环绕 360° 的极稀疏设定。", "label": "容易误解的地方"}, {"b": "qa", "items": [{"q": "场景完全静止，只是目标相机缓慢平移，为什么 Quark 的输出仍可能突然跳变？", "a": "输入集合按相机中心距离重新挑选最近的 8 个。集合一变，blend weights 混合的就是另一组照片，曝光和噪声都不同；而且每帧独立重建、没有时间状态，前后帧之间没有任何平滑约束，所以会出现跳变或闪烁（§4.1 末、§4.3）。"}]}, {"b": "sec", "h": "Q2 · 输入编码：残差 CNN 特征金字塔 + 射线方向编码 γ", "id": "walk-quark-q2", "sn": {"label": "论文位置", "t": "§3.2.1 Encode Input Images；Fig. 2；Fig. 3(b)；Tab. 8/9 “Encoded image feature map dimensions” 列"}}, {"b": "p", "t": "输入：M 张 RGB 图，相机参数，目标视锥的近/远平面。输出：每个视角的 K 级特征金字塔 I_k（C=32 通道；Quark 实际用到 36×60、72×120、144×240、288×480 四级），以及每一级对应的射线方向编码 γ_k（同为 32 通道）。", "label": "这一步做什么", "mn": {"label": "需要的基础", "links": [{"k": "concept-f-image"}, {"k": "concept-l-cnn"}, {"k": "concept-l-encoding"}, {"k": "concept-g-epipolar"}, {"k": "concept-g-depth"}]}}, {"b": "p", "t": "特征金字塔（f-image、l-cnn）：残差 CNN 加带步长的 mean-pooling，逐级把分辨率减半，相当于“可学习的图像金字塔”。后面每个 Update & Fuse 步都从中取与当前 LDM 分辨率相当的那一级，作用类似 UNet 的 skip connection（论文称整体结构 “reminiscent of a UNet”）。这样一来，所有推理都在低分辨率上进行，高频细节最后由 IBR 直接从原图里取。\n\n射线方向编码（l-encoding、g-epipolar、g-depth）：输入视角 m 的每个像素对应一条 3D 射线。求这条射线与目标 LDM 视锥近平面、远平面的交点，把两个交点投到目标相机的投影空间（透视除法后的 2D 坐标），相减得到一个 2D 向量 v。如果这条射线正好穿过目标相机光心，也就是与某条目标射线重合，它在目标图像上投成一个点，v=0。否则，v 就是这条射线在目标图像上从近到远扫出的那段极线。在纯平移、归一化坐标的特例下，它的长度恰好是“基线 × 视差范围”（见下方第三个公式）；一般情况下还受旋转和焦距影响。这是本导读的几何解释，论文只给出了文字定义。所以 v 编码了这台相机相对目标偏了多远、偏向哪个方向。接着用 tanh 把视锥外的大值压进 (−1,1)，做 8 个 octave 的正弦编码，再由线性层投到 C 维。\n\n计算上，这个编码只在低分辨率算一次，再双线性上采样到各级，每一级用独立的投影矩阵。它在 Transformer 里扮演位置编码的角色，但编码的是“与目标视角的相对方向”，让注意力倾向于离目标更近的射线，这对反射和非朗伯表面有帮助。", "mn": {"label": "类比", "t": "金字塔好比先看缩略图、再看原图。射线编码好比给每张照片的每个像素贴一张小标签，写着“我看的方向和你想看的方向差多少”。"}}, {"b": "eqs", "eqs": [{"tex": "\\mathbf{v} = \\pi_t\\big(\\mathbf{r}(z{=}\\eta)\\big) - \\pi_t\\big(\\mathbf{r}(z{=}f)\\big) \\in \\mathbb{R}^2", "explain_zh": "按 §3.2.1 的文字描述改写（论文没有给公式，差的先后次序也未说明）。r(z) 是输入射线上、在目标相机坐标系中深度为 z 的点；π_t 是目标相机的投影，含透视除法；η 和 f 是近、远平面。v 是两个交点在目标投影平面上的 2D 差。"}, {"tex": "\\gamma = W_k\\,\\Big[\\sin\\!\\big(2^{j}\\pi\\tanh\\mathbf{v}\\big),\\ \\cos\\!\\big(2^{j}\\pi\\tanh\\mathbf{v}\\big)\\Big]_{j=0}^{7}", "explain_zh": "j=0…7 共 8 个 octave，每个频率对 v 的 2 个分量各取 sin 和 cos，合计 2×2×8=32 维（维数是按描述推断的；论文未给出频率基和是否拼接原值，这里沿用 NeRF 惯例）。W_k 是第 k 级独立的线性投影，把结果投到 C=32 维。"}, {"tex": "\\mathbf{v} = b\\left(\\frac{1}{\\eta} - \\frac{1}{f}\\right)\\hat{\\mathbf{e}}_x", "explain_zh": "特例：输入相机相对目标相机沿 x 轴平移 b，射线平行于光轴，坐标取归一化图像坐标（u=X/Z）。深度 z 处的点投影为 u=b/z，两交点之差为 b(1/η−1/f)，也就是“基线 × 视差范围”。ê_x 是 x 方向单位向量。"}]}, {"b": "p", "t": "C=32。Quark 的金字塔为 288×480、144×240、72×120、36×60；Quark+ 为 432×720、216×360、108×180、54×90。正弦编码 8 个 octave。数值例：b=0.1 m，η=1 m，f=10 m，得 v=0.09，tanh(0.09)≈0.0898。消融：把射线编码置零后 PSNR 30.4071→30.3179（−0.09 dB），运行时间 −1.28%。", "label": "具体数字"}, {"b": "p", "t": "作者不用 NeRF 的 3D 方向正弦编码，也不用 Ref-NeRF 的球谐编码，理由是 LDM 的几何允许更简单的编码：v 的零点恰好对应“与目标射线重合”，精度集中在穿过视锥近/远平面的那些射线上，tanh 又保证视锥外的射线仍有（较粗的）表示。金字塔用 mean-pooling 而非 max-pooling，论文没有解释；从采样的角度看，均值池化是一种抗混叠的低通滤波（f-image）。", "label": "为什么这样设计"}, {"b": "p", "t": "（1）γ 定义在每个输入像素上，而且依赖目标视角：换一个目标视角就要重算。（2）符号不一致：§3.2.1 和 Fig.3 写作 γ_k，§3.2.2 正文写成 ρ_k，二者是同一个量。（3）表 8 的图像特征是 36×60，LDM 是 36×64：前者在输入图像空间，后者在目标视锥空间，宽高比不同本身不矛盾，但论文没交代输入图原始分辨率。（4）射线编码在消融里只贡献 0.09 dB，不要把它当作 Quark 的主要贡献。", "label": "容易误解的地方"}, {"b": "qa", "items": [{"q": "如果某台输入相机与目标相机光心重合、只是朝向不同，它的射线编码 γ 是多少？", "a": "按定义，v 为 0（γ 则是零向量经正弦编码和投影后的常数）。这台相机的每条射线都穿过目标光心，在目标投影平面上，近、远交点投到同一位置。纯旋转不产生视差，射线编码只反映平移造成的视差。"}]}, {"b": "sec", "h": "Q3 · LDM 表示与深度参数化：等视差锚点，每层只能在自己的视差带内移动", "id": "walk-quark-q3", "sn": {"label": "论文位置", "t": "§3.1（Eq. 1 与 LDM 定义）；§3.2.3（Eq. 3、Eq. 4 与 σ 的解码）；Fig. 1 右上；§2.1 末段"}}, {"b": "p", "t": "LDM 由 L 层组成，每层尺寸 [H,W]，位于目标视锥内。属性有：深度 d [L,H,W,1]、density σ [L,H,W,1]（实为 alpha，取值 (0,1)）、混合权重 β [L,H,W,M]。深度参数化：特征 V 经线性投影、tanh 后，映射成落在第 ℓ 条等视差带内的深度。", "label": "这一步做什么", "mn": {"label": "需要的基础", "links": [{"k": "concept-i-layered"}, {"k": "concept-r-reps"}, {"k": "concept-g-depth"}, {"k": "concept-r-alpha"}, {"k": "concept-r-volume"}]}}, {"b": "p", "t": "先理解这是什么表示（i-layered、r-reps）。MPI 是 L 张与图像平面平行、深度固定的平面。LDM 让每层每个像素都有自己的深度，所以每层能“弯曲”去贴合表面，同时保留半透明的 σ 来处理遮挡边缘和抗锯齿。与体渲染相比（r-volume），层数就是沿射线的采样步数，只是少得多（最终 6 层）。与分层网格 LM 相比，它不需要生成三角网格。LDM 不存颜色，只存“到哪张输入图取色”的 β。\n\n再看为什么用等视差（g-depth）。立体测量中，深度误差随 Z² 增长，而视差误差大致恒定，所以近处需要更密的采样。Eq.3–4 把视差区间 [1/f, 1/η] 等分成 L 段：ℓ=1 是最远的一段，ℓ=L 是最近的一段。tanh 的输出在 (−1,1) 内，乘以 0.5/L 后，每层最多只能偏离自己的锚点半个带宽，所以层与层永远不会交叉。这样目标视角下的前后顺序是固定的，over 合成时不需要排序。\n\n给一个 telepresence 尺度的数值例子：η=0.5 m，f=3 m，L=6。各层可活动的深度范围是：层 1 为 1.636–3.0 m，层 2 为 1.125–1.636 m，层 3 为 0.857–1.125 m，层 4 为 0.692–0.857 m，层 5 为 0.581–0.692 m，层 6 为 0.5–0.581 m。最近一层只有约 8 cm 宽，最远一层宽约 1.36 m，这正是逆深度采样的效果。", "mn": {"label": "类比", "t": "像一叠可以各自起伏的透明塑料膜，每张膜被限制在书架的某一格里，可以在格内上下起伏贴合物体，但不能跑进别的格子。"}}, {"b": "eqs", "eqs": [{"tex": "\\delta_\\ell = \\frac{\\ell - 0.5}{L},\\qquad \\ell = 1,\\dots,L", "explain_zh": "论文 Eq.3。δ_ℓ 是第 ℓ 层锚点在归一化视差 [0,1] 中的位置，即第 ℓ 条带的中心；L 是当前层数。"}, {"tex": "d_\\ell = \\left[\\left(\\delta_\\ell + \\frac{0.5}{L}\\tanh(\\mathbf{V}W_d)\\right)\\left(\\frac{1}{\\eta} - \\frac{1}{f}\\right) + \\frac{1}{f}\\right]^{-1}", "explain_zh": "论文 Eq.4。V 是该层该像素的 C 维特征，W_d 是线性投影（C→1）；tanh(·)∈(−1,1)，乘以 0.5/L 后，归一化视差被限制在 [δ_ℓ−0.5/L, δ_ℓ+0.5/L]；再线性映射到真实视差区间 [1/f, 1/η]，最后取倒数得到深度 d_ℓ。η 是近平面，f 是远平面。"}, {"tex": "\\sigma_\\ell = \\operatorname{sigmoid}(\\mathbf{V}W_\\sigma)", "explain_zh": "density 的解码（§3.2.3）。W_σ 是线性投影；sigmoid 把输出压到 (0,1)，因此它其实是 alpha（不透明度），不是 NeRF 的体密度。"}, {"tex": "\\mathbf{C} = \\sum_{\\ell=1}^{L} \\mathbf{c}_\\ell\\,\\sigma_\\ell \\prod_{j=\\ell+1}^{L} (1 - \\sigma_j)", "explain_zh": "over 算子 𝒪 展开后的形式（r-alpha）。按 Eq.4，ℓ=L 离相机最近。c_ℓ 是第 ℓ 层颜色；σ_ℓ 是它的 alpha；∏(1−σ_j) 是比它更近的所有层的透射率。“从后往前 over” 与这个求和式等价。"}]}, {"b": "p", "t": "Quark：初始 24 层，输出 6 层×288×512。Quark+：初始 32 层，输出 8 层×432×768（按表 9；§3.4 正文写成 “768×438”，属于笔误）。每层深度最多偏离锚点 ±0.5/L（归一化视差）。例：η=0.5 m，f=3 m，L=6，视差带宽 (2−0.333)/6≈0.278 m⁻¹，对应最近层约 8 cm、最远层约 1.36 m；若 L=24，最近层只有 0.500–0.518 m 约 1.8 cm。", "label": "具体数字"}, {"b": "p", "t": "论文的对照（§1、§2.1、§4.1）：平面层表示，包括 MPI（如 DeepView、LLFF）和 MSI（如 Immersive Light Field Video、MatryODShka），每层深度固定、无法贴合表面，而作者称 LDM 能 “efficiently represent scenes with complex depth and occlusions”。LM（Immersive Light Field Video、Khakhulin et al. 2022 的 StereoLayers、SIMPLI）内部其实也在解 LDM，但要先映射成网格才能重投影；Quark 直接渲染 LDM，不需要网格。ENeRF 用“单层带厚度的深度图”，作者在定性分析中认为它在深度复杂的场景里表现较差。NeRF/3DGS 这类全局表示需要逐场景离线优化。等视差硬约束保证层序固定、每层只负责一段深度（至于“让训练更稳定”之类的收益，论文没有验证）。LDM 的 2D 结构允许使用高效的 2D 网络组件（§2.1）。", "label": "为什么这样设计"}, {"b": "p", "t": "（1）论文把 σ 叫 density，但它是 sigmoid 输出的 alpha，不像 NeRF 那样要乘步长再算 1−exp(−σδ)。（2）层号方向：ℓ=1 视差最小，离相机最远。（3）深度被硬性限制在 [η,f] 内，视锥外的物体无法表示，η 或 f 设错会直接失败。（4）LDM 本身不存 RGB，只存对 M 张输入图的 β；中间迭代步用的外观 c 是另一回事（见 q5）。", "label": "容易误解的地方"}, {"b": "qa", "items": [{"q": "L=6、η=0.5 m、f=3 m 时，第 6 层（最近层）能在什么深度范围内移动？tanh 输出为 +1 时深度是多少？", "a": "第 6 层的归一化视差带为 [5/6, 1]，对应真实视差 [1.722, 2.0] m⁻¹，深度 0.581–0.5 m。tanh=+1 时 δ+0.5/L=1，视差 = 1·(2−0.333)+0.333 = 2.0 m⁻¹，深度为 0.5 m，正好落在近平面上。"}]}, {"b": "sec", "h": "Q4 · 学习式初始化：可学习特征广播 + back-projection 到锚定平面", "id": "walk-quark-q4", "sn": {"label": "论文位置", "t": "§3.2.2 “Initialization”；Tab. 8/9 “Initialize” 行（Bp, A4, C, C, A4, C, C, A4, C, C）；Fig. 1 “Learned Initialization”"}}, {"b": "p", "t": "输入：最低一级特征 I_k 与 γ_k（Quark 为 36×60），各相机参数，锚点深度。输出：初始特征体 V^(0)，形状 [24,36,64,32]（Quark+ 为 [32,54,96,32]）。", "label": "这一步做什么", "mn": {"label": "需要的基础", "links": [{"k": "concept-i-psv"}, {"k": "concept-d-mvs"}, {"k": "concept-g-epipolar"}, {"k": "concept-g-pinhole"}, {"k": "concept-l-attention"}]}}, {"b": "p", "t": "第一步还没有“当前 LDM”可以渲染，所以作者这样处理：V 被初始化为一个可学习的 32 维向量，广播到所有层、所有像素，每个位置完全相同，信息只能来自图像；深度直接取锚点，也就是 Eq.4 中 tanh 项为 0，于是得到 24 张等视差的平面。这恰好就是 MPI 和平面扫描的出发点（i-psv、d-mvs）。\n\nBack-projection（记作 Bp）的做法：对每张平面上的每个 LDM 像素，算出它的 3D 点，投到输入视角 m，在特征图上做双线性采样，得到 Δ_m。对平面来说，这个映射就是平面诱导单应 H（g-epipolar）。8 个视角的特征都被放到同一个 3D 位置上：如果这个深度正好是真实表面，各视角采到的是同一个表面点，特征一致（光度一致性）；如果不是，各视角沿各自的极线采到不同的点，特征就不一致。这正是平面扫描体的匹配线索。\n\n之后，3 个 Fusion Block（各含 A4、C、C）用 One-to-many attention 把 8 个视角融合进 V^(0)。这里的 Update Block 是简化版，只组合图像特征和射线方向，没有渲染图 Ĩ。", "mn": {"label": "类比", "t": "像刚开始拼图：先把 8 张照片按 24 个固定距离分别投到 24 块透明玻璃上，看哪块玻璃上各张照片的图案能对得上。"}}, {"b": "eqs", "eqs": [{"tex": "\\mathbf{X}_\\ell(\\mathbf{p}) = R_t^{\\top}\\big(d_\\ell\\,K_t^{-1}\\tilde{\\mathbf{p}} - \\mathbf{t}_t\\big)", "explain_zh": "把目标视锥中第 ℓ 层、像素 p 的 LDM 元素反投影为世界坐标 3D 点。p̃ 是齐次像素坐标 (x,y,1)；K_t^{-1}p̃ 是深度为 1 的射线方向；乘以深度 d_ℓ 得到相机坐标；R_t、t_t 是目标相机的世界到相机变换，这里取其逆。"}, {"tex": "\\Delta_m(\\ell,\\mathbf{p}) = \\operatorname{Bilinear}\\Big(\\mathbf{F}_m,\\ \\pi\\big(K_m(R_m\\mathbf{X}_\\ell(\\mathbf{p}) + \\mathbf{t}_m)\\big)\\Big)", "explain_zh": "反投影算子 P^T 的具体做法（gather）。先把 3D 点变到输入相机 m，经 K_m 投影并做透视除法 π，得到非整数像素坐标，再在特征图 F_m 上双线性采样。结果 Δ_m 与 LDM 同形状，每个视角一份。"}, {"tex": "H_{\\ell,m} = K_m\\left(R + \\frac{\\mathbf{t}\\,\\mathbf{n}^{\\top}}{d_\\ell}\\right)K_t^{-1}", "explain_zh": "锚定平面是正对目标相机的平面 n^T X = d_ℓ，其中 n=(0,0,1)，X 在目标相机坐标系中。R、t 是目标相机到输入相机 m 的相对位姿（X_m = R X + t）。此时上面的逐点投影等价于用 3×3 单应 H 对整张特征图做 warp，这就是经典平面扫描。"}]}, {"b": "p", "t": "Quark：24 层×36×64，C=32，使用 36×60 的图像特征；Quark+：32 层×54×96，使用 54×90 的特征。块序列为 Bp，再接 (A4, C, C)×3，即 3 个 4 头注意力块和 6 个残差卷积块。", "label": "具体数字"}, {"b": "p", "t": "用可学习常数作为初始 query，让初始化变成纯数据驱动的集合聚合，没有位置偏置。从等视差平面出发等价于经典平面扫描：一开始不知道深度，均匀覆盖整个视差范围最稳妥。论文没有讨论用单目深度等外部先验初始化。“Fewer iterations” 消融去掉前两次 Update & Fuse、把初始 LDM 分辨率加倍，PSNR 只低 0.08 dB（30.3227 对 30.4071），提示迭代次数还有压缩余地。但该消融同时改变了初始分辨率，所以不能直接得出“初始化本身已经足够强”的结论。", "label": "为什么这样设计"}, {"b": "p", "t": "（1）广播出的初始特征在所有位置都相同，它不是随机初始化；位置和深度信息全部来自 Bp 采到的特征和 γ。（2）Bp 是 gather（在输入图上采样），不是 splat。（3）Init 本身就是一次完整的融合，含 3 个注意力块和 6 个卷积块，并不轻量。正文说“5 个 Update & Fuse 步”，加上 Init 实际上是 6 轮融合。", "label": "容易误解的地方"}, {"b": "qa", "items": [{"q": "某像素的真实表面在第 10 层锚定平面附近。初始化时，8 个视角在第 10 层该位置采到的特征有什么特点？第 3 层呢？", "a": "在第 10 层，各视角采到的是同一个表面点，特征高度一致，跨视角方差小；在第 3 层，各视角沿各自的极线采到场景中不同的点，特征不一致。融合块据此判断表面在哪一层，这就是 PSV/MVS 的光度一致性原理，只不过这里比较的是学习到的特征，而不是原始颜色。"}]}, {"b": "sec", "h": "Q5 · Render：把当前 LDM 双线性 splat 到每个输入视角并 over 合成得到 Ĩ", "id": "walk-quark-q5", "sn": {"label": "论文位置", "t": "§3.2.2 “Decoding and rendering the intermediate LDM”（Eq. 2）；Fig. 3(a) 及其底部插图 “Render to Input Views”"}}, {"b": "p", "t": "输入：当前特征体 V^(n) [L,H,W,C]，各输入相机参数。输出：每个输入视角的渲染特征图 Ĩ_m。渲染分辨率论文没有明确给出；按 Fig. 3 图注，Ĩ_m 在当前级别渲染，如果这一步要升分辨率，就先做 2× 上采样，再与下一级图像特征拼接（例如 U&F1 的 72×120）。", "label": "这一步做什么", "mn": {"label": "需要的基础", "links": [{"k": "concept-r-raster"}, {"k": "concept-r-alpha"}, {"k": "concept-i-warping"}, {"k": "concept-l-iterative"}, {"k": "concept-g-pinhole"}]}}, {"b": "p", "t": "先解码出中间 LDM：深度 d 按 Eq.4 计算，σ=sigmoid(VW_σ)，外观 c=sigmoid(VW_a)。中间步骤不用 blend weights，而是直接给出一个“外观特征”，至少有 3 个通道（RGB Output 消融用的就是它的前 3 个通道）。为了效率，这里先激活、再投影，与最终输出“先上采样、后激活”的顺序相反。\n\n把每层 splat 到每个输入视角（r-raster、i-warping）：LDM 元素在目标视锥里有确定的 3D 位置，投到输入视角 m 后落在非整数像素坐标上，按双线性权重把它的值分给周围 4 个像素，这就是前向 warping，也就是点溅射。这样做不需要光线追踪，也不需要把 LDM 转成网格再光栅化。然后在输入视角里逐层做 over 合成（r-alpha），得到 Ĩ_m，意思是“如果当前 LDM 是对的，第 m 台相机应该看到什么”。\n\n为什么要渲染回输入视角？这就是分析—合成（analysis by synthesis）和梯度下降里的“前向模型”（l-iterative、f-optim）：只有把假设渲染到有观测的地方，才能算出误差。推理时目标视角没有真值，只有输入视角有照片。splat 是 P，Bp（gather）是 P^T，两者互为转置（伴随），这正是论文把反投影写成 P^T 的原因。", "mn": {"label": "类比", "t": "就像把那叠半透明胶片从另外 8 个位置各拍一张照片，看每个位置“拍出来”的样子与真实照片差多少。"}}, {"b": "eqs", "eqs": [{"tex": "\\tilde{\\mathbf{I}}_m = \\mathscr{O}\\Big(\\mathscr{P}_{\\theta_m}(\\mathbf{c},\\mathbf{d}),\\ \\mathscr{P}_{\\theta_m}(\\boldsymbol{\\sigma},\\mathbf{d})\\Big)", "explain_zh": "论文 Eq.2（原文把外观写成 a）。𝒫_θm 是用相机参数 θ_m 把各层按深度 d 投影（splat）到输入视角 m 的算子；c 是逐层外观，σ 是逐层 alpha；𝒪 是 over 合成。结果 Ĩ_m 是输入视角 m 的渲染特征图。"}, {"tex": "\\tilde{\\mathbf{F}}(\\mathbf{q}) = \\sum_{\\mathbf{p}} w\\big(\\mathbf{q} - \\mathbf{u}_m(\\mathbf{p})\\big)\\,\\mathbf{F}(\\mathbf{p}),\\qquad w(\\mathbf{r}) = \\max(0,1-|r_x|)\\,\\max(0,1-|r_y|)", "explain_zh": "双线性 splat。p 遍历源（LDM 层）上的元素，u_m(p) 是它在输入视角 m 中的非整数投影坐标，q 是目标整数像素，w 是双线性核，只对最近的 4 个像素非零。论文没有说明是否对累加权重做归一化，也没有说明怎样处理空洞。"}, {"tex": "\\langle \\mathscr{P}\\mathbf{x},\\ \\mathbf{y} \\rangle = \\langle \\mathbf{x},\\ \\mathscr{P}^{T}\\mathbf{y} \\rangle", "explain_zh": "伴随（转置）关系。x 是层空间的量，y 是图像空间的量。当 𝒫 是用同一组坐标、同一个双线性核做 splat 时，用这组坐标做双线性 gather 恰好就是 𝒫^T。PyTorch 中 grid_sample（gather）的反向传播就是 splat。"}]}, {"b": "p", "t": "每个 Update & Fuse 步都对 M=8 个视角各渲染一次。与 Ĩ 拼接的图像特征分辨率依次为 36×60（U&F0）、72×120（U&F1、U&F2）、144×240（U&F3）、288×480（U&F4）；其中 U&F1、U&F3、U&F4 是升分辨率的步，Ĩ 要先 2× 上采样（Fig. 3 图注）。消融 “No render-and-refine”（Ĩ 置零）：PSNR 30.4071→29.7106（−0.70 dB），SSIM 0.9165→0.9111，LPIPS 0.1543→0.1599，运行时间 −5.22%。", "label": "具体数字"}, {"b": "p", "t": "选择 splat 而不是光追或光栅化：LDM 是逐像素深度，没有三角面片；双线性 splat 可微、易于并行，而且不必像 LM 类前作那样先实例化网格。选择渲染到输入视角：只有那里有观测可比。DeepView（MPI）、Immersive Light Field Video 和 SIMPLI 等前作也用 learned render-and-refine，但作者称它们 “far too slow for real-time”（§1）。Quark 的关键改动是把这个过程嵌进多尺度的 UNet 式结构。", "label": "为什么这样设计"}, {"b": "p", "t": "（1）记号不一致：Eq.2 写 P(a,d)，而前文把外观定义为 c=sigmoid(VW_a)，a 和 c 指同一个量。（2）Ĩ 是渲染出的“外观特征”，不一定是 RGB 图像。（3）论文没有说明 splat 的归一化、空洞处理，也没有说明在输入视角里层序是否需要重排。各层在目标视角下被限制在互不相交的视差带里，层序严格固定；当输入基线较小时，在输入视角里大致也保持这个顺序，但这是推断。（4）中间 LDM 是“先激活后投影”，最终 LDM 是“先上采样后激活”，两者不一样。", "label": "容易误解的地方"}, {"b": "qa", "items": [{"q": "为什么论文把反投影算子写成 P^T，而不是 P^{-1}？", "a": "投影（splat）是线性的，但多对一、存在遮挡，因此没有逆。反投影（在输入图上 gather 采样）恰好是 splat 的伴随，满足 ⟨Px,y⟩=⟨x,P^T y⟩。在梯度下降中，损失对 LDM 的梯度正是 P^T 作用在图像空间的残差上，所以这里要用转置，而不是逆。"}]}, {"b": "sec", "h": "Q6 · Update：比较 Ĩ 与观测特征，生成逐视角 update feature，再按当前深度反投影成 Δ", "id": "walk-quark-q6", "sn": {"label": "论文位置", "t": "§3.2.2 前三段；Fig. 3(b)(c)；Tab. 8/9 中的块记号 U；§1（learned render-and-refine 被类比为展开的梯度下降）"}}, {"b": "p", "t": "输入：每个视角的 Ĩ_m（跨分辨率的那一步先做 2× 上采样）、这一级的特征 I_{k,m}、射线编码 γ_{k,m}、当前深度 d。输出：逐视角的 update feature U_m（位于图像空间），以及反投影到 LDM 层空间后的 Δ_m [L,H,W,C]，m=1…M。", "label": "这一步做什么", "mn": {"label": "需要的基础", "links": [{"k": "concept-l-iterative"}, {"k": "concept-f-optim"}, {"k": "concept-l-cnn"}, {"k": "concept-i-psv"}, {"k": "concept-d-mvs"}]}}, {"b": "p", "t": "Update Block 是一个小型残差 CNN（l-cnn），在每个输入视角的图像平面上逐视角运行。它把三样东西拼在一起：渲染出的样子 Ĩ_m、真实观测的特征 I_{k,m}、射线方向 γ。输出的 update feature 同时包含两类信息：一是图像特征本身，相当于 PSV 里的匹配线索；二是“渲染与观测之间的差异”，指出 LDM 在哪里把遮挡关系弄错了，论文称之为 visibility 信息。\n\n接着，用当前深度 d 把 U_m 反投影回层空间，得到 Δ_m：对每个 LDM 元素，投到视角 m，在 U_m 上采样。这和初始化时的 Bp 是同一个操作，只是深度不再是平面（i-psv、d-mvs）。\n\n与梯度下降对照一下（f-optim、l-iterative）。若用最小二乘光度损失 E(x)=Σ_m‖R_m(x)−I_m‖²，梯度是 Σ_m J_m^T(R_m(x)−I_m)：先在图像空间算残差，再用雅可比转置搬回参数空间。Quark 的 Update 把“残差”换成可学习的 CNN(Ĩ, I, γ)，把 J^T 换成几何反投影 P^T，再由 Fuse 去学“往哪走、走多远”。DeepView 把这叫作 learned gradient descent。还有一点很重要：大部分逐视角计算都在图像空间（H_k×W_k）完成，不需要在 L×H×W 的层空间里重复 M 次。这部分计算就是附录 B 中的 T_image。", "mn": {"label": "类比", "t": "每台相机派一位质检员，对照渲染图和真实照片写一份批注（哪里错了、这里的纹理长什么样），再按当前的深度把批注贴回那叠透明膜的对应位置。"}}, {"b": "eqs", "eqs": [{"tex": "\\mathbf{U}_m = \\operatorname{CNN}_{\\text{upd}}\\Big(\\big[\\,\\operatorname{up}(\\tilde{\\mathbf{I}}_m);\\ \\mathbf{I}_{k,m};\\ \\gamma_{k,m}\\,\\big]\\Big)", "explain_zh": "Update Block 的文字描述改写成公式。[;] 表示按通道拼接；up(·) 只在分辨率切换的那一步做 2× 上采样；I_{k,m} 是视角 m 在第 k 级的特征；γ_{k,m} 是射线编码；CNN_upd 是小型残差 CNN，具体层数论文未给出。"}, {"tex": "\\Delta_m = \\mathscr{P}^{T}_{\\theta_m}(\\mathbf{U}_m,\\ \\mathbf{d})", "explain_zh": "用当前深度 d 把视角 m 的 update feature 反投影到 LDM 层空间，得到 [L,H,W,C] 的 Δ_m。它像平面扫描体，但层面是弯曲的，内容也不是原始颜色，而是学出来的特征。"}, {"tex": "\\nabla_{\\mathbf{x}} E = \\sum_{m=1}^{M} J_m^{\\top}\\big(\\mathcal{R}_m(\\mathbf{x}) - \\mathbf{I}_m\\big)", "explain_zh": "经典的对照。x 是场景参数；ℛ_m 是可微渲染到视角 m；I_m 是观测；J_m = ∂ℛ_m/∂x 是雅可比矩阵。“图像空间残差 → 转置搬回参数空间”的结构与 Quark 的“Update CNN → P^T”一一对应。"}, {"tex": "\\mathbf{V}^{(n+1)} = \\Phi\\big(\\mathbf{V}^{(n)},\\ \\{\\Delta_m\\}_{m=1}^{M}\\big)", "explain_zh": "学习化的更新步。Φ 就是下一步要讲的 Fusion Block（One-to-many attention 加残差卷积），它代替了经典梯度下降里的 x ← x − λ∇E。"}]}, {"b": "p", "t": "每步都要对 M=8 个视角各跑一次 Update CNN，C=32；Quark 各步的图像分辨率为 36×60（Init、U&F0）、72×120（U&F1、U&F2）、144×240（U&F3）、288×480（U&F4）。运行时间约为 T_V + M·T_image；在 32 个输入视角以内仍大于 10 fps（Fig. 7）。§1 称学习化更新约 5 步即可收敛，经典梯度下降则需要上千步。", "label": "具体数字"}, {"b": "p", "t": "逐视角的计算放在图像空间做，因为图像比 L 层的体小 L 倍，这也是 One-to-many attention 能省掉层空间矩阵乘的前提。不直接使用解析梯度，是因为学习化更新 5 步就能收敛，还能利用学到的场景先验。把“渲染 vs 观测”显式交给网络，是因为去掉 Ĩ 会掉 0.7 dB。", "label": "为什么这样设计"}, {"b": "p", "t": "（1）“No render-and-refine” 消融只把 Ĩ 置零，迭代和多尺度结构全部保留，所以它去掉的只是“比较”这一信号，而不是整个迭代。（2）Δ 看起来像 PSV，但里面装的是学到的 update feature，不是原始颜色。（3）论文没有给出 Update CNN 的具体结构。（4）在分辨率切换的那一步，论文只说明 Ĩ 要做 2× 上采样，没说特征体 V 本身怎样上采样。", "label": "容易误解的地方"}, {"b": "qa", "items": [{"q": "如果把 Update CNN 换成纯差值 Ĩ_m − I_{k,m} 再反投影，把 Fuse 换成 V ← V − λ·mean_m(Δ_m)，这相当于什么？Quark 为什么不这么做？", "a": "这近似于对某种光度损失做一步梯度下降：Δ 相当于 J^T 乘残差，但忽略了遮挡导数等项。Quark 不这么做，原因有三：经典梯度下降需要成百上千步、对步长 λ 敏感；遮挡边界处的目标函数高度非凸；而学习化更新能利用图像特征先验（匹配线索、真实场景的流形），5 步左右就收敛。"}]}, {"b": "sec", "h": "Q7 · Fuse：One-to-many attention 跨视角融合（含 W^K/W^V 折叠技巧）", "id": "walk-quark-q7", "sn": {"label": "论文位置", "t": "§3.3（Eq. 5–10）；附录 A（Eq. 11–15，Tab. 6、Tab. 7）；Fig. 3(d) 及顶部插图；Tab. 8/9 中的 A4/A2/A1"}}, {"b": "p", "t": "输入：当前 V [L,H,W,C] 和 M 个 Δ_m [L,H,W,C]。输出：更新后的 V^(n+1)。对每个 LDM 元素 (ℓ,y,x)，由 V 给出 1 个 query，对该位置上 M 个视角的 Δ_m 向量（作 key/value）做 cross-attention，与 3×3 残差卷积交替堆叠。", "label": "这一步做什么", "mn": {"label": "需要的基础", "links": [{"k": "concept-l-attention"}, {"k": "concept-f-linalg"}, {"k": "concept-l-cnn"}, {"k": "concept-n-generalizable"}]}}, {"b": "p", "t": "为什么用注意力（l-attention）：跨视角融合必须与视角顺序无关，并且支持可变的 M。可选方案各有问题：均值（pixelNeRF）或方差（IBRNet）这类统计量表达力有限；max-pool（DeepView）是较强的集合聚合器；NerFormer 在视角之间做 self-attention，代价是 O(M²)。Quark 的做法是以 V 为唯一 query、M 个视角为 key/value 做 cross-attention。这样每个 LDM 元素都能“软选择”哪些视角的信息可信，隐式完成匹配和遮挡推理。\n\n折叠技巧（f-linalg）：标准的某个头 i 里，注意力 logit 是 (vW_i^q)(Δ_m W_i^k)^T = v(W_i^q W_i^{kT})Δ_m^T。两个矩阵可以先乘成一个 C×C 矩阵，只作用在 1 个 query 上，而不必对 M 个 Δ 各乘一次 W^k。value 一侧同理：Σ_m a_m Δ_m W_i^v W_i^O = (Σ_m a_m Δ_m)(W_i^v W_i^O)，W^v 可以并进输出投影。于是 head_i = Attention(V W_i^q, Δ, Δ)，M 个 key/value 不再需要任何矩阵乘，只剩点积和加权求和。代价是每个头的点积维度从 C/h 变成 C，头数越多节省越少，h=8 时两者持平。Quark 只用 4、2、1 个头。\n\n更关键的收益在系统层面。Δ 位于层空间，有 L×H×W×M 个向量；标准做法要在层空间里对每个元素做 O(LM) 次矩阵乘。折叠之后，层空间里只剩点积，重活都在图像空间的 Update CNN 里做完再“lift”到 3D。Fusion Block 的结构就是 pre-LN Transformer：Eq.9 是注意力残差，Eq.10 用 3×3 卷积残差代替 MLP。论文写的是 2D 3×3 卷积，推测是在每层内部让相邻像素交换信息。论文说整个 Fusion Block 既负责跨视角聚合，也负责把 LDM 约束在“真实场景”的流形上。", "mn": {"label": "类比", "t": "标准做法是给 8 位证人每人配一名翻译（W^k、W^v），再听他们的证词。Quark 的做法是法官自己学会听 8 位证人的原话：只把自己的问题翻译一次（W^q 吸收 W^k），听完之后再把结论统一翻译一次（W^O 吸收 W^v）。"}}, {"b": "eqs", "eqs": [{"tex": "\\operatorname{Attention}(Q,K,\\mathit{Val}) = \\operatorname{softmax}\\!\\left(\\frac{QK^{\\top}}{\\sqrt{C}}\\right)\\mathit{Val}", "explain_zh": "论文 Eq.5。Q 是 query（这里每个元素只有 1 个），K 是 M 个 key 堆成的矩阵，Val 是 M 个 value；C 是通道数，用于缩放；softmax 在 M 个视角上归一化。"}, {"tex": "\\text{head}_i = \\operatorname{Attention}\\big(\\mathbf{V}W_i^{q},\\ \\Delta W_i^{k},\\ \\Delta W_i^{val}\\big),\\qquad \\operatorname{MultiHead} = \\operatorname{concat}(\\text{head}_1,\\dots,\\text{head}_h)\\,W^{O}", "explain_zh": "论文 Eq.6–7，标准多头 cross-attention。W_i^q、W_i^k、W_i^val 都是 C×(C/h) 的投影；W^O 是 C×C 的输出投影；h 是头数。"}, {"tex": "(\\mathbf{v}W_i^{q})(\\Delta_m W_i^{k})^{\\top} = \\mathbf{v}\\,\\underbrace{W_i^{q}W_i^{k\\top}}_{\\widehat{W}_i^{q}\\in\\mathbb{R}^{C\\times C}}\\,\\Delta_m^{\\top},\\qquad \\sum_m a_{im}\\,\\Delta_m W_i^{val}W_i^{O} = \\Big(\\sum_m a_{im}\\Delta_m\\Big)\\widehat{W}_i^{O}", "explain_zh": "折叠的推导。v 是 1×C 的 query 行向量；Δ_m 是视角 m 的 1×C 向量；a_im 是头 i 对视角 m 的注意力权重；W_i^O 是 W^O 中与头 i 对应的 (C/h)×C 行块。两个矩阵乘积在推理前就可以合并成 Ŵ。"}, {"tex": "\\text{head}_i = \\operatorname{Attention}\\big(\\mathbf{V}\\widehat{W}_i^{q},\\ \\Delta,\\ \\Delta\\big)", "explain_zh": "论文 Eq.8（原文仍写 W_i^q，这里用 Ŵ 强调它已吸收 W_i^k）。key 和 value 直接就是 Δ 本身，对 M 个视角不做任何投影。"}, {"tex": "\\mathbf{V}' = \\mathbf{V} + \\operatorname{MultiHead}\\big(\\mathscr{N}(\\mathbf{V}),\\Delta\\big),\\qquad \\mathbf{V}'' = \\mathbf{V}' + \\operatorname{Conv}\\Big(\\operatorname{gelu}\\big(\\operatorname{Conv}(\\mathscr{N}(\\mathbf{V}'))\\big)\\Big)", "explain_zh": "论文 Eq.9–10。𝒩 是归一化，引用的是 Zhang & Sennrich 2019 的 RMSNorm；Conv 是 2D 3×3 卷积；gelu 是激活函数。原文两式都写成 V′ = V + …，这里按先后顺序串联写成 V′、V″。两式都是 pre-norm 残差结构，分别对应 Transformer 的注意力子层和 MLP 子层。"}, {"tex": "F_{\\text{std}} = (2N+1)\\,d_k^2 + N d_k + d_k^2,\\qquad F_{\\text{1toN}} = h\\,d_k^2 + N h\\,d_k + h\\,d_k^2", "explain_zh": "附录 A 的 Eq.14 与 Eq.15，是单个 query 对 N 个输入的理论 FLOPs。d_k 是通道数（=C=32），N 是输入视角数（即正文的 M），h 是头数。标准版需要投影 1 个 query、N 个 key 和 N 个 value，再做点积和输出投影；折叠版只需 h 次 C×C 的 query 投影、N·h 次 C 维点积，以及一次 C×(hC) 的输出投影。"}]}, {"b": "p", "t": "d_k=32、N=8 时：标准版 18688 FLOPs；折叠版 h=1 为 2304（快 8.1×），h=2 为 4608（4.1×），h=4 为 9216（2.0×），h=8 为 18432（1.0×）。固定 h=4、N 从 4 增到 64 时，标准版 10368→135168（13.0×），折叠版 8704→16384（1.9×）。Quark 的块数（Tab. 8）：Init、U&F0、U&F1 各为 (A4,C,C)×3，U&F2 为 (A4,C)×2，U&F3 为 (A2,C)×2，U&F4 为 (A1,C)×2，合计 15 个注意力块、24 个卷积块。消融 “No cross attention”（只在求解器内部把 keys 置零，退化为均值；计算 blend weights 时仍用完整的 keys）：PSNR 30.4071→29.7289，SSIM 0.9097，LPIPS 0.1621，运行时间 −3.09%。", "label": "具体数字"}, {"b": "p", "t": "单 query 的 cross-attention 把 AggTransformer 的效率和完整 Transformer 的表达力结合起来，同时与顺序无关、支持可变 M。头数随分辨率递减（A4→A2→A1）。附录 A 的说法是 “never uses more than 4 heads, and at high resolutions it uses just 1 or 2 heads, leading to large savings”：高分辨率时元素最多，h=1 的理论加速最大（8.1×）。论文没有解释为什么用 3×3 卷积代替 MLP，合理的解释是为了提供空间上的邻域交互。", "label": "为什么这样设计"}, {"b": "p", "t": "（1）折叠不是近似。任何标准多头注意力都能写成折叠形式，而且折叠后的 C×C 矩阵不再受秩 ≤C/h 的限制，表达力只多不少；√C 与 √(C/h) 的缩放差别也可以被学习权重吸收。（2）附录 A 有好几处笔误：“a single query attending against N heads” 应为 N 个 key；“we again have a single key attending” 应为 query；Eq.13 中 (W_i^K)^T K 应为 (W_i^K)^T K^T；“instead of applying both W_i^Q and W_i^V” 应为 W_i^K；另外附录里的 V 指 values，与正文的特征体 V 同名。（3）这是“对视角”的注意力，不对空间位置做注意力，空间信息靠 3×3 卷积交换。（4）FLOPs 表只是单个注意力操作的理论值，不是实测运行时间，也不包括 O(M) 的 Update CNN。（5）正文称 pre-LayerNorm，但归一化 𝒩 引用的是 RMSNorm。", "label": "容易误解的地方"}, {"b": "qa", "items": [{"q": "用 Eq.14/15 算一下 h=2、N=8、d_k=32 时 One-to-many attention 的 FLOPs，并解释为什么头数越多，它的优势越小。", "a": "F_1toN = 2·1024 + 8·2·32 + 2·1024 = 2048 + 512 + 2048 = 4608；F_std = 17·1024 + 256 + 1024 = 18688；比值约 4.1×。折叠后每个头都要用满 C 维做投影和点积，成本随 h 线性增长；标准多头把 C 拆成 h 份，每份 C/h 维，总成本与 h 无关。所以 h 越大，二者越接近，h=8 时持平。"}]}, {"b": "sec", "h": "Q8 · 由粗到细：分辨率翻倍 + Layer Collapse（24 层 36×64 → 6 层 288×512）", "id": "walk-quark-q8", "sn": {"label": "论文位置", "t": "§1 “Multi-scale learned render-and-refine network core”；§3.2 开头；§3.2.2 “Layer Collapse”；Tab. 8/9；Tab. 4 中的 “No layer collapse” 与 “Fewer iterations”"}}, {"b": "p", "t": "输入：V^(0) [24,36,64,32]。输出：最终特征体 [6,288,512,32]。Quark 的路径是：Init 24×36×64 → U&F0 24×36×64 → U&F1 24×72×128 → U&F2 24×72×128 → U&F3（先 Lc）12×144×256 → U&F4（先 Lc）6×288×512。", "label": "这一步做什么", "mn": {"label": "需要的基础", "links": [{"k": "concept-l-cnn"}, {"k": "concept-f-image"}, {"k": "concept-i-layered"}, {"k": "concept-l-iterative"}, {"k": "concept-r-volume"}]}}, {"b": "p", "t": "整体类似一个 UNet（l-cnn、f-image；论文的措辞是 “reminiscent of a UNet”）：编码器金字塔是收缩路径，各个 U&F 步是扩张路径，每步用同一级的图像特征做 skip。如果直接在 288×512×24 层上迭代 5 次，计算量太大。\n\n“升分辨率、降层数”的依据是：大多数场景在深度方向上只有少数几个“冲激”，也就是表面。早期分辨率低时，用 24 层密集扫描深度，把表面找出来；后期分辨率高时，只留 6 层，让每层可弯曲的深度贴着表面走。Layer collapse 把相邻两层合并成一层：直通支路取两层的均值，残差支路把两层拼接后送进 MLP。§3.2.2 称之为 “residual MLP”，Fig. 3 图注却写成 “residual CNN”，原文前后不一致。由 Eq.3–4，L 减半后每条视差带宽度加倍，新的第 j 条带正好是旧的第 2j−1 和第 2j 条带的并集，因此合并后的深度仍然合法（这一点是由公式推出的）。\n\n算一下计算量。各步的 LDM 元素数：Init 和 U&F0 为 55,296，U&F1 和 U&F2 为 221,184，U&F3 为 442,368，U&F4 为 884,736。如果不做 collapse，U&F3 会是 884,736（2 倍），U&F4 会是 3,538,944（4 倍）。消融 “No layer collapse” 显示运行时间 +115%，PSNR 提高 0.16 dB（30.5635 对 30.4071）：用很小的质量代价换来了超过 2 倍的加速。注意消融的基线是 Quark+（32 层→8 层），在半分辨率上训练 250K 步，不是这里算元素数用的 Quark；不过 Quark+ 不做 collapse 时，最后一步同样是 4 倍元素数。", "mn": {"label": "类比", "t": "像找东西：先在一张模糊的大地图上把整条街（所有深度）扫一遍，确定东西在哪几段；再拿放大镜只看这几段。"}}, {"b": "eqs", "eqs": [{"tex": "\\operatorname{Lc}(\\mathbf{V}_{2j-1},\\mathbf{V}_{2j}) = \\tfrac{1}{2}\\big(\\mathbf{V}_{2j-1} + \\mathbf{V}_{2j}\\big) + \\operatorname{MLP}\\big([\\mathbf{V}_{2j-1};\\mathbf{V}_{2j}]\\big)", "explain_zh": "Layer collapse 的残差 MLP（§3.2.2 的文字描述）。V_{2j−1} 和 V_{2j} 是相邻两层在同一像素上的 C 维特征；[;] 是拼接，得到 2C 维；输出第 j 层的 C 维特征。直通支路是均值，残差支路是 MLP。"}, {"tex": "\\left[\\frac{j-1}{L'},\\ \\frac{j}{L'}\\right] = \\left[\\frac{2j-2}{L},\\ \\frac{2j-1}{L}\\right] \\cup \\left[\\frac{2j-1}{L},\\ \\frac{2j}{L}\\right],\\qquad L' = L/2", "explain_zh": "由 Eq.3–4 推出的视差带合并关系（归一化视差）。L 是 collapse 前的层数，L' 是之后的层数；新的第 j 条带覆盖旧的两条带。"}, {"tex": "\\text{cost}^{(n)} \\propto L^{(n)}\\,H^{(n)}\\,W^{(n)}", "explain_zh": "层空间计算量（注意力点积、3×3 卷积）大致正比于第 n 步的 LDM 元素数。分辨率翻倍会让 H·W 变成 4 倍，层数减半能抵消其中一半。"}]}, {"b": "p", "t": "Quark 各步形状见上；注意力头数 A4（≤72×128）→ A2（144×256）→ A1（288×512）。Quark+：32×54×96 → 32×108×192 → 16×216×384 → 8×432×768。消融：No layer collapse 运行时间 +115.18%，PSNR/SSIM/LPIPS 为 30.5635/0.9184/0.1531（基线 30.4071/0.9165/0.1543）。Fewer iterations（去掉前两次 U&F、初始分辨率加倍）运行时间 −17.49%，指标 30.3227/0.9153/0.1554。", "label": "具体数字"}, {"b": "p", "t": "作者对比了两种方案。一是已有的 learned render-and-refine 实现（DeepView、Immersive Light Field Video、SIMPLI），作者称其 “far too slow for real-time”（SIMPLI 在表 1 中需要 4.4 s），并指出与 SIMPLI 最主要的差异就是多尺度 LDM 结构。二是全程保持层数（消融中运行时间 +115%）。UNet 式结构能在空间维和深度维之间平衡计算量：少层配高分辨率负责细节，多层配低分辨率负责定位。", "label": "为什么这样设计"}, {"b": "p", "t": "（1）分辨率翻倍发生在 U&F1、U&F3、U&F4（Tab. 8 从 0 开始编号）；Intro 从 1 开始数，说成“第二、四、五步”；Layer collapse 发生在 U&F3 和 U&F4 开头。两种编号方式很容易混。（2）正文说“5 次 Update & Fuse”，加上同样包含 3 个融合块的 Init，实际是 6 轮融合。（3）“Fewer iterations” 几乎不掉点，作者也承认设计空间没有搜索充分，所以不要把 5 步当成必需的。（4）论文没说明 V 在分辨率翻倍时用什么方式上采样。", "label": "容易误解的地方"}, {"b": "qa", "items": [{"q": "如果一直保留 24 层到最后，U&F4 的 LDM 元素数是现在的几倍？这与消融里“只慢了 115%”矛盾吗？", "a": "24×288×512 = 3,538,944，是现在 884,736 的 4 倍；U&F3 则是 2 倍。这并不矛盾：总运行时间里还有大量与层数无关的部分，包括逐视角的图像空间计算（编码、Update CNN、γ）、低分辨率的前几步和最终渲染。而且消融实现没有做优化，运行时间只是近似值。另外，该消融是在 Quark+ 上做的（最后一步 32×432×768 对 8×432×768，同样是 4 倍）。"}]}, {"b": "sec", "h": "Q9 · 上采样后再激活（post-activation，借鉴 ReLU Fields）", "id": "walk-quark-q9", "sn": {"label": "论文位置", "t": "§1 末段（Upsample & Activate）；§3.2.3（Eq. 3–4 之后的段落）；§3.4 模型变体段；引用 Karnewar et al. 2022（ReLU Fields）与 Sun et al. 2022（DVGO）"}}, {"b": "p", "t": "输入：V^(N)，Quark 为 [6,288,512,32]。输出：全分辨率 LDM，其中 d、σ 为 [6,1080,1920,1]，β 为 [6,1080,1920,8]。步骤：线性投影得到 logits → 双线性上采样 3.75× → 施加 tanh 并做视差到深度的映射、sigmoid、softmax。", "label": "这一步做什么", "mn": {"label": "需要的基础", "links": [{"k": "concept-f-image"}, {"k": "concept-i-layered"}, {"k": "concept-i-blending"}, {"k": "concept-g-depth"}]}}, {"b": "p", "t": "先看为什么要这样做（f-image）。如果先激活再插值，一条从“完全透明”到“完全不透明”的边缘会被插成一段线性斜坡，宽度等于 1 个低分辨率像素，也就是 3.75 个输出像素，看起来就是糊的。如果先对 logits 插值、再过 sigmoid，logit 线性穿过 0 的那一小段会被 sigmoid 变成陡峭的台阶：边缘位置可以在子像素精度上移动，同时保持锐利。这就是 ReLU Fields 和 DVGO 的 post-activation：低分辨率网格加上“插值后的非线性”，就能表示分段光滑、边界锐利的函数。\n\n数值例子：相邻两个低分辨率像素的 σ logit 分别为 −6 和 +6，上采样 3.75×。用 post-activation，σ 从 0.1 升到 0.9 的过渡宽度约为 1.37 个输出像素；先激活再插值则约为 3.0 个输出像素。\n\nBlend weights 的 logits 来自最后一个融合块的 One-to-many attention，用的是该块的 Δ；softmax 推迟到上采样之后才施加。最后一步只有 1 个头（A1），每个元素恰好得到 M 个 attention logits，可以直接当作 M 路 blend logits。这个对应关系是推断，论文没有明说。深度一侧，tanh 在上采样之后施加，再做视差到深度的映射，所以上采样后的深度仍然落在各自的带内。", "mn": {"label": "类比", "t": "好比先把海拔数据放大，再画出海岸线；而不是先画好一条粗糙的海岸线再把图片放大。前者画出的海岸线依然锐利。"}}, {"b": "eqs", "eqs": [{"tex": "\\mathbf{z}^{\\uparrow} = \\operatorname{Bilinear}_{s}\\big(\\mathbf{V}^{(N)}W\\big),\\quad \\sigma = \\operatorname{sigmoid}(z_\\sigma^{\\uparrow}),\\quad \\beta_m = \\frac{\\exp(z^{\\uparrow}_{\\beta,m})}{\\sum_{m'=1}^{M}\\exp(z^{\\uparrow}_{\\beta,m'})}", "explain_zh": "V^(N) 是最后的特征体；W 是各属性的线性投影（W_σ、W_d，以及 β 对应的注意力 logits）；Bilinear_s 按 s 倍做双线性上采样；z↑ 是上采样后、尚未激活的 logits；σ 用 sigmoid，β 在 M 个视角上做 softmax，深度则代入 Eq.4 的 tanh。"}, {"tex": "\\operatorname{sigmoid}\\big(\\operatorname{Bilinear}(z)\\big) \\neq \\operatorname{Bilinear}\\big(\\operatorname{sigmoid}(z)\\big)", "explain_zh": "非线性函数与插值不可交换。左边是 post-activation，边缘锐利、位置可达子像素精度；右边是 pre-activation，边缘是线性斜坡。"}, {"tex": "s = \\frac{1080}{288} = \\frac{1920}{512} = 3.75", "explain_zh": "Quark 的上采样因子。Quark+ 按表 9 算是 1080/432 = 1920/768 = 2.5，但正文写的是 2.4×。"}]}, {"b": "p", "t": "Quark 的 s=3.75。Quark+ 正文写 2.4×，而按表 9 的 432×768 算应为 2.5×；正文还把 Quark+ 的输出写成 “768×438”，与表 9 不一致。§1 称 s 约为 2–4×。边缘例子：logits 为 −6/+6 时，过渡宽度 1.37 像素（post）对 3.0 像素（pre）。", "label": "具体数字"}, {"b": "p", "t": "网络只需在 288×512 上求解，剩下的交给便宜的双线性上采样和 IBR 取样。作者给出的理由有两条：直接在最终分辨率上求解 LDM 代价过高（§3.2）；post-sampling activation 能得到锐利的遮挡边界（§3.2.3，引用 ReLU Fields 和 DVGO）。论文没有与学习式上采样器做比较。", "label": "为什么这样设计"}, {"b": "p", "t": "（1）中间 LDM 为了效率是先激活再投影，只有最终 LDM 是先上采样后激活。（2）post-activation 能让边缘锐利，但无法凭空造出低分辨率网格里没有的几何细节：同一个低分辨率像素里的两条边缘分不开。这可能是 2K 输出时 LPIPS 变差的原因之一（RFF 上 1024×768 为 0.137，2048×1536 为 0.233；两者在不同分辨率下评测，论文没有做归因分析）。（3）注意上采样因子和 Quark+ 尺寸的笔误。", "label": "容易误解的地方"}, {"b": "qa", "items": [{"q": "沿用 −6/+6 的例子：post-activation 的边缘宽度与 logit 差值是什么关系？如果 logits 是 −1/+1 会怎样？", "a": "sigmoid 从 0.1 到 0.9 需要 logit 变化约 4.39，所以过渡宽度 ≈ 4.39 ÷ logit 差值 × 3.75 像素。差值为 12 时约 1.37 像素；差值为 2 时比值大于 1，也就是在整个低分辨率像素间距内，σ 只从 0.27 变到 0.73，边缘是软的。网络可以通过 logit 的幅度来控制边缘有多锐利。"}]}, {"b": "sec", "h": "Q10 · IBR 混合与 over 合成：全分辨率输入像素的凸组合", "id": "walk-quark-q10", "sn": {"label": "论文位置", "t": "§3.1（Eq. 1）；§3 开头（可选深度输出）；Tab. 8/9 的 Output 行；Tab. 4 “RGB Output”；§4.3 Limitations"}}, {"b": "p", "t": "输入：全分辨率 LDM（d、σ、β），M 张原始全分辨率输入图像及其相机参数。输出：目标视角 RGB [1080,1920,3]；可选地对深度做 over 合成，得到深度图。", "label": "这一步做什么", "mn": {"label": "需要的基础", "links": [{"k": "concept-i-lightfield"}, {"k": "concept-i-blending"}, {"k": "concept-i-warping"}, {"k": "concept-r-alpha"}, {"k": "concept-r-appearance"}]}}, {"b": "p", "t": "这是经典 IBR 的思路（i-lightfield、i-blending）：新视角像素的颜色不是网络“画”出来的，而是从真实照片里“拿”来的，几何只负责告诉你去哪里拿。对每个输出像素和每一层：用该层深度得到 3D 点 → 投影到每张输入图 → 双线性采样颜色（P^T，即 i-warping 中的后向 warping）→ 用 β 做凸组合得到该层颜色。在 ULR（Unstructured Lumigraph Rendering）里，这个权重由角度、距离等手工规则给出；Quark 让网络逐层、逐像素地学出来。\n\n然后按 σ 从后往前把 6 层 over 合成（r-alpha）。CUDA 渲染器在 1080p 下约 1.3 ms。输出分辨率几乎不影响运行时间（1024×768 为 32.2 ms，2048×1536 为 33.0 ms），因为不论输出分辨率多少，内部 LDM 每层的像素数都与 1080p 模型的 288×512 大致相同（§4.1；4:3 画幅时按宽高比调整形状）。\n\n凸组合带来的后果（r-appearance）：输出颜色必然落在各输入颜色的凸包里，任何一张输入图都没拍到的高光是生成不出来的。Quark 靠“为每个目标视角重新求 β”加上“射线编码偏向近邻视角”来近似反射和折射。如果输入之间曝光或焦距不一致（§4.3；白平衡差异同理，但这是推断），β 在空间上的变化就会表现为可见的接缝和闪烁；如果标定有误差，采样会错位，出现硬边而不是模糊。", "mn": {"label": "类比", "t": "像做马赛克拼贴：每块瓷砖的位置（每层每个像素）按比例从 8 张照片里取色。网络只决定位置和比例，瓷砖本身来自真实照片，所以画面清晰。"}}, {"b": "eqs", "eqs": [{"tex": "\\mathbf{c}_{\\text{target}} = \\mathscr{O}\\!\\left(\\sum_{m=1}^{M}\\beta_m\\cdot\\mathscr{P}^{T}_{\\theta_m}(\\mathbf{I}_m,\\mathbf{d}),\\ \\boldsymbol{\\sigma}\\right)", "explain_zh": "论文 Eq.1（这里把原文的 P^T(I,d) 写成按视角的 P^T(I_m,d)）。I_m 是第 m 张全分辨率输入图；P^T 按各层深度 d 把它反投影（采样）到 LDM 各层；β_m 是逐层逐像素的权重，满足 β≥0、Σ_m β_m = 1；𝒪 按 σ 做 over 合成。"}, {"tex": "\\mathbf{c}_\\ell(\\mathbf{p}) = \\sum_{m=1}^{M} \\beta_{\\ell,m}(\\mathbf{p})\\;\\mathbf{I}_m\\big(\\pi_m(\\mathbf{X}_\\ell(\\mathbf{p}))\\big)", "explain_zh": "逐层颜色。X_ℓ(p) 是第 ℓ 层、像素 p 的 3D 点（见 q4）；π_m 投影到输入 m 的像素坐标；I_m(·) 表示双线性采样；β_{ℓ,m}(p) 是 softmax 权重。"}, {"tex": "\\mathbf{C}(\\mathbf{p}) = \\sum_{\\ell=1}^{L} \\mathbf{c}_\\ell(\\mathbf{p})\\,\\sigma_\\ell(\\mathbf{p})\\prod_{j=\\ell+1}^{L}\\big(1-\\sigma_j(\\mathbf{p})\\big),\\qquad D(\\mathbf{p}) = \\sum_{\\ell=1}^{L} d_\\ell(\\mathbf{p})\\,\\sigma_\\ell(\\mathbf{p})\\prod_{j=\\ell+1}^{L}\\big(1-\\sigma_j(\\mathbf{p})\\big)", "explain_zh": "over 合成的最终颜色 C，以及可选的深度图 D（把颜色换成各层深度后同样合成）。ℓ=L 是最近层，∏ 是更近各层的透射率。"}]}, {"b": "p", "t": "1080p 约 1.3 ms/帧；Quark 6 层，Quark+ 8 层，M=8。消融 “RGB Output”：PSNR 30.4071→29.1779（−1.23 dB），SSIM 0.9165→0.8926，LPIPS 0.1543→0.1788，运行时间 −4.56%，是所有消融中退化最大的一项。", "label": "具体数字"}, {"b": "p", "t": "选 IBR，是因为高频纹理直接取自全分辨率输入，网络在低分辨率上求解就够了，从而能以实时速度输出 1080p 到 2K。作者用 “RGB Output” 消融（−1.23 dB）否定了直接输出 RGB；在定性分析中还推测，Quark 比 SIMPLI 更锐利 “likely aided by its use of IBR with blend weights”。显式的视角相关外观模型（NeX、Ref-NeRF）则被留作未来工作。", "label": "为什么这样设计"}, {"b": "p", "t": "（1）Eq.1 原文写的是 Σ_m β_m·P^T(I,d)，每一项都放了整组 I，应理解为 P^T(I_m,d)。（2）表 8（Quark）的 Output 行写 “8,1080,1920,4 (RGB+σ)”，但 Quark 只有 6 层：这个 8 可能指 M=8 张重采样后的输入图，也可能是从表 9（8 层）抄来的笔误。（3）凸组合意味着没有生成颜色的能力：8 张输入都没看到的遮挡区域，只能取到错误的像素，表现为硬边。（4）“RGB Output” 消融只是取外观特征的前 3 个通道，不是精心设计的 RGB 解码器，所以 −1.23 dB 可能高估了 IBR 相对于一个好的 RGB 头的优势。", "label": "容易误解的地方"}, {"b": "qa", "items": [{"q": "一面白墙在 8 张输入里的亮度因曝光不同而略有差异。目标相机平移时，为什么这块墙面的亮度会跳动？", "a": "该处颜色等于 Σ β_m I_m，而 β 会随目标视角变化（射线编码让权重偏向近邻视角），输入集合切换时甚至会突变。既然各输入曝光不同，β 一变，输出亮度就跟着变，于是出现闪烁。要解决这个问题，需要做颜色和曝光标定，或者在网络里显式建模曝光差异。"}]}, {"b": "sec", "h": "Q11 · 训练：数据混合、10·L1 + LPIPS、两阶段分辨率、学习率日程", "id": "walk-quark-q11", "sn": {"label": "论文位置", "t": "§3.4 Training（含其后的数据集段与模型变体段）；§4.2（消融的训练设置）；引用 Zhang et al. 2018（LPIPS）、Radford et al. 2019（GPT-2 的 residual scaling）"}}, {"b": "p", "t": "输入：Spaces、RFF、NeX-Shiny、SWORD 中已标定的多视角静态图像；每个样本包含 8 张输入和 1 张 held-out 目标。输出：训练好的 Quark / Quark+ 权重。", "label": "这一步做什么", "mn": {"label": "需要的基础", "links": [{"k": "concept-l-loss"}, {"k": "concept-f-optim"}, {"k": "concept-v-metrics"}, {"k": "concept-g-sfm"}, {"k": "concept-n-generalizable"}]}}, {"b": "p", "t": "损失函数是 10·L1 + LPIPS（l-loss、v-metrics）。L1 保证逐像素的颜色和亮度正确，而且比 L2 对离群值更鲁棒；LPIPS 在预训练网络的特征空间里比较两张图，会惩罚模糊、奖励锐利的纹理。系数 10 大概是为了让两项量级可比，论文没有解释。\n\n数据方面：四个静态数据集加权混合，较小的 Shiny 权重为 0.25，其余等权。每个样本按其宽高比调整内部 LDM 的形状，同时保持每层像素总数与 1080p 模型相同。近/远平面按 SfM 点的深度分布逐样本设定（g-sfm）。训练中没有任何动态视频，但模型可以直接用在 N3DV 视频上，因为它逐帧处理，每一帧对它来说就是一个静态多视角样本。\n\n优化方面（f-optim）：先用半分辨率的输入和 LDM 训练 250K 步，再在全分辨率上训练 350K 步，共 600K 步。目标图和渲染图随机裁剪（两阶段分别为 256² 和 512²）以节省显存，因为 IBR 渲染是逐像素的，只需渲染裁剪区域。学习率先用 20K 步 warmup 到 1.5e-4，保持 520K 步，再在“最后 680K 步”里 cosine 衰减到 0。全网络使用 GPT-2 式的 residual scaling（按残差层数缩放残差分支的初始化），以稳定深层网络的训练。", "mn": {"label": "类比", "t": "先在小图上学会大致怎么对齐，再到大图上练精细活。裁剪就像每次只检查拼图的一个角，但拼图本身每次都要完整拼一遍。"}}, {"b": "eqs", "eqs": [{"tex": "\\mathcal{L} = 10\\,\\lVert \\hat{\\mathbf{I}} - \\mathbf{I} \\rVert_1 + \\operatorname{LPIPS}(\\hat{\\mathbf{I}},\\mathbf{I})", "explain_zh": "Î 是渲染出的目标视角图（裁剪区域），I 是 held-out 的真实目标图；‖·‖_1 是逐像素绝对误差的平均。"}, {"tex": "\\operatorname{LPIPS}(\\hat{x},x) = \\sum_{l}\\frac{1}{H_l W_l}\\sum_{h,w}\\big\\lVert \\mathbf{w}_l \\odot (\\hat{\\mathbf{y}}^{l}_{hw} - \\mathbf{y}^{l}_{hw}) \\big\\rVert_2^2", "explain_zh": "LPIPS 的定义（Zhang et al. 2018）。ŷ^l、y^l 是两张图在预训练网络第 l 层的特征，已按通道归一化；H_l、W_l 是该层的空间尺寸；w_l 是学到的逐通道权重；⊙ 是逐元素乘。"}, {"tex": "\\eta_{\\text{lr}}(t) = \\begin{cases} 1.5\\times10^{-4}\\cdot t/20\\text{K}, & t < 20\\text{K} \\\\ 1.5\\times10^{-4}, & 20\\text{K} \\le t < 540\\text{K} \\\\ 0.75\\times10^{-4}\\big(1 + \\cos\\frac{\\pi(t-540\\text{K})}{680\\text{K}}\\big), & t \\ge 540\\text{K} \\end{cases}", "explain_zh": "按原文字面写出的学习率日程，t 是训练步数。按字面理解，衰减到 0 要到 1.22M 步，而总步数只有 600K。在 600K 处，余弦项只走了 60K/680K，学习率仍约为峰值的 98%。这说明原文有笔误，或者“最后 680K”另有所指。"}]}, {"b": "p", "t": "batch size 16，单台 16×A100 机器。250K + 350K = 600K 步；裁剪 256×256 和 512×512；学习率峰值 1.5e-4，warmup 20K，保持 520K，cosine 680K（与总步数矛盾）；Shiny 权重 0.25。消融模型在半分辨率下训练 250K 步；另有一个 4–16 张输入的可变版本。训练总时长、框架和显存都未报告。", "label": "具体数字"}, {"b": "p", "t": "论文没有逐条说明这些选择的动机，以下是合理的解读：多数据集混合是为了泛化；从最近 16 个视角中随机抽 8 个，是为了对视角选择更鲁棒；加 LPIPS 是为了锐利，避免 L2 带来的模糊；先低分辨率后高分辨率，是为了在大部分训练时间里降低成本。", "label": "为什么这样设计"}, {"b": "p", "t": "（1）学习率日程与总步数矛盾。（2）训练集包含 RFF 和 Shiny，表 1 又在这两个数据集上评测，论文没说明评测场景是否从训练集中剔除。（3）ENeRF 等基线是在 RFF+IBRNet 数据上重训的，与 Quark 的训练数据不同。（4）训练集里没有视频、没有专门的人像数据，也没有 DL3DV，在这些数据上的表现属于零样本泛化。", "label": "容易误解的地方"}, {"b": "qa", "items": [{"q": "为什么只对 256×256 的裁剪计算损失，训练出的网络却能输出整幅图？这样做省了什么，没省什么？", "a": "IBR 渲染是逐像素独立的：每个输出像素只依赖该位置的 LDM 列和对输入图的采样，所以只渲染裁剪区域就能得到正确的局部监督。省下的是全分辨率渲染和 LPIPS 的显存与时间。没省的是 LDM 求解本身：按论文的描述推断，Update & Fuse 仍要在整个内部分辨率上运行，并参与反向传播。"}]}, {"b": "sec", "h": "Q12 · 如何读实验、运行时间与消融", "id": "walk-quark-q12", "sn": {"label": "论文位置", "t": "§4.1（Tab. 1–3，Fig. 4–6）；§4.2（Tab. 4–5）；§4.3；附录 A（Tab. 6–7）；附录 B（Fig. 7–8）；附录 C（Fig. 9）"}}, {"b": "p", "t": "输入：论文的全部表格和图。输出：判断 Quark 到底证明了什么、没有证明什么。", "label": "这一步做什么", "mn": {"label": "需要的基础", "links": [{"k": "concept-v-metrics"}, {"k": "concept-v-temporal"}, {"k": "concept-n-nerf"}, {"k": "concept-n-3dgs"}, {"k": "concept-n-generalizable"}]}}, {"b": "p", "t": "先弄清指标（v-metrics）。PSNR = 10·log10(1/MSE)，逐像素计算，偏好平滑的结果；SSIM 看局部结构；LPIPS 看感知差异，越低越好。三者都是逐帧指标，没有任何一个衡量时间闪烁（作者自己承认，见 v-temporal）。TIME 列包含重建和渲染。\n\n表 1 是核心的同类比较：可泛化方法、同一硬件。Quark 在三个数据集上全面领先，速度快 6 倍以上。但要注意两点：训练数据不同；2048×1536 那几行里，内部几何分辨率并没有变。表 2 和表 3 是跨类比较，对手是逐场景优化方法。这里的基线数字照搬原论文；DL3DV 的评测分辨率较低；“每 8 张取 1 张作目标”在稠密轨迹上接近插值，天然有利于 IBR。Deep Blending 上的失败则标出了“最近 8 个视角够用”这一假设的边界。\n\n表 4 的消融在半分辨率上训练 250K 步，没有报告多次运行或方差，PSNR 差异在 0.08–1.23 dB 之间。按影响排序：IBR 输出（−1.23）> render-and-refine（−0.70）≈ cross attention（−0.68）> 射线编码（−0.09）；layer collapse 用 0.16 dB 换来了超过 2 倍的加速。附录 A 的 FLOPs 是理论值；Fig. 7 显示运行时间随输入数线性增长；Fig. 8 显示大部分时间花在 Update & Fuse 上，最终上采样和渲染占比很小。", "mn": {"label": "类比", "t": "像读体检报告：先看每项指标测的是什么（PSNR 看像素，LPIPS 看观感，没有哪项测“闪不闪”），再看对照组是不是在同样条件下测的。"}}, {"b": "eqs", "eqs": [{"tex": "\\operatorname{PSNR} = 10\\log_{10}\\frac{1}{\\operatorname{MSE}},\\qquad \\frac{\\operatorname{MSE}_2}{\\operatorname{MSE}_1} = 10^{-\\Delta\\operatorname{PSNR}/10}", "explain_zh": "像素值取 [0,1] 时的 PSNR。ΔPSNR 是两者的差：+0.7 dB 意味着 MSE 降到原来的 10^{−0.07}≈0.85 倍，即减少约 15%；+1.23 dB 意味着 MSE 约减少 25%。"}, {"tex": "T(M) \\approx T_V + M\\,T_{\\text{image}}", "explain_zh": "附录 B 的运行时间模型。T_V 是特征体上的固定开销（One-to-many attention 近似 O(1)、Fusion 里的卷积、渲染）；T_image 是每多一个输入视角增加的开销（编码和 Update CNN，属于 O(M)）；M 是输入视角数。"}]}, {"b": "p", "t": "表 1，1024×768（PSNR/SSIM/LPIPS）：Quark 在 RFF 26.03/0.850/0.137，Shiny 26.51/0.866/0.108，N3DV 31.57/0.942/0.127，32.2 ms；Quark+ 在 RFF 26.53、N3DV 31.95，91.9 ms；ENeRF 在 RFF 23.71、N3DV 29.86，205 ms；GPNR 在 RFF 25.42，25 s；SIMPLI 在 RFF 23.35，4.4 s。表 1，2048×1536：Quark 在 RFF 25.42/0.809/0.233，Shiny 24.66/0.799/0.174，N3DV 31.46/0.940/0.187，33.0 ms；ENeRF 811 ms。表 2（DL3DV）：Quark 31.31/0.932/0.103，Zip-NeRF 31.22/0.921/0.112，3DGS 29.82/0.919/0.120。表 3：Mip-NeRF360 上 Quark 26.60，3DGS-30K 27.21，M-NeRF360 27.69；T&T 上 Quark 23.60，3DGS-30K 23.14；Deep Blending 上 Quark 23.61，3DGS-30K 30.04。表 5（Spaces，小/中/大基线）：29.03/29.57/29.43。Fig. 7：32 个输入视角以内仍大于 10 fps。", "label": "具体数字"}, {"b": "p", "t": "作者的实验设计是：和最相近的三种可泛化方法（ENeRF、GPNR、SIMPLI）在同一硬件上重训后比较，再借用公开数字与逐场景优化方法比较。没有与同期或稍早公开的 feed-forward 3DGS（如 pixelSplat、MVSplat、GPS-Gaussian）以及大模型 NVS（LVSM，2024 年 10 月公开于 arXiv）做比较。", "label": "为什么这样设计"}, {"b": "p", "t": "（1）“超过 Zip-NeRF 和 3DGS”只在 DL3DV 的这个协议下成立，而且设定并不完全相同。（2）“2K 实时”不等于 2K 几何。（3）消融没有方差；“No cross attention” 只在求解器内部把 keys 置零，计算 blend weights 时仍用完整的 keys，所以低估了注意力对混合的作用。（4）N3DV 只以 0 号相机为目标、每 10 帧评一帧，不能说明时间稳定性。（5）表 5 没给出 DeepView 的数值，SSIM 也因预处理差异不可比。", "label": "容易误解的地方"}, {"b": "qa", "items": [{"q": "Quark 在 RFF 上从 1024×768 升到 2048×1536，PSNR 从 26.03 降到 25.42，运行时间却只从 32.2 ms 增加到 33.0 ms。这说明了什么？", "a": "内部 LDM 每层的像素数没有变（与 288×512 等面积），输出分辨率只影响上采样和 IBR 采样，这部分只有毫秒级，所以时间几乎不变。但输出分辨率更高时，几何细节不足、上采样后的边缘和混合误差可能都会暴露出来，LPIPS 从 0.137 升到 0.233（论文没有做归因；而且两者针对不同分辨率的真值评测，不能严格对比）。“2K 实时”应理解为“2K 输出，每层几何约 15 万像素”。"}]}, {"b": "sec", "h": "配套文章", "id": "parts"}, {"b": "toc", "groups": [{"items": [{"k": "wpart-quark-tensor-trace", "t": "Quark · 张量追踪", "en": "", "s": "逐阶段列出 17 个关键张量的形状与含义。"}, {"k": "wpart-quark-experiments", "t": "Quark · 阅读实验", "en": "", "s": "论文里 10 组实验分别怎么读、真正说明了什么。"}, {"k": "wpart-quark-tradeoffs", "t": "Quark · 设计权衡", "en": "", "s": "8 个关键设计选择：换来了什么，付出了什么。"}, {"k": "wpart-quark-faq", "t": "Quark · 常见问题", "en": "", "s": "初读时最常问的 12 个问题。"}, {"k": "wpart-quark-exercises", "t": "Quark · 练习", "en": "", "s": "6 道由浅入深的动手练习。"}, {"k": "wpart-quark-glossary", "t": "Quark · 论文术语", "en": "", "s": "读这篇论文会遇到的 28 个术语。"}]}]}], "toc": true, "series": {}}}</script>
<script>
(function () {
  "use strict";
  // ================= lib: DOM, text and math helpers shared by every page =================
  // A page script defines rich(text) (inline cross-links); paras() and eqList() call it.
  var DATA;
  try { DATA = JSON.parse(document.getElementById("data").textContent); } catch (e) { DATA = {}; }
  var meta = DATA.meta || {};

  // ---------- DOM helpers: all text goes through textContent; external links are https-only ----------
  function safeUrl(u) { if (typeof u !== "string") return null; var s = u.trim(); return /^https:\/\/[^\s"'<>]+$/i.test(s) ? s : null; }
  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (!Object.prototype.hasOwnProperty.call(attrs, k)) continue;
      var v = attrs[k];
      if (v === null || v === undefined || v === false) continue;
      if (k === "class") n.className = v;
      else if (k === "text") n.textContent = String(v);
      else if (k === "href") { var u = safeUrl(v); if (u) { n.setAttribute("href", u); n.setAttribute("target", "_blank"); n.setAttribute("rel", "noopener noreferrer"); } }
      else if (k.slice(0, 2) === "on" && typeof v === "function") n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, String(v));
    }
    (kids || []).forEach(function (c) { if (c === null || c === undefined || c === false) return; n.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return n;
  }
  var SVGNS = "http://www.w3.org/2000/svg";
  function sv(tag, attrs, kids) {
    var n = document.createElementNS(SVGNS, tag);
    if (attrs) for (var k in attrs) {
      if (!Object.prototype.hasOwnProperty.call(attrs, k)) continue;
      var v = attrs[k];
      if (v === null || v === undefined || v === false) continue;
      if (k === "text") n.textContent = String(v);
      else if (k.slice(0, 2) === "on" && typeof v === "function") n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, String(v));
    }
    (kids || []).forEach(function (c) { if (c) n.appendChild(c); });
    return n;
  }
  function arr(x) { return Array.isArray(x) ? x : []; }
  function str(x) { return typeof x === "string" ? x : (x === null || x === undefined ? "" : String(x)); }
  function paras(text) { return str(text).split(/\n\s*\n/).map(function (t) { return t.trim(); }).filter(Boolean).map(function (t) { return el("p", null, rich(t)); }); }
  function link(title, url) { return safeUrl(url) ? el("a", { href: url, text: title }) : el("span", { text: title }); }
  function ul(items, map) { return el("ul", { class: "plain" }, arr(items).map(function (x) { return el("li", null, [map ? map(x) : str(x)]); })); }
  function fmtCit(n) { n = Number(n); if (!(n >= 0)) return "—"; if (n >= 1000) return (n / 1000).toFixed(n >= 10000 ? 0 : 1) + "k"; return String(n); }

  // ---------- math (MathJax, typeset lazily) ----------
  var mathReady = false, mathQueue = [];
  function mathUsable() { return !!(window.MathJax && typeof window.MathJax.typesetPromise === "function"); }
  function flushMath() { mathReady = true; var q = mathQueue.slice(); mathQueue = []; q.forEach(typeset); }
  window.__atlasMathReady = flushMath;
  // MathJax may finish loading before this script runs (cached/async), so also poll for it.
  var mathPoll = setInterval(function () { if (mathUsable()) { clearInterval(mathPoll); flushMath(); } }, 200);
  setTimeout(function () { clearInterval(mathPoll); }, 30000);
  function typeset(node) {
    if (!node) return;
    if (!mathReady && mathUsable()) mathReady = true;
    if (!mathReady || !mathUsable()) { mathQueue.push(node); return; }
    try { window.MathJax.typesetPromise([node]).catch(function () { /* leave raw TeX visible */ }); } catch (e) { /* leave raw TeX visible */ }
  }
  function eqList(eqs) {
    eqs = arr(eqs).filter(function (q) { return q && str(q.tex).trim(); });
    if (!eqs.length) return null;
    return el("div", { class: "eqs" }, eqs.map(function (q) {
      return el("div", { class: "eq" }, [el("div", { class: "math-block", text: "\\[" + str(q.tex) + "\\]" }), q.explain_zh ? el("p", null, rich(q.explain_zh)) : null]);
    }));
  }
  document.addEventListener("toggle", function (e) { var t = e.target; if (t && t.tagName === "DETAILS" && t.open) typeset(t); }, true);

  // ================= frame (Tufte site): links, notes, hover previews, top bar, theme =================
  var SITE = DATA.site || {};
  var ROOT = str(SITE.root);
  var XREF = DATA.xref || {};
  function hasX(key) { return Object.prototype.hasOwnProperty.call(XREF, key); }
  // Custom page parts (search tools, diagrams, charts) register here; blocks.js calls them for {"b": "slot"} blocks.
  var SLOTS = {};

  // ---------- internal links: urls are relative to the site root; pages sit at different depths ----------
  var SAFE_PATH = /^[A-Za-z0-9][A-Za-z0-9._\/-]*(\?[A-Za-z0-9=&._-]+)?(#[A-Za-z0-9._-]+)?$/;
  function relHref(u) {
    u = str(u);
    if (/^#[A-Za-z0-9._-]+$/.test(u)) return u;
    if (!SAFE_PATH.test(u)) return null;
    var cut = u.indexOf("#"), path = cut < 0 ? u : u.slice(0, cut);
    if (path === SITE.path) return cut < 0 ? "#" : u.slice(cut);
    return ROOT + u;
  }
  function pageLink(u, text, cls) {
    var h = relHref(u);

    }
    function withNotes(nodes, b) {
      if (nodes.length && b.mn) nodes[0].insertBefore(marginnote(noteNodes(b.mn)), nodes[0].firstChild);
      if (nodes.length && b.label) nodes[0].insertBefore(runIn(b.label), nodes[0].firstChild);
      return nodes;
    }
    function listItem(x) {
      if (typeof x === "string") return el("li", null, rich(x));
      return el("li", null, (x.label ? [runIn(x.label)] : []).concat(rich(x.t)));
    }
    function refsList(items, cls) {
      var left = items.some(function (x) { return x.left; });
      return el("ul", { class: "refs " + (cls || "") + (left ? "" : " noleft") }, items.map(function (x) {
        var body = [x.k || x.u || x.url ? part(x) : el("span", { class: "plain-t", text: x.t })];
        if (x.tag) body.push(el("span", { class: "used", text: x.tag }));
        if (x.sub) body.push(el("div", { class: "en", text: x.sub }));
        if (str(x.gloss).trim()) body.push(el("div", { class: "gloss" }, multiline(x.gloss)));
        var kids = left ? [el("span", { class: /^\d{4}$/.test(str(x.left)) ? "yr" : "kind", text: str(x.left) })] : [];
        return el("li", { id: x.id || null }, kids.concat([el("div", null, body)]));
      }));
    }
    var TY = { book: "教材", course: "课程", paper: "论文", tutorial: "教程", code: "代码", video: "视频", blog: "文章" };
    function tocGroups(groups, level) {
      var out = [];
      arr(groups).forEach(function (g) {
        if (g.h) out.push(el(level, { class: "toc-h" }, [g.k || g.u ? part({ k: g.k, u: g.u, t: g.h }) : g.h]));
        if (str(g.lede).trim()) out.push(el("p", { class: "toc-lede" }, rich(g.lede)));
        out.push(el("ol", { class: "toc" }, arr(g.items).map(function (it) {
          return el("li", null, [
            el("div", { class: "toc-t" }, [part({ k: it.k, u: it.u, t: it.t }), it.en ? el("span", { class: "en", text: it.en }) : null,
              it.meta ? el("span", { class: "toc-meta", text: it.meta }) : null]),
            str(it.s).trim() ? el("p", { class: "toc-s", text: it.s }) : null
          ]);
        })));
      });
      return out;
    }
    function cell(tag, c) { return el(tag, null, c && typeof c === "object" ? [part(c)] : rich(c)); }

    var box = null;
    function cur() { if (!box) { box = el("section"); art.appendChild(box); } return box; }
    function render(b) {
      switch (b.b) {
        case "p": return withNotes(paras(b.t), b);
        case "lines": return withNotes(lines(b.t), b);
        case "h3": return [heading("h3", b)];
        case "note": return [el("p", { class: "note", text: b.t })];
        case "ul": case "ol": return [el(b.b, null, arr(b.items).map(listItem))];
        case "eqs": return [eqList(b.eqs)];
        case "qa": return [el("p", { class: "quiz-h", text: "自测" }), el("ol", { class: "quiz" }, arr(b.items).map(function (q) {
          return el("li", null, [el("p", null, rich(q.q)), el("details", null, [el("summary", { text: "答案" }), el("p", null, rich(q.a))])]);
        }))];
        case "res": return [refsList(arr(b.items).map(function (r) {
          return { left: TY[r.type] || r.type || "", url: r.url, t: r.title, gloss: r.note_zh };
        }))];
        case "refs": return [refsList(arr(b.items), b.cls)];
        case "toc": return tocGroups(b.groups, cur().querySelector("h2") ? "h3" : "h2");
        case "table": return [el("div", { class: "table-wrap" + (b.wide ? " fullwidth" : "") }, [el("table", { class: "booktabs" + (b.cls ? " " + b.cls : "") }, [
          el("thead", null, [el("tr", null, arr(b.head).map(function (h) { return el("th", { text: h }); }))]),
          el("tbody", null, arr(b.rows).map(function (r) { return el("tr", null, arr(r).map(function (c) { return cell("td", c); })); }))
        ])])];
        case "timeline": return [el("ul", { class: "refs timeline" }, arr(b.items).map(function (x) {
          return el("li", null, [el("span", { class: "yr", text: str(x[0]) }), el("div", null, rich(x[1]))]);
        }))];
        case "kv": return [el("table", { class: "kv" }, [el("tbody", null, arr(b.items).map(function (x) {
          return el("tr", null, [el("th", { text: x[0] }), el("td", null, rich(x[1]))]);
        }))])];
        case "mtoc": return [marginToc(b.items)];
        case "slot": return typeof SLOTS[b.name] === "function" ? [SLOTS[b.name](b)] : [];
        default: return [];
      }
    }
    // Long articles: a table of contents at the top of the margin (a folding list on phones).
    function marginToc(items) {
      var d = el("details", { class: "mtoc" }, [el("summary", { text: "本文目录" }), el("ol", null, arr(items).map(function (x) { return el("li", null, [part(x)]); }))]);
      var wide = window.matchMedia("(min-width: 761px)");
      d.open = wide.matches;
      return d;
    }
    arr(PG.body).forEach(function (b) {
      if (b.b === "sec") {
        box = el("section", { id: b.id || null });
        if (b.h) box.appendChild(heading("h2", { t: b.h, sn: b.sn }));
        art.appendChild(box);
        return;
      }
      render(b).forEach(function (n) { if (n) cur().appendChild(n); });
    });

    var S = PG.series || {};
    if (S.prev || S.next || S.up) {
      var nav = el("nav", { class: "series", "aria-label": "同系列" });
      nav.appendChild(el("div", { class: "prev" }, S.prev ? [el("small", { text: "上一篇" }), part(S.prev)] : []));
      nav.appendChild(el("div", { class: "up" }, S.up ? [part(S.up)] : []));
      nav.appendChild(el("div", { class: "next" }, S.next ? [el("small", { text: "下一篇" }), part(S.next)] : []));
      art.appendChild(nav);
    }
  })();

  finishPage();
})();
</script>
</body>
</html>
