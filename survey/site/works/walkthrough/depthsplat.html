"guide-depthsplat", "head": {"title": "DepthSplat 导读", "sub": "DepthSplat: Connecting Gaussian Splatting and Depth", "meta": ["12 步", {"k": "anchor-depthsplat", "t": "DepthSplat 精读"}], "epigraph": "", "prereqs": [], "lede": "", "minutes": 46}, "body": [{"b": "sec", "h": null, "id": "story"}, {"b": "mtoc", "items": [{"u": "#walk-depthsplat-ds1", "t": "DS1 问题设定：已知位姿的 V 张图（默认 2 张 256×256），一次前向为每个像素给出一个 3D 高斯"}, {"u": "#walk-depthsplat-ds2", "t": "DS2 多视角分支①：CNN 提取 1/4 特征，6 层 Swin 式多视角 Transformer 在视角间交换信息"}, {"u": "#walk-depthsplat-ds3", "t": "DS3 多视角分支②：逆深度上 128 个候选的平面扫描代价体（点积 / √C，对邻居取平均）"}, {"u": "#walk-depthsplat-ds4", "t": "DS4 单目分支：Depth Anything V2 的 ViT 编码器取 4 层特征，插值到代价体分辨率，以 1/100 的学习率微调"}, {"u": "#walk-depthsplat-ds5", "t": "DS5 拼接融合：[代价体 128，CNN 128，多视角 128，单目 384] 进入带跨视角注意力的 2D U-Net，softmax 取深度期望"}, {"u": "#walk-depthsplat-ds6", "t": "DS6 由粗到细（base/large）：在 2 倍分辨率上围绕粗深度再放 32 个候选，间隔减半"}, {"u": "#walk-depthsplat-ds7", "t": "DS7 DPT 上采样：融合 ViT 的 4 层特征、CNN 特征与多视角特征，预测全分辨率的逆深度残差"}, {"u": "#walk-depthsplat-ds8", "t": "DS8 高斯头：每像素 37 个数，包括不透明度、像素内偏移、scale、四元数和 2 阶 SH（直流项加上输入颜色）"}, {"u": "#walk-depthsplat-ds9", "t": "DS9 渲染与损失：CUDA 光栅化渲染目标视角，损失为 MSE + 0.05·LPIPS，中间尺度再乘 0.9，全程没有深度监督"}, {"u": "#walk-depthsplat-ds10", "t": "DS10 训练设定：AdamW，主体学习率 2e-4、ViT 学习率 2e-6，OneCycle 调度 150K 步，4 张 GH200，总 batch 32"}, {"u": "#walk-depthsplat-ds11", "t": "DS11 扩展到更多视角与更高分辨率：每个视角只配 2 个最近邻，12 张 512×960 输入约 0.6 s 完成重建"}, {"u": "#walk-depthsplat-ds12", "t": "DS12 反方向：把高斯渲染损失当作深度的无监督预训练，再用 GT 深度微调（在 ScanNet、TartanAir、KITTI 上评测）"}]}, {"b": "p", "t": "设想手里有同一个房间的两张照片，拍摄位置相差一两米，相机位姿已经由 SLAM 算好。你想马上从两者之间的某个位置看这个房间，不愿意等几分钟做逐场景优化。2024 年的主流做法是前馈式 3D Gaussian Splatting：网络看一遍输入图像，为每个像素预测一个 3D 高斯，然后用光栅化渲染任意视角。pixelSplat 最早这样做，MVSplat 让它又快又准。MVSplat 先用多视角 Transformer 提特征，再像传统多视角立体（MVS）那样，把另一张图的特征按 128 个候选深度 warp 过来逐一比对，组成代价体，由 softmax 选出每个像素最可能的深度。高斯中心就放在“光心 + 深度 × 射线”的位置。\n\n这类方法的质量几乎完全由深度决定。高斯与像素对齐，深度一错，高斯就悬在半空，换个角度看就是重影和飞点。代价体的弱点是公认的：白墙、地板、天空这类弱纹理区域没有可区分的特征；窗户和镜面违反光度一致；被遮挡或只出现在一张图里的区域，根本找不到匹配对象。MVSplat 在这些地方只能靠猜。与此同时，单目深度基础模型进步很快。Depth Anything V2 在大量图像上训练，只看一张图就能给出形状合理、边界清楚的相对深度，擅长的恰好是代价体不擅长的地方。它的问题是不知道绝对尺度，而且各视角各算各的，放在一起并不一致。DepthSplat 的核心直觉可以用一句话概括：这两者互补，那就让网络同时看到“匹配证据”和“单目常识”，逐像素决定信谁。\n\n做法很直接。多视角分支沿用 MVSplat 和 UniMatch：CNN 提取 1/4 分辨率的特征，6 层 Swin 式多视角 Transformer 在视角之间交换信息，再在逆深度上均匀取 128 个候选建代价体。单目分支把图像送进 Depth Anything V2 的 ViT 编码器，取 4 个中间层的特征，插值到同一分辨率。两路特征按通道拼接，交给一个带跨视角注意力的 2D U-Net，softmax 得到深度分布后取期望。大模型还会在上一级结果附近用 32 个候选再细化一次，最后由 DPT 头把深度上采样到全分辨率。另一个小卷积头为每个像素输出 37 个数：不透明度、像素内偏移、尺度、旋转和 2 阶球谐颜色。整个网络只用新视角的渲染损失（MSE + 0.05·LPIPS）端到端训练，ViT 以正常学习率的 1/100 一起微调。\n\n论文还有反方向的另一半。既然渲染要对，深度就得对，那么渲染损失本身就是深度的监督信号。于是可以在只有相机位姿、没有深度标注的大量视频上训练深度网络，把这一步当作“无监督预训练”，再用少量真值深度微调。作者在 TartanAir、ScanNet、KITTI 上的实验表明，这样预训练过的模型，比直接用 Depth Anything（单目 ViT）和 UniMatch（多视角 Transformer）的有监督权重初始化再微调的模型更好，在难的 TartanAir 和 KITTI 上尤其明显。标题里的 “Connecting” 指的就是这两个方向：更好的深度带来更好的高斯，高斯渲染反过来也能训练出更好的深度。\n\n结果：在 RealEstate10K 两视角 256×256 上，PSNR 为 27.47，高于 MVSplat 的 26.39 和 pixelSplat 的 25.89（DepthSplat 表沿用的 pixelSplat 旧版数字，其 camera-ready 版为 26.09）。在 DL3DV 上，2、4、6 视角都领先 MVSplat 1.3–1.8 dB，视角越少领先越多。12 张 512×960 的输入在 A100 上约 0.6 s 完成重建。在 small 模型上做的消融显示，去掉单目特征掉 0.8 dB，去掉代价体掉 3.6 dB。也就是说，匹配仍然是主力，单目是关键的补充。\n\n读这篇论文时有几点要看清。第一，头条数字来自 354M 参数的大模型，其中 ViT-L 就占 304M，而 MVSplat 只有 12M；38M 的 small 模型是 26.84，只比 MVSplat 高 0.45 dB。第二，评测都是插值设定，DL3DV 的目标帧里甚至包括输入帧本身。第三，每个像素一个高斯，视角数和分辨率一上去，高斯数就是几百万个。第四，论文“深度”那一半只能复现一半：渲染预训练就是常规训练，可以跑；之后的真值深度微调和深度评测，仓库里没有代码。第五，代码里有一批从 MVSplat 继承来却不再生效的配置项，改了不会有任何效果。\n\n和站内另外两篇重点论文对照着读更清楚。Quark 为每个目标视角即时生成分层深度图，再混合原始像素；DepthSplat 则一次性输出一堆持久的高斯，之后渲染多少个视角都很便宜。Ha et al. 用 RAFT-Stereo 在人工挑选的立体对上求深度，再解析地生成像素级高斯；DepthSplat 提供了一个可以直接替换它的、学习式的“单目 + 多视角”深度前端。对 3D 临场系统来说，最值得带走的是这个深度前端的设计，以及“只用渲染损失，就能在自己的相机阵列上让深度网络自适应”这一点。"}, {"b": "sec", "h": "流水线", "id": "pipeline"}, {"b": "p", "t": "点击方框跳到对应步骤。"}, {"b": "slot", "name": "diagram", "which": "depthsplat", "label": "DepthSplat 流程图", "spec": {"w": 960, "nodes": [{"x": 10, "y": 160, "w": 135, "h": 64, "t": "输入图像+位姿", "s": "默认 2×256×256", "step": "ds1"}, {"x": 10, "y": 48, "w": 135, "h": 64, "t": "最近邻选择", "s": "V>3 时每视角配 2 个", "step": "ds11"}, {"x": 167, "y": 48, "w": 135, "h": 64, "t": "多视角特征", "s": "CNN+6层Transformer", "step": "ds2"}, {"x": 167, "y": 272, "w": 135, "h": 64, "t": "单目特征", "s": "DA-V2 ViT，4 层", "step": "ds4"}, {"x": 323, "y": 48, "w": 135, "h": 64, "t": "代价体", "s": "128 个逆深度候选", "step": "ds3", "data": true}, {"x": 480, "y": 160, "w": 135, "h": 64, "t": "拼接+U-Net", "s": "softmax 求深度期望", "step": "ds5"}, {"x": 480, "y": 48, "w": 135, "h": 64, "t": "第二尺度细化", "s": "32 候选，间隔减半", "step": "ds6"}, {"x": 637, "y": 160, "w": 135, "h": 64, "t": "DPT 上采样", "s": "全分辨率逆深度残差", "step": "ds7"}, {"x": 637, "y": 272, "w": 135, "h": 64, "t": "逐视角深度", "s": "可单独作深度模型", "step": "ds12", "data": true}, {"x": 793, "y": 160, "w": 135, "h": 64, "t": "高斯头", "s": "每像素 37 个参数", "step": "ds8"}, {"x": 793, "y": 272, "w": 135, "h": 64, "t": "光栅化渲染", "s": "MSE+0.05·LPIPS", "step": "ds9"}], "edges": [{"d": "M145,192 C156,192 156,80 167,80"}, {"d": "M145,80 L167,80"}, {"d": "M145,192 C156,192 156,304 167,304"}, {"d": "M302,80 L323,80"}, {"d": "M458,80 C469,80 469,192 480,192"}, {"d": "M302,304 C391,304 391,192 480,192"}, {"d": "M548,160 L548,112"}, {"d": "M615,80 C626,80 626,192 637,192"}, {"d": "M615,192 L637,192"}, {"d": "M704,224 L704,272"}, {"d": "M772,192 L793,192"}, {"d": "M860,224 L860,272"}, {"d": "M928,304 L948,304 L948,376"}], "loop": {"x": 781, "y": 128, "w": 159, "h": 234, "label": "只用渲染损失训练", "noteK": "ds10", "note": "主体 lr 2e-4，ViT 2e-6"}, "out": {"x": 870, "y": 394, "text": "新视角图像（RE10K 256×256）"}, "h": 406}}, {"b": "sec", "h": "读之前先掌握", "id": "before"}, {"b": "refs", "items": [{"k": "concept-g-pinhole", "gloss": "高斯中心的计算方式是：光心加上 z 乘以 K⁻¹[u,v,1]ᵀ 在世界系中的方向。代价体需要把参考像素按候选深度反投影，再投影到邻居视角。代码使用归一化内参（第一行除以宽、第二行除以高）和 camera-to-world 外参，不熟悉针孔模型和坐标变换，就读不懂 matching.py 和 projection.py。"}, {"k": "concept-g-depth", "gloss": "DepthSplat 在逆深度 [1/far, 1/near] 上均匀取 128 个候选，最后取逆深度的期望。要理解为什么近处的候选更密、远处 10 m 处的候选间隔会超过 1 m，以及 near 取 0.5 意味着什么，需要先弄清楚深度、视差、逆深度三者的关系。"}, {"k": "concept-d-mvs", "gloss": "多视角分支就是一个学习式 MVS：提取特征，按候选深度 warp，逐像素求相关，得到代价体，再用 softmax 回归深度。两尺度由粗到细的设计也来自 MVS 的级联思路。MVS 在弱纹理、反光、遮挡处为什么会失败，正是本文引入单目分支的动机。"}, {"k": "concept-i-psv", "gloss": "代价体本质上是在特征空间里做平面扫描（plane sweep）：对每个候选深度平面，把邻居特征重采样到参考视角。理解平面扫描体，就能明白代价体的形状为什么是 [D, h, w]，以及它为什么能像普通图像通道一样交给 2D U-Net 处理。"}, {"k": "concept-d-mono", "gloss": "单目分支用的是 Depth Anything V2 的 ViT 编码器。需要知道单目深度只能给出相对深度，尺度未知，各视角之间也不一致；但它在弱纹理和边界处给出的形状很可靠。这决定了本文取的是它的“特征”，而不是它输出的深度图。"}, {"k": "concept-l-attention", "gloss": "网络里有三处注意力：多视角 Transformer 在 2×2 窗口内做 self-attention 和 cross-attention；ViT 的全局自注意力；U-Net 在低分辨率层把所有视角的 token 拼成一个序列做自注意力。要分清三者各自的作用，以及它们的计算量如何随视角数和分辨率增长。"}, {"k": "concept-l-cnn", "gloss": "CNN 编码器（残差块，InstanceNorm）、回归深度的 2D U-Net、DPT 的 RefineNet 融合块、两层卷积的高斯头，都是标准的卷积构件。读懂 U-Net 的跳连和多级下采样，才能看明白代价体融合和 DPT 上采样在做什么。"}, {"k": "concept-n-3dgs", "gloss": "输出的每个像素是一个 3D 高斯：均值、由 scale 和四元数组成的协方差、不透明度、球谐颜色。需要熟悉 3DGS 的参数化、投影和 α 合成，才能理解高斯头的 37 个通道分别是什么，以及渲染损失的梯度如何一路传回深度。"}, {"k": "concept-r-alpha", "gloss": "渲染时，高斯按深度排序做前到后的 α 合成。深度估错时，前景和背景的高斯会以错误的次序叠加，形成重影。不透明度由网络预测，可以把不可靠的高斯“调暗”，这是理解高斯头设计的关键。"}, {"k": "concept-n-generalizable", "gloss": "DepthSplat 属于可泛化的前馈新视角合成：训练一次，对新场景只做一次前向推理。要知道它与逐场景优化（3DGS、NeRF）、逐射线推理（IBRNet、ENeRF）、无几何 Transformer（LVSM）的区别，才能判断它的速度和质量数字放在哪一类里比较。"}, {"k": "concept-l-loss", "gloss": "训练只用渲染损失：MSE 加 0.05 倍 LPIPS，两尺度模型再加 0.9 倍的中间尺度损失。论文的另一半把这种光度损失解释为深度的无监督预训练。需要理解光度损失能约束什么，以及在弱纹理区为什么约束不住。"}, {"k": "concept-v-metrics", "gloss": "新视角合成用 PSNR、SSIM、LPIPS 评测，深度用 Abs Rel、δ1 等指标评测。要会把 dB 差换算成 MSE 比例，例如 +1.08 dB 约等于 MSE 乘 0.78；还要注意评测索引里有一部分目标帧就是输入帧，这会抬高分数。"}]}, {"b": "sec", "h": "DS1 · 问题设定：已知位姿的 V 张图（默认 2 张 256×256），一次前向为每个像素给出一个 3D 高斯", "id": "walk-depthsplat-ds1", "sn": {"label": "论文位置", "t": "论文引言与方法部分开头（问题定义；节号未能核对）；Fig. 1 teaser（README 同图）；README “Camera Conventions”；config/experiment/re10k.yaml、dl3dv.yaml；src/model/encoder/encoder_depthsplat.py（forward）；src/geometry/projection.py（get_world_rays）"}}, {"b": "p", "t": "输入是字典 context：image [B,V,3,H,W]，取值 [0,1]；归一化内参 intrinsics [B,V,3,3]；camera-to-world 外参 extrinsics [B,V,4,4]（OpenCV 约定）；near/far [B,V]，RE10K 为 0.5/100，DL3DV 为 0.5/200。输出有两部分：一是高斯集合，其中 means [B,V·H·W,3]、covariances [B,V·H·W,3,3]、harmonics [B,V·H·W,3,9]、opacities [B,V·H·W]；二是每个视角的深度 [B,V,H,W]。解码器再按目标位姿渲染出 [B,V_tgt,3,H,W]。", "label": "这一步做什么", "mn": {"label": "需要的基础", "links": [{"k": "concept-g-pinhole"}, {"k": "concept-g-depth"}, {"k": "concept-n-3dgs"}, {"k": "concept-n-generalizable"}, {"k": "adv-a-ff-3dgs"}]}}, {"b": "p", "t": "先把任务说清楚。这是“可泛化、前馈”的新视角合成（n-generalizable、a-ff-3dgs）：网络在大量场景上训练一次，遇到新场景只做一次前向推理，不像原版 3DGS（n-3dgs）那样对每个场景优化几千步。输入是少量已标定、有位姿的照片，默认是 RealEstate10K（RE10K）的 2 张 256×256；输出是一组 3D 高斯，可以用光栅化器渲染任意视角。\n\nDepthSplat 沿用 pixelSplat 和 MVSplat 的“像素对齐”做法：每个输入像素恰好对应一个高斯，高斯中心落在这个像素的视线上，位置由深度决定（g-pinhole、g-depth）。这样一来，三维重建问题就变成了二维的稠密预测问题：为每个像素预测一个深度，再加上几个外观参数。所以论文标题叫“连接高斯溅射与深度”，而且是双向的。一个方向是深度越好，高斯越准；另一个方向是高斯的渲染损失可以反过来训练深度（见 ds12）。\n\n数据和评测也要先了解。RE10K 来自网上的房产视频，位姿由 SLAM/SfM 求得，尺度任意；DL3DV 是日常场景视频。评测沿用 pixelSplat 的协议：RE10K 每个场景 2 张输入、3 张目标，目标帧都在两张输入帧之间，所以是插值而不是外推。DL3DV 取前 50 帧中的 2、4、6 帧作为输入，渲染这 50 帧全部。\n\n和站内其他论文比较：Quark 为每个目标视角即时生成分层深度图（LDM），用完即丢；Ha et al. 用立体深度解析地生成像素级高斯，不经过学习；DepthSplat 用网络预测深度和高斯参数，输出的高斯可以长期保留并反复渲染。", "mn": {"label": "类比", "t": "就像把每张照片变成一块“针板”：每个像素伸出一根针，针的长度等于深度，针尖上粘一个彩色小球。两张照片的针板在空间里叠在一起，就拼出了房间。网络要做的主要是把每根针的长度定对。"}}, {"b": "eqs", "eqs": [{"tex": "\\boldsymbol{\\mu}_{i}(p)=\\mathbf{o}_i+z_i(p)\\,\\mathbf{R}_i\\,\\mathbf{K}_i^{-1}\\begin{bmatrix}u+\\delta_u\\\\ v+\\delta_v\\\\ 1\\end{bmatrix}", "explain_zh": "像素对齐高斯的中心（按 get_world_rays 与 gaussian_adapter 改写）。o_i 为第 i 个视角的光心（外参平移列）；R_i 为 camera-to-world 旋转；K_i 为归一化内参；(u,v) 为像素中心的归一化坐标，取值 (0,1)；(δ_u, δ_v) 为网络预测的像素内偏移，不超过半个像素；z_i(p) 为 z 方向的深度。代码把射线方向归一化为 z 分量等于 1，所以 z 是 z-depth，而不是沿射线的距离。"}, {"tex": "N_G = V\\cdot H\\cdot W", "explain_zh": "高斯总数。每个输入像素对应 1 个高斯（gaussians_per_pixel=1）。V 为输入视角数，H×W 为裁剪后的分辨率。RE10K 默认 2×256×256=131,072。"}]}, {"b": "p", "t": "RE10K：V=2，256×256，near 0.5，far 100，共 131,072 个高斯。评测索引有 6474 个有效场景，每个场景 3 个目标，输入间隔 45–136 帧（本地统计 assets/evaluation_index_re10k.json）。DL3DV：256×448（由 270×480 中心裁剪得到），训练时 V 在 2–6 之间随机，far 200；评测用 140 个场景，每个场景 50 个目标。高分辨率演示：V=12，512×960，共 5,898,240 个高斯，重建约 0.6 s（A100，README）。", "label": "具体数字"}, {"b": "p", "t": "像素对齐把三维问题化成二维稠密预测，可以直接使用 CNN、ViT、U-Net 这些成熟的二维网络，也能直接借用深度估计领域的预训练模型。这正是 DepthSplat 能接上 Depth Anything V2 的前提。没有采用的方案包括：逐场景优化的 3DGS（慢）；ENeRF、IBRNet 那样逐射线查询的体渲染（每个视角都要重算）；LVSM 那样的无几何 Transformer（不输出显式 3D，也不输出深度）。", "label": "为什么这样设计"}, {"b": "p", "t": "（1）“前馈”不等于“实时”：2 视角 256×256 时 small 约 0.050 s、大模型约 0.079 s（A100，论文变体表），12 视角 512×960 约需 0.6 s。（2）深度指 z-depth，不是射线长度；把深度图当射线距离使用，会让边缘处的点云变形。（3）内参必须归一化，第一行除以宽、第二行除以高；外参必须是 camera-to-world。换数据时最常见的错误就是约定不对。（4）评测是插值设定，外推视角的表现没有测过。", "label": "容易误解的地方"}, {"b": "qa", "items": [{"q": "为什么说对像素对齐的前馈高斯而言，新视角质量的上限主要由深度决定？除了深度，还有哪些参数能“掩盖”深度误差？", "a": "高斯中心被限定在像素的视线上，唯一的自由度就是深度。深度错了，高斯在新视角下就会落到错误的位置，出现错位、重影或飞点，其他参数都无法把它挪回正确位置。其他参数只能缓解：网络可以降低不可靠高斯的不透明度，放大 scale 让错误变成模糊，或者靠像素内偏移做亚像素微调。这些手段都以牺牲锐度为代价。"}]}, {"b": "sec", "h": "DS2 · 多视角分支①：CNN 提取 1/4 特征，6 层 Swin 式多视角 Transformer 在视角间交换信息", "id": "walk-depthsplat-ds2", "sn": {"label": "论文位置", "t": "论文方法部分“多视角分支”段（节号未能核对）；代码 src/model/encoder/unimatch/backbone.py（CNNEncoder）、mv_transformer.py（MultiViewFeatureTransformer、single_head_split_window_attention）、utils.py（mv_feature_add_position）、mv_unimatch.py:261-301；scripts/re10k_depthsplat_train.sh（gmflow-scale1-things 初始化）"}}, {"b": "p", "t": "输入 image [B,V,3,256,256]，先做 ImageNet 归一化，再送入 CNN。CNN 输出三级特征：[BV,64,128,128]、[BV,96,128,128]、[BV,128,64,64]。在 1/4 那一级的每个 2×2 窗口内加正弦位置编码，然后经过 6 层 Transformer，得到多视角特征 F_mv [BV,128,64,64]。以上是 small 模型在 RE10K 上的情况；DL3DV 模型的主尺度为 1/8，即 [BV,128,32,56]。", "label": "这一步做什么", "mn": {"label": "需要的基础", "links": [{"k": "concept-l-cnn"}, {"k": "concept-l-attention"}, {"k": "concept-l-encoding"}, {"k": "adv-a-learned-stereo"}, {"k": "adv-a-learned-mvs"}]}}, {"b": "p", "t": "这一步几乎原样继承自 UniMatch 和 GMFlow，Haofei Xu 本人的光流与深度工作，也是 MVSplat 的主干（l-cnn、l-attention、a-learned-stereo）。CNN 先做一次 7×7、步长 2 的卷积，再接三级残差块，归一化用 InstanceNorm。small 模型把 layer2 的步长设为 1，于是最低分辨率是 1/4，而不是 GMFlow 原本的 1/8，最后用 1×1 卷积得到 128 维特征。\n\nTransformer 共 6 层，每层先做 self-attention（视角内部），再做 cross-attention（看其他视角），最后接 FFN。计算都在窗口里进行：把 64×64 的特征图切成 2×2 个窗口，每个窗口 32×32=1024 个 token；奇数层把窗口平移半个窗口（Swin 的做法），让信息能跨窗口传播。多视角 cross-attention 的做法是：参考视角窗口里的 query，对所有邻居视角同一窗口位置的 token 拼成的一个长序列做一次 softmax，所以视角数不同也能用同一套权重。注意力是单头，128 维。\n\n为什么要在建代价体之前先做跨视角注意力？这样每个像素的特征已经“看过”另一张图，对重复纹理和弱纹理更有区分力，后面的点积相关也更可靠。MVSplat 的配置里至今保留着 wo_backbone_cross_attn 这个消融开关（其 Table 3 中的“w/o cross-view attention”），说明这一点做过验证。这部分权重从 GMFlow 在光流数据上训练的 gmflow-scale1-things 初始化，用 strict=False 载入。", "mn": {"label": "类比", "t": "两个人各拿一张照片找相同的东西。开始前先让他们隔着桌子交流几轮（cross-attention），“你那张左上角是不是有个红色花瓶？”这样再去逐点比对，找错的概率就低多了。"}}, {"b": "eqs", "eqs": [{"tex": "\\mathbf{m}_i=\\mathrm{softmax}\\!\\left(\\frac{(\\mathbf{F}_i\\mathbf{W}_q)\\,[\\mathbf{F}_{j}\\mathbf{W}_k]_{j\\in\\mathcal{N}(i)}^{\\top}}{\\sqrt{C}}\\right)[\\mathbf{F}_{j}\\mathbf{W}_v]_{j\\in\\mathcal{N}(i)}", "explain_zh": "按代码改写的窗口内多视角 cross-attention。F_i 为参考视角某个窗口内的 token（每个窗口 1024 个，C=128）；N(i) 为邻居视角集合，V≤3 时是全部其他视角，V>3 时是最近的 2 个；[·]_{j∈N(i)} 表示把邻居的同位置窗口 token 沿序列方向拼接；W_q、W_k、W_v 为无偏置的线性投影。softmax 在全部邻居 token 上一起归一化。"}, {"tex": "\\mathbf{F}_i\\leftarrow\\mathbf{F}_i+\\mathrm{LN}_2\\!\\Big(\\mathrm{MLP}\\big([\\mathbf{F}_i;\\ \\mathrm{LN}_1(\\mathbf{W}_o\\mathbf{m}_i)]\\big)\\Big)", "explain_zh": "cross-attention 层的残差更新（mv_transformer.py 中的 TransformerLayer）。W_o 为输出投影（代码中叫 merge）；[·;·] 为通道拼接，维度 2C=256；MLP 为 256→1024→128，中间用 GELU；LN 为 LayerNorm。self-attention 层没有 MLP，形式为 F←F+LN(W_o·Attn(F,F))。"}]}, {"b": "p", "t": "CNN 通道 64/96/128，参数 1.05M。Transformer 共 6 个 block（self-attn + cross-attn + FFN），d=128，单头，FFN 扩展比 4（作用在 2C 输入上），窗口 2×2（attn_splits_list=[2]，写死在 encoder_depthsplat.py:164），参数 3.15M（代码实例化统计）。small 模型在 RE10K 上 Transformer 的输入为 64×64，每窗口 1024 个 token；DL3DV 模型为 32×56，每窗口 16×28=448 个 token。", "label": "具体数字"}, {"b": "p", "t": "论文沿用 UniMatch 的匹配特征设计，理由之一是这些权重可以直接迁移。窗口注意力把复杂度从全图的 (hw)² 降到 (hw)²/4。单头、128 维是 GMFlow 的原始配置。没有采用的方案有：pixelSplat 的极线 Transformer（MVSplat 附录 Table B 做过对照，config 中有 use_epipolar_trans 开关）；完全不做跨视角交互（即 MVSplat 消融中的 w/o cross-view attention）。", "label": "为什么这样设计"}, {"b": "p", "t": "（1）cross-attention 只在同一窗口位置之间进行。视差很大时，对应点可能落在另一个窗口里，此时只能靠后面的代价体找回来。（2）这里的 Transformer 和单目分支的 ViT 是两个完全不同的网络：前者 3M 参数，负责匹配；后者 22–304M 参数，负责单目先验。（3）初始化用的是光流（Things 数据）上训练的 GMFlow，不是深度模型；配置中的 unimatch_weights_path（gmdepth 权重）并没有被代码读取。（4）位置编码是在每个 2×2 窗口内分别添加的，窗口之间的绝对位置不可见。", "label": "容易误解的地方"}, {"b": "qa", "items": [{"q": "如果输入是 5 张图，参考视角的 cross-attention 会看几张图？相比“看全部 4 张”，计算量大约变为多少？", "a": "V=5>3，因此每个视角只看光心最近的 2 张（local_mv_match=2）。每个窗口的 key 序列长度从 4×1024 变成 2×1024，cross-attention 的计算量约减半。更重要的是，总开销从随 V² 增长变成随 V·2 线性增长。"}]}, {"b": "sec", "h": "DS3 · 多视角分支②：逆深度上 128 个候选的平面扫描代价体（点积 / √C，对邻居取平均）", "id": "walk-depthsplat-ds3", "sn": {"label": "论文位置", "t": "论文方法部分“cost volume”段（节号未能核对）；代码 mv_unimatch.py:361-505（候选生成、相对位姿、warp、相关）；matching.py（warp_with_pose_depth_candidates）；mv_transformer.py（batch_features_camera_parameters）"}}, {"b": "p", "t": "输入：F_mv [BV,128,64,64]、缩放到 1/4 的内参、各视角外参。输出：代价体 C [BV,128,64,64]，其中的 128 是深度候选数 D，被当作通道使用。中间量是 warp 后的邻居特征 [BV·k,128(C),128(D),64,64]，k 为邻居数。", "label": "这一步做什么", "mn": {"label": "需要的基础", "links": [{"k": "concept-i-psv"}, {"k": "concept-d-mvs"}, {"k": "concept-g-depth"}, {"k": "concept-g-epipolar"}, {"k": "adv-a-learned-mvs"}]}}, {"b": "p", "t": "这一步就是在特征空间里做平面扫描（i-psv、d-mvs）。对参考视角的每个像素，先假设它的深度等于第 d 个候选，把它反投影到 3D，再投影到邻居视角，用双线性插值取出邻居在那里的特征，与参考特征做点积。假设的深度正确时，两边看到的是同一个表面点，特征相似，点积大；假设错误时，点积小。对 128 个候选都算一遍，每个像素就得到一条长度 128 的“匹配曲线”。有多个邻居时，把各邻居的曲线取平均，这样与视角的顺序和数量无关。\n\n候选在逆深度上均匀取值（g-depth）：RE10K 的 near=0.5、far=100，所以逆深度范围是 [0.01, 2.0] m⁻¹，相邻候选相差约 0.0157 m⁻¹。换算回深度，2 m 处的间隔约为 0.0157×2²≈6 cm，10 m 处约为 1.6 m。近处密、远处疏，这与视差误差的分布一致。之后 softmax 取期望可以得到比间隔更细的值（ds5）。\n\n与 MVSNet 一类方法不同，这里不构建 [C,D,h,w] 的四维特征体再用 3D 卷积处理，而是先点积压掉通道维，得到 [D,h,w] 的相关体，把 D 当作通道交给 2D U-Net。这样省掉了昂贵的 3D 卷积，MVSplat 也是这样做的。代价体只负责给出“多视角几何证据”，匹配不上的地方它就是一条平坦或多峰的曲线，要靠单目分支补救（ds4、ds5）。", "mn": {"label": "类比", "t": "像对一把锁逐一试 128 把钥匙：每把钥匙对应一个深度，插进去看两边的特征能不能对上。对得越准，“咔哒”声越响（点积越大）。可是白墙上每把钥匙听起来都差不多，这时就需要另一个线索。"}}, {"b": "eqs", "eqs": [{"tex": "x_d = x_{\\min}+\\frac{d}{D-1}\\,(x_{\\max}-x_{\\min}),\\quad x_{\\min}=\\frac{1}{\\text{far}},\\ x_{\\max}=\\frac{1}{\\text{near}},\\ d=0,\\dots,D-1", "explain_zh": "逆深度候选（mv_unimatch.py:419-435）。x_d 为第 d 个候选的逆深度（单位 m⁻¹）；D=128；near 和 far 取自数据集配置，RE10K 为 0.5 和 100。代码中的变量 min_depth=1/far、max_depth=1/near，存的都是逆深度。"}, {"tex": "\\mathbf{p}^{(d)}_{j}\\sim\\mathbf{K}_i\\,\\mathbf{T}_{j\\leftarrow i}\\!\\left(x_d^{-1}\\,\\mathbf{K}_i^{-1}\\tilde{\\mathbf{p}}\\right),\\qquad \\mathbf{T}_{j\\leftarrow i}=\\mathbf{E}_j^{-1}\\mathbf{E}_i", "explain_zh": "按候选深度把参考像素投影到邻居 j（matching.py，按代码改写）。p̃ 为齐次像素坐标；x_d⁻¹ 为候选深度；K_i 为参考视角缩放到特征分辨率的内参；E 为 camera-to-world 外参，T_{j←i} 为从参考相机到邻居相机的相对位姿；∼ 表示齐次除法。注意重投影到邻居时代码用的仍是参考视角的内参 K_i，而不是邻居自己的 K_j（邻居内参 tgt_intrinsics 被解包后没有使用），即假设各视角内参相同。投影出的坐标用 grid_sample 做双线性采样，越界的位置填 0。"}, {"tex": "\\mathcal{C}_i(d,\\mathbf{p})=\\frac{1}{|\\mathcal{N}(i)|}\\sum_{j\\in\\mathcal{N}(i)}\\frac{\\big\\langle \\mathbf{F}_i(\\mathbf{p}),\\ \\mathbf{F}_j(\\mathbf{p}^{(d)}_{j})\\big\\rangle}{\\sqrt{C}}", "explain_zh": "点积相关代价体（mv_unimatch.py:501-505）。F_i(p) 为参考特征，C=128 维；F_j(p_j^{(d)}) 为 warp 后的邻居特征；除以 √C 是为了控制数值尺度；对邻居取平均。输出形状为 [D,h,w]。"}]}, {"b": "p", "t": "RE10K 的位姿尺度任意，这里的“m”指位姿坐标的单位，DL3DV 同理。D=128，C=128。RE10K 逆深度间隔为 (2.0−0.01)/127≈0.01567 m⁻¹，在 1 m、2 m、5 m、10 m 处对应的深度间隔约为 1.6 cm、6.3 cm、39 cm、1.57 m。small 模型 2 视角时，warp 后的张量为 2×128×128×64×64≈1.34 亿个数，fp32 约 537 MB（按形状估算）。DL3DV 6 视角 256×448 时为 12×128×128×32×56≈3.5 亿个数，约 1.4 GB。候选数写死为 128：配置文件里的 num_depth_candidates 不会传进 MultiViewUniMatch。", "label": "具体数字"}, {"b": "p", "t": "逆深度均匀采样能同时覆盖室内近景和室外远景，并且与视差误差的分布匹配。点积相关加 2D U-Net 比方差代价体加 3D CNN（MVSNet）便宜得多，也与 UniMatch 的预训练特征匹配。没有采用的方案有：MVSNet 式的方差代价体配合 3D 正则；pixelSplat 沿极线采样再做概率深度；线性深度采样。后续的 ReSplat 把逆深度采样改成了对数深度采样（其 MODEL_ZOO），可以看作对这一选择的修正。", "label": "为什么这样设计"}, {"b": "p", "t": "（1）near/far 按数据集写死。比 0.5 m 更近的物体无法表示，会被 clamp 到 near；换到舱体尺寸的 3D 临场场景，必须重新设定。（2）改配置中的 num_depth_candidates 没有任何效果。（3）grid_sample 用零填充，投影到邻居视野之外时相关值为 0，网络无法区分“看不到”和“不相似”。（4）代码中的外参都是 camera-to-world，相对位姿是 inv(E_tgt)·E_ref；自己接数据时，用错成 world-to-camera 会导致代价体完全失效。（5）warp 只用参考视角的内参，默认所有相机内参相同；焦距或裁剪不同的异构相机阵列直接用会得到错位的代价体，需要改代码传入邻居内参。", "label": "容易误解的地方"}, {"b": "qa", "items": [{"q": "如果把 near 从 0.5 改成 0.3，far 和候选数都不变，10 m 处的深度候选间隔会怎样变化？这说明 near 的取值有什么副作用？", "a": "x_max 从 2.0 变为 3.33，逆深度间隔从 (2.0−0.01)/127≈0.0157 增大到 (3.33−0.01)/127≈0.0262。10 m 处的深度间隔约为 0.0262×100≈2.6 m，原来约为 1.57 m。near 取得越小，能表示的近处范围越大，但在固定候选数下，所有距离上的候选都会变疏，远处尤其明显。所以 near/far 应尽量贴合实际场景的范围。"}]}, {"b": "sec", "h": "DS4 · 单目分支：Depth Anything V2 的 ViT 编码器取 4 层特征，插值到代价体分辨率，以 1/100 的学习率微调", "id": "walk-depthsplat-ds4", "sn": {"label": "论文位置", "t": "论文方法部分“单目特征”段；实现细节（学习率 2×10⁻⁶ 与 2×10⁻⁴，经检索核对）；单目骨干消融表；代码 mv_unimatch.py:79-92、303-357；src/main.py:183-195（pretrained_monodepth 载入）；src/model/model_wrapper.py:1074-1100（参数分组）"}}, {"b": "p", "t": "输入 image [BV,3,256,256]，双线性缩放到 [BV,3,252,252]，送入 ViT-S，patch 14，得到 18×18=324 个 token。取第 2、5、8、11 层的输出，形状为 4×[BV,324,384]，reshape 成 [BV,384,18,18]，再插值到 1/8 分辨率 [BV,384,32,32]。最后一层再 2× 上采样到 [BV,384,64,64]，与代价体对齐；4 层特征另外留给 DPT 头（ds7、ds8）使用。", "label": "这一步做什么", "mn": {"label": "需要的基础", "links": [{"k": "concept-d-mono"}, {"k": "concept-l-attention"}, {"k": "concept-f-image"}, {"k": "concept-f-optim"}, {"k": "adv-a-geo-fm"}]}}, {"b": "p", "t": "Depth Anything V2 是一个单目深度基础模型（d-mono、a-geo-fm）：编码器为 DINOv2 结构的 ViT，解码器为 DPT，在大规模合成数据和伪标签真实数据上训练，只看一张图就能给出相对深度，边界清楚。DepthSplat 只借用它的编码器，而且只要特征、不要它输出的深度图。这样做有两个好处：一是特征中除了深度，还带有物体边界、语义和“这里有没有把握”的信息；二是不必把单目深度的任意尺度和位姿尺度对齐，把这件事交给后面的网络去学。\n\n单目分支对每个视角独立运行，不看其他视角，所以它给出的是“每张图自己的常识”，彼此之间并不保证一致。它的价值集中在代价体失效的地方：白墙、地板这类弱纹理区域，窗户、镜面这类反光区域，被遮挡或只在一张图里出现的区域，以及图像边缘。\n\n训练时 ViT 并没有冻结。代码按参数名分组，名字里含 “pretrained” 的 ViT 参数用 2e-6 的学习率，其余参数用 2e-4（f-optim）。低学习率让 ViT 可以慢慢适应新任务，又不至于冲掉预训练学到的东西。ViT 的 patch 为 14，所以图像要先缩放到 14 的倍数，256 变成 252；特征图分辨率只有 1/14，比代价体的 1/4 粗得多，要插值上去，细节主要靠 CNN 特征和 DPT 上采样来补（f-image）。单目骨干消融：DA-V2 26.84 dB，DA-V1 与 DINOv2 都是 26.76，MiDaS 26.46，ConvNeXt-T 26.11。", "mn": {"label": "类比", "t": "像一位看过成千上万张房间照片的室内设计师。他只看一张照片就能说出“沙发在墙前面、地板往远处延伸”，但说不准具体几米，两张照片他也不会去对照。测量员（代价体）负责量准距离，设计师负责在测量员量不出来的地方给出合理的形状。"}}, {"b": "eqs", "eqs": [{"tex": "H'=\\left\\lfloor \\tfrac{H}{14}\\right\\rfloor\\cdot 14,\\quad W'=\\left\\lfloor \\tfrac{W}{14}\\right\\rfloor\\cdot 14,\\quad N_{\\text{tok}}=\\frac{H'}{14}\\cdot\\frac{W'}{14}", "explain_zh": "ViT 的输入尺寸与 token 数（mv_unimatch.py:305）。256×256 → 252×252，N_tok=18×18=324；256×448 → 252×448，N_tok=18×32=576；512×960 → 504×952，N_tok=36×68=2448。这一步缩放会让横纵比例略有改变，例如 448 不变而 256 变为 252。"}, {"tex": "\\mathbf{f}^{(l)}=\\mathrm{Interp}_{\\to H/8\\times W/8}\\big(\\mathrm{reshape}(\\mathbf{T}^{(l)})\\big),\\quad l\\in\\{2,5,8,11\\}\\ (\\text{S/B}),\\ \\{4,11,17,23\\}\\ (\\text{L})", "explain_zh": "中间层特征的整理。T^(l) 为第 l 层 ViT 的 token 序列，形状 [N_tok, C_vit]，C_vit=384/768/1024；reshape 成二维特征图后，双线性插值到 1/8 分辨率。代价体在 1/4 时，最后一层 f^(11)（或 L 的 f^(23)）再 2× 上采样后参与拼接。"}, {"tex": "\\theta_{\\text{vit}}:\\ \\eta=2\\times10^{-6},\\qquad \\theta_{\\text{rest}}:\\ \\eta=2\\times10^{-4}", "explain_zh": "AdamW 的两组学习率（model_wrapper.py:1075-1093）。θ_vit 为名字含 “pretrained” 的 DINOv2/DA-V2 编码器参数，θ_rest 为其余全部参数。两组共用同一个 OneCycle 调度（ds10）。"}]}, {"b": "p", "t": "ViT-S：384 维，12 层，22.06M 参数；ViT-B：768 维，86.58M；ViT-L：1024 维，24 层，304.37M（代码实例化统计）。取层：S/B 为 [2,5,8,11]，L 为 [4,11,17,23]。学习率 2e-6 对 2e-4。单目骨干消融（small 配置，PSNR）：DA-V2 26.84、DA-V1 26.76、DINOv2 26.76、MiDaS 26.46、ConvNeXt-T 26.11。large 模型中 ViT 占总参数的约 86%。", "label": "具体数字"}, {"b": "p", "t": "用特征而不用深度图，可以避开尺度对齐问题，而且保留的信息更多。据检索摘要，作者比较过“先对齐单目深度的尺度再融合”，结果不如直接拼接特征。取多个中间层，是为了让 DPT 式解码器同时拿到低层边缘和高层语义。用低学习率微调而不冻结，是在“适应新任务”和“保留先验”之间折中。单目骨干消融（small 配置）中，仅就 PSNR 看，DINOv2 与 DA-V1 持平、DA-V2 只再多约 0.08 dB；合理的解读是大部分收益来自大规模预训练的 ViT 特征本身，但该表的深度指标未能查到，这一解读只对渲染质量成立。", "label": "为什么这样设计"}, {"b": "p", "t": "（1）ViT 没有冻结。一些二手资料写成 “frozen ViT”，与代码不符。（2）把 optimizer.lr_monodepth 设为 0 并不能冻结 ViT：代码的判断是“大于 0 才分组”，等于 0 时所有参数都用 2e-4，ViT 反而会被全速训练（见 ds10）。（3）构建模型时会调用 torch.hub.load('facebookresearch/dinov2', ...)，需要联网或本地 hub 缓存；之后 DA-V2 权重以 strict=False 覆盖，键名不匹配时不会报错。（4）单目分支对每个视角独立，本身不保证多视角一致；只用它会导致各视角的高斯对不齐。", "label": "容易误解的地方"}, {"b": "qa", "items": [{"q": "消融中，去掉代价体只剩单目分支时 PSNR 掉到 23.24，而去掉单目分支只剩代价体时是 26.04。为什么单独用单目分支会差这么多？", "a": "单目分支对每个视角独立估计，尺度未知，各视角之间也不一致。两张图各自生成的高斯在空间里对不齐，渲染新视角时就会出现重影和错位。像素对齐的高斯需要多视角一致、尺度与位姿一致的深度，这正是代价体提供的东西。单目特征只能在代价体失效的局部区域提供补充，替代不了几何约束。"}]}, {"b": "sec", "h": "DS5 · 拼接融合：[代价体 128，CNN 128，多视角 128，单目 384] 进入带跨视角注意力的 2D U-Net，softmax 取深度期望", "id": "walk-depthsplat-ds5", "sn": {"label": "论文位置", "t": "论文方法部分“特征融合与深度回归”段；融合方式对比（尺度对齐 / 注意力 / 拼接，据检索）；分支消融表；代码 mv_unimatch.py:94-169（regressor、regressor_residual、depth_head 定义）、507-531（前向）；ldm_unet/unet.py（UNetModel；QKVAttentionLegacy 的 use_cross_view_self_attn）"}}, {"b": "p", "t": "拼接后得到 [BV,768,64,64]（small；base 为 1152 通道）。依次经过 Conv3×3、GroupNorm(8)、GELU，变为 [BV,128,64,64]；再经过 2D U-Net 和 Conv3×3，并加上一条 1×1 残差投影；深度头 Conv(128→256)、GELU、Conv(256→128) 输出 logits [BV,128,64,64]。在 D 维上做 softmax 得到匹配概率 P，逆深度 x̂=Σ_d P_d·x_d，形状 [BV,1,64,64]。", "label": "这一步做什么", "mn": {"label": "需要的基础", "links": [{"k": "concept-l-cnn"}, {"k": "concept-l-attention"}, {"k": "concept-f-prob"}, {"k": "concept-d-mvs"}, {"k": "adv-a-learned-mvs"}]}}, {"b": "p", "t": "融合方式很简单：按通道拼接（l-cnn）。代价体告诉网络“哪个深度上两边的特征对得上”，CNN 特征和多视角 Transformer 特征提供局部外观和匹配上下文，单目特征提供“这里的表面大概是什么形状”的先验。网络逐像素学习该信哪一路：代价体曲线有尖峰时信代价体；曲线平坦或有多个峰时，更多依赖单目特征和周围像素。据检索摘要，作者比较过另外两种方案：“用多视角深度对齐单目深度的尺度”明显更差（Abs Rel 9.13 对 8.46）；“注意力融合”与拼接基本持平（8.40 / δ1 92.95 对 8.46 / 93.02），于是选了更简单的拼接。\n\n回归器是一个 2D U-Net，借用自 latent diffusion 的 UNetModel，128 通道，3 级，每级 1 个 ResBlock。在下采样 4 倍的那一级加入跨视角自注意力（这一点 MVSplat 的代价体细化 U-Net 已经有了，不是本文新增）：把所有 V 个视角的 token 拼成一个长序列做注意力（small 在 RE10K 上每视角 16×16=256 个 token），4 个头，每头 32 通道（l-attention）。这样一个视角的深度估计可以参考其他视角的全局信息，与第一步的窗口 cross-attention 形成互补。\n\n深度头输出 128 个 logits，softmax 之后得到一个离散概率分布（f-prob）。逆深度取期望 Σ P_d·x_d，而不是取 argmax。这有两个好处：可微，渲染损失的梯度能传回每个候选的得分；能得到比候选间隔更细的连续值。分布的最大值 max_d P_d 同时也是一个置信度，后面会作为输入送给高斯头（ds8）。", "mn": {"label": "类比", "t": "像三位评委打分：测量员给出一份“各深度的匹配得分表”，摄影师描述局部外观，室内设计师给出单目直觉。主持人（U-Net）把三份材料摊在一起，还会翻看其他机位的材料（跨视角注意力），最后给出一个带信心的分布，取加权平均作为答案。"}}, {"b": "eqs", "eqs": [{"tex": "\\mathbf{P}=\\mathrm{softmax}_d\\Big(h\\big(\\mathcal{U}([\\,\\mathcal{C};\\ \\mathbf{F}_{\\text{cnn}};\\ \\mathbf{F}_{\\text{mv}};\\ \\mathbf{F}_{\\text{mono}}\\,])\\big)\\Big)\\in\\mathbb{R}^{D\\times h\\times w}", "explain_zh": "[·;·] 为通道拼接；𝒞 为代价体，128 个通道；F_cnn 为 CNN 特征，128 个通道；F_mv 为多视角 Transformer 特征，128 个通道；F_mono 为单目特征，ViT-S 为 384 个通道；𝒰 为输入卷积、U-Net、输出卷积，外加 1×1 残差；h 为深度头；softmax 沿 D=128 个候选归一化。"}, {"tex": "\\hat{x}(\\mathbf{p})=\\sum_{d=0}^{D-1}P_d(\\mathbf{p})\\,x_d,\\qquad \\hat z(\\mathbf{p})=1/\\hat{x}(\\mathbf{p}),\\qquad m(\\mathbf{p})=\\max_d P_d(\\mathbf{p})", "explain_zh": "x̂ 为期望逆深度，ẑ 为深度，m 为最大匹配概率。m 会被最近邻插值到全分辨率，作为高斯头的输入（encoder_depthsplat.py:216-222）。与 MVSplat 不同，m 不再直接充当不透明度。"}]}, {"b": "p", "t": "输入通道：small 为 768=128+128+128+384，base 为 1152，large 为 1408=128+128+128+1024（按代码计算）。U-Net：128 通道，channel_mult [1,1,1]，1 个 ResBlock/级，在 ds=4 层级做注意力，每头 32 通道，共 4 头；middle block 不含注意力（middle_block_attn 默认 False）。深度头为 128→256→128。参数（small）：U-Net 6.45M，残差投影 0.10M，深度头 0.59M。输出 x̂ 的分辨率为 64×64（small，RE10K）。融合方式对比（检索摘要，深度指标 Abs Rel / δ1）：尺度对齐 9.13 / 90.21，注意力融合 8.40 / 92.95，拼接 8.46 / 93.02。", "label": "具体数字"}, {"b": "p", "t": "拼接后交给网络自己学权重，比手工设计置信加权更灵活（合理的解读）；两路特征各司其职，学习也更容易（据检索，作者称双分支设计“解耦了特征匹配与单目先验”）。softmax 期望兼顾可微和亚候选精度。U-Net 中的跨视角注意力让多视角信息在深度回归阶段继续流动。没有采用的方案有：单目深度尺度对齐后融合（更差）、注意力融合（持平但更复杂）、argmax 或直接回归深度。", "label": "为什么这样设计"}, {"b": "p", "t": "（1）softmax 期望在前景和背景交界处会被“平均”。如果某像素的分布有两个峰，期望深度会落在两个表面之间，形成悬空的高斯，也就是飞点。后续的 “Revisiting Depth Representations”（PM-Loss）专门处理了边界处深度不连续的问题。（2）U-Net 的跨视角注意力没有任何位置或相机编码（代码注释 “current attention layer doesn't have positional encoding”），它不知道 token 来自哪个视角的哪个位置。（3）回归的是逆深度，不是深度；可视化和误差分析时要注意取倒数。（4）拼接顺序和通道数取决于 vit_type 和尺度，换骨干后不能直接加载旧权重。", "label": "容易误解的地方"}, {"b": "qa", "items": [{"q": "在前景物体边缘，某像素的 softmax 分布有两个峰：前景 1 m 和背景 5 m，概率各 0.5。按 DepthSplat 的做法，它的深度是多少？渲染时会发生什么？", "a": "期望逆深度为 x̂=0.5×1.0+0.5×0.2=0.6 m⁻¹，深度 ẑ≈1.67 m，既不在前景上，也不在背景上。这个像素的高斯会悬在两个表面之间，换视角时成为飞点或拖影。网络可以通过降低它的不透明度来减轻影响；但根本原因在于用期望回归多峰分布，这是 softmax 期望的固有代价。"}]}, {"b": "sec", "h": "DS6 · 由粗到细（base/large）：在 2 倍分辨率上围绕粗深度再放 32 个候选，间隔减半", "id": "walk-depthsplat-ds6", "sn": {"label": "论文位置", "t": "论文方法部分“层级匹配”段与模型变体表（README 标注 small/base/large 的评测对应 Table 1）；代码 mv_unimatch.py:73-92（ViTFeaturePyramid）、99-120（各尺度通道数）、409-475（第二尺度候选）；vit_fpn.py；scripts/re10k_depthsplat_train.sh（base/large：num_scales=2，upsample_factor=2）"}}, {"b": "p", "t": "以 base 模型在 RE10K 上为例。第一尺度输出 x̂⁽⁰⁾ [BV,1,64,64]，2× 双线性上采样并 detach，得到 [BV,1,128,128]，以它为中心生成 32 个逐像素候选 [BV,32,128,128]；第二尺度代价体为 [BV,32,128,128]。拼接 [32, CNN 96, 多视角 64, 单目 384] 共 576 通道，经 U-Net（64 通道，4 级，在 ds=8 层级做注意力）得到 x̂⁽¹⁾ [BV,1,128,128]。", "label": "这一步做什么", "mn": {"label": "需要的基础", "links": [{"k": "concept-d-mvs"}, {"k": "concept-g-depth"}, {"k": "concept-f-image"}, {"k": "adv-a-learned-mvs"}]}}, {"b": "p", "t": "small 模型只有一个尺度：代价体在 1/4 分辨率上一次算完。base 和 large 多加一级细化，思路与级联 MVS 相同（d-mvs、a-learned-mvs）：先在粗分辨率上用全范围的 128 个候选定个大概，再到 2 倍分辨率上，只在大概值附近放 32 个间隔更小的候选。在 RE10K 上，两个尺度分别是 1/4 和 1/2；DL3DV 和高分辨率模型是 1/8 和 1/4。\n\n第二尺度需要更高分辨率的特征。CNN 特征直接取主干中更浅的一级（96 通道）；多视角特征和单目特征用 ViTDet 的 SimpleFeaturePyramid 从第一尺度上采样得到，做法是一个步长 2 的转置卷积，通道减半，多视角为 64、单目为 ViT 通道的一半。候选范围以上采样后的粗逆深度为中心，向下 16 个、向上 15 个细间隔，细间隔是粗间隔的一半，并 clamp 在 [x_min, x_max] 内。\n\n有两个细节。第一，粗深度在上采样后被 detach，第二尺度的梯度不会通过候选位置传回第一尺度，第一尺度只由自己的渲染损失训练（ds9 中的中间监督，权重 0.9）。第二，第二尺度每个像素的候选不同，所以候选张量是逐像素的 [BV,32,h,w]，而第一尺度是所有像素共享的 [BV,128,1,1]。模型变体表（README 标注 Table 1，检索摘要）显示，2 尺度和更大的单目骨干都能同时改善深度和新视角合成：ViT-S 从 1 尺度到 2 尺度，TartanAir 深度 Abs Rel 从 8.46 降到 7.01，RE10K PSNR 从 26.84 升到 27.12，参数只多约 3M、耗时从 0.050 s 增到 0.062 s。", "mn": {"label": "类比", "t": "像用地图找地址：先看城市地图（粗尺度）找到大致街区，再换街区地图（细尺度），只在那一片仔细找门牌号。街区地图只覆盖一小片，如果第一步街区就找错了，第二步是找不回来的。"}}, {"b": "eqs", "eqs": [{"tex": "\\Delta^{(1)}=\\frac{x_{\\max}-x_{\\min}}{(D-1)\\cdot 2},\\qquad [\\,a,b\\,]=\\big[\\max(\\hat x^{(0)}_{\\uparrow}-16\\Delta^{(1)},x_{\\min}),\\ \\min(\\hat x^{(0)}_{\\uparrow}+15\\Delta^{(1)},x_{\\max})\\big]", "explain_zh": "第二尺度的候选区间（mv_unimatch.py:436-461）。Δ^(1) 为细间隔，D=128 为第一尺度候选数；x̂^(0)_↑ 为上采样并 detach 后的粗逆深度；16=32//2 与 15=32//2−1 来自代码。区间内用 linspace 取 32 个点，不被 clamp 时间隔正好等于 Δ^(1)。"}, {"tex": "x^{(1)}_d(\\mathbf p)=a(\\mathbf p)+\\frac{d}{31}\\big(b(\\mathbf p)-a(\\mathbf p)\\big),\\quad d=0,\\dots,31", "explain_zh": "逐像素的 32 个细候选。a、b 随像素而变，所以代价体计算时，候选张量的形状为 [BV,32,h,w]，不再是 [BV,128,1,1]。"}]}, {"b": "p", "t": "RE10K：Δ^(1)≈0.00783 m⁻¹，覆盖范围约 ±0.125 m⁻¹，相当于粗尺度的 ±8 个候选。在 2 m 处，细间隔约 3.1 cm，可纠正的范围约为 1.6–2.7 m。第二尺度的通道数：CNN 96，多视角 64，单目 384（base）或 512（large），U-Net 64 通道。参数：mv_pyramid 0.07M，mono_pyramid 2.51M（base）或 4.46M（large）。small 模型没有这一级。模型变体表（检索摘要）：ViT-S/B/L 1 尺度 PSNR 26.84/27.06/27.23，2 尺度 27.12/27.34/27.47；参数 38/115/347M 与 41/120/354M；耗时 0.050/0.053/0.061 s 与 0.062/0.070/0.079 s（A100，2 视角 256×256）。", "label": "具体数字"}, {"b": "p", "t": "粗尺度用全范围、少像素，细尺度用窄范围、多像素。以较少的额外代价把深度分辨率和空间分辨率都提高一倍，这是级联 MVS 的经典做法（此类比是我们的解读）。detach 可以避免细尺度的梯度通过候选位置干扰粗尺度，训练更稳定（论文未说明原因，这是合理的解读）。没有采用的方案有：单尺度直接放更多候选（显存随 D 线性增长）；三级及以上的级联（代码支持 num_scales>2 的写法，但没有发布相应模型）。", "label": "为什么这样设计"}, {"b": "p", "t": "（1）small 模型是单尺度，num_scales=1，README 中 small 与 base/large 的命令参数不同（upsample_factor 4 与 2）。（2）粗深度误差超过约 ±8 个粗间隔时，细尺度无法纠正，因为真值不在候选范围内。（3）RE10K 的 base/large 与 DL3DV 的 base 虽然都叫 base，内部尺度不同（1/4+1/2 与 1/8+1/4），权重不能混用。（4）第一尺度的“中间深度”只在训练时上采样到全分辨率并参与渲染监督；推理时只输出最终深度。", "label": "容易误解的地方"}, {"b": "qa", "items": [{"q": "RE10K 的 base 模型中，如果粗尺度把 2 m 处的表面估成了 3 m，第二尺度能纠正回来吗？请用逆深度估算。", "a": "真值的逆深度为 0.5 m⁻¹，粗估计为 0.333 m⁻¹，相差 0.167 m⁻¹。第二尺度的候选只覆盖粗估计的 −16Δ 到 +15Δ，而 15×0.00783≈0.117 m⁻¹ < 0.167 m⁻¹，所以真值不在候选范围内，无法完全纠正，最多被拉到约 0.45 m⁻¹，也就是约 2.2 m。这类大错误只能靠第一尺度自身（单目特征、U-Net）来避免。"}]}, {"b": "sec", "h": "DS7 · DPT 上采样：融合 ViT 的 4 层特征、CNN 特征与多视角特征，预测全分辨率的逆深度残差", "id": "walk-depthsplat-ds7", "sn": {"label": "论文位置", "t": "论文方法部分“深度上采样”段；代码 mv_unimatch.py:171-202（upsampler 定义）、543-572（残差相加、clamp、取倒数）；dpt_head.py（DPTHead，return_feature=False；输出层零初始化 442-444）"}}, {"b": "p", "t": "输入：ViT 的 4 层特征 [BV,384,32,32]×4；CNN 多尺度特征 [64@128², 96@128², 128@64²]；多视角特征 [128@64²]；低分辨率逆深度 x̂ [BV,1,64,64]。输出：残差 r [BV,1,256,256]。最终 x=clamp(Up(x̂)+r, x_min, x_max)，深度 z=1/x，形状 [B,V,256,256]。以上为 small 模型在 RE10K 上的情况。", "label": "这一步做什么", "mn": {"label": "需要的基础", "links": [{"k": "concept-f-image"}, {"k": "concept-l-cnn"}, {"k": "concept-d-mono"}, {"k": "concept-g-depth"}]}}, {"b": "p", "t": "代价体只在 1/4（或 1/8、1/2）分辨率上计算，而高斯是逐像素的，所以深度必须恢复到全分辨率。最简单的做法是双线性插值，但这样物体边缘会被抹平：边界像素的深度落在前景和背景之间，正好变成飞点。DepthSplat 用 DPT 头学习上采样（f-image、l-cnn）。\n\nDPT 的做法是：先用不同的重组层把 ViT 的 4 层特征整理成 1/2、1/4、1/8、1/16 四个尺度，分别是 4× 转置卷积、2× 转置卷积、恒等、步长 2 卷积；再用 RefineNet 融合块从低分辨率逐级往上融合，最后输出全分辨率。DepthSplat 的改动是：在 1/2 和 1/4 这些层级，把 CNN 特征、多视角特征和低分辨率深度也拼接进来，于是解码器既看到单目语义，又看到匹配特征和当前的深度估计。\n\n输出的不是深度本身，而是逆深度的残差，加在双线性上采样的结果上，再 clamp 到合法范围。输出层零初始化，所以训练开始时它严格等于双线性上采样，之后逐渐学会在边缘处做修正。这个 DPT 头是新建的，没有使用 Depth Anything V2 自带的深度头权重。", "mn": {"label": "类比", "t": "像把一张低分辨率的等高线草图放大成施工图：先机械放大（双线性），再由一位看过高清照片的绘图员（DPT 头看 ViT 和 CNN 特征）沿着真实的墙角、桌边把线条修锐。一开始他什么都不改（零初始化），慢慢学会改哪里。"}}, {"b": "eqs", "eqs": [{"tex": "x(\\mathbf p)=\\mathrm{clip}\\Big(\\mathrm{Up}_{\\times s}\\big(\\hat x\\big)(\\mathbf p)+r_\\theta\\big(\\{\\mathbf f^{(l)}\\},\\mathbf F_{\\text{cnn}},\\mathbf F_{\\text{mv}},\\hat x\\big)(\\mathbf p),\\ x_{\\min},\\ x_{\\max}\\Big),\\qquad z=1/x", "explain_zh": "Up_{×s} 为双线性上采样，s 等于 upsample_factor（small 为 4，RE10K 上的 base/large 为 2，DL3DV 为 4）；r_θ 为 DPT 头预测的逆深度残差；f^(l) 为 ViT 的 4 层特征；clip 把结果限制在 [1/far, 1/near] 内；z 为最终深度。"}, {"tex": "r_\\theta\\big|_{\\text{init}}\\equiv 0\\ \\Rightarrow\\ x\\big|_{\\text{init}}=\\mathrm{Up}_{\\times s}(\\hat x)", "explain_zh": "输出卷积的权重和偏置都初始化为 0（dpt_head.py:442-444），训练开始时 DPT 分支相当于不存在，不会往高斯位置里注入随机噪声。"}]}, {"b": "p", "t": "DPT features 通道数：small 32，base 48，large 64（深度上采样头）。输出头为 features→features/2→16→1。参数：small 2.11M，base 7.91M，large 14.03M，DL3DV base 7.98M。上采样倍数：small（RE10K）4×，base/large（RE10K）2×，DL3DV 与高分辨率 4×。", "label": "具体数字"}, {"b": "p", "t": "边缘处的深度质量决定了飞点的多少。学习式上采样可以借助高分辨率的图像特征和单目语义把边界修锐，这也是 DPT 在单目深度中被广泛采用的原因。在逆深度上做残差，与前面的候选空间一致，数值范围也有界。没有采用的方案有：双线性上采样（边缘糊）；RAFT 式凸组合上采样（论文未讨论）；直接在全分辨率上建代价体（显存不可接受）。", "label": "为什么这样设计"}, {"b": "p", "t": "（1）残差是在逆深度上加的，远处物体的一个小逆深度残差，换算成深度可能是很大的变化。（2）clamp 会把超出范围的值截断在 near 或 far 上，截断处的梯度为 0。（3）边缘能否修锐，完全取决于渲染损失能否提供信号；训练中没有深度监督，边缘精度没有直接约束。（4）网络里有两个 DPT 头：一个出深度残差（本步），一个出高斯头所需的特征（ds8），参数分别计算。", "label": "容易误解的地方"}, {"b": "qa", "items": [{"q": "为什么要把 DPT 残差分支的输出层初始化为 0？如果随机初始化，训练初期会出现什么问题？", "a": "零初始化让训练开始时的深度严格等于粗深度的双线性上采样，而粗深度已经由代价体和单目特征给出一个合理的估计，高斯位置从一开始就基本正确，渲染损失能提供有效梯度。随机初始化会在每个像素的逆深度上叠加噪声，高斯被随机推前推后，渲染结果一团糟，梯度的方向也很乱，前期训练会慢很多，甚至不稳定。这与 ResNet 最后一层 BN 零初始化是同一个思路。"}]}, {"b": "sec", "h": "DS8 · 高斯头：每像素 37 个数，包括不透明度、像素内偏移、scale、四元数和 2 阶 SH（直流项加上输入颜色）", "id": "walk-depthsplat-ds8", "sn": {"label": "论文位置", "t": "论文方法部分“高斯参数预测”段；代码 encoder_depthsplat.py:88-138（feature_upsampler、gaussian_regressor、gaussian_head 及其初始化）、216-332（解码与组装）；common/gaussian_adapter.py；common/gaussians.py（build_covariance）；misc/sh_rotation.py；对照 MVSplat 的 encoder_costvolume.py:207 与 gaussian_adapter.py"}}, {"b": "p", "t": "输入：全分辨率特征 [BV,64,256,256]（由第二个 DPT 头输出）、RGB [BV,3,256,256]、深度 [BV,1,256,256]、最大匹配概率 m [BV,1,256,256]。第一段 [BV,69] 经卷积变为 [BV,64]；第二段 [BV,132] 经卷积变为 [BV,37]。按像素解码为 α(1)、δ(2)、s(3)、q(4)、SH(3×9)，再组装成世界坐标系下的 μ [3] 和 Σ [3×3]。", "label": "这一步做什么", "mn": {"label": "需要的基础", "links": [{"k": "concept-n-3dgs"}, {"k": "concept-r-appearance"}, {"k": "concept-r-alpha"}, {"k": "concept-f-linalg"}, {"k": "adv-a-ff-3dgs"}]}}, {"b": "p", "t": "深度定下来以后，还要为每个像素决定它的高斯长什么样（n-3dgs、r-appearance）。第二个 DPT 头（return_feature=True）把 ViT、CNN、多视角特征融合成全分辨率特征，small/base/large 分别为 64/96/128 通道。接着是一个很小的两段卷积网络：第一段看 [RGB、深度、置信度 m、特征]，第二段再把 RGB、特征、m 拼进来，最后输出 37 个通道。整个高斯头只有 0.06–0.08M 参数。\n\n37 个通道依次是：1 个不透明度，经 sigmoid；2 个像素内偏移，经 sigmoid 后减 0.5，再乘像素尺寸；3 个 scale，经 softplus(x−4) 后 clamp 到 [1e-10, 3]；4 个四元数，归一化后作为旋转；27 个 2 阶球谐系数，每个颜色通道 9 个。几处与 MVSplat 不同：（1）不透明度的预测位置变了：MVSplat 默认模型由全分辨率深度细化 U-Net 的输出头同时给出视差残差和不透明度（sigmoid），DepthSplat 去掉了这个细化 U-Net，改由高斯头第 0 通道给出；两者都把最大匹配概率只当作输入，只有 MVSplat 的 “w/o depth refine” 消融才直接拿它当不透明度；（2）scale 用绝对的世界单位，MVSplat 则乘以“深度 × 像素尺寸”；（3）SH 直流项加上输入像素颜色 RGB2SH(I)，高阶项乘 0.1·0.25^l 的衰减，SH 阶数从 MVSplat 的 4 阶降到 2 阶。\n\n初始化很讲究：最后一层中 scale 通道（第 3–5 通道）和 SH 通道（第 10 通道起）的权重和偏置都置 0。于是训练一开始，每个像素的高斯就是“颜色等于该像素、大小固定为 softplus(−4)≈0.018 个世界单位、各向同性”的小球，网络只需学习残差。这正好呼应 Ha et al. 的观察：前馈网络预测的像素级高斯参数往往接近常数，Ha et al. 干脆用解析值；DepthSplat 则以解析值为起点，让网络学偏差。区别在于，Ha et al. 的尺度与“深度/焦距”成正比，而 DepthSplat 的初始尺度与深度无关。", "mn": {"label": "类比", "t": "深度决定每颗彩色小球钉在哪里，高斯头决定小球本身：有多不透明、稍微往左还是往右挪一点、是圆的还是扁的、朝哪个方向扁、换角度看颜色怎么变。出厂设置是“和像素同色的小圆球”，网络负责逐个微调。"}}, {"b": "eqs", "eqs": [{"tex": "\\alpha=\\sigma(h_0),\\qquad \\boldsymbol\\delta=\\big(\\sigma(h_{1:2})-\\tfrac12\\big)\\odot\\big(\\tfrac1W,\\tfrac1H\\big)", "explain_zh": "h 为高斯头输出的 37 维向量，下标为通道号；σ 为 sigmoid；α 为不透明度；δ 为归一化坐标下的像素内偏移，最大为半个像素；W、H 为图像宽高。"}, {"tex": "\\mathbf s=\\mathrm{clip}\\big(\\mathrm{softplus}(h_{3:5}-4),\\ 10^{-10},\\ s_{\\max}\\big),\\qquad \\mathbf q=\\frac{h_{6:9}}{\\lVert h_{6:9}\\rVert+\\epsilon}", "explain_zh": "s 为三轴 scale，单位与场景的世界坐标一致，不乘深度；训练时 s_max=3，README 中 512×960 的推理命令把它改成 0.1；softplus(−4)≈0.018。q 为 xyzw 顺序的单位四元数，ε=1e-8。"}, {"tex": "\\Sigma=\\mathbf R_{\\text{c2w}}\\,\\mathbf R(\\mathbf q)\\,\\mathrm{diag}(\\mathbf s)^2\\,\\mathbf R(\\mathbf q)^\\top\\mathbf R_{\\text{c2w}}^\\top", "explain_zh": "世界坐标系下的协方差（gaussian_adapter.py 与 gaussians.py 中的 build_covariance）。R(q) 为由四元数得到的旋转，它定义在相机坐标系里；R_c2w 为相机到世界的旋转。"}, {"tex": "c_{lm}=\\kappa_l\\,h^{\\text{sh}}_{lm}+[\\,l=0\\,]\\,\\frac{I(\\mathbf p)-0.5}{C_0},\\qquad \\kappa_0=1,\\ \\kappa_l=0.1\\cdot0.25^{\\,l},\\ C_0\\approx0.28209", "explain_zh": "球谐系数，按代码改写。l=0,1,2 为阶数，每个颜色通道共 9 个系数；h^sh 为网络输出的 27 维 SH 部分；κ_l 为 sh_mask；[l=0] 表示只对直流项加上由输入像素颜色 I(p) 换算的 SH 值（RGB2SH）。之后再用 e3nn 的 Wigner-D 矩阵把 SH 从相机坐标系旋转到世界坐标系（misc/sh_rotation.py）。"}]}, {"b": "p", "t": "输出 37 通道，其中 opacity 1、offset 2、scale 3、rotation 4、SH 27。高斯头输入：第一段 69=3+1+1+64（small），第二段 132=64+3+64+1。特征上采样通道 64/96/128，参数 2.71M/9.42M/16.71M；gaussian_regressor 0.08–0.11M；gaussian_head 0.06–0.08M。s_max 训练时为 3，高分辨率推理时为 0.1。SH 阶数 2，MVSplat 为 4。", "label": "具体数字"}, {"b": "p", "t": "像素对齐已经把最难的位置问题交给了深度，高斯头只需做局部修饰，所以一个很小的卷积网络就够了。直流项用输入颜色初始化、scale 零初始化，让训练从一个“能渲染出东西”的状态开始。不透明度由高斯头预测，可以综合匹配置信度、单目特征和颜色来决定哪些高斯该隐去；MVSplat 的默认模型其实也是网络预测，两者的差别在于放在哪个模块里，论文没有给出对应消融。没有采用的方案有：MVSplat 式“随深度缩放的 scale”；只在 MVSplat 消融中出现的“匹配概率即不透明度”；每像素多个高斯；跨视角合并高斯。", "label": "为什么这样设计"}, {"b": "p", "t": "（1）scale 是绝对世界单位，与场景尺度和分辨率耦合。README 中两条 512×960 命令都把 gaussian_scale_max 改成 0.1，用的都是 448×768 权重；官方没说原因（第三方推理 fork 认为这是 448×768 模型训练时的取值）。这个上限不随权重保存，必须手动与权重匹配，填错不会报错。（2）match_prob 在代码里还被整理成一个 densities 变量，但之后没有使用；真正的 opacity 来自 head 的第 0 通道，读代码时容易看错。（3）导出 .ply 时，visualization_dump 中的 scales 和 rotations 没有转到世界坐标系，代码注释写明 “This needs to be fixed”。（4）SH 在相机坐标系里预测，每个视角都要用 Wigner-D 旋转到世界坐标系；如果外参带缩放或反射，就会出错。", "label": "容易误解的地方"}, {"b": "qa", "items": [{"q": "训练刚开始时，scale 和 SH 通道的权重与偏置都是 0，一个 DepthSplat 高斯长什么样？它与 Ha et al. 解析设定的像素高斯有什么异同？", "a": "它的颜色等于该像素颜色，因为直流项等于 RGB2SH(I)，高阶项为 0；它是半径约 softplus(−4)≈0.018 个世界单位的各向同性小球，旋转不起作用；不透明度约为 sigmoid(随机初值)，在 0.5 附近；中心位于初始深度处。相同点：两者都是以像素颜色为中心的各向同性高斯。不同点：Ha et al. 的尺度随深度/焦距变化，保证投影回源图恰好覆盖一个像素，且不透明度为 1；DepthSplat 初始尺度与深度无关，远处的高斯偏小、近处偏大，要靠训练去修正，不透明度也是学出来的。"}]}, {"b": "sec", "h": "DS9 · 渲染与损失：CUDA 光栅化渲染目标视角，损失为 MSE + 0.05·LPIPS，中间尺度再乘 0.9，全程没有深度监督", "id": "walk-depthsplat-ds9", "sn": {"label": "论文位置", "t": "论文方法部分“训练损失”段；代码 src/model/decoder/decoder_splatting_cuda.py、cuda_splatting.py（render_cuda）；src/loss/loss_mse.py、loss_lpips.py；src/model/model_wrapper.py:155-359（training_step）；config/experiment/re10k.yaml（lpips weight 0.05，apply_after_step 0）；config/main.yaml（intermediate_loss_weight 0.9）"}}, {"b": "p", "t": "输入：高斯集合 [B, V·H·W]，以及目标相机的外参 [B,V_tgt,4,4]、内参和 near/far。输出：渲染图 [B,V_tgt,3,H,W]。损失为一个标量：MSE(Î,I)+0.05·LPIPS(Î,I)，两尺度模型再加 0.9×(同样的损失，作用在由粗尺度深度生成的高斯上)。训练时 RE10K 每个样本有 V_tgt=4 个目标视角，DL3DV 微调时为 8 个。", "label": "这一步做什么", "mn": {"label": "需要的基础", "links": [{"k": "concept-r-raster"}, {"k": "concept-r-alpha"}, {"k": "concept-l-loss"}, {"k": "concept-v-metrics"}, {"k": "adv-a-diff-render"}]}}, {"b": "p", "t": "高斯交给可微光栅化器，也就是 pixelSplat 作者修改过的 diff-gaussian-rasterization（r-raster、a-diff-render）。每个 3D 高斯投影成屏幕上的 2D 椭圆，按深度排序后做前到后的 α 合成（r-alpha），得到目标视角的图像，背景为黑色。渲染图与真实目标帧比较，损失为 MSE 加 0.05 倍的 LPIPS（VGG 版），LPIPS 从第 0 步起就生效（l-loss）。\n\n关键在于梯度的去向。像素颜色对高斯均值可导，均值又等于“光心 + 深度 × 射线”，所以渲染误差会一路传回：深度 → DPT 上采样 → softmax 概率 → U-Net → 代价体里的匹配特征和单目 ViT（后者学习率低 100 倍）。网络从来没见过深度真值，它学会估深度，只是因为深度错了，新视角就渲染不对。这就是论文“反方向”一半的基础（ds12）。\n\n两尺度模型还有一个“中间监督”：第一尺度的深度双线性上采样到全分辨率后，也按每像素一个高斯组装起来，其余参数与最终高斯共用同一份高斯头输出，同样渲染并计算损失，权重为 0.9。这样粗尺度也能得到直接的训练信号，否则它只能通过被 detach 的候选范围间接影响结果。\n\n要注意光度损失约束不到的地方：弱纹理区域里，深度稍微错一点，渲染出来的颜色几乎一样，梯度接近 0；反光区域的颜色随视角变化，与“同一点颜色相同”的假设相矛盾。这些正是单目分支补位的地方。", "mn": {"label": "类比", "t": "网络像一个不许看尺子的学徒。每次把自己摆好的小球从另一个机位拍一张照片，和真实照片对比，哪里颜色对不上，就把那里的小球往前或往后挪一点。挪多了，他自然学会了看距离。"}}, {"b": "eqs", "eqs": [{"tex": "\\hat I(\\mathbf u)=\\sum_{k}\\mathbf c_k\\,\\alpha'_k(\\mathbf u)\\prod_{j<k}\\big(1-\\alpha'_j(\\mathbf u)\\big),\\qquad \\alpha'_k(\\mathbf u)=\\alpha_k\\exp\\!\\Big(-\\tfrac12(\\mathbf u-\\boldsymbol\\mu'_k)^\\top\\Sigma_k'^{-1}(\\mathbf u-\\boldsymbol\\mu'_k)\\Big)", "explain_zh": "3DGS 的前到后 α 合成。k 为按深度排序的高斯编号；c_k 为按目标视线方向从 SH 求得的颜色；α_k 为网络预测的不透明度；μ'_k 和 Σ'_k 为投影到屏幕的 2D 均值与协方差；u 为目标像素。原版 3DGS 的实现细节（如 0.3 低通、α 上限 0.99）是否被这个修改版保留，未逐行核对。"}, {"tex": "\\mathcal L=\\big[\\mathrm{MSE}(\\hat I,I)+0.05\\,\\mathrm{LPIPS}(\\hat I,I)\\big]_{\\text{final}}+0.9\\,\\big[\\mathrm{MSE}+0.05\\,\\mathrm{LPIPS}\\big]_{\\text{coarse}}", "explain_zh": "训练损失（model_wrapper.py:236-333）。I 为目标帧真值，Î 为渲染结果；final 项由最终深度生成的高斯渲染，coarse 项由第一尺度深度生成的高斯渲染，只有两尺度模型才有。若有多级中间尺度，权重为 0.9^(n−i)。损失中没有任何深度项。"}]}, {"b": "p", "t": "MSE 权重 1.0，LPIPS 权重 0.05（VGG），apply_after_step=0（覆盖了 config/loss/lpips.yaml 默认的 150_000）；中间尺度权重 0.9；背景为黑色 [0,0,0]。训练目标视角数：RE10K 为 4（bounded_re10k.yaml），DL3DV 微调为 8（训练脚本）。评测指标：PSNR（先 clip 到 [0,1]）、SSIM（skimage，窗口 11，高斯权重）、LPIPS（VGG），先对每个场景的目标取平均，再对场景取平均。", "label": "具体数字"}, {"b": "p", "t": "只用渲染损失，才能在没有深度标注的海量带位姿视频上训练，这也是“GS 作为深度预训练”的前提。LPIPS 鼓励锐利的细节。中间监督给粗尺度提供直接信号。以上设置基本继承自 pixelSplat 和 MVSplat（它们的 re10k 配置同为 MSE×1 加 LPIPS×0.05）。没有采用的方案有：加入深度监督（仓库未提供）；加入深度平滑项或多视角几何一致性项。", "label": "为什么这样设计"}, {"b": "p", "t": "（1）中间尺度的高斯与最终高斯共用同一份外观参数（opacity、scale、SH），只是深度不同，并不是另一套独立的高斯。（2）中间尺度只在训练时存在：mv_unimatch.py 只在 self.training 为真时才把粗深度加入列表。（3）LPIPS 的配置文件默认从 150K 步才开始生效，但实验配置把它改成了 0；只看 config/loss/lpips.yaml 会误判。（4）黑背景意味着目标视野中没有被任何高斯覆盖的区域会被渲染成黑色并受到惩罚；合理的推测是这会推动网络放大边缘高斯的 scale 去填洞，但论文和代码都没有对此做分析。", "label": "容易误解的地方"}, {"b": "qa", "items": [{"q": "为什么只有渲染损失也能教会网络估计深度？请举出两类它教不会的区域，并说明 DepthSplat 用什么来弥补。", "a": "像素的高斯中心由深度决定。深度错了，这个高斯在目标视角中就会落到错误的位置，与真实颜色不一致，产生损失，梯度通过光栅化和均值传回深度，推动它往正确方向移动。教不会的区域有两类：（1）弱纹理区域，深度在一定范围内变化，渲染出来的颜色都差不多，梯度很小；（2）反光或透明区域，颜色随视角变化，光度一致的假设不成立，梯度方向甚至是错的。此外，在目标视角中被遮挡的点也收不到梯度。DepthSplat 用单目 ViT 特征提供的形状先验来弥补这些区域，这正是双分支设计的出发点。"}]}, {"b": "sec", "h": "DS10 · 训练设定：AdamW，主体学习率 2e-4、ViT 学习率 2e-6，OneCycle 调度 150K 步，4 张 GH200，总 batch 32", "id": "walk-depthsplat-ds10", "sn": {"label": "论文位置", "t": "论文实现细节段与补充材料中的训练设置（经检索核对：4×GH200、150K 步、总 batch 32、small 1 天 / large 2 天）；代码 config/main.yaml、config/experiment/re10k.yaml、dl3dv.yaml；scripts/re10k_depthsplat_train.sh、dl3dv_depthsplat_train.sh；src/model/model_wrapper.py:1074-1128；src/main.py:135-203；src/dataset/view_sampler/view_sampler_bounded.py、view_sampler_bounded_v2.py；README “Training”"}}, {"b": "p", "t": "输入：RE10K（或 DL3DV）的训练样本，每个样本含 context 与 target 的图像、位姿和 near/far。输出：训练好的全部权重。一步的流程为：采样 → patch shim 裁剪 → 前向（ds2–ds8）→ 渲染（ds9）→ 损失 → 梯度裁剪 → AdamW 更新 → 学习率调度。", "label": "这一步做什么", "mn": {"label": "需要的基础", "links": [{"k": "concept-f-optim"}, {"k": "concept-l-loss"}, {"k": "adv-a-ff-3dgs"}]}}, {"b": "p", "t": "先看数据怎么采（f-optim、l-loss）。RE10K 每个样本取两张输入帧，帧间隔在 45–135 之间随机；前 30K 步从 25–45 帧线性放宽到这个范围，先易后难。目标取 4 帧，落在两张输入帧之间；以 50% 概率把整个样本做水平翻转，外参也同步镜像。DL3DV 的输入帧间隔为 20–50 帧，前 10K 步从 15–30 帧放宽；输入视角数在 2–6 之间随机，额外视角按最远点采样；视角少时，间隔按 max_views//n 缩小。\n\n再看初始化和优化。多视角部分（CNN 与 Transformer）载入 GMFlow 的 gmflow-scale1-things 权重，单目部分载入 Depth Anything V2 的权重，其余从头训练。优化器是 AdamW，weight decay 0.01，参数分两组：ViT 用 2e-6，其余用 2e-4。调度是 PyTorch 的 OneCycleLR：前 1% 的步数（150K 步时约 1.5K 步）从最大学习率的 1/25 按余弦升到最大值，之后余弦衰减到最大值的 1/(25×10⁴)。梯度裁剪阈值 0.5。\n\n最后是算力。RE10K 256×256 的 small、base、large 都在 4 张 GH200（96 GB）上训练 150K 步，每卡 batch 8，总 batch 32。README 说只要“卡数 × batch × 步数”不变，换成 4 张 4090 或 1 张 A100 的结果相差不超过 0.1 dB。DL3DV 模型分两阶段。第一阶段在 RE10K 256×448 上训练，脚本写的是 8 节点 × 4 卡 × batch 8，总 batch 256，150K 步，比 256×256 模型大了一个量级。第二阶段在 DL3DV 上训练 100K 步，8 卡，每卡 batch 1，随机 2–6 视角。高分辨率 448×768 模型在此基础上，用 RE10K 与 DL3DV 的混合数据继续训练。", "mn": {"label": "类比", "t": "像培训一个新员工。一位资深专家（ViT）只做微调，学习率低；新人部分（代价体、U-Net、高斯头）学习率高。课程由易到难：先练相邻很近的两帧，再练相隔很远的两帧。"}}, {"b": "eqs", "eqs": [{"tex": "\\eta(t)=\\begin{cases}\\eta_{\\max}\\Big[\\tfrac1{25}+\\big(1-\\tfrac1{25}\\big)\\tfrac{1-\\cos(\\pi t/T_w)}{2}\\Big], & t\\le T_w\\\\[4pt] \\eta_{\\min}+(\\eta_{\\max}-\\eta_{\\min})\\tfrac{1+\\cos\\left(\\pi\\frac{t-T_w}{T-T_w}\\right)}{2}, & t>T_w\\end{cases}", "explain_zh": "OneCycleLR（anneal_strategy='cos'，PyTorch 默认 div_factor=25、final_div_factor=10⁴）。T 为总步数（max_steps+10）；T_w=0.01·T，150K 步时约 1.5K；η_max 对 ViT 组为 2e-6，对其余参数为 2e-4；η_min=η_max/(25×10⁴)。按 PyTorch 实现改写，论文未给出公式。"}, {"tex": "N_{\\text{samples}}=N_{\\text{gpu}}\\times b\\times T:\\quad 4\\times8\\times150\\text{K}=4\\times4\\times300\\text{K}=1\\times8\\times600\\text{K}=4.8\\text{M}", "explain_zh": "README 给出的等价训练配置：总样本数 N_samples = 卡数 N_gpu × 每卡 batch b × 步数 T。4×GH200、4×4090、1×A100 三种配置的样本总数相同，均为 4.8M；README 称 PSNR 差异不超过 0.1 dB。"}]}, {"b": "p", "t": "lr：2e-4（主体），2e-6（ViT）；weight decay 0.01；OneCycle pct_start 0.01；梯度裁剪 0.5；RE10K：150K 步，4×GH200，每卡 batch 8；RE10K 输入间隔 45–135 帧（warm-up 30K 步，从 25–45 开始），每个样本 4 个目标。DL3DV：第一阶段 32 卡×batch 8，150K 步；第二阶段 8 卡×batch 1，100K 步，视角 2–6，目标 8。论文 camera-ready 版（检索摘要）：4 张 GH200 上 small 约 1 天、large 约 2 天，与 README 一致；较早的 arXiv v2 写的是 8 张 GH200、约 20 小时。配置中的 warm_up_steps: 2000 没有被读取。", "label": "具体数字"}, {"b": "p", "t": "给预训练 ViT 设一个很低的学习率，是在“适应新任务”和“保留先验”之间折中。OneCycle 自带短 warmup 和余弦退火，对大 batch 训练比较稳。输入间隔的课程式放宽，让网络先学会小视差的匹配，再面对大视差。没有采用的方案有：冻结 ViT（论文未给出对比）；ViT 用全学习率；固定间隔采样。", "label": "为什么这样设计"}, {"b": "p", "t": "（1）想冻结 ViT，不能把 optimizer.lr_monodepth 设为 0。model_wrapper.py 中的判断是 “if lr_monodepth > 0” 才分组，等于 0 时所有参数（包括 ViT）都会用 2e-4 训练，效果与冻结正好相反；真正冻结要给这些参数设 requires_grad=False。（2）config/main.yaml 中的 warm_up_steps 是无效字段。（3）DL3DV 第二阶段脚本引用的 checkpoint 名（…-76a0605a.pth）与 MODEL_ZOO 发布的（…-fea94f65.pth）不一致，照抄脚本会找不到文件。（4）减少 GPU 数量时，要按 README 的等式同步增加步数；只改 batch 不改步数，会少训练很多样本。", "label": "容易误解的地方"}, {"b": "qa", "items": [{"q": "有人想做“冻结单目 ViT”的消融，于是在命令行里加了 optimizer.lr_monodepth=0。实际发生了什么？应该怎么改？", "a": "configure_optimizers 中，只有 lr_monodepth>0 时才把参数分成两组。设为 0 后走 else 分支，所有参数放在同一组，学习率都是 2e-4，ViT 反而被全速训练，与“冻结”正好相反，还可能冲掉预训练特征。正确做法是在构建模型后，把名字含 “pretrained” 的参数设为 requires_grad=False，或者在优化器里把这组参数排除掉，并确认 ViT 的前向处于 eval 模式（没有 dropout）。"}]}, {"b": "sec", "h": "DS11 · 扩展到更多视角与更高分辨率：每个视角只配 2 个最近邻，12 张 512×960 输入约 0.6 s 完成重建", "id": "walk-depthsplat-ds11", "sn": {"label": "论文位置", "t": "论文 DL3DV 多视角实验（README 标注为 Table 7）与补充材料中的高分辨率结果；代码 encoder_depthsplat.py:151-170（local_mv_match、nn_matrix）；mv_transformer.py（batch_features、batch_features_camera_parameters 的 nn_matrix 分支）；ldm_unet/unet.py（跨视角自注意力）；README “Rendering Video” 命令；MODEL_ZOO（448×768，randview 2–6 与 4–10）"}}, {"b": "p", "t": "以 V=12、512×960 为例。先计算光心距离矩阵 cdist [B,12,12]，对每行 argsort 取前 3 列得到 nn_matrix [B,12,3]，即自身加 2 个邻居。之后的 cross-attention 与代价体都只用这 2 个邻居，warp 批大小为 12×2=24。U-Net 的跨视角注意力仍然覆盖全部 12 个视角。输出 12×512×960=5,898,240 个高斯。", "label": "这一步做什么", "mn": {"label": "需要的基础", "links": [{"k": "concept-d-mvs"}, {"k": "concept-l-attention"}, {"k": "concept-g-rig"}, {"k": "adv-a-ff-3dgs"}, {"k": "adv-a-compression"}]}}, {"b": "p", "t": "像素对齐方法扩展到更多视角时，有两处开销会膨胀：一是匹配，每个视角要和其他所有视角比较，随 V² 增长；二是高斯数量，随 V×H×W 线性增长。DepthSplat 用一个简单规则处理第一处：V>3 时，按相机光心的欧氏距离，为每个视角只选最近的 2 个视角，多视角 Transformer 的 cross-attention 和代价体都只和它们计算。于是匹配开销变成对 V 线性（a-ff-3dgs）。训练时随机 2–6 或 4–10 个视角，让网络适应不同的视角数。U-Net 中的跨视角自注意力没有被限制，仍是全视角，但它位于下采样 4 或 8 倍的层级，token 很少。\n\n第二处，高斯数量，DepthSplat 没有处理：12 张 512×960 就是约 590 万个高斯，多个视角重叠的区域会各生成一份。README 的高分辨率命令还有两个值得注意的改动：把最低分辨率设为 1/8（lowest_feature_resolution=8），降低代价体的分辨率：12 视角示例用的 small 模型只有 1/8 这一个尺度，再由 DPT 上采样 8 倍；6 视角示例用的 base 模型为 1/8 加 1/4 两个尺度；gaussian_scale_max 从 3 改为 0.1，限制高斯的最大尺寸。两条命令用的都是 448×768 训练的权重，官方没有说明 0.1 是训练时的取值还是推理时的补救；无论哪种，这个值都不随权重保存，要手动匹配。\n\n据论文附录（检索摘要），MVSplat 在 512×960、6 或 12 视角时显存溢出，DepthSplat 靠 1/8 的最低特征分辨率和“只与最近 2 个视角做局部匹配”避免了这一点。速度方面，README 给出 12 张 512×960 输入约 0.6 s（单张 A100），相当于不到 2 fps，适合离线或交互式预览，谈不上视频实时。其中占比最大的，很可能是 ViT（每张 2448 个 token）和 1/8 分辨率上 128 个候选的代价体。按形状估算，warp 后的特征张量约有 30 亿个数，fp32 约 12 GB；这是估算，并未实测。", "mn": {"label": "类比", "t": "一个大会议室里坐着 12 个人，每人只和左右两个邻座核对笔记（局部匹配），而不是和所有人两两核对。最后主持人再在全场快速广播一次（U-Net 全视角注意力），但只念提纲（低分辨率 token）。"}}, {"b": "eqs", "eqs": [{"tex": "\\mathcal N(i)=\\underset{j\\ne i}{\\mathrm{arg\\,top}_k}\\ \\big(-\\lVert\\mathbf o_i-\\mathbf o_j\\rVert_2\\big),\\quad k=2\\ \\ (V>3)", "explain_zh": "邻居选择（encoder_depthsplat.py:151-159）。o 为相机光心，即外参的平移列；只看距离，不看朝向和视锥重叠。V≤3 时 N(i) 为其余全部视角。"}, {"tex": "\\text{cost}_{\\text{match}}\\propto V\\,k\\left(\\frac{(hw)^2}{s^2}+D\\,hw\\,C\\right),\\qquad \\text{cost}_{\\text{U-Net attn}}\\propto (V\\,h'w')^2,\\qquad N_G=V\\,H\\,W", "explain_zh": "粗略的复杂度，按代码结构推导。h、w 为主尺度特征图尺寸；s²=4 为窗口数；D=128 为候选数；C=128 为通道数；h'w' 为 U-Net 注意力层每个视角的 token 数，small 在 RE10K 上为 16×16，DL3DV 在 512×960 时为 16×30；N_G 为高斯数。匹配部分对 V 线性，U-Net 注意力对 V 是平方关系，但 h'w' 很小。"}]}, {"b": "p", "t": "local_mv_match=2。README 示例：RE10K 720p 子集，6 视角 512×960（base，gaussian_scale_max=0.1）；DL3DV，12 视角 512×960（small，upsample_factor 8，lowest 8，gaussian_scale_max=0.1），约 0.6 s（A100）。高斯数：6×256×448=688,128；12×512×960=5,898,240。ViT token 数：512×960 缩放为 504×952，每视角 36×68=2448 个。训练视角数：DL3DV 256×448 模型为 2–6，448×768 small 为 4–10，base 为 2–6（MODEL_ZOO）。", "label": "具体数字"}, {"b": "p", "t": "局部匹配以很小的精度代价换来线性扩展。相邻视角通常重叠最多、视差最小，匹配也最可靠（这是我们的解读）。在低分辨率上保留全视角注意力，可以让远处的视角也交换一些全局信息。没有采用的方案有：全视角两两匹配（V=12 时每个视角要匹配 11 个）；按视锥重叠或视线夹角选邻居；跨视角合并或剔除重复的高斯（留给了 FreeSplat、ReSplat 等工作）。", "label": "为什么这样设计"}, {"b": "p", "t": "（1）只按光心距离选邻居。在环绕式相机阵列里，光心很近但朝向相反的相机会被选中，真正共视的相机反而被漏掉。（2）训练时随机的视角数上限只有 6 或 10，推理时用 12 视角属于外推，论文只给出了定性结果。（3）高斯数随视角数线性增长，而且没有去重，多视角重叠区域会有多层几乎重合的高斯。（4）README 中的高分辨率命令同时改动了多个超参（scale 上限、尺度数、上采样倍数），套用到自己的数据时要逐项核对。", "label": "容易误解的地方"}, {"b": "qa", "items": [{"q": "一个相机阵列中，参考相机旁边有两台候选：A 与它光心相距 0.3 m，但朝向相反（背对背）；B 相距 0.8 m，几乎与它同向。按 DepthSplat 的规则会选谁？后果是什么？应该怎么改？", "a": "规则只看光心距离，会优先选 A。A 与参考相机没有共视区域，把它的特征 warp 过来，要么越界得 0，要么对上毫不相关的内容，代价体几乎没有信息，深度只能靠单目分支，多视角一致性变差；B 这个真正的好邻居可能被挤出前 2 名。改进办法是按视锥重叠、光轴夹角或二者的组合打分来选邻居，在固定阵列中也可以直接预先指定邻接表。"}]}, {"b": "sec", "h": "DS12 · 反方向：把高斯渲染损失当作深度的无监督预训练，再用 GT 深度微调（在 ScanNet、TartanAir、KITTI 上评测）", "id": "walk-depthsplat-ds12", "sn": {"label": "论文位置", "t": "论文“Gaussian splatting 用于深度的无监督预训练”实验（结果为 Abs Rel、δ1 柱状图），以及 ScanNet 两视角深度对比表（表号未能核对）；README Fig. 1 右半与 “Depth Prediction” 段；MODEL_ZOO “Depth Prediction”；scripts/inference_depth.sh；encoder_depthsplat.py:178-207（train_depth_only 分支）；model_wrapper.py:478-525（forward_depth_only 推理与保存深度）"}}, {"b": "p", "t": "阶段 A：在 RE10K（以及 DL3DV）上只用渲染损失训练整个 DepthSplat，得到深度分支的权重 θ_d⁰。阶段 B：以 θ_d⁰ 为初始化，在有真值的深度数据上微调深度分支；发布的模型用 ScanNet、TartanAir、VKITTI2，352×640，视角数 2–8。推理时只加载深度分支权重、跳过渲染，输出 [B,V,H,W] 的深度，尺度与位姿的平移尺度一致（官方推理脚本没有设 model.encoder.train_depth_only，高斯分支仍会以随机权重空跑一遍，结果丢弃）。", "label": "这一步做什么", "mn": {"label": "需要的基础", "links": [{"k": "concept-d-mono"}, {"k": "concept-d-mvs"}, {"k": "concept-l-loss"}, {"k": "concept-v-metrics"}, {"k": "adv-a-geo-fm"}]}}, {"b": "p", "t": "前面 11 步讲的是“深度帮助高斯”，这一步讲“高斯帮助深度”（d-mono、d-mvs、l-loss）。ds9 说明，DepthSplat 的深度分支在训练中从来没有见过深度真值，只靠“把新视角渲染对”学会了估深度。反过来看，这就是一种自监督：只要有带位姿的多视角视频，就能训练深度网络，完全不需要深度标注。RE10K 这类视频数量多、获取便宜，而带稠密深度真值的数据（ScanNet、TartanAir、KITTI）要么采集贵，要么是合成的。\n\n论文的受控实验是这样设计的：先在 RE10K 上只用 GS 渲染损失预训练，再在 TartanAir 与 VKITTI2 的混合数据上用真值深度微调，然后在 TartanAir（域内）、ScanNet 和 KITTI（零样本）上评测。对照组是不经 GS 预训练、直接用 Depth Anything（单目 ViT）和 UniMatch（多视角 Transformer）的有监督权重初始化再做同样微调的模型；检索摘要中也出现过“优于随机初始化”的说法，可能来自不同版本。据检索摘要，结果以柱状图给出（左 Abs Rel、右 δ1），GS 预训练在各项指标上都有提升，在难度较大的 TartanAir 和 KITTI 上最明显；作者的解释是，预训练起到了正则作用。另外，在 ScanNet 两视角深度上，DepthSplat 的 Abs Rel 约为 0.04，明显低于 UniMatch 的 0.059 和 DeepV2D 的 0.057。\n\n这里的“无监督”只是指预训练阶段不用深度标签，位姿还是需要的，而且最终的深度模型仍然经过真值微调。深度的尺度由位姿决定：代价体用真实位姿做 warp，高斯要和位姿对齐才能渲染对，所以 MODEL_ZOO 说预测深度的尺度“与相机位姿平移的尺度一致”。遗憾的是，阶段 A 就是常规的 GS 训练，可以复现；阶段 B 的数据处理、深度损失和评测代码都没有开源，仓库只能用发布的深度权重推理（scripts/inference_depth.sh）。", "mn": {"label": "类比", "t": "像学开车时先在模拟器里练。模拟器（渲染损失）不会告诉你“离前车 12.3 米”，但只要你判断错距离就会“撞车”（渲染错误），练多了自然有了距离感。之后再上真车，由教练拿着测距仪（GT 深度）纠正几次，就比从零学起快得多，也更稳。"}}, {"b": "eqs", "eqs": [{"tex": "\\theta^{0}=\\arg\\min_{\\theta_d,\\theta_g}\\ \\mathbb E_{(I_{\\text{ctx}},I_{\\text{tgt}},\\mathbf E)}\\Big[\\mathcal L_{\\text{render}}\\big(\\mathcal R(\\mathcal G_{\\theta_g}(\\mathcal D_{\\theta_d}(I_{\\text{ctx}},\\mathbf E)),\\mathbf E_{\\text{tgt}}),\\ I_{\\text{tgt}}\\big)\\Big]", "explain_zh": "阶段 A 的目标（按论文思路写成公式）。𝒟_θd 为深度分支，即 ds2–ds7；𝒢_θg 为高斯头，即 ds8；ℛ 为光栅化；E 为位姿；ℒ_render 为 ds9 中的 MSE+LPIPS。阶段 B 取 θ^0 中的 θ_d 作为初始化，用深度损失微调，深度损失的具体形式未开源，论文细节也未能核对。"}, {"tex": "\\mathrm{AbsRel}=\\frac1N\\sum_{\\mathbf p}\\frac{|z(\\mathbf p)-z^*(\\mathbf p)|}{z^*(\\mathbf p)},\\qquad \\delta_1=\\frac1N\\sum_{\\mathbf p}\\Big[\\max\\Big(\\tfrac{z}{z^*},\\tfrac{z^*}{z}\\Big)<1.25\\Big]", "explain_zh": "常用的深度指标。z 为预测深度，z* 为真值，N 为有效像素数；AbsRel 越低越好，δ1 越高越好。论文表格常把 AbsRel 乘以 100 再报告，读数时要注意单位，例如 5.9 表示 0.059。"}]}, {"b": "p", "t": "ScanNet 两视角深度 Abs Rel 基线：DeMoN 0.231，DeepV2D 0.057，UniMatch 0.059。DepthSplat 约为 0.04 量级；不同检索摘要分别给出 0.044，以及“无 GS 预训练 Abs Rel 0.045 / RMSE 0.125，有 GS 预训练 0.038 / 0.114”，可能对应不同的论文版本，未能核对。GS 预训练实验的结果是柱状图，没有表格数值。发布的深度模型：small 36M，base 111M，训练分辨率 352×640，视角数 2–8，训练数据为 ScanNet、TartanAir、VKITTI2（MODEL_ZOO）。推理示例：RE10K 2 视角或 6 视角 352×640，DL3DV 12 视角 512×960（scripts/inference_depth.sh）。", "label": "具体数字"}, {"b": "p", "t": "带深度真值的数据稀缺，带位姿的视频却很多；可微的高斯渲染把“位姿 + 图像”变成了深度的训练信号。与传统的自监督单目深度（通过前后帧 warp 做光度重建）相比，这里的监督来自多视角新视角渲染，并且位姿已知，没有尺度和位姿估计的耦合问题（这是我们的解读）。没有采用的方案有：直接用 Depth Anything 或 UniMatch 的有监督权重初始化再微调（作为对照，效果较差）；只用合成数据训练深度。", "label": "为什么这样设计"}, {"b": "p", "t": "（1）“无监督”只是指预训练不用深度标签，需要位姿，最终模型也用了真值微调，不是端到端无监督的深度估计。（2）阶段 B 的代码没有开源，只能复现推理，不能复现论文里的深度实验。（3）ScanNet 的数字在不同版本之间不一致，引用时应以论文最新版为准，并注明版本。（4）深度尺度跟随位姿，给它尺度任意的 SfM 位姿，输出深度的尺度也是任意的；与公制深度比较前，需要先对齐尺度，或使用公制位姿。", "label": "容易误解的地方"}, {"b": "qa", "items": [{"q": "为什么说 DepthSplat 的深度“尺度与位姿的平移一致”？这对“在 RE10K 上预训练、再在公制数据上微调”意味着什么？", "a": "代价体用输入的位姿把邻居特征 warp 到候选深度上，高斯也要按这些深度放在世界坐标里，才能在目标位姿下渲染对。如果位姿的平移整体放大 2 倍，只有深度也放大 2 倍，匹配和渲染才会同样正确，所以深度尺度是由位姿“借”来的。RE10K 的位姿来自 SLAM/SfM，各场景尺度任意，预训练学到的是“按位姿给出一致尺度的深度”，而不是绝对的公制常识。到了带公制位姿和真值深度的数据上微调时，网络不需要重新学习尺度的来源，只要位姿是公制的，输出就是公制的。合理的推测是，这有助于它迁移到 ScanNet、KITTI，但论文没有单独验证这一点。"}]}, {"b": "sec", "h": "配套文章", "id": "parts"}, {"b": "toc", "groups": [{"items": [{"k": "wpart-depthsplat-tensor-trace", "t": "DepthSplat · 张量追踪", "en": "", "s": "逐阶段列出 15 个关键张量的形状与含义。"}, {"k": "wpart-depthsplat-experiments", "t": "DepthSplat · 阅读实验", "en": "", "s": "论文里 9 组实验分别怎么读、真正说明了什么。"}, {"k": "wpart-depthsplat-tradeoffs", "t": "DepthSplat · 设计权衡", "en": "", "s": "8 个关键设计选择：换来了什么，付出了什么。"}, {"k": "wpart-depthsplat-faq", "t": "DepthSplat · 常见问题", "en": "", "s": "初读时最常问的 11 个问题。"}, {"k": "wpart-depthsplat-exercises", "t": "DepthSplat · 练习", "en": "", "s": "6 道由浅入深的动手练习。"}, {"k": "wpart-depthsplat-glossary", "t": "DepthSplat · 论文术语", "en": "", "s": "读这篇论文会遇到的 29 个术语。"}]}]}], "toc": true, "series": {"prev": {"k": "guide-freesplat"}, "next": {"k": "guide-lvsm"}, "up": {"u": "works/walkthrough/index.html", "t": "Walkthrough 目录"}}}}</script>
<script>
(function () {
  "use strict";
  // ================= lib: DOM, text and math helpers shared by every page =================
  // A page script defines rich(text) (inline cross-links); paras() and eqList() call it.
  var DATA;
  try { DATA = JSON.parse(document.getElementById("data").textContent); } catch (e) { DATA = {}; }
  var meta = DATA.meta || {};

  // ---------- DOM helpers: all text goes through textContent; external links are https-only ----------
  function safeUrl(u) { if (typeof u !== "string") return null; var s = u.trim(); return /^https:\/\/[^\s"'<>]+$/i.test(s) ? s : null; }
  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (!Object.prototype.hasOwnProperty.call(attrs, k)) continue;
      var v = attrs[k];
      if (v === null || v === undefined || v === false) continue;
      if (k === "class") n.className = v;
      else if (k === "text") n.textContent = String(v);
      else if (k === "href") { var u = safeUrl(v); if (u) { n.setAttribute("href", u); n.setAttribute("target", "_blank"); n.setAttribute("rel", "noopener noreferrer"); } }
      else if (k.slice(0, 2) === "on" && typeof v === "function") n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, String(v));
    }
    (kids || []).forEach(function (c) { if (c === null || c === undefined || c === false) return; n.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return n;
  }
  var SVGNS = "http://www.w3.org/2000/svg";
  function sv(tag, attrs, kids) {
    var n = document.createElementNS(SVGNS, tag);
    if (attrs) for (var k in attrs) {
      if (!Object.prototype.hasOwnProperty.call(attrs, k)) continue;
      var v = attrs[k];
      if (v === null || v === undefined || v === false) continue;
      if (k === "text") n.textContent = String(v);
      else if (k.slice(0, 2) === "on" && typeof v === "function") n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, String(v));
    }
    (kids || []).forEach(function (c) { if (c) n.appendChild(c); });
    return n;
  }
  function arr(x) { return Array.isArray(x) ? x : []; }
  function str(x) { return typeof x === "string" ? x : (x === null || x === undefined ? "" : String(x)); }
  function paras(text) { return str(text).split(/\n\s*\n/).map(function (t) { return t.trim(); }).filter(Boolean).map(function (t) { return el("p", null, rich(t)); }); }
  function link(title, url) { return safeUrl(url) ? el("a", { href: url, text: title }) : el("span", { text: title }); }
  function ul(items, map) { return el("ul", { class: "plain" }, arr(items).map(function (x) { return el("li", null, [map ? map(x) : str(x)]); })); }
  function fmtCit(n) { n = Number(n); if (!(n >= 0)) return "—"; if (n >= 1000) return (n / 1000).toFixed(n >= 10000 ? 0 : 1) + "k"; return String(n); }

  // ---------- math (MathJax, typeset lazily) ----------
  var mathReady = false, mathQueue = [];
  function mathUsable() { return !!(window.MathJax && typeof window.MathJax.typesetPromise === "function"); }
  function flushMath() { mathReady = true; var q = mathQueue.slice(); mathQueue = []; q.forEach(typeset); }
  window.__atlasMathReady = flushMath;
  // MathJax may finish loading before this script runs (cached/async), so also poll for it.
  var mathPoll = setInterval(function () { if (mathUsable()) { clearInterval(mathPoll); flushMath(); } }, 200);
  setTimeout(function () { clearInterval(mathPoll); }, 30000);
  function typeset(node) {
    if (!node) return;
    if (!mathReady && mathUsable()) mathReady = true;
    if (!mathReady || !mathUsable()) { mathQueue.push(node); return; }
    try { window.MathJax.typesetPromise([node]).catch(function () { /* leave raw TeX visible */ }); } catch (e) { /* leave raw TeX visible */ }
  }
  function eqList(eqs) {
    eqs = arr(eqs).filter(function (q) { return q && str(q.tex).trim(); });
    if (!eqs.length) return null;
    return el("div", { class: "eqs" }, eqs.map(function (q) {
      return el("div", { class: "eq" }, [el("div", { class: "math-block", text: "\\[" + str(q.tex) + "\\]" }), q.explain_zh ? el("p", null, rich(q.explain_zh)) : null]);
    }));
  }
  document.addEventListener("toggle", function (e) { var t = e.target; if (t && t.tagName === "DETAILS" && t.open) typeset(t); }, true);

  // ================= frame (Tufte site): links, notes, hover previews, top bar, theme =================
  var SITE = DATA.site || {};
  var ROOT = str(SITE.root);
  var XREF = DATA.xref || {};
  function hasX(key) { return Object.prototype.hasOwnProperty.call(XREF, key); }
  // Custom page parts (search tools, diagrams, charts) register here; blocks.js calls them for {"b": "slot"} blocks.
  var SLOTS = {};

  // ---------- internal links: urls are relative to the site root; pages sit at different depths ----------
  var SAFE_PATH = /^[A-Za-z0-9][A-Za-z0-9._\/-]*(\?[A-Za-z0-9=&._-]+)?(#[A-Za-z0-9._-]+)?$/;
  function relHref(u) {
    u = str(u);
    if (/^#[A-Za-z0-9._-]+$/.test(u)) return u;
    if (!SAFE_PATH.test(u)) return null;
    var cut = u.indexOf("#"), path = cut < 0 ? u : u.slice(0, cut);
    if (path === SITE.path) return cut < 0 ? "#" : u.slice(cut);
    return ROOT + u;
  }
  function pageLink(u, text, cls) {
    var h = relHref(u);
    if (!h) return el("span", { class: cls || null, text: text });
    var a = el("a", { class: cls || null, text: text });
    a.setAttribute("href", h);
    return a;
  }
  // A link to a known entry (concept, topic, paper, step...). data-xref drives the hover preview.
  function xlink(key, text, cls) {
    if (!hasX(key)) return text ? document.createTextNode(text) : null;
    var x = XREF[key], a = pageLink(x.u, text || x.n || x.t, cls);
    a.setAttribute("data-xref", key);
    return a;
  }

  // Concept / topic ids mentioned in prose ("见 g-pinhole") become links labelled with the entry's short name.
  var ID_RE = /(a-[a-z0-9]+(?:-[a-z0-9]+)*|[fgdrilnv]-[a-z0-9]+)/g;
  var CJK = /[　-〿㐀-鿿＀-￯]/;
  function rich(text) {
    var s = str(text), out = [], last = 0, m;
    ID_RE.lastIndex = 0;
    while ((m = ID_RE.exec(s)) !== null) {
      var id = m[1], prev = m.index > 0 ? s.charAt(m.index - 1) : "", next = s.charAt(m.index + id.length);
      var key = hasX("concept-" + id) ? "concept-" + id : (hasX("adv-" + id) ? "adv-" + id : null);
      if (!key || /[A-Za-z0-9_\-]/.test(prev) || /[A-Za-z0-9_]/.test(next)) continue;
      // The prose spaces ids off from Chinese text; a Chinese label needs no such space.
      var before = s.slice(last, m.index);
      if (/ $/.test(before) && CJK.test(before.charAt(before.length - 2))) before = before.slice(0, -1);
      if (before) out.push(document.createTextNode(before));
      out.push(xlink(key, null, "xref"));
      last = m.index + id.length;
      if (s.charAt(last) === " " && CJK.test(s.charAt(last + 1))) last++;
    }
    if (last < s.length) out.push(document.createTextNode(s.slice(last)));
    return out;
  }
  function lines(text) { return str(text).split(/\n+/).map(function (t) { return t.trim(); }).filter(Boolean).map(function (t) { return el("p", null, rich(t)); }); }

  // ---------- side notes (numbered) and margin notes (unnumbered); on phones they fold behind a toggle ----------
  var noteSeq = 0;
  function sidenote(kids) {
    var id = "sn-" + (++noteSeq);
    return el("span", { class: "note-wrap" }, [
      el("label", { for: id, class: "margin-toggle sidenote-number", "aria-label": "旁注" }),
      el("input", { type: "checkbox", id: id, class: "margin-toggle" }),
      el("span", { class: "sidenote" }, kids)
    ]);
  }
  function marginnote(kids) {
    var id = "mn-" + (++noteSeq);
    return el("span", { class: "note-wrap" }, [
      el("label", { for: id, class: "margin-toggle", "aria-label": "边注", text: "⊕" }),
      el("input", { type: "checkbox", id: id, class: "margin-toggle" }),
      el("span", { class: "marginnote" }, kids)
    ]);
  }
  function noteLabel(text) { return el("span", { class: "note-label", text: text }); }

  // ---------- article scaffolding ----------
  var main = document.getElementById("main");
  var art = main.querySelector("article");
  function section(id, title, kids) {
    var s = el("section", { id: id }, [title ? el("h2", { text: title }) : null].concat(kids));
    art.appendChild(s);
    return s;
  }
  function articleHead(o) {
    var crumbs = el("nav", { class: "crumbs", "aria-label": "位置" });
    arr(SITE.crumbs).forEach(function (c, i) {
      if (i) crumbs.appendChild(el("span", { class: "sep", text: "›", "aria-hidden": "true" }));
      crumbs.appendChild(c[1] ? pageLink(c[1], c[0]) : el("span", { text: c[0] }));
    });
    art.appendChild(el("header", { class: "art-head" }, [
      crumbs,
      el("h1", { text: o.title }),
      o.subtitle ? el("p", { class: "subtitle", text: o.subtitle }) : null,
      o.meta ? el("p", { class: "meta" }, o.meta) : null
    ]));
    if (o.epigraph) art.appendChild(el("div", { class: "epigraph" }, [el("blockquote", null, [el("p", null, rich(o.epigraph))])]));
  }
  // Previous / next in the series, each with its hover preview.
  function seriesNav(prevKey, nextKey, indexUrl, indexLabel) {
    var nav = el("nav", { class: "series", "aria-label": "同系列" });
    nav.appendChild(el("div", { class: "prev" }, prevKey && hasX(prevKey) ? [el("small", { text: "上一篇" }), xlink(prevKey)] : []));
    nav.appendChild(el("div", { class: "up" }, indexUrl ? [pageLink(indexUrl, indexLabel)] : []));
    nav.appendChild(el("div", { class: "next" }, nextKey && hasX(nextKey) ? [el("small", { text: "下一篇" }), xlink(nextKey)] : []));
    art.appendChild(nav);
  }

  // ---------- hover preview for internal links: mouse (after 300 ms) or keyboard focus; never on touch ----------
  var tip = null, tipTimer = 0, tipFor = null;
  function hideTip() {
    clearTimeout(tipTimer);
    if (tip) tip.hidden = true;
    if (tipFor) { tipFor.removeAttribute("aria-describedby"); tipFor = null; }
  }
  function showTip(a) {
    var key = a.getAttribute("data-xref");

        }))])];
        case "mtoc": return [marginToc(b.items)];
        case "slot": return typeof SLOTS[b.name] === "function" ? [SLOTS[b.name](b)] : [];
        default: return [];
      }
    }
    // Long articles: a table of contents at the top of the margin (a folding list on phones).
    function marginToc(items) {
      var d = el("details", { class: "mtoc" }, [el("summary", { text: "本文目录" }), el("ol", null, arr(items).map(function (x) { return el("li", null, [part(x)]); }))]);
      var wide = window.matchMedia("(min-width: 761px)");
      d.open = wide.matches;
      return d;
    }
    arr(PG.body).forEach(function (b) {
      if (b.b === "sec") {
        box = el("section", { id: b.id || null });
        if (b.h) box.appendChild(heading("h2", { t: b.h, sn: b.sn }));
        art.appendChild(box);
        return;
      }
      render(b).forEach(function (n) { if (n) cur().appendChild(n); });
    });

    var S = PG.series || {};
    if (S.prev || S.next || S.up) {
      var nav = el("nav", { class: "series", "aria-label": "同系列" });
      nav.appendChild(el("div", { class: "prev" }, S.prev ? [el("small", { text: "上一篇" }), part(S.prev)] : []));
      nav.appendChild(el("div", { class: "up" }, S.up ? [part(S.up)] : []));
      nav.appendChild(el("div", { class: "next" }, S.next ? [el("small", { text: "下一篇" }), part(S.next)] : []));
      art.appendChild(nav);
    }
  })();

  finishPage();
})();
</script>
</body>
</html>
