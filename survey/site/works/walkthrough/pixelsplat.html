:root {

.menu-btn:hover, .theme-btn:hover, .burger:hover, .menu.open > .menu-btn { color: var(--accent); }

/* ---------- article column + margin ---------- */
main { display: block; }
.art { max-width: 67rem; margin: 0 auto; padding: 2.6rem 1.5rem 3rem; counter-reset: sidenote-counter; }
.art > *, .art section > * { width: var(--main); }
.art > section { width: 100%; }

.math-block mjx-container { margin: 0 !important; }

/* ---------- side notes & margin notes (floated into the right margin) ---------- */
.sidenote, .marginnote {
  float: right; clear: right; position: relative;
  width: var(--side); margin-right: calc(-1 * (var(--side) + var(--gap))); margin-top: .3rem; margin-bottom: .6rem;
  font-family: var(--note); font-size: .88rem; line-height: 1.6; color: var(--ink-2); text-align: left;

}
h3 .sidenote { margin-top: .2rem; }
.sidenote-number { counter-increment: sidenote-counter; }
.sidenote-number::after, .sidenote::before { font-family: "et-book-osf", var(--serif); position: relative; vertical-align: baseline; }
.sidenote-number::after { content: counter(sidenote-counter); font-size: .75rem; top: -.55em; left: .08em; color: var(--ink-2); }
.sidenote::before { content: counter(sidenote-counter) " "; font-size: .8rem; top: -.4em; }
.note-label { font-family: var(--serif); font-weight: 600; font-size: .82rem; color: var(--muted); margin-right: .5em; }
.marginnote .note-label { display: block; margin: 0 0 .1rem; }
input.margin-toggle { display: none; }
label.sidenote-number { display: inline; cursor: default; }

/* ---------- quiz, further reading, series ---------- */

.quiz details[open] summary::before { content: "− "; }
.quiz summary:hover { color: var(--accent); }
.quiz details > p { margin-top: .3rem; padding-left: 1rem; border-left: 1px solid var(--rule); color: var(--ink-2); }

/* Reference lists: a narrow label column (kind / year) and a hanging text column. */
.art ul.refs { list-style: none; padding-left: 0; }
.refs li { display: grid; grid-template-columns: 2.8rem minmax(0, 1fr); column-gap: .5rem; line-height: 1.6; }
.refs li > :not(.kind):not(.yr) { grid-column: 2; }
.refs .kind, .refs .yr { grid-column: 1; font-family: var(--note); font-size: .86rem; color: var(--muted); padding-top: .12rem; }

.art .refs li + li { margin-top: .75rem; }

.refs.noleft li { display: block; }
.refs.wide-kind li { grid-template-columns: 6.2rem minmax(0, 1fr); }
.refs .used { font-family: var(--note); font-size: .82rem; color: var(--muted); margin-left: .5em; }
.refs.terms .plain-t { font-weight: 600; }

/* ---------- blocks: lede, run-in labels, notes ---------- */
.lede { margin-top: 1.6rem; color: var(--ink-2); }

h2 .en, h3 .en { font-family: "et-book", var(--serif); font-style: italic; font-weight: 400; color: var(--muted); margin-left: .6em; font-size: .92em; }
h2 a, h3 a { text-decoration-color: var(--rule); }

/* Index pages: a table of contents instead of a card grid. */
.art ol.toc { list-style: none; padding-left: 0; margin-top: .4rem; }

/* Tables: booktabs rules (top, under the header, bottom), no vertical lines, no fills. */
.table-wrap { overflow-x: auto; margin: 1rem 0; }

table.kv td { padding: .25rem 0; vertical-align: top; }

/* Long articles: the table of contents sits at the top of the margin. */
/* It sits in a full-width section, so it floats into the margin without a negative offset. */
details.mtoc {
  float: right; clear: right; width: var(--side); margin-right: 0; margin-bottom: 1rem;
  font-family: var(--note); font-size: .86rem; line-height: 1.55; color: var(--ink-2);

details.mtoc summary { font-family: var(--serif); font-weight: 600; font-size: .82rem; color: var(--muted); list-style: none; cursor: default; }

.art details.mtoc ol { list-style: none; padding: 0; margin: .3rem 0 0; }

/* Tools: search and filters with underlined inputs. */
.tool { margin-top: 1rem; }
.filters { display: flex; flex-wrap: wrap; gap: .6rem 1.6rem; align-items: baseline; font-family: var(--note); font-size: .92rem; color: var(--muted); }
.filters label { display: inline-flex; gap: .5rem; align-items: baseline; }

table.gl td.en { font-family: "et-book", var(--serif); width: 20%; }

/* Figures: the pipeline diagram and the timeline of classic papers, drawn in ink with one accent for interaction. */
figure { margin: 1.4rem 0; }
svg a { text-decoration: none; }
.diagram-wrap, .lanes-wrap { position: relative; overflow-x: auto; }
svg.diagram { width: 100%; min-width: 760px; height: auto; display: block; font-family: var(--note); }

svg.lanes .brk { stroke: var(--muted); fill: none; }

svg .dot { fill: var(--ink); }
svg .dot.hollow { fill: var(--bg); stroke: var(--ink-2); stroke-width: 1.2; }

svg.lanes a.m:focus { outline: none; }
.vtip { position: absolute; z-index: 20; max-width: 20rem; padding: .45rem .7rem; background: var(--bg); border: 1px solid var(--rule-2); font-family: var(--note); font-size: .82rem; line-height: 1.5; pointer-events: none; }
.vtip b { display: block; font-family: "et-book", var(--serif); font-weight: 400; font-size: .92rem; }
.vtip small { display: block; color: var(--muted); }
.vtip span { color: var(--accent); }

figcaption svg { vertical-align: -1px; }

.series { display: grid; grid-template-columns: 1fr auto 1fr; gap: 1rem; align-items: end; margin-top: 3.2rem; padding-top: 1rem; border-top: 1px solid var(--rule); font-size: .98rem; }
.series small { display: block; font-family: var(--note); font-size: .8rem; color: var(--muted); }
.series .up { text-align: center; font-size: .88rem; }

.site-foot { max-width: 67rem; margin: 0 auto; padding: 1.2rem 1.5rem 2.5rem; font-size: .82rem; color: var(--muted); }

/* ---------- hover preview ---------- */
.xtip {

  table.kv, table.kv tbody, table.kv tr, table.kv th, table.kv td { display: block; max-width: none; }

}

ough/pixelsplat-tradeoffs.html", "t": "pixelSplat · 设计权衡", "e": "", "m": "Walkthrough · pixelSplat", "s": "7 个关键设计选择：换来了什么，付出了什么。"}}, "page": {"id": "guide-pixelsplat", "head": {"title": "pixelSplat 导读", "sub": "pixelSplat: 3D Gaussian Splats from Image Pairs for Scalable Generalizable 3D Reconstruction", "meta": ["12 步", {"k": "anchor-pixelsplat", "t": "pixelSplat 精读"}], "epigraph": "", "prereqs": [], "lede": "", "minutes": 48}, "body": [{"b": "sec", "h": null, "id": "story"}, {"b": "mtoc", "items": [{"u": "#walk-pixelsplat-ps1", "t": "PS1 问题设定：两张带位姿的图像 → 一组可光栅化的 3D 高斯（256×256，两输入帧之间的内插）"}, {"u": "#walk-pixelsplat-ps2", "t": "PS2 数据预处理与尺度归一：基线缩放为 1，near/far 由 768 px 与 0.5 px 的视差定义"}, {"u": "#walk-pixelsplat-ps3", "t": "PS3 逐图像编码：DINO ResNet-50 与 ViT-B/8 的特征相加，得到每像素 128 维"}, {"u": "#walk-pixelsplat-ps4", "t": "PS4 尺度歧义与极线采样：每条射线在另一视角极线上取 32 个点，并三角化出各自的深度"}, {"u": "#walk-pixelsplat-ps5", "t": "PS5 Epipolar transformer：2 层“极线交叉注意力 + 逐图自注意力”"}, {"u": "#walk-pixelsplat-ps6", "t": "PS6 上采样与高分辨率跳连：64×64 → 256×256，再加一条直接读 RGB 的 7×7 卷积"}, {"u": "#walk-pixelsplat-ps7", "t": "PS7 沿射线的离散深度分布：32 个视差均匀的桶加上桶内偏移"}, {"u": "#walk-pixelsplat-ps8", "t": "PS8 为什么直接回归高斯位置会卡住：局部支撑与局部极小"}, {"u": "#walk-pixelsplat-ps9", "t": "PS9 重参数化：按分布采样 3 个深度，把被采样桶的概率当作不透明度"}, {"u": "#walk-pixelsplat-ps10", "t": "PS10 高斯参数预测：均值、协方差（尺度+四元数）、球谐（配置 4 阶、实际渲染 3 阶）与像素内偏移"}, {"u": "#walk-pixelsplat-ps11", "t": "PS11 渲染与训练：393,216 个高斯一次光栅化；MSE + 0.05·LPIPS；Adam 1.5e-4、300k 步、batch 7"}, {"u": "#walk-pixelsplat-ps12", "t": "PS12 评测协议、速度与显存：6474×3 个内插目标，Table 1 与消融怎么读"}]}, {"b": "p", "t": "想象你手里只有两张照片：同一个房间，从相隔几步远的两个位置拍下，你还知道两台相机的相对位姿。能不能一眨眼就把这个房间“立”起来，让人可以从两张照片之间任意一个位置去看？这就是 pixelSplat 要解决的问题：从一对图像前馈式地重建 3D 场景，并且重建结果要能实时渲染。\n\n2023 年之前，这个方向主要有两类做法。一类是 pixelNeRF 这样的条件 NeRF：网络读入图像特征，渲染时对每条射线上的几十到上百个点分别查询。另一类是 GPNR、Du et al. 这样的 light field transformer：不建 3D 表示，每条目标射线都沿着输入图像的极线收集特征，再用 Transformer 直接回归颜色。两类方法都要逐射线计算，渲染一张 256×256 的图需要 1 到 13 秒，训练时每个批次也只能采样少量射线。与此同时，3D Gaussian Splatting 刚刚证明，一组 3D 高斯可以在几毫秒内光栅化出整张图；但它需要对每个场景优化几分钟，还要用 SfM 点云做初始化。\n\npixelSplat 的想法很直接：让网络一次前向就输出一组 3D 高斯。为了让问题容易学，它把高斯挂在像素上，每个像素沿自己的射线放几个高斯，网络只需回答两件事：沿射线放多远，以及长什么样。想法简单，做起来却遇到两个障碍，论文的两个核心贡献分别对应这两个障碍。\n\n第一个障碍是尺度歧义。RealEstate10K 这类数据的相机位姿来自 SfM，每个场景的尺度都是任意的：同一个房间，位姿可以整体放大 10 倍。只看一张图，网络无论如何也猜不出这个场景在当前坐标系里有多远。唯一的办法是利用两张图之间的对应关系，也就是三角化。pixelSplat 为此设计了 epipolar transformer：对第一张图的每个像素，在第二张图的极线上取 32 个点，用注意力判断哪个是对应点；同时，把每个采样点三角化出来的深度做位置编码，一起送进注意力。网络一旦找到对应，就能直接读到这个对应点在当前场景尺度下有多远。消融显示，只去掉这个深度编码就会掉约 1 dB。\n\n第二个障碍是局部极小。一个高斯只影响自己投影附近的几个像素。如果它一开始被放在错误的深度，在目标图上就会落到错误的位置，梯度只能告诉它“往旁边挪一点”，没法告诉它“真正的位置在很远的地方”。要从错误位置移到正确位置，中途往往要经过让损失变大的区域，训练于是卡住。作者的解决办法很巧妙：不直接预测一个深度，而是预测沿射线 32 个深度桶上的概率分布，从中采样几个深度来放高斯，再把被采样桶的概率直接当作这个高斯的不透明度。采样本身不可导，但不透明度可导：放对位置的高斯，梯度会推高它的不透明度，也就推高了那个桶的概率；放错位置的则被压低。概率质量于是从错误的深度流向正确的深度，不需要任何一个高斯真的“走”过去。这与 NeRF 沿射线稠密采样、在对的地方增加密度、在错的地方削减密度，是同一种思路。\n\n结果怎样？在 RealEstate10K 和 ACID 的两视角宽基线基准上，pixelSplat 在 arXiv 初版中分别达到 25.89 dB 和 28.14 dB（camera-ready 版重训后为 26.09 dB 和 28.27 dB），在 RE10K 上比最强的基线 Du et al. 高约 1.1 dB；渲染一张图只要 2 ms，比次快的基线快约 650 倍，推理显存 3 GB；同时还能导出一个显式的 3D 高斯点云。这篇论文获得了 CVPR 2024 的 Best Paper Runner-Up。它的代码库、数据格式和评测索引后来成了一大批工作的起点：MVSplat、FreeSplat 的代码由它改出来，DepthSplat 也沿用同一套代码和评测，LVSM 则直接使用它的评测索引。\n\n读的时候也要看清它的边界。它只接收两张图，分辨率只有 256×256；两张图都没看到的区域补不出来；编码器每个场景约需 0.1 s；评测全部是两张输入帧之间的内插，其中 3% 的目标帧就是输入帧本身。对远程临场来说，它最有价值的是两点：一是“一次重建、任意视角 2 ms 渲染”这种与视角无关的表示，二是“用概率当不透明度”的可微选择技巧。而尺度推断、随机采样和两视角的限制，都需要为固定、已标定、多相机、要求时间稳定的临场阵列重新设计。后面的 12 步会按数据流把它逐一拆开，并和站内的 Quark、Ha et al.、MVSplat 等论文对照。"}, {"b": "sec", "h": "流水线", "id": "pipeline"}, {"b": "p", "t": "点击方框跳到对应步骤。"}, {"b": "slot", "name": "diagram", "which": "pixelsplat", "label": "pixelSplat 流程图", "spec": {"w": 960, "nodes": [{"x": 10, "y": 124, "w": 135, "h": 64, "t": "两张输入图", "s": "256² + 相机位姿", "step": "ps1"}, {"x": 167, "y": 24, "w": 135, "h": 64, "t": "尺度归一", "s": "基线=1，视差定界", "step": "ps2"}, {"x": 167, "y": 124, "w": 135, "h": 64, "t": "逐图编码", "s": "ResNet-50+ViT-B/8", "step": "ps3"}, {"x": 323, "y": 24, "w": 135, "h": 64, "t": "极线采样", "s": "32 点+三角化深度", "step": "ps4"}, {"x": 323, "y": 124, "w": 135, "h": 64, "t": "极线注意力", "s": "交叉+自注意 ×2", "step": "ps5"}, {"x": 480, "y": 124, "w": 135, "h": 64, "t": "上采样+跳连", "s": "64²→256²", "step": "ps6"}, {"x": 637, "y": 24, "w": 135, "h": 64, "t": "深度分布", "s": "32 个视差桶", "step": "ps7", "data": true}, {"x": 637, "y": 124, "w": 135, "h": 64, "t": "采样定不透明度", "s": "3 个/像素，α=p/3", "step": "ps9"}, {"x": 637, "y": 224, "w": 135, "h": 64, "t": "高斯参数", "s": "尺度/旋转/球谐", "step": "ps10"}, {"x": 793, "y": 24, "w": 135, "h": 64, "t": "梯度经α回传", "s": "绕开局部极小", "step": "ps8", "data": true}, {"x": 793, "y": 124, "w": 135, "h": 64, "t": "光栅化渲染", "s": "39 万高斯，2 ms", "step": "ps11"}, {"x": 793, "y": 224, "w": 135, "h": 64, "t": "评测协议", "s": "RE10K/ACID 内插", "step": "ps12", "data": true}], "edges": [{"d": "M145,156 L167,156"}, {"d": "M145,156 C156,156 156,56 167,56"}, {"d": "M302,56 L323,56"}, {"d": "M302,156 L323,156"}, {"d": "M390,88 L390,124"}, {"d": "M458,156 L480,156"}, {"d": "M615,156 C626,156 626,56 637,56"}, {"d": "M615,156 C626,156 626,256 637,256"}, {"d": "M704,88 L704,124"}, {"d": "M704,188 L704,224"}, {"d": "M772,156 L793,156"}, {"d": "M772,256 C782,256 782,156 793,156"}, {"d": "M860,124 L860,88"}, {"d": "M860,88 C860,118 704,118 704,88", "fb": true}, {"d": "M860,188 L860,224"}, {"d": "M860,188 L860,204 L939,204 L939,306"}], "out": {"x": 889, "y": 324, "text": "新视角图像（256×256）"}, "h": 336}}, {"b": "sec", "h": "读之前先掌握", "id": "before"}, {"b": "refs", "items": [{"k": "concept-g-pinhole", "gloss": "每个高斯的中心都是“像素射线上某个深度的点”，要用内参 K 的逆把像素变成射线，再用 camera-to-world 外参变到世界系；极线采样要把 3D 点投影回另一张图。代码里的内参是按宽高归一化的（第一行除以宽，第二行除以高），读代码前要先弄清这一点。"}, {"k": "concept-g-epipolar", "gloss": "epipolar transformer 的全部意义在于：一个像素在另一视角中的对应点只可能落在一条极线上，所以只需在这条线上取 32 个点做注意力。ps4、ps5 里“极线线段的两个端点是 near、far 处点的投影”就是极线几何的直接应用。"}, {"k": "concept-g-depth", "gloss": "深度桶在视差（逆深度）上均匀排列，near/far 也用“以基线计的像素视差”定义（768 px 与 0.5 px）。不熟悉深度与视差的反比关系，就看不懂为什么 far/near 是 1536，也看不懂为什么视差均匀的桶在近处更密。"}, {"k": "concept-g-sfm", "gloss": "论文的第一个核心问题“尺度歧义”来自 SfM：RealEstate10K 的位姿由 SfM 求得，只确定到一个全局尺度。要理解为什么单张图不能预测与位姿一致的深度，需要知道 SfM 的尺度自由度从何而来。"}, {"k": "concept-d-mvs", "gloss": "沿极线采样、比较特征、再换成深度，本质上就是多视角立体匹配。把 epipolar attention 看成“可学习、软的逐像素匹配”，并与 MVSplat 的平面扫描代价体对照，是理解这条技术谱系的关键。"}, {"k": "concept-l-attention", "gloss": "epipolar transformer 是 pre-LN 的交叉注意力：query 是本视角像素特征，key/value 是另一视角极线上的 32 个样本；它的“前馈层”又被换成了逐图自注意力。需要熟悉 Q/K/V、多头和残差结构。"}, {"k": "concept-l-encoding", "gloss": "三角化深度先被换成相对视差，再做 10 个 octave 的正弦位置编码；逐图自注意力的 token 也加了 2D 位置编码。去掉深度编码约掉 1 dB，理解位置编码为何能让网络利用连续数值很重要。"}, {"k": "concept-n-3dgs", "gloss": "输出就是 3DGS 的参数：均值、由尺度和四元数构成的协方差、球谐颜色、不透明度，渲染用的也是 3DGS 的可微光栅化器。还要知道原版 3DGS 靠逐场景优化、SfM 初始化和致密化来避开局部极小，才能看懂 pixelSplat 为什么需要概率深度。"}, {"k": "concept-r-alpha", "gloss": "“用概率当不透明度”的技巧依赖 alpha 合成的形式：颜色是按不透明度和透射率加权的和。要能算出每像素 3 个 α=1/3 的高斯叠在一起覆盖多少，也要理解代码里备选的 use_transmittance 选项为何写成 p/(1−累积概率)。"}, {"k": "concept-f-prob", "gloss": "深度用 32 个桶上的类别分布表示，训练时按分布采样，梯度经 softmax 回传。需要熟悉离散分布、逆 CDF 采样，以及“采样不可导”问题的几种处理方式（重参数化、REINFORCE、期望）。"}, {"k": "concept-n-generalizable", "gloss": "pixelSplat 属于可泛化、前馈式的新视角合成：训练一次，测试时对新场景不做任何优化。它的基线 pixelNeRF、GPNR、Du et al. 以及站内的 IBRNet、ENeRF 都属于这个大类，需要知道它们各自的渲染代价。"}, {"k": "concept-v-metrics", "gloss": "Table 1 同时报告 PSNR/SSIM/LPIPS 和编码时间、渲染时间、显存；读懂 dB 差和 MSE 比例的换算，以及 LPIPS 与感知质量的关系，才能判断 25.89 对 24.78 意味着多大的差距。"}]}, {"b": "sec", "h": "PS1 · 问题设定：两张带位姿的图像 → 一组可光栅化的 3D 高斯（256×256，两输入帧之间的内插）", "id": "walk-pixelsplat-ps1", "sn": {"label": "论文位置", "t": "论文摘要、引言与实验设置；Table 1；代码 config/experiment/re10k.yaml、config/dataset/re10k.yaml、config/dataset/view_sampler/bounded.yaml、config/dataset/view_sampler_dataset_specific_config/bounded_re10k.yaml、src/dataset/view_sampler/view_sampler_bounded.py、assets/evaluation_index_re10k.json"}}, {"b": "p", "t": "输入：一个场景的两张 RGB 图（训练时张量为 B×2×3×256×256，B=7）、按宽高归一化的内参 K、OpenCV 约定的 camera-to-world 外参，以及由基线推出的 near/far（B×2）。输出：一组 3D 高斯 {μ, Σ, 球谐 S, 不透明度 α}，每个场景 2×256×256×3 = 393,216 个；训练和评测时用它渲染目标视角的 RGB（B×V_t×3×256×256，训练 V_t=4，评测 V_t=3）。", "label": "这一步做什么", "mn": {"label": "需要的基础", "links": [{"k": "concept-n-generalizable"}, {"k": "concept-n-3dgs"}, {"k": "concept-g-sfm"}, {"k": "concept-g-pinhole"}, {"k": "adv-a-ff-3dgs"}, {"k": "adv-a-generalizable-ibr"}]}}, {"b": "p", "t": "先把任务说清楚。这是“稀疏视角、可泛化的新视角合成”（n-generalizable）：训练一个网络，测试时遇到从未见过的场景，只给两张图和相机位姿，一次前向就要输出 3D 表示，不做任何逐场景优化。输出选的是 3D Gaussian Splatting 的高斯（n-3dgs），因为它能用光栅化在毫秒级渲染任意视角。\n\n数据来自两个 YouTube 视频数据集：RealEstate10K（房产漫游，多为室内）和 ACID（沿海岸线的航拍）。每段视频的相机轨迹由 SfM 求出（g-sfm），只确定到一个任意尺度，这一点后面会成为核心问题。训练时从一段视频里挑两帧作为 context，再从它们之间随机挑 4 帧作为 target，用渲染误差训练网络。两帧的间隔以“帧数”计：前 150k 步从 25 帧线性增加到 45 帧，之后固定为 45 帧。\n\n评测用固定索引：RE10K 有 6474 个有效测试场景，每个场景 2 个 context、3 个 target，context 间隔 45–136 帧，中位数 58。论文所说的“宽基线”就是指这种几十帧的间隔，并不是以米为单位的基线。target 全部落在两个 context 之间，所以这是内插任务；观看者走到两台相机连线之外的外推情形没有被评测。\n\n和站内其他论文对照：Quark 用 8 路相机、按目标视角即时生成 LDM，面向 1080p 实时；Ha et al. 用固定阵列和立体深度，强调视频的时间一致性。pixelSplat 的设定最“轻”：两张图、静态场景、256×256，但它输出的是与视角无关的 3D 表示，重建一次之后可以从任意视角快速渲染。这是它与 Quark、LVSM 这类“每个视角重跑一次网络”的方法最根本的区别。", "mn": {"label": "类比", "t": "就像给你一副老式立体镜的两张卡片，要你用一堆彩色小颗粒在桌上搭出一个立体模型；搭好之后，别人从任何角度看模型都很快，不用再请你重新搭一遍。"}}, {"b": "eqs", "eqs": [{"tex": "\\mathcal{G}=f_\\theta\\big(\\{(\\mathbf{I}_v,\\mathbf{K}_v,\\mathbf{T}_v)\\}_{v=1}^{2}\\big)=\\{(\\boldsymbol{\\mu}_k,\\Sigma_k,\\mathbf{S}_k,\\alpha_k)\\}_{k=1}^{2\\cdot H W\\cdot 3}", "explain_zh": "任务的形式化（按代码改写）。I_v 是第 v 张输入图（H=W=256），K_v 是归一化内参，T_v 是 camera-to-world 外参；f_θ 是整个编码器；输出 𝒢 是一组高斯，数量等于视角数 × 像素数 × 每像素高斯数（2×65536×3）。μ_k 是均值，Σ_k 是 3×3 协方差，S_k 是球谐系数，α_k 是不透明度。"}, {"tex": "\\min_\\theta\\;\\mathbb{E}_{\\text{scene}}\\Big[\\frac{1}{V_t}\\sum_{t=1}^{V_t}\\big\\|\\mathcal{R}(\\mathcal{G},\\mathbf{K}_t,\\mathbf{T}_t)-\\mathbf{I}_t\\big\\|_2^2+0.05\\,\\mathbb{1}[\\text{step}\\ge 1.5\\times10^5]\\,\\mathrm{LPIPS}\\big(\\mathcal{R}(\\mathcal{G},\\mathbf{K}_t,\\mathbf{T}_t),\\mathbf{I}_t\\big)\\Big]", "explain_zh": "训练目标（按代码 src/loss/ 与 config/loss/ 改写）。ℛ 是 3DGS 光栅化器，V_t=4 是每个样本的目标视角数，I_t 是真实目标图；MSE 权重 1.0，LPIPS（VGG）权重 0.05，且只在第 150,000 步之后计入。整个目标中没有任何深度或几何监督。"}]}, {"b": "p", "t": "分辨率 256×256（代码配置）；context 2 个；训练 target 4 个、评测 3 个；训练 context 间隔 25→45 帧（前 150k 步线性增加）；评测间隔 45–136 帧、中位数 58、均值 66.1（本地统计 RE10K 索引）；RE10K 测试 6474 个有效场景 / 19,422 个目标，ACID 1595 个 / 4,785 个。每个场景 393,216 个高斯。", "label": "具体数字"}, {"b": "p", "t": "两视角是能做三角化的最少输入，也与最强基线 Du et al.（CVPR 2023）的宽基线两视角设定一致，便于直接比较（代码的评测配置中，Du et al. 在 RE10K 和 ACID 上都有结果帧）。选择高斯而不是 NeRF，是为了让渲染足够便宜：训练时能渲染整张目标图，推理时渲染任意视角只需约 2 ms。作者在结论中承认，扩展到很多视角时 epipolar attention 的显存会过高，所以两视角既是任务设定，也是方法本身的约束。", "label": "为什么这样设计"}, {"b": "p", "t": "（1）“宽基线”以帧数定义，不是米；不同视频的相机速度不同，同样 45 帧对应的实际基线差别很大。（2）评测全是内插，而且 RE10K 有 3.0% 的目标帧恰好就是某个输入帧（583/19422）。（3）near/far 不是数据集给的，而是代码按基线推算的（见 ps2）。（4）场景都是静态的，没有人物动作，不能直接外推到临场视频。", "label": "容易误解的地方"}, {"b": "qa", "items": [{"q": "为什么说 pixelSplat 的输出与视角无关？这对双目头显或多名观看者意味着什么？与 Quark 相比有什么不同？", "a": "网络只根据两张输入图预测一组世界坐标系中的高斯，其中不含任何目标视角的信息；目标相机只在光栅化时才用到。因此重建一次之后，每增加一个视角只多一次约 2 ms 的光栅化，双目就是渲染两次。Quark 的 LDM 是在目标视锥里、针对某个目标视角生成的，每个视角（每只眼、每个观看者）都要重跑一遍网络。"}]}, {"b": "sec", "h": "PS2 · 数据预处理与尺度归一：基线缩放为 1，near/far 由 768 px 与 0.5 px 的视差定义", "id": "walk-pixelsplat-ps2", "sn": {"label": "论文位置", "t": "代码 src/dataset/dataset_re10k.py（360×640 检查、make_baseline_1、max_fov、get_bound）；src/dataset/shims/crop_shim.py（rescale_and_crop）；src/dataset/shims/bounds_shim.py（compute_depth_for_disparity）；src/model/encoder/encoder_epipolar.py:get_data_shim；config/dataset/re10k.yaml；config/model/encoder/epipolar.yaml（near_disparity: 3.0）。near/far 的这种取法在论文正文中是否写明未能核对；检索到补充材料里有“near/far 取 0.1 与 10.0、沿用 Du et al.”的表述，上下文不明，与官方代码的做法不同"}}, {"b": "p", "t": "输入：原始 360×640 帧、归一化内参、SfM 外参。输出：256×256 图像；修正后的内参（归一化焦距乘以 455/256）；把两个 context 光心距离缩放为 1 的外参；每个样本的 near、far（形状 B×V）。", "label": "这一步做什么", "mn": {"label": "需要的基础", "links": [{"k": "concept-g-pinhole"}, {"k": "concept-g-depth"}, {"k": "concept-g-sfm"}, {"k": "concept-f-image"}]}}, {"b": "p", "t": "这一步在论文里几乎一笔带过，但它决定了后面所有数值的单位，值得细看。\n\n图像：原始帧先用 LANCZOS 缩放到 256×455（短边 256），再中心裁剪成 256×256，两侧共裁掉约 44% 的宽度。内参按宽高归一化，裁剪后宽变窄，所以归一化焦距要乘以 455/256，主点仍在中心（f-image）。\n\n尺度：代码把两个 context 相机光心之间的距离缩放为 1（make_baseline_1），所有外参的平移除以这个基线。这样，SfM 带来的全局任意尺度被消掉了，后面所有深度都以“基线”为单位（g-sfm）。但要注意，这并没有消除尺度歧义：场景深度与基线的比值仍然因场景而异，房间里的桌子可能是 2 个基线远，窗外的楼可能是 200 个基线远，而单张图无法判断这个比值。这正是 ps4 需要跨视角信息的原因。\n\nnear/far：代码不用固定值，而是问：多深的点，在两台相机之间会产生多大的像素视差？（g-depth）对于基线 B、焦距 f（像素），深度 z 处的视差约为 d = B·f/z。代码令 near 为视差 3×256 = 768 px 时的深度，far 为视差 0.5 px 时的深度，所以 far/near = 1536。换句话说，near/far 圈定的是“两视角之间视差从 768 像素到半个像素”的全部范围，近到几乎贴着相机，远到几乎无穷。后面的深度桶和极线线段都建立在这个范围之上。\n\n另外还有几条过滤规则：基线小于 1e-3 的样本跳过（两帧几乎没动，无法三角化），视场角大于 100° 的样本跳过；训练时以 50% 概率做水平翻转，外参同步镜像；图像边长必须能被 16 整除（4 倍下采样乘以 4×4 的注意力 patch）。", "mn": {"label": "类比", "t": "像给每张地图都换成“以两台相机之间的距离为 1 格”的方格纸：不管原来的地图比例尺是多少，换算之后大家都用同一种格子。但一张地图上的楼到底隔几格，还是得靠两台相机一起看才知道。"}}, {"b": "eqs", "eqs": [{"tex": "\\mathbf{t}_v\\leftarrow\\frac{\\mathbf{t}_v}{\\lVert\\mathbf{c}_1-\\mathbf{c}_2\\rVert_2},\\qquad v=1,\\dots,V", "explain_zh": "基线归一化（dataset_re10k.py:141-152）。t_v 是 camera-to-world 外参的平移部分，c_1、c_2 是两个 context 相机的光心（就是它们的 t）。所有视角（含 target）的平移都除以同一个基线长度，旋转不变。"}, {"tex": "z(d)=\\frac{B\\,\\bar f}{d},\\qquad z_{\\text{near}}=\\frac{B\\bar f}{3\\cdot\\min(H,W)}=\\frac{B\\bar f}{768},\\qquad z_{\\text{far}}=\\frac{B\\bar f}{0.5}=2B\\bar f", "explain_zh": "按代码 bounds_shim.py:9-37 改写。B 是视角间最大光心距离（归一化后为 1）；f̄ 是 x、y 两个方向像素焦距的调和平均（代码先求“深度 1 处一个像素的物理尺寸”1/f_x、1/f_y 的均值，再取倒数）；d 是像素视差。near_disparity=3.0 乘以 min(H,W)=256 得 768 px；far_disparity 固定为 0.5 px。"}, {"tex": "\\frac{z_{\\text{far}}}{z_{\\text{near}}}=\\frac{768}{0.5}=1536", "explain_zh": "near 与 far 之比与场景无关，恒为 1536。后面 32 个深度桶就均匀铺在这个范围的视差上（见 ps7）。"}]}, {"b": "p", "t": "360×640 → 256×455 → 256×256（中心裁剪保留约 56% 的宽度）；near_disparity 3.0×256 = 768 px，far_disparity 0.5 px；基线阈值 1e-3；max_fov 100°；翻转概率 0.5。示例（假设值，不是论文数据）：若裁剪后 f̄ = 256 px，归一化基线 B=1，则 near ≈ 0.33、far = 512（单位为基线）。", "label": "具体数字"}, {"b": "p", "t": "论文没有解释这些具体取值，以下是合理的解读。用视差而不是固定深度定义 near/far，可以让不同尺度、不同焦距的场景共享同一套深度桶和极线采样范围；基线归一化让“深度以基线为单位”，网络学到的数值范围在各场景之间可比。替代方案是数据集给定固定 near/far：MVSplat 的 RE10K 配置就改用 near=1、far=100，并关闭了基线归一化（make_baseline_1: false）。", "label": "为什么这样设计"}, {"b": "p", "t": "（1）near/far 不是场景的真实深度范围，而是一个极宽的搜索区间（far/near = 1536）。（2）代码中的“深度”是沿单位射线方向的距离，不是相机坐标 z；边缘像素两者相差一个 cosθ 因子。（3）基线归一化只消除了全局尺度，没有消除“深度/基线”这个比值的不确定性。（4）中心裁剪丢掉了两侧约 44% 的画面，评测的视场比原视频窄。（5）数据集类里的默认 near=0.1、far=1000（dataset_re10k.py:41-42）只是占位，编码器的 data shim 会用视差定义覆盖它们（encoder_epipolar.py:223-226）；补充材料中“0.1 与 10.0”的说法也不要直接套到官方代码上。", "label": "容易误解的地方"}, {"b": "qa", "items": [{"q": "如果把某个场景的 SfM 结果整体放大 10 倍（所有相机平移乘 10），经过这一步后网络看到的输入有什么变化？这说明尺度问题解决了吗？", "a": "没有任何变化：基线从 L 变成 10L，归一化后仍为 1，外参完全相同，near/far 也按同一基线推出，所以相同。这说明 SfM 的全局尺度被消掉了，但问题没有完全解决：场景里物体离相机是 2 个基线还是 200 个基线，仍然只能靠两张图之间的视差来判断。单张图的网络依然无从知道，所以后面需要 epipolar transformer。"}]}, {"b": "sec", "h": "PS3 · 逐图像编码：DINO ResNet-50 与 ViT-B/8 的特征相加，得到每像素 128 维", "id": "walk-pixelsplat-ps3", "sn": {"label": "论文位置", "t": "论文方法部分（每张参考图经 DINO 预训练的 ResNet-50 与 ViT-B/8，像素级输出相加）；补充材料架构图；代码 src/model/encoder/backbone/backbone_dino.py、backbone_resnet.py；src/model/encoder/encoder_epipolar.py:60-64,122-126；config/model/encoder/backbone/dino.yaml（dino_vitb8，d_out 512）"}}, {"b": "p", "t": "输入：B×2×3×256×256 的图像。输出：B×2×128×256×256 的逐像素特征（中间结果为 512 维）。这一步两张图各自独立处理，没有任何跨视角交互。", "label": "这一步做什么", "mn": {"label": "需要的基础", "links": [{"k": "concept-l-cnn"}, {"k": "concept-l-attention"}, {"k": "concept-f-image"}]}}, {"b": "p", "t": "编码器有两路（l-cnn、l-attention），都用 DINO 自监督预训练的权重（torch.hub 从 facebookresearch/dino 加载）。\n\nResNet-50 这一路：图像经 conv1（步长 2，得到 128×128）和 layer1–layer3。代码没有用最大池化，所以 layer1 仍为 128×128，layer2 为 64×64，layer3 为 32×32。四个输出各用一个 1×1 卷积投到 512 维，全部双线性上采样到 256×256 后相加。浅层保留边缘和纹理，深层提供更大的感受野。\n\nViT-B/8 这一路：256×256 的图被切成 32×32 = 1024 个 8×8 的 patch，经 12 层 Transformer 得到 768 维 token。patch token 经两层 MLP 变成 512 维，再原样复制到它所覆盖的 8×8 像素上；CLS token（整张图的全局摘要）经另一个 MLP 后广播到每个像素。\n\n三路相加后得到每像素 512 维，再过 ReLU 和一个线性层压到 128 维，这就是后面所有模块使用的特征宽度 d_feature。\n\n为什么要这么重的骨干？找跨视角对应需要对光照、视角变化稳健的特征，DINO 预训练正好提供这一点；ViT 的全局注意力和 CLS token 让每个像素都能“看到”整张图的语义。代价是参数量：按官方代码逐项统计，ViT-B/8 约 85.8M、ResNet-50（去掉 fc）约 23.5M，投影与 token MLP 约 2.9M，骨干以外的全部模块约 6.74M，camera-ready 结构合计约 119.0M。MVSplat 论文给出的 125.4M 对应原版结构：原版 epipolar transformer 每层多一个两层 7×7 卷积的前馈块（2 层共 6.42M），加回后正好 125.4M。还要注意，ResNet-50 的 layer4（约 15M）随 torch.hub 模型一起加载，但前向只用到 layer3，这部分参数从不起作用。\n\n需要注意的是，ViT 的 token 是直接复制到 8×8 像素块上的，所以这一路特征在空间上是块状的；ResNet 最深的 layer3 也只有 32×32。像素级的精细信息主要来自浅层和后面的 RGB 跳连（ps6）。", "mn": {"label": "类比", "t": "像两位助手分别给一张照片做笔记：一位拿放大镜逐块描边（ResNet，各层分辨率不同），一位站远处写整体印象并给每个 8×8 小格贴标签（ViT）。最后把两份笔记叠在同一张透明纸上，再精简成每个像素 128 个关键词。"}}, {"b": "eqs", "eqs": [{"tex": "\\mathbf{F}^{512}=\\sum_{l=0}^{3}\\mathrm{Up}\\big(W_l^{1\\times1}\\,\\mathbf{R}_l(\\mathbf{I})\\big)+\\mathrm{Rep}_{8\\times8}\\big(\\mathrm{MLP}_{\\text{loc}}(\\mathbf{t}_{1:1024})\\big)+\\mathrm{Bcast}\\big(\\mathrm{MLP}_{\\text{glob}}(\\mathbf{t}_{\\text{CLS}})\\big)", "explain_zh": "按代码 backbone_dino.py 改写。R_l 是 ResNet 的第 l 级输出（l=0 为 conv1，l=1..3 为 layer1–3），W_l 是 1×1 卷积（→512 维），Up 是双线性上采样到 256×256；t_{1:1024} 是 ViT 的 patch token，t_CLS 是分类 token；Rep 表示把每个 token 复制到 8×8 像素，Bcast 表示广播到整张图。"}, {"tex": "\\mathbf{F}=W_p\\,\\mathrm{ReLU}(\\mathbf{F}^{512}),\\qquad W_p\\in\\mathbb{R}^{128\\times512}", "explain_zh": "投影到 d_feature=128 维（encoder_epipolar.py:61-64）。这个线性层加偏置共 65,664 个参数（本地实测）。"}]}, {"b": "p", "t": "ResNet 各级分辨率（256 输入、无 maxpool）：conv1 128×128×64，layer1 128×128×256，layer2 64×64×512，layer3 32×32×1024；ViT-B/8：1024 个 patch token + 1 个 CLS，768 维，12 层；融合后 512 维 → 128 维。参数：ViT-B/8 约 85.8M、ResNet-50 约 23.5M（按结构估算），token MLP 约 1.97M，1×1 投影约 0.95M；camera-ready 结构合计约 119.0M（本导读按代码统计）；MVSplat 论文给出的 125.4M 对应原版结构（多 2 个 ConvFeedForward，共 6.42M）；ResNet layer4 的 14.96M 参数从不参与前向。", "label": "具体数字"}, {"b": "p", "t": "论文强调用 DINO 预训练的两种骨干并把输出相加，但没有给出为什么选这两个的消融。合理的解读是：自监督特征在跨视角匹配上比随机初始化更稳健；CNN 与 ViT 互补，一个提供局部细节，一个提供全局上下文。代码的默认 encoder 配置用的是从头训练的 ResNet-50（使用 InstanceNorm），所有实验配置都改成了 DINO，这说明作者实际使用的是预训练版本。后来的 MVSplat 换成了轻量的 CNN 加 Transformer 骨干，总参数降到 12.0M。", "label": "为什么这样设计"}, {"b": "p", "t": "（1）这一步是“逐图像”的，两张图之间没有任何信息交换，所以还不能确定尺度。（2）ViT token 被复制到 8×8 像素块上，特征是块状的；不要以为 ViT 提供了像素级细节。（3）注意区分 config/model/encoder/epipolar.yaml 里默认的 resnet 骨干和实验配置 override 的 dino 骨干。（4）参数量的大头在骨干；推理时间多半也花在骨干和 epipolar transformer 上，但论文没有给出分项计时，这只是推测。", "label": "容易误解的地方"}, {"b": "qa", "items": [{"q": "既然 ViT 的 patch token 被粗暴地复制到 8×8 像素块上，为什么它仍然有用？", "a": "它提供的不是像素级位置，而是语义和全局上下文：这块是墙、地板还是窗外的天空，整个场景大致是什么结构。这些信息能帮助后面的注意力在弱纹理区域挑选对应点，也能帮助深度分布给出合理的先验。像素级细节由 ResNet 的浅层（128×128）和后面全分辨率的 RGB 跳连补回。"}]}, {"b": "sec", "h": "PS4 · 尺度歧义与极线采样：每条射线在另一视角极线上取 32 个点，并三角化出各自的深度", "id": "walk-pixelsplat-ps4", "sn": {"label": "论文位置", "t": "论文方法部分关于尺度歧义的论述与 epipolar encoder 的描述；代码 src/model/encoder/epipolar/epipolar_sampler.py；src/geometry/epipolar_lines.py（project_rays、lift_to_3d、get_depth）；src/geometry/projection.py（intersect_rays）；src/model/encoder/epipolar/epipolar_transformer.py:89-121；src/model/encodings/positional_encoding.py"}}, {"b": "p", "t": "输入：下采样后的特征 B×2×128×64×64（先经 4×4、步长 4 的卷积）、内外参、near/far。输出：每条射线在另一视角极线上的 32 个样本特征 B×2×1×4096×32×128，以及这些样本三角化深度的编码（先是 20 维正弦编码，经线性层变为 128 维后加到样本特征上）。“1”这一维是“其他视角”，两视角时只有 1 个。", "label": "这一步做什么", "mn": {"label": "需要的基础", "links": [{"k": "concept-g-epipolar"}, {"k": "concept-g-sfm"}, {"k": "concept-g-depth"}, {"k": "concept-d-stereo"}, {"k": "concept-l-encoding"}, {"k": "adv-a-learned-mvs"}]}}, {"b": "p", "t": "先说清楚尺度歧义。SfM 求出的位姿只确定到一个尺度 s：把整个世界和所有相机平移同时放大 s 倍，所有图像都不变（g-sfm）。所以网络如果只看一张图，就算它能判断“桌子在墙前面”，也无法说出桌子离相机是 0.3 还是 3 个单位。而高斯必须放在与位姿一致的尺度上，否则从另一视角渲染时就会错位。ps2 的基线归一化把问题转化为“深度是基线的多少倍”，这个比值依然只能靠两视角之间的视差来判断（g-depth）。\n\n极线几何告诉我们（g-epipolar）：视角 A 中像素 u 的射线投影到视角 B 上，是一条极线；u 的对应点只可能在这条线上。代码的做法是：取射线上 near 处和 far 处的两个点，投影到 B，得到一条线段；如果线段伸出图像边界，就截到边界上（和图像完全不重叠的射线标为无效，样本置零）。然后在这条线段上按图像空间均匀取 32 个点，用双线性插值从 B 的特征图上采样。\n\n每个样本还要知道“如果它就是对应点，那么 u 的深度是多少”。代码对每个样本做一次三角化：把 B 中这个点反投影成一条射线，与 A 的查询射线求最小二乘意义下的最近点，最近点到 A 光心的距离就是这个样本对应的深度 d̃。这个深度截到 [near, far]，换成相对视差（0 表示 near，1 表示 far），再做 10 个 octave 的正弦编码（20 维），经线性层变成 128 维，加到样本特征上（l-encoding）。\n\n注意，这 32 个样本在图像空间是均匀的，对应的深度并不均匀，而且每个像素、每个场景都不一样。所以网络不能靠“第几个样本”来推断深度，必须由深度编码明确告诉它。这就是为什么去掉深度编码会掉约 1 dB：注意力仍然能找到对应，但不知道这个对应意味着多远。\n\n所有这些计算都在 64×64 的下采样特征图上进行，每个视角 4096 条射线，每条射线 32 个样本。这让注意力的开销可以接受，代价是对应点定位只能达到原图约 4 个像素的精度（这是按下采样倍数推出的，论文未讨论）。", "mn": {"label": "类比", "t": "像在两张照片之间“拉一根线”：左图某个点对应的东西，一定在右图的某条斜线上。你沿着这条线等距插 32 根针，每根针上都贴一张小纸条，写着“如果对应点是我，那它离左相机有多远”。"}}, {"b": "eqs", "eqs": [{"tex": "\\mathbf{x}_s=\\mathbf{x}_{\\text{near}}+\\frac{s+0.5}{32}\\,(\\mathbf{x}_{\\text{far}}-\\mathbf{x}_{\\text{near}}),\\quad \\mathbf{x}_{\\text{near}}=\\pi_B(\\mathbf{o}_A+t_{\\text{near}}\\hat{\\mathbf{d}}_u),\\;\\mathbf{x}_{\\text{far}}=\\pi_B(\\mathbf{o}_A+t_{\\text{far}}\\hat{\\mathbf{d}}_u)", "explain_zh": "极线采样（按代码 epipolar_sampler.py:79-88 改写）。o_A 是视角 A 的光心，d̂_u 是像素 u 的单位射线方向，t_near、t_far 是 near/far；π_B 把 3D 点投影到 B 的归一化图像坐标 [0,1]²；s=0..31。若 x_near 或 x_far 落在图像外，就换成射线与图像边界的交点（project_rays 中的四种情况）。"}, {"tex": "\\mathbf{p}^*=\\arg\\min_{\\mathbf{p}}\\sum_{r\\in\\{A,B_s\\}}\\big\\|(\\mathbf{I}-\\hat{\\mathbf{d}}_r\\hat{\\mathbf{d}}_r^{\\top})(\\mathbf{p}-\\mathbf{o}_r)\\big\\|^2,\\qquad \\tilde d_s=\\lVert\\mathbf{p}^*-\\mathbf{o}_A\\rVert", "explain_zh": "两条射线的最小二乘交点（projection.py:intersect_rays）。A 是查询射线，B_s 是从 B 的光心穿过样本点 x_s 的射线；(I − d̂d̂ᵀ)(p − o) 是点 p 到射线的垂直向量，所以 p* 是离两条射线都最近的点。d̃_s 是沿 A 射线的距离。两射线几乎平行时，代码把结果设为无穷远，随后被截到 far。"}, {"tex": "\\rho_s=1-\\frac{1/\\tilde d_s-1/t_{\\text{far}}}{1/t_{\\text{near}}-1/t_{\\text{far}}},\\qquad \\gamma(\\rho)=\\big[\\sin(2\\pi 2^k\\rho),\\;\\cos(2\\pi 2^k\\rho)\\big]_{k=0}^{9}", "explain_zh": "相对视差与位置编码（conversions.py:depth_to_relative_disparity；positional_encoding.py）。ρ=0 对应 near，ρ=1 对应 far；γ 用 10 个 octave、每个 octave 一对 sin/cos，共 20 维，最低频率周期为 1。代码中 cos 是用相位 π/2 的 sin 实现的。之后 Linear(20→128) 把它变成与特征同维，与样本特征相加：s_l = F_B[x_s] + W_e γ(ρ_s)。"}]}, {"b": "p", "t": "下采样 4 倍：256→64，每视角 4096 条射线；每条射线 32 个样本；位置编码 10 个 octave → 20 维 → 128 维（代码配置 epipolar.yaml：num_samples 32、num_octaves 10、downscale 4）。样本张量 B×V×(V−1)×4096×32×128，训练时 B=7、V=2 为 7×2×1×4096×32×128，约 2.35 亿个浮点数（约 0.94 GB，float32，推算）。", "label": "具体数字"}, {"b": "p", "t": "论文的论证是：单张图无法恢复 SfM 尺度，多视角的 epipolar transformer 可以推断出每个场景的尺度；深度的频率编码对 epipolar 层是必要的。选择在图像空间均匀采样（而不是在深度上均匀），保证了极线上每一段都被覆盖到，不会把样本浪费在图像之外；代价是需要显式的深度编码。替代方案有：平面扫描代价体（按深度候选把特征 warp 过来，天然知道每个候选的深度，MVSplat 采用），以及不用几何、让所有 token 做全局注意力（GS-LRM、LVSM 采用）。", "label": "为什么这样设计"}, {"b": "p", "t": "（1）采样在图像空间均匀，对应的深度在每个像素上都不一样，这正是必须加深度编码的原因。（2）极线采样在 64×64 的特征图上进行，定位精度远低于原图像素。（3）两视角不重叠的射线，样本被置零，这些像素只能靠单目线索定深度。（4）三角化深度被截到 [near, far]，而 far/near = 1536，所以截断很少真正起作用，主要处理的是平行射线的数值问题。", "label": "容易误解的地方"}, {"b": "qa", "items": [{"q": "如果去掉深度编码（No Depth Encoding），epipolar attention 仍然能找到对应点，为什么 PSNR 还会掉约 1 dB，而不是完全失败？", "a": "找到对应只回答了“右图中哪个样本和我最像”，要把它变成深度，还需要知道这个样本对应多远。没有深度编码时，网络只能从样本的序号和特征间接猜：样本在图像空间均匀，它对应的深度随像素位置、相机相对位姿和场景而变化，很难猜准，于是深度偏差增大、PSNR 下降。之所以没有完全失败，是因为 near/far 与基线绑定，样本顺序与深度大致单调相关，网络还能利用单目线索和自注意力传播的上下文，得到一个粗略但可用的深度。"}]}, {"b": "sec", "h": "PS5 · Epipolar transformer：2 层“极线交叉注意力 + 逐图自注意力”", "id": "walk-pixelsplat-ps5", "sn": {"label": "论文位置", "t": "论文方法部分的 epipolar attention 公式与图示；补充材料架构图（epipolar attention 重复 2 次，含 image self-attention）；README “Camera-ready Updates”；代码 src/model/encoder/epipolar/epipolar_transformer.py、image_self_attention.py；src/model/transformer/（文件头注明来自 stelzner/srt）；config/model/encoder/epipolar.yaml:25-40"}}, {"b": "p", "t": "输入：query 为本视角的像素特征，展平为 (B·2·4096)×1×128；key/value 为 ps4 的 32 个极线样本（特征加深度编码），(B·2·4096)×32×128。输出：融合了跨视角对应与三角化深度线索的特征 B×2×128×64×64。", "label": "这一步做什么", "mn": {"label": "需要的基础", "links": [{"k": "concept-l-attention"}, {"k": "concept-g-epipolar"}, {"k": "concept-l-encoding"}, {"k": "concept-d-stereo"}, {"k": "concept-d-mvs"}, {"k": "adv-a-learned-mvs"}]}}, {"b": "p", "t": "每一层由两个子块组成（l-attention）。\n\n第一个子块是极线交叉注意力。对视角 A 的每个像素，先做 LayerNorm，再用它当 query，去和它在视角 B 极线上的 32 个样本（key/value）做注意力：4 个头，每头 128 维，softmax 在 32 个样本上进行。直观地看，注意力权重就是“这 32 个候选里哪个最像我的对应点”的软判断（d-stereo、d-mvs）。由于 value 里带着每个样本的三角化深度编码，加权求和的结果中同时混入了“对应点的外观”和“对应点意味着的深度”，相当于一次软的三角化。输出经过输出投影后以残差方式加回本像素特征。论文用注意力权重可视化说明，训练好的模型确实会把权重集中在正确的对应位置上（src/paper/generate_attention_figure.py 生成该图）。\n\n第二个子块本来是 Transformer 的前馈层，这里被换成逐图自注意力：把 64×64 的特征图用 4×4、步长 4 的卷积切成 16×16 = 256 个 token（128 维），加上 10 个 octave 的 2D 位置编码，过一个 2 层、4 头的小 Transformer，再用转置卷积还原到 64×64。它的作用是在同一张图内传播信息：纹理丰富处找到的对应和深度，可以扩散到白墙、天花板这类弱纹理区域。README 说明，camera-ready 版把原来的“自注意力 + 卷积”简化为只用自注意力，并据此重训了全部模型。\n\n两个子块合起来重复 2 次。多于两个视角时，其他视角的极线样本拼在一起作为 key/value，并加上随机置换的视角嵌入。\n\n实现细节：逐图自注意力模块内部自带一次残差，外层又加一次，实际是 SA(LN(x)) + LN(x) + x，复现时要留意。", "mn": {"label": "类比", "t": "像一场“连连看”：左图的每个点拿着自己的特征卡，在右图的一条线上挨个比对 32 张候选卡，按相似度给每张卡打分，然后把候选卡背面写的“距离”按分数加权记下来。比完之后，同一张图里的点再互相通报结果，帮那些自己看不清的点做判断。"}}, {"b": "eqs", "eqs": [{"tex": "\\mathbf{s}_l=\\mathbf{F}_B[\\mathbf{x}_l]+W_e\\,\\gamma(\\rho_l),\\qquad l=1,\\dots,32", "explain_zh": "key/value 的来源（按代码 epipolar_transformer.py:100-121 改写）。F_B[x_l] 是在视角 B 的特征图上双线性采样得到的 128 维特征；γ(ρ_l) 是第 l 个样本三角化深度的 20 维位置编码，W_e 把它映射到 128 维。代码是先线性映射再相加；检索到的论文正文把这一步写成拼接（⊕）。拼接后再做线性投影，与“各自线性映射后相加”都是 [F; γ] 的线性函数，差别只在代码里 key 与 value 共用同一个 W_e（本导读的解读）。"}, {"tex": "\\mathbf{q}=W_Q\\,\\mathrm{LN}(\\mathbf{F}_A[\\mathbf{u}]),\\quad \\mathbf{k}_l=W_K\\mathbf{s}_l,\\quad \\mathbf{v}_l=W_V\\mathbf{s}_l,\\quad \\mathbf{F}_A[\\mathbf{u}]\\leftarrow\\mathbf{F}_A[\\mathbf{u}]+W_O\\sum_{l=1}^{32}\\mathrm{softmax}_l\\!\\Big(\\frac{\\mathbf{q}^{\\top}\\mathbf{k}_l}{\\sqrt{128}}\\Big)\\mathbf{v}_l", "explain_zh": "单头形式的极线交叉注意力（代码为 4 头，每头 128 维，内部总宽 512，W_O 投回 128 维）。LN 是 LayerNorm（pre-norm）；注意 key/value 这一侧在代码里没有做 LayerNorm。softmax 只在同一像素的 32 个样本之间归一化。"}, {"tex": "\\mathbf{F}\\leftarrow\\mathbf{F}+\\mathrm{LN}(\\mathbf{F})+\\mathrm{Up}_{4}\\Big(\\mathrm{TF}_{2\\times}\\big(\\mathrm{Patch}_{4}(\\mathrm{LN}(\\mathbf{F}))+\\mathrm{PE}_{2D}\\big)\\Big)", "explain_zh": "逐图自注意力子块（按代码 epipolar_transformer.py:162-183 与 image_self_attention.py 改写）。Patch_4 是 4×4、步长 4 的卷积加 ReLU，把 64×64 变成 16×16 个 token；PE_2D 是 10 个 octave 的 2D 位置编码经线性层；TF_2× 是 2 层、4 头、MLP 宽 256 的 Transformer；Up_4 是 4×4 转置卷积。中间那一项 LN(F) 来自模块内部的残差。"}]}, {"b": "p", "t": "2 层；交叉注意力 4 头 × 128 维；逐图自注意力：patch 4、256 个 token、d_token 128、2 层、4 头、MLP 256、2D 位置编码 10 个 octave（代码配置）。本地实测 epipolar_transformer 模块 6,638,848 个参数。每层交叉注意力的打分次数：每个样本 2×4096×32 ≈ 26 万个 query–key 对，训练 batch（B=7）约 183 万个；若对两视角 64×64 特征做全局注意力，每个样本就是 (2×4096)² ≈ 6700 万个，多约 256 倍（推算）。", "label": "具体数字"}, {"b": "p", "t": "把注意力限制在极线上，相当于把几何约束直接写进网络结构：搜索空间从整张图的 4096 个位置缩小到 32 个样本，既省算力，又不需要网络自己学会极线几何。逐图自注意力弥补了逐像素匹配缺少上下文的问题。放弃的方案：平面扫描代价体（MVSplat 后来采用，按深度候选比较特征，搜索同样是一维的，但不需要三角化和深度编码）；不带几何约束的全局注意力（GS-LRM、LVSM 采用，需要更大的模型和数据）。论文结论承认，视角一多，极线注意力的显存就会过高。", "label": "为什么这样设计"}, {"b": "p", "t": "（1）极线注意力只在 64×64 的分辨率上进行，不是全分辨率。（2）两视角时每个像素只有 32 个 key，但显存按 V(V−1)×4096×32×128 增长，视角增加时增长很快，README 提示 3 视角就需要大量显存。（3）“自注意力代替前馈层”是 camera-ready 的改动，原始检查点（commit 787a8896）的结构不同。（4）key/value 侧没有 LayerNorm，深度编码与特征直接相加，两者的数值尺度要靠训练自行协调。", "label": "容易误解的地方"}, {"b": "qa", "items": [{"q": "视角 A 中某个像素看到的表面在视角 B 里被前景物体挡住了。此时极线注意力会发生什么？最终的深度分布可能是什么样子？", "a": "B 的极线上没有真正的对应点，注意力可能分散在多个样本上，也可能错误地锁定在遮挡物上，于是 value 中混入了错误的深度编码。网络只能依靠单目线索和逐图自注意力从邻近像素传来的上下文来判断深度，得到的深度分布往往更宽，甚至有多个峰，或者被拉向遮挡物的深度。在 ps9 的采样中，这些像素的 3 个高斯就可能落在不同深度，渲染时表现为漂浮点或边缘模糊。"}]}, {"b": "sec", "h": "PS6 · 上采样与高分辨率跳连：64×64 → 256×256，再加一条直接读 RGB 的 7×7 卷积", "id": "walk-pixelsplat-ps6", "sn": {"label": "论文位置", "t": "代码 src/model/encoder/epipolar/epipolar_transformer.py:66-74,152-157（ConvTranspose2d 与两层 7×7 卷积的残差精修）；src/model/encoder/encoder_epipolar.py:92-95,138-144（high_resolution_skip）。论文正文是否描述了这条跳连，未能核对"}}, {"b": "p", "t": "输入：B×2×128×64×64 的注意力输出，以及原始 RGB B×2×3×256×256。输出：B×2×128×256×256 的逐像素特征，随后展平成 B×2×65536×128，送入深度头（ps7）和高斯参数头（ps10）。", "label": "这一步做什么", "mn": {"label": "需要的基础", "links": [{"k": "concept-l-cnn"}, {"k": "concept-f-image"}]}}, {"b": "p", "t": "epipolar transformer 在 64×64 上工作，而高斯是每个像素一个，所以必须回到 256×256。代码分三步完成（l-cnn、f-image）。\n\n第一步，4×4、步长 4 的转置卷积把 64×64 放大到 256×256。它相当于为 4×4 块中的每个位置学一组线性映射，本身不会凭空产生细节。\n\n第二步，一个残差精修块：7×7 卷积把 128 维升到 256 维，经过 GELU，再用 7×7 卷积降回 128 维，结果加回上一步的输出。它负责抹平转置卷积带来的块状痕迹。\n\n第三步，高分辨率跳连：对原始 RGB 图做一个 7×7 卷积（3→128）加 ReLU，直接加到特征上。这是唯一一条在全分辨率上把原图像素信息送进最终特征的通路。高斯的颜色（球谐）和尺度都是从这些特征解码出来的，所以这条跳连对颜色的锐利程度至关重要（这是合理的解读，论文没有单独消融它）。\n\n有一点容易忽略：ps3 里那组全分辨率的骨干特征（B×2×128×256×256），进入 epipolar transformer 时被 4×4、步长 4 的卷积压成了 64×64，之后并没有再加回来。也就是说，最终特征里的全分辨率信息只来自转置卷积的插值和这条 RGB 跳连；深度分布这类几何信息基本是在 64×64 的层级上决定的。这可以解释为什么 pixelSplat 的深度边缘往往不够锋利。在 No Epipolar Encoder 消融里，骨干特征反而直接以全分辨率进入后面的预测头。", "mn": {"label": "类比", "t": "像先在一张 64×64 的粗网格上把“哪里有多远”规划好，再把网格放大 4 倍铺到原图上，最后拿原图本身当描线纸，把颜色和边缘描回去。"}}, {"b": "eqs", "eqs": [{"tex": "\\mathbf{F}_{256}=\\mathrm{ConvT}_{4\\times4,\\,s4}(\\mathbf{F}_{64}),\\qquad \\mathbf{F}_{256}\\leftarrow\\mathbf{F}_{256}+\\mathrm{Conv}_{7\\times7}^{256\\to128}\\big(\\mathrm{GELU}(\\mathrm{Conv}_{7\\times7}^{128\\to256}(\\mathbf{F}_{256}))\\big)", "explain_zh": "上采样与残差精修（epipolar_transformer.py:67-74,152-157）。ConvT 是转置卷积，s4 表示步长 4；两层 7×7 卷积的 padding 为 3，分辨率不变。"}, {"tex": "\\mathbf{F}=\\mathbf{F}_{256}+\\mathrm{ReLU}\\big(\\mathrm{Conv}_{7\\times7}^{3\\to128}(\\mathbf{I})\\big)", "explain_zh": "高分辨率跳连（encoder_epipolar.py:92-95,138-141）。I 是 256×256 的输入 RGB；这个卷积只有 3×128×49+128 = 18,944 个参数（本地实测），感受野 7×7 像素。"}]}, {"b": "p", "t": "64×64 → 256×256（4 倍）；精修块中间宽 256；跳连 7×7、3→128，参数 18,944；每视角 65,536 个像素特征，每个 128 维。训练时这一步输出 7×2×128×256×256，约 1.17 亿个浮点数（约 0.47 GB，推算）。", "label": "具体数字"}, {"b": "p", "t": "注意力放在 64×64 上，是为了让 query 数从 65,536 降到 4,096（每视角），同时让每条极线在特征图上跨越的像素数适中。代价是几何分辨率下降，于是用 RGB 跳连补回外观细节。替代方案有：在全分辨率上做注意力（开销增加约 16 倍）；U-Net 式的多尺度融合（MVSplat 的深度精修用了 U-Net）；把骨干的全分辨率特征重新加回（代码没有这样做）。", "label": "为什么这样设计"}, {"b": "p", "t": "（1）全分辨率的骨干特征进入 epipolar 分支后没有再加回，最终特征里的高频只来自 RGB 跳连。（2）跳连只有一层 7×7 卷积，它提供的是局部颜色和边缘，不是语义。（3）因为几何在 64×64 上决定，深度边缘常常会“糊”掉一个 4×4 块的宽度，这是合理推测，论文没有定量分析。", "label": "容易误解的地方"}, {"b": "qa", "items": [{"q": "如果去掉 RGB 跳连，最可能先变差的是渲染图的颜色细节还是几何？为什么？", "a": "更可能先损失的是颜色细节。高斯的颜色（球谐的 DC 项）由最终特征解码，没有跳连时，这些特征只能从 64×64 插值上来，颜色会在 4×4 的块内被平均，纹理变糊。几何本来就主要在 64×64 上决定，受影响相对较小；不过尺度和像素内偏移也从同一特征解码，边缘处的几何细节同样会变差。这是推理，论文没有做这个消融。"}]}, {"b": "sec", "h": "PS7 · 沿射线的离散深度分布：32 个视差均匀的桶加上桶内偏移", "id": "walk-pixelsplat-ps7", "sn": {"label": "论文位置", "t": "论文 Algorithm 1（预测深度概率 φ 与偏移 δ；μ = o + (b_z+δ_z)d_u）；代码 src/model/encoder/epipolar/depth_predictor_monocular.py、conversions.py（relative_disparity_to_depth）；config/model/encoder/epipolar.yaml（num_monocular_samples: 32、num_surfaces: 1）"}}, {"b": "p", "t": "输入：每像素 128 维特征 B×2×65536×128。输出：32 个桶上的概率 φ（softmax）和 32 个桶内偏移 δ∈(0,1)（sigmoid），形状均为 B×2×65536×1×32（“1”是 num_surfaces）。", "label": "这一步做什么", "mn": {"label": "需要的基础", "links": [{"k": "concept-g-depth"}, {"k": "concept-f-prob"}, {"k": "concept-i-psv"}, {"k": "concept-d-stereo"}, {"k": "adv-a-learned-mvs"}]}}, {"b": "p", "t": "pixelSplat 不直接预测一个深度，而是预测“这个像素的表面落在各个深度区间的概率”（f-prob）。做法很简单：一个 ReLU 加 Linear 把 128 维特征变成 64 个数，前 32 个经 softmax 成为概率 φ_0…φ_31，后 32 个经 sigmoid 成为每个桶内部的偏移 δ_0…δ_31。\n\n桶怎么排？代码把相对视差 ρ∈[0,1] 均匀分成 32 份：第 z 个桶的深度是 ρ = (z+δ_z)/32 对应的深度，ρ=0 为 near，ρ=1 为 far（g-depth）。视差与深度成反比，所以桶在近处很密、在远处很稀，这符合立体测量的误差特性：视差误差大致恒定，深度误差随距离平方增长。如果改用在深度上均匀的桶，由于 far/near = 1536，第一个桶就要覆盖从 near 到约 49·near 的范围，近处的分辨率会差得无法接受。\n\n桶有多宽？结合 ps2 的 near/far 定义可以推算：32 个桶在“以基线计的像素视差”上从 768 px 均匀排到 0.5 px，每个桶约宽 24 px。如果一个场景的视差只有几十像素，那么绝大部分像素的表面都落在最后几个桶里。这说明两件事：第一，概率分布主要负责粗定位，比如判断是前景还是背景、是近处还是远处；第二，真正决定精细深度的是桶内偏移 δ，而 δ 是直接回归、可导的（本导读按代码推算，论文没有讨论桶宽）。\n\n分布的好处是可以表达“不确定”和“多个可能”：在物体边缘，一个像素可能一半是前景一半是背景；在被遮挡或弱纹理的区域，匹配本身就不确定。这些情况都可以用一个宽的或者多峰的分布来表示，而单一深度值只能取一个折中值，而折中值恰恰落在两个表面之间的空中。\n\n类名叫 DepthPredictorMonocular，但它的输入特征已经过 epipolar transformer，带有跨视角信息，并不是单目深度。", "mn": {"label": "类比", "t": "像天气预报不说“明天 23 度”，而是说“20–22 度的概率 10%、22–24 度 70%、24–26 度 20%”，并且每个区间里再给一个更细的估计。之后按这个概率抽签决定把高斯放在哪。"}}, {"b": "eqs", "eqs": [{"tex": "[\\ell_0,\\dots,\\ell_{31},\\,o_0,\\dots,o_{31}]=W_d\\,\\mathrm{ReLU}(\\mathbf{F}[\\mathbf{u}]),\\qquad \\phi=\\mathrm{softmax}(\\boldsymbol{\\ell}),\\quad \\delta_z=\\sigma(o_z)", "explain_zh": "深度头（depth_predictor_monocular.py:24-56）。F[u] 是像素 u 的 128 维特征，W_d ∈ ℝ^{64×128}（加偏置共 8,256 个参数）；ℓ 是 32 个 logits，φ 是桶上的概率；σ 是 sigmoid，δ_z∈(0,1) 是第 z 个桶内的相对位置。"}, {"tex": "\\rho_z=\\frac{z+\\delta_z}{32},\\qquad t(\\rho)=\\Big[(1-\\rho)\\Big(\\frac{1}{t_{\\text{near}}}-\\frac{1}{t_{\\text{far}}}\\Big)+\\frac{1}{t_{\\text{far}}}\\Big]^{-1}", "explain_zh": "从桶号到深度（conversions.py:relative_disparity_to_depth）。z∈{0,…,31} 是桶号；ρ=0 时 t = t_near，ρ=1 时 t = t_far；1/t 在 ρ 上是线性的，即桶在视差上均匀。t 是沿单位射线的距离，对应 Algorithm 1 中的 b_z+δ_z。"}, {"tex": "\\Delta d_{\\text{bucket}}=\\frac{768-0.5}{32}\\approx 24\\ \\text{px},\\qquad \\text{若按深度均匀：}\\ \\Delta t=\\frac{t_{\\text{far}}-t_{\\text{near}}}{32}\\approx 48\\,t_{\\text{near}}", "explain_zh": "本导读的推算，不是论文公式。左式：以两视角基线诱导的像素视差计，每个桶约宽 24 px。右式：若改为在深度上均匀，第一个桶就会从 t_near 延伸到约 49·t_near，说明视差均匀的必要性。"}]}, {"b": "p", "t": "32 个桶（num_monocular_samples）；num_surfaces 1；头部输出 64 维，参数 8,256（本地实测）；每个桶约宽 24 px 视差（推算）。训练时 φ、δ 张量为 7×2×65536×1×32，各约 2940 万个浮点数。", "label": "具体数字"}, {"b": "p", "t": "离散分布是 ps8、ps9 中“采样 + 用概率当不透明度”的前提：只有先有概率，才能把概率接到不透明度上。在视差上均匀，对应立体测量的误差结构；桶内偏移让深度连续，也让位置可以求导。替代方案：MVSplat 用 128 个深度候选，对 softmax 概率求期望深度（soft-argmin），每像素只放 1 个高斯；DepthSplat 同样用 128 个候选，并加入单目深度先验。它们都放弃了采样。", "label": "为什么这样设计"}, {"b": "p", "t": "（1）桶在视差上均匀，桶号 0 最近、31 最远，别和深度均匀混淆。（2）每个桶都很宽，精细深度靠 δ；δ 是直接回归的，在桶内同样可能有局部极小，只是范围被限制在一个桶里。（3）这里的“深度”是沿单位射线的距离，不是 z。（4）类名里的 Monocular 是历史命名，输入已经带有跨视角信息。", "label": "容易误解的地方"}, {"b": "qa", "items": [{"q": "为什么深度桶要在视差上均匀排列，而不是在深度上均匀排列？请用 far/near = 1536 说明。", "a": "立体匹配的误差大致是恒定的像素视差误差，对应的深度误差随 z² 增长，所以近处需要更细的深度划分，远处可以粗一些，视差均匀正好满足这一点。若在深度上均匀划分 [t_near, 1536·t_near]，每个桶宽约 48·t_near，最近的一个桶就要覆盖 t_near 到约 49·t_near，房间里几乎所有物体都会挤进第一个桶，近处完全没有分辨率。视差均匀时，最近的桶只覆盖很窄的深度范围，最远的桶一直延伸到 far。"}]}, {"b": "sec", "h": "PS8 · 为什么直接回归高斯位置会卡住：局部支撑与局部极小", "id": "walk-pixelsplat-ps8", "sn": {"label": "论文位置", "t": "论文方法部分关于概率预测的动机（为克服稀疏、局部支撑的表示固有的局部极小，预测稠密的 3D 概率分布并从中采样高斯均值）及相应示意图；对照组代码 config/experiment/re10k_ablation_no_probabilistic_sampling.yaml"}}, {"b": "p", "t": "这一步不对应新的网络模块，而是分析动机：如果对每个像素直接回归一个深度、放一个高斯，梯度会怎样表现，为什么会卡在局部极小。它解释了 ps7 为什么要预测分布、ps9 为什么要采样。", "label": "这一步做什么", "mn": {"label": "需要的基础", "links": [{"k": "concept-f-optim"}, {"k": "concept-n-3dgs"}, {"k": "concept-n-nerf"}, {"k": "concept-r-volume"}, {"k": "adv-a-diff-render"}]}}, {"b": "p", "t": "3DGS 的高斯是“局部支撑”的：一个高斯只影响它投影位置附近、约几个标准差范围内的像素（n-3dgs）。这带来一个优化上的麻烦（f-optim）。\n\n设想某个像素的高斯被放在了错误的深度。从目标视角看，它会落在错误的像素位置，比如偏了 10 个像素。损失对它位置的梯度来自它所覆盖的那几个像素：这些像素的颜色与它不符，梯度会告诉它“往旁边挪一点，让颜色更匹配”，或者“把自己变透明”。但真正的位置在 10 个像素之外，那里的误差信号它根本“看不到”。更糟的是，从当前位置移动到正确位置，中途往往要经过其他表面，损失会先上升再下降，梯度下降走不过这座“山”，于是卡在局部极小。\n\n下面的一维玩具例子可以量化这一点：用一个宽度为 σ 的高斯去拟合另一个同样宽度、中心在 μ* 的高斯，损失对中心 μ 的梯度正比于 Δ·exp(−Δ²/4σ²)，其中 Δ = μ − μ*。当 Δ = 10σ 时，指数项约为 1.4×10⁻¹¹，梯度几乎为零。pixelSplat 的高斯在源图上只有 0.1–3 个像素宽（ps10），深度一错，投影偏差很容易达到几个到几十个像素，远超这个范围。\n\n为什么 NeRF 不太受这个问题困扰（n-nerf、r-volume）？因为 NeRF 沿每条射线稠密采样，每个采样点都有密度，都能收到梯度。要把表面“挪”到正确的深度，NeRF 不需要真的移动什么：只要在错误的位置降低密度、在正确的位置提高密度即可，这是一个没有“山”要翻的连续过程。原版 3DGS 靠 SfM 点云初始化（一开始就在正确位置附近）和致密化、剪枝来缓解；前馈场景下，网络必须从零学会放对位置，没有这些手段可用。\n\npixelSplat 的思路正是借鉴 NeRF：在“沿射线的深度”这一维上，把稀疏的单个高斯换成一个稠密的概率分布，让“移动”变成“概率在桶之间重新分配”。横向位置则由像素对齐固定（只允许 ±0.5 像素的偏移），不需要搜索。", "mn": {"label": "类比", "t": "像在一片起伏的丘陵里找最低的山谷，但你只有一根很短的探杆，只能感知脚下一小块地的坡度。如果一开始站错了山坡，你只会滑到身边的小坑里。概率分布的做法相当于同时在很多地方各放一个人，谁那里更低，就把更多的人调过去。"}}, {"b": "eqs", "eqs": [{"tex": "\\frac{\\partial\\mathcal{L}}{\\partial\\boldsymbol{\\mu}}=\\sum_{\\mathbf{x}}\\frac{\\partial\\mathcal{L}}{\\partial C(\\mathbf{x})}\\,\\frac{\\partial C(\\mathbf{x})}{\\partial\\boldsymbol{\\mu}},\\qquad \\frac{\\partial C(\\mathbf{x})}{\\partial\\boldsymbol{\\mu}}\\propto \\alpha\\,e^{-\\frac12(\\mathbf{x}-\\boldsymbol{\\mu}')^{\\top}\\Sigma'^{-1}(\\mathbf{x}-\\boldsymbol{\\mu}')}\\;J^{\\top}\\Sigma'^{-1}(\\mathbf{x}-\\boldsymbol{\\mu}')", "explain_zh": "局部支撑的梯度（示意推导）。C(x) 是像素 x 的渲染颜色，μ 是 3D 均值，μ' 是投影后的 2D 均值，Σ' 是 2D 协方差，J 是投影的雅可比，α 是不透明度。高斯核 e^{−…} 在 |x−μ'| 远大于标准差时趋近于 0，所以只有投影附近的像素对 ∂L/∂μ 有贡献。"}, {"tex": "L(\\Delta)=\\int\\big(g(x-\\mu)-g(x-\\mu^*)\\big)^2dx=2\\sqrt{\\pi}\\,\\sigma\\big(1-e^{-\\Delta^2/4\\sigma^2}\\big),\\qquad \\frac{dL}{d\\Delta}=\\frac{\\sqrt{\\pi}\\,\\Delta}{\\sigma}\\,e^{-\\Delta^2/4\\sigma^2}", "explain_zh": "一维玩具例子（本导读推导）。g(x) = exp(−x²/2σ²)，Δ = μ − μ*。损失随 Δ 增大很快饱和，梯度在 Δ ≈ √2·σ 处最大，此后指数衰减：Δ = 10σ 时 e^{−25} ≈ 1.4×10⁻¹¹，几乎没有信号告诉高斯该往哪里走。"}]}, {"b": "p", "t": "玩具例子：Δ = 2σ 时梯度因子 e^{−1} ≈ 0.37，Δ = 5σ 时 e^{−6.25} ≈ 0.0019，Δ = 10σ 时约 1.4×10⁻¹¹。pixelSplat 的高斯在源图上标准差为 0.1–3 像素（ps10 推算）。对照组配置：num_monocular_samples=1、gaussians_per_pixel=1。论文消融中该变体为 24.62 / 0.828 / 0.171，完整模型为 26.09 / 0.863 / 0.136（检索摘要），论文据此认为概率采样必不可少。", "label": "具体数字"}, {"b": "p", "t": "这是论文的核心洞察之一。替代方案：（1）用真值深度监督，GPS-Gaussian 在合成人体数据上就是这样做的，但真实场景很少有可靠的真值深度；（2）由粗到细或早期用大高斯，扩大梯度的作用范围；（3）对所有候选深度取期望（MVSplat），期望深度同样让每个候选都通过 softmax 权重收到梯度，是另一种“稠密化”，但它输出的是一个平均深度，在边缘处会落到两个表面之间；（4）采样加重参数化（本文）。论文没有逐一比较这些方案。", "label": "为什么这样设计"}, {"b": "p", "t": "（1）局部极小不是前馈 3DGS 独有的问题，逐场景的 3DGS 同样有，只是用 SfM 初始化和致密化掩盖了。（2）概率化只作用在“沿射线的深度”这一维；横向位置由像素对齐决定，只有 ±0.5 像素的偏移。（3）代码里桶内偏移 δ 仍是直接回归，它的梯度同样是局部的，只是被限制在一个桶的范围内。（4）No Probabilistic Sampling 消融并不等于“普通的深度回归网络”：它的深度范围是 [near, far]，不透明度固定为 1。", "label": "容易误解的地方"}, {"b": "qa", "items": [{"q": "为什么 NeRF 的体渲染不太受“局部支撑导致局部极小”这个问题困扰？pixelSplat 从中借鉴了什么？", "a": "NeRF 沿射线在很多深度上都有采样点，每个点的密度都能直接收到梯度。要修正表面位置，不需要把某个东西从 A 移到 B，只需要在 A 处降低密度、在 B 处提高密度，这是一个平滑的重新分配过程。pixelSplat 在深度这一维上借鉴了这个思路：用 32 个桶上的概率代替单一深度，“移动高斯”变成了“把概率质量从错误的桶转移到正确的桶”；再通过采样只实例化少数几个高斯，保留光栅化的高效率。"}]}, {"b": "sec", "h": "PS9 · 重参数化：按分布采样 3 个深度，把被采样桶的概率当作不透明度", "id": "walk-pixelsplat-ps9", "sn": {"label": "论文位置", "t": "论文 Algorithm 1（z ∼ p_φ(z)；α = φ_z）及“受 VAE 启发的重参数化”论述；补充材料（每像素 3 个高斯、α = φ_z/3）；代码 src/model/encoder/epipolar/depth_predictor_monocular.py:58-81、distribution_sampler.py、src/misc/discrete_probability_distribution.py、src/model/encoder/encoder_epipolar.py:97-110,143-173、src/model/model_wrapper.py:108-122,163-168；config/model/encoder/epipolar.yaml（gaussians_per_pixel: 3、opacity_mapping、use_transmittance: false）"}}, {"b": "p", "t": "输入：φ 与 δ（B×2×65536×1×32）。输出：每个像素 3 个采样深度，以及对应的不透明度 α = φ_z / 3，形状为 B×2×65536×1×3。", "label": "这一步做什么", "mn": {"label": "需要的基础", "links": [{"k": "concept-f-prob"}, {"k": "concept-f-optim"}, {"k": "concept-r-alpha"}, {"k": "concept-r-volume"}, {"k": "adv-a-ff-3dgs"}, {"k": "adv-a-diff-render"}]}}, {"b": "p", "t": "这是全文最关键的技巧。先看采样：对每个像素，把 φ 累加成 CDF，生成 3 个 [0,1) 的均匀随机数，用 searchsorted 找到它们落在哪个桶（逆 CDF 采样，有放回），得到 3 个桶号 z⁽¹⁾、z⁽²⁾、z⁽³⁾（f-prob）。每个桶号加上该桶的偏移 δ，换算成深度，就是这个像素 3 个高斯的位置。\n\n问题在于：桶号是离散的，采样操作没有梯度，网络怎么知道该把概率往哪里挪？pixelSplat 的回答是：让被采样的高斯的不透明度等于它所在桶的概率，α = φ_z。于是渲染结果通过 α 依赖于 φ，梯度就能流回去（r-alpha）。\n\n为什么有效？被采到正确深度的高斯恰好盖住正确的像素，增大它的不透明度会让渲染更接近真值，∂L/∂α < 0，梯度推高这个桶的 logit；被采到错误深度的高斯会挡住或弄脏别的像素，∂L/∂α > 0，它所在桶的概率被压低。多次迭代后，概率质量从错误深度流向正确深度，没有任何高斯需要“走”过去，正好绕开 ps8 的局部极小。作者说这受 VAE 重参数化启发；严格说它不是 z = μ + σε 那种路径导数，而是“让被选中者的渲染权重等于它的概率”。\n\n代码里有三个只读正文不易看到的细节。第一，不透明度还要除以每像素高斯数 3。Algorithm 1 只写了 α = φ_z，补充材料才说明要除以 3，目的是让一条射线上 3 个高斯的不透明度之和约为 1。后果是：3 个样本都落在概率为 1 的同一桶时，叠加覆盖率只有 1−(2/3)³ ≈ 0.70，网络要靠两视角的重叠和更大的尺度来补。第二，官方测试也走随机采样（test_step 中 deterministic=False），输出本身是随机的，靠全局种子 111123 复现。第三，deterministic 分支只取概率最大的 1 个桶，却仍除以 3，α 不超过 1/3，渲染偏暗，不能直接当作确定性推理。\n\n代码还保留了两个未启用的选项：概率到不透明度的可调映射（默认为恒等），以及 use_transmittance：把 φ 看成射线在第 z 桶终止的概率，alpha 取 φ_z 除以前面各桶的剩余透射，与体渲染中终止概率和 alpha 的关系一致（r-volume）。", "mn": {"label": "类比", "t": "像一个班级投票决定把一面旗插在哪。每个人按自己的信心抽签，抽到哪里就把旗插在哪，旗的显眼程度等于抽中那个位置的票数。事后看效果：插对了地方的旗被表扬，下次那个位置的票数就多；插错的被批评，票数就少。慢慢地，全班的票都会集中到正确的位置上。"}}, {"b": "eqs", "eqs": [{"tex": "z^{(i)}\\sim\\mathrm{Categorical}(\\phi),\\quad i=1,2,3;\\qquad \\alpha^{(i)}=\\frac{\\phi_{z^{(i)}}}{3},\\qquad t^{(i)}=t\\Big(\\frac{z^{(i)}+\\delta_{z^{(i)}}}{32}\\Big)", "explain_zh": "采样与不透明度（按代码改写）。z⁽ⁱ⁾ 是第 i 个样本的桶号（有放回地抽 3 次），α⁽ⁱ⁾ 是对应高斯的不透明度，t⁽ⁱ⁾ 是深度（t(·) 见 ps7）。论文 Algorithm 1 写的是 α = φ_z；补充材料说明实际使用 α = φ_z/3，对应代码 encoder_epipolar.py:170 除以 gaussians_per_pixel。"}, {"tex": "\\frac{\\partial\\mathcal{L}}{\\partial\\ell_j}=\\sum_{i=1}^{3}\\frac{\\partial\\mathcal{L}}{\\partial\\alpha^{(i)}}\\cdot\\frac{1}{3}\\,\\phi_{z^{(i)}}\\big(\\mathbb{1}[j=z^{(i)}]-\\phi_j\\big)", "explain_zh": "梯度如何回到 logits（本导读推导）。ℓ_j 是第 j 个桶的 logit；∂φ_z/∂ℓ_j = φ_z(𝟙[j=z] − φ_j) 是 softmax 的雅可比。若 ∂L/∂α⁽ⁱ⁾ < 0（这个高斯有用），被采样桶的 logit 上升，其他桶的 logit 按 φ_j 的比例下降；反之亦然。没有被采样到的桶只通过归一化项间接受到影响。深度的连续部分 δ 则通过高斯位置直接收到梯度。"}, {"tex": "1-\\prod_{i=1}^{3}\\big(1-\\alpha^{(i)}\\big)=1-\\Big(1-\\frac{1}{3}\\Big)^3\\approx 0.70\\qquad(\\phi_z=1\\ \\text{且三个样本重合})", "explain_zh": "除以 3 的后果（本导读推算）。三个 α=1/3 的高斯叠在同一位置，按 over 合成，单个视角在高斯中心处的覆盖率约为 0.70，而不是 1。实际渲染中还有两视角高斯的重叠和相邻像素的高斯交叠，覆盖率会更高。"}, {"tex": "\\alpha_z^{\\text{trans}}=\\frac{\\phi_z}{1-\\sum_{j<z}\\phi_j}", "explain_zh": "代码里默认关闭的备选方案（use_transmittance）。把 φ 解释为射线在第 z 个桶终止的概率，由前向后 over 合成时，每个桶的 alpha 应为终止概率除以到达该桶前的剩余透射率。这样合成出的各桶权重正好等于 φ。"}]}, {"b": "p", "t": "每像素 3 个样本（gaussians_per_pixel: 3）；32 个桶；随机初始化时 φ ≈ 1/32，因此 α ≈ 0.01（本地探针实测最大值约 0.02–0.03），场景一开始几乎是透明的；deterministic 分支每像素 1 个高斯，α ≤ 1/3。若把 32 个桶全部实例化为高斯，数量将是 2×65536×32 ≈ 419 万个，约为采样方案的 10.7 倍（推算）。", "label": "具体数字"}, {"b": "p", "t": "论文的理由：采样让每个候选深度都有机会被尝试，重参数化让采样可导，从而绕开局部极小。以下是论文没有讨论、属于合理解读的部分：只采样 3 个而不渲染全部 32 个桶，是在梯度方差与光栅化开销之间取折中。其他可选方案包括 REINFORCE（得分函数估计，方差大）、Gumbel-Softmax（需要调温度）、对所有桶取期望深度（MVSplat 的做法，确定、无噪声，但在边缘处会把高斯放到两个表面之间），以及把全部桶都渲染成高斯（数量增加约 10 倍）。", "label": "为什么这样设计"}, {"b": "p", "t": "（1）桶号本身没有梯度，梯度只经 α 流向 φ；桶内的连续位置则由 δ 直接回归。（2）官方测试也是随机采样，同一输入跑两次，输出的高斯和图像都不同，论文没有报告这种随机性带来的方差。（3）deterministic 分支取 top-1 却仍除以 3，α ≤ 1/3，不能当作确定性推理直接使用；若要确定性结果，至少应改为 top-3 或修正不透明度。（4）Algorithm 1 写 α = φ_z，补充材料和代码都除以 3，只读正文的算法框会漏掉这一点。", "label": "容易误解的地方"}, {"b": "qa", "items": [{"q": "训练初期 φ 接近均匀（每桶约 1/32）。某像素的 3 个高斯分别被采到第 5、17、30 桶，而真实表面在第 30 桶附近。一次梯度更新后，φ 会怎样变化？第 12 桶会受到影响吗？", "a": "第 5、17 桶上的高斯落在错误深度，投影到目标视角的错误位置，会遮挡或弄脏其他像素，∂L/∂α > 0，它们的 logit 下降；第 30 桶上的高斯位置正确，∂L/∂α < 0，logit 上升。于是 φ_30 增大，φ_5、φ_17 减小。第 12 桶没有被采样，没有直接梯度，但 softmax 的雅可比中有 −φ_j 项：第 30 桶的正向推动会让所有其他桶（包括第 12 桶）按比例略微下降，第 5、17 桶的负向推动又会让它们略微上升，净效果很小。下一次采样时，落到第 30 桶的可能性变大了。"}]}, {"b": "sec", "h": "PS10 · 高斯参数预测：均值、协方差（尺度+四元数）、球谐（配置 4 阶、实际渲染 3 阶）与像素内偏移", "id": "walk-pixelsplat-ps10", "sn": {"label": "论文位置", "t": "论文 Algorithm 1（μ = o + (b_z+δ_z)d_u；Σ、S 由像素特征预测）；代码 src/model/encoder/common/gaussian_adapter.py、gaussians.py（build_covariance）、src/misc/sh_rotation.py（rotate_sh）、src/model/encoder/encoder_epipolar.py:85-91,153-173；config/model/encoder/epipolar.yaml（gaussian_scale_min 0.5、gaussian_scale_max 15.0、sh_degree 4）"}}, {"b": "p", "t": "输入：每像素 128 维特征、3 个采样深度与不透明度、相机内外参。输出：N = 2×65536×3 = 393,216 个高斯的均值 B×N×3、世界系协方差 B×N×3×3、球谐 B×N×3×25、不透明度 B×N。", "label": "这一步做什么", "mn": {"label": "需要的基础", "links": [{"k": "concept-n-3dgs"}, {"k": "concept-r-appearance"}, {"k": "concept-f-linalg"}, {"k": "concept-g-pinhole"}, {"k": "adv-a-3dgs-ext"}]}}, {"b": "p", "t": "除了深度头，还有一个 ReLU 加 Linear 的头把 128 维特征映射成 84 维，拆成四部分（n-3dgs）。\n\n（1）像素内偏移，2 维：sigmoid 减 0.5 再乘像素大小，让射线在像素内 ±0.5 像素范围移动。\n\n（2）尺度，3 维：先映射到 0.5 + 14.5·sigmoid，即 [0.5, 15]，再乘以深度和 0.1·(1/f_x + 1/f_y)。深度 t 处一个像素的物理宽度约为 t/f，所以最终标准差约为 0.2×[0.5, 15] = [0.1, 3] 个像素的宽度（本导读推算）。这样设计，网络输出的是“相对于像素的大小”，与深度、焦距无关，便于学习；如果让网络直接输出绝对尺度，数值范围会跨越 far/near = 1536 倍。\n\n（3）旋转，4 维：归一化成单位四元数，与尺度一起构成相机系下的协方差 R S Sᵀ Rᵀ，再用 camera-to-world 的旋转变到世界系（f-linalg）。\n\n（4）颜色，75 维：配置为 4 阶球谐，每个颜色通道 25 个系数（r-appearance）。l 阶系数固定乘以 0.1·0.25^l，即 1 阶乘 0.025、3 阶乘约 0.0016，让模型默认以与视角无关的颜色为主。注意这个系数一直在起作用，并不只是初始化时的偏置。还有一个容易忽略的事实：作者修改版的 diff-gaussian-rasterization 在 computeColorFromSH 里只算到 3 阶（前 16 个系数），前向和反向都不碰第 16–24 号系数，所以 4 阶那 27 个输出通道既不影响渲染也收不到梯度；颜色是 SH 求值加 0.5 后截断为非负，没有 sigmoid。球谐同样在相机系预测，再用 e3nn 的 Wigner-D 矩阵旋转到世界系，这样网络不需要知道相机在世界中的朝向。\n\n均值则来自 ps9 的采样深度：相机光心加上单位射线方向乘以深度（g-pinhole）。同一个像素的 3 个高斯共用这一组尺度系数、旋转和球谐，只有深度和不透明度不同；由于尺度要乘以深度，远处样本的绝对尺度也相应更大。\n\n与站内的 Ha et al. 对照：它认为稠密像素网格上网络预测的高斯参数会趋于常数，因而改用解析参数（各向同性、不透明度 1、覆盖一个像素）；pixelSplat 则预测完整的各向异性协方差和球谐（配置 4 阶，实际渲染 3 阶；详见 FAQ）。", "mn": {"label": "类比", "t": "像给每个像素发一块小橡皮泥：先决定它沿视线放多远（深度），再决定它捏成多大、多扁、朝哪个方向（尺度与四元数），最后给它上色，并允许颜色随观察角度轻微变化（球谐）。"}}, {"b": "eqs", "eqs": [{"tex": "\\boldsymbol{\\mu}=\\mathbf{o}+t\\,\\hat{\\mathbf{d}},\\qquad \\hat{\\mathbf{d}}=\\frac{R_{c2w}\\,K^{-1}[\\,\\mathbf{u}+\\Delta\\mathbf{u},\\,1\\,]^{\\top}}{\\lVert K^{-1}[\\,\\mathbf{u}+\\Delta\\mathbf{u},\\,1\\,]^{\\top}\\rVert},\\qquad \\Delta\\mathbf{u}=\\big(\\sigma(\\mathbf{a}_{xy})-0.5\\big)\\odot\\Big(\\frac{1}{W},\\frac{1}{H}\\Big)", "explain_zh": "均值（gaussian_adapter.py:83-84；encoder_epipolar.py:154-163；projection.py:get_world_rays）。o 是相机光心，t 是采样深度（沿单位射线的距离），u 是归一化像素坐标，Δu 是像素内偏移（最多半个像素），K 是归一化内参，R_c2w 是相机到世界的旋转。"}, {"tex": "\\mathbf{s}=\\big(0.5+14.5\\,\\sigma(\\mathbf{a}_s)\\big)\\cdot t\\cdot 0.1\\Big(\\frac{1}{f_x}+\\frac{1}{f_y}\\Big),\\qquad \\Sigma_{\\text{world}}=R_{c2w}\\,R(\\mathbf{q})\\,\\mathrm{diag}(\\mathbf{s})^2\\,R(\\mathbf{q})^{\\top}R_{c2w}^{\\top}", "explain_zh": "协方差（gaussian_adapter.py:62-80）。a_s 是 3 维原始输出，f_x、f_y 是像素焦距（代码用归一化内参的逆乘以 1/W、1/H 得到 1/f），q 是归一化四元数，R(q) 是对应的旋转矩阵。f_x≈f_y 时 s ≈ (0.1…3)·t/f，即 0.1–3 个像素宽（推算）。"}, {"tex": "\\tilde c_{l}^{m}=c_{l}^{m}\\cdot 0.1\\cdot 0.25^{\\,l}\\ (l\\ge1),\\qquad \\mathbf{S}_{\\text{world}}^{(l)}=D^{(l)}(R_{c2w})\\,\\mathbf{S}_{\\text{cam}}^{(l)},\\quad l=0,\\dots,4", "explain_zh": "球谐（gaussian_adapter.py:40-46,74-75,89；sh_rotation.py）。c_l^m 是网络输出的 l 阶、m 次系数，l=0 的 DC 项不缩放；D^{(l)} 是 l 阶的 Wigner-D 旋转矩阵（(2l+1)×(2l+1)），把相机系的球谐转到世界系。每通道共 (4+1)² = 25 个系数，但光栅化器只用前 16 个（l ≤ 3）；Wigner-D 旋转按阶分块，4 阶系数旋转后仍只在 4 阶内，同样不参与渲染。"}]}, {"b": "p", "t": "输出 84 维 = 2（偏移）+ 3（尺度）+ 4（四元数）+ 75（3×25 个球谐系数）；该线性层 10,836 个参数（本地实测）。尺度系数范围 [0.5, 15]，折合源图约 0.1–3 像素（推算）。球谐配置 4 阶，但渲染只用到 3 阶（每通道 16 个系数，与原版 3DGS 相同），27 个输出通道闲置。每个场景 393,216 个高斯，每个约 86 个 float32 参数，约 135 MB（推算）。", "label": "具体数字"}, {"b": "p", "t": "像素对齐加上以像素宽度为单位的尺度，让网络在不同深度、不同焦距下学到的是同一种“相对大小”。在相机系预测、再旋转到世界系，使网络的输出与相机在世界中的朝向无关。球谐高阶系数的缩放让模型偏向与视角无关的颜色，这在只有两张图时是合理的，因为视角相关效应几乎没有约束。放弃的方案：Ha et al. 的解析参数（各向同性、不透明度 1）；DepthSplat 的做法是把输入像素颜色直接加到 DC 项上，尺度不乘深度。论文没有给出选择 4 阶球谐的理由，而实际渲染只用到 3 阶。", "label": "为什么这样设计"}, {"b": "p", "t": "（1）同一像素的 3 个高斯共享尺度系数、旋转和球谐，只有深度与不透明度不同。（2）球谐的高阶缩放是常驻的，不是初始化技巧。（3）代码返回的 Gaussians.scales 和 rotations 仍在相机系，只用于导出 ply，代码注释承认这里还需要修正；真正参与渲染的是世界系的协方差。（4）两个视角看到同一块表面，会各自生成一套高斯，代码不做融合或去重（作者在局限中承认）。（5）配置里 sh_degree=4 不等于渲染用 4 阶：修改版光栅化器只算到 3 阶。", "label": "容易误解的地方"}, {"b": "qa", "items": [{"q": "为什么尺度要乘以“深度 × 1/f”？如果网络直接输出绝对尺度，会遇到什么问题？", "a": "一个像素在深度 t 处的物理宽度约为 t/f，乘以这个因子后，网络输出的就是“几个像素宽”这种相对量，与场景深度、相机焦距都无关，数值范围固定在 [0.5, 15]，容易学习。如果直接输出绝对尺度，同一个网络要覆盖从 near 到 far（相差 1536 倍）的所有深度，近处的高斯需要极小的值、远处的需要极大的值；sigmoid 这类有界激活很难覆盖这么大的范围，梯度也会在不同深度之间严重失衡。"}]}, {"b": "sec", "h": "PS11 · 渲染与训练：393,216 个高斯一次光栅化；MSE + 0.05·LPIPS；Adam 1.5e-4、300k 步、batch 7", "id": "walk-pixelsplat-ps11", "sn": {"label": "论文位置", "t": "论文实验部分的实现细节（300,000 步、batch 7、约 80 GB 显存；前 150,000 步只用 MSE，之后加入权重 0.05 的 LPIPS）；代码 src/model/decoder/cuda_splatting.py、decoder_splatting_cuda.py；src/loss/loss_mse.py、loss_lpips.py、loss_depth.py；src/model/model_wrapper.py:108-152,488-504；config/main.yaml、config/loss/*.yaml、config/experiment/re10k.yaml、config/experiment/re10k_depth_loss.yaml、config/dataset/view_sampler_dataset_specific_config/bounded_re10k.yaml"}}, {"b": "p", "t": "输入：一个场景的全部高斯（B×393216×…）与 4 个目标相机。输出：4 张 3×256×256 的渲染图和一个标量损失；反向传播更新编码器的全部参数（包括 DINO 骨干）。", "label": "这一步做什么", "mn": {"label": "需要的基础", "links": [{"k": "concept-r-raster"}, {"k": "concept-r-alpha"}, {"k": "concept-l-loss"}, {"k": "concept-n-3dgs"}, {"k": "concept-f-optim"}]}}, {"b": "p", "t": "渲染用的是 3DGS 的可微光栅化器（r-raster），作者在 fork 里做了修改（diff-gaussian-rasterization-modified），可以直接传入 3D 协方差。两个视角的高斯被拼成一个列表，一次性送进去，按深度排序后由前向后做 alpha 合成（r-alpha）。为了避免数值问题，代码先把整个场景按 1/near 缩放，使 near = 1；背景设为黑色。\n\n损失很朴素（l-loss）：渲染图与真值图的均方误差，从第 150,000 步开始再加上权重 0.05 的 LPIPS（VGG 版本）。整个训练过程没有深度监督，也没有任何其他几何损失，几何完全是从“渲染出来的图像要像”这一个信号间接学到的。之所以能用 LPIPS，是因为光栅化能便宜地渲染出整张 256×256 的图；逐射线渲染的方法训练时每批只能采几千条射线，很难使用这种需要整图或大块图像的感知损失。\n\n优化（f-optim）：Adam，学习率 1.5e-4，前 2000 步线性 warm-up，之后保持不变，没有衰减；梯度裁剪 0.5；每 GPU batch 7，每个样本渲染 4 个目标视角，所以每步要渲染 28 张图；共 300,001 步。README 说这需要单卡 80 GB 显存（A100 或 H100）。\n\n训练课程：两个 context 的间隔在前 150k 步从 25 帧线性增加到 45 帧，之后固定为 45 帧。代码配置里 min_gap 等于 max_gap，所以任一时刻的间隔是确定的；README 说明这是为了复现早期 view sampler 的一个 bug（把 min_gap 当 max_gap 用）所造成的原始训练行为。\n\n“Depth Reg.”消融变体：从主模型的检查点继续训练 50k 步（到 350,001 步），额外加入权重 0.25 的深度平滑项。它作用在渲染出的深度图上，取二阶差分，并用真值图像的颜色差分做指数加权（颜色变化大的地方允许深度跳变）。代码把 near/far 取了对数来截断和归一化，深度本身却没有取对数，看起来是实现上的不一致。论文称它为 50,000 步边缘感知 total variation 正则的微调；消融表里它的渲染指标与完整模型基本持平（25.94 dB），MVSplat 论文则称 pixelSplat 需要这一步才能得到合理的几何。", "mn": {"label": "类比", "t": "像教一个学生搭积木：只让他看搭好之后从 4 个角度拍的照片，和标准照片比对着打分，从不直接告诉他每块积木该放多深。前半学期只看像素差，后半学期再加上“看起来像不像”的评分。"}}, {"b": "eqs", "eqs": [{"tex": "C(\\mathbf{x})=\\sum_{i\\in\\mathcal{N}(\\mathbf{x})}\\mathbf{c}_i(\\hat{\\mathbf{v}})\\,\\alpha_i'\\prod_{j<i}(1-\\alpha_j'),\\qquad \\alpha_i'=\\alpha_i\\,e^{-\\frac12(\\mathbf{x}-\\boldsymbol{\\mu}_i')^{\\top}\\Sigma_i'^{-1}(\\mathbf{x}-\\boldsymbol{\\mu}_i')},\\qquad \\Sigma'=JW\\Sigma W^{\\top}J^{\\top}", "explain_zh": "3DGS 光栅化。𝒩(x) 是覆盖像素 x 的高斯，按深度从近到远排序；c_i(v̂) 是由球谐在观察方向 v̂ 上求得的颜色；α_i 是 ps9 的不透明度；μ'、Σ' 是投影到图像上的 2D 均值与协方差，W 是世界到相机的旋转，J 是透视投影的雅可比。背景色为黑。"}, {"tex": "\\mathcal{L}=\\frac{1}{N_{\\text{pix}}}\\sum\\big(\\hat{\\mathbf{C}}-\\mathbf{C}\\big)^2+0.05\\cdot\\mathbb{1}[\\text{step}\\ge150{,}000]\\cdot\\mathrm{LPIPS}_{\\text{VGG}}(\\hat{\\mathbf{C}},\\mathbf{C})", "explain_zh": "训练损失（loss_mse.py、loss_lpips.py；config/loss/mse.yaml、lpips.yaml）。Ĉ 是渲染图，C 是真值；MSE 在全部像素、通道和目标视角上取平均；LPIPS 用 normalize=True 把 [0,1] 的输入换算到 [−1,1]（README 提到早期版本这里用错了范围，现已修复）。"}, {"tex": "g(\\text{step})=\\min\\Big(25+\\Big\\lfloor 20\\cdot\\frac{\\text{step}}{150{,}000}\\Big\\rfloor,\\;45\\Big)", "explain_zh": "context 间隔（帧）的课程（view_sampler_bounded.py:25-27 与 bounded_re10k.yaml）。每一步两个 context 相隔 g 帧，target 从两者之间（含端点）随机抽 4 个。"}]}, {"b": "p", "t": "Adam，lr 1.5e-4，warm-up 2000 步，无衰减；梯度裁剪 0.5；batch 7 × 4 个目标 = 每步渲染 28 张 256×256 图；300,001 步；单卡 80 GB（README）；MSE 权重 1.0，LPIPS 权重 0.05（150k 步后）；Depth Reg. 变体：权重 0.25、颜色梯度系数 12、二阶差分、再训练 50k 步。论文 Table 1 的训练显存为 14.4 GB，这是按单个场景、256×256 条射线统计的，不是 batch 7 的整体占用。", "label": "具体数字"}, {"b": "p", "t": "论文给出的理由是：高斯的实时渲染让可扩展的训练成为可能，也就是每一步都能渲染整张图、使用图像级损失。LPIPS 在后期加入、间隔课程逐步加大，论文没有解释原因，合理的解读是先用 MSE 和小基线让几何稳定下来，再追求感知质量和更难的宽基线。放弃的方案：加入深度监督（真实数据缺少可靠的真值）；从第 0 步就加 LPIPS（MVSplat、DepthSplat 的配置后来都改成这样）；学习率衰减（代码中没有）。", "label": "为什么这样设计"}, {"b": "p", "t": "（1）没有任何几何监督，几何好不好只能从渲染质量间接看出；导出的点云不够干净（pixelSplat 自己的 README 承认 MVSplat 的点云“much cleaner”）。（2）训练时的 target 可能正好是某个 context 帧（min_distance_to_context_views=0），这时模型只需要“复现输入”。（3）Table 1 的“训练显存 14.4 GB”与 README 的“batch 7 需要 80 GB”并不矛盾：前者是单场景、256×256 条射线的口径。（4）两个视角的高斯直接合并，重叠处可能出现双层表面，损失只能间接地通过不透明度去压制它。", "label": "容易误解的地方"}, {"b": "qa", "items": [{"q": "为什么 pixelSplat 能在训练中使用 LPIPS 这种整图感知损失，而 pixelNeRF、GPNR 这类方法通常只能用逐射线的 MSE？", "a": "LPIPS 需要一整张（或一大块）图作为输入，才能在 VGG 特征上比较。pixelSplat 用光栅化一次渲染整张 256×256 的图，代价很低（推理 2 ms，Table 1 中单场景训练显存 14.4 GB）。pixelNeRF、GPNR 每条射线都要做大量查询或注意力，训练时每批只能随机采样少量射线；Table 1 表注说明，若按 256×256 条射线外推，它们的训练显存要数百到数千 GB。零散采样的射线拼不成图像，自然也就用不上 LPIPS。"}]}, {"b": "sec", "h": "PS12 · 评测协议、速度与显存：6474×3 个内插目标，Table 1 与消融怎么读", "id": "walk-pixelsplat-ps12", "sn": {"label": "论文位置", "t": "论文 Table 1（RE10K 与 ACID 上的 PSNR/SSIM/LPIPS、编码与渲染时间、训练与推理显存）、消融表（RE10K）；代码 assets/evaluation_index_re10k.json、assets/evaluation_index_acid.json；config/generate_evaluation_index.yaml；src/evaluation/evaluation_index_generator.py、metrics.py、metric_computer.py；src/misc/benchmarker.py；src/paper/generate_benchmark_table.py、generate_comparison_table.py；config/evaluation/re10k.yaml、acid.yaml、ablation.yaml"}}, {"b": "p", "t": "输入：测试集场景、固定的评测索引（每个场景 2 个 context、3 个 target）、各方法预先渲染好的帧（基线结果按目录读取）。输出：PSNR/SSIM/LPIPS 的平均值、编码时间、单视角渲染时间、峰值显存。", "label": "这一步做什么", "mn": {"label": "需要的基础", "links": [{"k": "concept-v-metrics"}, {"k": "concept-n-generalizable"}, {"k": "adv-a-ff-3dgs"}]}}, {"b": "p", "t": "评测索引是离线生成的（v-metrics）：对每个测试场景随机选一帧作第一个 context，向前、向后逐帧移动，计算两帧射线互相投影后落在对方图像内的比例（取较小者）；重叠率在 [0.6, 1.0]、间隔在 45–135 帧内的帧才能作第二个 context；再从两者之间（含端点）随机抽 3 个不重复的 target。\n\n本地统计官方索引：RE10K 有 6474 个有效场景、19,422 个 target，context 间隔 45–136 帧（中位数 58）；ACID 有 1595 个有效场景、4,785 个 target。所有 target 都在两个 context 之间，相对位置均值约 0.50；由于抽样区间含端点，RE10K 有 583 个 target（3.0%）就是 context 帧本身，ACID 有 135 个（2.8%）。\n\n指标实现（metrics.py）：PSNR 先把图像截到 [0,1] 再算；SSIM 用 skimage，窗口 11、高斯加权；LPIPS 用 VGG 版本。基线方法（Du et al.、GPNR、pixelNeRF）的结果以预先渲染好的帧存放在目录中，由同一个脚本统一计算指标。\n\n速度和显存（benchmarker.py）：编码、解码分别用 time.time() 计时，解码时间除以目标视角数；显存取整个测试过程的分配峰值，含模型权重。代码没有显式的 cuda synchronize，论文计时所用的 GPU 型号未能核对。\n\n读 Table 1 时要分清两种速度口径：“快约 650 倍”只比单视角渲染（1.309 s 对 0.002 s）；若每次只合成一张图，把编码也算上，优势约为 13 倍。具体数字见 numbers_zh 与“如何读实验”。\n\n这份评测索引后来被 MVSplat、DepthSplat、FreeSplat、LVSM 原样沿用（本地 md5 一致），所以它的内插偏向和那 3% 的重复帧，也一并进入了后续论文的比较中。", "mn": {"label": "类比", "t": "像一场只考“两个已知点之间的插值”的考试，而且有 3% 的题目直接把答案印在题干里。分数可以用来比较考生之间的相对水平，但不能说明他们在“走出已知范围”时的表现。"}}, {"b": "eqs", "eqs": [{"tex": "\\min\\big(o_{A\\to B},\\,o_{B\\to A}\\big)\\in[0.6,\\,1.0],\\qquad 45\\le|i_A-i_B|\\lesssim 135,\\qquad i_t\\in[\\min(i_A,i_B),\\,\\max(i_A,i_B)]", "explain_zh": "评测索引的选择规则（config/generate_evaluation_index.yaml；evaluation_index_generator.py）。o_{A→B} 是 A 的全部像素射线投影后落在 B 图像内的比例；i 是帧号。代码在判断是否超出最大间隔之前已经把当前帧加入候选，所以实际最大间隔是 136。target 从闭区间中抽取，因此可能与 context 重合。"}, {"tex": "\\mathrm{PSNR}=-10\\log_{10}\\Big(\\frac{1}{3HW}\\sum\\big(\\mathrm{clip}(\\hat{\\mathbf{C}})-\\mathbf{C}\\big)^2\\Big),\\qquad \\Delta\\mathrm{PSNR}=1.11\\ \\text{dB}\\;\\Rightarrow\\;\\frac{\\mathrm{MSE}_{\\text{ours}}}{\\mathrm{MSE}_{\\text{Du}}}=10^{-0.111}\\approx0.77", "explain_zh": "PSNR 的实现（metrics.py:compute_psnr），以及把 dB 差换算成 MSE 比例：25.89 − 24.78 = 1.11 dB，意味着均方误差约降为 Du et al. 的 0.77 倍。"}, {"tex": "\\frac{t_{\\text{render}}^{\\text{Du}}}{t_{\\text{render}}^{\\text{ours}}}\\approx\\frac{1.3}{0.002}\\approx650,\\qquad \\frac{t_{\\text{enc}}^{\\text{Du}}+t_{\\text{render}}^{\\text{Du}}}{t_{\\text{enc}}^{\\text{ours}}+t_{\\text{render}}^{\\text{ours}}}\\approx\\frac{0.016+1.309}{0.102+0.002}\\approx13", "explain_zh": "两种速度比较口径（Table 1 数字，本导读计算）。只比渲染约为 650 倍（论文所说的“2.5 个数量级”）；把单张图的编码时间也算进去，约为 13 倍。前者适用于“重建一次、渲染很多视角”的场景，后者适用于“每帧重建、只渲染一个视角”的场景。"}]}, {"b": "p", "t": "RE10K：7194 个场景 / 6474 个有效 / 19,422 个 target；间隔 45–136，中位数 58，均值 66.1；重复帧 583 个（3.0%）。ACID：1848 / 1595 / 4,785；间隔中位数 66，均值 74.3；重复帧 135 个（2.8%）（均为本地统计）。arXiv 初版 Table 1：25.89/0.858/0.142（RE10K）、28.14/0.839/0.150（ACID）；编码 0.102 s、渲染 0.002 s、推理 3.002 GB、训练 14.4 GB。camera-ready：26.09/0.863/0.136、28.27/0.843/0.146（README）。", "label": "具体数字"}, {"b": "p", "t": "固定索引保证了不同方法在完全相同的输入和目标上比较，重叠率阈值保证目标视角大体可以由两张输入图推断，避免考察生成能力。这是合理的实验设计，但它把问题限定在内插上。论文没有设计外推视角、不同基线或不同重叠率下的分组评测。", "label": "为什么这样设计"}, {"b": "p", "t": "（1）只测内插，3% 的目标就是输入帧。（2）基线的训练显存（Du et al. 314.3 GB、GPNR 3789.9 GB）是按 256×256 条射线外推的，不是实测。（3）计时没有显式同步，GPU 型号未能核对。（4）当前代码和权重对应 26.09 dB，而不少后续论文的表格仍用原版的 25.89 dB，跨论文比较前要先确认用的是哪一个。（5）测试时随机采样（ps9），报告的是一次抽样的结果，没有给出方差。", "label": "容易误解的地方"}, {"b": "qa", "items": [{"q": "一篇后续论文声称在 RE10K 上“比 pixelSplat 高 0.5 dB”。在接受这个结论之前，你至少应该确认哪三件事？", "a": "第一，它对比的是哪个版本的 pixelSplat：25.89（原版）还是 26.09（camera-ready），两者相差 0.2 dB，已经占了声称提升的一小半。第二，评测条件是否相同：是否使用同一份评测索引（可以比对 md5）、同样的 256×256 中心裁剪，指标实现（SSIM 的窗口、LPIPS 的骨干）是否一致。第三，pixelSplat 的数字是论文里抄来的，还是在相同条件下重新测的；如果是重跑的，要注意 pixelSplat 测试时是随机采样的，不同种子之间会有波动。"}]}, {"b": "sec", "h": "配套文章", "id": "parts"}, {"b": "toc", "groups": [{"items": [{"k": "wpart-pixelsplat-tensor-trace", "t": "pixelSplat · 张量追踪", "en": "", "s": "逐阶段列出 16 个关键张量的形状与含义。"}, {"k": "wpart-pixelsplat-experiments", "t": "pixelSplat · 阅读实验", "en": "", "s": "论文里 8 组实验分别怎么读、真正说明了什么。"}, {"k": "wpart-pixelsplat-tradeoffs", "t": "pixelSplat · 设计权衡", "en": "", "s": "7 个关键设计选择：换来了什么，付出了什么。"}, {"k": "wpart-pixelsplat-faq", "t": "pixelSplat · 常见问题", "en": "", "s": "初读时最常问的 12 个问题。"}, {"k": "wpart-pixelsplat-exercises", "t": "pixelSplat · 练习", "en": "", "s": "6 道由浅入深的动手练习。"}, {"k": "wpart-pixelsplat-glossary", "t": "pixelSplat · 论文术语", "en": "", "s": "读这篇论文会遇到的 29 个术语。"}]}]}], "toc": true, "series": {"prev": {"k": "guide-enerf"}, "next": {"k": "guide-gpsgaussian"}, "up": {"u": "works/walkthrough/index.html", "t": "Walkthrough 目录"}}}}</script>
<script>
(function () {
  "use strict";
  // ================= lib: DOM, text and math helpers shared by every page =================
  // A page script defines rich(text) (inline cross-links); paras() and eqList() call it.
  var DATA;
  try { DATA = JSON.parse(document.getElementById("data").textContent); } catch (e) { DATA = {}; }
  var meta = DATA.meta || {};

  // ---------- DOM helpers: all text goes through textContent; external links are https-only ----------
  function safeUrl(u) { if (typeof u !== "string") return null; var s = u.trim(); return /^https:\/\/[^\s"'<>]+$/i.test(s) ? s : null; }
  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (!Object.prototype.hasOwnProperty.call(attrs, k)) continue;
      var v = attrs[k];
      if (v === null || v === undefined || v === false) continue;
      if (k === "class") n.className = v;
      else if (k === "text") n.textContent = String(v);
      else if (k === "href") { var u = safeUrl(v); if (u) { n.setAttribute("href", u); n.setAttribute("target", "_blank"); n.setAttribute("rel", "noopener noreferrer"); } }
      else if (k.slice(0, 2) === "on" && typeof v === "function") n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, String(v));
    }
    (kids || []).forEach(function (c) { if (c === null || c === undefined || c === false) return; n.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return n;
  }
  var SVGNS = "http://www.w3.org/2000/svg";
  function sv(tag, attrs, kids) {
    var n = document.createElementNS(SVGNS, tag);
    if (attrs) for (var k in attrs) {
      if (!Object.prototype.hasOwnProperty.call(attrs, k)) continue;
      var v = attrs[k];
      if (v === null || v === undefined || v === false) continue;
      if (k === "text") n.textContent = String(v);
      else if (k.slice(0, 2) === "on" && typeof v === "function") n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, String(v));
    }
    (kids || []).forEach(function (c) { if (c) n.appendChild(c); });
    return n;
  }
  function arr(x) { return Array.isArray(x) ? x : []; }
  function str(x) { return typeof x === "string" ? x : (x === null || x === undefined ? "" : String(x)); }
  function paras(text) { return str(text).split(/\n\s*\n/).map(function (t) { return t.trim(); }).filter(Boolean).map(function (t) { return el("p", null, rich(t)); }); }
  function link(title, url) { return safeUrl(url) ? el("a", { href: url, text: title }) : el("span", { text: title }); }
  function ul(items, map) { return el("ul", { class: "plain" }, arr(items).map(function (x) { return el("li", null, [map ? map(x) : str(x)]); })); }
  function fmtCit(n) { n = Number(n); if (!(n >= 0)) return "—"; if (n >= 1000) return (n / 1000).toFixed(n >= 10000 ? 0 : 1) + "k"; return String(n); }

  // ---------- math (MathJax, typeset lazily) ----------
  var mathReady = false, mathQueue = [];
  function mathUsable() { return !!(window.MathJax && typeof window.MathJax.typesetPromise === "function"); }
  function flushMath() { mathReady = true; var q = mathQueue.slice(); mathQueue = []; q.forEach(typeset); }
  window.__atlasMathReady = flushMath;
  // MathJax may finish loading before this script runs (cached/async), so also poll for it.
  var mathPoll = setInterval(function () { if (mathUsable()) { clearInterval(mathPoll); flushMath(); } }, 200);
  setTimeout(function () { clearInterval(mathPoll); }, 30000);
  function typeset(node) {
    if (!node) return;
    if (!mathReady && mathUsable()) mathReady = true;
    if (!mathReady || !mathUsable()) { mathQueue.push(node); return; }
    try { window.MathJax.typesetPromise([node]).catch(function () { /* leave raw TeX visible */ }); } catch (e) { /* leave raw TeX visible */ }
  }
  function eqList(eqs) {
    eqs = arr(eqs).filter(function (q) { return q && str(q.tex).trim(); });
    if (!eqs.length) return null;
    return el("div", { class: "eqs" }, eqs.map(function (q) {
      return el("div", { class: "eq" }, [el("div", { class: "math-block", text: "\\[" + str(q.tex) + "\\]" }), q.explain_zh ? el("p", null, rich(q.explain_zh)) : null]);
    }));
  }
  document.addEventListener("toggle", function (e) { var t = e.target; if (t && t.tagName === "DETAILS" && t.open) typeset(t); }, true);

  // ================= frame (Tufte site): links, notes, hover previews, top bar, theme =================
  var SITE = DATA.site || {};
  var ROOT = str(SITE.root);
  var XREF = DATA.xref || {};
  function hasX(key) { return Object.prototype.hasOwnProperty.call(XREF, key); }
  // Custom page parts (search tools, diagrams, charts) register here; blocks.js calls them for {"b": "slot"} blocks.
  var SLOTS = {};

  // ---------- internal links: urls are relative to the site root; pages sit at different depths ----------
  var SAFE_PATH = /^[A-Za-z0-9][A-Za-z0-9._\/-]*(\?[A-Za-z0-9=&._-]+)?(#[A-Za-z0-9._-]+)?$/;
  function relHref(u) {
    u = str(u);
    if (/^#[A-Za-z0-9._-]+$/.test(u)) return u;
    if (!SAFE_PATH.test(u)) return null;
    var cut = u.indexOf("#"), path = cut < 0 ? u : u.slice(0, cut);
    if (path === SITE.path) return cut < 0 ? "#" : u.slice(cut);
    return ROOT + u;
  }
  function pageLink(u, text, cls) {
    var h = relHref(u);
    if (!h) return el("span", { class: cls || null, text: text });
    var a = el("a", { class: cls || null, text: text });
    a.setAttribute("href", h);
    return a;
  }
  // A link to a known entry (concept, topic, paper, step...). data-xref drives the hover preview.
  function xlink(key, text, cls) {
    if (!hasX(key)) return text ? document.createTextNode(text) : null;
    var x = XREF[key], a = pageLink(x.u, text || x.n || x.t, cls);
    a.setAttribute("data-xref", key);
    return a;
  }

  // Concept / topic ids mentioned in prose ("见 g-pinhole") become links labelled with the entry's short name.
  var ID_RE = /(a-[a-z0-9]+(?:-[a-z0-9]+)*|[fgdrilnv]-[a-z0-9]+)/g;
  var CJK = /[　-〿㐀-鿿＀-￯]/;
  function rich(text) {
    var s = str(text), out = [], last = 0, m;
    ID_RE.lastIndex = 0;
    while ((m = ID_RE.exec(s)) !== null) {
      var id = m[1], prev = m.index > 0 ? s.charAt(m.index - 1) : "", next = s.charAt(m.index + id.length);
      var key = hasX("concept-" + id) ? "concept-" + id : (hasX("adv-" + id) ? "adv-" + id : null);
      if (!key || /[A-Za-z0-9_\-]/.test(prev) || /[A-Za-z0-9_]/.test(next)) continue;
      // The prose spaces ids off from Chinese text; a Chinese label needs no such space.
      var before = s.slice(last, m.index);
      if (/ $/.test(before) && CJK.test(before.charAt(before.length - 2))) before = before.slice(0, -1);
      if (before) out.push(document.createTextNode(before));
      out.push(xlink(key, null, "xref"));
      last = m.index + id.length;
      if (s.charAt(last) === " " && CJK.test(s.charAt(last + 1))) last++;
    }
    if (last < s.length) out.push(document.createTextNode(s.slice(last)));
    return out;
  }
  function lines(text) { return str(text).split(/\n+/).map(function (t) { return t.trim(); }).filter(Boolean).map(function (t) { return el("p", null, rich(t)); }); }

  // ---------- side notes (numbered) and margin notes (unnumbered); on phones they fold behind a toggle ----------
  var noteSeq = 0;
  function sidenote(kids) {
    var id = "sn-" + (++noteSeq);
    return el("span", { class: "note-wrap" }, [
      el("label", { for: id, class: "margin-toggle sidenote-number", "aria-label": "旁注" }),
      el("input", { type: "checkbox", id: id, class: "margin-toggle" }),
      el("span", { class: "sidenote" }, kids)
    ]);
  }
  function marginnote(kids) {

            el("div", { class: "toc-t" }, [part({ k: it.k, u: it.u, t: it.t }), it.en ? el("span", { class: "en", text: it.en }) : null,
              it.meta ? el("span", { class: "toc-meta", text: it.meta }) : null]),
            str(it.s).trim() ? el("p", { class: "toc-s", text: it.s }) : null
          ]);
        })));
      });
      return out;
    }
    function cell(tag, c) { return el(tag, null, c && typeof c === "object" ? [part(c)] : rich(c)); }

    var box = null;
    function cur() { if (!box) { box = el("section"); art.appendChild(box); } return box; }
    function render(b) {
      switch (b.b) {
        case "p": return withNotes(paras(b.t), b);
        case "lines": return withNotes(lines(b.t), b);
        case "h3": return [heading("h3", b)];
        case "note": return [el("p", { class: "note", text: b.t })];
        case "ul": case "ol": return [el(b.b, null, arr(b.items).map(listItem))];
        case "eqs": return [eqList(b.eqs)];
        case "qa": return [el("p", { class: "quiz-h", text: "自测" }), el("ol", { class: "quiz" }, arr(b.items).map(function (q) {
          return el("li", null, [el("p", null, rich(q.q)), el("details", null, [el("summary", { text: "答案" }), el("p", null, rich(q.a))])]);
        }))];
        case "res": return [refsList(arr(b.items).map(function (r) {
          return { left: TY[r.type] || r.type || "", url: r.url, t: r.title, gloss: r.note_zh };
        }))];
        case "refs": return [refsList(arr(b.items), b.cls)];
        case "toc": return tocGroups(b.groups, cur().querySelector("h2") ? "h3" : "h2");
        case "table": return [el("div", { class: "table-wrap" + (b.wide ? " fullwidth" : "") }, [el("table", { class: "booktabs" + (b.cls ? " " + b.cls : "") }, [
          el("thead", null, [el("tr", null, arr(b.head).map(function (h) { return el("th", { text: h }); }))]),
          el("tbody", null, arr(b.rows).map(function (r) { return el("tr", null, arr(r).map(function (c) { return cell("td", c); })); }))
        ])])];
        case "timeline": return [el("ul", { class: "refs timeline" }, arr(b.items).map(function (x) {
          return el("li", null, [el("span", { class: "yr", text: str(x[0]) }), el("div", null, rich(x[1]))]);
        }))];
        case "kv": return [el("table", { class: "kv" }, [el("tbody", null, arr(b.items).map(function (x) {
          return el("tr", null, [el("th", { text: x[0] }), el("td", null, rich(x[1]))]);
        }))])];
        case "mtoc": return [marginToc(b.items)];
        case "slot": return typeof SLOTS[b.name] === "function" ? [SLOTS[b.name](b)] : [];
        default: return [];
      }
    }
    // Long articles: a table of contents at the top of the margin (a folding list on phones).
    function marginToc(items) {
      var d = el("details", { class: "mtoc" }, [el("summary", { text: "本文目录" }), el("ol", null, arr(items).map(function (x) { return el("li", null, [part(x)]); }))]);
      var wide = window.matchMedia("(min-width: 761px)");
      d.open = wide.matches;
      return d;
    }
    arr(PG.body).forEach(function (b) {
      if (b.b === "sec") {
        box = el("section", { id: b.id || null });
        if (b.h) box.appendChild(heading("h2", { t: b.h, sn: b.sn }));
        art.appendChild(box);
        return;
      }
      render(b).forEach(function (n) { if (n) cur().appendChild(n); });
    });

    var S = PG.series || {};
    if (S.prev || S.next || S.up) {
      var nav = el("nav", { class: "series", "aria-label": "同系列" });
      nav.appendChild(el("div", { class: "prev" }, S.prev ? [el("small", { text: "上一篇" }), part(S.prev)] : []));
      nav.appendChild(el("div", { class: "up" }, S.up ? [part(S.up)] : []));
      nav.appendChild(el("div", { class: "next" }, S.next ? [el("small", { text: "下一篇" }), part(S.next)] : []));
      art.appendChild(nav);
    }
  })();

  finishPage();
})();
</script>
</body>
</html>
