/* ---------- fonts: ET Book for Latin (self-hosted), Noto Serif SC for Chinese text, LXGW WenKai for notes ---------- */
/* ET Book leaves curly quotes, dashes and ellipses to the Chinese font so they keep full width in Chinese prose,
   and single guillemets (› ‹), which it lacks. */
@font-face { font-family: "et-book"; font-weight: 400; font-style: normal; font-display: swap;
  src: url("../../fonts/et-book/et-book-roman-line-figures.woff") format("woff");
  unicode-range: U+0000-2013, U+2015-2017, U+201A-201B, U+201E-2025, U+2027-2038, U+203B-FFFF; }
@font-face { font-family: "et-book"; font-weight: 400; font-style: italic; font-display: swap;
  src: url("../../fonts/et-book/et-book-display-italic-old-style-figures.woff") format("woff");
  unicode-range: U+0000-2013, U+2015-2017, U+201A-201B, U+201E-2025, U+2027-2038, U+203B-FFFF; }
@font-face { font-family: "et-book"; font-weight: 700; font-style: normal; font-display: swap;
  src: url("../../fonts/et-book/et-book-bold-line-figures.woff") format("woff");
  unicode-range: U+0000-2013, U+2015-2017, U+201A-201B, U+201E-2025, U+2027-2038, U+203B-FFFF; }
/* Notes pair Latin italic with upright Kai (the "italic ↔ 楷体" rule): the italic cut is registered as an upright
   family so the browser never slants the Chinese glyphs. */
@font-face { font-family: "et-book-note"; font-weight: 400; font-style: normal; font-display: swap;
  src: url("../../fonts/et-book/et-book-display-italic-old-style-figures.woff") format("woff");
  unicode-range: U+0000-2013, U+2015-2017, U+201A-201B, U+201E-2025, U+2027-2038, U+203B-FFFF; }
@font-face { font-family: "et-book-osf"; font-weight: 400; font-style: normal; font-display: swap;
  src: url("../../fonts/et-book/et-book-roman-old-style-figures.woff") format("woff"); }

:root {
  --bg: #fffff8;
  --ink: #111111;
  --ink-2: #3c3c36;
  --muted: #74746a;
  --rule: #d8d6c8;
  --rule-2: #b9b6a4;
  --accent: #a8322d;
  --serif: "et-book", "Noto Serif SC", "Source Han Serif SC", "Songti SC", "STSong", "SimSun", Palatino, Georgia, serif;
  --note: "et-book-note", "LXGW WenKai", "Kaiti SC", "STKaiti", "KaiTi", "et-book", serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --side: clamp(12rem, 21vw, 17rem);
  --gap: 2.75rem;
  --main: calc(100% - var(--side) - var(--gap));
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161614; --ink: #e2e0d6; --ink-2: #c3c1b6; --muted: #979589; --rule: #34332e; --rule-2: #4d4b44; --accent: #e8836f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161614; --ink: #e2e0d6; --ink-2: #c3c1b6; --muted: #979589; --rule: #34332e; --rule-2: #4d4b44; --accent: #e8836f;
  color-scheme: dark;
}

/* ---------- base ---------- */
* { box-sizing: border-box; }
html { font-size: 16px; -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--serif); font-size: 1.15625rem; line-height: 1.85;
  font-kerning: normal; font-variant-numeric: lining-nums;
  /* Space between Chinese and Latin text where the source has none; squeeze adjacent CJK punctuation
     (text-spacing-trim applies the fonts' halt / chws features). Browsers without them keep the source spacing. */
  text-autospace: normal; text-spacing-trim: normal;
  overflow-wrap: break-word;
  padding-top: env(safe-area-inset-top, 0px);
}
[hidden] { display: none !important; }
a { color: inherit; text-decoration-line: underline; text-decoration-thickness: 1px; text-underline-offset: .18em; text-decoration-color: var(--rule-2); }
a:hover { color: var(--accent); text-decoration-color: currentColor; }
a:focus-visible, button:focus-visible, summary:focus-visible, label:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }
.skip { position: absolute; left: -999px; top: 0; }
.skip:focus { left: 1rem; top: .5rem; background: var(--bg); padding: .2rem .5rem; z-index: 60; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
p { margin: 0; }
p + p { margin-top: .9em; }

/* ---------- top bar ---------- */
.topbar { border-bottom: 1px solid var(--rule); }
.bar-in { max-width: 67rem; margin: 0 auto; padding: 0 1.5rem; display: flex; align-items: center; gap: 2.2rem; min-height: 3.1rem; }
.brand { font-size: 1rem; text-decoration: none; letter-spacing: .02em; white-space: nowrap; }
.site-nav { flex: 1; }
.menus { list-style: none; margin: 0; padding: 0; display: flex; gap: 1.6rem; }
.menu { position: relative; }
.menu-btn, .theme-btn, .burger {
  font-family: "et-book", var(--serif); font-variant-caps: all-small-caps; letter-spacing: .08em; font-size: 1.12rem;
  color: var(--ink-2); line-height: 3.1rem;
}
.menu-btn:hover, .theme-btn:hover, .burger:hover, .menu.open > .menu-btn { color: var(--accent); }
.menu.cur > .menu-btn { color: var(--ink); box-shadow: inset 0 -1px 0 var(--ink); }
.drop {
  display: none; position: absolute; left: -1rem; top: 100%; z-index: 40; min-width: 13rem;
  list-style: none; margin: 0; padding: .45rem 0; background: var(--bg); border: 1px solid var(--rule);
}
.menu.open > .drop { display: block; }
.drop a { display: block; padding: .15rem 1rem; text-decoration: none; font-size: 1.02rem; color: var(--ink-2); white-space: nowrap; }
.drop a:hover, .drop a:focus-visible { color: var(--accent); }
.drop a.cur { color: var(--ink); }
.drop a.cur::before { content: "›"; position: absolute; margin-left: -.7rem; color: var(--accent); }
.theme-btn { margin-left: auto; }
.burger { display: none; }

/* ---------- article column + margin ---------- */
main { display: block; }
.art { max-width: 67rem; margin: 0 auto; padding: 2.6rem 1.5rem 3rem; counter-reset: sidenote-counter; }
.art > *, .art section > * { width: var(--main); }
.art > section { width: 100%; }
.art .fullwidth { width: 100%; }
section { padding-top: .6rem; }

.crumbs { font-size: .86rem; color: var(--muted); letter-spacing: .01em; }
.crumbs a { color: var(--muted); text-decoration: none; }
.crumbs a:hover { color: var(--accent); }
.crumbs .sep { margin: 0 .45em; color: var(--rule-2); }
h1, h2, h3 { font-family: var(--serif); color: var(--ink); text-wrap: balance; }
h1 { font-size: 2.3rem; font-weight: 400; line-height: 1.3; margin: .9rem 0 0; letter-spacing: .01em; }
.subtitle { font-family: "et-book", var(--note); font-style: italic; font-size: 1.45rem; line-height: 1.3; color: var(--ink-2); margin-top: .35rem; }
.meta { font-size: .92rem; color: var(--muted); margin-top: 1.1rem; }
.meta a { color: var(--muted); }
h2 { font-size: 1.42rem; font-weight: 600; line-height: 1.4; margin: 2.6rem 0 .9rem; }
h3 { font-size: 1.12rem; font-weight: 600; line-height: 1.5; margin: 1.8rem 0 .5rem; }
h3 .used { font-family: var(--note); font-weight: 400; font-size: .86rem; color: var(--muted); margin-left: .6em; }

.epigraph { margin: 2.2rem 0 .6rem; }
.epigraph blockquote { margin: 0; padding: 0 0 0 1.6rem; border-left: 1px solid var(--rule-2); }
.epigraph p { font-family: var(--note); font-size: 1.12rem; line-height: 1.85; color: var(--ink-2); }

.art ol, .art ul { margin: .6rem 0 0; padding-left: 1.6em; }
.art li + li { margin-top: .45rem; }
li::marker { font-family: "et-book-osf", var(--serif); color: var(--muted); }

/* Equations: display math in the text column, scrolling sideways on narrow screens. */
.eqs { display: block; }
.eq + .eq { margin-top: 1.6rem; }
.math-block { overflow-x: auto; overflow-y: hidden; margin: .4rem 0 .6rem; padding: .2rem 0; font-size: 1rem; }
.math-block mjx-container { margin: 0 !important; }

/* ---------- side notes & margin notes (floated into the right margin) ---------- */
.sidenote, .marginnote {
  float: right; clear: right; position: relative;
  width: var(--side); margin-right: calc(-1 * (var(--side) + var(--gap))); margin-top: .3rem; margin-bottom: .6rem;
  font-family: var(--note); font-size: .88rem; line-height: 1.6; color: var(--ink-2); text-align: left;
  font-style: normal; font-weight: 400; letter-spacing: 0;
}
h3 .sidenote { margin-top: .2rem; }
.sidenote-number { counter-increment: sidenote-counter; }
.sidenote-number::after, .sidenote::before { font-family: "et-book-osf", var(--serif); position: relative; vertical-align: baseline; }
.sidenote-number::after { content: counter(sidenote-counter); font-size: .75rem; top: -.55em; left: .08em; color: var(--ink-2); }
.sidenote::before { content: counter(sidenote-counter) " "; font-size: .8rem; top: -.4em; }
.note-label { font-family: var(--serif); font-weight: 600; font-size: .82rem; color: var(--muted); margin-right: .5em; }
.marginnote .note-label { display: block; margin: 0 0 .1rem; }
input.margin-toggle { display: none; }
label.sidenote-number { display: inline; cursor: default; }
label.margin-toggle:not(.sidenote-number) { display: none; }

/* ---------- quiz, further reading, series ---------- */
.quiz details { margin-top: .3rem; }
.quiz summary { font-family: var(--note); font-size: .92rem; color: var(--muted); cursor: pointer; list-style: none; display: inline-block; }
.quiz summary::-webkit-details-marker { display: none; }
.quiz summary::before { content: "+ "; font-family: "et-book", var(--serif); }
.quiz details[open] summary::before { content: "− "; }
.quiz summary:hover { color: var(--accent); }
.quiz details > p { margin-top: .3rem; padding-left: 1rem; border-left: 1px solid var(--rule); color: var(--ink-2); }

/* Reference lists: a narrow label column (kind / year) and a hanging text column. */
.art ul.refs { list-style: none; padding-left: 0; }
.refs li { display: grid; grid-template-columns: 2.8rem minmax(0, 1fr); column-gap: .5rem; line-height: 1.6; }
.refs li > :not(.kind):not(.yr) { grid-column: 2; }
.refs .kind, .refs .yr { grid-column: 1; font-family: var(--note); font-size: .86rem; color: var(--muted); padding-top: .12rem; }
.refs .yr { font-family: "et-book-osf", var(--serif); font-size: .95rem; padding-top: .05rem; }
.refs .en { font-family: "et-book", var(--serif); font-style: italic; color: var(--muted); font-size: .92rem; line-height: 1.5; }
.refs .gloss { font-family: var(--note); font-size: .88rem; color: var(--ink-2); margin-top: .1rem; }
.art .refs li + li { margin-top: .75rem; }
.art .papers li + li { margin-top: .35rem; }
/* Without a label column the list is a plain stack (no grid, so nothing can land in a phantom second column). */
.refs.noleft li { display: block; }
.refs .used { font-family: var(--note); font-size: .82rem; color: var(--muted); margin-left: .5em; }
.refs.terms .plain-t { font-weight: 600; }
.refs.terms .en { display: inline; margin-left: .6em; }
.timeline li { line-height: 1.7; }
.art .timeline li + li { margin-top: .4rem; }

/* ---------- blocks: lede, run-in labels, notes ---------- */
.lede { margin-top: 1.6rem; color: var(--ink-2); }
.run-in { font-weight: 600; color: var(--ink); }
p.note { font-family: var(--note); font-size: .9rem; color: var(--muted); margin-top: .1rem; }
h2 .en, h3 .en { font-family: "et-book", var(--serif); font-style: italic; font-weight: 400; color: var(--muted); margin-left: .6em; font-size: .92em; }
h2 a, h3 a { text-decoration-color: var(--rule); }
.quiz-h { font-family: var(--note); font-size: .88rem; color: var(--muted); margin-top: 1.4rem; }
.quiz-h + ol.quiz { margin-top: .2rem; }

/* Index pages: a table of contents instead of a card grid. */
.art ol.toc { list-style: none; padding-left: 0; margin-top: .4rem; }
.art ol.toc > li + li { margin-top: .85rem; }
.toc-t { line-height: 1.55; }
.toc-t .en { font-family: "et-book", var(--serif); font-style: italic; color: var(--muted); margin-left: .6em; font-size: .95em; }
.toc-meta { font-family: var(--note); font-size: .82rem; color: var(--muted); margin-left: .7em; white-space: nowrap; }
.toc-s { font-family: var(--note); font-size: .9rem; line-height: 1.65; color: var(--ink-2); margin-top: .1rem; }
.toc-lede { font-family: var(--note); color: var(--ink-2); font-size: .95rem; }
h2.toc-h, h3.toc-h { margin-bottom: .3rem; }

/* Tables: booktabs rules (top, under the header, bottom), no vertical lines, no fills. */
.table-wrap { overflow-x: auto; margin: 1rem 0; }
table.booktabs { border-collapse: collapse; width: 100%; font-size: .9rem; line-height: 1.6; border-top: 1.5px solid var(--ink); border-bottom: 1.5px solid var(--ink); }
table.booktabs th { text-align: left; font-weight: 600; padding: .45rem .7rem .35rem 0; border-bottom: 1px solid var(--ink); white-space: nowrap; vertical-align: bottom; }
table.booktabs td { padding: .45rem .9rem .45rem 0; vertical-align: top; border-top: 1px solid var(--rule); }
table.booktabs tbody tr:first-child td { border-top: 0; }
table.rank td { white-space: nowrap; font-variant-numeric: tabular-nums; }
table.rank td:nth-child(2) { white-space: normal; }
.art table.kv { border-collapse: collapse; margin: .6rem 0; font-size: .95rem; width: auto; }
table.kv th { text-align: left; font-weight: 400; color: var(--muted); padding: .25rem 1.2rem .25rem 0; vertical-align: top; min-width: 5em; max-width: 12em; font-family: var(--note); }
table.kv td { padding: .25rem 0; vertical-align: top; }

/* Long articles: the table of contents sits at the top of the margin. */
/* It sits in a full-width section, so it floats into the margin without a negative offset. */
details.mtoc {
  float: right; clear: right; width: var(--side); margin-right: 0; margin-bottom: 1rem;
  font-family: var(--note); font-size: .86rem; line-height: 1.55; color: var(--ink-2);
}
details.mtoc summary { font-family: var(--serif); font-weight: 600; font-size: .82rem; color: var(--muted); list-style: none; cursor: default; }
details.mtoc summary::-webkit-details-marker { display: none; }
.art details.mtoc ol { list-style: none; padding: 0; margin: .3rem 0 0; }
.art details.mtoc li + li { margin-top: .25rem; }
details.mtoc a { text-decoration: none; }
details.mtoc a:hover { text-decoration: underline; }

/* Tools: search and filters with underlined inputs. */
.tool { margin-top: 1rem; }
.filters { display: flex; flex-wrap: wrap; gap: .6rem 1.6rem; align-items: baseline; font-family: var(--note); font-size: .92rem; color: var(--muted); }
.filters label { display: inline-flex; gap: .5rem; align-items: baseline; }
.filters input, .filters select {
  font: inherit; color: var(--ink); background: transparent; border: 0; border-bottom: 1px solid var(--rule-2); border-radius: 0;
  padding: .15rem .1rem; min-width: 7rem;
}
.filters input[type="search"] { min-width: 14rem; }
.filters select { max-width: 16rem; }
.filters input:focus, .filters select:focus { outline: none; border-bottom-color: var(--accent); }
.filters select option { background: var(--bg); color: var(--ink); }
.filters .count { margin-left: auto; font-family: var(--mono); font-size: .8rem; }
table.gl td.en { font-family: "et-book", var(--serif); width: 20%; }
table.gl .abbr { color: var(--muted); }
table.gl td.zh { white-space: nowrap; }
table.gl td.def { color: var(--ink-2); min-width: 20rem; }
table.gl td.c { font-size: .85rem; min-width: 9rem; padding-right: 0; }
table.gl tr:target td { background: color-mix(in srgb, var(--accent) 8%, transparent); }
table.db td.y { font-family: "et-book-osf", var(--serif); white-space: nowrap; }
table.db td.t { min-width: 16rem; }
table.db td.t small { display: block; color: var(--muted); font-size: .8rem; line-height: 1.45; margin-top: .15rem; }
table.db td.tags { min-width: 7rem; font-family: var(--note); font-size: .8rem; color: var(--muted); }
table.db td.tags span { display: block; }
table.db .tier.milestone { color: var(--ink); font-weight: 600; }
table.db td.s { min-width: 18rem; color: var(--ink-2); }
table.db td.n { min-width: 12rem; font-size: .82rem; color: var(--ink-2); }

/* Figures: the pipeline diagram and the timeline of classic papers, drawn in ink with one accent for interaction. */
figure { margin: 1.4rem 0; }
svg a { text-decoration: none; }
.diagram-wrap, .lanes-wrap { position: relative; overflow-x: auto; }
svg.diagram { width: 100%; min-width: 760px; height: auto; display: block; font-family: var(--note); }
svg.diagram .dnode rect { fill: var(--bg); stroke: var(--ink-2); stroke-width: 1; }
svg.diagram .dnode rect.data { stroke-dasharray: 4 3; }
svg.diagram .dnode:hover rect, svg.diagram .dnode:focus rect { stroke: var(--accent); stroke-width: 1.5; }
svg.diagram .dnode:focus { outline: none; }
svg.diagram text { fill: var(--ink); }
svg.diagram text.k { font-family: var(--mono); font-size: 10px; fill: var(--muted); }
svg.diagram text.t { font-family: var(--serif); font-size: 13px; font-weight: 600; }
svg.diagram text.s { font-size: 11px; fill: var(--ink-2); }
svg.diagram .dedge { fill: none; stroke: var(--ink-2); stroke-width: 1; }
svg.diagram .dedge.fb { stroke-dasharray: 4 3; }
svg.diagram .dhead { fill: var(--ink-2); }
svg.diagram .dloop { fill: none; stroke: var(--rule-2); stroke-dasharray: 2 3; }
svg.diagram .dlabel { font-size: 12px; fill: var(--muted); }
svg.diagram .dnote { font-size: 11px; fill: var(--muted); }
svg.diagram a.dnode:hover .dnote { fill: var(--accent); }
svg.lanes { width: 100%; min-width: 720px; height: auto; display: block; font-family: var(--note); }
svg.lanes .grid { stroke: var(--rule); stroke-width: 1; }
svg.lanes .axis { font-family: "et-book-osf", var(--serif); font-size: 12px; fill: var(--muted); }
svg.lanes .lane-l { font-size: 12px; fill: var(--ink-2); }
svg.lanes .brk { stroke: var(--muted); fill: none; }
svg.lanes .hit { fill: transparent; }
svg .dot { fill: var(--ink); }
svg .dot.hollow { fill: var(--bg); stroke: var(--ink-2); stroke-width: 1.2; }
svg.lanes a.m:hover .dot, svg.lanes a.m:focus .dot { fill: var(--accent); stroke: var(--accent); }
svg.lanes a.m:focus { outline: none; }
.vtip { position: absolute; z-index: 20; max-width: 20rem; padding: .45rem .7rem; background: var(--bg); border: 1px solid var(--rule-2); font-family: var(--note); font-size: .82rem; line-height: 1.5; pointer-events: none; }
.vtip b { display: block; font-family: "et-book", var(--serif); font-weight: 400; font-size: .92rem; }
.vtip small { display: block; color: var(--muted); }
.vtip span { color: var(--accent); }
figcaption { font-family: var(--note); font-size: .85rem; color: var(--muted); margin-top: .4rem; }
figcaption svg { vertical-align: -1px; }

.series { display: grid; grid-template-columns: 1fr auto 1fr; gap: 1rem; align-items: end; margin-top: 3.2rem; padding-top: 1rem; border-top: 1px solid var(--rule); font-size: .98rem; }
.series small { display: block; font-family: var(--note); font-size: .8rem; color: var(--muted); }
.series .up { text-align: center; font-size: .88rem; }
.series .up a { color: var(--muted); }
.series .next { text-align: right; }

.site-foot { max-width: 67rem; margin: 0 auto; padding: 1.2rem 1.5rem 2.5rem; font-size: .82rem; color: var(--muted); }
.site-foot a { color: var(--muted); text-decoration: none; }

/* ---------- hover preview ---------- */
.xtip {
  position: absolute; z-index: 50; max-width: min(22rem, calc(100vw - 16px)); padding: .55rem .8rem .6rem;
  background: var(--bg); border: 1px solid var(--rule-2); color: var(--ink);
  font-family: var(--note); font-size: .88rem; line-height: 1.6; pointer-events: none;
}
.xt-m { font-size: .76rem; color: var(--muted); }
.xt-t { font-family: var(--serif); font-weight: 600; font-size: .95rem; line-height: 1.45; margin-top: .1rem; }
.xt-e { font-family: "et-book", var(--serif); font-style: italic; color: var(--ink-2); line-height: 1.4; }
.xt-s { margin-top: .35rem; color: var(--ink-2); }

/* ---------- narrow screens: one column; notes fold behind their number or ⊕ ---------- */
@media (max-width: 760px) {
  body { font-size: 1.0625rem; line-height: 1.8; }
  .bar-in { gap: 1rem; padding: 0 1rem; flex-wrap: wrap; }
  .site-nav { order: 5; flex-basis: 100%; display: none; }
  .topbar.nav-open .site-nav { display: block; }
  .menus { flex-direction: column; gap: 0; padding-bottom: .6rem; }
  .menu-btn { line-height: 2.4rem; width: 100%; text-align: left; }
  .menu-btn::after { content: " +"; }
  .menu.open > .menu-btn::after { content: " −"; }
  .menu.cur > .menu-btn { box-shadow: none; }
  .drop { position: static; border: 0; padding: 0 0 .4rem .9rem; min-width: 0; }
  .drop a { padding: .2rem 0; white-space: normal; }
  .burger { display: inline; }
  .theme-btn { margin-left: auto; }
  .art { padding: 1.6rem 1rem 2.4rem; }
  .art > *, .art section > * { width: 100%; }
  h1 { font-size: 1.85rem; }
  .subtitle { font-size: 1.22rem; }
  .epigraph blockquote { padding-left: 1rem; }
  .epigraph p { font-size: 1.05rem; }
  label.margin-toggle:not(.sidenote-number) { display: inline; cursor: pointer; color: var(--muted); font-family: "et-book", var(--serif); padding: 0 .15em; }
  label.sidenote-number { cursor: pointer; }
  .sidenote, .marginnote { display: none; }
  .margin-toggle:checked + .sidenote, .margin-toggle:checked + .marginnote {
    display: block; float: left; clear: both; width: 100%; margin: .6rem 0; padding-left: .8rem; border-left: 1px solid var(--rule-2);
  }
  .series { grid-template-columns: 1fr 1fr; }
  .series .up { display: none; }
  details.mtoc { float: none; width: 100%; margin: 0 0 1.2rem; padding-left: .8rem; border-left: 1px solid var(--rule-2); }
  details.mtoc summary { cursor: pointer; }
  details.mtoc summary::after { content: " +"; }
  details.mtoc[open] summary::after { content: " −"; }
  .filters { flex-direction: column; align-items: stretch; gap: .5rem; }
  .filters label { justify-content: space-between; }
  .filters input[type="search"], .filters input, .filters select { min-width: 0; flex: 1; }
  .filters .count { margin-left: 0; }
  .toc-meta { display: block; margin-left: 0; }
  table.kv, table.kv tbody, table.kv tr, table.kv th, table.kv td { display: block; max-width: none; }
  table.kv th { padding: .5rem 0 0; }
}
@media print {
  .topbar, .site-foot, .series { display: none; }
}

逐像素深度，就能把一张图“搬”到新视角。", "n": "基于深度的渲染"}, "concept-l-cnn": {"u": "basics/foundations/l-cnn.html", "t": "卷积网络、残差块与 U-Net", "e": "CNNs, residual blocks & U-Net", "m": "Foundations · M6 深度学习基础（3D 视觉视角）", "s": "卷积用共享的小核在图像上滑动，提取局部特征；残差连接让深层网络容易训练；U-Net 用编码器下采样、解码器上采样和同尺度跳连，同时获得大感受野和像素级精度。", "n": "卷积网络、残差块与 U-Net"}, "concept-l-encoding": {"u": "basics/foundations/l-encoding.html", "t": "位置编码、傅里叶特征与射线编码", "e": "Positional encoding, Fourier features & ray encodings", "m": "Foundations · M6 深度学习基础（3D 视觉视角）", "s": "神经网络对低维坐标输入天生偏爱平滑函数，这叫频谱偏置。", "n": "位置编码、傅里叶特征与射线编码"}, "concept-l-iterative": {"u": "basics/foundations/l-iterative.html", "t": "学习式迭代细化与展开优化", "e": "Learned iterative refinement & unrolled optimization", "m": "Foundations · M6 深度学习基础（3D 视觉视角）", "s": "做法是把“渲染当前估计 → 与观测比较 → 更新”这个迭代优化过程，展开成固定的几步，每步的更新量由神经网络给出，整体端到端训练。", "n": "学习式迭代细化与展开优化"}, "concept-l-loss": {"u": "basics/foundations/l-loss.html", "t": "损失函数与训练实践", "e": "Losses & training practice", "m": "Foundations · M6 深度学习基础（3D 视觉视角）", "s": "损失函数决定网络眼中什么是“好图像”：L2 偏向均值（结果偏糊），L1 偏向中位数，SSIM 关注局部结构，LPIPS 用深度特征度量感知差异。", "n": "损失函数与训练实践"}, "concept-n-3dgs": {"u": "basics/foundations/n-3dgs.html", "t": "3D Gaussian Splatting（3D 高斯溅射）", "e": "3D Gaussian Splatting", "m": "Foundations · M7 神经渲染核心", "s": "3DGS 用数百万个带颜色、不透明度和各向异性协方差的 3D 高斯表示场景。", "n": "3D Gaussian Splatting（3D 高斯溅射）"}, "concept-n-generalizable": {"u": "basics/foundations/n-generalizable.html", "t": "可泛化 / 前馈式新视角合成", "e": "Generalizable / feed-forward novel view synthesis", "m": "Foundations · M7 神经渲染核心", "s": "可泛化（前馈式）新视角合成先在大量场景上训练一个网络，推理时只做一次前向：输入几张已标定的邻近视图，直接输出新视角图像，或者输出一个可以渲染的中间表示，全程不做逐场景优化。", "n": "可泛化 / 前馈式新视角合成"}, "concept-r-alpha": {"u": "basics/foundations/r-alpha.html", "t": "Alpha 合成与 over 算子", "e": "Alpha compositing & the over operator", "m": "Foundations · M4 图形学与渲染基础", "s": "alpha 表示一个像素被前景覆盖的比例。", "n": "Alpha 合成与 over 算子"}, "concept-r-appearance": {"u": "basics/foundations/r-appearance.html", "t": "反射模型、视角相关外观与光照", "e": "Reflectance, view-dependent appearance & lighting", "m": "Foundations · M4 图形学与渲染基础", "s": "表面颜色等于入射光乘以材质的反射分布（BRDF），再在半球上积分。", "n": "反射模型、视角相关外观与光照"}, "concept-r-raster": {"u": "basics/foundations/r-raster.html", "t": "光栅化、z-buffer 与点溅射（splatting）", "e": "Rasterization, z-buffer & point splatting", "m": "Foundations · M4 图形学与渲染基础", "s": "光栅化以图元为中心：把三角形或点投到屏幕上，再用 z-buffer 为每个像素保留最近的那个图元。", "n": "光栅化、z-buffer 与点溅射（splatting）"}, "concept-r-raymarch": {"u": "basics/foundations/r-raymarch.html", "t": "光线步进、球面追踪与隐式表面求交", "e": "Ray marching, sphere tracing & implicit surface intersection", "m": "Foundations · M4 图形学与渲染基础", "s": "光线步进就是沿射线一步步查询一个场（密度或符号距离）。", "n": "光线步进、球面追踪与隐式表面求交"}, "concept-r-reps": {"u": "basics/foundations/r-reps.html", "t": "三维表示总览：点、网格、体素、隐式场、高斯", "e": "3D representations: points, meshes, voxels, implicit fields, Gaussians", "m": "Foundations · M4 图形学与渲染基础", "s": "点、网格、体素、隐式场、高斯和分层图像，在存储、渲染、编辑和时间一致性上各有取舍。", "n": "三维表示总览"}, "concept-r-volume": {"u": "basics/foundations/r-volume.html", "t": "体渲染方程与离散化", "e": "The volume rendering equation & its discretization", "m": "Foundations · M4 图形学与渲染基础", "s": "体渲染把场景看成一团既发光又吸收的介质。", "n": "体渲染方程与离散化"}, "concept-v-codec": {"u": "basics/foundations/v-codec.html", "t": "视频编码、传输与延迟预算", "e": "Video coding, transport & latency budgets", "m": "Foundations · M8 视频、时间一致性、评测与系统", "s": "远程临场要在约百毫秒内把多路彩色和深度视频送到对端并渲染出来。", "n": "视频编码、传输与延迟预算"}, "concept-v-metrics": {"u": "basics/foundations/v-metrics.html", "t": "图像与视频质量指标", "e": "Image & video quality metrics", "m": "Foundations · M8 视频、时间一致性、评测与系统", "s": "单帧指标（PSNR、SSIM、LPIPS、FLIP）回答“这一帧像不像真值”；时间与视角指标（warping error、tOF、TCC、STED、SDT/SDV、EPI）回答“误差随时间、随视点是否稳定”。", "n": "图像与视频质量指标"}, "concept-v-temporal": {"u": "basics/foundations/v-temporal.html", "t": "时间一致性、闪烁与时域滤波", "e": "Temporal consistency, flicker & temporal filtering", "m": "Foundations · M8 视频、时间一致性、评测与系统", "s": "逐帧独立预测时，每帧误差互不相关，这些误差会直接表现为闪烁。", "n": "时间一致性、闪烁与时域滤波"}, "wpart-ha-exercises": {"u": "works/walkthrough/ha-exercises.html", "t": "Ha et al. · 练习", "e": "", "m": "Walkthrough · Ha et al.", "s": "6 道由浅入深的动手练习。"}, "wpart-ha-experiments": {"u": "works/walkthrough/ha-experiments.html", "t": "Ha et al. · 阅读实验", "e": "", "m": "Walkthrough · Ha et al.", "s": "论文里 10 组实验分别怎么读、真正说明了什么。"}, "wpart-ha-faq": {"u": "works/walkthrough/ha-faq.html", "t": "Ha et al. · 常见问题", "e": "", "m": "Walkthrough · Ha et al.", "s": "初读时最常问的 11 个问题。"}, "wpart-ha-glossary": {"u": "works/walkthrough/ha-glossary.html", "t": "Ha et al. · 论文术语", "e": "", "m": "Walkthrough · Ha et al.", "s": "读这篇论文会遇到的 31 个术语。"}, "wpart-ha-tensor-trace": {"u": "works/walkthrough/ha-tensor-trace.html", "t": "Ha et al. · 张量追踪", "e": "", "m": "Walkthrough · Ha et al.", "s": "逐阶段列出 15 个关键张量的形状与含义。"}, "wpart-ha-tradeoffs": {"u": "works/walkthrough/ha-tradeoffs.html", "t": "Ha et al. · 设计权衡", "e": "", "m": "Walkthrough · Ha et al.", "s": "7 个关键设计选择：换来了什么，付出了什么。"}}, "page": {"id": "guide-ha", "head": {"title": "Ha et al. 导读", "sub": "Geometry-guided Online 3D Video Synthesis with Multi-View Temporal Consistency", "meta": ["14 步", {"k": "anchor-ha", "t": "Ha et al. 精读"}], "epigraph": "", "prereqs": [], "lede": "", "minutes": 43}, "body": [{"b": "sec", "h": null, "id": "story"}, {"b": "mtoc", "items": [{"u": "#walk-ha-h1", "t": "H1 问题设定：固定、已标定、同步的相机阵列，K 个最近 RGB-D 视角，在线逐帧处理"}, {"u": "#walk-ha-h2", "t": "H2 深度从哪来：RAFT-Stereo（人工选对）或深度传感器"}, {"u": "#walk-ha-h3", "t": "H3 前向渲染：像素大小、各向同性、完全不透明的高斯，逐视角单独 splat，得到 𝓘_k、α_k、𝒟_k"}, {"u": "#walk-ha-h4", "t": "H4 软差分掩码：M = min(|I_t − I_{t−1}|/λ_t + β, 1)，在 1/4 分辨率计算并做 max-pool"}, {"u": "#walk-ha-h5", "t": "H5 静止区域的时间深度滤波（EMA）"}, {"u": "#walk-ha-h6", "t": "H6 基于图像的 TSDF：沿目标射线采样，投影到 K 个视角，求 s_k = z_k − D_k"}, {"u": "#walk-ha-h7", "t": "H7 截断与融合权重（τ = 0.02 m，权重基于 7×7 局部深度方差）"}, {"u": "#walk-ha-h8", "t": "H8 光线步进求零交叉，再用二分细化，得到一致的新视角深度"}, {"u": "#walk-ha-h9", "t": "H9 时间反馈：上一帧新视角深度作为额外的 TSDF 输入（ω_tmp，η = 15）"}, {"u": "#walk-ha-h10", "t": "H10 几何引导混合网络的输入特征（9K+1 个通道）"}, {"u": "#walk-ha-h11", "t": "H11 混合输出：K 个逐像素权重、一个背景权重和一张背景图"}, {"u": "#walk-ha-h12", "t": "H12 损失：0.8·L1 + 0.2·SSIM + 0.1·L_depth + 0.1·L_mask"}, {"u": "#walk-ha-h13", "t": "H13 训练数据、推理加速（TensorRT）与运行时间拆解"}, {"u": "#walk-ha-h14", "t": "H14 如何读实验：PSNR/LPIPS 与 TCC/STED/SDT/SDV、EPI、消融"}]}, {"b": "p", "t": "设想一个固定在厨房里的相机阵列：18 到 22 台相机从前方对着灶台拍摄，有人在里面煎牛排（DyNeRF 数据集的场景）。远端用户戴着头显，想从任意一个没有相机的位置看这段直播，而且要求“边拍边看”，也就是在线、逐帧处理，不能像 NeRF 或 4DGS 那样先把整段视频拿去优化几个小时。已有的实时做法大致分两条路。一条是 Project Starline、Fusion4D 这类“稀疏相机 + 全局几何”，用深度传感器重建一个全局表面，结果稳定、不闪烁，但细节和复杂外观不行，而且基本只能拍人。另一条是 ENeRF、IBRNet、GPS-Gaussian 这类“挑几个最近视角 + 前馈网络”，单帧很锐，但每帧、每个视角独立推理，相机一动画面就跳，时间一长就闪。\n\n作者的核心直觉可以用一句话概括：让一个在视角和时间上都一致的几何代理当“裁判”，由它去约束一个只负责挑选和混合真实像素的网络。单帧画质来自 IBR（直接搬运真实像素），一致性来自全局几何（TSDF）。几何本身相对容易做到一致：相机固定不动，静止区域的深度可以跨帧平均；同一时刻把多个视角的深度融合进同一个 TSDF，渲染出来的目标深度基本不会随视角跳变（严格说只融合了 K 个最近视角，K 集合切换时仍有微小跳变，作者在 Sec. 3.2 承认了这一点，并用上一帧深度回灌来缓解）。颜色很难直接做一致，那就让颜色去跟随几何。\n\n具体做法分三步。第一步，把 K 个最近输入视角的每个像素按深度反投影成一个“像素大小、各向同性、完全不透明”的 3D 高斯，逐视角单独 splat 到目标相机，得到 K 张 warp 后的图像、alpha 和深度。第二步，先用颜色差分掩码对每个输入视角的深度做时间 EMA，再在目标视角的图像空间里做 Starline 式的 image-based TSDF，沿每条目标射线融合 K 个视角的深度，同时把上一帧输出的目标深度当作一个额外输入回灌进去，经 raymarching 得到一张在视角和时间上都一致的目标深度 𝒟^t。第三步，一个 4 层 U-Net 读取这 9K+1 个通道，输出 K 个逐像素混合权重、一个背景权重和一张背景图。训练时加一个 L_Depth，让用同一组权重混合出来的深度去逼近 𝒟^t，于是网络会倾向于挑那些几何上正确的视角。\n\n效果是：在 DyNeRF 和 D3DMV 上，保真度和一致性指标全部最好，例如 DyNeRF PSNR 31.17（ENeRF 29.51），STED 68.76（ENeRF 76.14）；按 Table 4 相加，TensorRT 下每帧约 39 ms。代价和隐患也要看清。第一，立体深度（RAFT-Stereo，在人工挑选的图像对上跑）不计入耗时。第二，在存在同步和颜色标定问题的 ENeRF-Outdoor 上（该数据集和 D3DMV 都不在训练集中），PSNR、SSIM、L1 都输给 ENeRF。第三，消融显示去掉 TSDF 引导后 PSNR 只少 0.01 dB，TSDF 的价值主要体现在 STED（95.42 → 68.76）上（TCC 0.869 → 0.872、LPIPS 0.197 → 0.191 只有小幅改善）。第四，损失函数里没有任何时间项，时间稳定性完全来自输入端的滤波和回灌。第五，方法依赖公制尺度（τ = 0.02 m）以及标定精确、严格同步的阵列。\n\n对新人来说，这篇论文很适合用来把“多视几何、深度融合、alpha 合成、学习式混合、视频一致性评测”这几块基础串成一条完整流水线。每一个模块都能追溯到经典方法（Curless–Levoy / KinectFusion 的 TSDF 及其 Starline 图像空间变体、与 ULR 混合权重同类的几何线索、3DGS 光栅化、EMA 滤波），拼在一起就得到一个能在线运行的 3D 视频系统。读完它，再回头看 Quark 的“单帧高画质、render-and-refine”，就能看清两者分别押注在哪一边：Quark 押单帧画质，Ha et al. 押跨视角和跨时间的一致性。"}, {"b": "sec", "h": "流水线", "id": "pipeline"}, {"b": "p", "t": "点击方框跳到对应步骤。"}, {"b": "slot", "name": "diagram", "which": "ha"}, {"b": "sec", "h": "读之前先掌握", "id": "before"}, {"b": "refs", "items": [{"k": "concept-g-pinhole", "gloss": "全文的每一步都在做“像素 ↔ 3D 点”的转换：h3 用深度把像素反投影成高斯中心，h6 把目标射线上的采样点用 (x,y,z)=K(Rp+t) 投影回 K 个输入视角。不熟悉内参 K、外参 [R|t]、深度 z 的含义，附录 A.1 的 Eq. 9 基本看不懂。"}, {"k": "concept-g-depth", "gloss": "深度来自立体视差 Z=fB/d，误差随 Z² 增长。这决定了为什么需要时间滤波和置信权重，也解释了为什么固定的 τ=0.02 m 对远处背景太紧。论文依赖公制尺度，但 COLMAP 位姿只确定到一个尺度因子，这个矛盾也要在这里理解。"}, {"k": "concept-d-stereo", "gloss": "输入深度 D_n^t 由 RAFT-Stereo 在人工挑选的双目对上估计（Sec. 4、A.5）。要理解双目校正、视差以及逐帧独立估计为什么会闪烁，才能明白 h4/h5 的滤波在修补什么。"}, {"k": "concept-i-warping", "gloss": "Sec. 3.1 本质上是基于深度的前向 warping。空洞（disocclusion）、飞点（flying pixels）和多视角 Z-fighting 都是前向 warping 的典型问题，Fig. 4 和背景图 I_BG 都是为它们设计的。"}, {"k": "concept-r-alpha", "gloss": "前向渲染输出的累积 alpha α_k 和混合公式 Eq. 4–5 都属于 alpha 合成与加权平均。不理解 over 算子和累积透射率，就不明白为什么“完全不透明”的高斯仍然会在边缘产生小数 alpha。"}, {"k": "concept-n-3dgs", "gloss": "论文直接调用原版 3DGS 光栅器（2D 协方差投影、按深度排序、α-blending），只是把高斯参数固定为像素级的解析值。需要知道 3DGS 的高斯参数和光栅化流程，才能看懂 h3 的设计取舍。"}, {"k": "concept-d-tsdf", "gloss": "论文的核心几何模块是 image-based TSDF（A.1，Eq. 9–12，来自 Project Starline），它是 Curless–Levoy 和 KinectFusion 体素 TSDF 在图像空间里的变体。截断、加权融合、零交叉这三个概念是 h6–h9 的基础。"}, {"k": "concept-r-raymarch", "gloss": "TSDF 深度靠沿射线以 0.8·s 步进，检测到符号变化后再做 3 步二分细化得到（A.1）。这是 sphere tracing 的思路，要和 NeRF 的体渲染积分区分开。"}, {"k": "concept-f-prob", "gloss": "Eq. 2 是指数滑动平均（EMA），Eq. 11 是基于局部方差的置信权重，Eq. 13–14 是带上限的累积权重，三者都是加权平均和递归滤波的直接应用。能算出 EMA 的降噪比例，才能判断时间滤波到底有多强。"}, {"k": "concept-i-blending", "gloss": "混合网络的相机特征（射线夹角、相机距离，A.4 第 5–8 项）与 Unstructured Lumigraph 混合权重使用的几何量属于同一类（论文本身没有引用 ULR）；消融里的 Distance-based Blending（引用 LLFF）就是这类手工权重。"}, {"k": "concept-l-cnn", "gloss": "混合网络是一个 4 层 U-Net，输入 9K+1 个通道。需要理解编码器-解码器结构、跳连，以及为什么训练裁剪块取 640×352 这样能被 16 整除的尺寸（论文没有解释这个选择，这是我们的推测）。"}, {"k": "concept-v-metrics", "gloss": "实验同时报告了 PSNR/SSIM/LPIPS/L1（单帧保真度）和 TCC/STED/SDT/SDV（时间与视角一致性），另有 EPI 和 x–t 切片。不先弄清这些指标各自衡量什么，就无法判断“TSDF 引导主要提升 STED”这件事的含义。"}]}, {"b": "sec", "h": "H1 · 问题设定：固定、已标定、同步的相机阵列，K 个最近 RGB-D 视角，在线逐帧处理", "id": "walk-ha-h1", "sn": {"label": "论文位置", "t": "Sec. 1（两类已有路线）；Sec. 3 第 3 段（输入/输出定义）；Sec. 3.1 第 1 句（K 个最近视角）；Sec. 4.2、A.6（数据集）；A.7（评测协议、K 的取值）"}}, {"b": "p", "t": "输入：t 时刻 N 路 H×W RGB 帧 {I_n^t}，对应逐视角深度 {D_n^t}，一次性标定好的内外参 {K_n, R_n, t_n}，以及目标（虚拟）相机位姿。输出：目标视角的 RGB 图像 𝓘^t。帧间只保留少量状态：上一帧的输入 RGB I_n^{t−1}（用于差分掩码）、滤波后的输入深度 Ḋ^{t−1}、上一帧目标深度 𝒟^{t−1} 和累积权重 ω_acc。", "label": "这一步做什么", "mn": {"label": "需要的基础", "links": [{"k": "concept-g-pinhole"}, {"k": "concept-g-rig"}, {"k": "concept-g-sfm"}, {"k": "concept-i-blending"}, {"k": "concept-n-generalizable"}, {"k": "adv-a-telepresence-sys"}]}}, {"b": "p", "t": "这一步定义的是“游戏规则”。相机阵列固定不动，每台相机的位姿只标定一次（g-rig、g-sfm）。每一帧都用针孔模型（g-pinhole）在像素、射线和 3D 点之间来回转换。“在线”指的是第 t 帧只能用到第 t 帧和之前的信息，不能像 DyNeRF、4DGS 那样先看完整段视频再逐场景优化。\n\n对每个目标视角，只从 N 台相机里选 K 台“最近”的（DyNeRF 和 ENeRF-Outdoor 取 K=4，D3DMV 取 K=2），这是 IBR 的经典做法：离目标越近的相机，warp 过去的误差越小（i-warping、i-blending）。相机固定这个前提后面会被反复用到：同一台相机前后两帧的同一个像素对应同一条射线，所以可以直接逐像素做差、做平均（h4、h5），不需要光流对齐（d-flow）。\n\n还有一个容易忽略的点：定量评测里的“新视角”都是阵列上被留出的真实相机（DyNeRF 9 个、ENeRF-Outdoor 3 个、D3DMV 4 个），也就是阵列内部的内插视角，并不包括头显自由移动时的外推视角。", "mn": {"label": "类比", "t": "就像一场体育直播：场馆里固定架着二十几台机位，导播想要一个“不存在的机位”画面，于是从离它最近的 4 台机位借画面拼出来，而且只能边播边拼，不能等比赛结束后再剪辑。"}}, {"b": "eqs", "eqs": [{"tex": "\\lambda\\begin{bmatrix}u\\\\ v\\\\ 1\\end{bmatrix}=\\mathbf{K}_n\\left(\\mathbf{R}_n\\mathbf{X}+\\mathbf{t}_n\\right)", "explain_zh": "针孔投影。X∈ℝ³ 是世界坐标下的 3D 点；R_n（3×3 旋转）和 t_n（3×1 平移）把它变到第 n 台相机的坐标系；K_n 是 3×3 内参矩阵（焦距 f_x、f_y 以像素为单位，主点 c_x、c_y）；λ 是该点在相机坐标系下的深度 z；(u,v) 是像素坐标。"}, {"tex": "\\mathbf{X}=\\mathbf{R}_n^{\\top}\\left(D_n[u,v]\\,\\mathbf{K}_n^{-1}\\begin{bmatrix}u\\\\ v\\\\ 1\\end{bmatrix}-\\mathbf{t}_n\\right)", "explain_zh": "反投影：已知像素 (u,v) 的深度 D_n[u,v]，先用 K_n^{-1} 得到 z=1 平面上的射线方向，乘以深度得到相机坐标系下的点，再用 R_n^⊤ 和 t_n 变回世界坐标。h3 用这个公式给每个像素的高斯定中心。"}, {"tex": "\\mathcal{S}^t=\\underset{\\mathcal{S}\\subset\\{1..N\\},\\,|\\mathcal{S}|=K}{\\arg\\min}\\;\\sum_{n\\in\\mathcal{S}}\\mathrm{dist}(\\mathrm{cam}_n,\\mathrm{cam}_{\\text{tgt}})", "explain_zh": "K 个最近视角的选择。dist 是相机间的某种距离，论文只写了“closest”，没有说明是光心欧氏距离还是还考虑朝向；评测时还要把被留出的测试相机本身排除（A.7）。所有 baseline 使用同一组 K 个视角（Sec. 4.2）。"}]}, {"b": "p", "t": "DyNeRF：原始 18–22 台相机，2704×2028，测试用的两个场景各 22 台相机，降采样到 1352×1014；测试场景为 Sear Steak 和 Flame Steak，9 个测试视角，K=4。ENeRF-Outdoor：18 台 1920×1080 相机，渲染分辨率 960×540，指标在 480×270 计算，3 个测试视角，K=4。D3DMV：10 台相机，640×360 压缩版，4 个测试视角，K=2。每段序列只评测前 100 帧（30 fps 下约 3.3 s）。在线系统在 30 fps 下每帧预算为 33.3 ms。", "label": "具体数字"}, {"b": "p", "t": "固定、预标定的阵列让相机位姿成为已知常量，不必每帧估计。只取 K 个视角，是因为 splat、TSDF 和混合的耗时都随 K 近似线性增长，而画质在 K≥4 后趋于饱和（Fig. 8）。作者没有采用的方案有：融合全部 N 个视角（太慢），以及逐场景优化的 4D 表示（4DGS、4K4D，不能在线运行）。", "label": "为什么这样设计"}, {"b": "p", "t": "1）“在线”不等于“实时”，也不等于“端到端低延迟”：立体深度的耗时不计入（见 h2、h13）。2）关于位姿来源，论文前后说法不一致：Sec. 3 说用 COLMAP 一次性计算，A.7 说“使用数据集提供的相机参数”。3）测试视角都在阵列上，没有外推评测。4）K 集合随视点切换时会带来微小跳变，作者在 Sec. 3.2 中承认了这一点。", "label": "容易误解的地方"}, {"b": "qa", "items": [{"q": "为什么这篇论文可以直接比较同一相机前后两帧同一像素的颜色来判断“这里动没动”？如果换成手持移动相机还能这样做吗？", "a": "因为阵列中每台相机的位姿在时间上固定，同一像素在两帧里对应同一条射线，颜色变化只能来自场景本身（运动或光照）。手持相机在移动，同一像素前后两帧对应不同的射线，需要先用光流或位姿加深度把上一帧对齐（warp）到当前帧，才能做差，否则相机运动本身就会被当成场景运动。"}]}, {"b": "sec", "h": "H2 · 深度从哪来：RAFT-Stereo（人工选对）或深度传感器", "id": "walk-ha-h2", "sn": {"label": "论文位置", "t": "Sec. 3 第 3 段（“stereo algorithm [41] … possible to use RGB-D cameras for input [51]”）；Sec. 4 实现细节段；A.5（人工挑选立体对）；Sec. 1（传感器深度分辨率低）"}}, {"b": "p", "t": "输入：每台相机与一台人工选定的搭档相机组成的双目对（DyNeRF、Spaces），或传感器深度（ScanNet）。输出：每个视角每一帧的公制深度图 D_n^t（H×W，单位米）。", "label": "这一步做什么", "mn": {"label": "需要的基础", "links": [{"k": "concept-d-stereo"}, {"k": "concept-g-epipolar"}, {"k": "concept-g-depth"}, {"k": "concept-d-sensors"}, {"k": "concept-l-iterative"}, {"k": "adv-a-learned-stereo"}]}}, {"b": "p", "t": "双目立体（d-stereo）的流程是：先把两台相机校正（rectify）到共面、行对齐（g-epipolar），这样同一个 3D 点在两张图里只在水平方向错开 d 个像素，d 就是视差；再用三角关系 Z=fB/d 把视差换成深度（g-depth）。RAFT-Stereo 先为每个像素构建所有候选视差的相关代价体，再用多层卷积 GRU 反复迭代更新视差估计（l-iterative），每次迭代都从代价体里查询当前估计附近的匹配代价。\n\n对这篇论文来说，关键在于 RAFT-Stereo 是逐帧独立运行的。同一个静止的墙面，这一帧估计 2.01 m，下一帧可能是 1.99 m，直接拿去 warp 就会闪烁。深度误差还随距离平方增长，远处背景更不稳定。后面 h4、h5 的时间滤波和 h7 的置信权重，都是为了修补这个问题。\n\n论文也提到可以改用 RGB-D 传感器（引用 Holoportation [51]），但引言认为传感器深度分辨率低，这正是 Starline 类系统只能拍人的原因之一（d-sensors）。", "mn": {"label": "类比", "t": "两只眼睛看同一根手指，交替闭眼时手指会“跳”一下，跳得越多说明手指越近。RAFT-Stereo 就是一个反复比对左右图、逐步修正“跳了多少像素”的算法。但它没有记忆，每一帧都从头判断一次，所以同一面墙的判断结果会有轻微抖动。"}}, {"b": "eqs", "eqs": [{"tex": "Z=\\frac{f\\,B}{d}", "explain_zh": "校正后双目的深度-视差关系。Z 是深度（米）；f 是校正后的焦距（像素）；B 是两台相机光心之间的基线（米）；d 是视差（像素）。如果两台相机主点不同，还要加一个主点差修正（RAFT-Stereo README 的“Converting Disparity to Depth”一节给出了带 cx1−cx0 项的换算式）。"}, {"tex": "\\delta Z\\approx\\frac{Z^{2}}{f\\,B}\\,\\delta d", "explain_zh": "对上式求导得到的误差传播。δd 是视差误差（像素），δZ 是对应的深度误差。深度误差和 Z² 成正比，和基线、焦距成反比。"}]}, {"b": "p", "t": "示例（假设值，不是论文数据）：f=1000 px，B=0.3 m，Z=3 m 时 d=100 px。若 δd=0.5 px，则 δZ≈9/300×0.5=1.5 cm，已经接近 TSDF 的截断阈值 τ=2 cm。同样条件下 Z=6 m 时 δZ≈6 cm，是 τ 的 3 倍，这也是固定的公制 τ 对远处背景不友好的原因。论文数据：DyNeRF 和 Spaces 用 RAFT-Stereo，ScanNet 用传感器深度。立体深度的耗时不计入 Table 4。", "label": "具体数字"}, {"b": "p", "t": "论文给出的理由是：相机配置事先已知，所以可以用立体算法估计深度，这也使得方法能在现有的多视角数据集上评测（Sec. 3）；引言还指出基于对应的方法能得到高分辨率深度，而传感器深度分辨率低、限制了场景级重建（Sec. 1）。阵列固定，所以可以事先为每台相机挑好搭档。作者没有采用的方案有：全视角 MVS（开销大）、深度传感器（分辨率低、室外受限）、以及时间一致的视频立体方法（论文完全没有讨论）。", "label": "为什么这样设计"}, {"b": "p", "t": "1）“人工挑选立体对”意味着这一步无法自动化，测试序列上深度具体怎么生成，论文也没有交代。2）RAFT-Stereo 输出的是校正坐标系下左图的视差，要换回原始相机坐标系下的深度图还需要一次坐标变换，论文没有写。3）很多人以为“这个方法约 39 ms 一帧”包含了深度，其实不包含。22 路 1352×1014 的立体匹配本身就可能是整个系统最大的开销。", "label": "容易误解的地方"}, {"b": "qa", "items": [{"q": "假设 f=1000 px、B=0.2 m，要让 5 m 处的深度误差小于 τ=0.02 m，视差误差最多能容忍多少像素？", "a": "由 δZ≈Z²/(fB)·δd 得 δd≈δZ·fB/Z²=0.02×1000×0.2/25=0.16 px。这比真实场景中学习式立体算法常见的亚像素误差量级（零点几像素到 1 像素左右）还要严格，说明远处区域的深度很难落在截断带内，需要依靠置信权重和时间滤波来弥补。"}]}, {"b": "sec", "h": "H3 · 前向渲染：像素大小、各向同性、完全不透明的高斯，逐视角单独 splat，得到 𝓘_k、α_k、𝒟_k", "id": "walk-ha-h3", "sn": {"label": "论文位置", "t": "Sec. 3.1；Fig. 4(a)；A.3；Fig. 10"}}, {"b": "p", "t": "输入：第 k 个选中视角的 RGB 图 I_k^t、深度 D_k^t（论文写的是 D_k^t，未写 Ḋ_k^t）及其位姿。输出（在目标相机中）：warp 后的图像 𝓘_k^t（3×H×W）、累积不透明度 α_k^t（1×H×W）和深度 𝒟_k^t（1×H×W）。K 个视角分别渲染，共得到 K 组。", "label": "这一步做什么", "mn": {"label": "需要的基础", "links": [{"k": "concept-g-pinhole"}, {"k": "concept-r-raster"}, {"k": "concept-r-alpha"}, {"k": "concept-n-3dgs"}, {"k": "concept-i-warping"}, {"k": "concept-r-reps"}]}}, {"b": "p", "t": "每个像素用反投影公式（g-pinhole）变成一个 3D 点，作为高斯中心。颜色取该像素的 RGB，不透明度 o=1，协方差取各向同性的 σ²I，σ 按解析式设定，使这个高斯投影回源图时恰好覆盖 1 个像素。一个像素在深度 z 处对应的物理宽度约为 z/f，所以 σ 与 z/f 成正比；论文没有给出具体比例系数。接下来用原版 3DGS 光栅器（n-3dgs、r-raster）把这些高斯投到目标相机：每个高斯变成一个 2D 椭圆，按深度排序，再做前到后的 alpha 合成（r-alpha）。\n\n为什么不用最简单的点溅射（每个点只写一个像素并做 z-buffer）？因为目标相机离得更近时，一个源像素应该覆盖多个目标像素，点溅射会留下针孔状空隙，边缘也会出现锯齿；高斯有面积，会自然覆盖这些位置（Fig. 10）。另一方面，高斯是按深度排序后合成的，前面的高斯会挡住后面的，所以遮挡也能正确处理（A.3：“Gaussians enable occlusion-handling”）。\n\n为什么要逐视角单独渲染，而不是把 K 个视角的高斯放在一起渲染一次？因为 K 个视角的深度彼此不一致，同一块表面在不同视角里可能差几厘米。放在一起渲染时，这些互相交错的表面会争夺同一个像素（Z-fighting），边缘还会出现飞点（Fig. 4a）。分开渲染则保留了 K 个“意见”，交给后面的网络去裁决（i-warping）。", "mn": {"label": "类比", "t": "把每个输入视角想成一张由几百万颗彩色小球组成的“浮雕”，每颗小球的大小刚好等于一个像素。从目标相机的位置分别给这 4 张浮雕各拍一张照片，而不是把 4 张叠在一起拍，免得它们互相穿插。"}}, {"b": "eqs", "eqs": [{"tex": "\\boldsymbol{\\mu}_{k,uv}=\\mathbf{R}_k^{\\top}\\left(D_k[u,v]\\,\\mathbf{K}_k^{-1}[u,v,1]^{\\top}-\\mathbf{t}_k\\right),\\quad \\Sigma_{k,uv}=\\sigma_{k,uv}^{2}\\mathbf{I}_3,\\quad \\sigma_{k,uv}\\propto\\frac{D_k[u,v]}{f_k},\\quad o=1", "explain_zh": "像素级高斯的参数。μ 是中心，Σ 是各向同性协方差，I_3 是 3×3 单位阵，σ 与“一个像素在深度 D 处的物理宽度 D/f”成正比（比例常数论文未给），o 是不透明度，固定为 1；颜色 c 取像素值 I_k[u,v]。"}, {"tex": "\\Sigma'=\\mathbf{J}\\mathbf{W}\\Sigma\\mathbf{W}^{\\top}\\mathbf{J}^{\\top}\\;(+\\,0.3\\,\\mathbf{I}_2),\\qquad \\alpha_i(\\mathbf{x})=\\min\\!\\left(0.99,\\;o_i\\exp\\!\\left(-\\tfrac12(\\mathbf{x}-\\boldsymbol{\\mu}'_i)^{\\top}\\Sigma_i'^{-1}(\\mathbf{x}-\\boldsymbol{\\mu}'_i)\\right)\\right)", "explain_zh": "3DGS 的 2D 投影与逐像素不透明度。W 是世界到目标相机的旋转，J 是透视投影在高斯中心处的雅可比矩阵，Σ' 是 2×2 的屏幕空间协方差，μ' 是投影后的中心，x 是像素位置。原版 3DGS 代码会在 Σ' 对角线上加 0.3（低通），把 α 截断到 0.99，并跳过 α<1/255 的贡献。所以即使 o=1，边缘处的 α 仍然是小数。"}, {"tex": "\\mathcal{I}_k(\\mathbf{x})=\\sum_{i}c_i\\,\\alpha_i\\prod_{j<i}(1-\\alpha_j),\\qquad \\alpha_k(\\mathbf{x})=1-\\prod_i(1-\\alpha_i),\\qquad \\mathcal{D}_k(\\mathbf{x})=\\sum_i z_i\\,\\alpha_i\\prod_{j<i}(1-\\alpha_j)", "explain_zh": "前到后 alpha 合成。i 按深度从近到远排序，c_i 是颜色，z_i 是高斯在目标相机下的深度，∏(1−α_j) 是累积透射率。α_k 是累积覆盖率，接近 0 的地方就是空洞。深度用同样的权重累积，这是常见做法；论文只说“使用原版 3DGS 代码做前向渲染”，没有说明 𝒟_k 和 α_k 是怎样从光栅器导出的（最初发布的 3DGS 光栅器只返回颜色）。"}]}, {"b": "p", "t": "DyNeRF 分辨率下，每个视角 1352×1014=1,370,928 个高斯，K=4 时每帧约 548 万个。Table 4：K 个视角的 forward-splatting 合计 10 ms。示例（假设值）：z=2 m、f=1000 px 时一个像素宽约 2 mm，σ 就在毫米量级。", "label": "具体数字"}, {"b": "p", "t": "作者用解析参数，而不用网络预测高斯参数。理由是：在稠密的 H×W 像素网格上，GPS-Gaussian、Tele-Aloha、GS-LRM 一类网络预测的尺度、不透明度和旋转会收敛到近似常数，颜色也等于输入像素，所以直接解析计算更省（Sec. 3.1）。网络预测的一个潜在好处是能放大背景高斯来填补遮挡洞，但作者发现这会降低整体 PSNR（A.3，只有 Fig. 10 的定性证据，没有表格）。空洞改由 h11 的背景图来处理。没有采用的方案：点溅射（Fig. 10）、单次整体渲染（Fig. 4a）、网络预测参数。", "label": "为什么这样设计"}, {"b": "p", "t": "1）“完全不透明”不代表 α_k 只有 0 和 1。高斯边缘衰减，再加上 0.3 的低通，都会产生小数 alpha，α_k 实际上是一张软覆盖图。2）这是前向 warping，不是反向采样。采样造成的针孔空隙已由像素级高斯基本消除，剩下的空洞和飞点来自去遮挡和深度错误（Sec. 3.1：“disocclusions and errors in the depth maps … lead to holes and flying pixels”）。3）各向同性、按源图像素定尺度的高斯没有考虑表面倾斜，掠射角下会被拉长或留缝；它也表示不了半透明、头发和视角相关的高光。4）论文说用 D_k^t 反投影，没写是否使用了 h5 滤波后的 Ḋ_k^t。", "label": "容易误解的地方"}, {"b": "qa", "items": [{"q": "如果把 4 个视角的高斯合在一起一次渲染，为什么边缘会比逐视角渲染更差？", "a": "4 个视角的深度各有几厘米的误差，同一块表面会变成 4 层互相交错的“薄壳”。合在一起按深度排序时，哪一层在前取决于噪声，前景边缘的高斯还会落到背景前面形成飞点，结果就是 Z-fighting 和锯齿状边缘（Sec. 3.1、Fig. 4a）。逐视角渲染可以保证每张图内部自洽，把“该信哪个视角”的决策留给后面由几何引导的混合网络。"}]}, {"b": "sec", "h": "H4 · 软差分掩码：M = min(|I_t − I_{t−1}|/λ_t + β, 1)，在 1/4 分辨率计算并做 max-pool", "id": "walk-ha-h4", "sn": {"label": "论文位置", "t": "Sec. 3.2，Eq. (1) 及其后一段；Fig. 3"}}, {"b": "p", "t": "输入：同一台固定相机相邻两帧的 RGB，I_n^t 和 I_n^{t−1}。输出：软掩码 M_n^t∈[0.6,1]（H×W），表示这一帧应该在多大程度上相信新深度。", "label": "这一步做什么", "mn": {"label": "需要的基础", "links": [{"k": "concept-f-image"}, {"k": "concept-f-prob"}, {"k": "concept-v-temporal"}, {"k": "concept-d-flow"}]}}, {"b": "p", "t": "相机不动，所以一个像素颜色没变，基本就说明这里的场景没动。颜色差越大，越像是动了，越应该相信新测到的深度；颜色没变，就可以多沿用历史深度来压制立体噪声（f-prob、v-temporal）。这张掩码不是 0/1 的硬分割，而是一个线性上升、在 1 处截断的软值：颜色差为 0 时 M=β=0.6，差值达到 0.4·λ_t=0.28 时 M 饱和为 1。\n\n计算细节（f-image）：论文只给出了步骤——在 1/4 分辨率计算、3×3 max-pool、双线性上采样回原分辨率，没有解释动机。我们的理解是：降到 1/4 分辨率既省计算，又相当于低通滤波，能抑制单像素噪声和视频压缩噪声；3×3 max-pool 相当于把“动了”的区域膨胀一圈，在 1/4 分辨率下 1 个像素对应原图 4×4 个像素，这样运动物体的边缘会被保守地当成动态处理，避免留下拖影；双线性上采样则得到平滑过渡。\n\n注意，这张掩码是在 RGB 上计算，却用来控制深度的更新。颜色变化并不等价于几何变化，这是整个时间模块最大的启发式假设。", "mn": {"label": "类比", "t": "像监控摄像头里的“移动侦测”：画面某块区域变化明显就标记为动了。只不过这里是一个旋钮，而不是开关：最安静的时候旋钮停在 60%（仍然每帧吸收 60% 的新深度），变化越大拧得越满，最多到 100%。"}}, {"b": "eqs", "eqs": [{"tex": "M_n^t=\\min\\!\\left(\\frac{\\left|I_n^t-I_n^{t-1}\\right|}{\\lambda_t}+\\beta,\\;1\\right)", "explain_zh": "Eq. (1)。I_n^t 是相机 n 在时刻 t 的图像（取值推测在 [0,1]）；|·| 是逐像素绝对差，RGB 三个通道如何合成一个值（取均值还是最大值）论文没有说明；λ_t=0.7 控制对颜色变化的敏感度；β=0.6 是下限，保证至少 60% 的新深度被采纳；min(·,1) 把结果截断到 1。论文称 β 和 λ_t 为“决定对颜色变化敏感度的经验超参数”。"}, {"tex": "M\\leftarrow\\mathrm{Up}_{\\times4}^{\\text{bilinear}}\\Big(\\mathrm{MaxPool}_{3\\times3}\\big(M^{\\downarrow4}\\big)\\Big)", "explain_zh": "计算流程：M^{↓4} 表示在 1/4 分辨率上计算 Eq. (1)，接着做 3×3 max-pool（相当于形态学膨胀），再双线性上采样 4 倍回到原分辨率。下采样方式和 pooling 步长论文没有写，按“保持尺寸”的 stride=1 理解最合理。"}]}, {"b": "p", "t": "λ_t=0.7，β=0.6。颜色差 0 → M=0.6；0.07 → 0.7；0.14 → 0.8；≥0.28 → 1.0。换成 8-bit 约为 71 个灰度级。相机噪声如果在 0.01 左右，M≈0.614，基本就是下限。DyNeRF 1352×1014 在 1/4 分辨率下约为 338×254。", "label": "具体数字"}, {"b": "p", "t": "相机固定，所以逐像素做差是最便宜的运动检测方法，几乎不耗时（Table 4 也没有单独列出这一步）。没有采用的方案：光流（d-flow，更准但更贵）、背景建模（如 GMM）、学习式运动分割，以及直接加时间损失。下限 β=0.6 可以理解为一种保守设计（论文未解释取值）：宁可少滤波，也不让陈旧深度拖住运动物体。", "label": "为什么这样设计"}, {"b": "p", "t": "1）M 不是“运动概率”。它的最小值是 0.6，所以静止区域也只保留 40% 的历史，滤波力度并不大（见 h5）。2）光照变化、阴影、火焰（Flame Steak 里就有火）、自动曝光和 mp4 压缩噪声都会被当作运动。反过来，一个无纹理的纯色物体在移动时，内部像素颜色可能不变，会被误判为静止，从而沿用旧深度产生拖影。3）Eq. (1) 的 β 和附录 Eq. (13) 的 β 用的是同一个符号，但 A.2 对后者的描述是“控制前几帧的相对贡献”，论文没有说明两者是否取同一数值（β=0.6 只在 Eq. (1) 处给出）。", "label": "容易误解的地方"}, {"b": "qa", "items": [{"q": "如果把 β 从 0.6 调到 0.1，静止区域和运动物体边缘分别会发生什么？", "a": "静止区域的 M≈0.1，每帧只吸收 10% 的新深度，滤波强得多，稳态噪声方差比例从 0.6/1.4≈0.43 降到 0.1/1.9≈0.05，闪烁明显减少。代价是：只要掩码漏检了运动（颜色差不够大，或者掩码膨胀没有覆盖到的边缘），旧深度就会残留很多帧，造成拖影和几何滞后。β 实际上是在“去噪强度”和“对运动的响应速度”之间做权衡。"}]}, {"b": "sec", "h": "H5 · 静止区域的时间深度滤波（EMA）", "id": "walk-ha-h5", "sn": {"label": "论文位置", "t": "Sec. 3.2，Eq. (2)；Table 3 “No Temporal Filtering” 一行"}}, {"b": "p", "t": "输入：当前原始深度 D_n^t、掩码 M_n^t 和上一帧滤波结果 Ḋ_n^{t−1}。输出：滤波后的深度 Ḋ_n^t（H×W），它就是后面 TSDF 使用的输入深度。", "label": "这一步做什么", "mn": {"label": "需要的基础", "links": [{"k": "concept-f-prob"}, {"k": "concept-v-temporal"}, {"k": "concept-d-stereo"}, {"k": "concept-g-rig"}]}}, {"b": "p", "t": "Eq. (2) 是教科书上的指数滑动平均（EMA），也可以看作增益固定为 M 的稳态卡尔曼滤波（f-prob）：新估计 = 增益 × 新测量 + (1−增益) × 旧估计。增益越小，越相信历史，噪声压得越狠，但对真实变化的反应也越慢。这里的增益是逐像素的 M_n^t，所以动态区域增益接近 1，几乎直接用新深度；静止区域增益为 0.6，做轻度平滑。\n\n这一步完全在输入相机自己的图像空间里完成，前提是相机固定（g-rig）。它治的是立体深度逐帧独立估计带来的抖动（d-stereo），而不是后面几何融合出现的问题。\n\n把 EMA 展开来看：当前输出等于过去所有帧深度的加权和，权重按 (1−M) 的幂次指数衰减。M=0.6 时，各帧权重依次为 0.6、0.24、0.096……有效记忆长度约 1/M≈1.7 帧，是一种很短的记忆。", "mn": {"label": "类比", "t": "就像给体重秤读数做平滑：每次新读数占 60%，昨天的平滑值占 40%。站着不动时读数会稳一些；一旦真的胖了或瘦了（场景动了，M→1），就立刻采用新读数。"}}, {"b": "eqs", "eqs": [{"tex": "\\dot D_n^t=M_n^t\\cdot D_n^t+\\left(1-M_n^t\\right)\\cdot\\dot D_n^{t-1}", "explain_zh": "Eq. (2)。D_n^t 是 t 时刻的原始深度，Ḋ_n^t 是滤波后的深度，M_n^t 是 h4 的软掩码，所有运算逐像素进行。初始化（t=0 时 Ḋ 取什么值）论文未说明，一般取 Ḋ^0=D^0。"}, {"tex": "\\dot D^t=\\sum_{j\\ge 0}M(1-M)^{j}\\,D^{t-j}\\quad(M\\text{ 恒定时})", "explain_zh": "展开式：历史深度的权重按 (1−M)^j 衰减，所有权重之和为 1。"}, {"tex": "\\frac{\\mathrm{Var}[\\dot D]}{\\mathrm{Var}[D]}=\\frac{M}{2-M}", "explain_zh": "如果每帧深度噪声独立同分布，EMA 的稳态方差与原始方差之比为 M/(2−M)。M=0.6 时为 0.43，标准差降为约 0.65 倍，即闪烁幅度降低约 35%。"}]}, {"b": "p", "t": "数值例：某静止像素的真实深度为 2.00 m，RAFT-Stereo 连续三帧给出 2.01、1.99、2.01。M=0.6 时，Ḋ 依次为 2.010 → 0.6×1.99+0.4×2.010=1.998 → 0.6×2.01+0.4×1.998=2.0052，抖动幅度从 ±1 cm 降到约 ±0.5 cm。Table 3（数值对应 DyNeRF）：去掉时间滤波后 PSNR 31.16，完整模型 31.17；STED 89.62，完整模型 68.76。", "label": "具体数字"}, {"b": "p", "t": "便宜，在线（只需上一帧），不需要网络。没有采用的方案：时间一致的视频立体网络（例如几乎同期的 Stereo Any Video，arXiv 2025-03；论文未讨论这类方法）、光流对齐后再滤波、卡尔曼滤波加不确定性传播、时间损失。", "label": "为什么这样设计"}, {"b": "p", "t": "1）很多人以为时间一致性主要来自这一步。实际上时间稳定性有两个来源：这里的输入端 EMA，以及 h9 在 TSDF 中回灌上一帧输出深度。Sec. 4.5 把这项消融描述为“用差分掩码对输入视角深度做时间滤波”，但没有说清“No Temporal Filtering”是否同时去掉了 𝒟^{t−1} 回灌（回灌的权重也依赖差分掩码）。2）EMA 只能压制零均值的随机抖动，压不住系统性偏差，比如高光区域持续错误的深度。3）运动区域 M=1，完全不滤波，所以运动物体上的深度闪烁照样存在。", "label": "容易误解的地方"}, {"b": "qa", "items": [{"q": "M 恒为 0.6 时，上一帧的深度对当前输出的贡献是多少？5 帧之前的深度呢？", "a": "上一帧的权重是 M(1−M)=0.6×0.4=0.24；5 帧之前是 0.6×0.4^5≈0.006，几乎可以忽略。所以这个滤波器的记忆非常短，只能压住逐帧的高频抖动，不能提供长时间的稳定性。"}]}, {"b": "sec", "h": "H6 · 基于图像的 TSDF：沿目标射线采样，投影到 K 个视角，求 s_k = z_k − D_k", "id": "walk-ha-h6", "sn": {"label": "论文位置", "t": "Sec. 3.2 第 1 段；A.1，Eq. (9)；来源为 Lawrence et al. [30]（Project Starline）"}}, {"b": "p", "t": "输入：目标相机的每条像素射线、K 张滤波后的深度 Ḋ_k^t 及其位姿。输出：射线上任意采样点 p 相对于每个视角的有符号距离 s_k。它们在 h7 中融合成一个标量 s(p)。", "label": "这一步做什么", "mn": {"label": "需要的基础", "links": [{"k": "concept-d-tsdf"}, {"k": "concept-g-pinhole"}, {"k": "concept-g-depth"}, {"k": "concept-r-raymarch"}]}}, {"b": "p", "t": "传统 TSDF（d-tsdf，Curless–Levoy 1996、KinectFusion 2011）先在空间里建一个 3D 体素网格，把每帧深度融合进去，再做光线投射。体素网格的问题是分辨率和显存、计算量难以兼顾。Starline 的 image-based TSDF 换了一个思路：只关心目标相机看到的射线。对每个目标像素，沿射线逐点试探，用到哪个点就当场算出这个点的 TSDF 值，不存任何体素。\n\n怎么当场算？把点 p 投影到第 k 个输入相机（g-pinhole），得到它在那台相机里的深度 z_k 和像素位置 (u_k,v_k)，再查询该相机在这个像素观测到的表面深度 D_k[u_k,v_k]。两者之差就是“点 p 沿相机 k 的视线到观测表面还有多远”。这叫投影符号距离（projective SDF），不是真正的欧氏最近距离。表面倾斜时，它会大于真实距离。\n\n关于符号：按 Eq. (9) 的字面写法，s_k=z_k−D_k，点在表面前方（离相机更近）时为负。但附录同时规定 s_k<−τ 时 ω_k=0，并且以 0.8·s 为步长前进。按字面符号推下去，射线起点处于表面前方的自由空间，所有视角的 s_k 都小于 −τ，权重全部为 0，步长为 0，射线无法前进。只有按 KinectFusion 的常用约定理解（s=D−z，表面前方为正，s<−τ 表示点在该视角表面后方很远，即被遮挡，这时忽略这个视角），三条规则才能互相吻合。这是我们的推断，论文没有说明；读的时候建议按“表面前方为正”来理解。", "mn": {"label": "类比", "t": "想象你沿着目标相机的一条视线往前走，每走一步都打电话问 4 台相机：“我现在离你看到的那个表面还有多远？”每台相机只能回答沿它自己视线方向的距离，而且最多报 ±2 cm（截断）。你把 4 个回答加权合起来，正负号一翻转，就说明已经走到表面了。"}}, {"b": "eqs", "eqs": [{"tex": "\\mathbf{p}(d)=\\mathbf{o}_{\\text{tgt}}+d\\,\\mathbf{r}_{\\text{tgt}}(u,v)", "explain_zh": "目标射线的参数化。o_tgt 是目标相机光心，r_tgt(u,v) 是经过像素 (u,v) 的射线方向，d 是沿射线的参数。射线从哪里开始、最远走到哪里（near/far），论文没有给出。"}, {"tex": "(x_k,y_k,z_k)^{\\top}=\\mathbf{K}_k\\left(\\mathbf{R}_k\\mathbf{p}+\\mathbf{t}_k\\right),\\qquad (u_k,v_k)=\\left(\\frac{x_k}{z_k},\\frac{y_k}{z_k}\\right)", "explain_zh": "A.1 的投影式。z_k 是点 p 在相机 k 坐标系下的深度，(u_k,v_k) 是它落在相机 k 图像上的像素坐标（论文称为 normalized pixel locations，实际上已经乘过内参，是像素坐标）。"}, {"tex": "s_k=z_k-D_k\\big[u_k,v_k\\big]", "explain_zh": "Eq. (9)。D_k[·] 表示在深度图上采样（插值方式未说明），省略了上标 t；按 Eq. (3)，这里应当使用滤波后的 Ḋ_k^t。符号约定的问题见上文，论文原式如此。"}]}, {"b": "p", "t": "数值例（按“表面前方为正”的约定）：目标射线上某点在相机 1 下 z_1=1.970 m，相机 1 观测到的表面深度为 2.000 m，得 s_1=+0.030 m，截断后为 +0.02；在相机 2 下 z_2=2.105 m、观测深度 2.100 m，s_2=−0.005 m，说明已经略微越过表面。Table 4：整个 TSDF 阶段（1352×1014 条射线，K=4）耗时 6 ms，用自定义 CUDA 实现。", "label": "具体数字"}, {"b": "p", "t": "没有体素网格，所以分辨率只取决于目标图像分辨率，不需要体素显存，适合每帧都要重建的动态场景（Sec. 3.2：“avoids creating an explicit 3D voxel grid … efficiently generate high-resolution depth maps”）。论文的论点是：把输入深度融合进同一个全局结构，保证了同一时刻渲染出的深度视角一致（Sec. 3.2）；但实际只融合 K 个视角，这个保证是近似的（见 pitfalls 3）。没有采用的方案：KinectFusion、Fusion4D 类显式体素 TSDF（Sec. 2 提到分辨率和计算量难以兼顾），以及直接使用逐视角原始深度。", "label": "为什么这样设计"}, {"b": "p", "t": "1）image-based TSDF 不是一个可以存储、可以从任意视角重用的 3D 模型。每换一个目标视角都要重新沿射线计算，多名观看者、两只眼睛都要各算一遍。2）s_k 是沿视线的投影距离，不是欧氏距离，掠射角下偏大。3）论文所说的“全局几何”其实只融合了 K 个视角，K 集合一变，TSDF 就会变（Sec. 3.2 中作者承认了这一点）。4）注意 Eq. (9) 的符号问题。", "label": "容易误解的地方"}, {"b": "qa", "items": [{"q": "与 KinectFusion 的体素 TSDF 相比，image-based TSDF 省掉了什么，又多付出了什么？", "a": "它省掉了 3D 体素网格的显存和“把每帧深度积分进所有体素”的开销，分辨率也不受体素尺寸限制。代价是没有可以复用的全局模型：每个目标视角、每一帧都要沿每条射线重新投影、查询 K 张深度图。对单个观看者很划算，但观看视角越多成本越高，也无法天然积累多帧信息，因此才需要 h9 的时间回灌。"}]}, {"b": "sec", "h": "H7 · 截断与融合权重（τ = 0.02 m，权重基于 7×7 局部深度方差）", "id": "walk-ha-h7", "sn": {"label": "论文位置", "t": "A.1，Eq. (10)–(12)；ω_k=0 的规则同样出自 A.1（沿用 Lawrence et al.）"}}, {"b": "p", "t": "输入：K 个 s_k，以及每个投影位置周围 7×7 窗口内的深度。输出：点 p 的融合 TSDF 值 s(p)。", "label": "这一步做什么", "mn": {"label": "需要的基础", "links": [{"k": "concept-d-tsdf"}, {"k": "concept-f-prob"}, {"k": "concept-g-depth"}, {"k": "concept-d-sensors"}]}}, {"b": "p", "t": "截断的作用是：距离表面超过 τ 的点，只需要知道它在前面还是在后面，不需要知道具体距离。这样可以防止一个视角里的远处误差主导融合结果（d-tsdf）。\n\n融合权重 ω_k 体现的是“这个视角在这一点有多可信”（f-prob）。论文的说法是：权重用来处理输入深度的噪声，按投影位置周围 7×7 邻域内的深度起伏来计算。深度图在物体边缘处会突变（前景和背景混在一起，容易产生飞点），在立体匹配失败的区域会呈噪声状，这些地方局部起伏都大，就降低权重；平坦表面起伏小，权重为 1。仔细看 Eq. (11)：ν_k/49 是截断后的均方差，开根号后是 RMS，所以权重等于 1 mm 除以局部 RMS 起伏，封顶为 1。这相当于按 1/σ 加权，而不是统计上最优的逆方差 1/σ² 加权。\n\n“s_k<−τ 时 ω_k=0”（按表面前方为正的约定）表示：这个点在视角 k 看来位于其观测表面后方超过 2 cm，也就是被挡住了，视角 k 对它没有发言权。这是处理遮挡的标准做法。", "mn": {"label": "类比", "t": "一个评审团投票：每个评委只能投 −2 到 +2 之间的票（截断）；在自己看得清的地方（邻域平坦）投整票，在看不清的地方（边缘、噪声区）只投零点几票；如果某个评委被柱子挡住了视线，就弃权。"}}, {"b": "eqs", "eqs": [{"tex": "s=\\sum_{k=1}^{K}\\omega_k\\cdot\\mathrm{clamp}\\left(s_k,-\\tau,\\tau\\right)", "explain_zh": "Eq. (10)。clamp 把 s_k 截断到 [−τ, τ]，τ=0.02 m。注意这是加权和，不是除以 Σω_k 的加权平均，论文原式如此。正负号不受归一化影响，但 h8 的步长 0.8·s 会随之变化。"}, {"tex": "\\omega_k=\\min\\!\\left(0.001\\cdot\\left(\\frac{\\nu_k}{w\\times w}\\right)^{-1/2},\\;1.0\\right)", "explain_zh": "Eq. (11)。w=7，所以 w×w=49；ν_k/49 是局部均方差，开根号取倒数后就是 1/RMS；0.001 与 τ 同为米制常数（1 mm，单位是我们根据 τ 的单位推断的）。局部 RMS≤1 mm 时 ω_k=1。"}, {"tex": "\\nu_k=\\sum_{(p,q)\\in\\mathcal{N}}\\min\\!\\left(\\left(D_k[u_k,v_k]-D_k[p,q]\\right)^{2},\\;\\tau^{2}\\right)", "explain_zh": "Eq. (12)。𝒩 是 (u_k,v_k) 周围的 7×7 邻域；统计的是邻域各像素相对于中心像素的平方差（不是相对于邻域均值的方差），每项截断到 τ²，避免深度边缘处的单个巨大跳变主导结果。"}, {"tex": "\\omega_{\\min}\\approx 0.001\\cdot\\left(\\tau^{2}\\right)^{-1/2}=\\frac{0.001}{0.02}=0.05", "explain_zh": "由截断可以推出权重的下限：ν_k/49 最大约为 τ²（中心像素自身贡献 0，严格上限是 48τ²/49），所以 ω_k 约在 [0.05, 1]。即使在最乱的边缘，权重也不会低于约 0.05。只有遮挡规则能让权重变成 0。"}]}, {"b": "p", "t": "τ=0.02 m，w=7，常数 0.001。局部 RMS 为 1 mm 时 ω=1，2 mm 时 0.5，4 mm 时 0.25，≥20 mm 时约 0.05。融合示例（K=4，表面前方为正）：s_k 分别为 +0.012、+0.008、−0.004、+0.030（截断为 +0.02），ω_k 分别为 1、0.5、0.2、1，则 s=0.012+0.004−0.0008+0.02=0.0352>0，该点仍在表面前方。", "label": "具体数字"}, {"b": "p", "t": "深度误差最大的地方是物体边缘和立体匹配失败区，局部起伏恰好能反映这两类情况，而且只需要读取深度图，不需要网络，计算也便宜。没有采用的方案：使用立体网络输出的逐像素不确定度（RAFT-Stereo 本身不直接输出置信度）、按 Z² 缩放的误差模型、学习式置信度。", "label": "为什么这样设计"}, {"b": "p", "t": "1）τ 和 0.001 都是公制常数，隐含要求位姿和深度是真实的米制尺度。COLMAP 位姿只确定到一个尺度因子，论文没有说明如何对齐尺度。2）固定的 τ 对远处（误差可达数厘米）太紧，对近处的细节又偏松。3）ν_k 基于哪张深度计算（原始 D_k 还是滤波后的 Ḋ_k），论文没有区分。4）按 1/σ 加权不是最优的逆方差融合，不能把它当成严格的最大似然估计。", "label": "容易误解的地方"}, {"b": "qa", "items": [{"q": "某个视角在投影位置的 7×7 邻域内，一半像素与中心相差 0.5 mm，另一半相差 5 cm（落在深度边缘上）。求 ω_k。", "a": "平方差截断后，约 24 个像素贡献 (0.0005)²=2.5e−7，约 24 个像素贡献 τ²=4e−4（5 cm 被截断到 2 cm），中心像素贡献 0。ν≈24×4e−4=9.6e−3（前一部分可忽略），ν/49≈1.96e−4，RMS≈0.014 m，ω≈0.001/0.014≈0.071。边缘处这个视角基本被降权到接近最低值 0.05。"}]}, {"b": "sec", "h": "H8 · 光线步进求零交叉，再用二分细化，得到一致的新视角深度", "id": "walk-ha-h8", "sn": {"label": "论文位置", "t": "A.1 最后一段（0.8s 步长，三步二分）；Sec. 3.2，Eq. (3) 中的 Raymarch(·)"}}, {"b": "p", "t": "输入：可以在任意点查询的融合 TSDF 值 s(p)。输出：目标视角每个像素的表面深度 𝒟^t（1×H×W），即射线上 s 第一次变号的位置。", "label": "这一步做什么", "mn": {"label": "需要的基础", "links": [{"k": "concept-r-raymarch"}, {"k": "concept-d-tsdf"}, {"k": "concept-f-optim"}, {"k": "concept-r-volume"}]}}, {"b": "p", "t": "这里的 raymarch 和 NeRF 的体渲染（r-volume）不是一回事。NeRF 是沿射线积分密度和颜色；这里是找到表面，也就是 SDF 的零点，属于 sphere tracing 一类方法（r-raymarch）。SDF 的值告诉你“离表面还有多远”，所以可以直接前进这么多。步长乘 0.8 可以理解为保险系数（论文没有解释取值）：投影距离并不是真正的最近距离，全速前进可能冲过薄结构。\n\n一旦发现 s 变号，说明表面就在最后一步的区间内。此时在区间里做二分：取中点，看它的符号，保留包含零点的那一半，重复 3 次，区间缩小到原来的 1/8（f-optim 里最简单的一维求根）。\n\n有一个细节论文没有交代：如果 s 是归一化的真实距离，每步走 0.8·s，剩余距离每步缩成 0.2 倍，会无限逼近表面却永远不会越过，符号也就不会改变。因此实际实现要么设置了 |s|<ε 的停止条件，要么依赖 Eq. (10) 未归一化（Σω_k>1.25 时一步的长度会超过剩余距离，从而越过表面）。论文只写了“检测到符号变化”。", "mn": {"label": "类比", "t": "在黑暗里朝墙走，手里有个测距仪，读数最多显示 2 cm（截断）。每次只走读数的八成；某一步之后测距仪开始报“你已经在墙里了”（变号），就在最后一步之内来回折半试探 3 次，定出墙的位置。"}}, {"b": "eqs", "eqs": [{"tex": "d_{i+1}=d_i+0.8\\cdot s\\big(\\mathbf{p}(d_i)\\big)", "explain_zh": "步进公式。d_i 是第 i 步在射线上的位置，s(·) 由 Eq. (10) 当场计算。按“表面前方为正”的约定，s>0 时向前走。"}, {"tex": "\\text{若 } \\mathrm{sign}\\,s(\\mathbf{p}(d_{i+1}))\\neq\\mathrm{sign}\\,s(\\mathbf{p}(d_i)):\\quad [a,b]\\leftarrow[d_i,d_{i+1}],\\;\\; m=\\tfrac{a+b}{2},\\;\\; \\text{按 } \\mathrm{sign}\\,s(m) \\text{ 更新区间，重复 3 次}", "explain_zh": "三步二分细化。区间长度变为原来的 1/2³=1/8，最终深度取区间内的某一点（论文没说取中点还是做线性插值）。"}, {"tex": "\\mathcal{D}^t=\\mathrm{Raymarch}\\Big(\\mathrm{TSDF}\\big(\\{\\dot D_k^t\\},\\,\\mathcal{D}^{t-1}\\big)\\Big)", "explain_zh": "Eq. (3)，整个几何模块的总式：TSDF 同时融合 K 张滤波深度 Ḋ_k^t 和上一帧的目标深度 𝒟^{t−1}（见 h9），再用 raymarch 求出本帧的目标深度 𝒟^t。"}]}, {"b": "p", "t": "数值例（未归一化，K=4，ω 全为 1）：某点离表面 5 cm 时，每个 s_k 都被截断为 0.02，s=0.08，一步走 0.064 m，越过表面 1.4 cm；此时每个 s_k≈−0.014（仍在 −τ 之内，权重不为 0），s≈−0.056，检测到变号。二分区间长 6.4 cm，3 步后缩到 8 mm。归一化的情况下，最大步长为 0.8τ=1.6 cm，3 步二分后区间在 2 mm 以内。TSDF（含 raymarch）合计 6 ms。", "label": "具体数字"}, {"b": "p", "t": "sphere tracing 按距离值自适应步进，通常比固定小步长的密集采样需要更少的查询（论文没有报告实际步数），而且每条射线独立，适合在 CUDA 中逐像素并行；输出的是单一表面深度，正好可以作为混合网络的引导和 L_Depth 的目标。没有采用的方案：体渲染式的深度期望（会产生前景和背景之间的“中间深度”）、marching cubes 提取网格（需要体素网格）。", "label": "为什么这样设计"}, {"b": "p", "t": "1）输出是每个像素的单一不透明表面深度，表示不了半透明或多层结构。2）射线的起点、near/far 以及找不到零交叉时如何处理（例如天空、空洞），论文都没说，而这些在户外数据上很关键。3）如果一步越过表面超过 τ，按 ω_k=0 的规则所有视角的权重可能都变成 0，s=0，变号检测会失效。这是实现时需要自己处理的边界情况。4）不要把 0.8 理解成学习率，它是 sphere tracing 的保守松弛系数。", "label": "容易误解的地方"}, {"b": "qa", "items": [{"q": "为什么这里用 sphere tracing 找零交叉，而不是像 NeRF 那样用体渲染积分出深度期望？", "a": "TSDF 编码的是“到表面的距离”，零等值面就是表面，直接找零点得到的是一个确定的表面位置。体渲染的深度期望在前景和背景的交界处，会给出介于两者之间、实际并不存在的深度，拿它去引导混合会导致边缘错位。另外，sphere tracing 按距离自适应步进，通常比密集采样积分需要更少的查询。"}]}, {"b": "sec", "h": "H9 · 时间反馈：上一帧新视角深度作为额外的 TSDF 输入（ω_tmp，η = 15）", "id": "walk-ha-h9", "sn": {"label": "论文位置", "t": "Sec. 3.2 第 3–4 段；A.2，Eq. (13)–(14)；Fig. 3"}}, {"b": "p", "t": "输入：上一帧的目标深度 𝒟^{t−1}、K 张差分掩码 M_k^t、上一帧的权重。输出：给 𝒟^{t−1} 这个虚拟视角的融合权重 ω_tmp^t。它和 K 个真实视角一起进入 Eq. (10)，得到更稳定的 𝒟^t。", "label": "这一步做什么", "mn": {"label": "需要的基础", "links": [{"k": "concept-v-temporal"}, {"k": "concept-f-prob"}, {"k": "concept-d-tsdf"}, {"k": "concept-i-warping"}, {"k": "adv-a-temporal-video"}]}}, {"b": "p", "t": "只融合 K 个最近视角有一个问题：视点一动，K 集合可能换掉一台相机，TSDF 深度就会轻微跳变。输入深度剩下的噪声也会让 𝒟^t 逐帧抖动。作者的办法是把自己上一帧的答案也当作一个“投票者”：由 𝒟^{t−1} 计算有符号距离，融合进 Eq. (10)（A.2）。可以把它理解成第 K+1 张深度图（它本来就位于目标相机的图像空间），对射线上的点计算 s=z−𝒟^{t−1}（或反号），再加权加入（d-tsdf、v-temporal）。\n\n这个投票者的权重怎么定？分三部分。（1）能不能信：把 K 张差分掩码用高斯 splat 前向投影到目标视角，逐通道取最大值得到 𝓜^t；动了的地方 1−𝓜≈0，历史被清空。（2）历史有多厚：ω_acc 是上一帧所有投票者的权重总和，历史越可靠，这一票越重，这和 KinectFusion 中体素权重的累积是同一个思路（f-prob）。（3）上限：η=15 是 𝒟^{t−1} 的最大融合权重，防止历史权重无限增长，否则画面会冻住，无法跟随真实变化。\n\n与 h5 不同，h5 在输入相机空间滤波深度，h9 在输出空间滤波几何。后者针对的正是 K 集合切换带来的跳变（Sec. 3.2）。", "mn": {"label": "类比", "t": "像开会时，上一次会议的决议也算一票，分量取决于上次有多少人赞成（ω_acc），但封顶 15 票，免得旧决议压倒一切。如果议题本身已经变了（场景动了，𝓜 接近 1），旧决议直接作废。"}}, {"b": "eqs", "eqs": [{"tex": "\\omega_{\\text{tmp}}^{t}=\\min\\!\\Big(\\beta\\cdot\\omega_{\\text{acc}}^{t}\\cdot\\max\\big(1-\\mathcal{M}^{t},0\\big),\\;\\eta\\Big)", "explain_zh": "Eq. (13)。𝓜^t 是把 K 张 M_k^t 用高斯 splat 到目标视角后逐通道取最大值得到的目标视角掩码；β 控制前几帧的相对贡献（与 Eq. (1) 的 β 同名；论文没有给出这里的取值，也没说明是否就是 0.6）；η=15 是上限。"}, {"tex": "\\omega_{\\text{acc}}^{t}=\\omega_{\\text{tmp}}^{t-1}+\\sum_{k}\\omega_{k}^{t-1}", "explain_zh": "Eq. (14)。累积权重等于上一帧历史项的权重加上一帧 K 个真实视角的权重之和。ω_k 本来依赖 3D 采样点，这里如何汇总成逐像素的量（例如取零交叉处的值），论文未说明。"}, {"tex": "\\omega_{\\text{tmp}}^{*}=\\frac{c\\,S}{1-c},\\qquad c=\\beta\\,(1-\\mathcal{M}),\\;\\; S=\\sum_k\\omega_k\\quad(\\text{当 } c<1 \\text{ 且结果}<\\eta)", "explain_zh": "我们推导的稳态（不是论文公式）：静止区域中各项不变时，递推 ω=c(ω+S) 收敛到 cS/(1−c)。静止区 𝓜≥0.6，所以 1−𝓜≤0.4。如果 β 也取 0.6，那么 c≤0.24，S=4 时 ω*≈1.26，远小于 η=15；要让上限 15 真正起作用，需要 c≥15/19≈0.79，即 β≳2。因此，如果论文希望上限 η=15 在静止区域真正生效，第二个 β 就应当大于 1；这只是我们的推断，论文没有给出数值。"}]}, {"b": "p", "t": "η=15；第二个 β 未公布。静止区若 𝓜=0.6，1−𝓜=0.4；运动区 𝓜=1，ω_tmp=0，历史被完全清空。论文没有说明未被任何视角覆盖的像素上 𝓜 取什么值（若取 0，则历史权重最大，相当于让历史去填洞）。", "label": "具体数字"}, {"b": "p", "t": "这让“时间一致”从输入端延伸到了输出几何本身，并且直接针对 K 集合切换造成的跳变。作者没有选择增大 K，因为那样会增加计算成本（Sec. 3.2；Fig. 8 显示耗时随 K 近似线性增长）。没有采用的方案：循环网络或记忆状态、时间损失、光流对齐的视频后处理去闪烁。", "label": "为什么这样设计"}, {"b": "p", "t": "1）𝒟^{t−1} 存放在目标图像空间。如果观看者在两帧之间移动了头部，需要先把它重投影（i-warping）到新视点，论文没有描述这一步。时间一致性评测（Table 1、Fig. 6）用的是固定测试相机，所以这个问题不会暴露。2）反馈回路可能把错误锁住，例如高光区域的错误深度被一直沿用；η 和掩码是仅有的“遗忘”机制。3）Eq. (13) 里的 β 取值未公布，不能默认等于 Eq. (1) 的 0.6。", "label": "容易误解的地方"}, {"b": "qa", "items": [{"q": "观看者把头向右平移了 5 cm，而场景完全静止。直接按论文公式使用 𝒟^{t−1} 会出现什么问题？应该怎么改？", "a": "𝒟^{t−1} 的每个像素对应的是旧视点的射线。新视点同一个像素的射线已经不同，直接拿来比较 z−𝒟^{t−1}，相当于把错位的深度当成历史，产生错误的 TSDF 值，边缘处可能出现拖影。正确的做法是先把 𝒟^{t−1} 反投影成 3D 点，用新目标位姿前向 warp（或 splat）得到新视点下的历史深度和有效掩码，再参与融合；更稳妥的做法是把历史保存在视点无关的表示里。"}]}, {"b": "sec", "h": "H10 · 几何引导混合网络的输入特征（9K+1 个通道）", "id": "walk-ha-h10", "sn": {"label": "论文位置", "t": "Sec. 3.3 第 2 段；A.4 第 1–8 项"}}, {"b": "p", "t": "输入：h3 的 K 组 (𝓘_k, α_k, 深度)、h8 的 𝒟^t，以及相机的几何关系。输出：一个 (9K+1)×H×W 的张量，K=4 时为 37 个通道，送入 4 层 U-Net Θ(·)。", "label": "这一步做什么", "mn": {"label": "需要的基础", "links": [{"k": "concept-l-cnn"}, {"k": "concept-i-blending"}, {"k": "concept-r-appearance"}, {"k": "concept-g-pinhole"}, {"k": "concept-l-encoding"}]}}, {"b": "p", "t": "输入可以分成三类。第一类是“候选颜色”：3K 通道的 warp 后 RGB。第二类是“这些候选靠不靠谱”：K 张深度（与 TSDF 深度 𝒟^t 对比，就能看出哪个视角在这个像素看到的是前景，哪个看到的是被遮挡的背景）、K 张 alpha（是不是空洞，是不是边缘）。第三类是“这个视角有多合适”，共 4K 通道的相机特征。这些与 Unstructured Lumigraph Rendering（i-blending）手工权重所用的几何量属于同一类（论文本身没有引用 ULR）：输入射线与目标射线的夹角越小，视角相关效应（r-appearance）的差异越小；输入射线与表面法线的夹角越大，说明是掠射观测，该视角的像素被拉伸得越厉害，越不可信；相机之间的距离和朝向夹角则是全局的相似度。\n\n可以把网络（l-cnn）要学的东西理解为一个“由几何条件决定的 ULR 式权重函数”。区别在于 ULR 用手写公式，这里用 U-Net 从数据中学，并且可以看到邻域上下文，比如边缘和空洞的形状。法线从 TSDF 深度图计算，这也是 TSDF 深度作为“几何引导”的第二个用途。", "mn": {"label": "类比", "t": "像给评委发的资料袋：每位评委（输入视角）交上自己的照片（RGB）、自己测到的距离（深度）、照片有没有缺角（alpha），再附上自己的座位信息（离主会场多远、朝向差多少、看表面的角度有多斜）。主持人（U-Net）拿着“标准答案的几何”（TSDF 深度）来决定每个人的意见算多少分。"}}, {"b": "eqs", "eqs": [{"tex": "C_{\\text{in}}=\\underbrace{3K}_{\\mathcal{I}_k}+\\underbrace{K}_{\\text{depth}_k}+\\underbrace{K}_{\\alpha_k}+\\underbrace{1}_{\\mathcal{D}^t}+\\underbrace{4K}_{\\text{camera feats}}=9K+1", "explain_zh": "通道数核对：K=4 时为 12+4+4+1+16=37，与 A.4 的“(9K+1)×H×W”一致。A.4 和 Sec. 3.3 的输入列表写的是 D_k^t（输入视角深度），而 Sec. 3.3 前文说提供给网络的是“forward-rendered depth maps {𝒟_k^t}”（warp 到目标视角的深度）。与目标像素逐像素对齐的只能是后者，论文记号前后不一致。"}, {"tex": "\\mathbf{n}(u,v)=\\frac{\\left(\\mathbf{X}_{u+1,v}-\\mathbf{X}_{u,v}\\right)\\times\\left(\\mathbf{X}_{u,v+1}-\\mathbf{X}_{u,v}\\right)}{\\left\\lVert\\left(\\mathbf{X}_{u+1,v}-\\mathbf{X}_{u,v}\\right)\\times\\left(\\mathbf{X}_{u,v+1}-\\mathbf{X}_{u,v}\\right)\\right\\rVert}", "explain_zh": "从 TSDF 深度图估计法线的常见做法：X_{u,v} 是用 𝒟^t 反投影得到的 3D 点，两个相邻差分向量做叉积后归一化。论文只写了“normals from the TSDF depth”，具体差分方式未说明。"}, {"tex": "f^{(5)}_k=\\mathbf{r}_k\\cdot\\mathbf{n},\\quad f^{(6)}_k=\\mathbf{r}_k\\cdot\\mathbf{r}_{\\text{tgt}},\\quad f^{(7)}_k=\\lVert\\mathbf{c}_k-\\mathbf{c}_{\\text{tgt}}\\rVert,\\quad f^{(8)}_k=\\mathbf{z}_k\\cdot\\mathbf{z}_{\\text{tgt}}", "explain_zh": "A.4 第 5–8 项相机特征。r_k 是从输入相机 k 指向该像素 3D 点的单位射线，n 是 TSDF 法线，r_tgt 是目标射线（A.4 原文为“target view direction”，也可能指目标相机的光轴方向，论文未细分）；c_k、c_tgt 是相机光心；z_k、z_tgt 是两台相机的光轴方向。f^{(5)} 和 f^{(6)} 逐像素变化；f^{(7)} 和 f^{(8)} 每个视角只有一个标量，在空间上复制成 H×W（A.4：“repeated spatially”）。"}]}, {"b": "p", "t": "K=4 时为 37 个通道。1352×1014 分辨率下，一帧输入张量为 37×1,370,928 个 float32，约 203 MB。训练裁剪块为 640×352，能被 2⁴=16 整除；如果“四层”对应 4 次 2× 下采样，这正好适配（论文没有说明层数的具体含义）。推理分辨率 1352×1014 的两条边都不能被 16 整除（1352/16=84.5，1014/16≈63.4），ENeRF-Outdoor 的 960×540 中 540 也不能，需要 padding 或裁剪，论文没有提到。", "label": "具体数字"}, {"b": "p", "t": "把这些几何线索显式地交给网络，网络不必自己从图像里推断相机关系，所以一个小网络就可能够用，这也可能是它能在 23 ms 内完成的原因之一。TSDF 深度作为输入，让网络有了“标准答案的几何”作为参照（Fig. 4c 与 4d 的对比）。没有采用的方案：纯距离加权（消融中的 Distance-based Blending）、不带几何引导的朴素混合网络（Fig. 4c，无法去除重影）、IBRNet 式的逐射线 Transformer（论文没有做这种架构对比，也没有报告 IBRNet 的耗时）。", "label": "为什么这样设计"}, {"b": "p", "t": "1）这是一个 2D 图像空间的网络，不在 3D 中推理。它看到的全部 3D 信息都被编码在这些通道里。2）论文没有给出 U-Net 的通道宽度、激活函数、归一化方式，以及输出权重是否经过 softmax 或 sigmoid，复现时需要自己决定。3）去掉 𝒟^t 输入（“No TSDF Guidance”，Sec. 4.5：“retrain our network without the guidance depth 𝒟^t as input”）时，法线特征 f^{(5)} 是否也一并去掉，论文没有交代。", "label": "容易误解的地方"}, {"b": "qa", "items": [{"q": "为什么“输入视角深度与 TSDF 深度的差”这条信息能帮助网络去除重影？网络能从哪些通道得到它？", "a": "重影来自某个视角在该像素看到的是错误的表面，例如前景物体边缘的飞点，或者本应被遮挡的背景。这时该视角 warp 过来的深度会明显偏离一致的 TSDF 深度。网络同时拿到 K 张 warp 深度和 𝒟^t，就能逐像素比较，把偏离大的视角权重压低。L_Depth 损失（h12）进一步把这种行为变成显式的训练目标。"}]}, {"b": "sec", "h": "H11 · 混合输出：K 个逐像素权重、一个背景权重和一张背景图", "id": "walk-ha-h11", "sn": {"label": "论文位置", "t": "Sec. 3.3，Eq. (4)–(5)；Fig. 11（A.8）"}}, {"b": "p", "t": "输入：U-Net 的输出，即 K 个权重图 w_k、1 个背景权重 w_BG 和 3 通道背景图 𝓘_BG，按输出内容推算共 K+4 个通道，K=4 时为 8 个（论文没有直接给出输出通道数）；另有 h3 的 𝓘_k 和 α_k。输出：最终图像 𝓘^t（3×H×W）。", "label": "这一步做什么", "mn": {"label": "需要的基础", "links": [{"k": "concept-i-blending"}, {"k": "concept-r-alpha"}, {"k": "concept-l-cnn"}, {"k": "concept-i-warping"}]}}, {"b": "p", "t": "前景部分是一个加权平均（r-alpha、i-blending）：每个视角在该像素的颜色，乘以它的覆盖率 α_k 和网络给的权重 w_k，再除以所有权重之和做归一化。乘 α_k 的作用是：空洞处 α_k≈0，这个视角自动退出，网络不必学习“空洞里别给权重”。\n\n但如果某个像素所有视角都看不到（去遮挡区域，所有 α_k 都约为 0），加权平均就没有意义了。这时由网络直接生成的背景图 𝓘_BG 顶上，由 w_BG 控制替换多少。所以这个网络不仅是“挑选器”，还带有一个小小的生成器（Fig. 11 展示了它填补空洞的效果）。\n\n论文 Eq. (4) 的分母漏写了求和号，照字面写成 Σ_k (𝓘_k α_k w_k)/(α_k w_k)，会退化为 Σ_k 𝓘_k，这显然不是本意。Eq. (6) 也有同样的问题。", "mn": {"label": "类比", "t": "调色时，每个颜料罐（视角）按“罐里还剩多少”（α_k）乘以“配方比例”（w_k）倒入，最后按总量归一化；如果所有罐子都空了（空洞），就用一块预先调好的底色（𝓘_BG）补上。"}}, {"b": "eqs", "eqs": [{"tex": "\\mathcal{I}_{\\text{FG}}^t=\\frac{\\sum_{k=1}^{K}\\mathcal{I}_k^t\\,\\alpha_k^t\\,w_k^t}{\\sum_{k=1}^{K}\\alpha_k^t\\,w_k^t}", "explain_zh": "修正后的 Eq. (4)。所有乘除都逐像素进行。原文分母写成 α_k^t·w_k^t，缺少 Σ_k，属于笔误。实现时分母应加一个 ε，防止 0/0。w_k 是否先经过 softmax 等归一化，论文没有说明；由于有显式分母，w_k 的整体缩放不影响结果。"}, {"tex": "\\mathcal{I}^t=\\left(1-w_{\\text{BG}}^t\\right)\\cdot\\mathcal{I}_{\\text{FG}}^t+w_{\\text{BG}}^t\\cdot\\mathcal{I}_{\\text{BG}}^t", "explain_zh": "Eq. (5)。w_BG∈ℝ^{H×W}，按用途应在 [0,1] 内（推测使用 sigmoid，论文未说明）；𝓘_BG 是网络直接输出的 RGB，属于生成出来的内容，不是真实像素。"}]}, {"b": "p", "t": "单像素算例（K=2）：𝓘_1=0.8，α_1=1，w_1=0.9；𝓘_2=0.4，α_2=0.5，w_2=0.6。分子=0.72+0.12=0.84，分母=0.9+0.3=1.2，𝓘_FG=0.70。若 w_BG=0.1、𝓘_BG=0.3，则 𝓘=0.9×0.70+0.1×0.3=0.66。输出通道数按推算为 K+4，K=4 时是 8。", "label": "具体数字"}, {"b": "p", "t": "预测权重而不是直接预测像素，输出基本由真实像素组合而成，锐度高；只要权重在时间上稳定，颜色也就稳定，这就是“几何引导”能传递到颜色上的途径。背景图用来补遮挡洞，替代 A.3 中被放弃的“放大高斯来补洞”。没有采用的方案（论文未逐一讨论，以下为我们的归纳）：直接回归 RGB（容易模糊和闪烁）、扩散或生成先验补洞（对在线系统太慢）、不设背景分支（空洞无法处理）。", "label": "为什么这样设计"}, {"b": "p", "t": "1）“输出全是真实像素”并不准确，𝓘_BG 是网络生成的，而且没有任何时间约束，大面积空洞处可能闪烁。2）Eq. (4) 和 Eq. (6) 的分母都漏了求和号。3）h3 光栅器输出的 𝓘_k 如果已经是预乘 alpha 的颜色（Σ c_i α_i T_i），再乘一次 α_k 就相当于把覆盖率计入了两次。论文没有交代颜色是否先除以 α 做了反预乘，复现时要留意。", "label": "容易误解的地方"}, {"b": "qa", "items": [{"q": "如果一个像素 4 个视角的 α_k 都是 0，Eq. (4) 和 (5) 会怎样？网络应该学到什么？", "a": "Eq. (4) 的分母为 0，𝓘_FG 没有定义（实现中靠 ε 得到一个接近 0 的值）。要输出合理的像素，网络必须让 w_BG≈1，完全使用背景图 𝓘_BG。L_Mask 损失（h12）正是在空洞区把 w_BG 往 1 推，把这个行为显式地监督出来。"}]}, {"b": "sec", "h": "H12 · 损失：0.8·L1 + 0.2·SSIM + 0.1·L_depth + 0.1·L_mask", "id": "walk-ha-h12", "sn": {"label": "论文位置", "t": "Sec. 3.3，Eq. (6)–(7)"}}, {"b": "p", "t": "输入：输出图 𝓘^t、真值图、TSDF 深度 𝒟^t、warp 深度 𝒟_k^t、权重、空洞掩码。输出：标量训练损失。", "label": "这一步做什么", "mn": {"label": "需要的基础", "links": [{"k": "concept-l-loss"}, {"k": "concept-v-metrics"}, {"k": "concept-d-tsdf"}, {"k": "concept-i-blending"}]}}, {"b": "p", "t": "L1 和 SSIM（l-loss、v-metrics）是图像重建损失的常见组合：L1 约束逐像素的颜色，SSIM 约束局部结构和对比度。\n\nL_Depth 是本文的关键一项。把同一组权重 w_k 用来混合 warp 深度 𝒟_k，要求结果等于 TSDF 深度 𝒟^t。换句话说，网络在给颜色分配权重时，必须同时让深度对上一致的几何。这样一来，给错误表面（比如遮挡背景）分配高权重就会被惩罚。论文称它是一种“soft regularization”，用已知的 TSDF 深度作为目标来引导对未知新视角图像的预测。注意 𝒟^t 本身是伪标签，不是真值。\n\nL_Mask 让背景权重 w_BG 在空洞处接近 1、其他地方接近 0（论文：w_BG 与“𝓘^t 中空区域的二值掩码”之间的平均绝对差）。\n\n整个损失里没有任何时间项。按 A.5 的描述，训练样本是 ScanNet 静态场景的不同帧，或 DyNeRF、Spaces 的同一时刻多视角，网络没有在“连续两帧输出”上受到任何约束（见 h13），时间稳定性来自输入端的几何模块。", "mn": {"label": "类比", "t": "老师改作业时，除了看答案（颜色）对不对，还要求写出解题过程（深度），并且过程要和标准步骤（TSDF 深度）一致。这样学生就不能靠蒙对答案过关。"}}, {"b": "eqs", "eqs": [{"tex": "\\mathrm{L}=0.8\\cdot\\mathrm{L}_1+0.2\\cdot\\mathrm{L}_{\\text{SSIM}}+0.1\\cdot\\mathrm{L}_{\\text{Depth}}+0.1\\cdot\\mathrm{L}_{\\text{Mask}}", "explain_zh": "Eq. (7)。L_1 是 𝓘^t 与真值图的平均绝对误差；L_SSIM 通常取 1−SSIM（论文只写了“SSIM loss”）；各项系数如上。"}, {"tex": "\\mathrm{L}_{\\text{Depth}}=\\frac{1}{HWK}\\left\\lVert\\mathcal{D}^t-\\frac{\\sum_{k}\\mathcal{D}_k^t\\,\\alpha_k^t\\,w_k^t}{\\sum_{k}\\alpha_k^t\\,w_k^t}\\right\\rVert_1", "explain_zh": "修正后的 Eq. (6)。与 Eq. (4) 一样，原文分母漏写 Σ_k。另外，求和之后残差只剩 H×W 个元素，归一化因子里却有 K，这是另一处小的不一致。深度的单位与 τ 一致（米）。"}, {"tex": "\\mathrm{SSIM}(x,y)=\\frac{(2\\mu_x\\mu_y+C_1)(2\\sigma_{xy}+C_2)}{(\\mu_x^2+\\mu_y^2+C_1)(\\sigma_x^2+\\sigma_y^2+C_2)}", "explain_zh": "SSIM 的定义。μ 是局部均值，σ² 是局部方差，σ_xy 是局部协方差，C_1、C_2 是防止除零的常数。它同时衡量亮度、对比度和结构的相似性。"}, {"tex": "\\mathrm{L}_{\\text{Mask}}=\\frac{1}{HW}\\sum_{\\mathbf{x}}\\left|w_{\\text{BG}}^t(\\mathbf{x})-B(\\mathbf{x})\\right|", "explain_zh": "B 是空洞的二值掩码。论文原文说的是“𝓘^t 中空区域的二值掩码”，更可能指所有 α_k 都约为 0 的像素，具体的判定阈值没有给出。"}]}, {"b": "p", "t": "系数 0.8 / 0.2 / 0.1 / 0.1 为论文给定值。以下量级是我们的粗略估计，论文没有报告各项损失的大小：若深度以米为单位、残差在 0.01 量级，颜色 L1 在 [0,1] 范围内约为 0.02，乘上系数后深度项在总损失中的量级并不小。", "label": "具体数字"}, {"b": "p", "t": "L_Depth 是把“几何一致”传递到“颜色权重一致”的训练手段。没有采用的方案：时间损失、光流 warping 一致性损失、感知损失（LPIPS）或对抗损失。论文没有解释为什么不用它们；一个合理的推测是前两者需要视频训练数据，而对抗损失可能引入幻觉细节。", "label": "为什么这样设计"}, {"b": "p", "t": "1）L_Depth 的目标是 TSDF 深度，属于伪标签。在高光等深度出错的区域，它会把网络推向错误的权重（对应 Fig. 9 的失败情形）。2）没有时间损失，所以网络自身带来的闪烁（尤其是 𝓘_BG）得不到约束。3）Eq. (6) 有两处书写问题：分母缺 Σ，归一化因子多了 K。", "label": "容易误解的地方"}, {"b": "qa", "items": [{"q": "如果把 L_Depth 的系数设为 0，同时保留 𝒟^t 作为网络输入，网络还会受到几何引导吗？", "a": "会，但只是“可以用”，不是“必须用”。网络能看到 𝒟^t，可以学着利用它，但只有颜色损失时，它可能会走捷径，只依赖颜色线索做出一个平均意义上更低的 L1。L_Depth 显式要求权重能复现一致的深度，这才把几何一致性强加到权重上。论文的消融只有“完全去掉 𝒟^t 输入”这一种，没有单独去掉 L_Depth，所以两者各自的贡献无法区分。"}]}, {"b": "sec", "h": "H13 · 训练数据、推理加速（TensorRT）与运行时间拆解", "id": "walk-ha-h13", "sn": {"label": "论文位置", "t": "Sec. 4 实现段；A.5；Sec. 4.5 末段与 Table 4；Fig. 8"}}, {"b": "p", "t": "输入：ScanNet、Google Spaces 和 3 个 DyNeRF 训练场景的多视角样本。输出：训练好的混合网络，以及它在 DyNeRF 1352×1014、K=4 条件下的分阶段耗时。", "label": "这一步做什么", "mn": {"label": "需要的基础", "links": [{"k": "concept-l-loss"}, {"k": "concept-l-cnn"}, {"k": "concept-v-codec"}, {"k": "adv-a-telepresence-sys"}]}}, {"b": "p", "t": "训练集是三类数据的组合。ScanNet 是手持 RGB-D 扫描的静态室内场景，深度来自传感器；先选一个目标帧，再从它前后 ±30 帧范围内选输入帧，但排除 [−4,4] 帧，避免选到离目标最近的帧。DyNeRF 的 3 个场景用来覆盖大基线立体情形；Google Spaces（即 DeepView 数据集，其第一作者 Flynn 也是 Quark 的第一作者）用来覆盖小基线情形。后两者都在固定时刻随机选择目标和输入视角，深度由 RAFT-Stereo 在人工挑选的立体对上生成（l-loss）。\n\n推理时，前向 splat 使用原版 3DGS 代码，TSDF 使用自定义 CUDA，混合网络用 Torch-TensorRT 编译加速（65 → 23 ms，约 2.8 倍）。把 Table 4 的三项加起来约 39 ms，约 25 fps；但这个数字不包括立体深度估计和磁盘读取（论文明确说所有耗时都不含磁盘读取），差分掩码也没有单独列出（v-codec、a-telepresence-sys）。", "mn": {"label": "类比", "t": "就像餐厅宣传“出餐只要 39 秒”，计时却从食材已经切好、备好放在台上开始；切菜（立体深度估计）那一步不在计时里。"}}, {"b": "eqs", "eqs": [{"tex": "T_{\\text{TRT}}=10+6+23=39\\ \\text{ms}\\;(\\approx 25.6\\ \\text{fps}),\\qquad T_{\\text{noTRT}}=10+6+65=81\\ \\text{ms}", "explain_zh": "按 Table 4 相加。正文写的是“即使不用 TensorRT，总时间也约 100 ms”，比表中三项之和 81 ms 多出约 20 ms，论文没有解释差额（可能包含了表中未列出的步骤）。正文把 GPS-Gaussian 的 143.4 ms 标注为“(Figure 5)”，而 Figure 5 是 EPI 视角一致性对比图，这个引用看起来有误。"}, {"tex": "N_{\\text{samples}}=150\\text{K}\\times 12=1.8\\times10^{6}\\ \\text{crops of }640\\times352", "explain_zh": "训练总共看过的裁剪块数量：迭代次数 × batch 大小。"}]}, {"b": "p", "t": "优化器写作 Adam，但引用的 [43] 是 Loshchilov & Hutter 的 AdamW 论文（Decoupled weight decay regularization），结合 weight decay 1e-5 来看，实际可能用的是 AdamW；学习率 2e-4，150K 次迭代，batch 12，裁剪块 640×352，在一块 NVIDIA Tesla V100 上训练。每次迭代随机选 1 个目标视角和 K=4 个输入视角。Table 4（DyNeRF，K=4）：splat 10 ms，TSDF 6 ms，混合 23 ms（TensorRT）或 65 ms。测试用的 GPU 型号未说明。Fig. 8：耗时随 K 近似线性增长，画质在 K≥4 后饱和（正文没有给出具体数值）。对照：VR 头显按 90 Hz 双眼计算，每只眼约 5.6 ms。", "label": "具体数字"}, {"b": "p", "t": "混合各种基线和场景类型的数据，是为了泛化，测试时不做任何微调（Sec. 4.2）；网络只用单时刻样本训练，时间一致性交给了几何模块。没有采用的方案：视频序列训练、加入时间损失的训练（论文没有讨论这些选择）。", "label": "为什么这样设计"}, {"b": "p", "t": "1）DyNeRF 的 3 个训练场景与测试场景（Sear Steak、Flame Steak）来自同一个数据集、同一套采集装置，存在一定的域内优势；IBRNet 和 ENeRF 用的是原作者的预训练权重，没有在这些数据上训练（FWD 和 GPSG 则因预训练模型无法泛化，用与本文相同的数据和策略重训，Sec. 4.1）。2）“实时”要打折扣：不含深度估计，单视角单眼 25 fps，双眼或多名观看者时成本成倍增加。3）正文的 ≈100 ms 与表格三项之和 81 ms 对不上，差额未解释。", "label": "容易误解的地方"}, {"b": "qa", "items": [{"q": "要把这个系统用在 90 Hz 的 VR 头显上（双眼），按 Table 4 的数字，还差多少？还有哪些开销没有算进去？", "a": "双眼各需一次 splat、TSDF 和混合，约 2×39=78 ms，而 90 Hz 的预算约为 11.1 ms，差了约 7 倍。这还没有算 22 路立体深度估计、差分掩码、网络传输、编解码、显示以及 motion-to-photon 延迟。实际部署需要大幅降低分辨率或 K、双眼共享计算（例如共用 TSDF），或者借助重投影和异步时间扭曲。"}]}, {"b": "sec", "h": "H14 · 如何读实验：PSNR/LPIPS 与 TCC/STED/SDT/SDV、EPI、消融", "id": "walk-ha-h14", "sn": {"label": "论文位置", "t": "Sec. 4.3（Eq. 8）；Table 1、2、3；Fig. 5、6、7、9；A.7"}}, {"b": "p", "t": "输入：渲染出的视频（测试相机的前 100 帧）和真值视频。输出：单帧保真度指标、时间一致性指标、视角一致性指标，以及定性可视化（EPI、x–t 切片）。", "label": "这一步做什么", "mn": {"label": "需要的基础", "links": [{"k": "concept-v-metrics"}, {"k": "concept-v-temporal"}, {"k": "concept-i-lightfield"}, {"k": "adv-a-temporal-video"}]}}, {"b": "p", "t": "单帧保真度（v-metrics）用 PSNR、SSIM、LPIPS 和 L1，逐帧和真值比较后取平均。它们对闪烁不敏感：两帧各自误差不大，但误差方向来回跳，PSNR 照样可以很高。\n\n时间一致性（v-temporal）用三个指标。TCC 比较“渲染视频的帧差图”与“真值视频的帧差图”之间的 SSIM：闪烁会在渲染帧差里制造真值中没有的变化，TCC 就会下降。STED（引用 Soundararajan & Bovik 的时空熵差，一种降参考视频质量指标）衡量时空统计特性与真值的差距，越低越好。SDT 是 L1 误差随时间的标准差。视角一致性用 SDV，即 L1 误差在不同测试视角之间的标准差。\n\n定性部分：EPI（i-lightfield）是让相机沿水平路径平移，逐个位置渲染新视角，再把各视角图像的同一行像素按相机位置 v 的顺序堆叠起来；每个 3D 点在 EPI 中是一条直线，斜率与 1/Z 成正比，线条断裂或跳变就说明视角不一致（Fig. 5）。x–t 切片是固定相机，把同一行像素按时间堆叠，闪烁会表现为噪点状的纹理（Fig. 6）。", "mn": {"label": "类比", "t": "PSNR 像是逐张批改照片，给每张打分；TCC、STED 像是把照片连成动画，看它抖不抖；EPI 像是把相机平移时的画面切成一片，看物体轨迹是一条顺滑的直线，还是一段段断开的锯齿。"}}, {"b": "eqs", "eqs": [{"tex": "\\mathrm{PSNR}=10\\log_{10}\\frac{\\mathrm{MAX}^2}{\\mathrm{MSE}}", "explain_zh": "MAX 是像素的最大值（1 或 255），MSE 是均方误差。每提高 1 dB，MSE 降为 10^{-0.1}≈0.79 倍。"}, {"tex": "\\mathrm{TCC}=\\frac{1}{T-1}\\sum_{t=1}^{T-1}\\mathrm{SSIM}\\!\\left(\\left|\\mathcal{I}^{t}-\\mathcal{I}^{t+1}\\right|,\\;\\left|I^{t}-I^{t+1}\\right|\\right)", "explain_zh": "Eq. (8)。𝓘 是渲染帧，I 是真值帧，T 是帧数（这里为 100）。它在 SSIM 意义上比较两个视频的帧差图，越高越好；原始版本来自 Zhang et al. 2019 的视频深度工作，本文把它改成了彩色图版本。"}, {"tex": "\\mathrm{SDT}=\\mathrm{std}_{t}\\big(\\mathrm{L1}_t\\big),\\qquad \\mathrm{SDV}=\\mathrm{std}_{v}\\big(\\mathrm{L1}_v\\big)", "explain_zh": "沿用 Long et al. 2021：L1_t 是第 t 帧的平均 L1 误差，L1_v 是第 v 个测试视角的平均 L1 误差，std 是标准差（论文原文只说“L1 误差在所有帧 / 所有视角上的标准差”，具体聚合方式是我们的理解）。它们衡量误差是否稳定，而不是误差有多小。"}, {"tex": "x(v)=x_0-\\frac{f\\,v}{Z}\\;\\Rightarrow\\;\\frac{\\partial x}{\\partial v}=-\\frac{f}{Z}", "explain_zh": "EPI 的几何原理：相机沿水平方向平移 v 时，深度为 Z 的点在图像上的横坐标 x 线性移动，斜率为 −f/Z，所以在 x–v 图上每个点是一条直线，越近的点斜率绝对值越大。"}]}, {"b": "p", "t": "DyNeRF：PSNR 31.17 对 ENeRF 29.51，+1.66 dB，MSE 约降到 0.68 倍；STED 68.76 对 76.14；TCC 0.872 对 0.867。D3DMV：32.58 对 27.79，+4.79 dB，MSE 约降到 0.33 倍；STED 15.85 对 137.0。ENeRF-Outdoor：24.01 对 25.79，−1.78 dB，MSE 约增加到 1.5 倍；STED 44.49 对 32.31，本文更差。消融（数值对应 DyNeRF）：去掉 TSDF 引导后 PSNR 31.16（−0.01 dB），STED 95.42（完整模型 68.76，下降约 28%）。", "label": "具体数字"}, {"b": "p", "t": "要证明“一致性”，必须引入保真度以外的指标，因此同时报告时间指标、视角指标和定性切片。作者没有使用基于光流的 warping error（视频一致性工作中常见的指标），也没有做用户研究或头显实测。", "label": "为什么这样设计"}, {"b": "p", "t": "1）SDT 和 SDV 只衡量误差的离散程度：一个在所有帧、所有视角上都同样模糊的方法，SDT 和 SDV 也会很低。2）TCC 的提升很小（0.872 对 0.867），STED 的提升更明显。3）正文说在 ENeRF-Outdoor 上“shows a marked improvement over the baselines”（指演员边缘和背景去遮挡区域的定性效果），但定量上并不占优：Table 2 四项保真度指标中只有 LPIPS 最好；Table 1 中 TCC 和 SDV 最好，STED 和 SDT 则不如 ENeRF。4）Table 3 的数值与 DyNeRF 上的完整模型一致，说明消融应当是在 DyNeRF 上做的；论文没有报告误差条或多次运行，0.01 dB 的差异不能解读为有意义。5）ENeRF-Outdoor 的指标是在 480×270 这种很低的分辨率下计算的（为减轻该数据集同步和颜色标定问题的影响）。", "label": "容易误解的地方"}, {"b": "qa", "items": [{"q": "为什么说这篇论文的 TSDF 引导主要是一致性工具，而不是画质工具？用 Table 3 的数字说明。", "a": "去掉 TSDF 引导后，PSNR 从 31.17 变为 31.16，LPIPS 从 0.191 变为 0.197，TCC 从 0.872 变为 0.869，单帧保真度几乎不变；STED 却从 68.76 恶化到 95.42（差约 39%）。所以 TSDF 引导的作用主要是减少时间上的不一致（论文 Sec. 4.5 也说“most significant gains in temporal consistency”）。画质提升的大头来自“有一个可学习的混合网络”本身：Distance-based Blending 只有 26.08 dB，No Blending 只有 24.64 dB。"}]}, {"b": "sec", "h": "配套文章", "id": "parts"}, {"b": "toc", "groups": [{"items": [{"k": "wpart-ha-tensor-trace", "t": "Ha et al. · 张量追踪", "en": "", "s": "逐阶段列出 15 个关键张量的形状与含义。"}, {"k": "wpart-ha-experiments", "t": "Ha et al. · 阅读实验", "en": "", "s": "论文里 10 组实验分别怎么读、真正说明了什么。"}, {"k": "wpart-ha-tradeoffs", "t": "Ha et al. · 设计权衡", "en": "", "s": "7 个关键设计选择：换来了什么，付出了什么。"}, {"k": "wpart-ha-faq", "t": "Ha et al. · 常见问题", "en": "", "s": "初读时最常问的 11 个问题。"}, {"k": "wpart-ha-exercises", "t": "Ha et al. · 练习", "en": "", "s": "6 道由浅入深的动手练习。"}, {"k": "wpart-ha-glossary", "t": "Ha et al. · 论文术语", "en": "", "s": "读这篇论文会遇到的 31 个术语。"}]}]}], "toc": true, "series": {}}}</script>
<script>
(function () {
  "use strict";
  // ================= lib: DOM, text and math helpers shared by every page =================
  // A page script defines rich(text) (inline cross-links); paras() and eqList() call it.
  var DATA;
  try { DATA = JSON.parse(document.getElementById("data").textContent); } catch (e) { DATA = {}; }
  var meta = DATA.meta || {};

  // ---------- DOM helpers: all text goes through textContent; external links are https-only ----------
  function safeUrl(u) { if (typeof u !== "string") return null; var s = u.trim(); return /^https:\/\/[^\s"'<>]+$/i.test(s) ? s : null; }
  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (!Object.prototype.hasOwnProperty.call(attrs, k)) continue;
      var v = attrs[k];
      if (v === null || v === undefined || v === false) continue;
      if (k === "class") n.className = v;
      else if (k === "text") n.textContent = String(v);
      else if (k === "href") { var u = safeUrl(v); if (u) { n.setAttribute("href", u); n.setAttribute("target", "_blank"); n.setAttribute("rel", "noopener noreferrer"); } }
      else if (k.slice(0, 2) === "on" && typeof v === "function") n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, String(v));
    }
    (kids || []).forEach(function (c) { if (c === null || c === undefined || c === false) return; n.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return n;
  }
  var SVGNS = "http://www.w3.org/2000/svg";
  function sv(tag, attrs, kids) {
    var n = document.createElementNS(SVGNS, tag);
    if (attrs) for (var k in attrs) {
      if (!Object.prototype.hasOwnProperty.call(attrs, k)) continue;
      var v = attrs[k];
      if (v === null || v === undefined || v === false) continue;
