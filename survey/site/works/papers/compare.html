:root {

.sidenote, .marginnote {

8×512（Quark）或 432×768（Quark+），高频细节来自 IBR 取样和上采样；2K 下 LPIPS 明显变差", "评测为 DyNeRF 1352×1014、ENeRF-Outdoor 渲染 960×540（指标在 480×270 计算）、D3DMV 640×360。前向 splat 和 TSDF 都在目标分辨率上运行"], ["网络规模与训练", "较大的多尺度 Transformer/CNN 混合网络。在 Spaces、RFF、Shiny、SWORD（全为静态）上训练 600K 步，16×A100，batch 16，损失为 10·L1+LPIPS", "小型 4 层 U-Net。在 ScanNet 和 DyNeRF 3 个场景、Google Spaces 上训练 150K 次迭代，单块 V100，batch 12，损失为 0.8 L1+0.2 SSIM+0.1 L_Depth+0.1 L_Mask。没有视频序列和时间损失"], ["评测数据与指标", "RFF、Shiny、N3DV（动态，只有 1 个目标相机，每 10 帧评一帧）、DL3DV、Mip-NeRF360、T&T、Deep Blending、Spaces。只有 PSNR、SSIM、LPIPS，没有时间指标", "DyNeRF（只有 Sear/Flame Steak 前 100 帧）、ENeRF-Outdoor、D3DMV。除 PSNR、SSIM、LPIPS、L1 外，还有 TCC、STED（时间）和 SDT、SDV（视角）一致性指标，并给出 EPI 和 x–t 切片的定性结果"], ["对比基线", "ENeRF、GPNR、SIMPLI（在 RFF+IBRNet 数据上重训），另外引用 Zip-NeRF、3DGS 等逐场景方法的原文数字。未比较 pixelSplat、MVSplat、GPS-Gaussian、LVSM 等", "IBRNet、ENeRF（使用官方预训练权重）、FWD、GPS-Gaussian（重训）。与 4DGS、4K4D、MVSplat 只有定性比较，未比较 Quark、IGS、3DGStream 等"], ["关键结果", "N3DV 31.57 dB，ENeRF 为 29.86；DL3DV 31.31，高于 Zip-NeRF 的 31.22；T&T 第一；Deep Blending 23.61，远低于 3DGS 的 30.04（视角覆盖不足）", "DyNeRF PSNR 31.17，ENeRF 29.51；STED 68.76，ENeRF 76.14。D3DMV 领先幅度最大（32.58 对 27.79）。ENeRF-Outdoor 上 PSNR、SSIM、L1 和 STED 都输给 ENeRF（24.01 对 25.79）"], ["消融揭示的真正贡献", "IBR 输出贡献最大（改为直接输出 RGB 时 −1.23 dB）；render-and-refine 和 cross-attention 各贡献约 0.7 dB；layer collapse 以不到 0.2 dB 的代价换来超过 2 倍的加速；射线编码几乎没有作用", "主要提升来自“有一个可学习的融合网络”（distance blending 为 26.08，完整模型为 31.17）。标题所强调的 TSDF 引导对 PSNR 只贡献 0.01 dB，主要改善 STED（95.4 → 68.8）；时间滤波同样只改善 STED"], ["典型失败模式", "时间闪烁；视角覆盖不足时出现硬边伪影（而非模糊）；对曝光、白平衡、焦距差异和标定误差敏感；深度被限制在等视差带内，近/远平面设错就会失败", "高光或镜面导致深度错误，进而破坏一致性（EPI 断裂）；遮挡处留下空洞和 flying pixels；差分掩码把光照、火焰、曝光变化误判为运动，无纹理的运动物体又被判为静态，留下重影；域外户外场景明显退化；依赖公制尺度"], ["开源与可复现性", "没有代码和权重；附录给出结构表（表8、表9），但学习率日程、上采样因子等数值自相矛盾", "没有代码和权重；立体对由人工挑选，多个超参数（第二个 β 等）未公布，运行时间正文与表格不一致，存在引用错误"], ["最擅长", "用一张 GPU 从少量已标定视图实时得到高分辨率、高质量的单帧新视角，泛化到多种静态和动态场景；深度复杂、遮挡多的场景仍然稳健", "在固定阵列上以很低的算力做稳定的视频输出：减少闪烁和视角跳变；把显式几何一致性作为可插拔模块（TSDF 只需 6 ms）"]], "wide": true}, {"b": "sec", "h": "两种设计哲学", "id": "philosophy"}, {"b": "p", "t": "两篇论文都属于“可泛化、无需逐场景优化、实时新视角合成”这一大类，都选择 IBR（直接复用真实输入像素）而不是让网络生成像素，也都放弃了持久的全局 3D 表示，改为按目标视角逐帧即时重建。它们的分歧在于把“学习”放在哪里、优先保证什么。\n\nQuark 的思路是“把几何和融合都交给一个学出来的迭代求解器，追求单帧质量与分辨率”。它继承 Google 从 Stereo Magnification（MPI）、DeepView（learned gradient descent）到 Immersive Light Field Video（layered mesh）的一条线：分层半透明表示加 render-and-refine，把“多视角立体匹配、可见性推理、视角融合”都放进一个端到端网络内部隐式完成。工程上的核心是计算量的分配：由粗到细地“升分辨率、降层数”，用 One-to-many attention 让融合对视角数接近 O(1)，再用 IBR 和 post-activation 上采样把 288×512 的内部解算“放大”到 1080p 甚至 2K。它回答的问题是：前馈网络能否在实时条件下逼近逐场景优化的 NeRF/3DGS 的单帧质量。时间维度被有意放在问题之外。在领域谱系中，它处于“MPI/LDM 分层表示 + 可泛化 IBR”这一支的顶点，与 ENeRF（可泛化体渲染）、GPNR/IBRNet（Transformer IBR）属同一代对手，同时正好位于 2024 年之后两条新主线的交叉口：一条是 feed-forward 3DGS（pixelSplat、MVSplat、GPS-Gaussian、GS-LRM），一条是几乎不带 3D 偏置的大模型 NVS（LVSM）。Quark 团队自己的后续工作（LVT、SplatVoxel/Fuse-and-Refine、Online Neural Space Time Memory）也转向了持久的 3DGS 表示和时间记忆，说明 Quark 的“逐视角、无状态”设计在视频和远程临场场景中已经被团队自己视为需要补足的短板。\n\nHa et al. 的思路则是“几何显式、学习最小化，把一致性作为第一目标”。它来自经典的实时远程临场系统：image-based TSDF 直接沿用 Project Starline；相机阵列固定、逐帧在线处理的假设，与 Fusion4D、Tele-Aloha 这类“稀疏相机加全局几何”系统一脉相承。深度由外部立体网络提供，Gaussian 参数被刻意设成解析常数而非网络预测，时间一致性靠手工设计的差分掩码滤波和深度回灌，网络只负责一件事：在几何引导下决定每个像素取哪个视角、哪里需要补洞。它回答的问题是：怎样让 feed-forward IBR 的输出在相机移动和时间推移时不闪、不跳。为此它接受了较低的单帧上限和对深度质量的强依赖。在领域谱系中，它位于“传统实时 3D 重建系统（TSDF 融合）”与“可泛化神经渲染（ENeRF/GPS-Gaussian）”之间的桥接位置，是少数把时间和视角一致性做成量化指标（TCC/STED/SDT/SDV）来评测的在线 NVS 工作。后续的 IGS、StreamSplat、LiveStre4m、NSTM 等工作则用有状态的持久表示、视频扩散或学习型记忆，去替代它的启发式时间机制。\n\n一句话概括：Quark 是“学习驱动、质量优先、无状态”，Ha et al. 是“几何驱动、一致性优先、弱状态”。前者代表图形学中神经渲染一侧的上限，后者代表远程临场系统一侧对稳定性的工程诉求。"}, {"b": "sec", "h": "互补性", "id": "complementarity"}, {"b": "p", "t": "两者的长处和短处几乎正好互补。\n\n1. 单帧质量与时序稳定性互补。Quark 的强项是单帧：迭代 render-and-refine 让深度复杂、遮挡多的场景也能得到锐利边界，在 N3DV/DyNeRF 同类数据上约 31.6 dB，且不需要外部深度。但它没有任何时间机制，官方承认会闪烁。Ha et al. 的强项是 STED/SDV 这类一致性指标，但单帧质量受限于外部立体深度和一个 4 层 U-Net，在域外户外数据上 PSNR 还不如 ENeRF。它的 TSDF 引导与时间滤波几乎不影响 PSNR，却能把 STED 从 95 降到 69。这说明它的一致性模块基本“正交”于单帧质量，可以叠加到一个更强的单帧渲染器上。\n\n2. 几何来源互补。Quark 的几何在网络内部学出，不需要深度传感器或立体网络，但几何被限制在各自的视差带里，每帧、每个视角各算一次，没有跨时间、跨视角共享。Ha et al. 的几何显式且可跨视角融合、可回灌到下一帧，但质量完全取决于外部深度，并且没有计入深度估计的开销。一个自然的结合是：用 Quark 式网络为每个输入视角或关键视角输出深度或 LDM，作为 TSDF 的输入（替代 RAFT-Stereo），同时把 TSDF 的一致性深度作为 Quark 下一次 render-and-refine 的初始化或条件，以替代它从常数特征开始的学习式初始化。\n\n3. 融合机制互补。Quark 的 One-to-many attention 不依赖视角顺序、支持可变视角数，而且对视角数接近 O(1)，正好能解决 Ha et al. 的两个问题：U-Net 按通道拼接导致 K 固定、顺序敏感，以及 K 集合切换引起的跳变（可以对更多视角做软加权，而不是硬性选最近 K 个）。反过来，Ha et al. 的 L_Depth（让融合权重复现一致深度）和背景图补洞，可以缓解 Quark 在视角覆盖不足时的硬边伪影。\n\n4. 评测体系互补。Quark 的评测覆盖面广（8 个数据集、高分辨率、与逐场景方法比较），但没有时间指标；Ha et al. 引入了 TCC、STED、SDT、SDV 和 EPI、x–t 切片等一致性评测，但数据集只有 3 个、序列只有 100 帧。二者合并，才构成一个面向远程临场的完整评测方案。\n\n5. 需要注意的冲突点。Quark 的“为每个目标视角过拟合几何”本质上以牺牲跨视角一致性来换取单视角质量（例如用来近似反射）；而 Ha et al. 用一个共享的 TSDF 去约束所有视角，会抹平这种视角相关的“作弊”。两者的结合必须在“视角相关外观”和“几何一致性”之间折中，例如只用 TSDF 约束 density 和深度，而让 blend weights 保持视角相关。"}, {"b": "sec", "h": "取两者之长的临场系统草图", "id": "sketch"}, {"b": "p", "t": "目标场景：固定多相机舱体或房间阵列（6–12 路 RGB，可选 RGB-D），双向实时通话，观看端为 3D 显示器或 VR/AR 头显。下面是按阶段组织的草图。\n\n阶段 0：采集与标定（发送端）。硬件同步触发、统一锁定曝光和白平衡，这是 Quark 与 Ha et al. 共同的敏感点。离线标定之后加在线标定监控：用重投影残差或类似 Tele360 的可微 LM 做小幅在线校正，残差超阈值时降级到更稳妥的渲染模式。对颜色做跨相机的 CCM 校正，以减轻 IBR 硬边。\n\n阶段 1：时间一致的逐视角深度（发送端）。不再使用逐帧 RAFT-Stereo 加手调差分掩码，改用时间一致的视频立体（如 Stereo Any Video、PPMStereo 类方法）或 RGB-D 传感器，输出深度和逐像素置信度，并计入延迟预算。Ha et al. 的颜色差分掩码只保留为廉价的静态区锁定和兜底。\n\n阶段 2：一致的全局几何代理。在一个共享的“规范视点”（例如观看者头部位姿的预测值，或阵列中心）上做 image-based TSDF 融合，用全部 N 个相机按置信度软加权，而不是硬性只取最近 K 个，以消除集合切换带来的跳变。上一帧的 TSDF 深度先按视点变化重投影，再回灌融合，补上 Ha et al. 未处理的“头动加场景动”情形。若算力允许，把它升级为一个持久的稀疏体素或 3DGS 状态（参考 SplatVoxel/Fuse-and-Refine、IGS、StreamSplat），让“之前可见、现在被遮挡”的背景能长期保留。\n\n阶段 3：Quark 式精化渲染器（服务端或接收端 GPU）。以目标视角 LDM 为输出，但用阶段 2 的一致深度初始化 LDM 的层位置（替代 Quark 的常数特征和等视差 anchor 初始化），这样可以减少迭代次数（Quark 的消融显示去掉前两次迭代只损失约 0.08 dB，却快 17%）。跨视角融合使用 One-to-many attention，支持 6–12 路可变输入，并保留射线编码，以便对眼睛、皮肤高光等做视角相关的权重分配。最终输出仍为 IBR blend weights 加 over 合成，保证 1080p 以上的纹理锐度。\n\n阶段 4：时间与一致性约束（训练期）。训练数据加入多视角人像视频（如 MVHumanNet++ 一类），损失在 Quark 的 10·L1+LPIPS 之外，加入 Ha et al. 的 L_Depth（渲染深度与 TSDF 一致）、基于光流的 temporal warping loss，以及相邻视点的一致性损失；网络中加入轻量时间状态，例如把上一帧 LDM 特征重投影后作为附加输入，或者采用 NSTM 式的 TTT 记忆。补洞在 Ha et al. 的背景图之上，引入长时背景记忆，大面积遮挡在预算允许时再交给少步数的因果视频生成模型（参考 RealCam）。\n\n阶段 5：传输与多视点输出。有两种部署方案。方案 A 是云端或发送端按接收者头部位姿渲染，再推送 2D（或双目）视频：带宽最低，但 motion-to-photon 延迟包含一个往返，需要接收端做 late-stage reprojection（利用 LDM 或深度做 ATW 式补偿）。方案 B 是把紧凑的几何和外观（Gaussian maps 或 LDM 加图像）经视频编码器推流到接收端本地渲染（参考 Tele360、GS-SCNet、D-FCGS）：对双目和多观看者更友好，但接收端需要 GPU。对于双目 HMD，左右眼可以共享阶段 1–2 以及 Quark 前几级的低分辨率计算，只在最后一两级和 IBR 渲染上分开，同时显式约束左右眼一致。\n\n阶段 6：评测与监控。除 PSNR、SSIM、LPIPS 外，必须报告 STED/TCC/SDV、flicker 或 tOF、长序列（分钟级）漂移、阵列外自由头动轨迹、双目一致性、端到端 motion-to-photon 延迟、带宽、显存，以及在目标硬件（消费级或边缘 GPU）上的帧率，并做人像专项测试（头发、眼神接触、快速手势、自遮挡）和用户研究。\n\n大致预算（参考两篇论文的数字，未经实测，仅作量级估计）：视频立体约 10–20 ms，TSDF 约 6 ms，经过 TSDF 初始化后缩减的 Quark 渲染器约 20–30 ms（A100 级），IBR 合成约 1–2 ms，加上编解码和网络传输后，单视角 30 fps 可行，双目 72–90 Hz 仍需进一步蒸馏或专用硬件。"}, {"b": "sec", "h": "共同盲区", "id": "blindspots"}, {"b": "ul", "items": ["都没有计量端到端系统延迟：Quark 的 30 fps 只是 A100 上的网络推理，Ha et al. 的约 39 ms 不含立体深度估计。二者都没有报告采集、编码、传输、显示的 motion-to-photon 延迟，也没有显存和消费级 GPU 的数据，而这些正是远程临场可用性的决定因素。", "都是“每个目标视角完整跑一遍”的逐视角架构：双目 HMD 的成本翻倍，多个观看者或光场显示时线性增长。两篇论文都没有讨论立体渲染、左右眼一致性或多观看者扩展，与“一次重建、多次渲染”的持久表示（3DGS 等）存在根本差异。", "都没有人像或人体专项评测：没有面部、头发、眼神接触、快速手势、自遮挡等远程临场核心内容的测试，也没有用户研究或头显实测。", "都强依赖精确标定和严格同步：Quark 在标定误差下会产生硬边，Ha et al. 在标定误差下出现前向投影错位。二者都没有在线标定、同步漂移检测或无位姿的能力，而后续工作（LiveStre4m、Tele360、AnySplat）正在去掉这一前提。", "都对跨相机的曝光、白平衡差异敏感：IBR 凸组合无法修正颜色不一致，导致接缝和闪烁（Quark 自述；Ha et al. 的 ENeRF-Outdoor 就因颜色标定问题被迫降分辨率评测）。", "都只用最近的少量输入视角（Quark 为 8，Ha et al. 为 K=2–4），并在目标视点移动时硬性切换输入集合，导致跳变；二者都没有滞回或软加权机制，视角覆盖不足时（阵列外外推、大角度转头）的表现没有被系统评测。", "都没有真正的视角相关外观模型：输出是输入颜色的凸组合，高光和镜面反射只能近似（被烘焙或以重影出现），镜面区域还会反过来破坏几何估计。", "都没有长时记忆：Quark 完全无状态，Ha et al. 只有至多 40% 的短时递归滤波。“之前可见、现在被遮挡”的内容无法被利用，大面积遮挡只能靠网络补洞或直接留空，长序列漂移也未检验。", "都没有带宽、压缩与传输架构分析：渲染放在发送端、云端还是接收端，需要传输哪些数据（K 路全分辨率 RGB 加深度，还是紧凑几何），两篇论文都没有讨论。", "评测规模都偏小、统计不充分：动态评测的数据集和序列很短（Quark 的 N3DV 只有 1 个目标相机、每 10 帧评一帧；Ha et al. 只评前 100 帧），消融只做了单次运行、没有误差条；二者都未与同期的 feed-forward 3DGS 或流式 4D Gaussian 方法（GPS-Gaussian 对 Quark，IGS/3DGStream 对 Ha et al.）以及彼此做定量比较。", "都没有开源代码和权重，论文中还存在数值不一致（Quark 的训练日程与上采样因子；Ha et al. 的运行时间正文约 100 ms 与表格合计约 39 ms 不符），独立复现门槛高，结论缺少第三方验证。", "都没有涉及隐私、安全与信任问题：远程临场会传输人脸和人体的三维数据，两篇论文都没有讨论数据保护、深度伪造风险或内容认证。"]}], "toc": false, "series": {"prev": {"k": "anchor-ha"}, "next": {"k": "summary"}, "up": {"u": "works/papers/index.html", "t": "Papers 目录"}}}}</script>
<script>
(function () {
  "use strict";
  // ================= lib: DOM, text and math helpers shared by every page =================
  // A page script defines rich(text) (inline cross-links); paras() and eqList() call it.
  var DATA;
  try { DATA = JSON.parse(document.getElementById("data").textContent); } catch (e) { DATA = {}; }
  var meta = DATA.meta || {};

          return el("li", null, [el("p", null, rich(q.q)), el("details", null, [el("summary", { text: "答案" }), el("p", null, rich(q.a))])]);
        }))];
        case "res": return [refsList(arr(b.items).map(function (r) {
          return { left: TY[r.type] || r.type || "", url: r.url, t: r.title, gloss: r.note_zh };
        }))];
        case "refs": return [refsList(arr(b.items), b.cls)];
        case "toc": return tocGroups(b.groups, cur().querySelector("h2") ? "h3" : "h2");
        case "table": return [el("div", { class: "table-wrap" + (b.wide ? " fullwidth" : "") }, [el("table", { class: "booktabs" + (b.cls ? " " + b.cls : "") }, [
          el("thead", null, [el("tr", null, arr(b.head).map(function (h) { return el("th", { text: h }); }))]),
          el("tbody", null, arr(b.rows).map(function (r) { return el("tr", null, arr(r).map(function (c) { return cell("td", c); })); }))
        ])])];
        case "timeline": return [el("ul", { class: "refs timeline" }, arr(b.items).map(function (x) {
          return el("li", null, [el("span", { class: "yr", text: str(x[0]) }), el("div", null, rich(x[1]))]);
        }))];
        case "kv": return [el("table", { class: "kv" }, [el("tbody", null, arr(b.items).map(function (x) {
          return el("tr", null, [el("th", { text: x[0] }), el("td", null, rich(x[1]))]);
        }))])];
        case "mtoc": return [marginToc(b.items)];
        case "slot": return typeof SLOTS[b.name] === "function" ? [SLOTS[b.name](b)] : [];
        default: return [];
      }
    }
    // Long articles: a table of contents at the top of the margin (a folding list on phones).
    function marginToc(items) {
      var d = el("details", { class: "mtoc" }, [el("summary", { text: "本文目录" }), el("ol", null, arr(items).map(function (x) { return el("li", null, [part(x)]); }))]);
      var wide = window.matchMedia("(min-width: 761px)");
      d.open = wide.matches;
      return d;
    }
    arr(PG.body).forEach(function (b) {
      if (b.b === "sec") {
        box = el("section", { id: b.id || null });
        if (b.h) box.appendChild(heading("h2", { t: b.h, sn: b.sn }));
        art.appendChild(box);
        return;
      }
      render(b).forEach(function (n) { if (n) cur().appendChild(n); });
    });

    var S = PG.series || {};
    if (S.prev || S.next || S.up) {
      var nav = el("nav", { class: "series", "aria-label": "同系列" });
      nav.appendChild(el("div", { class: "prev" }, S.prev ? [el("small", { text: "上一篇" }), part(S.prev)] : []));
      nav.appendChild(el("div", { class: "up" }, S.up ? [part(S.up)] : []));
      nav.appendChild(el("div", { class: "next" }, S.next ? [el("small", { text: "下一篇" }), part(S.next)] : []));
      art.appendChild(nav);
    }
  })();

  finishPage();
})();
</script>
