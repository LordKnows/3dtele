:root {
  --bg: #fffff8;
  --ink: #111111;
  --ink-2: #3c3c36;
  --muted: #74746a;

  --note: "et-book-note", "LXGW WenKai", "Kaiti SC", "STKaiti", "KaiTi", "et-book", serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --side: clamp(12rem, 21vw, 17rem);
  --gap: 2.75rem;
  --main: calc(100% - var(--side) - var(--gap));
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161614; --ink: #e2e0d6; --ink-2: #c3c1b6; --muted: #979589; --rule: #34332e; --rule-2: #4d4b44; --accent: #e8836f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161614; --ink: #e2e0d6; --ink-2: #c3c1b6; --muted: #979589; --rule: #34332e; --rule-2: #4d4b44; --accent: #e8836f;
  color-scheme: dark;
}

/* ---------- base ---------- */
* { box-sizing: border-box; }
html { font-size: 16px; -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--serif); font-size: 1.15625rem; line-height: 1.85;
  font-kerning: normal; font-variant-numeric: lining-nums;
  /* Space between Chinese and Latin text where the source has none; squeeze adjacent CJK punctuation

  text-autospace: normal; text-spacing-trim: normal;
  overflow-wrap: break-word;
  padding-top: env(safe-area-inset-top, 0px);
}
[hidden] { display: none !important; }

/* ---------- top bar ---------- */
.topbar { border-bottom: 1px solid var(--rule); }

.brand { font-size: 1rem; text-decoration: none; letter-spacing: .02em; white-space: nowrap; }

.menus { list-style: none; margin: 0; padding: 0; display: flex; gap: 1.6rem; }
.menu { position: relative; }
.menu-btn, .theme-btn, .burger {

  color: var(--ink-2); line-height: 3.1rem;
}
.menu-btn:hover, .theme-btn:hover, .burger:hover, .menu.open > .menu-btn { color: var(--accent); }
.menu.cur > .menu-btn { color: var(--ink); box-shadow: inset 0 -1px 0 var(--ink); }
.drop {
  display: none; position: absolute; left: -1rem; top: 100%; z-index: 40; min-width: 13rem;
  list-style: none; margin: 0; padding: .45rem 0; background: var(--bg); border: 1px solid var(--rule);

.drop a:hover, .drop a:focus-visible { color: var(--accent); }

.theme-btn { margin-left: auto; }
.burger { display: none; }

/* ---------- article column + margin ---------- */
main { display: block; }
.art { max-width: 67rem; margin: 0 auto; padding: 2.6rem 1.5rem 3rem; counter-reset: sidenote-counter; }
.art > *, .art section > * { width: var(--main); }
.art > section { width: 100%; }
.art .fullwidth { width: 100%; }
section { padding-top: .6rem; }

.crumbs { font-size: .86rem; color: var(--muted); letter-spacing: .01em; }

h1, h2, h3 { font-family: var(--serif); color: var(--ink); text-wrap: balance; }

.subtitle { font-family: "et-book", var(--note); font-style: italic; font-size: 1.45rem; line-height: 1.3; color: var(--ink-2); margin-top: .35rem; }

.art ol, .art ul { margin: .6rem 0 0; padding-left: 1.6em; }
.art li + li { margin-top: .45rem; }

/* Equations: display math in the text column, scrolling sideways on narrow screens. */
.eqs { display: block; }
.eq + .eq { margin-top: 1.6rem; }
.math-block { overflow-x: auto; overflow-y: hidden; margin: .4rem 0 .6rem; padding: .2rem 0; font-size: 1rem; }
.math-block mjx-container { margin: 0 !important; }

/* ---------- side notes & margin notes (floated into the right margin) ---------- */
.sidenote, .marginnote {
  float: right; clear: right; position: relative;
  width: var(--side); margin-right: calc(-1 * (var(--side) + var(--gap))); margin-top: .3rem; margin-bottom: .6rem;
  font-family: var(--note); font-size: .88rem; line-height: 1.6; color: var(--ink-2); text-align: left;
  font-style: normal; font-weight: 400; letter-spacing: 0;
}
h3 .sidenote { margin-top: .2rem; }
.sidenote-number { counter-increment: sidenote-counter; }
.sidenote-number::after, .sidenote::before { font-family: "et-book-osf", var(--serif); position: relative; vertical-align: baseline; }
.sidenote-number::after { content: counter(sidenote-counter); font-size: .75rem; top: -.55em; left: .08em; color: var(--ink-2); }
.sidenote::before { content: counter(sidenote-counter) " "; font-size: .8rem; top: -.4em; }
.note-label { font-family: var(--serif); font-weight: 600; font-size: .82rem; color: var(--muted); margin-right: .5em; }
.marginnote .note-label { display: block; margin: 0 0 .1rem; }
input.margin-toggle { display: none; }
label.sidenote-number { display: inline; cursor: default; }
label.margin-toggle:not(.sidenote-number) { display: none; }

/* ---------- quiz, further reading, series ---------- */
.quiz details { margin-top: .3rem; }
.quiz summary { font-family: var(--note); font-size: .92rem; color: var(--muted); cursor: pointer; list-style: none; display: inline-block; }
.quiz summary::-webkit-details-marker { display: none; }
.quiz summary::before { content: "+ "; font-family: "et-book", var(--serif); }
.quiz details[open] summary::before { content: "− "; }
.quiz summary:hover { color: var(--accent); }
.quiz details > p { margin-top: .3rem; padding-left: 1rem; border-left: 1px solid var(--rule); color: var(--ink-2); }

/* Reference lists: a narrow label column (kind / year) and a hanging text column. */
.art ul.refs { list-style: none; padding-left: 0; }
.refs li { display: grid; grid-template-columns: 2.8rem minmax(0, 1fr); column-gap: .5rem; line-height: 1.6; }
.refs li > :not(.kind):not(.yr) { grid-column: 2; }
.refs .kind, .refs .yr { grid-column: 1; font-family: var(--note); font-size: .86rem; color: var(--muted); padding-top: .12rem; }
.refs .yr { font-family: "et-book-osf", var(--serif); font-size: .95rem; padding-top: .05rem; }
.refs .en { font-family: "et-book", var(--serif); font-style: italic; color: var(--muted); font-size: .92rem; line-height: 1.5; }
.refs .gloss { font-family: var(--note); font-size: .88rem; color: var(--ink-2); margin-top: .1rem; }
.art .refs li + li { margin-top: .75rem; }
.art .papers li + li { margin-top: .35rem; }
/* Without a label column the list is a plain stack (no grid, so nothing can land in a phantom second column). */
.refs.noleft li { display: block; }
.refs.wide-kind li { grid-template-columns: 6.2rem minmax(0, 1fr); }
.refs .used { font-family: var(--note); font-size: .82rem; color: var(--muted); margin-left: .5em; }
.refs.terms .plain-t { font-weight: 600; }
.refs.terms .en { display: inline; margin-left: .6em; }
.timeline li { line-height: 1.7; }
.art .timeline li + li { margin-top: .4rem; }

/* ---------- blocks: lede, run-in labels, notes ---------- */
.lede { margin-top: 1.6rem; color: var(--ink-2); }
.run-in { font-weight: 600; color: var(--ink); }
p.note { font-family: var(--note); font-size: .9rem; color: var(--muted); margin-top: .1rem; }
h2 .en, h3 .en { font-family: "et-book", var(--serif); font-style: italic; font-weight: 400; color: var(--muted); margin-left: .6em; font-size: .92em; }
h2 a, h3 a { text-decoration-color: var(--rule); }
.quiz-h { font-family: var(--note); font-size: .88rem; color: var(--muted); margin-top: 1.4rem; }
.quiz-h + ol.quiz { margin-top: .2rem; }

/* Index pages: a table of contents instead of a card grid. */
.art ol.toc { list-style: none; padding-left: 0; margin-top: .4rem; }
.art ol.toc > li + li { margin-top: .85rem; }
.toc-t { line-height: 1.55; }
.toc-t .en { font-family: "et-book", var(--serif); font-style: italic; color: var(--muted); margin-left: .6em; font-size: .95em; }
.toc-meta { font-family: var(--note); font-size: .82rem; color: var(--muted); margin-left: .7em; white-space: nowrap; }
.toc-s { font-family: var(--note); font-size: .9rem; line-height: 1.65; color: var(--ink-2); margin-top: .1rem; }
.toc-lede { font-family: var(--note); color: var(--ink-2); font-size: .95rem; }
h2.toc-h, h3.toc-h { margin-bottom: .3rem; }

/* Tables: booktabs rules (top, under the header, bottom), no vertical lines, no fills. */
.table-wrap { overflow-x: auto; margin: 1rem 0; }
table.booktabs { border-collapse: collapse; width: 100%; font-size: .9rem; line-height: 1.6; border-top: 1.5px solid var(--ink); border-bottom: 1.5px solid var(--ink); }
table.booktabs th { text-align: left; font-weight: 600; padding: .45rem .7rem .35rem 0; border-bottom: 1px solid var(--ink); white-space: nowrap; vertical-align: bottom; }
table.booktabs td { padding: .45rem .9rem .45rem 0; vertical-align: top; border-top: 1px solid var(--rule); }
table.booktabs tbody tr:first-child td { border-top: 0; }
table.rank td { white-space: nowrap; font-variant-numeric: tabular-nums; }
table.rank td:nth-child(2) { white-space: normal; }
.art table.kv { border-collapse: collapse; margin: .6rem 0; font-size: .95rem; width: auto; }
table.kv th { text-align: left; font-weight: 400; color: var(--muted); padding: .25rem 1.2rem .25rem 0; vertical-align: top; min-width: 5em; max-width: 12em; font-family: var(--note); }
table.kv td { padding: .25rem 0; vertical-align: top; }

/* Long articles: the table of contents sits at the top of the margin. */
/* It sits in a full-width section, so it floats into the margin without a negative offset. */
details.mtoc {
  float: right; clear: right; width: var(--side); margin-right: 0; margin-bottom: 1rem;
  font-family: var(--note); font-size: .86rem; line-height: 1.55; color: var(--ink-2);
}
details.mtoc summary { font-family: var(--serif); font-weight: 600; font-size: .82rem; color: var(--muted); list-style: none; cursor: default; }
details.mtoc summary::-webkit-details-marker { display: none; }
.art details.mtoc ol { list-style: none; padding: 0; margin: .3rem 0 0; }
.art details.mtoc li + li { margin-top: .25rem; }
details.mtoc a { text-decoration: none; }
details.mtoc a:hover { text-decoration: underline; }

/* Tools: search and filters with underlined inputs. */
.tool { margin-top: 1rem; }
.filters { display: flex; flex-wrap: wrap; gap: .6rem 1.6rem; align-items: baseline; font-family: var(--note); font-size: .92rem; color: var(--muted); }
.filters label { display: inline-flex; gap: .5rem; align-items: baseline; }
.filters input, .filters select {
  font: inherit; color: var(--ink); background: transparent; border: 0; border-bottom: 1px solid var(--rule-2); border-radius: 0;
  padding: .15rem .1rem; min-width: 7rem;
}
.filters input[type="search"] { min-width: 14rem; }
.filters select { max-width: 16rem; }
.filters input:focus, .filters select:focus { outline: none; border-bottom-color: var(--accent); }
.filters select option { background: var(--bg); color: var(--ink); }
.filters .count { margin-left: auto; font-family: var(--mono); font-size: .8rem; }
table.gl td.en { font-family: "et-book", var(--serif); width: 20%; }
table.gl .abbr { color: var(--muted); }

table.db td.y { font-family: "et-book-osf", var(--serif); white-space: nowrap; }
table.db td.t { min-width: 16rem; }
table.db td.t small { display: block; color: var(--muted); font-size: .8rem; line-height: 1.45; margin-top: .15rem; }

table.db td.tags span { display: block; }
table.db .tier.milestone { color: var(--ink); font-weight: 600; }
table.db td.s { min-width: 18rem; color: var(--ink-2); }
table.db td.n { min-width: 12rem; font-size: .82rem; color: var(--ink-2); }

/* Figures: the pipeline diagram and the timeline of classic papers, drawn in ink with one accent for interaction. */
figure { margin: 1.4rem 0; }
svg a { text-decoration: none; }
.diagram-wrap, .lanes-wrap { position: relative; overflow-x: auto; }
svg.diagram { width: 100%; min-width: 760px; height: auto; display: block; font-family: var(--note); }
svg.diagram .dnode rect { fill: var(--bg); stroke: var(--ink-2); stroke-width: 1; }
svg.diagram .dnode rect.data { stroke-dasharray: 4 3; }
svg.diagram .dnode:hover rect, svg.diagram .dnode:focus rect { stroke: var(--accent); stroke-width: 1.5; }
svg.diagram .dnode:focus { outline: none; }
svg.diagram text { fill: var(--ink); }
svg.diagram text.k { font-family: var(--mono); font-size: 10px; fill: var(--muted); }
svg.diagram text.t { font-family: var(--serif); font-size: 13px; font-weight: 600; }
svg.diagram text.s { font-size: 11px; fill: var(--ink-2); }
svg.diagram .dedge { fill: none; stroke: var(--ink-2); stroke-width: 1; }
svg.diagram .dedge.fb { stroke-dasharray: 4 3; }
svg.diagram .dhead { fill: var(--ink-2); }
svg.diagram .dloop { fill: none; stroke: var(--rule-2); stroke-dasharray: 2 3; }
svg.diagram .dlabel { font-size: 12px; fill: var(--muted); }
svg.diagram .dnote { font-size: 11px; fill: var(--muted); }
svg.diagram a.dnode:hover .dnote { fill: var(--accent); }
svg.lanes { width: 100%; min-width: 720px; height: auto; display: block; font-family: var(--note); }
svg.lanes .grid { stroke: var(--rule); stroke-width: 1; }
svg.lanes .axis { font-family: "et-book-osf", var(--serif); font-size: 12px; fill: var(--muted); }
svg.lanes .lane-l { font-size: 12px; fill: var(--ink-2); }
svg.lanes .brk { stroke: var(--muted); fill: none; }
svg.lanes .hit { fill: transparent; }
svg .dot { fill: var(--ink); }
svg .dot.hollow { fill: var(--bg); stroke: var(--ink-2); stroke-width: 1.2; }
svg.lanes a.m:hover .dot, svg.lanes a.m:focus .dot { fill: var(--accent); stroke: var(--accent); }
svg.lanes a.m:focus { outline: none; }
.vtip { position: absolute; z-index: 20; max-width: 20rem; padding: .45rem .7rem; background: var(--bg); border: 1px solid var(--rule-2); font-family: var(--note); font-size: .82rem; line-height: 1.5; pointer-events: none; }
.vtip b { display: block; font-family: "et-book", var(--serif); font-weight: 400; font-size: .92rem; }
.vtip small { display: block; color: var(--muted); }
.vtip span { color: var(--accent); }
figcaption { font-family: var(--note); font-size: .85rem; color: var(--muted); margin-top: .4rem; }
figcaption svg { vertical-align: -1px; }

.series { display: grid; grid-template-columns: 1fr auto 1fr; gap: 1rem; align-items: end; margin-top: 3.2rem; padding-top: 1rem; border-top: 1px solid var(--rule); font-size: .98rem; }
.series small { display: block; font-family: var(--note); font-size: .8rem; color: var(--muted); }
.series .up { text-align: center; font-size: .88rem; }
.series .up a { color: var(--muted); }
.series .next { text-align: right; }

.site-foot { max-width: 67rem; margin: 0 auto; padding: 1.2rem 1.5rem 2.5rem; font-size: .82rem; color: var(--muted); }

/* ---------- hover preview ---------- */

角立体（MVS）的任务是：已知 N 张图像的内外参（通常来自 SfM/COLMAP，见 g-sfm），为某个参考视角估计稠密深度图，再把多张深度图融合成点…"}, "adv-a-learned-stereo": {"u": "basics/advanced/a-learned-stereo.html", "t": "从深度立体匹配到立体基础模型", "e": "Deep stereo to stereo foundation models", "m": "Advanced topics", "s": "双目立体匹配处理的是一对已经做过立体校正（rectification）的左右图像。"}, "adv-a-temporal-video": {"u": "basics/advanced/a-temporal-video.html", "t": "视频时间一致性方法", "e": "Temporal consistency methods for video", "m": "Advanced topics", "s": "很多视频处理都是逐帧做的：逐帧估计深度、逐帧做新视角合成、逐帧风格化。"}, "concept-d-flow": {"u": "basics/foundations/d-flow.html", "t": "光流、场景流与图像 warping", "e": "Optical flow, scene flow & image warping", "m": "Foundations · M3 深度估计与三维重建", "s": "光流是相邻两帧之间每个像素的二维位移，场景流是与之对应的三维运动。", "n": "光流、场景流与图像 warping"}, "concept-d-mono": {"u": "basics/foundations/d-mono.html", "t": "单目与视频深度估计", "e": "Monocular & video depth estimation", "m": "Foundations · M3 深度估计与三维重建", "s": "从单张图像或单路视频预测深度，依靠的是从海量数据中学到的先验，而不是几何三角化。", "n": "单目与视频深度估计"}, "concept-d-mvs": {"u": "basics/foundations/d-mvs.html", "t": "多视角立体（MVS）与平面扫描", "e": "Multi-view stereo & plane sweep", "m": "Foundations · M3 深度估计与三维重建", "s": "把双目推广到 N 个视角：先假设一组深度（一叠平面），把所有视角 warp 到参考视角或目标视角，看哪个深度上各视角的颜色或特征最一致。", "n": "多视角立体（MVS）与平面扫描"}, "concept-d-stereo": {"u": "basics/foundations/d-stereo.html", "t": "双目立体匹配：从 SGM 到 RAFT-Stereo", "e": "Stereo matching: from SGM to RAFT-Stereo", "m": "Foundations · M3 深度估计与三维重建", "s": "在校正后的左右图同一行上找对应像素得到视差 d，再用 Z=fb/d 换算成深度。", "n": "双目立体匹配"}, "concept-f-image": {"u": "basics/foundations/f-image.html", "t": "数字图像：颜色、采样、插值与金字塔", "e": "Digital images: color, sampling, interpolation & pyramids", "m": "Foundations · M1 数学与图像基础", "s": "图像是对连续光场的离散采样。", "n": "数字图像"}, "concept-f-optim": {"u": "basics/foundations/f-optim.html", "t": "优化、鲁棒估计与梯度下降", "e": "Optimization, robust estimation & gradient descent", "m": "Foundations · M1 数学与图像基础", "s": "相机标定、光束法平差、立体匹配、网络训练，乃至 Quark 的网络结构本身，做的都是同一件事：定义一个误差，然后沿着让误差变小的方向迭代。", "n": "优化、鲁棒估计与梯度下降"}, "concept-g-depth": {"u": "basics/foundations/g-depth.html", "t": "深度、视差与逆深度采样", "e": "Depth, disparity & inverse-depth sampling", "m": "Foundations · M2 相机与多视几何", "s": "双目中深度与视差成反比（Z = f·b/d），所以固定的像素匹配误差会变成随 Z² 增长的深度误差。", "n": "深度、视差与逆深度采样"}, "concept-g-epipolar": {"u": "basics/foundations/g-epipolar.html", "t": "对极几何、三角化与单应", "e": "Epipolar geometry, triangulation & homography", "m": "Foundations · M2 相机与多视几何", "s": "两台相机看同一个点时，该点在第二张图中只可能出现在一条极线上（x'ᵀF x = 0）；有了对应点就能三角化出 3D 位置；空间中的一个平面在两张图之间诱导的映射是一个 3×3 单应。", "n": "对极几何、三角化与单应"}, "concept-g-pinhole": {"u": "basics/foundations/g-pinhole.html", "t": "针孔相机模型：内参、外参、投影与反投影", "e": "Pinhole camera: intrinsics, extrinsics, projection & unprojection", "m": "Foundations · M2 相机与多视几何", "s": "针孔模型先用外参 [R|t] 把世界点变到相机坐标系，再用内参 K 投到像素；反过来，只有像素时只能确定一条射线，像素加上深度才能唯一确定一个 3D 点。", "n": "针孔相机模型"}, "concept-g-rig": {"u": "basics/foundations/g-rig.html", "t": "多相机阵列：标定、同步与卷帘快门", "e": "Multi-camera rigs: calibration, synchronization & rolling shutter", "m": "Foundations · M2 相机与多视几何", "s": "多相机阵列需要让所有相机在三方面对齐：几何上（内外参）、颜色上（曝光、白平衡、响应曲线）、时间上（同一时刻曝光）。", "n": "多相机阵列"}, "concept-g-sfm": {"u": "basics/foundations/g-sfm.html", "t": "运动恢复结构（SfM）与光束法平差", "e": "Structure-from-Motion & bundle adjustment", "m": "Foundations · M2 相机与多视几何", "s": "SfM 只从一组照片出发，同时求出每台相机的内外参和一组稀疏 3D 点：先做特征匹配和几何验证，再逐步注册相机、三角化新点，并反复用光束法平差（BA）最小化重投影误差。", "n": "运动恢复结构（SfM）与光束法平差"}, "concept-i-layered": {"u": "basics/foundations/i-layered.html", "t": "分层表示：MPI、LDI 与分层深度图（LDM）", "e": "Layered representations: MPI, LDI & layered depth maps", "m": "Foundations · M5 基于图像的渲染（IBR）", "s": "分层表示把场景切成若干张带透明度的图层。", "n": "分层表示"}, "concept-i-psv": {"u": "basics/foundations/i-psv.html", "t": "平面扫描体与学习式视图合成", "e": "Plane-sweep volumes & learned view synthesis", "m": "Foundations · M5 基于图像的渲染（IBR）", "s": "平面扫描体（PSV）的做法是：把每张输入图按一组假设的深度平面重投影到目标相机（或参考相机），堆叠成“深度 × 高 × 宽 × 视角”的张量。", "n": "平面扫描体与学习式视图合成"}, "concept-i-warping": {"u": "basics/foundations/i-warping.html", "t": "基于深度的渲染：前向/后向 warping、空洞与飞点", "e": "Depth-image-based rendering: forward/backward warping, holes & flying pixels", "m": "Foundations · M5 基于图像的渲染（IBR）", "s": "有了逐像素深度，就能把一张图“搬”到新视角。", "n": "基于深度的渲染"}, "concept-l-attention": {"u": "basics/foundations/l-attention.html", "t": "注意力机制与 Transformer", "e": "Attention & Transformers", "m": "Foundations · M6 深度学习基础（3D 视觉视角）", "s": "注意力用 query 与一组 key 的缩放点积经 softmax 得到权重，再对 value 做加权平均。", "n": "注意力机制与 Transformer"}, "concept-l-cnn": {"u": "basics/foundations/l-cnn.html", "t": "卷积网络、残差块与 U-Net", "e": "CNNs, residual blocks & U-Net", "m": "Foundations · M6 深度学习基础（3D 视觉视角）", "s": "卷积用共享的小核在图像上滑动，提取局部特征；残差连接让深层网络容易训练；U-Net 用编码器下采样、解码器上采样和同尺度跳连，同时获得大感受野和像素级精度。", "n": "卷积网络、残差块与 U-Net"}, "concept-l-iterative": {"u": "basics/foundations/l-iterative.html", "t": "学习式迭代细化与展开优化", "e": "Learned iterative refinement & unrolled optimization", "m": "Foundations · M6 深度学习基础（3D 视觉视角）", "s": "做法是把“渲染当前估计 → 与观测比较 → 更新”这个迭代优化过程，展开成固定的几步，每步的更新量由神经网络给出，整体端到端训练。", "n": "学习式迭代细化与展开优化"}, "concept-l-loss": {"u": "basics/foundations/l-loss.html", "t": "损失函数与训练实践", "e": "Losses & training practice", "m": "Foundations · M6 深度学习基础（3D 视觉视角）", "s": "损失函数决定网络眼中什么是“好图像”：L2 偏向均值（结果偏糊），L1 偏向中位数，SSIM 关注局部结构，LPIPS 用深度特征度量感知差异。", "n": "损失函数与训练实践"}, "concept-r-reps": {"u": "basics/foundations/r-reps.html", "t": "三维表示总览：点、网格、体素、隐式场、高斯", "e": "3D representations: points, meshes, voxels, implicit fields, Gaussians", "m": "Foundations · M4 图形学与渲染基础", "s": "点、网格、体素、隐式场、高斯和分层图像，在存储、渲染、编辑和时间一致性上各有取舍。", "n": "三维表示总览"}, "concept-r-volume": {"u": "basics/foundations/r-volume.html", "t": "体渲染方程与离散化", "e": "The volume rendering equation & its discretization", "m": "Foundations · M4 图形学与渲染基础", "s": "体渲染把场景看成一团既发光又吸收的介质。", "n": "体渲染方程与离散化"}, "concept-v-metrics": {"u": "basics/foundations/v-metrics.html", "t": "图像与视频质量指标", "e": "Image & video quality metrics", "m": "Foundations · M8 视频、时间一致性、评测与系统", "s": "单帧指标（PSNR、SSIM、LPIPS、FLIP）回答“这一帧像不像真值”；时间与视角指标（warping error、tOF、TCC、STED、SDT/SDV、EPI）回答“误差随时间、随视点是否稳定”。", "n": "图像与视频质量指标"}, "concept-v-temporal": {"u": "basics/foundations/v-temporal.html", "t": "时间一致性、闪烁与时域滤波", "e": "Temporal consistency, flicker & temporal filtering", "m": "Foundations · M8 视频、时间一致性、评测与系统", "s": "逐帧独立预测时，每帧误差互不相关，这些误差会直接表现为闪烁。", "n": "时间一致性、闪烁与时域滤波"}, "theme-t-fusion-capture": {"u": "basics/classics/t-fusion-capture.html", "t": "深度融合、表演捕捉与临场系统（1996–2024）", "e": "", "m": "Classics", "s": "本主题收录 25 篇论文。范围：Curless & Levoy, KinectFusion, DynamicFusion, Fusion4D, Holoportation, Montage4D, Starlin…"}, "theme-t-neural-rendering": {"u": "basics/classics/t-neural-rendering.html", "t": "神经渲染与新视角合成（2016–2025）", "e": "", "m": "Classics", "s": "本主题收录 26 篇论文。范围：DeepStereo, Stereo Magnification, LLFF, DeepView, Immersive LF Video, SRN, NPBG, FVS/SVS…"}}, "page": {"id": "theme-t-deep-geometry", "head": {"title": "深度学习几何：光流、立体、MVS、单目深度、匹配（2015–2025）", "sub": "Classics", "meta": ["25 篇论文"], "epigraph": "", "prereqs": [], "lede": "", "minutes": 27}, "body": [{"b": "sec", "h": null, "id": "list"}, {"b": "p", "t": "本主题收录 25 篇论文，按年份排列。范围：FlowNet, PWC-Net, RAFT, GC-Net, PSMNet, RAFT-Stereo, MVSNet, CasMVSNet, MiDaS, DPT, Depth Anything, SuperPoint/SuperGlue, LoFTR, DUSt3R, MASt3R, VGGT"}, {"b": "slot", "name": "classics-chart"}, {"b": "refs", "items": [{"left": "2015", "u": "#classic-35", "t": "FlowNet: Learning Optical Flow with Convolutional Networks", "tag": ""}, {"left": "2015", "u": "#classic-37", "t": "Computing the Stereo Matching Cost with a Convolutional Neural Network (MC-CNN)", "tag": ""}, {"left": "2016", "u": "#classic-41", "t": "A Large Dataset to Train Convolutional Networks for Disparity, Optical Flow, and Scene Flow Estimation (SceneFlow / DispNet)", "tag": ""}, {"left": "2017", "u": "#classic-47", "t": "FlowNet 2.0: Evolution of Optical Flow Estimation with Deep Networks", "tag": ""}, {"left": "2017", "u": "#classic-48", "t": "Unsupervised Monocular Depth Estimation with Left-Right Consistency (Monodepth)", "tag": ""}, {"left": "2017", "u": "#classic-50", "t": "End-to-End Learning of Geometry and Context for Deep Stereo Regression (GC-Net)", "tag": "必读"}, {"left": "2018", "u": "#classic-54", "t": "SuperPoint: Self-Supervised Interest Point Detection and Description", "tag": ""}, {"left": "2018", "u": "#classic-55", "t": "PWC-Net: CNNs for Optical Flow Using Pyramid, Warping, and Cost Volume", "tag": ""}, {"left": "2018", "u": "#classic-56", "t": "Pyramid Stereo Matching Network (PSMNet)", "tag": ""}, {"left": "2018", "u": "#classic-57", "t": "MVSNet: Depth Inference for Unstructured Multi-view Stereo", "tag": "必读"}, {"left": "2020", "u": "#classic-73", "t": "RAFT: Recurrent All-Pairs Field Transforms for Optical Flow", "tag": "必读"}, {"left": "2020", "u": "#classic-74", "t": "SuperGlue: Learning Feature Matching with Graph Neural Networks", "tag": ""}, {"left": "2020", "u": "#classic-75", "t": "Towards Robust Monocular Depth Estimation: Mixing Datasets for Zero-shot Cross-dataset Transfer (MiDaS)", "tag": "必读"}, {"left": "2020", "u": "#classic-76", "t": "Cascade Cost Volume for High-Resolution Multi-View Stereo and Stereo Matching (CasMVSNet)", "tag": "必读"}, {"left": "2020", "u": "#classic-79", "t": "Consistent Video Depth Estimation", "tag": ""}, {"left": "2021", "u": "#classic-84", "t": "Vision Transformers for Dense Prediction (DPT)", "tag": ""}, {"left": "2021", "u": "#classic-88", "t": "LoFTR: Detector-Free Local Feature Matching with Transformers", "tag": ""}, {"left": "2021", "u": "#classic-94", "t": "RAFT-Stereo: Multilevel Recurrent Field Transforms for Stereo Matching", "tag": "必读"}, {"left": "2021", "u": "#classic-101", "t": "Multi-view Depth Estimation using Epipolar Spatio-Temporal Networks (ESTDepth)", "tag": ""}, {"left": "2024", "u": "#classic-122", "t": "Depth Anything: Unleashing the Power of Large-Scale Unlabeled Data", "tag": "必读"}, {"left": "2024", "u": "#classic-123", "t": "DUSt3R: Geometric 3D Vision Made Easy", "tag": "必读"}, {"left": "2024", "u": "#classic-126", "t": "Grounding Image Matching in 3D with MASt3R", "tag": ""}, {"left": "2025", "u": "#classic-146", "t": "VGGT: Visual Geometry Grounded Transformer", "tag": "必读"}, {"left": "2025", "u": "#classic-147", "t": "FoundationStereo: Zero-Shot Stereo Matching", "tag": ""}, {"left": "2025", "u": "#classic-148", "t": "Video Depth Anything: Consistent Depth Estimation for Super-Long Videos", "tag": ""}], "cls": "papers"}, {"b": "sec", "h": "论文", "id": "papers"}, {"b": "h3", "t": "FlowNet: Learning Optical Flow with Convolutional Networks", "id": "classic-35", "url": "https://arxiv.org/abs/1504.06852", "sn": {"label": "与重点论文的联系", "t": "两篇重点论文都没有直接使用 FlowNet，关系是间接的。Ha et al. 的深度来自 RAFT-Stereo，而 RAFT-Stereo“先建相关体、再迭代更新”的结构可以追溯到 FlowNet 的相关层。弄懂“特征内积就是匹配代价”这一步，才能理解 Ha 的输入深度是怎么算出来的，以及它为什么会在高光、弱纹理区域失败：这些区域的匹配代价没有明显的峰值。"}}, {"b": "note", "t": "2015 · Alexey Dosovitskiy, Philipp Fischer（共同一作）, Eddy Ilg, ..., Daniel Cremers, Thomas Brox（Univ. Freiburg / TU München） · ICCV 2015 · Semantic Scholar 引用 4737 · 难度：入门"}, {"b": "p", "t": "它第一次证明，光流这种逐像素的对应问题可以交给 CNN 做端到端的监督学习。文中的“相关层”（correlation layer）把两张图的特征按不同位移逐一做点积，后来的 PWC-Net、RAFT、DispNetC、RAFT-Stereo 以及 MVS 代价体都从这里演化而来。它还用合成的 Flying Chairs 数据集开创了一种做法：只在合成数据上训练，然后直接泛化到真实数据。", "label": "为什么有影响力", "mn": {"label": "相关概念与专题", "links": [{"k": "concept-d-flow"}, {"k": "concept-d-stereo"}, {"k": "concept-l-cnn"}, {"k": "concept-f-image"}]}}, {"b": "p", "t": "论文提出两种编解码结构。FlowNetS 把两张图直接拼接后输入网络；FlowNetC 用共享权重的编码器分别提取两张图的特征，再经过相关层。相关层的直觉是：特征越相似，两个像素越可能是同一个点。公式为 \\(c(\\mathbf x_1,\\mathbf x_2)=\\langle f_1(\\mathbf x_1),f_2(\\mathbf x_2)\\rangle\\)，其中 \\(f_1,f_2\\) 是两张图在像素 \\(\\mathbf x_1,\\mathbf x_2\\) 处的特征向量，⟨·,·⟩ 表示内积；原文在一个小 patch 内对内积求和，并且只比较有限的位移范围，以控制计算量。作者合成了约 2.3 万对（22,872 对）Flying Chairs 图像（椅子贴图在背景图前飞过），训练出的网络在 Sintel 和 KITTI 上精度有竞争力，速度为 5–10 fps。", "label": "主要贡献"}, {"b": "h3", "t": "Computing the Stereo Matching Cost with a Convolutional Neural Network (MC-CNN)", "id": "classic-37", "url": "https://arxiv.org/abs/1409.4326", "sn": {"label": "与重点论文的联系", "t": "与两篇重点论文没有直接引用关系。间接的联系是：Ha 所用 RAFT-Stereo 的相关体，本质上就是把“学习特征的点积 = 匹配代价”在整条极线上稠密地算一遍，这个思想由 MC-CNN（fast 版）确立。理解了“代价就是特征相似度”，也更容易读懂 Quark 的 Update Block 从输入特征和渲染结果中提取的“匹配线索”指的是什么。"}}, {"b": "note", "t": "2015 · Jure Žbontar, Yann LeCun（Univ. of Ljubljana / NYU） · CVPR 2015（扩展版 JMLR 2016：Stereo Matching by Training a Convolutional Neural Network to Compare Image Patches） · Semantic Scholar 引用 830 · 难度：入门"}, {"b": "p", "t": "它是最早登上 KITTI 立体榜首的深度学习方法之一（2014 年 8 月排名第一），证明学出来的匹配代价明显好于 census、SAD 等手工代价，由此开启了深度立体匹配时代。它采用的是混合流程：CNN 负责算代价，SGM 等经典方法负责聚合和后处理。后来的端到端网络（DispNetC、GC-Net）要取代的正是这套流程。", "label": "为什么有影响力", "mn": {"label": "相关概念与专题", "links": [{"k": "concept-d-stereo"}, {"k": "concept-g-epipolar"}, {"k": "concept-l-cnn"}, {"k": "concept-f-optim"}, {"k": "adv-a-learned-stereo"}]}}, {"b": "p", "t": "作者训练一个孪生 CNN，判断两个小图像块是否是同一处的投影，把它的输出当作每个像素在每个候选视差上的匹配代价。之后接一串经典步骤：cross-based 代价聚合、半全局匹配（SGM）、左右一致性检查（剔除遮挡区的错误），以及亚像素增强和中值、双边滤波。KITTI 误差为 2.61%，2014 年 8 月排名第一。JMLR 扩展版还提出“fast”结构，直接用两块特征的余弦相似度作为代价，以少量精度损失换来大幅加速。", "label": "主要贡献"}, {"b": "h3", "t": "A Large Dataset to Train Convolutional Networks for Disparity, Optical Flow, and Scene Flow Estimation (SceneFlow / DispNet)", "id": "classic-41", "url": "https://arxiv.org/abs/1512.02134", "sn": {"label": "与重点论文的联系", "t": "Ha et al. 用 RAFT-Stereo 生成 DyNeRF 和 Google Spaces 的逐视角深度，而 RAFT-Stereo 论文里的跨数据集泛化实验都是在 SceneFlow 上训练、在真实数据上测试。Ha 没有说明具体用的是哪份权重，所以这里只能说其深度先验很可能大量来自合成数据。这也是理解 Ha 自述局限的一个可能视角（属于推测，论文未验证）：合成数据较少覆盖高光和镜面，而正是这些区域的深度错误破坏了 TSDF 引导，使结果在视角和时间上不一致（Ha Fig. 9）。"}}, {"b": "note", "t": "2016 · Nikolaus Mayer, Eddy Ilg, Philip Häusser, Philipp Fischer, Daniel Cremers, Alexey Dosovitskiy, Thomas Brox（Univ. Freiburg / TU München） · CVPR 2016 · Semantic Scholar 引用 3092 · 难度：入门"}, {"b": "p", "t": "论文发布了 FlyingThings3D、Monkaa、Driving 三个大规模合成立体视频数据集（统称 SceneFlow），带稠密的视差、光流和场景流真值。此后近十年，大多数深度立体网络（GC-Net、PSMNet、RAFT-Stereo、IGEV 等）都先在 SceneFlow 上预训练，“在 SceneFlow 上训练、在 KITTI/Middlebury/ETH3D 上零样本测试”也成了标准评测协议。同文提出的 DispNet/DispNetC 实现了实时的端到端视差估计（约 0.06 s/帧）。", "label": "为什么有影响力", "mn": {"label": "相关概念与专题", "links": [{"k": "concept-d-stereo"}, {"k": "concept-d-flow"}, {"k": "concept-l-loss"}, {"k": "adv-a-learned-stereo"}]}}, {"b": "p", "t": "(1) 用渲染软件合成三套数据：随机物体飞行、动画短片、驾驶场景。这是第一批足以训练和评测场景流方法的大规模数据集。(2) DispNet 用 FlowNet 式编解码结构直接回归视差；DispNetC 把相关层改为只沿水平扫描线计算的 1D 相关（特征层最大位移 40 像素，相当于输入图 160 像素），把立体匹配的极线约束直接写进网络。(3) 把光流网络和视差网络联合训练，首次用 CNN 估计场景流。", "label": "主要贡献"}, {"b": "h3", "t": "FlowNet 2.0: Evolution of Optical Flow Estimation with Deep Networks", "id": "classic-47", "url": "https://arxiv.org/abs/1612.01925", "sn": {"label": "与重点论文的联系", "t": "它和 Quark 的 render-and-refine 在结构上是同一个套路，但这只是帮助理解的类比：Quark 没有引用 FlowNet2，其思想直接来自 DeepView。FlowNet2 的每一级都是“用当前估计 warp 图像 → 与目标比较 → 预测修正量”。Quark 的每个 Update & Fuse 步是“把当前 LDM 渲染到各输入视角得到 Ĩ → 与输入特征比较 → 更新特征体”，一共 5 步。先把 warp 加残差的级联搞懂，再去看 Quark Fig. 1 的迭代流程会顺畅得多。"}}, {"b": "note", "t": "2017 · Eddy Ilg, Nikolaus Mayer, Tonmoy Saikia, Margret Keuper, Alexey Dosovitskiy, Thomas Brox（Univ. Freiburg） · CVPR 2017 · Semantic Scholar 引用 3437 · 难度：进阶"}, {"b": "p", "t": "它让学习式光流的精度追上了当时最好的方法（摘要称 on par with state-of-the-art），并确立了一种级联精化思路：把多个网络堆叠起来，每一级先用当前光流 warp 第二张图，再估计剩下的残差。它发现的训练数据调度规律（先 Chairs 后 Things3D）被此后大量光流和立体网络沿用。2017–2020 年间，它是视频处理里最常用的现成光流器之一，例如 Consistent Video Depth 就用它建立帧间对应。", "label": "为什么有影响力", "mn": {"label": "相关概念与专题", "links": [{"k": "concept-d-flow"}, {"k": "concept-i-warping"}, {"k": "concept-l-iterative"}, {"k": "concept-l-cnn"}]}}, {"b": "p", "t": "论文有三项主要贡献。(1) 数据调度：先在简单的 FlyingChairs 上训练，再在 FlyingThings3D 上微调，效果明显好于直接混合训练。(2) 堆叠架构：在 FlowNetC 之后串接若干个 FlowNetS。每一级的输入除了原图，还有“按当前光流 warp 过来的第二张图”和“亮度误差图”，所以后一级只需要预测修正量。(3) 专门处理小位移的子网络 FlowNet-SD，与大位移分支融合。整体误差比 FlowNet 降低 50% 以上，速度只略慢；更快的变体可达 140 fps，精度与原版 FlowNet 相当。", "label": "主要贡献"}, {"b": "h3", "t": "Unsupervised Monocular Depth Estimation with Left-Right Consistency (Monodepth)", "id": "classic-48", "url": "https://arxiv.org/abs/1609.03677", "sn": {"label": "与重点论文的联系", "t": "人物关联：第一作者 Clément Godard 是 Quark 的共同作者（Quark 中署名单位为 Google）。技术关联：Quark 的训练本质上也是“用视图合成做监督”，即在留出的目标视角上用 10·L1+LPIPS 比较渲染图和真实图像，不需要深度真值。Ha 的损失中 0.8·L1+0.2·SSIM 这部分，形式上也与 Monodepth 的外观项相近，都是 SSIM 和 L1 的加权组合，只是权重侧重相反（Monodepth 的 SSIM 项权重为 0.85）。理解了 warp 重建损失，就能明白为什么 NVS 网络会顺带学到几何；也能看出光度损失本身对几何的约束是间接的，这正是 Ha 另加 L_Depth、让融合权重去复现 TSDF 深度的原因。"}}, {"b": "note", "t": "2017 · Clément Godard, Oisin Mac Aodha, Gabriel J. Brostow（UCL） · CVPR 2017（Oral） · Semantic Scholar 引用 3292 · 难度：入门"}, {"b": "p", "t": "“用视图合成做自监督”训练单目深度网络的思路，Garg et al.（ECCV 2016）等已有雏形；Monodepth 把它做成了成熟、有效的框架：不需要深度真值，只要双目图像对。做法是用预测的视差把另一只眼的图像 warp 过来，用重建误差做监督，再加上左右视差一致性约束。它与同期的 SfMLearner（CVPR 2017，用单目视频）一起奠定了自监督深度的基础，Monodepth2 等后续工作都直接在其上发展。这和 NVS 用留出视角做监督是同一个思想。", "label": "为什么有影响力", "mn": {"label": "相关概念与专题", "links": [{"k": "concept-d-mono"}, {"k": "concept-d-stereo"}, {"k": "concept-g-depth"}, {"k": "concept-i-warping"}, {"k": "concept-l-loss"}, {"k": "concept-g-epipolar"}]}}, {"b": "p", "t": "网络只看左图，同时预测左、右两张视差图。用可微的双线性采样，按左视差把右图 warp 成左图，反之亦然。损失由三项组成：外观重建项 α·(1−SSIM)/2+(1−α)·L1（α=0.85）、边缘感知的视差平滑项、左右视差一致性项。在 KITTI 上超过了当时部分有监督方法。数值例子：视差与深度的关系是 \\(d=f\\,b/Z\\)，其中 f 是像素焦距，b 是基线，Z 是深度。KITTI 的 b≈0.54 m、f≈720 px，所以 Z=10 m 时 d≈39 px，Z=40 m 时只剩约 10 px，远处深度因此更难估准。", "label": "主要贡献"}, {"b": "h3", "t": "End-to-End Learning of Geometry and Context for Deep Stereo Regression (GC-Net)", "id": "classic-50", "url": "https://arxiv.org/abs/1703.04309", "sn": {"label": "与重点论文的联系", "t": "Quark 的 LDM 层按等视差（逆深度）间隔放置 anchor，δ=(ℓ−0.5)/L，这和立体代价体沿视差均匀采样是同一个做法。离散假设最终都要变成连续的亚像素几何：GC-Net 用 soft argmin；Quark 让每层深度用 tanh 在自己的视差带内连续偏移；Ha 的 image-based TSDF 沿射线找到零交叉后，再做 3 步二分细化。此外，soft argmin 按概率加权求期望深度，和体渲染按权重求期望深度的形式一样，可以借此理解 Quark 如何按 density 合成各层。"}}, {"b": "note", "t": "2017 · Alex Kendall, Hayk Martirosyan, Saumitro Dasgupta, Peter Henry, Ryan Kennedy, Abraham Bachrach, Adam Bry（Skydio） · ICCV 2017 · Semantic Scholar 引用 1561 · 难度：入门 · 必读"}, {"b": "p", "t": "GC-Net 第一次把三件事组合成端到端的立体网络：带几何含义的 4D 代价体、3D 卷积正则化、可微的 soft argmin。这套组合成为 2017–2020 年立体和 MVS 网络的标准范式，PSMNet、GA-Net、MVSNet、CasMVSNet 都直接继承了它。soft argmin 能从离散假设上的概率分布回归出亚像素的连续值，这个技巧在深度估计、MVS 和可泛化 NeRF 中随处可见。", "label": "为什么有影响力", "mn": {"label": "相关概念与专题", "links": [{"k": "concept-d-stereo"}, {"k": "concept-g-depth"}, {"k": "concept-i-psv"}, {"k": "concept-r-volume"}, {"k": "concept-l-cnn"}, {"k": "adv-a-learned-stereo"}]}}, {"b": "p", "t": "对每个候选视差 d，把左图特征与右移 d 个像素后的右图特征拼接起来，得到“高×宽×视差×特征”的 4D 代价体。与相关层不同，它不把特征维压成一个数，因此保留了更多信息。随后用 3D 卷积编解码器在空间维和视差维上聚合上下文。最后做 soft argmin：\\(\\hat d=\\sum_{d=0}^{D_{\\max}} d\\cdot\\mathrm{softmax}(-c_d)\\)，其中 \\(c_d\\) 是该像素在视差 d 上的代价（越小越匹配），softmax 在全部候选视差上归一化，\\(D_{\\max}\\) 是最大视差（论文取 192）。数值例子：若 d=10 和 d=11 的 softmax 概率分别为 0.6 和 0.4，其余接近 0，则 \\(\\hat d=10.4\\)，得到亚像素视差。", "label": "主要贡献"}, {"b": "h3", "t": "SuperPoint: Self-Supervised Interest Point Detection and Description", "id": "classic-54", "url": "https://arxiv.org/abs/1712.07629", "sn": {"label": "与重点论文的联系", "t": "关系是间接的。两篇重点论文都假设相机已经标定：Ha et al. 用 COLMAP 对固定阵列做一次标定（附录又说使用数据集提供的参数），Quark 用 SfM 点来确定近/远平面。SuperPoint（常与 SuperGlue 一起）经常被用来替换 COLMAP 里的 SIFT，在弱纹理和大视角差的条件下得到更稳的匹配和位姿。阵列标定的精度直接决定两篇方法中投影、反投影和 TSDF 融合能否对齐。Ha 承认标定误差会让前向投影错位、导致结果模糊；Quark 也承认标定误差会产生错误的硬边，而不是较温和的模糊。"}}, {"b": "note", "t": "2018 · Daniel DeTone 等（Magic Leap） · CVPR Workshops 2018（DL4VSLAM） · Semantic Scholar 引用 3726 · 难度：进阶"}, {"b": "p", "t": "它是最早被广泛采用的自监督深度特征点之一，把检测和描述做在同一个网络里，在许多 SfM、SLAM 和定位流水线中被用作 SIFT/ORB 的替代。它提出的 Homographic Adaptation 自监督方式影响了后续许多特征学习工作。它与 SuperGlue 的组合在 2020 年前后是视觉定位与 SfM 中最常用的强基线之一。", "label": "为什么有影响力", "mn": {"label": "相关概念与专题", "links": [{"k": "concept-g-sfm"}, {"k": "concept-g-epipolar"}, {"k": "concept-g-rig"}, {"k": "concept-l-cnn"}]}}, {"b": "p", "t": "一个全卷积网络在整张图上做一次前向，同时输出关键点热图和描述子。关键点头在 1/8 分辨率上对每个 8×8 cell 做 65 类分类，即 64 个位置加一个“无关键点”类。训练分两步：先在合成几何图形（Synthetic Shapes）上训练出 MagicPoint；再用 Homographic Adaptation，对同一张真实图像（MS-COCO）施加大量随机单应并聚合检测结果，生成伪真值来自监督训练。在 HPatches 的单应估计上优于 LIFT、SIFT 和 ORB。", "label": "主要贡献"}, {"b": "h3", "t": "PWC-Net: CNNs for Optical Flow Using Pyramid, Warping, and Cost Volume", "id": "classic-55", "url": "https://arxiv.org/abs/1709.02371", "sn": {"label": "与重点论文的联系", "t": "它在概念上对应 Quark 的两个设计（Quark 未引用 PWC-Net，这里是类比）。第一，Quark 的输入编码也是 K 级特征金字塔（288×480、144×240、72×120、36×60），Update & Fuse 则从 36×64 逐级升到 288×512。第二，每一级都“用当前估计把信息投到另一视角再做比较”。区别在于估计对象：PWC-Net 估计的是 2D 位移，Quark 估计的是目标视锥内各层的 depth、density 和 blend weights。"}}, {"b": "note", "t": "2018 · Deqing Sun, Xiaodong Yang, Ming-Yu Liu, Jan Kautz（NVIDIA） · CVPR 2018 · Semantic Scholar 引用 2924 · 难度：进阶"}, {"b": "p", "t": "它把传统光流的三条经典原则——金字塔（由粗到细）、warping、代价体——做进了一个紧凑的可学习网络。模型比 FlowNet2 小 17 倍，精度反而更高。2018–2020 年间，它是光流、场景流和视频插帧的默认骨干之一。“每一级先用上一级的估计 warp 特征，再建局部代价体”也因此成为由粗到细几何网络的标准模板。", "label": "为什么有影响力", "mn": {"label": "相关概念与专题", "links": [{"k": "concept-d-flow"}, {"k": "concept-f-image"}, {"k": "concept-i-warping"}, {"k": "concept-l-iterative"}, {"k": "concept-l-cnn"}]}}, {"b": "p", "t": "网络在可学习的特征金字塔上逐级工作。每一级先把上一级光流上采样，用它把第二张图的特征 warp 到第一张图，然后只在很小的搜索半径内建立局部代价体（相关），由 CNN 解码出本级光流，最后用 context 网络精化。直觉例子：真实位移是 100 像素时，在 1/32 分辨率上只有约 3 像素，小范围搜索就够了，之后逐级放大并修正残差。它在 MPI Sintel final pass 和 KITTI 2015 上领先，1024×436 分辨率下约 35 fps。", "label": "主要贡献"}, {"b": "h3", "t": "Pyramid Stereo Matching Network (PSMNet)", "id": "classic-56", "url": "https://arxiv.org/abs/1803.08669", "sn": {"label": "与重点论文的联系", "t": "与重点论文没有直接引用关系。它的价值在于解释了一个失败模式：纯局部匹配为什么在弱纹理和高光区域失效、需要上下文推理。这正是 Ha et al. 输入深度的主要问题。Ha 在局限部分承认，高光区域深度错误会让 TSDF 引导失效，结果在视角和时间上都不再一致。"}}, {"b": "note", "t": "2018 · Jia-Ren Chang, Yong-Sheng Chen（台湾交通大学） · CVPR 2018 · Semantic Scholar 引用 1853 · 难度：进阶"}, {"b": "p", "t": "PSMNet 在 GC-Net 框架上加入空间金字塔池化（SPP）和堆叠沙漏 3D CNN，大幅改善了弱纹理、反光、遮挡等病态区域的匹配，2018 年 3 月 18 日前在 KITTI 2012/2015 排名第一。它的开源代码简洁，此后几年一直是立体网络最常用的基线和改进起点。", "label": "为什么有影响力", "mn": {"label": "相关概念与专题", "links": [{"k": "concept-d-stereo"}, {"k": "concept-l-cnn"}, {"k": "adv-a-learned-stereo"}]}}, {"b": "p", "t": "(1) SPP 模块在多个尺度上池化特征，引入全局上下文，再拼接成 4D 代价体。(2) 三个堆叠的沙漏形 3D CNN 配合中间监督，对代价体反复做自顶向下和自底向上的正则化。(3) 仍用 soft argmin 回归视差，损失为 smooth L1。论文要传达的结论是：单靠局部匹配不够，弱纹理区域需要大感受野的上下文推理来补全。", "label": "主要贡献"}, {"b": "h3", "t": "MVSNet: Depth Inference for Unstructured Multi-view Stereo", "id": "classic-57", "url": "https://arxiv.org/abs/1804.02505", "sn": {"label": "与重点论文的联系", "t": "在学习式 MVS 里，它与 Quark 的关系最直接。Quark Sec. 3.2.2 明确写道：Update Block 反投影回层空间得到的逐视角特征 Δ“与平面扫描体有相似之处”，但 Δ 还额外编码了“渲染 vs 观测”的可见性信息。两者的差别有三点。其一，Quark 的层建在目标视锥中并按等视差分布，而 MVSNet 在 DTU 上的平面建在参考视锥中、按等深度分布。其二，在跨视角聚合上，Quark Sec. 2.2 把均值/方差统计评为“简单、与顺序无关，但表达力有限”，改用 One-to-many attention（Quark 并未引用 MVSNet，该处方差统计引用的是 IBRNet，这里是概念对照）。其三，Quark 的消融显示，把注意力退化为均值后，PSNR 从 30.41 降到 29.73。读过 MVSNet，就能看清 Quark 在这些地方改进了什么。"}}, {"b": "note", "t": "2018 · Yao Yao 等（HKUST） · ECCV 2018 · Semantic Scholar 引用 1724 · 难度：进阶 · 必读"}, {"b": "p", "t": "这是第一个真正实用的端到端学习式多视角立体网络。它把平面扫描（plane sweep）做成可微的单应 warp，并用方差把任意数量视角的特征聚合成代价体，确立了学习式 MVS 的标准流水线：R-MVSNet、CasMVSNet、PatchmatchNet、TransMVSNet 都由此出发。它的“视锥内扫描体”思路后来也被 MVSNeRF、ENeRF 等可泛化 NeRF 借用。", "label": "为什么有影响力", "mn": {"label": "相关概念与专题", "links": [{"k": "concept-d-mvs"}, {"k": "concept-g-epipolar"}, {"k": "concept-i-psv"}, {"k": "concept-l-cnn"}, {"k": "adv-a-learned-mvs"}]}}, {"b": "p", "t": "(1) 可微单应 warp：在参考相机视锥里取 D 个与相机正对的深度平面，用平面诱导单应把每个源视角的特征 warp 到参考视角，\\(\\mathbf H_i(d)=\\mathbf K_i\\mathbf R_i\\big(\\mathbf I-\\tfrac{(\\mathbf t_1-\\mathbf t_i)\\,\\mathbf n_1^{\\top}}{d}\\big)\\mathbf R_1^{\\top}\\mathbf K_1^{-1}\\)。其中 K 是内参，R、t 是外参，下标 1 表示参考视角，\\(\\mathbf n_1\\) 是参考相机主轴方向，d 是假设深度（原文 Eq. (1) 把 \\(\\mathbf K_1^{-1}\\) 误印为 \\(\\mathbf K_1^{T}\\)）。(2) 方差代价：\\(\\mathbf C=\\frac1N\\sum_{i=1}^{N}(\\mathbf V_i-\\bar{\\mathbf V})^2\\)，其中 \\(\\mathbf V_i\\) 是第 i 个视角 warp 后的特征体，\\(\\bar{\\mathbf V}\\) 是它们的均值。各视角在正确深度上特征一致，方差就小；而且这种聚合对视角数量和顺序都不敏感。(3) 3D CNN 正则化后用 soft argmin 回归深度，再用参考图精化。在 DTU 上，深度假设在 425–935 mm 之间按 2 mm 间隔均匀取 256 个；在 Tanks and Temples 上不做微调即排名第一（截至 2018 年 4 月 18 日）。", "label": "主要贡献"}, {"b": "h3", "t": "RAFT: Recurrent All-Pairs Field Transforms for Optical Flow", "id": "classic-73", "url": "https://arxiv.org/abs/2003.12039", "sn": {"label": "与重点论文的联系", "t": "Ha et al. 的输入深度来自 RAFT-Stereo，也就是 RAFT 在立体匹配上的版本（相关体只沿极线一维计算）。理解了 RAFT 的相关查找和 GRU 迭代，就能明白 Ha 的深度为什么是逐帧独立的，以及为什么还要额外用颜色差分掩码做时间滤波。对 Quark 来说，RAFT 是“学习式迭代细化”最知名的例子：Quark 的 5 步 render-and-refine（源自 DeepView）同样按固定步数展开、每步预测修正。不同之处在于，Quark 各步的分辨率、层数和注意力头数都不同（A4→A2→A1），并非同一个模块反复调用，而 RAFT 每次迭代共享同一个 GRU。另外，Ha 的时序评测没有使用基于光流 warping 的误差指标，要补做这类评测就需要一个光流网络，例如 RAFT。"}}, {"b": "note", "t": "2020 · Zachary Teed, Jia Deng（Princeton） · ECCV 2020（Best Paper） · Semantic Scholar 引用 4224 · 难度：进阶 · 必读"}, {"b": "p", "t": "RAFT 用“全对相关体 + 共享权重的循环更新算子”取代了由粗到细的级联，精度、跨数据集泛化和训练效率同时大幅领先。此后的光流（GMA、FlowFormer）、立体（RAFT-Stereo、CREStereo、IGEV）、SLAM（DROID-SLAM）和点跟踪等工作大量沿用“相关查找 + GRU 迭代”这套骨架，“学习式迭代细化”也由此成为 3D 视觉的主流范式。", "label": "为什么有影响力", "mn": {"label": "相关概念与专题", "links": [{"k": "concept-d-flow"}, {"k": "concept-l-iterative"}, {"k": "concept-d-stereo"}, {"k": "concept-v-temporal"}, {"k": "adv-a-learned-stereo"}]}}, {"b": "p", "t": "网络在 1/8 分辨率提取 256 维特征，计算所有像素对之间的 4D 相关体 \\(C_{ijkl}=\\sum_h g_{ijh}\\,g'_{klh}\\)，其中 g、g' 是两张图的特征，(i,j) 和 (k,l) 分别是两张图中的像素坐标，h 是通道下标；再对后两维做池化，得到 4 级相关金字塔。每次迭代以当前光流对应的位置为中心，在半径 r=4 的邻域内查找相关值（最粗一级相当于原图 256 像素的范围），和上下文特征一起送入卷积 GRU，输出增量 Δf，然后更新 f←f+Δf。训练时展开 12 次，推理时可以迭代任意次（Sintel 默认 32 次、KITTI 24 次），100 次以上也不会发散。全分辨率光流用学习到的 3×3 凸组合上采样得到。损失是各次迭代 L1 误差的指数加权和 \\(\\sum_i\\gamma^{N-i}\\lVert f_{gt}-f_i\\rVert_1\\)，其中 γ=0.8，N 是迭代次数，越靠后的迭代权重越大。结果：KITTI F1-all 5.10%，Sintel final EPE 2.855，分别比此前最好结果降低 16% 和 30%。", "label": "主要贡献"}, {"b": "h3", "t": "SuperGlue: Learning Feature Matching with Graph Neural Networks", "id": "classic-74", "url": "https://arxiv.org/abs/1911.11763", "sn": {"label": "与重点论文的联系", "t": "与重点论文有两处关联。(1) 标定：和 SuperPoint 一样，它是获取阵列位姿的更稳健工具，而 Ha 的 COLMAP 标定和 Quark 用 SfM 点定近/远平面都依赖稳健的特征匹配。(2) 注意力：SuperGlue 用交叉注意力让一个视角的特征去查询另一个视角，两边都有大量 query；Quark 的 One-to-many attention 则让 LDM 特征体作为单一 query，去查询 M 个视角的 Δ。对比这两者，就能理解 Quark 为什么可以把 K/V 投影折叠进 Q 投影和输出投影：只有一个 query 时，与其对 M 个视角各做一次 K/V 投影，不如只在 query 一侧做一次。这样在 d_k=32、N=8、h=1 时，FLOPs 约为标准交叉注意力的 1/8.1。"}}, {"b": "note", "t": "2020 · Paul-Edouard Sarlin 等（ETH Zürich + Magic Leap） · CVPR 2020（Oral） · Semantic Scholar 引用 2971 · 难度：进阶"}, {"b": "p", "t": "它把特征匹配从“最近邻 + 比率测试”变成了可学习的全局推理问题：用带自注意力和交叉注意力的图网络，加上可微最优传输，同时找出对应并拒绝不可匹配的点，大幅提升了大视角、弱纹理条件下的位姿估计。它是注意力机制在几何匹配中最早的成功案例之一，直接启发了 LoFTR、LightGlue 以及后来的多视角 Transformer。", "label": "为什么有影响力", "mn": {"label": "相关概念与专题", "links": [{"k": "concept-g-sfm"}, {"k": "concept-l-attention"}, {"k": "concept-f-optim"}, {"k": "concept-g-rig"}]}}, {"b": "p", "t": "输入是两组关键点，每个点有位置、置信度和描述子；关键点编码器用 MLP 把位置信息融入描述子。注意力图网络交替做图内自注意力和图间交叉注意力，共 L=9 层（每层 4 头）。得到得分矩阵后，再加一行一列“dustbin”，表示该点没有匹配，然后用 Sinkhorn 算法迭代地做行列归一化（默认 100 次），求出部分分配矩阵，即可微的最优传输。在室内外位姿估计上达到 SOTA，并能在 GPU 上实时运行。", "label": "主要贡献"}, {"b": "h3", "t": "Towards Robust Monocular Depth Estimation: Mixing Datasets for Zero-shot Cross-dataset Transfer (MiDaS)", "id": "classic-75", "url": "https://arxiv.org/abs/1907.01341", "sn": {"label": "与重点论文的联系", "t": "它能帮助理解重点论文对“度量尺度”的依赖。MiDaS 这类模型只输出相对的（仿射不变的）逆深度。而 Ha et al. 的 image-based TSDF 用公制截断 τ=0.02 m，Quark 用 SfM 点来设定近/远平面：前者需要公制尺度，后者至少需要和相机位姿的尺度一致。如果想用单目深度替换 Ha 的 RAFT-Stereo，就必须逐帧、并且在时间上一致地估计 s 和 t，否则各视角的深度无法在 TSDF 中对齐融合。两篇重点论文都没有使用单目深度。"}}, {"b": "note", "t": "2020 · René Ranftl 等（Intel + ETH Zürich） · IEEE TPAMI（2020 年在线发表，DOI 10.1109/TPAMI.2020.3019967；arXiv 2019） · Semantic Scholar 引用 2803 · 难度：入门 · 必读"}, {"b": "p", "t": "MiDaS 说明，单目深度能否泛化，关键在于两点：混合多源数据，以及使用对尺度和平移不变的损失。它把“零样本跨数据集迁移”确立为单目深度的评测标准，并在当时明显提升了跨数据集泛化能力。它的仿射不变（scale-and-shift invariant）损失被 DPT、Depth Anything 等后续模型沿用，多数据集混合训练的做法也被 DPT 继承，因此可以看作单目深度基础模型谱系的起点。", "label": "为什么有影响力", "mn": {"label": "相关概念与专题", "links": [{"k": "concept-d-mono"}, {"k": "concept-g-depth"}, {"k": "concept-l-loss"}, {"k": "concept-f-optim"}, {"k": "adv-a-geo-fm"}]}}, {"b": "p", "t": "不同数据集的深度在尺度、偏移甚至表示形式（绝对深度、视差、相对顺序）上互不兼容。MiDaS 的办法是在视差（逆深度）空间做预测，并对每张图先求出最佳的尺度 s 和平移 t，再计算误差：\\((s,t)=\\arg\\min_{s,t}\\sum_i (s\\,d_i+t-d_i^*)^2\\)，损失为 \\(\\mathcal L_{ssi}=\\frac1{2M}\\sum_{i=1}^{M}\\rho\\big(s\\,d_i+t-d_i^*\\big)\\)。其中 \\(d_i\\) 是预测视差，\\(d_i^*\\) 是真值视差，M 是有效像素数，ρ 是误差函数；论文还给出用中位数和平均绝对偏差归一化、并截断最大残差的鲁棒版本。训练用多目标优化混合 5 个数据集，其中包括新构建的 3D 电影数据，并以零样本跨数据集迁移作为评测标准。", "label": "主要贡献"}, {"b": "h3", "t": "Cascade Cost Volume for High-Resolution Multi-View Stereo and Stereo Matching (CasMVSNet)", "id": "classic-76", "url": "https://arxiv.org/abs/1912.06378", "sn": {"label": "与重点论文的联系", "t": "它和 Quark 的多尺度设计高度同构（属于概念类比，Quark 没有引用 CasMVSNet）。Quark 先在 36×64 的低分辨率下用 24 层密集覆盖深度，然后逐级把空间分辨率翻倍，并用 Layer Collapse 把层数减半：24 层 36×64 → 24 层 72×128 → 12 层 144×256 → 6 层 288×512。每层深度只允许在自己的视差带内移动，也就是先粗定位表面，再在表面附近用少量层精修。Quark 的消融显示，去掉 layer collapse 后质量只略有提升（PSNR 30.56 对 30.41），运行时间却增加 115%，这和 CasMVSNet“省显存、省时间而不掉精度”的结论一致。此外，两篇重点论文共同的主要对手 ENeRF 用的也是级联代价体。"}}, {"b": "note", "t": "2020 · Xiaodong Gu 等（Alibaba A.I. Labs + Simon Fraser University） · CVPR 2020（Oral） · Semantic Scholar 引用 995 · 难度：进阶 · 必读"}, {"b": "p", "t": "代价体方法的核心瓶颈是内存和时间随分辨率呈三次方增长。CasMVSNet 用级联代价体解决了这个问题：由粗到细地逐级缩小深度搜索范围，使高分辨率的学习式 MVS 和立体匹配变得可行。它由此成为后来 MVS 网络的标准配置，也被可泛化渲染用来做深度引导采样：ENeRF 就是在目标视角构建级联代价体，预测深度概率分布来决定采样区间。", "label": "为什么有影响力", "mn": {"label": "相关概念与专题", "links": [{"k": "concept-d-mvs"}, {"k": "concept-d-stereo"}, {"k": "concept-g-depth"}, {"k": "concept-i-psv"}, {"k": "concept-i-layered"}, {"k": "adv-a-learned-mvs"}, {"k": "adv-a-generalizable-ibr"}]}}, {"b": "p", "t": "网络在特征金字塔上分三级构建代价体。第一级在低分辨率下用宽深度范围和较多假设平面粗略定位表面。之后每一级以上一级的深度为中心，缩小搜索范围和平面间隔，同时提高空间分辨率。具体配置为：三级的深度假设数依次是 48、32、8，深度间隔分别是 MVSNet 的 4、2、1 倍，特征图空间分辨率依次为原图的 1/16、1/4、1（按像素数计，即每边 1/4、1/2、1）。套用在 MVSNet 上，DTU 结果提升 23.1%，显存减少 50.6%，运行时间减少 74.2%；这套方法同样适用于立体匹配网络。", "label": "主要贡献"}, {"b": "h3", "t": "Consistent Video Depth Estimation", "id": "classic-79", "url": "https://arxiv.org/abs/2004.15021", "sn": {"label": "与重点论文的联系", "t": "人物关联：第一作者 Xuan Luo 是 Quark 的共同作者（Quark 中署名单位为 Google）。技术关联：它和 Ha et al. 解决的是同一个问题，即逐帧估计的深度在时间上不一致。Ha 用的是在线、廉价的启发式：颜色差分掩码 M=min(|ΔI|/λ_t+β,1) 驱动的递归滤波，加上上一帧 TSDF 深度回灌。CVD 用的是离线方案：光流和 SfM 约束加测试时训练。对比两者可以看清 Ha 的取舍：为了约 39 ms 的在线预算，它放弃了基于对应的时间约束，代价是只能在静止区域平滑深度，运动区域仍依赖逐帧深度。"}}, {"b": "note", "t": "2020 · Xuan Luo 等（Univ. Washington + Virginia Tech + Facebook） · ACM TOG 39(4) / SIGGRAPH 2020 · Semantic Scholar 引用 420 · 难度：进阶"}, {"b": "p", "t": "它把单图深度网络的学习先验，与 SfM 和光流提供的多帧几何约束结合起来，通过测试时训练得到几何一致、明显更稳定的视频深度。它开启了“测试时优化求一致视频深度”这条路线（后续有 Robust CVD 等），也是视频特效和视频 3D 化的重要基础。", "label": "为什么有影响力", "mn": {"label": "相关概念与专题", "links": [{"k": "concept-d-mono"}, {"k": "concept-d-flow"}, {"k": "concept-g-sfm"}, {"k": "concept-v-temporal"}, {"k": "adv-a-temporal-video"}]}}, {"b": "p", "t": "先用 COLMAP 求出相机位姿并做尺度校准，再用 FlowNet2 在多对帧（包括相距较远的帧）之间计算稠密光流对应，并做前后向一致性检查。测试时，以这些对应为约束去微调一个预训练的单图深度网络（默认用 Li et al. 2019 的 Mannequin Challenge 模型）。约束分两项。空间损失在图像空间比较：把帧 i 的像素按当前深度和位姿重投影到帧 j，重投影位置应与光流位移后的位置重合。视差损失要求重投影点的视差（逆深度）与帧 j 在对应位置的视差一致。微调完成后，网络对整段视频输出一致的深度。代价是只能离线处理：论文称，一段 244 帧、708 对光流的视频，测试时训练约需 40 分钟（4 块 Tesla M40）。", "label": "主要贡献"}, {"b": "h3", "t": "Vision Transformers for Dense Prediction (DPT)", "id": "classic-84", "url": "https://arxiv.org/abs/2103.13413", "sn": {"label": "与重点论文的联系", "t": "与两篇重点论文没有直接关系。间接意义有两点。一是 Quark 用的是“特征金字塔 + 由粗到细的 UNet 式迭代解码”，DPT 给出了这类多尺度融合结构的 Transformer 版本。二是如果以后想把 DUSt3R、VGGT 或 Depth Anything 的深度接入 Ha 式管线，需要知道这些模型的输出头和输出分辨率都来自 DPT 的设计。"}}, {"b": "note", "t": "2021 · René Ranftl, Alexey Bochkovskiy, Vladlen Koltun（Intel） · ICCV 2021 · Semantic Scholar 引用 3102 · 难度：进阶"}, {"b": "p", "t": "DPT 是最早系统地把 ViT 用作稠密预测骨干的工作之一（同期还有面向语义分割的 SETR）。它证明 Transformer 的全局感受野在数据充足时能给出更细致、全局更一致的深度和分割。它的 reassemble + 融合解码头后来成为几何基础模型的标准输出头：MiDaS v3、Depth Anything V1/V2、DUSt3R、VGGT 都采用 DPT 式头。", "label": "为什么有影响力", "mn": {"label": "相关概念与专题", "links": [{"k": "concept-d-mono"}, {"k": "concept-l-attention"}, {"k": "concept-l-cnn"}]}}, {"b": "p", "t": "从 ViT 的不同层取出 token，按各自对应的图像 patch 位置重新排成几种分辨率的类图像特征图（reassemble），再用卷积解码器逐级融合，输出全分辨率预测。单目深度相对当时最好的全卷积网络最多提升 28%，ADE20K 语义分割达到 49.02% mIoU。", "label": "主要贡献"}, {"b": "h3", "t": "LoFTR: Detector-Free Local Feature Matching with Transformers", "id": "classic-88", "url": "https://arxiv.org/abs/2104.00680", "sn": {"label": "与重点论文的联系", "t": "与两篇重点论文没有直接引用关系。间接意义有两点。其一，“先在低分辨率上做全局注意力，再在高分辨率上做局部精化”，与 Quark“把重计算放在低分辨率、高分辨率只做轻量操作”是同一种效率策略。其二，线性注意力降低复杂度的思路，可以和 Quark 的 One-to-many attention 对照着看。实践中，它也可以用于阵列标定时弱纹理区域的匹配。"}}, {"b": "note", "t": "2021 · Jiaming Sun 等（浙江大学 + SenseTime） · CVPR 2021 · Semantic Scholar 引用 2091 · 难度：进阶"}, {"b": "p", "t": "它开创了不依赖关键点检测器（detector-free）的半稠密匹配：先用 Transformer 的自注意力和交叉注意力在粗尺度上为所有像素建立匹配，再细化到亚像素。在弱纹理和重复纹理区域，它远胜基于关键点的方法，并催生了 MatchFormer、ASpanFormer、Efficient LoFTR 等一系列稠密匹配器。", "label": "为什么有影响力", "mn": {"label": "相关概念与专题", "links": [{"k": "concept-g-sfm"}, {"k": "concept-l-attention"}, {"k": "concept-d-flow"}, {"k": "concept-g-epipolar"}]}}, {"b": "p", "t": "CNN 提取 1/8 和 1/2 两个尺度的特征。在 1/8 尺度上，自注意力层和交叉注意力层交替变换两张图的特征，并用线性注意力（linear transformer）降低复杂度，使每个描述子同时以两张图为条件。然后用对偶 softmax（或最优传输）得到置信矩阵，选出互为最近邻的高置信匹配。最后在 1/2 尺度的局部窗口里用相关性细化到亚像素。发表时在两项视觉定位基准上排名第一。", "label": "主要贡献"}, {"b": "h3", "t": "RAFT-Stereo: Multilevel Recurrent Field Transforms for Stereo Matching", "id": "classic-94", "url": "https://arxiv.org/abs/2109.07547", "sn": {"label": "与重点论文的联系", "t": "它是 Ha et al. 的直接深度来源。Ha 第 4 节开头的实现细节和附录 A.5 写明：DyNeRF 与 Google Spaces 的逐视角深度 D_n^t 由 RAFT-Stereo 在“人工挑选的图像对”上估计，ScanNet 则用传感器深度；立体深度的耗时没有计入 Table 4 约 39 ms 的运行时间。RAFT-Stereo 逐帧独立推理，不保证时间一致，所以 Ha 需要颜色差分掩码递归滤波（λ_t=0.7、β=0.6）和 TSDF 融合。它在高光区域的失败也是 Ha 自述的首要局限（Fig. 9）。"}}, {"b": "note", "t": "2021 · Lahav Lipson, Zachary Teed, Jia Deng（Princeton） · 3DV 2021 · Semantic Scholar 引用 732 · 难度：进阶 · 必读"}, {"b": "p", "t": "它把 RAFT 的迭代更新范式搬到立体匹配上，跨数据集泛化很强：只在 SceneFlow 上训练，就能在 KITTI、Middlebury 和 ETH3D 上表现出色。因此在 2021–2024 年，它是最常被直接调用的“现成”立体深度模型之一，大量 NVS、重建和机器人工作（包括 Ha et al. 与 Tele-Aloha）都在用。CREStereo、IGEV-Stereo 以及 FoundationStereo 等后续方法也都沿用它的迭代骨架。", "label": "为什么有影响力", "mn": {"label": "相关概念与专题", "links": [{"k": "concept-d-stereo"}, {"k": "concept-l-iterative"}, {"k": "concept-g-epipolar"}, {"k": "concept-g-depth"}, {"k": "adv-a-learned-stereo"}]}}, {"b": "p", "t": "(1) 只计算同一行像素之间的相关，得到 3D 相关体，而不是 RAFT 那样的 4D 全对相关，并在其上构建相关金字塔。(2) 多级卷积 GRU 同时在 1/8、1/16、1/32 分辨率维护隐状态，彼此交叉连接，让信息在大片弱纹理区域里传播得更快。(3) 用凸组合上采样得到全分辨率视差。结果：Middlebury 排名第一，1px 误差比第二名低 29%，ETH3D 双目榜上超过所有已发表方法；用 1/8 与 1/16 两级 GRU 的实时变体在 KITTI 分辨率（1248×384）下约 26 FPS。", "label": "主要贡献"}, {"b": "h3", "t": "Multi-view Depth Estimation using Epipolar Spatio-Temporal Networks (ESTDepth)", "id": "classic-101", "url": "https://arxiv.org/abs/2011.13118", "sn": {"label": "与重点论文的联系", "t": "Ha et al. Sec. 4.3 写明，SDT 和 SDV 两个指标的计算“following Long et al. [42]”，参考文献 [42] 就是本文。SDT 是所有帧上 L1 误差的标准差，用来衡量时间一致性；SDV 是所有视角上 L1 误差的标准差，用来衡量视角一致性。要注意，这两个量刻画的是误差的离散程度，而不是帧与帧之间的变化本身，所以读 Ha 的 Table 1 时要和 TCC、STED 放在一起看。ESTDepth 本身走的是“用网络从源头产生时间一致深度”的路线，可以和 Ha 的“差分掩码 + TSDF 回灌”启发式做对照。"}}, {"b": "note", "t": "2021 · Xiaoxiao Long 等（HKU + MPI Informatik 等） · CVPR 2021 · Semantic Scholar 引用 84 · 难度：专家"}, {"b": "p", "t": "它是较早在学习式多视角深度中显式处理视频帧间几何与时间一致性的工作。引用量不高（S2 约 84 次），之所以收入本表，是因为 Ha et al. 直接采用了它的一致性评测做法；理解重点论文的评测离不开它。", "label": "为什么有影响力", "mn": {"label": "相关概念与专题", "links": [{"k": "concept-d-mvs"}, {"k": "concept-v-temporal"}, {"k": "concept-v-metrics"}, {"k": "concept-l-attention"}, {"k": "adv-a-temporal-video"}, {"k": "adv-a-learned-mvs"}]}}, {"b": "p", "t": "方法从单目视频估计多视角深度。它先用一个混合网络逐帧估计深度：2D 上下文网络负责上下文，3D 匹配网络负责视差线索，这种受 Mixture-of-Experts 启发的拆分降低了全 3D 卷积正则化的开销。然后用 Epipolar Spatio-Temporal (EST) Transformer 沿极线关联相邻帧的几何与时间信息，输出时间一致的深度序列。与当时的 SOTA 相比，精度更高，速度也明显更快。", "label": "主要贡献"}, {"b": "h3", "t": "Depth Anything: Unleashing the Power of Large-Scale Unlabeled Data", "id": "classic-122", "url": "https://arxiv.org/abs/2401.10891", "sn": {"label": "与重点论文的联系", "t": "两篇重点论文都没有使用单目深度，但它已经是重点论文方向上的常用组件：FoundationStereo 把 Depth Anything V2 作为旁路先验，DepthSplat 用预训练单目深度特征做前馈 3DGS 的多视角深度，Video Depth Anything 在它之上加了时序头。对 Ha et al. 来说，它是 RAFT-Stereo 之外的候选深度源（Ha 没有做深度来源的鲁棒性实验），但要先解决两个问题：输出只是相对尺度，而且逐帧推理会闪烁。"}}, {"b": "note", "t": "2024 · Lihe Yang 等（HKU + TikTok） · CVPR 2024 · Semantic Scholar 引用 2161 · 难度：入门 · 必读"}, {"b": "p", "t": "它用“数据引擎 + 自训练”把单目深度的训练数据扩展到约 6200 万张无标注图像，零样本相对深度因此鲁棒到可以直接用于任意图像。V1 和 V2 发布后，它成为 3D 视觉中最常被调用的深度先验之一，被用于前馈 3DGS、立体基础模型、视频深度，以及深度条件的 ControlNet 等。", "label": "为什么有影响力", "mn": {"label": "相关概念与专题", "links": [{"k": "concept-d-mono"}, {"k": "concept-l-attention"}, {"k": "concept-l-loss"}, {"k": "adv-a-geo-fm"}, {"k": "adv-a-ff-3dgs"}]}}, {"b": "p", "t": "(1) 先用 150 万张有标注图像训练教师模型，给约 6200 万张无标注图像打伪标签，再用两者联合训练学生模型。(2) 对无标注图像施加强颜色扰动和 CutMix，迫使学生学到更鲁棒的表示。(3) 用特征对齐损失继承 DINOv2 的语义先验。网络由 DINOv2 编码器和 DPT 解码器组成，仿射不变损失沿用 MiDaS；另外在 NYUv2 和 KITTI 上用度量深度微调，得到度量模型。后续的 Depth Anything V2（NeurIPS 2024）改用合成数据训练更大的教师模型，细节更锐利，提供 25M 到 1.3B 参数的多个规模。", "label": "主要贡献"}, {"b": "h3", "t": "DUSt3R: Geometric 3D Vision Made Easy", "id": "classic-123", "url": "https://arxiv.org/abs/2312.14132", "sn": {"label": "与重点论文的联系", "t": "它与重点论文的关键差异正好落在重点论文的前提上。Quark 和 Ha et al. 都假设有已标定的固定阵列（Ha 用 COLMAP 标定，Quark 用 SfM 点定近/远平面）；DUSt3R 则说明位姿和深度可以直接从图像前馈得到。重点论文后继中的 AnySplat、LiveStre4m 等免标定方法，走的正是这一范式推动的方向。另一个值得对照的点：DUSt3R 明确假设每条射线只击中一个 3D 点，忽略半透明表面；而 Quark 的 LDM 在每条射线上保留多层 depth/density，能够表示遮挡边界处的混合和半透明效果。这是点图与分层表示的本质区别。"}}, {"b": "note", "t": "2024 · Shuzhe Wang, Vincent Leroy 等（Naver Labs Europe + Aalto） · CVPR 2024 · Semantic Scholar 引用 1904 · 难度：进阶 · 必读"}, {"b": "p", "t": "它提出了“直接回归点图（pointmap）”的新范式：不需要任何相机内外参，一个 Transformer 直接从两张图输出两者在同一坐标系下的逐像素 3D 点。这把单目/双目深度、匹配、相对位姿、SfM 等任务统一了起来，开启了 MASt3R、Spann3R、CUT3R、VGGT、π3 等前馈 3D 几何基础模型的浪潮，也让大量无位姿 NVS/3DGS 方法成为可能。", "label": "为什么有影响力", "mn": {"label": "相关概念与专题", "links": [{"k": "concept-g-sfm"}, {"k": "concept-g-pinhole"}, {"k": "concept-d-mvs"}, {"k": "concept-l-attention"}, {"k": "concept-r-reps"}, {"k": "adv-a-geo-fm"}]}}, {"b": "p", "t": "对图像 \\(I^1,I^2\\)，网络输出点图 \\(X^{1,1},X^{2,1}\\in\\mathbb R^{W\\times H\\times 3}\\) 和置信图 C。上标 \\(v,1\\) 表示第 v 张图的每个像素在相机 1 坐标系下的 3D 点。结构为共享权重的 ViT 编码器，加上两个通过交叉注意力持续交换信息的 Transformer 解码器，再接回归头，并利用 CroCo 预训练。回归损失是按点到原点平均距离归一化后的 3D 点欧氏误差，再用置信度加权：\\(\\mathcal L=\\sum_i C_i\\,\\ell_i-\\alpha\\log C_i\\)。其中 \\(C_i=1+\\exp(\\tilde C_i)>1\\) 是像素置信度，\\(\\ell_i\\) 是回归误差，α 是正则系数。\\(-\\alpha\\log C_i\\) 这一项奖励高置信度，防止网络把置信度一律压到下限来逃避回归误差。输入多于两张图时，用全局对齐把各对点图拼到同一个坐标系。结果只确定到相差一个尺度因子。", "label": "主要贡献"}, {"b": "h3", "t": "Grounding Image Matching in 3D with MASt3R", "id": "classic-126", "url": "https://arxiv.org/abs/2406.09756", "sn": {"label": "与重点论文的联系", "t": "与重点论文没有直接引用关系。对 telepresence 的意义在于：它能在宽基线、弱纹理条件下提供稳健的对应，可用于多相机阵列的自动标定或标定校验。两篇重点论文都假设标定准确，都只定性承认标定误差的后果，没有做同步误差和标定误差的定量鲁棒性实验。"}}, {"b": "note", "t": "2024 · Vincent Leroy, Yohann Cabon, Jérôme Revaud（Naver Labs Europe） · ECCV 2024 · Semantic Scholar 引用 1171 · 难度：专家"}, {"b": "p", "t": "它把 DUSt3R 从“鲁棒但不够精确”推进到可以用于精确匹配和定位：在点图回归之外增加稠密局部特征头，并提出快速的互为最近邻匹配。这让以 3D 为基础的匹配在极端视角变化下明显超过 2D 匹配器。MASt3R-SfM、MASt3R-SLAM 等后续系统都以它为核心。", "label": "为什么有影响力", "mn": {"label": "相关概念与专题", "links": [{"k": "concept-g-sfm"}, {"k": "concept-g-rig"}, {"k": "concept-l-attention"}, {"k": "adv-a-geo-fm"}]}}, {"b": "p", "t": "在 DUSt3R 网络上新增一个输出稠密局部描述子的头，用 InfoNCE 式的匹配损失训练。提出快速互为最近邻（reciprocal）匹配方案，把稠密匹配的二次复杂度降低了几个数量级，并给出理论保证。在 Map-free 定位数据集上，VCRE AUC 比已发表的最好方法绝对提升 30%。", "label": "主要贡献"}, {"b": "h3", "t": "VGGT: Visual Geometry Grounded Transformer", "id": "classic-146", "url": "https://arxiv.org/abs/2503.11651", "sn": {"label": "与重点论文的联系", "t": "它最能启发对 Quark 跨视角融合设计的理解。VGGT 的全局注意力让所有帧的所有 token 两两交互，计算量随视角数平方增长。Quark 刻意回避了 O(M²) 的跨视角自注意力（Sec. 2.2 正是以此批评 NerFormer），改用单 query 的 One-to-many attention，使融合这一步的代价对视角数近似不变：h=4 时，输入从 4 个增加到 64 个，标准注意力的开销涨 13.0 倍，Quark 只涨 1.9 倍。不过 Quark 的编码和逐视角 update 仍随视角数线性增长，总时间约为 T_V + M·T_image。对 Ha et al. 而言，VGGT 一次前向就能同时给出阵列位姿和逐视角深度，理论上可以替代“COLMAP 标定 + RAFT-Stereo”。但它的输出尺度是按平均距离归一化的，必须先与 Ha 的公制 TSDF 截断（τ=0.02 m）对齐；而且它逐帧推理，同样没有时间一致性保证。"}}, {"b": "note", "t": "2025 · Jianyuan Wang 等（Oxford VGG + Meta AI） · CVPR 2025（Best Paper） · Semantic Scholar 引用 1807 · 难度：进阶 · 必读"}, {"b": "p", "t": "VGGT 用一个约 12 亿参数、几乎不带 3D 归纳偏置的 Transformer，一次前向就能从 1 张到数百张图同时预测相机内外参、深度图、点图和点轨迹，在多项任务上优于依赖 bundle adjustment 或全局对齐等后处理的方法。它把前馈几何基础模型推进到了多视角、亚秒级、可直接作为下游骨干的阶段，其特征已被用于前馈 NVS。", "label": "为什么有影响力", "mn": {"label": "相关概念与专题", "links": [{"k": "concept-g-sfm"}, {"k": "concept-g-pinhole"}, {"k": "concept-l-attention"}, {"k": "concept-d-mvs"}, {"k": "adv-a-geo-fm"}]}}, {"b": "p", "t": "图像先由 DINO 切块成 token，每帧再附加一个相机 token。主干是 L=24 层交替注意力（Alternating-Attention）：帧内自注意力和跨所有帧的全局自注意力交替进行，全网只用自注意力、不设交叉注意力层。相机头输出内外参，DPT 头输出深度图、点图及不确定度，另有一个跟踪头。训练时以第一帧的相机为坐标系，并用所有 3D 点到原点的平均距离来归一化尺度，所以输出不是公制尺度。在 RealEstate10K 和 CO3Dv2 的位姿估计上（10 帧，单张 H100），纯前馈约 0.2 s，而需要全局对齐或 BA 后处理的 DUSt3R、MASt3R、VGGSfM v2 约 7–10 s；VGGT 加上 BA 约 1.8 s，精度还能进一步提高。", "label": "主要贡献"}, {"b": "h3", "t": "FoundationStereo: Zero-Shot Stereo Matching", "id": "classic-147", "url": "https://arxiv.org/abs/2501.09898", "sn": {"label": "与重点论文的联系", "t": "它可以直接替换 Ha et al. 里的 RAFT-Stereo。Ha 依赖“人工挑选立体对 + RAFT-Stereo”生成逐视角深度，并在局限中承认高光/镜面区域深度差，会破坏视角和时间一致性（Fig. 9）。换成零样本更稳的立体模型，有望缓解这类深度失败。但 FoundationStereo 仍是逐帧、逐立体对的模型，解决不了时间一致性，Ha 的差分掩码滤波和上一帧 TSDF 回灌照样需要。它的推理开销也必须算进真实系统的延迟预算，而 Ha Table 4 合计的约 39 ms 并不含深度估计。"}}, {"b": "note", "t": "2025 · Bowen Wen 等（NVIDIA） · CVPR 2025 · Semantic Scholar 引用 285 · 难度：专家"}, {"b": "p", "t": "它把“基础模型”的思路带进了立体匹配：用大规模合成数据加上单目深度基础模型的先验，实现强零样本泛化，不再需要针对每个域微调。发表后很快成为常用的现成立体模型之一，代表了立体匹配向 foundation model 范式的转变。", "label": "为什么有影响力", "mn": {"label": "相关概念与专题", "links": [{"k": "concept-d-stereo"}, {"k": "concept-d-mono"}, {"k": "concept-l-attention"}, {"k": "adv-a-learned-stereo"}]}}, {"b": "p", "t": "(1) 构建 100 万对高真实感的合成立体数据，并用自动自筛选流程剔除有歧义的样本。(2) Side-Tuning Adapter：把 ViT 单目深度模型（Depth Anything V2）的特征从旁路接入立体网络，缓解合成数据到真实数据的域差。(3) Attentive Hybrid Cost Filtering：一方面把 3D 卷积拆成空间向和视差向两部分（Axial-Planar Convolution），另一方面用 Disparity Transformer 在整个视差维上做自注意力，为代价滤波提供长程上下文。(4) 最后仍用 GRU 迭代细化视差。", "label": "主要贡献"}, {"b": "h3", "t": "Video Depth Anything: Consistent Depth Estimation for Super-Long Videos", "id": "classic-148", "url": "https://arxiv.org/abs/2501.12375", "sn": {"label": "与重点论文的联系", "t": "它直接对应 Ha et al. 的“时间一致深度”环节。Ha 对 RAFT-Stereo 的逐帧深度做 EMA 式的颜色差分掩码滤波，由于 β=0.6，静止区域每帧最多只保留 40% 的旧深度。Video Depth Anything 则是在网络内部学习时间一致性。如果用它替换 Ha 的深度前端，需要注意三点。第一，它默认输出仿射不变的相对深度，与 Ha 的公制 TSDF 截断 τ=0.02 m 不能直接兼容。第二，它是单目模型，用不上相机阵列的多视角约束。第三，它默认按 32 帧窗口分段推理，需要缓存后续帧，并非严格逐帧因果，接入在线管线会带来额外的缓冲延迟。"}}, {"b": "note", "t": "2025 · Sili Chen 等（ByteDance） · CVPR 2025 · Semantic Scholar 引用 261 · 难度：进阶"}, {"b": "p", "t": "它把单目深度基础模型扩展到任意长度（数分钟以上）的视频，同时保持时间一致，最小的模型能以 30 FPS 实时运行。它代表了 2025 年“前馈、时间一致的视频深度”方向的较好实践，是替代“逐帧深度 + 启发式滤波”的有力候选。", "label": "为什么有影响力", "mn": {"label": "相关概念与专题", "links": [{"k": "concept-d-mono"}, {"k": "concept-v-temporal"}, {"k": "concept-l-attention"}, {"k": "adv-a-temporal-video"}, {"k": "adv-a-geo-fm"}]}}, {"b": "p", "t": "以 Depth Anything V2 为骨干，把输出头换成高效的时空头，在时间维上交换信息。损失方面，提出直接约束相邻帧深度时间梯度的时序一致性损失，不需要光流或位姿先验。训练数据是视频深度数据与无标注图像的联合。推理时分段处理：每个新片段与上一片段的 8 帧重叠帧和 2 个关键帧拼成 32 帧窗口。关键帧用来继承尺度与偏移，重叠帧做渐进插值，这样可以处理长达数分钟的视频。", "label": "主要贡献"}], "toc": false, "series": {"prev": {"k": "theme-t-fusion-capture"}, "next": {"k": "theme-t-neural-rendering"}, "up": {"u": "basics/classics/index.html", "t": "Classics 目录"}}}, "chart": {"lanes": [{"id": "t-deep-geometry", "label": "深度学习几何"}], "points": [{"y": 2015, "c": 4737, "m": false, "t": "FlowNet: Learning Optical Flow with Convolutional Networks", "v": "ICCV 2015", "u": "basics/classics/t-deep-geometry.html#classic-35", "lane": "t-deep-geometry"}, {"y": 2015, "c": 830, "m": false, "t": "Computing the Stereo Matching Cost with a Convolutional Neural Network (MC-CNN)", "v": "CVPR 2015（扩展版 JMLR 2016：Stereo Matching by Training a Convolutional Neural Network to Compare Image Patches）", "u": "basics/classics/t-deep-geometry.html#classic-37", "lane": "t-deep-geometry"}, {"y": 2016, "c": 3092, "m": false, "t": "A Large Dataset to Train Convolutional Networks for Disparity, Optical Flow, and Scene Flow Estimation (SceneFlow / DispNet)", "v": "CVPR 2016", "u": "basics/classics/t-deep-geometry.html#classic-41", "lane": "t-deep-geometry"}, {"y": 2017, "c": 3437, "m": false, "t": "FlowNet 2.0: Evolution of Optical Flow Estimation with Deep Networks", "v": "CVPR 2017", "u": "basics/classics/t-deep-geometry.html#classic-47", "lane": "t-deep-geometry"}, {"y": 2017, "c": 3292, "m": false, "t": "Unsupervised Monocular Depth Estimation with Left-Right Consistency (Monodepth)", "v": "CVPR 2017（Oral）", "u": "basics/classics/t-deep-geometry.html#classic-48", "lane": "t-deep-geometry"}, {"y": 2017, "c": 1561, "m": true, "t": "End-to-End Learning of Geometry and Context for Deep Stereo Regression (GC-Net)", "v": "ICCV 2017", "u": "basics/classics/t-deep-geometry.html#classic-50", "lane": "t-deep-geometry"}, {"y": 2018, "c": 3726, "m": false, "t": "SuperPoint: Self-Supervised Interest Point Detection and Description", "v": "CVPR Workshops 2018（DL4VSLAM）", "u": "basics/classics/t-deep-geometry.html#classic-54", "lane": "t-deep-geometry"}, {"y": 2018, "c": 2924, "m": false, "t": "PWC-Net: CNNs for Optical Flow Using Pyramid, Warping, and Cost Volume", "v": "CVPR 2018", "u": "basics/classics/t-deep-geometry.html#classic-55", "lane": "t-deep-geometry"}, {"y": 2018, "c": 1853, "m": false, "t": "Pyramid Stereo Matching Network (PSMNet)", "v": "CVPR 2018", "u": "basics/classics/t-deep-geometry.html#classic-56", "lane": "t-deep-geometry"}, {"y": 2018, "c": 1724, "m": true, "t": "MVSNet: Depth Inference for Unstructured Multi-view Stereo", "v": "ECCV 2018", "u": "basics/classics/t-deep-geometry.html#classic-57", "lane": "t-deep-geometry"}, {"y": 2020, "c": 4224, "m": true, "t": "RAFT: Recurrent All-Pairs Field Transforms for Optical Flow", "v": "ECCV 2020（Best Paper）", "u": "basics/classics/t-deep-geometry.html#classic-73", "lane": "t-deep-geometry"}, {"y": 2020, "c": 2971, "m": false, "t": "SuperGlue: Learning Feature Matching with Graph Neural Networks", "v": "CVPR 2020（Oral）", "u": "basics/classics/t-deep-geometry.html#classic-74", "lane": "t-deep-geometry"}, {"y": 2020, "c": 2803, "m": true, "t": "Towards Robust Monocular Depth Estimation: Mixing Datasets for Zero-shot Cross-dataset Transfer (MiDaS)", "v": "IEEE TPAMI（2020 年在线发表，DOI 10.1109/TPAMI.2020.3019967；arXiv 2019）", "u": "basics/classics/t-deep-geometry.html#classic-75", "lane": "t-deep-geometry"}, {"y": 2020, "c": 995, "m": true, "t": "Cascade Cost Volume for High-Resolution Multi-View Stereo and Stereo Matching (CasMVSNet)", "v": "CVPR 2020（Oral）", "u": "basics/classics/t-deep-geometry.html#classic-76", "lane": "t-deep-geometry"}, {"y": 2020, "c": 420, "m": false, "t": "Consistent Video Depth Estimation", "v": "ACM TOG 39(4) / SIGGRAPH 2020", "u": "basics/classics/t-deep-geometry.html#classic-79", "lane": "t-deep-geometry"}, {"y": 2021, "c": 3102, "m": false, "t": "Vision Transformers for Dense Prediction (DPT)", "v": "ICCV 2021", "u": "basics/classics/t-deep-geometry.html#classic-84", "lane": "t-deep-geometry"}, {"y": 2021, "c": 2091, "m": false, "t": "LoFTR: Detector-Free Local Feature Matching with Transformers", "v": "CVPR 2021", "u": "basics/classics/t-deep-geometry.html#classic-88", "lane": "t-deep-geometry"}, {"y": 2021, "c": 732, "m": true, "t": "RAFT-Stereo: Multilevel Recurrent Field Transforms for Stereo Matching", "v": "3DV 2021", "u": "basics/classics/t-deep-geometry.html#classic-94", "lane": "t-deep-geometry"}, {"y": 2021, "c": 84, "m": false, "t": "Multi-view Depth Estimation using Epipolar Spatio-Temporal Networks (ESTDepth)", "v": "CVPR 2021", "u": "basics/classics/t-deep-geometry.html#classic-101", "lane": "t-deep-geometry"}, {"y": 2024, "c": 2161, "m": true, "t": "Depth Anything: Unleashing the Power of Large-Scale Unlabeled Data", "v": "CVPR 2024", "u": "basics/classics/t-deep-geometry.html#classic-122", "lane": "t-deep-geometry"}, {"y": 2024, "c": 1904, "m": true, "t": "DUSt3R: Geometric 3D Vision Made Easy", "v": "CVPR 2024", "u": "basics/classics/t-deep-geometry.html#classic-123", "lane": "t-deep-geometry"}, {"y": 2024, "c": 1171, "m": false, "t": "Grounding Image Matching in 3D with MASt3R", "v": "ECCV 2024", "u": "basics/classics/t-deep-geometry.html#classic-126", "lane": "t-deep-geometry"}, {"y": 2025, "c": 1807, "m": true, "t": "VGGT: Visual Geometry Grounded Transformer", "v": "CVPR 2025（Best Paper）", "u": "basics/classics/t-deep-geometry.html#classic-146", "lane": "t-deep-geometry"}, {"y": 2025, "c": 285, "m": false, "t": "FoundationStereo: Zero-Shot Stereo Matching", "v": "CVPR 2025", "u": "basics/classics/t-deep-geometry.html#classic-147", "lane": "t-deep-geometry"}, {"y": 2025, "c": 261, "m": false, "t": "Video Depth Anything: Consistent Depth Estimation for Super-Long Videos", "v": "CVPR 2025", "u": "basics/classics/t-deep-geometry.html#classic-148", "lane": "t-deep-geometry"}]}}</script>
<script>
(function () {
  "use strict";
  // ================= lib: DOM, text and math helpers shared by every page =================
  // A page script defines rich(text) (inline cross-links); paras() and eqList() call it.
  var DATA;
  try { DATA = JSON.parse(document.getElementById("data").textContent); } catch (e) { DATA = {}; }
  var meta = DATA.meta || {};

  // ---------- DOM helpers: all text goes through textContent; external links are https-only ----------
  function safeUrl(u) { if (typeof u !== "string") return null; var s = u.trim(); return /^https:\/\/[^\s"'<>]+$/i.test(s) ? s : null; }
  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (!Object.prototype.hasOwnProperty.call(attrs, k)) continue;
      var v = attrs[k];
      if (v === null || v === undefined || v === false) continue;
      if (k === "class") n.className = v;
      else if (k === "text") n.textContent = String(v);
      else if (k === "href") { var u = safeUrl(v); if (u) { n.setAttribute("href", u); n.setAttribute("target", "_blank"); n.setAttribute("rel", "noopener noreferrer"); } }
      else if (k.slice(0, 2) === "on" && typeof v === "function") n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, String(v));
    }
    (kids || []).forEach(function (c) { if (c === null || c === undefined || c === false) return; n.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return n;
  }
  var SVGNS = "http://www.w3.org/2000/svg";
  function sv(tag, attrs, kids) {
    var n = document.createElementNS(SVGNS, tag);
    if (attrs) for (var k in attrs) {
      if (!Object.prototype.hasOwnProperty.call(attrs, k)) continue;
      var v = attrs[k];
      if (v === null || v === undefined || v === false) continue;
      if (k === "text") n.textContent = String(v);
      else if (k.slice(0, 2) === "on" && typeof v === "function") n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, String(v));
    }
    (kids || []).forEach(function (c) { if (c) n.appendChild(c); });
    return n;
  }
  function arr(x) { return Array.isArray(x) ? x : []; }
  function str(x) { return typeof x === "string" ? x : (x === null || x === undefined ? "" : String(x)); }
  function paras(text) { return str(text).split(/\n\s*\n/).map(function (t) { return t.trim(); }).filter(Boolean).map(function (t) { return el("p", null, rich(t)); }); }
  function link(title, url) { return safeUrl(url) ? el("a", { href: url, text: title }) : el("span", { text: title }); }
  function ul(items, map) { return el("ul", { class: "plain" }, arr(items).map(function (x) { return el("li", null, [map ? map(x) : str(x)]); })); }
  function fmtCit(n) { n = Number(n); if (!(n >= 0)) return "—"; if (n >= 1000) return (n / 1000).toFixed(n >= 10000 ? 0 : 1) + "k"; return String(n); }

  // ---------- math (MathJax, typeset lazily) ----------
  var mathReady = false, mathQueue = [];
  function mathUsable() { return !!(window.MathJax && typeof window.MathJax.typesetPromise === "function"); }
  function flushMath() { mathReady = true; var q = mathQueue.slice(); mathQueue = []; q.forEach(typeset); }
  window.__atlasMathReady = flushMath;
  // MathJax may finish loading before this script runs (cached/async), so also poll for it.
  var mathPoll = setInterval(function () { if (mathUsable()) { clearInterval(mathPoll); flushMath(); } }, 200);
  setTimeout(function () { clearInterval(mathPoll); }, 30000);
  function typeset(node) {
    if (!node) return;
    if (!mathReady && mathUsable()) mathReady = true;
    if (!mathReady || !mathUsable()) { mathQueue.push(node); return; }
    try { window.MathJax.typesetPromise([node]).catch(function () { /* leave raw TeX visible */ }); } catch (e) { /* leave raw TeX visible */ }
  }
  function eqList(eqs) {
    eqs = arr(eqs).filter(function (q) { return q && str(q.tex).trim(); });
    if (!eqs.length) return null;
    return el("div", { class: "eqs" }, eqs.map(function (q) {
      return el("div", { class: "eq" }, [el("div", { class: "math-block", text: "\\[" + str(q.tex) + "\\]" }), q.explain_zh ? el("p", null, rich(q.explain_zh)) : null]);
    }));
  }
  document.addEventListener("toggle", function (e) { var t = e.target; if (t && t.tagName === "DETAILS" && t.open) typeset(t); }, true);

  // ================= frame (Tufte site): links, notes, hover previews, top bar, theme =================
  var SITE = DATA.site || {};
  var ROOT = str(SITE.root);
  var XREF = DATA.xref || {};
  function hasX(key) { return Object.prototype.hasOwnProperty.call(XREF, key); }
  // Custom page parts (search tools, diagrams, charts) register here; blocks.js calls them for {"b": "slot"} blocks.
  var SLOTS = {};

  // ---------- internal links: urls are relative to the site root; pages sit at different depths ----------
  var SAFE_PATH = /^[A-Za-z0-9][A-Za-z0-9._\/-]*(\?[A-Za-z0-9=&._-]+)?(#[A-Za-z0-9._-]+)?$/;
  function relHref(u) {
    u = str(u);
    if (/^#[A-Za-z0-9._-]+$/.test(u)) return u;
    if (!SAFE_PATH.test(u)) return null;
    var cut = u.indexOf("#"), path = cut < 0 ? u : u.slice(0, cut);
    if (path === SITE.path) return cut < 0 ? "#" : u.slice(cut);
    return ROOT + u;
  }
  function pageLink(u, text, cls) {
    var h = relHref(u);
    if (!h) return el("span", { class: cls || null, text: text });
    var a = el("a", { class: cls || null, text: text });
    a.setAttribute("href", h);
    return a;
  }
  // A link to a known entry (concept, topic, paper, step...). data-xref drives the hover preview.
  function xlink(key, text, cls) {
    if (!hasX(key)) return text ? document.createTextNode(text) : null;
    var x = XREF[key], a = pageLink(x.u, text || x.n || x.t, cls);
    a.setAttribute("data-xref", key);
    return a;
  }

  // Concept / topic ids mentioned in prose ("见 g-pinhole") become links labelled with the entry's short name.
  var ID_RE = /(a-[a-z0-9]+(?:-[a-z0-9]+)*|[fgdrilnv]-[a-z0-9]+)/g;

        case "eqs": return [eqList(b.eqs)];
        case "qa": return [el("p", { class: "quiz-h", text: "自测" }), el("ol", { class: "quiz" }, arr(b.items).map(function (q) {
          return el("li", null, [el("p", null, rich(q.q)), el("details", null, [el("summary", { text: "答案" }), el("p", null, rich(q.a))])]);
        }))];
        case "res": return [refsList(arr(b.items).map(function (r) {
          return { left: TY[r.type] || r.type || "", url: r.url, t: r.title, gloss: r.note_zh };
        }))];
        case "refs": return [refsList(arr(b.items), b.cls)];
        case "toc": return tocGroups(b.groups, cur().querySelector("h2") ? "h3" : "h2");
        case "table": return [el("div", { class: "table-wrap" + (b.wide ? " fullwidth" : "") }, [el("table", { class: "booktabs" + (b.cls ? " " + b.cls : "") }, [
          el("thead", null, [el("tr", null, arr(b.head).map(function (h) { return el("th", { text: h }); }))]),
          el("tbody", null, arr(b.rows).map(function (r) { return el("tr", null, arr(r).map(function (c) { return cell("td", c); })); }))
        ])])];
        case "timeline": return [el("ul", { class: "refs timeline" }, arr(b.items).map(function (x) {
          return el("li", null, [el("span", { class: "yr", text: str(x[0]) }), el("div", null, rich(x[1]))]);
        }))];
        case "kv": return [el("table", { class: "kv" }, [el("tbody", null, arr(b.items).map(function (x) {
          return el("tr", null, [el("th", { text: x[0] }), el("td", null, rich(x[1]))]);
        }))])];
        case "mtoc": return [marginToc(b.items)];
        case "slot": return typeof SLOTS[b.name] === "function" ? [SLOTS[b.name](b)] : [];
        default: return [];
      }
    }
    // Long articles: a table of contents at the top of the margin (a folding list on phones).
    function marginToc(items) {
      var d = el("details", { class: "mtoc" }, [el("summary", { text: "本文目录" }), el("ol", null, arr(items).map(function (x) { return el("li", null, [part(x)]); }))]);
      var wide = window.matchMedia("(min-width: 761px)");
      d.open = wide.matches;
      return d;
    }
    arr(PG.body).forEach(function (b) {
      if (b.b === "sec") {
        box = el("section", { id: b.id || null });
        if (b.h) box.appendChild(heading("h2", { t: b.h, sn: b.sn }));
        art.appendChild(box);
        return;
      }
      render(b).forEach(function (n) { if (n) cur().appendChild(n); });
    });

    var S = PG.series || {};
    if (S.prev || S.next || S.up) {
      var nav = el("nav", { class: "series", "aria-label": "同系列" });
      nav.appendChild(el("div", { class: "prev" }, S.prev ? [el("small", { text: "上一篇" }), part(S.prev)] : []));
      nav.appendChild(el("div", { class: "up" }, S.up ? [part(S.up)] : []));
      nav.appendChild(el("div", { class: "next" }, S.next ? [el("small", { text: "下一篇" }), part(S.next)] : []));
      art.appendChild(nav);
    }
  })();

  finishPage();
})();
</script>
