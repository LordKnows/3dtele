/* ---------- fonts: ET Book for Latin (self-hosted), Noto Serif SC for Chinese text, LXGW WenKai for notes ---------- */
/* ET Book leaves curly quotes, dashes and ellipses to the Chinese font so they keep full width in Chinese prose,
   and single guillemets (› ‹), which it lacks. */
@font-face { font-family: "et-book"; font-weight: 400; font-style: normal; font-display: swap;
  src: url("../../fonts/et-book/et-book-roman-line-figures.woff") format("woff");
  unicode-range: U+0000-2013, U+2015-2017, U+201A-201B, U+201E-2025, U+2027-2038, U+203B-FFFF; }
@font-face { font-family: "et-book"; font-weight: 400; font-style: italic; font-display: swap;
  src: url("../../fonts/et-book/et-book-display-italic-old-style-figures.woff") format("woff");
  unicode-range: U+0000-2013, U+2015-2017, U+201A-201B, U+201E-2025, U+2027-2038, U+203B-FFFF; }
@font-face { font-family: "et-book"; font-weight: 700; font-style: normal; font-display: swap;
  src: url("../../fonts/et-book/et-book-bold-line-figures.woff") format("woff");
  unicode-range: U+0000-2013, U+2015-2017, U+201A-201B, U+201E-2025, U+2027-2038, U+203B-FFFF; }
/* Notes pair Latin italic with upright Kai (the "italic ↔ 楷体" rule): the italic cut is registered as an upright
   family so the browser never slants the Chinese glyphs. */
@font-face { font-family: "et-book-note"; font-weight: 400; font-style: normal; font-display: swap;
  src: url("../../fonts/et-book/et-book-display-italic-old-style-figures.woff") format("woff");

@font-face { font-family: "et-book-osf"; font-weight: 400; font-style: normal; font-display: swap;
  src: url("../../fonts/et-book/et-book-roman-old-style-figures.woff") format("woff"); }

:root {
  --bg: #fffff8;
  --ink: #111111;
  --ink-2: #3c3c36;
  --muted: #74746a;
  --rule: #d8d6c8;
  --rule-2: #b9b6a4;
  --accent: #a8322d;
  --serif: "et-book", "Noto Serif SC", "Source Han Serif SC", "Songti SC", "STSong", "SimSun", Palatino, Georgia, serif;
  --note: "et-book-note", "LXGW WenKai", "Kaiti SC", "STKaiti", "KaiTi", "et-book", serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --side: clamp(12rem, 21vw, 17rem);
  --gap: 2.75rem;
  --main: calc(100% - var(--side) - var(--gap));
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161614; --ink: #e2e0d6; --ink-2: #c3c1b6; --muted: #979589; --rule: #34332e; --rule-2: #4d4b44; --accent: #e8836f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161614; --ink: #e2e0d6; --ink-2: #c3c1b6; --muted: #979589; --rule: #34332e; --rule-2: #4d4b44; --accent: #e8836f;
  color-scheme: dark;
}

/* ---------- base ---------- */
* { box-sizing: border-box; }
html { font-size: 16px; -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--serif); font-size: 1.15625rem; line-height: 1.85;
  font-kerning: normal; font-variant-numeric: lining-nums;
  /* Space between Chinese and Latin text where the source has none; squeeze adjacent CJK punctuation
     (text-spacing-trim applies the fonts' halt / chws features). Browsers without them keep the source spacing. */
  text-autospace: normal; text-spacing-trim: normal;
  overflow-wrap: break-word;
  padding-top: env(safe-area-inset-top, 0px);
}
[hidden] { display: none !important; }
a { color: inherit; text-decoration-line: underline; text-decoration-thickness: 1px; text-underline-offset: .18em; text-decoration-color: var(--rule-2); }
a:hover { color: var(--accent); text-decoration-color: currentColor; }
a:focus-visible, button:focus-visible, summary:focus-visible, label:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }
.skip { position: absolute; left: -999px; top: 0; }
.skip:focus { left: 1rem; top: .5rem; background: var(--bg); padding: .2rem .5rem; z-index: 60; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
p { margin: 0; }
p + p { margin-top: .9em; }

/* ---------- top bar ---------- */
.topbar { border-bottom: 1px solid var(--rule); }
.bar-in { max-width: 67rem; margin: 0 auto; padding: 0 1.5rem; display: flex; align-items: center; gap: 2.2rem; min-height: 3.1rem; }
.brand { font-size: 1rem; text-decoration: none; letter-spacing: .02em; white-space: nowrap; }
.site-nav { flex: 1; }
.menus { list-style: none; margin: 0; padding: 0; display: flex; gap: 1.6rem; }
.menu { position: relative; }
.menu-btn, .theme-btn, .burger {
  font-family: "et-book", var(--serif); font-variant-caps: all-small-caps; letter-spacing: .08em; font-size: 1.12rem;
  color: var(--ink-2); line-height: 3.1rem;
}
.menu-btn:hover, .theme-btn:hover, .burger:hover, .menu.open > .menu-btn { color: var(--accent); }
.menu.cur > .menu-btn { color: var(--ink); box-shadow: inset 0 -1px 0 var(--ink); }
.drop {
  display: none; position: absolute; left: -1rem; top: 100%; z-index: 40; min-width: 13rem;
  list-style: none; margin: 0; padding: .45rem 0; background: var(--bg); border: 1px solid var(--rule);
}
.menu.open > .drop { display: block; }
.drop a { display: block; padding: .15rem 1rem; text-decoration: none; font-size: 1.02rem; color: var(--ink-2); white-space: nowrap; }
.drop a:hover, .drop a:focus-visible { color: var(--accent); }
.drop a.cur { color: var(--ink); }
.drop a.cur::before { content: "›"; position: absolute; margin-left: -.7rem; color: var(--accent); }
.theme-btn { margin-left: auto; }
.burger { display: none; }

/* ---------- article column + margin ---------- */
main { display: block; }
.art { max-width: 67rem; margin: 0 auto; padding: 2.6rem 1.5rem 3rem; counter-reset: sidenote-counter; }
.art > *, .art section > * { width: var(--main); }
.art > section { width: 100%; }
.art .fullwidth { width: 100%; }
section { padding-top: .6rem; }

.crumbs { font-size: .86rem; color: var(--muted); letter-spacing: .01em; }
.crumbs a { color: var(--muted); text-decoration: none; }
.crumbs a:hover { color: var(--accent); }
.crumbs .sep { margin: 0 .45em; color: var(--rule-2); }
h1, h2, h3 { font-family: var(--serif); color: var(--ink); text-wrap: balance; }
h1 { font-size: 2.3rem; font-weight: 400; line-height: 1.3; margin: .9rem 0 0; letter-spacing: .01em; }
.subtitle { font-family: "et-book", var(--note); font-style: italic; font-size: 1.45rem; line-height: 1.3; color: var(--ink-2); margin-top: .35rem; }
.meta { font-size: .92rem; color: var(--muted); margin-top: 1.1rem; }
.meta a { color: var(--muted); }
h2 { font-size: 1.42rem; font-weight: 600; line-height: 1.4; margin: 2.6rem 0 .9rem; }
h3 { font-size: 1.12rem; font-weight: 600; line-height: 1.5; margin: 1.8rem 0 .5rem; }
h3 .used { font-family: var(--note); font-weight: 400; font-size: .86rem; color: var(--muted); margin-left: .6em; }

.epigraph { margin: 2.2rem 0 .6rem; }
.epigraph blockquote { margin: 0; padding: 0 0 0 1.6rem; border-left: 1px solid var(--rule-2); }
.epigraph p { font-family: var(--note); font-size: 1.12rem; line-height: 1.85; color: var(--ink-2); }

.art ol, .art ul { margin: .6rem 0 0; padding-left: 1.6em; }
.art li + li { margin-top: .45rem; }
li::marker { font-family: "et-book-osf", var(--serif); color: var(--muted); }

/* Equations: display math in the text column, scrolling sideways on narrow screens. */
.eqs { display: block; }
.eq + .eq { margin-top: 1.6rem; }
.math-block { overflow-x: auto; overflow-y: hidden; margin: .4rem 0 .6rem; padding: .2rem 0; font-size: 1rem; }
.math-block mjx-container { margin: 0 !important; }

/* ---------- side notes & margin notes (floated into the right margin) ---------- */
.sidenote, .marginnote {
  float: right; clear: right; position: relative;
  width: var(--side); margin-right: calc(-1 * (var(--side) + var(--gap))); margin-top: .3rem; margin-bottom: .6rem;
  font-family: var(--note); font-size: .88rem; line-height: 1.6; color: var(--ink-2); text-align: left;
  font-style: normal; font-weight: 400; letter-spacing: 0;
}
h3 .sidenote { margin-top: .2rem; }
.sidenote-number { counter-increment: sidenote-counter; }
.sidenote-number::after, .sidenote::before { font-family: "et-book-osf", var(--serif); position: relative; vertical-align: baseline; }
.sidenote-number::after { content: counter(sidenote-counter); font-size: .75rem; top: -.55em; left: .08em; color: var(--ink-2); }
.sidenote::before { content: counter(sidenote-counter) " "; font-size: .8rem; top: -.4em; }
.note-label { font-family: var(--serif); font-weight: 600; font-size: .82rem; color: var(--muted); margin-right: .5em; }
.marginnote .note-label { display: block; margin: 0 0 .1rem; }
input.margin-toggle { display: none; }
label.sidenote-number { display: inline; cursor: default; }
label.margin-toggle:not(.sidenote-number) { display: none; }

/* ---------- quiz, further reading, series ---------- */
.quiz details { margin-top: .3rem; }
.quiz summary { font-family: var(--note); font-size: .92rem; color: var(--muted); cursor: pointer; list-style: none; display: inline-block; }
.quiz summary::-webkit-details-marker { display: none; }
.quiz summary::before { content: "+ "; font-family: "et-book", var(--serif); }
.quiz details[open] summary::before { content: "− "; }
.quiz summary:hover { color: var(--accent); }
.quiz details > p { margin-top: .3rem; padding-left: 1rem; border-left: 1px solid var(--rule); color: var(--ink-2); }

/* Reference lists: a narrow label column (kind / year) and a hanging text column. */
.art ul.refs { list-style: none; padding-left: 0; }
.refs li { display: grid; grid-template-columns: 2.8rem minmax(0, 1fr); column-gap: .5rem; line-height: 1.6; }
.refs li > :not(.kind):not(.yr) { grid-column: 2; }
.refs .kind, .refs .yr { grid-column: 1; font-family: var(--note); font-size: .86rem; color: var(--muted); padding-top: .12rem; }
.refs .yr { font-family: "et-book-osf", var(--serif); font-size: .95rem; padding-top: .05rem; }
.refs .en { font-family: "et-book", var(--serif); font-style: italic; color: var(--muted); font-size: .92rem; line-height: 1.5; }
.refs .gloss { font-family: var(--note); font-size: .88rem; color: var(--ink-2); margin-top: .1rem; }
.art .refs li + li { margin-top: .75rem; }
.art .papers li + li { margin-top: .35rem; }
/* Without a label column the list is a plain stack (no grid, so nothing can land in a phantom second column). */
.refs.noleft li { display: block; }
.refs.wide-kind li { grid-template-columns: 6.2rem minmax(0, 1fr); }
.refs .used { font-family: var(--note); font-size: .82rem; color: var(--muted); margin-left: .5em; }
.refs.terms .plain-t { font-weight: 600; }
.refs.terms .en { display: inline; margin-left: .6em; }
.timeline li { line-height: 1.7; }
.art .timeline li + li { margin-top: .4rem; }

/* ---------- blocks: lede, run-in labels, notes ---------- */
.lede { margin-top: 1.6rem; color: var(--ink-2); }
.run-in { font-weight: 600; color: var(--ink); }
p.note { font-family: var(--note); font-size: .9rem; color: var(--muted); margin-top: .1rem; }
h2 .en, h3 .en { font-family: "et-book", var(--serif); font-style: italic; font-weight: 400; color: var(--muted); margin-left: .6em; font-size: .92em; }
h2 a, h3 a { text-decoration-color: var(--rule); }
.quiz-h { font-family: var(--note); font-size: .88rem; color: var(--muted); margin-top: 1.4rem; }
.quiz-h + ol.quiz { margin-top: .2rem; }

/* Index pages: a table of contents instead of a card grid. */
.art ol.toc { list-style: none; padding-left: 0; margin-top: .4rem; }
.art ol.toc > li + li { margin-top: .85rem; }
.toc-t { line-height: 1.55; }
.toc-t .en { font-family: "et-book", var(--serif); font-style: italic; color: var(--muted); margin-left: .6em; font-size: .95em; }
.toc-meta { font-family: var(--note); font-size: .82rem; color: var(--muted); margin-left: .7em; white-space: nowrap; }
.toc-s { font-family: var(--note); font-size: .9rem; line-height: 1.65; color: var(--ink-2); margin-top: .1rem; }
.toc-lede { font-family: var(--note); color: var(--ink-2); font-size: .95rem; }
h2.toc-h, h3.toc-h { margin-bottom: .3rem; }

/* Tables: booktabs rules (top, under the header, bottom), no vertical lines, no fills. */
.table-wrap { overflow-x: auto; margin: 1rem 0; }
table.booktabs { border-collapse: collapse; width: 100%; font-size: .9rem; line-height: 1.6; border-top: 1.5px solid var(--ink); border-bottom: 1.5px solid var(--ink); }
table.booktabs th { text-align: left; font-weight: 600; padding: .45rem .7rem .35rem 0; border-bottom: 1px solid var(--ink); white-space: nowrap; vertical-align: bottom; }
table.booktabs td { padding: .45rem .9rem .45rem 0; vertical-align: top; border-top: 1px solid var(--rule); }
table.booktabs tbody tr:first-child td { border-top: 0; }
table.rank td { white-space: nowrap; font-variant-numeric: tabular-nums; }
table.rank td:nth-child(2) { white-space: normal; }
.art table.kv { border-collapse: collapse; margin: .6rem 0; font-size: .95rem; width: auto; }
table.kv th { text-align: left; font-weight: 400; color: var(--muted); padding: .25rem 1.2rem .25rem 0; vertical-align: top; min-width: 5em; max-width: 12em; font-family: var(--note); }
table.kv td { padding: .25rem 0; vertical-align: top; }

/* Long articles: the table of contents sits at the top of the margin. */
/* It sits in a full-width section, so it floats into the margin without a negative offset. */
details.mtoc {
  float: right; clear: right; width: var(--side); margin-right: 0; margin-bottom: 1rem;
  font-family: var(--note); font-size: .86rem; line-height: 1.55; color: var(--ink-2);
}
details.mtoc summary { font-family: var(--serif); font-weight: 600; font-size: .82rem; color: var(--muted); list-style: none; cursor: default; }
details.mtoc summary::-webkit-details-marker { display: none; }
.art details.mtoc ol { list-style: none; padding: 0; margin: .3rem 0 0; }
.art details.mtoc li + li { margin-top: .25rem; }
details.mtoc a { text-decoration: none; }
details.mtoc a:hover { text-decoration: underline; }

/* Tools: search and filters with underlined inputs. */
.tool { margin-top: 1rem; }
.filters { display: flex; flex-wrap: wrap; gap: .6rem 1.6rem; align-items: baseline; font-family: var(--note); font-size: .92rem; color: var(--muted); }
.filters label { display: inline-flex; gap: .5rem; align-items: baseline; }
.filters input, .filters select {
  font: inherit; color: var(--ink); background: transparent; border: 0; border-bottom: 1px solid var(--rule-2); border-radius: 0;
  padding: .15rem .1rem; min-width: 7rem;
}
.filters input[type="search"] { min-width: 14rem; }
.filters select { max-width: 16rem; }
.filters input:focus, .filters select:focus { outline: none; border-bottom-color: var(--accent); }
.filters select option { background: var(--bg); color: var(--ink); }
.filters .count { margin-left: auto; font-family: var(--mono); font-size: .8rem; }
table.gl td.en { font-family: "et-book", var(--serif); width: 20%; }
table.gl .abbr { color: var(--muted); }
table.gl td.zh { white-space: nowrap; }
table.gl td.def { color: var(--ink-2); min-width: 20rem; }
table.gl td.c { font-size: .85rem; min-width: 9rem; padding-right: 0; }
table.gl tr:target td { background: color-mix(in srgb, var(--accent) 8%, transparent); }
table.db td.y { font-family: "et-book-osf", var(--serif); white-space: nowrap; }
table.db td.t { min-width: 16rem; }
table.db td.t small { display: block; color: var(--muted); font-size: .8rem; line-height: 1.45; margin-top: .15rem; }
table.db td.tags { min-width: 7rem; font-family: var(--note); font-size: .8rem; color: var(--muted); }
table.db td.tags span { display: block; }
table.db .tier.milestone { color: var(--ink); font-weight: 600; }
table.db td.s { min-width: 18rem; color: var(--ink-2); }
table.db td.n { min-width: 12rem; font-size: .82rem; color: var(--ink-2); }

/* Figures: the pipeline diagram and the timeline of classic papers, drawn in ink with one accent for interaction. */
figure { margin: 1.4rem 0; }
svg a { text-decoration: none; }
.diagram-wrap, .lanes-wrap { position: relative; overflow-x: auto; }
svg.diagram { width: 100%; min-width: 760px; height: auto; display: block; font-family: var(--note); }
svg.diagram .dnode rect { fill: var(--bg); stroke: var(--ink-2); stroke-width: 1; }
svg.diagram .dnode rect.data { stroke-dasharray: 4 3; }
svg.diagram .dnode:hover rect, svg.diagram .dnode:focus rect { stroke: var(--accent); stroke-width: 1.5; }
svg.diagram .dnode:focus { outline: none; }
svg.diagram text { fill: var(--ink); }
svg.diagram text.k { font-family: var(--mono); font-size: 10px; fill: var(--muted); }
svg.diagram text.t { font-family: var(--serif); font-size: 13px; font-weight: 600; }
svg.diagram text.s { font-size: 11px; fill: var(--ink-2); }
svg.diagram .dedge { fill: none; stroke: var(--ink-2); stroke-width: 1; }
svg.diagram .dedge.fb { stroke-dasharray: 4 3; }
svg.diagram .dhead { fill: var(--ink-2); }
svg.diagram .dloop { fill: none; stroke: var(--rule-2); stroke-dasharray: 2 3; }
svg.diagram .dlabel { font-size: 12px; fill: var(--muted); }
svg.diagram .dnote { font-size: 11px; fill: var(--muted); }
svg.diagram a.dnode:hover .dnote { fill: var(--accent); }
svg.lanes { width: 100%; min-width: 720px; height: auto; display: block; font-family: var(--note); }
svg.lanes .grid { stroke: var(--rule); stroke-width: 1; }
svg.lanes .axis { font-family: "et-book-osf", var(--serif); font-size: 12px; fill: var(--muted); }
svg.lanes .lane-l { font-size: 12px; fill: var(--ink-2); }
svg.lanes .brk { stroke: var(--muted); fill: none; }
svg.lanes .hit { fill: transparent; }
svg .dot { fill: var(--ink); }
svg .dot.hollow { fill: var(--bg); stroke: var(--ink-2); stroke-width: 1.2; }
svg.lanes a.m:hover .dot, svg.lanes a.m:focus .dot { fill: var(--accent); stroke: var(--accent); }
svg.lanes a.m:focus { outline: none; }
.vtip { position: absolute; z-index: 20; max-width: 20rem; padding: .45rem .7rem; background: var(--bg); border: 1px solid var(--rule-2); font-family: var(--note); font-size: .82rem; line-height: 1.5; pointer-events: none; }
.vtip b { display: block; font-family: "et-book", var(--serif); font-weight: 400; font-size: .92rem; }
.vtip small { display: block; color: var(--muted); }
.vtip span { color: var(--accent); }
figcaption { font-family: var(--note); font-size: .85rem; color: var(--muted); margin-top: .4rem; }
figcaption svg { vertical-align: -1px; }

.series { display: grid; grid-template-columns: 1fr auto 1fr; gap: 1rem; align-items: end; margin-top: 3.2rem; padding-top: 1rem; border-top: 1px solid var(--rule); font-size: .98rem; }
.series small { display: block; font-family: var(--note); font-size: .8rem; color: var(--muted); }
.series .up { text-align: center; font-size: .88rem; }
.series .up a { color: var(--muted); }
.series .next { text-align: right; }

.site-foot { max-width: 67rem; margin: 0 auto; padding: 1.2rem 1.5rem 2.5rem; font-size: .82rem; color: var(--muted); }
.site-foot a { color: var(--muted); text-decoration: none; }

/* ---------- hover preview ---------- */
.xtip {

ge-based rendering: forward/backward warping, holes & flying pixels", "m": "Foundations · M5 基于图像的渲染（IBR）", "s": "有了逐像素深度，就能把一张图“搬”到新视角。", "n": "基于深度的渲染"}, "concept-l-attention": {"u": "basics/foundations/l-attention.html", "t": "注意力机制与 Transformer", "e": "Attention & Transformers", "m": "Foundations · M6 深度学习基础（3D 视觉视角）", "s": "注意力用 query 与一组 key 的缩放点积经 softmax 得到权重，再对 value 做加权平均。", "n": "注意力机制与 Transformer"}, "concept-l-cnn": {"u": "basics/foundations/l-cnn.html", "t": "卷积网络、残差块与 U-Net", "e": "CNNs, residual blocks & U-Net", "m": "Foundations · M6 深度学习基础（3D 视觉视角）", "s": "卷积用共享的小核在图像上滑动，提取局部特征；残差连接让深层网络容易训练；U-Net 用编码器下采样、解码器上采样和同尺度跳连，同时获得大感受野和像素级精度。", "n": "卷积网络、残差块与 U-Net"}, "concept-l-diffusion": {"u": "basics/foundations/l-diffusion.html", "t": "扩散模型入门", "e": "Diffusion models primer", "m": "Foundations · M6 深度学习基础（3D 视觉视角）", "s": "扩散模型先把数据逐步加噪成纯高斯噪声，再训练网络一步步去噪，从而学会从复杂分布中采样。", "n": "扩散模型入门"}, "concept-l-encoding": {"u": "basics/foundations/l-encoding.html", "t": "位置编码、傅里叶特征与射线编码", "e": "Positional encoding, Fourier features & ray encodings", "m": "Foundations · M6 深度学习基础（3D 视觉视角）", "s": "神经网络对低维坐标输入天生偏爱平滑函数，这叫频谱偏置。", "n": "位置编码、傅里叶特征与射线编码"}, "concept-l-iterative": {"u": "basics/foundations/l-iterative.html", "t": "学习式迭代细化与展开优化", "e": "Learned iterative refinement & unrolled optimization", "m": "Foundations · M6 深度学习基础（3D 视觉视角）", "s": "做法是把“渲染当前估计 → 与观测比较 → 更新”这个迭代优化过程，展开成固定的几步，每步的更新量由神经网络给出，整体端到端训练。", "n": "学习式迭代细化与展开优化"}, "concept-l-loss": {"u": "basics/foundations/l-loss.html", "t": "损失函数与训练实践", "e": "Losses & training practice", "m": "Foundations · M6 深度学习基础（3D 视觉视角）", "s": "损失函数决定网络眼中什么是“好图像”：L2 偏向均值（结果偏糊），L1 偏向中位数，SSIM 关注局部结构，LPIPS 用深度特征度量感知差异。", "n": "损失函数与训练实践"}, "concept-n-3dgs": {"u": "basics/foundations/n-3dgs.html", "t": "3D Gaussian Splatting（3D 高斯溅射）", "e": "3D Gaussian Splatting", "m": "Foundations · M7 神经渲染核心", "s": "3DGS 用数百万个带颜色、不透明度和各向异性协方差的 3D 高斯表示场景。", "n": "3D Gaussian Splatting（3D 高斯溅射）"}, "concept-n-generalizable": {"u": "basics/foundations/n-generalizable.html", "t": "可泛化 / 前馈式新视角合成", "e": "Generalizable / feed-forward novel view synthesis", "m": "Foundations · M7 神经渲染核心", "s": "可泛化（前馈式）新视角合成先在大量场景上训练一个网络，推理时只做一次前向：输入几张已标定的邻近视图，直接输出新视角图像，或者输出一个可以渲染的中间表示，全程不做逐场景优化。", "n": "可泛化 / 前馈式新视角合成"}, "concept-n-nerf": {"u": "basics/foundations/n-nerf.html", "t": "神经辐射场（NeRF）", "e": "Neural Radiance Fields", "m": "Foundations · M7 神经渲染核心", "s": "NeRF 用一个 MLP 把三维点和观察方向映射成体密度和颜色，再用可微的体渲染沿射线积分成像素，针对每个场景用几十到上百张照片做梯度下降来拟合。", "n": "神经辐射场（NeRF）"}, "concept-r-raster": {"u": "basics/foundations/r-raster.html", "t": "光栅化、z-buffer 与点溅射（splatting）", "e": "Rasterization, z-buffer & point splatting", "m": "Foundations · M4 图形学与渲染基础", "s": "光栅化以图元为中心：把三角形或点投到屏幕上，再用 z-buffer 为每个像素保留最近的那个图元。", "n": "光栅化、z-buffer 与点溅射（splatting）"}, "concept-r-reps": {"u": "basics/foundations/r-reps.html", "t": "三维表示总览：点、网格、体素、隐式场、高斯", "e": "3D representations: points, meshes, voxels, implicit fields, Gaussians", "m": "Foundations · M4 图形学与渲染基础", "s": "点、网格、体素、隐式场、高斯和分层图像，在存储、渲染、编辑和时间一致性上各有取舍。", "n": "三维表示总览"}, "concept-r-volume": {"u": "basics/foundations/r-volume.html", "t": "体渲染方程与离散化", "e": "The volume rendering equation & its discretization", "m": "Foundations · M4 图形学与渲染基础", "s": "体渲染把场景看成一团既发光又吸收的介质。", "n": "体渲染方程与离散化"}, "concept-v-metrics": {"u": "basics/foundations/v-metrics.html", "t": "图像与视频质量指标", "e": "Image & video quality metrics", "m": "Foundations · M8 视频、时间一致性、评测与系统", "s": "单帧指标（PSNR、SSIM、LPIPS、FLIP）回答“这一帧像不像真值”；时间与视角指标（warping error、tOF、TCC、STED、SDT/SDV、EPI）回答“误差随时间、随视点是否稳定”。", "n": "图像与视频质量指标"}, "concept-v-temporal": {"u": "basics/foundations/v-temporal.html", "t": "时间一致性、闪烁与时域滤波", "e": "Temporal consistency, flicker & temporal filtering", "m": "Foundations · M8 视频、时间一致性、评测与系统", "s": "逐帧独立预测时，每帧误差互不相关，这些误差会直接表现为闪烁。", "n": "时间一致性、闪烁与时域滤波"}, "theme-t-dynamic-human": {"u": "basics/classics/t-dynamic-human.html", "t": "动态场景、4D 与人体（2019–2025）", "e": "", "m": "Classics", "s": "本主题收录 25 篇论文。范围：D-NeRF, Nerfies, HyperNeRF, NSFF, DyNeRF (N3DV), K-Planes, HexPlane, 4DGS, Dynamic 3D Gau…"}}, "page": {"id": "theme-t-generative-ff", "head": {"title": "生成式先验、前馈重建与评测基础（2014–2025）", "sub": "Classics", "meta": ["25 篇论文"], "epigraph": "", "prereqs": [], "lede": "", "minutes": 27}, "body": [{"b": "sec", "h": null, "id": "list"}, {"b": "p", "t": "本主题收录 25 篇论文，按年份排列。范围：DDPM, DDIM, LDM, ControlNet, SVD, DreamFusion, Zero-1-to-3, MVDream, CAT3D, LRM, pixelSplat, MVSplat, GS-LRM, LVSM; metrics & data foundations: SSIM, LPIPS, FLIP, blind video temporal consistency, DTU, Tanks&Temples, ScanNet, RealEstate10K, DL3DV, DyNeRF dataset"}, {"b": "slot", "name": "classics-chart"}, {"b": "refs", "items": [{"left": "2004", "u": "#classic-20", "t": "Image Quality Assessment: From Error Visibility to Structural Similarity", "tag": "必读"}, {"left": "2013", "u": "#classic-33", "t": "Video Quality Assessment by Reduced Reference Spatio-Temporal Entropic Differencing", "tag": ""}, {"left": "2014", "u": "#classic-34", "t": "Large Scale Multi-view Stereopsis Evaluation", "tag": ""}, {"left": "2017", "u": "#classic-46", "t": "ScanNet: Richly-annotated 3D Reconstructions of Indoor Scenes", "tag": ""}, {"left": "2017", "u": "#classic-49", "t": "Tanks and Temples: Benchmarking Large-Scale Scene Reconstruction", "tag": ""}, {"left": "2018", "u": "#classic-53", "t": "The Unreasonable Effectiveness of Deep Features as a Perceptual Metric", "tag": "必读"}, {"left": "2018", "u": "#classic-59", "t": "Learning Blind Video Temporal Consistency", "tag": "必读"}, {"left": "2019", "u": "#classic-70", "t": "Exploiting Temporal Consistency for Real-Time Video Depth Estimation", "tag": ""}, {"left": "2020", "u": "#classic-71", "t": "Denoising Diffusion Probabilistic Models", "tag": "必读"}, {"left": "2020", "u": "#classic-82", "t": "FLIP: A Difference Evaluator for Alternating Images", "tag": ""}, {"left": "2021", "u": "#classic-83", "t": "Denoising Diffusion Implicit Models", "tag": ""}, {"left": "2022", "u": "#classic-102", "t": "High-Resolution Image Synthesis with Latent Diffusion Models", "tag": "必读"}, {"left": "2023", "u": "#classic-114", "t": "Adding Conditional Control to Text-to-Image Diffusion Models", "tag": ""}, {"left": "2023", "u": "#classic-115", "t": "DreamFusion: Text-to-3D using 2D Diffusion", "tag": ""}, {"left": "2023", "u": "#classic-116", "t": "Stable Video Diffusion: Scaling Latent Video Diffusion Models to Large Datasets", "tag": ""}, {"left": "2023", "u": "#classic-117", "t": "Zero-1-to-3: Zero-shot One Image to 3D Object", "tag": ""}, {"left": "2024", "u": "#classic-127", "t": "MVDream: Multi-view Diffusion for 3D Generation", "tag": ""}, {"left": "2024", "u": "#classic-130", "t": "LRM: Large Reconstruction Model for Single Image to 3D", "tag": ""}, {"left": "2024", "u": "#classic-132", "t": "pixelSplat: 3D Gaussian Splats from Image Pairs for Scalable Generalizable 3D Reconstruction", "tag": "必读"}, {"left": "2024", "u": "#classic-133", "t": "MVSplat: Efficient 3D Gaussian Splatting from Sparse Multi-View Images", "tag": "必读"}, {"left": "2024", "u": "#classic-135", "t": "DL3DV-10K: A Large-Scale Scene Dataset for Deep Learning-based 3D Vision", "tag": ""}, {"left": "2024", "u": "#classic-136", "t": "CAT3D: Create Anything in 3D with Multi-View Diffusion Models", "tag": ""}, {"left": "2024", "u": "#classic-138", "t": "GS-LRM: Large Reconstruction Model for 3D Gaussian Splatting", "tag": "必读"}, {"left": "2025", "u": "#classic-149", "t": "Difix3D+: Improving 3D Reconstructions with Single-Step Diffusion Models", "tag": ""}, {"left": "2025", "u": "#classic-150", "t": "LVSM: A Large View Synthesis Model with Minimal 3D Inductive Bias", "tag": "必读"}], "cls": "papers"}, {"b": "sec", "h": "论文", "id": "papers"}, {"b": "h3", "t": "Image Quality Assessment: From Error Visibility to Structural Similarity", "id": "classic-20", "url": "https://doi.org/10.1109/TIP.2003.819861", "sn": {"label": "与重点论文的联系", "t": "Ha et al. 的训练损失是 0.8·L1 + 0.2·L_SSIM（另加 0.1·L_Depth 和 0.1·L_Mask），前两项的配比与 3DGS 相同。它的时间一致性指标 TCC（式 8）直接定义为“渲染帧差图与真值帧差图之间的 SSIM”。两篇重点论文的保真度表都报告 SSIM（Quark 在 RFF 上 0.850，Ha 在 DyNeRF 上 0.936）。如果不理解 SSIM 衡量的是局部结构，就看不懂 TCC 在比什么：它比的是“变化的结构”是否一致，而不是像素值本身。"}}, {"b": "note", "t": "2004 · Zhou Wang, Alan C. Bovik, Hamid R. Sheikh, Eero P. Simoncelli (NYU / UT Austin) · IEEE Transactions on Image Processing 13(4), 2004 · Semantic Scholar 引用 60027 · 难度：入门 · 必读"}, {"b": "p", "t": "它把图像质量评价的关注点从逐像素误差的大小（MSE/PSNR）转到局部结构有没有被保留。此后二十年，图像复原、压缩、渲染和 NVS 论文都把它当作默认的第二指标，几乎所有 NVS 结果表都是 PSNR/SSIM/LPIPS 三列。SSIM 可微，所以 1−SSIM（D-SSIM）也成了常用训练损失，例如 3DGS 用 0.8·L1 + 0.2·D-SSIM。", "label": "为什么有影响力", "mn": {"label": "相关概念与专题", "links": [{"k": "concept-v-metrics"}, {"k": "concept-f-image"}, {"k": "concept-l-loss"}]}}, {"b": "p", "t": "直觉：人眼对整体亮度偏移不敏感，对纹理和边缘结构被破坏很敏感。SSIM 在每个局部窗口（原文用 11×11、σ=1.5 的高斯窗）分别比较亮度（均值 μ）、对比度（标准差 σ）和结构（协方差 σ_xy），公式为 \\( \\mathrm{SSIM}(x,y)=\\frac{(2\\mu_x\\mu_y+C_1)(2\\sigma_{xy}+C_2)}{(\\mu_x^2+\\mu_y^2+C_1)(\\sigma_x^2+\\sigma_y^2+C_2)} \\)。其中 C1=(0.01L)²、C2=(0.03L)² 用来防止分母接近 0，L 是像素动态范围（8 位图像为 255）。对所有窗口取平均得到 MSSIM。数值例：给整幅图加 +10 的亮度偏移，MSE=100，PSNR 降到约 28.1 dB；SSIM 只有亮度项略降（均值 128 对 138 时约 0.997），对比度项和结构项仍为 1，所以总值约 0.997。反过来，轻微模糊会明显拉低结构项。", "label": "主要贡献"}, {"b": "h3", "t": "Video Quality Assessment by Reduced Reference Spatio-Temporal Entropic Differencing", "id": "classic-33", "url": "https://doi.org/10.1109/TCSVT.2012.2214933", "sn": {"label": "与重点论文的联系", "t": "Ha et al. 的 STED 就是这个指标（§4.3 引用 [59]），也是其时间一致性主表 Table 1 的核心列。在 DyNeRF 上，Ha 为 68.76，ENeRF 为 76.14，IBRNet 为 737.7，GPS-Gaussian 为 693.0。消融中去掉 TSDF 引导后，STED 从 68.8 升到 95.4，而 PSNR 只差 0.01 dB，说明论文标题强调的 TSDF 引导，其收益几乎只体现在这一个指标上。在 ENeRF-Outdoor 上，Ha 的 STED 为 44.49，反而差于 ENeRF 的 32.31。STED 衡量的是时空信息量的差异，不是基于光流的 warping 误差，所以它对缓慢漂移和高频闪烁的敏感度与 Lai et al. 的指标不同。Quark 没有报告任何时间指标。"}}, {"b": "note", "t": "2013 · Rajiv Soundararajan, Alan C. Bovik (UT Austin) · IEEE Transactions on Circuits and Systems for Video Technology 23(4):684–694, 2013（2012 年在线发表） · Semantic Scholar 引用 374 · 难度：专家"}, {"b": "p", "t": "论文提出 RRED 系列视频质量指标（空间 SRRED、时间 TRRED 以及二者组合的 ST-RRED）。它是“部分参考”（reduced reference）指标：接收端只需要参考视频的少量统计量，就能评估失真视频的质量，而且同时考虑空间信息和时间信息（帧差）。它是 LIVE 视频质量库上的经典强基线；Ha et al. 等在线 NVS 工作把它借来（称为 STED，spatio-temporal entropic difference）量化时间一致性。", "label": "为什么有影响力", "mn": {"label": "相关概念与专题", "links": [{"k": "concept-v-metrics"}, {"k": "concept-v-temporal"}, {"k": "adv-a-temporal-video"}]}}, {"b": "p", "t": "直觉：自然视频的小波系数近似服从 Gaussian Scale Mixture 统计，失真会改变局部系数所携带的信息量（熵）。做法是在各子带的局部块上计算按局部方差加权的条件熵，再求参考与失真之间的平均差异。空间项 SRRED 对单帧计算；时间项 TRRED 对相邻帧的差分图做同样计算；两者相乘得到 ST-RRED，数值越小越好。“部分参考”的含义是可以只传输每个子带少量的熵值统计，不需要完整参考视频。", "label": "主要贡献"}, {"b": "h3", "t": "Large Scale Multi-view Stereopsis Evaluation", "id": "classic-34", "url": "https://doi.org/10.1109/CVPR.2014.59", "sn": {"label": "与重点论文的联系", "t": "两篇重点论文都没有在 DTU 上评测。它们共同的基线 ENeRF 在原论文中按 MVSNeRF 的协议在 DTU 上训练，再测试跨数据集泛化；Ha 直接使用 ENeRF 作者发布的预训练权重，Quark 则在 RFF+IBRNet 数据上重训了各基线。Quark 迭代式“匹配 + 可见性”中的 plane-sweep 式匹配线索，与主要在 DTU 上发展和评测的学习式 MVS（MVSNet 系列）同源。需要注意，DTU 是受控光照下的桌面物体，和临场场景（人、室内、动态）差距很大。两篇重点论文都改用了更接近真实场景的训练数据：Quark 用 Spaces/RFF/Shiny/SWORD，Ha 用 ScanNet/Spaces/DyNeRF。"}}, {"b": "note", "t": "2014 · Rasmus Jensen, Anders Dahl, George Vogiatzis, Engin Tola, Henrik Aanæs (Technical University of Denmark 等) · CVPR 2014 · Semantic Scholar 引用 1077 · 难度：入门"}, {"b": "p", "t": "这就是 DTU 数据集。它提供了带结构光几何真值的大规模 MVS 基准，是 MVSNet 系列学习式 MVS 的标准训练和测试集，也是 pixelNeRF、MVSNeRF、ENeRF 等可泛化 NVS 方法的常用训练集。“在 DTU 上训练，再在其他数据上零样本测试”由此成为可泛化方法的常见协议。", "label": "为什么有影响力", "mn": {"label": "相关概念与专题", "links": [{"k": "concept-d-mvs"}, {"k": "concept-g-sfm"}, {"k": "concept-d-sensors"}, {"k": "adv-a-learned-mvs"}]}}, {"b": "p", "t": "采集方式：工业机械臂搭载相机和结构光扫描仪，每个物体从 49 或 64 个可精确复现的位置拍摄 1600×1200 图像，并在 7 种光照（从定向光到漫射光）下各采一遍。相机内外参经过高精度标定，每个场景都有结构光扫描作为几何真值。数据集共 124 个场景，其中 80 个用于本文评测；IJCV 2016 的扩展版 “Large-Scale Data for Multiple-View Stereopsis”（Aanæs et al.）描述了完整数据集。评测用两项点云指标：accuracy（重建点到真值的距离）和 completeness（真值点到重建的距离）。", "label": "主要贡献"}, {"b": "h3", "t": "ScanNet: Richly-annotated 3D Reconstructions of Indoor Scenes", "id": "classic-46", "url": "https://arxiv.org/abs/1702.04405", "sn": {"label": "与重点论文的联系", "t": "ScanNet 是 Ha et al. 三个训练数据集之一。Ha 用它的传感器深度（而不是 RAFT-Stereo 估计的深度）训练融合网络，以目标帧为中心在 ±30 帧内取输入帧（排除 ±4 帧）。ScanNet 是静态场景，另两个训练集 DyNeRF 和 Spaces 的输入视角与目标视角也在同一时刻采样，所以 Ha 的网络从未见过视频中的时间变化，损失中也没有时间项。Ha 的 image-based TSDF 融合也延续了 ScanNet 背后的 KinectFusion/BundleFusion 体系（Ha 在“Voxel-based View Synthesis”一段引用 [13] BundleFusion）。Quark 没有使用 ScanNet。"}}, {"b": "note", "t": "2017 · Angela Dai, Angel X. Chang, Manolis Savva, Maciej Halber, Thomas Funkhouser, Matthias Nießner (Stanford / Princeton / TUM) · CVPR 2017 · Semantic Scholar 引用 5924 · 难度：入门"}, {"b": "p", "t": "这是发布时规模最大的真实室内 RGB-D 视频数据集之一（1513 个场景、2.5M 帧），带有相机位姿、表面重建和语义标注。室内 3D 理解、深度估计、SLAM、神经表面重建和可泛化 NVS 都把它当作公共基础数据。", "label": "为什么有影响力", "mn": {"label": "相关概念与专题", "links": [{"k": "concept-d-sensors"}, {"k": "concept-d-tsdf"}, {"k": "concept-g-sfm"}]}}, {"b": "p", "t": "作者用 iPad 加 Structure 深度传感器搭建了一套易扩展的采集系统，配合自动稠密重建（BundleFusion）和众包语义标注。数据共 1513 个扫描、2.5M 帧 RGB-D，每帧都有相机位姿和传感器深度。需要注意，传感器深度在物体边缘处常有缺失，在反光和透明表面上会出现空洞，这正是“深度传感器噪声特性”在实际数据中的样子。", "label": "主要贡献"}, {"b": "h3", "t": "Tanks and Temples: Benchmarking Large-Scale Scene Reconstruction", "id": "classic-49", "url": "https://doi.org/10.1145/3072959.3073599", "sn": {"label": "与重点论文的联系", "t": "Quark 的 Table 3 在 3DGS 所用的 T&T 场景上与逐场景优化方法比较（基线数字直接取自 3DGS 论文）：Quark 为 23.60 / 0.852 / 0.138（PSNR/SSIM/LPIPS），高于 3DGS-30K 的 23.14 / 0.841 / 0.183，排名第一，而 Quark 从未在 T&T 上训练。这是 Quark 声称“前馈方法也能胜过逐场景优化”的关键证据之一。Ha et al. 没有使用这个数据集。"}}, {"b": "note", "t": "2017 · Arno Knapitsch, Jaesik Park, Qian-Yi Zhou, Vladlen Koltun (Intel Labs) · ACM Transactions on Graphics 36(4) (SIGGRAPH 2017) · OpenAlex 引用 1729 · 难度：入门"}, {"b": "p", "t": "这是一个用工业级激光扫描仪获取几何真值、以高分辨率视频作为输入、覆盖真实室内外大场景的重建基准。它的 F-score 协议成为 MVS/SfM 评测的标准。后来 NeRF++、3DGS 等工作把其中的场景（如 Truck、Train）用作 NVS 测试场景，所以它也成了新视角合成的常用基准。", "label": "为什么有影响力", "mn": {"label": "相关概念与专题", "links": [{"k": "concept-d-mvs"}, {"k": "concept-g-sfm"}, {"k": "concept-v-metrics"}]}}, {"b": "p", "t": "场景分为训练集、Intermediate 和 Advanced 三组，输入是高分辨率视频序列，真值来自激光扫描。评测指标：precision P 是重建点中距真值小于阈值 τ 的比例，recall R 是真值点中距重建小于 τ 的比例，二者合成 \\( F=\\frac{2PR}{P+R} \\)，τ 按场景单独设定。数值例：如果重建只覆盖了建筑的一半，但每个点都很准，那么 P≈1、R≈0.5、F≈0.67，即“准但不全”。", "label": "主要贡献"}, {"b": "h3", "t": "The Unreasonable Effectiveness of Deep Features as a Perceptual Metric", "id": "classic-53", "url": "https://arxiv.org/abs/1801.03924", "sn": {"label": "与重点论文的联系", "t": "Quark 的训练损失就是 10·L1 + LPIPS，其中 LPIPS 负责保住锐利纹理。两篇重点论文都报告 LPIPS。一个典型现象：Ha et al. 在 ENeRF-Outdoor 上 PSNR 24.01 输给 ENeRF 的 25.79，LPIPS 却是 0.155，好于对方的 0.167。只有分清 PSNR 偏好均值准确（哪怕模糊）、LPIPS 偏好锐利（哪怕略有错位），才能正确解读这种指标互相矛盾的结果。另外，Quark 在 Shiny 上把分辨率从 1024×768 提到 2048×1536 时，LPIPS 从 0.108 恶化到 0.174，说明 LPIPS 对高分辨率下的细节缺失很敏感。"}}, {"b": "note", "t": "2018 · Richard Zhang, Phillip Isola, Alexei A. Efros, Eli Shechtman, Oliver Wang (UC Berkeley / Adobe Research) · CVPR 2018 · Semantic Scholar 引用 20053 · 难度：入门 · 必读"}, {"b": "p", "t": "论文证明，预训练 CNN 中间特征之间的距离比 PSNR/SSIM 更贴近人类感知，并用人类判断数据标定出 LPIPS。此后神经渲染和 NVS 基本统一用 PSNR/SSIM/LPIPS 报告结果。LPIPS 本身也被大量用作训练损失（感知损失），主要作用是抑制纯 L1/L2 训练带来的模糊。", "label": "为什么有影响力", "mn": {"label": "相关概念与专题", "links": [{"k": "concept-v-metrics"}, {"k": "concept-l-loss"}, {"k": "concept-l-cnn"}]}}, {"b": "p", "t": "作者构建了 BAPPS 数据集：超过 161k 个 64×64 图块，共 484k 条人类判断（以 2AFC 两选一为主，另有 JND 最小可觉差测试），失真既包括传统失真和 CNN 生成的失真，也包括真实算法的输出。度量的计算方式：把两张图送入 AlexNet/VGG/SqueezeNet，取 L 层特征，沿通道做单位归一化得到 \\( \\hat y^l \\)；每个通道乘一个可学习权重 \\( w_l \\) 后求 L2 距离，再对空间位置取平均、对各层求和：\\( d(x,x_0)=\\sum_l \\frac{1}{H_lW_l}\\sum_{h,w}\\| w_l\\odot(\\hat y^l_{hw}-\\hat y^l_{0,hw})\\|_2^2 \\)。骨干网络冻结，w 只做线性标定，即“lin”版本。直觉：对纹理区域做 1 像素平移，PSNR 会大幅下降，但人眼几乎看不出；LPIPS 对这种微小错位相对宽容，对模糊和细节丢失更敏感。", "label": "主要贡献"}, {"b": "h3", "t": "Learning Blind Video Temporal Consistency", "id": "classic-59", "url": "https://arxiv.org/abs/1808.00449", "sn": {"label": "与重点论文的联系", "t": "Quark 明确承认逐帧、逐视角重建会闪烁，但没有报告任何时间指标。Ha et al. 的时间指标只有 STED、TCC、SDT（另有视角指标 SDV），没有基于光流的 warping error，这是本调研深读指出的主要评测缺口。这篇论文可以从两方面补上：一是评测，warping error 应当加入远程临场的评测方案；二是“盲”后处理，可以把 Quark 这类没有时间机制的逐帧 NVS 输出当作 P_t 来做时间稳定。它的短期/长期时间损失也是 anchor_compare 建议给 Quark 类渲染器加的 temporal warping loss 的原型。"}}, {"b": "note", "t": "2018 · Wei-Sheng Lai, Jia-Bin Huang, Oliver Wang, Eli Shechtman, Ersin Yumer, Ming-Hsuan Yang (UC Merced / Virginia Tech / Adobe Research 等) · ECCV 2018 · Semantic Scholar 引用 509 · 难度：进阶 · 必读"}, {"b": "p", "t": "论文把“逐帧处理导致闪烁”抽象成一个与具体任务无关（blind）的后处理问题：同一个循环网络可以稳定风格迁移、上色、增强、本征分解等各种逐帧算法的输出。它提出的光流 warping error 成为衡量视频时间一致性的事实标准指标。它也推广了“短期 + 长期时间损失 + 感知损失”这一训练配方。", "label": "为什么有影响力", "mn": {"label": "相关概念与专题", "links": [{"k": "concept-v-temporal"}, {"k": "concept-v-metrics"}, {"k": "concept-d-flow"}, {"k": "concept-l-loss"}, {"k": "adv-a-temporal-video"}]}}, {"b": "p", "t": "输入是原始视频 {I_t} 和逐帧处理的结果 {P_t}。带 ConvLSTM 的图像变换网络输出 O_t，要求它在内容上贴近 P_t，在时间上跟随 I_t 的运动。训练时用 FlowNet2 光流把 O_{t−1}（短期）和 O_1（长期）warp 到第 t 帧，并用遮挡掩码 M 只在可见像素上惩罚差异。测试时不需要计算光流，1280×720 视频上可达 400+ FPS。评测指标是 \\( E_{warp}(V_t,V_{t+1})=\\frac{1}{\\sum_i M_t^{(i)}}\\sum_i M_t^{(i)}\\|V_t^{(i)}-\\hat V_{t+1}^{(i)}\\|_2^2 \\)：\\( \\hat V_{t+1} \\) 是按光流 warp 回第 t 帧的下一帧，M 是非遮挡掩码，i 是像素索引，最后对整段视频取平均。数值例：静止墙面上某个像素每帧随机亮度 ±5，逐帧 PSNR 几乎看不出问题，warping error 会直接把它记下来。", "label": "主要贡献"}, {"b": "h3", "t": "Exploiting Temporal Consistency for Real-Time Video Depth Estimation", "id": "classic-70", "url": "https://arxiv.org/abs/1908.03706", "sn": {"label": "与重点论文的联系", "t": "Ha et al. 的式 (8) TCC 就是把这里针对深度的定义改用到彩色渲染帧 ℐ^t 和真值 I^t 上。在其 Table 1 中，DyNeRF 上 Ha 为 0.872，ENeRF 为 0.867；ENeRF-Outdoor 上 Ha 为 0.897，是最高值。理解 TCC 只看帧差结构这一点，就能明白两件事：为什么完整模型和去掉 TSDF 引导的版本（0.869）差距很小；为什么这个指标只在相机固定的动态场景里有意义，因为相机固定时，真值帧差只来自场景本身的运动。"}}, {"b": "note", "t": "2019 · Haokui Zhang, Chunhua Shen, Ying Li, Yuanzhouhan Cao, Yu Liu, Youliang Yan (西北工业大学、阿德莱德大学、华为诺亚方舟实验室) · ICCV 2019 · Semantic Scholar 引用 144 · 难度：进阶"}, {"b": "p", "t": "这是较早把视频深度估计的时间一致性作为明确目标的工作。它用 ST-CLSTM 融合相邻帧特征，用对抗式时间一致性损失约束输出，还提出了 TCC（temporal change consistency）和 TMC 两个时间一致性指标，其中 TCC 后来被在线 NVS 工作借用。引用量不高，但它是 Ha et al. 时间指标 TCC 的直接来源。", "label": "为什么有影响力", "mn": {"label": "相关概念与专题", "links": [{"k": "concept-v-temporal"}, {"k": "concept-v-metrics"}, {"k": "concept-d-mono"}, {"k": "adv-a-temporal-video"}]}}, {"b": "p", "t": "方法：在单帧深度网络后面接一个空间-时间 ConvLSTM（ST-CLSTM），几乎不增加计算量，可以实时运行。训练时除了空间损失，还用一个 GAN 判别器区分预测深度序列和真值序列的时间变化，作为时间一致性损失。TCC 定义为预测序列和真值序列的“相邻帧差图”之间 SSIM 的平均：\\( \\mathrm{TCC}=\\frac{1}{T-1}\\sum_{t=1}^{T-1}\\mathrm{SSIM}(|D^t-D^{t+1}|,|G^t-G^{t+1}|) \\)，D 是预测，G 是真值，T 是帧数，越接近 1 越好（另一个指标 TMC 把帧差换成两帧之间的光流）。直觉：它不要求每帧都准确，只要求“哪里在变、怎么变”和真值一致。例：真值里只有人手在动，如果预测在静止墙面上也出现帧差，TCC 就会下降。", "label": "主要贡献"}, {"b": "h3", "t": "Denoising Diffusion Probabilistic Models", "id": "classic-71", "url": "https://arxiv.org/abs/2006.11239", "sn": {"label": "与重点论文的联系", "t": "两篇重点论文都没有使用扩散模型。Quark §2.3 把“带学习先验的生成式方法”（引用 Zero-1-to-3、Tseng et al. 2023 等）归为单视图或受限视角的另一类问题，没有与之比较。重点论文之后的 2026 年工作开始引入扩散，例如 LiveStre4m 用扩散 Transformer 做时间插值和超分辨率。DDPM 的迭代去噪和 Quark 的迭代 render-and-refine 都是多步细化，但前者从噪声出发，采样出一个“可能”的解；后者从观测出发，逼近唯一的真实解。这是两者在临场应用中可信度不同的根源。"}}, {"b": "note", "t": "2020 · Jonathan Ho, Ajay Jain, Pieter Abbeel (UC Berkeley) · NeurIPS 2020 · Semantic Scholar 引用 35379 · 难度：进阶 · 必读"}, {"b": "p", "t": "DDPM 让扩散模型的图像质量首次追上 GAN（无条件 CIFAR-10 上 FID 3.17、IS 9.46），并给出了极简的“预测噪声”训练目标。此后几乎所有图像、视频和 3D 生成模型（LDM/Stable Diffusion、SVD、Zero-1-to-3、CAT3D 等）都建立在这套框架上。", "label": "为什么有影响力", "mn": {"label": "相关概念与专题", "links": [{"k": "concept-l-diffusion"}, {"k": "concept-f-prob"}, {"k": "adv-a-diffusion-3d"}]}}, {"b": "p", "t": "前向过程逐步加高斯噪声：\\( q(x_t|x_{t-1})=\\mathcal N(\\sqrt{1-\\beta_t}\\,x_{t-1},\\beta_t I) \\)，可以一步写成 \\( x_t=\\sqrt{\\bar\\alpha_t}\\,x_0+\\sqrt{1-\\bar\\alpha_t}\\,\\epsilon \\)。其中 β_t 是第 t 步的噪声方差，\\( \\bar\\alpha_t=\\prod_{s\\le t}(1-\\beta_s) \\)，ε~N(0,I)。网络 ε_θ(x_t,t) 学习预测所加的噪声，简化损失为 \\( L=\\mathbb E\\|\\epsilon-\\epsilon_\\theta(x_t,t)\\|^2 \\)。论文证明这个损失等价于加权的变分下界，并与去噪得分匹配和 Langevin 动力学联系起来。设置为 T=1000，β 从 1e-4 线性增加到 0.02。数值例：t=500 时 \\( \\bar\\alpha_t\\approx0.08 \\)，信号系数约 0.28、噪声系数约 0.96，图像已经以噪声为主。采样时要从纯噪声 x_T 反向迭代 1000 步。", "label": "主要贡献"}, {"b": "h3", "t": "FLIP: A Difference Evaluator for Alternating Images", "id": "classic-82", "url": "https://doi.org/10.1145/3406183", "sn": {"label": "与重点论文的联系", "t": "两篇重点论文都没有使用 FLIP。它与临场场景的关联在于：用户转头时新视角不断替换旧视角，边缘跳变和飞点（Ha et al. Fig. 4 中的 flying pixels）会像 flip 对比一样被放大。把 FLIP 误差图和 Ha 的 SDV（L1 误差在各视角间的标准差）一起看，可以更细地诊断视角一致性问题。这是一个可能的评测扩展，重点论文本身没有做。"}}, {"b": "note", "t": "2020 · Pontus Andersson, Jim Nilsson, Tomas Akenine-Möller, Magnus Oskarsson, Kalle Åström, Mark D. Fairchild (NVIDIA / Lund University / RIT) · Proc. ACM on Computer Graphics and Interactive Techniques 3(2) (HPG 2020) · OpenAlex 引用 196 · 难度：进阶"}, {"b": "p", "t": "这是一个面向渲染的误差评估工具。它模拟人在参考图和测试图之间来回切换（flip）时看到的差异，输出逐像素误差图，而不只是一个分数。实时渲染、降噪和路径追踪社区常用它。NVIDIA 官方提供 C++/CUDA/Python 实现和 PyTorch 损失版本，后来还扩展出 HDR-FLIP。", "label": "为什么有影响力", "mn": {"label": "相关概念与专题", "links": [{"k": "concept-v-metrics"}, {"k": "concept-f-image"}]}}, {"b": "p", "t": "FLIP 由两条通路组成。颜色通路：先在对立色空间里用对比敏感度函数（CSF）做空间滤波，滤掉在给定观看距离（每度视角的像素数）下人眼看不到的高频，再在感知均匀的颜色空间中计算色差。特征通路：检测边缘和点状特征上的差异，因为这类差异在来回切换时最显眼。两路合成为 [0,1] 范围的误差图。官方工具除误差图外还输出均值、加权中位数、四分位数等统计量；需要单个数字时，通常报告平均 FLIP 值。直觉例子：MSE 相同时，平坦墙面上几个孤立亮点（萤火虫噪声）在 FLIP 图上的误差远高于均匀分布的轻微噪声，这与切换对比时的实际观感一致。", "label": "主要贡献"}, {"b": "h3", "t": "Denoising Diffusion Implicit Models", "id": "classic-83", "url": "https://arxiv.org/abs/2010.02502", "sn": {"label": "与重点论文的联系", "t": "重点论文没有使用扩散模型，但 DDIM 说明了引入生成式先验时的时间门槛。Quark 在单张 A100 上重建加渲染约 32–33 ms/帧（1080p 约 30 fps）；Ha et al. 用 TensorRT 约 39 ms/帧（不含立体深度估计）。即使每次网络调用只要 10 ms，50 步 DDIM 也需要 0.5 s。所以想把扩散补洞加进临场管线，必须用少步或单步采样。例如 Difix 基于单步的 SD-Turbo，在 A100 上仍需额外 76 ms。"}}, {"b": "note", "t": "2021 · Jiaming Song, Chenlin Meng, Stefano Ermon (Stanford University) · ICLR 2021 · Semantic Scholar 引用 13573 · 难度：进阶"}, {"b": "p", "t": "DDIM 不改训练，只改采样：它把 DDPM 的 1000 步马尔可夫链换成可以跳步的非马尔可夫采样，墙钟时间快 10–50 倍。它确立了“训练与采样解耦”的思路，并给出噪声与图像之间的确定性映射。后续的 DPM-Solver、蒸馏和一致性模型等少步采样研究都从这里出发；图像反演编辑和 SDS 类方法也常用它。", "label": "为什么有影响力", "mn": {"label": "相关概念与专题", "links": [{"k": "concept-l-diffusion"}, {"k": "concept-f-prob"}]}}, {"b": "p", "t": "在同一个训练目标下，DDIM 构造了一族非马尔可夫前向过程。采样分两步：先估计干净图像 \\( \\hat x_0=(x_t-\\sqrt{1-\\bar\\alpha_t}\\,\\epsilon_\\theta(x_t,t))/\\sqrt{\\bar\\alpha_t} \\)，再得到 \\( x_{t'}=\\sqrt{\\bar\\alpha_{t'}}\\,\\hat x_0+\\sqrt{1-\\bar\\alpha_{t'}}\\,\\epsilon_\\theta(x_t,t) \\)，其中 t'<t，可以一次跨越多步；η=0 时整个过程没有随机项，是确定性的。数值例：用 50 步代替 1000 步，网络调用次数减少 20 倍，FID 只略微变差。", "label": "主要贡献"}, {"b": "h3", "t": "High-Resolution Image Synthesis with Latent Diffusion Models", "id": "classic-102", "url": "https://arxiv.org/abs/2112.10752", "sn": {"label": "与重点论文的联系", "t": "首先要注意命名冲突：Quark 里的 “LDM” 指 Layered Depth Map（分层深度图），和这里的 Latent Diffusion Model 毫无关系。阅读 Quark 和生成式 3D 文献时必须分清。重点论文本身不使用扩散。潜扩散进入这条研究线的直接途径是：Quark 团队成员参与的后续工作 Tok-D（ICCV 2025，作者包括 Kaza、Luo、Lombardi）用多视角扩散模型 CAT3D 生成合成训练数据。"}}, {"b": "note", "t": "2022 · Robin Rombach, Andreas Blattmann, Dominik Lorenz, Patrick Esser, Björn Ommer (LMU Munich & Heidelberg University IWR / Runway ML) · CVPR 2022 · Semantic Scholar 引用 27576 · 难度：进阶 · 必读"}, {"b": "p", "t": "LDM 把扩散过程搬到预训练自编码器的低维潜空间里，训练和推理成本大幅下降，并用 cross-attention 统一接入文本、布局等各种条件。开源的 Stable Diffusion 就基于它。Zero-1-to-3、MVDream、CAT3D、SVD、Difix 等 3D 和视频生成先验几乎都以它为骨干。", "label": "为什么有影响力", "mn": {"label": "相关概念与专题", "links": [{"k": "concept-l-diffusion"}, {"k": "concept-l-attention"}, {"k": "concept-l-cnn"}, {"k": "adv-a-diffusion-3d"}]}}, {"b": "p", "t": "方法分两阶段。第一阶段训练一个感知压缩自编码器，用感知损失加 patch 对抗损失保证重建锐利；实验表明下采样因子 f 取 4–8 时细节保留与效率平衡最好。第二阶段在潜变量 z=E(x) 上训练 UNet 去噪器：\\( L=\\mathbb E\\|\\epsilon-\\epsilon_\\theta(z_t,t,\\tau_\\theta(y))\\|^2 \\)，τ_θ(y) 是条件 y（如文本）的编码器。条件通过 cross-attention \\( \\mathrm{softmax}(QK^\\top/\\sqrt d)V \\) 注入，Q 来自 UNet 特征，K 和 V 来自条件编码。数值例：Stable Diffusion 把 512×512×3 的图像压成 64×64×4 的潜变量（f=8），每步去噪处理的数值量只有原来的约 1/48。", "label": "主要贡献"}, {"b": "h3", "t": "Adding Conditional Control to Text-to-Image Diffusion Models", "id": "classic-114", "url": "https://arxiv.org/abs/2302.05543", "sn": {"label": "与重点论文的联系", "t": "重点论文没有使用 ControlNet。它与临场的关联在于“深度条件生成”：Ha et al. 每帧都有由 TSDF 光线步进得到的目标视角深度 𝒟^t，Quark 的 LDM 也带有逐层深度（可以合成出深度图）。如果想把这些几何信息交给生成模型去填补 disocclusion 空洞，ControlNet 式的深度条件是一种现成的接口。这只是一个可能的扩展方向，两篇重点论文都没有做。"}}, {"b": "note", "t": "2023 · Lvmin Zhang, Anyi Rao, Maneesh Agrawala (Stanford University) · ICCV 2023 · Semantic Scholar 引用 7808 · 难度：进阶"}, {"b": "p", "t": "ControlNet 给出了在不破坏大模型原有能力的前提下，为扩散模型加入空间条件（边缘、深度、分割、人体姿态等）的标准做法，训练数据少于 50k 或多于 1M 时都能稳定训练。它让“几何条件 → 真实感图像”成为通用工具，其条件注入结构也被大量 3D 和视频生成工作沿用。", "label": "为什么有影响力", "mn": {"label": "相关概念与专题", "links": [{"k": "concept-l-diffusion"}, {"k": "concept-l-cnn"}, {"k": "concept-g-depth"}, {"k": "adv-a-diffusion-3d"}]}}, {"b": "p", "t": "做法是冻结整个预训练 UNet，把它的编码器部分（在 Stable Diffusion 中是 12 个编码块和 1 个中间块）复制出一份可训练副本来接收条件 c。副本的输出经“零卷积”（权重和偏置都初始化为 0 的 1×1 卷积）加回原 UNet 解码器的 skip 连接和中间块。单个块的形式为 \\( y_c=\\mathcal F(x;\\Theta)+\\mathcal Z(\\mathcal F(x+\\mathcal Z(c;\\Theta_{z1});\\Theta_c);\\Theta_{z2}) \\)。其中 F 是网络块，Θ 是冻结参数，Θ_c 是可训练副本的参数，Z 是零卷积。训练开始时两个 Z 的输出都为 0，模型行为与原模型完全相同；随着训练，条件分支从零逐渐“长出来”，不会一开始就引入有害噪声。例：输入一张深度图和文本“客厅”，生成的图像布局会和深度图一致。", "label": "主要贡献"}, {"b": "h3", "t": "DreamFusion: Text-to-3D using 2D Diffusion", "id": "classic-115", "url": "https://arxiv.org/abs/2209.14988", "sn": {"label": "与重点论文的联系", "t": "重点论文没有使用 SDS，但在概念上可以和 Quark 对照：两者都是“用一个网络为 3D 表示提供更新方向”。SDS 把冻结扩散模型的去噪残差当作梯度，对每个场景迭代优化；Quark 继承 DeepView 的 learned gradient descent，由训练好的 Update/Fusion 模块直接预测更新量，只迭代 5 步就能实时运行。分清这两种做法（生成式、逐场景、慢，对比重建式、前馈、快），有助于判断生成式先验在临场管线中适合放在哪个环节。"}}, {"b": "note", "t": "2023 · Ben Poole, Ajay Jain, Jonathan T. Barron, Ben Mildenhall (Google Research / UC Berkeley) · ICLR 2023 · Semantic Scholar 引用 3866 · 难度：进阶"}, {"b": "p", "t": "论文提出 Score Distillation Sampling（SDS），率先证明只用一个冻结的 2D 文生图扩散模型、不需要任何 3D 训练数据，就能优化出 3D NeRF（此前的 DreamFields 用的是 CLIP 引导）。它开启了“把 2D 先验提升到 3D”的整条研究线，包括 Magic3D、ProlificDreamer，以及 MVDream 中的多视图 SDS。", "label": "为什么有影响力", "mn": {"label": "相关概念与专题", "links": [{"k": "concept-l-diffusion"}, {"k": "concept-n-nerf"}, {"k": "concept-f-optim"}, {"k": "concept-l-iterative"}, {"k": "adv-a-diffusion-3d"}]}}, {"b": "p", "t": "从一个随机初始化的 NeRF 出发，每次随机选一个相机渲染出图像 x=g(θ)，加噪得到 x_t，再用冻结的扩散模型预测噪声。SDS 梯度为 \\( \\nabla_\\theta L_{SDS}=\\mathbb E_{t,\\epsilon}[\\,w(t)(\\hat\\epsilon_\\phi(x_t;y,t)-\\epsilon)\\frac{\\partial x}{\\partial\\theta}] \\)：y 是文本，w(t) 是时间步权重，\\( \\hat\\epsilon_\\phi \\) 是扩散模型预测的噪声，并省略了 UNet 的雅可比。直觉是让渲染图在扩散模型看来更像符合该文本的图片。NeRF 带有基于法线的着色，并随机把反照率换成白色、渲染无纹理版本，以防形状退化成贴在平面上的图案。多个随机视角反复施加 SDS 后，逐渐得到三维一致的形状。", "label": "主要贡献"}, {"b": "h3", "t": "Stable Video Diffusion: Scaling Latent Video Diffusion Models to Large Datasets", "id": "classic-116", "url": "https://arxiv.org/abs/2311.15127", "sn": {"label": "与重点论文的联系", "t": "重点论文没有使用视频扩散模型。三者的时间一致性机制可以对比着看：Quark 完全没有时间机制；Ha et al. 靠差分掩码、递归滤波和前一帧 TSDF 回灌这类启发式手段；视频扩散则在网络内部联合建模多帧。2026 年的 LiveStre4m 用扩散 Transformer 做时间插值和超分辨率，代表了用生成先验取代启发式时间滤波的方向，代价是多步采样的延迟和生成“幻觉”内容的风险。"}}, {"b": "note", "t": "2023 · Andreas Blattmann et al. (Stability AI) · arXiv 技术报告 2023 · Semantic Scholar 引用 2928 · 难度：进阶"}, {"b": "p", "t": "报告系统总结了视频潜扩散模型的三阶段训练（文生图预训练 → 大规模视频预训练 → 高质量视频微调）和数据筛选策略。开源权重成了图生视频和相机控制视频生成的通用底座。报告还表明，视频模型本身就是很强的多视角 3D 先验，可以微调成一次前向生成多个视角的模型（后续有 SV3D 等）。", "label": "为什么有影响力", "mn": {"label": "相关概念与专题", "links": [{"k": "concept-l-diffusion"}, {"k": "concept-v-temporal"}, {"k": "concept-l-attention"}, {"k": "adv-a-diffusion-3d"}]}}, {"b": "p", "t": "模型沿用 Video LDM 的结构：在图像 LDM 的每个空间卷积层和空间注意力层之后插入时间卷积层和时间注意力层，并对整个模型做全量微调，让一段视频所有帧的潜变量在同一个去噪过程中联合生成。报告强调数据策展对基础模型质量起决定作用，包括级联的镜头切分检测、生成字幕、用光流过滤几乎静止的片段、用 OCR 文字检测去除带大量文字的片段，以及基于 CLIP 的美学和图文相似度筛选。报告还展示了相机运动 LoRA 和多视角微调。关键直觉：时间一致性来自网络内部跨帧的时间层（时间卷积和时间注意力），而不是事后处理。", "label": "主要贡献"}, {"b": "h3", "t": "Zero-1-to-3: Zero-shot One Image to 3D Object", "id": "classic-117", "url": "https://arxiv.org/abs/2303.11328", "sn": {"label": "与重点论文的联系", "t": "Quark §2.3（Single-view Methods）把 Zero-1-to-3（Liu et al., 2023）和 Tseng et al. 2023 等列为“使用带学习先验的生成式算法”的方法。作者认为这类方法能简化采集硬件，但目前多视角方法质量明显更高、适用场景更广，因此把它们当作另一类问题，不与之比较。这说明 Quark 坚持多视角输入和忠实重建，不让模型凭先验编造没观测到的内容。对于临场中人脸身份这类对可信度要求很高的内容，这是有意的取舍。"}}, {"b": "note", "t": "2023 · Ruoshi Liu et al. (Columbia University / Toyota Research Institute) · ICCV 2023 · Semantic Scholar 引用 1868 · 难度：进阶"}, {"b": "p", "t": "它是最早把大规模预训练图像扩散模型（Stable Diffusion）微调成“给定相对相机变换的新视角生成器”的代表性工作。它只在合成数据（Objaverse 渲染）上训练，却能零样本泛化到真实照片，甚至印象派绘画。由此开启了视角条件扩散（Zero123++、SyncDreamer 等）和“先生成多视图、再重建 3D”的路线。", "label": "为什么有影响力", "mn": {"label": "相关概念与专题", "links": [{"k": "concept-l-diffusion"}, {"k": "concept-g-pinhole"}, {"k": "concept-n-generalizable"}, {"k": "adv-a-diffusion-3d"}]}}, {"b": "p", "t": "以 Stable Diffusion 为初始化，用两种方式输入条件。一是把输入图像的 CLIP 嵌入与相对相机参数（极角差、方位角差的 sin/cos、半径差）拼接，作为全局条件（posed CLIP）；二是把输入图像的潜变量与噪声潜变量按通道拼接。模型在 Objaverse 物体的成对渲染图上微调，生成的新视角可以配合 SDS 用于单图 3D 重建。例：给一张杯子的正面照和“方位角 +90°”，模型生成杯子的侧面图，包括原图中看不到的把手。", "label": "主要贡献"}, {"b": "h3", "t": "MVDream: Multi-view Diffusion for 3D Generation", "id": "classic-127", "url": "https://arxiv.org/abs/2308.16512", "sn": {"label": "与重点论文的联系", "t": "重点论文没有使用 MVDream，但它和 Quark 的跨视角融合可以看作同一个问题的两种解法。MVDream 对 4 个视图的全部 token 做完全自注意力，计算量随 token 总数平方增长；Quark 在相关工作中也指出，NerFormer 式的跨视角 self-attention 有 O(M²) 开销。Quark 的 One-to-many attention 只让目标 LDM 的特征作为唯一的 query，去关注 M=8 个输入视角的 Δ，并把 K/V 投影折叠进 Q 和输出投影。按其附录 A 表 7（h=4 个注意力头），输入视角从 4 个增加到 64 个时，One-to-many 的理论 FLOPs 只增加到 1.9 倍，标准 cross-attention 则增加到 13 倍。对照 MVDream 的全自注意力，更容易理解 Quark 为什么要专门设计更省的跨视角注意力，才能在 1080p 下保持实时。"}}, {"b": "note", "t": "2024 · Yichun Shi et al. (ByteDance) · ICLR 2024 · Semantic Scholar 引用 1094 · 难度：进阶"}, {"b": "p", "t": "MVDream 证明，让扩散模型一次联合生成多张相互一致的视图，就能得到一个与具体 3D 表示无关、可泛化的 3D 先验。它显著缓解了 SDS 类方法中的多面（Janus）问题。“把 2D 自注意力扩展为跨视图的 3D 自注意力，再加相机嵌入”这一结构在 ImageDream、CAT3D 等后续多视图扩散模型中都能看到。", "label": "为什么有影响力", "mn": {"label": "相关概念与专题", "links": [{"k": "concept-l-diffusion"}, {"k": "concept-l-attention"}, {"k": "concept-l-encoding"}, {"k": "adv-a-diffusion-3d"}]}}, {"b": "p", "t": "在 Stable Diffusion 中，把每层的自注意力改为对 4 个视图的全部 token 联合计算（3D self-attention），并把相机外参经 2 层 MLP 编码后加到时间步嵌入上。训练数据混合了 Objaverse 多视角渲染和 LAION 2D 图文数据，这样既保留了 2D 模型的泛化能力，又获得了 3D 一致性。生成的多视图可以通过多视图 SDS 优化 NeRF，也支持类似 DreamBooth 的少样本个性化。", "label": "主要贡献"}, {"b": "h3", "t": "LRM: Large Reconstruction Model for Single Image to 3D", "id": "classic-130", "url": "https://arxiv.org/abs/2311.04400", "sn": {"label": "与重点论文的联系", "t": "重点论文没有使用 LRM，但把 LRM 家族和 Quark 对比，有助于理解 Quark 的定位。LRM 一次前向输出一个持久的 3D 表示（triplane 或 Gaussians），可以从任意视角渲染；Quark 则为每个目标视角迭代重建一个 LDM，它只在该视锥内有效、用完即弃。引用 Quark 的 iLRM（Kang 等，2025，不是 Quark 团队）在相关工作中明确指出：Quark 的表示局限于目标视角，缺少显式、持久的 3D 重建。iLRM 自身也采用多轮迭代精化的结构，可以和 Quark 的迭代 Update & Fuse 对照着读。"}}, {"b": "note", "t": "2024 · Yicong Hong et al. (Adobe Research / ANU) · ICLR 2024 · Semantic Scholar 引用 989 · 难度：进阶"}, {"b": "p", "t": "这是首个“大重建模型”：用 5 亿参数的 Transformer，在约 100 万个物体上端到端训练，单张图像 5 秒内直接回归出 NeRF（triplane）。它证明了“大规模数据 + 通用 Transformer + 可微渲染监督”可以替代逐场景优化和类别特定模型，由此衍生出 Instant3D、GS-LRM、Long-LRM、iLRM 等整个 LRM 家族。", "label": "为什么有影响力", "mn": {"label": "相关概念与专题", "links": [{"k": "concept-l-attention"}, {"k": "concept-r-reps"}, {"k": "concept-r-volume"}, {"k": "concept-n-generalizable"}, {"k": "adv-a-ff-3dgs"}]}}, {"b": "p", "t": "网络结构：先用预训练的 DINO ViT 把输入图像编码成 patch token；再由 image-to-triplane Transformer 解码，以可学习的 triplane token 作为 query，通过 cross-attention 读取图像特征，相机特征通过调制（adaptive LayerNorm）输入。输出的 triplane token 经上采样变形为三平面（triplane）特征，由 MLP 解码出密度和颜色后做体渲染，用多视角渲染图的 MSE 加 LPIPS 监督。训练数据包括 Objaverse 合成渲染和 MVImgNet 真实采集。", "label": "主要贡献"}, {"b": "h3", "t": "pixelSplat: 3D Gaussian Splats from Image Pairs for Scalable Generalizable 3D Reconstruction", "id": "classic-132", "url": "https://arxiv.org/abs/2312.12337", "sn": {"label": "与重点论文的联系", "t": "Ha et al. §2 把 pixelSplat [8] 与 MVSplat、GS-LRM 等一起列为只处理稀疏静态场景的前馈模型。Ha 同样每个像素放一个 Gaussian，但做法相反：Gaussian 中心直接由输入深度（RAFT-Stereo 或传感器深度）反投影得到，设为完全不透明、各向同性，尺度按解析式设成投影恰好覆盖 1 个像素（附录 A.3），参数不交给网络预测。Ha 针对 GPS-Gaussian、GS-LRM 这类用网络预测逐像素 Gaussian 的方法给出的理由是：在稠密像素网格上预测出的尺度、不透明度和旋转会收敛成近似常数。把它和 pixelSplat 用概率深度分布学习 Gaussian 位置的做法对照，才能看清 Ha 的设计思路：几何交给深度估计，网络只负责融合和补洞。"}}, {"b": "note", "t": "2024 · David Charatan, Sizhe Li, Andrea Tagliasacchi, Vincent Sitzmann (MIT 等) · CVPR 2024 · Semantic Scholar 引用 813 · 难度：专家 · 必读"}, {"b": "p", "t": "它是前馈 3DGS 的开山之作之一：从一对图像直接预测逐像素的 3D Gaussian。与光场 Transformer 类方法相比，渲染快约 2.5 个数量级，而且得到的是可解释、可编辑的显式 3D 表示。它与同期的 Splatter Image、GPS-Gaussian 一起确立了 pixel-aligned Gaussians 这种表示，MVSplat、GS-LRM 等后续工作都沿用了这一思路。", "label": "为什么有影响力", "mn": {"label": "相关概念与专题", "links": [{"k": "concept-n-3dgs"}, {"k": "concept-n-generalizable"}, {"k": "concept-g-epipolar"}, {"k": "concept-g-depth"}, {"k": "concept-r-raster"}, {"k": "adv-a-ff-3dgs"}]}}, {"b": "p", "t": "编码器用极线 Transformer 沿极线匹配两视图的特征，并借此推断每个场景的尺度因子（SfM 位姿只有任意尺度）。核心难点在于：直接回归 Gaussian 位置很容易陷入局部极小。pixelSplat 的做法是为每条射线预测一个沿深度 bin 的概率分布，从中采样 Gaussian 中心，并把被采中 bin 的概率作为这个 Gaussian 的不透明度。这是一种重参数化技巧，使采样变得可微，梯度可以穿过 splatting 回传。在 RealEstate10K 和 ACID 上以 256×256 分辨率做宽基线 NVS，超过了当时的方法。", "label": "主要贡献"}, {"b": "h3", "t": "MVSplat: Efficient 3D Gaussian Splatting from Sparse Multi-View Images", "id": "classic-133", "url": "https://arxiv.org/abs/2403.14627", "sn": {"label": "与重点论文的联系", "t": "Ha et al. 附录 A.8 的 Fig. 12 在 ENeRF-Outdoor 上与 MVSplat 做了定性比较，称 MVSplat（预训练的稀疏视角模型）结果模糊，但没有给出定量数字；§2 也把它列为只处理稀疏静态场景的前馈模型。代价体的概念可以直接对应到 Quark。Quark 的学习式初始化把各视角特征反投影到固定的等视差平面上，这一步最接近经典的平面扫描；之后每次 Update & Fuse，再按当前的层深度（每层可在自己的视差带内移动）把逐视角 update feature 反投影回 LDM 层空间，得到 Δ，其作用类似一个学习化的 plane-sweep volume。读懂 MVSplat 的代价体，有助于理解 Quark 第 2 阶段的初始化和第 3 阶段中的 (c) 步。"}}, {"b": "note", "t": "2024 · Yuedong Chen et al. (Monash University / ETH Zürich 等) · ECCV 2024 · Semantic Scholar 引用 630 · 难度：进阶 · 必读"}, {"b": "p", "t": "MVSplat 用平面扫描代价体（cost volume）为前馈 3DGS 提供显式的几何线索。与 pixelSplat 相比，参数量少 10 倍，推理快 2 倍以上（22 fps），跨数据集泛化也更好。它确立了“MVS 代价体 + 逐像素 Gaussian”这一最常用的前馈 3DGS 基线，DepthSplat 等后续工作都沿用了这个设计。", "label": "为什么有影响力", "mn": {"label": "相关概念与专题", "links": [{"k": "concept-d-mvs"}, {"k": "concept-i-psv"}, {"k": "concept-n-3dgs"}, {"k": "concept-n-generalizable"}, {"k": "concept-g-depth"}, {"k": "adv-a-ff-3dgs"}, {"k": "adv-a-learned-mvs"}]}}, {"b": "p", "t": "流程：多视图 Transformer 提取各视图特征；在近/远范围内按逆深度均匀采样 D 个深度候选，把其他视图的特征 warp 到参考视图，计算特征相关，得到代价体（即 plane sweep）。代价体与 Transformer 特征一起送入带跨视图注意力的轻量 2D U-Net 做残差细化；再沿深度维做 softmax，对深度候选加权平均得到深度，经深度细化后反投影成 Gaussian 中心。不透明度、协方差、颜色等其余参数同时预测，整个模型只用光度损失监督。直觉例：某个像素在深度候选 d_k 处与另一视图的特征最相似，代价体就在第 k 个 bin 上出现峰值，这个像素的深度就取在 d_k 附近。", "label": "主要贡献"}, {"b": "h3", "t": "DL3DV-10K: A Large-Scale Scene Dataset for Deep Learning-based 3D Vision", "id": "classic-135", "url": "https://arxiv.org/abs/2312.16256", "sn": {"label": "与重点论文的联系", "t": "Quark 的 Table 2 直接在 DL3DV-10K 基准上与逐场景优化方法比较：Quark 为 31.31 / 0.932 / 0.103，高于 Zip-NeRF 的 31.22 / 0.921 / 0.112 和 3DGS 的 29.82 / 0.919 / 0.120。基线数字取自本文，分辨率较低，而且 Quark 没有在 DL3DV 上训练过。引用 Quark 的后续前馈 3DGS 工作（如 iLRM，并非 Quark 团队）则直接在 RE10K 和 DL3DV 上训练和评测。"}}, {"b": "note", "t": "2024 · Lu Ling et al. (Purdue University 等) · CVPR 2024 · Semantic Scholar 引用 568 · 难度：入门"}, {"b": "p", "t": "它把真实场景级多视角数据的规模从几百个场景提高到一万段 4K 视频，并覆盖反射、透明、光照变化等难例。2024 年以后，前馈 3DGS 和大模型 NVS 大多用它训练和评测。它还提供了 DL3DV-140 这个 NVS 基准。", "label": "为什么有影响力", "mn": {"label": "相关概念与专题", "links": [{"k": "concept-g-sfm"}, {"k": "concept-n-nerf"}, {"k": "concept-n-3dgs"}, {"k": "concept-v-metrics"}]}}, {"b": "p", "t": "数据集包含 51.2M 帧、10,510 段视频，来自 65 类兴趣点（POI）地点，有界和无界场景都有，并覆盖不同程度的反射、透明和光照变化。作者从中抽取 140 个场景组成 DL3DV-140，对 Instant-NGP、Nerfacto、Mip-NeRF 360、Zip-NeRF、3DGS 做统一评测。另外做了一个用它训练可泛化 NeRF 的试点实验，说明数据规模对前馈重建很重要。", "label": "主要贡献"}, {"b": "h3", "t": "CAT3D: Create Anything in 3D with Multi-View Diffusion Models", "id": "classic-136", "url": "https://arxiv.org/abs/2405.10314", "sn": {"label": "与重点论文的联系", "t": "重点论文没有使用 CAT3D，但它和 Quark 团队有直接联系：与 Quark 作者重叠的 Tok-D（Nair 等，ICCV 2025，作者含 Kaza、Luo、Lombardi）用 CAT3D 生成大规模合成多视角数据来训练 LVSM 式的前馈 NVS 模型，并在相关工作中称 Quark 能在高得多的分辨率下达到 SOTA 质量。CAT3D 的 raymap 和 Quark 的射线方向编码 γ 都以逐像素射线的形式把相机几何注入网络，但含义不同：raymap 给出每条射线在第一个条件相机坐标系下的绝对原点和方向；γ 编码的是输入射线相对目标射线的偏差，用来让网络偏向与目标视角接近的射线。CAT3D 的生成视图并不完全 3D 一致，需要鲁棒重建来兜底。这提醒我们：在临场中用生成模型补洞，必须控制视角一致性；Ha et al. 用 SDV（各视角 L1 误差的标准差）和 EPI 检验的正是这类问题。"}}, {"b": "note", "t": "2024 · Ruiqi Gao et al. (Google DeepMind / Google Research) · NeurIPS 2024 · Semantic Scholar 引用 484 · 难度：专家"}, {"b": "p", "t": "CAT3D 把“用多视图扩散模型模拟真实采集，再做鲁棒 3D 重建”做成了通用的场景级流程。输入可以是 1 张、少量或更多图像，在 16 张 A100 上最快约 1 分钟得到完整 3D 场景。少视图重建上超过 ReconFusion、ZeroNVS，生成时间从约 1 小时降到几分钟；单图场景生成在定性和 CLIP 指标上也优于 ZeroNVS、RealmDreamer。它把生成式 3D 先验从物体级推进到了场景级。", "label": "为什么有影响力", "mn": {"label": "相关概念与专题", "links": [{"k": "concept-l-diffusion"}, {"k": "concept-l-attention"}, {"k": "concept-l-encoding"}, {"k": "concept-n-nerf"}, {"k": "concept-n-generalizable"}, {"k": "adv-a-diffusion-3d"}]}}, {"b": "p", "t": "模型基于潜扩散，仿照视频扩散模型把 2D 自注意力“膨胀”成跨视图的 3D 自注意力，联合处理共 8 个视图：1 个条件视图加 7 个目标视图，或 3 个条件视图加 5 个目标视图。相机用 raymap 表示：它和潜变量同尺寸，每个位置编码对应射线的原点和方向，坐标相对第一个条件相机，因此对世界坐标的刚体变换不变。要生成更多视图时，把目标视角按相机位置分组、逐组生成。单图输入时，先自回归地生成 7 个覆盖场景的 anchor 视图，再以观测视图和 anchor 视图为条件并行生成其余各组；单图共生成 80 张，少视图时生成 480–960 张。最后用 Zip-NeRF 重建，额外加入 LPIPS 损失，并随训练逐渐加大离观测视角更近的生成视图的权重，以容忍生成视图之间的轻微不一致。", "label": "主要贡献"}, {"b": "h3", "t": "GS-LRM: Large Reconstruction Model for 3D Gaussian Splatting", "id": "classic-138", "url": "https://arxiv.org/abs/2404.19702", "sn": {"label": "与重点论文的联系", "t": "Ha et al. §3.1 直接点名 GS-LRM（Zhang et al. [79]）：像它那样把所有输入视角的 Gaussian 一次性渲染到目标视角，既解决不了空洞和飞点，还会因 Z-fighting 让边缘更差（Fig. 4a，图注引用的是 GPS-Gaussian）。因此 Ha 改为逐视角单独渲染，再由网络融合。其消融中的 “No Blending”（仿照 GPS-Gaussian 一次渲染全部 Gaussian）只有 PSNR 24.64、STED 483.3，完整模型为 31.17 和 68.76；而逐视角渲染后按相机距离加权融合（Distance-based Blending）也只有 26.08 和 235.3。可见这组差距是“逐视角渲染 + 学习式融合”共同带来的，其中大部分来自学习式融合网络本身。"}}, {"b": "note", "t": "2024 · Kai Zhang et al. (Adobe Research) · ECCV 2024 · Semantic Scholar 引用 375 · 难度：进阶 · 必读"}, {"b": "p", "t": "GS-LRM 把 LRM 的规模化思路和逐像素 Gaussian 结合起来：用一个极简的纯 Transformer，从 2–4 张带位姿的图像在单张 A100 上 0.23 秒预测出高质量 3DGS，物体（Objaverse）和场景（RealEstate10K）都能处理，效果大幅超过此前方法。它是 Long-LRM、LVSM 等工作的直接对照。", "label": "为什么有影响力", "mn": {"label": "相关概念与专题", "links": [{"k": "concept-l-attention"}, {"k": "concept-l-encoding"}, {"k": "concept-n-3dgs"}, {"k": "concept-n-generalizable"}, {"k": "concept-r-raster"}, {"k": "adv-a-ff-3dgs"}]}}, {"b": "p", "t": "每张图像与它的逐像素 Plücker 射线坐标按通道拼接，得到 9 通道输入。Plücker 坐标是 \\( r=(d,\\,o\\times d) \\)，o 是相机光心，d 是射线方向，共 6 维。拼接后切成 patch token，所有视图的 token 连在一起，送入一串标准的自注意力 Transformer 块。每个输出 token 被线性解码为该 patch 内每个像素的 Gaussian 参数（共 12 通道）：沿射线的距离、颜色、尺度、旋转四元数和不透明度。解码后直接渲染，用 MSE 加感知损失监督。模型没有代价体、极线这类显式几何模块。", "label": "主要贡献"}, {"b": "h3", "t": "Difix3D+: Improving 3D Reconstructions with Single-Step Diffusion Models", "id": "classic-149", "url": "https://arxiv.org/abs/2503.01774", "sn": {"label": "与重点论文的联系", "t": "重点论文没有使用 Difix3D+，但它对应两篇重点论文共同的弱点。Ha et al. 用 4 层 U-Net 预测背景图 I_BG，来填补前向 warping 留下的 disocclusion 空洞（Fig. 11）；Quark 在视角覆盖不足的 Deep Blending 上出现硬边伪影（PSNR 23.61 dB，3DGS 为 30.04 dB）。Difix 是生成式补洞的代表，但 A100 上额外的 76 ms 已超过 30 fps 的 33 ms 帧预算。论文也只报告逐帧指标；如果把它当作逐帧后处理用于视频，可能引入新的闪烁，需要用 TCC、STED 或基于光流的 warping error 这类时间指标来检查。"}}, {"b": "note", "t": "2025 · Jay Zhangjie Wu et al. (NVIDIA / NUS) · CVPR 2025 · Semantic Scholar 引用 188 · 难度：进阶"}, {"b": "p", "t": "论文证明，单步扩散模型就能充当 NeRF/3DGS 渲染伪影的通用修复器。它有两种用法：在重建阶段清理伪训练视图，再蒸馏回 3D；在推理阶段作为近实时的后处理增强器。FID 平均提升约 2 倍，生成式先验的开销降到了接近交互式的水平。", "label": "为什么有影响力", "mn": {"label": "相关概念与专题", "links": [{"k": "concept-l-diffusion"}, {"k": "concept-n-3dgs"}, {"k": "concept-v-metrics"}, {"k": "concept-i-warping"}, {"k": "adv-a-diffusion-3d"}]}}, {"b": "p", "t": "Difix 从单步扩散模型 SD-Turbo 微调而来，冻结 VAE 编码器，用 LoRA 微调解码器。关键观察是：带渲染伪影的图像，其分布类似于扩散训练中噪声水平 τ≈200（而不是 1000）的样本。因此可以直接把渲染图当作 x_τ，做一步“去噪”。在 τ 的对比中，τ=200 既能去掉伪影又能保留内容，指标最好。模型还把自注意力改成参考视图混合层，以保持与参考视图的一致。作为推理后处理时，在 A100 上只增加 76 ms，比多步扩散快 10 倍以上。例：稀疏视角下 3DGS 在外推视角出现的漂浮物和模糊，经过一步 Difix 后被清理掉。", "label": "主要贡献"}, {"b": "h3", "t": "LVSM: A Large View Synthesis Model with Minimal 3D Inductive Bias", "id": "classic-150", "url": "https://arxiv.org/abs/2410.17242", "sn": {"label": "与重点论文的联系", "t": "LVSM 和两篇重点论文形成对照。Quark 保留了大量 3D 偏置：LDM、等视差分层、反投影、用全分辨率输入像素做 IBR 混合，以此实现 1080p 实时；LVSM 去掉了几乎所有这类偏置，但场景级基准比较只在 256×256 下进行（物体级最高 512×512）。与 Quark 作者重叠的 Tok-D（Nair 等，ICCV 2025，作者含 Kaza、Luo、Lombardi）改进了 LVSM 的 Transformer 块，并用 CAT3D 合成数据扩大训练集，还在相关工作中称 Quark 能在高得多的分辨率下达到 SOTA。LVT（SIGGRAPH Asia 2025，Imtiaz 等，Flynn 为末位作者）则只在局部视角邻域内做注意力，以避免二次复杂度。理解 LVSM，才能理解 2025 年以后“保留 3D 偏置还是追求可扩展性”这一核心争论。"}}, {"b": "note", "t": "2025 · Haian Jin et al. (Cornell / Adobe Research 等) · ICLR 2025 · Semantic Scholar 引用 188 · 难度：进阶 · 必读"}, {"b": "p", "t": "LVSM 证明，几乎不带 3D 归纳偏置的纯 Transformer，也能做高质量的可泛化 NVS，而且效果随数据和算力增长，比此前 SOTA 高 1.5–3.5 dB PSNR。这里的“不带偏置”指没有 NeRF/3DGS 表示，也没有极线或平面扫描模块。它把承接 SRT 的“几何无关大模型 NVS”推成了 2025 年以后的主流范式之一，Tok-D 等后续工作都在它的基础上改进。", "label": "为什么有影响力", "mn": {"label": "相关概念与专题", "links": [{"k": "concept-l-attention"}, {"k": "concept-l-encoding"}, {"k": "concept-n-generalizable"}, {"k": "adv-a-geometry-free"}]}}, {"b": "p", "t": "输入图像切成 patch，并与逐像素的 Plücker 射线嵌入融合成 token；目标视角只用它的 Plücker 射线作为 query token。论文给出两种结构。encoder-decoder：先把输入压成固定数量的 1D 潜 token，作为学习到的场景表示，推理更快。decoder-only：输入 token 和目标 token 一起经过完全自注意力，质量和零样本泛化更好。模型只用渲染损失（MSE 加感知损失）训练，即使只用 1–2 张 GPU 训练，也能超过此前方法。场景级实验在 RealEstate10K 上以 256×256 评测，沿用 pixelSplat 的数据划分。", "label": "主要贡献"}, {"b": "sec", "h": "也属于本主题的论文", "id": "also"}, {"b": "refs", "items": [{"left": "2022", "k": "classic-109"}], "cls": "papers"}], "toc": false, "series": {"prev": {"k": "theme-t-dynamic-human"}, "up": {"u": "basics/classics/index.html", "t": "Classics 目录"}}}, "chart": {"lanes": [{"id": "t-generative-ff", "label": "生成先验、前馈与评测"}], "points": [{"y": 2004, "c": 60027, "m": true, "t": "Image Quality Assessment: From Error Visibility to Structural Similarity", "v": "IEEE Transactions on Image Processing 13(4), 2004", "u": "basics/classics/t-generative-ff.html#classic-20", "lane": "t-generative-ff"}, {"y": 2013, "c": 374, "m": false, "t": "Video Quality Assessment by Reduced Reference Spatio-Temporal Entropic Differencing", "v": "IEEE Transactions on Circuits and Systems for Video Technology 23(4):684–694, 2013（2012 年在线发表）", "u": "basics/classics/t-generative-ff.html#classic-33", "lane": "t-generative-ff"}, {"y": 2014, "c": 1077, "m": false, "t": "Large Scale Multi-view Stereopsis Evaluation", "v": "CVPR 2014", "u": "basics/classics/t-generative-ff.html#classic-34", "lane": "t-generative-ff"}, {"y": 2017, "c": 5924, "m": false, "t": "ScanNet: Richly-annotated 3D Reconstructions of Indoor Scenes", "v": "CVPR 2017", "u": "basics/classics/t-generative-ff.html#classic-46", "lane": "t-generative-ff"}, {"y": 2017, "c": 1729, "m": false, "t": "Tanks and Temples: Benchmarking Large-Scale Scene Reconstruction", "v": "ACM Transactions on Graphics 36(4) (SIGGRAPH 2017)", "u": "basics/classics/t-generative-ff.html#classic-49", "lane": "t-generative-ff"}, {"y": 2018, "c": 20053, "m": true, "t": "The Unreasonable Effectiveness of Deep Features as a Perceptual Metric", "v": "CVPR 2018", "u": "basics/classics/t-generative-ff.html#classic-53", "lane": "t-generative-ff"}, {"y": 2018, "c": 509, "m": true, "t": "Learning Blind Video Temporal Consistency", "v": "ECCV 2018", "u": "basics/classics/t-generative-ff.html#classic-59", "lane": "t-generative-ff"}, {"y": 2019, "c": 144, "m": false, "t": "Exploiting Temporal Consistency for Real-Time Video Depth Estimation", "v": "ICCV 2019", "u": "basics/classics/t-generative-ff.html#classic-70", "lane": "t-generative-ff"}, {"y": 2020, "c": 35379, "m": true, "t": "Denoising Diffusion Probabilistic Models", "v": "NeurIPS 2020", "u": "basics/classics/t-generative-ff.html#classic-71", "lane": "t-generative-ff"}, {"y": 2020, "c": 196, "m": false, "t": "FLIP: A Difference Evaluator for Alternating Images", "v": "Proc. ACM on Computer Graphics and Interactive Techniques 3(2) (HPG 2020)", "u": "basics/classics/t-generative-ff.html#classic-82", "lane": "t-generative-ff"}, {"y": 2021, "c": 13573, "m": false, "t": "Denoising Diffusion Implicit Models", "v": "ICLR 2021", "u": "basics/classics/t-generative-ff.html#classic-83", "lane": "t-gener   // ---------- hover preview for internal links: mouse (after 300 ms) or keyboard focus; never on touch ----------

        if (e.key === "ArrowDown") { e.preventDefault(); setOpen(li, true); var f = list.querySelector("a"); if (f) f.focus(); }
      });
      li.addEventListener("pointerenter", function (e) { if (e.pointerType === "mouse" && wide.matches) { setOpen(li, true); li._hover = true; } });
      li.addEventListener("pointerleave", function (e) { if (e.pointerType === "mouse" && wide.matches) setOpen(li, false); });
      li.addEventListener("focusout", function (e) { if (wide.matches && !li.contains(e.relatedTarget)) setOpen(li, false); });
      li.addEventListener("keydown", function (e) { if (e.key === "Escape" && li.classList.contains("open")) { setOpen(li, false); btn.focus(); } });
      menus.appendChild(li);
    });
    var burger = el("button", { type: "button", class: "burger", "aria-expanded": "false", "aria-controls": "menus", text: "Menu" });
    burger.addEventListener("click", function () {
      var open = !bar.classList.contains("nav-open");
      bar.classList.toggle("nav-open", open);
      burger.setAttribute("aria-expanded", open ? "true" : "false");
    });
    var themeBtn = el("button", { type: "button", class: "theme-btn" });
    function darkNow() {
      var t = document.documentElement.getAttribute("data-theme");
      return t ? t === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
    }
    function paintThemeBtn() {
      var dark = darkNow();
      themeBtn.textContent = dark ? "Light" : "Dark";
      themeBtn.setAttribute("aria-label", dark ? "切换到浅色" : "切换到深色");
    }
    themeBtn.addEventListener("click", function () {
      var next = darkNow() ? "light" : "dark";
      var system = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      // Choosing what the system already shows drops the override, so the page follows the system again.
      if (next === system) document.documentElement.removeAttribute("data-theme");
      else document.documentElement.setAttribute("data-theme", next);
      try { if (next === system) localStorage.removeItem("atlas-theme"); else localStorage.setItem("atlas-theme", next); } catch (e) { /* storage unavailable */ }
      paintThemeBtn();
    });
    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", paintThemeBtn);
    paintThemeBtn();
    bar.appendChild(el("div", { class: "bar-in" }, [pageLink("index.html", SITE.brand || "", "brand"), el("nav", { class: "site-nav", "aria-label": "站点导航" }, [menus]), themeBtn, burger]));
    document.addEventListener("click", function (e) {
      if (!bar.contains(e.target)) Array.prototype.forEach.call(menus.children, function (li) { setOpen(li, false); });
    });
  }

  function finishPage() {
    buildTopbar();
    var foot = document.getElementById("site-foot");
    if (foot) foot.appendChild(el("p", null, [pageLink("index.html", SITE.brand || ""), SITE.date ? " · 内容截至 " + SITE.date : ""]));
    typeset(main);
    // Deep links (#id): the page is rendered by script, so jump once it exists and again after fonts settle.
    var h = window.location.hash ? window.location.hash.slice(1) : "";
    if (h && /^[A-Za-z0-9._~-]+$/.test(h) && document.getElementById(h)) {
      var moved = false;
      ["wheel", "touchstart", "keydown", "mousedown"].forEach(function (ev) { window.addEventListener(ev, function () { moved = true; }, { once: true, passive: true }); });
      var settle = function () { var t = document.getElementById(h); if (t && !moved) t.scrollIntoView({ block: "start" }); };
      settle();
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { window.requestAnimationFrame(settle); });
      [400, 1200, 2500].forEach(function (ms) { setTimeout(settle, ms); });
    }
  }

  // ================= slot: classic papers on a timeline, one lane per theme =================
  // DATA.chart = {lanes: [{id, label}], points: [{y: year, c: citations, m: must-read, t: title, v: venue, u: url, lane}]}
  SLOTS["classics-chart"] = function () {
    var C = DATA.chart || {}, lanes = arr(C.lanes), pts = arr(C.points);
    if (!pts.length) return null;
    var W = 940, left = lanes.length > 1 ? 170 : 16, right = 16, top = 26, split = 2010;
    var x0 = left, x1 = W - right, xBreak = x0 + (x1 - x0) * 0.34;
    var minYear = pts.reduce(function (m, p) { return p.y ? Math.min(m, p.y) : m; }, 2009);
    var y0 = Math.floor((minYear - 1) / 5) * 5;
    function xs(y) { y = Math.max(y0, Math.min(2025.6, y)); return y < split ? x0 + 6 + (y - y0) / (split - y0) * (xBreak - x0 - 18) : xBreak + (y - split + 0.5) / (2025.6 - split + 0.5) * (x1 - xBreak); }
    function rr(c) { var n = Math.max(1, Number(c) || 1); return Math.max(3.5, Math.min(8, 1.8 * Math.log10(n) - 0.6)); }
    var y = top, rows = [];
    lanes.forEach(function (ln) {
      var byYear = {};
      pts.forEach(function (p) { if (p.lane === ln.id) (byYear[p.y] = byYear[p.y] || []).push(p); });
      var maxStack = 1;
      Object.keys(byYear).forEach(function (k) { maxStack = Math.max(maxStack, Math.ceil(byYear[k].length / 2)); });
      var h = Math.max(44, maxStack * 22 + 14);
      rows.push({ ln: ln, y: y, h: h, byYear: byYear });
      y += h;
    });
    var Ht = y + 30;
    var svg = sv("svg", { class: "lanes", viewBox: "0 0 " + W + " " + Ht, role: "img", "aria-label": "经典论文时间分布" + (lanes.length > 1 ? "（按主题分泳道）" : "") });
    function tick(yr) {
      svg.appendChild(sv("line", { class: "grid", x1: xs(yr), x2: xs(yr), y1: top - 6, y2: Ht - 26 }));
      svg.appendChild(sv("text", { class: "axis", x: xs(yr), y: Ht - 10, "text-anchor": "middle", text: String(yr) }));
    }
    [y0, y0 + 10, y0 + 20].filter(function (yr) { return yr < split - 4; }).forEach(tick);
    for (var yr = 2010; yr <= 2025; yr += 3) tick(yr);
    svg.appendChild(sv("path", { class: "brk", d: "M" + (xBreak - 6) + "," + (Ht - 30) + " l4,-8 M" + (xBreak - 1) + "," + (Ht - 30) + " l4,-8" }));
    svg.appendChild(sv("text", { class: "axis", x: (x0 + xBreak) / 2, y: top - 12, "text-anchor": "middle", text: y0 + "–2009（压缩比例）" }));
    svg.appendChild(sv("text", { class: "axis", x: (xBreak + x1) / 2, y: top - 12, "text-anchor": "middle", text: "2010–2025" }));
    var tip = el("div", { class: "vtip", hidden: "" });
    rows.forEach(function (r, li) {
      if (li > 0) svg.appendChild(sv("line", { class: "grid", x1: 0, x2: W, y1: r.y, y2: r.y }));
      if (lanes.length > 1) svg.appendChild(sv("text", { class: "lane-l", x: 4, y: r.y + r.h / 2 + 4, text: r.ln.label }));
      Object.keys(r.byYear).forEach(function (k) {
        var list = r.byYear[k].slice().sort(function (a, b) { return (b.c || 0) - (a.c || 0); });
        var nrow = Math.ceil(list.length / 2);
        list.forEach(function (p, j) {
          var col = list.length > 1 ? (j % 2 === 0 ? -1 : 1) : 0, row = Math.floor(j / 2);
          var cx = xs(Number(k)) + col * 6, cy = r.y + r.h / 2 + (row - (nrow - 1) / 2) * 22;
          var a = sv("a", { class: "m", "aria-label": p.t + "，" + p.y + "，引用 " + fmtCit(p.c) }, [
            sv("circle", { class: "hit", cx: cx, cy: cy, r: rr(p.c) + 5 }),
            sv("circle", { class: "dot" + (p.m ? "" : " hollow"), cx: cx, cy: cy, r: rr(p.c) })
          ]);
          var h = relHref(p.u);
          if (h) a.setAttribute("href", h);
          function show() {
            tip.textContent = "";
            tip.appendChild(el("b", { text: p.t }));
            tip.appendChild(el("small", { text: [p.y, p.v, "引用 " + fmtCit(p.c)].filter(Boolean).join(" · ") }));
            if (p.m) tip.appendChild(el("span", { text: "必读" }));
            tip.hidden = false;
            var wrap = tip.parentElement, wr = wrap.getBoundingClientRect(), sr = svg.getBoundingClientRect(), scale = sr.width / W;
            var px = sr.left - wr.left + wrap.scrollLeft + cx * scale, py = sr.top - wr.top + cy * scale;
            tip.style.left = Math.max(4, Math.min(px + 12, wrap.scrollWidth - tip.offsetWidth - 4)) + "px";
            tip.style.top = (py + 14) + "px";
          }
          a.addEventListener("mouseenter", show);
          a.addEventListener("focus", show);
          a.addEventListener("mouseleave", function () { tip.hidden = true; });
          a.addEventListener("blur", function () { tip.hidden = true; });
          svg.appendChild(a);
        });
      });
    });
    function lgDot(hollow) {
      var s = sv("svg", { width: "12", height: "12", viewBox: "0 0 12 12", "aria-hidden": "true" });
      s.appendChild(sv("circle", { class: "dot" + (hollow ? " hollow" : ""), cx: 6, cy: 6, r: 4 }));
      return s;
    }
    return el("figure", { class: "fullwidth chart-fig" }, [
      el("div", { class: "lanes-wrap" }, [svg, tip]),
      el("figcaption", null, [lgDot(false), " 必读　", lgDot(true), " 其他　点的大小 ∝ log(引用数)；悬停看详情，点击跳到条目"])
    ]);
  };

  // ================= article: a page composed as blocks in routes.py =================
  (function () {
    var PG = DATA.page || {};
    var H = PG.head || {};
    if (PG.id) art.id = PG.id;

    // A link dict from routes.py: {k} an entry with hover preview, {u, t} a page of this site, {url, t} an external page.
    function part(x) {
      if (x === null || x === undefined) return null;
      if (typeof x === "string") return x;
      if (x.k) return xlink(x.k, x.t || null);
      if (x.u) return pageLink(x.u, x.t || x.u);
      if (x.url) return link(x.t || x.url, x.url);
      return x.t ? str(x.t) : null;
    }
    function noteNodes(n) {
      var kids = [noteLabel(n.label)];
      if (n.t) kids = kids.concat(rich(n.t));
      arr(n.links).forEach(function (l, i) { if (i) kids.push(el("br")); kids.push(part(l)); });
      return kids;
    }
    function runIn(label) { return el("b", { class: "run-in", text: label + "：" }); }
    function multiline(text) {
      var out = [];
      str(text).split("\n").forEach(function (line, i) { if (i) out.push(el("br")); out = out.concat(rich(line)); });
      return out;
    }

    // ---------- head ----------
    var meta = [];
    if (arr(H.prereqs).length) {
      meta.push(marginnote([noteLabel("阅读前需要")].concat(arr(H.prereqs).map(function (p, i) {
        var a = part(p);
        return i ? el("span", null, ["；", a]) : a;
      }))));
    }
    var sep = false;
    arr(H.meta).concat(H.minutes > 1 ? ["约 " + H.minutes + " 分钟"] : []).forEach(function (x) {
      var n = part(x);
      if (!n || (typeof n === "string" && !n.trim())) return;
      if (sep) meta.push(" · ");
      meta.push(n);
      sep = !(typeof x === "string" && /：$/.test(x));
    });
    articleHead({ title: H.title, subtitle: H.sub, meta: meta.length ? meta : null, epigraph: H.epigraph });
    if (str(H.lede).trim()) art.appendChild(el("div", { class: "lede" }, paras(H.lede)));

    // ---------- blocks ----------
    function heading(tag, b) {
      var title = b.url && safeUrl(b.url) ? link(b.t, b.url) : (b.k ? part({ k: b.k, t: b.t }) : str(b.t));
      var h = el(tag, { id: b.id || null }, [title]);
      if (b.sn) h.appendChild(sidenote(noteNodes(b.sn)));
      if (b.en) h.appendChild(el("span", { class: "en", text: b.en }));
      if (b.tag) h.appendChild(el("span", { class: "used", text: b.tag }));
      return h;
    }
    function withNotes(nodes, b) {
      if (nodes.length && b.mn) nodes[0].insertBefore(marginnote(noteNodes(b.mn)), nodes[0].firstChild);
      if (nodes.length && b.label) nodes[0].insertBefore(runIn(b.label), nodes[0].firstChild);
      return nodes;
    }
    function listItem(x) {
      if (typeof x === "string") return el("li", null, rich(x));
      return el("li", null, (x.label ? [runIn(x.label)] : []).concat(rich(x.t)));
    }
    function refsList(items, cls) {
      var left = items.some(function (x) { return x.left; });
      return el("ul", { class: "refs " + (cls || "") + (left ? "" : " noleft") }, items.map(function (x) {
        var body = [x.k || x.u || x.url ? part(x) : el("span", { class: "plain-t", text: x.t })];
        if (x.tag) body.push(el("span", { class: "used", text: x.tag }));
        if (x.sub) body.push(el("div", { class: "en", text: x.sub }));
        if (str(x.gloss).trim()) body.push(el("div", { class: "gloss" }, multiline(x.gloss)));
        var kids = left ? [el("span", { class: /^\d{4}$/.test(str(x.left)) ? "yr" : "kind", text: str(x.left) })] : [];
        return el("li", { id: x.id || null }, kids.concat([el("div", null, body)]));
      }));
    }
    var TY = { book: "教材", course: "课程", paper: "论文", tutorial: "教程", code: "代码", video: "视频", blog: "文章" };
    function tocGroups(groups, level) {
      var out = [];
      arr(groups).forEach(function (g) {
        if (g.h) out.push(el(level, { class: "toc-h" }, [g.k || g.u ? part({ k: g.k, u: g.u, t: g.h }) : g.h]));
        if (str(g.lede).trim()) out.push(el("p", { class: "toc-lede" }, rich(g.lede)));
        out.push(el("ol", { class: "toc" }, arr(g.items).map(function (it) {
          return el("li", null, [
            el("div", { class: "toc-t" }, [part({ k: it.k, u: it.u, t: it.t }), it.en ? el("span", { class: "en", text: it.en }) : null,
              it.meta ? el("span", { class: "toc-meta", text: it.meta }) : null]),
            str(it.s).trim() ? el("p", { class: "toc-s", text: it.s }) : null
          ]);
        })));
      });
      return out;
    }
    function cell(tag, c) { return el(tag, null, c && typeof c === "object" ? [part(c)] : rich(c)); }

    var box = null;
    function cur() { if (!box) { box = el("section"); art.appendChild(box); } return box; }
    function render(b) {
      switch (b.b) {
        case "p": return withNotes(paras(b.t), b);
        case "lines": return withNotes(lines(b.t), b);
        case "h3": return [heading("h3", b)];
        case "note": return [el("p", { class: "note", text: b.t })];
        case "ul": case "ol": return [el(b.b, null, arr(b.items).map(listItem))];
        case "eqs": return [eqList(b.eqs)];
        case "qa": return [el("p", { class: "quiz-h", text: "自测" }), el("ol", { class: "quiz" }, arr(b.items).map(function (q) {
          return el("li", null, [el("p", null, rich(q.q)), el("details", null, [el("summary", { text: "答案" }), el("p", null, rich(q.a))])]);
        }))];
        case "res": return [refsList(arr(b.items).map(function (r) {
          return { left: TY[r.type] || r.type || "", url: r.url, t: r.title, gloss: r.note_zh };
        }))];
        case "refs": return [refsList(arr(b.items), b.cls)];
        case "toc": return tocGroups(b.groups, cur().querySelector("h2") ? "h3" : "h2");
        case "table": return [el("div", { class: "table-wrap" + (b.wide ? " fullwidth" : "") }, [el("table", { class: "booktabs" + (b.cls ? " " + b.cls : "") }, [
          el("thead", null, [el("tr", null, arr(b.head).map(function (h) { return el("th", { text: h }); }))]),
          el("tbody", null, arr(b.rows).map(function (r) { return el("tr", null, arr(r).map(function (c) { return cell("td", c); })); }))
        ])])];
        case "timeline": return [el("ul", { class: "refs timeline" }, arr(b.items).map(function (x) {
          return el("li", null, [el("span", { class: "yr", text: str(x[0]) }), el("div", null, rich(x[1]))]);
        }))];
        case "kv": return [el("table", { class: "kv" }, [el("tbody", null, arr(b.items).map(function (x) {
          return el("tr", null, [el("th", { text: x[0] }), el("td", null, rich(x[1]))]);
        }))])];
        case "mtoc": return [marginToc(b.items)];
        case "slot": return typeof SLOTS[b.name] === "function" ? [SLOTS[b.name](b)] : [];
        default: return [];
      }
    }
    // Long articles: a table of contents at the top of the margin (a folding list on phones).
    function marginToc(items) {
      var d = el("details", { class: "mtoc" }, [el("summary", { text: "本文目录" }), el("ol", null, arr(items).map(function (x) { return el("li", null, [part(x)]); }))]);
      var wide = window.matchMedia("(min-width: 761px)");
      d.open = wide.matches;
      return d;
    }
    arr(PG.body).forEach(function (b) {
      if (b.b === "sec") {
        box = el("section", { id: b.id || null });
        if (b.h) box.appendChild(heading("h2", { t: b.h, sn: b.sn }));
        art.appendChild(box);
        return;
      }
      render(b).forEach(function (n) { if (n) cur().appendChild(n); });
    });

    var S = PG.series || {};
    if (S.prev || S.next || S.up) {
      var nav = el("nav", { class: "series", "aria-label": "同系列" });
      nav.appendChild(el("div", { class: "prev" }, S.prev ? [el("small", { text: "上一篇" }), part(S.prev)] : []));
      nav.appendChild(el("div", { class: "up" }, S.up ? [part(S.up)] : []));
      nav.appendChild(el("div", { class: "next" }, S.next ? [el("small", { text: "下一篇" }), part(S.next)] : []));
      art.appendChild(nav);
    }
  })();

  finishPage();
})();
</script>
