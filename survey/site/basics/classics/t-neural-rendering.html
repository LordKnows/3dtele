@font-face { font-family: "et-book"; font-weight: 400; font-style: normal; font-display: swap;

/* Notes pair Latin italic with upright Kai (the "italic ↔ 楷体" rule): the italic cut is registered as an upright

@font-face { font-family: "et-book-note"; font-weight: 400; font-style: normal; font-display: swap;

:root {
  --bg: #fffff8;
  --ink: #111111;
  --ink-2: #3c3c36;
  --muted: #74746a;
  --rule: #d8d6c8;
  --rule-2: #b9b6a4;
  --accent: #a8322d;
  --serif: "et-book", "Noto Serif SC", "Source Han Serif SC", "Songti SC", "STSong", "SimSun", Palatino, Georgia, serif;
  --note: "et-book-note", "LXGW WenKai", "Kaiti SC", "STKaiti", "KaiTi", "et-book", serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --side: clamp(12rem, 21vw, 17rem);
  --gap: 2.75rem;
  --main: calc(100% - var(--side) - var(--gap));
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161614; --ink: #e2e0d6; --ink-2: #c3c1b6; --muted: #979589; --rule: #34332e; --rule-2: #4d4b44; --accent: #e8836f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161614; --ink: #e2e0d6; --ink-2: #c3c1b6; --muted: #979589; --rule: #34332e; --rule-2: #4d4b44; --accent: #e8836f;
  color-scheme: dark;
}

/* ---------- base ---------- */
* { box-sizing: border-box; }
html { font-size: 16px; -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--serif); font-size: 1.15625rem; line-height: 1.85;
  font-kerning: normal; font-variant-numeric: lining-nums;
  /* Space between Chinese and Latin text where the source has none; squeeze adjacent CJK punctuation
     (text-spacing-trim applies the fonts' halt / chws features). Browsers without them keep the source spacing. */
  text-autospace: normal; text-spacing-trim: normal;
  overflow-wrap: break-word;
  padding-top: env(safe-area-inset-top, 0px);
}
[hidden] { display: none !important; }
a { color: inherit; text-decoration-line: underline; text-decoration-thickness: 1px; text-underline-offset: .18em; text-decoration-color: var(--rule-2); }
a:hover { color: var(--accent); text-decoration-color: currentColor; }
a:focus-visible, button:focus-visible, summary:focus-visible, label:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }
.skip { position: absolute; left: -999px; top: 0; }
.skip:focus { left: 1rem; top: .5rem; background: var(--bg); padding: .2rem .5rem; z-index: 60; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
p { margin: 0; }
p + p { margin-top: .9em; }

/* ---------- top bar ---------- */
.topbar { border-bottom: 1px solid var(--rule); }
.bar-in { max-width: 67rem; margin: 0 auto; padding: 0 1.5rem; display: flex; align-items: center; gap: 2.2rem; min-height: 3.1rem; }
.brand { font-size: 1rem; text-decoration: none; letter-spacing: .02em; white-space: nowrap; }
.site-nav { flex: 1; }
.menus { list-style: none; margin: 0; padding: 0; display: flex; gap: 1.6rem; }
.menu { position: relative; }
.menu-btn, .theme-btn, .burger {
  font-family: "et-book", var(--serif); font-variant-caps: all-small-caps; letter-spacing: .08em; font-size: 1.12rem;
  color: var(--ink-2); line-height: 3.1rem;
}
.menu-btn:hover, .theme-btn:hover, .burger:hover, .menu.open > .menu-btn { color: var(--accent); }
.menu.cur > .menu-btn { color: var(--ink); box-shadow: inset 0 -1px 0 var(--ink); }
.drop {
  display: none; position: absolute; left: -1rem; top: 100%; z-index: 40; min-width: 13rem;
  list-style: none; margin: 0; padding: .45rem 0; background: var(--bg); border: 1px solid var(--rule);
}
.menu.open > .drop { display: block; }
.drop a { display: block; padding: .15rem 1rem; text-decoration: none; font-size: 1.02rem; color: var(--ink-2); white-space: nowrap; }
.drop a:hover, .drop a:focus-visible { color: var(--accent); }
.drop a.cur { color: var(--ink); }
.drop a.cur::before { content: "›"; position: absolute; margin-left: -.7rem; color: var(--accent); }
.theme-btn { margin-left: auto; }
.burger { display: none; }

/* ---------- article column + margin ---------- */
main { display: block; }
.art { max-width: 67rem; margin: 0 auto; padding: 2.6rem 1.5rem 3rem; counter-reset: sidenote-counter; }
.art > *, .art section > * { width: var(--main); }
.art > section { width: 100%; }
.art .fullwidth { width: 100%; }
section { padding-top: .6rem; }

.crumbs { font-size: .86rem; color: var(--muted); letter-spacing: .01em; }
.crumbs a { color: var(--muted); text-decoration: none; }
.crumbs a:hover { color: var(--accent); }
.crumbs .sep { margin: 0 .45em; color: var(--rule-2); }
h1, h2, h3 { font-family: var(--serif); color: var(--ink); text-wrap: balance; }
h1 { font-size: 2.3rem; font-weight: 400; line-height: 1.3; margin: .9rem 0 0; letter-spacing: .01em; }
.subtitle { font-family: "et-book", var(--note); font-style: italic; font-size: 1.45rem; line-height: 1.3; color: var(--ink-2); margin-top: .35rem; }
.meta { font-size: .92rem; color: var(--muted); margin-top: 1.1rem; }
.meta a { color: var(--muted); }
h2 { font-size: 1.42rem; font-weight: 600; line-height: 1.4; margin: 2.6rem 0 .9rem; }
h3 { font-size: 1.12rem; font-weight: 600; line-height: 1.5; margin: 1.8rem 0 .5rem; }
h3 .used { font-family: var(--note); font-weight: 400; font-size: .86rem; color: var(--muted); margin-left: .6em; }

.epigraph { margin: 2.2rem 0 .6rem; }
.epigraph blockquote { margin: 0; padding: 0 0 0 1.6rem; border-left: 1px solid var(--rule-2); }
.epigraph p { font-family: var(--note); font-size: 1.12rem; line-height: 1.85; color: var(--ink-2); }

.art ol, .art ul { margin: .6rem 0 0; padding-left: 1.6em; }
.art li + li { margin-top: .45rem; }
li::marker { font-family: "et-book-osf", var(--serif); color: var(--muted); }

/* Equations: display math in the text column, scrolling sideways on narrow screens. */
.eqs { display: block; }
.eq + .eq { margin-top: 1.6rem; }
.math-block { overflow-x: auto; overflow-y: hidden; margin: .4rem 0 .6rem; padding: .2rem 0; font-size: 1rem; }
.math-block mjx-container { margin: 0 !important; }

/* ---------- side notes & margin notes (floated into the right margin) ---------- */
.sidenote, .marginnote {
  float: right; clear: right; position: relative;
  width: var(--side); margin-right: calc(-1 * (var(--side) + var(--gap))); margin-top: .3rem; margin-bottom: .6rem;
  font-family: var(--note); font-size: .88rem; line-height: 1.6; color: var(--ink-2); text-align: left;
  font-style: normal; font-weight: 400; letter-spacing: 0;
}
h3 .sidenote { margin-top: .2rem; }
.sidenote-number { counter-increment: sidenote-counter; }
.sidenote-number::after, .sidenote::before { font-family: "et-book-osf", var(--serif); position: relative; vertical-align: baseline; }
.sidenote-number::after { content: counter(sidenote-counter); font-size: .75rem; top: -.55em; left: .08em; color: var(--ink-2); }
.sidenote::before { content: counter(sidenote-counter) " "; font-size: .8rem; top: -.4em; }
.note-label { font-family: var(--serif); font-weight: 600; font-size: .82rem; color: var(--muted); margin-right: .5em; }
.marginnote .note-label { display: block; margin: 0 0 .1rem; }
input.margin-toggle { display: none; }
label.sidenote-number { display: inline; cursor: default; }
label.margin-toggle:not(.sidenote-number) { display: none; }

/* ---------- quiz, further reading, series ---------- */
.quiz details { margin-top: .3rem; }
.quiz summary { font-family: var(--note); font-size: .92rem; color: var(--muted); cursor: pointer; list-style: none; display: inline-block; }
.quiz summary::-webkit-details-marker { display: none; }
.quiz summary::before { content: "+ "; font-family: "et-book", var(--serif); }
.quiz details[open] summary::before { content: "− "; }
.quiz summary:hover { color: var(--accent); }
.quiz details > p { margin-top: .3rem; padding-left: 1rem; border-left: 1px solid var(--rule); color: var(--ink-2); }

/* Reference lists: a narrow label column (kind / year) and a hanging text column. */
.art ul.refs { list-style: none; padding-left: 0; }
.refs li { display: grid; grid-template-columns: 2.8rem minmax(0, 1fr); column-gap: .5rem; line-height: 1.6; }
.refs li > :not(.kind):not(.yr) { grid-column: 2; }
.refs .kind, .refs .yr { grid-column: 1; font-family: var(--note); font-size: .86rem; color: var(--muted); padding-top: .12rem; }
.refs .yr { font-family: "et-book-osf", var(--serif); font-size: .95rem; padding-top: .05rem; }
.refs .en { font-family: "et-book", var(--serif); font-style: italic; color: var(--muted); font-size: .92rem; line-height: 1.5; }
.refs .gloss { font-family: var(--note); font-size: .88rem; color: var(--ink-2); margin-top: .1rem; }
.art .refs li + li { margin-top: .75rem; }
.art .papers li + li { margin-top: .35rem; }
/* Without a label column the list is a plain stack (no grid, so nothing can land in a phantom second column). */
.refs.noleft li { display: block; }
.refs .used { font-family: var(--note); font-size: .82rem; color: var(--muted); margin-left: .5em; }
.refs.terms .plain-t { font-weight: 600; }
.refs.terms .en { display: inline; margin-left: .6em; }
.timeline li { line-height: 1.7; }
.art .timeline li + li { margin-top: .4rem; }

/* ---------- blocks: lede, run-in labels, notes ---------- */
.lede { margin-top: 1.6rem; color: var(--ink-2); }
.run-in { font-weight: 600; color: var(--ink); }
p.note { font-family: var(--note); font-size: .9rem; color: var(--muted); margin-top: .1rem; }
h2 .en, h3 .en { font-family: "et-book", var(--serif); font-style: italic; font-weight: 400; color: var(--muted); margin-left: .6em; font-size: .92em; }
h2 a, h3 a { text-decoration-color: var(--rule); }
.quiz-h { font-family: var(--note); font-size: .88rem; color: var(--muted); margin-top: 1.4rem; }
.quiz-h + ol.quiz { margin-top: .2rem; }

/* Index pages: a table of contents instead of a card grid. */
.art ol.toc { list-style: none; padding-left: 0; margin-top: .4rem; }
.art ol.toc > li + li { margin-top: .85rem; }
.toc-t { line-height: 1.55; }
.toc-t .en { font-family: "et-book", var(--serif); font-style: italic; color: var(--muted); margin-left: .6em; font-size: .95em; }
.toc-meta { font-family: var(--note); font-size: .82rem; color: var(--muted); margin-left: .7em; white-space: nowrap; }
.toc-s { font-family: var(--note); font-size: .9rem; line-height: 1.65; color: var(--ink-2); margin-top: .1rem; }
.toc-lede { font-family: var(--note); color: var(--ink-2); font-size: .95rem; }
h2.toc-h, h3.toc-h { margin-bottom: .3rem; }

/* Tables: booktabs rules (top, under the header, bottom), no vertical lines, no fills. */
.table-wrap { overflow-x: auto; margin: 1rem 0; }
table.booktabs { border-collapse: collapse; width: 100%; font-size: .9rem; line-height: 1.6; border-top: 1.5px solid var(--ink); border-bottom: 1.5px solid var(--ink); }
table.booktabs th { text-align: left; font-weight: 600; padding: .45rem .7rem .35rem 0; border-bottom: 1px solid var(--ink); white-space: nowrap; vertical-align: bottom; }
table.booktabs td { padding: .45rem .9rem .45rem 0; vertical-align: top; border-top: 1px solid var(--rule); }
table.booktabs tbody tr:first-child td { border-top: 0; }
table.rank td { white-space: nowrap; font-variant-numeric: tabular-nums; }
table.rank td:nth-child(2) { white-space: normal; }
.art table.kv { border-collapse: collapse; margin: .6rem 0; font-size: .95rem; width: auto; }
table.kv th { text-align: left; font-weight: 400; color: var(--muted); padding: .25rem 1.2rem .25rem 0; vertical-align: top; min-width: 5em; max-width: 12em; font-family: var(--note); }
table.kv td { padding: .25rem 0; vertical-align: top; }

/* Long articles: the table of contents sits at the top of the margin. */
/* It sits in a full-width section, so it floats into the margin without a negative offset. */
details.mtoc {
  float: right; clear: right; width: var(--side); margin-right: 0; margin-bottom: 1rem;
  font-family: var(--note); font-size: .86rem; line-height: 1.55; color: var(--ink-2);
}
details.mtoc summary { font-family: var(--serif); font-weight: 600; font-size: .82rem; color: var(--muted); list-style: none; cursor: default; }
details.mtoc summary::-webkit-details-marker { display: none; }
.art details.mtoc ol { list-style: none; padding: 0; margin: .3rem 0 0; }
.art details.mtoc li + li { margin-top: .25rem; }
details.mtoc a { text-decoration: none; }
details.mtoc a:hover { text-decoration: underline; }

/* Tools: search and filters with underlined inputs. */
.tool { margin-top: 1rem; }
.filters { display: flex; flex-wrap: wrap; gap: .6rem 1.6rem; align-items: baseline; font-family: var(--note); font-size: .92rem; color: var(--muted); }
.filters label { display: inline-flex; gap: .5rem; align-items: baseline; }
.filters input, .filters select {
  font: inherit; color: var(--ink); background: transparent; border: 0; border-bottom: 1px solid var(--rule-2); border-radius: 0;
  padding: .15rem .1rem; min-width: 7rem;
}
.filters input[type="search"] { min-width: 14rem; }
.filters select { max-width: 16rem; }
.filters input:focus, .filters select:focus { outline: none; border-bottom-color: var(--accent); }
.filters select option { background: var(--bg); color: var(--ink); }
.filters .count { margin-left: auto; font-family: var(--mono); font-size: .8rem; }
table.gl td.en { font-family: "et-book", var(--serif); width: 20%; }
table.gl .abbr { color: var(--muted); }
table.gl td.zh { white-space: nowrap; }
table.gl td.def { color: var(--ink-2); min-width: 20rem; }
table.gl td.c { font-size: .85rem; min-width: 9rem; padding-right: 0; }
table.gl tr:target td { background: color-mix(in srgb, var(--accent) 8%, transparent); }
table.db td.y { font-family: "et-book-osf", var(--serif); white-space: nowrap; }
table.db td.t { min-width: 16rem; }
table.db td.t small { display: block; color: var(--muted); font-size: .8rem; line-height: 1.45; margin-top: .15rem; }
table.db td.tags { min-width: 7rem; font-family: var(--note); font-size: .8rem; color: var(--muted); }
table.db td.tags span { display: block; }
table.db .tier.milestone { color: var(--ink); font-weight: 600; }
table.db td.s { min-width: 18rem; color: var(--ink-2); }
table.db td.n { min-width: 12rem; font-size: .82rem; color: var(--ink-2); }

/* Figures: the pipeline diagram and the timeline of classic papers, drawn in ink with one accent for interaction. */
figure { margin: 1.4rem 0; }
svg a { text-decoration: none; }
.diagram-wrap, .lanes-wrap { position: relative; overflow-x: auto; }
svg.diagram { width: 100%; min-width: 760px; height: auto; display: block; font-family: var(--note); }
svg.diagram .dnode rect { fill: var(--bg); stroke: var(--ink-2); stroke-width: 1; }
svg.diagram .dnode rect.data { stroke-dasharray: 4 3; }
svg.diagram .dnode:hover rect, svg.diagram .dnode:focus rect { stroke: var(--accent); stroke-width: 1.5; }
svg.diagram .dnode:focus { outline: none; }
svg.diagram text { fill: var(--ink); }
svg.diagram text.k { font-family: var(--mono); font-size: 10px; fill: var(--muted); }
svg.diagram text.t { font-family: var(--serif); font-size: 13px; font-weight: 600; }
svg.diagram text.s { font-size: 11px; fill: var(--ink-2); }
svg.diagram .dedge { fill: none; stroke: var(--ink-2); stroke-width: 1; }
svg.diagram .dedge.fb { stroke-dasharray: 4 3; }
svg.diagram .dhead { fill: var(--ink-2); }
svg.diagram .dloop { fill: none; stroke: var(--rule-2); stroke-dasharray: 2 3; }
svg.diagram .dlabel { font-size: 12px; fill: var(--muted); }
svg.diagram .dnote { font-size: 11px; fill: var(--muted); }
svg.diagram a.dnode:hover .dnote { fill: var(--accent); }
svg.lanes { width: 100%; min-width: 720px; height: auto; display: block; font-family: var(--note); }
svg.lanes .grid { stroke: var(--rule); stroke-width: 1; }
svg.lanes .axis { font-family: "et-book-osf", var(--serif); font-size: 12px; fill: var(--muted); }
svg.lanes .lane-l { font-size: 12px; fill: var(--ink-2); }
svg.lanes .brk { stroke: var(--muted); fill: none; }
svg.lanes .hit { fill: transparent; }
svg .dot { fill: var(--ink); }
svg .dot.hollow { fill: var(--bg); stroke: var(--ink-2); stroke-width: 1.2; }
svg.lanes a.m:hover .dot, svg.lanes a.m:focus .dot { fill: var(--accent); stroke: var(--accent); }
svg.lanes a.m:focus { outline: none; }
.vtip { position: absolute; z-index: 20; max-width: 20rem; padding: .45rem .7rem; background: var(--bg); border: 1px solid var(--rule-2); font-family: var(--note); font-size: .82rem; line-height: 1.5; pointer-events: none; }
.vtip b { display: block; font-family: "et-book", var(--serif); font-weight: 400; font-size: .92rem; }
.vtip small { display: block; color: var(--muted); }
.vtip span { color: var(--accent); }
figcaption { font-family: var(--note); font-size: .85rem; color: var(--muted); margin-top: .4rem; }
figcaption svg { vertical-align: -1px; }

.series { display: grid; grid-template-columns: 1fr auto 1fr; gap: 1rem; align-items: end; margin-top: 3.2rem; padding-top: 1rem; border-top: 1px solid var(--rule); font-size: .98rem; }
.series small { display: block; font-family: var(--note); font-size: .8rem; color: var(--muted); }
.series .up { text-align: center; font-size: .88rem; }
.series .up a { color: var(--muted); }
.series .next { text-align: right; }

.site-foot { max-width: 67rem; margin: 0 auto; padding: 1.2rem 1.5rem 2.5rem; font-size: .82rem; color: var(--muted); }
.site-foot a { color: var(--muted); text-decoration: none; }

/* ---------- hover preview ---------- */
.xtip {
  position: absolute; z-index: 50; max-width: min(22rem, calc(100vw - 16px)); padding: .55rem .8rem .6rem;
  background: var(--bg); border: 1px solid var(--rule-2); color: var(--ink);
  font-family: var(--note); font-size: .88rem; line-height: 1.6; pointer-events: none;
}
.xt-m { font-size: .76rem; color: var(--muted); }
.xt-t { font-family: var(--serif); font-weight: 600; font-size: .95rem; line-height: 1.45; margin-top: .1rem; }
.xt-e { font-family: "et-book", var(--serif); font-style: italic; color: var(--ink-2); line-height: 1.4; }
.xt-s { margin-top: .35rem; color: var(--ink-2); }

/* ---------- narrow screens: one column; notes fold behind their number or ⊕ ---------- */
@media (max-width: 760px) {
  body { font-size: 1.0625rem; line-height: 1.8; }
  .bar-in { gap: 1rem; padding: 0 1rem; flex-wrap: wrap; }
  .site-nav { order: 5; flex-basis: 100%; display: none; }
  .topbar.nav-open .site-nav { display: block; }
  .menus { flex-direction: column; gap: 0; padding-bottom: .6rem; }
  .menu-btn { line-height: 2.4rem; width: 100%; text-align: left; }
  .menu-btn::after { content: " +"; }
  .menu.open > .menu-btn::after { content: " −"; }
  .menu.cur > .menu-btn { box-shadow: none; }
  .drop { position: static; border: 0; padding: 0 0 .4rem .9rem; min-width: 0; }
  .drop a { padding: .2rem 0; white-space: normal; }
  .burger { display: inline; }
  .theme-btn { margin-left: auto; }
  .art { padding: 1.6rem 1rem 2.4rem; }
  .art > *, .art section > * { width: 100%; }
  h1 { font-size: 1.85rem; }
  .subtitle { font-size: 1.22rem; }
  .epigraph blockquote { padding-left: 1rem; }
  .epigraph p { font-size: 1.05rem; }
  label.margin-toggle:not(.sidenote-number) { display: inline; cursor: pointer; color: var(--muted); font-family: "et-book", var(--serif); padding: 0 .15em; }
  label.sidenote-number { cursor: pointer; }
  .sidenote, .marginnote { display: none; }
  .margin-toggle:checked + .sidenote, .margin-toggle:checked + .marginnote {
    display: block; float: left; clear: both; width: 100%; margin: .6rem 0; padding-left: .8rem; border-left: 1px solid var(--rule-2);
  }
  .series { grid-template-columns: 1fr 1fr; }
  .series .up { display: none; }
  details.mtoc { float: none; width: 100%; margin: 0 0 1.2rem; padding-left: .8rem; border-left: 1px solid var(--rule-2); }
  details.mtoc summary { cursor: pointer; }
  details.mtoc summary::after { content: " +"; }
  details.mtoc[open] summary::after { content: " −"; }
  .filters { flex-direction: column; align-items: stretch; gap: .5rem; }
  .filters label { justify-content: space-between; }
  .filters input[type="search"], .filters input, .filters select { min-width: 0; flex: 1; }
  .filters .count { margin-left: 0; }
  .toc-meta { display: block; margin-left: 0; }
  table.kv, table.kv tbody, table.kv tr, table.kv th, table.kv td { display: block; max-width: none; }
  table.kv th { padding: .5rem 0 0; }
}
@media print {
  .topbar, .site-foot, .series { display: none; }
}

ndations/i-layered.html", "t": "分层表示：MPI、LDI 与分层深度图（LDM）", "e": "Layered representations: MPI, LDI & layered depth maps", "m": "Foundations · M5 基于图像的渲染（IBR）", "s": "分层表示把场景切成若干张带透明度的图层。", "n": "分层表示"}, "concept-i-lightfield": {"u": "basics/foundations/i-lightfield.html", "t": "全光函数、光场与 Lumigraph", "e": "Plenoptic function, light fields & the Lumigraph", "m": "Foundations · M5 基于图像的渲染（IBR）", "s": "一张照片是全光函数的一个二维切片。", "n": "全光函数、光场与 Lumigraph"}, "concept-i-psv": {"u": "basics/foundations/i-psv.html", "t": "平面扫描体与学习式视图合成", "e": "Plane-sweep volumes & learned view synthesis", "m": "Foundations · M5 基于图像的渲染（IBR）", "s": "平面扫描体（PSV）的做法是：把每张输入图按一组假设的深度平面重投影到目标相机（或参考相机），堆叠成“深度 × 高 × 宽 × 视角”的张量。", "n": "平面扫描体与学习式视图合成"}, "concept-i-warping": {"u": "basics/foundations/i-warping.html", "t": "基于深度的渲染：前向/后向 warping、空洞与飞点", "e": "Depth-image-based rendering: forward/backward warping, holes & flying pixels", "m": "Foundations · M5 基于图像的渲染（IBR）", "s": "有了逐像素深度，就能把一张图“搬”到新视角。", "n": "基于深度的渲染"}, "concept-l-attention": {"u": "basics/foundations/l-attention.html", "t": "注意力机制与 Transformer", "e": "Attention & Transformers", "m": "Foundations · M6 深度学习基础（3D 视觉视角）", "s": "注意力用 query 与一组 key 的缩放点积经 softmax 得到权重，再对 value 做加权平均。", "n": "注意力机制与 Transformer"}, "concept-l-cnn": {"u": "basics/foundations/l-cnn.html", "t": "卷积网络、残差块与 U-Net", "e": "CNNs, residual blocks & U-Net", "m": "Foundations · M6 深度学习基础（3D 视觉视角）", "s": "卷积用共享的小核在图像上滑动，提取局部特征；残差连接让深层网络容易训练；U-Net 用编码器下采样、解码器上采样和同尺度跳连，同时获得大感受野和像素级精度。", "n": "卷积网络、残差块与 U-Net"}, "concept-l-encoding": {"u": "basics/foundations/l-encoding.html", "t": "位置编码、傅里叶特征与射线编码", "e": "Positional encoding, Fourier features & ray encodings", "m": "Foundations · M6 深度学习基础（3D 视觉视角）", "s": "神经网络对低维坐标输入天生偏爱平滑函数，这叫频谱偏置。", "n": "位置编码、傅里叶特征与射线编码"}, "concept-l-iterative": {"u": "basics/foundations/l-iterative.html", "t": "学习式迭代细化与展开优化", "e": "Learned iterative refinement & unrolled optimization", "m": "Foundations · M6 深度学习基础（3D 视觉视角）", "s": "做法是把“渲染当前估计 → 与观测比较 → 更新”这个迭代优化过程，展开成固定的几步，每步的更新量由神经网络给出，整体端到端训练。", "n": "学习式迭代细化与展开优化"}, "concept-l-loss": {"u": "basics/foundations/l-loss.html", "t": "损失函数与训练实践", "e": "Losses & training practice", "m": "Foundations · M6 深度学习基础（3D 视觉视角）", "s": "损失函数决定网络眼中什么是“好图像”：L2 偏向均值（结果偏糊），L1 偏向中位数，SSIM 关注局部结构，LPIPS 用深度特征度量感知差异。", "n": "损失函数与训练实践"}, "concept-n-3dgs": {"u": "basics/foundations/n-3dgs.html", "t": "3D Gaussian Splatting（3D 高斯溅射）", "e": "3D Gaussian Splatting", "m": "Foundations · M7 神经渲染核心", "s": "3DGS 用数百万个带颜色、不透明度和各向异性协方差的 3D 高斯表示场景。", "n": "3D Gaussian Splatting（3D 高斯溅射）"}, "concept-n-dynamic": {"u": "basics/foundations/n-dynamic.html", "t": "动态场景与 4D 表示", "e": "Dynamic scenes & 4D representations", "m": "Foundations · M7 神经渲染核心", "s": "动态场景方法首先要回答“时间怎么表示”。", "n": "动态场景与 4D 表示"}, "concept-n-generalizable": {"u": "basics/foundations/n-generalizable.html", "t": "可泛化 / 前馈式新视角合成", "e": "Generalizable / feed-forward novel view synthesis", "m": "Foundations · M7 神经渲染核心", "s": "可泛化（前馈式）新视角合成先在大量场景上训练一个网络，推理时只做一次前向：输入几张已标定的邻近视图，直接输出新视角图像，或者输出一个可以渲染的中间表示，全程不做逐场景优化。", "n": "可泛化 / 前馈式新视角合成"}, "concept-n-nerf": {"u": "basics/foundations/n-nerf.html", "t": "神经辐射场（NeRF）", "e": "Neural Radiance Fields", "m": "Foundations · M7 神经渲染核心", "s": "NeRF 用一个 MLP 把三维点和观察方向映射成体密度和颜色，再用可微的体渲染沿射线积分成像素，针对每个场景用几十到上百张照片做梯度下降来拟合。", "n": "神经辐射场（NeRF）"}, "concept-r-alpha": {"u": "basics/foundations/r-alpha.html", "t": "Alpha 合成与 over 算子", "e": "Alpha compositing & the over operator", "m": "Foundations · M4 图形学与渲染基础", "s": "alpha 表示一个像素被前景覆盖的比例。", "n": "Alpha 合成与 over 算子"}, "concept-r-appearance": {"u": "basics/foundations/r-appearance.html", "t": "反射模型、视角相关外观与光照", "e": "Reflectance, view-dependent appearance & lighting", "m": "Foundations · M4 图形学与渲染基础", "s": "表面颜色等于入射光乘以材质的反射分布（BRDF），再在半球上积分。", "n": "反射模型、视角相关外观与光照"}, "concept-r-raster": {"u": "basics/foundations/r-raster.html", "t": "光栅化、z-buffer 与点溅射（splatting）", "e": "Rasterization, z-buffer & point splatting", "m": "Foundations · M4 图形学与渲染基础", "s": "光栅化以图元为中心：把三角形或点投到屏幕上，再用 z-buffer 为每个像素保留最近的那个图元。", "n": "光栅化、z-buffer 与点溅射（splatting）"}, "concept-r-raymarch": {"u": "basics/foundations/r-raymarch.html", "t": "光线步进、球面追踪与隐式表面求交", "e": "Ray marching, sphere tracing & implicit surface intersection", "m": "Foundations · M4 图形学与渲染基础", "s": "光线步进就是沿射线一步步查询一个场（密度或符号距离）。", "n": "光线步进、球面追踪与隐式表面求交"}, "concept-r-reps": {"u": "basics/foundations/r-reps.html", "t": "三维表示总览：点、网格、体素、隐式场、高斯", "e": "3D representations: points, meshes, voxels, implicit fields, Gaussians", "m": "Foundations · M4 图形学与渲染基础", "s": "点、网格、体素、隐式场、高斯和分层图像，在存储、渲染、编辑和时间一致性上各有取舍。", "n": "三维表示总览"}, "concept-r-volume": {"u": "basics/foundations/r-volume.html", "t": "体渲染方程与离散化", "e": "The volume rendering equation & its discretization", "m": "Foundations · M4 图形学与渲染基础", "s": "体渲染把场景看成一团既发光又吸收的介质。", "n": "体渲染方程与离散化"}, "concept-v-codec": {"u": "basics/foundations/v-codec.html", "t": "视频编码、传输与延迟预算", "e": "Video coding, transport & latency budgets", "m": "Foundations · M8 视频、时间一致性、评测与系统", "s": "远程临场要在约百毫秒内把多路彩色和深度视频送到对端并渲染出来。", "n": "视频编码、传输与延迟预算"}, "concept-v-temporal": {"u": "basics/foundations/v-temporal.html", "t": "时间一致性、闪烁与时域滤波", "e": "Temporal consistency, flicker & temporal filtering", "m": "Foundations · M8 视频、时间一致性、评测与系统", "s": "逐帧独立预测时，每帧误差互不相关，这些误差会直接表现为闪烁。", "n": "时间一致性、闪烁与时域滤波"}, "theme-t-deep-geometry": {"u": "basics/classics/t-deep-geometry.html", "t": "深度学习几何：光流、立体、MVS、单目深度、匹配（2015–2025）", "e": "", "m": "Classics", "s": "本主题收录 25 篇论文。范围：FlowNet, PWC-Net, RAFT, GC-Net, PSMNet, RAFT-Stereo, MVSNet, CasMVSNet, MiDaS, DPT, Depth…"}, "theme-t-dynamic-human": {"u": "basics/classics/t-dynamic-human.html", "t": "动态场景、4D 与人体（2019–2025）", "e": "", "m": "Classics", "s": "本主题收录 25 篇论文。范围：D-NeRF, Nerfies, HyperNeRF, NSFF, DyNeRF (N3DV), K-Planes, HexPlane, 4DGS, Dynamic 3D Gau…"}}, "page": {"id": "theme-t-neural-rendering", "head": {"title": "神经渲染与新视角合成（2016–2025）", "sub": "Classics", "meta": ["26 篇论文"], "epigraph": "", "prereqs": [], "lede": "", "minutes": 30}, "body": [{"b": "sec", "h": null, "id": "list"}, {"b": "p", "t": "本主题收录 26 篇论文，按年份排列。范围：DeepStereo, Stereo Magnification, LLFF, DeepView, Immersive LF Video, SRN, NPBG, FVS/SVS, NeRF, Mip-NeRF (360), Instant-NGP, Plenoxels, TensoRF, IBRNet, pixelNeRF, MVSNeRF, ENeRF, 3DGS, 2DGS, Mip-Splatting, neural rendering STARs"}, {"b": "slot", "name": "classics-chart"}, {"b": "refs", "items": [{"left": "2016", "u": "#classic-44", "t": "DeepStereo: Learning to Predict New Views from the World's Imagery", "tag": ""}, {"left": "2018", "u": "#classic-58", "t": "Deep Blending for Free-Viewpoint Image-Based Rendering", "tag": "必读"}, {"left": "2018", "u": "#classic-60", "t": "Stereo Magnification: Learning View Synthesis using Multiplane Images", "tag": "必读"}, {"left": "2019", "u": "#classic-65", "t": "Scene Representation Networks: Continuous 3D-Structure-Aware Neural Scene Representations", "tag": ""}, {"left": "2019", "u": "#classic-66", "t": "Local Light Field Fusion: Practical View Synthesis with Prescriptive Sampling Guidelines", "tag": "必读"}, {"left": "2019", "u": "#classic-68", "t": "DeepView: View Synthesis with Learned Gradient Descent", "tag": "必读"}, {"left": "2020", "u": "#classic-72", "t": "NeRF: Representing Scenes as Neural Radiance Fields for View Synthesis", "tag": "必读"}, {"left": "2020", "u": "#classic-77", "t": "State of the Art on Neural Rendering", "tag": ""}, {"left": "2020", "u": "#classic-78", "t": "Neural Point-Based Graphics", "tag": ""}, {"left": "2020", "u": "#classic-80", "t": "Free View Synthesis", "tag": ""}, {"left": "2020", "u": "#classic-81", "t": "Immersive Light Field Video with a Layered Mesh Representation", "tag": ""}, {"left": "2021", "u": "#classic-85", "t": "Mip-NeRF: A Multiscale Representation for Anti-Aliasing Neural Radiance Fields", "tag": ""}, {"left": "2021", "u": "#classic-86", "t": "pixelNeRF: Neural Radiance Fields from One or Few Images", "tag": "必读"}, {"left": "2021", "u": "#classic-90", "t": "MVSNeRF: Fast Generalizable Radiance Field Reconstruction from Multi-View Stereo", "tag": ""}, {"left": "2021", "u": "#classic-92", "t": "IBRNet: Learning Multi-View Image-Based Rendering", "tag": "必读"}, {"left": "2021", "u": "#classic-97", "t": "NeX: Real-time View Synthesis with Neural Basis Expansion", "tag": ""}, {"left": "2021", "u": "#classic-99", "t": "Stable View Synthesis", "tag": ""}, {"left": "2022", "u": "#classic-103", "t": "Instant Neural Graphics Primitives with a Multiresolution Hash Encoding", "tag": ""}, {"left": "2022", "u": "#classic-104", "t": "Mip-NeRF 360: Unbounded Anti-Aliased Neural Radiance Fields", "tag": ""}, {"left": "2022", "u": "#classic-105", "t": "Plenoxels: Radiance Fields without Neural Networks", "tag": ""}, {"left": "2022", "u": "#classic-106", "t": "TensoRF: Tensorial Radiance Fields", "tag": ""}, {"left": "2022", "u": "#classic-108", "t": "Advances in Neural Rendering", "tag": "必读"}, {"left": "2022", "u": "#classic-111", "t": "Efficient Neural Radiance Fields for Interactive Free-viewpoint Video", "tag": "必读"}, {"left": "2023", "u": "#classic-113", "t": "3D Gaussian Splatting for Real-Time Radiance Field Rendering", "tag": "必读"}, {"left": "2024", "u": "#classic-124", "t": "2D Gaussian Splatting for Geometrically Accurate Radiance Fields", "tag": ""}, {"left": "2024", "u": "#classic-131", "t": "Mip-Splatting: Alias-free 3D Gaussian Splatting", "tag": ""}], "cls": "papers"}, {"b": "sec", "h": "论文", "id": "papers"}, {"b": "h3", "t": "DeepStereo: Learning to Predict New Views from the World's Imagery", "id": "classic-44", "url": "https://arxiv.org/abs/1506.06825", "sn": {"label": "与重点论文的联系", "t": "这是 Quark 共同一作 John Flynn 的早期工作，Quark 也引用了它。Quark Sec. 2.2 把 DeepStereo 和 LLFF 归为“简单拼接跨视角特征”的早期方法：这种做法不具顺序不变性，而且必须针对固定的输入视角数训练。这正是 Quark 改用 One-to-many attention 的动机。Quark 的 Update Block 把每视角的更新特征按当前深度反投影回 LDM 层空间，得到 Δ（原文 Sec. 3.2.2 称其与 plane sweep volume 有相似之处）；Learned Initialization 阶段则把图像特征 back-project 到等视差 anchor 平面上，这两处都是 PSV 思想的延续。DeepStereo 在每个平面上的 softmax 选择，可以看作 Quark 每层 density σ 和每层 blend weights 的概念前身（属于类比，而非 Quark 的自述）。如果不熟悉 PSV，就很难理解 Quark 为什么先在固定视差平面上收集多视角特征。Ha et al. 走的是另一条路：不构建 PSV，直接使用外部立体深度（RAFT-Stereo）。两条路线的分歧在这篇论文里就能看出来。"}}, {"b": "note", "t": "2016 · John Flynn et al. (Google) · CVPR 2016 · Semantic Scholar 引用 709 · 难度：入门"}, {"b": "p", "t": "一般认为这是第一篇用深度网络端到端完成真实场景新视角合成的工作（作者自称“据我们所知是第一篇”）。它的输入组织方式是：先把各输入视角按目标相机的一组深度平面重投影，得到平面扫描体（plane sweep volume, PSV），再交给网络判断每个像素的深度与颜色。StereoMag、LLFF、DeepView、MVSNeRF、ENeRF 等方法都沿用了这种“先用几何对齐，再让网络判断”的做法，因此它是学习式/可泛化 NVS 的起点。", "label": "为什么有影响力", "mn": {"label": "相关概念与专题", "links": [{"k": "concept-i-psv"}, {"k": "concept-g-depth"}, {"k": "concept-g-epipolar"}, {"k": "concept-l-cnn"}, {"k": "concept-i-blending"}, {"k": "adv-a-generalizable-ibr"}]}}, {"b": "p", "t": "(1) PSV 输入：每个目标视角取 5 张邻近输入图，各自按 96 个深度平面单应变换到目标相机，得到逐平面对齐的颜色栈。(2) 双塔结构：selection tower 对每个像素在 96 个平面上输出 softmax 概率 s_{i,j,z}，color tower 输出每个平面的候选颜色 c_{i,j,z}，最终像素为 \\(\\sum_z s_{i,j,z}\\,c_{i,j,z}\\)，可以理解为“软深度选择 + 逐平面选色”。因此深度不确定的区域倾向于变模糊，而不是出现错位的撕裂。(3) 训练数据来自 Google Street View 的带位姿图像，用留一法自监督，不需要深度真值。局限：训练后输入视角数固定为 5，且推理很慢，在多核工作站上按 patch 渲染一张 512×512 图约需 12 分钟。", "label": "主要贡献"}, {"b": "h3", "t": "Deep Blending for Free-Viewpoint Image-Based Rendering", "id": "classic-58", "url": "https://doi.org/10.1145/3272127.3275084", "sn": {"label": "与重点论文的联系", "t": "Ha et al. Sec. 3.3 的融合网络在思路上可以看作现代版 Deep Blending（Ha 在相关工作中把它列为 IBR 代表作之一，[24]）。输入是 K 张前向 splat 图，加上深度、alpha 和相机特征，送入 4 层 U-Net，输出逐像素权重 w_k 和背景权重 w_BG。一个值得对照的差别是：Ha 的训练损失里没有任何时间项（重点论文笔记），时间一致性完全依靠输入端的颜色差分深度滤波和 TSDF；而 Deep Blending 在 2018 年就把抑制闪烁纳入了网络与损失设计。Quark 也引用了本文，把它的 Playroom 场景用作评测：Quark 只有 23.61 dB，远低于 3DGS-30K 的 30.04。Quark 把原因归于只用最近 8 个视角时覆盖不足，这说明自由漫游式 IBR 场景对视角选择很敏感。"}}, {"b": "note", "t": "2018 · Peter Hedman et al. (UCL / Inria / UNC) · ACM TOG 37(6) / SIGGRAPH Asia 2018 · Semantic Scholar 引用 923 · 难度：进阶 · 必读"}, {"b": "p", "t": "IBR 中最依赖手工启发式的一步，是如何混合多张 warp 到目标视角的输入图。这篇论文把这一步交给 CNN 学习，并证明只用留出（held-out）的真实照片就能监督混合权重。“几何代理 + 重投影 + 学习式融合权重”这一范式影响了后来的学习式 IBR（如 FVS/SVS），以及 Ha et al. 这类实时方法（Ha 在相关工作中引用了它）。论文发布的场景（Playroom、DrJohnson 等）后来成为 3DGS 等方法的标准评测集。", "label": "为什么有影响力", "mn": {"label": "相关概念与专题", "links": [{"k": "concept-i-blending"}, {"k": "concept-i-warping"}, {"k": "concept-d-mvs"}, {"k": "concept-l-cnn"}, {"k": "concept-v-temporal"}, {"k": "adv-a-generalizable-ibr"}]}}, {"b": "p", "t": "(1) 把两种 MVS 重建组合起来：一种更准确，一种更完整，两者互补，为 CNN 提供足够可靠的几何。(2) 为了把学习嵌入交互式 IBR 系统，渲染器按排序把输入视角生成固定数量的层（mosaics），CNN 为每层预测逐像素混合权重，再加权得到新视角。(3) 训练时逐一留出每张输入照片作为真值；网络结构和损失函数在追求画质的同时也专门抑制时间闪烁（temporal flickering）。(4) 实现了交互式自由视点漫游，在远离输入相机的视角上优势尤其明显。", "label": "主要贡献"}, {"b": "h3", "t": "Stereo Magnification: Learning View Synthesis using Multiplane Images", "id": "classic-60", "url": "https://arxiv.org/abs/1805.09817", "sn": {"label": "与重点论文的联系", "t": "Quark 的 LDM 属于 MPI 家族的后代：每层同样有 density（相当于 alpha），同样由后向前 over 合成；层的 anchor 同样按等视差放置，δ=(ℓ−0.5)/L。区别在于 Quark 允许每层深度在自己的视差带内移动（见重点论文“深度参数化”），不再是固定平面。Flynn 是本文共同作者，不过 Quark 的参考文献没有直接列出本文，而是引用了 DeepView、LLFF 等后续 MPI 工作。Ha et al. 在相关工作的 MPI 部分引用了本文（[83]）。Ha 的最终合成式 I=(1−w_BG)·I_FG + w_BG·I_BG，与 StereoMag 公式 (1) 在思路上相似：前景直接取观测像素，被遮挡的部分交给网络预测的背景图去补，再按逐像素权重混合。这只是概念类比：Ha 没有说借鉴了本文，而且 StereoMag 是逐平面混合，Ha 是在最终图像上混合。读懂 StereoMag 的公式 (1)，有助于理解 Ha 的融合网络为什么要多输出一张 I_BG 和一个 w_BG。"}}, {"b": "note", "t": "2018 · Tinghui Zhou et al. (UC Berkeley / Google) · ACM TOG 37(4) / SIGGRAPH 2018 · Semantic Scholar 引用 436 · 难度：入门 · 必读"}, {"b": "p", "t": "这篇论文提出了多平面图像（MPI）：在参考相机前放 D 个按视差等距的正对平面，每个平面是一张 RGBA 图；渲染新视角只需逐平面做单应 warp，再用 over 算子合成。它确立了“网络预测一次，之后可实时渲染附近任意视角”的分层表示，DeepView、LLFF、NeX、Immersive LF Video 都在此基础上展开。论文同时发布了 RealEstate10K：约 1500 个 YouTube 房产视频，切成约 7000 段、约 75 万帧，每帧带 SfM 位姿。它后来成为单图/双图 NVS 和前馈 3D 重建的标准训练数据之一。", "label": "为什么有影响力", "mn": {"label": "相关概念与专题", "links": [{"k": "concept-i-layered"}, {"k": "concept-r-alpha"}, {"k": "concept-i-psv"}, {"k": "concept-g-depth"}, {"k": "concept-g-epipolar"}, {"k": "concept-l-loss"}, {"k": "adv-a-layered-nvs"}]}}, {"b": "p", "t": "(1) MPI 表示：D=32 个平面，近、远平面分别为 1 m 和 100 m，平面按视差（逆深度）等距放置。(2) 精简的颜色参数化（原文 Eq. (1)）：每个平面的颜色为 \\(C_d = w_d \\odot I_1 + (1-w_d) \\odot \\hat I_b\\)，也就是参考图 I_1（前景）与网络预测的一张“背景图” \\(\\hat I_b\\)（表示参考视角中被遮挡的表面）的逐像素混合。网络只需输出每个平面的 alpha、混合权重 w_d 和一张全局背景图，输出维度因此大幅降低。(3) 输入是参考图与第二张图的 PSV 拼接；通过可微的单应 warp 和 over 合成在目标视角上计算损失，损失为 VGG-19 多层特征匹配（感知损失）。(4) 消融：平面数从 8 到 16 再到 32，质量单调上升，受显存限制最多只用了 32 层。", "label": "主要贡献"}, {"b": "h3", "t": "Scene Representation Networks: Continuous 3D-Structure-Aware Neural Scene Representations", "id": "classic-65", "url": "https://arxiv.org/abs/1906.01618", "sn": {"label": "与重点论文的联系", "t": "据 Semantic Scholar 的参考文献列表，Quark 在相关工作中引用了 SRN（作为早期神经场景表示），Ha et al. 没有引用。SRN 是理解 Ha et al. 目标视角 TSDF 射线步进的好参照：Ha 以 0.8·s 为步长推进（s 为融合后的截断有符号距离），检测到符号变化后再做 3 步二分细化，这是经典 sphere tracing 的一种保守变体；SRN 同样受 sphere tracing 启发，但把步长交给 LSTM 学习。对照两者，可以看清手工迭代求交与学习式迭代的区别。“用网络学习迭代更新”这一思想在 Quark 中也能看到，不过 Quark 的 render-and-refine 直接继承自 DeepView，而不是 SRN。"}}, {"b": "note", "t": "2019 · Vincent Sitzmann et al. (Stanford) · NeurIPS 2019 · Semantic Scholar 引用 1442 · 难度：进阶"}, {"b": "p", "t": "SRN 是最早一批只用带位姿 2D 图像、不需要任何 3D 监督就能训练连续神经场景表示的方法。它用 MLP 把世界坐标映射为特征，用可微的 ray marching 渲染，并通过 hypernetwork 在多个物体之间共享先验，实现少样本重建。在 NeRF 之前，它是“神经隐式表示 + 可微渲染”的代表，也是后来可泛化神经场的先驱。", "label": "为什么有影响力", "mn": {"label": "相关概念与专题", "links": [{"k": "concept-r-raymarch"}, {"k": "concept-r-reps"}, {"k": "concept-l-iterative"}, {"k": "concept-n-generalizable"}, {"k": "adv-a-diff-render"}]}}, {"b": "p", "t": "(1) 场景表示 Φ 把 ℝ³ 中的点映射为特征向量，是一个 4 层、每层 256 单元的 MLP。(2) 可微 ray marcher：受 sphere tracing 启发，但步长不由 SDF 给出，而是由一个 LSTM 根据当前点的特征预测，迭代若干步找到射线与表面的交点。(3) 像素生成器把交点特征解码为颜色。(4) hypernetwork 从每个物体的潜码 z_j 回归 Φ 的权重，从而支持类别级泛化和形状、外观插值。局限：每条射线只找一个交点，难以处理半透明和复杂真实场景。", "label": "主要贡献"}, {"b": "h3", "t": "Local Light Field Fusion: Practical View Synthesis with Prescriptive Sampling Guidelines", "id": "classic-66", "url": "https://arxiv.org/abs/1905.00889", "sn": {"label": "与重点论文的联系", "t": "与 Quark 的关系：Quark 的训练集包含 RFF（LLFF），主表在 RFF 上的结果为 26.03/0.850/0.137（1024×768），ENeRF 为 23.71（论文没有说明 RFF 评测场景是否从训练集中剔除）。Quark Sec. 2.2 还把 LLFF 和 DeepStereo 归为“简单拼接跨视角特征、不具顺序不变性、必须针对固定输入数训练”的早期方法，这正是它引入 One-to-many attention 的动机。与 Ha et al. 的关系更直接：Ha 的消融项 Distance-based Blending（按目标到各输入相机的距离定权重）明确引用 LLFF [45]，在 DyNeRF 上只有 26.08 dB、STED 235.3，而完整模型为 31.17 dB、68.76；Fig. 4b 也显示这种加权会产生重影。这说明“按距离加权”对宽基线动态场景不够用，需要学习式融合。另一方面，Ha 的 I_FG = Σ_k 𝓘_k·α_k·w_k / Σ_k α_k·w_k 同样用每个视角前向渲染的累积 alpha α_k 去调制融合权重，与 LLFF 用累积 alpha 让一个视角填补另一个视角空洞的做法思路一致（属于概念类比）：没有被该视角覆盖的像素会自动降权。"}}, {"b": "note", "t": "2019 · Ben Mildenhall et al. (UC Berkeley / Fyusion) · ACM TOG 38(4) / SIGGRAPH 2019 · Semantic Scholar 引用 1331 · 难度：进阶 · 必读"}, {"b": "p", "t": "LLFF 把全光函数的采样理论（plenoptic sampling）和学习式 MPI 结合起来，给出了一条可以直接照做的采集准则：相邻采集视角之间，最近物体的视差不超过 D 像素（D 为 MPI 平面数）。论文证明所需视角数随 D 呈二次下降，最多可比 Nyquist 采样少约 4000 倍（约 64²）。它发布的真实前向场景后来被 NeRF 称为 Real Forward-Facing（RFF/LLFF），成为 NeRF 及其后几乎所有可泛化方法的标准评测集。", "label": "为什么有影响力", "mn": {"label": "相关概念与专题", "links": [{"k": "concept-i-lightfield"}, {"k": "concept-i-layered"}, {"k": "concept-i-psv"}, {"k": "concept-r-alpha"}, {"k": "concept-f-image"}, {"k": "concept-i-blending"}, {"k": "adv-a-layered-nvs"}]}}, {"b": "p", "t": "(1) 局部光场扩展：每个采样视角和它的 4 个最近邻共 5 张图，各自构建按视差线性采样的 PSV，再由 3D CNN 预测该视角的 MPI。(2) 新视角由邻近 MPI 分别渲染后加权混合：不规则采样时取最近 5 个 MPI，权重 \\(w \\propto \\exp(-\\gamma\\,\\ell)\\)，ℓ 是两相机平移向量的 L2 距离；规则网格时用最近 4 个 MPI 做双线性插值。每张渲染图再按它的累积 alpha 调制，这样某个 MPI 看不到的遮挡区可以由其他 MPI 补上，减少直接平均带来的伪影。(3) 扩展 plenoptic sampling 理论，得出采样上界。实验验证：在视差不超过 64 像素的场景里，平面数一旦超过相邻视角间的最大像素视差，再增加平面收益有限。(4) 提供了引导用户采集的手机 AR App，以及桌面端和移动端的实时查看器。", "label": "主要贡献"}, {"b": "h3", "t": "DeepView: View Synthesis with Learned Gradient Descent", "id": "classic-68", "url": "https://arxiv.org/abs/1906.07316", "sn": {"label": "与重点论文的联系", "t": "DeepView 是 Quark 核心思想的直接来源，作者团队重叠（Flynn、Broxton、DuVall、Overbeck）。Quark 的 5 步 Update & Fuse 直接沿用 DeepView 的 render-and-refine：先把中间 LDM splat 到各输入视角，over 合成出 Ĩ；再让 Update Block 比较 Ĩ 与观测，生成更新。消融中把 Ĩ 置零，DL3DV 上的 PSNR 从 30.41 降到 29.71。Quark 在三方面改造了 DeepView：用 One-to-many attention 替换跨视角 max-pool；把单一分辨率改为多尺度 UNet 结构，并用 layer collapse 逐步减少层数；把 MPI 换成 LDM。这些改动让 Quark 比 SIMPLI 快 100 倍以上。Spaces 数据集同时出现在两篇重点论文中：Quark 用它训练，并做 10/20/30 cm 基线实验；Ha et al. 也用它训练，深度由 RAFT-Stereo 生成。"}}, {"b": "note", "t": "2019 · John Flynn et al. (Google) · CVPR 2019 · Semantic Scholar 引用 493 · 难度：专家 · 必读"}, {"b": "p", "t": "DeepView 提出了 learned gradient descent（LGD）。它把“渲染当前 MPI、与输入图比较、再更新 MPI”这一优化过程展开成固定几步的网络，每一步用 CNN 代替手工的梯度更新规则，从而在网络里显式建模遮挡可见性。这是“学习式展开优化”在 NVS 中的代表作。论文还发布了 Spaces 数据集：100 个室内外场景，用 16 相机阵列拍摄，每个场景在 5–10 个略有不同的阵列位置采集（彼此相距约 10 cm 以内）。", "label": "为什么有影响力", "mn": {"label": "相关概念与专题", "links": [{"k": "concept-l-iterative"}, {"k": "concept-i-layered"}, {"k": "concept-r-alpha"}, {"k": "concept-i-psv"}, {"k": "concept-f-optim"}, {"k": "adv-a-layered-nvs"}]}}, {"b": "p", "t": "(1) 推导出（在预乘 alpha 的约定下）over 合成对第 d 层颜色的梯度就是该层的净透射率 \\(\\partial O/\\partial c_d = \\prod_{i=d+1}^{D}(1-\\alpha_i)\\)，对 alpha 的梯度则还涉及其后方各层的累积 over。据此，更新网络的输入不是某个具体损失的真实梯度，而是一组逐视角的“梯度分量”：输入图与渲染图 Ĩ 的平面扫描体（PSV）、累积 over A、净透射率 T（消融中记为 R、A、T）。(2) 不同视角之间只通过 max-pool 交互，网络因此与输入顺序无关。(3) 默认迭代 3 次，消融显示 4 次略好；前两次迭代使用单层 U-Net 式降采样，以节省显存和时间。(4) 在 Kalantari 光场数据和 Spaces 上达到当时最好结果，物体边界、反射、细结构和深度复杂区域的改善尤其明显。", "label": "主要贡献"}, {"b": "h3", "t": "NeRF: Representing Scenes as Neural Radiance Fields for View Synthesis", "id": "classic-72", "url": "https://arxiv.org/abs/2003.08934", "sn": {"label": "与重点论文的联系", "t": "两篇重点论文都不是 NeRF，但都使用它的合成方程。Quark 的 LDM 按 σ 由后向前 over 合成，重点论文笔记指出“层数相当于体渲染的采样步”：把 NeRF 公式中的 1−e^{−σδ} 换成 sigmoid 直接输出的 density，就得到 Quark 每层的不透明度。Ha 使用的 3DGS rasterizer 也是同一种 α 合成。在 DL3DV 上，Quark（31.31）超过了 NeRF 家族的 Zip-NeRF（31.22）、Mip-NeRF360（30.98）和 Instant-NGP（25.01），不过这些基线数值取自 DL3DV 论文，是在较低分辨率下得到的；Ha 的最强 baseline ENeRF 则是可泛化 NeRF。只有理解 NeRF 的体渲染和“逐场景优化”的含义，才能明白两篇论文反复强调的“不做逐场景训练、重建加渲染合计实时”有多大分量。"}}, {"b": "note", "t": "2020 · Ben Mildenhall, Pratul P. Srinivasan, Matthew Tancik (共同一作) et al. (UC Berkeley / Google Research / UC San Diego) · ECCV 2020 (Oral) · Semantic Scholar 引用 5464 · 难度：入门 · 必读"}, {"b": "p", "t": "NeRF 用一个 MLP 表示连续的体密度和随视角变化的辐射，再用经典体渲染积分的可微离散形式成像。只凭带位姿的图像，它就达到了前所未有的新视角合成质量。NeRF 开启了辐射场研究范式：之后的加速、抗锯齿、无界场景、动态场景、可泛化方法乃至 3DGS，都以它的体渲染公式作为共同语言。", "label": "为什么有影响力", "mn": {"label": "相关概念与专题", "links": [{"k": "concept-n-nerf"}, {"k": "concept-r-volume"}, {"k": "concept-r-alpha"}, {"k": "concept-l-encoding"}, {"k": "concept-l-loss"}, {"k": "concept-r-appearance"}]}}, {"b": "p", "t": "(1) 输入为 5D 坐标（位置 x 与方向 d），输出密度 σ 和 RGB。网络是 8 层、每层 256 通道的 MLP；方向只在输出 σ 之后才接入，保证几何与视角无关。(2) 位置编码：把每个坐标映射为 sin(2^k πp)、cos(2^k πp)，位置取 L=10 个频率，方向取 L=4，以克服 MLP 偏向学习低频函数的问题。(3) 离散体渲染：\\(\\hat C=\\sum_i T_i(1-e^{-\\sigma_i\\delta_i})c_i\\)，其中 \\(T_i=\\exp(-\\sum_{j<i}\\sigma_j\\delta_j)\\) 是透射率，δ_i 是相邻采样点间距。(4) 分层采样：粗网络每条射线采 64 点，细网络按粗网络的权重分布再采 128 点。(5) 每个场景要单独优化 100k–300k 次迭代，在单张 V100 上约需 1–2 天。", "label": "主要贡献"}, {"b": "h3", "t": "State of the Art on Neural Rendering", "id": "classic-77", "url": "https://arxiv.org/abs/2004.03805", "sn": {"label": "与重点论文的联系", "t": "本文不涉及 Quark 或 Ha 的具体技术，属于背景读物。它的自由视点视频和 VR/AR 临场化身章节，交代了两篇重点论文所面对的问题从哪里来；DeepView 这类 MPI 方法在其中已被归入神经渲染的方法谱系。"}}, {"b": "note", "t": "2020 · Ayush Tewari, Ohad Fried, Justus Thies, Vincent Sitzmann (共同一作) et al. (MPI Informatik / Stanford / TUM / Facebook Reality Labs / Adobe / Google) · Computer Graphics Forum 39(2) / Eurographics 2020 STAR · Semantic Scholar 引用 542 · 难度：入门"}, {"b": "p", "t": "这是第一篇系统界定“神经渲染”领域的 Eurographics STAR。它把神经渲染定义为：把可微图形学中的物理知识与深度生成模型结合，得到可控且真实的图像。综述覆盖新视角合成、语义图像编辑、人脸与人体重演、重光照、自由视点视频，以及 VR/AR 远程临场用的写实化身。它写于 NeRF 流行之前，是了解 2016–2020 年“前 NeRF 时代”方法谱系的最好入口。", "label": "为什么有影响力", "mn": {"label": "相关概念与专题", "links": [{"k": "concept-r-reps"}, {"k": "concept-l-cnn"}, {"k": "concept-l-loss"}, {"k": "concept-r-appearance"}, {"k": "adv-a-diff-render"}]}}, {"b": "p", "t": "(1) 梳理基础知识：图形学侧的渲染与相机模型，机器学习侧的 GAN、条件生成和 U-Net 等。(2) 按控制方式、所用图形学模块、显式或隐式 3D 表示、多模态输出等维度给方法分类，其中讨论了 MPI（包括 DeepView）、点云、体素和隐式函数等表示。(3) 按应用逐项综述，包括新视角合成、自由视点视频，以及 Neural Volumes 这类体积化身。(4) 讨论社会影响（如 deepfake）和开放问题。作者包括 Stephen Lombardi，他后来是 Quark 的共同作者。", "label": "主要贡献"}, {"b": "h3", "t": "Neural Point-Based Graphics", "id": "classic-78", "url": "https://arxiv.org/abs/1906.08240", "sn": {"label": "与重点论文的联系", "t": "Ha et al. Sec. 3.1 面对的正是 NPBG 要解决的问题：把输入像素反投影成点、再前向投影到目标视角时，会出现像素间空隙、锯齿边和遮挡空洞。NPBG 的办法是多尺度 z-buffer 光栅化加 CNN 补洞。Ha 的办法是把每个像素变成完全不透明、投影恰好覆盖 1 个像素的各向同性 3D Gaussian，逐视角用 3DGS rasterizer 渲染，再由 U-Net 预测权重和背景图来补洞。读过 NPBG，就更容易理解为什么直接前向 warping 点云不够用，以及 Ha 为什么强调自己的方法比传统点溅射走样更少。"}}, {"b": "note", "t": "2020 · Kara-Ali Aliev et al. (Samsung AI Center / Skoltech) · ECCV 2020 · Semantic Scholar 引用 504 · 难度：进阶"}, {"b": "p", "t": "NPBG 提出了一个简单有效的神经渲染范式：点云，加上每个点一个可学习特征，再加一个屏幕空间 CNN 渲染器。它不需要重建网格，可以直接处理 RGB-D 扫描或 SfM/MVS 点云。这篇论文推动了神经点渲染和可微点渲染方向（如 Pulsar、ADOP 等），也是“先光栅化出稀疏特征图、再用 U-Net 补洞”这一做法的代表。", "label": "为什么有影响力", "mn": {"label": "相关概念与专题", "links": [{"k": "concept-r-raster"}, {"k": "concept-i-warping"}, {"k": "concept-l-cnn"}, {"k": "concept-r-reps"}, {"k": "adv-a-diff-render"}]}}, {"b": "p", "t": "(1) 每个点带一个 M 维 neural descriptor，渲染时当作伪颜色使用；实验中 M=8 时性能饱和。(2) 不做 splatting，而是用 z-buffer 把点云分别光栅化到 T 级分辨率金字塔上，第 t 级尺寸为 W/2^t × H/2^t。低分辨率层级上点更密，自然填补了高分辨率层级的空洞。(3) 渲染网络是带 gated convolution 的 U-Net，把多尺度光栅图融合成 RGB，gated convolution 用来处理稀疏输入。(4) 描述子和渲染网络联合优化；遇到新场景时，可以只拟合描述子并微调网络。", "label": "主要贡献"}, {"b": "h3", "t": "Free View Synthesis", "id": "classic-80", "url": "https://arxiv.org/abs/2008.05511", "sn": {"label": "与重点论文的联系", "t": "Ha et al. 与 FVS 思路相近：先有外部几何（Ha 是逐视角立体深度加目标视角 TSDF 深度），再把近邻源视角搬到目标视角，最后由 CNN 融合。区别有两处。一是搬运方式：FVS 用代理深度把源图的编码特征反向 warp 到目标视角，Ha 则把源像素作为 Gaussian 前向 splat 到目标视角。二是融合方式：FVS 用 GRU 循环网络，支持任意视角数，但逐个按序处理；Ha 的 4 层 U-Net 把 9K+1 个通道直接拼接，输入视角数固定为 K，并依赖视角排序（见重点论文对比表）。Quark 用 One-to-many attention，同时做到顺序不变和视角数可变（4–16 张）。三者放在一起比较，最能看清跨视角融合在设计上有哪些选择。"}}, {"b": "note", "t": "2020 · Gernot Riegler et al. (Intel Labs) · ECCV 2020 · Semantic Scholar 引用 389 · 难度：进阶"}, {"b": "p", "t": "FVS 把 SfM 标定、MVS 几何代理、学习式特征重投影与融合组合在一起，面向 Tanks and Temples 这类视角自由分布的大尺度真实场景：在一组场景上训练后，无需微调就能用于未见场景。它是“几何代理 + 学习式特征重投影与融合”这条可泛化 IBR 路线的代表作。", "label": "为什么有影响力", "mn": {"label": "相关概念与专题", "links": [{"k": "concept-g-sfm"}, {"k": "concept-d-mvs"}, {"k": "concept-i-warping"}, {"k": "concept-i-blending"}, {"k": "concept-l-cnn"}, {"k": "adv-a-generalizable-ibr"}]}}, {"b": "p", "t": "(1) 用 COLMAP 做 SfM 和 MVS，再对融合后的点云做基于 Delaunay 的表面重建，得到网格作为几何代理。(2) 按对目标视角的覆盖程度选出 top-K 个源视角，为目标视角渲染代理深度图，据此把源图的 U-Net 编码特征（而不是颜色）warp 到目标视角。(3) 融合网络基于卷积 GRU，逐个吸收各源视角的特征，为每个源视角输出置信度图和颜色图，最后用 soft-argmax 合成输出。循环结构使网络支持任意数量的源视角，但它按顺序处理输入，并不严格与顺序无关。(4) 在一个数据集上训练后可直接用于未见场景，在 Tanks and Temples（整段序列留出测试）上明显优于同期方法。", "label": "主要贡献"}, {"b": "h3", "t": "Immersive Light Field Video with a Layered Mesh Representation", "id": "classic-81", "url": "https://augmentedperception.github.io/deepviewvideo/", "sn": {"label": "与重点论文的联系", "t": "Quark 重点论文笔记把本文列为 LDM/LM 表示的前身：Quark 的 LDM 同样由少量带深度的层组成。不同之处在于，Quark 为每一帧、每个目标视角即时生成 LDM，用完即丢；本文则离线重建出可以流式播放的持久表示。两者作者团队重叠（Broxton、Flynn、Overbeck、DuVall）。相对 Ha et al.，本文代表“离线高质量 + 可压缩传输”这一端；Ha 追求在线逐帧处理，但完全没有讨论带宽和传输。做临场系统时，两端都需要考虑。"}}, {"b": "note", "t": "2020 · Michael Broxton, John Flynn, Ryan Overbeck, Daniel Erickson (共同一作) et al. (Google) · ACM TOG 39(4) / SIGGRAPH 2020 · Semantic Scholar 引用 336 · 难度：进阶"}, {"b": "p", "t": "这是一个完整覆盖采集、重建、压缩、渲染全流程的沉浸式光场视频系统：6DoF 视频帧率 30 fps，观看基线 80 cm，视场超过 220°，可以在移动 VR 和浏览器中播放。它把学习式 NVS 从单帧图像推进到可以流式传输的视频，是体积视频和临场系统的重要参照。", "label": "为什么有影响力", "mn": {"label": "相关概念与专题", "links": [{"k": "concept-i-layered"}, {"k": "concept-g-rig"}, {"k": "concept-v-codec"}, {"k": "concept-r-raster"}, {"k": "concept-r-reps"}, {"k": "adv-a-layered-nvs"}, {"k": "adv-a-compression"}]}}, {"b": "p", "t": "(1) 采集：46 台时间同步相机分布在直径 92 cm 的半球穹顶上，平均间距 18 cm，但能重建距相机仅 20 cm 的物体。(2) 重建：沿用 DeepView，把平面 MPI 换成更适合全景光场的多球面图像（MSI）。(3) 转换：把大量球壳层压缩成少量固定数目的 RGBA + 深度层，即 layered mesh（LM），画质几乎无损。(4) 压缩：各层的 RGB、alpha、深度打包进纹理图集（texture atlas），再用常规视频编码压缩，可在移动 VR/AR 设备或网页上渲染。(5) 公开了部分场景的 46 路原始视频和相机模型。", "label": "主要贡献"}, {"b": "h3", "t": "Mip-NeRF: A Multiscale Representation for Anti-Aliasing Neural Radiance Fields", "id": "classic-85", "url": "https://arxiv.org/abs/2103.13415", "sn": {"label": "与重点论文的联系", "t": "两篇重点论文都引用了 Mip-NeRF，但都没有直接使用它的技术。不过，“像素足迹”这个概念对理解 Ha et al. 很关键。Ha 为每个像素 Gaussian 设定的解析尺度，使它在源视角中的投影恰好覆盖 1 个像素，也就是按源视角的像素足迹来设定原语大小。当目标相机与源相机的焦距或到物体的距离不同时，这些 Gaussian 在目标图上就不再恰好是 1 个像素，这正是 Mip 系列所讨论的采样率变化问题。另外，Quark 在 DL3DV 上比较的 Zip-NeRF（31.22）也属于这一系列。"}}, {"b": "note", "t": "2021 · Jonathan T. Barron et al. (Google) · ICCV 2021 (Oral) · Semantic Scholar 引用 2948 · 难度：专家"}, {"b": "p", "t": "Mip-NeRF 指出，NeRF 每个像素只投一条无限细的射线，因此在多尺度下会模糊或走样。它改为投射圆锥，并提出积分位置编码，实现了类似 mipmap 的预滤波，把信号处理中的抗锯齿方法系统地引入神经场。后来的 Mip-NeRF 360、Zip-NeRF 和 Mip-Splatting 都沿着“像素足迹（footprint）与频率约束”这条思路发展。", "label": "为什么有影响力", "mn": {"label": "相关概念与专题", "links": [{"k": "concept-n-nerf"}, {"k": "concept-l-encoding"}, {"k": "concept-f-image"}, {"k": "concept-r-volume"}]}}, {"b": "p", "t": "(1) 每个像素投射一个圆锥，沿锥体切出一段段锥台（conical frustum），每段用多元高斯近似。(2) 积分位置编码（IPE）：求位置编码 γ(x) 在该高斯分布下的期望 E[γ(x)]，有闭式解。像素足迹越大，高频分量衰减越多，相当于自动预滤波。(3) 由于编码本身带有尺度信息，粗、细两级可以共用一个 MLP：模型大小减半，速度快 7%。(4) 在 Blender 数据上误差降低 17%，在多尺度 Blender 数据上降低 60%；质量与暴力超采样的 NeRF 相当，速度快 22 倍。", "label": "主要贡献"}, {"b": "h3", "t": "pixelNeRF: Neural Radiance Fields from One or Few Images", "id": "classic-86", "url": "https://arxiv.org/abs/2012.02190", "sn": {"label": "与重点论文的联系", "t": "Quark 的 Learned Initialization 把编码后的图像特征 back-project 到 LDM 层的每个像素上，本质上就是 pixelNeRF 的“投影取像素对齐特征”，只不过查询点从 NeRF 射线上的采样点换成了 LDM 层上的点。pixelNeRF 用平均池化聚合多视角；Quark 的消融把 cross-attention 退化为取均值（keys 置零）后，PSNR 从 30.41 降到 29.73。可见从均值聚合换成注意力聚合，是 Quark 质量提升的来源之一。注意这项消融只把融合特征时的 cross-attention 退化为均值，计算 blend weights 时仍保留完整的 keys。"}}, {"b": "note", "t": "2021 · Alex Yu et al. (UC Berkeley) · CVPR 2021 · Semantic Scholar 引用 2319 · 难度：入门 · 必读"}, {"b": "p", "t": "pixelNeRF 是最早把 NeRF 从逐场景优化变成以图像为条件、前馈预测的代表作之一。做法是用 CNN 提取像素对齐的特征，把 3D 查询点投影到输入图上取出对应特征，作为 NeRF MLP 的条件。这样网络就能跨场景学习先验，用一张或几张图合成新视角。“像素对齐特征 + 投影采样”后来成为可泛化 NeRF 和前馈 3D 重建的基本构件。", "label": "为什么有影响力", "mn": {"label": "相关概念与专题", "links": [{"k": "concept-n-generalizable"}, {"k": "concept-n-nerf"}, {"k": "concept-g-pinhole"}, {"k": "concept-l-cnn"}, {"k": "concept-r-volume"}, {"k": "adv-a-generalizable-ibr"}]}}, {"b": "p", "t": "(1) 编码器是 ImageNet 预训练的 ResNet34，取前 4 个池化层之前的特征图，双线性上采样后拼接成每像素 512 维的特征。(2) 对查询点 x，先投影到输入视角的像素位置 π(x)，在那里双线性采样特征 W(π(x))。NeRF 网络以 x 的位置编码和视角方向为输入，图像特征则经线性层以残差形式注入每个 ResNet 块。(3) 在观察视角坐标系（view space）而不是物体规范坐标系中预测，因此能推广到多物体场景和真实场景。(4) NeRF 网络是 5 个残差块、宽 512 的全连接 ResNet。多视角输入时，每个视角分别经过前 3 块，然后做平均池化，再经过后 2 块，因此支持任意数量的视角。(5) 在 ShapeNet（包括未见类别）和 DTU 上验证。", "label": "主要贡献"}, {"b": "h3", "t": "MVSNeRF: Fast Generalizable Radiance Field Reconstruction from Multi-View Stereo", "id": "classic-90", "url": "https://arxiv.org/abs/2103.15595", "sn": {"label": "与重点论文的联系", "t": "MVSNeRF 与重点论文的联系是间接的：两篇重点论文共同的 baseline ENeRF，直接沿用了 MVSNeRF 的代价体思路，并改成了级联代价体。Quark 不显式构建代价体，而是在 Update Block 中把每视角的更新特征按当前深度反投影到 LDM 层，得到类似 PSV 的 Δ，再用注意力融合。可以把这看作把“代价体 + 3D CNN”换成了“逐层反投影 + 跨视角注意力 + 迭代细化”。熟悉方差代价体，有助于理解 Quark 的 Δ 里编码了哪些匹配线索。"}}, {"b": "note", "t": "2021 · Anpei Chen, Zexiang Xu (共同一作) et al. (ShanghaiTech / Adobe Research / UCSD) · ICCV 2021 · Semantic Scholar 引用 1103 · 难度：进阶"}, {"b": "p", "t": "MVSNeRF 把 MVS 中的平面扫描代价体（cost volume）与 NeRF 体渲染结合起来：只用 3 张邻近输入图、一次网络前向就能重建辐射场；在有稠密视角时还能快速微调。它确立了“代价体负责几何推理、体渲染负责可微监督”的可泛化 NeRF 结构，ENeRF 等实时方法都在此基础上发展。", "label": "为什么有影响力", "mn": {"label": "相关概念与专题", "links": [{"k": "concept-n-generalizable"}, {"k": "concept-d-mvs"}, {"k": "concept-i-psv"}, {"k": "concept-r-volume"}, {"k": "adv-a-generalizable-ibr"}, {"k": "adv-a-learned-mvs"}]}}, {"b": "p", "t": "(1) 把 3 张输入图的 2D CNN 特征 warp 到参考视角视锥内的 D 个扫描平面上，以跨视角方差为代价构建代价体：P(u,v,z)=Var(F_{i,z}(u,v))。(2) 用 3D CNN 把代价体编码成神经编码体。(3) MLP 以三线性插值得到的体特征和输入图颜色为条件，解码出密度和辐射。(4) 只在 DTU 的物体上训练，就能泛化到 NeRF 合成数据、LLFF 前向场景等与训练集差异很大的数据，包括复杂的室内场景。(5) 以网络预测作为初始化再逐场景微调，达到同等质量所需时间远少于从头训练 NeRF（论文图 1 的例子：微调约 6 分钟即可接近 NeRF 优化 5.1 小时的质量）。", "label": "主要贡献"}, {"b": "h3", "t": "IBRNet: Learning Multi-View Image-Based Rendering", "id": "classic-92", "url": "https://arxiv.org/abs/2102.13090", "sn": {"label": "与重点论文的联系", "t": "Quark 的最终输出就是 IBRNet 式的做法：对全分辨率输入像素按 blend weights 做凸组合，只是权重定义在 LDM 层上，而不是射线采样点上。Quark 消融中改为网络直接输出 RGB 后，PSNR 从 30.41 降到 29.18，LPIPS 从 0.154 升到 0.179，是所有消融里退化最大的一项，这说明了 IBR 路线的价值。Ha et al. 用 IBRNet 的官方权重作为 baseline，在 DyNeRF 上 PSNR 只有 22.49，STED 为 737.7（Ha 为 68.76），说明逐帧独立运行的可泛化 IBR 在时间上很不稳定。"}}, {"b": "note", "t": "2021 · Qianqian Wang et al. (Google Research / Cornell Tech / Princeton) · CVPR 2021 · Semantic Scholar 引用 1015 · 难度：进阶 · 必读"}, {"b": "p", "t": "IBRNet 把经典 IBR 的“从源图取颜色再混合”与 NeRF 的体渲染结合起来：网络不直接回归颜色，而是预测源视角颜色的混合权重，同时用 ray transformer 沿射线推断密度。它证明了可泛化、高分辨率、保留源图细节三者可以兼得，是 GPNR、ENeRF 等后续可泛化方法的主要比较对象和设计参照。Quark 没有直接与 IBRNet 比较，但它的基线是在 RFF + IBRNet 训练数据上重训的；Ha et al. 则直接把 IBRNet 作为 baseline。", "label": "为什么有影响力", "mn": {"label": "相关概念与专题", "links": [{"k": "concept-n-generalizable"}, {"k": "concept-i-blending"}, {"k": "concept-l-attention"}, {"k": "concept-r-volume"}, {"k": "adv-a-generalizable-ibr"}]}}, {"b": "p", "t": "(1) 对目标射线上的每个采样点，投影到 N 个邻近源视角（评测时取 10 个），取出颜色和特征。(2) PointNet 式聚合：先求跨视角特征的均值 μ 和方差 v，与每个视角的特征拼接后送入共享 MLP，得到多视角感知的特征和每视角权重；再算加权均值和方差，得到密度特征。(3) 颜色是源图颜色的 softmax 加权平均，权重由特征和相对视角方向 Δd_i 决定。(4) ray transformer 让同一射线上的采样点互相注意，推断可见性后输出密度。(5) 可直接泛化到新场景；逐场景微调后，质量可与 NeRF 竞争。", "label": "主要贡献"}, {"b": "h3", "t": "NeX: Real-time View Synthesis with Neural Basis Expansion", "id": "classic-97", "url": "https://arxiv.org/abs/2103.05606", "sn": {"label": "与重点论文的联系", "t": "Quark 的训练集包含 NeX-Shiny（采样权重 0.25），并在 Shiny 上报告 26.51/0.866/0.108（1024×768）。Quark 没有显式的视角相关外观模型，而是逐目标视角重建，再从近邻输入像素里“借”反射效果；作者明确把 NeX / Ref-NeRF 式的显式建模列为未来工作。读 NeX 可以帮助判断：Quark 这种 IBR 式的“借”在什么情况下够用，什么情况下需要显式的外观模型。"}}, {"b": "note", "t": "2021 · Suttisak Wizadwongsa, Pakkapon Phongthawee, Jiraphon Yenphraphai (共同一作) et al. (VISTEC, Thailand) · CVPR 2021 (Oral) · Semantic Scholar 引用 359 · 难度：进阶"}, {"b": "p", "t": "NeX 在 MPI 上高质量地表达了强烈的视角相关效果，例如 CD 盘面的彩虹反射、放大镜和玻璃瓶的折射；渲染速度超过 200 FPS，比 NeRF 快 1000 倍以上，论文称这是首个在这一质量下达到 200 FPS 以上实时渲染的方法。它用“基础色 + 系数 × 神经基函数”表达颜色，是球谐（SH）之外另一条视角相关外观建模路线。论文发布的 Shiny 数据集成为测试反射和折射的常用基准。", "label": "为什么有影响力", "mn": {"label": "相关概念与专题", "links": [{"k": "concept-i-layered"}, {"k": "concept-r-appearance"}, {"k": "concept-r-alpha"}, {"k": "concept-l-encoding"}, {"k": "adv-a-layered-nvs"}]}}, {"b": "p", "t": "(1) NeX-MPI：每个 MPI 像素存 alpha、基础色 k_0 和 N 个反射系数 k_1…k_N，颜色为 \\(C(v)=k_0+\\sum_{n=1}^{N}k_n H_n(v)\\)。基函数 H_n(v) 由一个只以视角方向 v 为输入的小 MLP 给出，全场景共享。(2) 隐式与显式混合：k_0 作为显式参数直接优化，用来保留高频细节；alpha 和 k_1…k_N 由另一个 MLP 预测。(3) 方法需要逐场景优化；渲染时基函数可以预先计算，因此能实时运行。(4) 在 Shiny 的 8 个场景上 NeX 为 26.45 dB，NeRF 为 25.60；在 RFF 上 NeX 为 27.26，NeRF 为 26.76。", "label": "主要贡献"}, {"b": "h3", "t": "Stable View Synthesis", "id": "classic-99", "url": "https://arxiv.org/abs/2011.07233", "sn": {"label": "与重点论文的联系", "t": "SVS 的 max(0, u·v_k) 权重，是“离目标视角越近的源射线越可信”最朴素的写法。Ha et al. 融合网络的相机特征里包含“输入射线与目标方向的点积”等量，Quark 的射线方向编码（输入射线与目标射线重合时编码为 0）也是为了让网络偏向近邻射线，二者都是这一思想的学习化版本。SVS 的核心论点“输出随视角平滑变化，所以稳定”，正对应 Ha 所说的视角一致性，即相机移动时画面不跳变。"}}, {"b": "note", "t": "2021 · Gernot Riegler et al. (Intel Labs) · CVPR 2021 · Semantic Scholar 引用 235 · 难度：进阶"}, {"b": "p", "t": "SVS 在 FVS 的基础上，把聚合从图像空间移到几何代理的 3D 表面点上：每个点收集所有看得到它的源视角特征，按目标方向做视角相关的聚合，再由 CNN 渲染出图像。它在 Tanks and Temples 等大场景上把自由视点视频的真实感推到了当时的最高水平，并明确把空间和时间上的稳定性作为设计目标。", "label": "为什么有影响力", "mn": {"label": "相关概念与专题", "links": [{"k": "concept-g-sfm"}, {"k": "concept-d-mvs"}, {"k": "concept-i-blending"}, {"k": "concept-r-appearance"}, {"k": "concept-v-temporal"}, {"k": "adv-a-generalizable-ibr"}]}}, {"b": "p", "t": "(1) 几何代理上的每个 3D 点，保存各源视角到它的射线方向 v_k 和对应的图像特征 f_k(x)。(2) 视角相关的表面特征聚合，最简单的形式是按方向对齐程度加权：\\(g = \\frac{1}{W}\\sum_k \\max(0, u^\\top v_k)\\, f_k(x)\\)，其中 u 是目标射线方向，W 是权重之和。表达力更强的版本用 PointNet 式的集合网络或图注意力网络。(3) 聚合结果随目标视角平滑变化，所以相机移动时画面稳定。(4) 整条流程可微、端到端训练，能合成镜面反射等视角相关效果。", "label": "主要贡献"}, {"b": "h3", "t": "Instant Neural Graphics Primitives with a Multiresolution Hash Encoding", "id": "classic-103", "url": "https://arxiv.org/abs/2201.05989", "sn": {"label": "与重点论文的联系", "t": "两篇重点论文都引用了 Instant-NGP，但在方法上都没有直接继承它。Quark 在 DL3DV 对比中列出 Instant-NGP 为 25.01 dB；在 Deep Blending Playroom 上，Quark 只比 Plenoxels 和 INGP 好。它“要实时就得写定制 CUDA”的经验在两篇重点论文中都能看到：Quark 的最终 IBR 渲染器用 CUDA 优化，1080p 约 1.3 ms；Ha 的 TSDF 射线步进用自定义 CUDA 实现，耗时 6 ms。"}}, {"b": "note", "t": "2022 · Thomas Müller et al. (NVIDIA) · ACM TOG 41(4) / SIGGRAPH 2022 · Semantic Scholar 引用 6357 · 难度：进阶"}, {"b": "p", "t": "Instant-NGP 用多分辨率哈希编码、极小的 MLP 和全融合 CUDA 内核，把 NeRF 的训练时间从以天计降到以秒计，1080p 渲染降到几十毫秒。它引发了“显式特征网格 + 小网络”的加速潮流，其 tiny-cuda-nn 实现也被 nerfstudio 等框架广泛采用。这篇论文还表明，内存带宽、kernel 融合这类系统工程对神经渲染速度有决定性影响。", "label": "为什么有影响力", "mn": {"label": "相关概念与专题", "links": [{"k": "concept-l-encoding"}, {"k": "concept-n-nerf"}, {"k": "concept-r-reps"}, {"k": "adv-a-nerf-fast"}]}}, {"b": "p", "t": "(1) 共 L=16 个分辨率层级，从 N_min=16 到 N_max（512 至 524288）按几何级数增长。(2) 每个层级一张大小为 T（2^14 至 2^24）的哈希表，每项存 F=2 维特征。网格角点坐标用 \\(h(x)=(\\oplus_{i=1}^{d} x_i\\pi_i) \\bmod T\\) 映射到表项，其中 π_i 是大素数，⊕ 是按位异或。哈希冲突不做显式处理，靠多分辨率结构和梯度自然区分。(3) 对体素角点特征做三线性插值，各层级结果拼接后送入小 MLP。(4) 用全融合 CUDA 实现，NeRF 可以在数秒内训练出高质量结果。", "label": "主要贡献"}, {"b": "h3", "t": "Mip-NeRF 360: Unbounded Anti-Aliased Neural Radiance Fields", "id": "classic-104", "url": "https://arxiv.org/abs/2111.12077", "sn": {"label": "与重点论文的联系", "t": "Quark 用本文的数据集与逐场景方法比较：M-NeRF360 为 27.69/0.792/0.237，3DGS-30K 为 27.21/0.815/0.214，Quark 为 26.60/0.774/0.214，PSNR 排第三，LPIPS 与 3DGS 持平。在 DL3DV 上，Quark 的 31.31 超过了 Mip-NeRF360 的 30.98 和其后续 Zip-NeRF 的 31.22（基线数值取自 DL3DV 论文，分辨率较低）。在概念上，本文“远处按视差分配采样”与 Quark 的深度参数化是同一个原理：Quark 的层 anchor 按等视差间隔 δ=(ℓ−0.5)/L 放置，深度在 1/η−1/f 的视差区间内参数化。不理解逆深度参数化，就很难看懂 Quark 的深度公式。"}}, {"b": "note", "t": "2022 · Jonathan T. Barron et al. (Google) · CVPR 2022 · Semantic Scholar 引用 2924 · 难度：专家"}, {"b": "p", "t": "Mip-NeRF 360 把 NeRF 推广到无界的真实场景：相机 360° 环绕，内容可以出现在任意距离。它提出的场景收缩参数化、proposal 网络在线蒸馏和 distortion 正则，成为无界场景 NeRF 的标准配置。论文发布的 Mip-NeRF 360 数据集，后来是 3DGS 及之后几乎所有静态重建方法的主要基准。", "label": "为什么有影响力", "mn": {"label": "相关概念与专题", "links": [{"k": "concept-n-nerf"}, {"k": "concept-g-depth"}, {"k": "concept-r-volume"}, {"k": "concept-l-loss"}, {"k": "concept-l-encoding"}]}}, {"b": "p", "t": "(1) 收缩函数：当 ‖x‖≤1 时 contract(x)=x，否则为 \\((2-1/\\|x\\|)\\,(x/\\|x\\|)\\)。整个空间被映射进半径为 2 的球内，远处的空间按视差（逆距离）而不是按距离分配容量。(2) 射线上的采样区间按视差线性划分。(3) 一个小的 proposal MLP 只预测权重分布，由主 NeRF 在线蒸馏监督，从而减少对大 MLP 的查询次数。(4) distortion 正则抑制悬浮物（floaters）和背景坍缩。(5) 与 mip-NeRF 相比，均方误差降低 57%。", "label": "主要贡献"}, {"b": "h3", "t": "Plenoxels: Radiance Fields without Neural Networks", "id": "classic-105", "url": "https://arxiv.org/abs/2112.05131", "sn": {"label": "与重点论文的联系", "t": "在 Deep Blending Playroom 上，Quark 的 23.61 dB 只高于 Plenoxels 和 INGP，远低于 3DGS。读这篇论文主要是为了理解 SH 视角相关颜色，以及“去掉神经网络，辐射场依然成立”这一点。Ha et al. 调用的 3DGS rasterizer 用同样的 SH 机制计算颜色；Ha 的每个像素 Gaussian 直接取像素值作为颜色，相当于只用与视角无关的 0 阶颜色，视角相关效果全部交给后面的融合网络。"}}, {"b": "note", "t": "2022 · Sara Fridovich-Keil, Alex Yu (共同一作) et al. (UC Berkeley) · CVPR 2022 (Oral) · Semantic Scholar 引用 2341 · 难度：入门"}, {"b": "p", "t": "Plenoxels 证明了辐射场的关键在于可微体渲染和正则化，而不在于神经网络：它用稀疏体素网格直接存储密度和球谐系数，优化速度比 NeRF 快两个数量级，质量相当。它与 Instant-NGP、TensoRF 一起开启了“显式网格辐射场”时代，3DGS 也沿用了这种球谐（SH）视角相关颜色。", "label": "为什么有影响力", "mn": {"label": "相关概念与专题", "links": [{"k": "concept-r-reps"}, {"k": "concept-r-appearance"}, {"k": "concept-r-volume"}, {"k": "concept-f-optim"}, {"k": "adv-a-nerf-fast"}]}}, {"b": "p", "t": "(1) 稀疏体素网格，每个体素存 1 个密度值和 2 阶球谐系数：每个颜色通道 9 个，共 27 个。(2) 用三线性插值定义连续场，成像沿用 NeRF 的体渲染。(3) 使用总变差（TV）正则，并由粗到细地剪枝和细分网格。(4) 自定义 CUDA 实现，在单张 Titan RTX 上，有界场景约 11 分钟、无界场景约 27 分钟即可完成优化（NeRF 约需 1 天）。", "label": "主要贡献"}, {"b": "h3", "t": "TensoRF: Tensorial Radiance Fields", "id": "classic-106", "url": "https://arxiv.org/abs/2203.09517", "sn": {"label": "与重点论文的联系", "t": "据 Semantic Scholar 的参考文献列表，两篇重点论文都没有引用 TensoRF，但都引用了它的动态后继 K-Planes（Ha et al. 还引用了 HexPlane）。这类因子化网格仍是逐场景优化的持久表示，与两篇重点论文逐帧前馈、不保留全局场景表示的做法正好相反。读 TensoRF 主要是为了理解显式网格如何压缩，以及 K-Planes/HexPlane 这类 4D 动态表示的来历。这条逐场景优化的动态表示路线，正是两篇重点论文“免逐场景训练”主张的对照面。"}}, {"b": "note", "t": "2022 · Anpei Chen, Zexiang Xu (共同一作) et al. (ShanghaiTech / Adobe Research / Tübingen & MPI-IS / UCSD) · ECCV 2022 · Semantic Scholar 引用 1856 · 难度：进阶"}, {"b": "p", "t": "TensoRF 把辐射场看作一个 4D 张量（3D 网格 × 特征通道），用 CP 分解和新提出的 VM（向量-矩阵）低秩分解来压缩，在质量、速度和模型大小之间取得平衡。这种“因子化网格”的思想影响了 K-Planes、HexPlane 等动态场景的 4D 分解表示。", "label": "为什么有影响力", "mn": {"label": "相关概念与专题", "links": [{"k": "concept-r-reps"}, {"k": "concept-n-nerf"}, {"k": "concept-f-linalg"}, {"k": "adv-a-nerf-fast"}]}}, {"b": "p", "t": "(1) CP 分解：把张量写成若干秩一向量外积之和；重建不到 30 分钟，模型小于 4 MB，质量优于 NeRF。(2) VM 分解：每个分量是一个向量与一个矩阵的外积，放宽了两个维度上的低秩约束；重建不到 10 分钟，模型小于 75 MB，质量超过当时的最好方法。(3) 密度和外观分开分解；外观特征既可以用小 MLP 解码，也可以当作 SH 系数，两种方式都有效。", "label": "主要贡献"}, {"b": "h3", "t": "Advances in Neural Rendering", "id": "classic-108", "url": "https://arxiv.org/abs/2111.05849", "sn": {"label": "与重点论文的联系", "t": "本文是背景读物。它把 pixelNeRF/IBRNet 式的泛化、动态 NeRF 和各类加速方法放在同一张图谱里，而 Quark（可泛化、实时）和 Ha（动态、在线）正处在这几个方向的交叉处。Stephen Lombardi 同时是本文和 Quark 的作者。"}}, {"b": "note", "t": "2022 · Ayush Tewari, Justus Thies, Ben Mildenhall, Pratul Srinivasan (共同一作) et al. (MPI Informatik / Google Research / Reality Labs Research 等) · Computer Graphics Forum 41(2) / Eurographics 2022 STAR · Semantic Scholar 引用 566 · 难度：入门 · 必读"}, {"b": "p", "t": "这是 NeRF 流行一年半后的 Eurographics 2022 STAR，以“神经场景表示 + 经典渲染原理”为主线，系统梳理了数百篇工作，是入门辐射场时代时被引用最多的综述之一。与 2020 年的 STAR 对照阅读，可以看出领域从 2D 生成网络转向了 3D 一致的神经场。", "label": "为什么有影响力", "mn": {"label": "相关概念与专题", "links": [{"k": "concept-n-nerf"}, {"k": "concept-r-reps"}, {"k": "concept-n-generalizable"}, {"k": "concept-n-dynamic"}, {"k": "concept-r-volume"}]}}, {"b": "p", "t": "(1) 统一基础：各类场景表示（网格、点、体素、隐式函数）、可微渲染（体渲染与表面渲染）、网络结构与位置编码。(2) 静态场景 NVS：跨场景泛化与先验（pixelNeRF，以及在同一射线的采样点之间使用 Transformer 推理可见性的 IBRNet 等）、渲染与训练加速（PlenOctrees、Instant-NGP 等）。(3) 动态与非刚体场景、可组合与可编辑表示、重光照与材质分解。(4) 开放问题与社会影响。作者包括 Mildenhall、Srinivasan、Barron、Lombardi 等。", "label": "主要贡献"}, {"b": "h3", "t": "Efficient Neural Radiance Fields for Interactive Free-viewpoint Video", "id": "classic-111", "url": "https://arxiv.org/abs/2112.01517", "sn": {"label": "与重点论文的联系", "t": "ENeRF 是两篇重点论文共同的核心 baseline。Quark：同硬件下 ENeRF 在 1024×768 需 205 ms，在 2048×1536 需 811 ms，Quark 分别为 32.2 ms 和 33.0 ms；在 RFF 上 ENeRF 为 23.71，Quark 为 26.03。Quark 指出 ENeRF 的“单层带厚度深度”在深度复杂的场景中会失败，这正是 Quark 采用多层 LDM 的动机。Ha et al.：在 DyNeRF 上 ENeRF 为 29.51 dB、STED 76.14，Ha 为 31.17、68.76；但在 ENeRF-Outdoor 上 ENeRF 的 PSNR 25.79 仍高于 Ha 的 24.01。ENeRF 逐帧独立处理，正是 Ha 所批评的“选取部分视角的前馈方法会闪烁”的代表。"}}, {"b": "note", "t": "2022 · Haotong Lin, Sida Peng (共同一作) et al. (Zhejiang University) · SIGGRAPH Asia 2022 Conference Papers · Semantic Scholar 引用 196 · 难度：进阶 · 必读"}, {"b": "p", "t": "ENeRF 把可泛化辐射场带到了动态场景的交互帧率。它先用级联代价体估计目标视角的粗深度，再只在表面附近采 2 个点做体渲染，论文称比以往的可泛化辐射场方法快至少 60 倍。ENeRF 和它发布的 ENeRF-Outdoor 数据集，是实时自由视点视频方向最常用的基线之一。", "label": "为什么有影响力", "mn": {"label": "相关概念与专题", "links": [{"k": "concept-n-generalizable"}, {"k": "concept-d-mvs"}, {"k": "concept-i-psv"}, {"k": "concept-r-volume"}, {"k": "concept-n-dynamic"}, {"k": "adv-a-generalizable-ibr"}, {"k": "adv-a-dynamic-4d"}]}}, {"b": "p", "t": "(1) 在目标视角构建两级级联代价体，预测深度和深度范围；代价体的深度范围取自 SfM。(2) depth-guided sampling：每条射线只采 2 个点。消融显示，没有深度引导时，采样点从 128 减到 2，PSNR 从 27.39 跌到 17.75；有深度引导和级联时为 27.45，速度为 20.31 FPS（512×640）。(3) 深度预测网络和辐射场网络只用 RGB 联合端到端训练。(4) 动态场景的每一帧当作独立场景处理；输入视角数动态场景取 2，静态场景取 3；512×512、3 个输入视角时在 RTX 3090 上约 25 FPS。(5) 采集并发布了户外多视角动态数据集。", "label": "主要贡献"}, {"b": "h3", "t": "3D Gaussian Splatting for Real-Time Radiance Field Rendering", "id": "classic-113", "url": "https://arxiv.org/abs/2308.04079", "sn": {"label": "与重点论文的联系", "t": "Ha et al. 的第一阶段直接调用原版 3DGS rasterizer：每个输入像素变成完全不透明、各向同性、投影覆盖 1 个像素的 Gaussian，逐视角渲染出 𝓘_k、累积 alpha α_k 和深度 𝒟_k。Ha 的损失 0.8·L1 + 0.2·SSIM 也与 3DGS 的 λ=0.2 相同。Ha 明确拒绝了 GPS-Gaussian 那种用网络预测 Gaussian 参数、一次性渲染所有视角的做法。Quark 则与逐场景优化的 3DGS 比较：DL3DV 上 31.31 对 29.82，T&T 上 23.60 对 23.14，但 Deep Blending Playroom 上 23.61 远低于 30.04。不理解 3DGS 的投影协方差和 α 混合，就无法理解 Ha 的“像素级 Gaussian 前向渲染”为什么能避免点溅射的空隙。"}}, {"b": "note", "t": "2023 · Bernhard Kerbl et al. (Inria / MPI Informatik) · ACM TOG 42(4) / SIGGRAPH 2023 · Semantic Scholar 引用 10494 · 难度：进阶 · 必读"}, {"b": "p", "t": "3DGS 用可优化的各向异性 3D Gaussian 原语，加上按 tile 划分的可微光栅化，取代了 NeRF 的射线步进。它首次在无界的完整场景上以 1080p 实时渲染：三个基准上约 134–154 FPS，质量与 Mip-NeRF 360 相当，训练只需几十分钟。此后它很快取代 NeRF，成为静态和动态重建、前馈重建、数字化身和临场系统中最常用的表示。", "label": "为什么有影响力", "mn": {"label": "相关概念与专题", "links": [{"k": "concept-n-3dgs"}, {"k": "concept-r-raster"}, {"k": "concept-r-alpha"}, {"k": "concept-r-appearance"}, {"k": "concept-g-sfm"}, {"k": "concept-l-loss"}, {"k": "adv-a-3dgs-ext"}]}}, {"b": "p", "t": "(1) 表示：从 SfM 稀疏点初始化 Gaussian。每个 Gaussian 有中心 μ、协方差 Σ=R S Sᵀ Rᵀ、不透明度 α 和 SH 颜色；旋转用四元数、缩放用向量分别存储和优化，以保证 Σ 半正定。(2) 投影：\\(\\Sigma' = J W \\Sigma W^\\top J^\\top\\)（EWA splatting），W 是视图变换，J 是透视投影仿射近似的雅可比；取 Σ' 的 2×2 部分作为屏幕上的椭圆。(3) 光栅化：屏幕划分为 16×16 的 tile，每个 Gaussian 按它覆盖的 tile 复制，用“tile ID + 深度”作为键做一次 GPU radix sort，然后逐像素由前向后做 α 混合。(4) 自适应密度控制：欠重建区域 clone Gaussian，过大的 Gaussian split 成两个（尺度除以 1.6），并剪除接近透明的 Gaussian。(5) 损失为 \\((1-\\lambda)L_1+\\lambda L_{D\\text{-}SSIM}\\)，λ=0.2。在 Mip-NeRF 360 数据上，训练 30K 步得到 27.21 dB，渲染 134 FPS，训练约 41 分钟。", "label": "主要贡献"}, {"b": "h3", "t": "2D Gaussian Splatting for Geometrically Accurate Radiance Fields", "id": "classic-124", "url": "https://arxiv.org/abs/2403.17888", "sn": {"label": "与重点论文的联系", "t": "2DGS 的“渲染多视角深度，再用 TSDF 融合出一致几何”，与 Ha et al. 的“逐视角深度经 image-based TSDF 融合出目标视角的一致深度”（τ=0.02 m）思路同源（两者的截断阈值都写作 0.02，但 2DGS 未注明单位，Ha 明确是 0.02 m 公制值）。区别在于 2DGS 是离线建体素网格，Ha 则不建网格，只沿目标射线实时融合。2DGS 对“3D Gaussian 深度在多视角间不一致”的分析，有助于理解 Ha 的分工：像素级 Gaussian 只负责搬运颜色，跨视角一致的几何交给 TSDF 融合。"}}, {"b": "note", "t": "2024 · Binbin Huang, Zehao Yu, Anpei Chen, Andreas Geiger, Shenghua Gao（ShanghaiTech、University of Tübingen 等） · SIGGRAPH 2024 Conference Papers · Semantic Scholar 引用 1646 · 难度：专家"}, {"b": "p", "t": "2DGS 指出 3D Gaussian 渲染出的深度在不同视角间不一致，于是改用 2D 有向平面 Gaussian 面元来表示表面，并通过射线与面元求交实现透视正确的 splatting。它在保持实时渲染和相近画质的同时显著提升了几何精度，是 Gaussian 表面重建的代表方法。", "label": "为什么有影响力", "mn": {"label": "相关概念与专题", "links": [{"k": "concept-n-3dgs"}, {"k": "concept-r-raster"}, {"k": "concept-d-tsdf"}, {"k": "concept-r-reps"}, {"k": "adv-a-3dgs-ext"}]}}, {"b": "p", "t": "(1) 把 3D 体积塌缩为一组 2D 有向圆盘 Gaussian，每个面元天然带有法线。(2) ray-splat intersection：在面元的局部坐标系中精确求射线交点，替代 3DGS 的仿射近似投影，对细薄表面更稳定。(3) 两个正则项：深度 distortion 正则把同一射线上的面元聚拢，法线一致性正则让面元法线与渲染深度的梯度一致。(4) 网格提取：渲染各训练视角的中位深度（沿射线累积透射率降到 0.5 处的深度），用 Open3D 做 TSDF 融合（体素 0.004，截断 0.02）；消融显示改用期望深度会因对离群值敏感而变差。", "label": "主要贡献"}, {"b": "h3", "t": "Mip-Splatting: Alias-free 3D Gaussian Splatting", "id": "classic-131", "url": "https://arxiv.org/abs/2311.16493", "sn": {"label": "与重点论文的联系", "t": "Ha et al. 给每个像素 Gaussian 设定的解析尺度，使它在源视角中恰好覆盖 1 个像素，对应的世界尺度约为“深度/焦距”，这与 Mip-Splatting 的采样间隔 d/f 是同一个量。当目标相机与源相机的焦距或到物体的距离不同时，这些 Gaussian 在目标图上就不再恰好是 1 个像素。Mip-Splatting 的频域分析可以帮助判断，Ha 所说的“比传统点溅射走样更少”在什么范围内成立，在哪里会失效。另外，Ha 直接调用原版 3DGS 光栅器，其中保留了 Mip-Splatting 所批评的固定屏幕空间膨胀：当像素级 Gaussian 在目标视角中投影变小（例如目标相机离物体更远）时，细结构可能被膨胀得偏粗，读 Ha 与点溅射的定性对比时值得留意。"}}, {"b": "note", "t": "2024 · Zehao Yu, Anpei Chen, Binbin Huang, Torsten Sattler, Andreas Geiger（University of Tübingen / Tübingen AI Center 等） · CVPR 2024（Best Student Paper） · Semantic Scholar 引用 937 · 难度：专家"}, {"b": "p", "t": "Mip-Splatting 发现，3DGS 在采样率变化（改变焦距或相机距离）时会出现严重伪影，根源有两个：缺少 3D 频率约束，以及屏幕空间使用固定的 2D 膨胀滤波。它依据采样定理提出了 3D 平滑滤波加 2D Mip 滤波，获 CVPR 2024 Best Student Paper，这套滤波被后续 3DGS 工作广泛沿用，是理解 3DGS 走样问题的首选读物。", "label": "为什么有影响力", "mn": {"label": "相关概念与专题", "links": [{"k": "concept-n-3dgs"}, {"k": "concept-f-image"}, {"k": "concept-r-raster"}, {"k": "concept-g-pinhole"}, {"k": "adv-a-3dgs-ext"}]}}, {"b": "p", "t": "(1) 3D 平滑滤波：一个像素间隔回投到世界空间约为 d/f（d 为深度，f 为以像素为单位的焦距）。据此由训练视角推出每个 Gaussian 能被重建的最高采样频率，在 3D 空间给 Gaussian 卷积一个低通滤波，限制它的最小尺寸，消除放大时的高频伪影。(2) 2D Mip 滤波：用一个近似盒滤波的 2D Gaussian 替换 3DGS 的屏幕空间膨胀，缓解缩小时的走样和结构变粗。(3) 实现中 2D Mip 滤波方差取 0.1（约一个像素），3D 平滑滤波方差取 0.2，二者合计 0.3，与原版 3DGS 的屏幕空间膨胀量对齐，以便公平比较。(4) 提出并采用“单尺度训练、多尺度测试”的评测设置，在该设置下明显优于 3DGS 和 3DGS+EWA。", "label": "主要贡献"}], "toc": false, "series": {"prev": {"k": "theme-t-deep-geometry"}, "next": {"k": "theme-t-dynamic-human"}, "up": {"u": "basics/classics/index.html", "t": "Classics 目录"}}}, "chart": {"lanes": [{"id": "t-neural-rendering", "label": "神经渲染与新视角合成"}], "points": [{"y": 2016, "c": 709, "m": false, "t": "DeepStereo: Learning to Predict New Views from the World's Imagery", "v": "CVPR 2016", "u": "basics/classics/t-neural-rendering.html#classic-44", "lane": "t-neural-rendering"}, {"y": 2018, "c": 923, "m": true, "t": "Deep Blending for Free-Viewpoint Image-Based Rendering", "v": "ACM TOG 37(6) / SIGGRAPH Asia 2018", "u": "basics/classics/t-neural-rendering.html#classic-58", "lane": "t-neural-rendering"}, {"y": 2018, "c": 436, "m": true, "t": "Stereo Magnification: Learning View Synthesis using Multiplane Images", "v": "ACM TOG 37(4) / SIGGRAPH 2018", "u": "basics/classics/t-neural-rendering.html#classic-60", "lane": "t-neural-rendering"}, {"y": 2019, "c": 1442, "m": false, "t": "Scene Representation Networks: Continuous 3D-Structure-Aware Neural Scene Representations", "v": "NeurIPS 2019", "u": "basics/classics/t-neural-rendering.html#classic-65", "lane": "t-neural-rendering"}, {"y": 2019, "c": 1331, "m": true, "t": "Local Light Field Fusion: Practical View Synthesis with Prescriptive Sampling Guidelines", "v": "ACM TOG 38(4) / SIGGRAPH 2019", "u": "basics/classics/t-neural-rendering.html#classic-66", "lane": "t-neural-rendering"}, {"y": 2019, "c": 493, "m": true, "t": "DeepView: View Synthesis with Learned Gradient Descent", "v": "CVPR 2019", "u": "basics/classics/t-neural-rendering.html#classic-68", "lane": "t-neural-rendering"}, {"y": 2020, "c": 5464, "m": true, "t": "NeRF: Representing Scenes as Neural Radiance Fields for View Synthesis", "v": "ECCV 2020 (Oral)", "u": "basics/classics/t-neural-rendering.html#classic-72", "lane": "t-neural-rendering"}, {"y": 2020, "c": 542, "m": false, "t": "State of the Art on Neural Rendering", "v": "Computer Graphics Forum 39(2) / Eurographics 2020 STAR", "u": "basics/classics/t-neural-rendering.html#classic-77", "lane": "t-neural-rendering"}, {"y": 2020, "c": 504, "m": false, "t": "Neural Point-Based Graphics", "v": "ECCV 2020", "u": "basics/classics/t-neural-rendering.html#classic-78", "lane": "t-neural-rendering"}, {"y": 2020, "c": 389, "m": false, "t": "Free View Synthesis", "v": "ECCV 2020", "u": "basics/classics/t-neural-rendering.html#classic-80", "lane": "t-neural-rendering"}, {"y": 2020, "c": 336, "m": false, "t": "Immersive Light Field Video with a Layered Mesh Representation", "v": "ACM TOG 39(4) / SIGGRAPH 2020", "u": "basics/classics/t-neural-rendering.html#classic-81", "lane": "t-neural-rendering"}, {"y": 2021, "c": 2948, "m": false, "t": "Mip-NeRF: A Multiscale Representation for Anti-Aliasing Neural Radiance Fields", "v": "ICCV 2021 (Oral)", "u": "basics/classics/t-neural-rendering.html#classic-85", "lane": "t-neural-rendering"}, {"y": 2021, "c": 2319, "m": true, "t": "pixelNeRF: Neural Radiance Fields from One or Few Images", "v": "CVPR 2021", "u": "basics/classics/t-neural-rendering.html#classic-86", "lane": "t-neural-rendering"}, {"y": 2021, "c": 1103, "m": false, "t": "MVSNeRF: Fast Generalizable Radiance Field Reconstruction from Multi-View Stereo", "v": "ICCV 2021", "u": "basics/classics/t-neural-rendering.html#classic-90", "lane": "t-neural-rendering"}, {"y": 2021, "c": 1015, "m": true, "t": "IBRNet: Learning Multi-View Image-Based Rendering", "v": "CVPR 2021", "u": "basics/classics/t-neural-rendering.html#classic-92", "lane": "t-neural-rendering"}, {"y": 2021, "c": 359, "m": false, "t": "NeX: Real-time View Synthesis with Neural Basis Expansion", "v": "CVPR 2021 (Oral)", "u": "basics/classics/t-neural-rendering.html#classic-97", "lane": "t-neural-rendering"}, {"y": 2021, "c": 235, "m": false, "t": "Stable View Synthesis", "v": "CVPR 2021", "u": "basics/classics/t-neural-rendering.html#classic-99", "lane": "t-neural-rendering"}, {"y": 2022, "c": 6357, "m": false, "t": "Instant Neural Graphics Primitives with a Multiresolution Hash Encoding", "v": "ACM TOG 41(4) / SIGGRAPH 2022", "u": "basics/classics/t-neural-rendering.html#classic-103", "lane": "t-neural-rendering"}, {"y": 2022, "c": 2924, "m": false, "t": "Mip-NeRF 360: Unbounded Anti-Aliased Neural Radiance Fields", "v": "CVPR 2022", "u": "basics/classics/t-neural-rendering.html#classic-104", "lane": "t-neural-rendering"}, {"y": 2022, "c": 2341, "m": false, "t": "Plenoxels: Radiance Fields without Neural Networks", "v": "CVPR 2022 (Oral)", "u": "basics/classics/t-neural-rendering.html#classic-105", "lane": "t-neural-rendering"}, {"y": 2022, "c": 1856, "m": false, "t": "TensoRF: Tensorial Radiance Fields", "v": "ECCV 2022", "u": "basics/classics/t-neural-rendering.html#classic-106", "lane": "t-neural-rendering"}, {"y": 2022, "c": 566, "m": true, "t": "Advances in Neural Rendering", "v": "Computer Graphics Forum 41(2) / Eurographics 2022 STAR", "u": "basics/classics/t-neural-rendering.html#classic-108", "lane": "t-neural-rendering"}, {"y": 2022, "c": 196, "m": true, "t": "Efficient Neural Radiance Fields for Interactive Free-viewpoint Video", "v": "SIGGRAPH Asia 2022 Conference Papers", "u": "basics/classics/t-neural-rendering.html#classic-111", "lane": "t-neural-rendering"}, {"y": 2023, "c": 10494, "m": true, "t": "3D Gaussian Splatting for Real-Time Radiance Field Rendering", "v": "ACM TOG 42(4) / SIGGRAPH 2023", "u": "basics/classics/t-neural-rendering.html#classic-113", "lane": "t-neural-rendering"}, {"y": 2024, "c": 1646, "m": false, "t": "2D Gaussian Splatting for Geometrically Accurate Radiance Fields", "v": "SIGGRAPH 2024 Conference Papers", "u": "basics/classics/t-neural-rendering.html#classic-124", "lane": "t-neural-rendering"}, {"y": 2024, "c": 937, "m": false, "t": "Mip-Splatting: Alias-free 3D Gaussian Splatting", "v": "CVPR 2024（Best Student Paper）", "u": "basics/classics/t-neural-rendering.html#classic-131", "lane": "t-neural-rendering"}]}}</script>
<script>
(function () {
  "use strict";
  // ================= lib: DOM, text and math helpers shared by every page =================
