:root {

}

main { display: block; }
.art { max-width: 67rem; margin: 0 auto; padding: 2.6rem 1.5rem 3rem; counter-reset: sidenote-counter; }
.art > *, .art section > * { width: var(--main); }

/* ---------- side notes & margin notes (floated into the right margin) ---------- */
.sidenote, .marginnote {
  float: right; clear: right; position: relative;
  width: var(--side); margin-right: calc(-1 * (var(--side) + var(--gap))); margin-top: .3rem; margin-bottom: .6rem;
  font-family: var(--note); font-size: .88rem; line-height: 1.6; color: var(--ink-2); text-align: left;

.note-label { font-family: var(--serif); font-weight: 600; font-size: .82rem; color: var(--muted); margin-right: .5em; }

/* Reference lists: a narrow label column (kind / year) and a hanging text column. */
.art ul.refs { list-style: none; padding-left: 0; }
.refs li { display: grid; grid-template-columns: 2.8rem minmax(0, 1fr); column-gap: .5rem; line-height: 1.6; }
.refs li > :not(.kind):not(.yr) { grid-column: 2; }

/* Tables: booktabs rules (top, under the header, bottom), no vertical lines, no fills. */
.table-wrap { overflow-x: auto; margin: 1rem 0; }

table.kv td { padding: .25rem 0; vertical-align: top; }

/* Long articles: the table of contents sits at the top of the margin. */

details.mtoc {
  float: right; clear: right; width: var(--side); margin-right: 0; margin-bottom: 1rem;

/* Tools: search and filters with underlined inputs. */
.tool { margin-top: 1rem; }

/* Figures: the pipeline diagram and the timeline of classic papers, drawn in ink with one accent for interaction. */
figure { margin: 1.4rem 0; }
svg a { text-decoration: none; }
.diagram-wrap, .lanes-wrap { position: relative; overflow-x: auto; }

svg .dot { fill: var(--ink); }
svg .dot.hollow { fill: var(--bg); stroke: var(--ink-2); stroke-width: 1.2; }

svg.lanes a.m:focus { outline: none; }
.vtip { position: absolute; z-index: 20; max-width: 20rem; padding: .45rem .7rem; background: var(--bg); border: 1px solid var(--rule-2); font-family: var(--note); font-size: .82rem; line-height: 1.5; pointer-events: none; }

.vtip small { display: block; color: var(--muted); }
.vtip span { color: var(--accent); }

.series { display: grid; grid-template-columns: 1fr auto 1fr; gap: 1rem; align-items: end; margin-top: 3.2rem; padding-top: 1rem; border-top: 1px solid var(--rule); font-size: .98rem; }
.series small { display: block; font-family: var(--note); font-size: .8rem; color: var(--muted); }

/* ---------- hover preview ---------- */
.xtip {

  .drop a { padding: .2rem 0; white-space: normal; }
  .burger { display: inline; }

  .art { padding: 1.6rem 1rem 2.4rem; }
  .art > *, .art section > * { width: 100%; }
  h1 { font-size: 1.85rem; }
  .subtitle { font-size: 1.22rem; }
  .epigraph blockquote { padding-left: 1rem; }
  .epigraph p { font-size: 1.05rem; }
  label.margin-toggle:not(.sidenote-number) { display: inline; cursor: pointer; color: var(--muted); font-family: "et-book", var(--serif); padding: 0 .15em; }
  label.sidenote-number { cursor: pointer; }

  }

  details.mtoc[open] summary::after { content: " −"; }
  .filters { flex-direction: column; align-items: stretch; gap: .5rem; }

  table.kv, table.kv tbody, table.kv tr, table.kv th, table.kv td { display: block; max-width: none; }

}
@media print {

s/l-attention.html", "t": "注意力机制与 Transformer", "e": "Attention & Transformers", "m": "Foundations · M6 深度学习基础（3D 视觉视角）", "s": "注意力用 query 与一组 key 的缩放点积经 softmax 得到权重，再对 value 做加权平均。", "n": "注意力机制与 Transformer"}, "concept-l-cnn": {"u": "basics/foundations/l-cnn.html", "t": "卷积网络、残差块与 U-Net", "e": "CNNs, residual blocks & U-Net", "m": "Foundations · M6 深度学习基础（3D 视觉视角）", "s": "卷积用共享的小核在图像上滑动，提取局部特征；残差连接让深层网络容易训练；U-Net 用编码器下采样、解码器上采样和同尺度跳连，同时获得大感受野和像素级精度。", "n": "卷积网络、残差块与 U-Net"}, "concept-l-diffusion": {"u": "basics/foundations/l-diffusion.html", "t": "扩散模型入门", "e": "Diffusion models primer", "m": "Foundations · M6 深度学习基础（3D 视觉视角）", "s": "扩散模型先把数据逐步加噪成纯高斯噪声，再训练网络一步步去噪，从而学会从复杂分布中采样。", "n": "扩散模型入门"}, "concept-l-iterative": {"u": "basics/foundations/l-iterative.html", "t": "学习式迭代细化与展开优化", "e": "Learned iterative refinement & unrolled optimization", "m": "Foundations · M6 深度学习基础（3D 视觉视角）", "s": "做法是把“渲染当前估计 → 与观测比较 → 更新”这个迭代优化过程，展开成固定的几步，每步的更新量由神经网络给出，整体端到端训练。", "n": "学习式迭代细化与展开优化"}, "concept-l-loss": {"u": "basics/foundations/l-loss.html", "t": "损失函数与训练实践", "e": "Losses & training practice", "m": "Foundations · M6 深度学习基础（3D 视觉视角）", "s": "损失函数决定网络眼中什么是“好图像”：L2 偏向均值（结果偏糊），L1 偏向中位数，SSIM 关注局部结构，LPIPS 用深度特征度量感知差异。", "n": "损失函数与训练实践"}, "module-M6": {"u": "basics/foundations/m6.html", "t": "M6 · 深度学习基础（3D 视觉视角）", "e": "Deep learning for 3D vision", "m": "Foundations", "s": "掌握读懂两篇论文网络部分所需的结构与训练知识：U-Net、注意力、编码、损失、迭代细化。"}, "walk-ha-h10": {"u": "works/walkthrough/ha.html#walk-ha-h10", "t": "几何引导混合网络的输入特征（9K+1 个通道）", "e": "", "m": "Walkthrough · Ha et al. · H10", "s": "输入：h3 的 K 组 (𝓘_k, α_k, 深度)、h8 的 𝒟^t，以及相机的几何关系。", "n": "H10"}, "walk-ha-h11": {"u": "works/walkthrough/ha.html#walk-ha-h11", "t": "混合输出：K 个逐像素权重、一个背景权重和一张背景图", "e": "", "m": "Walkthrough · Ha et al. · H11", "s": "输入：U-Net 的输出，即 K 个权重图 w_k、1 个背景权重 w_BG 和 3 通道背景图 𝓘_BG，按输出内容推算共 K+4 个通道，K=4 时为 8…", "n": "H11"}, "walk-ha-h13": {"u": "works/walkthrough/ha.html#walk-ha-h13", "t": "训练数据、推理加速（TensorRT）与运行时间拆解", "e": "", "m": "Walkthrough · Ha et al. · H13", "s": "输入：ScanNet、Google Spaces 和 3 个 DyNeRF 训练场景的多视角样本。", "n": "H13"}, "walk-quark-q2": {"u": "works/walkthrough/quark.html#walk-quark-q2", "t": "输入编码：残差 CNN 特征金字塔 + 射线方向编码 γ", "e": "", "m": "Walkthrough · Quark · Q2", "s": "输入：M 张 RGB 图，相机参数，目标视锥的近/远平面。", "n": "Q2"}, "walk-quark-q6": {"u": "works/walkthrough/quark.html#walk-quark-q6", "t": "Update：比较 Ĩ 与观测特征，生成逐视角 update feature，再按当前深度反投影成 Δ", "e": "", "m": "Walkthrough · Quark · Q6", "s": "输入：每个视角的 Ĩ_m（跨分辨率的那一步先做 2× 上采样）、这一级的特征 I_{k,m}、射线编码 γ_{k,m}、当前深度 d。", "n": "Q6"}, "walk-quark-q7": {"u": "works/walkthrough/quark.html#walk-quark-q7", "t": "Fuse：One-to-many attention 跨视角融合（含 W^K/W^V 折叠技巧）", "e": "", "m": "Walkthrough · Quark · Q7", "s": "输入：当前 V [L,H,W,C] 和 M 个 Δ_m [L,H,W,C]。", "n": "Q7"}, "walk-quark-q8": {"u": "works/walkthrough/quark.html#walk-quark-q8", "t": "由粗到细：分辨率翻倍 + Layer Collapse（24 层 36×64 → 6 层 288×512）", "e": "", "m": "Walkthrough · Quark · Q8", "s": "输入：V^(0) [24,36,64,32]。", "n": "Q8"}}, "concept": {"id": "l-cnn", "name_zh": "卷积网络、残差块与 U-Net", "name_en": "CNNs, residual blocks & U-Net", "tldr_zh": "卷积用共享的小核在图像上滑动，提取局部特征；残差连接让深层网络容易训练；U-Net 用编码器下采样、解码器上采样和同尺度跳连，同时获得大感受野和像素级精度。Ha 的融合网络和 Quark 由粗到细的主干都是这一结构的变体。", "intuition_zh": "卷积层用一个 k×k×C_in 的小核在图像上滑动。每个输出像素只看输入的一个局部邻域，所有位置共享同一组权重。由此带来两个性质：一是平移等变，物体平移时特征图随之平移；二是参数量与图像尺寸无关。多层卷积堆叠后，一个输出单元能“看到”的输入范围称为感受野。3×3 卷积每加一层，感受野只增加“2×累计步长”个像素，所以要在少量层内看到大范围，就必须下采样：每经过一次 stride-2，后续每层的感受野增速就翻倍。\n\n残差块写成 y = x + F(x)。网络只需学习相对于输入的修正量；某个块没有用时，可以让 F≈0，退化为恒等映射。反向传播时，梯度还能沿恒等支路直达浅层，因此几十到上百层的网络也能训练。两篇论文中几乎所有可学习模块都是残差形式：Quark 的编码器由残差网络和带步长的 mean-pooling 组成（图 2），Update Block 是一个带残差的前馈 CNN（图 3 标注为 residual Feed-forward CNN），Fusion Block 里的注意力子层和 3×3 卷积子层都写成 V + F(V)（式 9、10）。\n\nU-Net 由三部分组成。编码器逐级下采样、通道数增加，获得大感受野和语义信息；解码器逐级上采样，恢复分辨率；同尺度跳连把编码器特征直接拼到解码器上。视图合成恰好同时需要这两种能力：判断遮挡和补洞需要大范围上下文，由瓶颈层提供；融合权重必须在物体边缘精确到像素，靠跳连送回的高分辨率细节保证。特征金字塔网络（FPN，Lin et al. 2017）也是“自底向上下采样 + 自顶向下上采样 + 同尺度横向连接”，与 U-Net 思想相同，只是每一级都输出一份特征。Quark 在第 3 节开头引用 FPN 来称呼它的输入特征金字塔，不过按图 2，它的编码器只是“残差网络 + 带步长 mean-pooling”的自底向上结构：每张输入图被编码成 C=32 的 4 级金字塔，每一步 Update & Fuse 取与当前 LDM 分辨率匹配的那一级。\n\n部署时，训练好的 PyTorch 网络通常交给 TensorRT 这类推理编译器处理。它会把卷积、偏置和激活融合成一个 GPU kernel，为每层挑选最快的卷积算法，并可改用 FP16 或 INT8。加速幅度取决于网络和精度，2–3 倍并不少见。Ha et al. 表 4 中，融合网络从 65 ms（无 TensorRT）降到 23 ms（约 2.8×）。论文本身没有报告帧率；按表 4 把前向 splat 10 ms、TSDF 6 ms、融合 23 ms 相加约 39 ms，折合约 25 fps（单个目标视角，不含立体深度估计）。没有 TensorRT 时相加约 81 ms，而正文写的是“约 100 ms”，两者对不上。", "analogy_zh": "U-Net 像一个编辑部。记者（编码器浅层）在现场记下细节，层层上报给总编（瓶颈层），由总编做全局判断；总编的决定再层层下发（解码器），每一级都把本级记者的原始笔记（跳连）摊在桌上对照。这样最终稿既有全局判断，又不丢细节。残差连接则像文档的“修订模式”：每一层只写批注（修正量），原文始终保留。", "equations": [{"tex": "y_{c_o,i,j} = b_{c_o} + \\sum_{c_i=1}^{C_{in}} \\sum_{u=0}^{k-1}\\sum_{v=0}^{k-1} W_{c_o,c_i,u,v}\\; x_{c_i,\\, s\\,i+u,\\, s\\,j+v}", "explain_zh": "二维卷积（省略 padding）。y 为输出特征，c_o 为输出通道，(i, j) 为输出位置；x 为输入特征，c_i 为输入通道，C_in 为输入通道数；W 为 k×k 卷积核，u、v 为核内偏移；s 为步长，b 为偏置。参数量为 C_out·C_in·k²（另加 C_out 个偏置），与图像大小无关。深度学习框架实现的其实是互相关（不翻转卷积核），习惯上仍称卷积。"}, {"tex": "r_l = r_{l-1} + (k_l - 1)\\, j_{l-1}, \\qquad j_l = j_{l-1}\\, s_l", "explain_zh": "感受野递推公式。r_l 是第 l 层一个输出单元对应的输入像素范围（边长）；k_l 为该层核大小，s_l 为该层步长；j_l 为累计步长，即该层相邻两个单元在原图上相距的像素数。初值 r_0=1，j_0=1。池化层同样适用，例如 2×2、步长 2 的池化取 k=2、s=2。"}, {"tex": "\\mathbf{x}_{l+1} = \\mathbf{x}_l + \\mathcal{F}(\\mathbf{x}_l;\\ \\theta_l)", "explain_zh": "残差块。x_l 为第 l 块的输入；F 为残差分支，由若干卷积、归一化和激活组成，参数为 θ_l。由于 ∂x_{l+1}/∂x_l = I + ∂F/∂x_l，其中的恒等项 I 提供了一条不经过任何权重矩阵的梯度通路，所以梯度不容易在深层消失。"}, {"tex": "\\mathbf{d}_s = \\mathrm{Conv}\\big(\\,[\\,\\mathrm{Up}(\\mathbf{d}_{s+1}),\\ \\mathbf{e}_s\\,]\\,\\big)", "explain_zh": "U-Net 解码器的一级。e_s 为编码器第 s 级特征（分辨率为原图的 1/2^s）；d_{s+1} 为更粗一级的解码特征；Up 为 2 倍上采样（转置卷积或双线性插值）；[·,·] 表示按通道拼接，也就是跳连；Conv 为该级的卷积块。拼接要求 Up(d_{s+1}) 与 e_s 的空间尺寸完全一致。"}], "worked_example_zh": "以 Ha et al. 的融合网络为例。论文只写了“four-layer U-Net”，下面按一种常见配置估算：4 个分辨率级，每级两层 3×3 卷积，级间做 2×2、步长 2 的下采样。这个配置是假设，论文没有给出。\n(1) 输入通道：K=4 时为 9K+1=37 个，其中 RGB 12 个、深度 4 个、alpha 4 个、TSDF 深度 1 个、相机特征 16 个（附录 A.4）。\n(2) 尺寸：训练裁剪为 640×352，逐级变为 320×176 → 160×88 → 80×44，每一级都能整除。推理分辨率为 1352×1014：1352/8=169 可以整除，但 1014/2=507 是奇数，再下采样得到 253（向下取整），上采样回来只有 506，跳连拼接时尺寸对不上。实际实现需要先把高度填充到 1016（可被 8 整除），推理后再裁回 1014；不能直接缩放图像，因为缩放会改变等效内参，破坏像素与相机几何的对应关系。\n(3) 感受野（按递推公式，r_0=1、j_0=1）：第 1 级两层 3×3 卷积，1→3→5；2×2 下采样后为 6（j=2）。第 2 级为 10→14，下采样后为 16（j=4）。第 3 级为 24→32，下采样后为 36（j=8）。瓶颈两层为 52→68。解码器三级（j=4、2、1）各两层 3×3 卷积，分别再加 16、8、4，共 28（上采样层本身还会略增），全网理论感受野约 100 像素，有效感受野还要更小。按这个假设配置，I_BG 补洞时网络能利用的上下文只有约 100 像素的量级：在 1352×1014 的画面中，几十像素宽的遮挡洞可以借助周围内容填补；更宽的洞，中心部分基本只能靠平均色外推。作为对比，原版 U-Net（4 次下采样、共 5 级）的感受野在瓶颈处继续增长为 68 → 76 → 108 → 140。\n(4) 速度：表 4 中融合网络无 TensorRT 时 65 ms，Torch-TensorRT 下 23 ms；加上前向 splat 的 10 ms 和 TSDF 的 6 ms，合计约 39 ms（不含立体深度估计、差分掩码计算和磁盘读取）。\nQuark 对照（表 8）：LDM 依次为 24 层×36×64 → 24×72×128 → 12×144×256 → 6×288×512。后两次是“空间分辨率翻倍、层数减半”，可以类比 U-Net 解码器的“分辨率翻倍、通道减半”：层数×每层像素数依次为 55,296 → 221,184 → 442,368 → 884,736，后两步只翻倍而不是翻 4 倍。最后再双线性上采样 3.75 倍到 1080p（288×3.75=1080，512×3.75=1920）。", "pitfalls_zh": ["“4 层 U-Net”有歧义：既可能指 4 个分辨率级，也可能指 4 次下采样。Ha et al. 没有公开通道数、归一化、激活和上采样方式，复现时需要自己选定并在报告中写明。", "输入边长必须能被 2^(级数−1) 整除，否则跳连拼接时尺寸对不上。推理分辨率（1352×1014）与训练裁剪（640×352）不同时，应该用 padding 而不是 resize，否则等效内参改变，像素与相机几何的对应会被破坏。", "理论感受野不等于有效感受野：梯度贡献集中在感受野中心，所以实际补大洞的能力远低于理论值。需要更大上下文时，应该加深网络、加入注意力或利用多帧，不能只看理论数字。", "把 K 个视角直接拼成通道（Ha 的 9K+1 就是这样）会让网络依赖视角顺序，并把 K 固定下来。Ha 训练时 K=4，D3DMV 测试时 K=2（附录 A.7），论文没说明通道数怎么适配（重训？补零？），复现时要特别注意。", "报告 TensorRT 速度时要同时核对画质：FP16/INT8 推理可能与 FP32 训练结果有细微差异。Ha 没有说明推理精度，也没有说明测试 GPU（V100 只出现在训练描述里），所以 23 ms 不能直接和其他硬件上的数字比较。"], "in_quark": {"used": true, "where": "Sec. 3.2.1 与图 2（残差 CNN + 带步长 mean-pooling 的编码器，K 级特征金字塔）；Sec. 1 “Multi-scale learned render-and-refine network core”（把 Update & Fuse 嵌入 UNet 结构）与 Sec. 3.2.2（“reminiscent of a UNet”）；式 (10) 3×3 残差卷积块；Sec. 3.2.3 Upsample & Activate；附录 C 表 8/9", "how_zh": "编码器由残差网络和带步长的 mean-pooling 组成，把每张输入图编码成 C=32 的 4 级特征金字塔（表 8 中为 36×60、72×120、144×240、288×480）。主干的 5 步 Update & Fuse 构成一条 U-Net 式的“解码路径”：LDM 依次为 24 层×36×64 → 24×72×128 → 12×144×256 → 6×288×512（Quark+ 为 32→16→8 层，最终 432×768）。分辨率每翻倍一次，就从金字塔里取更细的一级输入特征，相当于把输入图像金字塔当作跳连送入各级。Update Block 是小型残差 CNN；Fusion Block 中的卷积块为 V' = V + Conv(gelu(Conv(N(V))))（式 10）。表 8 中，Initialize 与 Update & Fuse 0、1 各含 3 组“A4, C, C”，Update & Fuse 2 含 2 组“A4, C”，Update & Fuse 3、4 各含 2 组“A2, C”和“A1, C”，且这两步开头各有一次 Layer Collapse（Lc）。最后的 Upsample & Activate 先把未激活的 depth、density 和 blend logits 双线性上采样 3.75 倍，再施加激活（借鉴 ReLU Fields），可以看成一个无参数的“解码器最后一级”。\n\n它和标准 U-Net 有两点不同：一是没有先对 LDM 下采样的编码路径，而是从极粗的分辨率开始只往细走；二是每一级都插入了渲染-比较（见 l-iterative）。不懂 U-Net，就看不懂作者为什么说升分辨率同时降层数是在“平衡空间维和深度维的计算”。消融中去掉 layer collapse，运行时间增加 115%。"}, "in_ha": {"used": true, "where": "Sec. 3.3（“The network Θ(·) is a four-layer U-Net [55]”）；附录 A.4（输入通道清单，合计 (9K+1)×H×W）；Sec. 4 实现段与表 4（Torch-TensorRT，融合 23 ms / 无 TensorRT 65 ms）；表 3 消融", "how_zh": "融合网络 Θ 是一个 4 层 U-Net。输入包括 K 张前向渲染 RGB（3K 通道）、深度（K）、alpha（K）、TSDF 深度（1），以及 4 组各 K 通道的相机特征，共 9K+1 通道（K=4 时为 37）。输出是 K 张逐像素融合权重 w_k、背景权重 w_BG 和一张背景图 I_BG。U-Net 在这里有两个作用：高分辨率跳连让权重图在遮挡边界处保持锐利，从而决定每个像素取哪个视角；瓶颈层的大感受野让 I_BG 能用周围上下文补小的遮挡洞。训练设置为 640×352 裁剪、batch 12、Adam 学习率 2e-4、weight decay 1e-5、150K 次迭代、单块 V100，用 PyTorch 实现。推理分辨率为 1352×1014，用 Torch-TensorRT 加速到 23 ms。表 3 消融显示，从“按距离加权”（PSNR 26.08）换成学习型融合网络（去掉 TSDF 引导时 31.16，完整模型 31.17）是表中最大的一次提升（约 +5.1 dB），这部分收益几乎全部来自这个普通的 U-Net。"}, "in_field_zh": "在立体匹配与重建中，CNN 和 U-Net 无处不在：RAFT-Stereo 的特征与上下文编码器（a-learned-stereo）、MVSNet 中用于代价体正则化的 3D U-Net（a-learned-mvs）、GPS-Gaussian 的深度和高斯参数回归，都属于这一类。生成与后处理也离不开它们：扩散模型的去噪器（l-diffusion，Stable Diffusion 的主干就是 U-Net），以及视频编码后去块效应的后处理网络。部署层面，TensorRT 加 FP16 在实时 telepresence 系统中非常常见。U-Net 的级数与输入分辨率直接决定每帧耗时多少毫秒、能补多大的遮挡洞，这也是系统设计时最常调的两个旋钮。", "resources": [{"title": "U-Net: Convolutional Networks for Biomedical Image Segmentation", "url": "https://arxiv.org/abs/1505.04597", "type": "paper", "note_zh": "U-Net 原论文，也就是 Ha et al. 的参考文献 [55]。图 1 是编码器-解码器-跳连结构的标准示意图。注意原文用无填充卷积，输出比输入小（572→388）；现代实现一般改用 same padding。"}, {"title": "Deep Residual Learning for Image Recognition", "url": "https://arxiv.org/abs/1512.03385", "type": "paper", "note_zh": "ResNet 原论文。第 3.1–3.2 节解释了为什么学习残差 F(x)=H(x)−x 比直接学习 H(x) 更容易，以及恒等捷径的作用。"}, {"title": "Dive into Deep Learning, Ch. 7 Convolutional Neural Networks（及 8.6 Residual Networks）", "url": "https://d2l.ai/chapter_convolutional-neural-networks/index.html", "type": "book", "note_zh": "7.2 节讲图像卷积（含 7.2.6 感受野），7.3 节讲 padding 与 stride，可直接对应上文的尺寸计算；8.6 节讲残差块。每节都附可运行的 PyTorch 代码。"}, {"title": "Computing Receptive Fields of Convolutional Neural Networks (Distill)", "url": "https://distill.pub/2019/computing-receptive-fields/", "type": "tutorial", "note_zh": "系统推导单路径与任意计算图网络的感受野大小和区域，给出递推式与闭式解，可以用来核对上文 68 像素和 140 像素的计算。"}], "self_check": [{"q_zh": "一个 4 级 U-Net（每级两层 3×3 卷积，级间 2 倍下采样）直接输入 1352×1014 的图像，会出什么问题？应该怎么处理？", "a_zh": "4 级需要 3 次 2 倍下采样，因此边长必须能被 8 整除。1352 满足（1352/8=169），1014 不满足（1014/8=126.75）：第一次下采样得到 507 之后就无法再精确减半，跳连时编码器和解码器的特征尺寸对不上。常见做法是用反射或零填充把高度补到 1016（或 1024），推理后再裁回 1014。不要直接 resize，否则等效内参改变，像素与相机几何的对应关系会被破坏。"}, {"q_zh": "为什么可以说 Quark 整体是 U-Net 式结构？它和 Ha 的 U-Net 又有什么本质区别？", "a_zh": "相同之处在于：两者都是多尺度、由粗到细的结构，低分辨率处理全局、高分辨率只做细化，而且每一级都从输入特征金字塔取同分辨率的特征，相当于跳连。本质区别有两点。第一，Ha 的 U-Net 只做一次前馈，是图像到图像的映射，输入是已经 warp 好的图像；Quark 的“解码路径”每一级都是一次 render-and-refine 迭代，状态是一个 LDM 特征体（层×H×W×C）。第二，Quark 在最后两次提升空间分辨率时用 layer collapse 把层数减半，以此平衡空间维和深度维的计算量。"}, {"q_zh": "残差连接在 Quark 的 Fusion Block 中出现在哪里？如果去掉会怎样？", "a_zh": "出现在两处：式 (9) V' = V + MultiHead(N(V), Δ)，以及式 (10) V' = V + Conv(gelu(Conv(N(V))))，都是 pre-norm 残差形式。按表 8 统计，Fusion 部分共有 15 个注意力块和 24 个卷积块，即 39 个残差分支（不含编码器、Update Block 和 Layer Collapse）。去掉残差后，几十个块串联时梯度很难传到浅层，训练会变得不稳定。Quark 另外还用了 GPT-2 式的 residual scaling 来进一步稳定训练（见 l-loss）。"}], "prereqs": ["f-image"]}, "module": "module-M6", "walk": ["walk-quark-q2", "walk-quark-q6", "walk-quark-q7", "walk-quark-q8", "walk-ha-h10", "walk-ha-h11", "walk-ha-h13"], "classics": ["classic-35", "classic-37", "classic-44", "classic-47", "classic-50", "classic-53", "classic-54", "classic-55", "classic-56", "classic-57", "classic-58", "classic-61", "classic-62", "classic-64", "classic-67", "classic-77", "classic-78", "classic-80", "classic-84", "classic-86", "classic-102", "classic-112", "classic-114", "classic-140"], "adv": ["adv-a-learned-stereo", "adv-a-learned-mvs"], "prev": "concept-i-psv", "next": "concept-l-attention", "readMin": 8}</script>
<script>
(function () {
  "use strict";
  // ================= lib: DOM, text and math helpers shared by every page =================
  // A page script defines rich(text) (inline cross-links); paras() and eqList() call it.
  var DATA;
  try { DATA = JSON.parse(document.getElementById("data").textContent); } catch (e) { DATA = {}; }
  var meta = DATA.meta || {};

  // ---------- DOM helpers: all text goes through textContent; external links are https-only ----------
  function safeUrl(u) { if (typeof u !== "string") return null; var s = u.trim(); return /^https:\/\/[^\s"'<>]+$/i.test(s) ? s : null; }
  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (!Object.prototype.hasOwnProperty.call(attrs, k)) continue;
      var v = attrs[k];
      if (v === null || v === undefined || v === false) continue;
      if (k === "class") n.className = v;
      else if (k === "text") n.textContent = String(v);
      else if (k === "href") { var u = safeUrl(v); if (u) { n.setAttribute("href", u); n.setAttribute("target", "_blank"); n.setAttribute("rel", "noopener noreferrer"); } }
      else if (k.slice(0, 2) === "on" && typeof v === "function") n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, String(v));
    }
    (kids || []).forEach(function (c) { if (c === null || c === undefined || c === false) return; n.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return n;
  }
  var SVGNS = "http://www.w3.org/2000/svg";
  function sv(tag, attrs, kids) {
    var n = document.createElementNS(SVGNS, tag);
    if (attrs) for (var k in attrs) {
      if (!Object.prototype.hasOwnProperty.call(attrs, k)) continue;
      var v = attrs[k];
      if (v === null || v === undefined || v === false) continue;
      if (k === "text") n.textContent = String(v);
      else if (k.slice(0, 2) === "on" && typeof v === "function") n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, String(v));
    }
    (kids || []).forEach(function (c) { if (c) n.appendChild(c); });
    return n;
  }
  function arr(x) { return Array.isArray(x) ? x : []; }
  function str(x) { return typeof x === "string" ? x : (x === null || x === undefined ? "" : String(x)); }
  function paras(text) { return str(text).split(/\n\s*\n/).map(function (t) { return t.trim(); }).filter(Boolean).map(function (t) { return el("p", null, rich(t)); }); }
  function link(title, url) { return safeUrl(url) ? el("a", { href: url, text: title }) : el("span", { text: title }); }
  function ul(items, map) { return el("ul", { class: "plain" }, arr(items).map(function (x) { return el("li", null, [map ? map(x) : str(x)]); })); }
  function fmtCit(n) { n = Number(n); if (!(n >= 0)) return "—"; if (n >= 1000) return (n / 1000).toFixed(n >= 10000 ? 0 : 1) + "k"; return String(n); }

  // ---------- math (MathJax, typeset lazily) ----------
  var mathReady = false, mathQueue = [];
  function mathUsable() { return !!(window.MathJax && typeof window.MathJax.typesetPromise === "function"); }
  function flushMath() { mathReady = true; var q = mathQueue.slice(); mathQueue = []; q.forEach(typeset); }
  window.__atlasMathReady = flushMath;
  // MathJax may finish loading before this script runs (cached/async), so also poll for it.
  var mathPoll = setInterval(function () { if (mathUsable()) { clearInterval(mathPoll); flushMath(); } }, 200);
  setTimeout(function () { clearInterval(mathPoll); }, 30000);
  function typeset(node) {
    if (!node) return;
    if (!mathReady && mathUsable()) mathReady = true;
    if (!mathReady || !mathUsable()) { mathQueue.push(node); return; }
    try { window.MathJax.typesetPromise([node]).catch(function () { /* leave raw TeX visible */ }); } catch (e) { /* leave raw TeX visible */ }
  }
  function eqList(eqs) {
    eqs = arr(eqs).filter(function (q) { return q && str(q.tex).trim(); });
    if (!eqs.length) return null;
    return el("div", { class: "eqs" }, eqs.map(function (q) {
      return el("div", { class: "eq" }, [el("div", { class: "math-block", text: "\\[" + str(q.tex) + "\\]" }), q.explain_zh ? el("p", null, rich(q.explain_zh)) : null]);
    }));
  }
  document.addEventListener("toggle", function (e) { var t = e.target; if (t && t.tagName === "DETAILS" && t.open) typeset(t); }, true);

  // ================= frame (Tufte site): links, notes, hover previews, top bar, theme =================
  var SITE = DATA.site || {};
  var ROOT = str(SITE.root);
  var XREF = DATA.xref || {};
  function hasX(key) { return Object.prototype.hasOwnProperty.call(XREF, key); }
  // Custom page parts (search tools, diagrams, charts) register here; blocks.js calls them for {"b": "slot"} blocks.
  var SLOTS = {};

  // ---------- internal links: urls are relative to the site root; pages sit at different depths ----------
  var SAFE_PATH = /^[A-Za-z0-9][A-Za-z0-9._\/-]*(\?[A-Za-z0-9=&._-]+)?(#[A-Za-z0-9._-]+)?$/;
  function relHref(u) {
    u = str(u);
    if (/^#[A-Za-z0-9._-]+$/.test(u)) return u;
    if (!SAFE_PATH.test(u)) return null;
    var cut = u.indexOf("#"), path = cut < 0 ? u : u.slice(0, cut);
    if (path === SITE.path) return cut < 0 ? "#" : u.slice(cut);
    return ROOT + u;
  }
  function pageLink(u, text, cls) {
    var h = relHref(u);
    if (!h) return el("span", { class: cls || null, text: text });
    var a = el("a", { class: cls || null, text: text });
    a.setAttribute("href", h);
    return a;
  }
  // A link to a known entry (concept, topic, paper, step...). data-xref drives the hover preview.
  function xlink(key, text, cls) {
    if (!hasX(key)) return text ? document.createTextNode(text) : null;
    var x = XREF[key], a = pageLink(x.u, text || x.n || x.t, cls);
    a.setAttribute("data-xref", key);
    return a;
  }

  // Concept / topic ids mentioned in prose ("见 g-pinhole") become links labelled with the entry's short name.
  var ID_RE = /(a-[a-z0-9]+(?:-[a-z0-9]+)*|[fgdrilnv]-[a-z0-9]+)/g;
  var CJK = /[　-〿㐀-鿿＀-￯]/;
  function rich(text) {
    var s = str(text), out = [], last = 0, m;
    ID_RE.lastIndex = 0;
    while ((m = ID_RE.exec(s)) !== null) {
      var id = m[1], prev = m.index > 0 ? s.charAt(m.index - 1) : "", next = s.charAt(m.index + id.length);
      var key = hasX("concept-" + id) ? "concept-" + id : (hasX("adv-" + id) ? "adv-" + id : null);
      if (!key || /[A-Za-z0-9_\-]/.test(prev) || /[A-Za-z0-9_]/.test(next)) continue;
      // The prose spaces ids off from Chinese text; a Chinese label needs no such space.
      var before = s.slice(last, m.index);
      if (/ $/.test(before) && CJK.test(before.charAt(before.length - 2))) before = before.slice(0, -1);
      if (before) out.push(document.createTextNode(before));
      out.push(xlink(key, null, "xref"));
      last = m.index + id.length;
      if (s.charAt(last) === " " && CJK.test(s.charAt(last + 1))) last++;
    }
    if (last < s.length) out.push(document.createTextNode(s.slice(last)));
    return out;
  }
  function lines(text) { return str(text).split(/\n+/).map(function (t) { return t.trim(); }).filter(Boolean).map(function (t) { return el("p", null, rich(t)); }); }

  // ---------- side notes (numbered) and margin notes (unnumbered); on phones they fold behind a toggle ----------
  var noteSeq = 0;
  function sidenote(kids) {
    var id = "sn-" + (++noteSeq);
    return el("span", { class: "note-wrap" }, [
      el("label", { for: id, class: "margin-toggle sidenote-number", "aria-label": "旁注" }),
      el("input", { type: "checkbox", id: id, class: "margin-toggle" }),
      el("span", { class: "sidenote" }, kids)
    ]);
  }
  function marginnote(kids) {
    var id = "mn-" + (++noteSeq);
    return el("span", { class: "note-wrap" }, [
      el("label", { for: id, class: "margin-toggle", "aria-label": "边注", text: "⊕" }),
      el("input", { type: "checkbox", id: id, class: "margin-toggle" }),
      el("span", { class: "marginnote" }, kids)
    ]);
  }
  function noteLabel(text) { return el("span", { class: "note-label", text: text }); }

  // ---------- article scaffolding ----------
  var main = document.getElementById("main");
  var art = main.querySelector("article");
  function section(id, title, kids) {
    var s = el("section", { id: id }, [title ? el("h2", { text: title }) : null].concat(kids));
    art.appendChild(s);
    return s;
  }
  function articleHead(o) {
    var crumbs = el("nav", { class: "crumbs", "aria-label": "位置" });
    arr(SITE.crumbs).forEach(function (c, i) {
      if (i) crumbs.appendChild(el("span", { class: "sep", text: "›", "aria-hidden": "true" }));
      crumbs.appendChild(c[1] ? pageLink(c[1], c[0]) : el("span", { text: c[0] }));
    });
    art.appendChild(el("header", { class: "art-head" }, [
      crumbs,
      el("h1", { text: o.title }),
      o.subtitle ? el("p", { class: "subtitle", text: o.subtitle }) : null,
      o.meta ? el("p", { class: "meta" }, o.meta) : null
    ]));
    if (o.epigraph) art.appendChild(el("div", { class: "epigraph" }, [el("blockquote", null, [el("p", null, rich(o.epigraph))])]));
  }
  // Previous / next in the series, each with its hover preview.
  function seriesNav(prevKey, nextKey, indexUrl, indexLabel) {
    var nav = el("nav", { class: "series", "aria-label": "同系列" });
    nav.appendChild(el("div", { class: "prev" }, prevKey && hasX(prevKey) ? [el("small", { text: "上一篇" }), xlink(prevKey)] : []));
    nav.appendChild(el("div", { class: "up" }, indexUrl ? [pageLink(indexUrl, indexLabel)] : []));
    nav.appendChild(el("div", { class: "next" }, nextKey && hasX(nextKey) ? [el("small", { text: "下一篇" }), xlink(nextKey)] : []));
    art.appendChild(nav);
  }

  // ---------- hover preview for internal links: mouse (after 300 ms) or keyboard focus; never on touch ----------
  var tip = null, tipTimer = 0, tipFor = null;
  function hideTip() {
    clearTimeout(tipTimer);
    if (tip) tip.hidden = true;
    if (tipFor) { tipFor.removeAttribute("aria-describedby"); tipFor = null; }
  }
  function showTip(a) {
    var key = a.getAttribute("data-xref");
    if (!hasX(key)) return;
    var x = XREF[key];
    if (!tip) { tip = el("div", { class: "xtip", id: "xtip", role: "tooltip" }); document.body.appendChild(tip); }
    tip.textContent = "";
    if (x.m) tip.appendChild(el("div", { class: "xt-m", text: x.m }));
    tip.appendChild(el("div", { class: "xt-t", text: x.t }));
    if (x.e) tip.appendChild(el("div", { class: "xt-e", text: x.e }));
    if (x.s) tip.appendChild(el("p", { class: "xt-s", text: x.s }));
    tip.hidden = false;
    var r = a.getClientRects()[0] || a.getBoundingClientRect(), vw = document.documentElement.clientWidth;
    var w = tip.offsetWidth, h = tip.offsetHeight;
    var left = Math.max(8, Math.min(r.left, vw - w - 8));
    var top = r.bottom + 6;
    if (top + h > window.innerHeight - 8 && r.top - h - 6 > 8) top = r.top - h - 6;
    tip.style.left = Math.round(left + window.pageXOffset) + "px";
    tip.style.top = Math.round(top + window.pageYOffset) + "px";
    a.setAttribute("aria-describedby", "xtip");
    tipFor = a;
  }
  function xrefTarget(e) { return e.target && e.target.closest ? e.target.closest("a[data-xref]") : null; }
  document.addEventListener("pointerover", function (e) {
    var a = xrefTarget(e);
    if (!a || e.pointerType !== "mouse" || a === tipFor) return;
    clearTimeout(tipTimer);
    tipTimer = setTimeout(function () { showTip(a); }, 300);
  });
  document.addEventListener("pointerout", function (e) {
    var a = xrefTarget(e);
    if (!a || (e.relatedTarget && a.contains(e.relatedTarget))) return;
    hideTip();
  });
  document.addEventListener("focusin", function (e) {
    var a = xrefTarget(e);
    if (a && a.matches(":focus-visible")) showTip(a);
  });
  document.addEventListener("focusout", function (e) { if (xrefTarget(e)) hideTip(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") hideTip(); });
  window.addEventListener("scroll", function () { if (tipFor && !tipFor.matches(":focus-visible")) hideTip(); }, { passive: true });

  // ---------- top bar: four menus with dropdowns (hover or click on desktop, a folding list on phones) ----------
  var wide = window.matchMedia("(min-width: 761px)");
  function setOpen(li, open) {
    var btn = li.querySelector(".menu-btn");
    if (open) Array.prototype.forEach.call(li.parentNode.children, function (o) { if (o !== li) setOpen(o, false); });
    li.classList.toggle("open", open);
    btn.setAttribute("aria-expanded", open ? "true" : "false");
    if (!open) li._hover = false;
  }
  function buildTopbar() {
    var bar = document.getElementById("topbar");
    var menus = el("ul", { class: "menus", id: "menus" });
    arr(SITE.nav).forEach(function (m) {
      var id = "menu-" + m.key;
      var btn = el("button", { type: "button", class: "menu-btn", "aria-expanded": "false", "aria-controls": id, text: m.label });
      var list = el("ul", { class: "drop", id: id }, arr(m.items).map(function (it) {
        var a = pageLink(it[1], it[0]);
        if (it[1] === SITE.navItem) a.classList.add("cur");
        if (it[1] === SITE.path) a.setAttribute("aria-current", "page");
        return el("li", null, [a]);
      }));
      var li = el("li", { class: "menu" + (m.key === SITE.navCur ? " cur" : "") }, [btn, list]);
      btn.addEventListener("click", function () {
        // A click on a menu the mouse already opened keeps it open instead of closing it again.
        if (li._hover) { li._hover = false; return; }
        setOpen(li, !li.classList.contains("open"));
      });
      btn.addEventListener("keydown", function (e) {
        if (e.key === "ArrowDown") { e.preventDefault(); setOpen(li, true); var f = list.querySelector("a"); if (f) f.focus(); }
      });
      li.addEventListener("pointerenter", function (e) { if (e.pointerType === "mouse" && wide.matches) { setOpen(li, true); li._hover = true; } });
      li.addEventListener("pointerleave", function (e) { if (e.pointerType === "mouse" && wide.matches) setOpen(li, false); });
      li.addEventListener("focusout", function (e) { if (wide.matches && !li.contains(e.relatedTarget)) setOpen(li, false); });
      li.addEventListener("keydown", function (e) { if (e.key === "Escape" && li.classList.contains("open")) { setOpen(li, false); btn.focus(); } });
      menus.appendChild(li);
    });
    var burger = el("button", { type: "button", class: "burger", "aria-expanded": "false", "aria-controls": "menus", text: "Menu" });
    burger.addEventListener("click", function () {
      var open = !bar.classList.contains("nav-open");
      bar.classList.toggle("nav-open", open);
      burger.setAttribute("aria-expanded", open ? "true" : "false");
    });
    var themeBtn = el("button", { type: "button", class: "theme-btn" });
    function darkNow() {
      var t = document.documentElement.getAttribute("data-theme");
      return t ? t === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
    }
    function paintThemeBtn() {
      var dark = darkNow();
      themeBtn.textContent = dark ? "Light" : "Dark";
      themeBtn.setAttribute("aria-label", dark ? "切换到浅色" : "切换到深色");
    }
    themeBtn.addEventListener("click", function () {
      var next = darkNow() ? "light" : "dark";
      var system = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      // Choosing what the system already shows drops the override, so the page follows the system again.
      if (next === system) document.documentElement.removeAttribute("data-theme");
      else document.documentElement.setAttribute("data-theme", next);
      try { if (next === system) localStorage.removeItem("atlas-theme"); else localStorage.setItem("atlas-theme", next); } catch (e) { /* storage unavailable */ }
      paintThemeBtn();
    });
    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", paintThemeBtn);
    paintThemeBtn();
    bar.appendChild(el("div", { class: "bar-in" }, [pageLink("index.html", SITE.brand || "", "brand"), el("nav", { class: "site-nav", "aria-label": "站点导航" }, [menus]), themeBtn, burger]));
    document.addEventListener("click", function (e) {
      if (!bar.contains(e.target)) Array.prototype.forEach.call(menus.children, function (li) { setOpen(li, false); });
    });
  }

  function finishPage() {
    buildTopbar();
    var foot = document.getElementById("site-foot");
    if (foot) foot.appendChild(el("p", null, [pageLink("index.html", SITE.brand || ""), SITE.date ? " · 内容截至 " + SITE.date : ""]));
    typeset(main);
    // Deep links (#id): the page is rendered by script, so jump once it exists and again after fonts settle.
    var h = window.location.hash ? window.location.hash.slice(1) : "";
    if (h && /^[A-Za-z0-9._~-]+$/.test(h) && document.getElementById(h)) {
      var moved = false;
      ["wheel", "touchstart", "keydown", "mousedown"].forEach(function (ev) { window.addEventListener(ev, function () { moved = true; }, { once: true, passive: true }); });
      var settle = function () { var t = document.getElementById(h); if (t && !moved) t.scrollIntoView({ block: "start" }); };
      settle();
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { window.requestAnimationFrame(settle); });
      [400, 1200, 2500].forEach(function (ms) { setTimeout(settle, ms); });
    }
  }

  // ================= article: one Foundations concept =================
  (function () {
    var c = DATA.concept || {};
    if (!c.id) return;
    art.id = "concept-" + c.id;
    var mod = XREF[DATA.module] || {};

    var prereqs = arr(c.prereqs).map(function (p) { return xlink("concept-" + p, XREF["concept-" + p] ? XREF["concept-" + p].t : p); }).filter(Boolean);
    var metaLine = [];
    if (prereqs.length) metaLine.push(marginnote([noteLabel("阅读前需要")].concat(joinNodes(prereqs, "；"))));
    metaLine.push(xlink(DATA.module, mod.t), " · 约 " + (DATA.readMin || 1) + " 分钟");
    articleHead({ title: c.name_zh, subtitle: c.name_en, meta: metaLine, epigraph: c.tldr_zh });

    function joinNodes(nodes, sep) {
      var out = [];
      nodes.forEach(function (n, i) { if (i) out.push(sep); out.push(n); });
      return out;
    }

    // 直觉: the analogy sits in the margin beside the first paragraph.
    var intuition = paras(c.intuition_zh);
    if (str(c.analogy_zh).trim() && intuition.length) intuition[0].insertBefore(marginnote([noteLabel("类比")].concat(rich(c.analogy_zh))), intuition[0].firstChild);
    if (intuition.length) section("intuition", "直觉", intuition);

    var eqs = eqList(c.equations);
    if (eqs) section("equations", "公式", [eqs]);
    if (str(c.worked_example_zh).trim()) section("example", "例子", lines(c.worked_example_zh));
    if (arr(c.pitfalls_zh).length) section("pitfalls", "易错点", [el("ol", null, arr(c.pitfalls_zh).map(function (t) { return el("li", null, rich(t)); }))]);
    if (str(c.in_field_zh).trim()) section("in-field", "在 3D 临场系统中", paras(c.in_field_zh));

    // 案例: where each key paper uses the concept; the paper location is a side note, guide steps a margin note.
    var steps = arr(DATA.walk);
    var cases = [];
    [["quark", c.in_quark], ["ha", c.in_ha]].forEach(function (pair) {
      var anchor = pair[0], u = pair[1] || {};
      var head = el("h3", null, [anchorName(anchor),
        str(u.where).trim() ? sidenote([noteLabel("论文位置")].concat(rich(u.where))) : null,
        el("span", { class: "used", text: u.used ? "用到" : "未用" })]);
      cases.push(head);
      var body = paras(u.how_zh);
      var mine = steps.filter(function (k) { return k.indexOf("walk-" + anchor + "-") === 0 && hasX(k); });
      if (mine.length && body.length) {
        var links = [];
        mine.forEach(function (k, i) { if (i) links.push(el("br")); links.push(xlink(k, XREF[k].n + " " + XREF[k].t)); });
        body[0].insertBefore(marginnote([noteLabel("导读步骤")].concat(links)), body[0].firstChild);
      }
      cases = cases.concat(body);
    });
    section("cases", "案例：Quark 与 Ha 如何使用", cases);
    function anchorName(a) { return a === "quark" ? "Quark" : "Ha et al."; }

    if (arr(c.self_check).length) {
      section("self-check", "自测", [el("ol", { class: "quiz" }, arr(c.self_check).map(function (q) {
        return el("li", null, [el("p", null, rich(q.q_zh)), el("details", null, [el("summary", { text: "答案" }), el("p", null, rich(q.a_zh))])]);
      }))]);
    }

    // 延伸阅读: resources with their notes, then topics and classic papers that build on this concept.
    var further = [];
    var ty = { book: "教材", course: "课程", paper: "论文", tutorial: "教程", code: "代码", video: "视频", blog: "文章" };
    if (arr(c.resources).length) {
      further.push(el("h3", { text: "学习资源" }));
      further.push(el("ul", { class: "refs" }, arr(c.resources).map(function (r) {
        return el("li", null, [el("span", { class: "kind", text: ty[r.type] || r.type || "" }),
          el("div", null, [link(r.title, r.url), str(r.note_zh).trim() ? el("div", { class: "gloss" }, rich(r.note_zh)) : null])]);
      })));
    }
    var adv = arr(DATA.adv).filter(hasX);
    if (adv.length) {
      further.push(el("h3", { text: "进阶专题" }));
      further.push(el("ul", { class: "refs" }, adv.map(function (k) {
        return el("li", null, [el("span", { class: "kind", text: "专题" }), el("div", null, [xlink(k, XREF[k].t), XREF[k].e ? el("div", { class: "en", text: XREF[k].e }) : null])]);
      })));
    }
    var cls = arr(DATA.classics).filter(hasX);
    if (cls.length) {
      further.push(el("h3", { text: "经典论文" }));
      further.push(el("ul", { class: "refs papers" }, cls.map(function (k) {
        return el("li", null, [el("span", { class: "yr", text: str(XREF[k].m).replace(/^Classics · /, "") }), xlink(k, XREF[k].t)]);
      })));
    }
    if (further.length) section("further", "延伸阅读", further);

    seriesNav(DATA.prev, DATA.next, "basics/foundations/index.html", "Foundations 目录");
  })();

  finishPage();
})();
</script>
