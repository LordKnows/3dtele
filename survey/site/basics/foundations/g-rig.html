}

  .menu.open > .menu-btn::after { content: " −"; }
  .menu.cur > .menu-btn { box-shadow: none; }
  .drop { position: static; border: 0; padding: 0 0 .4rem .9rem; min-width: 0; }
  .drop a { padding: .2rem 0; white-space: normal; }
  .burger { display: inline; }
  .theme-btn { margin-left: auto; }
  .art { padding: 1.6rem 1rem 2.4rem; }
  .art > *, .art section > * { width: 100%; }
  h1 { font-size: 1.85rem; }
  .subtitle { font-size: 1.22rem; }
  .epigraph blockquote { padding-left: 1rem; }
  .epigraph p { font-size: 1.05rem; }
  label.margin-toggle:not(.sidenote-number) { display: inline; cursor: pointer; color: var(--muted); font-family: "et-book", var(--serif); padding: 0 .15em; }
  label.sidenote-number { cursor: pointer; }
  .sidenote, .marginnote { display: none; }

    display: block; float: left; clear: both; width: 100%; margin: .6rem 0; padding-left: .8rem; border-left: 1px solid var(--rule-2);
  }
  .series { grid-template-columns: 1fr 1fr; }

  details.mtoc { float: none; width: 100%; margin: 0 0 1.2rem; padding-left: .8rem; border-left: 1px solid var(--rule-2); }

  .filters { flex-direction: column; align-items: stretch; gap: .5rem; }

  .filters input[type="search"], .filters input, .filters select { min-width: 0; flex: 1; }

  .toc-meta { display: block; margin-left: 0; }
  table.kv, table.kv tbody, table.kv tr, table.kv th, table.kv td { display: block; max-width: none; }

}

 and Description", "e": "", "m": "Classics · 2018", "s": "它是最早被广泛采用的自监督深度特征点之一，把检测和描述做在同一个网络里，在许多 SfM、SLAM 和定位流水线中被用作 SIFT/ORB 的替代。"}, "classic-69": {"u": "basics/classics/t-fusion-capture.html#classic-69", "t": "The Relightables: Volumetric Performance Capture of Humans with Realistic Relighting", "e": "", "m": "Classics · 2019", "s": "它把 Light Stage 式的反射率采集与全身体积表演捕捉结合起来，输出可以重新打光的高质量体积视频，使体积内容能自然融入任意光照的 AR/VR 场景。"}, "classic-74": {"u": "basics/classics/t-deep-geometry.html#classic-74", "t": "SuperGlue: Learning Feature Matching with Graph Neural Networks", "e": "", "m": "Classics · 2020", "s": "它把特征匹配从“最近邻 + 比率测试”变成了可学习的全局推理问题：用带自注意力和交叉注意力的图网络，加上可微最优传输，同时找出对应并拒绝不可匹配的点，大幅提升…"}, "classic-81": {"u": "basics/classics/t-neural-rendering.html#classic-81", "t": "Immersive Light Field Video with a Layered Mesh Representation", "e": "", "m": "Classics · 2020", "s": "这是一个完整覆盖采集、重建、压缩、渲染全流程的沉浸式光场视频系统：6DoF 视频帧率 30 fps，观看基线 80 cm，视场超过 220°，可以在移动 VR…"}, "classic-93": {"u": "basics/classics/t-dynamic-human.html#classic-93", "t": "Neural Body: Implicit Neural Representations with Structured Latent Codes for Novel View Synthesis of Dynamic Humans", "e": "", "m": "Classics · 2021", "s": "Neural Body 是极稀疏视角（4 台相机）人体新视角合成的奠基工作，这个问题本身是病态的。"}, "concept-d-stereo": {"u": "basics/foundations/d-stereo.html", "t": "双目立体匹配：从 SGM 到 RAFT-Stereo", "e": "Stereo matching: from SGM to RAFT-Stereo", "m": "Foundations · M3 深度估计与三维重建", "s": "在校正后的左右图同一行上找对应像素得到视差 d，再用 Z=fb/d 换算成深度。", "n": "双目立体匹配"}, "concept-g-pinhole": {"u": "basics/foundations/g-pinhole.html", "t": "针孔相机模型：内参、外参、投影与反投影", "e": "Pinhole camera: intrinsics, extrinsics, projection & unprojection", "m": "Foundations · M2 相机与多视几何", "s": "针孔模型先用外参 [R|t] 把世界点变到相机坐标系，再用内参 K 投到像素；反过来，只有像素时只能确定一条射线，像素加上深度才能唯一确定一个 3D 点。", "n": "针孔相机模型"}, "concept-g-rig": {"u": "basics/foundations/g-rig.html", "t": "多相机阵列：标定、同步与卷帘快门", "e": "Multi-camera rigs: calibration, synchronization & rolling shutter", "m": "Foundations · M2 相机与多视几何", "s": "多相机阵列需要让所有相机在三方面对齐：几何上（内外参）、颜色上（曝光、白平衡、响应曲线）、时间上（同一时刻曝光）。", "n": "多相机阵列"}, "concept-g-sfm": {"u": "basics/foundations/g-sfm.html", "t": "运动恢复结构（SfM）与光束法平差", "e": "Structure-from-Motion & bundle adjustment", "m": "Foundations · M2 相机与多视几何", "s": "SfM 只从一组照片出发，同时求出每台相机的内外参和一组稀疏 3D 点：先做特征匹配和几何验证，再逐步注册相机、三角化新点，并反复用光束法平差（BA）最小化重投影误差。", "n": "运动恢复结构（SfM）与光束法平差"}, "concept-v-codec": {"u": "basics/foundations/v-codec.html", "t": "视频编码、传输与延迟预算", "e": "Video coding, transport & latency budgets", "m": "Foundations · M8 视频、时间一致性、评测与系统", "s": "远程临场要在约百毫秒内把多路彩色和深度视频送到对端并渲染出来。", "n": "视频编码、传输与延迟预算"}, "concept-v-temporal": {"u": "basics/foundations/v-temporal.html", "t": "时间一致性、闪烁与时域滤波", "e": "Temporal consistency, flicker & temporal filtering", "m": "Foundations · M8 视频、时间一致性、评测与系统", "s": "逐帧独立预测时，每帧误差互不相关，这些误差会直接表现为闪烁。", "n": "时间一致性、闪烁与时域滤波"}, "module-M2": {"u": "basics/foundations/m2.html", "t": "M2 · 相机与多视几何", "e": "Cameras & multi-view geometry", "m": "Foundations", "s": "会用内外参在像素、射线、三维点之间来回转换，理解视差-深度关系和相机阵列的标定与同步。"}, "walk-depthsplat-ds11": {"u": "works/walkthrough/depthsplat.html#walk-depthsplat-ds11", "t": "扩展到更多视角与更高分辨率：每个视角只配 2 个最近邻，12 张 512×960 输入约 0.6 s 完成重建", "e": "", "m": "Walkthrough · DepthSplat · DS11", "s": "以 V=12、512×960 为例。", "n": "DS11"}, "walk-enerf-en1": {"u": "works/walkthrough/enerf.html#walk-enerf-en1", "t": "问题设定：S 个最近的已标定源视角 + 一个深度范围，逐帧推理，不做逐场景优化", "e": "", "m": "Walkthrough · ENeRF · EN1", "s": "输入：B×S×3×H×W 的源图（DTU 默认测试 S=3、512×640，像素归一化到 [−1, 1]），每个源视角的 4×4 外参和 3×3 内参，目标相…", "n": "EN1"}, "walk-enerf-en11": {"u": "works/walkthrough/enerf.html#walk-enerf-en11", "t": "动态视频：逐帧独立推理，人物数据依赖前景 mask 与 SMPL 包围盒，可在该视频上微调；户外另有前景/背景两层模型", "e": "", "m": "Walkthrough · ENeRF · EN11", "s": "输入：第 t 帧的同步多视角图像（ZJU-MoCap 为 21 台相机）、该帧的前景 mask 和 SMPL 顶点包围盒、观看者给出的目标相机位姿。", "n": "EN11"}, "walk-freesplat-fs2": {"u": "works/walkthrough/freesplat.html#walk-freesplat-fs2", "t": "邻近视角选择：平移距离加旋转角，每个视角只和最近的 N−1 个视角匹配", "e": "", "m": "Walkthrough · FreeSplat · FS2", "s": "输入：V 个视角的外参 T_i=[R_i|t_i]（相机到世界）。", "n": "FS2"}, "walk-gpsgaussian-gp1": {"u": "works/walkthrough/gpsgaussian.html#walk-gpsgaussian-gp1", "t": "问题设定：环形相机阵列拍人物，每个新视点只用最近的两台相机", "e": "", "m": "Walkthrough · GPS-Gaussian · GP1", "s": "输入：N 台围成一圈、已标定且同步的 RGB 相机在某一时刻的图像（论文 N=8），每张图的前景 mask，内外参 {K_i, R_i, t_i}，以及目标视…", "n": "GP1"}, "walk-gpsgaussian-gp10": {"u": "works/walkthrough/gpsgaussian.html#walk-gpsgaussian-gp10", "t": "合成训练数据：Twindom 1700 个加 THuman2.0 526 个人体扫描，在虚拟相机圈中渲染（论文 8 台，公开代码 16 台）", "e": "", "m": "Walkthrough · GPS-Gaussian · GP10", "s": "输入：带纹理的人体扫描网格（.obj 加纹理图）。", "n": "GP10"}, "walk-gpsgaussian-gp11": {"u": "works/walkthrough/gpsgaussian.html#walk-gpsgaussian-gp11", "t": "实时性能与真实系统：论文报告 RTX 3090 + TensorRT 下源处理 27 ms、渲染 0.8 ms，表中 25 FPS；演示接入 6 台相机", "e": "", "m": "Walkthrough · GPS-Gaussian · GP11", "s": "输入：两路 1024×1024 源图（已抠像、已标定）。", "n": "GP11"}, "walk-gpsgaussian-gp2": {"u": "works/walkthrough/gpsgaussian.html#walk-gpsgaussian-gp2", "t": "立体校正：用 cv2.stereoRectify 把两台相机转成行对齐的双目，并得到 Tf_x = −fB", "e": "", "m": "Walkthrough · GPS-Gaussian · GP2", "s": "输入：两张 1024×1024 的源图与 mask，以及它们的内参 K0、K1 和外参 E0、E1。", "n": "GP2"}, "walk-ha-h1": {"u": "works/walkthrough/ha.html#walk-ha-h1", "t": "问题设定：固定、已标定、同步的相机阵列，K 个最近 RGB-D 视角，在线逐帧处理", "e": "", "m": "Walkthrough · Ha et al. · H1", "s": "输入：t 时刻 N 路 H×W RGB 帧 {I_n^t}，对应逐视角深度 {D_n^t}，一次性标定好的内外参 {K_n, R_n, t_n}，以及目标（虚…", "n": "H1"}, "walk-ha-h5": {"u": "works/walkthrough/ha.html#walk-ha-h5", "t": "静止区域的时间深度滤波（EMA）", "e": "", "m": "Walkthrough · Ha et al. · H5", "s": "输入：当前原始深度 D_n^t、掩码 M_n^t 和上一帧滤波结果 Ḋ_n^{t−1}。", "n": "H5"}, "walk-ibrnet-ib1": {"u": "works/walkthrough/ibrnet.html#walk-ibrnet-ib1", "t": "问题设定：从 N=10 个邻近源视角插值新视角，泛化与逐场景微调两种用法", "e": "", "m": "Walkthrough · IBRNet · IB1", "s": "输入：一个静态场景的已标定图像集合，目标相机的内外参，以及深度范围 [near, far]。", "n": "IB1"}, "walk-ibrnet-ib2": {"u": "works/walkthrough/ibrnet.html#walk-ibrnet-ib2", "t": "源视角选择：测试取最近 10 个，训练从 n·N 候选池里随机抽 8–12 个", "e": "", "m": "Walkthrough · IBRNet · IB2", "s": "输入：目标相机位姿、候选图像的位姿列表。", "n": "IB2"}, "walk-lvsm-lv2": {"u": "works/walkthrough/lvsm.html#walk-lvsm-lv2", "t": "逐像素 Plücker 射线 (o×d, d)，以及依赖目标位姿的坐标规范化（scene_scale_factor=1.35）", "e": "", "m": "Walkthrough · LVSM · LV2", "s": "输入：每个视角的内参 fxfycxcy [B,V,4] 与 c2w [B,V,4,4]（已规范化）。", "n": "LV2"}, "walk-quark-q1": {"u": "works/walkthrough/quark.html#walk-quark-q1", "t": "问题设定与输入：M=8 个最近视角，近/远平面由 SfM 点估计", "e": "", "m": "Walkthrough · Quark · Q1", "s": "输入：离目标视角最近的 M=8 张 RGB 图像，每张的内参 K_m 与外参 [R_m|t_m]，目标相机的内外参，以及目标视锥的近平面 η 与远平面 f。", "n": "Q1"}, "walk-tele360-tl1": {"u": "works/walkthrough/tele360.html#walk-tele360-tl1", "t": "问题设定与系统全景：4–6 台无标定相机、2K 输入、单卡实时重建，推流到多个终端", "e": "", "m": "Walkthrough · Tele360 · TL1", "s": "输入：每个时刻 N（4–6）路同步 RGB 帧，相机围绕人物 360° 摆放，内外参都未知。", "n": "TL1"}, "walk-tele360-tl2": {"u": "works/walkthrough/tele360.html#walk-tele360-tl2", "t": "采集、同步与抠像：4096×3000@30 Hz 相机转成同步 2K 帧，RVM 的前景 mask 决定哪些 patch 进入网络", "e": "", "m": "Walkthrough · Tele360 · TL2", "s": "输入：N 台相机的原始视频流，每台 4096×3000@30 Hz。", "n": "TL2"}}, "concept": {"id": "g-rig", "name_zh": "多相机阵列：标定、同步与卷帘快门", "name_en": "Multi-camera rigs: calibration, synchronization & rolling shutter", "tldr_zh": "多相机阵列需要让所有相机在三方面对齐：几何上（内外参）、颜色上（曝光、白平衡、响应曲线）、时间上（同一时刻曝光）。常用手段是用张正友平面标定求内参，用共视标定物或带阵列先验的 BA 求外参，用 genlock 或硬件触发做同步，同时注意卷帘快门逐行曝光带来的时间差。两篇重点论文都把这些当成前提，一旦不满足，就会出现硬边、模糊和闪烁。", "intuition_zh": "前面的几何默认所有相机在同一时刻、用准确的参数、以相同的颜色响应拍摄。真实阵列里，这三件事都可能出错。先看几何标定。张正友方法让相机拍摄一块已知尺寸的平面棋盘格：每个姿态下，棋盘平面到图像的映射是一个单应 H = K[r1 r2 t]；由于 r1、r2 互相正交且长度相等，每个 H 能给出关于 K 的两个约束。有 3 个以上姿态就能闭式解出 K，再通过最小化重投影误差（连同畸变参数）精化。阵列外参则让多台相机同时看到标定物，或者直接用 SfM/BA（DeepView 的 Spaces 阵列就是以名义布局为先验做 SfM 标定）。最好在一个全局 BA 中联合求解所有相机，避免两两串联时误差逐级累积。\n\n再看同步。在动态场景中，如果相机 A 比相机 B 晚 Δt 曝光，运动物体在两张图中的位置就不属于同一时刻，三角化和 IBR 混合都会出错。常见的同步方式有三种。硬件触发或 genlock：所有相机由同一个时钟信号触发曝光，可以达到亚毫秒级。时间码（timecode）：给每一帧打上来自同一时钟的时间戳，DyNeRF 的 GoPro 阵列就用 timecode 系统同步。软件同步：按网络时间戳，或者按音频、闪光等事件对齐帧，精度通常只到帧级，还带有抖动。Panoptic Studio 用两套硬件时钟，分别让 480 台 VGA 相机（25 fps）和 31 台 HD 相机（29.97 fps）在快门级同步，再把两套时钟产生的时间码录成一个立体声音频信号来对齐二者，精度达到亚毫秒级。\n\n然后是卷帘快门（rolling shutter）。多数 CMOS 相机是逐行依次曝光的，图像顶部和底部的曝光时刻相差一整个读出时间，从几毫秒到几十毫秒不等，取决于传感器和拍摄模式。GoPro 这类运动相机就是卷帘快门（DyNeRF 的阵列正是 GoPro）。所以即使两台相机的帧起始时刻完全同步，运动物体仍会被“斜切”，而且每台相机的行时间各不相同。全局快门（global shutter）相机没有这个问题，是高端采集阵列的首选；如果只能用卷帘快门相机，就要在标定时估计行读出时间（例如 Kalibr，或 Oth 等人 2013 年的方法），并在重建中对它建模。\n\n最后是颜色标定。IBR 直接混合来自不同相机的像素；如果各相机的曝光、白平衡、增益或响应曲线不一致，混合权重一变，画面上就会出现接缝和闪烁。通常的做法是锁定曝光和白平衡，用色卡为每台相机求一个颜色校正矩阵；也可以像 DeepView 那样，在后处理中校正曝光差异。", "analogy_zh": "多相机阵列像一个合唱团。几何标定是让每个人站到排练好的位置，颜色标定是让每个人唱同一个调，同步是让所有人跟着同一个指挥的节拍开口。卷帘快门则像每个人唱一句歌词都要花一点时间：就算大家同时开口，每个字唱出来的时刻仍然错开。只要有一项没对齐，观众听到的（也就是新视角合成的结果）就是重影和走音。", "equations": [{"tex": "H = [\\,\\mathbf{h}_1\\;\\mathbf{h}_2\\;\\mathbf{h}_3\\,] \\simeq K\\,[\\,\\mathbf{r}_1\\;\\mathbf{r}_2\\;t\\,],\\qquad \\mathbf{h}_1^{\\top} B\\, \\mathbf{h}_2 = 0,\\quad \\mathbf{h}_1^{\\top} B\\, \\mathbf{h}_1 = \\mathbf{h}_2^{\\top} B\\, \\mathbf{h}_2,\\quad B = K^{-\\top} K^{-1}", "explain_zh": "张正友平面标定。标定板位于世界系的 Z = 0 平面上，板上的点为 (X, Y, 0)。r_1、r_2 是旋转矩阵的前两列，t 是平移，因此从板到图像的映射是单应 H，H 与 K[r_1 r_2 t] 只差一个尺度。在相差尺度的意义下有 r_1 = K^{-1}h_1、r_2 = K^{-1}h_2，二者正交且模长相等，由此得到两条关于 B = K^{-ᵀ}K^{-1} 的线性约束。B 是 3×3 对称矩阵，6 个元素在相差一个尺度的意义下有 5 个自由度（对应 f_x、f_y、c_x、c_y 和 skew），所以至少需要 3 个板姿态才能闭式求解；如果假设 skew = 0，则至少需要 2 个。闭式解之后，再做包含畸变系数的非线性精化。"}, {"tex": "\\min_{K,\\,\\mathbf{k},\\,\\{R_i,t_i\\}} \\sum_{i}\\sum_{j} \\left\\| \\mathbf{x}_{ij} - \\pi\\big(K, \\mathbf{k}, R_i, t_i, P_j\\big) \\right\\|^2", "explain_zh": "标定的最终目标：最小化重投影误差。P_j 是标定板上已知的 3D 角点，x_ij 是在第 i 张图中检测到的角点（亚像素精度），k 是畸变系数（如 k_1, k_2, p_1, p_2, k_3），(R_i, t_i) 是第 i 个板姿态。收敛后的 RMS 重投影误差是衡量标定质量的主要指标（OpenCV 的 calibrateCamera 直接返回这个值），好的标定通常在亚像素量级。多相机标定时，把所有相机和所有板姿态放进同一个目标函数联合优化。"}, {"tex": "T_{c_2 \\leftarrow c_1} = T_{c_2 \\leftarrow b}\\; T_{c_1 \\leftarrow b}^{-1},\\qquad T = \\begin{bmatrix} R & t \\\\ \\mathbf{0}^{\\top} & 1 \\end{bmatrix}", "explain_zh": "阵列外参。T_{c←b} 是 4×4 刚体变换，把标定板 b 坐标系中的点变到相机 c 的坐标系，可由单应分解或 PnP 求得。两台相机同时看到同一块板时，它们之间的相对位姿就是上式的乘积。沿阵列逐个串联（1→2→3→…）会累积误差，所以这个结果通常只作为初值，最后再用覆盖所有相机的全局 BA 联合精化。"}, {"tex": "t_{\\text{row}}(v) = t_0 + v\\, t_{\\text{line}},\\qquad \\Delta u \\approx \\frac{f\\, v_{\\perp}\\, \\Delta t}{Z}", "explain_zh": "卷帘快门和同步误差的影响。第一式：t_0 是一帧开始曝光的时刻，v 是行号，t_line 是单行读出时间（整帧读出时间约为 H·t_line），所以同一帧中不同行对应不同时刻。第二式估计时间差 Δt（来自同步误差或行时间差）造成的像素错位：物体以垂直于视线的速度 v_⊥ 运动、距离为 Z、焦距为 f 像素时，错位约为 Δu ≈ f·v_⊥·Δt/Z。"}], "worked_example_zh": "(1) 同步误差：DyNeRF 的视频是 30 fps，帧间隔 33.3 ms。如果相机各自自由运行，即使按时间戳把每路视频对齐到最近的一帧，残余的相位差最坏也有半帧，即 16.7 ms。一只以 1 m/s 横向挥动的手，在 2 m 远、f = 1000 px 的相机中错位约 Δu ≈ 1000·1·0.0167/2 ≈ 8.3 px，手在 3D 中移动了 1.67 cm。对手掌内部的平滑表面，横向移动几乎不改变沿射线的深度；但在手的轮廓附近，宽约 8 px 的一条带子里，这台相机看到的是背景，其他相机看到的是手，深度相差远超 τ = 0.02 m，TSDF 在这里会得到错误的零交叉，融合结果在轮廓处出现重影。如果手是朝相机方向运动，1.67 cm 的位移就直接与 τ 相当。差一整帧时，错位变成 16.7 px、3.3 cm。用 genlock 把 Δt 压到 1 ms 以内后，同一只手的错位不到 0.5 px。\n(2) 卷帘快门：假设整帧读出时间为 20 ms（示意值），同一帧中顶行和底行的曝光时刻相差 20 ms。沿用上例的 2 m 距离和 f = 1000 px，一个纵贯整幅画面、以 1 m/s 横向运动的物体，顶部与底部之间会被“斜切”约 10 px；只占画面高度 1/5 的手，内部斜切约 2 px，但它相对另一台相机的整体错位，取决于它在两台相机中各自落在哪些行，最多可达 20 ms 对应的约 10 px。而且每台相机的扫描方向取决于它的安装朝向。\n(3) 张正友标定：用内角点 9×6、方格边长 25 mm 的棋盘，拍 15–20 张不同姿态的图像，OpenCV 的 calibrateCamera 会返回 RMS 重投影误差。如果它大于 1 px，通常说明角点检测、图像模糊或畸变模型有问题。接着让相邻相机同时看到棋盘，用第三个式子求相对位姿作为初值，最后做全局 BA。\n(4) 颜色：两台相机 A、B 曝光相差 1/3 档，B 的线性亮度是 A 的 2^{1/3} ≈ 1.26 倍。设 A 看到的亮度为 a，当 IBR 的混合权重从 (A, B) = (0.3, 0.7) 变到 (0.7, 0.3) 时，像素亮度从 0.3a + 0.7·1.26a ≈ 1.18a 变到 0.7a + 0.3·1.26a ≈ 1.08a，跳变约 9%。这就是 Quark 在 Sec. 4.1 和 4.3 中所说的“输入之间曝光差异大时，切换输入相机会引起明显闪烁”。", "pitfalls_zh": ["只看单台相机的重投影误差。每台相机内参标定的 RMS 都很小，不代表阵列外参就准确，还要检查跨相机的重投影误差和极线误差。Quark 指出标定误差会产生错误的硬边（Sec. 4.3），Ha 指出会导致前向投影错位和模糊（Sec. 4.6）。", "用帧号代替真实时间。软件时间戳和网络时间戳有抖动，自由运行的相机之间相位是随机的，动态区域的对应关系会随时间漂移。ENeRF-Outdoor 的同步不完美，Ha 只能把指标降到 480×270 计算（附录 A.6），这样做同时也会掩盖高频细节上的差异。", "忽略卷帘快门。静态标定时看不出问题，拍动态场景或手持相机时才暴露出来。两篇重点论文全文都没有提到卷帘快门；而消费级 CMOS 相机大多是卷帘快门，两篇都用来评测的 DyNeRF（N3DV）数据就是用 GoPro 拍的。用这类相机搭阵列、拍快速运动时需要格外注意。", "开着自动曝光或自动白平衡。每台相机各自调整，IBR 混合结果会随视角变化出现亮度跳变和闪烁（Quark Sec. 4.1）。Ha 的颜色差分掩码 M = min(|I_t − I_{t−1}|/0.7 + 0.6, 1)（Sec. 3.2）也会把曝光变化误判为运动，从而少保留历史深度。采集时应锁定曝光和白平衡，并做颜色标定。"], "in_quark": {"used": true, "where": "Sec. 3.4（在已标定的多视角图像上训练）、Sec. 4.1（切换输入相机加上曝光差异导致闪烁）、Sec. 4.3（曝光/焦距差异与标定误差导致边缘伪影）；数据集 Spaces（16 相机阵列）与 N3DV（timecode 同步的 GoPro 阵列）", "how_zh": "Quark 假设输入已经标定和同步，自身不做任何标定或同步处理。它在“已标定的多视角图像”上训练（Sec. 3.4），推理时把多路视频流逐帧当作静态多视角输入处理。训练数据之一 Spaces 来自一个 16 台相机的阵列，相邻相机相距约 10 cm；DeepView 的作者用 SfM 加阵列先验标定了它，并校正了曝光差异。动态评测用的 N3DV（即 DyNeRF 数据）来自用 timecode 同步的 GoPro 阵列。论文在 Sec. 4.1 承认，目标相机移动时输入相机集合会切换，输入之间曝光差异大时会引起明显闪烁。Sec. 4.3 进一步说明，blend weights 对曝光或焦距不同的输入很敏感，会产生边缘伪影和闪烁；标定有误差时，得到的是错误的硬边，而不是较温和的模糊。卷帘快门在全文中完全没有讨论。"}, "in_ha": {"used": true, "where": "Sec. 3（位姿固定、只标定一次）、Sec. 3.2（颜色差分掩码依赖相机固定不动）、Sec. 4.6 Limitations（需要同步良好且已标定的相机）、附录 A.6（ENeRF-Outdoor 的同步与颜色标定问题，导致在 480×270 下评测）", "how_zh": "Ha et al. 明确要求相机同步良好且已标定（Sec. 4.6），否则前向投影得到的 𝓘_k^t 彼此不对齐，融合结果会发糊。它的时间机制也建立在固定阵列之上：相机位姿不随时间变化（Sec. 3），才能逐像素比较 I_n^t 和 I_n^{t−1}，计算颜色差分掩码（Sec. 3.2）。附录 A.6 写到，ENeRF-Outdoor（18 台 1080p 相机）存在不完美的相机同步和颜色标定误差；为减弱它们对定量指标的影响，作者把渲染结果进一步降到 480×270 再计算指标。DyNeRF 则被描述为同步良好。即便如此，在 ENeRF-Outdoor 上，Ha 的 PSNR、SSIM 和 L1 仍然输给 ENeRF。卷帘快门和在线标定，论文都没有讨论。"}, "in_field_zh": "这是 telepresence 系统工程中最容易被低估的一环。Project Starline 这类通话舱、Panoptic Studio 这类采集穹顶，都依赖硬件同步和精确标定；人像的颜色一致性（尤其是肤色）对观感影响极大。系统需要定期或在线重新标定，因为温度和振动会让外参漂移，并用重投影残差做健康监控。免标定或在线标定的方法（Tele360 的可微 LM、LiveStre4m、AnySplat，见 a-geo-fm、a-telepresence-sys）正在放宽这个前提。同步误差还会和视频编码、网络传输中的时间戳误差叠加（v-codec），影响端到端延迟和多路视频流的对齐；很多时间一致性问题（v-temporal）的根源也是曝光漂移。", "resources": [{"title": "Zhang: A Flexible New Technique for Camera Calibration (MSR-TR-98-71; IEEE TPAMI 2000)", "url": "https://www.microsoft.com/en-us/research/wp-content/uploads/2016/02/tr98-71.pdf", "type": "paper", "note_zh": "张正友标定的原始论文：只需让相机在至少 2 个不同姿态下拍摄平面图案，先求闭式解，再做最大似然精化，并对径向畸变建模。"}, {"title": "OpenCV: Camera Calibration (Python tutorial)", "url": "https://docs.opencv.org/4.13.0/dc/dbb/tutorial_py_calibration.html", "type": "tutorial", "note_zh": "包含 findChessboardCorners、cornerSubPix、calibrateCamera、undistort 和重投影误差计算的完整示例；畸变系数的顺序为 (k1, k2, p1, p2, k3)。"}, {"title": "Kalibr (ETH Zurich ASL)", "url": "https://github.com/ethz-asl/kalibr", "type": "code", "note_zh": "支持视野不完全重叠的多相机内外参标定、相机与 IMU 的时空标定，以及卷帘快门相机的完整内参标定（包括快门参数）。"}, {"title": "Joo et al.: Panoptic Studio: A Massively Multiview System for Social Interaction Capture", "url": "https://arxiv.org/abs/1612.03153", "type": "paper", "note_zh": "一个装有 480 台 VGA 相机、31 台 HD 相机和 10 台 Kinect v2 的采集穹顶。论文详细介绍了基于硬件时钟、genlock 和时间码的同步方案（达到亚毫秒级），以及用投影仪投射纹理、对 521 台相机做 SfM 标定的方法，是大型阵列工程的范本。"}, {"title": "Oth, Furgale, Kneip, Siegwart: Rolling Shutter Camera Calibration (CVPR 2013)", "url": "https://www.cv-foundation.org/openaccess/content_cvpr_2013/papers/Oth_Rolling_Shutter_Camera_2013_CVPR_paper.pdf", "type": "paper", "note_zh": "把逐行曝光的时间偏移（line delay）与内参一起标定，是 Kalibr 卷帘快门标定功能的方法来源；读完能理解 t_row(v) = t_0 + v·t_line 这个模型怎样从数据中估计出来。"}], "self_check": [{"q_zh": "为什么在张正友标定中，每个棋盘姿态只提供两个关于内参的约束？至少需要几张图？", "a_zh": "每个单应 H 有 8 个自由度，其中 6 个被这个姿态的外参 (R, t) 占用，只剩 2 个用来约束内参，分别来自 r1 ⊥ r2 和 |r1| = |r2|。B 在相差一个尺度的意义下有 5 个自由度（含 skew），所以至少需要 3 个姿态；如果假设 skew = 0，至少需要 2 个。实践中通常拍 15–20 张，以获得稳健的精化结果。"}, {"q_zh": "在一个 30 fps 的阵列中，某台相机晚了一帧。一个以 0.5 m/s 横向移动、距离 1.5 m 的人，在 f = 1200 px 的图像中错位多少？这对 Ha 的 TSDF 意味着什么？", "a_zh": "Δt = 33.3 ms，人在 3D 中横向移动了 1.67 cm，图像中错位约 Δu ≈ 1200·0.5·0.0333/1.5 ≈ 13.3 px。对 TSDF 来说，影响集中在人体轮廓附近那条十几像素宽的带子：这台相机在那里看到背景而其他相机看到人，符号距离无法在截断带（τ = 2 cm）内达成一致，零交叉位置出错；同时它前向 warp 出来的颜色在目标图上也错开十几个像素，融合网络若给它权重，就会出现重影。"}, {"q_zh": "Quark 和 Ha 都会因为曝光差异而闪烁，但机理有什么不同？", "a_zh": "两者都用凸组合混合来自不同相机的真实像素，曝光不一致时，随视角或时间变化的权重都会造成亮度跳变：Quark 发生在输入相机集合切换时，Ha 发生在 K 集合切换或融合权重变化时。Ha 还多一个问题：它靠逐帧颜色差分判断哪里在运动，曝光变化会被误判为运动，从而削弱它的时间滤波。由于掩码下限 M ≥ 0.6，这种削弱有上限：静态区本来每帧最多也只保留 40% 的历史深度。"}], "prereqs": ["g-pinhole"]}, "module": "module-M2", "walk": ["walk-quark-q1", "walk-ha-h1", "walk-ha-h5", "walk-tele360-tl1", "walk-tele360-tl2", "walk-ibrnet-ib1", "walk-ibrnet-ib2", "walk-enerf-en1", "walk-enerf-en11", "walk-gpsgaussian-gp1", "walk-gpsgaussian-gp2", "walk-gpsgaussian-gp10", "walk-gpsgaussian-gp11", "walk-freesplat-fs2", "walk-depthsplat-ds11", "walk-lvsm-lv2"], "classics": ["classic-10", "classic-12", "classic-13", "classic-15", "classic-19", "classic-22", "classic-23", "classic-31", "classic-38", "classic-39", "classic-43", "classic-54", "classic-69", "classic-74", "classic-81", "classic-93", "classic-109", "classic-110", "classic-119", "classic-121", "classic-126", "classic-143"], "adv": ["adv-a-human-capture", "adv-a-telepresence-sys"], "prev": "concept-g-sfm", "next": "concept-d-stereo", "readMin": 9}</script>
<script>
(function () {
  "use strict";
  // ================= lib: DOM, text and math helpers shared by every page =================
  // A page script defines rich(text) (inline cross-links); paras() and eqList() call it.
  var DATA;
  try { DATA = JSON.parse(document.getElementById("data").textContent); } catch (e) { DATA = {}; }
  var meta = DATA.meta || {};

  // ---------- DOM helpers: all text goes through textContent; external links are https-only ----------
  function safeUrl(u) { if (typeof u !== "string") return null; var s = u.trim(); return /^https:\/\/[^\s"'<>]+$/i.test(s) ? s : null; }
  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (!Object.prototype.hasOwnProperty.call(attrs, k)) continue;
      var v = attrs[k];
      if (v === null || v === undefined || v === false) continue;
      if (k === "class") n.className = v;
      else if (k === "text") n.textContent = String(v);
      else if (k === "href") { var u = safeUrl(v); if (u) { n.setAttribute("href", u); n.setAttribute("target", "_blank"); n.setAttribute("rel", "noopener noreferrer"); } }
      else if (k.slice(0, 2) === "on" && typeof v === "function") n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, String(v));
    }
    (kids || []).forEach(function (c) { if (c === null || c === undefined || c === false) return; n.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return n;
  }
  var SVGNS = "http://www.w3.org/2000/svg";
  function sv(tag, attrs, kids) {
    var n = document.createElementNS(SVGNS, tag);
    if (attrs) for (var k in attrs) {
      if (!Object.prototype.hasOwnProperty.call(attrs, k)) continue;
      var v = attrs[k];
      if (v === null || v === undefined || v === false) continue;
      if (k === "text") n.textContent = String(v);
      else if (k.slice(0, 2) === "on" && typeof v === "function") n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, String(v));
    }
    (kids || []).forEach(function (c) { if (c) n.appendChild(c); });
    return n;
  }
  function arr(x) { return Array.isArray(x) ? x : []; }
  function str(x) { return typeof x === "string" ? x : (x === null || x === undefined ? "" : String(x)); }
  function paras(text) { return str(text).split(/\n\s*\n/).map(function (t) { return t.trim(); }).filter(Boolean).map(function (t) { return el("p", null, rich(t)); }); }
  function link(title, url) { return safeUrl(url) ? el("a", { href: url, text: title }) : el("span", { text: title }); }
  function ul(items, map) { return el("ul", { class: "plain" }, arr(items).map(function (x) { return el("li", null, [map ? map(x) : str(x)]); })); }
  function fmtCit(n) { n = Number(n); if (!(n >= 0)) return "—"; if (n >= 1000) return (n / 1000).toFixed(n >= 10000 ? 0 : 1) + "k"; return String(n); }

  // ---------- math (MathJax, typeset lazily) ----------
  var mathReady = false, mathQueue = [];
  function mathUsable() { return !!(window.MathJax && typeof window.MathJax.typesetPromise === "function"); }
  function flushMath() { mathReady = true; var q = mathQueue.slice(); mathQueue = []; q.forEach(typeset); }
  window.__atlasMathReady = flushMath;
  // MathJax may finish loading before this script runs (cached/async), so also poll for it.
  var mathPoll = setInterval(function () { if (mathUsable()) { clearInterval(mathPoll); flushMath(); } }, 200);
  setTimeout(function () { clearInterval(mathPoll); }, 30000);
  function typeset(node) {
    if (!node) return;
    if (!mathReady && mathUsable()) mathReady = true;
    if (!mathReady || !mathUsable()) { mathQueue.push(node); return; }
    try { window.MathJax.typesetPromise([node]).catch(function () { /* leave raw TeX visible */ }); } catch (e) { /* leave raw TeX visible */ }
  }
  function eqList(eqs) {
    eqs = arr(eqs).filter(function (q) { return q && str(q.tex).trim(); });
    if (!eqs.length) return null;
    return el("div", { class: "eqs" }, eqs.map(function (q) {
      return el("div", { class: "eq" }, [el("div", { class: "math-block", text: "\\[" + str(q.tex) + "\\]" }), q.explain_zh ? el("p", null, rich(q.explain_zh)) : null]);
    }));
  }
  document.addEventListener("toggle", function (e) { var t = e.target; if (t && t.tagName === "DETAILS" && t.open) typeset(t); }, true);

  // ================= frame (Tufte site): links, notes, hover previews, top bar, theme =================
  var SITE = DATA.site || {};
  var ROOT = str(SITE.root);
  var XREF = DATA.xref || {};
  function hasX(key) { return Object.prototype.hasOwnProperty.call(XREF, key); }
  // Custom page parts (search tools, diagrams, charts) register here; blocks.js calls them for {"b": "slot"} blocks.
  var SLOTS = {};

  // ---------- internal links: urls are relative to the site root; pages sit at different depths ----------
  var SAFE_PATH = /^[A-Za-z0-9][A-Za-z0-9._\/-]*(\?[A-Za-z0-9=&._-]+)?(#[A-Za-z0-9._-]+)?$/;
  function relHref(u) {
    u = str(u);
    if (/^#[A-Za-z0-9._-]+$/.test(u)) return u;
    if (!SAFE_PATH.test(u)) return null;
    var cut = u.indexOf("#"), path = cut < 0 ? u : u.slice(0, cut);
    if (path === SITE.path) return cut < 0 ? "#" : u.slice(cut);
    return ROOT + u;
  }
  function pageLink(u, text, cls) {
    var h = relHref(u);
    if (!h) return el("span", { class: cls || null, text: text });
    var a = el("a", { class: cls || null, text: text });
    a.setAttribute("href", h);
    return a;
  }
  // A link to a known entry (concept, topic, paper, step...). data-xref drives the hover preview.
  function xlink(key, text, cls) {
    if (!hasX(key)) return text ? document.createTextNode(text) : null;
    var x = XREF[key], a = pageLink(x.u, text || x.n || x.t, cls);
    a.setAttribute("data-xref", key);
    return a;
  }

  // Concept / topic ids mentioned in prose ("见 g-pinhole") become links labelled with the entry's short name.
  var ID_RE = /(a-[a-z0-9]+(?:-[a-z0-9]+)*|[fgdrilnv]-[a-z0-9]+)/g;
  var CJK = /[　-〿㐀-鿿＀-￯]/;
  function rich(text) {
    var s = str(text), out = [], last = 0, m;
    ID_RE.lastIndex = 0;
    while ((m = ID_RE.exec(s)) !== null) {
      var id = m[1], prev = m.index > 0 ? s.charAt(m.index - 1) : "", next = s.charAt(m.index + id.length);
      var key = hasX("concept-" + id) ? "concept-" + id : (hasX("adv-" + id) ? "adv-" + id : null);
      if (!key || /[A-Za-z0-9_\-]/.test(prev) || /[A-Za-z0-9_]/.test(next)) continue;
      // The prose spaces ids off from Chinese text; a Chinese label needs no such space.
      var before = s.slice(last, m.index);
      if (/ $/.test(before) && CJK.test(before.charAt(before.length - 2))) before = before.slice(0, -1);
      if (before) out.push(document.createTextNode(before));
      out.push(xlink(key, null, "xref"));
      last = m.index + id.length;
      if (s.charAt(last) === " " && CJK.test(s.charAt(last + 1))) last++;
    }
    if (last < s.length) out.push(document.createTextNode(s.slice(last)));
    return out;
  }
  function lines(text) { return str(text).split(/\n+/).map(function (t) { return t.trim(); }).filter(Boolean).map(function (t) { return el("p", null, rich(t)); }); }

  // ---------- side notes (numbered) and margin notes (unnumbered); on phones they fold behind a toggle ----------
  var noteSeq = 0;
  function sidenote(kids) {
    var id = "sn-" + (++noteSeq);
    return el("span", { class: "note-wrap" }, [
      el("label", { for: id, class: "margin-toggle sidenote-number", "aria-label": "旁注" }),
      el("input", { type: "checkbox", id: id, class: "margin-toggle" }),
      el("span", { class: "sidenote" }, kids)
    ]);
  }
  function marginnote(kids) {
    var id = "mn-" + (++noteSeq);
    return el("span", { class: "note-wrap" }, [
      el("label", { for: id, class: "margin-toggle", "aria-label": "边注", text: "⊕" }),
      el("input", { type: "checkbox", id: id, class: "margin-toggle" }),
      el("span", { class: "marginnote" }, kids)
    ]);
  }
  function noteLabel(text) { return el("span", { class: "note-label", text: text }); }

  // ---------- article scaffolding ----------
  var main = document.getElementById("main");
  var art = main.querySelector("article");
  function section(id, title, kids) {
    var s = el("section", { id: id }, [title ? el("h2", { text: title }) : null].concat(kids));
    art.appendChild(s);
    return s;
  }
  function articleHead(o) {
    var crumbs = el("nav", { class: "crumbs", "aria-label": "位置" });
    arr(SITE.crumbs).forEach(function (c, i) {
      if (i) crumbs.appendChild(el("span", { class: "sep", text: "›", "aria-hidden": "true" }));
      crumbs.appendChild(c[1] ? pageLink(c[1], c[0]) : el("span", { text: c[0] }));
    });
    art.appendChild(el("header", { class: "art-head" }, [
      crumbs,
      el("h1", { text: o.title }),
      o.subtitle ? el("p", { class: "subtitle", text: o.subtitle }) : null,
      o.meta ? el("p", { class: "meta" }, o.meta) : null
    ]));
    if (o.epigraph) art.appendChild(el("div", { class: "epigraph" }, [el("blockquote", null, [el("p", null, rich(o.epigraph))])]));
  }
  // Previous / next in the series, each with its hover preview.
  function seriesNav(prevKey, nextKey, indexUrl, indexLabel) {
    var nav = el("nav", { class: "series", "aria-label": "同系列" });
    nav.appendChild(el("div", { class: "prev" }, prevKey && hasX(prevKey) ? [el("small", { text: "上一篇" }), xlink(prevKey)] : []));
    nav.appendChild(el("div", { class: "up" }, indexUrl ? [pageLink(indexUrl, indexLabel)] : []));
    nav.appendChild(el("div", { class: "next" }, nextKey && hasX(nextKey) ? [el("small", { text: "下一篇" }), xlink(nextKey)] : []));
    art.appendChild(nav);
  }

  // ---------- hover preview for internal links: mouse (after 300 ms) or keyboard focus; never on touch ----------
  var tip = null, tipTimer = 0, tipFor = null;
  function hideTip() {
    clearTimeout(tipTimer);
    if (tip) tip.hidden = true;
    if (tipFor) { tipFor.removeAttribute("aria-describedby"); tipFor = null; }
  }
  function showTip(a) {
    var key = a.getAttribute("data-xref");
    if (!hasX(key)) return;
    var x = XREF[key];
    if (!tip) { tip = el("div", { class: "xtip", id: "xtip", role: "tooltip" }); document.body.appendChild(tip); }
    tip.textContent = "";
    if (x.m) tip.appendChild(el("div", { class: "xt-m", text: x.m }));
    tip.appendChild(el("div", { class: "xt-t", text: x.t }));
    if (x.e) tip.appendChild(el("div", { class: "xt-e", text: x.e }));
    if (x.s) tip.appendChild(el("p", { class: "xt-s", text: x.s }));
    tip.hidden = false;
    var r = a.getClientRects()[0] || a.getBoundingClientRect(), vw = document.documentElement.clientWidth;
    var w = tip.offsetWidth, h = tip.offsetHeight;
    var left = Math.max(8, Math.min(r.left, vw - w - 8));
    var top = r.bottom + 6;
    if (top + h > window.innerHeight - 8 && r.top - h - 6 > 8) top = r.top - h - 6;
    tip.style.left = Math.round(left + window.pageXOffset) + "px";
    tip.style.top = Math.round(top + window.pageYOffset) + "px";
    a.setAttribute("aria-describedby", "xtip");
    tipFor = a;
  }
  function xrefTarget(e) { return e.target && e.target.closest ? e.target.closest("a[data-xref]") : null; }
  document.addEventListener("pointerover", function (e) {
    var a = xrefTarget(e);
    if (!a || e.pointerType !== "mouse" || a === tipFor) return;
    clearTimeout(tipTimer);
    tipTimer = setTimeout(function () { showTip(a); }, 300);
  });
  document.addEventListener("pointerout", function (e) {
    var a = xrefTarget(e);
    if (!a || (e.relatedTarget && a.contains(e.relatedTarget))) return;
    hideTip();
  });
  document.addEventListener("focusin", function (e) {
    var a = xrefTarget(e);
    if (a && a.matches(":focus-visible")) showTip(a);
  });
  document.addEventListener("focusout", function (e) { if (xrefTarget(e)) hideTip(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") hideTip(); });
  window.addEventListener("scroll", function () { if (tipFor && !tipFor.matches(":focus-visible")) hideTip(); }, { passive: true });

  // ---------- top bar: four menus with dropdowns (hover or click on desktop, a folding list on phones) ----------
  var wide = window.matchMedia("(min-width: 761px)");
  function setOpen(li, open) {
    var btn = li.querySelector(".menu-btn");
    if (open) Array.prototype.forEach.call(li.parentNode.children, function (o) { if (o !== li) setOpen(o, false); });
    li.classList.toggle("open", open);
    btn.setAttribute("aria-expanded", open ? "true" : "false");
    if (!open) li._hover = false;
  }
  function buildTopbar() {
    var bar = document.getElementById("topbar");
    var menus = el("ul", { class: "menus", id: "menus" });
    arr(SITE.nav).forEach(function (m) {
      var id = "menu-" + m.key;
      var btn = el("button", { type: "button", class: "menu-btn", "aria-expanded": "false", "aria-controls": id, text: m.label });
      var list = el("ul", { class: "drop", id: id }, arr(m.items).map(function (it) {
        var a = pageLink(it[1], it[0]);
        if (it[1] === SITE.navItem) a.classList.add("cur");
        if (it[1] === SITE.path) a.setAttribute("aria-current", "page");
        return el("li", null, [a]);
      }));
      var li = el("li", { class: "menu" + (m.key === SITE.navCur ? " cur" : "") }, [btn, list]);
      btn.addEventListener("click", function () {
        // A click on a menu the mouse already opened keeps it open instead of closing it again.
        if (li._hover) { li._hover = false; return; }
        setOpen(li, !li.classList.contains("open"));
      });
      btn.addEventListener("keydown", function (e) {
        if (e.key === "ArrowDown") { e.preventDefault(); setOpen(li, true); var f = list.querySelector("a"); if (f) f.focus(); }
      });
      li.addEventListener("pointerenter", function (e) { if (e.pointerType === "mouse" && wide.matches) { setOpen(li, true); li._hover = true; } });
      li.addEventListener("pointerleave", function (e) { if (e.pointerType === "mouse" && wide.matches) setOpen(li, false); });
      li.addEventListener("focusout", function (e) { if (wide.matches && !li.contains(e.relatedTarget)) setOpen(li, false); });
      li.addEventListener("keydown", function (e) { if (e.key === "Escape" && li.classList.contains("open")) { setOpen(li, false); btn.focus(); } });
      menus.appendChild(li);
    });
    var burger = el("button", { type: "button", class: "burger", "aria-expanded": "false", "aria-controls": "menus", text: "Menu" });
    burger.addEventListener("click", function () {
      var open = !bar.classList.contains("nav-open");
      bar.classList.toggle("nav-open", open);
      burger.setAttribute("aria-expanded", open ? "true" : "false");
    });
    var themeBtn = el("button", { type: "button", class: "theme-btn" });
    function darkNow() {
      var t = document.documentElement.getAttribute("data-theme");
      return t ? t === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
    }
    function paintThemeBtn() {
      var dark = darkNow();
      themeBtn.textContent = dark ? "Light" : "Dark";
      themeBtn.setAttribute("aria-label", dark ? "切换到浅色" : "切换到深色");
    }
    themeBtn.addEventListener("click", function () {
      var next = darkNow() ? "light" : "dark";
      var system = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      // Choosing what the system already shows drops the override, so the page follows the system again.
      if (next === system) document.documentElement.removeAttribute("data-theme");
      else document.documentElement.setAttribute("data-theme", next);
      try { if (next === system) localStorage.removeItem("atlas-theme"); else localStorage.setItem("atlas-theme", next); } catch (e) { /* storage unavailable */ }
      paintThemeBtn();
    });
    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", paintThemeBtn);
    paintThemeBtn();
    bar.appendChild(el("div", { class: "bar-in" }, [pageLink("index.html", SITE.brand || "", "brand"), el("nav", { class: "site-nav", "aria-label": "站点导航" }, [menus]), themeBtn, burger]));
    document.addEventListener("click", function (e) {
      if (!bar.contains(e.target)) Array.prototype.forEach.call(menus.children, function (li) { setOpen(li, false); });
    });
  }

  function finishPage() {
    buildTopbar();
    var foot = document.getElementById("site-foot");
    if (foot) foot.appendChild(el("p", null, [pageLink("index.html", SITE.brand || ""), SITE.date ? " · 内容截至 " + SITE.date : ""]));
    typeset(main);
    // Deep links (#id): the page is rendered by script, so jump once it exists and again after fonts settle.
    var h = window.location.hash ? window.location.hash.slice(1) : "";
    if (h && /^[A-Za-z0-9._~-]+$/.test(h) && document.getElementById(h)) {
      var moved = false;
      ["wheel", "touchstart", "keydown", "mousedown"].forEach(function (ev) { window.addEventListener(ev, function () { moved = true; }, { once: true, passive: true }); });
      var settle = function () { var t = document.getElementById(h); if (t && !moved) t.scrollIntoView({ block: "start" }); };
      settle();
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { window.requestAnimationFrame(settle); });
      [400, 1200, 2500].forEach(function (ms) { setTimeout(settle, ms); });
    }
  }

  // ================= article: one Foundations concept =================
  (function () {
    var c = DATA.concept || {};
    if (!c.id) return;
    art.id = "concept-" + c.id;
    var mod = XREF[DATA.module] || {};

    var prereqs = arr(c.prereqs).map(function (p) { return xlink("concept-" + p, XREF["concept-" + p] ? XREF["concept-" + p].t : p); }).filter(Boolean);
    var metaLine = [];
    if (prereqs.length) metaLine.push(marginnote([noteLabel("阅读前需要")].concat(joinNodes(prereqs, "；"))));
    metaLine.push(xlink(DATA.module, mod.t), " · 约 " + (DATA.readMin || 1) + " 分钟");
    articleHead({ title: c.name_zh, subtitle: c.name_en, meta: metaLine, epigraph: c.tldr_zh });

    function joinNodes(nodes, sep) {
      var out = [];
      nodes.forEach(function (n, i) { if (i) out.push(sep); out.push(n); });
      return out;
    }

    // 直觉: the analogy sits in the margin beside the first paragraph.
    var intuition = paras(c.intuition_zh);
    if (str(c.analogy_zh).trim() && intuition.length) intuition[0].insertBefore(marginnote([noteLabel("类比")].concat(rich(c.analogy_zh))), intuition[0].firstChild);
    if (intuition.length) section("intuition", "直觉", intuition);

    var eqs = eqList(c.equations);
    if (eqs) section("equations", "公式", [eqs]);
    if (str(c.worked_example_zh).trim()) section("example", "例子", lines(c.worked_example_zh));
    if (arr(c.pitfalls_zh).length) section("pitfalls", "易错点", [el("ol", null, arr(c.pitfalls_zh).map(function (t) { return el("li", null, rich(t)); }))]);
    if (str(c.in_field_zh).trim()) section("in-field", "在 3D 临场系统中", paras(c.in_field_zh));

    // 案例: where each key paper uses the concept; the paper location is a side note, guide steps a margin note.
    var steps = arr(DATA.walk);
    var cases = [];
    [["quark", c.in_quark], ["ha", c.in_ha]].forEach(function (pair) {
      var anchor = pair[0], u = pair[1] || {};
      var head = el("h3", null, [anchorName(anchor),
        str(u.where).trim() ? sidenote([noteLabel("论文位置")].concat(rich(u.where))) : null,
        el("span", { class: "used", text: u.used ? "用到" : "未用" })]);
      cases.push(head);
      var body = paras(u.how_zh);
      var mine = steps.filter(function (k) { return k.indexOf("walk-" + anchor + "-") === 0 && hasX(k); });
      if (mine.length && body.length) {
        var links = [];
        mine.forEach(function (k, i) { if (i) links.push(el("br")); links.push(xlink(k, XREF[k].n + " " + XREF[k].t)); });
        body[0].insertBefore(marginnote([noteLabel("导读步骤")].concat(links)), body[0].firstChild);
      }
      cases = cases.concat(body);
    });
    section("cases", "案例：Quark 与 Ha 如何使用", cases);
    function anchorName(a) { return a === "quark" ? "Quark" : "Ha et al."; }

    // The other deep reads: their walkthrough steps that build on this concept, labelled with the paper.
    var more = steps.filter(function (k) { return !/^walk-(quark|ha)-/.test(k) && hasX(k); });
    if (more.length) {
      var byPaper = [], seen = {};
      more.forEach(function (k) {
        var paper = str(XREF[k].m).split(" · ")[1] || "";
        if (!seen[paper]) { seen[paper] = []; byPaper.push(paper); }
        seen[paper].push(k);
      });
      section("cases-more", "更多精读中的用法", [el("ul", { class: "refs wide-kind" }, byPaper.map(function (paper) {
        var links = [];
        seen[paper].forEach(function (k, i) { if (i) links.push(el("br")); links.push(xlink(k, XREF[k].n + " " + XREF[k].t)); });
        return el("li", null, [el("span", { class: "kind", text: paper }), el("div", null, links)]);
      }))]);
    }

    if (arr(c.self_check).length) {
      section("self-check", "自测", [el("ol", { class: "quiz" }, arr(c.self_check).map(function (q) {
        return el("li", null, [el("p", null, rich(q.q_zh)), el("details", null, [el("summary", { text: "答案" }), el("p", null, rich(q.a_zh))])]);
      }))]);
    }

    // 延伸阅读: resources with their notes, then topics and classic papers that build on this concept.
    var further = [];
    var ty = { book: "教材", course: "课程", paper: "论文", tutorial: "教程", code: "代码", video: "视频", blog: "文章" };
    if (arr(c.resources).length) {
      further.push(el("h3", { text: "学习资源" }));
      further.push(el("ul", { class: "refs" }, arr(c.resources).map(function (r) {
        return el("li", null, [el("span", { class: "kind", text: ty[r.type] || r.type || "" }),
          el("div", null, [link(r.title, r.url), str(r.note_zh).trim() ? el("div", { class: "gloss" }, rich(r.note_zh)) : null])]);
      })));
    }
    var adv = arr(DATA.adv).filter(hasX);
    if (adv.length) {
      further.push(el("h3", { text: "进阶专题" }));
      further.push(el("ul", { class: "refs" }, adv.map(function (k) {
        return el("li", null, [el("span", { class: "kind", text: "专题" }), el("div", null, [xlink(k, XREF[k].t), XREF[k].e ? el("div", { class: "en", text: XREF[k].e }) : null])]);
      })));
    }
    var cls = arr(DATA.classics).filter(hasX);
    if (cls.length) {
      further.push(el("h3", { text: "经典论文" }));
      further.push(el("ul", { class: "refs papers" }, cls.map(function (k) {
        return el("li", null, [el("span", { class: "yr", text: str(XREF[k].m).replace(/^Classics · /, "") }), xlink(k, XREF[k].t)]);
      })));
    }
    if (further.length) section("further", "延伸阅读", further);

    seriesNav(DATA.prev, DATA.next, "basics/foundations/index.html", "Foundations 目录");
  })();

  finishPage();
})();
</script>
</body>
