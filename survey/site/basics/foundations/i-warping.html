.sidenote, .marginnote {

rtualized Reality: Constructing Virtual Worlds from Real Scenes", "e": "", "m": "Classics · 1997", "s": "它是最早用环绕相机阵列拍摄真实动态事件、让观众在观看时自由选择视点，并把这件事做成系统、给出名字（Virtualized Reality）的工作之一。"}, "classic-11": {"u": "basics/classics/t-ibr-geometry.html#classic-11", "t": "Layered Depth Images", "e": "", "m": "Classics · 1998", "s": "这篇论文提出分层深度图像（LDI）：从单一参考相机出发，每条视线上存储多个像素（颜色 + 深度），被前景挡住的背景也因此被保留下来，新视角露出遮挡区域时不再出…"}, "classic-149": {"u": "basics/classics/t-generative-ff.html#classic-149", "t": "Difix3D+: Improving 3D Reconstructions with Single-Step Diffusion Models", "e": "", "m": "Classics · 2025", "s": "论文证明，单步扩散模型就能充当 NeRF/3DGS 渲染伪影的通用修复器。"}, "classic-22": {"u": "basics/classics/t-ibr-geometry.html#classic-22", "t": "High-Quality Video View Interpolation Using a Layered Representation", "e": "", "m": "Classics · 2004", "s": "这是用少量同步视频相机实现高质量动态场景自由视点回放的早期代表性系统，也是“固定稀疏相机阵列 + 逐视角深度 + 基于深度的 IBR”这条路线的原型；Ha e…"}, "classic-3": {"u": "basics/classics/t-ibr-geometry.html#classic-3", "t": "View Interpolation for Image Synthesis", "e": "", "m": "Classics · 1993", "s": "这是最早的 IBR 论文之一。"}, "classic-31": {"u": "basics/classics/t-fusion-capture.html#classic-31", "t": "Encumbrance-free telepresence system with real-time 3D capture and display using commodity depth cameras", "e": "", "m": "Classics · 2011", "s": "它是最早用多台消费级 Kinect 搭出完整“免穿戴”三维临场系统的工作之一：动态场景实时采集，配合头部跟踪的裸眼立体显示，用户不用戴任何设备。"}, "classic-4": {"u": "basics/classics/t-ibr-geometry.html#classic-4", "t": "Plenoptic Modeling: An Image-Based Rendering System", "e": "", "m": "Classics · 1995", "s": "这篇论文把 IBR 明确表述为“对全光函数的采样、重建与重采样”，并实现了一个从柱面全景图生成新视角的完整系统。"}, "classic-47": {"u": "basics/classics/t-deep-geometry.html#classic-47", "t": "FlowNet 2.0: Evolution of Optical Flow Estimation with Deep Networks", "e": "", "m": "Classics · 2017", "s": "它让学习式光流的精度追上了当时最好的方法（摘要称 on par with state-of-the-art），并确立了一种级联精化思路：把多个网络堆叠起来，每…"}, "classic-48": {"u": "basics/classics/t-deep-geometry.html#classic-48", "t": "Unsupervised Monocular Depth Estimation with Left-Right Consistency (Monodepth)", "e": "", "m": "Classics · 2017", "s": "“用视图合成做自监督”训练单目深度网络的思路，Garg et al.（ECCV 2016）等已有雏形；Monodepth 把它做成了成熟、有效的框架：不需要深…"}, "classic-55": {"u": "basics/classics/t-deep-geometry.html#classic-55", "t": "PWC-Net: CNNs for Optical Flow Using Pyramid, Warping, and Cost Volume", "e": "", "m": "Classics · 2018", "s": "它把传统光流的三条经典原则——金字塔（由粗到细）、warping、代价体——做进了一个紧凑的可学习网络。"}, "classic-58": {"u": "basics/classics/t-neural-rendering.html#classic-58", "t": "Deep Blending for Free-Viewpoint Image-Based Rendering", "e": "", "m": "Classics · 2018", "s": "IBR 中最依赖手工启发式的一步，是如何混合多张 warp 到目标视角的输入图。"}, "classic-78": {"u": "basics/classics/t-neural-rendering.html#classic-78", "t": "Neural Point-Based Graphics", "e": "", "m": "Classics · 2020", "s": "NPBG 提出了一个简单有效的神经渲染范式：点云，加上每个点一个可学习特征，再加一个屏幕空间 CNN 渲染器。"}, "classic-8": {"u": "basics/classics/t-ibr-geometry.html#classic-8", "t": "Modeling and Rendering Architecture from Photographs: A Hybrid Geometry- and Image-Based Approach", "e": "", "m": "Classics · 1996", "s": "这篇论文的 Façade 系统开创了“粗几何 + 真实照片”的混合路线。"}, "classic-80": {"u": "basics/classics/t-neural-rendering.html#classic-80", "t": "Free View Synthesis", "e": "", "m": "Classics · 2020", "s": "FVS 把 SfM 标定、MVS 几何代理、学习式特征重投影与融合组合在一起，面向 Tanks and Temples 这类视角自由分布的大尺度真实场景：在一…"}, "concept-d-sensors": {"u": "basics/foundations/d-sensors.html", "t": "深度传感器与噪声特性", "e": "Depth sensors & noise characteristics", "m": "Foundations · M3 深度估计与三维重建", "s": "主动深度相机（结构光、主动立体、ToF、LiDAR）自带光源，所以在无纹理处也能测出深度，但各有典型误差：三角测量类误差随距离平方增长，ToF 有多路径干扰和相位混叠，所有类型都会在物体边缘产生飞点，而且都怕阳光、深色或高光材质以及彼此之…", "n": "深度传感器与噪声特性"}, "concept-g-depth": {"u": "basics/foundations/g-depth.html", "t": "深度、视差与逆深度采样", "e": "Depth, disparity & inverse-depth sampling", "m": "Foundations · M2 相机与多视几何", "s": "双目中深度与视差成反比（Z = f·b/d），所以固定的像素匹配误差会变成随 Z² 增长的深度误差。", "n": "深度、视差与逆深度采样"}, "concept-g-pinhole": {"u": "basics/foundations/g-pinhole.html", "t": "针孔相机模型：内参、外参、投影与反投影", "e": "Pinhole camera: intrinsics, extrinsics, projection & unprojection", "m": "Foundations · M2 相机与多视几何", "s": "针孔模型先用外参 [R|t] 把世界点变到相机坐标系，再用内参 K 投到像素；反过来，只有像素时只能确定一条射线，像素加上深度才能唯一确定一个 3D 点。", "n": "针孔相机模型"}, "concept-i-blending": {"u": "basics/foundations/i-blending.html", "t": "视角相关纹理映射与混合权重（ULR）", "e": "View-dependent texture mapping & blending weights (ULR)", "m": "Foundations · M5 基于图像的渲染（IBR）", "s": "当多个输入相机都看到目标像素对应的表面点时，混合权重决定每个相机贡献多少。", "n": "视角相关纹理映射与混合权重（ULR）"}, "concept-i-layered": {"u": "basics/foundations/i-layered.html", "t": "分层表示：MPI、LDI 与分层深度图（LDM）", "e": "Layered representations: MPI, LDI & layered depth maps", "m": "Foundations · M5 基于图像的渲染（IBR）", "s": "分层表示把场景切成若干张带透明度的图层。", "n": "分层表示"}, "concept-i-psv": {"u": "basics/foundations/i-psv.html", "t": "平面扫描体与学习式视图合成", "e": "Plane-sweep volumes & learned view synthesis", "m": "Foundations · M5 基于图像的渲染（IBR）", "s": "平面扫描体（PSV）的做法是：把每张输入图按一组假设的深度平面重投影到目标相机（或参考相机），堆叠成“深度 × 高 × 宽 × 视角”的张量。", "n": "平面扫描体与学习式视图合成"}, "concept-i-warping": {"u": "basics/foundations/i-warping.html", "t": "基于深度的渲染：前向/后向 warping、空洞与飞点", "e": "Depth-image-based rendering: forward/backward warping, holes & flying pixels", "m": "Foundations · M5 基于图像的渲染（IBR）", "s": "有了逐像素深度，就能把一张图“搬”到新视角。", "n": "基于深度的渲染"}, "concept-r-raster": {"u": "basics/foundations/r-raster.html", "t": "光栅化、z-buffer 与点溅射（splatting）", "e": "Rasterization, z-buffer & point splatting", "m": "Foundations · M4 图形学与渲染基础", "s": "光栅化以图元为中心：把三角形或点投到屏幕上，再用 z-buffer 为每个像素保留最近的那个图元。", "n": "光栅化、z-buffer 与点溅射（splatting）"}, "concept-v-codec": {"u": "basics/foundations/v-codec.html", "t": "视频编码、传输与延迟预算", "e": "Video coding, transport & latency budgets", "m": "Foundations · M8 视频、时间一致性、评测与系统", "s": "远程临场要在约百毫秒内把多路彩色和深度视频送到对端并渲染出来。", "n": "视频编码、传输与延迟预算"}, "concept-v-perception": {"u": "basics/foundations/v-perception.html", "t": "立体视觉感知与 3D 显示", "e": "Stereo perception & 3D displays", "m": "Foundations · M8 视频、时间一致性、评测与系统", "s": "人靠双眼视差、辐辏、调节和运动视差感知深度。", "n": "立体视觉感知与 3D 显示"}, "module-M5": {"u": "basics/foundations/m5.html", "t": "M5 · 基于图像的渲染（IBR）", "e": "Image-based rendering", "m": "Foundations", "s": "理解“直接复用输入像素”的新视角合成思路：光场、混合权重、前向 warping 的洞与飞点、分层表示。"}, "walk-ha-h11": {"u": "works/walkthrough/ha.html#walk-ha-h11", "t": "混合输出：K 个逐像素权重、一个背景权重和一张背景图", "e": "", "m": "Walkthrough · Ha et al. · H11", "s": "输入：U-Net 的输出，即 K 个权重图 w_k、1 个背景权重 w_BG 和 3 通道背景图 𝓘_BG，按输出内容推算共 K+4 个通道，K=4 时为 8…", "n": "H11"}, "walk-ha-h3": {"u": "works/walkthrough/ha.html#walk-ha-h3", "t": "前向渲染：像素大小、各向同性、完全不透明的高斯，逐视角单独 splat，得到 𝓘_k、α_k、𝒟_k", "e": "", "m": "Walkthrough · Ha et al. · H3", "s": "输入：第 k 个选中视角的 RGB 图 I_k^t、深度 D_k^t（论文写的是 D_k^t，未写 Ḋ_k^t）及其位姿。", "n": "H3"}, "walk-ha-h9": {"u": "works/walkthrough/ha.html#walk-ha-h9", "t": "时间反馈：上一帧新视角深度作为额外的 TSDF 输入（ω_tmp，η = 15）", "e": "", "m": "Walkthrough · Ha et al. · H9", "s": "输入：上一帧的目标深度 𝒟^{t−1}、K 张差分掩码 M_k^t、上一帧的权重。", "n": "H9"}, "walk-quark-q10": {"u": "works/walkthrough/quark.html#walk-quark-q10", "t": "IBR 混合与 over 合成：全分辨率输入像素的凸组合", "e": "", "m": "Walkthrough · Quark · Q10", "s": "输入：全分辨率 LDM（d、σ、β），M 张原始全分辨率输入图像及其相机参数。", "n": "Q10"}, "walk-quark-q5": {"u": "works/walkthrough/quark.html#walk-quark-q5", "t": "Render：把当前 LDM 双线性 splat 到每个输入视角并 over 合成得到 Ĩ", "e": "", "m": "Walkthrough · Quark · Q5", "s": "输入：当前特征体 V^(n) [L,H,W,C]，各输入相机参数。", "n": "Q5"}}, "concept": {"id": "i-warping", "name_zh": "基于深度的渲染：前向/后向 warping、空洞与飞点", "name_en": "Depth-image-based rendering: forward/backward warping, holes & flying pixels", "tldr_zh": "有了逐像素深度，就能把一张图“搬”到新视角。前向 warping 把每个源像素推到它在目标图中的位置，会产生裂缝、去遮挡空洞、多对一冲突和飞点。后向 warping 从每个目标像素出发，回到源图里取值，不会产生裂缝，但必须事先知道目标视角的深度。", "intuition_zh": "基于深度图的渲染（DIBR）的核心是一条 3D warping 公式：给源像素 (u, v) 配上深度 z，反投影成 3D 点，变换到目标相机坐标系，再投影到目标图像上。McMillan & Bishop 1995、Mark et al. 1997（post-rendering 3D warping），以及 3D-TV 领域中 Fehn 2004 的 DIBR，都建立在这条公式上。最关键的规律是：视差与深度成反比。相机平移同样的距离，近处的物体在图像中移动得多，远处的移动得少。新视角中“前景盖住背景、背景从前景后面露出来”的现象，都源于此。\n\n前向 warping（也叫 splatting）遍历源像素，算出每个像素在目标图中的位置，再写进去。这样做会遇到四类问题：\n(a) 裂缝：目标位置通常不是整数；源像素网格变形后（例如放大或落在斜面上），不再能铺满目标网格，于是出现针孔状的洞。\n(b) 多对一：多个源像素落到同一个目标像素上，需要用 z-buffer 保留最近的那个。\n(c) 去遮挡（disocclusion）：有些背景在新视角中可见，在源视角中却被挡住，根本没有对应的源像素，于是形成成片的空洞，只能靠其他视角或补全算法来填。\n(d) 飞点（flying pixels）：立体匹配会把深度边缘抹平，ToF 传感器在物体边缘会得到前景与背景的混合像素。这些像素被反投影到前景与背景之间的“半空中”，warp 之后就成了悬浮的彩色斑点或条纹。\n治裂缝的办法是给每个点一个面积，即用圆盘或 EWA 高斯做 splat，世界空间尺寸与 z/f 成正比。\n\n后向 warping 反过来遍历目标像素：用目标深度把像素反投影成 3D 点，投影到源图，再做双线性采样。它不会产生裂缝，而且天然可微（例如 PyTorch 的 grid_sample）。问题在于，它需要的恰恰是我们不知道的量：目标视角的深度。常见解法有两种。第一种是枚举深度假设，对每个假设深度都做一次后向 warp，这就是平面扫描与 MPI/LDM（见 i-layered、i-psv），也是 Quark 的做法。第二种是先把深度前向 warp 或融合到目标视角，再用它后向取颜色。Ha et al. 用 TSDF 在目标视角融合出了一张深度图，但只把它当作融合网络的引导，颜色仍然来自前向 splat。\n\n多个视角同时 warp 时，还会出现 z-fighting。同一个表面被多个视角各自重建，每个视角的深度都带噪声。把它们全部放进同一个 z-buffer 后，每个像素由哪个视角胜出几乎是随机的，结果就是斑驳的纹理，边缘处还叠加了各视角的飞点。Ha et al. 的对策是：把每个像素变成一个 3D 高斯，它完全不透明、各向同性，在源图中的投影恰好覆盖 1 个像素；然后用 3DGS 光栅器对每个视角单独渲染，得到各自的图像、alpha 和深度，再交给网络融合，而不是把所有视角一次性渲染出来。", "analogy_zh": "前向 warping 像从侧面看一面贴满便利贴的墙，而且每张便利贴都按深度钉在离墙不同远的位置。换个角度后，便利贴之间会露出缝（裂缝）；原本被前排便利贴挡住的墙面露了出来，却是一片空白（去遮挡）；钉歪了、悬在半空的便利贴会飘在前景和背景之间（飞点）。后向 warping 则像站在新的位置上，对每条视线问一句“你打到哪儿了？”，再回到原照片里找那一点的颜色。前提是，你已经知道每条视线打出去有多远。", "equations": [{"tex": "\\tilde{\\mathbf{x}}_t \\sim \\mathbf{K}_t\\left(\\mathbf{R}\\, z_s\\, \\mathbf{K}_s^{-1}\\tilde{\\mathbf{x}}_s + \\mathbf{t}\\right)", "explain_zh": "这是前向 3D warping。x̃_s = (u_s, v_s, 1)ᵀ 是源像素的齐次坐标。z_s 是该像素的深度，指相机坐标系中的 z 分量，不是沿射线的欧氏距离。K_s⁻¹x̃_s 是 z = 1 处的射线方向，乘以 z_s 就得到源相机坐标系中的 3D 点。[R | t] 把源相机坐标变换到目标相机坐标，K_t 再把点投影到目标像平面。“∼”表示两边相差一个尺度因子：把结果向量除以它的第三个分量，就得到目标像素坐标；而第三个分量本身正是该点在目标视角中的深度 z_t，用于在 z-buffer 中判断遮挡。"}, {"tex": "\\Delta u = \\frac{f\\,b}{z},\\qquad w_{\\mathrm{hole}} \\approx f\\,b\\left(\\frac{1}{z_{\\mathrm{fg}}} - \\frac{1}{z_{\\mathrm{bg}}}\\right)", "explain_zh": "对于矫正后的双目或纯水平平移，3D warping 退化为一个水平位移 Δu（像素）。f 是焦距（像素），b 是基线（米），z 是深度（米）。去遮挡带的宽度 w_hole 近似等于前景与背景的视差之差：f·b 越大（相机移得越远）、前景越近、背景越远，露出来的空洞就越宽。"}, {"tex": "I_t(\\mathbf{x}_t) = I_s\\!\\left(\\pi_s\\!\\left(\\mathbf{R}^{\\top}\\big(z_t(\\mathbf{x}_t)\\,\\mathbf{K}_t^{-1}\\tilde{\\mathbf{x}}_t - \\mathbf{t}\\big)\\right)\\right)", "explain_zh": "这是后向 warping。对每个目标像素 x_t，先用目标深度 z_t(x_t) 反投影，得到目标坐标系中的 3D 点 z_t K_t⁻¹x̃_t。再用 [R | t] 的逆变换 Rᵀ(· − t) 把它变回源相机坐标。π_s(X) 表示先算 K_s X、再除以第三个分量，得到源像素坐标；I_s(·) 在该坐标处做双线性采样。每个目标像素恰好取一次值，所以不会有裂缝；但前提是 z_t 已知，也就是必须知道目标视角的深度。如果 z_t 取一组假设值（例如一组平面或 LDM 的各层），就得到平面扫描，或者 Quark 中的 P^T。"}, {"tex": "s_{\\mathrm{world}} \\approx \\frac{z_s}{f_s},\\qquad r_t \\approx \\frac{f_t\\, s_{\\mathrm{world}}}{z_t} = \\frac{f_t}{f_s}\\cdot\\frac{z_s}{z_t}", "explain_zh": "s_world 是深度 z_s 处一个源像素在世界空间中覆盖的边长，f_s 是源相机焦距（像素）。按 Ha et al. 的描述，高斯在源图中的投影要恰好覆盖 1 个像素，它的尺度就应在 s_world 这个量级；原文没有给出具体常数。r_t 是这个 splat 投到目标视角后的像素尺寸，f_t 是目标相机焦距，z_t 是该点在目标视角中的深度。目标相机更靠近物体（z_t < z_s）或焦距更长时，r_t > 1，只占 1 个像素的点 splat 就会留下裂缝。此外，表面倾斜时，实际的足迹还会沿倾斜方向拉长，而各向同性的高斯忽略了这一点。"}], "worked_example_zh": "设定：矫正双目，焦距 f = 1000 像素，相邻相机基线 b = 0.10 m。人（前景）在 z_fg = 1.0 m，背景墙在 z_bg = 4.0 m。\n\n（1）视差：前景为 1000 × 0.1 / 1.0 = 100 像素，背景为 1000 × 0.1 / 4.0 = 25 像素。\n\n（2）去遮挡：目标相机相对源相机右移 10 cm，场景在图像中整体左移，前景移动 100 像素，背景只移动 25 像素。人物右侧有一段背景在源图中被人挡住，宽 75 像素。于是在目标图中，人物右侧会出现一条约 w_hole = 1000 × 0.1 × (1 − 0.25) = 75 像素宽的空洞，只能靠其他视角或补洞算法来填。\n\n（3）飞点：设人物右边缘在源图第 1000 列。目标图中，人物右边缘左移 100 像素到第 900 列；边缘右侧紧邻的背景（源图第 1001 列起）只左移 25 像素，到第 976 列。所以空洞带大约是第 901–975 列。边缘上某个像素的深度被立体网络平滑成了 2.0 m，视差为 50 像素，warp 后落在第 950 列，正好在空洞带内部，成为悬在人与墙之间的彩色斑点。\n\n（4）z-fighting：两个视角都看到 z = 4 m 的墙，深度噪声的标准差为 2 cm。在同一个目标像素上，两者的深度差会随机变号。如果一次性放进 z-buffer，每个像素会随机取其中一个视角的颜色。若两台相机的曝光相差 5 个灰度级，画面上就会出现椒盐状的斑块，而且每帧都在变，形成闪烁。\n\n（5）裂缝：目标相机向人靠近，使深度从 1.0 m 变为 0.8 m，焦距不变。源像素的足迹为 s_world = 1.0/1000 = 1 mm，投到目标视角为 r_t = 1000 × 0.001 / 0.8 = 1.25 像素。如果每个点只写 1 个像素，按面积粗估，约有 1 − 1/1.25² ≈ 36% 的目标像素不会被覆盖。Ha et al. 的像素高斯有平滑的尾部，可以部分填补这类针孔（附录 A.3, Fig. 10），但填补不了（2）中那种大块的去遮挡。", "pitfalls_zh": ["把前向 warp 的结果直接当作图像使用。空洞处没有有效像素，必须同时输出有效性掩码或 alpha 掩码（即 Ha et al. 的 α_k）。否则黑色的空洞会参与后续混合，形成暗边。", "后向 warping 时用源视角的深度代替目标视角的深度。相机移动越大，错位就越大；在遮挡边界处，还会把前景的颜色拉到背景上。后向查找需要的是目标深度。", "把多个视角放进同一个 z-buffer 一次性渲染。有深度噪声时，会出现 z-fighting，多个视角的飞点也会叠加在一起（Ha et al. Fig. 4a；Table 3 中 No Blending 的 PSNR 为 24.64、STED 为 483.3）。逐视角渲染再用网络学习融合，结果更稳定。", "忽视深度边缘与 splat 尺寸。立体匹配或 ToF 得到的深度在物体轮廓处是混合值，这是飞点的主要来源，应当降低边缘处的置信度或直接剔除（Ha et al. 的 TSDF 权重用 7×7 邻域的局部深度方差来降低边缘置信度）。splat 固定为 1 像素时，在放大或掠射角下会留下裂缝；splat 太大又会糊掉细节。Ha et al. 的各向同性解析尺度没有考虑表面倾斜。"], "in_quark": {"used": true, "where": "Sec. 3.1 Eq. (1)（P^T，后向）、Sec. 3.2.2 Eq. (2) 与 Fig. 3(a)（Render to Input Views，双线性 splat，前向）", "how_zh": "Quark 两个方向的 warping 都用到了。\n\n（1）最终渲染时，Eq. (1) 中的 P^T_θ(I, d) 是后向 warping。LDM 位于目标视锥内，每层每个像素都已有深度 d，所以可以对每个目标像素、每一层，把对应的 3D 点投影到 8 张输入图上取值（原文未写明插值核，通常为双线性采样）。正是因为 LDM 提供了目标一侧的深度，才能使用不产生裂缝的后向查找；整个 Eq. (1) 渲染器（反投影、混合、over 合成）经 CUDA 优化后，1080p 下约 1.3 ms（Sec. 3.1）。去遮挡由多层结构和 blend weights 共同处理：在前景层上，看不到该点的相机得到较低的权重；在背景层上，则从能看到该点的相机取色。\n\n（2）迭代过程中的 Render to Input Views（Sec. 3.2.2, Eq. 2, Fig. 3a）是前向方向：把中间 LDM 各层的 density 和 appearance（直接由 c = sigmoid(V W_a) 解码，不用 blend weights）用双线性 splat 投影到每个输入视角，再做 over 合成，得到渲染图 Ĩ。论文指出，splat 可以避免昂贵的光线追踪或光栅化。Ĩ 与观测 I_k 之间的差异揭示了遮挡与可见性信息；消融实验中去掉 Ĩ 后，PSNR 从 30.41 降到 29.71，约 0.7 dB。\n\n不懂 warping，就读不懂 Eq. (1)、(2) 中 P（前向投影）与 P^T（它的伴随，即后向投影）的含义。"}, "in_ha": {"used": true, "where": "Sec. 3.1、Fig. 4、附录 A.3 与 Fig. 10、附录 A.2、Table 3 与 Table 4", "how_zh": "Ha et al. 流程的第一阶段就是 DIBR 前向 warping（Sec. 3.1）。取 K 个最近视角，把其中每个像素用 RAFT-Stereo 深度 D_k 和相机位姿反投影成一个 3D 高斯。这个高斯完全不透明、各向同性，尺度设为在源图中恰好覆盖 1 个像素，颜色等于该像素的值。随后用原版 3DGS 光栅器逐视角渲染到目标相机，得到 𝓘_k、α_k、𝒟_k。在 DyNeRF（1352×1014）上取 K = 4 时，这一步约需 10 ms（Table 4）。\n\n与传统点溅射（Aliev et al. 的 NPBG [1]）相比，高斯减少了像素间的空隙和锯齿（附录 A.3, Fig. 10）。但作者明确承认，去遮挡和深度误差仍然会造成空洞与飞点。\n\n关键设计在于：不像 GS-LRM [79] 或 GPS-Gaussian [82] 那样把所有视角的高斯一次性渲染。一次性渲染既消除不了飞点和空洞，还会因为 Z-fighting 让边缘变差（Fig. 4a；Table 3 中 No Blending 的 PSNR 为 24.64、STED 为 483.3）。作者选择对每个视角单独渲染，保留各自的空洞和深度，交给几何引导的融合网络去裁决。\n\n附录 A.3 还解释了为什么不用网络预测高斯尺度、把背景“撑大”来填洞：那样会降低 PSNR，所以空洞改由背景图 𝓘_BG 处理。附录 A.2 中，K 张颜色差分掩码同样是用 Gaussian splatting 前向投影到新视角，再逐通道取最大值。"}, "in_field_zh": "DIBR 是 3D-TV、自由视点视频和 MPEG 沉浸式视频（纹理加深度）的标准渲染方式。VR 头显中的异步时间扭曲和空间扭曲（ATW/ASW），以及临场系统中“用最新的头部位姿重投影上一帧”的延迟补偿，本质上也都是深度 warping，同样要处理去遮挡空洞（见 v-perception、v-codec）。RGB-D 传感器（尤其是 ToF）在物体轮廓处产生的混合像素，是临场画面中飞点的主要来源（见 d-sensors）。在发送端清理边缘深度，往往比在渲染端补救更省事。", "resources": [{"title": "Computer Vision: Algorithms and Applications, 2nd ed. (Szeliski), §14.1 View interpolation", "url": "https://szeliski.org/Book/", "type": "book", "note_zh": "教科书对“深度图 + 参考图像”视图插值的讲解，涵盖前向与后向映射、空洞处理，以及 14.1.1 节的视角相关纹理。"}, {"title": "Depth-image-based rendering (DIBR), compression, and transmission for a new approach on 3D-TV (Fehn, SPIE 2004)", "url": "https://doi.org/10.1117/12.524762", "type": "paper", "note_zh": "3D-TV 中 DIBR 的经典论文。发送端传输单目彩色视频加逐像素深度，接收端（例如机顶盒）实时合成若干个虚拟视图。文中介绍了 DIBR 算法、立体视图的生成，以及兼容现有系统的压缩与传输方案，是后续大量补洞与深度预处理工作的起点。"}, {"title": "Softmax Splatting for Video Frame Interpolation (Niklaus & Liu, CVPR 2020)", "url": "https://arxiv.org/abs/2003.05534", "type": "paper", "note_zh": "前向 warping 的可微实现。多个源像素落到同一个目标像素时，按一个可学习的重要性度量做 softmax 加权，相当于一个“软 z-buffer”。文中对前向与后向 warping 的对比讨论很适合入门。"}, {"title": "FWD: Real-time Novel View Synthesis with Forward Warping and Depth (Cao, Rockwell & Johnson, CVPR 2022)", "url": "https://arxiv.org/abs/2206.08355", "type": "paper", "note_zh": "基于深度前向 warping 加学习式融合的实时新视角合成方法。Ha et al. 把它重新训练后作为 baseline，它在 DyNeRF 上的 PSNR 为 16.97，适合与 Ha et al. 的像素高斯加几何引导方案直接对照。"}], "self_check": [{"q_zh": "焦距 f = 1000 像素，相机平移 5 cm，前景在 0.8 m、背景在 2.5 m，去遮挡带大约有多宽？如果边缘上有一个深度被平滑成 1.5 m 的像素，它会落在哪里？", "a_zh": "前景视差为 1000 × 0.05/0.8 = 62.5 像素，背景视差为 1000 × 0.05/2.5 = 20 像素，所以空洞宽约 42.5 像素。深度为 1.5 m 的边缘像素，视差为 33.3 像素，介于前景与背景之间，正好落进空洞带内部，成为一个悬在空中的飞点。"}, {"q_zh": "为什么 Quark 的最终渲染可以用不产生裂缝的后向 warping，而 Ha et al. 的第一阶段却用前向 splat？", "a_zh": "后向 warping 需要目标视角的深度。Quark 的 LDM 本身就定义在目标视锥内，每层每个像素都有深度，所以 P^T 可以对每个目标像素、每一层，直接回到输入图中采样。Ha et al. 手头只有输入视角的深度（来自 RAFT-Stereo），必须先把像素推到目标视角。它的 TSDF 深度虽然是目标视角的深度，但作者只把它用作融合网络的引导和 L_Depth 的目标，颜色仍然来自逐视角的前向 splat。"}, {"q_zh": "z-fighting 与飞点有什么区别？Ha et al. 为什么对每个视角单独渲染？", "a_zh": "飞点是单个视角内部的问题：边缘像素的深度估错了，像素被放到了前景与背景之间的半空中。z-fighting 是多个视角之间的问题：同一个表面被几个视角以略有差异的深度重建出来，一次性放进 z-buffer 时，每个像素由哪个视角胜出是随机的，于是形成斑驳的纹理，而且每帧都在变，造成闪烁。Ha et al. 把 K 个视角分别渲染成 𝓘_k、α_k、𝒟_k，避免了 z-fighting，并把“该相信哪个视角”交给以 TSDF 深度为引导的融合网络来判断。Table 3 中，一次性渲染（No Blending）的 PSNR 只有 24.64，STED 高达 483.3；完整模型分别为 31.17 和 68.76。"}], "prereqs": ["g-pinhole", "g-depth", "r-raster"]}, "module": "module-M5", "walk": ["walk-quark-q5", "walk-quark-q10", "walk-ha-h3", "walk-ha-h9", "walk-ha-h11"], "classics": ["classic-3", "classic-4", "classic-8", "classic-10", "classic-11", "classic-22", "classic-31", "classic-47", "classic-48", "classic-55", "classic-58", "classic-78", "classic-80", "classic-149"], "adv": ["adv-a-3dgs-ext", "adv-a-generalizable-ibr", "adv-a-telepresence-sys"], "prev": "concept-i-blending", "next": "concept-i-layered", "readMin": 9}</script>
<script>
(function () {
  "use strict";
  // ================= lib: DOM, text and math helpers shared by every page =================
  // A page script defines rich(text) (inline cross-links); paras() and eqList() call it.
  var DATA;
  try { DATA = JSON.parse(document.getElementById("data").textContent); } catch (e) { DATA = {}; }
  var meta = DATA.meta || {};

  // ---------- DOM helpers: all text goes through textContent; external links are https-only ----------
  function safeUrl(u) { if (typeof u !== "string") return null; var s = u.trim(); return /^https:\/\/[^\s"'<>]+$/i.test(s) ? s : null; }
  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (!Object.prototype.hasOwnProperty.call(attrs, k)) continue;
      var v = attrs[k];
      if (v === null || v === undefined || v === false) continue;
      if (k === "class") n.className = v;
      else if (k === "text") n.textContent = String(v);
      else if (k === "href") { var u = safeUrl(v); if (u) { n.setAttribute("href", u); n.setAttribute("target", "_blank"); n.setAttribute("rel", "noopener noreferrer"); } }
      else if (k.slice(0, 2) === "on" && typeof v === "function") n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, String(v));
    }
    (kids || []).forEach(function (c) { if (c === null || c === undefined || c === false) return; n.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return n;
  }
  var SVGNS = "http://www.w3.org/2000/svg";
  function sv(tag, attrs, kids) {
    var n = document.createElementNS(SVGNS, tag);
    if (attrs) for (var k in attrs) {
      if (!Object.prototype.hasOwnProperty.call(attrs, k)) continue;
      var v = attrs[k];
      if (v === null || v === undefined || v === false) continue;
      if (k === "text") n.textContent = String(v);

    }
    (kids || []).forEach(function (c) { if (c) n.appendChild(c); });
    return n;
  }
  function arr(x) { return Array.isArray(x) ? x : []; }
  function str(x) { return typeof x === "string" ? x : (x === null || x === undefined ? "" : String(x)); }
  function paras(text) { return str(text).split(/\n\s*\n/).map(function (t) { return t.trim(); }).filter(Boolean).map(function (t) { return el("p", null, rich(t)); }); }
  function link(title, url) { return safeUrl(url) ? el("a", { href: url, text: title }) : el("span", { text: title }); }
  function ul(items, map) { return el("ul", { class: "plain" }, arr(items).map(function (x) { return el("li", null, [map ? map(x) : str(x)]); })); }
  function fmtCit(n) { n = Number(n); if (!(n >= 0)) return "—"; if (n >= 1000) return (n / 1000).toFixed(n >= 10000 ? 0 : 1) + "k"; return String(n); }

  // ---------- math (MathJax, typeset lazily) ----------
  var mathReady = false, mathQueue = [];
  function mathUsable() { return !!(window.MathJax && typeof window.MathJax.typesetPromise === "function"); }
  function flushMath() { mathReady = true; var q = mathQueue.slice(); mathQueue = []; q.forEach(typeset); }
  window.__atlasMathReady = flushMath;
  // MathJax may finish loading before this script runs (cached/async), so also poll for it.
  var mathPoll = setInterval(function () { if (mathUsable()) { clearInterval(mathPoll); flushMath(); } }, 200);
  setTimeout(function () { clearInterval(mathPoll); }, 30000);
  function typeset(node) {
    if (!node) return;
    if (!mathReady && mathUsable()) mathReady = true;
    if (!mathReady || !mathUsable()) { mathQueue.push(node); return; }
    try { window.MathJax.typesetPromise([node]).catch(function () { /* leave raw TeX visible */ }); } catch (e) { /* leave raw TeX visible */ }
  }
  function eqList(eqs) {
    eqs = arr(eqs).filter(function (q) { return q && str(q.tex).trim(); });
    if (!eqs.length) return null;
    return el("div", { class: "eqs" }, eqs.map(function (q) {
      return el("div", { class: "eq" }, [el("div", { class: "math-block", text: "\\[" + str(q.tex) + "\\]" }), q.explain_zh ? el("p", null, rich(q.explain_zh)) : null]);
    }));
  }
  document.addEventListener("toggle", function (e) { var t = e.target; if (t && t.tagName === "DETAILS" && t.open) typeset(t); }, true);

  // ================= frame (Tufte site): links, notes, hover previews, top bar, theme =================
  var SITE = DATA.site || {};
  var ROOT = str(SITE.root);
  var XREF = DATA.xref || {};
  function hasX(key) { return Object.prototype.hasOwnProperty.call(XREF, key); }
  // Custom page parts (search tools, diagrams, charts) register here; blocks.js calls them for {"b": "slot"} blocks.
  var SLOTS = {};

  // ---------- internal links: urls are relative to the site root; pages sit at different depths ----------
  var SAFE_PATH = /^[A-Za-z0-9][A-Za-z0-9._\/-]*(\?[A-Za-z0-9=&._-]+)?(#[A-Za-z0-9._-]+)?$/;
  function relHref(u) {
    u = str(u);
    if (/^#[A-Za-z0-9._-]+$/.test(u)) return u;
    if (!SAFE_PATH.test(u)) return null;
    var cut = u.indexOf("#"), path = cut < 0 ? u : u.slice(0, cut);
    if (path === SITE.path) return cut < 0 ? "#" : u.slice(cut);
    return ROOT + u;
  }
  function pageLink(u, text, cls) {
    var h = relHref(u);
    if (!h) return el("span", { class: cls || null, text: text });
    var a = el("a", { class: cls || null, text: text });
    a.setAttribute("href", h);
    return a;
  }
  // A link to a known entry (concept, topic, paper, step...). data-xref drives the hover preview.
  function xlink(key, text, cls) {
    if (!hasX(key)) return text ? document.createTextNode(text) : null;
    var x = XREF[key], a = pageLink(x.u, text || x.n || x.t, cls);
    a.setAttribute("data-xref", key);
    return a;
  }

  // Concept / topic ids mentioned in prose ("见 g-pinhole") become links labelled with the entry's short name.
  var ID_RE = /(a-[a-z0-9]+(?:-[a-z0-9]+)*|[fgdrilnv]-[a-z0-9]+)/g;
  var CJK = /[　-〿㐀-鿿＀-￯]/;
  function rich(text) {
    var s = str(text), out = [], last = 0, m;
    ID_RE.lastIndex = 0;
    while ((m = ID_RE.exec(s)) !== null) {
      var id = m[1], prev = m.index > 0 ? s.charAt(m.index - 1) : "", next = s.charAt(m.index + id.length);
      var key = hasX("concept-" + id) ? "concept-" + id : (hasX("adv-" + id) ? "adv-" + id : null);
      if (!key || /[A-Za-z0-9_\-]/.test(prev) || /[A-Za-z0-9_]/.test(next)) continue;
      // The prose spaces ids off from Chinese text; a Chinese label needs no such space.
      var before = s.slice(last, m.index);
      if (/ $/.test(before) && CJK.test(before.charAt(before.length - 2))) before = before.slice(0, -1);
      if (before) out.push(document.createTextNode(before));
      out.push(xlink(key, null, "xref"));
      last = m.index + id.length;
      if (s.charAt(last) === " " && CJK.test(s.charAt(last + 1))) last++;
    }
    if (last < s.length) out.push(document.createTextNode(s.slice(last)));
    return out;
  }
  function lines(text) { return str(text).split(/\n+/).map(function (t) { return t.trim(); }).filter(Boolean).map(function (t) { return el("p", null, rich(t)); }); }

  // ---------- side notes (numbered) and margin notes (unnumbered); on phones they fold behind a toggle ----------
  var noteSeq = 0;
  function sidenote(kids) {
    var id = "sn-" + (++noteSeq);
    return el("span", { class: "note-wrap" }, [
      el("label", { for: id, class: "margin-toggle sidenote-number", "aria-label": "旁注" }),
      el("input", { type: "checkbox", id: id, class: "margin-toggle" }),
      el("span", { class: "sidenote" }, kids)
    ]);
  }
  function marginnote(kids) {
    var id = "mn-" + (++noteSeq);
    return el("span", { class: "note-wrap" }, [
      el("label", { for: id, class: "margin-toggle", "aria-label": "边注", text: "⊕" }),
      el("input", { type: "checkbox", id: id, class: "margin-toggle" }),
      el("span", { class: "marginnote" }, kids)
    ]);
  }
  function noteLabel(text) { return el("span", { class: "note-label", text: text }); }

  // ---------- article scaffolding ----------
  var main = document.getElementById("main");
  var art = main.querySelector("article");
  function section(id, title, kids) {
    var s = el("section", { id: id }, [title ? el("h2", { text: title }) : null].concat(kids));
    art.appendChild(s);
    return s;
  }
  function articleHead(o) {
    var crumbs = el("nav", { class: "crumbs", "aria-label": "位置" });
    arr(SITE.crumbs).forEach(function (c, i) {
      if (i) crumbs.appendChild(el("span", { class: "sep", text: "›", "aria-hidden": "true" }));
      crumbs.appendChild(c[1] ? pageLink(c[1], c[0]) : el("span", { text: c[0] }));
    });
    art.appendChild(el("header", { class: "art-head" }, [
      crumbs,
      el("h1", { text: o.title }),
      o.subtitle ? el("p", { class: "subtitle", text: o.subtitle }) : null,
      o.meta ? el("p", { class: "meta" }, o.meta) : null
    ]));
    if (o.epigraph) art.appendChild(el("div", { class: "epigraph" }, [el("blockquote", null, [el("p", null, rich(o.epigraph))])]));
  }
  // Previous / next in the series, each with its hover preview.
  function seriesNav(prevKey, nextKey, indexUrl, indexLabel) {
    var nav = el("nav", { class: "series", "aria-label": "同系列" });
    nav.appendChild(el("div", { class: "prev" }, prevKey && hasX(prevKey) ? [el("small", { text: "上一篇" }), xlink(prevKey)] : []));
    nav.appendChild(el("div", { class: "up" }, indexUrl ? [pageLink(indexUrl, indexLabel)] : []));
    nav.appendChild(el("div", { class: "next" }, nextKey && hasX(nextKey) ? [el("small", { text: "下一篇" }), xlink(nextKey)] : []));
    art.appendChild(nav);
  }

  // ---------- hover preview for internal links: mouse (after 300 ms) or keyboard focus; never on touch ----------
  var tip = null, tipTimer = 0, tipFor = null;
  function hideTip() {
    clearTimeout(tipTimer);

  }
  function showTip(a) {
    var key = a.getAttribute("data-xref");

    if (!tip) { tip = el("div", { class: "xtip", id: "xtip", role: "tooltip" }); document.body.appendChild(tip); }
    tip.textContent = "";
    if (x.m) tip.appendChild(el("div", { class: "xt-m", text: x.m }));
    tip.appendChild(el("div", { class: "xt-t", text: x.t }));
    if (x.e) tip.appendChild(el("div", { class: "xt-e", text: x.e }));
    if (x.s) tip.appendChild(el("p", { class: "xt-s", text: x.s }));

    var r = a.getClientRects()[0] || a.getBoundingClientRect(), vw = document.documentElement.clientWidth;

  document.addEventListener("focusout", function (e) { if (xrefTarget(e)) hideTip(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") hideTip(); });

  // ---------- top bar: four menus with dropdowns (hover or click on desktop, a folding list on phones) ----------
  var wide = window.matchMedia("(min-width: 761px)");
  function setOpen(li, open) {
    var btn = li.querySelector(".menu-btn");
    if (open) Array.prototype.forEach.call(li.parentNode.children, function (o) { if (o !== li) setOpen(o, false); });

  }
  function buildTopbar() {
    var bar = document.getElementById("topbar");
    var menus = el("ul", { class: "menus", id: "menus" });
    arr(SITE.nav).forEach(function (m) {
      var id = "menu-" + m.key;
      var btn = el("button", { type: "button", class: "menu-btn", "aria-expanded": "false", "aria-controls": id, text: m.label });
      var list = el("ul", { class: "drop", id: id }, arr(m.items).map(function (it) {
        var a = pageLink(it[1], it[0]);

        if (it[1] === SITE.path) a.setAttribute("aria-current", "page");

      }));
      var li = el("li", { class: "menu" + (m.key === SITE.navCur ? " cur" : "") }, [btn, list]);
      btn.addEventListener("click", function () {
        // A click on a menu the mouse already opened keeps it open instead of closing it again.
        if (li._hover) { li._hover = false; return; }
        setOpen(li, !li.classList.contains("open"));
      });
      btn.addEventListener("keydown", function (e) {
        if (e.key === "ArrowDown") { e.preventDefault(); setOpen(li, true); var f = list.querySelector("a"); if (f) f.focus(); }
      });
      li.addEventListener("pointerenter", function (e) { if (e.pointerType === "mouse" && wide.matches) { setOpen(li, true); li._hover = true; } });
      li.addEventListener("pointerleave", function (e) { if (e.pointerType === "mouse" && wide.matches) setOpen(li, false); });
      li.addEventListener("focusout", function (e) { if (wide.matches && !li.contains(e.relatedTarget)) setOpen(li, false); });
      li.addEventListener("keydown", function (e) { if (e.key === "Escape" && li.classList.contains("open")) { setOpen(li, false); btn.focus(); } });

    });
    var burger = el("button", { type: "button", class: "burger", "aria-expanded": "false", "aria-controls": "menus", text: "Menu" });
    burger.addEventListener("click", function () {
      var open = !bar.classList.contains("nav-open");

    });
    var themeBtn = el("button", { type: "button", class: "theme-btn" });

      return t ? t === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
    }
    function paintThemeBtn() {

    paintThemeBtn();
    bar.appendChild(el("div", { class: "bar-in" }, [pageLink("index.html", SITE.brand || "", "brand"), el("nav", { class: "site-nav", "aria-label": "站点导航" }, [menus]), themeBtn, burger]));
    document.addEventListener("click", function (e) {
      if (!bar.contains(e.target)) Array.prototype.forEach.call(menus.children, function (li) { setOpen(li, false); });
    });
  }

  function finishPage() {
    buildTopbar();
    var foot = document.getElementById("site-foot");
    if (foot) foot.appendChild(el("p", null, [pageLink("index.html", SITE.brand || ""), SITE.date ? " · 内容截至 " + SITE.date : ""]));
    typeset(main);
    // Deep links (#id): the page is rendered by script, so jump once it exists and again after fonts settle.
    var h = window.location.hash ? window.location.hash.slice(1) : "";
    if (h && /^[A-Za-z0-9._~-]+$/.test(h) && document.getElementById(h)) {
      var moved = false;
      ["wheel", "touchstart", "keydown", "mousedown"].forEach(function (ev) { window.addEventListener(ev, function () { moved = true; }, { once: true, passive: true }); });
      var settle = function () { var t = document.getElementById(h); if (t && !moved) t.scrollIntoView({ block: "start" }); };
      settle();
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { window.requestAnimationFrame(settle); });
      [400, 1200, 2500].forEach(function (ms) { setTimeout(settle, ms); });
    }
  }

  // ================= article: one Foundations concept =================
  (function () {
    var c = DATA.concept || {};
    if (!c.id) return;
    art.id = "concept-" + c.id;
    var mod = XREF[DATA.module] || {};

    var prereqs = arr(c.prereqs).map(function (p) { return xlink("concept-" + p, XREF["concept-" + p] ? XREF["concept-" + p].t : p); }).filter(Boolean);
    var metaLine = [];
    if (prereqs.length) metaLine.push(marginnote([noteLabel("阅读前需要")].concat(joinNodes(prereqs, "；"))));
    metaLine.push(xlink(DATA.module, mod.t), " · 约 " + (DATA.readMin || 1) + " 分钟");
    articleHead({ title: c.name_zh, subtitle: c.name_en, meta: metaLine, epigraph: c.tldr_zh });

    function joinNodes(nodes, sep) {
      var out = [];
      nodes.forEach(function (n, i) { if (i) out.push(sep); out.push(n); });
      return out;
    }

    // 直觉: the analogy sits in the margin beside the first paragraph.
    var intuition = paras(c.intuition_zh);
    if (str(c.analogy_zh).trim() && intuition.length) intuition[0].insertBefore(marginnote([noteLabel("类比")].concat(rich(c.analogy_zh))), intuition[0].firstChild);
    if (intuition.length) section("intuition", "直觉", intuition);

    var eqs = eqList(c.equations);
    if (eqs) section("equations", "公式", [eqs]);
    if (str(c.worked_example_zh).trim()) section("example", "例子", lines(c.worked_example_zh));
    if (arr(c.pitfalls_zh).length) section("pitfalls", "易错点", [el("ol", null, arr(c.pitfalls_zh).map(function (t) { return el("li", null, rich(t)); }))]);
    if (str(c.in_field_zh).trim()) section("in-field", "在 3D 临场系统中", paras(c.in_field_zh));

    // 案例: where each key paper uses the concept; the paper location is a side note, guide steps a margin note.
    var steps = arr(DATA.walk);
    var cases = [];
    [["quark", c.in_quark], ["ha", c.in_ha]].forEach(function (pair) {
      var anchor = pair[0], u = pair[1] || {};
      var head = el("h3", null, [anchorName(anchor),
        str(u.where).trim() ? sidenote([noteLabel("论文位置")].concat(rich(u.where))) : null,
        el("span", { class: "used", text: u.used ? "用到" : "未用" })]);
      cases.push(head);
      var body = paras(u.how_zh);
      var mine = steps.filter(function (k) { return k.indexOf("walk-" + anchor + "-") === 0 && hasX(k); });
      if (mine.length && body.length) {
        var links = [];
        mine.forEach(function (k, i) { if (i) links.push(el("br")); links.push(xlink(k, XREF[k].n + " " + XREF[k].t)); });
        body[0].insertBefore(marginnote([noteLabel("导读步骤")].concat(links)), body[0].firstChild);
      }
      cases = cases.concat(body);
    });
    section("cases", "案例：Quark 与 Ha 如何使用", cases);
    function anchorName(a) { return a === "quark" ? "Quark" : "Ha et al."; }

    if (arr(c.self_check).length) {
      section("self-check", "自测", [el("ol", { class: "quiz" }, arr(c.self_check).map(function (q) {
        return el("li", null, [el("p", null, rich(q.q_zh)), el("details", null, [el("summary", { text: "答案" }), el("p", null, rich(q.a_zh))])]);
      }))]);
    }

    // 延伸阅读: resources with their notes, then topics and classic papers that build on this concept.
    var further = [];
    var ty = { book: "教材", course: "课程", paper: "论文", tutorial: "教程", code: "代码", video: "视频", blog: "文章" };
    if (arr(c.resources).length) {
      further.push(el("h3", { text: "学习资源" }));
      further.push(el("ul", { class: "refs" }, arr(c.resources).map(function (r) {
        return el("li", null, [el("span", { class: "kind", text: ty[r.type] || r.type || "" }),
          el("div", null, [link(r.title, r.url), str(r.note_zh).trim() ? el("div", { class: "gloss" }, rich(r.note_zh)) : null])]);
      })));
    }
    var adv = arr(DATA.adv).filter(hasX);
    if (adv.length) {
      further.push(el("h3", { text: "进阶专题" }));
      further.push(el("ul", { class: "refs" }, adv.map(function (k) {
        return el("li", null, [el("span", { class: "kind", text: "专题" }), el("div", null, [xlink(k, XREF[k].t), XREF[k].e ? el("div", { class: "en", text: XREF[k].e }) : null])]);
      })));
    }
    var cls = arr(DATA.classics).filter(hasX);
    if (cls.length) {
      further.push(el("h3", { text: "经典论文" }));
      further.push(el("ul", { class: "refs papers" }, cls.map(function (k) {
        return el("li", null, [el("span", { class: "yr", text: str(XREF[k].m).replace(/^Classics · /, "") }), xlink(k, XREF[k].t)]);
      })));
    }
    if (further.length) section("further", "延伸阅读", further);

    seriesNav(DATA.prev, DATA.next, "basics/foundations/index.html", "Foundations 目录");
  })();

  finishPage();
})();
