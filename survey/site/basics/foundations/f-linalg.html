一个能用手机随手拍的自拍照片或视频，重建出可自由视点渲染的可变形 NeRF 的方法。"}, "concept-f-linalg": {"u": "basics/foundations/f-linalg.html", "t": "线性代数、齐次坐标与刚体变换", "e": "Linear algebra, homogeneous coordinates & rigid transforms", "m": "Foundations · M1 数学与图像基础", "s": "把一个像素从一台相机“搬”到另一台相机，本质上是一串矩阵乘法加一次透视除法：齐次坐标让平移和透视投影都能写成矩阵运算，SE(3) 位姿 [R|t] 描述相机的位置和朝向，SVD 和最小二乘则是从带噪数据里解出这些矩阵的通用工具。", "n": "线性代数、齐次坐标与刚体变换"}, "concept-f-optim": {"u": "basics/foundations/f-optim.html", "t": "优化、鲁棒估计与梯度下降", "e": "Optimization, robust estimation & gradient descent", "m": "Foundations · M1 数学与图像基础", "s": "相机标定、光束法平差、立体匹配、网络训练，乃至 Quark 的网络结构本身，做的都是同一件事：定义一个误差，然后沿着让误差变小的方向迭代。", "n": "优化、鲁棒估计与梯度下降"}, "concept-f-prob": {"u": "basics/foundations/f-prob.html", "t": "概率、加权平均与递归滤波", "e": "Probability, weighted averaging & recursive filtering", "m": "Foundations · M1 数学与图像基础", "s": "多视角、多帧得到的深度都带有噪声，要把它们合成一个更可靠的估计，最好的办法是按置信度（方差的倒数）加权平均；把同样的想法用在时间轴上，就得到指数滑动平均（EMA）和卡尔曼滤波。", "n": "概率、加权平均与递归滤波"}, "concept-g-depth": {"u": "basics/foundations/g-depth.html", "t": "深度、视差与逆深度采样", "e": "Depth, disparity & inverse-depth sampling", "m": "Foundations · M2 相机与多视几何", "s": "双目中深度与视差成反比（Z = f·b/d），所以固定的像素匹配误差会变成随 Z² 增长的深度误差。", "n": "深度、视差与逆深度采样"}, "module-M1": {"u": "basics/foundations/m1.html", "t": "M1 · 数学与图像基础", "e": "Math & imaging basics", "m": "Foundations", "s": "能读懂 3D 视觉论文里的矩阵、坐标变换、优化与概率滤波记号，理解图像的采样与插值。"}, "walk-depthsplat-ds8": {"u": "works/walkthrough/depthsplat.html#walk-depthsplat-ds8", "t": "高斯头：每像素 37 个数，包括不透明度、像素内偏移、scale、四元数和 2 阶 SH（直流项加上输入颜色）", "e": "", "m": "Walkthrough · DepthSplat · DS8", "s": "输入：全分辨率特征 [BV,64,256,256]（由第二个 DPT 头输出）、RGB [BV,3,256,256]、深度 [BV,1,256,256]、最大…", "n": "DS8"}, "walk-freesplat-fs9": {"u": "works/walkthrough/freesplat.html#walk-freesplat-fs9", "t": "高斯潜变量解码：Linear 64→36，输出不透明度、尺度、四元数和 2 阶 SH", "e": "", "m": "Walkthrough · FreeSplat · FS9", "s": "输入：融合后的全局三元组，特征 N_g×64、位置 N_g×3、加权平均后的深度 N_g 和外参 N_g×4×4。", "n": "FS9"}, "walk-gpsgaussian-gp4": {"u": "works/walkthrough/gpsgaussian.html#walk-gpsgaussian-gp4", "t": "双向 1D 相关体：1/8 分辨率上每个像素 128 个水平候选，建 4 级金字塔", "e": "", "m": "Walkthrough · GPS-Gaussian · GP4", "s": "输入：1/8 特征 F3（2B×96×128×128）。", "n": "GP4"}, "walk-gpsgaussian-gp7": {"u": "works/walkthrough/gpsgaussian.html#walk-gpsgaussian-gp7", "t": "高斯参数图：深度编码器加 U-Net 解码器，逐像素输出旋转（4）、尺度（3，≤0.01）、不透明度（1），颜色直接取源像素", "e": "", "m": "Walkthrough · GPS-Gaussian · GP7", "s": "输入：两视角源图 I（2B×3×1024×1024，[−1,1]）、逆深度 ρ（2B×1×1024×1024）、图像编码器的三级特征。", "n": "GP7"}, "walk-gpsgaussian-gp8": {"u": "works/walkthrough/gpsgaussian.html#walk-gpsgaussian-gp8", "t": "合并与渲染：两视角的高斯一次性送进原版 3DGS 光栅器，输出 2048×2048，新视角渲染 0.8 ms", "e": "", "m": "Walkthrough · GPS-Gaussian · GP8", "s": "输入：左右两视角的有效高斯（位置 N×3、颜色 N×3、四元数 N×4、尺度 N×3、不透明度 N×1，N ≤ 2×1024²，只取前景像素）和新视点相机（内…", "n": "GP8"}, "walk-lvsm-lv2": {"u": "works/walkthrough/lvsm.html#walk-lvsm-lv2", "t": "逐像素 Plücker 射线 (o×d, d)，以及依赖目标位姿的坐标规范化（scene_scale_factor=1.35）", "e": "", "m": "Walkthrough · LVSM · LV2", "s": "输入：每个视角的内参 fxfycxcy [B,V,4] 与 c2w [B,V,4,4]（已规范化）。", "n": "LV2"}, "walk-lvsm-lv4": {"u": "works/walkthrough/lvsm.html#walk-lvsm-lv4", "t": "Decoder-only：(N+1)·1024 个 token 做 24 层全自注意力，输入 token 无法跨目标视角复用", "e": "", "m": "Walkthrough · LVSM · LV4", "s": "输入：输入 token [B, N·1024, 768]、目标 token [B·V_t, 1024, 768]。", "n": "LV4"}, "walk-pixelsplat-ps10": {"u": "works/walkthrough/pixelsplat.html#walk-pixelsplat-ps10", "t": "高斯参数预测：均值、协方差（尺度+四元数）、球谐（配置 4 阶、实际渲染 3 阶）与像素内偏移", "e": "", "m": "Walkthrough · pixelSplat · PS10", "s": "输入：每像素 128 维特征、3 个采样深度与不透明度、相机内外参。", "n": "PS10"}, "walk-quark-q7": {"u": "works/walkthrough/quark.html#walk-quark-q7", "t": "Fuse：One-to-many attention 跨视角融合（含 W^K/W^V 折叠技巧）", "e": "", "m": "Walkthrough · Quark · Q7", "s": "输入：当前 V [L,H,W,C] 和 M 个 Δ_m [L,H,W,C]。", "n": "Q7"}, "walk-tele360-tl6": {"u": "works/walkthrough/tele360.html#walk-tele360-tl6", "t": "可微 LM 相机细化：每视角 2,048 个 anchor、半径 3 的局部匹配、展开 4 次，解 (H + λ·diag H)δ = −b，6 视角 <0.5 ms", "e": "", "m": "Walkthrough · Tele360 · TL6", "s": "输入：前馈预测的 N 个相机位姿与内参、每个视角的预测深度、跨视角像素对齐的特征图。", "n": "TL6"}, "walk-tele360-tl9": {"u": "works/walkthrough/tele360.html#walk-tele360-tl9", "t": "从冻结的 VGGT 蒸馏：对齐 patch–patch 相似度结构（Gram 损失，λ = 0.1），而不是逐维模仿特征", "e": "", "m": "Walkthrough · Tele360 · TL9", "s": "输入：同一组多视角图像分别送入学生（Tele360）与冻结的 VGGT 教师，各取出 patch 特征，逐行 L2 归一化成特征矩阵（每张图像单独计算）。", "n": "TL9"}}, "concept": {"id": "f-linalg", "name_zh": "线性代数、齐次坐标与刚体变换", "name_en": "Linear algebra, homogeneous coordinates & rigid transforms", "tldr_zh": "把一个像素从一台相机“搬”到另一台相机，本质上是一串矩阵乘法加一次透视除法：齐次坐标让平移和透视投影都能写成矩阵运算，SE(3) 位姿 [R|t] 描述相机的位置和朝向，SVD 和最小二乘则是从带噪数据里解出这些矩阵的通用工具。", "intuition_zh": "向量和矩阵是 3D 视觉的基本语言。三维点、射线方向、颜色都可以写成向量，矩阵表示线性映射。论文里最常见的三类矩阵是：旋转 R（3×3，正交且 det=+1，保持长度和夹角不变）；内参 K（3×3 上三角，把相机坐标系里的方向换算成像素坐标）；以及把旋转和平移拼在一起的 4×4 位姿矩阵 T。SVD 把任意矩阵分解成“旋转–缩放–旋转”三步（A=UΣVᵀ），能回答两个常见问题：齐次方程 Ax=0 在 ‖x‖=1 约束下的最小二乘解是什么（三角化、单应估计都要用），以及离一个带噪矩阵最近的旋转矩阵是什么。线性最小二乘 min‖Ax−b‖² 的解满足正规方程 AᵀAx=Aᵀb。\n\n齐次坐标就是在 3D 点 (X,Y,Z) 后面补一个 1，写成 (X,Y,Z,1)；2D 像素则写成 (u,v,1)。这样做有三个好处。第一，平移也变成了矩阵乘法，“先旋转再平移”可以合成一个 4×4 矩阵，多段变换直接连乘即可。第二，透视投影变成“先乘矩阵，再除以最后一个分量”：(x,y,w) 和 (λx,λy,λw) 表示同一个像素，除以 w 这一步叫透视除法，而 w 正是深度。第三，w=0 表示无穷远点，也就是一个纯方向。透视投影下像素位移与 1/Z 成正比，所以很多方法（包括 Quark）在逆深度 1/Z 上均匀放置采样层，远平面可以设得很远，而不会浪费层数。\n\n刚体运动由旋转和平移组成，全体刚体变换构成群 SE(3)。旋转有几种常用写法。旋转矩阵有 9 个数、6 个约束，适合直接计算。单位四元数 q=(w,x,y,z) 有 4 个数，没有万向锁，便于插值，COLMAP 的 images.txt 和 3DGS 里每个高斯的朝向都用它存储。轴角（旋转向量）只有 3 个数，方向是转轴、长度是转角，经 Rodrigues 公式变成矩阵，常用作优化变量。欧拉角直观，但有万向锁，应尽量避免。位姿有两个方向：world-to-camera（即外参 [R|t]，把世界点变到相机坐标，COLMAP/OpenCV 存的就是它）和 camera-to-world（它的逆，NeRF 类数据集里常叫 c2w 或 transform_matrix）。两者互逆，相机中心在世界坐标中为 C=−Rᵀt。\n\n最后是坐标轴约定。OpenCV/COLMAP 的相机坐标系是 x 向右、y 向下、z 向前（相机看向 +z）；OpenGL/Blender/原版 NeRF 则是 x 向右、y 向上、z 向后（相机看向 −z）。两者只差 y、z 两根轴的正负号，也就是右乘 diag(1,−1,−1)。约定弄错时程序不会报错，只会渲染出上下颠倒、朝向背后或深度符号相反的结果，这是复现论文时最常见的 bug。", "analogy_zh": "齐次坐标像是给数字附上“汇率”：(x, y, w) 读作“x/w, y/w”，就像同一笔钱可以用不同币种书写，除以汇率才得到真实数额；w=0 则代表“无穷远处的一个方向”。位姿矩阵像一本双向词典：world-to-camera 把“世界语”译成“相机语”，camera-to-world 反过来译。用反了方向，所有东西都会被搬到镜像的位置。", "equations": [{"tex": "\\begin{aligned}\\lambda\\,\\tilde{\\mathbf{u}}&=\\mathbf{K}\\,(\\mathbf{R}\\,\\mathbf{p}+\\mathbf{t}),\\qquad \\tilde{\\mathbf{u}}=(u,\\,v,\\,1)^{\\top},\\quad \\lambda=Z_c,\\quad \\mathbf{K}=\\begin{bmatrix}f_x&0&c_x\\\\0&f_y&c_y\\\\0&0&1\\end{bmatrix}\\\\ \\mathbf{p}&=\\mathbf{R}^{\\top}\\bigl(D(u,v)\\,\\mathbf{K}^{-1}\\tilde{\\mathbf{u}}-\\mathbf{t}\\bigr)\\end{aligned}", "explain_zh": "p 是世界坐标系中的 3D 点（单位：米）。R、t 是 world-to-camera 外参，R p + t = (X_c, Y_c, Z_c) 是该点的相机坐标。K 是内参，f_x、f_y 是以像素为单位的焦距，c_x、c_y 是主点。ũ=(u,v,1) 是齐次像素坐标。λ=Z_c 是沿光轴的 z-depth，“除以 λ”就是透视除法。第二行是反投影：K⁻¹ũ 是相机系中 z=1 的射线方向，乘以深度图的值 D(u,v) 得到相机系中的 3D 点，再用 Rᵀ(·−t) 变回世界系。Ha et al. 附录 A.1 中的 (x_k,y_k,z_k)=K_k(R_k p+t_k)、(u_k,v_k)=(x_k/z_k, y_k/z_k) 就是第一行；Sec. 3.1 把像素变成 3D 高斯中心，用的是第二行。"}, {"tex": "\\mathbf{T}_{cw}=\\begin{bmatrix}\\mathbf{R}&\\mathbf{t}\\\\\\mathbf{0}^{\\top}&1\\end{bmatrix},\\qquad \\mathbf{T}_{wc}=\\mathbf{T}_{cw}^{-1}=\\begin{bmatrix}\\mathbf{R}^{\\top}&-\\mathbf{R}^{\\top}\\mathbf{t}\\\\\\mathbf{0}^{\\top}&1\\end{bmatrix},\\qquad \\mathbf{T}^{\\mathrm{GL}}_{wc}=\\mathbf{T}^{\\mathrm{CV}}_{wc}\\,\\mathrm{diag}(1,-1,-1,1)", "explain_zh": "T_cw 是作用在齐次点 (X,Y,Z,1) 上的 4×4 world-to-camera 矩阵。R 正交，R⁻¹=Rᵀ，所以求逆不需要通用的矩阵求逆。T_wc 的平移列 −Rᵀt 就是相机中心 C 在世界系中的坐标，COLMAP 文档写作 −R^t·T。两台相机 a、b 之间的相对位姿为 T_ab=T_aw·T_wb：先把 b 系中的点变到世界系，再变到 a 系。最后一式把 OpenCV 约定的 camera-to-world 矩阵转成 OpenGL 约定。它只翻转相机自身的 y、z 轴，世界坐标不变；diag(1,−1,−1,1) 是自身的逆，所以反方向转换用同一个式子。"}, {"tex": "\\mathbf{R}=\\mathbf{I}+\\sin\\theta\\,[\\mathbf{k}]_{\\times}+(1-\\cos\\theta)\\,[\\mathbf{k}]_{\\times}^{2},\\qquad \\boldsymbol{\\omega}=\\theta\\,\\mathbf{k},\\qquad \\mathbf{q}=\\bigl(\\cos\\tfrac{\\theta}{2},\\ \\sin\\tfrac{\\theta}{2}\\,\\mathbf{k}\\bigr)", "explain_zh": "这是 Rodrigues 公式。k 是单位转轴，θ 是转角（弧度）。[k]_× 是 k 的叉乘矩阵，为反对称阵，满足 [k]_× v = k × v。旋转向量 ω=θk 只用 3 个数，是优化时最常用的最小参数化。单位四元数 q 的实部为 cos(θ/2)，虚部为 sin(θ/2)·k；q 和 −q 表示同一个旋转（称为“双覆盖”）。COLMAP 采用 Hamilton 约定，实部在前，顺序为 (QW, QX, QY, QZ)。"}, {"tex": "\\begin{aligned}&\\mathbf{A}=\\mathbf{U}\\boldsymbol{\\Sigma}\\mathbf{V}^{\\top},\\qquad \\arg\\min_{\\|\\mathbf{x}\\|=1}\\|\\mathbf{A}\\mathbf{x}\\|^{2}=\\mathbf{v}_{\\min}\\\\ &\\arg\\min_{\\mathbf{x}}\\|\\mathbf{A}\\mathbf{x}-\\mathbf{b}\\|^{2}:\\ \\ \\mathbf{A}^{\\top}\\mathbf{A}\\,\\mathbf{x}=\\mathbf{A}^{\\top}\\mathbf{b}\\\\ &\\mathrm{proj}_{SO(3)}(\\mathbf{M})=\\mathbf{U}\\,\\mathrm{diag}\\bigl(1,\\,1,\\,\\det(\\mathbf{U}\\mathbf{V}^{\\top})\\bigr)\\,\\mathbf{V}^{\\top},\\quad \\mathbf{M}=\\mathbf{U}\\boldsymbol{\\Sigma}\\mathbf{V}^{\\top}\\end{aligned}", "explain_zh": "U、V 是正交矩阵，Σ 是对角阵，对角元为非负奇异值。v_min 是最小奇异值对应的那一列 V，它就是齐次最小二乘的解，用于 DLT 三角化以及单应矩阵、基础矩阵的估计。第二行是普通线性最小二乘的正规方程；数值上更稳妥的做法是用 QR 分解，或直接用 SVD 求伪逆。第三行把任意 3×3 矩阵 M 投影到最近的旋转矩阵，M 可以是对几个旋转做平均的结果，也可以是 Kabsch/Umeyama 点集对齐中的协方差矩阵。其中的 det 项保证结果是旋转而不是反射。"}], "worked_example_zh": "设输出分辨率为 1920×1080，内参 f_x=f_y=1000 像素，c_x=960，c_y=540。\n\n① 投影。相机 1 放在世界原点，R=I，t=0。世界点 p=(0.2, −0.1, 2.0) m 的相机坐标仍是 (0.2, −0.1, 2.0)，于是 u=1000×0.2/2+960=1060，v=1000×(−0.1)/2+540=490，深度 λ=2.0 m。\n\n② 换一台相机。相机 2 的中心在 C=(0.3, 0, 0)，即向右 30 cm（Quark 主实验中输入相机间距最大约 30 cm，量级相同），朝向与相机 1 相同。world-to-camera 的平移为 t=−RC=(−0.3, 0, 0)，p 在相机 2 中的坐标为 (−0.1, −0.1, 2.0)，像素为 u=1000×(−0.1)/2+960=910，v=490。同一点在两幅图中横向相差 150 像素，这就是视差 f·b/Z=1000×0.3/2（见 g-depth）。\n\n③ 反投影验证。在相机 2 的 (910, 490) 处读到深度 2.0。K⁻¹(910, 490, 1)=(−0.05, −0.05, 1)，乘以 2 得 (−0.1, −0.1, 2)，再算 Rᵀ(x−t)=(−0.1+0.3, −0.1, 2)=(0.2, −0.1, 2.0)，正好回到原来的 p。Ha et al. 就是这样把每个像素变成 3D 高斯中心的。在 2 m 深处，一个像素对应约 Z/f=2 mm 的物体尺寸，“像素大小的高斯”就是这个量级（论文没有给出具体比例常数）。\n\n④ 用几何理解 Quark 的射线编码（示意）。以相机 1 为目标相机，LDM 的近、远平面取 η=1 m、f=10 m。相机 2 穿过 p 的射线为 C+s·(−0.1, −0.1, 2)，它与 z=1 平面交于 (0.25, −0.05, 1)，与 z=10 平面交于 (−0.2, −0.5, 10)。这两个交点在目标相机中的归一化图像坐标 (x/z, y/z) 分别是 (0.25, −0.05) 和 (−0.02, −0.05)。沿这条射线 x/z=0.3/z−0.05、y/z≡−0.05，所以“远减近”的差向量为 (0.3·(1/f−1/η), 0)=(−0.27, 0)，其长度恰好等于 基线×(1/η−1/f)=0.3×0.9=0.27（乘以 f 换成像素约 270 像素）。经 tanh 后约为 (−0.264, 0)，再做 8 个 octave 的正弦编码。如果某条输入射线恰好穿过目标相机中心，它在目标图像上的投影只是一个点，差向量为 0。论文只说在“投影空间”求差，没有给出归一化方式，这里用归一化坐标只是示意。\n\n⑤ 约定陷阱。p 在这台 OpenCV 约定相机的坐标系里 z=+2.0，位于相机前方。如果把同一个位姿矩阵直接交给按 OpenGL 约定工作的渲染器，又没有乘 diag(1,−1,−1,1)，渲染器会认为相机看向 −z，于是 z=+2.0 的点被判定在相机背后而被裁掉；如果只修正了 z 而忘了 y，画面则会上下颠倒。", "pitfalls_zh": ["位姿方向搞反：COLMAP images.txt 存的是 world-to-camera（Hamilton 四元数加平移），相机中心要用 −Rᵀt 计算；NeRF/nerfstudio 的 transform_matrix 则是 camera-to-world。两者混用时，相机会“飞”到场景的镜像位置，而且不会报错。", "坐标轴与像素中心约定：OpenCV（x 右、y 下、z 前）和 OpenGL（x 右、y 上、z 后）相差 diag(1,−1,−1)。不同代码库对“整数像素坐标指像素中心还是像素角点”的约定也不一样，nerfstudio 的 Data conventions 文档专门说明了这一点，二者相差 0.5 像素。IBR 直接混合真实像素，半像素的错位会表现为重影或发虚。", "把 z-depth 与射线距离（range）混淆：Ha et al. 附录 A.1 的 s_k=z_k−D_k 要求 D_k 是沿光轴的 z-depth。如果传入的是沿射线的欧氏距离，在偏离光轴 30° 处 range=z/cos30°≈1.155z，2 m 深处相差约 31 cm，比截断阈值 τ=0.02 m 大 15 倍以上，整个 TSDF 都会错位。", "直接对旋转矩阵的元素做平均、插值或梯度更新，结果就不再正交。正确的做法是用四元数 slerp、在切空间更新 R←exp([δω]_×)R，或者用 SVD 投影回 SO(3)。对四元数求平均之前要先统一符号，因为 q 与 −q 等价。", "尺度问题：COLMAP 的重建只确定到一个相似变换，尺度是任意的。Quark 的近/远平面由 SfM 点估计，与位姿处在同一（任意）尺度下，所以对尺度不敏感；Ha et al. 的 τ=0.02 m 和置信常数 0.001 却都是公制量。需要用已知基线或标定板把重建缩放到米，这个相似变换可以用基于 SVD 的 Umeyama 方法求出。"], "in_quark": {"used": true, "where": "Sec. 3.1 Eq.(1)（P^T_θ）；Sec. 3.2.1（射线方向编码）；Sec. 3.2.2 Eq.(2)（P_θ）；Sec. 3.2.3 Eq.(3)–(4)（逆深度层参数化）", "how_zh": "Quark 的每一步都在目标视锥和 M=8 个输入相机之间搬运数据，θ 表示全部相机的内外参。(1) LDM 定义在目标相机的视锥中。第 ℓ 层上的某个像素，对应目标射线上深度为 d_ℓ 的一个 3D 点：先用目标相机做反投影得到这个点，再用输入相机的 K[R|t] 投影并做透视除法，得到它在输入图上的采样位置。Eq.(1) 中的 P^T_θ(I, d) 就是按各层深度，把全分辨率输入图像“拉回”到 LDM 各层；Eq.(2) 中的 P_θ 方向相反，把中间 LDM 双线性 splat 到每个输入视角（Sec. 3.2.2）。论文特意把前者写成“转置”（adjoint），因为重采样对像素值是线性的，可以写成一个巨大的稀疏矩阵：splat 是 scatter，一个样本按 4 个双线性权重散布出去，对应 P；按坐标取样是 gather，用同样的 4 个权重把像素收回来，对应 Pᵀ。(2) Sec. 3.2.1 的射线方向编码 γ：先求每条输入射线与 LDM 视锥近、远平面的交点，在投影空间里取两个交点的二维差向量，经 tanh 后做 8 个 octave 的正弦编码，再线性投影到 C=32 个通道。可以这样理解这个差向量：它是输入射线投影到目标图像后，落在近平面和远平面之间的那一段（即极线上的一段）。输入射线与某条目标射线重合时，这一段退化为一个点，编码为 0；输入相机相对目标相机的横向偏移越大，这一段越长（见例④）。论文说这种编码能让网络偏向离目标近的射线，但消融中收益很小（30.41 对 30.32 dB）。(3) Eq.(3)–(4) 让第 ℓ 层的逆深度只在 [1/f, 1/η] 内第 ℓ 个等宽视差带中移动，依据是透视投影下像素位移与 1/Z 成正比（详见 g-depth）。不熟悉这些内容，就看不懂 P^T 为什么叫“转置”、射线编码为什么要在投影空间里算，以及它为什么在射线重合时取 0。"}, "in_ha": {"used": true, "where": "Sec. 3 开头（位姿由 COLMAP 一次求得）；Sec. 3.1（像素反投影为 3D 高斯）；附录 A.1（正文内联的投影式 (x_k,y_k,z_k)=K_k(R_k p+t_k) 与 Eq.9 的 s_k）；附录 A.3；附录 A.4（相机特征）；附录 A.7（使用数据集提供的相机参数）", "how_zh": "(1) 附录 A.1 把 TSDF 射线上的世界点 p 投影到第 k 个输入相机：(x_k,y_k,z_k)=K_k(R_k p+t_k)，经透视除法得到 (u_k,v_k)=(x_k/z_k, y_k/z_k)，再计算 s_k=z_k−D_k[u_k,v_k]（Eq.9；投影式本身没有编号）。这里 R_k、t_k 是 world-to-camera 外参，z_k 是沿光轴的 z-depth，所以深度图 D_k 必须采用同样的定义。s_k 的正负号写法与 Starline 原文相反，复现时要注意，见 f-prob。(2) Sec. 3.1 用深度和位姿，把 K 个最近视角的每个像素反投影成 3D 点，作为各向同性、完全不透明的高斯中心。高斯的尺度按“投影回源图恰好覆盖 1 个像素”解析设定，量级约为 z/f。各向同性高斯的旋转取任何值都等价，这也是附录 A.3 能把旋转“解析给定”的原因之一。随后用原版 3DGS rasterizer 按目标相机的 K[R|t] 把这些高斯投影、渲染出来。(3) 附录 A.4 中融合网络的 4 组相机特征都是向量运算：输入射线方向与 TSDF 深度图法线的点积；输入射线方向与目标视线方向的点积；输入相机与目标相机中心之间的距离 ‖C_k−C_tgt‖（C=−Rᵀt）；输入与目标主光轴方向的点积。(4) 正文说位姿由 COLMAP 一次性求得，附录 A.7 又说使用数据集提供的参数。COLMAP 只能恢复到任意尺度，而 TSDF 截断 τ=0.02 m 是公制量，所以位姿与深度必须处于同一个公制尺度下。"}, "in_field_zh": "远程临场的每个环节都离不开它：多相机阵列的外参标定与 BA；头显或眼动追踪给出的观看者 6DoF 位姿（SE(3)）；为左右眼分别构造投影矩阵；把远端人物按真实尺度放进本地显示坐标系（Starline 式 3D 显示或 VR 头显都需要这一步）；在图形 API/渲染引擎的约定与视觉算法（OpenCV/COLMAP）的约定之间转换坐标；以及 3DGS 中用四元数和尺度构造每个高斯的协方差 Σ=R S Sᵀ Rᵀ。", "resources": [{"title": "Computer Vision II: Multiple View Geometry (TUM, Daniel Cremers) — Chapter 1 Mathematical Background: Linear Algebra; Chapter 2 Representing a Moving Scene", "url": "https://cvg.cit.tum.de/teaching/online/mvg", "type": "course", "note_zh": "提供免费幻灯片（2019 版）和 2013/14 学年课程的 YouTube 录像。第 1 章复习线性代数和 SVD；第 2 章用 SO(3)/SE(3) 和指数坐标讲刚体运动，与本概念正好对应；第 7 章讲光束法平差与非线性优化，可接着用于 f-optim。"}, {"title": "Szeliski, Computer Vision: Algorithms and Applications (2nd ed.) — §2.1 Geometric primitives and transformations (incl. §2.1.3 3D rotations); Appendix A.1–A.2", "url": "https://szeliski.org/Book/", "type": "book", "note_zh": "免费 PDF（在官网填表下载，仅限个人使用）。§2.1 讲齐次坐标、2D/3D 变换和旋转的各种表示；附录 A.1–A.2 讲矩阵分解（含 SVD）和线性最小二乘。"}, {"title": "A micro Lie theory for state estimation in robotics (Solà, Deray, Atchuthan)", "url": "https://arxiv.org/abs/1812.01537", "type": "paper", "note_zh": "关于 SO(3)/SE(3) 的精简教程，讲指数/对数映射，以及如何在切空间做扰动、求雅可比。以后读位姿优化和在线标定的论文会用到。"}, {"title": "COLMAP documentation — Output Format (pose convention in images.txt)", "url": "https://colmap.github.io/format.html", "type": "code", "note_zh": "文档明确写出：位姿是 world-to-camera，四元数采用 Hamilton 约定 (QW,QX,QY,QZ)，相机中心为 −Rᵀt，相机系为 x 右、y 下、z 前。建议与 nerfstudio 的 Data conventions 页（https://docs.nerf.studio/quickstart/data_conventions.html，采用 OpenGL 约定，并说明了像素中心约定）对照阅读。"}], "self_check": [{"q_zh": "COLMAP 给出某台相机的 R=I、t=(−0.3, 0, 0)，内参 f=1000、c=(960, 540)。这台相机的中心在世界系的什么位置？世界点 (0.2, −0.1, 2) 在它的图像上落在哪个像素？", "a_zh": "相机中心 C=−Rᵀt=(0.3, 0, 0)。该点的相机坐标为 R p + t=(−0.1, −0.1, 2)，像素为 u=1000×(−0.1)/2+960=910，v=1000×(−0.1)/2+540=490。"}, {"q_zh": "Quark 为什么把“把输入图像反投影到 LDM 层”的算子记作 P^T（转置）？", "a_zh": "投影/重采样对像素值是线性运算，可以写成一个稀疏矩阵 P，每个元素是一个双线性权重。把 LDM 层 splat（scatter）到输入视角对应 P；按层深度从输入图像按坐标取样（gather）回到各层，使用同一组权重，对应 Pᵀ。两者互为伴随算子。"}, {"q_zh": "把一个 OpenGL 约定的 c2w 矩阵直接当作 OpenCV 约定使用，会看到什么现象？怎样修正？", "a_zh": "程序会以为相机看向自身的 +z、y 轴朝下，而实际上相机看向 −z、y 轴朝上。结果是场景点被判定在相机背后而被裁掉，或者图像上下颠倒。修正方法是 c2w_cv=c2w_gl·diag(1,−1,−1,1)，反方向转换用同一个矩阵。"}], "prereqs": []}, "module": "module-M1", "walk": ["walk-quark-q7", "walk-tele360-tl6", "walk-tele360-tl9", "walk-pixelsplat-ps10", "walk-gpsgaussian-gp4", "walk-gpsgaussian-gp7", "walk-gpsgaussian-gp8", "walk-freesplat-fs9", "walk-depthsplat-ds8", "walk-lvsm-lv2", "walk-lvsm-lv4"], "classics": ["classic-1", "classic-13", "classic-14", "classic-89", "classic-106", "classic-107", "classic-119", "classic-129", "classic-139", "classic-140"], "adv": ["adv-a-geo-fm", "adv-a-human-capture"], "prev": null, "next": "concept-f-optim", "readMin": 10}</script>
<script>
(function () {
  "use strict";
  // ================= lib: DOM, text and math helpers shared by every page =================
  // A page script defines rich(text) (inline cross-links); paras() and eqList() call it.
  var DATA;
  try { DATA = JSON.parse(document.getElementById("data").textContent); } catch (e) { DATA = {}; }
  var meta = DATA.meta || {};

  // ---------- DOM helpers: all text goes through textContent; external links are https-only ----------
  function safeUrl(u) { if (typeof u !== "string") return null; var s = u.trim(); return /^https:\/\/[^\s"'<>]+$/i.test(s) ? s : null; }
  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (!Object.prototype.hasOwnProperty.call(attrs, k)) continue;
      var v = attrs[k];
      if (v === null || v === undefined || v === false) continue;
      if (k === "class") n.className = v;
      else if (k === "text") n.textContent = String(v);
      else if (k === "href") { var u = safeUrl(v); if (u) { n.setAttribute("href", u); n.setAttribute("target", "_blank"); n.setAttribute("rel", "noopener noreferrer"); } }
      else if (k.slice(0, 2) === "on" && typeof v === "function") n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, String(v));
    }
    (kids || []).forEach(function (c) { if (c === null || c === undefined || c === false) return; n.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return n;
  }
  var SVGNS = "http://www.w3.org/2000/svg";
  function sv(tag, attrs, kids) {
    var n = document.createElementNS(SVGNS, tag);
    if (attrs) for (var k in attrs) {
      if (!Object.prototype.hasOwnProperty.call(attrs, k)) continue;
      var v = attrs[k];
      if (v === null || v === undefined || v === false) continue;
      if (k === "text") n.textContent = String(v);
      else if (k.slice(0, 2) === "on" && typeof v === "function") n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, String(v));
    }
    (kids || []).forEach(function (c) { if (c) n.appendChild(c); });
    return n;
  }
  function arr(x) { return Array.isArray(x) ? x : []; }
  function str(x) { return typeof x === "string" ? x : (x === null || x === undefined ? "" : String(x)); }
  function paras(text) { return str(text).split(/\n\s*\n/).map(function (t) { return t.trim(); }).filter(Boolean).map(function (t) { return el("p", null, rich(t)); }); }
  function link(title, url) { return safeUrl(url) ? el("a", { href: url, text: title }) : el("span", { text: title }); }
  function ul(items, map) { return el("ul", { class: "plain" }, arr(items).map(function (x) { return el("li", null, [map ? map(x) : str(x)]); })); }
  function fmtCit(n) { n = Number(n); if (!(n >= 0)) return "—"; if (n >= 1000) return (n / 1000).toFixed(n >= 10000 ? 0 : 1) + "k"; return String(n); }

  // ---------- math (MathJax, typeset lazily) ----------
  var mathReady = false, mathQueue = [];
  function mathUsable() { return !!(window.MathJax && typeof window.MathJax.typesetPromise === "function"); }
  function flushMath() { mathReady = true; var q = mathQueue.slice(); mathQueue = []; q.forEach(typeset); }
  window.__atlasMathReady = flushMath;
  // MathJax may finish loading before this script runs (cached/async), so also poll for it.
  var mathPoll = setInterval(function () { if (mathUsable()) { clearInterval(mathPoll); flushMath(); } }, 200);
  setTimeout(function () { clearInterval(mathPoll); }, 30000);
  function typeset(node) {
    if (!node) return;
    if (!mathReady && mathUsable()) mathReady = true;
    if (!mathReady || !mathUsable()) { mathQueue.push(node); return; }
    try { window.MathJax.typesetPromise([node]).catch(function () { /* leave raw TeX visible */ }); } catch (e) { /* leave raw TeX visible */ }
  }
  function eqList(eqs) {
    eqs = arr(eqs).filter(function (q) { return q && str(q.tex).trim(); });
    if (!eqs.length) return null;
    return el("div", { class: "eqs" }, eqs.map(function (q) {
      return el("div", { class: "eq" }, [el("div", { class: "math-block", text: "\\[" + str(q.tex) + "\\]" }), q.explain_zh ? el("p", null, rich(q.explain_zh)) : null]);
    }));
  }
  document.addEventListener("toggle", function (e) { var t = e.target; if (t && t.tagName === "DETAILS" && t.open) typeset(t); }, true);

  // ================= frame (Tufte site): links, notes, hover previews, top bar, theme =================
  var SITE = DATA.site || {};
  var ROOT = str(SITE.root);
  var XREF = DATA.xref || {};
  function hasX(key) { return Object.prototype.hasOwnProperty.call(XREF, key); }
  // Custom page parts (search tools, diagrams, charts) register here; blocks.js calls them for {"b": "slot"} blocks.
  var SLOTS = {};

  // ---------- internal links: urls are relative to the site root; pages sit at different depths ----------
  var SAFE_PATH = /^[A-Za-z0-9][A-Za-z0-9._\/-]*(\?[A-Za-z0-9=&._-]+)?(#[A-Za-z0-9._-]+)?$/;
  function relHref(u) {
    u = str(u);
    if (/^#[A-Za-z0-9._-]+$/.test(u)) return u;
    if (!SAFE_PATH.test(u)) return null;
    var cut = u.indexOf("#"), path = cut < 0 ? u : u.slice(0, cut);
    if (path === SITE.path) return cut < 0 ? "#" : u.slice(cut);
    return ROOT + u;
  }
  function pageLink(u, text, cls) {
    var h = relHref(u);
    if (!h) return el("span", { class: cls || null, text: text });
    var a = el("a", { class: cls || null, text: text });
    a.setAttribute("href", h);
    return a;
  }
  // A link to a known entry (concept, topic, paper, step...). data-xref drives the hover preview.
  function xlink(key, text, cls) {
    if (!hasX(key)) return text ? document.createTextNode(text) : null;
    var x = XREF[key], a = pageLink(x.u, text || x.n || x.t, cls);
    a.setAttribute("data-xref", key);
    return a;
  }

  // Concept / topic ids mentioned in prose ("见 g-pinhole") become links labelled with the entry's short name.
  var ID_RE = /(a-[a-z0-9]+(?:-[a-z0-9]+)*|[fgdrilnv]-[a-z0-9]+)/g;
  var CJK = /[　-〿㐀-鿿＀-￯]/;
  function rich(text) {
    var s = str(text), out = [], last = 0, m;
    ID_RE.lastIndex = 0;
    while ((m = ID_RE.exec(s)) !== null) {
      var id = m[1], prev = m.index > 0 ? s.charAt(m.index - 1) : "", next = s.charAt(m.index + id.length);
      var key = hasX("concept-" + id) ? "concept-" + id : (hasX("adv-" + id) ? "adv-" + id : null);
      if (!key || /[A-Za-z0-9_\-]/.test(prev) || /[A-Za-z0-9_]/.test(next)) continue;
      // The prose spaces ids off from Chinese text; a Chinese label needs no such space.
      var before = s.slice(last, m.index);
      if (/ $/.test(before) && CJK.test(before.charAt(before.length - 2))) before = before.slice(0, -1);
      if (before) out.push(document.createTextNode(before));
      out.push(xlink(key, null, "xref"));
      last = m.index + id.length;
      if (s.charAt(last) === " " && CJK.test(s.charAt(last + 1))) last++;
    }
    if (last < s.length) out.push(document.createTextNode(s.slice(last)));
    return out;
  }
  function lines(text) { return str(text).split(/\n+/).map(function (t) { return t.trim(); }).filter(Boolean).map(function (t) { return el("p", null, rich(t)); }); }

  // ---------- side notes (numbered) and margin notes (unnumbered); on phones they fold behind a toggle ----------
  var noteSeq = 0;
  function sidenote(kids) {
    var id = "sn-" + (++noteSeq);
    return el("span", { class: "note-wrap" }, [
      el("label", { for: id, class: "margin-toggle sidenote-number", "aria-label": "旁注" }),
      el("input", { type: "checkbox", id: id, class: "margin-toggle" }),
      el("span", { class: "sidenote" }, kids)
    ]);
  }
  function marginnote(kids) {
    var id = "mn-" + (++noteSeq);
    return el("span", { class: "note-wrap" }, [
      el("label", { for: id, class: "margin-toggle", "aria-label": "边注", text: "⊕" }),
      el("input", { type: "checkbox", id: id, class: "margin-toggle" }),
      el("span", { class: "marginnote" }, kids)
    ]);
  }
  function noteLabel(text) { return el("span", { class: "note-label", text: text }); }

  // ---------- article scaffolding ----------
  var main = document.getElementById("main");
  var art = main.querySelector("article");
  function section(id, title, kids) {
    var s = el("section", { id: id }, [title ? el("h2", { text: title }) : null].concat(kids));
    art.appendChild(s);
    return s;
  }
  function articleHead(o) {
    var crumbs = el("nav", { class: "crumbs", "aria-label": "位置" });
    arr(SITE.crumbs).forEach(function (c, i) {
      if (i) crumbs.appendChild(el("span", { class: "sep", text: "›", "aria-hidden": "true" }));
      crumbs.appendChild(c[1] ? pageLink(c[1], c[0]) : el("span", { text: c[0] }));
    });
    art.appendChild(el("header", { class: "art-head" }, [
      crumbs,
      el("h1", { text: o.title }),
      o.subtitle ? el("p", { class: "subtitle", text: o.subtitle }) : null,
      o.meta ? el("p", { class: "meta" }, o.meta) : null
    ]));
    if (o.epigraph) art.appendChild(el("div", { class: "epigraph" }, [el("blockquote", null, [el("p", null, rich(o.epigraph))])]));
  }
  // Previous / next in the series, each with its hover preview.
  function seriesNav(prevKey, nextKey, indexUrl, indexLabel) {
    var nav = el("nav", { class: "series", "aria-label": "同系列" });
    nav.appendChild(el("div", { class: "prev" }, prevKey && hasX(prevKey) ? [el("small", { text: "上一篇" }), xlink(prevKey)] : []));
    nav.appendChild(el("div", { class: "up" }, indexUrl ? [pageLink(indexUrl, indexLabel)] : []));
    nav.appendChild(el("div", { class: "next" }, nextKey && hasX(nextKey) ? [el("small", { text: "下一篇" }), xlink(nextKey)] : []));
    art.appendChild(nav);
  }

  // ---------- hover preview for internal links: mouse (after 300 ms) or keyboard focus; never on touch ----------
  var tip = null, tipTimer = 0, tipFor = null;
  function hideTip() {
    clearTimeout(tipTimer);
    if (tip) tip.hidden = true;
    if (tipFor) { tipFor.removeAttribute("aria-describedby"); tipFor = null; }
  }
  function showTip(a) {
    var key = a.getAttribute("data-xref");
    if (!hasX(key)) return;
    var x = XREF[key];
    if (!tip) { tip = el("div", { class: "xtip", id: "xtip", role: "tooltip" }); document.body.appendChild(tip); }
    tip.textContent = "";
    if (x.m) tip.appendChild(el("div", { class: "xt-m", text: x.m }));
    tip.appendChild(el("div", { class: "xt-t", text: x.t }));
    if (x.e) tip.appendChild(el("div", { class: "xt-e", text: x.e }));
    if (x.s) tip.appendChild(el("p", { class: "xt-s", text: x.s }));
    tip.hidden = false;
    var r = a.getClientRects()[0] || a.getBoundingClientRect(), vw = document.documentElement.clientWidth;
    var w = tip.offsetWidth, h = tip.offsetHeight;
    var left = Math.max(8, Math.min(r.left, vw - w - 8));
    var top = r.bottom + 6;
    if (top + h > window.innerHeight - 8 && r.top - h - 6 > 8) top = r.top - h - 6;
    tip.style.left = Math.round(left + window.pageXOffset) + "px";
    tip.style.top = Math.round(top + window.pageYOffset) + "px";
    a.setAttribute("aria-describedby", "xtip");
    tipFor = a;
  }
  function xrefTarget(e) { return e.target && e.target.closest ? e.target.closest("a[data-xref]") : null; }
  document.addEventListener("pointerover", function (e) {
    var a = xrefTarget(e);
    if (!a || e.pointerType !== "mouse" || a === tipFor) return;
    clearTimeout(tipTimer);
    tipTimer = setTimeout(function () { showTip(a); }, 300);
  });
  document.addEventListener("pointerout", function (e) {
    var a = xrefTarget(e);
    if (!a || (e.relatedTarget && a.contains(e.relatedTarget))) return;
    hideTip();
  });
  document.addEventListener("focusin", function (e) {
    var a = xrefTarget(e);
    if (a && a.matches(":focus-visible")) showTip(a);
  });
  document.addEventListener("focusout", function (e) { if (xrefTarget(e)) hideTip(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") hideTip(); });
  window.addEventListener("scroll", function () { if (tipFor && !tipFor.matches(":focus-visible")) hideTip(); }, { passive: true });

  // ---------- top bar: four menus with dropdowns (hover or click on desktop, a folding list on phones) ----------
  var wide = window.matchMedia("(min-width: 761px)");
  function setOpen(li, open) {
    var btn = li.querySelector(".menu-btn");
    if (open) Array.prototype.forEach.call(li.parentNode.children, function (o) { if (o !== li) setOpen(o, false); });
    li.classList.toggle("open", open);
    btn.setAttribute("aria-expanded", open ? "true" : "false");
    if (!open) li._hover = false;
  }
  function buildTopbar() {
    var bar = document.getElementById("topbar");
    var menus = el("ul", { class: "menus", id: "menus" });
    arr(SITE.nav).forEach(function (m) {
      var id = "menu-" + m.key;
      var btn = el("button", { type: "button", class: "menu-btn", "aria-expanded": "false", "aria-controls": id, text: m.label });
      var list = el("ul", { class: "drop", id: id }, arr(m.items).map(function (it) {
        var a = pageLink(it[1], it[0]);
        if (it[1] === SITE.navItem) a.classList.add("cur");
        if (it[1] === SITE.path) a.setAttribute("aria-current", "page");
        return el("li", null, [a]);
      }));
      var li = el("li", { class: "menu" + (m.key === SITE.navCur ? " cur" : "") }, [btn, list]);
      btn.addEventListener("click", function () {
        // A click on a menu the mouse already opened keeps it open instead of closing it again.
        if (li._hover) { li._hover = false; return; }
        setOpen(li, !li.classList.contains("open"));
      });
      btn.addEventListener("keydown", function (e) {
        if (e.key === "ArrowDown") { e.preventDefault(); setOpen(li, true); var f = list.querySelector("a"); if (f) f.focus(); }
      });
      li.addEventListener("pointerenter", function (e) { if (e.pointerType === "mouse" && wide.matches) { setOpen(li, true); li._hover = true; } });
      li.addEventListener("pointerleave", function (e) { if (e.pointerType === "mouse" && wide.matches) setOpen(li, false); });
      li.addEventListener("focusout", function (e) { if (wide.matches && !li.contains(e.relatedTarget)) setOpen(li, false); });
      li.addEventListener("keydown", function (e) { if (e.key === "Escape" && li.classList.contains("open")) { setOpen(li, false); btn.focus(); } });
      menus.appendChild(li);
    });
    var burger = el("button", { type: "button", class: "burger", "aria-expanded": "false", "aria-controls": "menus", text: "Menu" });
    burger.addEventListener("click", function () {
      var open = !bar.classList.contains("nav-open");
      bar.classList.toggle("nav-open", open);
      burger.setAttribute("aria-expanded", open ? "true" : "false");
    });
    var themeBtn = el("button", { type: "button", class: "theme-btn" });
    function darkNow() {
      var t = document.documentElement.getAttribute("data-theme");
      return t ? t === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
    }
    function paintThemeBtn() {
      var dark = darkNow();
      themeBtn.textContent = dark ? "Light" : "Dark";
      themeBtn.setAttribute("aria-label", dark ? "切换到浅色" : "切换到深色");
    }
    themeBtn.addEventListener("click", function () {
      var next = darkNow() ? "light" : "dark";
      var system = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      // Choosing what the system already shows drops the override, so the page follows the system again.
      if (next === system) document.documentElement.removeAttribute("data-theme");
      else document.documentElement.setAttribute("data-theme", next);
      try { if (next === system) localStorage.removeItem("atlas-theme"); else localStorage.setItem("atlas-theme", next); } catch (e) { /* storage unavailable */ }
      paintThemeBtn();
    });
    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", paintThemeBtn);
    paintThemeBtn();
    bar.appendChild(el("div", { class: "bar-in" }, [pageLink("index.html", SITE.brand || "", "brand"), el("nav", { class: "site-nav", "aria-label": "站点导航" }, [menus]), themeBtn, burger]));
    document.addEventListener("click", function (e) {
      if (!bar.contains(e.target)) Array.prototype.forEach.call(menus.children, function (li) { setOpen(li, false); });
    });
  }

  function finishPage() {
    buildTopbar();
    var foot = document.getElementById("site-foot");
    if (foot) foot.appendChild(el("p", null, [pageLink("index.html", SITE.brand || ""), SITE.date ? " · 内容截至 " + SITE.date : ""]));
    typeset(main);
    // Deep links (#id): the page is rendered by script, so jump once it exists and again after fonts settle.
    var h = window.location.hash ? window.location.hash.slice(1) : "";
    if (h && /^[A-Za-z0-9._~-]+$/.test(h) && document.getElementById(h)) {
      var moved = false;
      ["wheel", "touchstart", "keydown", "mousedown"].forEach(function (ev) { window.addEventListener(ev, function () { moved = true; }, { once: true, passive: true }); });
      var settle = function () { var t = document.getElementById(h); if (t && !moved) t.scrollIntoView({ block: "start" }); };
      settle();
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { window.requestAnimationFrame(settle); });
      [400, 1200, 2500].forEach(function (ms) { setTimeout(settle, ms); });
    }
  }

  // ================= article: one Foundations concept =================
  (function () {
    var c = DATA.concept || {};
    if (!c.id) return;
    art.id = "concept-" + c.id;
    var mod = XREF[DATA.module] || {};

    var prereqs = arr(c.prereqs).map(function (p) { return xlink("concept-" + p, XREF["concept-" + p] ? XREF["concept-" + p].t : p); }).filter(Boolean);
    var metaLine = [];
    if (prereqs.length) metaLine.push(marginnote([noteLabel("阅读前需要")].concat(joinNodes(prereqs, "；"))));
    metaLine.push(xlink(DATA.module, mod.t), " · 约 " + (DATA.readMin || 1) + " 分钟");
    articleHead({ title: c.name_zh, subtitle: c.name_en, meta: metaLine, epigraph: c.tldr_zh });

    function joinNodes(nodes, sep) {
      var out = [];
      nodes.forEach(function (n, i) { if (i) out.push(sep); out.push(n); });
      return out;
    }

    // 直觉: the analogy sits in the margin beside the first paragraph.
    var intuition = paras(c.intuition_zh);
    if (str(c.analogy_zh).trim() && intuition.length) intuition[0].insertBefore(marginnote([noteLabel("类比")].concat(rich(c.analogy_zh))), intuition[0].firstChild);
    if (intuition.length) section("intuition", "直觉", intuition);

    var eqs = eqList(c.equations);
    if (eqs) section("equations", "公式", [eqs]);
    if (str(c.worked_example_zh).trim()) section("example", "例子", lines(c.worked_example_zh));
    if (arr(c.pitfalls_zh).length) section("pitfalls", "易错点", [el("ol", null, arr(c.pitfalls_zh).map(function (t) { return el("li", null, rich(t)); }))]);
    if (str(c.in_field_zh).trim()) section("in-field", "在 3D 临场系统中", paras(c.in_field_zh));

    // 案例: where each key paper uses the concept; the paper location is a side note, guide steps a margin note.
    var steps = arr(DATA.walk);
    var cases = [];
    [["quark", c.in_quark], ["ha", c.in_ha]].forEach(function (pair) {
      var anchor = pair[0], u = pair[1] || {};
      var head = el("h3", null, [anchorName(anchor),
        str(u.where).trim() ? sidenote([noteLabel("论文位置")].concat(rich(u.where))) : null,
        el("span", { class: "used", text: u.used ? "用到" : "未用" })]);
      cases.push(head);
      var body = paras(u.how_zh);
      var mine = steps.filter(function (k) { return k.indexOf("walk-" + anchor + "-") === 0 && hasX(k); });
      if (mine.length && body.length) {
        var links = [];
        mine.forEach(function (k, i) { if (i) links.push(el("br")); links.push(xlink(k, XREF[k].n + " " + XREF[k].t)); });
        body[0].insertBefore(marginnote([noteLabel("导读步骤")].concat(links)), body[0].firstChild);
      }
      cases = cases.concat(body);
    });
    section("cases", "案例：Quark 与 Ha 如何使用", cases);
    function anchorName(a) { return a === "quark" ? "Quark" : "Ha et al."; }

    // The other deep reads: their walkthrough steps that build on this concept, labelled with the paper.
    var more = steps.filter(function (k) { return !/^walk-(quark|ha)-/.test(k) && hasX(k); });
    if (more.length) {
      var byPaper = [], seen = {};
      more.forEach(function (k) {
        var paper = str(XREF[k].m).split(" · ")[1] || "";
        if (!seen[paper]) { seen[paper] = []; byPaper.push(paper); }
        seen[paper].push(k);
      });
      section("cases-more", "更多精读中的用法", [el("ul", { class: "refs wide-kind" }, byPaper.map(function (paper) {
        var links = [];
        seen[paper].forEach(function (k, i) { if (i) links.push(el("br")); links.push(xlink(k, XREF[k].n + " " + XREF[k].t)); });
        return el("li", null, [el("span", { class: "kind", text: paper }), el("div", null, links)]);
      }))]);
    }

    if (arr(c.self_check).length) {
      section("self-check", "自测", [el("ol", { class: "quiz" }, arr(c.self_check).map(function (q) {
        return el("li", null, [el("p", null, rich(q.q_zh)), el("details", null, [el("summary", { text: "答案" }), el("p", null, rich(q.a_zh))])]);
      }))]);
    }

    // 延伸阅读: resources with their notes, then topics and classic papers that build on this concept.
    var further = [];
    var ty = { book: "教材", course: "课程", paper: "论文", tutorial: "教程", code: "代码", video: "视频", blog: "文章" };
    if (arr(c.resources).length) {
      further.push(el("h3", { text: "学习资源" }));
      further.push(el("ul", { class: "refs" }, arr(c.resources).map(function (r) {
        return el("li", null, [el("span", { class: "kind", text: ty[r.type] || r.type || "" }),
          el("div", null, [link(r.title, r.url), str(r.note_zh).trim() ? el("div", { class: "gloss" }, rich(r.note_zh)) : null])]);
      })));
    }
    var adv = arr(DATA.adv).filter(hasX);
    if (adv.length) {
      further.push(el("h3", { text: "进阶专题" }));
      further.push(el("ul", { class: "refs" }, adv.map(function (k) {
        return el("li", null, [el("span", { class: "kind", text: "专题" }), el("div", null, [xlink(k, XREF[k].t), XREF[k].e ? el("div", { class: "en", text: XREF[k].e }) : null])]);
      })));
    }
    var cls = arr(DATA.classics).filter(hasX);
    if (cls.length) {
      further.push(el("h3", { text: "经典论文" }));
      further.push(el("ul", { class: "refs papers" }, cls.map(function (k) {
        return el("li", null, [el("span", { class: "yr", text: str(XREF[k].m).replace(/^Classics · /, "") }), xlink(k, XREF[k].t)]);
      })));
    }
    if (further.length) section("further", "延伸阅读", further);

    seriesNav(DATA.prev, DATA.next, "basics/foundations/index.html", "Foundations 目录");
  })();

  finishPage();
})();
</script>
</body>
