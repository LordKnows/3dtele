:root {
  --bg: #fffff8;
  --ink: #111111;

  --muted: #74746a;

  --note: "et-book-note", "LXGW WenKai", "Kaiti SC", "STKaiti", "KaiTi", "et-book", serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --side: clamp(12rem, 21vw, 17rem);
  --gap: 2.75rem;
  --main: calc(100% - var(--side) - var(--gap));
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161614; --ink: #e2e0d6; --ink-2: #c3c1b6; --muted: #979589; --rule: #34332e; --rule-2: #4d4b44; --accent: #e8836f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161614; --ink: #e2e0d6; --ink-2: #c3c1b6; --muted: #979589; --rule: #34332e; --rule-2: #4d4b44; --accent: #e8836f;
  color-scheme: dark;
}

/* ---------- base ---------- */
* { box-sizing: border-box; }
html { font-size: 16px; -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--serif); font-size: 1.15625rem; line-height: 1.85;
  font-kerning: normal; font-variant-numeric: lining-nums;
  /* Space between Chinese and Latin text where the source has none; squeeze adjacent CJK punctuation
     (text-spacing-trim applies the fonts' halt / chws features). Browsers without them keep the source spacing. */
  text-autospace: normal; text-spacing-trim: normal;
  overflow-wrap: break-word;
  padding-top: env(safe-area-inset-top, 0px);
}
[hidden] { display: none !important; }
a { color: inherit; text-decoration-line: underline; text-decoration-thickness: 1px; text-underline-offset: .18em; text-decoration-color: var(--rule-2); }
a:hover { color: var(--accent); text-decoration-color: currentColor; }
a:focus-visible, button:focus-visible, summary:focus-visible, label:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }
.skip { position: absolute; left: -999px; top: 0; }

/* ---------- top bar ---------- */
.topbar { border-bottom: 1px solid var(--rule); }

.brand { font-size: 1rem; text-decoration: none; letter-spacing: .02em; white-space: nowrap; }

.menus { list-style: none; margin: 0; padding: 0; display: flex; gap: 1.6rem; }
.menu { position: relative; }
.menu-btn, .theme-btn, .burger {
  font-family: "et-book", var(--serif); font-variant-caps: all-small-caps; letter-spacing: .08em; font-size: 1.12rem;
  color: var(--ink-2); line-height: 3.1rem;
}
.menu-btn:hover, .theme-btn:hover, .burger:hover, .menu.open > .menu-btn { color: var(--accent); }
.menu.cur > .menu-btn { color: var(--ink); box-shadow: inset 0 -1px 0 var(--ink); }
.drop {
  display: none; position: absolute; left: -1rem; top: 100%; z-index: 40; min-width: 13rem;

.drop a:hover, .drop a:focus-visible { color: var(--accent); }
.drop a.cur { color: var(--ink); }
.drop a.cur::before { content: "›"; position: absolute; margin-left: -.7rem; color: var(--accent); }
.theme-btn { margin-left: auto; }
.burger { display: none; }

/* ---------- article column + margin ---------- */
main { display: block; }
.art { max-width: 67rem; margin: 0 auto; padding: 2.6rem 1.5rem 3rem; counter-reset: sidenote-counter; }
.art > *, .art section > * { width: var(--main); }
.art > section { width: 100%; }

h1, h2, h3 { font-family: var(--serif); color: var(--ink); text-wrap: balance; }

.subtitle { font-family: "et-book", var(--note); font-style: italic; font-size: 1.45rem; line-height: 1.3; color: var(--ink-2); margin-top: .35rem; }

.art ol, .art ul { margin: .6rem 0 0; padding-left: 1.6em; }
.art li + li { margin-top: .45rem; }

.eqs { display: block; }
.eq + .eq { margin-top: 1.6rem; }
.math-block { overflow-x: auto; overflow-y: hidden; margin: .4rem 0 .6rem; padding: .2rem 0; font-size: 1rem; }
.math-block mjx-container { margin: 0 !important; }

/* ---------- side notes & margin notes (floated into the right margin) ---------- */
.sidenote, .marginnote {
  float: right; clear: right; position: relative;
  width: var(--side); margin-right: calc(-1 * (var(--side) + var(--gap))); margin-top: .3rem; margin-bottom: .6rem;
  font-family: var(--note); font-size: .88rem; line-height: 1.6; color: var(--ink-2); text-align: left;
  font-style: normal; font-weight: 400; letter-spacing: 0;
}
h3 .sidenote { margin-top: .2rem; }
.sidenote-number { counter-increment: sidenote-counter; }
.sidenote-number::after, .sidenote::before { font-family: "et-book-osf", var(--serif); position: relative; vertical-align: baseline; }
.sidenote-number::after { content: counter(sidenote-counter); font-size: .75rem; top: -.55em; left: .08em; color: var(--ink-2); }
.sidenote::before { content: counter(sidenote-counter) " "; font-size: .8rem; top: -.4em; }
.note-label { font-family: var(--serif); font-weight: 600; font-size: .82rem; color: var(--muted); margin-right: .5em; }
.marginnote .note-label { display: block; margin: 0 0 .1rem; }
input.margin-toggle { display: none; }
label.sidenote-number { display: inline; cursor: default; }
label.margin-toggle:not(.sidenote-number) { display: none; }

/* ---------- quiz, further reading, series ---------- */
.quiz details { margin-top: .3rem; }
.quiz summary { font-family: var(--note); font-size: .92rem; color: var(--muted); cursor: pointer; list-style: none; display: inline-block; }
.quiz summary::-webkit-details-marker { display: none; }
.quiz summary::before { content: "+ "; font-family: "et-book", var(--serif); }
.quiz details[open] summary::before { content: "− "; }
.quiz summary:hover { color: var(--accent); }
.quiz details > p { margin-top: .3rem; padding-left: 1rem; border-left: 1px solid var(--rule); color: var(--ink-2); }

/* Reference lists: a narrow label column (kind / year) and a hanging text column. */
.art ul.refs { list-style: none; padding-left: 0; }
.refs li { display: grid; grid-template-columns: 2.8rem minmax(0, 1fr); column-gap: .5rem; line-height: 1.6; }
.refs li > :not(.kind):not(.yr) { grid-column: 2; }
.refs .kind, .refs .yr { grid-column: 1; font-family: var(--note); font-size: .86rem; color: var(--muted); padding-top: .12rem; }
.refs .yr { font-family: "et-book-osf", var(--serif); font-size: .95rem; padding-top: .05rem; }
.refs .en { font-family: "et-book", var(--serif); font-style: italic; color: var(--muted); font-size: .92rem; line-height: 1.5; }
.refs .gloss { font-family: var(--note); font-size: .88rem; color: var(--ink-2); margin-top: .1rem; }
.art .refs li + li { margin-top: .75rem; }
.art .papers li + li { margin-top: .35rem; }
/* Without a label column the list is a plain stack (no grid, so nothing can land in a phantom second column). */
.refs.noleft li { display: block; }
.refs .used { font-family: var(--note); font-size: .82rem; color: var(--muted); margin-left: .5em; }
.refs.terms .plain-t { font-weight: 600; }
.refs.terms .en { display: inline; margin-left: .6em; }
.timeline li { line-height: 1.7; }
.art .timeline li + li { margin-top: .4rem; }

/* ---------- blocks: lede, run-in labels, notes ---------- */
.lede { margin-top: 1.6rem; color: var(--ink-2); }
.run-in { font-weight: 600; color: var(--ink); }
p.note { font-family: var(--note); font-size: .9rem; color: var(--muted); margin-top: .1rem; }
h2 .en, h3 .en { font-family: "et-book", var(--serif); font-style: italic; font-weight: 400; color: var(--muted); margin-left: .6em; font-size: .92em; }
h2 a, h3 a { text-decoration-color: var(--rule); }
.quiz-h { font-family: var(--note); font-size: .88rem; color: var(--muted); margin-top: 1.4rem; }

/* Index pages: a table of contents instead of a card grid. */
.art ol.toc { list-style: none; padding-left: 0; margin-top: .4rem; }
.art ol.toc > li + li { margin-top: .85rem; }
.toc-t { line-height: 1.55; }
.toc-t .en { font-family: "et-book", var(--serif); font-style: italic; color: var(--muted); margin-left: .6em; font-size: .95em; }
.toc-meta { font-family: var(--note); font-size: .82rem; color: var(--muted); margin-left: .7em; white-space: nowrap; }
.toc-s { font-family: var(--note); font-size: .9rem; line-height: 1.65; color: var(--ink-2); margin-top: .1rem; }
.toc-lede { font-family: var(--note); color: var(--ink-2); font-size: .95rem; }
h2.toc-h, h3.toc-h { margin-bottom: .3rem; }

/* Tables: booktabs rules (top, under the header, bottom), no vertical lines, no fills. */
.table-wrap { overflow-x: auto; margin: 1rem 0; }
table.booktabs { border-collapse: collapse; width: 100%; font-size: .9rem; line-height: 1.6; border-top: 1.5px solid var(--ink); border-bottom: 1.5px solid var(--ink); }
table.booktabs th { text-align: left; font-weight: 600; padding: .45rem .7rem .35rem 0; border-bottom: 1px solid var(--ink); white-space: nowrap; vertical-align: bottom; }

table.booktabs tbody tr:first-child td { border-top: 0; }
table.rank td { white-space: nowrap; font-variant-numeric: tabular-nums; }
table.rank td:nth-child(2) { white-space: normal; }
.art table.kv { border-collapse: collapse; margin: .6rem 0; font-size: .95rem; width: auto; }
table.kv th { text-align: left; font-weight: 400; color: var(--muted); padding: .25rem 1.2rem .25rem 0; vertical-align: top; min-width: 5em; max-width: 12em; font-family: var(--note); }
table.kv td { padding: .25rem 0; vertical-align: top; }

/* Long articles: the table of contents sits at the top of the margin. */
/* It sits in a full-width section, so it floats into the margin without a negative offset. */
details.mtoc {
  float: right; clear: right; width: var(--side); margin-right: 0; margin-bottom: 1rem;
  font-family: var(--note); font-size: .86rem; line-height: 1.55; color: var(--ink-2);
}
details.mtoc summary { font-family: var(--serif); font-weight: 600; font-size: .82rem; color: var(--muted); list-style: none; cursor: default; }
details.mtoc summary::-webkit-details-marker { display: none; }
.art details.mtoc ol { list-style: none; padding: 0; margin: .3rem 0 0; }
.art details.mtoc li + li { margin-top: .25rem; }
details.mtoc a { text-decoration: none; }
details.mtoc a:hover { text-decoration: underline; }

/* Tools: search and filters with underlined inputs. */
.tool { margin-top: 1rem; }
.filters { display: flex; flex-wrap: wrap; gap: .6rem 1.6rem; align-items: baseline; font-family: var(--note); font-size: .92rem; color: var(--muted); }
.filters label { display: inline-flex; gap: .5rem; align-items: baseline; }
.filters input, .filters select {
  font: inherit; color: var(--ink); background: transparent; border: 0; border-bottom: 1px solid var(--rule-2); border-radius: 0;

}
.filters input[type="search"] { min-width: 14rem; }

.filters input:focus, .filters select:focus { outline: none; border-bottom-color: var(--accent); }
.filters select option { background: var(--bg); color: var(--ink); }
.filters .count { margin-left: auto; font-family: var(--mono); font-size: .8rem; }
table.gl td.en { font-family: "et-book", var(--serif); width: 20%; }
table.gl .abbr { color: var(--muted); }

/* Figures: the pipeline diagram and the timeline of classic papers, drawn in ink with one accent for interaction. */
figure { margin: 1.4rem 0; }
svg a { text-decoration: none; }
.diagram-wrap, .lanes-wrap { position: relative; overflow-x: auto; }
svg.diagram { width: 100%; min-width: 760px; height: auto; display: block; font-family: var(--note); }
svg.diagram .dnode rect { fill: var(--bg); stroke: var(--ink-2); stroke-width: 1; }

svg.diagram .dnode:hover rect, svg.diagram .dnode:focus rect { stroke: var(--accent); stroke-width: 1.5; }

svg.diagram text { fill: var(--ink); }
svg.diagram text.k { font-family: var(--mono); font-size: 10px; fill: var(--muted); }

svg.lanes .axis { font-family: "et-book-osf", var(--serif); font-size: 12px; fill: var(--muted); }
svg.lanes .lane-l { font-size: 12px; fill: var(--ink-2); }
svg.lanes .brk { stroke: var(--muted); fill: none; }
svg.lanes .hit { fill: transparent; }
svg .dot { fill: var(--ink); }
svg .dot.hollow { fill: var(--bg); stroke: var(--ink-2); stroke-width: 1.2; }
svg.lanes a.m:hover .dot, svg.lanes a.m:focus .dot { fill: var(--accent); stroke: var(--accent); }
svg.lanes a.m:focus { outline: none; }
.vtip { position: absolute; z-index: 20; max-width: 20rem; padding: .45rem .7rem; background: var(--bg); border: 1px solid var(--rule-2); font-family: var(--note); font-size: .82rem; line-height: 1.5; pointer-events: none; }
.vtip b { display: block; font-family: "et-book", var(--serif); font-weight: 400; font-size: .92rem; }
.vtip small { display: block; color: var(--muted); }
.vtip span { color: var(--accent); }
figcaption { font-family: var(--note); font-size: .85rem; color: var(--muted); margin-top: .4rem; }
figcaption svg { vertical-align: -1px; }

.series { display: grid; grid-template-columns: 1fr auto 1fr; gap: 1rem; align-items: end; margin-top: 3.2rem; padding-top: 1rem; border-top: 1px solid var(--rule); font-size: .98rem; }
.series small { display: block; font-family: var(--note); font-size: .8rem; color: var(--muted); }
.series .up { text-align: center; font-size: .88rem; }

.site-foot { max-width: 67rem; margin: 0 auto; padding: 1.2rem 1.5rem 2.5rem; font-size: .82rem; color: var(--muted); }
.site-foot a { color: var(--muted); text-decoration: none; }

/* ---------- hover preview ---------- */

混合与 over 合成：全分辨率输入像素的凸组合", "e": "", "m": "Walkthrough · Quark · Q10", "s": "输入：全分辨率 LDM（d、σ、β），M 张原始全分辨率输入图像及其相机参数。", "n": "Q10"}, "walk-quark-q9": {"u": "works/walkthrough/quark.html#walk-quark-q9", "t": "上采样后再激活（post-activation，借鉴 ReLU Fields）", "e": "", "m": "Walkthrough · Quark · Q9", "s": "输入：V^(N)，Quark 为 [6,288,512,32]。", "n": "Q9"}}, "concept": {"id": "i-blending", "name_zh": "视角相关纹理映射与混合权重（ULR）", "name_en": "View-dependent texture mapping & blending weights (ULR)", "tldr_zh": "当多个输入相机都看到目标像素对应的表面点时，混合权重决定每个相机贡献多少。ULR 把好权重的准则归纳为：角度偏差小、分辨率匹配、随视点连续变化、点可见且在视场内。Quark 与 Ha et al. 则让网络从数据中学出这些权重。", "intuition_zh": "有了几何代理，就能从目标像素找到对应的表面点 p，再求出 p 在每个输入相机中的像素位置，得到 K 个候选颜色。如果表面是理想的 Lambertian、几何完美、各相机曝光一致，这些颜色应该相同，怎么平均结果都一样。现实中它们并不相同，原因有四个：高光随视角移动（r-appearance）；深度误差让不同相机取到的其实是不同的点；遮挡让某些相机看到的是前景；离得远或斜着看的相机分辨率更低。混合权重就是在这些不一致之间做裁决。\n\n视角相关纹理映射（VDTM，Debevec, Taylor & Malik 1996）把多张照片投影到粗糙的建筑模型上。每个像素的权重与“新视线方向和该照片拍摄方向之间的夹角”成反比，并且在照片边界附近逐渐降到 0，以避免接缝。这样，高光和模型中缺失的几何细节会在接近拍摄视角时正确出现。\n\n非结构化 Lumigraph（ULR，Buehler et al. 2001）把理想 IBR 算法应满足的目标列成了一张清单：\n- 利用几何代理；\n- 支持任意（非网格）的相机布置；\n- epipole consistency：目标光线恰好穿过某台输入相机的光心时，只用这台相机；\n- 最小角度偏差；\n- 连续性：某台相机的贡献在其视场边界或可见性边界必须平滑降到 0，否则会产生时空伪影；\n- 分辨率敏感：离表面远的相机，一个像素覆盖的表面面积更大，用它会发糊；\n- 等价光线一致性；\n- 实时。\n具体做法是：对每条目标光线，求出它与代理的交点 p，计算每台相机的角度惩罚；只保留惩罚最小的 k 台，以其中第 k 台的惩罚作为自适应阈值；权重从 1 线性降到 0，再归一化。按这个定义，第 k 台相机的权重恰好为 0，真正起作用的只有 k−1 台；不少实现因此取 k+1 个近邻，用第 k+1 个的惩罚作阈值。角度、分辨率、视场三项惩罚可以加权合成为一个总惩罚。\n\n学习式混合把这些手工准则变成网络的输入特征，让网络从数据中学会处理几何误差与遮挡。Deep Blending（Hedman et al. 2018）用 CNN 预测逐像素权重；IBRNet（2021）在每个 3D 采样点上聚合多视角特征，预测颜色混合权重；LLFF 在不规则采样时，用 exp(−γℓ) 形式的相机距离权重乘以累积 alpha。混合权重通常是凸组合，即非负且和为 1。它的好处是输出不会超出输入颜色的范围，纹理保持锐利。坏处是不能产生输入中不存在的颜色，比如出现在新位置的高光；而且当各相机曝光不一致时，权重一变化就会出现接缝和闪烁。", "analogy_zh": "混合权重就像一个评审团的计分规则。几位评委（输入相机）看同一场表演（同一个表面点），各自打一个分（颜色）。坐得越正对舞台（角度偏差小）、离得越近（分辨率高）、视线没被柱子挡住（可见）的评委越可信。ULR 按固定规则给评委分配话语权；学习式混合则是训练一位主审，看着每位评委的位置和打分来决定听谁的。规则的关键之一是：评委离席（相机移出 k 近邻）之前，他的话语权必须先平滑地降到 0，否则总分会突然跳一下，这就是闪烁。", "equations": [{"tex": "w_{\\mathrm{ang}}(i) = 1 - \\frac{\\mathrm{penalty}_{\\mathrm{ang}}(i)}{\\mathrm{thresh}_{\\mathrm{ang}}},\\qquad \\tilde{w}_{\\mathrm{ang}}(i) = \\frac{w_{\\mathrm{ang}}(i)}{\\sum_{j=1}^{k} w_{\\mathrm{ang}}(j)}", "explain_zh": "penalty_ang(i) 是一个夹角：从代理交点 p 指向相机 i 光心的射线 r_i，与目标射线 r_d 之间的夹角。thresh_ang 是自适应阈值：在惩罚最小的 k 台相机中，取第 k 大的惩罚，也就是这 k 台里最大的那个。w_ang(i) 是未归一化的权重：惩罚为 0 时等于 1，线性降到阈值处为 0，所以第 k 台相机的权重恰好为 0；k 近邻之外的相机权重也是 0。w̃_ang(i) 是归一化后的权重，k 台相机的权重之和为 1。自适应阈值保证了相机进出 k 近邻集合时权重连续变化，代价是实际只有 k−1 台相机的权重非零。原文指出，这个形式不严格满足 epipole consistency，可以再乘以 1/penalty_ang(i) 来加强。"}, {"tex": "\\mathrm{penalty}_{\\mathrm{comb}}(i) = \\alpha\\,\\mathrm{penalty}_{\\mathrm{ang}}(i) + \\beta\\,\\mathrm{penalty}_{\\mathrm{res}}(i) + \\gamma\\,\\mathrm{penalty}_{\\mathrm{fov}}(i),\\qquad \\mathrm{penalty}_{\\mathrm{res}}(i) = \\max\\left(0,\\ \\lVert\\mathbf{p}-\\mathbf{C}_i\\rVert - \\lVert\\mathbf{p}-\\mathbf{D}\\rVert\\right)", "explain_zh": "总惩罚是三项惩罚的加权和。α、β、γ 是 ULR 的常数，与 alpha 通道、Quark 的 blend weights β 都无关；把某个常数设为 0，就忽略对应的那一项。penalty_res(i) 是简化的分辨率惩罚，其中 p 是代理上的点，C_i 是输入相机的光心，D 是目标相机的光心。输入相机比目标相机离 p 更远时，它的一个像素覆盖更大的表面面积，会造成欠采样和模糊，因此受罚；离得更近的相机不受罚，过采样可以用 mip-map 处理。penalty_fov(i) 在 p 位于相机 i 视场内时为 0，否则为 ∞，并且在接近图像边界时平滑增大，以保持连续。算出总惩罚后，再套用上面的 k 近邻权重公式。"}, {"tex": "\\mathcal{I}_{\\mathrm{FG}} = \\frac{\\sum_{k=1}^{K}\\mathcal{I}_k\\,\\alpha_k\\,w_k}{\\sum_{k=1}^{K}\\alpha_k\\,w_k},\\qquad \\mathcal{I} = (1-w_{\\mathrm{BG}})\\,\\mathcal{I}_{\\mathrm{FG}} + w_{\\mathrm{BG}}\\,\\mathcal{I}_{\\mathrm{BG}}", "explain_zh": "这是 Ha et al. 的 Eq. (4)–(5)。原文分母漏写了求和号，这里按 LLFF Eq. 8 补全。𝓘_k 是第 k 个视角前向 splat 到目标视角的图像；α_k 是该视角 splat 的累积不透明度，在空洞处约为 0；w_k 是 U-Net 预测的逐像素权重。先乘 α_k，再除以 Σα_k w_k，没有有效像素的视角就会自动退出，其余视角重新归一化；这一项起到了 ULR 中“可见性/视场”惩罚的作用。𝓘_FG 是前景混合结果；w_BG 是背景权重；𝓘_BG 是网络预测的背景图，用来填补去遮挡空洞。LLFF 的 Eq. 8 形式相同，只是权重取 w_{t,k} ∝ exp(−γ ℓ(p_t, p_k))，其中 ℓ 是目标相机与第 k 个相机中心的距离，γ = f/(D·z_min)。Ha et al. Table 3 中的 Distance-based Blending 引用的正是 LLFF，按目标相机到各输入相机的距离定权重（原文没有写出具体的函数形式）。"}, {"tex": "\\mathbf{c}_{\\ell}(\\mathbf{x}) = \\sum_{m=1}^{M}\\beta_{\\ell,m}(\\mathbf{x})\\, I_m\\!\\left(\\pi_m\\big(\\mathbf{x},\\, d_{\\ell}(\\mathbf{x})\\big)\\right),\\qquad \\beta_{\\ell,m}(\\mathbf{x}) = \\frac{\\exp z_{\\ell,m}(\\mathbf{x})}{\\sum_{m'=1}^{M}\\exp z_{\\ell,m'}(\\mathbf{x})}", "explain_zh": "这是把 Quark Eq. (1) 中的“混合”部分按层写开的形式，记号为本文所设。x 是目标像素，d_ℓ(x) 是第 ℓ 层在该像素处的深度。π_m 把目标射线上深度 d_ℓ 处的 3D 点投影到第 m 张输入图，I_m(·) 在全分辨率输入图上取值（原文没有写明插值核，这里按常规写作双线性采样）；这两步合起来就是算子 P^T_θ(I, d)。β_{ℓ,m} 是第 ℓ 层对第 m 个输入的混合权重。z_{ℓ,m} 是最后一个 Fusion Block 的 One-to-many attention 给出的 logit，先双线性上采样到输出分辨率，再在 M 个视角上做 softmax，所以 β 非负且和为 1。得到的 c_ℓ 随后与 density σ_ℓ 一起做 over 合成（见 i-layered）。与 ULR 不同，Quark 的权重是逐层给出的：同一个像素在前景层和背景层可以偏好不同的相机，从而隐式地处理遮挡。"}], "worked_example_zh": "（1）ULR 权重。目标光线打到代理上的点 p，4 台相机的角度惩罚分别为 C1 = 2°、C2 = 5°、C3 = 9°、C4 = 14°，取 k = 3。k 近邻是 C1、C2、C3，阈值取第 3 个，即 9°。未归一化权重为：C1 = 1 − 2/9 = 0.778，C2 = 1 − 5/9 = 0.444，C3 = 1 − 9/9 = 0；C4 不在集合内，权重为 0。归一化后 C1 = 0.778/1.222 = 0.636，C2 = 0.364。若 C1、C2 在 p 处的红色通道值分别为 200 和 180，则输出为 0.636 × 200 + 0.364 × 180 ≈ 192.7。\n\n（2）连续性。虚拟相机继续移动，C4 的角度逐渐变小，最终与 C3 交换名次。交换发生时，两者的惩罚都等于阈值，权重都为 0，所以输出连续变化。如果改用“k 近邻等权”：交换前输出为 (200 + 180 + 150)/3 = 176.7（C3 = 150），交换后为 (200 + 180 + 170)/3 = 183.3（C4 = 170）。一帧之内跳了 6.7 个灰度级，在视频里就表现为闪烁。Quark 取最近的 8 台、Ha et al. 取最近的 K 台，都属于硬选择。Quark 在 Sec. 4.1 末尾承认，目标相机移动时输入图像随之切换，会造成明显闪烁；Ha et al. 在 Sec. 3.2 承认，K 个最近视角变化时 TSDF 深度仍会有微小变化。\n\n（3）分辨率惩罚。目标相机 D 到 p 的距离为 1.5 m。C1 到 p 为 1.6 m，惩罚为 0.1；另一台相机 C5 到 p 为 3.0 m，惩罚为 1.5。即使 C5 的角度更小，只要 β 足够大，它的权重也会被压低。\n\n（4）Ha et al. 如何把这些准则变成特征（附录 A.4）。K = 4 时，U-Net 的输入共 9K + 1 = 37 个通道：前向渲染 RGB 12 个（3K），逐视角深度 4 个，alpha 4 个，TSDF 深度 1 个，另有四组、每组 K 个通道的相机特征共 16 个。这四组特征是：① 输入射线与 TSDF 法线的点积，反映掠射程度，与分辨率敏感性相关；② 输入射线与目标方向的点积，逐像素计算，最接近 ULR 的角度惩罚；③ 输入相机与目标相机的距离，空间广播成整张图，对应 LLFF 式的距离权重，也粗略反映分辨率差异；④ 输入与目标视线方向的点积，同样空间广播，反映相机朝向差异，对应 ULR Fig. 3 所说的“光心近不等于角度近”。α_k 则扮演可见性/视场惩罚的角色。这些量不再代入固定公式，而是交给网络去学怎样组合。\n\n（5）Quark 的权重规模。输出 LDM 为 6 层 × 288×512，每个位置有 M = 8 个 logit。上采样 3.75 倍到 1080×1920 后再做 softmax，共 6 × 1080 × 1920 × 8 ≈ 9950 万个权重，而且每帧、每个目标视角都要重新计算一次。", "pitfalls_zh": ["权重没有经过可见性调制，也没有重新归一化。前向 splat 之后，空洞里的像素是无效值，直接参与平均会让画面变暗，或者出现黑边。Ha et al. Eq. (4) 中的 α_k 和分母就是为了解决这个问题。注意原文分母漏写了求和号，按 LLFF Eq. 8 应为 Σ_k α_k w_k。", "硬切换相机集合。k 近邻集合变化时，如果被移出的相机权重不为 0，输出就会跳变，在视频中表现为闪烁。ULR 以第 k 个惩罚作为阈值来保证连续。Quark 取最近的 8 台、Ha et al. 取最近的 K 台，都是硬选择：Quark 在 Sec. 4.1 末尾承认，输入图像随目标相机移动而切换会造成明显闪烁，输入曝光差异大时尤甚；Ha et al. 在 Sec. 3.2 承认，K 集合变化时 TSDF 深度仍会有小幅变化。", "用相机中心距离代替视线夹角。相机朝向差异大时，“光心最近”不等于“视线最接近”（ULR Fig. 3）。Quark 默认按相机中心 L2 距离选最近的 8 台，在 Deep Blending 数据集上就因此改用了同时考虑视角夹角的选择启发式（Sec. 4.1）。", "高估凸组合的表达能力。权重非负且和为 1，输出永远落在输入颜色的凸包之内：相机之间曝光和白平衡不一致，会直接变成接缝；高光只能在输入之间“滑动”，无法出现在新位置。所以要先做相机颜色标定，再谈混合。"], "in_quark": {"used": true, "where": "Sec. 3.1 Eq. (1)、Sec. 3.2.1（射线方向编码）、Sec. 3.2.3（blend weights 由 One-to-many attention 产生，softmax 推迟到上采样之后）、Sec. 3.4、Sec. 4.1（视角选择与切换闪烁）、Sec. 4.2（RGB Output 消融）、Sec. 4.3", "how_zh": "LDM 在每层每个像素上存 M = 8 维的 blend weights β，形状为 [L, H, W, M]，Quark 输出时为 6 × 288 × 512 × 8。这些权重的 logit 由最后一个 Fusion Block 的 One-to-many attention 计算，先双线性上采样 3.75 倍到 1080p，再在 M 个视角上做 softmax（Sec. 3.2.3）。因此每个输出像素的权重非负且和为 1，是标准的凸组合 IBR。\n\n射线方向编码 γ（Sec. 3.2.1）在输入射线与目标射线重合时为 0，使网络“偏向离目标视角近的射线”，可以看作 ULR“最小角度偏差”准则的学习版本，但消融显示收益很小（30.41 对 30.32）。与 VDTM/ULR 不同，Quark 的权重是逐层给出的：同一个像素在前景层和背景层可以偏好不同的相机，从而隐式处理可见性。\n\n消融 RGB Output（Sec. 4.2 Table 4，以 Quark+ 为基线、半分辨率训练 250K 步，直接取网络 appearance 特征的前 3 个通道作输出）中，PSNR 从 30.41 降到 29.18，LPIPS 从 0.154 升到 0.179，是所有消融中退化最大的一项。\n\n视角选择是硬的：取相机中心 L2 距离最近的 8 台；训练时从最近的 16 台中随机抽 8 台（Sec. 3.4）。在相机朝向变化大的 Deep Blending 上，必须改用同时考虑视角夹角的启发式（Sec. 4.1），这正对应 ULR 所说的“距离近不等于角度近”。Sec. 4.1 末尾还承认，目标相机移动时输入图像随之切换，会造成明显闪烁，输入曝光差异大时尤其严重，这正是 ULR 连续性准则所警告的情况。\n\nSec. 4.3 承认了三点局限：凸组合无法准确表示视角相关的材质；输入曝光或焦距不同时，会产生边缘伪影和闪烁；标定误差会产生错误的硬边。"}, "in_ha": {"used": true, "where": "Sec. 3.3 Eq. (4)–(7)、附录 A.4、Sec. 4.5 Table 3、Fig. 4", "how_zh": "Eq. (4) 写作 𝓘_FG = Σ_k 𝓘_k α_k w_k / Σ_k α_k w_k（原文分母漏写了求和号），结构与 LLFF 的 Eq. (8) 完全相同。α_k 是逐视角前向渲染的累积不透明度，起到 ULR 中“可见性/视场”项的作用：空洞处 α_k ≈ 0，该视角自动退出。w_k 由 4 层 U-Net 预测（Sec. 3.3）。\n\n附录 A.4 列出的网络输入，相当于把 ULR 的惩罚项变成了特征：\n- 输入射线与目标方向的点积（逐像素），对应角度偏差；\n- 输入射线与 TSDF 法线的点积，反映掠射程度，与分辨率敏感性相关；\n- 输入相机与目标相机的距离（空间广播），对应 LLFF 式的距离权重；\n- 输入与目标视线方向的点积（空间广播），反映相机朝向差异。\nK = 4 时，网络输入共 9K + 1 = 37 个通道。Eq. (5) 再用 w_BG 与背景图 𝓘_BG 混合，以填补去遮挡区域。\n\nTable 3 表明，学习式混合是质量提升的主要来源。Distance-based Blending 按目标到各输入相机的距离定权重（引用 LLFF），PSNR 26.08、STED 235.3，Fig. 4(b) 显示它会产生重影。完整模型为 31.17 和 68.76。把所有高斯一次性渲染（No Blending）只有 24.64。\n\nL_Depth（Eq. 6）用同一组权重混合各视角的深度，再用 L1 损失把结果拉向 TSDF 深度（权重 0.1，属于软约束），这样就把“几何一致”的约束直接施加到了权重上。"}, "in_field_zh": "多相机临场系统的纹理阶段，本质上都是混合权重问题。Holoportation 一类系统在融合出的网格上，把多个彩色相机的图像按视角加权投影上去；Montage4D（2018）专门研究如何让这些权重在时间上平滑变化，以消除接缝和闪烁。在工程上，权重的效果高度依赖相机的颜色标定：统一曝光和白平衡，并做颜色校正矩阵（CCM）之后，混合才能无缝。另外，双目显示或多观看者时，每只眼睛的权重都不同，需要注意左右眼之间的一致性（见 v-perception）。", "resources": [{"title": "Unstructured Lumigraph Rendering (Buehler, Bosse, McMillan, Gortler & Cohen, SIGGRAPH 2001)", "url": "https://groups.csail.mit.edu/graphics/pubs/siggraph2001_ulr.pdf", "type": "paper", "note_zh": "原论文，MIT 存档的 PDF。第 3 节列出理想 IBR 应满足的 8 条目标，第 4 节给出 k 近邻角度权重、分辨率惩罚、视场惩罚以及组合惩罚的公式。本概念的核心读物。"}, {"title": "Modeling and Rendering Architecture from Photographs (Debevec, Taylor & Malik, SIGGRAPH 1996)", "url": "https://www.pauldebevec.com/Research/debevec-siggraph96-paper.pdf", "type": "paper", "note_zh": "VDTM 的起点。第 3 节把每张照片当作一台幻灯机，投影到模型上；多张照片按与新视线的夹角成反比加权，并在照片边界附近把权重逐渐降到 0，以避免接缝。"}, {"title": "Computer Vision: Algorithms and Applications, 2nd ed. (Szeliski), §14.1.1 View-dependent texture maps", "url": "https://szeliski.org/Book/", "type": "book", "note_zh": "教科书中对 VDTM 和多视角混合的讲解，建议与 14.3 节的光场部分对照阅读。"}, {"title": "IBRNet: Learning Multi-View Image-Based Rendering (Wang et al., CVPR 2021)", "url": "https://arxiv.org/abs/2102.13090", "type": "paper", "note_zh": "学习式混合权重的代表作：在每个 3D 采样点上用均值和方差聚合多视角特征，预测源视角颜色的混合权重。Quark 的对比基线在 RFF 和 IBRNet 数据上重训；它也是 Ha et al. 的对比方法（使用作者发布的预训练权重）。"}], "self_check": [{"q_zh": "ULR 为什么把阈值设为 k 近邻中第 k 台相机的角度惩罚，而不是用一个全局常数？", "a_zh": "在非结构化输入下，全局阈值两头不讨好。相机稀疏的区域需要足够大的阈值才能找到可用的相机，但同样的阈值放到相机密集的区域，又会把太多相机混在一起，导致模糊。用第 k 台相机的惩罚作为阈值，既能适应局部的相机密度，又能保证第 k 台相机的权重恰好为 0。这样，相机进出 k 近邻集合时，权重都是从 0 开始连续变化的，不会跳变，满足连续性目标。"}, {"q_zh": "在 Ha et al. 的 Eq. (4) 中，假设某像素 4 个视角的网络权重都是 0.25，第 3、4 个视角在该处是空洞（α = 0），第 1、2 个视角的颜色分别为 200 和 190（α = 1）。输出是多少？如果不除以 Σα_k w_k，结果会怎样？", "a_zh": "归一化后，𝓘_FG = (0.25 × 200 + 0.25 × 190)/(0.25 + 0.25) = 195。如果不归一化，结果为 0.25 × 200 + 0.25 × 190 = 97.5，亮度减半，会在去遮挡区域的边缘形成暗色光晕。α_k 和分母的作用，是让没有有效像素的视角自动退出，其余视角重新归一化。这与 LLFF Eq. (8) 用累积 alpha 调制权重是同一个道理。"}, {"q_zh": "Quark 改为直接输出 RGB 时 PSNR 下降 1.23 dB，但它又承认 blend weights 无法准确表示视角相关的材质。这两件事该如何统一理解？", "a_zh": "Quark 的网络只在低分辨率的内部 LDM 上求解（Quark 为 6 层 × 288×512，消融所用的 Quark+ 为 8 层 × 432×768）。如果直接回归 RGB（消融中取 appearance 特征的前 3 个通道），颜色的分辨率就被限制在内部分辨率，再上采样到 1080p（Quark 3.75 倍，Quark+ 约 2.5 倍）时高频细节会丢失；blend weights 则直接从全分辨率输入图中取纹理，所以结果更锐利（LPIPS 0.154 对 0.179）。但 blend weights 是凸组合，输出颜色只能落在 M 个输入颜色的凸包之内。如果目标视角中高光的位置或强度与所有输入都不同，就无法正确合成，只能在输入之间“滑动”，或者以重影的形式出现。换句话说，IBR 用“不能创造新颜色”换来了“不丢失高频细节”。"}], "prereqs": ["i-lightfield", "r-appearance"]}, "module": "module-M5", "walk": ["walk-quark-q9", "walk-quark-q10", "walk-ha-h1", "walk-ha-h10", "walk-ha-h11", "walk-ha-h12"], "classics": ["classic-7", "classic-8", "classic-15", "classic-17", "classic-19", "classic-22", "classic-26", "classic-42", "classic-43", "classic-44", "classic-51", "classic-58", "classic-63", "classic-66", "classic-80", "classic-92", "classic-99", "classic-100", "classic-112", "classic-120", "classic-144", "classic-145"], "adv": ["adv-a-layered-nvs", "adv-a-generalizable-ibr", "adv-a-human-capture", "adv-a-telepresence-sys"], "prev": "concept-i-lightfield", "next": "concept-i-warping", "readMin": 11}</script>
<script>
(function () {
  "use strict";
  // ================= lib: DOM, text and math helpers shared by every page =================
  // A page script defines rich(text) (inline cross-links); paras() and eqList() call it.
  var DATA;
  try { DATA = JSON.parse(document.getElementById("data").textContent); } catch (e) { DATA = {}; }
  var meta = DATA.meta || {};

  // ---------- DOM helpers: all text goes through textContent; external links are https-only ----------
  function safeUrl(u) { if (typeof u !== "string") return null; var s = u.trim(); return /^https:\/\/[^\s"'<>]+$/i.test(s) ? s : null; }
  function el(tag, attrs, kids) {
