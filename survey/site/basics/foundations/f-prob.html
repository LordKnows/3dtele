-fs5": {"u": "works/walkthrough/freesplat.html#walk-freesplat-fs5", "t": "多尺度聚合与深度：CVEncoder 加 UNet++ 式解码器，在 128 个 log 深度候选上做 softmax 回归", "e": "", "m": "Walkthrough · FreeSplat · FS5", "s": "输入：代价体（128×96×128）和 backbone 的 5 级特征。", "n": "FS5"}, "walk-freesplat-fs8": {"u": "works/walkthrough/freesplat.html#walk-freesplat-fs8", "t": "PTF②融合：位置按权重加权平均，权重累加，特征用 GRU 更新，未配对的直接追加", "e": "", "m": "Walkthrough · FreeSplat · FS8", "s": "输入：配成对的 M 对（全局 g，局部 l）三元组，以及未配对的局部三元组。", "n": "FS8"}, "walk-ha-h4": {"u": "works/walkthrough/ha.html#walk-ha-h4", "t": "软差分掩码：M = min(|I_t − I_{t−1}|/λ_t + β, 1)，在 1/4 分辨率计算并做 max-pool", "e": "", "m": "Walkthrough · Ha et al. · H4", "s": "输入：同一台固定相机相邻两帧的 RGB，I_n^t 和 I_n^{t−1}。", "n": "H4"}, "walk-ha-h5": {"u": "works/walkthrough/ha.html#walk-ha-h5", "t": "静止区域的时间深度滤波（EMA）", "e": "", "m": "Walkthrough · Ha et al. · H5", "s": "输入：当前原始深度 D_n^t、掩码 M_n^t 和上一帧滤波结果 Ḋ_n^{t−1}。", "n": "H5"}, "walk-ha-h7": {"u": "works/walkthrough/ha.html#walk-ha-h7", "t": "截断与融合权重（τ = 0.02 m，权重基于 7×7 局部深度方差）", "e": "", "m": "Walkthrough · Ha et al. · H7", "s": "输入：K 个 s_k，以及每个投影位置周围 7×7 窗口内的深度。", "n": "H7"}, "walk-ha-h9": {"u": "works/walkthrough/ha.html#walk-ha-h9", "t": "时间反馈：上一帧新视角深度作为额外的 TSDF 输入（ω_tmp，η = 15）", "e": "", "m": "Walkthrough · Ha et al. · H9", "s": "输入：上一帧的目标深度 𝒟^{t−1}、K 张差分掩码 M_k^t、上一帧的权重。", "n": "H9"}, "walk-ibrnet-ib10": {"u": "works/walkthrough/ibrnet.html#walk-ibrnet-ib10", "t": "粗细两级采样：coarse 权重构成逆深度 PDF，再采 64 点，128 点送入独立的 fine 网络", "e": "", "m": "Walkthrough · IBRNet · IB10", "s": "输入：coarse 渲染权重 w_k（64 维，detach）、coarse 采样的逆深度。", "n": "IB10"}, "walk-mvsplat-mv6": {"u": "works/walkthrough/mvsplat.html#walk-mvsplat-mv6", "t": "softmax 深度：在 1/4 分辨率上对 128 个视差候选求期望，最大概率作为匹配置信度", "e": "", "m": "Walkthrough · MVSplat · MV6", "s": "输入：细化代价体 C̃^i [128,64,64]。", "n": "MV6"}, "walk-pixelsplat-ps7": {"u": "works/walkthrough/pixelsplat.html#walk-pixelsplat-ps7", "t": "沿射线的离散深度分布：32 个视差均匀的桶加上桶内偏移", "e": "", "m": "Walkthrough · pixelSplat · PS7", "s": "输入：每像素 128 维特征 B×2×65536×128。", "n": "PS7"}, "walk-pixelsplat-ps9": {"u": "works/walkthrough/pixelsplat.html#walk-pixelsplat-ps9", "t": "重参数化：按分布采样 3 个深度，把被采样桶的概率当作不透明度", "e": "", "m": "Walkthrough · pixelSplat · PS9", "s": "输入：φ 与 δ（B×2×65536×1×32）。", "n": "PS9"}}, "concept": {"id": "f-prob", "name_zh": "概率、加权平均与递归滤波", "name_en": "Probability, weighted averaging & recursive filtering", "tldr_zh": "多视角、多帧得到的深度都带有噪声，要把它们合成一个更可靠的估计，最好的办法是按置信度（方差的倒数）加权平均；把同样的想法用在时间轴上，就得到指数滑动平均（EMA）和卡尔曼滤波。Ha et al. 的 TSDF 融合和时间深度滤波，就是这套工具的工程化版本。", "intuition_zh": "先看噪声与方差。一次深度测量可以写成 z=真值+噪声，噪声通常建模为零均值高斯 N(0, σ²)，σ 越大，这次测量越不可信。立体深度的 σ 大约随距离的平方增长：σ_Z≈Z²σ_d/(f·b)，其中 σ_d 是视差误差（见 g-depth）。在物体边缘、弱纹理和高光处，σ 还会更大。“置信度”一般取 1/σ²，或者某个随 σ 单调递减的函数。\n\n再看加权平均。对两个独立测量 z₁、z₂（方差分别为 σ₁²、σ₂²），方差最小的线性无偏估计是逆方差加权平均，融合后的方差 1/(1/σ₁²+1/σ₂²) 比任何一个输入都小。Curless & Levoy 的体素 TSDF 就是在每个体素上对多帧的符号距离做加权平均，同时用累积权重 W 记录已经积累了多少证据。深度学习和渲染里还有很多“和为 1 的权重”，比如 softmax 的输出、alpha 合成中各层的可见权重、IBR 的 blend weights。用这些权重得到的输出本质上都是加权平均，也可以看作某个离散分布下的期望。\n\n如果不想保存所有历史帧，可以把加权平均写成递归形式：新估计 = 旧估计 + 增益 ×（新测量 − 旧估计）。增益固定时就是 EMA，j 帧之前的测量权重按 (1−α)^j 指数衰减。卡尔曼滤波让增益自己调整：预测步假设“状态可能已经变了”，把不确定度 P 加上过程噪声 Q；更新步的增益 K=P⁻/(P⁻+R) 在“旧估计有多可信”和“新测量有多可信”（测量噪声为 R）之间权衡。场景静止时 Q 小、K 小，滤波器多做平均，降噪能力强；场景在动时 Q 大、K 接近 1，估计能快速跟上新测量。\n\n这里有一个根本的权衡：平均得越狠，画面越稳定，但物体一动就会拖尾（ghosting）。所以实用系统都会用某种运动检测来调节增益。Ha et al. 用颜色差分掩码充当一个手工设计的逐像素增益。", "analogy_zh": "问路时，本地人（σ 小）和游客（σ 大）给了你不同的答案。你会更相信本地人，但也会参考游客的说法，这就是逆方差加权。EMA 像一个按固定比例遗忘的人：每过一天，旧记忆只剩原来的四成。卡尔曼滤波则像一个会看形势的人：局势平稳时相信经验，局势一变就马上采纳新消息。", "equations": [{"tex": "\\hat{z}=\\frac{\\sum_{i}w_{i}\\,z_{i}}{\\sum_{i}w_{i}},\\qquad w_{i}=\\frac{1}{\\sigma_{i}^{2}},\\qquad \\operatorname{Var}(\\hat{z})=\\frac{1}{\\sum_{i}1/\\sigma_{i}^{2}}", "explain_zh": "z_i 是第 i 个独立测量，σ_i² 是它的方差，w_i 是权重，分母负责归一化，使权重之和为 1。取 w_i=1/σ_i² 时，融合结果在所有线性无偏估计中方差最小，并且小于任何一个单独测量的方差。换成其他正权重（例如 Ha et al. 和 Starline 使用的约 1/σ 的形式）时，结果仍是加权平均，只是不再是方差最小的那一个。"}, {"tex": "D_{t}=\\frac{W_{t-1}\\,D_{t-1}+w_{t}\\,d_{t}}{W_{t-1}+w_{t}},\\qquad W_{t}=\\min\\left(W_{t-1}+w_{t},\\ W_{\\max}\\right)", "explain_zh": "D_t 是累积估计，例如某个体素的符号距离；W_t 是累积权重；d_t、w_t 是新测量和它的权重。这是上一个公式的递归写法，不必存储所有历史测量，就能得到同样的加权平均（Curless & Levoy 1996）。W_max 是权重上限，KinectFusion 一类的实时系统用它防止旧信息永远占主导，让估计能跟上场景的变化。Ha et al. 附录 A.2 中上一帧深度的权重上限 η=15，起的就是这个作用。"}, {"tex": "\\dot{D}^{t}=M\\,D^{t}+(1-M)\\,\\dot{D}^{t-1}=\\sum_{j\\ge 0}M\\,(1-M)^{j}\\,D^{t-j},\\qquad \\frac{\\operatorname{Var}(\\dot{D})}{\\sigma^{2}}=\\frac{M}{2-M}", "explain_zh": "D^t 是当前帧的原始深度，Ḋ^t 是滤波后的深度，M 是增益；在 Ha et al. 的 Eq.(2) 中，M 是逐像素的差分掩码，取值在 [0.6, 1] 之间。第二个等号在 M 为常数时成立，它把递归展开：j 帧之前的测量权重为 M(1−M)^j，按指数衰减，所有权重之和为 1。第三个式子要求 M 为常数、场景静止、各帧噪声独立且方差为 σ²，它说明稳态下输出的方差只有原来的 M/(2−M)（由几何级数 Σ M²(1−M)^{2j}=M²/(2M−M²) 得到）。"}, {"tex": "\\begin{aligned}P^{-}_{t}&=P_{t-1}+Q,\\qquad K_{t}=\\frac{P^{-}_{t}}{P^{-}_{t}+R}\\\\ \\hat{x}_{t}&=\\hat{x}_{t-1}+K_{t}\\,\\bigl(z_{t}-\\hat{x}_{t-1}\\bigr),\\qquad P_{t}=(1-K_{t})\\,P^{-}_{t}\\end{aligned}", "explain_zh": "这是最简单的一维卡尔曼滤波，采用随机游走模型：真值每帧随机变化，变化的方差为 Q。x̂_t 是状态估计（例如某个像素的深度），P_t 是估计的方差，P⁻_t 是预测步之后的方差。z_t 是新测量，R 是测量噪声的方差，K_t 是卡尔曼增益。把 K 固定为常数，就得到 EMA。在稳态下，增益与噪声之比满足 Q/R=K²/(1−K)。"}, {"tex": "\\begin{aligned}s(\\mathbf{p})&=\\sum_{k=1}^{K}\\omega_{k}\\,\\mathrm{clamp}(\\tilde{s}_{k},-\\tau,\\tau),\\qquad \\tilde{s}_{k}=D_{k}[u_{k},v_{k}]-z_{k}\\\\ \\omega_{k}&=\\begin{cases}0, & \\tilde{s}_{k}<-\\tau\\\\ \\min\\left(0.001/\\hat{\\sigma}_{k},\\ 1\\right), & \\text{otherwise}\\end{cases},\\qquad \\hat{\\sigma}_{k}=\\sqrt{\\frac{\\nu_{k}}{49}},\\quad \\nu_{k}=\\sum_{(p,q)\\in\\mathcal{N}_{7\\times 7}}\\min\\left((D_{k}[u_{k},v_{k}]-D_{k}[p,q])^{2},\\ \\tau^{2}\\right)\\end{aligned}", "explain_zh": "这是 Ha et al. 附录 A.1 Eq.(9)–(12) 按 Starline 的符号约定重写后的形式。p 是目标射线上的采样点；z_k 是 p 在第 k 个输入相机中的 z-depth，(u_k,v_k) 是它的像素坐标；D_k[u_k,v_k] 是该视角深度图在此处的采样值。s̃_k>0 表示 p 位于视角 k 所见最前表面的前方。τ=0.02 m 是截断距离；s̃_k<−τ 说明 p 在视角 k 中被更近的东西挡住，该视角不投票（Starline 称之为防止 overcarving；Starline 还规定 p 落在视角 k 视锥之外时 ω_k=0）。σ̂_k 是 7×7 邻域内相对中心像素的截断 RMS 深度波动（单位为米，最大为 τ），所以 ω_k 落在 [0.05, 1]。s 是未归一化的加权和，但与归一化的加权平均同号，零交叉位置相同；射线以 0.8·s 为步长前进，s 由正变负处就是表面，再做 3 步二分。Ha et al. 原文写作 s_k=z_k−D_k，符号与其余规则不一致（见 pitfalls）。"}], "worked_example_zh": "① Ha et al. 的时间滤波（Sec. 3.2，λ_t=0.7，β=0.6；这里假设颜色已归一化到 [0,1]）：\n• 静止像素：|ΔI|≈0.01，M=min(0.01/0.7+0.6, 1)≈0.614；\n• 运动像素：|ΔI|=0.3，0.3/0.7+0.6≈1.03，截断为 1，完全采用新深度。只要 |ΔI|≥0.28，M 就达到 1。\n在静止区，M≈0.6，当前帧与之前各帧的权重依次为 0.6、0.24、0.096、0.038……，按方差折算的等效样本数只有 (2−M)/M≈2.3 帧。假设 RAFT-Stereo 在 2 m 处的逐帧深度噪声为 σ=1 cm，且各帧独立，那么滤波后的标准差为 √(0.6/1.4)×1 cm≈0.65 cm。换成卡尔曼滤波的语言，K=0.6 相当于假设 Q/R=0.36/0.4=0.9，也就是认为真值每帧的随机变化几乎和测量噪声一样大。这是一个很弱的滤波器，稳定性主要靠后面的 TSDF 回灌来补。\n\n② Ha et al. 的 TSDF 权重（附录 A.1 Eq.11–12）：ω_k=min(0.001·(ν_k/49)^{−1/2}, 1)。其中 (ν_k/49)^{1/2} 是 7×7 窗口内的局部 RMS 深度波动 σ̂_k，单位为米；由于 Eq.12 做了截断，它不会超过 τ=0.02 m。σ̂=1 mm 时 ω=1（达到上限），σ̂=5 mm 时 ω=0.2，σ̂=2 cm 时 ω=0.05。所以权重正比于 1/σ̂ 而不是 1/σ̂²，并被限制在 [0.05, 1] 之间。\n\n③ 融合一个采样点（按 Starline 的约定 s̃_k=D_k−z_k，正值表示采样点位于视角 k 所见表面的前方；τ=0.02 m）。设采样点真实位于表面前方 1 cm。视角 1：s̃₁=+0.010 m，σ̂=2 mm，ω₁=0.5，贡献 +0.005；视角 2：s̃₂=+0.006 m，σ̂=1 cm，ω₂=0.1，贡献 +0.0006。视角 3 在这个位置有一个漂浮在前方约 0.5 m 处的飞点，D₃ 偏小，s̃₃=0.010−0.5=−0.49 m；飞点所在的小块区域很平滑，σ̂=2 mm，ω₃=0.5。\n• 不截断也不门控：s=0.005+0.0006−0.245=−0.2394，符号翻转，射线会在这里提前“撞上”一个假表面；\n• 只截断：视角 3 贡献 0.5×(−0.02)=−0.01，s=−0.0044，仍然翻转；\n• 截断加门控（s̃₃<−τ ⇒ ω₃=0）：s=+0.0056，归一化后 0.0056/0.6≈0.0093 m，接近真实的 1 cm。\n门控的道理是：在视角 3 看来，这个点藏在它看到的最前表面之后很远，视角 3 对它没有信息，不该投票。反过来，如果视角 3 的深度偏大（例如透过空洞看到了远处背景），s̃₃=+0.49 不会被门控，但截断把它的贡献限制在 +0.02×0.5=+0.01，s=+0.0156：符号正确，只是按 0.8·s≈1.25 cm 步进时会略微越过 1 cm 外的表面，再由符号变化和二分找回；不截断时 s≈+0.25，一步就会跨出约 20 cm，可能直接穿过薄物体。", "pitfalls_zh": ["独立性假设不成立：逆方差加权要求各测量的噪声相互独立。相邻相机使用同一个立体网络、视角又相近时，误差高度相关，比如同一块高光区域一起估错。这时加权平均降不了误差，还会给出过于乐观的方差。", "置信度启发式分不清噪声和真实几何：Ha et al.（沿用 Starline）的 ω_k 用 7×7 窗口内相对中心像素的深度波动来估计 σ̂。深度边缘处的“波动”是真实几何，斜面同样会产生波动：在 2 m 处、f=1000 时，一个倾斜 45° 的平面每像素深度变化约 2 mm，7×7 窗口的 σ̂≈4 mm，即使完全没有噪声，ω 也只有 0.25。此外，这个权重是 1/σ̂ 形式，并有 [0.05, 1] 的上下限，与理论上的 1/σ² 不同。", "TSDF 符号约定：Ha et al. 附录 A.1 把 s_k 写成 z_k−D_k，配合 z 为正深度的投影 K_k(R_k p+t_k)，表面前方为负；但同段的“s_k<−τ 时 ω_k=0”和“以 0.8·s 为步长前进直到变号”只有在“前方为正”时才讲得通。若照字面实现，所有视角都认为是自由空间的地方权重全为 0、s=0，射线原地不动；靠近表面时 s 为负，射线还会往回走。Starline 原文明确说 s 为正当且仅当点位于深度相机可见的最前表面之前，所以复现时应取 s_k=D_k−z_k。", "递归滤波会滞后、拖影：增益越小，结果越稳定，但运动开始时会滞后，运动结束后会留下残影。Ha et al. 的掩码只看颜色变化，光照变化或自动曝光会被当成运动，这时滤波失效；无纹理物体的运动会被当成静止，旧深度就残留下来。", "加权平均要归一化，对深度取平均也要小心：Ha et al. Eq.(4) 原文的分母漏写了求和，应为 Σ_k α_k w_k；如果照字面逐项约分，结果会退化成对 K 张图简单求和。另外，对前景和背景两个深度取加权平均，会得到一个介于两者之间、实际上不存在的深度（期望不等于众数），这是飞点的成因之一。"], "in_quark": {"used": true, "where": "Sec. 3.1 Eq.(1)（blend weights 凸组合与 over 合成）；Sec. 3.2.3（blend weights 由注意力产生，softmax 推迟到上采样之后；可选深度图）；Sec. 3.3 Eq.(5)（softmax 注意力）；Sec. 4.2（No cross attention 消融）；Sec. 4.1 与 4.3（没有时间一致性）", "how_zh": "Quark 没有做任何时间滤波，但“加权平均”在其中随处可见。(1) Eq.(1) 中每层的颜色 Σ_m β_m·P^T(I, d) 是 M=8 张输入图像的加权平均，β 经过 softmax，非负且和为 1。论文在 Sec. 4.3 明确说输出颜色是输入颜色的凸组合，所以表示不了超出输入颜色范围的视角相关效应。(2) One-to-many attention 中的 softmax(QKᵀ/√C) 同样给出一组和为 1 的权重，用来对 M 个视角的 update feature Δ 求加权平均。消融 “No cross attention” 把 keys 置零后，权重变成均匀的 1/M，退化为普通均值，PSNR 从 30.41 降到 29.73；可见按相关性加权比等权平均更好。(3) over 合成把各层的密度 σ（即 alpha）转换成“第 ℓ 层被看到”的权重 σ_ℓ·∏_{前面的层 j}(1−σ_j)。论文提到，可选的深度图是通过 over 合成解码后的深度得到的，这就是各层深度在这组权重下的加权平均，也就是期望深度（权重和不足 1 时未归一化）。(4) 在时间维度上，Sec. 4.3 说视频是逐帧独立重建的，Sec. 4.1 说目标视角移动时会切换输入相机，从而产生闪烁（输入曝光差异大时尤其明显）；论文里没有任何 EMA 或卡尔曼式的时间融合。这正是 f-prob 的工具可以补上的地方，与 Quark 作者重叠的后续工作（SplatVoxel/Fuse-and-Refine、Online Neural Space Time Memory）都引入了历史记忆。"}, "in_ha": {"used": true, "where": "Sec. 3.2 Eq.(1)–(2)（差分掩码与递归深度滤波）；附录 A.1 Eq.(10)–(12)（TSDF 加权融合与局部方差置信度）；附录 A.2 Eq.(13)–(14)（上一帧深度的累积权重，上限 η=15）；Sec. 3.3 Eq.(4)–(5)（加权混合）；Sec. 4.5 Table 3（消融）", "how_zh": "这是 Ha et al. 的数学骨架。(1) 时间滤波 Eq.(2) Ḋ_n^t=M·D_n^t+(1−M)·Ḋ_n^{t−1} 是逐像素增益为 M 的 EMA，也可以看成把卡尔曼增益换成了一条手工规则，即 Eq.(1)：M=min(|I_n^t−I_n^{t−1}|/0.7+0.6, 1)。颜色变化大时，像素很可能在运动，相当于过程噪声大，增益接近 1；静止处的增益下限是 0.6。(2) TSDF 的 Eq.(10) s=Σ_k ω_k·clamp(s_k, −τ, τ) 是 K 个视角符号距离的加权和，它与归一化的加权平均同号，零交叉位置相同（s_k 的符号约定按 Starline 取“前方为正”，见上面的公式和 pitfalls）。权重由 Eq.(11)–(12) 给出：ω_k=min(0.001·(ν_k/49)^{−1/2}, 1)，其中 ν_k 是 7×7 邻域内截断平方深度差之和，(ν_k/49)^{1/2} 就是局部 RMS 深度波动 σ̂_k（单位为米），Starline 原文直接把它记作 σ_i。因此 ω_k=min(0.001/σ̂_k, 1)，是 1/σ 型的置信度，而不是理论最优的 1/σ²。(3) 附录 A.2 把上一帧渲染出的目标深度 𝒟^{t−1} 当作第 K+1 个测量加入 TSDF，权重为 ω_tmp^t=min(β·ω_acc^t·max(1−𝓜^t, 0), η)，其中 ω_acc^t=ω_tmp^{t−1}+Σ_k ω_k^{t−1}。这正是 Curless–Levoy/KinectFusion 式的“累积权重加上限”的递归加权平均：𝓜^t 在运动区把历史权重清零；由于掩码下限为 0.6，静止区的 max(1−𝓜^t, 0) 也最多只有 0.4；η=15 防止历史权重无限累积。注意这里的 β 与 Eq.1 中的 0.6 不是同一个参数，论文没有给出它的数值。(4) 在 Eq.(4)–(5) 中，前景图是 K 张前向渲染图按 α_k·w_k 做的归一化加权平均（原文分母漏写了 Σ），然后再与背景图按 w_BG 线性混合。如果不从 f-prob 的角度看，这些式子像是一堆互不相干的启发式；实际上它们都是“按置信度加权平均加递归”的变体。Sec. 4.5 Table 3 的消融也印证了 EMA 的作用：去掉时间滤波后 PSNR 基本不变（31.16 对 31.17），但 STED 从 68.76 变差到 89.62。滤波降低的是帧间方差，即改善了时间稳定性，而不是单帧误差。"}, "in_field_zh": "深度融合（KinectFusion、Fusion4D、Starline 的 image-based TSDF）；头部位姿预测与传感器融合（常用卡尔曼类滤波来补偿 motion-to-photon 延迟）；实时渲染中的时域抗锯齿（TAA，本质上是带重投影的 EMA）和视频去闪烁；3DGS/NeRF 中的 alpha 合成权重；以及为网络输出估计不确定性，再按置信度融合多视角的结果。", "resources": [{"title": "Barfoot, State Estimation for Robotics — Ch.2 Primer on Probability Theory (§2.2.6 Normalized Product of Gaussians); §3.3 Recursive Discrete-Time Filtering; §5.3 Handling Outliers", "url": "https://asrl.utias.utoronto.ca/~tdb/bib/barfoot_ser17.pdf", "type": "book", "note_zh": "作者提供的免费 PDF。§2.2.6“高斯的归一化乘积”就是逆方差融合的一般形式；§3.3 从 MAP、贝叶斯推断、增益优化几个角度推导卡尔曼滤波；§5.3 讲 RANSAC 和 M 估计。"}, {"title": "Welch & Bishop — An Introduction to the Kalman Filter (UNC TR 95-041)", "url": "https://homepages.inf.ed.ac.uk/rbf/CVonline/LOCAL_COPIES/WELCH/kalman.html", "type": "tutorial", "note_zh": "经典的入门讲义，讲清楚了预测—更新两步和增益的含义，最后一节用“估计一个随机常数”的数值例子演示 Q、R 的影响。这个链接是爱丁堡 CVonline 收录的 HTML 版本。"}, {"title": "How a Kalman filter works, in pictures (Tim Babb)", "url": "https://www.bzarg.com/p/how-a-kalman-filter-works-in-pictures/", "type": "blog", "note_zh": "用高斯分布的相乘和平移直观解释卡尔曼滤波，适合先读这篇建立直觉，再读推导。"}, {"title": "A Volumetric Method for Building Complex Models from Range Images (Curless & Levoy, SIGGRAPH 1996)", "url": "https://graphics.stanford.edu/papers/volrange/", "type": "paper", "note_zh": "TSDF 加权平均融合的原始论文，累积权重的思想就来自这里。建议与 Ha et al. 附录 A.1–A.2 对照阅读。"}, {"title": "Project Starline: A High-Fidelity Telepresence System (Lawrence et al., ACM TOG 40(6), SIGGRAPH Asia 2021) — “Raycasting for geometry fusion”", "url": "https://hhoppe.com/starline.pdf", "type": "paper", "note_zh": "Ha et al. image-based TSDF 的直接来源。这一段讲清了符号约定（前方为正）、2 cm 截断、s<−T 时权重置零以防 overcarving、0.8·s 步进加 3 步二分，以及 w=min(0.001/σ,1) 的置信度定义。读 Ha et al. 附录 A.1 时应对照这一段。"}], "self_check": [{"q_zh": "两台相机对同一点分别给出深度 2.00 m（σ=1 cm）和 2.06 m（σ=3 cm）。逆方差融合的结果是多少？标准差是多少？", "a_zh": "以 cm⁻² 为单位，权重分别为 1 和 1/9。ẑ=(2.00×1+2.06×1/9)/(1+1/9)≈2.006 m；标准差为 √(1/(1+1/9))=√0.9≈0.95 cm，比两个输入中较好的那个还小。"}, {"q_zh": "Ha et al. 的时间滤波在静止区每帧最多保留多少比例的历史深度？为什么说它是“短记忆”？如果想更强地降噪，要付出什么代价？", "a_zh": "因为 M≥0.6，每帧最多保留 40% 的历史深度。3 帧之前的测量权重已经不足 4%，按方差折算的等效样本数约 2.3 帧，稳态噪声的标准差只降到原来的约 0.65 倍，所以说它是短记忆。减小 M 能更强地降噪，但运动开始时会滞后，边缘会留下拖影，结果也会更依赖掩码能否准确检测运动。"}, {"q_zh": "卡尔曼增益 K 在什么情况下接近 1，什么情况下接近 0？把它对应到 Ha et al. 的掩码 M 上。", "a_zh": "过程噪声 Q 远大于测量噪声 R 时（场景在变化），K→1，完全相信新测量；Q 远小于 R 时（场景静止而测量噪声大），K→0，主要依赖历史估计。Ha et al. 的 M 在颜色变化大时趋近 1，相当于 Q 大；在静止区取下限 0.6，相当于 Q≈0.9R。区别只在于，它用颜色启发式代替了显式的噪声模型。"}], "prereqs": ["f-linalg"]}, "module": "module-M1", "walk": ["walk-ha-h4", "walk-ha-h5", "walk-ha-h7", "walk-ha-h9", "walk-ibrnet-ib10", "walk-enerf-en4", "walk-enerf-en5", "walk-enerf-en8", "walk-pixelsplat-ps7", "walk-pixelsplat-ps9", "walk-mvsplat-mv6", "walk-freesplat-fs5", "walk-freesplat-fs8", "walk-depthsplat-ds5"], "classics": ["classic-6", "classic-14", "classic-29", "classic-42", "classic-71", "classic-83", "classic-134"], "adv": ["adv-a-dynamic-4d", "adv-a-temporal-video", "adv-a-compression"], "prev": "concept-f-optim", "next": "concept-f-image", "readMin": 10}</script>
<script>
(function () {
  "use strict";
  // ================= lib: DOM, text and math helpers shared by every page =================
  // A page script defines rich(text) (inline cross-links); paras() and eqList() call it.
  var DATA;
