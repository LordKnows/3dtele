@font-face { font-family: "et-book"; font-weight: 400; font-style: normal; font-display: swap;

@font-face { font-family: "et-book"; font-weight: 700; font-style: normal; font-display: swap;

/* Notes pair Latin italic with upright Kai (the "italic ↔ 楷体" rule): the italic cut is registered as an upright

@font-face { font-family: "et-book-note"; font-weight: 400; font-style: normal; font-display: swap;

:root {
  --bg: #fffff8;
  --ink: #111111;
  --ink-2: #3c3c36;
  --muted: #74746a;
  --rule: #d8d6c8;
  --rule-2: #b9b6a4;
  --accent: #a8322d;
  --serif: "et-book", "Noto Serif SC", "Source Han Serif SC", "Songti SC", "STSong", "SimSun", Palatino, Georgia, serif;
  --note: "et-book-note", "LXGW WenKai", "Kaiti SC", "STKaiti", "KaiTi", "et-book", serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --side: clamp(12rem, 21vw, 17rem);
  --gap: 2.75rem;
  --main: calc(100% - var(--side) - var(--gap));
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161614; --ink: #e2e0d6; --ink-2: #c3c1b6; --muted: #979589; --rule: #34332e; --rule-2: #4d4b44; --accent: #e8836f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161614; --ink: #e2e0d6; --ink-2: #c3c1b6; --muted: #979589; --rule: #34332e; --rule-2: #4d4b44; --accent: #e8836f;
  color-scheme: dark;
}

/* ---------- base ---------- */
* { box-sizing: border-box; }
html { font-size: 16px; -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--serif); font-size: 1.15625rem; line-height: 1.85;
  font-kerning: normal; font-variant-numeric: lining-nums;
  /* Space between Chinese and Latin text where the source has none; squeeze adjacent CJK punctuation
     (text-spacing-trim applies the fonts' halt / chws features). Browsers without them keep the source spacing. */
  text-autospace: normal; text-spacing-trim: normal;
  overflow-wrap: break-word;
  padding-top: env(safe-area-inset-top, 0px);
}
[hidden] { display: none !important; }
a { color: inherit; text-decoration-line: underline; text-decoration-thickness: 1px; text-underline-offset: .18em; text-decoration-color: var(--rule-2); }
a:hover { color: var(--accent); text-decoration-color: currentColor; }
a:focus-visible, button:focus-visible, summary:focus-visible, label:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }
.skip { position: absolute; left: -999px; top: 0; }
.skip:focus { left: 1rem; top: .5rem; background: var(--bg); padding: .2rem .5rem; z-index: 60; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
p { margin: 0; }
p + p { margin-top: .9em; }

/* ---------- top bar ---------- */
.topbar { border-bottom: 1px solid var(--rule); }
.bar-in { max-width: 67rem; margin: 0 auto; padding: 0 1.5rem; display: flex; align-items: center; gap: 2.2rem; min-height: 3.1rem; }
.brand { font-size: 1rem; text-decoration: none; letter-spacing: .02em; white-space: nowrap; }
.site-nav { flex: 1; }
.menus { list-style: none; margin: 0; padding: 0; display: flex; gap: 1.6rem; }
.menu { position: relative; }
.menu-btn, .theme-btn, .burger {
  font-family: "et-book", var(--serif); font-variant-caps: all-small-caps; letter-spacing: .08em; font-size: 1.12rem;
  color: var(--ink-2); line-height: 3.1rem;
}
.menu-btn:hover, .theme-btn:hover, .burger:hover, .menu.open > .menu-btn { color: var(--accent); }
.menu.cur > .menu-btn { color: var(--ink); box-shadow: inset 0 -1px 0 var(--ink); }
.drop {
  display: none; position: absolute; left: -1rem; top: 100%; z-index: 40; min-width: 13rem;
  list-style: none; margin: 0; padding: .45rem 0; background: var(--bg); border: 1px solid var(--rule);
}
.menu.open > .drop { display: block; }
.drop a { display: block; padding: .15rem 1rem; text-decoration: none; font-size: 1.02rem; color: var(--ink-2); white-space: nowrap; }
.drop a:hover, .drop a:focus-visible { color: var(--accent); }
.drop a.cur { color: var(--ink); }
.drop a.cur::before { content: "›"; position: absolute; margin-left: -.7rem; color: var(--accent); }
.theme-btn { margin-left: auto; }
.burger { display: none; }

/* ---------- article column + margin ---------- */
main { display: block; }
.art { max-width: 67rem; margin: 0 auto; padding: 2.6rem 1.5rem 3rem; counter-reset: sidenote-counter; }
.art > *, .art section > * { width: var(--main); }
.art > section { width: 100%; }
.art .fullwidth { width: 100%; }
section { padding-top: .6rem; }

.crumbs { font-size: .86rem; color: var(--muted); letter-spacing: .01em; }
.crumbs a { color: var(--muted); text-decoration: none; }
.crumbs a:hover { color: var(--accent); }
.crumbs .sep { margin: 0 .45em; color: var(--rule-2); }
h1, h2, h3 { font-family: var(--serif); color: var(--ink); text-wrap: balance; }
h1 { font-size: 2.3rem; font-weight: 400; line-height: 1.3; margin: .9rem 0 0; letter-spacing: .01em; }
.subtitle { font-family: "et-book", var(--note); font-style: italic; font-size: 1.45rem; line-height: 1.3; color: var(--ink-2); margin-top: .35rem; }
.meta { font-size: .92rem; color: var(--muted); margin-top: 1.1rem; }
.meta a { color: var(--muted); }
h2 { font-size: 1.42rem; font-weight: 600; line-height: 1.4; margin: 2.6rem 0 .9rem; }
h3 { font-size: 1.12rem; font-weight: 600; line-height: 1.5; margin: 1.8rem 0 .5rem; }
h3 .used { font-family: var(--note); font-weight: 400; font-size: .86rem; color: var(--muted); margin-left: .6em; }

.epigraph { margin: 2.2rem 0 .6rem; }
.epigraph blockquote { margin: 0; padding: 0 0 0 1.6rem; border-left: 1px solid var(--rule-2); }
.epigraph p { font-family: var(--note); font-size: 1.12rem; line-height: 1.85; color: var(--ink-2); }

.art ol, .art ul { margin: .6rem 0 0; padding-left: 1.6em; }
.art li + li { margin-top: .45rem; }
li::marker { font-family: "et-book-osf", var(--serif); color: var(--muted); }

/* Equations: display math in the text column, scrolling sideways on narrow screens. */
.eqs { display: block; }
.eq + .eq { margin-top: 1.6rem; }
.math-block { overflow-x: auto; overflow-y: hidden; margin: .4rem 0 .6rem; padding: .2rem 0; font-size: 1rem; }
.math-block mjx-container { margin: 0 !important; }

/* ---------- side notes & margin notes (floated into the right margin) ---------- */
.sidenote, .marginnote {
  float: right; clear: right; position: relative;
  width: var(--side); margin-right: calc(-1 * (var(--side) + var(--gap))); margin-top: .3rem; margin-bottom: .6rem;
  font-family: var(--note); font-size: .88rem; line-height: 1.6; color: var(--ink-2); text-align: left;
  font-style: normal; font-weight: 400; letter-spacing: 0;
}
h3 .sidenote { margin-top: .2rem; }
.sidenote-number { counter-increment: sidenote-counter; }
.sidenote-number::after, .sidenote::before { font-family: "et-book-osf", var(--serif); position: relative; vertical-align: baseline; }
.sidenote-number::after { content: counter(sidenote-counter); font-size: .75rem; top: -.55em; left: .08em; color: var(--ink-2); }
.sidenote::before { content: counter(sidenote-counter) " "; font-size: .8rem; top: -.4em; }
.note-label { font-family: var(--serif); font-weight: 600; font-size: .82rem; color: var(--muted); margin-right: .5em; }
.marginnote .note-label { display: block; margin: 0 0 .1rem; }
input.margin-toggle { display: none; }
label.sidenote-number { display: inline; cursor: default; }
label.margin-toggle:not(.sidenote-number) { display: none; }

/* ---------- quiz, further reading, series ---------- */
.quiz details { margin-top: .3rem; }
.quiz summary { font-family: var(--note); font-size: .92rem; color: var(--muted); cursor: pointer; list-style: none; display: inline-block; }
.quiz summary::-webkit-details-marker { display: none; }
.quiz summary::before { content: "+ "; font-family: "et-book", var(--serif); }
.quiz details[open] summary::before { content: "− "; }
.quiz summary:hover { color: var(--accent); }
.quiz details > p { margin-top: .3rem; padding-left: 1rem; border-left: 1px solid var(--rule); color: var(--ink-2); }

/* Reference lists: a narrow label column (kind / year) and a hanging text column. */
.art ul.refs { list-style: none; padding-left: 0; }
.refs li { display: grid; grid-template-columns: 2.8rem minmax(0, 1fr); column-gap: .5rem; line-height: 1.6; }
.refs li > :not(.kind):not(.yr) { grid-column: 2; }
.refs .kind, .refs .yr { grid-column: 1; font-family: var(--note); font-size: .86rem; color: var(--muted); padding-top: .12rem; }
.refs .yr { font-family: "et-book-osf", var(--serif); font-size: .95rem; padding-top: .05rem; }
.refs .en { font-family: "et-book", var(--serif); font-style: italic; color: var(--muted); font-size: .92rem; line-height: 1.5; }
.refs .gloss { font-family: var(--note); font-size: .88rem; color: var(--ink-2); margin-top: .1rem; }
.art .refs li + li { margin-top: .75rem; }
.art .papers li + li { margin-top: .35rem; }
.refs.noleft li { grid-template-columns: minmax(0, 1fr); }
.refs.noleft li > * { grid-column: 1; }
.refs .used { font-family: var(--note); font-size: .82rem; color: var(--muted); margin-left: .5em; }
.refs.terms .plain-t { font-weight: 600; }
.refs.terms .en { display: inline; margin-left: .6em; }
.timeline li { line-height: 1.7; }
.art .timeline li + li { margin-top: .4rem; }

/* ---------- blocks: lede, run-in labels, notes ---------- */
.lede { margin-top: 1.6rem; color: var(--ink-2); }
.run-in { font-weight: 600; color: var(--ink); }
p.note { font-family: var(--note); font-size: .9rem; color: var(--muted); margin-top: .1rem; }
h2 .en, h3 .en { font-family: "et-book", var(--serif); font-style: italic; font-weight: 400; color: var(--muted); margin-left: .6em; font-size: .92em; }
h2 a, h3 a { text-decoration-color: var(--rule); }
.quiz-h { font-family: var(--note); font-size: .88rem; color: var(--muted); margin-top: 1.4rem; }
.quiz-h + ol.quiz { margin-top: .2rem; }

/* Index pages: a table of contents instead of a card grid. */
.art ol.toc { list-style: none; padding-left: 0; margin-top: .4rem; }
.art ol.toc > li + li { margin-top: .85rem; }
.toc-t { line-height: 1.55; }
.toc-t .en { font-family: "et-book", var(--serif); font-style: italic; color: var(--muted); margin-left: .6em; font-size: .95em; }
.toc-meta { font-family: var(--note); font-size: .82rem; color: var(--muted); margin-left: .7em; white-space: nowrap; }
.toc-s { font-family: var(--note); font-size: .9rem; line-height: 1.65; color: var(--ink-2); margin-top: .1rem; }
.toc-lede { font-family: var(--note); color: var(--ink-2); font-size: .95rem; }
h2.toc-h, h3.toc-h { margin-bottom: .3rem; }

/* Tables: booktabs rules (top, under the header, bottom), no vertical lines, no fills. */
.table-wrap { overflow-x: auto; margin: 1rem 0; }
table.booktabs { border-collapse: collapse; width: 100%; font-size: .9rem; line-height: 1.6; border-top: 1.5px solid var(--ink); border-bottom: 1.5px solid var(--ink); }
table.booktabs th { text-align: left; font-weight: 600; padding: .45rem .7rem .35rem 0; border-bottom: 1px solid var(--ink); white-space: nowrap; vertical-align: bottom; }
table.booktabs td { padding: .45rem .9rem .45rem 0; vertical-align: top; border-top: 1px solid var(--rule); }
table.booktabs tbody tr:first-child td { border-top: 0; }
table.rank td { white-space: nowrap; font-variant-numeric: tabular-nums; }
table.rank td:nth-child(2) { white-space: normal; }
.art table.kv { border-collapse: collapse; margin: .6rem 0; font-size: .95rem; width: auto; }
table.kv th { text-align: left; font-weight: 400; color: var(--muted); padding: .25rem 1.2rem .25rem 0; vertical-align: top; min-width: 5em; max-width: 12em; font-family: var(--note); }
table.kv td { padding: .25rem 0; vertical-align: top; }

/* Long articles: the table of contents sits at the top of the margin. */
/* It sits in a full-width section, so it floats into the margin without a negative offset. */
details.mtoc {
  float: right; clear: right; width: var(--side); margin-right: 0; margin-bottom: 1rem;
  font-family: var(--note); font-size: .86rem; line-height: 1.55; color: var(--ink-2);
}
details.mtoc summary { font-family: var(--serif); font-weight: 600; font-size: .82rem; color: var(--muted); list-style: none; cursor: default; }
details.mtoc summary::-webkit-details-marker { display: none; }
.art details.mtoc ol { list-style: none; padding: 0; margin: .3rem 0 0; }
.art details.mtoc li + li { margin-top: .25rem; }
details.mtoc a { text-decoration: none; }
details.mtoc a:hover { text-decoration: underline; }

/* Tools: search and filters with underlined inputs. */
.tool { margin-top: 1rem; }
.filters { display: flex; flex-wrap: wrap; gap: .6rem 1.6rem; align-items: baseline; font-family: var(--note); font-size: .92rem; color: var(--muted); }
.filters label { display: inline-flex; gap: .5rem; align-items: baseline; }
.filters input, .filters select {
  font: inherit; color: var(--ink); background: transparent; border: 0; border-bottom: 1px solid var(--rule-2); border-radius: 0;
  padding: .15rem .1rem; min-width: 7rem;
}
.filters input[type="search"] { min-width: 14rem; }
.filters select { max-width: 16rem; }
.filters input:focus, .filters select:focus { outline: none; border-bottom-color: var(--accent); }
.filters select option { background: var(--bg); color: var(--ink); }
.filters .count { margin-left: auto; font-family: var(--mono); font-size: .8rem; }
table.gl td.en { font-family: "et-book", var(--serif); width: 20%; }
table.gl .abbr { color: var(--muted); }
table.gl td.zh { white-space: nowrap; }
table.gl td.def { color: var(--ink-2); min-width: 20rem; }
table.gl td.c { font-size: .85rem; min-width: 9rem; padding-right: 0; }
table.gl tr:target td { background: color-mix(in srgb, var(--accent) 8%, transparent); }
table.db td.y { font-family: "et-book-osf", var(--serif); white-space: nowrap; }
table.db td.t { min-width: 16rem; }
table.db td.t small { display: block; color: var(--muted); font-size: .8rem; line-height: 1.45; margin-top: .15rem; }
table.db td.tags { min-width: 7rem; font-family: var(--note); font-size: .8rem; color: var(--muted); }
table.db td.tags span { display: block; }
table.db .tier.milestone { color: var(--ink); font-weight: 600; }
table.db td.s { min-width: 18rem; color: var(--ink-2); }
table.db td.n { min-width: 12rem; font-size: .82rem; color: var(--ink-2); }

/* Figures: the pipeline diagram and the timeline of classic papers, drawn in ink with one accent for interaction. */
figure { margin: 1.4rem 0; }
svg a { text-decoration: none; }
.diagram-wrap, .lanes-wrap { position: relative; overflow-x: auto; }
svg.diagram { width: 100%; min-width: 760px; height: auto; display: block; font-family: var(--note); }
svg.diagram .dnode rect { fill: var(--bg); stroke: var(--ink-2); stroke-width: 1; }
svg.diagram .dnode rect.data { stroke-dasharray: 4 3; }
svg.diagram .dnode:hover rect, svg.diagram .dnode:focus rect { stroke: var(--accent); stroke-width: 1.5; }
svg.diagram .dnode:focus { outline: none; }
svg.diagram text { fill: var(--ink); }
svg.diagram text.k { font-family: var(--mono); font-size: 10px; fill: var(--muted); }
svg.diagram text.t { font-family: var(--serif); font-size: 13px; font-weight: 600; }
svg.diagram text.s { font-size: 11px; fill: var(--ink-2); }
svg.diagram .dedge { fill: none; stroke: var(--ink-2); stroke-width: 1; }
svg.diagram .dedge.fb { stroke-dasharray: 4 3; }
svg.diagram .dhead { fill: var(--ink-2); }
svg.diagram .dloop { fill: none; stroke: var(--rule-2); stroke-dasharray: 2 3; }
svg.diagram .dlabel { font-size: 12px; fill: var(--muted); }
svg.diagram .dnote { font-size: 11px; fill: var(--muted); }
svg.diagram a.dnode:hover .dnote { fill: var(--accent); }
svg.lanes { width: 100%; min-width: 720px; height: auto; display: block; font-family: var(--note); }
svg.lanes .grid { stroke: var(--rule); stroke-width: 1; }
svg.lanes .axis { font-family: "et-book-osf", var(--serif); font-size: 12px; fill: var(--muted); }
svg.lanes .lane-l { font-size: 12px; fill: var(--ink-2); }
svg.lanes .brk { stroke: var(--muted); fill: none; }
svg.lanes .hit { fill: transparent; }
svg .dot { fill: var(--ink); }
svg .dot.hollow { fill: var(--bg); stroke: var(--ink-2); stroke-width: 1.2; }
svg.lanes a.m:hover .dot, svg.lanes a.m:focus .dot { fill: var(--accent); stroke: var(--accent); }
svg.lanes a.m:focus { outline: none; }
.vtip { position: absolute; z-index: 20; max-width: 20rem; padding: .45rem .7rem; background: var(--bg); border: 1px solid var(--rule-2); font-family: var(--note); font-size: .82rem; line-height: 1.5; pointer-events: none; }
.vtip b { display: block; font-family: "et-book", var(--serif); font-weight: 400; font-size: .92rem; }
.vtip small { display: block; color: var(--muted); }
.vtip span { color: var(--accent); }
figcaption { font-family: var(--note); font-size: .85rem; color: var(--muted); margin-top: .4rem; }
figcaption svg { vertical-align: -1px; }

.series { display: grid; grid-template-columns: 1fr auto 1fr; gap: 1rem; align-items: end; margin-top: 3.2rem; padding-top: 1rem; border-top: 1px solid var(--rule); font-size: .98rem; }
.series small { display: block; font-family: var(--note); font-size: .8rem; color: var(--muted); }
.series .up { text-align: center; font-size: .88rem; }
.series .up a { color: var(--muted); }
.series .next { text-align: right; }

.site-foot { max-width: 67rem; margin: 0 auto; padding: 1.2rem 1.5rem 2.5rem; font-size: .82rem; color: var(--muted); }
.site-foot a { color: var(--muted); text-decoration: none; }

/* ---------- hover preview ---------- */

ereo & plane sweep", "m": "Foundations · M3 深度估计与三维重建", "s": "把双目推广到 N 个视角：先假设一组深度（一叠平面），把所有视角 warp 到参考视角或目标视角，看哪个深度上各视角的颜色或特征最一致。", "n": "多视角立体（MVS）与平面扫描"}, "concept-d-stereo": {"u": "basics/foundations/d-stereo.html", "t": "双目立体匹配：从 SGM 到 RAFT-Stereo", "e": "Stereo matching: from SGM to RAFT-Stereo", "m": "Foundations · M3 深度估计与三维重建", "s": "在校正后的左右图同一行上找对应像素得到视差 d，再用 Z=fb/d 换算成深度。", "n": "双目立体匹配"}, "concept-g-depth": {"u": "basics/foundations/g-depth.html", "t": "深度、视差与逆深度采样", "e": "Depth, disparity & inverse-depth sampling", "m": "Foundations · M2 相机与多视几何", "s": "双目中深度与视差成反比（Z = f·b/d），所以固定的像素匹配误差会变成随 Z² 增长的深度误差。", "n": "深度、视差与逆深度采样"}, "concept-g-epipolar": {"u": "basics/foundations/g-epipolar.html", "t": "对极几何、三角化与单应", "e": "Epipolar geometry, triangulation & homography", "m": "Foundations · M2 相机与多视几何", "s": "两台相机看同一个点时，该点在第二张图中只可能出现在一条极线上（x'ᵀF x = 0）；有了对应点就能三角化出 3D 位置；空间中的一个平面在两张图之间诱导的映射是一个 3×3 单应。", "n": "对极几何、三角化与单应"}, "concept-l-cnn": {"u": "basics/foundations/l-cnn.html", "t": "卷积网络、残差块与 U-Net", "e": "CNNs, residual blocks & U-Net", "m": "Foundations · M6 深度学习基础（3D 视觉视角）", "s": "卷积用共享的小核在图像上滑动，提取局部特征；残差连接让深层网络容易训练；U-Net 用编码器下采样、解码器上采样和同尺度跳连，同时获得大感受野和像素级精度。", "n": "卷积网络、残差块与 U-Net"}, "concept-l-iterative": {"u": "basics/foundations/l-iterative.html", "t": "学习式迭代细化与展开优化", "e": "Learned iterative refinement & unrolled optimization", "m": "Foundations · M6 深度学习基础（3D 视觉视角）", "s": "做法是把“渲染当前估计 → 与观测比较 → 更新”这个迭代优化过程，展开成固定的几步，每步的更新量由神经网络给出，整体端到端训练。", "n": "学习式迭代细化与展开优化"}, "concept-v-temporal": {"u": "basics/foundations/v-temporal.html", "t": "时间一致性、闪烁与时域滤波", "e": "Temporal consistency, flicker & temporal filtering", "m": "Foundations · M8 视频、时间一致性、评测与系统", "s": "逐帧独立预测时，每帧误差互不相关，这些误差会直接表现为闪烁。", "n": "时间一致性、闪烁与时域滤波"}}, "page": {"id": "adv-a-learned-stereo", "head": {"title": "从深度立体匹配到立体基础模型", "sub": "Deep stereo to stereo foundation models", "meta": ["14 篇奠基论文"], "epigraph": "", "prereqs": [{"k": "concept-d-stereo"}, {"k": "concept-g-epipolar"}, {"k": "concept-g-depth"}, {"k": "concept-l-cnn"}, {"k": "concept-l-iterative"}], "lede": "", "minutes": 16}, "body": [{"b": "sec", "h": null, "id": "overview"}, {"b": "p", "t": "双目立体匹配处理的是一对已经做过立体校正（rectification）的左右图像。对左图的每个像素，要在右图的同一行上找到对应点，两者的水平位移就是视差 d。已知以像素计的焦距 f 和两相机光心间的基线 B（米）时，深度为 Z = fB/d。难点有两层。第一，弱纹理、重复纹理、反光和遮挡区域没有可靠的匹配信号。第二，把视差误差换算成深度误差时，误差与 Z² 成正比，越远越不准。传统做法（见 d-stereo）是“代价计算 → 代价聚合 → SGM 全局优化 → 后处理”，每一步都依赖手工设计。对 3D telepresence 来说，深度是整个系统的前端：Ha et al. 在 DyNeRF 和 Google Spaces 上的整条几何链路（逐像素高斯、时间滤波、image-based TSDF）都建立在 RAFT-Stereo 输出的逐视角深度之上（ScanNet 则直接用传感器深度）。\n\n深度学习分三波改写了这条流水线。第一波（2015–2019）先只学习匹配代价：MC-CNN 用 CNN 判断两个图像块是否匹配，后面仍接 SGM 等手工步骤。随后 GC-Net（ICCV 2017）把整条流水线做成端到端可微。它把左右特征沿每个候选视差拼接，得到 H×W×D×F 的四维代价体（cost volume），用 3D 卷积做学习式的代价聚合，最后用 soft argmin 把每个像素的代价分布变成亚像素视差。PSMNet 在此基础上加入空间金字塔池化和堆叠 hourglass；GwcNet 用分组相关（group-wise correlation）压缩代价体。这一代方法有三个共性：显存随 H·W·D 增长；必须预设最大视差（如 192）；先在 SceneFlow 合成数据上预训练，再到 KITTI 等目标域微调。\n\n第二波是 2021 年 RAFT-Stereo 带来的迭代细化范式。它不再用 3D 卷积一次性正则化整块代价体，而是只沿水平极线计算一次所有像素对的相关，得到 H×W×W 的三维体。之后用多级 ConvGRU 反复执行“在当前视差附近查相关表、预测一个增量”，推理时通常迭代 32 次（ETH3D 结果用 80 次，迭代次数在推理时可以随意增加而不增加显存）。这种做法没有固定的视差上限，显存小，精度高：发表时在 Middlebury 和 ETH3D 上排名第一，还有一个在 KITTI 分辨率（1248×384）上达到 26 FPS 的实时变体。之后的 CREStereo（级联循环结构加自适应分组相关，针对手机上不理想的校正）和 IGEV-Stereo（先用轻量 3D 正则化得到几何编码体和较好的初值，再做 GRU 迭代）都沿着这条路发展。Ha et al.（CVPR 2025）在 DyNeRF 和 Google Spaces 上使用的正是 RAFT-Stereo。\n\n第三波是 2025 年出现的立体基础模型，以及视频立体。FoundationStereo 用 100 万对路径追踪合成的立体图像训练，并自动剔除有歧义的样本；它还通过 side-tuning 把冻结的 Depth Anything V2 单目特征注入立体网络。在训练中不接触任何目标域数据的零样本设定下，它在 Middlebury 上的 BP-2（视差误差大于 2 像素的像素百分比）从同设定下此前最好的 7.5 降到 1.1。代价是速度：论文自报在 A100 上处理 375×1242 约需 0.7 s。Fast-FoundationStereo（arXiv 2025-12，CVPR 2026）用蒸馏、分块 NAS 和结构化剪枝提速 10 倍以上，Middlebury-Q 在 RTX 3090 上约 49 ms，TensorRT 下约 21 ms（同一设置下 FoundationStereo 为 496 ms）。时间一致性方面，DynamicStereo（CVPR 2023）较早用跨帧注意力减轻学习式立体在视频上的闪烁，并发布了 Dynamic Replica 数据集。Stereo Any Video（ICCV 2025）利用冻结的 Video Depth Anything 特征，并提出跨 3 帧的时间凸上采样，在 Sintel Final 上把时间端点误差 TEPE 从 RAFT-Stereo 的 2.09 降到 1.07。\n\n截至 2026 年 9 月，零样本精度问题已大体被基础模型解决，实时化正在靠蒸馏解决。但“多对输入、1080p、时间一致、带可靠不确定度”这几个要求，还没有哪个实时模型能同时满足。telepresence 的特殊之处在于三点：每帧都要为 K 个输入视角各算一张深度（Ha et al. 取 K=4）；深度在物体边缘出错会直接变成渲染中的飞点（flying pixels）；逐帧独立估计会表现为闪烁。Project Starline 走的是另一条路：每个捕获舱用一对 1280×1024 近红外相机拍摄投射的图案（180 Hz），再用非学习的时空立体算法 ESPReSSo（3DV 2018）以 60 fps 输出深度。学完本专题，才能判断 Ha et al. 中“深度估计不计入运行时间”“颜色差分掩码滤波”“TSDF 截断取 2 cm”这些设计背后的真实代价。"}, {"b": "sec", "h": "核心思想", "id": "key-ideas"}, {"b": "h3", "t": "代价体与 soft argmin：把“找对应”变成可微的体数据处理"}, {"b": "p", "t": "直觉是这样的：对左图每个像素，把“视差分别为 0、1、…、D−1 时右图对应特征有多像”排成一列，所有像素合起来就是一个 H×W×D 的“相似度立方体”，深度估计变成在每一列里找代价最低的位置。GC-Net 用 3D 卷积在这个立方体里同时沿空间和视差方向聚合上下文，再用 soft argmin 得到可微的亚像素视差：先对负代价做 softmax 得到概率，再求视差的期望。代价体有三种构造方式：特征拼接（GC-Net，信息最全，体积最大）；全相关（DispNet-C，只剩 1 个通道）；分组相关（GwcNet，把通道分成若干组、逐组做相关，是两者的折中）。需要注意，soft argmin 求的是期望而不是众数。在前景和背景交界处，概率分布是双峰的，期望值会落在两者之间，GC-Net 论文自己也指出它对多峰分布敏感。这是深度图中飞点的主要来源之一。"}, {"b": "h3", "t": "相关查表加循环迭代：RAFT-Stereo 范式"}, {"b": "p", "t": "RAFT-Stereo 先在 1/4 或 1/8 分辨率上，对左右特征计算同一行上所有像素对的点积，再沿最后一维做平均池化，得到 4 级相关金字塔。每次迭代时，GRU 以当前视差为中心，从各级金字塔中取出一个小窗口的相关值，结合上下文特征和隐藏状态输出一个视差增量。多级分辨率的 GRU 让信息能在大范围内传播。训练使用逐次加权的 L1 损失（γ=0.9），训练时迭代 16–22 次；论文的消融和 Middlebury 提交在推理时迭代 32 次，ETH3D 结果和零样本泛化表用 80 次。GRU 权重在各次迭代间共享，所以推理时多迭代几次只增加时间、不增加显存。最后用“3×3 粗分辨率邻居的凸组合”上采样到全分辨率，以保住边缘。这是学习式迭代细化（l-iterative）的典型例子，与 Quark 的 render-and-refine 思路相同、做法不同：RAFT 迭代的对象是视差，依据是相关查表；Quark 迭代的对象是 LDM，依据是把当前结果渲染回输入视角后与观测之间的残差。"}, {"b": "h3", "t": "大规模合成数据与零样本泛化"}, {"b": "p", "t": "真实场景的稠密视差真值极难获得（KITTI 只有稀疏的 LiDAR 真值），所以学习式立体几乎都先在合成数据上训练。Mayer et al.（CVPR 2016）发布的 SceneFlow 三件套（FlyingThings3D、Monkaa、Driving）是第一代标准预训练集。CREStereo 专门合成了细结构、校正不理想等难例。FoundationStereo 用 NVIDIA Omniverse 路径追踪生成了 100 万对 FSD 数据，并迭代剔除 BP-2 大于 60% 的歧义样本。“只在合成数据上训练、直接在真实数据上测试”的零样本设定，已成为衡量泛化能力的标准协议。对 telepresence 要注意，这些数据里近距离的人脸、头发、眼镜都很少，FoundationStereo 也承认训练集中透明物体有限。"}, {"b": "h3", "t": "单目先验注入：从“只会匹配”到“匹配加理解”"}, {"b": "p", "t": "纯匹配在无纹理墙面、反光区域和遮挡区域没有信号，而单目深度模型（如 Depth Anything V2，见 d-mono）能凭语义给出合理的相对形状。FoundationStereo 的做法叫 side-tuning：冻结 DAv2-L 的 ViT，用一个 CNN 在 1/4 分辨率上把它的特征与立体特征拼接。代价体由 8 组分组相关加特征拼接构成，再用轴向—平面卷积（APC）和只沿视差维做注意力的 Disparity Transformer 进行过滤。MonSter/MonSter++ 则让单目分支和立体分支互相校正尺度、互相补足病态区域。零样本结果（论文 Table 2，训练时不接触任何目标域数据）：Middlebury BP-2 为 1.1，ETH3D BP-1 为 0.5，KITTI-12 D1 为 2.3，KITTI-15 D1 为 2.8；同样允许用多个数据集训练的 Selective-IGEV* 分别为 7.5、3.4、3.2、4.5。即使只用 SceneFlow 训练，FoundationStereo 也有 5.5、1.8、3.2、4.9，优于同设定下所有对比方法，说明单目先验本身贡献了很大一部分泛化能力。"}, {"b": "h3", "t": "实时化的两条路：少建代价体，或压缩大模型"}, {"b": "p", "t": "第一条是改结构。HITNet（Google，CVPR 2021）不建完整的代价体，而是用带斜率的平面 tile 假设做多分辨率初始化和传播；发表时，在耗时低于 100 ms 的已发表方法中，它在 KITTI 上排第一。RAFT-Stereo 的实时变体让特征与上下文编码器共享一个骨干，只保留 1/8 和 1/16 两级 GRU，并采用慢快交替（slow-fast）的迭代调度，在 KITTI 分辨率（1248×384）上达到 26 FPS，零样本 KITTI-15 D1 为 5.91。第二条是压缩大模型。Fast-FoundationStereo 把 FoundationStereo 的混合骨干蒸馏成单一骨干，用分块 NAS 搜索代价过滤结构，并剪枝迭代模块，在 Middlebury-Q 上约 49 ms（RTX 3090）或 21 ms（TensorRT），峰值显存 0.63 GB。Project Starline 则选择了非学习的 ESPReSSo：近红外图案投射加时空立体，用主动照明降低找匹配的难度。Quark 的作者之一 Supreeth Achar 也是 ESPReSSo 的作者。"}, {"b": "h3", "t": "视频立体与时间一致性"}, {"b": "p", "t": "逐帧独立的立体网络即使每一帧都准确，相邻帧之间在弱纹理处也会出现亚像素级的来回跳动，换算成深度就是闪烁（见 v-temporal）。DynamicStereo 用分离的时空注意力汇聚相邻帧的信息，并发布了 Dynamic Replica（扫描环境中的人和动物的合成视频）作为训练集和基准。Stereo Any Video 用冻结的 Video Depth Anything 特征提供时间上稳定的先验，提出在两个搜索窗口内计算所有点对相似度的 all-to-all-pairs 相关，以及跨 3 帧、共 27 个低分辨率邻居的时间凸上采样。评价指标是时间端点误差 TEPE：在 Sintel Final 上，Stereo Any Video 为 1.07，DynamicStereo 为 1.43，RAFT-Stereo 为 2.09。代价同样明显：在 A6000 上处理 20 帧 720×1280 需要 41.1 GB 显存。Ha et al. 用“颜色差分掩码递归滤波”在网络外部近似完成同样的事。"}, {"b": "h3", "t": "从视差误差到深度误差：为什么远处总是更差"}, {"b": "p", "t": "对 Z = fB/d 求导得 δZ ≈ Z²/(fB)·δd：同样 0.25 像素的视差误差，距离翻倍时深度误差变为 4 倍。这条关系影响三件事。一是基线的选择：B 越大越准，但遮挡更多、匹配更难。二是 TSDF 截断距离：它本应随深度变化。三是它说明了 Quark 把 LDM 的层按等视差而不是等深度放置的合理性（论文没有单独论证这一点）：等视差间隔在相邻视角图像上对应近似相等的像素位移，也就是相等的匹配难度（见 g-depth）。"}, {"b": "h3", "t": "读懂立体评测指标：EPE、BP-X、D1 与 TEPE"}, {"b": "p", "t": "论文表格里的数字大多来自四个指标，都在视差域（像素）上计算。EPE（end-point error）是所有有效像素视差绝对误差的平均值。BP-X（bad pixel）是视差误差大于 X 像素的像素百分比，Middlebury 常用 BP-2，ETH3D 常用 BP-1。D1 是 KITTI 的指标：误差同时大于 3 像素且大于真值 5% 的像素百分比；D1-all 统计全部像素，D1-bg 和 D1-fg 分别只统计背景和前景。TEPE（temporal EPE）比较的是相邻两帧预测视差的变化量与真值变化量之差，衡量闪烁而不是单帧精度。数值例：一张 100 万像素的视差图里若有 1.1 万个像素误差超过 2 px，BP-2 就是 1.1%，这正是 FoundationStereo 在 Middlebury 上的水平。要注意两点：换到深度域后误差按 Z² 放大（见下面第一个公式）；这些指标都是全图平均，对少量边缘飞点不敏感，而飞点恰恰决定了渲染质量。"}, {"b": "sec", "h": "关键公式", "id": "equations"}, {"b": "eqs", "eqs": [{"tex": "Z = \\frac{f\\,B}{d}, \\qquad \\delta Z \\approx \\frac{Z^{2}}{f\\,B}\\,\\delta d", "explain_zh": "直觉：视差是同一个三维点在两台相机里横向错开的像素数，点越远，错开越少。符号：Z 为深度（米）；f 为以像素计的焦距；B 为两相机光心之间的基线（米）；d 为视差（像素）；δd 为视差估计误差（像素）；δZ 为由此造成的深度误差（米）。第二式由第一式对 d 求导得到。数值例：设 f=1400 px、B=0.2 m。Z=2 m 时 d=140 px，δd=0.25 px 对应 δZ≈4/280×0.25≈3.6 mm；Z=8 m 时 d=35 px，同样的 δd 对应 δZ≈64/280×0.25≈5.7 cm。后者远大于 Ha et al. TSDF 使用的固定截断 τ=0.02 m，说明固定的公制截断对远处背景偏紧。这与 Ha et al. 在户外数据集 ENeRF-Outdoor 上 PSNR 输给 ENeRF（24.01 对 25.79）的现象一致，但论文本身没有做这项归因，这里只是一种可能的解释。"}, {"tex": "\\hat{d}(u,v) = \\sum_{d=0}^{D_{\\max}} d \\cdot \\sigma\\big(-c_{d}(u,v)\\big)", "explain_zh": "GC-Net 的 soft argmin。直觉：用加权平均代替不可微的“取最小”。符号：c_d(u,v) 是像素 (u,v) 在候选视差 d 下经 3D 卷积聚合后的代价，越小越匹配；σ(·) 是沿视差维的 softmax，把 −c 变成概率 p_d；D_max 是最大候选视差（GC-Net 在 SceneFlow 上用 192）；\\hat d 是概率加权的期望视差，可微且可以达到亚像素精度。数值例：设 f=1400 px、B=0.2 m，人物在 1 m 处（d=280 px），背后的墙在 4 m 处（d=70 px）。在轮廓像素上，如果网络给两者各 0.5 的概率，\\hat d=175 px，对应 Z=1.6 m，这是一个悬在人背后 60 cm 空中的点。这种点在 Ha et al. 中会被变成一个完全不透明的像素级高斯；Ha et al. 选择逐视角分别 splat，再由融合网络在 TSDF 深度引导下取舍，就是为了压制飞点（Fig. 4）。Quark 的 LDM 每个像素保留多层（最终 6 层），可以一层放在人身上、一层放在墙上，再用 density 表达“部分属于前景”，从表示上避开了单峰平均的问题。"}, {"tex": "\\mathbf{C}_{ijk} = \\sum_{h} \\mathbf{f}_{ijh}\\,\\mathbf{g}_{ikh}, \\qquad \\mathbf{d}^{(n+1)} = \\mathbf{d}^{(n)} + \\Delta\\mathbf{d}^{(n)}, \\qquad \\mathcal{L} = \\sum_{n=1}^{N} \\gamma^{N-n} \\big\\lVert \\mathbf{d}_{gt} - \\mathbf{d}^{(n)} \\big\\rVert_{1}", "explain_zh": "RAFT-Stereo 的三个核心式子。f 和 g 分别是左图和右图的特征图（1/4 或 1/8 分辨率）；i 为行号，j 为左图列号，k 为右图列号，h 为特征通道。C_ijk 是左图像素 (i,j) 与右图同一行像素 (i,k) 的相似度。校正后对应点只可能落在同一行，所以相关体是 H×W×W，而不是光流所需的 H×W×H×W。d^(n) 是第 n 次迭代后的视差图；增量 Δd^(n) 由 GRU 预测，输入是以 d^(n) 为中心从相关金字塔取出的局部相关值、上下文特征和隐藏状态。N 为迭代次数，γ=0.9 让靠后的迭代权重更大，d_gt 为真值视差。数值例：若在 Ha et al. 的 DyNeRF 分辨率 1352×1014 上运行，特征取 1/4 分辨率（338×254），相关体有 254×338×338≈2.9×10⁷ 个元素，fp32 约 116 MB。若像光流那样做二维全对相关，则约有 7.4×10⁹ 个元素（约 30 GB）。极线约束在这里带来了两个数量级的节省。"}]}, {"b": "sec", "h": "演进", "id": "evolution"}, {"b": "timeline", "items": [[2015, "MC-CNN（CVPR 2015 初版，JMLR 2016 扩展版）用 CNN 学习图像块匹配代价，后接 SGM 等手工步骤，在 KITTI 和 Middlebury 上超越手工代价"], [2016, "Mayer et al.（CVPR 2016）发布 SceneFlow 合成数据集与 DispNet，端到端视差回归和“合成数据预训练”成为标准做法"], [2017, "GC-Net 提出拼接式四维代价体、3D 卷积聚合和 soft argmin，开启端到端深度立体"], [2018, "PSMNet 引入空间金字塔池化与堆叠 hourglass；同年 ESPReSSo 实现实时时空立体，后来被 Project Starline 用于近红外深度"], [2019, "GwcNet 提出分组相关代价体，在紧凑性和信息量之间折中"], [2021, "RAFT-Stereo 提出相关查表加多级 GRU 迭代，在 Middlebury 和 ETH3D 上第一；HITNet 不建完整代价体，实现实时立体；Project Starline（SIGGRAPH Asia 2021）用 ESPReSSo 主动近红外时空立体为 telepresence 原型系统实时提供深度"], [2022, "CREStereo 面向手机等设备上的非理想校正，采用级联循环网络和难例合成数据"], [2023, "IGEV-Stereo 用几何编码体为 GRU 提供好的初值；DynamicStereo 与 Dynamic Replica 推动学习式立体视频的时间一致性研究"], [2025, "FoundationStereo 以 100 万对合成数据和 DAv2 side-tuning 实现强零样本立体；Stereo Any Video 用视频深度先验实现时间一致的立体；Ha et al.（CVPR 2025）仍以 RAFT-Stereo 作为几何前端"], [2025, "Fast-FoundationStereo（12 月 arXiv，CVPR 2026）首次在实时帧率下实现零样本泛化（TensorRT 约 21 ms）"], [2026, "Lite Any Stereo V2 等工作继续压缩零样本立体的延迟，开始面向 Orin 等嵌入式平台"]]}, {"b": "sec", "h": "奠基论文", "id": "papers"}, {"b": "refs", "items": [{"left": "必读", "url": "https://arxiv.org/abs/2109.07547", "t": "RAFT-Stereo: Multilevel Recurrent Field Transforms for Stereo Matching", "sub": "Lahav Lipson et al. · 3DV 2021 · 2021 · 引用 731", "gloss": "把光流网络 RAFT 改造成立体匹配网络：只沿极线计算 H×W×W 的全对相关并建 4 级金字塔，多级 ConvGRU 迭代更新视差（推理通常 32 次），用凸上采样保住边缘。发表时在 Middlebury 和 ETH3D 上第一，并有 KITTI 分辨率 26 FPS 的实时变体。Ha et al. 的逐视角深度就是由它生成的，要读懂锚点 B 的几何前端必须读这篇。"}, {"left": "必读", "url": "https://arxiv.org/abs/1703.04309", "t": "End-to-End Learning of Geometry and Context for Deep Stereo Regression", "sub": "Alex Kendall et al. · ICCV 2017 · 2017 · 引用 1.6k", "gloss": "GC-Net，第一个端到端的深度立体网络：把左右特征拼接成四维代价体（SceneFlow 上 D=192），用 3D 卷积编码器—解码器聚合上下文，用 soft argmin 得到可微的亚像素视差；KITTI 2015 D1-all 为 2.87%。“代价体 + soft argmin”这一组合此后被 PSMNet、MVSNet、ENeRF 等沿用。"}, {"left": "必读", "url": "https://arxiv.org/abs/2501.09898", "t": "FoundationStereo: Zero-Shot Stereo Matching", "sub": "Bowen Wen et al. · CVPR 2025 · 2025 · 引用 285", "gloss": "立体基础模型的代表作，有三项关键设计：100 万对路径追踪合成数据，并自动剔除歧义样本；冻结 Depth Anything V2 的 side-tuning 特征；轴向—平面卷积加视差维 Transformer 的混合代价过滤。零样本 Middlebury BP-2 为 1.1（同设定下此前最好为 7.5），ETH3D BP-1 为 0.5。缺点是慢（A100 上 375×1242 约 0.7 s）。"}, {"left": "建议", "url": "https://arxiv.org/abs/1512.02134", "t": "A Large Dataset to Train Convolutional Networks for Disparity, Optical Flow, and Scene Flow Estimation", "sub": "Nikolaus Mayer et al. · CVPR 2016 · 2016 · 引用 3.1k", "gloss": "发布 FlyingThings3D、Monkaa、Driving 三个合成立体视频数据集（首批可用于训练场景流的大规模数据集），并提出实时视差网络 DispNet。“先在 SceneFlow 上预训练”从此成为学习式立体的标准流程，也是今天零样本评测中对训练集的默认约定。"}, {"left": "建议", "url": "https://arxiv.org/abs/1803.08669", "t": "Pyramid Stereo Matching Network", "sub": "Jia-Ren Chang, Yong-Sheng Chen · CVPR 2018 · 2018 · 引用 1.9k", "gloss": "PSMNet：在 GC-Net 基础上加入空间金字塔池化，聚合多尺度上下文；用带中间监督的堆叠 hourglass 3D CNN 正则化代价体。2018 年 3 月前在 KITTI 2012/2015 上第一，是“3D 代价体”时代最常用的基线和代码库。"}, {"left": "建议", "url": "https://arxiv.org/abs/1510.05970", "t": "Stereo Matching by Training a Convolutional Neural Network to Compare Image Patches", "sub": "Jure Žbontar, Yann LeCun · JMLR 17 (2016) · 2016 · 引用 1.5k", "gloss": "MC-CNN：首次用 CNN 学习图像块相似度作为匹配代价（提供快速版和精确版两种结构），后面仍接交叉聚合、SGM、左右一致性检查等传统步骤，在 KITTI 和 Middlebury 上超越手工代价。它标志着“学习代价、传统优化”这一过渡阶段。"}, {"left": "建议", "url": "https://arxiv.org/abs/2303.06615", "t": "Iterative Geometry Encoding Volume for Stereo Matching", "sub": "Gangwei Xu et al. · CVPR 2023 · 2023 · 引用 429", "gloss": "IGEV-Stereo 指出 RAFT 式的全对相关缺少非局部几何信息。它先用轻量 3D 网络正则化得到几何编码体（GEV）并回归出较好的初值，再把 GEV 与全对相关合并，供 ConvGRU 迭代查表，因此收敛更快。在 KITTI 2015 和 KITTI 2012（反光区域）上第一，并扩展到了 MVS（IGEV-MVS）。"}, {"left": "建议", "url": "https://arxiv.org/abs/2305.02296", "t": "DynamicStereo: Consistent Dynamic Depth from Stereo Videos", "sub": "Nikita Karaev et al. · CVPR 2023 · 2023 · 引用 163", "gloss": "较早系统研究学习式立体在视频上的时间一致性，明确以 AR/VR 中闪烁严重影响体验为动机。Transformer 用分离的时空注意力汇聚相邻帧信息；同时发布 Dynamic Replica 合成数据集（扫描环境中的人和动物），作为训练集和一致性基准。"}, {"left": "建议", "url": "https://arxiv.org/abs/2503.05549", "t": "Stereo Any Video: Temporally Consistent Stereo Matching", "sub": "Junpeng Jing et al. · ICCV 2025 · 2025 · 引用 10", "gloss": "用冻结的 Video Depth Anything 特征提供时间稳定的先验，提出 all-to-all-pairs 相关和跨 3 帧的时间凸上采样；零样本 Sintel Final TEPE 为 1.07（DynamicStereo 1.43，RAFT-Stereo 2.09）。它可以从源头替代 Ha et al. 的“逐帧 RAFT-Stereo + 差分掩码滤波”，但处理 20 帧 720×1280 需要 41.1 GB 显存。"}, {"left": "选读", "url": "https://arxiv.org/abs/1903.04025", "t": "Group-wise Correlation Stereo Network", "sub": "Xiaoyang Guo et al. · CVPR 2019 · 2019 · 引用 738", "gloss": "GwcNet 提出分组相关代价体：把特征通道分组后逐组做相关，兼顾全相关的紧凑和拼接的信息量，并改进了 3D hourglass。FoundationStereo 等后续模型仍在使用分组相关。"}, {"left": "选读", "url": "https://arxiv.org/abs/2203.11483", "t": "Practical Stereo Matching via Cascaded Recurrent Network with Adaptive Correlation", "sub": "Jiankun Li et al. · CVPR 2022 · 2022 · 引用 418", "gloss": "CREStereo 面向手机等消费级设备上的实用立体匹配：分层循环网络由粗到细更新视差，推理时采用级联结构；自适应分组相关层用于抵抗校正误差；另外构建了难例合成数据集。在 Middlebury 和 ETH3D 上第一。它对校正误差鲁棒的设计，对自己搭建相机阵列很有参考价值。"}, {"left": "选读", "url": "https://arxiv.org/abs/2512.11130", "t": "Fast-FoundationStereo: Real-Time Zero-Shot Stereo Matching", "sub": "Bowen Wen et al. · CVPR 2026（arXiv 2025-12） · 2025 · 引用 29", "gloss": "用知识蒸馏、分块神经结构搜索和结构化剪枝，把 FoundationStereo 提速 10 倍以上，并用 140 万对真实图像的伪标签补充训练。Middlebury-Q 上约 49 ms（RTX 3090）或 21 ms（TensorRT），同一设置下 FoundationStereo 为 496 ms，首次在实时帧率下实现强零样本泛化，是把立体深度纳入 telepresence 实时预算的现实选项。"}, {"left": "选读", "url": "https://arxiv.org/abs/2007.12140", "t": "HITNet: Hierarchical Iterative Tile Refinement Network for Real-time Stereo Matching", "sub": "Vladimir Tankovich et al. · CVPR 2021 · 2021 · 引用 308", "gloss": "Google 的实时立体网络，代表“不建完整代价体”的实时路线：多分辨率初始化后，用带斜率的平面 tile 假设做可微的 2D 传播和 warping，逐级细化视差。发表时在耗时低于 100 ms 的已发表方法中，KITTI 2012/2015 排第一；在 ETH3D 上各项指标排 1–3 名。读它可以理解实时立体为了省掉 3D 代价体做了哪些取舍，也是理解 Fast-FoundationStereo、Lite Any Stereo 等后续实时模型的参照。"}, {"left": "选读", "url": "https://doi.org/10.1109/3DV.2018.00072", "t": "ESPReSSo: Efficient Slanted PatchMatch for Real-time Spacetime Stereo", "sub": "Harris Nover, Supreeth Achar, Dan B Goldman · 3DV 2018 · 2018 · 引用 7", "gloss": "非学习的实时主动时空立体：投射近红外图案，在空间和时间窗口上做带斜率的 PatchMatch。引用数不高，但它是 Project Starline 捕获舱的深度算法（Starline 论文写明沿用了它的分辨率、帧率和算法）；Ha et al. 的 image-based TSDF 正是沿用 Starline 的融合方式。第二作者 Supreeth Achar 也是 Quark 的作者。它提醒读者：在 telepresence 这种可控环境里，主动照明是绕开弱纹理难题的现实选项。"}]}, {"b": "sec", "h": "争论与分歧", "id": "debates"}, {"b": "ul", "items": ["代价体加 3D 卷积、相关查表加迭代、纯注意力匹配（STTR、Unimatch），哪条路线最能随数据和算力扩展？FoundationStereo 仍然保留代价体和 GRU，说明到 2025 年显式匹配结构还没有被纯 Transformer 取代，但这个结论可能随数据规模变化。", "合成数据够不够：FoundationStereo 靠 100 万对合成数据实现零样本泛化，Fast-FoundationStereo 又补充了 140 万对真实图像的伪标签。伪标签会不会把教师模型的系统误差（比如边缘过度平滑）固化下来？", "被动 RGB 立体、主动红外立体（Starline 的 ESPReSSo）还是 ToF 传感器？主动方案在弱纹理区可靠、延迟可控，但增加了硬件成本，也怕阳光干扰；纯 RGB 方案硬件简单，但要依赖大模型和 GPU 预算。", "显式深度是不是必需的：Ha et al. 先估深度再融合，Quark 完全不输入深度也拿到了更高的单帧质量。对 NVS 而言，逐视角深度的 EPE、D1 指标与最终画质、时间稳定性之间是什么关系，目前并不清楚。", "基准指标（EPE、D1、BP-2）只衡量单帧误差，反映不了飞点、边缘锐度和闪烁，而这些恰恰决定渲染质量。TEPE 这类时间指标才刚刚开始被采用。"]}, {"b": "sec", "h": "开放问题", "id": "open-questions"}, {"b": "ul", "items": ["多对、1080p、时间一致的实时深度：要为 4–8 台相机同时输出时间稳定的深度，总预算在 10–20 ms 量级。现有实时模型都是单对、逐帧的；视频立体模型离实时还很远（Stereo Any Video 在 A6000 上处理 20 帧 720p 需要 41.1 GB 显存）。", "边缘与多峰：怎样让立体网络在遮挡边界输出双峰或分层的深度，而不是单一期望值，从源头消除飞点，并以低成本传给下游的 splat 或 TSDF。", "不确定度：怎样输出经过校准的逐像素置信度，替代 Ha et al. 的 7×7 局部方差启发式，让融合网络在不可靠区域退回纯图像混合。", "非校正、宽基线、异构相机：telepresence 阵列里的相机未必成对平行，做校正会损失视场。Unimatch 这类带位姿的非校正立体方法或 MVS 方法，能否在实时预算内取代“选对 + 校正”？", "近距离人体的难例：头发、眼镜、皮肤高光、快速手势。现有合成数据覆盖不足，FoundationStereo 也承认透明物体有限。", "怎样用下游指标（渲染 PSNR/LPIPS、STED 等时间一致性指标）而不是 EPE 来训练和评估深度前端，实现深度与渲染的端到端联合优化。"]}, {"b": "sec", "h": "与重点论文的关系", "id": "relation"}, {"b": "p", "t": "与 Ha et al. 的关系最直接：它的整条几何分支都以立体深度为输入。Sec. 3 写明逐视角深度来自立体算法 RAFT-Stereo；Sec. 4 的实现细节和附录 A.5 进一步说明，对 DyNeRF 和 Google Spaces 这类固定阵列，RAFT-Stereo 是“在人工挑选的图像对上”运行的；ScanNet 则用传感器深度。这一步的耗时没有计入 Table 4 的约 39 ms（TensorRT，1352×1014，K=4）。学完本专题，至少能看清四件事。(1) 为什么要“人工挑选图像对”：RAFT-Stereo 只处理校正后的双目，必须为每台相机找一个基线合适、视场重叠大的伙伴，做立体校正后再用 Z=fB/d 把视差换回深度。人工选对无法在线进行，论文也没有交代测试时深度是怎样生成的。(2) 为什么需要颜色差分掩码滤波（Ḋ=M·D+(1−M)·Ḋ_{t−1}，M=min(|ΔI|/0.7+0.6, 1)）：逐帧的立体网络没有时间记忆，静态区域也会闪烁；DynamicStereo 和 Stereo Any Video 正是从源头解决这个问题的。(3) 为什么 TSDF 融合权重要看 7×7 局部方差：RAFT-Stereo 不输出不确定度，只能事后用深度的局部起伏来近似置信度。(4) 为什么固定截断 τ=0.02 m 可能有问题：δZ 与 Z² 成正比。若把深度前端换成 Fast-FoundationStereo，按它在 Middlebury-Q 上约 21 ms（TensorRT，RTX 3090）粗估，K=4 个视角各算一对就需要约 84 ms，已经超过 Ha et al. 其余所有阶段合计的 39 ms；而且 DyNeRF 的 1352×1014 约为 Middlebury-Q 像素数的 3–4 倍，实际只会更慢。可见在 telepresence 中，深度往往是最大的开销。\n\n与 Quark 的关系是隐式的：Quark 不输入任何深度，但它做的事情与学习式立体在结构上是对应的。(1) Quark 的 5 步 Update & Fuse 与 RAFT-Stereo 的 32 次 GRU 迭代都属于学习式迭代细化（l-iterative）。区别在于更新信号：RAFT 靠相关查表判断视差该往哪里走；Quark 把当前 LDM 渲染回每个输入视角，用渲染结果与观测之间的差作为更新信号。去掉这一信号后，PSNR 从 30.41 降到 29.71。(2) Quark 的层深度按近/远平面之间的等视差间隔放置，每层只能在自己的视差带内移动。这与立体匹配以视差而不是深度作为搜索变量是同一个原因。(3) RAFT-Stereo 用凸上采样，Quark 用“先上采样、后激活”（借自 ReLU Fields），目的都是从低分辨率几何得到锐利的遮挡边缘。(4) 在遮挡边缘，单一深度的 soft argmin 期望会产生飞点；Quark 每个像素保留多层（最终 6 层）并用 density 表达，从表示上允许前景和背景同时存在。所以 Quark 可以绕开“先估深度”这一步，代价是几何只对当前目标视角有效，用完即弃。"}, {"b": "sec", "h": "延伸阅读", "id": "further"}, {"b": "h3", "t": "学习资源"}, {"b": "res", "items": [{"type": "book", "title": "Computer Vision: Algorithms and Applications, 2nd ed.（Szeliski）", "url": "https://szeliski.org/Book/", "note_zh": "先读第 12 章 Depth estimation，涵盖对极几何、稠密对应、局部与全局方法和深度网络，再读 GC-Net 与 RAFT-Stereo 会轻松很多。官网可免费下载 PDF，限个人使用。"}, {"type": "course", "title": "CMU 16-385 Computer Vision", "url": "https://www.cs.cmu.edu/~16385/", "note_zh": "课程页（Spring 2020 版）中“Two-view geometry”和“Stereo”两讲有 PDF 和 PPT，讲清了校正、视差、深度换算和经典匹配代价，是学习式立体的直接前置。"}, {"type": "code", "title": "RAFT-Stereo 官方代码", "url": "https://github.com/princeton-vl/RAFT-Stereo", "note_zh": "官方 PyTorch 实现和预训练权重。建议自己跑 demo，观察迭代次数对边缘与细结构的影响，并把输出视差换算成深度，体会 δZ∝Z² 的效应。"}, {"type": "code", "title": "FoundationStereo 项目主页", "url": "https://nvlabs.github.io/FoundationStereo/", "note_zh": "项目页附有代码与模型链接，可以直接在自己拍摄的双目图像上测试零样本效果。之后再对照 Fast-FoundationStereo 项目页，比较精度与速度之间的取舍。"}]}, {"b": "h3", "t": "相关经典论文"}, {"b": "refs", "items": [{"left": "2002", "k": "classic-18"}, {"left": "2008", "k": "classic-27"}, {"left": "2015", "k": "classic-37"}, {"left": "2016", "k": "classic-41"}, {"left": "2017", "k": "classic-50"}, {"left": "2018", "k": "classic-56"}, {"left": "2020", "k": "classic-73"}, {"left": "2021", "k": "classic-94"}, {"left": "2025", "k": "classic-147"}], "cls": "papers"}], "toc": false, "series": {"next": {"k": "adv-a-learned-mvs"}, "up": {"u": "basics/advanced/index.html", "t": "Advanced topics 目录"}}}}</script>

      else if (k.slice(0, 2) === "on" && typeof v === "function") n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, String(v));

    (kids || []).forEach(function (c) { if (c === null || c === undefined || c === false) return; n.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return n;
  }
  var SVGNS = "http://www.w3.org/2000/svg";
  function sv(tag, attrs, kids) {
    var n = document.createElementNS(SVGNS, tag);
    if (attrs) for (var k in attrs) {
      if (!Object.prototype.hasOwnProperty.call(attrs, k)) continue;

        }))];
        case "kv": return [el("table", { class: "kv" }, [el("tbody", null, arr(b.items).map(function (x) {
          return el("tr", null, [el("th", { text: x[0] }), el("td", null, rich(x[1]))]);
        }))])];
        case "mtoc": return [marginToc(b.items)];
        case "slot": return typeof SLOTS[b.name] === "function" ? [SLOTS[b.name](b)] : [];
        default: return [];
      }
    }
    // Long articles: a table of contents at the top of the margin (a folding list on phones).
    function marginToc(items) {
      var d = el("details", { class: "mtoc" }, [el("summary", { text: "本文目录" }), el("ol", null, arr(items).map(function (x) { return el("li", null, [part(x)]); }))]);
      var wide = window.matchMedia("(min-width: 761px)");
      d.open = wide.matches;
      return d;
    }
    arr(PG.body).forEach(function (b) {
      if (b.b === "sec") {
        box = el("section", { id: b.id || null });
        if (b.h) box.appendChild(heading("h2", { t: b.h, sn: b.sn }));
        art.appendChild(box);
        return;
      }
      render(b).forEach(function (n) { if (n) cur().appendChild(n); });
    });

    var S = PG.series || {};
    if (S.prev || S.next || S.up) {
      var nav = el("nav", { class: "series", "aria-label": "同系列" });
      nav.appendChild(el("div", { class: "prev" }, S.prev ? [el("small", { text: "上一篇" }), part(S.prev)] : []));
      nav.appendChild(el("div", { class: "up" }, S.up ? [part(S.up)] : []));
      nav.appendChild(el("div", { class: "next" }, S.next ? [el("small", { text: "下一篇" }), part(S.next)] : []));
      art.appendChild(nav);
    }
  })();

  finishPage();
})();
</script>
</body>
</html>
