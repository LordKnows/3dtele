/* ---------- fonts: ET Book for Latin (self-hosted), Noto Serif SC for Chinese text, LXGW WenKai for notes ---------- */
/* ET Book leaves curly quotes, dashes and ellipses to the Chinese font so they keep full width in Chinese prose,
   and single guillemets (› ‹), which it lacks. */
@font-face { font-family: "et-book"; font-weight: 400; font-style: normal; font-display: swap;
  src: url("../../fonts/et-book/et-book-roman-line-figures.woff") format("woff");

@font-face { font-family: "et-book"; font-weight: 400; font-style: italic; font-display: swap;
  src: url("../../fonts/et-book/et-book-display-italic-old-style-figures.woff") format("woff");
  unicode-range: U+0000-2013, U+2015-2017, U+201A-201B, U+201E-2025, U+2027-2038, U+203B-FFFF; }
@font-face { font-family: "et-book"; font-weight: 700; font-style: normal; font-display: swap;
  src: url("../../fonts/et-book/et-book-bold-line-figures.woff") format("woff");
  unicode-range: U+0000-2013, U+2015-2017, U+201A-201B, U+201E-2025, U+2027-2038, U+203B-FFFF; }
/* Notes pair Latin italic with upright Kai (the "italic ↔ 楷体" rule): the italic cut is registered as an upright
   family so the browser never slants the Chinese glyphs. */
@font-face { font-family: "et-book-note"; font-weight: 400; font-style: normal; font-display: swap;
  src: url("../../fonts/et-book/et-book-display-italic-old-style-figures.woff") format("woff");

@font-face { font-family: "et-book-osf"; font-weight: 400; font-style: normal; font-display: swap;
  src: url("../../fonts/et-book/et-book-roman-old-style-figures.woff") format("woff"); }

:root {
  --bg: #fffff8;
  --ink: #111111;
  --ink-2: #3c3c36;
  --muted: #74746a;
  --rule: #d8d6c8;
  --rule-2: #b9b6a4;
  --accent: #a8322d;
  --serif: "et-book", "Noto Serif SC", "Source Han Serif SC", "Songti SC", "STSong", "SimSun", Palatino, Georgia, serif;
  --note: "et-book-note", "LXGW WenKai", "Kaiti SC", "STKaiti", "KaiTi", "et-book", serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --side: clamp(12rem, 21vw, 17rem);
  --gap: 2.75rem;
  --main: calc(100% - var(--side) - var(--gap));
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161614; --ink: #e2e0d6; --ink-2: #c3c1b6; --muted: #979589; --rule: #34332e; --rule-2: #4d4b44; --accent: #e8836f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161614; --ink: #e2e0d6; --ink-2: #c3c1b6; --muted: #979589; --rule: #34332e; --rule-2: #4d4b44; --accent: #e8836f;
  color-scheme: dark;
}

/* ---------- base ---------- */
* { box-sizing: border-box; }
html { font-size: 16px; -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--serif); font-size: 1.15625rem; line-height: 1.85;
  font-kerning: normal; font-variant-numeric: lining-nums;
  /* Space between Chinese and Latin text where the source has none; squeeze adjacent CJK punctuation
     (text-spacing-trim applies the fonts' halt / chws features). Browsers without them keep the source spacing. */
  text-autospace: normal; text-spacing-trim: normal;
  overflow-wrap: break-word;
  padding-top: env(safe-area-inset-top, 0px);
}
[hidden] { display: none !important; }
a { color: inherit; text-decoration-line: underline; text-decoration-thickness: 1px; text-underline-offset: .18em; text-decoration-color: var(--rule-2); }
a:hover { color: var(--accent); text-decoration-color: currentColor; }
a:focus-visible, button:focus-visible, summary:focus-visible, label:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }
.skip { position: absolute; left: -999px; top: 0; }
.skip:focus { left: 1rem; top: .5rem; background: var(--bg); padding: .2rem .5rem; z-index: 60; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
p { margin: 0; }
p + p { margin-top: .9em; }

/* ---------- top bar ---------- */
.topbar { border-bottom: 1px solid var(--rule); }
.bar-in { max-width: 67rem; margin: 0 auto; padding: 0 1.5rem; display: flex; align-items: center; gap: 2.2rem; min-height: 3.1rem; }
.brand { font-size: 1rem; text-decoration: none; letter-spacing: .02em; white-space: nowrap; }
.site-nav { flex: 1; }
.menus { list-style: none; margin: 0; padding: 0; display: flex; gap: 1.6rem; }
.menu { position: relative; }
.menu-btn, .theme-btn, .burger {
  font-family: "et-book", var(--serif); font-variant-caps: all-small-caps; letter-spacing: .08em; font-size: 1.12rem;
  color: var(--ink-2); line-height: 3.1rem;
}
.menu-btn:hover, .theme-btn:hover, .burger:hover, .menu.open > .menu-btn { color: var(--accent); }
.menu.cur > .menu-btn { color: var(--ink); box-shadow: inset 0 -1px 0 var(--ink); }
.drop {
  display: none; position: absolute; left: -1rem; top: 100%; z-index: 40; min-width: 13rem;
  list-style: none; margin: 0; padding: .45rem 0; background: var(--bg); border: 1px solid var(--rule);
}
.menu.open > .drop { display: block; }
.drop a { display: block; padding: .15rem 1rem; text-decoration: none; font-size: 1.02rem; color: var(--ink-2); white-space: nowrap; }
.drop a:hover, .drop a:focus-visible { color: var(--accent); }
.drop a.cur { color: var(--ink); }
.drop a.cur::before { content: "›"; position: absolute; margin-left: -.7rem; color: var(--accent); }
.theme-btn { margin-left: auto; }
.burger { display: none; }

/* ---------- article column + margin ---------- */
main { display: block; }
.art { max-width: 67rem; margin: 0 auto; padding: 2.6rem 1.5rem 3rem; counter-reset: sidenote-counter; }
.art > *, .art section > * { width: var(--main); }
.art > section { width: 100%; }
.art .fullwidth { width: 100%; }
section { padding-top: .6rem; }

.crumbs { font-size: .86rem; color: var(--muted); letter-spacing: .01em; }
.crumbs a { color: var(--muted); text-decoration: none; }
.crumbs a:hover { color: var(--accent); }
.crumbs .sep { margin: 0 .45em; color: var(--rule-2); }
h1, h2, h3 { font-family: var(--serif); color: var(--ink); text-wrap: balance; }
h1 { font-size: 2.3rem; font-weight: 400; line-height: 1.3; margin: .9rem 0 0; letter-spacing: .01em; }
.subtitle { font-family: "et-book", var(--note); font-style: italic; font-size: 1.45rem; line-height: 1.3; color: var(--ink-2); margin-top: .35rem; }
.meta { font-size: .92rem; color: var(--muted); margin-top: 1.1rem; }
.meta a { color: var(--muted); }
h2 { font-size: 1.42rem; font-weight: 600; line-height: 1.4; margin: 2.6rem 0 .9rem; }
h3 { font-size: 1.12rem; font-weight: 600; line-height: 1.5; margin: 1.8rem 0 .5rem; }
h3 .used { font-family: var(--note); font-weight: 400; font-size: .86rem; color: var(--muted); margin-left: .6em; }

.epigraph { margin: 2.2rem 0 .6rem; }
.epigraph blockquote { margin: 0; padding: 0 0 0 1.6rem; border-left: 1px solid var(--rule-2); }
.epigraph p { font-family: var(--note); font-size: 1.12rem; line-height: 1.85; color: var(--ink-2); }

.art ol, .art ul { margin: .6rem 0 0; padding-left: 1.6em; }
.art li + li { margin-top: .45rem; }
li::marker { font-family: "et-book-osf", var(--serif); color: var(--muted); }

/* Equations: display math in the text column, scrolling sideways on narrow screens. */
.eqs { display: block; }
.eq + .eq { margin-top: 1.6rem; }
.math-block { overflow-x: auto; overflow-y: hidden; margin: .4rem 0 .6rem; padding: .2rem 0; font-size: 1rem; }
.math-block mjx-container { margin: 0 !important; }

/* ---------- side notes & margin notes (floated into the right margin) ---------- */
.sidenote, .marginnote {
  float: right; clear: right; position: relative;
  width: var(--side); margin-right: calc(-1 * (var(--side) + var(--gap))); margin-top: .3rem; margin-bottom: .6rem;
  font-family: var(--note); font-size: .88rem; line-height: 1.6; color: var(--ink-2); text-align: left;
  font-style: normal; font-weight: 400; letter-spacing: 0;
}
h3 .sidenote { margin-top: .2rem; }
.sidenote-number { counter-increment: sidenote-counter; }
.sidenote-number::after, .sidenote::before { font-family: "et-book-osf", var(--serif); position: relative; vertical-align: baseline; }
.sidenote-number::after { content: counter(sidenote-counter); font-size: .75rem; top: -.55em; left: .08em; color: var(--ink-2); }
.sidenote::before { content: counter(sidenote-counter) " "; font-size: .8rem; top: -.4em; }
.note-label { font-family: var(--serif); font-weight: 600; font-size: .82rem; color: var(--muted); margin-right: .5em; }
.marginnote .note-label { display: block; margin: 0 0 .1rem; }
input.margin-toggle { display: none; }
label.sidenote-number { display: inline; cursor: default; }
label.margin-toggle:not(.sidenote-number) { display: none; }

/* ---------- quiz, further reading, series ---------- */
.quiz details { margin-top: .3rem; }
.quiz summary { font-family: var(--note); font-size: .92rem; color: var(--muted); cursor: pointer; list-style: none; display: inline-block; }
.quiz summary::-webkit-details-marker { display: none; }
.quiz summary::before { content: "+ "; font-family: "et-book", var(--serif); }
.quiz details[open] summary::before { content: "− "; }
.quiz summary:hover { color: var(--accent); }
.quiz details > p { margin-top: .3rem; padding-left: 1rem; border-left: 1px solid var(--rule); color: var(--ink-2); }

/* Reference lists: a narrow label column (kind / year) and a hanging text column. */
.art ul.refs { list-style: none; padding-left: 0; }
.refs li { display: grid; grid-template-columns: 2.8rem minmax(0, 1fr); column-gap: .5rem; line-height: 1.6; }
.refs li > :not(.kind):not(.yr) { grid-column: 2; }
.refs .kind, .refs .yr { grid-column: 1; font-family: var(--note); font-size: .86rem; color: var(--muted); padding-top: .12rem; }
.refs .yr { font-family: "et-book-osf", var(--serif); font-size: .95rem; padding-top: .05rem; }
.refs .en { font-family: "et-book", var(--serif); font-style: italic; color: var(--muted); font-size: .92rem; line-height: 1.5; }
.refs .gloss { font-family: var(--note); font-size: .88rem; color: var(--ink-2); margin-top: .1rem; }
.art .refs li + li { margin-top: .75rem; }
.art .papers li + li { margin-top: .35rem; }
/* Without a label column the list is a plain stack (no grid, so nothing can land in a phantom second column). */
.refs.noleft li { display: block; }
.refs .used { font-family: var(--note); font-size: .82rem; color: var(--muted); margin-left: .5em; }
.refs.terms .plain-t { font-weight: 600; }
.refs.terms .en { display: inline; margin-left: .6em; }
.timeline li { line-height: 1.7; }
.art .timeline li + li { margin-top: .4rem; }

/* ---------- blocks: lede, run-in labels, notes ---------- */
.lede { margin-top: 1.6rem; color: var(--ink-2); }
.run-in { font-weight: 600; color: var(--ink); }
p.note { font-family: var(--note); font-size: .9rem; color: var(--muted); margin-top: .1rem; }
h2 .en, h3 .en { font-family: "et-book", var(--serif); font-style: italic; font-weight: 400; color: var(--muted); margin-left: .6em; font-size: .92em; }
h2 a, h3 a { text-decoration-color: var(--rule); }
.quiz-h { font-family: var(--note); font-size: .88rem; color: var(--muted); margin-top: 1.4rem; }
.quiz-h + ol.quiz { margin-top: .2rem; }

/* Index pages: a table of contents instead of a card grid. */
.art ol.toc { list-style: none; padding-left: 0; margin-top: .4rem; }
.art ol.toc > li + li { margin-top: .85rem; }
.toc-t { line-height: 1.55; }
.toc-t .en { font-family: "et-book", var(--serif); font-style: italic; color: var(--muted); margin-left: .6em; font-size: .95em; }
.toc-meta { font-family: var(--note); font-size: .82rem; color: var(--muted); margin-left: .7em; white-space: nowrap; }
.toc-s { font-family: var(--note); font-size: .9rem; line-height: 1.65; color: var(--ink-2); margin-top: .1rem; }
.toc-lede { font-family: var(--note); color: var(--ink-2); font-size: .95rem; }
h2.toc-h, h3.toc-h { margin-bottom: .3rem; }

/* Tables: booktabs rules (top, under the header, bottom), no vertical lines, no fills. */
.table-wrap { overflow-x: auto; margin: 1rem 0; }
table.booktabs { border-collapse: collapse; width: 100%; font-size: .9rem; line-height: 1.6; border-top: 1.5px solid var(--ink); border-bottom: 1.5px solid var(--ink); }
table.booktabs th { text-align: left; font-weight: 600; padding: .45rem .7rem .35rem 0; border-bottom: 1px solid var(--ink); white-space: nowrap; vertical-align: bottom; }
table.booktabs td { padding: .45rem .9rem .45rem 0; vertical-align: top; border-top: 1px solid var(--rule); }
table.booktabs tbody tr:first-child td { border-top: 0; }
table.rank td { white-space: nowrap; font-variant-numeric: tabular-nums; }
table.rank td:nth-child(2) { white-space: normal; }
.art table.kv { border-collapse: collapse; margin: .6rem 0; font-size: .95rem; width: auto; }
table.kv th { text-align: left; font-weight: 400; color: var(--muted); padding: .25rem 1.2rem .25rem 0; vertical-align: top; min-width: 5em; max-width: 12em; font-family: var(--note); }
table.kv td { padding: .25rem 0; vertical-align: top; }

/* Long articles: the table of contents sits at the top of the margin. */
/* It sits in a full-width section, so it floats into the margin without a negative offset. */
details.mtoc {
  float: right; clear: right; width: var(--side); margin-right: 0; margin-bottom: 1rem;
  font-family: var(--note); font-size: .86rem; line-height: 1.55; color: var(--ink-2);
}
details.mtoc summary { font-family: var(--serif); font-weight: 600; font-size: .82rem; color: var(--muted); list-style: none; cursor: default; }
details.mtoc summary::-webkit-details-marker { display: none; }
.art details.mtoc ol { list-style: none; padding: 0; margin: .3rem 0 0; }
.art details.mtoc li + li { margin-top: .25rem; }
details.mtoc a { text-decoration: none; }
details.mtoc a:hover { text-decoration: underline; }

/* Tools: search and filters with underlined inputs. */
.tool { margin-top: 1rem; }
.filters { display: flex; flex-wrap: wrap; gap: .6rem 1.6rem; align-items: baseline; font-family: var(--note); font-size: .92rem; color: var(--muted); }
.filters label { display: inline-flex; gap: .5rem; align-items: baseline; }
.filters input, .filters select {
  font: inherit; color: var(--ink); background: transparent; border: 0; border-bottom: 1px solid var(--rule-2); border-radius: 0;
  padding: .15rem .1rem; min-width: 7rem;
}
.filters input[type="search"] { min-width: 14rem; }
.filters select { max-width: 16rem; }
.filters input:focus, .filters select:focus { outline: none; border-bottom-color: var(--accent); }
.filters select option { background: var(--bg); color: var(--ink); }
.filters .count { margin-left: auto; font-family: var(--mono); font-size: .8rem; }
table.gl td.en { font-family: "et-book", var(--serif); width: 20%; }
table.gl .abbr { color: var(--muted); }
table.gl td.zh { white-space: nowrap; }
table.gl td.def { color: var(--ink-2); min-width: 20rem; }
table.gl td.c { font-size: .85rem; min-width: 9rem; padding-right: 0; }
table.gl tr:target td { background: color-mix(in srgb, var(--accent) 8%, transparent); }
table.db td.y { font-family: "et-book-osf", var(--serif); white-space: nowrap; }
table.db td.t { min-width: 16rem; }
table.db td.t small { display: block; color: var(--muted); font-size: .8rem; line-height: 1.45; margin-top: .15rem; }
table.db td.tags { min-width: 7rem; font-family: var(--note); font-size: .8rem; color: var(--muted); }
table.db td.tags span { display: block; }
table.db .tier.milestone { color: var(--ink); font-weight: 600; }
table.db td.s { min-width: 18rem; color: var(--ink-2); }
table.db td.n { min-width: 12rem; font-size: .82rem; color: var(--ink-2); }

/* Figures: the pipeline diagram and the timeline of classic papers, drawn in ink with one accent for interaction. */
figure { margin: 1.4rem 0; }
svg a { text-decoration: none; }
.diagram-wrap, .lanes-wrap { position: relative; overflow-x: auto; }
svg.diagram { width: 100%; min-width: 760px; height: auto; display: block; font-family: var(--note); }
svg.diagram .dnode rect { fill: var(--bg); stroke: var(--ink-2); stroke-width: 1; }
svg.diagram .dnode rect.data { stroke-dasharray: 4 3; }
svg.diagram .dnode:hover rect, svg.diagram .dnode:focus rect { stroke: var(--accent); stroke-width: 1.5; }
svg.diagram .dnode:focus { outline: none; }
svg.diagram text { fill: var(--ink); }
svg.diagram text.k { font-family: var(--mono); font-size: 10px; fill: var(--muted); }
svg.diagram text.t { font-family: var(--serif); font-size: 13px; font-weight: 600; }
svg.diagram text.s { font-size: 11px; fill: var(--ink-2); }
svg.diagram .dedge { fill: none; stroke: var(--ink-2); stroke-width: 1; }
svg.diagram .dedge.fb { stroke-dasharray: 4 3; }
svg.diagram .dhead { fill: var(--ink-2); }
svg.diagram .dloop { fill: none; stroke: var(--rule-2); stroke-dasharray: 2 3; }
svg.diagram .dlabel { font-size: 12px; fill: var(--muted); }
svg.diagram .dnote { font-size: 11px; fill: var(--muted); }
svg.diagram a.dnode:hover .dnote { fill: var(--accent); }
svg.lanes { width: 100%; min-width: 720px; height: auto; display: block; font-family: var(--note); }
svg.lanes .grid { stroke: var(--rule); stroke-width: 1; }
svg.lanes .axis { font-family: "et-book-osf", var(--serif); font-size: 12px; fill: var(--muted); }
svg.lanes .lane-l { font-size: 12px; fill: var(--ink-2); }
svg.lanes .brk { stroke: var(--muted); fill: none; }
svg.lanes .hit { fill: transparent; }
svg .dot { fill: var(--ink); }
svg .dot.hollow { fill: var(--bg); stroke: var(--ink-2); stroke-width: 1.2; }
svg.lanes a.m:hover .dot, svg.lanes a.m:focus .dot { fill: var(--accent); stroke: var(--accent); }
svg.lanes a.m:focus { outline: none; }
.vtip { position: absolute; z-index: 20; max-width: 20rem; padding: .45rem .7rem; background: var(--bg); border: 1px solid var(--rule-2); font-family: var(--note); font-size: .82rem; line-height: 1.5; pointer-events: none; }
.vtip b { display: block; font-family: "et-book", var(--serif); font-weight: 400; font-size: .92rem; }
.vtip small { display: block; color: var(--muted); }
.vtip span { color: var(--accent); }
figcaption { font-family: var(--note); font-size: .85rem; color: var(--muted); margin-top: .4rem; }
figcaption svg { vertical-align: -1px; }

.series { display: grid; grid-template-columns: 1fr auto 1fr; gap: 1rem; align-items: end; margin-top: 3.2rem; padding-top: 1rem; border-top: 1px solid var(--rule); font-size: .98rem; }
.series small { display: block; font-family: var(--note); font-size: .8rem; color: var(--muted); }
.series .up { text-align: center; font-size: .88rem; }
.series .up a { color: var(--muted); }
.series .next { text-align: right; }

.site-foot { max-width: 67rem; margin: 0 auto; padding: 1.2rem 1.5rem 2.5rem; font-size: .82rem; color: var(--muted); }
.site-foot a { color: var(--muted); text-decoration: none; }

/* ---------- hover preview ---------- */
.xtip {

<script type="application/json" id="data">{"site": {"brand": "3D Telepresence: a field guide", "root": "../../", "path": "basics/advanced/a-nerf-fast.html", "nav": [{"key": "overview", "label": "Overview", "items": [["Introduction", "index.html"], ["Methodology", "overview/methodology.html"], ["How to use", "overview/how-to-use.html"]]}, {"key": "basics", "label": "Basics", "items": [["Routes", "basics/routes/index.html"], ["Foundations", "basics/foundations/index.html"], ["Advanced topics", "basics/advanced/index.html"], ["Classics", "basics/classics/index.html"], ["Glossary", "basics/glossary.html"]]}, {"key": "works", "label": "Works", "items": [["Papers", "works/papers/index.html"], ["Walkthrough", "works/walkthrough/index.html"], ["Field map", "works/field-map.html"], ["Sub areas", "works/areas/index.html"]]}, {"key": "future", "label": "Future", "items": [["Directions", "future/index.html"], ["Trends & Challenges", "future/trends.html"]]}], "navCur": "basics", "navItem": "basics/advanced/index.html", "crumbs": [["Basics", ""], ["Advanced topics", "basics/advanced/index.html"]], "date": "2026-09-28"}, "xref": {"adv-a-3dgs-ext": {"u": "basics/advanced/a-3dgs-ext.html", "t": "3D Gaussian Splatting 的扩展", "e": "Extensions of 3D Gaussian Splatting", "m": "Advanced topics", "s": "3DGS（Kerbl et al., SIGGRAPH 2023）把场景表示为数百万个带不透明度和 SH 颜色的各向异性 3D 高斯。"}, "adv-a-geo-fm": {"u": "basics/advanced/a-geo-fm.html", "t": "前馈三维几何基础模型", "e": "Feed-forward 3D geometry foundation models", "m": "Advanced topics", "s": "传统三维重建是一条很长的流水线：特征匹配 → SfM 求相机位姿与稀疏点（见 g-sfm，典型工具是 COLMAP）→ MVS 求稠密深度 → 融合。"}, "classic-103": {"u": "basics/classics/t-neural-rendering.html#classic-103", "t": "Instant Neural Graphics Primitives with a Multiresolution Hash Encoding", "e": "", "m": "Classics · 2022", "s": "Instant-NGP 用多分辨率哈希编码、极小的 MLP 和全融合 CUDA 内核，把 NeRF 的训练时间从以天计降到以秒计，1080p 渲染降到几十毫秒。"}, "classic-105": {"u": "basics/classics/t-neural-rendering.html#classic-105", "t": "Plenoxels: Radiance Fields without ": "Foundations · M4 图形学与渲染基础", "s": "光线步进就是沿射线一步步查询一个场（密度或符号距离）。", "n": "光线步进、球面追踪与隐式表面求交"}, "concept-r-volume": {"u": "basics/foundations/r-volume.html", "t": "体渲染方程与离散化", "e": "The volume rendering equation & its discretization", "m": "Foundations · M4 图形学与渲染基础", "s": "体渲染把场景看成一团既发光又吸收的介质。", "n": "体渲染方程与离散化"}}, "page": {"id": "adv-a-nerf-fast", "head": {"title": "NeRF 的加速与抗锯齿", "sub": "Fast & anti-aliased NeRFs", "meta": ["13 篇奠基论文"], "epigraph": "", "prereqs": [{"k": "concept-n-nerf"}, {"k": "concept-r-volume"}, {"k": "concept-l-encoding"}, {"k": "concept-f-image"}, {"k": "concept-g-depth"}, {"k": "concept-r-raymarch"}], "lede": "", "minutes": 15}, "body": [{"b": "sec", "h": null, "id": "overview"}, {"b": "p", "t": "原版 NeRF 把整个场景存进一个 8 层、每层 256 通道的 MLP。渲染一个像素要沿射线采样：粗网络查询 64 个点，细网络再查询 64+128 个点，所以每条射线约 256 次 MLP 前向。1920×1080 的一帧约有 207 万条射线，合计约 5×10^8 次 MLP 查询；单个场景在一张 V100 上要优化约 1–2 天。另一个问题是走样（aliasing）。按采样定理，采样频率低于信号最高频率的两倍时，高频细节会“伪装”成低频图案，表现为锯齿、摩尔纹或闪烁。NeRF 每个像素只发一条无限细的射线，相当于只在像素中心取一个点样本、不做任何预滤波，所以训练图和测试图的分辨率或相机距离不同时，结果会出现锯齿，或者整体过度模糊（Mip-NeRF 摘要）。“慢”和“走样”是 2021–2023 年 NeRF 改进的两条主线，而且两者互相牵制：加速的主要手段是把 MLP 换成网格或哈希表，可网格本身没有“尺度”概念，反而更容易走样。Zip-NeRF 就是从这个矛盾出发的。\n\n加速有三类办法。第一类是把容量从 MLP 权重挪到显式数据结构。Plenoxels 用稀疏体素直接存密度和球谐（SH）系数，完全不用神经网络，优化速度比 NeRF 快两个数量级。DVGO 用密度网格加特征网格，后接浅层 MLP，15 分钟内收敛，并提出“先插值后激活”（post-activation）。TensoRF 把 4D 特征张量分解成低秩的向量和矩阵因子，VM 版本训练不到 10 分钟，模型小于 75 MB。Instant-NGP 用 16 级多分辨率哈希表（每项是 F=2 维特征）加一个很小的 MLP，配合全融合 CUDA kernel，把训练缩短到秒级，1080p 渲染只需几十毫秒。第二类是跳过空区域，只在有物体的地方采样，例如 Instant-NGP 的占据网格和 Plenoxels 的稀疏体素。可泛化 NeRF 里的 ENeRF 也属于这一类：它先用代价体估计粗深度，只在表面附近采少量点。第三类是训练后“烘焙”成适合实时渲染的结构。SNeRG 预计算为稀疏特征网格加小型延迟着色 MLP，平均小于 90 MB，笔记本 GPU 上超过 30 fps。PlenOctrees 用八叉树存 SH。MERF 用稀疏特征网格加高分辨率 2D 特征平面来降低显存，能在浏览器里实时渲染无界场景。SMERF 更进一步，让 300 m² 的大场景在手机上实时漫游。\n\n抗锯齿这条线从 Mip-NeRF 开始。它把每个像素看成一个圆锥而不是一条射线，沿射线切成圆锥台（conical frustum），每段用 3D 高斯近似，再用积分位置编码（IPE）求位置编码在该高斯下的期望。这样高频分量会按高斯大小自动衰减，相当于 mipmap 预滤波的连续版本。结果是：在 NeRF 数据集上误差降低 17%，在多尺度版本上降低 60%；与暴力超采样的 NeRF 精度相当，速度快 22 倍。Mip-NeRF 360 把它推广到 360° 无界场景，做了三件事：用 contraction 把无穷远压进半径为 2 的球，并按视差（1/距离）线性采样；用小型 proposal MLP 做在线蒸馏，决定采样位置；用 distortion 正则抑制“漂浮物”。它的 MSE 比 Mip-NeRF 降低 57%。Zip-NeRF 把 Mip-NeRF 360 的抗锯齿和 Instant-NGP 的哈希网格结合起来：每个锥台用 6 个多重采样点近似；每级网格特征按“高斯尺度相对网格单元大小”用 erf 衰减；另外用抗锯齿的 interlevel loss 解决 z-aliasing。它的误差比两者低 8%–77%，训练比 Mip-NeRF 360 快 24 倍：在单尺度的 Mip-NeRF 360 数据集上，Zip-NeRF 用 8 张 V100 训练约 0.89 小时，Mip-NeRF 360 约 21.69 小时（后者由其他硬件的实测时间换算而来，论文标为近似值）。\n\n2023 年 8 月 3DGS 出现后，实时渲染的主流表示转向了显式高斯（见 a-3dgs-ext）。但截至 2026-09，本专题的内容仍是读论文的基本词汇，原因有三。第一，Zip-NeRF 与 Mip-NeRF 360 仍常被用作逐场景优化的质量参照，Quark 在 DL3DV 上的对比表就直接列出了 Zip-NeRF、Mip-NeRF360、3DGS、Instant-NGP、Nerfacto 的数值。第二，Mip-Splatting 等高斯抗锯齿工作的理论（采样率、预滤波）直接继承自 Mip-NeRF，2DGS 的深度畸变损失也来自 Mip-NeRF 360。第三，“网格插值后再激活”“按视差分配采样”这些技巧已被 feed-forward 方法吸收。最需要分清的是“实时”在这里的含义：本专题的“实时”只指渲染，重建仍是逐场景优化（Instant-NGP 秒到分钟级，Zip-NeRF 约 8 卡×0.9 小时）；Quark 的“实时”则是每帧重建加渲染合计约 33 ms。远程临场里每 33 ms 就是一个新“场景”，这是两篇重点论文都走 feed-forward 路线的根本原因。"}, {"b": "sec", "h": "核心思想", "id": "key-ideas"}, {"b": "h3", "t": "把容量从 MLP 挪到网格：显式与混合表示"}, {"b": "p", "t": "直觉：MLP 每查询一个点都要把整个网络算一遍，一个 8 层、256 宽的全连接网络约需 50 万次乘加；网格查询只需读周围 8 个顶点做三线性插值，计算量几乎是常数，代价是显存。Plenoxels 每个顶点存 1 个密度和 27 个 SH 系数（2 阶 SH 每通道 9 个，共 3 个颜色通道），合计 28 个浮点数。如果用 512³ 的稠密网格，需要 1.34×10^8 个顶点×28×4 字节≈15 GB，所以必须稀疏化（Plenoxels）、低秩分解（TensoRF 的 VM 分解）或哈希（Instant-NGP）。这类方法能成立，说明 NeRF 的质量主要来自“可微体渲染 + 多视角光度损失”，而不是 MLP 本身，Plenoxels 的标题就叫 “without Neural Networks”。与重点论文的联系：Quark 的 LDM 本质上也是一个显式网格（最终 6 层×288×512，每格存 depth、density 和对 8 个输入视角的 blend logits），区别在于它由网络每帧预测，而不是逐场景优化出来的。"}, {"b": "h3", "t": "多分辨率哈希编码（Instant-NGP）"}, {"b": "p", "t": "直觉：3D 空间大部分是空的，只有表面附近需要细节。Instant-NGP 设 L=16 个分辨率级别，分辨率从 N_min=16 按几何级数增长到 N_max（512 到 524288）。粗级别的顶点数少于表大小 T，与表项一一对应；细级别的顶点用空间哈希映射到大小为 T（2^14 到 2^24）、每项 F=2 维可训练特征的表里，冲突不做显式处理。这样做可行，有两个原因：冲突项上的梯度会被平均，对损失贡献大的表面点的梯度占主导；而且不同级别在不同位置发生冲突，小 MLP 可以借此消歧。数值例子：T=2^19、L=16、F=2 时共约 1680 万个参数，而一个 2048³ 的稠密网格就有约 8.6×10^9 个顶点。查表是 O(1)，没有树遍历，非常适合 GPU。与重点论文的联系：两篇重点论文都不用哈希网格。Quark 的 DL3DV 对比表里 Instant-NGP 只有 25.01 dB（Quark 31.31，Zip-NeRF 31.22），但这些基线数值直接取自 DL3DV 论文（默认设置、较低分辨率），不宜据此单独评判 Instant-NGP。更干净的对照来自 Zip-NeRF 论文自己的 Mip-NeRF 360 数据集：Instant-NGP 25.68 dB、训练约 0.15 小时，Zip-NeRF 28.54 dB、约 0.89 小时。Zip-NeRF 正是在哈希网格上补上了“尺度感知”（抗锯齿），才同时拿到速度和质量。"}, {"b": "h3", "t": "先插值、后激活（post-activation）"}, {"b": "p", "t": "直觉：如果先对每个顶点的值做激活（如密度过 ReLU/softplus、占据过 sigmoid），再做线性插值，那么体素内部只能线性过渡，边界会被抹成一个体素宽的斜坡。如果先插值未激活的原始值、再施加非线性，零交叉点可以落在体素内部的任意位置，于是在低分辨率网格上也能得到亚体素精度的锐利边界。数值例子：相邻两个顶点的原始值为 −3 和 +1。先 ReLU 得到 0 和 1，插值后是一条横跨整个体素的斜坡；先插值则在 3/4 处过零，ReLU 后前 3/4 恒为 0，边界被精确定位在 0.75。ReLU Fields 与 DVGO 都提出了这一做法。与重点论文的联系：Quark 的 “Upsample & Activate” 阶段明确借鉴了 ReLU Fields。最终 LDM 的 depth、density 与 blend logits 都以未激活形式双线性上采样 3.75×（288×512 → 1080×1920），然后才施加 tanh、sigmoid、softmax，blend weights 的 softmax 也推迟到上采样之后。不理解这一点，就很难明白 Quark 为什么能用 288×512 的内部表示输出 1080p，而遮挡边缘不发糊。"}, {"b": "h3", "t": "锥体追踪与积分位置编码（Mip-NeRF）"}, {"b": "p", "t": "直觉：一个像素在远处覆盖的 3D 区域更大，它“看到”的应当是这块区域的平均颜色，而不是某一个点的颜色。Mip-NeRF 用 3D 高斯近似每段圆锥台，并解析地求出位置编码 sin(2^l x)、cos(2^l x) 在该高斯下的期望，结果是第 l 个频率被乘上 exp(−½·4^l·σ²)，其中 σ² 是高斯在该方向的方差。数值例子：σ=0.05（场景单位）时，l=2 的衰减因子约 0.98，l=4 约 0.73，l=6 约 0.006。足迹大的样本会自动丢掉高频特征，不再“假装”看得清细节，锯齿因此消失。与重点论文的联系：Quark 在 1024×768 与 2048×1536 下的运行时间几乎相同（32.2 对 33.0 ms），因为内部 LDM 固定为 288×512；而在 2K 下，Shiny 的 PSNR 从 26.51 降到 24.66，LPIPS 从 0.108 升到 0.174。用 Mip-NeRF 的“像素足迹”语言来说，输出采样率提高后，新增细节只能来自 IBR 对全分辨率输入图的采样，几何并没有变细。评价“高分辨率实时”这类说法时，要用这个视角去看。"}, {"b": "h3", "t": "无界场景：contraction 与按视差采样（Mip-NeRF 360）"}, {"b": "p", "t": "直觉：一个点在图像上的视差与深度成反比，所以深度分辨率应当按 1/d 来分配，近处细、远处粗。Mip-NeRF 360 的 contraction 让半径 1 以内的空间保持不变，把外部按 2−1/‖x‖ 压进半径 1 到 2 的壳层：‖x‖=2 映射到 1.5，‖x‖=10 映射到 1.9，无穷远映射到 2。沿射线的采样也按视差均匀分布。与重点论文的联系：Quark 在由 SfM 点估计的近平面 η 与远平面 f 之间按等视差放置 L 个 anchor，每层深度只能在自己的视差带内移动。数值例子：η=0.5 m、f=10 m、L=24 时，视差范围为 2.0−0.1=1.9 m⁻¹，每层带宽约 0.079 m⁻¹。若某层 anchor 恰在 1 m，它的深度范围约为 0.96–1.04 m；若在 5 m，范围约为 4.2–6.2 m。这与 Mip-NeRF 360 的原则相同。Ha et al. 的 TSDF 截断则用固定的公制值 τ=0.02 m，与深度无关，重点论文深读指出，由于立体深度误差随距离平方增长，这个值对远处背景太紧。理解了按视差参数化，就能看懂两篇在这一点上的不同取舍。"}, {"b": "h3", "t": "Proposal 采样、distortion 正则与 z-aliasing"}, {"b": "p", "t": "直觉：体渲染的大部分采样点落在空区域或被遮挡区域，算力被浪费了。Mip-NeRF 360 用一个小型 proposal MLP 预测沿射线的密度直方图，再按直方图重采样，把样本点集中到第一个表面附近。proposal 网络只用主 NeRF 权重直方图的蒸馏来监督，不需要颜色。distortion 损失的形式为 Σ_{i,j} w_i w_j |s̄_i − s̄_j| 再加上一个区间自身项，它惩罚权重沿射线的分散，从而抑制漂浮物；2DGS 把它改写成了高斯的深度畸变损失。Zip-NeRF 发现，分段常数的 proposal 监督对表面的平滑位移不敏感，相机移动时场景内容会忽隐忽现，这就是 z-aliasing。它的解决办法是先把直方图模糊成分段线性样条，再重采样到 proposal 的 bin 中，使损失随射线距离平滑变化。与重点论文的联系：Quark 采用由粗到细的结构，先在 36×64 分辨率上用 24 层密集定位表面，再经两次 layer collapse 降到 6 层、同时升到 288×512。这与“先粗估密度、再集中采样”是同一思想，只是由网络来学。两篇重点论文的共同基线 ENeRF 用级联代价体预测粗深度，然后只在表面附近采少量点。Ha et al. 的 TSDF 则以 0.8·s 为步长推进，检测到符号变化后做 3 步二分，这是“用距离界跳过空区域”的另一种实现。"}, {"b": "h3", "t": "烘焙与“实时”的两种含义"}, {"b": "p", "t": "直觉：训练时需要可微、灵活的表示，部署时需要能快速查表的表示，所以先训练、再烘焙。SNeRG 把 NeRF 改写为“体渲染特征 + 每像素只跑一次的小 MLP”（延迟着色），再预计算成稀疏网格。MERF 用一种既能压缩无界场景、又便于快速做射线-盒求交的 contraction，实现浏览器中的实时渲染。SMERF 把大场景分块，并用蒸馏保证块与块之间一致。但这些方法都是“逐场景优化，然后实时渲染”。数值对比：Zip-NeRF 每个场景要在 8 张 V100 上训练约 0.9 小时；Quark 在单张 A100 上每帧重建加渲染只需 32.2 ms（1024×768）；Ha et al. 各阶段合计约 39 ms（TensorRT，不含立体深度）。在 30 fps 的远程临场中，每 33 ms 场景就会变化一次，逐场景优化来不及，所以两篇重点论文都采用 feed-forward、不做逐场景训练。读 Quark 的 DL3DV 对比表时要记住：表中的逐场景方法对每个测试场景都做过拟合，Quark 则从未见过这些场景，因此 31.31 对 Zip-NeRF 31.22 的“超越”必须结合设定来理解。重点论文深读还指出：基线数值直接取自 DL3DV 论文，分辨率较低；测试时每 8 帧取一帧作目标、其余帧作输入，属于稠密轨迹上的插值设定。"}, {"b": "sec", "h": "关键公式", "id": "equations"}, {"b": "eqs", "eqs": [{"tex": "\\gamma(\\boldsymbol{\\mu},\\boldsymbol{\\Sigma})=\\mathbb{E}_{\\mathbf{x}\\sim\\mathcal{N}(\\boldsymbol{\\mu},\\boldsymbol{\\Sigma})}\\big[\\gamma(\\mathbf{x})\\big]=\\begin{bmatrix}\\sin(\\boldsymbol{\\mu}_\\gamma)\\circ\\exp\\!\\left(-\\tfrac12\\operatorname{diag}(\\boldsymbol{\\Sigma}_\\gamma)\\right)\\\\ \\cos(\\boldsymbol{\\mu}_\\gamma)\\circ\\exp\\!\\left(-\\tfrac12\\operatorname{diag}(\\boldsymbol{\\Sigma}_\\gamma)\\right)\\end{bmatrix},\\quad \\gamma(\\mathbf{x})=\\begin{bmatrix}\\sin(\\mathbf{P}\\mathbf{x})\\\\ \\cos(\\mathbf{P}\\mathbf{x})\\end{bmatrix},\\ \\boldsymbol{\\mu}_\\gamma=\\mathbf{P}\\boldsymbol{\\mu},\\ \\boldsymbol{\\Sigma}_\\gamma=\\mathbf{P}\\boldsymbol{\\Sigma}\\mathbf{P}^{\\top},\\ \\mathbf{P}=[\\mathbf{I},2\\mathbf{I},\\dots,2^{L-1}\\mathbf{I}]^{\\top}", "explain_zh": "Mip-NeRF 的积分位置编码（IPE）。γ(x) 是普通位置编码：P 把 3D 坐标 x 依次乘以 1, 2, …, 2^{L−1}（L 为频率级数），再取 sin 和 cos；μ、Σ 是某段圆锥台近似高斯的 3D 均值和 3×3 协方差（由该段的起止距离 t0、t1 和像素圆锥半径解析算出）；μ_γ=Pμ、Σ_γ=PΣPᵀ 是这个高斯经 P 线性变换后的均值与协方差；diag(·) 取对角元，因为每个 sin/cos 分量只依赖一个坐标的边缘分布；∘ 表示逐元素相乘。公式的依据是一维恒等式：若 x∼N(μ, σ²)，则 E[sin x]=sin(μ)·exp(−σ²/2)，cos 同理。于是 exp(−½ diag Σ_γ) 就是每个频率分量的衰减因子。Σ→0 时（无限细的射线），IPE 退化为 NeRF 的普通位置编码 γ(μ)。例：某轴方差 σ²=0.0025（σ=0.05），第 l 级（从 0 开始计）对角元为 4^l σ²，l=2 时衰减 exp(−0.02)≈0.98，l=4 时 exp(−0.32)≈0.73，l=6 时约 0.006。足迹越大，高频特征越被抑制，这就是“预滤波”。"}, {"tex": "h(\\mathbf{x})=\\Big(\\bigoplus_{i=1}^{d} x_i\\,\\pi_i\\Big)\\bmod T,\\qquad N_l=\\big\\lfloor N_{\\min}\\, b^{\\,l}\\big\\rfloor,\\quad b=\\exp\\!\\Big(\\frac{\\ln N_{\\max}-\\ln N_{\\min}}{L-1}\\Big)", "explain_zh": "Instant-NGP 的空间哈希与分辨率级数。x 是某一级缩放后网格顶点的整数坐标（d=2 或 3 维）；π_i 是大素数（π_1=1、π_2=2654435761、π_3=805459861）；⊕ 是按位异或；T 是该级哈希表的大小（2^14 到 2^24）；N_l 是第 l 级的网格分辨率；N_min、N_max 分别是最粗和最细分辨率；b 是相邻级之间的增长因子（论文中 b∈[1.26, 2]）；L 是级数（16）。每个查询点在每一级取所在体素 2^d 个顶点的特征做 d 线性插值，L 级特征拼接后送入小 MLP。例：N_min=16、N_max=2048、L=16 时，b=exp(ln128/15)≈1.38。"}, {"tex": "\\operatorname{contract}(\\mathbf{x})=\\begin{cases}\\mathbf{x}, & \\|\\mathbf{x}\\|\\le 1\\\\ \\left(2-\\dfrac{1}{\\|\\mathbf{x}\\|}\\right)\\dfrac{\\mathbf{x}}{\\|\\mathbf{x}\\|}, & \\|\\mathbf{x}\\|>1\\end{cases}", "explain_zh": "Mip-NeRF 360 的场景收缩。x 是以场景中心为原点、按相机分布归一化后的世界坐标；‖x‖≤1 的区域保持线性，外部按 2−1/‖x‖ 缩放到半径 [1, 2) 的壳层，此时径向坐标与视差 1/‖x‖ 呈线性关系。例：‖x‖=2 映射到 1.5，4 映射到 1.75，10 映射到 1.9，无穷远映射到 2。对照 Quark 的层深度 d_ℓ=[(δ+0.5/L·tanh(VW_d))(1/η−1/f)+1/f]^{-1}：其中 δ=(ℓ−0.5)/L 是第 ℓ 层的 anchor，η、f 是近/远平面，VW_d 是网络输出，tanh 把每层限制在自己的视差带内。它同样是在视差空间里做线性参数化，与 contraction 的原则一致。"}]}, {"b": "sec", "h": "演进", "id": "evolution"}, {"b": "timeline", "items": [[2020, "NeRF（ECCV 2020）：8 层 MLP + 体渲染，每条射线约 256 次 MLP 查询，单场景在 V100 上训练约 1–2 天"], [2021, "Mip-NeRF（ICCV 2021）提出锥体追踪与 IPE；同年 KiloNeRF、PlenOctrees、SNeRG（均为 ICCV 2021）用分治或烘焙实现实时渲染"], [2022, "Plenoxels、DVGO、Mip-NeRF 360（CVPR 2022）：无网络的稀疏体素、post-activation、无界场景的 contraction 与 proposal 采样"], [2022, "Instant-NGP（SIGGRAPH 2022）的多分辨率哈希编码把训练缩短到秒到分钟级；TensoRF（ECCV 2022）张量分解；ReLU Fields（SIGGRAPH 2022）"], [2023, "Zip-NeRF（ICCV 2023）把网格加速与抗锯齿统一起来；MERF（SIGGRAPH 2023）实现浏览器实时；Nerfstudio 发布 nerfacto；8 月 3DGS 发布，实时渲染主流转向高斯；12 月 SMERF 让 300 m² 场景在手机上实时"], [2024, "Quark（SIGGRAPH Asia 2024）单次前向、未见测试场景，在 DL3DV 上取得 31.31 dB，高于表中 Zip-NeRF 的 31.22（基线数值取自 DL3DV 论文）；其 Upsample & Activate 借用 ReLU Fields"], [2025, "Ha et al.（CVPR 2025）完全不做体采样，改用 image-based TSDF 射线推进；最强基线 ENeRF 属于“加速的可泛化 NeRF”"]]}, {"b": "sec", "h": "奠基论文", "id": "papers"}, {"b": "refs", "items": [{"left": "必读", "url": "https://arxiv.org/abs/2201.05989", "t": "Instant Neural Graphics Primitives with a Multiresolution Hash Encoding", "sub": "Thomas Müller et al. · ACM TOG 41(4) / SIGGRAPH 2022 · 2022 · 引用 6.4k", "gloss": "多分辨率哈希编码加全融合 CUDA，把 NeRF 训练从天级降到秒到分钟级、1080p 渲染降到几十毫秒；nerfacto、Zip-NeRF 都建立在它之上"}, {"left": "必读", "url": "https://arxiv.org/abs/2103.13415", "t": "Mip-NeRF: A Multiscale Representation for Anti-Aliasing Neural Radiance Fields", "sub": "Jonathan T. Barron et al. · ICCV 2021 · 2021 · 引用 2.9k", "gloss": "锥体追踪与积分位置编码，是 NeRF 抗锯齿的起点（误差降低 17%，多尺度下降低 60%）；采样率与预滤波的思想后来被 Mip-Splatting 继承"}, {"left": "必读", "url": "https://arxiv.org/abs/2111.12077", "t": "Mip-NeRF 360: Unbounded Anti-Aliased Neural Radiance Fields", "sub": "Jonathan T. Barron et al. · CVPR 2022 · 2022 · 引用 2.9k", "gloss": "提出 contraction 与按视差采样、proposal 在线蒸馏和 distortion 正则，MSE 降低 57%；其数据集也是 Quark 的评测集之一（Quark 26.60 对 M-NeRF360 27.69）"}, {"left": "必读", "url": "https://arxiv.org/abs/2304.06706", "t": "Zip-NeRF: Anti-Aliased Grid-Based Neural Radiance Fields", "sub": "Jonathan T. Barron et al. · ICCV 2023 · 2023 · 引用 922", "gloss": "结合哈希网格、6 点多重采样、按尺度的 erf 特征衰减与抗锯齿 interlevel loss（解决 z-aliasing），误差降低 8%–77%，训练比 Mip-NeRF 360 快 24 倍；是 Quark DL3DV 对比表中最强的逐场景基线（31.22 dB）"}, {"left": "建议", "url": "https://arxiv.org/abs/2112.05131", "t": "Plenoxels: Radiance Fields without Neural Networks", "sub": "Sara Fridovich-Keil, Alex Yu（共同一作）et al. · CVPR 2022 · 2022 · 引用 2.3k", "gloss": "用稀疏体素存密度和 SH，完全不用神经网络，优化速度快两个数量级，说明 NeRF 质量主要来自可微体渲染"}, {"left": "建议", "url": "https://arxiv.org/abs/2203.09517", "t": "TensoRF: Tensorial Radiance Fields", "sub": "Anpei Chen et al. · ECCV 2022 · 2022 · 引用 1.9k", "gloss": "把 4D 特征张量做 CP/VM 低秩分解：CP 版本不到 4 MB，VM 版本训练不到 10 分钟、模型不到 75 MB，兼顾速度与显存"}, {"left": "建议", "url": "https://arxiv.org/abs/2111.11215", "t": "Direct Voxel Grid Optimization: Super-fast Convergence for Radiance Fields Reconstruction", "sub": "Cheng Sun et al. · CVPR 2022 · 2022 · 引用 1.4k", "gloss": "用密度网格、特征网格加浅层 MLP，约 15 分钟收敛；提出密度的 post-activation 插值，能在低分辨率网格上得到锐利表面"}, {"left": "建议", "url": "https://arxiv.org/abs/2205.10824", "t": "ReLU Fields: The Little Non-linearity That Could", "sub": "Animesh Karnewar et al. · SIGGRAPH 2022 · 2022 · 引用 123", "gloss": "在插值后的网格值上施加 ReLU，再配合由粗到细优化；是 Quark “Upsample & Activate”（先上采样未激活属性再施加非线性）的直接来源"}, {"left": "建议", "url": "https://arxiv.org/abs/2103.14645", "t": "Baking Neural Radiance Fields for Real-Time View Synthesis", "sub": "Peter Hedman et al. · ICCV 2021 · 2021 · 引用 663", "gloss": "SNeRG：把训练好的 NeRF 改写为延迟着色并烘焙成稀疏特征网格，平均小于 90 MB，笔记本 GPU 上超过 30 fps"}, {"left": "选读", "url": "https://arxiv.org/abs/2302.12249", "t": "MERF: Memory-Efficient Radiance Fields for Real-time View Synthesis in Unbounded Scenes", "sub": "Christian Reiser et al. · ACM TOG / SIGGRAPH 2023 · 2023 · 引用 307", "gloss": "用稀疏特征网格加高分辨率 2D 平面以及便于射线-盒求交的新 contraction，在浏览器中实时渲染无界场景"}, {"left": "选读", "url": "https://arxiv.org/abs/2103.14024", "t": "PlenOctrees for Real-time Rendering of Neural Radiance Fields", "sub": "Alex Yu et al. · ICCV 2021 · 2021 · 引用 1.3k", "gloss": "让 NeRF 直接输出 SH 系数，再转存为八叉树实现实时渲染；SH 颜色后来成为 3DGS 的标准做法"}, {"left": "选读", "url": "https://arxiv.org/abs/2302.04264", "t": "Nerfstudio: A Modular Framework for Neural Radiance Field Development", "sub": "Matthew Tancik et al. · SIGGRAPH 2023 · 2023 · 引用 1.1k", "gloss": "模块化 NeRF 框架，nerfacto 把 proposal 采样、哈希编码、场景收缩、位姿优化组合在一起；Quark 的 DL3DV 对比表中 Nerfacto 为 24.61 dB"}, {"left": "选读", "url": "https://arxiv.org/abs/2312.07541", "t": "SMERF: Streamable Memory Efficient Radiance Fields for Real-Time Large-Scene Exploration", "sub": "Daniel Duckworth, Peter Hedman, Christian Reiser et al. · ACM TOG 43(4) / SIGGRAPH 2024 · 2024 · 引用 90", "gloss": "在 MERF 基础上做分层模型分块与蒸馏，支持最大约 300 m² 的场景在浏览器、手机和笔记本上实时 6DoF 漫游；摘要明确指出光线步进式神经场质量更高但实时代价过高，是理解“烘焙”路线上限的参照"}]}, {"b": "sec", "h": "争论与分歧", "id": "debates"}, {"b": "ul", "items": ["神经网络是否必要：Plenoxels 不用网络也能达到 NeRF 的质量，说明关键在可微体渲染与正则；但 Instant-NGP、Zip-NeRF 表明，小 MLP 在消解哈希冲突和建模视角相关外观上仍有价值。“显式 vs 隐式”至今没有统一答案。", "抗锯齿的代价是否值得：Zip-NeRF 每个锥台要算 6 个多重采样点，计算量随之增加。收益高度依赖测试协议：在 Zip-NeRF 的多尺度 360 基准上，把多重采样换成朴素单点采样（消融 A），全分辨率（1×）下 PSNR 只从 28.25 降到 27.93，但在 1/8 分辨率下渲染（相当于从远处看）时从 32.52 暴跌到 26.53；而暴力 6× 超采样（消融 B）训练要 2.54 小时，质量反而更差。也就是说，只在训练分辨率上测试时几乎看不出抗锯齿的价值，一旦观看距离变化就必不可少。3DGS 出现后，同样的争论在 Mip-Splatting 上又重演了一遍。", "逐场景优化与 feed-forward 的比较是否公平：Quark 在 DL3DV 上以 31.31 对 31.22 胜过 Zip-NeRF，但在 Deep Blending 上以 23.61 远低于 Mip-NeRF360 的 29.66；DL3DV 的基线数值取自原论文、分辨率不同，测试设定又是稠密轨迹插值。“feed-forward 已追平逐场景”这一说法强烈依赖视角覆盖。", "体渲染光线步进 vs 光栅化：SMERF 摘要指出，基于光线步进的神经场质量更高，但实时代价高昂；3DGS 靠光栅化赢得了速度，之后 3DGRT 等工作又把光线追踪带回了粒子表示。"]}, {"b": "sec", "h": "开放问题", "id": "open-questions"}, {"b": "ul", "items": ["能否把逐场景优化从“秒到分钟”压缩到“每帧 33 ms 在线更新”，例如用 feed-forward 初始化再加少量 test-time 优化，同时兼顾质量与延迟？重点论文深读列出的 Online Neural Space Time Memory（2026）用 TTT 记忆约 1 FPS 更新、逐帧应用，是一个可参考的方向。", "动态、流式场景下的抗锯齿与时间稳定：观看者在头显中前后移动时采样率连续变化，逐帧生成的表示怎样才能既无锯齿又不闪烁？", "深度参数化如何统一：等视差分层（Quark）、contraction（Mip-NeRF 360）与公制截断（Ha 的 τ=0.02 m）各有适用范围。在“近处人物 + 远处房间背景”的远程临场场景中，哪种参数化更稳健？", "视角相关外观：哈希网格加小 MLP 或 SH 在逐场景设定下能表示高光，而 feed-forward IBR 只能对输入颜色做凸组合。显式视角相关模型（Quark 列为未来工作）能否做到实时？"]}, {"b": "sec", "h": "与重点论文的关系", "id": "relation"}, {"b": "p", "t": "Quark：(1) 在 DL3DV-10K benchmark 上与逐场景方法比较，Quark 为 31.31/0.932/0.103（PSNR/SSIM/LPIPS），Zip-NeRF 31.22/0.921/0.112，Mip-NeRF360 30.98/0.911/0.132，3DGS 29.82，Instant-NGP 25.01，Nerfacto 24.61。基线数值取自 DL3DV 论文，分辨率较低，Quark 也没有在 DL3DV 上训练过。在 3DGS 论文使用的场景上，Mip-NeRF360 数据集 Quark 为 26.60，排第三（M-NeRF360 27.69，3DGS-30K 27.21）；Deep Blending 上 Quark 为 23.61，远低于 M-NeRF360 的 29.66 和 3DGS 的 30.04，只高于 Plenoxels 和 INGP，原因是最近 8 个视角覆盖不足。不了解本专题，就无法判断这些数字的分量：Zip-NeRF 每个场景要在 8 张 V100 上训练约 0.9 小时，而 Quark 是一次 32–33 ms 的前向，且从未见过这些场景。(2) Quark 的 Upsample & Activate 明确借用 ReLU Fields 的 post-activation（DVGO 也有同样的做法）：最终 LDM 的 depth、density、blend logits 先双线性上采样 3.75×，再施加非线性，这是它能用 288×512 的内部表示输出锐利 1080p 遮挡边的原因。(3) Quark 在 SfM 估计的 [η, f] 之间按等视差放置层 anchor，并把每层限制在自己的视差带内，这与 Mip-NeRF 360 按视差采样、用 contraction 压缩远景是同一原则。它的由粗到细结构（24 层@36×64 → 6 层@288×512，中间两次 layer collapse）对应“先粗定位表面、再集中采样”的 proposal 思想。(4) 2K 输出时内部 LDM 分辨率不变（32.2 对 33.0 ms），Shiny 的 LPIPS 从 0.108 变为 0.174。用 Mip-NeRF 的像素足迹视角可以解释：输出采样率提高，几何并没有变细。\nHa et al.：全文不使用任何 NeRF 式表示。它的最强基线 ENeRF 属于“加速的可泛化 NeRF”：先用级联代价体预测粗几何，再只在表面附近采少量点，比此前的可泛化 NeRF 快至少 60 倍，这是 empty-space skipping 在 feed-forward 中的体现。Ha 在 DyNeRF 上以 31.17 对 29.51 胜过 ENeRF，但在 ENeRF-Outdoor 上以 24.01 对 25.79 落败。Ha 的 image-based TSDF 沿目标射线以 0.8·s 为步长推进、检测到变号后做 3 步二分，靠距离界跳过空区域，而不是 NeRF 式的密集体采样。它的截断用公制 τ=0.02 m，与 Mip-NeRF 360/Quark 的视差参数化正好相反。Ha 与逐场景方法 4K4D、4DGS（K=17）只做了定性比较。"}, {"b": "sec", "h": "延伸阅读", "id": "further"}, {"b": "h3", "t": "学习资源"}, {"b": "res", "items": [{"type": "paper", "title": "Neural Fields in Visual Computing and Beyond（Xie et al. 综述）", "url": "https://arxiv.org/abs/2111.11426", "note_zh": "神经场综述，系统梳理了网格、哈希等混合表示，以及采样、加速和先验。读完 NeRF 后先读它，可以建立整体框架，再回头逐篇读本专题的论文"}, {"type": "tutorial", "title": "Nerfstudio 文档：Nerfacto", "url": "https://docs.nerf.studio/nerfology/methods/nerfacto.html", "note_zh": "讲解 nerfacto 如何组合 piecewise sampler、proposal sampler、哈希编码和位姿优化，把 Mip-NeRF 360 与 Instant-NGP 的思想落到可运行的代码里，适合动手对照"}, {"type": "code", "title": "Instant-NGP 官方代码（NVlabs）", "url": "https://github.com/NVlabs/instant-ngp", "note_zh": "多分辨率哈希编码与占据网格加速的官方实现，自带交互式 GUI，能直观看到秒级收敛的过程"}, {"type": "code", "title": "CamP / Zip-NeRF 官方 JAX 代码", "url": "https://github.com/jonbarron/camp_zipnerf", "note_zh": "Zip-NeRF 与 CamP 的官方实现，包含 Mip-NeRF 360 的 contraction、proposal 与 distortion 损失，以及 Zip-NeRF 的多重采样和 erf 特征衰减"}]}, {"b": "h3", "t": "相关经典论文"}, {"b": "refs", "items": [{"left": "2022", "k": "classic-103"}, {"left": "2022", "k": "classic-105"}, {"left": "2022", "k": "classic-106"}, {"left": "2023", "k": "classic-118"}, {"left": "2023", "k": "classic-119"}], "cls": "papers"}], "toc": false, "series": {"prev": {"k": "adv-a-geo-fm"}, "next": {"k": "adv-a-3dgs-ext"}, "up": {"u": "basics/advanced/index.html", "t": "Advanced topics 目录"}}}}</script>
<script>
(function () {
  "use strict";
  // ================= lib: DOM, text and math helpers shared by every page =================
  // A page script defines rich(text) (inline cross-links); paras() and eqList() call it.
  var DATA;
  try { DATA = JSON.parse(document.getElementById("data").textContent); } catch (e) { DATA = {}; }
  var meta = DATA.meta || {};

  // ---------- DOM helpers: all text goes through textContent; external links are https-only ----------
  function safeUrl(u) { if (typeof u !== "string") return null; var s = u.trim(); return /^https:\/\/[^\s"'<>]+$/i.test(s) ? s : null; }
  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (!Object.prototype.hasOwnProperty.call(attrs, k)) continue;
      var v = attrs[k];
      if (v === null || v === undefined || v === false) continue;
      if (k === "class") n.className = v;
      else if (k === "text") n.textContent = String(v);
      else if (k === "href") { var u = safeUrl(v); if (u) { n.setAttribute("href", u); n.setAttribute("target", "_blank"); n.setAttribute("rel", "noopener noreferrer"); } }
      else if (k.slice(0, 2) === "on" && typeof v === "function") n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, String(v));
    }
    (kids || []).forEach(function (c) { if (c === null || c === undefined || c === false) return; n.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return n;
  }
  var SVGNS = "http://www.w3.org/2000/svg";
  function sv(tag, attrs, kids) {
    var n = document.createElementNS(SVGNS, tag);
    if (attrs) for (var k in attrs) {
      if (!Object.prototype.hasOwnProperty.call(attrs, k)) continue;
      var v = attrs[k];
      if (v === null || v === undefined || v === false) continue;
      if (k === "text") n.textContent = String(v);
      else if (k.slice(0, 2) === "on" && typeof v === "function") n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, String(v));
    }
    (kids || []).forEach(function (c) { if (c) n.appendChild(c); });
    return n;
  }
  function arr(x) { return Array.isArray(x) ? x : []; }
  function str(x) { return typeof x === "string" ? x : (x === null || x === undefined ? "" : String(x)); }
  function paras(text) { return str(text).split(/\n\s*\n/).map(function (t) { return t.trim(); }).filter(Boolean).map(function (t) { return el("p", null, rich(t)); }); }
  function link(title, url) { return safeUrl(url) ? el("a", { href: url, text: title }) : el("span", { text: title }); }
  function ul(items, map) { return el("ul", { class: "plain" }, arr(items).map(function (x) { return el("li", null, [map ? map(x) : str(x)]); })); }
  function fmtCit(n) { n = Number(n); if (!(n >= 0)) return "—"; if (n >= 1000) return (n / 1000).toFixed(n >= 10000 ? 0 : 1) + "k"; return String(n); }

  // ---------- math (MathJax, typeset lazily) ----------
  var mathReady = false, mathQueue = [];
  function mathUsable() { return !!(window.MathJax && typeof window.MathJax.typesetPromise === "function"); }
  function flushMath() { mathReady = true; var q = mathQueue.slice(); mathQueue = []; q.forEach(typeset); }
  window.__atlasMathReady = flushMath;
  // MathJax may finish loading before this script runs (cached/async), so also poll for it.
  var mathPoll = setInterval(function () { if (mathUsable()) { clearInterval(mathPoll); flushMath(); } }, 200);
  setTimeout(function () { clearInterval(mathPoll); }, 30000);
  function typeset(node) {
    if (!node) return;
    if (!mathReady && mathUsable()) mathReady = true;
    if (!mathReady || !mathUsable()) { mathQueue.push(node); return; }
    try { window.MathJax.typesetPromise([node]).catch(function () { /* leave raw TeX visible */ }); } catch (e) { /* leave raw TeX visible */ }
  }
  function eqList(eqs) {
    eqs = arr(eqs).filter(function (q) { return q && str(q.tex).trim(); });
    if (!eqs.length) return null;
    return el("div", { class: "eqs" }, eqs.map(function (q) {
      return el("div", { class: "eq" }, [el("div", { class: "math-block", text: "\\[" + str(q.tex) + "\\]" }), q.explain_zh ? el("p", null, rich(q.explain_zh)) : null]);
    }));
  }
  document.addEventListener("toggle", function (e) { var t = e.target; if (t && t.tagName === "DETAILS" && t.open) typeset(t); }, true);

  // ================= frame (Tufte site): links, notes, hover previews, top bar, theme =================
  var SITE = DATA.site || {};
  var ROOT = str(SITE.root);
  var XREF = DATA.xref || {};
  function hasX(key) { return Object.prototype.hasOwnProperty.call(XREF, key); }
  // Custom page parts (search tools, diagrams, charts) register here; blocks.js calls them for {"b": "slot"} blocks.
  var SLOTS = {};

  // ---------- internal links: urls are relative to the site root; pages sit at different depths ----------
  var SAFE_PATH = /^[A-Za-z0-9][A-Za-z0-9._\/-]*(\?[A-Za-z0-9=&._-]+)?(#[A-Za-z0-9._-]+)?$/;
  function relHref(u) {
    u = str(u);
    if (/^#[A-Za-z0-9._-]+$/.test(u)) return u;
    if (!SAFE_PATH.test(u)) return null;
    var cut = u.indexOf("#"), path = cut < 0 ? u : u.slice(0, cut);
    if (path === SITE.path) return cut < 0 ? "#" : u.slice(cut);
    return ROOT + u;
  }
  function pageLink(u, text, cls) {
    var h = relHref(u);
    if (!h) return el("span", { class: cls || null, text: text });
    var a = el("a", { class: cls || null, text: text });
    a.setAttribute("href", h);
    return a;
  }
  // A link to a known entry (concept, topic, paper, step...). data-xref drives the hover preview.
  function xlink(key, text, cls) {
    if (!hasX(key)) return text ? document.createTextNode(text) : null;
    var x = XREF[key], a = pageLink(x.u, text || x.n || x.t, cls);
    a.setAttribute("data-xref", key);
    return a;
  }

  // Concept / topic ids mentioned in prose ("见 g-pinhole") become links labelled with the entry's short name.
  var ID_RE = /(a-[a-z0-9]+(?:-[a-z0-9]+)*|[fgdrilnv]-[a-z0-9]+)/g;
  var CJK = /[　-〿㐀-鿿＀-￯]/;
  function rich(text) {
    var s = str(text), out = [], last = 0, m;
    ID_RE.lastIndex = 0;
    while ((m = ID_RE.exec(s)) !== null) {
      var id = m[1], prev = m.index > 0 ? s.charAt(m.index - 1) : "", next = s.charAt(m.index + id.length);
      var key = hasX("concept-" + id) ? "concept-" + id : (hasX("adv-" + id) ? "adv-" + id : null);
      if (!key || /[A-Za-z0-9_\-]/.test(prev) || /[A-Za-z0-9_]/.test(next)) continue;
      // The prose spaces ids off from Chinese text; a Chinese label needs no such space.
      var before = s.slice(last, m.index);
      if (/ $/.test(before) && CJK.test(before.charAt(before.length - 2))) before = before.slice(0, -1);
      if (before) out.push(document.createTextNode(before));
      out.push(xlink(key, null, "xref"));
      last = m.index + id.length;
      if (s.charAt(last) === " " && CJK.test(s.charAt(last + 1))) last++;
    }
    if (last < s.length) out.push(document.createTextNode(s.slice(last)));
    return out;
  }
  function lines(text) { return str(text).split(/\n+/).map(function (t) { return t.trim(); }).filter(Boolean).map(function (t) { return el("p", null, rich(t)); }); }

  // ---------- side notes (numbered) and margin notes (unnumbered); on phones they fold behind a toggle ----------
  var noteSeq = 0;
  function sidenote(kids) {
    var id = "sn-" + (++noteSeq);
    return el("span", { class: "note-wrap" }, [
      el("label", { for: id, class: "margin-toggle sidenote-number", "aria-label": "旁注" }),
      el("input", { type: "checkbox", id: id, class: "margin-toggle" }),
      el("span", { class: "sidenote" }, kids)
    ]);
  }
  function marginnote(kids) {
    var id = "mn-" + (++noteSeq);
    return el("span", { class: "note-wrap" }, [
      el("label", { for: id, class: "margin-toggle", "aria-label": "边注", text: "⊕" }),
      el("input", { type: "checkbox", id: id, class: "margin-toggle" }),
      el("span", { class: "marginnote" }, kids)
    ]);
  }
  function noteLabel(text) { return el("span", { class: "note-label", text: text }); }

  // ---------- article scaffolding ----------
  var main = document.getElementById("main");
  var art = main.querySelector("article");
  function section(id, title, kids) {
    var s = el("section", { id: id }, [title ? el("h2", { text: title }) : null].concat(kids));
    art.appendChild(s);
    return s;
  }
  function articleHead(o) {
    var crumbs = el("nav", { class: "crumbs", "aria-label": "位置" });
    arr(SITE.crumbs).forEach(function (c, i) {
      if (i) crumbs.appendChild(el("span", { class: "sep", text: "›", "aria-hidden": "true" }));
      crumbs.appendChild(c[1] ? pageLink(c[1], c[0]) : el("span", { text: c[0] }));
    });
    art.appendChild(el("header", { class: "art-head" }, [
      crumbs,
      el("h1", { text: o.title }),
      o.subtitle ? el("p", { class: "subtitle", text: o.subtitle }) : null,
      o.meta ? el("p", { class: "meta" }, o.meta) : null
    ]));
    if (o.epigraph) art.appendChild(el("div", { class: "epigraph" }, [el("blockquote", null, [el("p", null, rich(o.epigraph))])]));
  }
  // Previous / next in the series, each with its hover preview.
  function seriesNav(prevKey, nextKey, indexUrl, indexLabel) {
    var nav = el("nav", { class: "series", "aria-label": "同系列" });
    nav.appendChild(el("div", { class: "prev" }, prevKey && hasX(prevKey) ? [el("small", { text: "上一篇" }), xlink(prevKey)] : []));
    nav.appendChild(el("div", { class: "up" }, indexUrl ? [pageLink(indexUrl, indexLabel)] : []));
    nav.appendChild(el("div", { class: "next" }, nextKey && hasX(nextKey) ? [el("small", { text: "下一篇" }), xlink(nextKey)] : []));
    art.appendChild(nav);
  }

  // ---------- hover preview for internal links: mouse (after 300 ms) or keyboard focus; never on touch ----------
  var tip = null, tipTimer = 0, tipFor = null;
  function hideTip() {
    clearTimeout(tipTimer);
    if (tip) tip.hidden = true;
    if (tipFor) { tipFor.removeAttribute("aria-describedby"); tipFor = null; }
  }
  function showTip(a) {
    var key = a.getAttribute("data-xref");
    if (!hasX(key)) return;
    var x = XREF[key];
    if (!tip) { tip = el("div", { class: "xtip", id: "xtip", role: "tooltip" }); document.body.appendChild(tip); }
    tip.textContent = "";
    if (x.m) tip.appendChild(el("div", { class: "xt-m", text: x.m }));
    tip.appendChild(el("div", { class: "xt-t", text: x.t }));
    if (x.e) tip.appendChild(el("div", { class: "xt-e", text: x.e }));
    if (x.s) tip.appendChild(el("p", { class: "xt-s", text: x.s }));
    tip.hidden = false;
    var r = a.getClientRects()[0] || a.getBoundingClientRect(), vw = document.documentElement.clientWidth;
    var w = tip.offsetWidth, h = tip.offsetHeight;
    var left = Math.max(8, Math.min(r.left, vw - w - 8));
    var top = r.bottom + 6;
    if (top + h > window.innerHeight - 8 && r.top - h - 6 > 8) top = r.top - h - 6;
    tip.style.left = Math.round(left + window.pageXOffset) + "px";
    tip.style.top = Math.round(top + window.pageYOffset) + "px";
    a.setAttribute("aria-describedby", "xtip");
    tipFor = a;
  }
  function xrefTarget(e) { return e.target && e.target.closest ? e.target.closest("a[data-xref]") : null; }
  document.addEventListener("pointerover", function (e) {
    var a = xrefTarget(e);
    if (!a || e.pointerType !== "mouse" || a === tipFor) return;
    clearTimeout(tipTimer);
    tipTimer = setTimeout(function () { showTip(a); }, 300);
  });
  document.addEventListener("pointerout", function (e) {
    var a = xrefTarget(e);
    if (!a || (e.relatedTarget && a.contains(e.relatedTarget))) return;
    hideTip();
  });
  document.addEventListener("focusin", function (e) {
    var a = xrefTarget(e);
    if (a && a.matches(":focus-visible")) showTip(a);
  });
  document.addEventListener("focusout", function (e) { if (xrefTarget(e)) hideTip(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") hideTip(); });
  window.addEventListener("scroll", function () { if (tipFor && !tipFor.matches(":focus-visible")) hideTip(); }, { passive: true });

  // ---------- top bar: four menus with dropdowns (hover or click on desktop, a folding list on phones) ----------
  var wide = window.matchMedia("(min-width: 761px)");
  function setOpen(li, open) {
    var btn = li.querySelector(".menu-btn");
    if (open) Array.prototype.forEach.call(li.parentNode.children, function (o) { if (o !== li) setOpen(o, false); });
    li.classList.toggle("open", open);
    btn.setAttribute("aria-expanded", open ? "true" : "false");
    if (!open) li._hover = false;
  }
  function buildTopbar() {
    var bar = document.getElementById("topbar");
    var menus = el("ul", { class: "menus", id: "menus" });
    arr(SITE.nav).forEach(function (m) {
      var id = "menu-" + m.key;
      var btn = el("button", { type: "button", class: "menu-btn", "aria-expanded": "false", "aria-controls": id, text: m.label });
      var list = el("ul", { class: "drop", id: id }, arr(m.items).map(function (it) {
        var a = pageLink(it[1], it[0]);
        if (it[1] === SITE.navItem) a.classList.add("cur");
        if (it[1] === SITE.path) a.setAttribute("aria-current", "page");
        return el("li", null, [a]);
      }));
      var li = el("li", { class: "menu" + (m.key === SITE.navCur ? " cur" : "") }, [btn, list]);
      btn.addEventListener("click", function () {
        // A click on a menu the mouse already opened keeps it open instead of closing it again.
        if (li._hover) { li._hover = false; return; }
        setOpen(li, !li.classList.contains("open"));
      });
      btn.addEventListener("keydown", function (e) {
        if (e.key === "ArrowDown") { e.preventDefault(); setOpen(li, true); var f = list.querySelector("a"); if (f) f.focus(); }
      });
      li.addEventListener("pointerenter", function (e) { if (e.pointerType === "mouse" && wide.matches) { setOpen(li, true); li._hover = true; } });
      li.addEventListener("pointerleave", function (e) { if (e.pointerType === "mouse" && wide.matches) setOpen(li, false); });
      li.addEventListener("focusout", function (e) { if (wide.matches && !li.contains(e.relatedTarget)) setOpen(li, false); });
      li.addEventListener("keydown", function (e) { if (e.key === "Escape" && li.classList.contains("open")) { setOpen(li, false); btn.focus(); } });
      menus.appendChild(li);
    });
    var burger = el("button", { type: "button", class: "burger", "aria-expanded": "false", "aria-controls": "menus", text: "Menu" });
    burger.addEventListener("click", function () {
      var open = !bar.classList.contains("nav-open");
      bar.classList.toggle("nav-open", open);
      burger.setAttribute("aria-expanded", open ? "true" : "false");
    });
    var themeBtn = el("button", { type: "button", class: "theme-btn" });
    function darkNow() {
      var t = document.documentElement.getAttribute("data-theme");
      return t ? t === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
    }
    function paintThemeBtn() {
      var dark = darkNow();
      themeBtn.textContent = dark ? "Light" : "Dark";
      themeBtn.setAttribute("aria-label", dark ? "切换到浅色" : "切换到深色");
    }
    themeBtn.addEventListener("click", function () {
      var next = darkNow() ? "light" : "dark";
      var system = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      // Choosing what the system already shows drops the override, so the page follows the system again.
      if (next === system) document.documentElement.removeAttribute("data-theme");
      else document.documentElement.setAttribute("data-theme", next);
      try { if (next === system) localStorage.removeItem("atlas-theme"); else localStorage.setItem("atlas-theme", next); } catch (e) { /* storage unavailable */ }
      paintThemeBtn();
    });
    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", paintThemeBtn);
    paintThemeBtn();
    bar.appendChild(el("div", { class: "bar-in" }, [pageLink("index.html", SITE.brand || "", "brand"), el("nav", { class: "site-nav", "aria-label": "站点导航" }, [menus]), themeBtn, burger]));
    document.addEventListener("click", function (e) {
      if (!bar.contains(e.target)) Array.prototype.forEach.call(menus.children, function (li) { setOpen(li, false); });
    });
  }

  function finishPage() {
    buildTopbar();
    var foot = document.getElementById("site-foot");
    if (foot) foot.appendChild(el("p", null, [pageLink("index.html", SITE.brand || ""), SITE.date ? " · 内容截至 " + SITE.date : ""]));
    typeset(main);
    // Deep links (#id): the page is rendered by script, so jump once it exists and again after fonts settle.
    var h = window.location.hash ? window.location.hash.slice(1) : "";
    if (h && /^[A-Za-z0-9._~-]+$/.test(h) && document.getElementById(h)) {
      var moved = false;
      ["wheel", "touchstart", "keydown", "mousedown"].forEach(function (ev) { window.addEventListener(ev, function () { moved = true; }, { once: true, passive: true }); });
      var settle = function () { var t = document.getElementById(h); if (t && !moved) t.scrollIntoView({ block: "start" }); };
      settle();
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { window.requestAnimationFrame(settle); });
      [400, 1200, 2500].forEach(function (ms) { setTimeout(settle, ms); });
    }
  }

  // ================= article: a page composed as blocks in routes.py =================
  (function () {
    var PG = DATA.page || {};
    var H = PG.head || {};
    if (PG.id) art.id = PG.id;

    // A link dict from routes.py: {k} an entry with hover preview, {u, t} a page of this site, {url, t} an external page.
    function part(x) {
      if (x === null || x === undefined) return null;
      if (typeof x === "string") return x;
      if (x.k) return xlink(x.k, x.t || null);
      if (x.u) return pageLink(x.u, x.t || x.u);
      if (x.url) return link(x.t || x.url, x.url);
      return x.t ? str(x.t) : null;
    }
    function noteNodes(n) {
      var kids = [noteLabel(n.label)];
      if (n.t) kids = kids.concat(rich(n.t));
      arr(n.links).forEach(function (l, i) { if (i) kids.push(el("br")); kids.push(part(l)); });
      return kids;
    }
    function runIn(label) { return el("b", { class: "run-in", text: label + "：" }); }
    function multiline(text) {
      var out = [];
      str(text).split("\n").forEach(function (line, i) { if (i) out.push(el("br")); out = out.concat(rich(line)); });
      return out;
    }

    // ---------- head ----------
    var meta = [];
    if (arr(H.prereqs).length) {
      meta.push(marginnote([noteLabel("阅读前需要")].concat(arr(H.prereqs).map(function (p, i) {
        var a = part(p);
        return i ? el("span", null, ["；", a]) : a;
      }))));
    }
    var sep = false;
    arr(H.meta).concat(H.minutes > 1 ? ["约 " + H.minutes + " 分钟"] : []).forEach(function (x) {
      var n = part(x);
      if (!n || (typeof n === "string" && !n.trim())) return;
      if (sep) meta.push(" · ");
      meta.push(n);
      sep = !(typeof x === "string" && /：$/.test(x));
    });
    articleHead({ title: H.title, subtitle: H.sub, meta: meta.length ? meta : null, epigraph: H.epigraph });
    if (str(H.lede).trim()) art.appendChild(el("div", { class: "lede" }, paras(H.lede)));

    // ---------- blocks ----------
    function heading(tag, b) {
      var title = b.url && safeUrl(b.url) ? link(b.t, b.url) : (b.k ? part({ k: b.k, t: b.t }) : str(b.t));
      var h = el(tag, { id: b.id || null }, [title]);
      if (b.sn) h.appendChild(sidenote(noteNodes(b.sn)));
      if (b.en) h.appendChild(el("span", { class: "en", text: b.en }));
      if (b.tag) h.appendChild(el("span", { class: "used", text: b.tag }));
      return h;
    }
    function withNotes(nodes, b) {
      if (nodes.length && b.mn) nodes[0].insertBefore(marginnote(noteNodes(b.mn)), nodes[0].firstChild);
      if (nodes.length && b.label) nodes[0].insertBefore(runIn(b.label), nodes[0].firstChild);
      return nodes;
    }
    function listItem(x) {
      if (typeof x === "string") return el("li", null, rich(x));
      return el("li", null, (x.label ? [runIn(x.label)] : []).concat(rich(x.t)));
    }
    function refsList(items, cls) {
      var left = items.some(function (x) { return x.left; });
      return el("ul", { class: "refs " + (cls || "") + (left ? "" : " noleft") }, items.map(function (x) {
        var body = [x.k || x.u || x.url ? part(x) : el("span", { class: "plain-t", text: x.t })];
        if (x.tag) body.push(el("span", { class: "used", text: x.tag }));
        if (x.sub) body.push(el("div", { class: "en", text: x.sub }));
        if (str(x.gloss).trim()) body.push(el("div", { class: "gloss" }, multiline(x.gloss)));
        var kids = left ? [el("span", { class: /^\d{4}$/.test(str(x.left)) ? "yr" : "kind", text: str(x.left) })] : [];
        return el("li", { id: x.id || null }, kids.concat([el("div", null, body)]));
      }));
    }
    var TY = { book: "教材", course: "课程", paper: "论文", tutorial: "教程", code: "代码", video: "视频", blog: "文章" };
    function tocGroups(groups, level) {
      var out = [];
      arr(groups).forEach(function (g) {
        if (g.h) out.push(el(level, { class: "toc-h" }, [g.k || g.u ? part({ k: g.k, u: g.u, t: g.h }) : g.h]));
        if (str(g.lede).trim()) out.push(el("p", { class: "toc-lede" }, rich(g.lede)));
        out.push(el("ol", { class: "toc" }, arr(g.items).map(function (it) {
          return el("li", null, [
            el("div", { class: "toc-t" }, [part({ k: it.k, u: it.u, t: it.t }), it.en ? el("span", { class: "en", text: it.en }) : null,
              it.meta ? el("span", { class: "toc-meta", text: it.meta }) : null]),
            str(it.s).trim() ? el("p", { class: "toc-s", text: it.s }) : null
          ]);
        })));
      });
      return out;
    }
    function cell(tag, c) { return el(tag, null, c && typeof c === "object" ? [part(c)] : rich(c)); }

    var box = null;
    function cur() { if (!box) { box = el("section"); art.appendChild(box); } return box; }
    function render(b) {
      switch (b.b) {
        case "p": return withNotes(paras(b.t), b);
        case "lines": return withNotes(lines(b.t), b);
        case "h3": return [heading("h3", b)];
        case "note": return [el("p", { class: "note", text: b.t })];
        case "ul": case "ol": return [el(b.b, null, arr(b.items).map(listItem))];
        case "eqs": return [eqList(b.eqs)];
        case "qa": return [el("p", { class: "quiz-h", text: "自测" }), el("ol", { class: "quiz" }, arr(b.items).map(function (q) {
          return el("li", null, [el("p", null, rich(q.q)), el("details", null, [el("summary", { text: "答案" }), el("p", null, rich(q.a))])]);
        }))];
        case "res": return [refsList(arr(b.items).map(function (r) {
          return { left: TY[r.type] || r.type || "", url: r.url, t: r.title, gloss: r.note_zh };
        }))];
        case "refs": return [refsList(arr(b.items), b.cls)];
        case "toc": return tocGroups(b.groups, cur().querySelector("h2") ? "h3" : "h2");
        case "table": return [el("div", { class: "table-wrap" + (b.wide ? " fullwidth" : "") }, [el("table", { class: "booktabs" + (b.cls ? " " + b.cls : "") }, [
          el("thead", null, [el("tr", null, arr(b.head).map(function (h) { return el("th", { text: h }); }))]),
          el("tbody", null, arr(b.rows).map(function (r) { return el("tr", null, arr(r).map(function (c) { return cell("td", c); })); }))
        ])])];
        case "timeline": return [el("ul", { class: "refs timeline" }, arr(b.items).map(function (x) {
          return el("li", null, [el("span", { class: "yr", text: str(x[0]) }), el("div", null, rich(x[1]))]);
        }))];
        case "kv": return [el("table", { class: "kv" }, [el("tbody", null, arr(b.items).map(function (x) {
          return el("tr", null, [el("th", { text: x[0] }), el("td", null, rich(x[1]))]);
        }))])];
        case "mtoc": return [marginToc(b.items)];
        case "slot": return typeof SLOTS[b.name] === "function" ? [SLOTS[b.name](b)] : [];
        default: return [];
      }
    }
    // Long articles: a table of contents at the top of the margin (a folding list on phones).
    function marginToc(items) {
      var d = el("details", { class: "mtoc" }, [el("summary", { text: "本文目录" }), el("ol", null, arr(items).map(function (x) { return el("li", null, [part(x)]); }))]);
      var wide = window.matchMedia("(min-width: 761px)");
      d.open = wide.matches;
      return d;
    }
    arr(PG.body).forEach(function (b) {
      if (b.b === "sec") {
        box = el("section", { id: b.id || null });
        if (b.h) box.appendChild(heading("h2", { t: b.h, sn: b.sn }));
        art.appendChild(box);
        return;
      }
      render(b).forEach(function (n) { if (n) cur().appendChild(n); });
    });

    var S = PG.series || {};
    if (S.prev || S.next || S.up) {
      var nav = el("nav", { class: "series", "aria-label": "同系列" });
      nav.appendChild(el("div", { class: "prev" }, S.prev ? [el("small", { text: "上一篇" }), part(S.prev)] : []));
      nav.appendChild(el("div", { class: "up" }, S.up ? [part(S.up)] : []));
      nav.appendChild(el("div", { class: "next" }, S.next ? [el("small", { text: "下一篇" }), part(S.next)] : []));
      art.appendChild(nav);
    }
  })();

  finishPage();
})();
</script>
</body>
