an把注册从影棚搬到手机：先在数百人的影棚数据上训练通用先验，再用一段手机扫描做个性化。3DGS出现后，RGCA（CVPR 2024 Oral）用3D高斯捕获亚毫米级发丝与毛孔，并做到全频实时重光照。URAvatar（SIGGRAPH Asia 2024）能从未知光照下的手机扫描得到可重光照、可驱动的头像。Codec Avatar Studio（NeurIPS 2024）公开了两套数据：Ava-256有256人的影棚与头显配对采集，Goliath-4有4人、每人8种模态。端侧部署上，SqueezeMe把姿态校正解码器从50 ms压到0.45 ms，在Quest 3上以72 FPS同时驱动3个全身高斯化身。GPiCA用网格加16,384个高斯的混合表示，在Quest 3上10.9 ms渲染一帧，画质优于65k高斯的纯3DGS（后者要19.3 ms）。LUCAS和HairCUP把脸和头发分层建模，便于组合与编辑。\n\n2023年3DGS发表后，学术界很快转向高斯化身。NeRSemble（16台7.1MP、73fps相机，220多人，4700多段序列）成为头像研究的主要基准。GaussianAvatars把高斯绑定在FLAME三角面上，表情、姿态和视角都完全可控。Gaussian Head Avatar用学习型形变场捕获细微表情。Animatable Gaussians用正反两张Gaussian map加StyleGAN式CNN，建模全身服装的动态。ExAvatar从单目短视频学出SMPL-X加高斯的全身化身，表情和手势都能驱动。TaoAvatar把形变蒸馏进轻量MLP，在Apple Vision Pro上以90 FPS做立体渲染。这一阶段的共同点是“逐人优化”：要有多视角影棚数据或单目视频，每个人训练数十分钟到数小时。\n\n2024到2026年最大的变化，是从逐人优化转向feed-forward的“大化身模型”。GAGAvatar首次做到单次前向，从一张图生成可实时重演的高斯头像。LAM（SIGGRAPH 2025）用以FLAME点为query的Transformer，在A100上1.4秒生成可直接用LBS驱动的高斯头像，渲染速度562.9 FPS，在小米14手机上也超过110 FPS。Avat3r结合LRM与DUSt3R、Sapiens特征，从4张图回归出可驱动头像。LHM和GUAVA（约0.1秒）把feed-forward扩展到全身和上半身。2026年UIKA、FastGHA、ELITE继续提升质量和速度，UIKA的驱动速度达到220 FPS。Meta在2026年推出的Large-scale Codec Avatars（LCA，CVPR 2026）可以看作化身的“基础模型时刻”：800M参数的模型先在100万段野外单目视频上预训练，再用2,737名受试者、200台4K相机的影棚数据后训练，一次前向生成含65,536个高斯的全身化身。它初始化约2.1秒，逐帧解码1.7 ms（A100上586 FPS）；在影棚测试集上PSNR为30.5 dB，比LHM高约5 dB，还出现了重光照、处理宽松衣物等未经专门监督的能力。GenLCA把前馈重建模型当作3D tokenizer，在百万级视频上训练全身3D扩散模型。FiCA用14,487个身份训练，能从单张人像约5秒生成可实时驱动的高斯Codec Avatar。\n\n化身的另一半难题是驱动。Universal Facial Encoding（SIGGRAPH 2024）先用17K人、6亿帧头显红外数据做跨视角自监督预训练，再从4路斜视、只拍到局部的红外相机图像中，在4.98 ms内编码出与身份无关的表情潜码，光度误差比Meta Movement SDK低约21%。GenHMC用扩散模型合成与影棚表情对应的红外头显图像，省去昂贵的配对采集。音频驱动方面，Meta的实时“音频→表情潜码”模型GPU耗时低于15 ms；UniGAHA把音频直接映射到通用头像先验的潜空间；Audio2Photoreal从对话语音生成全身手势。第一人称驱动方面，EgoAvatar只用单路egocentric RGB视频就能驱动全身照片级化身；EgoRelight（2026）只用一个HMD，就同时完成全身驱动、重光照和HDR环境估计。重光照已从RGCA、URAvatar扩展到全身（Relightable Full-Body GCA，SIGGRAPH 2025），采集式路线也开始支持：Relightable Holoported Characters只需4路相机就能对动态表演重光照。采集式系统里HMD遮挡人脸的问题，也可以用基于参考帧与关键点的视频修复（Geometry-Aware Video Inpainting）来补救，但真实度和时序一致性仍不如直接驱动的化身。\n\n截至2026年9月，化身式远程临场已进入产品阶段。Apple Vision Pro从2024年起提供Persona；visionOS 26（2025）的新Persona在设备上几秒内完成注册，官方称用了体渲染与机器学习，提供完整侧脸和更准确的头发、睫毛与肤色。阿里巴巴把LAM接入OpenAvatarChat，用于3D对话数字人。Meta研究团队已在Quest 3上实时驱动多个全身化身；2026年8到9月有报道称Horizon OS中出现了基于Codec Avatars的Hologram Calling框架，Connect 2026可能演示全身照片级通话，但写作时尚未经官方确认。Google Beam（原Starline，HP Dimension于2025年发布）则坚持采集式路线：6路相机加AI体积视频模型加光场显示，60 fps。与此同时，VASA-1（512×512、40 FPS）、StreamAvatar等2D流式视频扩散模型在平面视频通话场景中与3D化身竞争。总体看，SOTA已做到：影棚级化身能在一体机上实时渲染多人全身，手机或单图注册降到秒级，头显驱动延迟在个位数毫秒量级。仍未解决的是“真实性”，即如何保证化身忠实反映此刻的真人。", "subtopics": [{"name_en": "Codec Avatars & Universal Priors", "name_zh": "Codec Avatars谱系与通用先验", "summary_zh": "Meta Reality Labs自2018年起的主线。基本范式是VAE编码、传输潜码、在接收端解码渲染。表示从“网格+视角相关纹理”（DAM）演进到体素原语（MVP）、3D高斯（RGCA），再到移动端的网格+高斯混合（GPiCA）。注册从影棚逐步走向手机扫描，做法是“通用先验+个性化”。支撑数据集有Ava-256和Goliath-4，分层/组合先验有LUCAS和HairCUP，端侧部署有PiCA和SqueezeMe。", "representative_works": ["Deep Appearance Models for Face Rendering", "Mixture of Volumetric Primitives", "Pixel Codec Avatars", "Authentic Volumetric Avatars from a Phone Scan", "Codec Avatar Studio", "SqueezeMe", "Gaussian Pixel Codec Avatars"]}, {"name_en": "Per-subject Gaussian Head & Body Avatars", "name_zh": "逐人优化的高斯头像与全身化身", "summary_zh": "3DGS出现后，学术界的主流是把高斯绑定到参数化模型（FLAME/SMPL-X）上，或把高斯参数化到UV/Gaussian map上，从多视角或单目视频为每个人单独优化出高保真、可驱动的头像或全身化身。质量很高，但注册要数十分钟到数小时。", "representative_works": ["NeRSemble", "GaussianAvatars", "Gaussian Head Avatar", "Animatable Gaussians", "Expressive Whole-Body 3D Gaussian Avatar (ExAvatar)", "TaoAvatar"]}, {"name_en": "Relightable Avatars", "name_zh": "可重光照化身", "summary_zh": "要让化身在MR中与本地环境光一致，就需要可重光照的外观模型。发展脉络是：RGCA用球谐加球面高斯做全频实时重光照；URAvatar从手机扫描得到可重光照的通用先验；全身化身用局部/非局部光传输分解；采集式的RHC在稀疏视角下也能重光照；EgoRelight只用单个头显估计HDR环境光。", "representative_works": ["Relightable Gaussian Codec Avatars", "URAvatar", "Relightable Full-Body Gaussian Codec Avatars", "Relightable Holoported Characters", "EgoRelight"]}, {"name_en": "Feed-forward & Large Avatar Models", "name_zh": "Feed-forward与大规模化身模型", "summary_zh": "2024到2026年的核心趋势：用Transformer/LRM从单图、少图或手机视频一次前向回归出可驱动的高斯化身，注册时间从小时级降到秒级。进一步的做法是在百万级野外视频上预训练、再用影棚数据后训练（LCA），以及训练3D生成式扩散先验（GenLCA）。", "representative_works": ["GAGAvatar", "LAM", "Avat3r", "LHM", "UIKA", "Large-scale Codec Avatars", "FiCA"]}, {"name_en": "Headset/Egocentric Driving & HMD Removal", "name_zh": "头显/第一人称驱动与HMD移除", "summary_zh": "研究如何从头显内置的红外相机、下视立体相机或单路第一人称RGB相机，实时估计与身份无关的表情和全身姿态来驱动化身；如何用生成模型合成头显训练数据；以及在采集式系统中如何去掉HMD对人脸的遮挡。Apple Persona是这一方向最成熟的商用系统。", "representative_works": ["Universal Facial Encoding of Codec Avatars from VR Headsets", "Generative Head-Mounted Camera Captures (GenHMC)", "EgoAvatar", "Geometry-Aware Video Inpainting for HMD Removal", "Apple visionOS 26 Personas"]}, {"name_en": "Audio-driven & Generative Talking Avatars", "name_zh": "音频驱动与生成式对话化身", "summary_zh": "用语音驱动3D化身的面部甚至全身（弥补视觉信号缺失、降低带宽），或者用2D视频扩散模型从单张照片实时生成说话视频。3D方向走通用头像先验加实时音频编码器（延迟低于15 ms），2D方向走流式蒸馏的视频扩散。", "representative_works": ["Audio2Photoreal", "VASA-1", "Audio-Driven Universal Gaussian Head Avatars", "Audio Driven Real-Time Facial Animation for Social Telepresence", "StreamAvatar"]}, {"name_en": "Capture-based Human Telepresence (Contrast)", "name_zh": "采集/IBR式人体远程临场（对照）", "summary_zh": "作为对照：每帧用稀疏多相机实时采集真人，通过人体专用的前馈高斯回归、个性化网格加实时纹理或AI体积视频模型合成新视角。与Quark、Ha et al.同属“所见即所拍”的路线，但普遍引入了人体先验。", "representative_works": ["GPS-Gaussian", "Holoported Characters", "Tele-Aloha", "Google Beam / HP Dimension"]}], "timeline": [{"year": 2018, "event_zh": "Deep Appearance Models提出基于VAE的Codec Avatar：编码潜码、传输、解码渲染"}, {"year": 2021, "event_zh": "MVP用体素原语表达头发等细薄结构；Pixel Codec Avatars在Quest 2上同时实时渲染5个头像"}, {"year": 2022, "event_zh": "Authentic Volumetric Avatars from a Phone Scan：“通用先验+手机扫描个性化”范式诞生"}, {"year": 2023, "event_zh": "NeRSemble发布多视角动态头部数据集（220多人）；3DGS在SIGGRAPH 2023发表，随后迅速成为化身的主流表示"}, {"year": 2024, "event_zh": "CVPR 2024集中出现高斯化身：GaussianAvatars、Gaussian Head Avatar、Animatable Gaussians、RGCA（Oral）"}, {"year": 2024, "event_zh": "Apple Vision Pro发售，Persona成为首个大规模商用的照片级化身通话功能"}, {"year": 2024, "event_zh": "Universal Facial Encoding（SIGGRAPH 2024）实现从头显红外相机通用驱动；Tele-Aloha与GPS-Gaussian代表采集式人体远程临场"}, {"year": 2024, "event_zh": "URAvatar实现手机扫描生成可重光照头像；Codec Avatar Studio公开Ava-256和Goliath-4；GAGAvatar开启单图前馈高斯头像"}, {"year": 2025, "event_zh": "Feed-forward大化身模型爆发：LAM（1.4秒生成，手机110+ FPS）、Avat3r、LHM、GUAVA"}, {"year": 2025, "event_zh": "SqueezeMe在Quest 3上以72 FPS同时驱动3个全身高斯Codec Avatar；Relightable Full-Body GCA发表于SIGGRAPH 2025"}, {"year": 2025, "event_zh": "visionOS 26推出全新体渲染Persona；Google Beam/HP Dimension发布，采集式路线商用"}, {"year": 2025, "event_zh": "GenHMC用生成式数据替代影棚与头显配对采集；实时音频驱动表情低于15 ms；UniGAHA实现音频驱动的通用头像"}, {"year": 2026, "event_zh": "Large-scale Codec Avatars（CVPR 2026）：800M参数，先在100万段野外视频上预训练、再用影棚数据后训练，进入化身“基础模型”阶段"}, {"year": 2026, "event_zh": "GenLCA（全身3D扩散）、FiCA（单图约5秒生成Codec Avatar）、UIKA、ELITE、EgoRelight等相继发表"}, {"year": 2026, "event_zh": "8至9月有报道称Horizon OS中出现基于Codec Avatars的Hologram Calling框架，Meta Connect 2026可能演示全身照片级通话（未经官方确认）"}], "trends_zh": ["表示统一到3DGS及其混合形态：2024年起高斯取代体素和纯网格，成为照片级化身的主力表示；移动端则转向“网格+少量高斯”的混合（GPiCA用16k高斯，另有LUCAS、ExAvatar）。", "注册从小时级降到秒级：影棚采集加逐人优化，演进到手机扫描加反渲染微调（URAvatar），再到单图或少图前馈生成（LAM 1.4秒，FiCA约5秒，GUAVA约0.1秒）。", "化身进入“基础模型”阶段：先在百万级野外视频上预训练，再用影棚数据后训练（LCA，800M参数），并出现生成式3D扩散先验（GenLCA）。重光照、宽松衣物等能力在规模化后自然出现。", "端侧部署持续推进：PiCA在Quest 2上同时跑5个头像，SqueezeMe在Quest 3上以72 FPS跑3个全身化身，TaoAvatar在Vision Pro上90 FPS，LAM在手机上超过110 FPS；ESCA等量化加专用加速器的算法-硬件协同设计也已出现。", "驱动信号走向多模态、低成本：头显红外相机（Universal Facial Encoding）、第一人称或下视相机（EgoAvatar、EgoRelight）、音频（延迟低于15 ms）都可驱动；生成式合成训练数据（GenHMC）正在替代昂贵的配对采集。", "重光照成为MR合成的标配：从RGCA、URAvatar扩展到全身，再到只用头显估计环境光（EgoRelight）；采集式的RHC也具备了重光照能力。", "组合式、分层化身：脸、头发、服装、眼镜等解耦建模（LUCAS、HairCUP），支持编辑、个性化与模型外外观的部分补全。", "2D流式视频扩散化身（VASA-1、StreamAvatar）实时化，与3D化身并行发展：平面视频通话和沉浸式空间通话可能各自选择不同的技术栈。", "采集式与化身式在技术上趋同：采集式引入个性化人体先验与重光照（Holoported Characters、RHC），化身式追求实时真实性；产业上Apple和Meta押注化身，Google Beam坚持采集。"], "open_problems_zh": ["真实性与信任：化身是由先验“生成”的，并非“拍摄”的。如何度量并保证它忠实反映此刻的真人（微表情、情绪、身体状态）？如何做身份认证、防冒用与深度伪造、水印与溯源？", "模型外内容：手持物体、与环境的交互、临时换装、眼镜、发型、妆容等化身难以呈现，需要把化身先验与实时采集（IBR）残差融合成混合表示。", "驱动的完整性：头显红外相机只能斜视看到局部，舌头、口腔内部、细微眼周表情和眼神接触仍然难以还原；全身驱动依赖稀疏下视相机或IMU，手与物体的交互和遮挡处理不足。", "注册便捷性与质量的权衡：单图前馈（如FiCA，PSNR约24.5）与影棚级后训练模型（LCA，PSNR约30.5）之间仍有明显差距；背面、头发、牙齿等不可见区域依赖生成先验，存在身份漂移。", "端侧算力与多人规模：一体机需要同时解码、渲染多个全身化身，还要给MR其他任务留出算力；功耗、内存、LOD和化身的流式传输格式都缺乏标准。", "光照与合成一致性：MR中要从头显实时估计环境光，并与本地真实场景保持阴影、互反射一致；全身的非局部光传输代价仍然高。", "数据、公平与隐私：影棚与头显的配对数据昂贵，且集中在少数公司手中；肤色、发型、年龄、服饰的多样性与公平性仍有问题；生物特征数据的隐私与合规也待解决。", "评测体系缺失：PSNR和LPIPS反映不出临场感、身份与表情的可信度以及端到端延迟的体验，目前缺少统一的、面向远程临场的人体基准和主观评测协议，也缺少化身式与采集式之间的公平对比基准。"], "relation_to_anchors_zh": "Quark（Google，SIGGRAPH Asia 2024）和Ha et al.（KAIST与Meta，CVPR 2025）都属于采集/IBR式路线。Quark每帧用8路输入，以分层深度图（LDM）加Transformer多视角聚合、迭代“渲染-精修”，在单张A100上以30 fps生成1080p新视角，不带任何人体先验，训练数据是通用场景（Spaces、RFF、Nex-Shiny、SWORD）。Ha et al.用RAFT-Stereo深度加颜色差分掩码逐步精修深度，并用TSDF累积全局几何来引导预训练的混合网络，每帧约100 ms，主要解决稀疏视角IBR的跨视角与时间闪烁。本章与两篇锚点论文的关系可归纳为四点。其一，失败模式互补：IBR在视角稀疏和被遮挡处（尤其用户戴HMD时的人脸）会失败，化身凭借强人体先验可以补上不可见区域；反过来，化身呈现不了模型之外的内容（手持物品、临时装扮、新发型），IBR则所见即所拍，天然可信。其二，几何先验构成一条连续谱：Quark不用先验；Ha et al.用TSDF这一“通用几何先验”换取时间一致性；Holoported Characters和RHC用“个性化骨架驱动网格”作先验，再由4路实时视图贴纹理或重光照；Codec Avatar把先验推到极致，外观完全由潜码生成。未来的混合系统很可能在化身先验之上叠加实时IBR残差，用化身保证遮挡区域和时序稳定，用IBR保证真实性。其三，方法论趋同：Quark、GPS-Gaussian与LAM、Avat3r、LCA都用Transformer前馈回归高斯或分层表示，并依赖大规模预训练，区别只在于是否跨帧持久保留“身份”。把Quark式逐帧前馈重建与LCA式持久身份先验结合，是一个自然的研究方向。其四，系统指标与评测：化身只需传输表情潜码和姿态，接收端渲染在GPU上可达数百FPS，在一体机上也能达到72 FPS，带宽与部署成本远低于要传多路视频的IBR；但两篇锚点论文的评测都在通用或动态场景数据集（Spaces、RFF、DyNeRF、ENeRF-Outdoor、D3DMV）上进行，没有专门评测人脸身份与表情保真度。若用Ava-256、NeRSemble、Goliath等人体数据集，按远程临场的需求对IBR方法做评测，会是连接两条路线的重要一步。"}, {"key": "display-hci", "area_title_zh": "显示、人因与 HCI：3D Telepresence 的“最后一公里”", "overview_zh": "在 3D telepresence 系统里，显示与人因负责“最后一公里”：上游的采集、重建和 view synthesis（例如 Quark、Ha et al.）最终都要送进一块具体的显示器，由一个具体的人来感知和评判。显示形态直接决定上游算法要满足的指标：每帧要渲染多少视点、端到端延迟和头追踪延迟的预算有多大、能容忍多少时间闪烁、能不能还原眼神接触。早期工作主要解决单点问题。Kuster et al. 2012（Gaze correction for home video conferencing）用单个消费级 RGB-D 相机合成正视视角来校正视线；Holoportation（UIST 2016）把多深度相机的实时体重建与 HoloLens 结合，第一次让远端的人以 3D 形式“出现”在本地空间；VirtualCube（IEEE VR 2022 最佳期刊论文）用“3 块屏 + 6 台 RGBD 相机”的标准化隔间，在多方会议中保持相互眼神和注意力关系。\n\n分水岭是 Project Starline（Lawrence et al., SIGGRAPH Asia 2021）。系统由 65 英寸 8K 头追踪 lenticular 裸眼 3D 屏组成（33.1M 全彩像素，60 Hz，约 45 px/deg），配 3 个立体 RGBD 采集 pod 和 4 个追踪相机，面部追踪频率 120 Hz。7 路彩色和深度视频流经 H.265 传输，码率 30–100 Mbit/s；端到端延迟 105.8 ms（SD 9.1），低于 250 ms 的会话异步感知上限。追踪延迟约 33 ms，需要靠外推和双指数平滑来补偿，否则会出现左右眼串扰，严重时甚至立体反转。音频端用追踪驱动的麦克风阵列波束成形，加上基于 HRTF 的双耳空间化和串音消除。Starline 的评价方法后来被广泛沿用：部署研究覆盖 117 人、9 个月、308 场会议；对照实验测得手势 +43%、点头 +26%、挑眉 +49%，回忆内容的字数 +27.87%。2024 年的 SIGGRAPH Emerging Technologies 版本改用实时 neural view synthesis。2025 年 Starline 产品化为 Google Beam，HP 在 InfoComm 2025 发布 HP Dimension：65 英寸 8K 光场屏，边框内置 6 个相机，由“AI volumetric video model”把 2D 视频流转成 3D，售价 24,999 美元，2025 年底开始向企业供货。宣传数据沿用 Google 2023 年的行为研究：记忆回忆 +28%，非语言行为最多 +39%，对对方的专注度至少 +14%。\n\n显示技术大致有四条路线。第一条是单人头追踪立体：每帧只需两个眼睛视点，但对追踪延迟极其敏感，Starline、NVIDIA 的 AI-Mediated 3D Video Conferencing（2023，单个 2D 输入经 triplane lifting）、Tele-Aloha（SIGGRAPH 2024，4 路 RGB，2048×2048@30fps，延迟 <150 ms）和 MonoFlex3D（单相机，端到端 <100 ms@30fps）都属于这一类。第二条是多视点光场或 lenticular 屏（Looking Glass 类）：需要 32–100 个视点。渲染研究因此从“逐视点渲染”转向“共享表示、直出子像素”，代表工作有 DirectL（最高 40× 加速）、NVIDIA 的 sweeping-plane 光场合成（45 视点、512p、200+ FPS、22× 加速）、CoherentRaster（2026）以及 LentiAvatar（2026，4K lenticular、32 视点、蒸馏驱动 38.49 FPS）。第三条是多观众眼动追踪显示：Hybrid Scan（SID 2026）用 100 µs 的 FLC SLM 扫描视差屏障，同时给 3 名观众各送一组立体图，并支持选择性眼神接触。第四条是全息：Holographic Parallax（2024）的用户研究表明，包含视差信息的 CGH 在感知真实感上始终占优；KAIST 的 wavefront telepresence（Opto-Electronic Advances 2026）用单次、无参考光路的波前测量做到约 28 fps、中位端到端延迟约 50 ms，把全息从“显示技术”推进到“可以采集的通信链路”。\n\nHMD 和 MR 路线的走向是从点云式的 Holoportation，到由头显相机驱动的照片级 Codec Avatars（Universal Facial Encoding，SIGGRAPH 2024），再到消费级的 Apple Vision Pro spatial Persona。IMC 2024 的测量显示，FaceTime 传的是语义数据，带宽甚至低于 2D Persona 类应用，但服务器分配策略可能带来高网络延迟。多方会议的核心问题是空间布局和“谁在看谁”。相关工作有：Gazing Heads（TOCHI 2024，20 组 × 4 人）用受控的头部旋转表达注视方向；A3RT（IEEE VR 2024）把注意力感知分解后做可视化；MiniMates（CHI 2025，n=24）用缩小的 avatar 在小空间里容纳多人，共在感高于视频会议；Voronoi Rooms（TOG 2025）按用户邻近度动态调节非共享空间的可见性。\n\n人因证据并不是一边倒。Starline 和 Google Beam 报告了稳定的行为学收益，但也有反例：van Gent et al.（Frontiers VR 2024）在谈判任务中没有发现面对面、视频和 VR 三种方式在社会临场感上的差异；Building in Depth（IMX 2026，N=12）发现，鲁棒的 2D 抠像比不完美的 RGB-D 体重建提供了更清晰的指导，立体 3D 介于两者之间；Rendle et al.（IEEE VR 2025）的结果是 avatar 真实感显著提升信息理解和群体凝聚力，空间音频的效应则较少。在纯视频会议中，空间音频有稳定收益：Hear We Are（CHIWORK 2023，75 人）显示它提升了互动感与共享空间感，且效应存在性别差异；空间化的实时翻译能让理解度翻倍（47 人，2025/2026）。由此得出一个关键推论：3D 的收益存在“重建质量阈值”，低于这个阈值时，3D 反而不如高质量的 2D。\n\n延迟和时间伪影要分成两类预算来看。第一类是本地 motion-to-photon，也就是头追踪到视点更新的延迟，需要达到几十毫秒量级并配合预测（Starline 约 33 ms）。第二类是会话端到端延迟：Starline 为 105.8 ms；Social XR 协作研究（Cortés et al., TOMM 2024）测试了 300–1500 ms，给出的可接受阈值是 ≤900 ms。2026 年的研究进一步区分了延迟对“交互流畅度”和“社会临场感”的影响（Song et al., TMM 2026），并发现空间精度比运动时间更早受延迟影响（Wang et al. 2026）。时间闪烁和几何抖动是动态重建特有的伪影，但主观质量研究普遍发现，现有客观指标与人眼评分相关性低：LIVE-Meta 的 avatar VQA 库包含 720 段视频，另有一项 2025 年研究专门评估动态场景中的 3DGS 和 NeRF。截至 2026 年 9 月，现状是：头追踪裸眼 3D 已进入商用（Beam）；研究前沿集中在少相机或单目输入、光场直出渲染、多观众显示、全息波前通信，以及更贴近真实工作场景的行为学评价。", "subtopics": [{"name_en": "Autostereoscopic & Light-Field Displays", "name_zh": "裸眼 3D、头追踪立体与光场显示", "summary_zh": "这条路线从 Starline 的 65 英寸 8K 头追踪 lenticular 屏（单人、两视点、60 Hz）发展到 Google Beam 和 HP Dimension 的商用光场终端，另一支是 Looking Glass 类多视点光场屏（32–100 视点）。研究重点从硬件转向面向显示的渲染：子像素重用（DirectL）、共享平面表示（NVIDIA sweeping planes）、跨视点属性复用（CoherentRaster）、subpixel prism 直出（LentiAvatar）。另有面向多观众的眼动追踪视差显示（Hybrid Scan）和可定向窄视区的视差显示（Privacy-Enabled Parallax Display）。", "representative_works": ["Project Starline: A high-fidelity telepresence system (TOG 2021)", "HP Dimension with Google Beam (2025)", "Tele-Aloha (SIGGRAPH 2024)", "Real-time 3D Visualization of Radiance Fields on Light Field Displays (2025)", "LentiAvatar (2026)"]}, {"name_en": "Holographic Displays & Wavefront Telepresence", "name_zh": "全息显示与波前远程呈现", "summary_zh": "计算全息（CGH）能提供最完整的深度线索，包括聚焦和视差。Holographic Parallax 用用户研究证明，视差信息对 3D 真实感至关重要；工业界已演示用 iPhone RGB-Z 加 VividQ SDK 实现的实时全息视频通话；KAIST 2026 年以单次、无参考光路的波前测量实现约 28 fps、约 50 ms 的全息远程呈现，把全息从“显示”推进到“可采集的通信链路”。", "representative_works": ["Holographic Parallax Improves 3D Perceptual Realism (2024)", "Video-rate wavefront capture and replay ... toward holographic telepresence (OEA 2026)", "A Novel Real-Time Full-Color 3D Holographic Video ... Pipeline (2025)"]}, {"name_en": "HMD/MR Telepresence & Spatial Layout", "name_zh": "头显 / 混合现实远程呈现与空间布局", "summary_zh": "从 Holoportation 的实时体重建加 HoloLens，到由头显相机驱动的照片级 Codec Avatars，再到 Apple Vision Pro 的 spatial Persona（传输语义数据、带宽低）。HCI 研究的焦点是异构房间对齐（Voronoi Rooms、Volumetric Hybrid Workspaces）、有限空间内的多方布局（MiniMates 缩小 avatar）、真人大小 2.5D 视频 avatar 的注意力感知（A3RT），以及超高分辨率 360° 远程呈现。", "representative_works": ["Holoportation (UIST 2016)", "Universal Facial Encoding of Codec Avatars from VR Headsets (SIGGRAPH 2024)", "A First Look at Immersive Telepresence on Apple Vision Pro (IMC 2024)", "MiniMates (CHI 2025)", "Voronoi Rooms (TOG 2025)"]}, {"name_en": "Eye Contact, Gaze & Multi-party Awareness", "name_zh": "眼神接触、视线校正与多方注意力感知", "summary_zh": "相机和屏幕的位置不一致会破坏眼神接触。解法有三类。第一类是 2D 图像层面的视线校正：从 Kuster 2012 的 RGB-D 视角合成，到 DNN 眼部形变（Intel 2019），再到 3D 感知的视线重定向（GazeGaussian、RTGaze）。第二类是几何上正确的 3D 视点渲染，“天然”带来眼神接触（Starline、VirtualCube）。第三类面向多方会议，重点是传达“谁在看谁”（LookAtChat、Gazing Heads、A3RT）。", "representative_works": ["Gaze correction for home video conferencing (TOG 2012)", "VirtualCube (IEEE VR / TVCG 2022)", "Gazing Heads (TOCHI 2024)", "RTGaze (AAAI 2026)"]}, {"name_en": "Co-presence & 2D-vs-3D User Studies", "name_zh": "共在感 / 社会临场感与 2D-vs-3D 用户研究", "summary_zh": "评价方法从问卷发展到行为科学指标，包括非语言行为编码、记忆回忆和注意力。Starline 和 Beam 报告了稳定收益。但在 VR 谈判、XR 远程培训等场景中，结果或为无显著差异，或是 2D 反而更优；avatar 真实感对群体沟通有显著影响。这说明 3D 收益依赖于重建质量阈值和具体任务类型。", "representative_works": ["Measuring how Project Starline improves remote communication with behavioral science (SIGGRAPH Talks 2024)", "Influence of Audiovisual Realism on Communication Behaviour in Group-to-Group Telepresence (IEEE VR 2025)", "An experimental comparison of participants' experience in face-to-face, video, and VR meetings (Frontiers VR 2024)", "Building in Depth (IMX 2026)"]}, {"name_en": "Latency & Temporal-Artifact Perception", "name_zh": "延迟感知与时间伪影（闪烁）感知", "summary_zh": "延迟需要区分两类：一是本地 motion-to-photon，即头追踪到视点更新，约几十毫秒并需要预测；二是会话端到端延迟，Starline 为 105.8 ms，Social XR 可接受阈值约 ≤900 ms。2026 年的工作进一步把延迟对交互流畅度与社会临场感的影响、对空间精度与时间表现的影响分开研究。时间闪烁等动态伪影的主观研究显示，现有客观指标与人眼评分相关性低，目前缺少专门针对 telepresence 的时间稳定性感知模型。", "representative_works": ["Delay Threshold for Social Interaction in Volumetric XR Communication (TOMM 2024)", "From Perception to Cognition: How Latency Affects Interaction Fluency and Social Presence in VR Conferencing (TMM 2026)", "Subjective and Objective Quality Assessment of Rendered Human Avatar Videos in VR (TIP 2024)", "Evaluating Human Perception of Novel View Synthesis ... in Dynamic Scenes (2025)"]}, {"name_en": "Spatial Audio for Telepresence", "name_zh": "空间音频与视听一致性", "summary_zh": "空间音频让声音“从对方嘴里发出”，并让音像的左右位置与视觉布局一致。Starline 采用追踪驱动的波束成形、HRTF 双耳渲染和串音消除；视频会议中的空间音频能提升互动感、共享空间感和轮替感知；空间化的实时翻译可让理解度翻倍。但在群组 telepresence 中，视觉真实感的效应强于空间音频。", "representative_works": ["Hear We Are (CHIWORK 2023)", "Spatial Audio Rendering for Real-Time Speech Translation in Virtual Meetings (2025/IJHCI 2026)", "Project Starline (TOG 2021)"]}], "timeline": [{"year": 2012, "event_zh": "Kuster et al. 在 SIGGRAPH Asia 发表用单个 RGB-D 相机做视线校正的方法，开启用“新视角合成”恢复眼神接触的思路。"}, {"year": 2016, "event_zh": "Microsoft Holoportation（UIST 2016）：多深度相机实时体重建加 HoloLens，确立 MR telepresence 范式。"}, {"year": 2019, "event_zh": "基于 DNN 的单目眼神校正（Isikdogan et al.）可在 CPU 上实时运行，2D 视线校正走向产品化。"}, {"year": 2021, "event_zh": "Project Starline（TOG 40(6)）：65 英寸 8K 头追踪 lenticular 屏，端到端延迟 105.8 ms，117 人、308 场会议的部署研究；首次证明 3D telepresence 优于 2D 视频会议。同年 LookAtChat 研究多方注视可视化。"}, {"year": 2022, "event_zh": "VirtualCube（IEEE VR 2022 最佳期刊论文）：3 屏 + 6 台 RGBD 相机的标准化隔间，在多方会议中保持相互眼神。"}, {"year": 2023, "event_zh": "NVIDIA AI-Mediated 3D Video Conferencing：单个 2D 输入经 triplane lifting 驱动头追踪立体屏和光场屏。Hear We Are（75 人）证实空间音频提升临场感。Google 完成 Starline 行为研究（回忆 +28%）。"}, {"year": 2024, "event_zh": "Starline 新原型改用实时 neural view synthesis；Tele-Aloha（4 路 RGB，<150 ms）；Codec Avatars 由头显相机驱动；IMC 2024 首次测量 Vision Pro spatial Persona；Cortés et al. 给出 Social XR 可接受延迟 ≤900 ms；Quark 在 SIGGRAPH Asia 2024 实现 1080p@30fps 的通用实时神经视图合成。"}, {"year": 2025, "event_zh": "Starline 产品化为 Google Beam，HP 在 InfoComm 发布 HP Dimension（65 英寸 8K 光场屏、6 相机、24,999 美元，年底供货）。Ha et al. 在 CVPR 2025 聚焦多视点与时间一致的在线 3D 视频合成。NVIDIA 光场直出渲染达 45 视点 200+ FPS。MiniMates（CHI 2025）与 Rendle et al.（IEEE VR 2025）推进多方布局与视听真实感研究。"}, {"year": 2026, "event_zh": "KAIST 波前全息 telepresence（约 28 fps，约 50 ms）；LentiAvatar、CoherentRaster 推进 lenticular 和光场直出渲染；Hybrid Scan 实现 3 名观众各自立体的多人眼动追踪显示；Song et al.（TMM）拆分延迟对流畅度与社会临场感的影响；ISMAR 2026 超高分辨率 360° telepresence。"}], "trends_zh": ["采集端大幅轻量化：从 Starline 2021 的 3 个立体 pod、4 个追踪相机和 4 块 GPU，到 Beam 的 6 个相机、Tele-Aloha 的 4 路 RGB，再到 NVIDIA、MonoFlex3D、LentiAvatar 的单相机或单目加生成先验，“AI 补全视角”取代“多传感器全覆盖”。", "渲染范式从“先逐视点渲染再交织”转向“面向显示的直出渲染”：子像素重用（DirectL，40×）、共享 sweeping planes（NVIDIA，22×，200+ FPS）、跨视点属性复用（CoherentRaster）、subpixel prism（LentiAvatar），重建和显示光学开始联合优化。", "显示从单人头追踪走向多观众：Beam 这类商用单人终端之外，出现了 Hybrid Scan 式的多人眼动追踪视差显示和可定向窄视区显示，目标是在多人会议室中让每个人都看到正确透视并有眼神接触。", "全息从“显示”延伸到“通信”：一方面有感知研究证明视差对真实感至关重要，另一方面有测量驱动的波前采集与回放（28 fps，50 ms），形成一条绕开显式几何重建的路线。", "HMD 路线走向语义化和 avatar 化传输：Codec Avatars、Vision Pro spatial Persona 用低维表情码或语义数据换取带宽优势，重点转向遮挡下的人脸驱动和多方的服务器与延迟扩展。", "评价方法从问卷与 PSNR 转向行为科学和真实部署：非语言行为编码、记忆回忆、注意力，以及数月规模的部署研究成为 3D telepresence 的主要证据形式。", "多方 telepresence 的研究重心从“画质”转向“空间关系”：谁在看谁、异构房间对齐（Voronoi Rooms）、缩小 avatar（MiniMates）、音像与视觉位置一致（空间音频）。"], "open_problems_zh": ["多观众裸眼 3D：Starline 和 Beam 本质上是单人头追踪；多人同时观看时，视点数、串扰、分辨率损失和渲染开销成倍增长，多人眼动追踪显示仍处于原型阶段（如 3 人、1.2 m）。", "深度预算与 VAC：头追踪 lenticular 屏需要把人脸放在显示平面附近，以控制视差和辐辏调节冲突；手部越出屏幕边界会造成遮挡深度冲突。如何在重建和渲染阶段主动管理深度预算，目前缺少系统方法。", "时间伪影的感知模型缺失：主观研究一再表明，客观指标与人眼评分相关性低，但目前没有针对 telepresence 中闪烁、几何抖动、左右眼不一致的感知阈值和可微指标。", "两类延迟预算的联合优化：本地 motion-to-photon 在几十毫秒量级且需要预测，会话端到端延迟从约 100 ms 到 900 ms 不等。神经渲染额外引入的延迟对立体感、晕动和对话节奏的影响尚未被系统量化。", "3D 收益的边界条件不清：Starline 和 Beam 报告了显著收益，但 VR 谈判出现零结果，XR 培训中 2D 抠像胜出。需要研究重建质量阈值、任务类型、会议时长、疲劳等调节变量；现有样本也多来自科技公司员工，普适性有限。", "生成式重建的真实性与信任：单目或稀疏视图加生成先验、视线重定向可能“幻觉”出并不存在的表情或眼神，telepresence 需要可验证的保真度，以及对用户透明的机制。", "成本与带宽：Starline 需要 30–100 Mbit/s，HP Dimension 约 2.5 万美元；要走向桌面和移动端，需要在码率、算力（Quark 需 A100 级 GPU 才能 1080p@30fps）和显示成本上同时下降一个数量级。", "全息 telepresence 的工程瓶颈：相干散斑噪声、视场角与眼盒、算力，以及从 RGB-D（视差有限）到光场或波前的内容源转换，都尚未解决。"], "relation_to_anchors_zh": "两篇锚点论文都属于上游的“重建与视图合成”层，本章讨论的显示和人因层决定了它们在 telepresence 中的实际约束和评价标准。\n\n与 Quark（Flynn et al., Google, SIGGRAPH Asia 2024）的关系：Quark 的作者中，Supreeth Achar 是 Starline 2021 的作者，Ryan Overbeck 是 Starline 2024 Emerging Technologies 版本的作者。2024 年版 Starline 已改用“实时 neural view synthesis”；2025 年商用的 Google Beam 和 HP Dimension 则用 6 个相机加“AI volumetric video model”把 2D 视频流转为 3D。Quark 的能力（稀疏视图、feed-forward、1080p@30fps、A100）与这一需求高度吻合，但公开资料并未确认 Quark 就是 Beam 部署的模型。显示端对 Quark 类方法提出了几项具体要求。第一，head-tracked 立体屏每帧只需两个眼睛视点，但必须 60 Hz 连续更新，并能配合约 33 ms 追踪延迟的外推；Quark 按目标视点推理，天然适合这种“少量、随头部移动的视点”。第二，如果换成 32–100 视点的光场屏，逐视点代价会线性增长，这时需要借鉴 NVIDIA 的 sweeping-plane 共享表示或 DirectL、CoherentRaster 的子像素直出思路。第三，Starline 把人脸放在显示平面附近以控制视差和 VAC，意味着脸部、眼部区域的合成误差对眼神接触（Gazing Heads 证明头部朝向是关键线索）和行为学指标影响最大，也就是说误差应当按感知重要性而非全图平均来优化。\n\n与 Ha et al.（KAIST + Meta, CVPR 2025）的关系：该工作来自 Meta Reality Labs 显示系统研究相关团队（Lanman、Xiao），核心贡献是用在线 TSDF 累积的全局几何引导 image-based rendering，消除选择性输入方法的多视点和时间不一致，也就是闪烁。从人因角度看，这正对准了最敏感的一类伪影。在 HMD 或立体显示上，左右眼的多视点不一致会破坏双眼融合；时间闪烁在动态内容主观研究中难以被逐帧指标捕捉（LIVE-Meta avatar VQA、2025 年动态 NVS 主观研究）。在“重建质量阈值”这一问题上（Building in Depth 发现不完美的体重建不如 2D 抠像），时间稳定性很可能就是跨过阈值的关键。\n\n共同的空白：从摘要看，两篇论文都没有做面向 telepresence 的用户研究，评价主要依赖逐帧图像指标。本章汇总的会话延迟阈值（约 100–150 ms 的系统实测，Social XR 可接受 ≤900 ms）、头追踪 motion-to-photon 预算、行为科学评价范式（非语言行为、回忆、注意力）以及多方注视一致性要求，可以作为把这两类视图合成方法真正落地到 3D 终端时的评估与设计清单。"}, {"key": "4d-recon", "area_title_zh": "4D 重建与体积视频：从逐场景优化到流式重建与前馈", "overview_zh": "本章所说的\"4D 重建 / 体积视频\"，是指用同步多视角视频（少数工作用单目或移动相机）重建一个随时间变化的三维表示，观众可以在任意视点、任意时刻回放。它和 3D 远程呈现走的是同一条链路：采集、重建、压缩、传输、渲染。区别在于体积视频传统上是先录制、再后处理、最后点播。早期工业范式的代表是 Microsoft 的 Collet et al.（SIGGRAPH 2015）：先用 RGB+IR 多视角立体重建带纹理的网格，再做网格跟踪，最后用 MPEG 编码成流。Meta 的 Neural Volumes（2019）和 MVP（2021）另开了一条路线，用可学习的体积基元实时渲染动态内容。DyNeRF（CVPR 2022）把 NeRF 用到多视角视频上，并发布了 N3DV 数据集（18 台相机）。此后几乎所有动态 NVS 方法都在这个数据集上评测，包括 Quark 和 Ha et al.。DyNeRF 能把 10 秒、30FPS 的视频压到 28MB，但 PSNR 只有约 29.58 dB，渲染约 0.015 FPS，离交互使用还差得很远。\n\n2022 至 2023 年是神经场加速阶段。K-Planes 用平面分解表示时空场，在 N3DV 上达到 31.63 dB。HyperReel 用射线条件采样，在百万像素分辨率下最高 18 FPS（31.10 dB）。StreamRF（NeurIPS 2022）和 ReRF（CVPR 2023）最早提出\"逐帧增量训练 + 残差编码\"的流式思路。StreamRF 每帧训练约 15 s，ReRF 配套的 FVV 编解码器压缩率约三个数量级。这一阶段说明，隐式场很难在质量、速度、存储三者之间同时满足实时需求。\n\n3DGS 出现后（2023 年下半年至 2024 年），领域的范式整体切换。Dynamic 3D Gaussians 让高斯的颜色、不透明度、尺寸保持不变，只让位置和旋转随时间变化，再加局部刚性约束逐帧优化，同时得到动态 NVS 和稠密 6-DoF 跟踪。4DGS（Wu et al.）在规范空间放置高斯，用 HexPlane 形变场驱动，800×800 下 82 FPS。Yang et al. 的原生 4D 高斯在 N3DV 上达到 32.01 dB、114 FPS。Spacetime Gaussians 引入时间不透明度、多项式运动和神经特征，达到 32.05 dB、140 FPS，300 帧约 200MB，lite 版在 8K 下仍有 60+ FPS。4K4D 在 4K 下约 80 FPS。到 2025 年，FreeTimeGS 允许高斯在任意时刻、任意位置出现，在 SelfCap 上比 4DGS 高 2.4 dB，1080p 下 450 FPS。4DGS-1K 剪除短寿命高斯后，光栅化超过 1000 FPS，存储降低 41×。至此渲染速度已不是瓶颈，瓶颈转到了训练时长、长序列显存和码率上。\n\n长序列和流式重建是 2024 至 2026 年的主战场。TGH（Temporal Gaussian Hierarchy，SIGGRAPH Asia 2024）指出，4DGS 和 4K4D 在 24GB 显卡上只能处理约 300 帧。TGH 的时间高斯层级把训练显存稳定在约 6.1GB，能处理 18,000 帧（约 10 分钟）。PackUV（CVPR 2026）把 4D 高斯打包成 UV 图集，可以用标准视频编解码器处理 30 分钟的序列。ATGS 和 ClipGStream 分别用时间锚点和\"片段级流式\"来兼顾序列长度与无闪烁。在线流式方面，进展如下：\n3DGStream（CVPR 2024）用神经变换缓存把每帧训练压到约 12 s，7.8MB/帧，215 FPS，N3DV 31.67 dB。\nQUEEN 做到每帧不到 5 s、0.7MB/帧。\nIGS（CVPR 2025）首次用可泛化的锚点运动网络，一次前向就预测出运动，每帧降到 2.67 s。\nComGS 的存储比 3DGStream 降低 159×。\n2026 年 9 月的 DecoGS 在 N3DV 上报告 34.55 dB、261 FPS，闪烁降低 70×。\n但这些方法都要先对首帧做逐场景优化，之后每帧仍需秒级时间，比通话要求的不到 150 ms 端到端延迟慢 1 到 2 个数量级。另外，不同论文的 PSNR 不能直接横向比较，因为训练/测试视角和分辨率协议不同。例如 3DGStream 自报 31.67 dB，在 IGS 的表格里却是 32.75 dB。\n\n人体体积视频和交付环节也在快速成熟。人体方向从 HumanRF 起步，其 ActorsHQ 数据集用了 160 台相机、12MP 分辨率。HiFi4G 结合非刚性跟踪和高斯，每帧不到 2MB。DualGS 用关节高斯和皮肤高斯分别表示运动和外观，压到约 350KB/帧（最高 120×），并提供 Unity 插件和移动/VR 播放器。TaoGS 能处理换衣这类拓扑变化。交付方面，VideoRF 和 V^3 把动态辐射场或高斯序列化成 2D 视频，复用硬件解码器；4DGC 和 4DGCPro 引入率失真优化和单码流渐进传输；CAGS（SIGGRAPH 2026）在带宽波动下提升 5 到 20 dB；AirGS（INFOCOM 2026）面向实际网络环境。按 30 fps 折算，QUEEN 约 168 Mbps，DualGS 约 84 Mbps，3DGStream 约 1.9 Gbps。也就是说，逐帧传输高斯的码率仍明显高于多路 2D 视频。这是 Quark 和 Ha et al. 选择\"传图像、在接收端前馈重建\"的一个重要系统层面原因。\n\n第三条路线是完全前馈。ENeRF 和 GPS-Gaussian 是 Ha et al. 的直接对比基线。4DGT（Meta，NeurIPS 2025）以 64 帧滚动窗口前馈预测 4D 高斯。StreamSplat（ICLR 2026）能在线处理任意长度的未标定视频流，比优化类方法快约 1200×。LiveStre4m 只用 2 路无位姿视频，每帧 0.07 s。Tele360（2026 年 9 月）在单张消费级 GPU 上做到无需标定的 2K 人体重建，超过 25 FPS。Google 的 NSTM 与 Quark 作者部分重叠，用测试时训练的记忆把摊销延迟压到约 28 ms/帧。截至 2026 年 9 月，格局可以分三层：\n逐场景 4D 优化（STG、FreeTimeGS、TGH 等）给出质量天花板，但训练要几分钟到几小时。\n流式逐帧优化（3DGStream、IGS、DecoGS）每帧秒级，在各自协议下已接近甚至超过离线质量。\n前馈方法（Quark、Ha et al.、Tele360、NSTM）已经实时，但在遮挡区域、细节和时间稳定性上仍然落后。Ha et al. 在补充材料中也承认，用 17 个视角逐场景优化的 4DGS 和 4K4D 质量更高。Ha et al. 自己的方法在 DyNeRF 上为 31.17 dB（ENeRF 为 29.51 dB），每帧约 100 ms。\n如何弥合离线和在线之间的差距，比如用离线 4D 模型做教师或数据、引入持久记忆和时间融合，是 2026 年最活跃的方向。", "subtopics": [{"name_en": "Dynamic Neural Fields (pre-3DGS)", "name_zh": "动态神经场（3DGS 之前）", "summary_zh": "以时间条件 NeRF、平面/张量分解或可移动体积基元表示动态场景。这一阶段确立了 N3DV 等基准和\"关键帧 + 场景流/残差\"的思路，但渲染只有 0.01 到 20 FPS 量级，训练动辄数十到上千 GPU 小时，难以满足实时交互。", "representative_works": ["DyNeRF (Neural 3D Video Synthesis)", "Mixture of Volumetric Primitives (MVP)", "HyperReel", "K-Planes"]}, {"name_en": "Per-scene 4D Gaussian Representations", "name_zh": "逐场景 4D 高斯表示（离线质量天花板）", "summary_zh": "对整段多视角视频做全局优化，得到可光栅化的 4D 高斯或点表示。主要有三种范式：规范空间加形变场（4DGS-Wu）、原生 4D 原语（Yang et al.、STG、FreeTimeGS）、逐帧持久高斯（Dynamic 3D Gaussians）。渲染已达数百到上千 FPS，在动态 NVS 上给出当前的质量上限，但需要逐场景训练，也不适合直播。", "representative_works": ["Dynamic 3D Gaussians", "4D Gaussian Splatting (Wu et al.)", "4D Gaussian Splatting (Yang et al.)", "Spacetime Gaussians", "4K4D", "Ex4DGS", "FreeTimeGS", "4DGS-1K"]}, {"name_en": "Long-sequence Volumetric Video", "name_zh": "长序列体积视频", "summary_zh": "解决全局 4D 表示在数百帧以上显存和存储爆炸的问题。主要手段有时间层级、时间锚点、片段级流式、UV 图集打包等，把可处理长度从约 300 帧推到 10 到 30 分钟，同时保持显存近似恒定、没有片段边界闪烁。", "representative_works": ["Temporal Gaussian Hierarchy", "PackUV", "ATGS", "ClipGStream"]}, {"name_en": "Streaming On-the-fly Reconstruction", "name_zh": "流式 / 逐帧在线重建", "summary_zh": "先重建首帧，再逐帧只学习运动或残差，实现\"边采集边重建\"。每帧时间从约 15 s（StreamRF）降到约 2.7 s（IGS），存储从数十 MB 降到亚 MB。当前研究重点是误差累积、闪烁和长时漂移。", "representative_works": ["StreamRF", "ReRF", "3DGStream", "HiCoM", "QUEEN", "IGS", "ReCon-GS", "DecoGS", "SoLAR"]}, {"name_en": "Compression & Delivery", "name_zh": "压缩、编码与网络交付", "summary_zh": "把体积视频变成可传输的码流，路线包括网格加 MPEG、神经残差编解码、\"高斯→2D 视频\"以复用硬件编解码器、率失真优化与渐进式码流、带宽自适应流媒体等。目标是在移动端或头显上实时解码播放，并能应对真实网络的波动。", "representative_works": ["High-Quality Streamable Free-Viewpoint Video", "VideoRF", "V^3", "4DGC", "4DGCPro", "ComGS (Motion Matters)", "CAGS", "AirGS"]}, {"name_en": "Human-centric Volumetric Video", "name_zh": "以人为中心的体积视频", "summary_zh": "面向人体表演，利用非刚性跟踪、骨骼或关节先验和运动-外观解耦，得到高压缩比、时间一致的人体 4D 高斯。其中也包括用扩散模型从稀疏视角补全人体新视角的生成式方法，与远程呈现的核心对象（人）最直接相关。", "representative_works": ["HumanRF", "HiFi4G", "DualGS", "TaoGS", "Diffuman4D"]}, {"name_en": "Feed-forward & Generalizable Online 4D", "name_zh": "前馈 / 可泛化在线 4D", "summary_zh": "不做逐场景优化，由大规模数据训练的网络直接从（稀疏、甚至未标定的）多视角视频流逐帧或按窗口预测 3D/4D 表示或新视角图像，已能以 25 到 35 FPS 实时运行。这条路线与 Quark、Ha et al. 同属一类，正从单帧前馈向带时间状态或记忆的 4D 前馈演进。", "representative_works": ["ENeRF", "GPS-Gaussian", "4DGT", "StreamSplat", "LiveStre4m", "Tele360", "NSTM (Online Neural Space Time Memory)"]}], "timeline": [{"year": 2015, "event_zh": "Collet et al.（Microsoft，SIGGRAPH 2015）提出高质量可流式 FVV：多模态多视角立体重建、网格跟踪、MPEG 编码，工业体积视频管线成型。"}, {"year": 2019, "event_zh": "Meta 提出 Neural Volumes，用可学习的体积表示渲染动态内容，开启神经体积视频路线。"}, {"year": 2021, "event_zh": "MVP（Mixture of Volumetric Primitives）用可移动的体积基元实时渲染动态人体和人脸。"}, {"year": 2022, "event_zh": "DyNeRF（CVPR 2022）发布 N3DV 数据集并提出时间潜码 NeRF；StreamRF（NeurIPS 2022）提出逐帧增量的流式辐射场；ENeRF（SIGGRAPH Asia 2022）实现可泛化的交互式 FVV。"}, {"year": 2023, "event_zh": "K-Planes、HyperReel、ReRF、HumanRF 推动神经场 4D 表示和残差编码；3DGS 发布后，Dynamic 3D Gaussians 首次把高斯用于多视角动态重建和稠密跟踪。"}, {"year": 2024, "event_zh": "CVPR 2024 高斯 4D 集中涌现：4DGS、Spacetime Gaussians、4K4D、3DGStream、HiFi4G、GPS-Gaussian；ICLR 2024 发表原生 4D 高斯（Yang et al.）。"}, {"year": 2024, "event_zh": "SIGGRAPH Asia 2024：DualGS、V^3、Temporal Gaussian Hierarchy（分钟级长序列），锚点论文 Quark 同会发表；NeurIPS 2024：QUEEN、HiCoM、Ex4DGS。"}, {"year": 2025, "event_zh": "CVPR 2025：IGS（首个可泛化流式高斯）、FreeTimeGS、4DGC，锚点论文 Ha et al.（在线几何引导 3D 视频）同会发表。"}, {"year": 2025, "event_zh": "NeurIPS 2025：4DGS-1K（超过 1000 FPS）、4DGT（前馈 4D 高斯 Transformer）、ComGS、ReCon-GS、4DGCPro；ICCV 2025：Diffuman4D；SIGGRAPH Asia 2025：TaoGS。"}, {"year": 2026, "event_zh": "ICLR 2026：StreamSplat；CVPR 2026：PackUV（30 分钟、PackUV-2B 数据集）、ClipGStream；INFOCOM 2026：AirGS。"}, {"year": 2026, "event_zh": "SIGGRAPH 2026：CAGS（带宽自适应高斯体积视频）、ATGS；7 月 Google 发布 NSTM（约 28 ms/帧的时空记忆 NVS）；9 月发布 Tele360（2K、超过 25 FPS 的无标定前馈人体重建）和 DecoGS（闪烁降低 70×）。"}], "trends_zh": ["表示从\"规范空间 + 形变场\"（4DGS-Wu）转向\"自由时空原语\"（Yang et al. 4DGS、STG、FreeTimeGS），再配合剪枝和静动分离（4DGS-1K、Ex4DGS、DecoGS），渲染速度已达数百到上千 FPS，不再是瓶颈。", "从逐场景优化迁移到流式，再到前馈：每帧重建时间从 StreamRF 约 15 s、3DGStream 约 12 s、QUEEN 不到 5 s、IGS 2.67 s，降到 LiveStre4m 的 0.07 s 和 Tele360 的 25+ FPS，正在与 Quark、Ha et al. 的实时前馈路线汇合。", "\"体积视频即 2D 视频\"：VideoRF、V^3、TaoGS、PackUV、AirGS 把高斯属性打包成图像或 UV 图集，复用硬件视频编解码器和现有流媒体基础设施。", "评价重心从单帧 PSNR 转向率失真和网络 QoE：4DGC 和 4DGCPro 做率失真优化与渐进码流，ComGS、IGS、ReCon-GS 用关键点或锚点运动降低码率，CAGS 和 AirGS 面向真实带宽波动。", "长序列成为新的评测维度：TGH 达到 10 分钟且显存恒定，PackUV 达到 30 分钟，ATGS、ClipGStream、SoLAR 处理漂移、误差累积和片段边界闪烁。", "时间一致性被显式度量和优化：出现了闪烁指标（DecoGS 降低 70×）和 TCC/STED（Ha et al.），持久高斯、静动分离、时间记忆（NSTM、StreamSplat）成为标准组件。", "大模型与生成先验进入 4D：扩散模型补全稀疏视角（Diffuman4D），用大规模数据训练的 Transformer 或记忆取代逐场景优化（4DGT、NSTM），从视觉几何基础模型蒸馏以去除标定依赖（Tele360）。", "数据规模快速扩大：PackUV-2B（50+ 相机、20 亿帧）、MVHumanNet++ 等为前馈 4D 模型提供训练数据，也让离线高质量 4D 重建可以作为伪真值来源。"], "open_problems_zh": ["延迟鸿沟：流式优化方法每帧仍需秒级，且依赖首帧逐场景优化；前馈方法已经实时，但质量仍比 STG、FreeTimeGS 这类离线天花板低 1 到 3 dB，而且遮挡区域发虚。如何在 100 ms 内达到离线级质量，目前没有答案。", "码率：逐帧高斯流按 30fps 折算仍在 80 到 200 Mbps 量级（DualGS、QUEEN），3DGStream 更是 Gbps 级，远高于常规视频通话。还缺少与多视角 2D 视频编码（如 MV-HEVC）在同等码率下的公平对比。", "评测协议不统一：同一方法在 N3DV 上的 PSNR 在不同论文中可相差 1 dB 以上（如 3DGStream 自报 31.67 dB，在 IGS 表中为 32.75 dB），缺乏联合衡量质量、时间一致性、延迟和码率的统一基准。", "长时漂移与拓扑变化：流式方法的误差累积、新物体出现和消失、换衣和道具交互等问题，TaoGS、SoLAR、ClipGStream 只部分解决，小时级会话的稳定性尚未得到验证。", "稀疏与非标定采集：多数 4D 方法需要 15 到 20 台以上标定好的相机；稀疏、移动或未标定相机下的 4D 重建（Tele360、LiveStre4m、4D Reconstruction from Sparse Dynamic Cameras）才刚起步，泛化到任意场景和多人时仍有困难。", "几何与光照：高斯体积视频的表面几何、重光照以及与 CG 或 AR 场景的遮挡、光照一致性仍然薄弱，影响远程呈现中的共处感和交互。", "生成式补全的可信度：扩散先验可能\"幻觉\"出不真实的人体细节或表情，在远程呈现中带来真实性和信任风险，需要不确定性估计和保真性约束。", "接收端算力与功耗：手机和头显上的解码与渲染（V^3、4DGCPro、DualGS 播放器）依赖大量离线预处理；端到端的功耗、发热和实时解码预算缺乏系统研究。"], "relation_to_anchors_zh": "Quark（Flynn et al.，SIGGRAPH Asia 2024）和 Ha et al.（CVPR 2025）都属于\"不做逐场景优化、逐帧前馈\"的在线路线。本章的大部分工作则属于\"逐场景或流式优化\"的离线、准在线路线。两者在同一基准上相遇：N3DV/DyNeRF 数据集，Ha et al. 另外还用了 ENeRF-Outdoor。二者的关系可以归纳为四点。\n\n第一，质量天花板。STG、4DGS、4K4D、FreeTimeGS、TGH 给出了动态 NVS 的离线上限。Ha et al. 在补充材料中承认，用 17 个视角逐场景优化的 4DGS 和 4K4D 质量更高；其在线方法在 DyNeRF 上为 31.17 dB（ENeRF 为 29.51 dB），每帧约 100 ms。Quark 在静态基准上已追平逐场景优化（DL3DV 上 31.31 dB，Zip-NeRF 为 31.22 dB），但在 N3DV 动态序列上明确\"不做时间一致性\"，会出现闪烁。可见，在线方法与离线上限的差距主要在时间维度和遮挡补全上。\n\n第二，时间一致性技术的迁移。Ha et al. 用颜色差分掩码区分静/动区域，对静态区域做深度时间滤波，并把前一帧的渲染深度融进当前 TSDF。这本质上是本章中 Dynamic 3D Gaussians 的\"持久性\"思想，以及 Ex4DGS、DecoGS 静动分离思想在前馈框架里的轻量实现。Quark 若要用于视频通话，可以借鉴 DecoGS 的区域门控、ClipGStream 的片段级状态，或者 NSTM、StreamSplat 的持久时空记忆。\n\n第三，流式方法是两条路线之间的桥梁，而且两条路线正在汇合。IGS 用可泛化运动网络替代逐帧优化；4DGT、StreamSplat 把前馈扩展到带时间状态的 4D；Tele360 延续 GPS-Gaussian 这一脉，并去掉了标定依赖；NSTM 的 Google 作者与 Quark 团队部分重叠（Lombardi、Luo、Kaza、Sun、Tsai），说明 Quark 团队正从显式 LDM 转向\"记忆型前馈\"。未来的远程呈现系统很可能是\"前馈初始化 + 轻量在线精化 + 持久记忆\"的混合形态。\n\n第四，传输架构。体积视频码率按 30fps 折算，QUEEN 约 168 Mbps，DualGS 约 84 Mbps，3DGStream 约 1.9 Gbps。这说明直接发送 3D 表示并不比发送多路 2D 视频便宜，支持了 Quark 和 Ha et al.\"传图像、在接收端或边缘端前馈重建\"的系统设计。另一方面，V^3、TaoGS、PackUV 的\"高斯转 2D 视频\"路线给出了另一种可能：在发送端重建，再用成熟的视频编解码传输 3D 表示。此外，离线 4D 重建和超大规模多视角数据（如 PackUV-2B）可以作为训练 Quark、Ha et al. 这类前馈网络的伪真值或蒸馏教师，这是离线研究反哺在线远程呈现的最直接途径。"}, {"key": "eval", "area_title_zh": "数据集、基准、指标与评测：动态新视角合成与 3D Telepresence", "overview_zh": "动态新视角合成（NVS）与 3D telepresence 的评测体系大致经历了三个阶段。第一阶段（2013–2020）沿用多视角视频/自由视点电视（FTV）与视频质量评价的传统。Panoptic Studio 用 480 路同步视频流开创了穹顶式大规模多视角采集；Technicolor 4×4 光场视频（2048×1088、30 fps）与 Google 的 46 相机半球光场视频（Broxton 等，SIGGRAPH 2020）提供了小基线、可沉浸观看的动态内容。这一阶段的评价指标主要是 PSNR/SSIM，以及视频领域的 VMAF、STRRED；针对 DIBR 合成视图的专用质量评价（QA）和 FVV Live 这类实时 FVV 系统的主观评测，也在这一时期出现。\n\n第二阶段（2021–2023）由 NeRF 推动，形成了至今仍在沿用的“事实标准”。Neural 3D Video（N3DV/DyNeRF，CVPR 2022）是约 18–21 路相机、2704×2028、30 fps、每段约 10 秒的厨房场景，几乎成为所有动态 NVS 论文的必测集。ENeRF-Outdoor（18 路 1080p）与 D3DMV（10 路 120 fps、96 个户外场景）补充了户外与稀疏相机条件。人体方向迅速规模化：ActorsHQ（160 路 12MP）、NeRSemble（16 路 7.1MP、73 fps、4,700+ 序列）、DNA-Rendering（60 路、1,500+ 人、6,750 万帧），加上 Multiface 与之后的 Codec Avatar Studio（Ava-256/Goliath-4），服务于 avatar 式 telepresence。同一时期，DyCheck 指出单目动态 NVS 的评测协议存在多视角信息泄漏：修正后 SOTA 的掩码 PSNR 下降 1–2 dB，复杂运动下降 4–5 dB。社区由此开始审视评测协议本身。\n\n第三阶段（2024–2026）的特征是规模化、长时化和泛化。一方面，feed-forward/可泛化模型需要海量训练数据。静态场景有 RealEstate10K（约 1,000 万帧）、Spaces（100 场景、16 相机阵列）、DL3DV-10K（10,510 段视频、5,120 万帧）；人体有 MVHumanNet（4,500 个身份、6.45 亿帧）以及加入深度/法线的 MVHumanNet++。另一方面，动态基准从 10 秒走向分钟级：SelfCap（22 部 iPhone、4K60、2–10 分钟）、ImViD（5K60、带同步音频、1–5 分钟）、PackUV-2B（CVPR 2026，50+ 路相机、100 个序列、约 20 亿帧、最长约 30 分钟）。合成基准 Charge 提供深度/法线/分割/光流真值，分为稠密、3/6/9 视角稀疏与单目三个赛道。MultiEgo 等穿戴式多视角数据则把会议类社交场景带进了评测。\n\n指标层面最明显的变化，是从“逐帧保真”转向“时间一致性”和“3D 一致性”。PSNR/SSIM/LPIPS 对闪烁几乎不敏感。Quark 论文明确承认它报告的指标都不测量时间闪烁，并承认离线 NeRF/3DGS 在这方面优于它的逐帧独立重建。时间维度可用的工具有：Lai 等的光流 warping error、TecoGAN 的 tOF/tLP、分布级的 FVD，以及 Ha 等（CVPR 2025）用于在线 3D 视频合成的 TCC（帧差图 SSIM）、STED（源自 Soundararajan & Bovik 的 STRRED）、SDT（L1 误差的跨帧标准差）和 SDV（跨视角标准差）。在 DyNeRF 上，Ha 等报告 PSNR 31.17、TCC 0.872、STED 68.76；ENeRF 为 29.51/0.867/76.14，GPS-Gaussian 的 STED 高达 693.0，可见时间指标能拉开 PSNR 反映不出的差距。3D 一致性方面的演进是：TSED（需要相机位姿）→ MEt3R（CVPR 2025，基于 DUSt3R，无需位姿）→ MVGBench 的自一致性 → 2026 年基于 COLMAP 几何验证的度量。最后这项工作与人类判断的相关性比 MEt3R 最高提升 4 倍，并指出 VGGT/DUSt3R 会对无关图像“幻觉”出几何。\n\n感知与主观评价回答的是“这些指标可不可信”。Liang 等首个 NVS 感知研究（22 个场景、10 种方法、39 名被试、JOD 标度）发现，VMAF、FovVideoVDP 等视频指标与感知质量最相关，PSNR 甚至优于 SSIM 和 LPIPS。Zhang 等（2025）首个动态场景 GS/NeRF 主观库（13 个序列、130 个刺激、29 名有效被试、SAMVIQ）中，最佳全参考指标 MS-SSIM 的 PLCC 仅约 0.89、SRCC 约 0.72，无参考指标的最佳 PLCC 约 0.73。此后，GS-QA、3DGS-IEval-15K（15,200 张图、60 名被试）、GScomp-QA（331 个刺激、9 种压缩方案）与 SCODA（基于场景流形、无需对齐参考）把研究扩展到压缩失真与无参考场景。ColorVideoVDP（SIGGRAPH 2024）则把显示器特性和 XR 伪影（XR-DAVID，336 段视频）纳入可见差异预测。\n\n系统与 QoE 层面，Project Starline（SIGGRAPH Asia 2021）用临场感、注意力、会议记忆回忆以及点头/挑眉等非语言行为，证明 3D telepresence 优于 2D 视频会议。VirtualCube、FVV Live 提供了实时系统端到端评价的样例；Pérez 等（2022）与 ITU-T P.1320（2022）给出了沉浸式/XR 会议的 QoE 测试方法学；IMC 2024 对 Vision Pro 空间 Persona 的测量补充了带宽、渲染与多用户扩展的网络视角。截至 2026 年 9 月，现状可以这样概括：数据集已达数十亿帧规模，但论文评测仍集中在 N3DV、ENeRF-Outdoor 等少数短片段和降采样协议上；时间与 3D 一致性指标已经出现，但尚未标准化；能把画质、时间稳定性、端到端延迟、码率和用户体验放在一起度量的 telepresence 基准仍然没有。", "subtopics": [{"name_en": "Multi-view Dynamic Scene Datasets", "name_zh": "多视角动态场景数据集", "summary_zh": "Technicolor 4×4 光场视频、Google 46 相机半球阵列，以及 N3DV、ENeRF-Outdoor、D3DMV，构成了动态 NVS 的核心测试床。2024–2026 年，SelfCap、ImViD、PackUV-2B 把时长扩展到分钟级、规模扩展到数十亿帧；Charge 用合成数据提供完整几何真值和稠密/稀疏/单目三个赛道；MultiEgo 引入了穿戴式社交场景。主要问题是论文评测仍集中在少数 10 秒短片和单一留出视角上。", "representative_works": ["Neural 3D Video Synthesis from Multi-view Video", "Efficient Neural Radiance Fields for Interactive Free-viewpoint Video", "Dataset and Pipeline for Multi-View Light-Field Video", "Representing Long Volumetric Video with Temporal Gaussian Hierarchy", "PackUV: Packed Gaussian UV Maps for 4D Volumetric Video", "ImViD: Immersive Volumetric Videos for Enhanced VR Engagement", "Charge: A Comprehensive Novel View Synthesis Benchmark and Dataset to Bind Them All"]}, {"name_en": "Human- and Head-centric Capture Datasets", "name_zh": "以人/头部为中心的采集数据集", "summary_zh": "Panoptic Studio 开创了大规模多人社交采集。Multiface、NeRSemble、Codec Avatar Studio 聚焦头部与 avatar 驱动；ActorsHQ 追求 12MP 级的全身细节；DNA-Rendering 与 MVHumanNet(++) 以数千身份、数亿帧支撑可泛化人体 NVS 的训练。它们是 telepresence 中“人”这一核心内容的主要评测来源，但多为棚拍、单人、固定光照，部分数据需申请访问。", "representative_works": ["Panoptic Studio: A Massively Multiview System for Social Interaction Capture", "HumanRF: High-Fidelity Neural Radiance Fields for Humans in Motion", "NeRSemble: Multi-view Radiance Field Reconstruction of Human Heads", "DNA-Rendering: A Diverse Neural Actor Repository for High-Fidelity Human-centric Rendering", "MVHumanNet: A Large-scale Dataset of Multi-view Daily Dressing Human Captures", "Codec Avatar Studio: Paired Human Captures for Complete, Driveable, and Generalizable Avatars"]}, {"name_en": "Scene Corpora for Generalizable NVS & Evaluation Protocols", "name_zh": "可泛化 NVS 的场景语料与评测协议", "summary_zh": "RealEstate10K、Spaces、DL3DV-10K 为 feed-forward/可泛化模型提供训练与评测语料；Quark 就是在 Spaces 等数据上训练、在 DL3DV 上评测的。DyCheck 与 Mind the Gap 则审视评测协议本身：前者揭示多视角信息泄漏（修正后下降 1–5 dB），后者指出标准留出主要衡量近轨迹内插，与外推相差 3–12 dB。", "representative_works": ["Stereo Magnification: Learning View Synthesis using Multiplane Images", "DeepView: View Synthesis with Learned Gradient Descent", "DL3DV-10K: A Large-Scale Scene Dataset for Deep Learning-based 3D Vision", "Monocular Dynamic View Synthesis: A Reality Check", "Mind the Gap: Standard 3DGS Evaluation Primarily Measures Near-Trajectory Interpolation"]}, {"name_en": "Temporal Consistency & Flicker Metrics", "name_zh": "时间一致性与闪烁度量", "summary_zh": "逐帧 PSNR/SSIM/LPIPS 反映不出闪烁。现有工具包括：光流 warping error（Lai 等）、tOF/tLP（TecoGAN）、分布级的 FVD、降参考时空熵差 STRRED/STED，以及 Ha 等在动态 NVS 中采用的 TCC（帧差 SSIM）和 SDT（跨帧误差标准差）。这些指标各论文用法不一，也缺乏与人眼闪烁感知的系统校准。", "representative_works": ["Learning Blind Video Temporal Consistency", "Learning Temporal Coherence via Self-Supervision for GAN-based Video Generation", "Towards Accurate Generative Models of Video: A New Metric & Challenges", "Video Quality Assessment by Reduced Reference Spatio-Temporal Entropic Differencing"]}, {"name_en": "3D / Multi-view Consistency Metrics", "name_zh": "3D/多视角一致性度量", "summary_zh": "这类指标用于在没有真值视角时评价几何一致性。TSED 用极线距离统计一致帧对，需要位姿；MEt3R 用 DUSt3R 稠密重建做免位姿的特征 warp 比较；MVGBench 比较不相交视角各自重建的自一致性；2026 年基于 COLMAP 的度量指出基础模型会幻觉几何，并把与人类判断的相关性最高提升到 MEt3R 的 4 倍。Ha 等的 SDV（跨视角误差标准差）可视为有真值时的简化版本。", "representative_works": ["Long-Term Photometric Consistent Novel View Synthesis with Diffusion Models", "MEt3R: Measuring Multi-View Consistency in Generated Images", "MVGBench: Comprehensive Benchmark for Multi-view Generation Models", "Can These Views Be One Scene? Evaluating Multiview 3D Consistency when 3D Foundation Models Hallucinate"]}, {"name_en": "Perceptual Metrics & Subjective QA", "name_zh": "感知指标与主观质量评价", "summary_zh": "VMAF、ColorVideoVDP（及 FovVideoVDP）等视频感知指标开始进入 NVS 评测。Liang 等和 Zhang 等的主观实验表明，视频指标比 LPIPS 更贴近人眼，但在动态场景下现有指标仍难以准确预测 MOS。GS-QA、3DGS-IEval-15K、GScomp-QA、SCODA 把主观库与指标扩展到 3DGS 合成、压缩失真以及无需对齐参考的场景。", "representative_works": ["Perceptual Quality Assessment of NeRF and Neural View Synthesis Methods for Front-Facing Views", "Evaluating Human Perception of Novel View Synthesis: Subjective Quality Assessment of Gaussian Splatting and NeRF in Dynamic Scenes", "ColorVideoVDP: A visual difference predictor for image, video and display distortions", "VMAF: Video Multi-Method Assessment Fusion", "GScomp-QA: A Subjective Dataset for Quality Assessment of Compressed Gaussian Splatting"]}, {"name_en": "Telepresence QoE & System-level Evaluation", "name_zh": "远程临场 QoE 与系统级评测", "summary_zh": "Project Starline 的用户研究（临场感、注意力、记忆、非语言行为）确立了以人为中心的 telepresence 评价范式。VirtualCube、FVV Live 提供了实时系统端到端评测的样例；Pérez 等与 ITU-T P.1320 给出沉浸式/XR 会议的 QoE 方法学；IMC 2024 对 Vision Pro Persona 的测量补充了带宽与网络时延视角。这类系统级评价与 NVS 学术基准之间仍然缺少衔接。", "representative_works": ["Project Starline: A high-fidelity telepresence system", "VirtualCube: An Immersive 3D Video Communication System", "FVV Live: A real-time free-viewpoint video system with consumer electronics hardware", "Emerging Immersive Communication Systems: Overview, Taxonomy, and Good Practises for QoE Assessment", "ITU-T P.1320: Quality of experience assessment of extended reality meetings", "A First Look at Immersive Telepresence on Apple Vision Pro"]}], "timeline": [{"year": 2013, "event_zh": "Soundararajan & Bovik 提出 STRRED 时空熵差降参考视频质量评价，后来成为 Ha et al. STED 指标的出处"}, {"year": 2015, "event_zh": "CMU Panoptic Studio（ICCV 2015；TPAMI 2017）以 480 路同步视频流开创大规模多人多视角采集"}, {"year": 2016, "event_zh": "Netflix 开源 VMAF 感知视频质量指标"}, {"year": 2017, "event_zh": "Technicolor 4×4 光场视频数据集（CVPRW 2017），成为前向动态 NVS 的经典测试集"}, {"year": 2018, "event_zh": "RealEstate10K 发布（约 1,000 万帧）；Lai 等提出 warping error 时间一致性评测；FVD 与 TecoGAN 的 tOF/tLP 相继提出"}, {"year": 2019, "event_zh": "DeepView 发布 Spaces 数据集（100 个场景、16 相机阵列），后来成为 Quark 的训练集之一"}, {"year": 2020, "event_zh": "Google 46 相机沉浸式光场视频（SIGGRAPH 2020）；FVV Live 实时自由视点系统及其主观评测"}, {"year": 2021, "event_zh": "D3DMV（10 路、120 fps、96 个场景）；Project Starline 用户研究证明 3D telepresence 优于 2D 视频会议"}, {"year": 2022, "event_zh": "Neural 3D Video（CVPR 2022）成为动态 NVS 的事实标准；ENeRF-Outdoor、Multiface 发布；DyCheck 揭示评测泄漏；ITU-T P.1320 批准"}, {"year": 2023, "event_zh": "ActorsHQ（160 路 12MP）、NeRSemble（73 fps）、DNA-Rendering（6,750 万帧）发布；TSED 几何一致性指标；首个 NVS 感知质量研究（Liang 等）"}, {"year": 2024, "event_zh": "MVHumanNet（6.45 亿帧）、DL3DV-10K、Codec Avatar Studio、ColorVideoVDP、SelfCap（分钟级）发布；Quark 只用 PSNR/SSIM/LPIPS 评测，并承认缺少闪烁度量"}, {"year": 2025, "event_zh": "MEt3R（CVPR 2025）提出免位姿 3D 一致性指标；Ha et al.（CVPR 2025）把 TCC/STED/SDT/SDV 引入在线 3D 视频合成；ImViD、首个动态场景 NVS 主观库、3DGS-IEval-15K、MVHumanNet++、MultiEgo、Charge 相继发布"}, {"year": 2026, "event_zh": "PackUV-2B（CVPR 2026，约 20 亿帧）；GScomp-QA；基于 COLMAP 的一致性度量挑战 MEt3R；Mind the Gap 揭示 3–12 dB 的插值-外推差距；SCODA 场景流形 QA"}], "trends_zh": ["数据规模化与长时化：从 N3DV 的约 10 秒、约 20 路相机，发展到 SelfCap 的 2–10 分钟、PackUV-2B 的 50+ 路相机、约 20 亿帧、最长约 30 分钟。评测重心转向长时漂移、显存与存储的可扩展性。", "数据用途从“逐场景测试”转向“泛化训练 + 留出测试”：RealEstate10K、Spaces、DL3DV-10K、MVHumanNet、DNA-Rendering 成为 feed-forward 模型的预训练语料，Quark 就是典型例子。", "指标从逐帧保真（PSNR/SSIM/LPIPS）转向时间一致性（TCC、STED、warping error、tLP）和 3D 一致性（TSED → MEt3R → 基于 COLMAP 的度量），并出现免位姿、免参考的趋势。", "评测协议开始自我审视：DyCheck 指出多视角信息泄漏（1–5 dB），Mind the Gap 指出 3–12 dB 的插值-外推差距，推动空间留出与外推视角评测。", "主观质量研究从静态走向动态与压缩（动态 GS/NeRF 主观库、3DGS-IEval-15K、GScomp-QA）。多项研究一再发现 VMAF、FovVideoVDP 等视频指标比 LPIPS 更贴近人眼。", "多模态与合成真值兴起：ImViD 引入同步音频，Charge 提供深度/法线/分割/光流真值，MVHumanNet++ 增加深度与法线，服务于几何引导的方法。", "系统级 QoE 与标准化：ITU-T P.1320、Starline 式用户研究、Vision Pro 网络测量，把延迟、带宽、临场感与非语言行为纳入评价体系。"], "open_problems_zh": ["缺少端到端的 telepresence 基准：还没有公开数据集同时提供同步多视角采集、观看者头部轨迹及对应的真值视图，以及“采集→重建→编码→传输→显示”全链路的延迟与码率，因此无法联合度量画质、时间稳定性、motion-to-photon 延迟和带宽。", "时间一致性指标未标准化，也缺乏主观校准：TCC、STED、warping error、tOF/tLP、FVD 各论文各用一套，还没有针对 NVS 闪烁（如混合权重跳变）的心理物理数据来验证这些指标与人眼感知是否一致。Quark 明确承认现有指标无法度量闪烁。", "测试视角单一，且落在内插区：N3DV 通常只留出中心相机，评测本质上是阵列内插；而 telepresence 观看者常位于基线之外，外推视角（差距可达 3–12 dB）和双目立体视图都缺少真值。", "评测分辨率与帧率远低于应用需求：主流协议在 1352×1014、960×540 乃至 640×360 下评测，而且大多是 30 fps、SDR；缺少 4K、60 fps 以上、HDR 的动态基准和配套指标。", "以人为中心的 telepresence 场景覆盖不足：现有人体/头部数据多为棚拍、固定光照、单人；缺少桌面对话、手部遮挡、多人交互、眼神接触与语音同步的真实会议数据，且不少数据集需申请访问或许可受限。", "主观数据集规模小、观看条件单一：现有主观库只有十几个场景、20–60 名被试，多在 2D 显示器上观看；缺少头显、光场屏或立体显示下的交互式 6DoF 主观评测，也缺少针对实时 feed-forward 方法特有伪影的数据。", "基于 3D 基础模型的一致性指标可靠性存疑：MEt3R 这类指标依赖 DUSt3R/VGGT，可能对无关图像“幻觉”出几何；需要带失效检测并经过人类判断校准的稳健度量。", "telepresence 专属维度缺少客观指标：视线/眼神接触是否正确、唇音同步、立体观看舒适度、身份保真与隐私保护，目前都没有公认的客观度量。"], "relation_to_anchors_zh": "两篇锚点论文恰好体现了本领域评测体系的现状和缺口。\n\nQuark（Flynn 等，Google，SIGGRAPH Asia 2024）在 Spaces、RFF、NeX-Shiny、SWORD 上训练，在 RFF、NeX-Shiny、Neural 3D Video、DL3DV-10K、Mip-NeRF360、Tanks&Temples、Deep Blending 上评测，只报告 PSNR/SSIM/LPIPS 和运行时间。在 N3DV 上，它每隔 10 帧取样、以 0 号相机为目标、从最近 16 路中选 8 路输入、分辨率 1024×768，得到 31.57 dB / 0.942 / 0.127，单帧 32.2 ms；ENeRF 为 29.86 dB、205 ms。论文还称在单张 A100 上以 1080p、30 fps 完成重建加渲染。但作者明确承认所用指标都不测量时间闪烁：逐帧独立重建时，混合权重在输入图像之间切换会产生闪烁，离线 NeRF/3DGS 在这方面更好。这正是本章“时间一致性与闪烁度量”要解决的问题。\n\nHa 等（KAIST + Meta，CVPR 2025）在 DyNeRF（1352×1014）、ENeRF-Outdoor（960×540 输入）和 D3DMV（640×360）的前 100 帧上评测。除 PSNR/SSIM/LPIPS/L1 外，它系统地把 TCC（帧差图 SSIM）、STED（源自 STRRED）、SDT（跨帧误差标准差）、SDV（跨视角误差标准差）引入在线 3D 视频合成。在 DyNeRF 上，它的 PSNR 为 31.17、TCC 0.872、STED 68.76，总耗时约 100 ms；ENeRF 为 29.51 / 0.867 / 76.14，GPS-Gaussian 的 STED 为 693.0。\n\n两篇都以 N3DV 为共同测试床，但目标分辨率、帧采样、输入视角选择完全不同，所以 31.57 dB 与 31.17 dB 不能直接比较，这正体现了协议的碎片化。两篇都没有做主观实验，没有测量“采集→传输→显示”的端到端延迟，也没有在 ActorsHQ、NeRSemble、Ava-256 这类以人为中心的 telepresence 数据上评测。\n\n由此引出一个可行的研究方向：以 N3DV、SelfCap、PackUV-2B、ImViD 等为素材，统一一套评测协议，包括：\n- 稀疏输入视角的选择规则\n- 1080p 以上的目标分辨率\n- 全序列时间指标（TCC、STED、warping error）\n- 免真值的 3D 一致性指标（MEt3R 或基于 COLMAP 的度量）\n- 主观 JOD/MOS 实验\n- 端到端延迟与码率\n\n这样，Quark 式的逐帧 feed-forward 方法和 Ha 式的几何引导时序方法，才能在同一把尺子下比较。"}, {"key": "industry", "area_title_zh": "产业、产品与标准（2023–2026）：3D远程呈现的商业化版图", "overview_zh": "2023–2026年，3D远程呈现在产业侧从“实验室演示”走到了“可采购产品”，但并不是沿着一条路线推进的。截至2026年9月，可以看到三条并行的产品化路径。第一条是以Google Project Starline→Google Beam为代表的裸眼光场“3D电话亭”：发送端只发少量RGB视频流，接收端做AI体积重建和视图合成。第二条是以Apple Persona、Meta Codec Avatars/Hologram、Android XR Likeness为代表的头显/眼镜端写实化身：先建模，再用传感器或语音驱动。第三条是以Meta Hyperscape、4DViews、Gracia、4DV.ai为代表的场景/人物体积捕捉和4D Gaussian splatting（4DGS）串流。与此同时，MPEG、Khronos、IETF在2025–2026年密集推出面向体积视频、Gaussian splat和化身的标准，表示层明显在向3DGS收敛。\n\nGoogle这条路线最完整地体现了“研究→产品”的演进。Starline（TOG 2021）是第一个在用户研究中被证明优于2D视频会议的系统，但依赖头部跟踪自由立体显示、多套彩色+深度采集，以及餐厅卡座大小的专用硬件。2023年的新原型改用“少量标准相机+新AI技术”，体积缩小到平板电视大小。2024年5月宣布与HP合作量产；2025年5月更名为Google Beam，官方把核心能力定义为“AI体积视频模型”；2025年6月HP Dimension with Google Beam在InfoComm发布，售价24,999美元。按Beam官方技术页，终端集成6台高速相机、12个麦克风、65英寸8K光场屏（约3320万像素，分别向双眼投送3D视频流），显示帧率60 fps，要求每端至少50 Mbps对称带宽、时延低于100 ms，通话功耗约600 W。2026年5月的I/O上，Beam推出群组会议实验：从普通设备入会的远端参会者经AI调整后，以真实尺寸围坐在虚拟桌边。2026年9月23日，Google宣布Beam出货至美、加、英、法、德、日六国，有18家渠道伙伴，并进驻Industrious联合办公空间；Zoom宣布原生客户端“Zoom for Google Beam”将在2026年下半年上线。不过到目前为止，真正的3D仍然只限于1:1通话。\n\n头显路线上，Apple在2024年2月随Vision Pro（3,499美元起）推出Persona beta，2024年4月上线spatial Personas，最多5人可在共享空间里以3D形式出现。visionOS 26（2025年9月）把Persona升级为“体积渲染+机器学习”，头发、睫毛和侧脸都有明显改善，媒体报道其底层是Gaussian splatting；visionOS 27进一步把Gaussian splat渲染做成系统级能力。Meta的Codec Avatars在2023年9月的Lex Fridman访谈中首次公开展示，逼真程度已足以支撑自然对话，但建模需要实验室扫描。此后研究侧补上了三块关键拼图：Relightable Gaussian Codec Avatars（CVPR 2024）把表示换成3D Gaussians；URAvatar（SIGGRAPH Asia 2024）实现了手机扫描建模；SqueezeMe（SIGGRAPH 2025）在Quest 3上以72 FPS同时驱动3个全身化身。在2026年9月的Connect上，Meta发布约100克、售价1,299.99美元、2027年春发货的Meta VR Glasses，内置由面部追踪驱动的写实Hologram，可在WhatsApp和Zoom中使用；Ray-Ban Display则推出手机自拍建模、纯语音驱动的Hologram。需要注意的是，首发的Hologram是立体视频流而不是体积式，只有正面视角，Meta表示之后会演进为真正的6DoF。Google在2025年12月为Galaxy XR推出Likeness：手机扫脸建模、头显摄像头驱动，以虚拟摄像头的方式接入Meet和Zoom，空间会议能力仍在开发中。\n\n企业协作平台层明显在“退潮与再定位”。微软Mesh在2024年1月于Teams中GA，2025年12月下线，转向面向大型活动的immersive events；分析师调研显示，约400家企业中只有16.5%计划在2024年底前投资VR/AR。Meta在2026年1月停止Horizon Workrooms，VR版Horizon Worlds于2026年6月15日从Quest移除，Hyperscape的共享功能也随之取消。与此相对，UC厂商选择了低摩擦的接入方式：Cisco用Room Bar Pro的双目相机向Vision Pro输出立体空间视频（2024）；Zoom在Vision Pro上支持Persona，并在2025年推出写实AI化身；Persona、Likeness、Hologram也都以虚拟摄像头的方式兼容Zoom、Teams、Webex等应用。NVIDIA走的是“单摄像头AI升维”：Live 3D Portrait（SIGGRAPH 2023）从单张RGB图像前馈预测triplane NeRF，在消费级硬件上达到24 fps，之后以Maxine 3D的形式与Looking Glass光场显示器联合演示。\n\n体积视频产业在2025–2026年整体转向4DGS。4DViews在HOLOSYS+中加入网格与Gaussian splatting双导出（SIGGRAPH 2025），2026年又推出支持SPZ/PLY的Unity插件。Gracia在2026年3月上线4DGS串流，码率从17 Mbps（每帧1.5万个splat）到75 Mbps（每帧12万个splat）不等，在Quest 3/Pico 4 Ultra上可跑到72 FPS，2026年6月又推出Vision Pro应用。4DV.ai在2025年发布WebXR 6DoF演示，2026年与OBSBOT展示了60台4K/60fps相机组成的阵列。heise的综述指出，360°人物采集通常需要40–60台相机，便携方案可以低到约10台iPhone。体育场景中，Peripheral把所需相机从100多台降到约32台。场景侧，Meta Hyperscape Capture（2025年9月）让用户用Quest 3扫描房间5–10分钟，经云端1–8小时处理后生成可漫游的splat场景，每个实例最多8人；Apple的SHARP（ICLR 2026）能在1秒内从单张照片前馈生成具有度量尺度的3D Gaussians。显示端方面，Proto的箱式“全息”终端已进入50多个体育场馆，Looking Glass的Hololuminescent Display以2,000美元起的价格把2D视频呈现为有纵深的影像。\n\n标准方面，MPEG的V3C（ISO/IEC 23090-5）家族已覆盖V-PCC、MIV和V-DMC。MIV第二版在2025年初达到FDIS，新增MIV Simple MPI profile；V-DMC在2025年7月、V3C第四版在2025年10月分别达到FDIS。针对Gaussian splat，MPEG在2026年初把V-PCC的GSC修正案推进到CDAM，2026年第二季度又把G-PCC修正案推进到CDAM，形成“视频式”和“几何式”两条标准化路径。化身交换格式ARF（ISO/IEC 23090-39）在2026年8月达到FDIS。传输层面，IETF发布了V3C的RTP载荷格式RFC 10034。Khronos在2026年2月发布glTF扩展KHR_gaussian_splatting的候选规范，其GitHub仓库目前标注为已批准；配套的压缩格式是Niantic开源的SPZ，体积约为PLY的1/10。OpenXR 1.1（2024）和Spatial Entities扩展（2025）统一了空间锚点等运行时能力，但目前还没有跨厂商的化身/面部通话标准。\n\n综合来看，截至2026年9月的产业现状（SOTA）是：能买到的真正裸眼6DoF 3D通话只有Beam（仅1:1、约2.5万美元、6相机+AI重建、50 Mbps链路）；用户规模最大的是头显/眼镜端写实化身，但多数仍以2D或立体视频的形式与现有会议生态互通；4DGS串流已进入十几到几十Mbps的可用区间。两篇锚点论文分别对应“稀疏多视角实时前馈视图合成”（Quark：8视角，1080p@30fps，A100）和“在线、多视角且时间一致的3D视频合成”（Ha et al.）。这两项能力，正是上述产品从1:1走向多方、从立体视频走向真6DoF时所缺的核心技术模块。", "subtopics": [{"name_en": "Glasses-free Light-field 3D Calling (Starline to Beam)", "name_zh": "裸眼光场3D视频通话（Starline→Beam）", "summary_zh": "以Google为代表的“免佩戴”路线：头部追踪光场/自由立体大屏，加上嵌入式多相机和AI体积重建，目标是1:1真人尺寸、眼神接触和运动视差。演进过程是：2021年TOG系统（专用彩色+深度采集）→2023年小型化原型（少量标准相机+AI）→2025年Beam/HP Dimension（6相机、65英寸8K光场屏、60 fps、24,999美元）→2026年六国出货、共享电话亭、群组会议实验和Zoom原生客户端。瓶颈在于成本、多方3D和接收端算力。", "representative_works": ["Project Starline: A High-Fidelity Telepresence System", "Google Beam: Our AI-first 3D video communication platform", "HP Dimension with Google Beam (InfoComm 2025)", "Google Beam technology specifications", "A new experiment brings better group meetings to Google Beam", "Google Beam expands with new regions, partners, and customers"]}, {"name_en": "Photoreal Avatars & Spatial Calling on Headsets/Glasses", "name_zh": "头显/眼镜端写实化身与空间通话", "summary_zh": "用头显/眼镜的传感器驱动预先建好的写实化身，覆盖Apple Persona/spatial Personas、Meta Codec Avatars→Hologram和Google Likeness。表示从网格/神经纹理转向3D Gaussians；建模从采集棚转向手机扫描；驱动方式从面部追踪扩展到语音。传输上多以2D或立体视频与现有通话应用互通，多人真6DoF仍在演进中。", "representative_works": ["Spatial Personas beta for Apple Vision Pro (visionOS 1.1)", "visionOS 26: Personas with volumetric rendering and shared spatial experiences", "Relightable Gaussian Codec Avatars", "URAvatar: Universal Relightable Gaussian Codec Avatars", "SqueezeMe: Mobile-Ready Distillation of Gaussian Full-Body Avatars", "Meta VR Glasses and Hologram calling (Connect 2026)", "Android XR Likeness photorealistic avatars"]}, {"name_en": "Enterprise UC Platforms & Ecosystem Shifts", "name_zh": "企业协作平台与生态变迁", "summary_zh": "UC与平台厂商的战略变化：卡通化身式的“元宇宙会议”（Mesh、Workrooms、VR版Horizon Worlds）在2025–2026年相继关停；Zoom、Cisco、NVIDIA则分别以原生接入Beam/Vision Pro、立体空间视频、单摄像头AI升维等低摩擦方式介入。微软的Holoportation作为经典原型，是这一领域的参照基线。", "representative_works": ["Holoportation: Virtual 3D Teleportation in Real-time", "Microsoft retires Mesh app, launches immersive events for Teams", "Meta shutters VR Horizon Worlds after discontinuing Horizon Workrooms", "Zoom for Google Beam (Zoom Spaces, 2026)", "Cisco Spatial Meetings for Apple Vision Pro", "Real-Time Radiance Fields for Single-Image Portrait View Synthesis (Live 3D Portrait)"]}, {"name_en": "Space Capture & Scene Sharing", "name_zh": "空间捕捉与场景共享", "summary_zh": "目标是“把地点传过去”：一是以Meta VR-NeRF→Hyperscape为代表的房间级高保真捕捉和多人共享，二是Apple SHARP这类单图前馈3DGS生成。它们为远程呈现提供共同在场的环境层，但目前多为静态场景，重建还需要云端数小时处理，商业模式也不稳定（Hyperscape的共享功能已随Horizon Worlds调整而取消）。", "representative_works": ["VR-NeRF: High-Fidelity Virtualized Walkable Spaces", "Meta Horizon Hyperscape Capture (Early Access)", "Horizon Hyperscape adds invites and local rendering", "Sharp Monocular View Synthesis in Less Than a Second"]}, {"name_en": "Volumetric Capture Studios & 4DGS Startups", "name_zh": "体积视频工作室与4DGS创业公司", "summary_zh": "体积视频工作室和创业公司在2025–2026年集体转向4D Gaussian splatting：4DViews做网格/GS双导出，Gracia和4DV.ai做串流与头显播放，Peripheral面向体育场景减少相机数量；显示端有Proto全息箱和Looking Glass HLD。关键行业量级：360°采集需40–60台相机，串流码率17–80 Mbps，头显播放72 FPS。", "representative_works": ["4DViews HOLOSYS+ adds Gaussian Splatting export", "Gracia: moving volumetric captures are now streamable", "Volumetric videos overcome a major hurdle on the path to the mainstream", "4DV.ai WebXR demo of 6DoF volumetric video", "Peripheral Labs brings volumetric video to live sports", "Proto hologram expands in India (Proto Epic / Luma / M)", "Looking Glass Hololuminescent Display (HLD)"]}, {"name_en": "Standards & Interchange Formats", "name_zh": "标准与交换格式", "summary_zh": "MPEG的V3C家族（V-PCC、MIV、V-DMC）日趋完善，并开始覆盖Gaussian splat（V-PCC和G-PCC两条GSC修正案）和化身（ARF）。IETF RFC 10034定义了V3C的RTP承载。Khronos的glTF扩展KHR_gaussian_splatting和Niantic的SPZ，分别成为3DGS交换的正式标准和事实标准。OpenXR 1.1与Spatial Entities统一了XR运行时，但还没有化身通话标准。", "representative_works": ["MPEG Immersive Video Coding Standard", "An overview of ongoing point cloud compression standardization activities: video-based (V-PCC) and geometry-based (G-PCC)", "MPEG Gaussian Splat Coding: V-PCC and G-PCC amendments reach CDAM", "MPEG 155th meeting: Avatar Representation Format (ISO/IEC 23090-39) to FDIS", "KHR_gaussian_splatting glTF 2.0 extension", "SPZ: open-source compressed file format for 3D Gaussian splats", "RFC 10034: RTP Payload Format for Visual Volumetric Video-Based Coding (V3C)"]}], "timeline": [{"year": 2016, "event_zh": "微软Holoportation（UIST 2016）展示多台RGB-D相机实时全身重建+AR/VR双向远程呈现"}, {"year": 2020, "event_zh": "MPEG V-PCC/G-PCC点云压缩标准化综述发表，体积视频“传几何”路线的标准框架成形"}, {"year": 2021, "event_zh": "Project Starline亮相，论文发表于ACM TOG（SIGGRAPH Asia 2021），首次证明3D远程呈现优于2D视频会议；MIV标准综述发表于Proc. IEEE"}, {"year": 2023, "event_zh": "Starline新原型（5月）：改用少量标准相机+AI，体积缩小到平板电视大小"}, {"year": 2023, "event_zh": "NVIDIA在SIGGRAPH 2023演示单摄像头AI 3D视频会议（Live 3D Portrait，24 fps）；Meta在Lex Fridman访谈中展示写实Codec Avatars（9月）；VR-NeRF发表"}, {"year": 2024, "event_zh": "微软Mesh在Teams中GA（1月26日）；Vision Pro发售、Persona beta上线（2月2日，3,499美元起）；spatial Personas上线（4月2日，最多5人）"}, {"year": 2024, "event_zh": "OpenXR 1.1发布（4月15日）；Google宣布与HP合作量产Starline（5月）；Niantic开源SPZ（9月）；Cisco推出面向Vision Pro的Spatial Meetings（10月）；Quark（SIGGRAPH Asia 2024）实现8视角1080p@30fps实时NVS"}, {"year": 2025, "event_zh": "MIV第二版达到FDIS，新增Simple MPI profile，ARF进入CD（MPEG第149次会议）；Google Beam发布（5月20日）；HP Dimension售价24,999美元（6月InfoComm）；Ha et al.发表于CVPR 2025"}, {"year": 2025, "event_zh": "V-DMC达到FDIS（7月）；4DViews在SIGGRAPH 2025推出GS导出；visionOS 26体积渲染Persona正式推送（9月15日）；Hyperscape Capture开放Early Access（9月17日）；V3C第四版达到FDIS（10月）"}, {"year": 2025, "event_zh": "微软下线Mesh、转向immersive events（12月）；Android XR Likeness beta上线（12月）；Gracia完成170万美元融资（12月）"}, {"year": 2026, "event_zh": "Meta停止Horizon Workrooms（1月）；Khronos发布KHR_gaussian_splatting候选规范（2月3日）；MPEG把V-PCC的Gaussian Splat Coding修正案推进到CDAM（第153次会议）；Gracia上线4DGS串流（3月）"}, {"year": 2026, "event_zh": "SPZ 4发布（5月）；Beam在I/O 2026推出群组会议实验（5月20日）；MPEG把G-PCC的GSC修正案推进到CDAM（第154次会议）；VR版Horizon Worlds从Quest移除（6月15日）；visionOS 27提供系统级Gaussian splat渲染"}, {"year": 2026, "event_zh": "ARF（ISO/IEC 23090-39）达到FDIS（第155次会议）；IETF RFC 10034发布；Beam出货六国并进驻Industrious（9月23日）；Meta Connect 2026发布VR Glasses与Hologram通话（9月23日）"}], "trends_zh": ["采集端从主动深度传感走向“少量RGB相机+AI重建”：Starline 2021用多套彩色+深度采集，2023年改为少量标准相机，Beam用6相机加AI体积模型；消费端进一步降到单相机或手机扫描（Likeness、URAvatar、Meta Hologram的自拍采集、NVIDIA单摄像头triplane）。", "表示层向3D Gaussian收敛：从Codec Avatars（RGCA、URAvatar、SqueezeMe）、visionOS 26 Persona（据媒体报道）和visionOS 27系统级GS渲染，到Hyperscape、4DViews、Gracia、4DV.ai，再到glTF KHR_gaussian_splatting、SPZ和MPEG GSC，整条产业链都在转向3DGS。", "“感知上的3D”与“几何上的6DoF”开始分化：Cisco输出立体空间视频，Meta Hologram首发是只有正面的立体视频，Beam群组会议中的远端参会者是被空间化的2D画面。与此同时，生成式/语音驱动的化身（Ray-Ban Display Hologram、延迟低于15 ms的音频驱动面部动画）用先验来换取更低的传感需求。", "互通优先于封闭平台：Beam原生支持Zoom/Meet，并与Teams/Webex做2D互通；Persona、Likeness、Hologram以虚拟摄像头或原生集成的方式进入Zoom、Teams、WhatsApp；Zoom for Google Beam将在2026年下半年上线。", "通用“元宇宙会议”退潮，市场聚焦高价值场景：Mesh下线，Workrooms和VR版Horizon Worlds关停；Beam定位于高管/客户1:1会议和共享电话亭（Industrious），并用会议回忆提升28%、非语言行为增加39%、联结感提升50%等内部研究数据论证ROI。", "体积视频串流进入可用码率区间：Gracia为17–75 Mbps，Beam要求每端50 Mbps对称带宽；4DGS开始采用“关键帧+运动增量”的编解码器式压缩；传输标准同步推进（V3C第四版、V-DMC、RFC 10034、ARF）。", "3D终端与生成式AI界面融合：Google在Beam Lab测试真人尺寸的AI代理，Proto提供AI全息数字人，Meta推出Muse实时化身模型。远程呈现终端正在同时成为“与AI面对面”的界面。"], "open_problems_zh": ["多方3D：Beam的3D通话仍限于1:1，群组方案只是把2D远端画面“空间化”。在N方会话里为每位观看者合成一致的6DoF视图，同时控制接近N²增长的带宽和算力，目前还没有产品级答案。", "端侧算力与功耗：Quark要在A100上才能做到1080p@30fps，Ha et al.在V100上约100 ms/帧，而Beam整机功耗达600 W，眼镜设备只有百克级重量。把高质量实时NVS压到NPU或移动GPU上（可参考SqueezeMe的蒸馏思路）是关键。", "时间一致性与难例：稀疏视角下的闪烁，头发、镜面和透明材质，以及遮挡区域都是难点（Quark逐帧独立重建、Ha et al.在镜面区域会失效）；4DGS体积视频也普遍存在帧间抖动。", "面向交互时延的3D码流与传输：MPEG GSC目前以V-PCC/G-PCC修正案的形式推进，MIV虽能承载多视角+深度，但缺少针对<100 ms双向会话的低延迟profile、码率控制和拥塞自适应实践；接收端合成范式也还没有成熟的端到端规范。", "真实性与信任：语音驱动或生成式补全的化身，以及“AI体积模型”，都可能幻觉出没有被拍到的内容。如何度量保真度、标识生成内容、防止冒用（深度伪造），并保护人脸等生物特征数据，是企业部署的前提。", "评测体系：现有成效数据大多是厂商内部研究（如Beam的会议回忆提升28%、非语言行为增加39%、联结感提升50%），缺少独立、可复现的presence/QoE基准；只看PSNR/LPIPS这类客观指标，也无法反映沟通质量。", "跨平台化身互通：ARF刚达到FDIS，OpenXR还没有化身/面部通话标准；Persona、Codec Avatar、Likeness之间无法直接互通，只能退化为2D虚拟摄像头。", "成本与形态：约2.5万美元、254磅、600 W的终端难以普及；廉价的裸眼显示（如Looking Glass HLD）缺少头部追踪和真实视差；眼镜形态目前还做不到体积式通话。"], "relation_to_anchors_zh": "Quark（Google，SIGGRAPH Asia 2024）在单块A100上，从8路间距至多约30 cm的输入视图出发，以1080p、30 fps完成实时重建和渲染（二者合计约33 ms/帧），采用分层深度图加Transformer多视角聚合的feed-forward设计。这个问题设定和Google Beam的产品形态高度吻合：Beam用嵌在屏幕边框里的6台相机采集，由“AI体积视频模型”在接收端合成双眼视图，并以60 fps显示；Starline在2023年也正是从专用深度传感器转向了“少量标准相机+AI”。需要强调的是，Google的公开资料并没有确认Beam采用了Quark。不过Quark自己点出的限制——需要8–16个近距离视角、逐帧独立重建而没有时间一致性、依赖数据中心级GPU——恰好对应产品侧的工程挑战：Beam整机功耗600 W、需要云端和端侧协同推理、要求每端50 Mbps对称带宽。在标准层面，Quark的分层深度/MPI式表示与MIV的MVD/MPI profile（第二版新增了Simple MPI profile）同属“多视角视频+深度→接收端视图合成”的范式，可以复用现有的2D视频编解码器和RTP管线。\n\nHa et al.（KAIST+Meta，CVPR 2025）用渐进式深度细化，加上在目标视图图像空间中累积的TSDF，来引导预训练的融合网络，专门解决多视角之间和时间上的闪烁问题。在4路输入下，它在V100上约100 ms/帧（用TensorRT加速后融合阶段为23 ms），并明确把视频会议和AR/VR作为目标应用。它对应的产业缺口有三个。第一，Meta 2026年发布的Hologram首发只有正面立体视频，官方计划“演进为真正的6DoF”；要从头显或多相机实时生成时间稳定的自由视点视频，这正是必经之路。第二，4DViews、Gracia、4DV.ai等4DGS体积视频普遍面临帧间闪烁和码率压力，TSDF这类全局几何约束可以作为一致性先验。第三，Beam的群组会议如果要把远端参会者从“空间化2D”升级为真正的3D，也必须在更少、更不规则的相机配置下保持跨视角和跨时间的一致性。\n\n总体来看，产业已分化为两种传输范式：一种是“发送端重建，传几何/Gaussian”（V-PCC/G-PCC GSC、Gracia串流、Hyperscape），另一种是“只发少量视频，接收端做神经合成”（Beam、MIV、NVIDIA单摄像头方案）。两篇锚点论文都属于后者。这一范式的优势是带宽可控、能兼容现有视频基础设施，劣势是接收端算力要求高、一致性难保证。它能否从数据中心级GPU走进会议室终端乃至眼镜，将取决于端侧NPU能力、蒸馏/量化技术，以及面向低延迟会话的“视图+深度”码流规范。"}], "papers": [{"title": "Stereo Magnification: Learning View Synthesis using Multiplane Images", "authors": "Zhou et al. (Google)", "year": 2018, "venue": "SIGGRAPH 2018 (ACM TOG)", "url": "https://arxiv.org/abs/1805.09817", "summary_zh": "首次提出多平面图像（MPI）：由窄基线立体图像预测一组前平行 RGBA 平面，用 YouTube 房产视频训练，可以显著外推相机基线。", "key_numbers": "约 1,000 万帧，约 80,000 个片段，约 10,000 个 YouTube 视频", "tier": "milestone", "areas": ["rt-nvs", "eval"]}, {"title": "Local Light Field Fusion: Practical View Synthesis with Prescriptive Sampling Guidelines", "authors": "Mildenhall et al.", "year": 2019, "venue": "SIGGRAPH 2019 (ACM TOG)", "url": "https://arxiv.org/abs/1905.00889", "summary_zh": "为每个输入视角预测 MPI，渲染时混合相邻的局部光场，并给出采集采样密度的理论指导。", "key_numbers": "所需视角数比 Nyquist 采样少至多 4000×", "tier": "milestone", "areas": ["rt-nvs"]}, {"title": "DeepView: View Synthesis with Learned Gradient Descent", "authors": "Flynn et al. (Google)", "year": 2019, "venue": "CVPR 2019", "url": "https://arxiv.org/abs/1906.07316", "summary_zh": "用 learned gradient descent 迭代估计 MPI，显式进行遮挡推理，并发布 Spaces 相机阵列数据集。", "key_numbers": "100 个场景，16 相机 rig，每个场景 3–10 个 rig 位置", "tier": "milestone", "areas": ["rt-nvs", "eval"]}, {"title": "Immersive Light Field Video with a Layered Mesh Representation", "authors": "Broxton et al. (Google)", "year": 2020, "venue": "SIGGRAPH 2020 (ACM TOG 39(4))", "url": "https://augmentedperception.github.io/deepviewvideo/", "summary_zh": "把 DeepView 扩展为球壳 MSI，再压缩为少量 RGBA+depth 层网格；配合纹理图集和常规视频编码，可在移动 VR 和浏览器中播放。", "key_numbers": "46 路同步相机，半球直径 92 cm，平均间距 18 cm，30 fps，视场 >220°，观看基线 80 cm", "tier": "milestone", "areas": ["rt-nvs", "eval"]}, {"title": "MatryODShka: Real-time 6DoF Video View Synthesis using Multi-Sphere Images", "authors": "Attal et al. (Brown)", "year": 2020, "venue": "ECCV 2020", "url": "https://arxiv.org/abs/2008.06534", "summary_zh": "把 360° 立体（ODS）视频实时转换为多球面图像（MSI），同时学习深度与去遮挡内容，提供带运动视差的 6DoF 渲染。", "key_numbers": "GPU 上实时处理与渲染", "tier": "important", "areas": ["rt-nvs"]}, {"title": "3D Photography using Context-aware Layered Depth Inpainting", "authors": "Shih et al. (Virginia Tech, Facebook)", "year": 2020, "venue": "CVPR 2020", "url": "https://arxiv.org/abs/2004.04727", "summary_zh": "把单张 RGB-D 图像转为带像素连接关系的分层深度图像（LDI），并对遮挡区域做颜色与深度的上下文感知补全。", "key_numbers": "", "tier": "important", "areas": ["rt-nvs"]}, {"title": "NeX: Real-time View Synthesis with Neural Basis Expansion", "authors": "Wizadwongsa et al. (VISTEC)", "year": 2021, "venue": "CVPR 2021 (Oral)", "url": "https://arxiv.org/abs/2103.05606", "summary_zh": "在 MPI 的每个像素上用神经基函数的线性组合建模视角相关颜色，逐场景优化后可以实时渲染。", "key_numbers": "渲染比当时的 SOTA 快 1000× 以上", "tier": "important", "areas": ["rt-nvs"]}, {"title": "Self-improving Multiplane-to-layer Images for Novel View Synthesis", "authors": "Solovev et al.", "year": 2023, "venue": "WACV 2023", "url": "https://arxiv.org/abs/2210.01602", "summary_zh": "把前平行半透明平面经端到端训练变形为可变形层，再前馈聚合多视角进行精修；支持任意输入视角数，无需逐场景微调。", "key_numbers": "Quark 论文实测：RFF 23.35 dB，约 4.4 s/帧", "tier": "relevant", "areas": ["rt-nvs"]}, {"title": "Real-Time View Synthesis with Multiplane Image Network using Multimodal Supervision", "authors": "Gond et al. (Mid Sweden University)", "year": 2025, "venue": "IEEE MMSP 2025", "url": "https://ieeexplore.ieee.org/document/11324036/", "summary_zh": "从单张 RGB 直接预测 MPI 参数，训练时用视图合成与深度估计联合监督，推理时只保留合成分支以实现实时。", "key_numbers": "", "tier": "relevant", "areas": ["rt-nvs"]}, {"title": "Quark: Real-time, High-resolution, and General Neural View Synthesis", "authors": "Flynn et al. (Google)", "year": 2024, "venue": "SIGGRAPH Asia 2024 (ACM TOG)", "url": "https://arxiv.org/abs/2411.16680", "summary_zh": "前馈网络在多尺度 UNet 式结构中迭代执行 render-and-refine，重建分层深度图（LDM）和输入视图混合权重，每步用 Transformer 聚合多视图信息。大部分计算在低分辨率完成，最后上采样到 1080p。", "key_numbers": "A100 上 1080p@30fps（重建+渲染）；8 路输入（支持 4–16 路）；LDM 从 24/32 层收缩到 6–8 层；RFF 26.03 dB、32.2 ms（ENeRF 23.71 dB/205 ms，GPNR 25.42 dB/25 s）；Quark+ 26.53 dB/91.9 ms", "tier": "milestone", "areas": ["rt-nvs", "ff-nvs"]}, {"title": "Free View Synthesis", "authors": "Riegler & Koltun (Intel Labs)", "year": 2020, "venue": "ECCV 2020", "url": "https://arxiv.org/abs/2008.05511", "summary_zh": "用 SfM+MVS 构建几何代理，把邻近视角的编码特征重投影到目标视角，再由循环编解码网络合成；训练后无需逐场景优化即可泛化。", "key_numbers": "", "tier": "important", "areas": ["rt-nvs"]}, {"title": "Stable View Synthesis", "authors": "Riegler & Koltun (Intel Labs)", "year": 2021, "venue": "CVPR 2021", "url": "https://arxiv.org/abs/2011.07233", "summary_zh": "在几何代理表面点上存储方向相关特征，做视角相关的表面特征聚合，再由卷积网络渲染，时空上稳定。", "key_numbers": "", "tier": "important", "areas": ["rt-nvs"]}, {"title": "IBRNet: Learning Multi-View Image-Based Rendering", "authors": "Wang et al. (Google)", "year": 2021, "venue": "CVPR 2021", "url": "https://arxiv.org/abs/2102.13090", "summary_zh": "用 MLP 加 ray transformer，在渲染时从邻近源视图即时取色并估计密度，学习一个通用的视图插值函数，把经典 IBR 与体渲染结合起来。", "key_numbers": "稀疏邻近视图插值；逐场景微调后可比肩当时的单场景方法", "tier": "milestone", "areas": ["rt-nvs", "ff-nvs"]}, {"title": "FWD: Real-time Novel View Synthesis with Forward Warping and Depth", "authors": "Cao et al. (University of Michigan)", "year": 2022, "venue": "CVPR 2022", "url": "https://arxiv.org/abs/2206.08355", "summary_zh": "用显式深度把输入视角前向投影到目标视角，再经可微渲染与融合网络合成；可以接入传感器深度。", "key_numbers": "比当时的 SOTA 快 130–1000×", "tier": "important", "areas": ["rt-nvs"]}, {"title": "Efficient Neural Radiance Fields for Interactive Free-viewpoint Video (ENeRF)", "authors": "Lin et al. (Zhejiang University)", "year": 2022, "venue": "SIGGRAPH Asia 2022", "url": "https://arxiv.org/abs/2112.01517", "summary_zh": "可泛化的交互式 NeRF 自由视点视频方法（ENeRF），随代码发布了 ENeRF-Outdoor 户外多演员多视角数据集。", "key_numbers": "比先前泛化 NeRF 快至少 60×；Quark 论文实测约 205 ms/帧、RFF 23.71 dB；Ha et al. 实测 DyNeRF 29.51 dB", "tier": "milestone", "areas": ["rt-nvs", "ff-nvs", "eval"]}, {"title": "Generalizable Patch-Based Neural Rendering (GPNR)", "authors": "Suhail et al. (Google)", "year": 2022, "venue": "ECCV 2022 (Oral)", "url": "https://arxiv.org/abs/2207.10662", "summary_zh": "沿各参考视角的极线采样图像 patch，用 Transformer 序列直接预测目标光线颜色，不需要 NeRF 式体渲染。", "key_numbers": "Quark 论文实测：RFF 25.42 dB，约 25 s/帧", "tier": "important", "areas": ["rt-nvs"]}, {"title": "NeuralPassthrough: Learned Real-Time View Synthesis for VR", "authors": "Xiao et al. (Meta Reality Labs)", "year": 2022, "venue": "arXiv 2022", "url": "https://arxiv.org/abs/2207.02186", "summary_zh": "首个学习型 VR 透视（passthrough）方法：从头显上的立体 RGB 相机实时合成透视正确的宽视场双目视图。", "key_numbers": "", "tier": "relevant", "areas": ["rt-nvs"]}, {"title": "GPS-Gaussian: Generalizable Pixel-wise 3D Gaussian Splatting for Real-time Human Novel View Synthesis", "authors": "Zheng et al.", "year": 2024, "venue": "CVPR 2024 (Highlight)", "url": "https://arxiv.org/abs/2312.02155", "summary_zh": "在源视图上定义高斯参数图，与深度估计联合训练，直接回归像素对齐的 3D 高斯。在稀疏视角下无需逐人优化，就能以 2K 分辨率实时渲染人体新视角。", "key_numbers": "2K 分辨率实时渲染；Tele360 在其 6 视图 2K 设置下测得约 300 ms/帧、PSNR 22.40", "tier": "milestone", "areas": ["rt-nvs", "ff-nvs", "tele-sys", "avatars", "4d-recon"]}, {"title": "Geometry-guided Online 3D Video Synthesis with Multi- al floor、更高效的注视点渲染等扩展并入核心规范；2025年又推出Spatial Entities扩展，统一了平面、标记、锚点和持久化能力。Meta、字节跳动、Sony、HTC等厂商支持，Apple没有加入。", "key_numbers": "OpenXR 1.0于2019年定稿，与1.1相隔约5年", "tier": "relevant", "areas": ["industry"]}, {"title": "RFC 10034: RTP Payload Format for Visual Volumetric Video-Based Coding (V3C)", "authors": "L. Ilola, L. Kondrad (IETF)", "year": 2026, "venue": "Standard", "url": "https://www.rfc-editor.org/info/rfc10034", "summary_zh": "定义了V3C atlas子码流的RTP承载方式（单NAL包、聚合包、分片单元），几何、占用、属性等多路RTP流之间的同步机制，以及SDP协商流程，使V-PCC、MIV、V-DMC可以用于实时会话。", "key_numbers": "Proposed Standard（2026）", "tier": "important", "areas": ["industry"]}]}</script>
