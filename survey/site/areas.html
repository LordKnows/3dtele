.path { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 14px; }
.path ol { margin: 0; padding-left: 1.3em; display: grid; gap: 10px; font-size: 13.5px; }
.path ol li small { display: block; color: var(--muted); }
.note { font-size: 13px; color: var(--muted); max-width: 80ch; }

/* ---------- learning part ---------- */
.cchip { appearance: none; font: inherit; font-size: 12.5px; padding: 1px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); border: 1px solid transparent; cursor: pointer; white-space: nowrap; }
.cchip:hover { border-color: var(--accent); }
.cchip.ghost { background: transparent; border-color: var(--rule); color: var(--ink-2); }
.cchip.ghost:hover { border-color: var(--accent); color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chips .lbl { font-size: 12px; color: var(--muted); margin-right: 2px; }
.flash { animation: flash 1.6s ease-out 1; }
@keyframes flash { 0% { background-color: var(--flash); } 100% { background-color: transparent; } }
@media (prefers-reduced-motion: reduce) { .flash { animation: none; outline: 2px solid var(--accent); } }

.math-block { overflow-x: auto; overflow-y: hidden; padding: 8px 12px; background: var(--surface-2); border-radius: 6px; font-family: var(--mono); font-size: 13px; color: var(--ink); }
.math-block mjx-container { margin: 4px 0 !important; }
.eq { display: grid; gap: 6px; }
.eq p { font-size: 13.5px; color: var(--ink-2); white-space: pre-line; }
.eqs { display: grid; gap: 14px; }
.aside { background: var(--surface-2); border-radius: 8px; padding: 10px 14px; font-size: 14px; color: var(--ink-2); display: grid; gap: 2px; }
.aside b { font-size: 12px; color: var(--muted); letter-spacing: .05em; font-weight: 700; }
.aside span { white-space: pre-line; }
.idref { appearance: none; background: none; border: 0; padding: 0 1px; font: inherit; font-family: var(--mono); font-size: .86em; color: var(--accent); cursor: pointer; text-decoration: underline dotted; text-underline-offset: 3px; }
.idref:hover { text-decoration-style: solid; }

.roadmap { display: grid; gap: 10px; }
details.stage { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; min-width: 0; }
details.stage > summary { list-style: none; cursor: pointer; padding: 14px 18px; display: grid; grid-template-columns: 40px minmax(0,1fr) auto; gap: 12px; align-items: start; }
details.stage > summary::-webkit-details-marker { display: none; }
details.stage .num { font-family: var(--mono); width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: 13px; }
details.stage .head { display: grid; gap: 4px; }
details.stage .head h3 { font-size: 16.5px; }
details.stage .head p { font-size: 13.5px; color: var(--ink-2); }
details.stage .dur { font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: nowrap; }

.mods { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.mod { appearance: none; text-align: left; font: inherit; cursor: pointer; background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 12px 14px; display: grid; gap: 4px; align-content: start; color: var(--ink); }
.mod:hover { border-color: var(--accent); }
.mod i { font-style: normal; font-family: var(--mono); font-size: 11px; color: var(--muted); }
.mod b { font-family: var(--serif); font-size: 14.5px; }
.mod span { font-size: 12.5px; color: var(--ink-2); }

details.concept { border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); min-width: 0; }
details.concept > summary { list-style: none; cursor: pointer; padding: 12px 16px; display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 4px 12px; }
details.concept > summary::-webkit-details-marker { display: none; }
details.concept .nm { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
details.concept .nm b { font-family: var(--serif); font-size: 15.5px; }
details.concept .nm span { font-family: var(--mono); font-size: 11px; color: var(--muted); }
details.concept .tl { grid-column: 1 / -1; font-size: 13.5px; color: var(--ink-2); }
details.concept .uses { display: flex; gap: 6px; align-items: center; }
.concept-body { border-top: 1px solid var(--rule); padding: 16px 16px 20px; display: grid; gap: 18px; min-width: 0; }
.anchor-use { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }
.anchor-use > div { border: 1px solid var(--rule); border-radius: 8px; padding: 10px 12px; display: grid; gap: 6px; align-content: start; }
.anchor-use h5 { margin: 0; font-family: var(--sans); font-size: 12.5px; font-weight: 700; color: var(--ink); display: flex; gap: 8px; align-items: center; }
.anchor-use p { font-size: 13.5px; color: var(--ink-2); }
.anchor-use small { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
details.qa { border-top: 1px dashed var(--rule); }
details.qa > summary { list-style: none; cursor: pointer; padding: 8px 0; font-size: 14px; color: var(--ink); display: flex; gap: 8px; }
details.qa > summary::before { content: "问"; font-size: 11.5px; color: var(--accent); background: var(--accent-soft); border-radius: 4px; padding: 0 6px; height: fit-content; margin-top: 3px; }
details.qa > p { font-size: 13.5px; color: var(--ink-2); padding: 0 0 10px 30px; white-space: pre-line; }
.res { display: grid; gap: 6px; font-size: 13.5px; }
.res div { display: grid; grid-template-columns: 58px minmax(0,1fr); gap: 8px; }
.res .ty { font-family: var(--mono); font-size: 11px; color: var(--muted); padding-top: 3px; }
.res small { color: var(--muted); display: block; }

.diagram-wrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: 10px; background: var(--surface); padding: 10px; }
svg.diagram { display: block; width: 100%; min-width: 860px; height: auto; }
.dnode rect { fill: var(--surface-2); stroke: var(--rule); stroke-width: 1; }
.dnode.data rect { fill: var(--surface); stroke-dasharray: 4 3; }
.dnode.click { cursor: pointer; }
.dnode.click:hover rect, .dnode.click:focus rect { stroke: var(--accent); stroke-width: 1.6; }
.dnode.click:focus { outline: none; }
.dnode .t { fill: var(--ink); font-family: var(--sans); font-size: 13px; font-weight: 500; }
.dnode .s { fill: var(--muted); font-family: var(--sans); font-size: 11px; }
.dnode .k { fill: var(--accent); font-family: var(--mono); font-size: 10.5px; font-weight: 500; }
.dedge { stroke: var(--muted); stroke-width: 1.4; fill: none; }
.dedge.fb { stroke: var(--accent); stroke-dasharray: 5 4; }
.dhead { fill: var(--muted); }
.dhead.fb { fill: var(--accent); }
.dloop { fill: var(--accent-soft); fill-opacity: .45; stroke: var(--accent); stroke-width: 1; }
.dlabel { fill: var(--accent); font-family: var(--sans); font-size: 12px; font-weight: 700; }
.dnote { fill: var(--muted); font-family: var(--sans); font-size: 11.5px; }

details.step { border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); min-width: 0; }
details.step > summary { list-style: none; cursor: pointer; padding: 12px 16px; display: grid; grid-template-columns: 44px minmax(0,1fr) auto; gap: 10px; align-items: baseline; }
details.step .sid { font-family: var(--mono); font-size: 12px; color: var(--accent); }
details.step .st { display: grid; gap: 2px; }
details.step .st b { font-size: 15px; font-weight: 500; color: var(--ink); }
details.step .st small { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.step-body { border-top: 1px solid var(--rule); padding: 16px; display: grid; gap: 16px; min-width: 0; }
.checklist { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; }
.checklist div { border: 1px solid var(--rule); border-radius: 8px; padding: 8px 12px; display: grid; gap: 4px; font-size: 13px; color: var(--ink-2); align-content: start; }

.lanes-wrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: 10px; background: var(--surface); padding: 12px 12px 6px; position: relative; }
svg.lanes { display: block; width: 100%; min-width: 820px; height: auto; }
.lanes .grid { stroke: var(--rule); stroke-width: 1; }
.lanes .axis { fill: var(--muted); font-family: var(--mono); font-size: 11px; }
.lanes .lane-l { fill: var(--ink-2); font-family: var(--sans); font-size: 12px; }
.lanes .dot { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.lanes .dot.hollow { fill: var(--surface); stroke: var(--accent); stroke-width: 1.6; }
.lanes .hit { fill: transparent; cursor: pointer; }
.lanes g.m:hover .dot, .lanes g.m:focus .dot { stroke: var(--ink); }
.lanes g.m:focus { outline: none; }
.lanes .brk { stroke: var(--muted); stroke-width: 1; }
.vtip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; color: var(--ink); max-width: 320px; box-shadow: 0 4px 16px rgba(0,0,0,.12); display: grid; gap: 2px; z-index: 3; }
.vtip small { color: var(--muted); font-family: var(--mono); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--muted); align-items: center; padding: 4px 4px 0; }
.legend svg { vertical-align: middle; }
.classic-list { display: grid; gap: 10px; }
details.classic { border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); min-width: 0; }
details.classic > summary { list-style: none; cursor: pointer; padding: 10px 16px; display: grid; grid-template-columns: 52px minmax(0,1fr) auto; gap: 10px; align-items: baseline; }
details.classic > summary::-webkit-details-marker { display: none; }
details.classic .yr { font-family: var(--mono); font-size: 13px; color: var(--ink); }
details.classic .ti { display: grid; gap: 2px; }
details.classic .ti b { font-size: 14.5px; font-weight: 500; }
details.classic .ti small { font-size: 12px; color: var(--muted); }
details.classic .cit { font-family: var(--mono); font-size: 12px; color: var(--ink-2); text-align: right; white-space: nowrap; }
.classic-body { border-top: 1px solid var(--rule); padding: 12px 16px 16px; display: grid; gap: 12px; }

.gl-wrap { max-height: 72vh; overflow: auto; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); }
.gl td.en { font-weight: 500; color: var(--ink); min-width: 170px; }
.gl td.zh { min-width: 110px; }
.gl td.def { min-width: 300px; color: var(--ink-2); }

@media (max-width: 1000px) {
  .shell { grid-template-columns: minmax(0,1fr); gap: 20px; padding-top: 0; }
  .toc { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); max-height: none; overflow-x: auto; overflow-y: hidden; padding-block: 10px; border-bottom: 1px solid var(--rule); margin-inline: -20px; padding-inline: 20px; }
  .toc .brand, .toc .ramp, .toc li.grp, .toc ol.sub { display: none; }
  .toc ol { display: flex; gap: 4px; margin: 0; white-space: nowrap; }
  .toc a { border-left: 0; border-bottom: 2px solid transparent; padding: 4px 8px; }
  .toc a.on, .toc a.page.cur { border-bottom-color: var(--accent); }
  .toc-mobile { display: grid; gap: 6px; }
  :root { --jump-offset: 72px; }
  .toc { scrollbar-width: none; }
  .toc::-webkit-scrollbar { display: none; }
  .pager { grid-template-columns: minmax(0, 1fr); }
  .pager a.next { grid-column: 1; }
  .layer { grid-template-columns: minmax(0,1fr); gap: 10px; }
  .two, .idea-grid, .path, .anchor-use { grid-template-columns: minmax(0,1fr); }
  .mods { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .starts { grid-template-columns: minmax(0,1fr); }
}
@media (max-width: 560px) {
  .shell { padding-inline: 16px; }
  .toc { margin-inline: -16px; padding-inline: 16px; }
  .panel { padding: 16px; }
  details.idea > summary { grid-template-columns: minmax(0,1fr) auto; }
  details.idea .rank { display: none; }
  details.step > summary { grid-template-columns: minmax(0,1fr) auto; }
  details.step .sid { display: none; }
  details.classic > summary { grid-template-columns: 44px minmax(0,1fr); }
  details.classic .cit { grid-column: 2; text-align: left; }
  .mods { grid-template-columns: minmax(0,1fr); }
  .area-body, .idea-body, .concept-body, .step-body { padding-inline: 12px; }
}

/* ---------- overflow guards: long labels wrap inside cards instead of widening the page ---------- */
.cchip, .chip { max-width: 100%; }
.chips .cchip, .classic-body .chip, .card .chip { white-space: normal; overflow-wrap: anywhere; text-align: left; }
.toc-mobile .chips > * { white-space: nowrap; }
.card, .anchor-use > div, .classic-body, .concept-body, .step-body, .area-body, .idea-body, .blk, .subcard { grid-template-columns: minmax(0, 1fr); }
@media (min-width: 1001px) { .page-head.only-mobile { display: none; } }
@media (max-width: 1000px) { .page-head { margin-bottom: -40px; } }
main { overflow-wrap: break-word; }
.prose, .sec-head, .hero, .threat, .obj, .eqs, .eq, .kv div, .checklist div, .layer .body, .anchor-body, .classic-list, .roadmap { grid-template-columns: minmax(0, 1fr); }
mjx-container[jax="SVG"]:not([display="true"]) { display: inline-block; max-width: 100%; overflow-x: auto; overflow-y: hidden; vertical-align: middle; }
ul.plain, .path ol, .res, .timeline, .stages, .subgrid > *, .cards > * { grid-template-columns: minmax(0, 1fr); }
ul.plain li, .res span, .threat span { overflow-wrap: anywhere; }

</style>
</head>

<div class="shell">

<script type="application/json" id="data">{"meta": {"date": "2026-09-28", "subtitle": "以 Quark（Google，SIGGRAPH Asia 2024）与 Ha et al.（KAIST + Meta，CVPR 2025）两篇实时多视角新视角合成论文为出发点，分三部分展开。第一部分帮你入门：基础知识、进阶专题、经典论文，以及把基础知识和两篇论文逐步对上的精读导读。第二部分梳理 3D 临场（telepresence）的全栈调研：采集、几何、表示、渲染、传输、显示与感知。第三部分给出 18 个经过对抗式查新和模拟 AC 评审的研究方向。", "learn_lede": "面向刚进入 3D 视觉 / 临场方向的研究生，默认你有本科线代、概率、Python 和基础深度学习。建议的用法：按“学习路线”推进；遇到不懂的词查“术语表”；读两篇锚点论文时开着“精读导读”，每一步都能点回需要的基础概念。基础概念卡片也会反过来标出它在 Quark 和 Ha et al. 的哪一步用到。", "foundations_lede": "8 个模块按学习顺序排列。每个概念都有：一句话要点、直觉解释、类比、逐项拆解的公式、带数字的例子、易错点、它在两篇锚点论文中的具体位置、学习资源和自测题。标签“Quark 用到 / Ha 用到”表示该概念是否直接出现在对应论文中。", "guided_lede": "把两篇论文按流水线拆成若干步。每一步写清楚：做什么（输入 → 输出）、白话解释、类比、论文公式逐项拆解、具体超参、为什么这样设计、容易误解的地方和自测题，并链接到需要的基础概念。点击流程图的方框可以直接跳到对应步骤。内容写完后由另一个 agent 对照论文原文逐条核查，并修正了发现的错误。", "advanced_lede": "16 个进阶专题，每个包含核心思想、关键公式、演进时间线、按优先级排序的奠基论文（附 Semantic Scholar / OpenAlex 引用数）、与两篇锚点论文的关系、争论与开放问题。", "classics_lede": "按 6 个主题收录 2025 年及以前发表的高影响论文。入选标准是引用数高或改变了领域走向，并且偏重两篇锚点论文所依赖的工作。每篇都由另一个 agent 复核了是否存在、年份与会议，以及引用数（来源为 Semantic Scholar 或 OpenAlex，2026 年 9 月）。上图横轴 2010 年以前做了压缩。", "survey_lede": "以两篇锚点论文为坐标原点，覆盖 10 个子方向、350 余条论文 / 产品 / 标准，以及全栈地图、范式对比、趋势与挑战。", "ideas_lede": "这些方向来自 5 个独立视角（失败模式、基础模型、系统、问题重构/评测、跨领域）共 30 个 idea，聚类为 18 个方向。每个方向先由一个 agent 专门找“已经被做过”的证据，再由一个模拟 AC 的 agent 重新定位、打分、设计实验。结论：没有一个方向是完全空白的，18 个全部判定为“部分已被做，需要重新定位”。综合分 5 分约等于一篇普通录用论文的水平。列表按综合分排序，点开可看核心论点、查新找到的撞车工作、两周验证实验和止损标准。", "method_zh": "本报告由多 agent 工作流生成，所有 agent 都能联网检索（arXiv API、Semantic Scholar、OpenAlex、网页搜索）。\n\n调研部分：先精读两篇锚点论文（含附录），并对照原文逐条核查未言明的问题，例如 Ha et al. 的运行时间没算立体深度估计，TSDF 消融几乎没有增益。然后分 10 个子方向检索，每个方向 25–45 篇带真实链接的工作，分为里程碑 / 重要 / 相关三档，再由一个综合 agent 写出全景图、范式对比、趋势、重大挑战和阅读清单。\n\n研究方向部分：5 个视角各自提出 idea，聚类为 18 个方向。每个方向先做对抗式查新（抽查引用是否真实存在，至少 10 组检索），再做模拟 AC 评审。\n\n使用说明：这些内容由 AI agent 检索和撰写，可能有遗漏、过时或数字不准，2026 年 7–9 月的新论文覆盖尤其有限。引用或投稿前请务必打开原文核实，尤其是 2026 年的 arXiv 编号、性能数字和引用数。评分只用于比较方向之间的相对强弱，不代表真实的录用概率。\n\n入门学习部分：先固定一份课程骨架（8 个模块、40 个概念、16 个进阶专题），所有内容都用同一套 ID 互相链接。基础知识每个模块由一个 agent 撰写，再由技术编辑 agent 核查公式、数值例子、链接以及与两篇论文的对应关系，共修正 145 处。进阶专题同样经过撰写与复核，修正 95 处。经典论文由 6 个主题检索 agent 汇总并去重，再分批逐篇复核：保留 152 篇，更正 115 篇，剔除 0 篇。精读导读共 26 步，由对抗式核查 agent 对照论文原文修正 70 处。术语表 195 条。", "learn_method_zh": "入门学习部分：先固定一份课程骨架（8 个模块、{concepts} 个概念、{advanced} 个进阶专题），所有内容都用同一套 ID 互相链接。基础知识每个模块由一个 agent 撰写，再由技术编辑 agent 核查公式、数值例子、链接以及与两篇论文的对应关系，共修正 {foundation_fixes} 处。进阶专题同样经过撰写与复核，修正 {advanced_fixes} 处。经典论文由 6 个主题检索 agent 汇总并去重，再分批逐篇复核：保留 {classics} 篇，更正 {classics_corrected} 篇，剔除 {classics_removed} 篇。精读导读共 {steps} 步，由对抗式核查 agent 对照论文原文修正 {guide_fixes} 处。术语表 {glossary} 条。"}, "xref": {"concepts": {"f-linalg": "线性代数、齐次坐标与刚体变换", "f-optim": "优化、鲁棒估计与梯度下降", "f-prob": "概率、加权平均与递归滤波", "f-image": "数字图像：颜色、采样、插值与金字塔", "g-pinhole": "针孔相机模型：内参、外参、投影与反投影", "g-epipolar": "对极几何、三角化与单应", "g-depth": "深度、视差与逆深度采样", "g-sfm": "运动恢复结构（SfM）与光束法平差", "g-rig": "多相机阵列：标定、同步与卷帘快门", "d-stereo": "双目立体匹配：从 SGM 到 RAFT-Stereo", "d-mvs": "多视角立体（MVS）与平面扫描", "d-mono": "单目与视频深度估计", "d-flow": "光流、场景流与图像 warping", "d-tsdf": "截断符号距离场（TSDF）与深度融合", "d-sensors": "深度传感器与噪声特性", "r-raster": "光栅化、z-buffer 与点溅射（splatting）", "r-alpha": "Alpha 合成与 over 算子", "r-volume": "体渲染方程与离散化", "r-raymarch": "光线步进、球面追踪与隐式表面求交", "r-appearance": "反射模型、视角相关外观与光照", "r-reps": "三维表示总览：点、网格、体素、隐式场、高斯", "i-lightfield": "全光函数、光场与 Lumigraph", "i-blending": "视角相关纹理映射与混合权重（ULR）", "i-warping": "基于深度的渲染：前向/后向 warping、空洞与飞点", "i-layered": "分层表示：MPI、LDI 与分层深度图（LDM）", "i-psv": "平面扫描体与学习式视图合成", "l-cnn": "卷积网络、残差块与 U-Net", "l-attention": "注意力机制与 Transformer", "l-encoding": "位置编码、傅里叶特征与射线编码", "l-loss": "损失函数与训练实践", "l-iterative": "学习式迭代细化与展开优化", "l-diffusion": "扩散模型入门", "n-nerf": "神经辐射场（NeRF）", "n-3dgs": "3D Gaussian Splatting（3D 高斯溅射）", "n-generalizable": "可泛化 / 前馈式新视角合成", "n-dynamic": "动态场景与 4D 表示", "v-temporal": "时间一致性、闪烁与时域滤波", "v-metrics": "图像与视频质量指标", "v-codec": "视频编码、传输与延迟预算", "v-perception": "立体视觉感知与 3D 显示"}, "adv": {"a-learned-stereo": "从深度立体匹配到立体基础模型", "a-learned-mvs": "学习式多视角立体与代价体", "a-geo-fm": "前馈三维几何基础模型", "a-nerf-fast": "NeRF 的加速与抗锯齿", "a-3dgs-ext": "3D Gaussian Splatting 的扩展", "a-layered-nvs": "学习式分层表示：从 Stereo Magnification 到 Quark", "a-generalizable-ibr": "可泛化 NeRF 与学习式 IBR", "a-ff-3dgs": "前馈 3DGS 与大重建模型", "a-geometry-free": "无几何 Transformer 渲染器", "a-dynamic-4d": "动态 NeRF、4D 高斯与流式重建", "a-human-capture": "人体表演捕捉与数字人", "a-diffusion-3d": "扩散模型与三维/新视角生成先验", "a-temporal-video": "视频时间一致性方法", "a-telepresence-sys": "三维临场系统设计", "a-compression": "体积视频与神经表示的压缩传输", "a-diff-render": "可微渲染与逆渲染"}}, "site": {"brand": "3D 临场研究图谱", "current": "areas", "pages": [{"key": "home", "file": "index.html", "label": "概览", "group": null}, {"key": "roadmap", "file": "roadmap.html", "label": "学习路线", "group": "入门学习"}, {"key": "foundations", "file": "foundations.html", "label": "基础知识", "group": "入门学习"}, {"key": "guided", "file": "guided.html", "label": "精读导读", "group": "入门学习"}, {"key": "advanced", "file": "advanced.html", "label": "进阶专题", "group": "入门学习"}, {"key": "classics", "file": "classics.html", "label": "经典论文", "group": "入门学习"}, {"key": "glossary", "file": "glossary.html", "label": "术语表", "group": "入门学习"}, {"key": "anchors", "file": "anchors.html", "label": "锚点论文", "group": "领域调研"}, {"key": "landscape", "file": "landscape.html", "label": "领域全景", "group": "领域调研"}, {"key": "areas", "file": "areas.html", "label": "分方向与论文库", "group": "领域调研"}, {"key": "ideas", "file": "ideas.html", "label": "研究机会", "group": "研究"}, {"key": "method", "href": "index.html#method", "label": "方法与说明", "group": "研究", "alias": true}], "sectionPage": {"top": "index.html", "summary": "index.html", "sitemap": "index.html", "method": "index.html", "roadmap": "roadmap.html", "roadmap-resources": "roadmap.html", "foundations": "foundations.html", "guided": "guided.html", "advanced": "advanced.html", "classics": "classics.html", "reading": "classics.html", "glossary": "glossary.html", "anchors": "anchors.html", "map": "landscape.html", "paradigms": "landscape.html", "trends": "landscape.html", "areas": "areas.html", "papers": "areas.html", "ideas": "ideas.html"}, "prefixPage": [["concept-", "foundations.html"], ["module-", "foundations.html"], ["walk-", "guided.html"], ["guide-", "guided.html"], ["adv-", "advanced.html"], ["classic-", "classics.html"], ["stage-", "roadmap.html"], ["area-", "areas.html"], ["idea-", "ideas.html"], ["anchor-", "anchors.html"]]}, "areas": [{"key": "rt-nvs", "area_title_zh": "实时、高分辨率、可泛化新视角合成：Quark 谱系", "overview_zh": "本章讨论 3D telepresence 中最核心的渲染问题。输入是稀疏的多路 RGB 相机（通常 4–16 路），不做逐场景优化（feed-forward、可泛化），要以视频帧率（≥30 fps，即每帧约 33 ms 的重建加渲染预算）输出 1080p 乃至 4K 的新视角图像。这个问题同时受质量、分辨率、延迟、泛化性四个维度约束，几乎所有方法都只能在其中两到三个维度领先。按表示方式，本领域可分为四条技术主线：分层表示（MPI/MSI/LDI/LDM）；基于图像的渲染与 render-and-refine（IBR、泛化 NeRF、前向投影加融合网络）；无几何的 Transformer 渲染器（LVSM 系）；feed-forward 3DGS。另有两条面向落地的系统支线：流式/在线动态合成，以及光场显示渲染。\n\n分层表示谱系始于 Stereo Magnification（2018）提出的 MPI：场景被表示为一组正对相机的 RGBA 平面，重建一次后，渲染只需单应变换加 alpha 合成，天然适合实时显示。LLFF（2019）用 MPI 融合局部光场，所需视角数比 Nyquist 采样少至多 4000 倍。DeepView（2019）把 MPI 推断写成 learned gradient descent，迭代地把渲染误差反馈给网络，这是 Quark 迭代式 render-and-refine 的直接前身。Immersive Light Field Video（2020）把平面换成球壳层，再压缩为少量 RGBA+depth 层网格：用 46 台运动相机采集，用常规视频编码压缩，可在移动 VR 和浏览器中播放，率先打通了采集、压缩、显示的完整链路。MatryODShka（2020）用多球面图像实现 360° 立体视频的实时 6DoF。3D Photography（2020）用带连接关系的 LDI 补全遮挡区域。NeX（2021）在 MPI 上用神经基函数建模视角相关效果，渲染速度比当时的 SOTA 快 1000 倍以上。SIMPLI（2023）把前平行平面变形为可变形层。分层表示的根本局限有两点：平面数随深度复杂度增长，平面扫描体开销大；固定平面也难以表达倾斜表面。\n\n另一条主线是 IBR 与泛化辐射场。FVS（2020）和 SVS（2021）先用 SfM+MVS 构建几何代理，再对重投影特征做循环或卷积聚合与精修，奠定了“几何代理 + 神经精修”的范式。IBRNet（2021）用 ray transformer 跨视角聚合；GPNR（2022）用极线 patch 加 Transformer 直接预测光线颜色。两者质量好，但远非实时：按 Quark 论文的实测，GPNR 约 25 s/帧。ENeRF（2022）用级联代价体预测粗几何，只在表面附近少量采样，比此前的泛化 NeRF 快 60 倍以上，成为动态自由视点视频的通用基线（Quark 实测约 205 ms/帧）。FWD（2022）用显式深度前向投影实现实时，提速 130–1000 倍。GPS-Gaussian（2024）用像素对齐 Gaussian 实现 2K 人体实时合成。锚点论文 Ha et al.（CVPR 2025）属于这一分支，流程分三步：先用像素大小的 3D Gaussian 把 4 个邻近视角前向投影到目标视角；再在目标视角空间用图像域 TSDF 累积经时间滤波的深度；最后由 4 层 U-Net 预测融合权重。全流程约 100 ms（前向投影 10 ms、TSDF 6 ms、TensorRT 融合 23 ms）。它在 DyNeRF 上的 PSNR 为 31.17 dB，高于 ENeRF 的 29.51 dB，并明显抑制了闪烁。2026 年的 3DTV 用 Delaunay 三角选取 3 路输入，在 RTX 4090 上以 40 fps 输出 1024×1024 图像，说明该分支正在向消费级硬件下探。\n\nQuark（SIGGRAPH Asia 2024）把上述两条主线合流。它的表示是分层深度图（LDM），每层带独立深度而非固定平面：初始 24 层（Quark+ 为 32 层），逐步收缩到 6–8 层输出。网络在多尺度 U-Net 式金字塔中执行 5 次 Update & Fuse，把大部分计算放在低分辨率。每次更新中，一个专门的 Transformer 组件在输入图像空间（而非层空间）聚合多视角信息；最终以学习的融合权重对输入视角做 blending 并上采样。结果是：在单张 A100 上，从 8 路输入（支持 4–16 路）完成重建加渲染，达到 1080p、30 fps。在 Real Forward-Facing 数据上，Quark 为 26.03 dB（Quark+ 为 26.53 dB，91.9 ms），高于 GPNR 25.42、ENeRF 23.71、SIMPLI 23.35；单帧仅 32.2 ms，而 ENeRF 为 205 ms、SIMPLI 为 4.4 s、GPNR 为 25 s。在 DL3DV 上，Quark 与逐场景优化的 Zip-NeRF 相当，并超过 3DGS。论文自述的三个局限恰好定义了后续工作的议程：帧间没有时间一致性，导致闪烁；凸组合融合权重难以表达视角相关材质；需要 8–16 个邻近相机覆盖目标视角。\n\n从 2024 年底起，无几何 Transformer 渲染器迅速崛起。LVSM（ICLR 2025 Oral）只用 Plücker 射线嵌入编码相机，完全去掉 3D 归纳偏置。其 decoder-only 版本在 RealEstate10K（256×256）上达 29.67 dB，比 GS-LRM 高 1.6 dB。但它的代价也明显：训练分辨率为 256–512；decoder-only 在 4 视角时约 40 fps，10 视角以上降到约 15 fps；训练需 64 张 A100 跑 3–7 天。后续工作沿三个方向推进。一是去监督：RayZer 用自预测的位姿训练，无需任何 3D 标注。二是长上下文与记忆：LaCT 用大块 test-time training 把非线性状态扩到参数量的 40%，支持百万 token 上下文。三是效率与缩放：Efficient-LVSM 在 512 分辨率把延迟从 109.37 ms 降到 24.78 ms，64 视角下借助 KV-cache 提速 66.7 倍；SVSM 研究缩放律，表明 encoder-decoder 可以达到更优的性能-计算帕累托前沿；LagerNVS 在 RealEstate10K 上达 31.4 dB，并在 H100 上以 512×512、超过 30 fps 渲染；DVSM 把场景隐式存为 KV-cache。值得注意的是，Quark 所在的 Google 团队也转向了这条路线：NSTM（2026）基于 LVSM/LaCT 构建在线时空记忆，摊销延迟 28.1 ms，合成约 37 fps，但主评测分辨率仍是 256×256。\n\nfeed-forward 3DGS 是“重建一次、渲染多次”的中间路线。pixelSplat（2024）从两视角预测 Gaussian；MVSplat 以 22 fps 运行，参数量少 10 倍；GS-LRM 用 0.23 s 完成 2–4 视角重建；Long-LRM 处理 32 张 960×540 图像约需 1 s；DepthSplat 在 0.6 s 内完成 12 视角重建；AnySplat 进一步去掉了对位姿的依赖。随着视角数和分辨率上升，像素对齐 Gaussian 的数量按二次增长，成为瓶颈，近期工作从不同角度绕开它。LVT（SIGGRAPH Asia 2025）用局部视角注意力把复杂度降为线性，在 DL3DV（960×540）上达 27.64 dB，比 Long-LRM 高 3.54 dB。LGTM（2026）用 512×288 个带 8×8 纹理的 Gaussian 输出 4K：像素数增加 64 倍时峰值显存只增加 1.8 倍，A100 上总耗时约 175 ms。SHARP（ICLR 2026）从单张图像在 1 s 内回归 Gaussian。Fuse-and-Refine（NeurIPS 2025）在规范 3D 空间中融合并精修 Gaussian，可用于流式动态场景（H100 上 15 fps、350 ms 延迟）。总体而言，这类方法重建一次约需 0.1–1 s，离“每帧重建、30 Hz 视频”仍差约一个数量级。\n\n在系统与显示一侧，Project Starline（2021）结合多视角采集、实时神经视角合成和高分辨率裸眼 3D 光栅显示，在用户研究中首次超过 2D 视频会议。Tele-Aloha（2024）只用 4 路 RGB 相机，在消费级 GPU 上以 2048×2048、30 fps、低于 150 ms 的延迟驱动裸眼 3D 显示。光场显示每帧至少需要 45 个视角：DirectL 通过子像素复用获得最高 40 倍加速；NVIDIA 把辐射场转为共享的中间扫描平面，单趟合成 45 个视角，512p 下超过 200 fps，比逐视角渲染快 22 倍；Play4D 进一步把流式 4D 重建与光场渲染器集成在一起。截至 2026 年 9 月的格局如下。分层/IBR 类（Quark、Ha et al.、3DTV）仍是仅有的能在约 1024–1080p 分辨率下单 GPU 实时、直接吃视频输入的可泛化方案。Transformer 渲染器在质量和泛化上领先，但分辨率停在 512 左右。feed-forward 3DGS 在 4K 和大场景上有突破，但重建延迟偏高。把三者融合，即分层或多尺度结构、Transformer 聚合与时间记忆的组合，是明显的收敛方向。", "subtopics": [{"name_en": "Layered Scene Representations (MPI/MSI/LDI/LDM)", "name_zh": "分层场景表示（MPI/MSI/LDI/LDM）", "summary_zh": "把场景表示为若干 RGBA（加 depth）层：重建代价集中在前端，渲染只需单应变换或网格光栅化加 alpha 合成，是最早能实时显示的神经表示。演进路线为：MPI（Stereo Magnification）→ 局部光场融合（LLFF）→ learned gradient descent（DeepView）→ 球壳 MSI 与层网格（Immersive LF Video、MatryODShka）→ 带深度的层（LDI、SIMPLI）→ 分层深度图 LDM（Quark）。核心权衡是层数、显存与深度复杂度之间的关系；层网格还可以借助现成的视频编码，适合传输。", "representative_works": ["Stereo Magnification", "DeepView", "Immersive Light Field Video", "NeX", "Quark"]}, {"name_en": "Real-time IBR and Render-and-Refine", "name_zh": "实时 IBR 与 render-and-refine", "summary_zh": "先用几何代理（MVS 深度、代价体、TSDF）把邻近输入视角投影或采样到目标视角，再由神经网络聚合、融合、精修。从 FVS/SVS、IBRNet、GPNR 到 ENeRF、FWD，速度从秒级降到百毫秒级；GPS-Gaussian、Ha et al.、3DTV 进一步做到 2K、时间一致性和消费级 GPU 上 40 fps。该路线天然复用输入像素的高频细节，因此在高分辨率下保真度高。代价是依赖相机覆盖，且逐帧独立处理时容易闪烁。", "representative_works": ["IBRNet", "ENeRF", "FWD", "GPNR", "Ha et al. (Geometry-guided Online 3D Video Synthesis)"]}, {"name_en": "Geometry-free Transformer Renderers", "name_zh": "无几何 Transformer 渲染器（LVSM 系）", "summary_zh": "只用 Plücker 射线等最少的 3D 先验，把 NVS 当作 token 序列建模：LVSM 证明了去掉 NeRF/3DGS/极线归纳偏置后质量可以大幅提升。后续工作分三类：自监督（RayZer）；长上下文与 test-time training（LaCT）；效率、KV-cache 与缩放律（Efficient-LVSM、SVSM、LagerNVS、DVSM）。质量与泛化领先，但注意力开销随 token 数平方增长，实时分辨率目前停在 256–512。", "representative_works": ["LVSM", "RayZer", "LaCT", "Efficient-LVSM", "LagerNVS"]}, {"name_en": "High-resolution Feed-forward 3DGS", "name_zh": "高分辨率 feed-forward 3DGS", "summary_zh": "一次前向预测显式 3D Gaussian，之后可以任意视角高速渲染。发展脉络：从两视角的 pixelSplat/MVSplat 到大模型 GS-LRM/Long-LRM，再到深度先验的 DepthSplat 和无位姿的 AnySplat。当前焦点是打破像素对齐 Gaussian 随分辨率与视角数二次增长的瓶颈：LVT 用局部注意力，tttLRM 用 TTT 线性复杂度，LGTM 用带纹理的 Gaussian 实现 4K，SHARP 做单图秒级重建。重建约 0.1–1 s，适合静态场景或关键帧。", "representative_works": ["pixelSplat", "GS-LRM", "Long-LRM", "LVT", "LGTM"]}, {"name_en": "Streaming and Online Dynamic NVS", "name_zh": "流式/在线动态新视角合成", "summary_zh": "面向 telepresence 的连续视频输入，关注三件事：帧间一致性、记忆（补回被遮挡的区域）和恒定延迟。代表做法有：Fuse-and-Refine 在规范空间做时间融合（15 fps、350 ms）；NSTM 用周期性记忆更新加逐帧应用，实现约 28 ms 摊销延迟；LiveStre4m 用关键帧重建加扩散插帧，并且不需要标定。Ha et al. 用 TSDF 累积几何，也属于这一方向。", "representative_works": ["Online Neural Space Time Memory (NSTM)", "Fuse-and-Refine", "LiveStre4m"]}, {"name_en": "Light-field Display Rendering and Telepresence Systems", "name_zh": "光场显示渲染与 telepresence 系统", "summary_zh": "裸眼 3D、光场显示每帧需要 45 个以上视角，渲染成本成倍增加。系统工作（Project Starline、Tele-Aloha）把实时 NVS 与眼动追踪、裸眼 3D 显示集成；渲染工作（DirectL、NVIDIA 共享扫描平面、Play4D）用子像素复用或共享中间平面把多视角渲染提速 20–40 倍。值得注意的是，MPI 式的平面扫描在这里以“显示友好表示”的身份回归。", "representative_works": ["Project Starline", "Tele-Aloha", "DirectL", "Real-time 3D Visualization of Radiance Fields on Light Field Displays", "Play4D"]}], "timeline": [{"year": 2018, "event_zh": "Stereo Magnification 提出 MPI，分层表示成为可实时渲染的神经新视角合成的起点"}, {"year": 2019, "event_zh": "DeepView 提出 learned gradient descent 迭代估计 MPI（Quark 的前身）；LLFF 用局部光场融合，把所需视角数降低至多 4000 倍"}, {"year": 2020, "event_zh": "Immersive Light Field Video 用 46 相机、球壳 MSI 与层网格，打通采集、压缩、浏览器/移动 VR 播放；FVS 确立“几何代理 + 神经精修”范式；MatryODShka 与 LDI 3D Photography 推广 MSI/LDI"}, {"year": 2021, "event_zh": "IBRNet 开启可泛化 IBR；NeX 让 MPI 渲染提速 1000 倍以上；Project Starline 展示裸眼 3D + 实时神经视角合成的 telepresence 系统"}, {"year": 2022, "event_zh": "ENeRF（快 60 倍以上）、FWD（快 130–1000 倍）、GPNR 使可泛化 NVS 从秒级走向百毫秒级"}, {"year": 2024, "event_zh": "pixelSplat、MVSplat、GS-LRM 开启 feed-forward 3DGS；GPS-Gaussian 与 Tele-Aloha（2048²、30 fps、低于 150 ms）推动人体 telepresence；10 月 LVSM 提出无几何 Transformer 渲染器"}, {"year": 2024, "event_zh": "11 月 Quark 发布（SIGGRAPH Asia 2024）：LDM + 迭代 render-and-refine，在 A100 上首次以 1080p、30 fps 实现高质量可泛化 NVS"}, {"year": 2025, "event_zh": "LVSM 获 ICLR Oral；Ha et al.（CVPR 2025）以 TSDF 全局几何引导实现时间一致的在线 3D 视频（约 100 ms/帧）；RayZer 自监督 NVS；Fuse-and-Refine（NeurIPS）实现流式 feed-forward 3DGS；LVT（SIGGRAPH Asia）把 Quark 的局部视角思想迁移到 Transformer + 3DGS"}, {"year": 2026, "event_zh": "ICLR 2026：LaCT、Efficient-LVSM（512² 下 24.78 ms）、SHARP；CVPR 2026：SVSM 缩放律、LagerNVS（512² 下超过 30 fps）、tttLRM；LGTM 实现 feed-forward 4K；7 月 NSTM（Quark 团队）提出在线时空记忆"}], "trends_zh": ["表示从“显式平面”走向“带深度的层”再走向“潜在 token”：MPI（Stereo Magnification）→ LDI/LDM（Quark）→ 场景 latent 或 KV-cache（LVSM、SVSM、DVSM、LagerNVS），渲染器越来越依赖数据而非手工 3D 结构。", "分辨率与表示规模解耦成为高分辨率的关键手段：Quark 把大部分计算放在低分辨率金字塔层，LGTM 用 512×288 个带纹理的 Gaussian 输出 4K，LVT 用局部注意力把复杂度降为线性，NVIDIA 用共享扫描平面一次合成 45 个显示视角。", "Transformer 渲染器进入“工程化提速”阶段：通过解耦注意力、KV-cache 与 latent 几何，Efficient-LVSM 在 512² 下从 109 ms 降到 25 ms，LagerNVS 在 512² 下超过 30 fps，逐步逼近分层/IBR 方法的实时区间。", "时间维度成为一等公民：Ha et al. 用 TSDF 累积几何，Fuse-and-Refine 在规范空间做时间融合，NSTM 用分钟级在线记忆，LiveStre4m 用关键帧加扩散插帧；逐帧独立合成正在被在线、流式建模取代。", "免标定与自监督：RayZer、AnySplat、LiveStre4m、2Xplat 等从无位姿图像直接重建或合成，降低 telepresence 的部署和维护成本。", "缩放律、合成数据与大算力：SVSM 研究性能-计算帕累托，Google 的 token disentanglement 工作引入扩散生成的合成数据，NSTM 训练用到 64–128 张 H100 与 B200；可泛化 NVS 正在呈现“基础模型”式的发展形态。", "Quark 所在的 Google 团队路线迁移明显：从 Quark 的 LDM + CNN/Transformer 混合，转向 Fuse-and-Refine（3DGS + 稀疏体素 Transformer）、LVT（局部视角 Transformer）、NSTM（LVSM + 记忆），显示工业界在押注“Transformer + 时间记忆”的下一代实时渲染器。"], "open_problems_zh": ["Transformer 渲染器的高分辨率实时化：LVSM 系的 token 数随分辨率平方增长，目前实时结果停在 256–512²（NSTM 为 256²，LagerNVS 为 512²）；要达到 Quark 的 1080p，token 需要增加约 16 倍，需要多尺度 token、局部注意力或“低分辨率 latent + 高分辨率 IBR 细节”的混合设计。", "低延迟与时间一致性的兼顾：Quark 逐帧独立处理会闪烁；Ha et al. 用 TSDF 换来一致性，但约 100 ms/帧；Fuse-and-Refine 有 350 ms 延迟；NSTM 分辨率很低。能否在不超过 33 ms 的预算内兼顾高分辨率与帧间稳定，仍未解决。", "视角相关与非朗伯外观：Quark 的凸组合融合权重只能在输入颜色之间插值，无法表达高光、反射与半透明；NeX 式基函数或神经残差需要在实时预算内重新引入。", "相机覆盖不足与外推：Quark 需要 8–16 个邻近相机覆盖目标视角；消费级 telepresence 往往只有 2–4 路相机，需要生成先验补洞，但必须避免对人脸身份与表情的幻觉，而这在通信场景中是不可接受的。", "评测体系缺口：主流基准（RealEstate10K、DL3DV）多为 256–512 分辨率的静态场景，缺少同时衡量 1080p/4K 质量、端到端（glass-to-glass）延迟、时间稳定性（如 TCC）与主观 QoE 的统一基准。", "表示的可传输性与码率控制：层网格可以直接复用视频编码（Immersive LF Video），而 Gaussian 与 latent token 缺乏标准化压缩、差错恢复与码率自适应，端侧重建还是云端渲染的划分也没有定论。", "算力下探：绝大多数结果基于 A100/H100（Quark、NSTM、LagerNVS、LGTM），需要在消费级 GPU、移动 SoC 与头显上实现同等分辨率与帧率（3DTV 在 RTX 4090 上 40 fps 是少数例外）。", "多视角显示的成本倍增：光场、裸眼 3D 显示每帧需要 45 个以上视角，如何让神经渲染器原生、一次性输出多视角或分层中间表示（而非逐视角渲染），仍是开放问题。"], "relation_to_anchors_zh": "本章以 Quark 为核心锚点。Quark 位于一条连续的 Google 技术谱系的末端：Stereo Magnification（MPI）→ DeepView（learned gradient descent，Flynn 为第一作者）→ Immersive Light Field Video（球壳 MSI 与层网格，Broxton、Overbeck、DuVall 等人参与）→ Quark。它的迭代式 Update & Fuse 是 DeepView“学习的梯度下降”在多尺度、Transformer 聚合下的实时化版本；它的 LDM 则吸收了 LDI“每层带深度”的思想，用 6–8 个带深度的层替代上百个固定平面，这是它能在 A100 上以 1080p、30 fps 运行的关键。在方法谱系上，Quark 同时继承了 IBR 一脉：最终输出是对输入视角的学习式 blending，因此保留了输入像素的高频细节，这也是它在 RFF 上以 32.2 ms 超过 GPNR（25 s）和 ENeRF（205 ms）的原因。\n\n第二个锚点 Ha et al.（KAIST + Meta，CVPR 2025）属于 IBR/前向投影融合分支，是 FWD、ENeRF、IBRNet 路线的延伸。它用像素级 Gaussian 前向投影 K=4 个视角，用图像域 TSDF 累积时间滤波后的深度，再做几何引导的 U-Net 融合，约 100 ms/帧，DyNeRF 上 31.17 dB 对 ENeRF 29.51 dB。两者的关系是互补的：Quark 追求单帧质量、分辨率与跨场景泛化，但自述“没有时间一致性、会闪烁”；Ha et al. 恰好以全局几何累积换取多视角与时间一致性，代价是延迟约为 Quark 的 3 倍，且测试分辨率在 1352×1014 以下。值得注意的是，Ha et al. 并未与 Quark 对比。两者都采用“几何代理 + 学习式融合”的共同骨架，区别只在于几何是逐帧迭代估计的 LDM，还是跨帧累积的 TSDF。\n\n从 2025–2026 年的后续工作看，引用 Quark 的论文主要沿两条路线回应它的局限。一条是 Quark 团队自己的转向：Fuse-and-Refine 在规范 3D 空间做时间融合、支持流式；LVT 把“只看局部邻近视角”的思想迁移到线性复杂度的 Transformer + 3DGS；NSTM 基于 LVSM/LaCT 引入分钟级在线记忆，直接解决时间一致性与遮挡记忆问题。另一条是外部的 feed-forward 3DGS 与 Transformer 渲染器（AnySplat、tttLRM、MVP、LiveStre4m、2Xplat 等），在泛化与免标定上推进，但在“1080p、30 fps、视频输入”这一 telepresence 硬指标上尚未超越 Quark。一个自然的研究方向是结合 Quark 与 Ha et al.：在 Quark 的多尺度 LDM 渲染中，注入 Ha et al. 式的 TSDF 全局几何或 NSTM 式的时序记忆，同时保留 IBR 融合的高频细节；这样的方法有望同时满足高分辨率、实时与时间一致性这三个 telepresence 的核心要求。"}, {"key": "ff-nvs", "area_title_zh": "前馈式 / 可泛化 3D Gaussian 与动态新视角合成（含实时人体方法）", "overview_zh": "这一章讨论的核心问题是：能否不做逐场景优化，只用一次（或少数几次）网络前向，就从稀疏相机把场景「重建 + 渲染」出来。对 3D telepresence 来说这是硬约束。NeRF 和 3DGS 的逐场景优化要分钟到小时，远程通信却要求每帧几十毫秒内完成采集、重建、传输和显示。所以本领域的进展一直围绕四个轴展开：延迟、输出分辨率、相机数量与标定要求、跨帧时序一致性。这四者至今没有一种方法能同时做到最好。\n\n第一阶段（2020–2022）是「图像条件化辐射场 + 基于图像的渲染（IBR）」。pixelNeRF 用 CNN 特征条件化 NeRF，首次实现跨场景前馈新视角合成。IBRNet 在渲染时直接从邻近源视图取色，由 ray transformer 学习融合，把经典 IBR 思想带进了神经渲染。MVSNeRF 和 ENeRF 引入代价体估计粗几何，ENeRF 只在表面附近采样，比此前的通用辐射场快 60 倍以上，第一次让可交互的自由视点视频成为可能。它也是两篇锚点论文共同的基线。但体渲染的逐像素采样始终是瓶颈。Quark（SIGGRAPH Asia 2024）把这条「几何引导 IBR」路线推到了顶点：用多尺度迭代 render-and-refine 预测分层深度图（LDM）和混合权重，8 张输入图时可在 A100 上以 1080p、30 fps 完成重建和渲染（约 32 ms）。\n\n第二阶段（2023 末–2024）由 3DGS 的光栅化触发，「像素对齐高斯」迅速成为默认表示。pixelSplat 用概率深度采样加重参数化，从图像对回归高斯，获 CVPR 2024 最佳论文提名。MVSplat 引入平面扫描代价体，推理约 22 fps，参数量只有 pixelSplat 的 1/10。GS-LRM 把 LRM 的缩放范式搬到逐像素高斯上，2–4 张图只需 0.23 s。以人为中心的方向上，GPS-Gaussian 在相邻相机对上做立体深度并回归高斯参数图，实现 2K 实时人体 NVS。同组的 Tele-Aloha 做成了完整系统：4 台 RGB 相机、1 块消费级 GPU，2048×2048、30 fps、端到端延迟低于 150 ms。这是 telepresence 意义上的第一个里程碑。\n\n第三阶段（2024 末–2025）是「规模化」和「去标定」。LVSM 彻底去掉显式 3D 表示，用 Transformer 直接生成目标视图，PSNR 比先前 SOTA 高 1.5–3.5 dB。Long-LRM 能在约 1 s 内处理 32 张 960×540 图像。DepthSplat 把单目深度基础模型接入多视图代价体。免位姿方向从 NoPoSplat（只用光度损失）发展到 VGGT（1 s 内推断相机、深度和点图，CVPR 2025 最佳论文），再到 AnySplat、YoNoSplat（GH200 上 100 视图 2.69 s）和 Depth Anything 3（位姿精度比 VGGT 高 44.3%）。相机标定从前提条件变成了网络的输出。\n\n第四阶段（2025–2026）把时间维度纳入前馈框架。单目方向有 BTimer（150 ms 重建 bullet-time 场景）、STORM（速度高斯）、4DGT、DGS-LRM 和 MoVieS（约 1 s）。多视图流式方向有 IGS（每帧约 2 s）、Google 的 Fuse-and-Refine（H100 上 15 fps、延迟 350 ms）、两个同名的 StreamSplat（一个做在线动态重建，一个用体素因果缓存）、LiveStre4m（2 路免位姿、1024×768 每帧 70 ms）和 NoPo4D（免位姿多视图 4D）。记忆型方法如 tttLRM 和 NSTM 把历史观测压缩进 TTT fast weights。NSTM 能以 30 fps 合成，但分辨率只有 256–512 px。人体方向，Forge4D 用可学习状态 token 维持时序，HiReFF 用 0.5K 骨干输出 2K。Tele360（2026 年 9 月）用 4–6 台未标定 4K 相机，6 视图 2K 每帧只需 35.4 ms（RTX 5090），Gaussian 图经 H.265 和 WebRTC 以约 100 Mbit/s 传输，在 DNA-Rendering 上 PSNR 32.15，GPS-Gaussian 只有 22.40。\n\n截至 2026 年 9 月，本领域呈三角格局。第一，高分辨率与实时已基本解决：Quark 1080p 约 32 ms，3DTV 1K 约 24.5 ms，Tele360 2K 约 35 ms，LGTM 首次实现前馈 4K。第二，免标定已普及：VGGT/DA3 骨干和可微位姿层成为标配。第三，时序一致性仍是短板：Quark、Tele360 和 3DTV 都明确逐帧独立，或没有评测时序指标。能保证时序的方法要么是手工几何累积（Ha et al. 的目标视图 TSDF，V100 上约 100 ms），要么是学习型记忆但分辨率低（NSTM），要么依赖扩散插值、保真度有限（LiveStre4m、Diffuman4D）。把 Quark 级的分辨率和速度、Ha et al. 级的几何一致性，与 2026 年兴起的学习型时空记忆结合起来，是这一方向最明确的下一步。", "subtopics": [{"name_en": "Generalizable Radiance Fields & Real-time Geometry-guided IBR", "name_zh": "可泛化辐射场与实时几何引导 IBR", "summary_zh": "2020–2022 年以图像特征条件化 NeRF（pixelNeRF），或在渲染时从邻近源视图取色（IBRNet），首次实现跨场景前馈 NVS。ENeRF 用代价体粗几何减少采样，实现交互式自由视点视频。Quark 把分层深度图、迭代 render-and-refine 与学习混合权重结合，推到 1080p/30fps。3DTV 等轻量插值网络延续了这条路线。它的共同特点是：几何只作为「代理」，外观直接取自输入像素，速度快、细节真实，但通常逐帧独立，也难以表达视角相关外观。", "representative_works": ["pixelNeRF", "IBRNet", "ENeRF", "Quark", "3DTV"]}, {"name_en": "Pixel-aligned Feed-forward 3DGS", "name_zh": "像素对齐前馈 3DGS", "summary_zh": "每个输入像素沿射线回归一个或多个 3D 高斯，深度由概率采样（pixelSplat）、平面扫描代价体（MVSplat）或单目深度基础模型加代价体（DepthSplat）确定，随后用 3DGS 光栅化实时渲染。这是 2024 年后前馈 NVS 的默认表示。它的问题是重叠视图带来冗余、高斯位置受射线约束、高分辨率下显存爆炸。LGTM 用「更少高斯 + 逐基元纹理」把分辨率推到 4K，是 2026 年的重要进展。", "representative_works": ["pixelSplat", "MVSplat", "DepthSplat", "LGTM"]}, {"name_en": "Large Reconstruction & View-Synthesis Transformers", "name_zh": "大重建模型与视图合成 Transformer", "summary_zh": "LRM 开启了「大 Transformer + 大数据」的缩放范式。GS-LRM 把它扩展到逐像素高斯和场景级输入（0.23 s）。Long-LRM 用 Mamba2 混合结构处理 32 张高分辨率图。LVSM 完全去掉 3D 归纳偏置，直接生成像素，质量最好但没有显式几何。之后的工作集中在效率和长上下文：Efficient-LVSM 用解耦注意力和 KV-cache，LVT 用局部视图注意力摆脱二次复杂度，tttLRM 用 TTT fast weights 做线性复杂度的自回归重建。它们为流式、记忆型的 telepresence 模型提供了骨干。", "representative_works": ["LRM", "GS-LRM", "Long-LRM", "LVSM", "Efficient-LVSM", "LVT", "tttLRM"]}, {"name_en": "Pose-free / Uncalibrated Feed-forward Reconstruction", "name_zh": "免位姿/免标定前馈重建", "summary_zh": "NoPoSplat 以第一个视图的相机坐标系为规范空间，只用光度损失训练就能从无位姿图像回归高斯。VGGT 统一预测相机、深度、点图和轨迹，成为几何基础模型。AnySplat、YoNoSplat 和 Depth Anything 3 在一次前向中同时输出高斯与内外参，并能扩展到上百视图。对 telepresence 而言，这使得「随手摆放、无需标定的相机阵列」成为可能；Tele360、HiReFF、NoPo4D、LiveStre4m 均建立在这一能力之上。", "representative_works": ["NoPoSplat", "VGGT", "AnySplat", "YoNoSplat", "Depth Anything 3"]}, {"name_en": "Human-centric Real-time Generalizable Rendering", "name_zh": "以人为中心的实时可泛化渲染", "summary_zh": "面向远程通信和全息人像，利用人体先验（大规模扫描数据、SMPL-X 模板、前景 mask），在 4–6 台稀疏相机下实时输出 2K–4K 人体新视角。主线是清华刘烨斌组的 GPS-Gaussian、Tele-Aloha、GPS-Gaussian+、HiReFF 和 Tele360，另有 EVA-Gaussian（跨视图注意力）、DUT（4K 纹理空间）、HumanRAM/HumanGS（可驱动）。时序方面有 Forge4D（状态 token）和 Diffuman4D（时空扩散）。2026 年已经做到免标定、2K、35 ms/帧的完整系统，但普遍仍逐帧处理。", "representative_works": ["GPS-Gaussian", "Tele-Aloha", "GPS-Gaussian+", "EVA-Gaussian", "DUT", "HumanRAM", "HumanGS", "Forge4D", "Diffuman4D", "HiReFF", "Tele360"]}, {"name_en": "Feed-forward 4D & Streaming Reconstruction", "name_zh": "前馈 4D 与流式重建", "summary_zh": "把时间纳入前馈框架，大致有三类做法。第一类用单目视频到动态高斯，如 BTimer、4DGT、DGS-LRM、MoVieS、C4G，以及驾驶场景的 STORM。第二类面向多视图视频流的在线重建，如 IGS、Fuse-and-Refine、两个 StreamSplat、LiveStre4m、NoPo4D。第三类是以学习型记忆维持时空一致的 NSTM。时序机制从逐帧独立，演进到速度/形变高斯、体素缓存、状态 token 和 TTT fast weights。这一方向直接对应 Ha et al. 所关注的在线时序一致视频合成。", "representative_works": ["BTimer", "STORM", "Instant Gaussian Stream", "4DGT", "DGS-LRM", "MoVieS", "StreamSplat (ICLR 2026)", "Fuse-and-Refine", "StreamSplat (VACC)", "LiveStre4m", "NoPo4D", "NSTM", "C4G"]}], "timeline": [{"year": 2021, "event_zh": "pixelNeRF 与 IBRNet（CVPR 2021）开启跨场景前馈 NVS：前者条件化 NeRF，后者在渲染时从源视图取色。"}, {"year": 2022, "event_zh": "ENeRF（SIGGRAPH Asia 2022）用代价体几何引导少量采样，比此前通用辐射场快 60 倍以上，首次实现交互式自由视点视频。"}, {"year": 2023, "event_zh": "3DGS 带来实时光栅化；LRM 开启大重建模型缩放范式；12 月 pixelSplat 与 GPS-Gaussian 相继公开，前馈 3DGS 诞生。"}, {"year": 2024, "event_zh": "MVSplat（代价体，22 fps）和 GS-LRM（0.23 s）确立像素对齐高斯的主流地位；Tele-Aloha 用 4 台相机做到 2K、30 fps、低于 150 ms 的 telepresence 系统。"}, {"year": 2024, "event_zh": "10–11 月 LVSM（无 3D 偏置，+1.5–3.5 dB）、Long-LRM（32 视图约 1 s）、NoPoSplat（免位姿）集中发布；Quark 实现 1080p@30fps 的前馈 LDM + IBR（SIGGRAPH Asia 2024）。"}, {"year": 2025, "event_zh": "VGGT 获 CVPR 2025 最佳论文，几何基础模型让标定变成网络输出；DepthSplat、AnySplat、Depth Anything 3 相继出现。"}, {"year": 2025, "event_zh": "前馈 4D 集中爆发：BTimer（150 ms）、STORM、IGS（每帧约 2 s）、4DGT、DGS-LRM、MoVieS；Ha et al.（CVPR 2025）用目标视图 TSDF 实现在线时序一致的 IBR。"}, {"year": 2025, "event_zh": "Google 的 Fuse-and-Refine（NeurIPS 2025，15 fps / 350 ms）与 LVT（SIGGRAPH Asia 2025）标志 Quark 团队转向 Transformer + 3DGS 的流式路线；Forge4D 以状态 token 做 4D 人体。"}, {"year": 2026, "event_zh": "效率与长上下文：Efficient-LVSM（ICLR 2026，推理快 4.4 倍，支持 KV-cache）、tttLRM（CVPR 2026，TTT 线性复杂度）、YoNoSplat（ICLR 2026）、StreamSplat（ICLR 2026，在线动态）。"}, {"year": 2026, "event_zh": "3–5 月 LGTM 首次实现前馈 4K；LiveStre4m 在 2 路免位姿下达到 1024×768、70 ms/帧；NoPo4D 填补多视图、动态、免位姿的空白；3DTV 在 1K 下 24.5 ms。"}, {"year": 2026, "event_zh": "6–9 月 HiReFF（0.5K 骨干输出 2K）、NSTM（Google，TTT 时空记忆，30 FPS）、StreamSplat-VACC（千视图流）先后发布；Tele360 用 4–6 台未标定相机实现 2K、35 ms/帧、可流式的 360° 人体 telepresence。"}], "trends_zh": ["表示在摆动中走向混合。从 NeRF 到像素对齐 3DGS，再到无显式 3D 的 LVSM，如今又回到「少量几何 + 丰富外观」：LGTM 用纹理高斯，LVT 用视角相关颜色与不透明度，Quark 用 LDM 加源图像混合。几何负责结构，图像或纹理负责高频与视角相关细节，这一点正在成为共识。", "免标定已成默认配置。VGGT、Depth Anything 3 一类几何基础模型成为骨干或蒸馏教师，AnySplat、YoNoSplat、NoPo4D、LiveStre4m、HiReFF、Tele360 都在前向中估计位姿，Tele360 还加入可微 LM 层做在线细化。新方法若假设预标定相机阵列，需要给出理由。", "时序机制从手工走向学习型记忆。Ha et al. 的颜色差掩码加 TSDF 代表手工几何累积；2025–2026 年出现了状态 token（Forge4D）、TTT fast weights（tttLRM、NSTM）、体素因果缓存（StreamSplat-VACC）、规范空间融合（Fuse-and-Refine）、速度或形变高斯（STORM、NoPo4D、DGS-LRM）和扩散插值（LiveStre4m）等多种替代。", "「低分辨率几何 + 高分辨率外观」成为实现高分辨率的通用手段：Quark 从 64×36 的 LDM 迭代后上采样到 1080p，Tele-Aloha 先潜空间渲染再以图像混合到 2K，HiReFF 用 0.5K 骨干加 2K side-tuning，LGTM 用逐基元纹理达到 4K。", "Transformer 骨干在追求线性复杂度和缓存复用：Long-LRM 用 Mamba2，LVT 用局部注意力，Efficient-LVSM 用 KV-cache，tttLRM、LaCT、NSTM 用 TTT。目标是在多相机、高分辨率、长时间流下保持实时。", "人体 telepresence 的系统规格趋于收敛：4–6 台相机、2K 及以上、消费级 GPU、每帧 25–40 ms（Tele-Aloha、Tele360、3DTV）。输出端开始考虑传输，Tele360 把 Gaussian 图经 H.265 编码后以约 100 Mbit/s 走 WebRTC，「重建-编码-渲染」开始联合设计。", "数据驱动的规模化延伸到动态领域：4DGT 用真实单目视频训练，DGS-LRM 用带场景流的合成多视图视频，Tele360 用约 3K 个扫描和约 1K 段多视图序列。数据成为前馈 4D 和人体方法的关键壁垒。", "评测协议滞后。多数 2026 年新工作（3DTV、Tele360、NoPo4D 等）只报 PSNR/SSIM/LPIPS，Tele360 和 3DTV 明确未评测时序。像 Ha et al. 那样系统报告 TCC、STED 等时序与多视图一致性指标的工作仍属少数。"], "open_problems_zh": ["三者兼得的问题：目前还没有一种方法能同时做到 1080p–2K 以上、每帧 30 ms 以内、并且有显式时序一致性保证。Quark 和 Tele360 快而清晰但逐帧闪烁；NSTM 有记忆但只有 256–512 px；Ha et al. 时序一致但在 V100 上约 100 ms，且分辨率较低。", "视角相关外观与高光：Quark 的混合权重是输入颜色的凸组合，无法外推高光；Ha et al. 在高光区域因深度不准而失效；Tele360 没有视角相关建模。眼镜、屏幕、皮肤油光等恰恰是人像通信中最显眼的部分，需要把几何时序平滑与逐帧视角残差解耦。", "在线标定与同步漂移：免位姿方法多数仍假设帧同步。Ha et al. 明确指出标定误差会导致模糊。亚帧时间偏移、卷帘快门、相机热漂移的在线估计，以及对应的去同步基准，都还缺失。", "前景分割与人-场景交互：Tele360 承认 mask 不准会引起边界抖动。手持物体、多人遮挡、人与家具交互等真实场景下，基于前景 token 的高效设计会失效，需要能处理人加场景的统一时序模型。", "面向移动观察者与双目的一致性：现有评测多沿固定或平滑轨迹。HMD 或裸眼 3D 显示需要左右眼一致（混合权重不一致会造成双眼竞争）以及头动下的时序稳定，目前没有前馈方法报告立体对一致性或感知闪烁阈值。", "计算与带宽的切分：传 Gaussian 图（Tele360 约 100 Mbit/s）、传语义潜变量由接收端前馈解码（GS-SCNet）、还是传驱动参数（HumanRAM 类）？端到端的码率-质量-延迟联合优化，以及接收端的算力约束，仍没有定论。", "动态多视图训练数据与泛化：高质量同步多视图人体视频稀缺，野外光照变化、自动曝光、宽松衣物和头发的泛化仍很弱。如何利用单目视频、合成数据和生成式先验（Diffuman4D、C4G 的扩散增强）来弥补，是一个开放问题。", "统一的时序评测基准：需要一个同时报告 PSNR/LPIPS、TCC/STED/时序扭曲误差、立体一致性和端到端延迟的公开 telepresence 基准，才能公平比较逐帧方法与记忆方法。"], "relation_to_anchors_zh": "两篇锚点论文都属于本章的「几何引导 IBR」一脉，恰好分别代表了「空间质量与速度」和「时间一致性」这两个互补目标。\n\nQuark（Google，SIGGRAPH Asia 2024）把 IBRNet、ENeRF 以来的可泛化 IBR 路线推到实时 1080p。它的做法是：8 张输入图，在低分辨率（最初 64×36、24 层）上迭代 render-and-refine 分层深度图，每步用 Transformer 聚合多视图，最终以学习到的混合权重从源图像取色。A100 上约 32 ms/帧，1024×768 下 PSNR 26.03，ENeRF 为 23.71。它的三个自述局限，恰好对应本章 2025–2026 年的几条主线：\n- 不做帧间约束导致视频闪烁，对应前馈 4D 与流式记忆方向；\n- 凸组合混合无法表达视角相关效果，对应 LVT、LGTM 等视角相关或纹理化表示；\n- 依赖 8–16 张覆盖充分的已标定输入，对应免位姿方向。\n\n值得注意的是，Quark 团队自己的后续工作清楚地勾出了这条演化轨迹：LVT（SIGGRAPH Asia 2025，Flynn 为通讯作者）转向局部视图 Transformer 加视角相关 3DGS；Fuse-and-Refine（NeurIPS 2025）引入历史帧，在 H100 上流式运行，15 fps、延迟 350 ms；NSTM（2026）用 TTT 时空记忆实现 30 FPS 的动态 NVS，但分辨率只有 256–512 px。也就是说，Google 这条线已经从「逐帧显式分层」走向「学习型记忆」，只是还没把 Quark 级的分辨率带过去。\n\nHa et al.（KAIST 与 Meta，CVPR 2025）正面补上了 Quark 缺失的时间维度。它用 K=4 个邻近视图的 RAFT-Stereo 深度，结合颜色差掩码跨时间渐进细化，再在合成视图的图像空间做 TSDF 累积，得到视图与时间都一致的深度，用它引导预训练的混合网络。V100 上约 100 ms/帧，DyNeRF 上 PSNR 31.17（ENeRF 为 29.51），TCC 0.872。它的对比基线（ENeRF、IBRNet、GPS-Gaussian）正是本章第一类与第五类的代表作。\n\n站在 2026 年 9 月回看，本章给 Ha et al. 带来三点挑战与机会。\n\n挑战在于：\n- 时序机制正被学习型替代品取代，如 Forge4D 的状态 token、两个 StreamSplat 的高斯融合与体素缓存、NSTM 的 fast weights、STORM 和 NoPo4D 的速度高斯。它们既能学习，也更能扛住光照变化；\n- 免标定的多视图 4D 方法（NoPo4D、LiveStre4m、Tele360）削弱了「标定且同步良好的相机」这一前提；\n- 系统规格已被 Tele360（2K、35 ms、可流式）大幅抬高。\n\n机会在于：\n- 几乎所有新方法都没有报告 TCC、STED 等时序指标，Tele360 和 3DTV 更是明确逐帧或未评测时序。Ha et al. 的评测协议和「目标视图空间几何累积」思想仍有独特价值。\n\n一个自然的研究方向是：以 Quark 或 Tele360 式的高分辨率前馈骨干为前端，用 VGGT 或 DA3 类几何模型替代 RAFT-Stereo，把 Ha et al. 的 TSDF 累积换成可学习、带不确定度的目标视图记忆（ConvGRU 或 TTT 状态），并用 MoVieS 或 STORM 式场景流替代颜色差掩码来门控更新。在 2K、30 ms 预算内同时报告画质、时序和立体一致性指标。这样可以把两篇锚点论文各自的优势合为一体，正面填补本章第一个开放问题。"}, {"key": "geo-fm", "area_title_zh": "3D几何基础模型与一致性深度估计：从 DUSt3R/VGGT 到流式4D几何与立体基础模型", "overview_zh": "对3D telepresence来说，几何是把“多路相机输入”变成“任意新视角输出”的核心环节。两篇锚点论文正好代表两种处理几何的方式。Quark（Flynn et al., SIGGRAPH Asia 2024）不显式估计每个输入视角的深度，而是在目标视锥内反复执行 render-and-refine，并用 one-to-many attention 融合8路输入，直接推断一个层数很少（最快模型只有6层）的 layered depth map (LDM)，在单张 A100 上以1080p、30fps 完成重建与渲染。Ha et al.（CVPR 2025）则依赖显式的逐视角深度：先在人工挑选的立体对上运行 RAFT-Stereo，再经过基于帧差掩码的递归时域滤波和 image-based TSDF 融合，得到目标视角深度。这部分深度估计的耗时并不计入论文报告的约100 ms 运行时间。所以，能否实时拿到跨视角一致、时间稳定的度量深度，决定了这两条路线能走多远。2024–2026年间迅速发展的3D几何基础模型（geometry foundation models），要解决的正是这个问题。\n\n基础模型出现之前（2019–2023），深度估计的主流做法是“逐视角或逐对估计，再在外部融合”。MiDaS 用 scale-and-shift-invariant 损失混合多个数据集训练，首次让单目相对深度具备零样本跨数据集泛化能力。Consistent Video Depth Estimation（CVD, SIGGRAPH 2020）在测试时结合光流与几何约束微调单图深度网络，第一次让视频深度在几何上保持一致，代价是每段视频都要长时间优化。RAFT-Stereo 把迭代式 GRU 更新引入立体匹配，此后多年一直是立体深度的默认骨干，Ha et al. 至今仍在使用。DynamicStereo 则最早系统研究立体视频的时间一致性，并发布了 Dynamic Replica 数据集。Depth Anything V1/V2 借助约6200万张无标注真实图像的伪标签和合成数据 teacher，把单目深度推到基础模型级别的泛化水平。Ha et al. 的“RAFT-Stereo + 时域滤波 + TSDF”几何流程，就是这一范式的典型代表。\n\n2024年起出现了 pointmap 回归这一范式转变。DUSt3R 从未标定的图像对直接回归同一坐标系下的点图；MASt3R 在此基础上加入稠密匹配头，但多视角时仍需要全局对齐优化，CUT3R 论文实测 DUSt3R-GA 只有0.76 FPS。Fast3R 和 VGGT 把多视角推理变成单次前向。VGGT 获 CVPR 2025 最佳论文，它交替使用帧内注意力与全局注意力，一次同时输出相机、深度、点图与轨迹，参数约12亿；在 H100 上以518×336输入时，10帧约0.14 s，100帧约3.12 s。此后主要有三条改进路线。第一条是 π3，去掉了参考帧，做到置换等变。第二条是先验注入：Pow3R、MapAnything 和 Pi3X 可以把内参、位姿、深度作为可选输入，因此已标定的相机阵列不再需要被当作“位姿未知”来处理。第三条是更简洁、更易扩展的架构：Depth Anything 3 只用纯 DINO 骨干加 depth-ray 预测目标，相机位姿精度比 VGGT 平均提升44.3%，几何精度提升25.1%；VGGT-Ω（CVPR 2026 Oral）用 register attention 部分替代全局注意力，训练显存约为前代的30%，监督数据扩大15倍，Sintel 上相机估计精度提升77%，并首次证明几何基础模型的质量会随模型和数据规模可预测地提升。在效率上，FastVGGT（token merging，约4倍加速）、VGGT-Prime（mixture-of-heads，约8倍）和 ZipMap（用 test-time training 层实现线性复杂度，单张 H100 上不到10 s 重建700多帧，比 VGGT 快20倍以上）都在削减全局注意力的二次复杂度。\n\n流式几何与4D几何是第二条主线。CUT3R 用持续更新的循环状态在线输出度量点图，在 A100、512×144 下达到16.58 FPS；Spann3R 则用空间记忆实现增量重建。StreamVGGT 把 VGGT 改造成带 KV cache 的因果模型。TTT3R 把状态更新重新解释为 test-time training，用闭式的置信度学习率，在20 FPS、6 GB 显存下把全局位姿精度提升约2倍。LASER 通过分层尺度对齐，无需训练就能把离线模型改成流式（14 FPS）。LingBot-Map 组合 anchor context、位姿参考窗口和轨迹记忆，在518×378分辨率下约20 FPS，可稳定处理超过1万帧。RegVGGT（ECCV 2026）每帧只让不超过1%的 token 写入记忆。动态场景方面，MonST3R 把 pointmap 扩展为逐时刻预测；Any4D 联合预测度量深度、相机和逐像素场景流，还能接入 RGB-D/IMU，误差降低2–3倍，速度快15倍。NoPo4D 和 UniFusion 则开始处理多路视频下的动态重建，以及跨视角、跨时间的深度对齐。需要注意，几乎所有流式模型都假设输入来自“单个移动相机”，而 telepresence 的输入是“N 个固定相机随时间采集”，两者结构不同。\n\n深度与立体基础模型在同期完成了从“准但慢”到“实时”的跨越。FoundationStereo 利用100万对合成数据和经 side-tuning 的 Depth Anything V2 特征实现了强零样本立体匹配，但在 RTX 3090 上处理 Middlebury-Q 需要约496 ms。Fast-FoundationStereo（CVPR 2026）通过蒸馏、分块 NAS 和结构化剪枝，把耗时降到49 ms（3090）/30 ms（4090），TensorRT 下为21 ms。Lite Any Stereo V2 在 H200 和 Orin 上又比它快1.8倍和2.7倍。MonSter 让单目先验与立体代价体双向互补，改善弱纹理和遮挡区域。时间一致性方面，Stereo Any Video 借助冻结的视频深度模型特征和时间凸上采样，消除了视差闪烁。单目路线上，Video Depth Anything 可以处理数分钟的长视频，oVDA 在 A100 上达到42 FPS，FlashDepth 能以24 FPS 流式输出2044×1148的深度，DyFN 只微调约2%参数的特征归一化模块就能抑制尺度漂移。Pixel-Perfect 系列专门解决飞点（flying pixels）问题，而这正是 Ha et al. 用逐像素不透明高斯做 splat 时最怕的误差。\n\n相机阵列、免标定与非同步采集是第三条线。Rig3R 把相机 ID、时间和 rig 位姿作为可选条件输入，缺失时能自行“发现”rig 结构，mAA 提升17–45%。X-Lens 用可学习的标定 token 处理鱼眼与针孔混合的异构阵列，度量深度可达41 FPS。VisualSync 利用运动点跨视角的极线约束，把非同步视频对齐到中位误差不超过50 ms。面向 telepresence 的系统已经开始直接吸收几何基础模型：Tele360（2026）通过 teacher-student 蒸馏继承大型视觉几何模型的多视角先验，在单张消费级 GPU 上以超过25 FPS 实现无需位姿的2K人体直播；LiveStre4m 在1024×768下每帧约70 ms，实现无需位姿的直播式 NVS；Z3D（ECCV 2026）则证明 VGGT 的内部表征可以用来合成未观测视角的深度。\n\n截至2026年9月的现状可以概括如下。在离线或准实时场景中，DA3、VGGT-Ω、MapAnything、π3 已大体取代“COLMAP + MVS”，成为默认的几何前端，E3D-Bench 等基准也在推动评测标准化。但 telepresence 要求1080p以上分辨率、每帧几何预算约10–30 ms，并且在视角和时间两个维度上都保持一致。在这些条件下，通用多视角基础模型输入分辨率只有约518像素，10个视角需要约0.14 s（H100），逐时刻推理还会闪烁，仍然不可用。目前真正可部署的方案，一是“实时立体基础模型（约20–50 ms/对）+ 显式融合”，二是面向特定场景蒸馏出的小模型（Tele360）。还没有一个模型面向固定、已标定的相机阵列，带时间记忆，并能直接输出目标视角深度；几何基础模型与实时 IBR/NVS 之间的这块空白仍未填补。", "subtopics": [{"name_en": "Feed-forward Multi-view Geometry Foundation Models", "name_zh": "前馈式多视角几何基础模型（pointmap / ray-map 路线）", "summary_zh": "这一路线从 DUSt3R 的成对 pointmap 回归出发，经 Fast3R 和 VGGT 发展为单次前向处理任意数量视角，同时输出相机、深度、点图与轨迹；之后又出现了去参考帧（π3）、可注入先验（Pow3R、MapAnything、Pi3X）、极简可扩展（Depth Anything 3、VGGT-Ω）等方向。当前焦点有三个：用 token 合并、head 路由、register attention 和 TTT 线性层降低全局注意力的二次成本；验证 scaling law；以及用基础模型的隐表征做新视角深度合成（Z3D）。", "representative_works": ["DUSt3R", "VGGT", "MapAnything", "Depth Anything 3", "VGGT-Ω", "π3"]}, {"name_en": "Streaming & Online Geometry with Memory", "name_zh": "带记忆的流式/在线几何重建", "summary_zh": "这一方向用循环状态（CUT3R）、空间记忆（Spann3R）、因果注意力加 KV cache（StreamVGGT）、test-time training 式状态更新（TTT3R、ZipMap）以及有界记忆管理（LingBot-Map、RegVGGT）取代全局优化，在单个移动相机的视频流上逐帧输出一致的度量几何。典型速度是在约518像素分辨率下14–20 FPS，可处理上万帧。它们是替代 Ha et al. 手工时域滤波的最直接候选，但目前都不是为“多路固定相机随时间采集”的输入设计的。", "representative_works": ["CUT3R", "TTT3R", "StreamVGGT", "LingBot-Map", "ZipMap", "RegVGGT"]}, {"name_en": "Dynamic 4D Geometry", "name_zh": "动态场景 / 4D 几何", "summary_zh": "这一方向把 pointmap 扩展到时间维度：MonST3R 逐时刻预测 pointmap；Any4D 联合预测度量深度、相机与逐像素场景流，并支持 RGB-D/IMU 输入；NoPo4D 和 UniFusion 开始处理多路同步视频下的动态重建与跨视角、跨时间深度对齐。对 telepresence 来说，这些工作提供了在运动区域内做时间融合所需的运动信息，而 Ha et al. 的 TSDF 滤波在运动区域基本不做时间平滑。", "representative_works": ["MonST3R", "Any4D", "NoPo4D", "UniFusion"]}, {"name_en": "Monocular & Video Depth Foundation Models", "name_zh": "单目与视频深度基础模型（时间一致性）", "summary_zh": "这条线从 MiDaS 的尺度-平移不变训练和 CVD 的测试时优化出发，经 Depth Anything V2、MoGe-2 发展到具备强泛化和度量尺度的单目几何，再到 Video Depth Anything、FlashDepth、DyFN 等在线、无闪烁的视频深度，以及针对边缘飞点的 Pixel-Perfect 系列。这些模型可以作为立体或多视角方法的先验，也可以为稀疏相机阵列补齐无重叠区域的几何。", "representative_works": ["MiDaS", "Consistent Video Depth Estimation", "Depth Anything V2", "Video Depth Anything", "FlashDepth", "DyFN"]}, {"name_en": "Stereo & MVS Foundation Models", "name_zh": "立体匹配与多视角立体（MVS）基础模型", "summary_zh": "这一方向从 RAFT-Stereo 的迭代立体匹配出发，演进到 FoundationStereo 的零样本泛化，再经蒸馏、NAS 和剪枝得到实时版本（Fast-FoundationStereo，TensorRT 下21 ms；Lite Any Stereo V2）。单目先验融合（MonSter）改善了病态区域，视频立体（DynamicStereo、Stereo Any Video）解决了时间闪烁，MVSAnywhere 则提供零样本的已标定多视角深度。在固定、已标定的 telepresence 阵列中，这仍然是最容易直接落地的几何来源。", "representative_works": ["RAFT-Stereo", "FoundationStereo", "Fast-FoundationStereo", "Stereo Any Video", "MonSter"]}, {"name_en": "Rig-aware, Calibration-free & Unsynchronized Multi-camera", "name_zh": "相机阵列感知、免标定与非同步多相机", "summary_zh": "这一方向研究如何利用或推断相机阵列结构：Rig3R 以 rig 元数据为条件并能发现 rig 结构，X-Lens 处理异构镜头阵列；如何在没有硬件同步时估计时间偏移（VisualSync）；以及如何把几何基础模型蒸馏进无需位姿的实时 telepresence/NVS 系统（Tele360、LiveStre4m）。它直接关系到两篇锚点论文共同的“已标定、严格同步的阵列”这一假设能否被放宽。", "representative_works": ["Rig3R", "X-Lens", "VisualSync", "Tele360", "LiveStre4m"]}], "timeline": [{"year": 2019, "event_zh": "MiDaS 提出尺度-平移不变损失并混合多数据集训练，首次实现零样本单目相对深度，是深度基础模型的起点"}, {"year": 2020, "event_zh": "Consistent Video Depth Estimation（SIGGRAPH 2020）用测试时优化得到几何一致、无闪烁的视频深度，确立视频深度的时间一致性问题"}, {"year": 2021, "event_zh": "RAFT-Stereo 把迭代 GRU 细化引入立体匹配，成为此后数年的立体深度标准骨干（Ha et al. 至今仍在使用）"}, {"year": 2023, "event_zh": "DynamicStereo 与 Dynamic Replica 数据集发布，立体视频时间一致性开始被系统研究"}, {"year": 2024, "event_zh": "DUSt3R（CVPR 2024）提出免标定的 pointmap 回归范式；MASt3R（ECCV 2024）加入稠密匹配；Depth Anything V2（NeurIPS 2024）成为深度栈的公共底座"}, {"year": 2025, "event_zh": "VGGT 获 CVPR 2025 最佳论文，一次前向输出相机、深度、点图与轨迹；同年 CUT3R（持久状态流式重建）、FoundationStereo（零样本立体）、Fast3R 发表"}, {"year": 2025, "event_zh": "Video Depth Anything 与 FlashDepth（2K、24 FPS）把时间一致深度推进到长视频与实时流式"}, {"year": 2025, "event_zh": "π3（无参考帧）、StreamVGGT（因果 KV cache）、MapAnything（先验注入、12+ 任务）、TTT3R（test-time training 式状态更新，20 FPS）相继出现"}, {"year": 2025, "event_zh": "Depth Anything 3（11月）以纯 Transformer 加 depth-ray 目标超越 VGGT；Any4D 与 Fast-FoundationStereo（12月）分别推进前馈 4D 几何与实时零样本立体（TensorRT 下 21 ms）"}, {"year": 2026, "event_zh": "ZipMap（3月）用 TTT 层实现线性时间重建；LingBot-Map（4月）以约 20 FPS 稳定处理万帧长序列；LiveStre4m 实现无需位姿的直播式 NVS"}, {"year": 2026, "event_zh": "VGGT-Ω（5月，CVPR 2026 Oral）验证几何基础模型的 scaling 规律；NoPo4D 从无位姿多路视频前馈重建动态高斯"}, {"year": 2026, "event_zh": "Lite Any Stereo V2（6月）进一步加速零样本立体；X-Lens（7月）以 41 FPS 在异构相机阵列上实现度量深度"}, {"year": 2026, "event_zh": "9月：Tele360 把视觉几何基础模型蒸馏进超过 25 FPS 的 2K 人体 telepresence 系统；Z3D（ECCV 2026）实现基于基础模型表征的新视角深度合成；RegVGGT（ECCV 2026）与 VGGT-Prime（8×）继续压缩记忆与计算"}], "trends_zh": ["从成对到全局，再到可注入先验的通用模型：DUSt3R/MASt3R（成对加全局对齐）→ Fast3R/VGGT（单次前向多视角）→ Pow3R、MapAnything、Pi3X、G-CUT3R（内参、位姿、深度可作为可选输入）。对已标定的 telepresence 阵列来说，把标定当作输入比重新估计位姿更准，也能保证度量尺度。", "极简化与规模化：Depth Anything 3 证明纯 DINO 骨干加单一 depth-ray 目标就够用；VGGT-Ω 用 register attention 把训练显存降到约 30%、数据扩大 15 倍，并验证了可预测的 scaling 规律。几何基础模型正在走 LLM 式的扩数据、扩模型路线。", "流式与有界记忆取代全局优化：CUT3R → StreamVGGT/TTT3R/LASER → LingBot-Map/ZipMap/RegVGGT，在约 518 像素下已达到 14–20 FPS，可处理上万帧。研究重点从能否在线转向记忆更新规则（置信度门控、TTT）和记忆预算（每帧只有约 1% 的 token 写入）。", "针对二次复杂度的系统级加速：token 合并（FastVGGT，约 4×）、head 级路由（VGGT-Prime，8×）、线性 TTT 层（ZipMap，比 VGGT 快 20× 以上）、高分辨率双分支（HD-VGGT）。这些方法可以叠加，是把基础模型压进实时预算的主要手段。", "立体基础模型在一年内从准但慢走到实时：FoundationStereo 约 496 ms → Fast-FoundationStereo 49 ms（3090）/21 ms（TensorRT）→ Lite Any Stereo V2 再快 1.8–2.7×。单目先验融合（MonSter）和视频立体（Stereo Any Video、PPMStereo）分别解决病态区域和时间闪烁。", "时间一致性从显式融合转向隐式记忆或归一化：Video Depth Anything/oVDA（缓存隐特征，A100 上 42 FPS）、FlashDepth（循环对齐，2K 24 FPS）、DyFN（只调约 2% 参数的特征归一化）都不依赖 TSDF 一类的显式融合，就能得到稳定深度。", "几何与运动联合建模：MonST3R → Any4D（深度加场景流，快 15×）、VGGT4D/PAGE-4D 等从注意力中挖掘动态线索；多路同步视频的动态重建开始出现（NoPo4D、UniFusion），但大多仍是离线或基于窗口的处理。", "蒸馏式落地：用大型几何基础模型做 teacher，训练面向特定任务的实时 student（Tele360 超过 25 FPS 的 2K 人体直播、HiReFF、Fast-FoundationStereo、LAS2），成为几何基础模型进入 telepresence 和机器人产品的主流路径。"], "open_problems_zh": ["缺少面向“N 个固定、已标定、同步、朝内相机 × 时间”的流式几何基础模型：多视角模型（VGGT、DA3、MapAnything）逐时刻推理会闪烁；流式模型（CUT3R、StreamVGGT、LingBot-Map）假设单个移动相机；Rig3R、X-Lens 面向朝外的驾驶或环视阵列。需要一个以标定为条件、按相机维护 KV 记忆、视角与时间因果的 Transformer，同时替代 RAFT-Stereo 和手工 TSDF 时域滤波。", "延迟与分辨率之间的矛盾：通用几何基础模型输入约 518 像素，10 视角需约 0.14 s（H100）。而 Quark 在 A100 上以 1080p 完成整帧重建与渲染也只需约 33 ms，Ha et al. 的渲染部分为 39–81 ms，几何预算只剩约 10 ms。如何利用固定阵列中静态背景 token 可跨帧复用这一特点，做变化感知的稀疏 token 更新并蒸馏出阵列专用的小模型，仍未解决。", "实时的目标视角深度或几何查询：Ha et al. 靠 TSDF raymarching 获得目标视角深度，Quark 在目标视锥内迭代推断 LDM；Z3D 用扩散模型从 VGGT 表征合成新视角深度，速度太慢。在缓存的基础模型 token 或 ZipMap/CUT3R 式场景状态上，设计毫秒级的前馈 ray-map 查询头，是一个明确的研究方向。", "缺少评测视角×时间联合一致性的基准与指标：E3D-Bench 等只评单帧或单相机视频；Ha et al. 的消融显示 TSDF 引导几乎不改变 PSNR（31.16→31.17）。需要面向 telepresence 的长序列多视角数据集，以及深度边缘抖动、遮挡暴露区域稳定性、感知闪烁等指标。", "非朗伯、透明与细结构（头发、手指）：DKT、SeeClear、OptiGeo、Stereo Anywhere 等都是单目或单对方法，没有考虑跨视角和时间；飞点（Pixel-Perfect 仅针对单视角或视频）会直接破坏像素级 splat。还需要不确定性感知的几何，把基础模型的置信度传给融合网络，让它在高光区域退回光场式混合。", "在线标定漂移与软件同步：VisualSync、ASTRA、SyncTrack4D 都是离线优化，Rig3R 的 rig 发现仅在驾驶场景验证。能否从几何基础模型的跨视角注意力中逐帧前馈估计亚帧时间偏移和小幅外参漂移，决定了消费级或手机阵列 telepresence 是否可行。", "已标定与免位姿之间的取舍缺乏系统研究：LiveStre4m、NoPo4D、Tele360 选择免位姿，牺牲了部分质量；Quark 和 Ha et al. 依赖精确标定。在同等延迟下，注入标定（MapAnything 式提示）究竟能带来多少质量提升，目前还没有定量结论。", "人体近距离捕捉的领域差距：通用几何基础模型主要在场景级数据上训练，缺少捕捉穹顶和近距离人体数据；把人体先验（UniSH、Human3R 式 SMPL-X 约束）与场景几何结合，并在多视角人体数据集上做时间一致性评测，仍是空白。"], "relation_to_anchors_zh": "这两篇锚点论文处在几何光谱的两端，几何基础模型对它们的意义也不同。\n\nHa et al.（CVPR 2025）是显式几何路线。它先在人工挑选的立体对上用 RAFT-Stereo 得到逐视角深度（这部分时间不计入约 100 ms 的运行预算），再用帧差掩码 M = min(|I_t−I_{t−1}|/0.7+0.6, 1) 做递归滤波，然后用截断距离硬编码为 0.02 m 的 image-based TSDF 融合出目标视角深度，最后交给 U-Net 融合网络。这条流程的每个几何环节都能被本章的工作替换或加强：\n(1) 逐视角深度：Fast-FoundationStereo（3090 上 49 ms，TensorRT 下 21 ms）或 Lite Any Stereo V2 可以把被排除在外的深度估计真正纳入实时预算；MapAnything/Pow3R 式的已标定多视角推理，或 MVSAnywhere，可以省去人工选对，直接给出度量且跨视角一致的深度，满足 TSDF 对度量尺度的要求。\n(2) 时间一致性：TTT3R 的置信度门控状态更新、CUT3R/StreamVGGT 的持久记忆、Stereo Any Video 与 DyFN 的隐式时间稳定，都可以替代手工帧差掩码。借助 Any4D 的场景流，还能把时间融合扩展到运动区域，而原方法在运动区域几乎不做平滑。\n(3) 目标视角深度：Z3D 和 CUT3R 的虚拟视角查询表明，可以直接从基础模型的表征中读出新视角几何，替代 TSDF raymarching。\n(4) 鲁棒性：Pixel-Perfect 的无飞点几何对应它依赖的逐像素不透明高斯 splat；VisualSync 和 Rig3R 对应它承认的同步与标定敏感问题。\n\nQuark（SIGGRAPH Asia 2024）是隐式几何路线。它不需要外部深度，而是在目标视锥内用 8 路输入、多尺度 render-and-refine 和 one-to-many attention 直接推断只有 6 层左右的 LDM，在 A100 上以 1080p、30fps 运行。对它而言，几何基础模型有三方面价值：\n(1) 更强的初始化与特征：LDM 的初始化可以来自基础模型预测的深度；VGGT 论文已证明其特征能显著提升前馈 NVS。\n(2) 架构上的相互印证：Quark 为控制跨视角融合成本设计了 one-to-many attention，VGGT-Ω 的 register attention、VGGT-Prime 的 head 路由、ZipMap 的线性 TTT 层走的是同一方向，即降低多视角注意力的二次代价。\n(3) 暴露的短板：Quark 逐帧独立推理，没有时间记忆；流式几何模型的状态和记忆机制正好能补上这一环。\n\n反过来，两篇锚点论文也给几何基础模型提出了明确要求：1080p 以上分辨率，整帧 30 ms 左右的预算，固定且已标定的朝内阵列，以及视角和时间两个维度上同时一致。截至 2026 年 9 月，还没有任何几何基础模型同时满足这四点，这正是这两个方向交叉处最有价值的研究空白。"}, {"key": "gen-prior", "area_title_zh": "生成式先验：面向 3D/4D 与新视角合成的扩散模型、实时视频扩散与世界模型", "overview_zh": "3D 远程呈现绕不开生成式先验，原因在于以 Quark 和 Ha et al. 为代表的实时方法本质上都是「插值式」的。Quark 的每个输出像素都是输入图像颜色的凸组合（论文在局限性一节中自己承认）。Ha et al. 用逐像素 Gaussian 前向溅射加时间一致的 TSDF 几何来引导融合，空洞只靠一个小型 U-Net 输出的背景图像填补。输入覆盖充分时，它们能达到 1080p/30fps（Quark，A100）或约 39 ms/帧（Ha et al.，TensorRT）的实时性能。但面对去遮挡、未被任何相机看到的区域、视角相关的反射，以及相机稀疏的情形，它们几乎无能为力。扩散模型、视频生成模型和世界模型从大规模数据中学到了外观与几何先验，能「补」出观测之外的内容。代价有两个：延迟高，而且生成结果可能偏离真实人物（幻觉）。本章梳理这一方向从 2022 年到 2026 年 9 月的演进，并把它放回远程呈现的延迟、保真度和一致性约束里讨论。\n\n第一阶段（2022–2023）把 2D 扩散模型当作 3D 先验。DreamFusion 提出 SDS（Score Distillation Sampling），用冻结的文生图模型监督 NeRF 优化。3DiM 首次把 NVS 表述为位姿条件的 image-to-image 扩散，并用随机条件化提升多视图一致性。Zero-1-to-3 在合成 3D 数据上微调 Stable Diffusion，学会相对视角控制，并能零样本泛化到真实照片。GeNVS 在 2D 扩散骨干中加入 3D 特征体作为几何先验。ReconFusion 把以少量视图为条件的 NVS 扩散模型用作 NeRF 重建的正则项，评测设定为 3/6/9 视图。这一阶段的共同形态是「生成视图 + 逐场景优化」，耗时从数十分钟到数小时，与在线远程呈现没有交集。它的意义在于确立了「NVS 即条件生成」的思想，也埋下了「把生成先验蒸馏进 3D 或网络」这条后来反复出现的主线。\n\n第二阶段（2024–2025）转向多视图扩散与视频扩散。Stable Video Diffusion 等开源视频模型自带时间一致性，研究者于是把多视图生成改写为「沿相机轨迹生成视频」。CameraCtrl 给视频模型加上可插拔的相机控制模块。CAT3D 用多视图潜空间扩散，把整个 3D 创建流程压缩到约 1 分钟。Stable Virtual Camera 能生成长约 30 秒、首尾闭环一致的轨迹。Bolt3D 直接生成逐像素 Gaussian，单 GPU 不到 7 秒，推理成本比逐场景优化方案低最多 300 倍。这一阶段更关键的变化是「几何缓存条件化」成为主流范式。ViewCrafter 以 DUSt3R 点云的渲染图为条件。GEN3C 维护一个由逐帧深度点云构成的 3D 缓存，把它渲染到新相机下再交给视频扩散。TrajectoryCrafter 同时以深度 warp 的渲染和源视频作双流条件。ReCamMaster 在 UE5 合成的多相机同步数据上学习动态视频的重拍。StereoCrafter 用 warp 加视频修补，为 VR 生成立体内容。4D 方向上，4DiM 和 CAT4D 引入时间条件，把单目视频变成多视图视频；Diffuman4D 在稀疏视角的人体视频上沿空间与时间交替去噪，获得 4D 一致性；OmniView 在 Neural 3D Video（即 Ha et al. 使用的 DyNeRF 数据）的动态 NVS 上比已有方法提升约 60%。\n\n第三阶段（2025–2026）的主题是提速和在线化，沿两条线展开。第一条是单步修复器。Difix3D+ 把 SD-Turbo 微调为单步修复器，A100 上 76 ms，FID 约改善 2 倍，PSNR 约 +1 dB，但逐帧使用会闪烁、跨视角也不一致。之后 DiffusionHarmonizer 以历史输出帧为条件做在线增强。ArtiFixer 用不透明度混合加因果自回归蒸馏，PSNR 提升 1–3 dB。SyncFix 通过多视图同步去噪保证跨视角一致。4DGS-Fixer 把视频修复先验用于稀疏视角 4DGS，约 +2 dB。第二条是因果少步视频扩散。CausVid 用 DMD 把 50 步双向模型蒸馏为 4 步块因果模型，达到 9.4 FPS。Self Forcing 在模型自身的 rollout 上训练以消除 exposure bias，H100、832×480 下达到 17 FPS、0.69 s 延迟。StreamDiffusionV2 在 4×H100 上达到 58–64 FPS，首帧不到 0.5 s。这套配方已迁移到条件生成任务：FlashVSR（768×1408、17 FPS）、InstantViR（>35 FPS，摘要明确以远程呈现和 AR/VR 为目标）、AlayaRenderer-Flash（G-buffer 条件渲染，从 0.56 FPS 提到 31.5 FPS）。RealCam 把单目视频的任意新视角生成推到亚秒延迟：基于 Wan 1.3B/5B，每块 3 步去噪，H20 上 0.72–1.15 s，而 ReCamMaster 需要 426 s。在抑制长时几何漂移方面，GeoStream 用自刷新的 3D 缓存加 on-policy 蒸馏，Stream4D 用前馈 4D 重建奖励。\n\n与此同时，「世界模型即渲染器」的路线快速兴起。Sora 提出视频模型即世界模拟器，3D 一致性随规模涌现。GameNGen 在单 TPU 上以 20 FPS 运行扩散驱动的 DOOM 引擎，下一帧 PSNR 29.4。Genie 3 实现 720p/24 FPS 的实时可导航世界，能保持数分钟一致，视觉记忆约 1 分钟。World Labs 的 RTFM 以带位姿的帧作为空间记忆，在单 H100 上以交互帧率从输入图像生成新视角，不构建任何显式 3D，并能学到反射和光泽。WorldPlay 用重构的上下文记忆，在 720p/24 FPS 下保持长期几何一致。NVIDIA Cosmos 提供开放权重的世界基础模型，并成为其单步修复器的骨干。DiffusionRenderer 把逆渲染和正向渲染都交给视频扩散。从结构上看，RTFM 可以理解为「生成式 IBR」：它和 Quark 一样检索邻近的输入视图，只是用生成式 Transformer 取代了凸组合混合，因此能表达 Quark 无法表达的视角相关效应。\n\n截至 2026 年 9 月，质量最高的生成式方法（Stable Virtual Camera、CAT4D、Diffuman4D、Flex4DHuman）仍然离线运行。实时生成已达到 480p–720p、17–40 FPS 的量级，但需要 H100 级 GPU，首帧或首块延迟在 0.5–1 s，也不保证对真实输入的像素级保真。实时多视图直播系统中，LiveStre4m（1024×768、0.07 s/帧）只把扩散 Transformer 用于关键帧之间的时间插值。概括来说，确定性的几何引导 IBR（Quark、Ha et al.）在保真度、分辨率和延迟上仍然占优，生成先验则在补全、视角相关效应和稀疏输入上占优。把两者结合起来，是这个领域最明确的下一步：以标定多视图几何作为 3D 缓存，以因果少步生成模型作为修复器或渲染器，再用置信度门控把幻觉限制在去遮挡区域。", "subtopics": [{"name_en": "Multi-view diffusion for NVS", "name_zh": "多视角扩散与生成式新视角合成", "summary_zh": "这条线把 NVS 看作条件生成问题：给定一张或几张带位姿的图像，采样目标视角的图像分布。它从 3DiM 和 Zero-1-to-3 的单图换视角起步，经过 SDS 蒸馏（DreamFusion）和扩散正则化重建（ReconFusion），发展到 CAT3D 和 Stable Virtual Camera 这类可一次生成大量一致视图的通用多视图模型。随后又出现直接输出 3DGS 的生成式前馈模型（Bolt3D，7 秒以内），以及统一处理空间、时间与视角的 OmniView。这条线的主要瓶颈是多步采样和逐场景重建带来的延迟。", "representative_works": ["Novel View Synthesis with Diffusion Models (3DiM)", "DreamFusion", "Zero-1-to-3", "GeNVS", "ReconFusion", "CAT3D", "Stable Virtual Camera", "Bolt3D", "OmniView"]}, {"name_en": "Camera-controlled & geometry-conditioned video diffusion", "name_zh": "相机可控与几何缓存条件的视频扩散", "summary_zh": "这条线以视频扩散模型（SVD、Wan 等）为骨干，把相机轨迹作为稠密条件（CameraCtrl）。它进一步把显式 3D 缓存（点云、深度 warp、Gaussian）的渲染结果作为条件（ViewCrafter、GEN3C、TrajectoryCrafter），让生成能力集中在未观测区域。2025–2026 年，这条线走向动态视频重拍（ReCamMaster）、立体视频生成（StereoCrafter）、把生成先验自蒸馏进 3DGS（Lyra），以及带自刷新 3D 缓存的流式实时生成（GeoStream、RealCam）。", "representative_works": ["Stable Video Diffusion", "CameraCtrl", "ViewCrafter", "StereoCrafter", "GEN3C", "ReCamMaster", "TrajectoryCrafter", "Lyra", "GeoStream", "RealCam"]}, {"name_en": "One-step generative fixers & enhancers", "name_zh": "单步生成式修复器与增强器", "summary_zh": "这类方法把预训练扩散模型蒸馏或微调为单步（或少步）的图像/视频修复器，专门去除 NeRF/3DGS 渲染中的伪影并补全缺失区域。它们既可以把修复结果蒸馏回 3D，也可以作为渲染后的实时增强器。发展脉络是从逐帧修复（Difix3D+，76 ms）走向带时间条件的在线修复（DiffusionHarmonizer）、因果自回归修复（ArtiFixer）和多视图同步修复（SyncFix）。这是最容易直接接在 Quark 或 Ha et al. 之后的生成模块。", "representative_works": ["Difix3D+", "DiffusionHarmonizer", "ArtiFixer", "SyncFix", "4DGS-Fixer"]}, {"name_en": "Real-time causal video diffusion", "name_zh": "实时因果（流式）视频扩散", "summary_zh": "这条线研究如何把双向、多步的视频扩散模型变成因果、少步、带 KV cache 的流式生成器。代表工作有 CausVid 的 DMD 蒸馏、Self Forcing 的自回归 rollout 训练、StreamDiffusion/StreamDiffusionV2 的系统级调度，以及把同一配方用于条件任务的 FlashVSR 和 InstantViR。Stream4D 用 4D 重建奖励抑制几何漂移。它为「实时生成式渲染」提供了技术底座，目前约为 17–64 FPS、首帧 0.5–1 s。", "representative_works": ["StreamDiffusion", "CausVid", "Self Forcing", "StreamDiffusionV2", "FlashVSR", "InstantViR", "Stream4D"]}, {"name_en": "4D generation & dynamic/human NVS", "name_zh": "4D 生成与动态场景/人体生成式视角合成", "summary_zh": "这条线在视角条件之外再加入时间条件，从单目或稀疏视角视频生成多视图视频，再重建出 4D 表示。通用方法有 4DiM 和 CAT4D。人体专用方法有 Diffuman4D、Flex4DHuman 和 Pippo，它们与远程呈现的场景最接近，但几乎都离线运行。实时系统中，LiveStre4m 只把 DiT 用于关键帧之间的时间插值。", "representative_works": ["4DiM", "CAT4D", "Diffuman4D", "Flex4DHuman", "LiveStre4m", "Pippo"]}, {"name_en": "World models as renderers", "name_zh": "世界模型即渲染器", "summary_zh": "这条线把大规模视频或世界模型直接当作「学习型渲染器」：以历史帧、动作或相机位姿、G-buffer 为条件逐帧生成画面，通常不构建显式 3D。发展脉络从 Sora 的规模涌现，到 GameNGen 的实时游戏引擎，再到 Genie 3（720p/24 FPS）、RTFM（单 H100、以位姿帧为空间记忆）和 WorldPlay（长期几何记忆）。另一分支是生成式正/逆渲染：DiffusionRenderer 做离线正/逆渲染，AlayaRenderer-Flash 做 30 FPS 的 G-buffer 条件渲染。这条线的挑战是：只能保证画面合理，不能保证对真实场景的保真。", "representative_works": ["Sora", "GameNGen", "Cosmos World Foundation Model Platform", "Genie 3", "RTFM", "WorldPlay", "DiffusionRenderer", "Generative World Renderer at the Speed of Play (AlayaRenderer-Flash)"]}], "timeline": [{"year": 2022, "event_zh": "DreamFusion 提出 SDS，首次用冻结的 2D 扩散模型作为 3D 先验；3DiM 首次把 NVS 表述为位姿条件的扩散生成。"}, {"year": 2023, "event_zh": "Zero-1-to-3 实现单图零样本换视角；GeNVS 把 3D 特征体引入扩散模型；ReconFusion 用扩散先验正则少视图 NeRF。"}, {"year": 2023, "event_zh": "Stable Video Diffusion 开源，视频扩散成为 3D/4D 生成的主力骨干；StreamDiffusion 在 RTX 4090 上实现约 91 fps 的流式图像扩散。"}, {"year": 2024, "event_zh": "2 月，OpenAI 发布 Sora 技术报告，提出「视频模型即世界模拟器」；4 月，CameraCtrl 为视频扩散加入可插拔相机控制。"}, {"year": 2024, "event_zh": "5 月，CAT3D 把多视图扩散加重建的完整 3D 创建压缩到约 1 分钟；7 月，4DiM 实现时间与空间联合控制的 NVS。"}, {"year": 2024, "event_zh": "8 月，GameNGen 在单 TPU 上以 20 FPS 运行扩散驱动的游戏引擎；9 月，ViewCrafter 与 StereoCrafter 提出「点云/深度 warp + 视频扩散补全」。"}, {"year": 2024, "event_zh": "11 月，CAT4D 推出多视图视频扩散 4D 生成，锚点论文 Quark 也在同月发布（1080p/30fps 的确定性实时 NVS）；12 月，CausVid 把双向视频扩散蒸馏为 4 步因果模型（9.4 FPS）。"}, {"year": 2025, "event_zh": "1 月，NVIDIA 发布 Cosmos 世界基础模型与 DiffusionRenderer。"}, {"year": 2025, "event_zh": "3 月，Difix3D+（单步修复器，A100 上 76 ms）、GEN3C（3D 缓存条件化）、Stable Virtual Camera、Bolt3D（7 秒以内）、ReCamMaster、TrajectoryCrafter 集中发布。"}, {"year": 2025, "event_zh": "5 月，锚点论文 Ha et al. 发布（CVPR 2025），提出几何引导、时间与多视角一致的在线 3D 视频合成；6 月，Self Forcing 在 H100 上实现 17 FPS 流式视频扩散。"}, {"year": 2025, "event_zh": "7 月，Diffuman4D 实现稀疏视角人体的 4D 一致生成；8 月，Genie 3 实现 720p/24 FPS 实时交互世界。"}, {"year": 2025, "event_zh": "9–10 月，Lyra 把视频扩散自蒸馏进 3DGS；World Labs 发布 RTFM 学习型渲染器（单 H100）；FlashVSR 实现 17 FPS 的一步扩散流式超分。"}, {"year": 2025, "event_zh": "11–12 月，StreamDiffusionV2 在 4×H100 上达到 58–64 FPS；InstantViR 在 A100 上超过 35 FPS，明确面向远程呈现；WorldPlay 与 OmniView 发布。"}, {"year": 2026, "event_zh": "2 月，DiffusionHarmonizer（带时间条件的在线单步增强器）与 ArtiFixer（因果自回归修复，+1–3 dB）发布。"}, {"year": 2026, "event_zh": "4 月，SyncFix 提出多视图同步修复；LiveStre4m 把 DiT 插值用于免标定多视图直播 NVS。"}, {"year": 2026, "event_zh": "5–6 月，RealCam 把单目视频新视角生成推进到亚秒延迟；GeoStream 提出自刷新 3D 缓存 + on-policy 蒸馏；Flex4DHuman 发布。"}, {"year": 2026, "event_zh": "7–9 月，AlayaRenderer-Flash 实现 30 FPS 的 G-buffer 条件生成式渲染；Stream4D 提出 4D 一致性奖励；4DGS-Fixer 被 SIGGRAPH Asia 2026 接收。"}], "trends_zh": ["从「生成视图 + 逐场景优化」走向前馈与蒸馏：DreamFusion/ReconFusion 需要小时级时间，CAT3D 约 1 分钟，Bolt3D 不到 7 秒，Lyra 把视频扩散自蒸馏进 3DGS，推理时不再有扩散开销。把生成先验蒸馏进实时网络，正成为与实时系统结合风险最低的方式。", "几何缓存条件化成为一致性的默认方案：先把显式 3D 缓存（点云、深度 warp、Gaussian）渲染到目标视角，再由扩散模型修补和补全（ViewCrafter、GEN3C、TrajectoryCrafter、GeoStream、Difix3D+）。Ha et al. 的前向溅射加 TSDF 深度、Quark 的 LDM，恰好就是更精确的几何缓存。", "单步修复器从逐帧处理走向带时间与多视图感知：Difix3D+（76 ms，逐帧，会闪烁）→ DiffusionHarmonizer（以历史帧为条件的在线增强）→ ArtiFixer（因果自回归蒸馏，+1–3 dB）→ SyncFix（多视图同步去噪）。", "「双向教师 → 因果少步学生」的蒸馏已经成熟：CausVid 9.4 FPS → Self Forcing 17 FPS/0.69 s → StreamDiffusionV2 在 4×H100 上 58–64 FPS。这套配方正迁移到条件任务：FlashVSR（17 FPS@768×1408）、InstantViR（>35 FPS）、RealCam（亚秒级新视角视频）、AlayaRenderer-Flash（31.5 FPS）。", "一致性正从架构设计转向训练目标：self-forcing 或 on-policy 条件训练（Self Forcing、GeoStream、RealCam），4D 重建奖励（Stream4D），面向记忆的蒸馏（WorldPlay 的 Context Forcing）。", "世界模型被当作学习型渲染器：GameNGen（20 FPS）→ Genie 3（720p/24 FPS）→ RTFM（单 H100，以位姿帧为空间记忆）→ WorldPlay（长期几何记忆）。「显式 3D 可有可无」的观点正在兴起，但这些模型只保证画面合理，不保证保真。", "出现了统一时空视角条件的通用模型（4DiM、CAT4D、OmniView），并开始在 Neural 3D Video/DyNeRF 这类远程呈现式多视图视频基准上领先（OmniView 提升 60%）。", "人体专用生成先验进步很快（Diffuman4D、Flex4DHuman、Pippo），但几乎都离线运行。实时系统（LiveStre4m）只敢把 DiT 用于时间插值，生成先验与实时远程呈现之间仍隔着一个数量级的延迟。"], "open_problems_zh": ["延迟鸿沟：目前最快的相机可控生成式 NVS（RealCam），首块延迟仍有 0.72–1.15 s，分辨率 480×832。Quark 含重建在内做到 1080p/30fps，Ha et al. 约 39 ms/帧。要进入远程呈现，需要逐帧延迟低于 50 ms、分辨率不低于 1080p 的生成式渲染，而且要把首帧延迟和抖动纳入 SLO。", "保真度与幻觉之争：远程呈现要求真实，生成模型却可能改变表情、口型、身份细节或手势。需要一种置信度门控：利用 TSDF 权重、alpha、融合权重的熵、深度不一致等信号，只允许在去遮挡区域和深度失效区域生成。还需要在留出相机上量化「幻觉率」的指标。", "双目立体与多观察者一致性：逐视图独立生成会破坏双眼一致，引起双目竞争。SyncFix 和 StereoCrafter 都是离线方法，尚无实时的跨眼同步去噪或跨眼相关噪声方案。Quark 和 Ha et al. 也都只评测单视角输出。", "长时稳定与递归漂移：自回归生成与 Ha et al.「上一帧深度回灌 TSDF」有同样的 exposure bias 风险，而现有评测大多不超过 100–177 帧。缺少分钟级的稳定性测试，也缺少针对几何与外观联合递归的 self-forced/on-policy 训练。", "如何以标定多视图为条件：多数生成模型为单目或少视图设计，如何高效吸收 4–16 路已标定的 RGB(-D) 及其几何（LDM、TSDF、逐视图 warp），同时保留 IBR 的高频细节和锐利边缘，尚无成熟架构。", "视角相关效应与光照：Quark 的凸组合表示不了高光，Ha et al. 在高光区域也会失效。生成式渲染（RTFM、DiffusionRenderer）能表示这些效应，却难以控制、难以保证一致。实时、多视角一致的生成式重光照与协调仍是空白。", "评测基准缺失：目前没有一个基准能同时报告留出相机上的保真度（PSNR/LPIPS）、时间一致性（TCC/STED）、视角与双目一致性（SDV/EPI 及视差一致性）、幻觉率，以及延迟与抖动。Ha et al. 的一致性指标可以作为起点。", "带宽与生成的权衡：在接收端生成，可以用稀疏视图加几何的少量数据换取自由视点，从而大幅降低码率。但面向多视图、自由视点 3D 视频的生成式编解码及其率失真与一致性权衡，仍基本没有研究。"], "relation_to_anchors_zh": "两篇锚点论文都属于「确定性、几何/图像引导的实时前馈 NVS」。生成式先验在两者中都没有出现，却恰好对应它们各自承认的局限。\n\nQuark（Flynn et al., Google, SIGGRAPH Asia 2024 / TOG）以 8–16 张输入图像实时构建层化深度图（LDM），用多尺度 render-and-refine 迭代求解，再以学习的融合权重做 IBR，在 A100 上达到 1080p/30fps。论文的局限性一节列出了四点：逐帧独立重建导致视频闪烁；输出是输入颜色的凸组合，无法准确表示视角相关材质；曝光或焦距不一致时出现边缘伪影；输入覆盖不足时（如 Mip-NeRF360、Deep Blending）新视图边缘出现伪影。Quark 还明确把使用生成先验的单视图方法归为「另一类」，理由是其质量与泛化不足，不与之比较。到 2026 年，这一判断正在被动摇。覆盖不足的问题正是 CAT3D、Stable Virtual Camera、GEN3C 等生成式补全所擅长的，OmniView 在 Neural 3D Video 上也已明显领先。视角相关效应可以交给 RTFM 这类「生成式 IBR」：它和 Quark 一样检索邻近视图，却用生成 Transformer 取代凸组合。闪烁则可以由带时间条件的单步修复器（DiffusionHarmonizer）或因果视频扩散（Self Forcing 配方）处理。\n\nHa et al.（KAIST + Meta, CVPR 2025）把逐像素 Gaussian 前向溅射、带颜色差分掩码的时间一致 TSDF 和几何引导的融合 U-Net 结合起来，约 39 ms/帧（TensorRT，不含立体深度估计），并用 TCC/STED/SDV/EPI 评测时间与多视角一致性。从生成式视角看，它可以对应到生成式方法的四个关键部件。第一，前向溅射加 TSDF 深度就是 GEN3C、ViewCrafter 式的 3D 缓存，而且来自标定多视图，比单目深度缓存精确得多。第二，融合网络输出的背景图像 I_BG 本身就是一个小型生成分支，可以直接换成单步或因果的生成修复器，并用 alpha、TSDF 置信度门控，只在去遮挡区生成（参照 ArtiFixer 的不透明度混合）。第三，「上一帧渲染深度回灌 TSDF」的递归与 Self Forcing、GeoStream 的自回归结构同构，可以借用 on-policy/self-forced 训练来抑制漂移。Ha et al. 训练时从未见过视频序列，也没有时间损失。第四，它的一致性指标体系可以直接成为评测生成式远程呈现的标准，而目前大多数生成式论文只报告 PSNR/LPIPS 或 VBench。\n\n两篇论文共同留下的空白是：还没有方法能在标定多视图的在线管线中，在 100 ms 以内，同时满足时间、视角和双目一致性地使用生成先验。可行的切入点有三种。（a）按 Lyra/Bolt3D 的思路，把多视图或 4D 生成模型蒸馏进 Quark/Ha 式的前馈网络，推理时零额外开销。（b）在 IBR 之后串接一个以 TSDF 深度重投影、而不是光流做时间对齐的单步因果修复器，并用置信度门控。（c）以标定多视图和几何为条件训练 RTFM 式的学习型渲染器，以同时处理去遮挡和视角相关效应。"}, {"key": "tele-sys", "area_title_zh": "三维远程呈现系统与体积视频流传输（Project Starline / Google Beam、Holoportation、VirtualCube、Tele-Aloha、体积/高斯视频压缩、网络与时延）", "overview_zh": "三维远程呈现（3D telepresence）要让身处两地的人感觉\"同处一室\"：人像按真人尺寸显示，能对上视线，有双目立体和运动视差，端到端时延还要满足对话需求（一般认为不超过 150–250 ms）。这是一条从采集、重建与表示、编码、传输、渲染一直到显示的完整链路，任何一环都可能成为瓶颈。这个方向可以追溯到 UNC 的 Office of the Future（SIGGRAPH 1998），它提出用实时视觉获取逐像素深度，再在任意表面上重投影。Maimone & Fuchs（ISMAR 2011）用多台消费级 Kinect，第一次在不需佩戴设备的条件下做到实时 3D 采集和头部跟踪立体显示。微软 Collet 等（SIGGRAPH 2015）在离线影棚中用密集 RGB+IR 相机采集，经自适应网格和网格跟踪后编码为 MPEG 流，由此确立了\"体积视频可以像 2D 视频一样流式传输\"的范式。Holoportation（UIST 2016）用 8 个采集 pod（每个含 2 台 NIR 相机和 1 台 RGB 相机，30 fps）配合 Fusion4D 非刚性体融合，实时重建整个房间并推送到 HoloLens/VR 端；后来的便携版本把带宽降低了约 97%。LookinGood（SIGGRAPH Asia 2018）首次用实时神经重渲染修补性能捕捉结果中的空洞和低分辨率纹理，预示了\"粗几何 + 神经精修\"这条路线。\n\nProject Starline（ACM TOG 2021）是这一领域的标杆。它用 3 个采集 pod 产生 4 路彩色流和 3 路深度流，经 NVENC/HEVC 压缩后通过 WebRTC 传输，码率 30–100 Mbit/s。接收端做基于图像的深度融合和法向加权纹理混合，只为被跟踪到的双眼渲染两个视点，显示在 65 英寸 8K、60 Hz 的头部跟踪裸眼 3D 屏上；环回测得的端到端时延为 105.8 ms，整套系统用了 4 块 GPU。Google 的用户研究显示，与普通视频会议相比，手势多了 43%，点头多了 26%，会议疲劳降低了 31%。微软 VirtualCube（IEEE VR 2022 / TVCG）在每个隔间用 6 台 Azure Kinect，V-Cube View 负责深度估计，Lumi-Net 负责学习型混合，实现了多方圆桌会议中的视线一致。它走的是\"发送端为每个接收者渲染肖像视图\"的路线：JPEG 约 7 Mbps，端到端约 300 ms，三方会议 23 fps。由此形成了三种基本架构：传原始 RGB-D、由接收端渲染（Starline）；由发送端渲染 2D 视图（VirtualCube）；传显式 3D 表示，如网格、点云或高斯（Holoportation、MetaStream、Tele360）。\n\n2023–2026 年的主线是\"去掉深度传感器，用学习到的几何补足稀疏视角\"。2023 年 Google 用更少的普通摄像头加 AI，把 Starline 从卡座大小缩小到电视大小；2025 年更名为 Google Beam，由 HP Dimension 商用（6 台摄像头、65 英寸光场屏、60 fps，售价约 2.5 万美元）。学术界方面：NVIDIA 的 Live 3D Portrait 从单张图像前馈生成 triplane NeRF，运行速度 24 fps，支撑了 AI 介导的 3D 视频会议演示。GPS-Gaussian（CVPR 2024）用像素对齐的高斯参数图，在稀疏视角下实现 2K 实时人体渲染。Tele-Aloha（SIGGRAPH 2024）只用 4 台 RGB 相机和一块 GPU，就做到 2048×2048、30 fps、端到端 <150 ms。VoluMe（微软，2025）从单个网络摄像头实时预测高斯，速度 28 FPS。Tele360（2026-09）支持 6 路未标定的 2K 视图，推理约 35 ms（RTX 5090），但高斯图需要约 100 Mbps 的 H.265 流来传输，MacBook/iPad 上的端到端时延约 500–650 ms，作者也承认缺少时序聚合、会出现闪烁。LiveStre4m 从至少 2 路未标定流前馈合成新视角，每帧 0.07 s；Google 的 NSTM 用测试时训练记忆实现分钟级的场景记忆（256×256 下 27 ms/帧）。开源工具 LiveSplat 能从最多 4 路 RGB-D 实时生成高斯。\n\n另一端是化身和语义驱动的远程呈现，传输的是参数而不是像素。Meta 的 Codec Avatars 从头显相机图像编码出通用表情潜码；SqueezeMe 在 Quest 3 上以 72 FPS 同时驱动 3 个全身高斯化身。Apple Vision Pro 的 FaceTime Spatial Persona 被 IMC 2024 的测量证实传输的是语义数据，visionOS 26 又用\"体积渲染 + 机器学习\"重做了 Persona。Mon3tr（2026）用预先构建的高斯化身加单目参数，做到 <0.2 Mbps、端到端约 80 ms、Quest 3 上约 60 FPS；MagicStream（SenSys 2024）称带宽最多可降低 1195 倍。于是整个领域形成了一条码率谱：参数约 0.2 Mbps，渲染后的 2D 视图约 7 Mbps，原始 RGB-D 30–100 Mbps，点云 72 Mbps，高斯图约 100 Mbps。越往低码率一端，真实性越差，但稳定性越好。\n\n传输和网络方面，MobiCom、NSDI、CoNEXT、INFOCOM 等社区的重心正从点播转向直播会议。ViVo（MobiCom 2020）首次系统提出可见性感知的点云流；YuZu（NSDI 2022）用 3D 超分辨率把 QoE 提升了 37–178%；MetaStream（MobiCom 2023）实现了 4 台 RGB-D 的实时采集、分发和渲染，约 30 fps。LiVo（CoNEXT 2025）复用标准编码器、码率自适应和 WebRTC，并剔除接收者视场外的内容，客观质量比现有最佳方法高 20% 以上，MOS 为 4.1。ReVo（2026）把 RGB 流和深度流解耦，只对关键内容做 FEC，解码后再做神经恢复，卡顿最多减少 95.7%。进入高斯时代后，AirGS（INFOCOM 2026）和 CAGS（SIGGRAPH 2026；带宽波动下 PSNR 提升 5–20 dB）把码率自适应扩展到 4D 高斯；注视点压缩能把远程呈现的带宽降到约三分之一。\n\n压缩和标准化方面，MPEG V-PCC 以约 125:1 的压缩比，把 100 万点的动态点云压到约 8 Mbit/s，确立了\"3D 投影成 2D 图集、再交给视频编码器\"的路线。进入神经表示时代后，ReRF（CVPR 2023）用残差辐射场实现约三个数量级的压缩，VideoRF（CVPR 2024）把 4D 辐射场序列化为 2D 特征视频，以便利用硬件解码。3DGStream（每帧约 12 s）和 QUEEN（每帧约 0.7 MB，训练 <5 s）代表逐帧在线优化的高斯流；V^3 和 PackUV（CVPR 2026）则把高斯属性打包成可以用视频编码器压缩的图集。面向会议的 RGB-D 编码有三项代表工作：Google 的 Sandwiched RGB-D 比 HEVC/MV-HEVC 省约 30% 码率；GS-SCNet 的 BD-rate 降低 75.1%；DSGS 在解码端用前馈 3DGS 取代深度估计，BD-PSNR 提升 5.79 dB，视间闪烁也显著减轻。MPEG GSC 在第 153 次会议上把 V-PCC 高斯 profile 推进到 CDAM 阶段、G-PCC 方案推进到 WD 阶段，但动态高斯和时序一致性编码仍只在联合探索阶段。\n\n截至 2026 年 9 月的格局如下。产品端，Google Beam 用 6 路 RGB 加 AI 体积视频模型，以 60 fps 提供双人裸眼 3D 通话，其时延基线来自 Starline 的 105.8 ms。研究端，前馈高斯已经达到 2K、25–30 FPS，但大多仍是逐帧处理、没有时序状态，传输仍需约 100 Mbps，普通客户端的端到端时延在 0.5 s 量级。化身路线能把码率压到 0.2 Mbps 以下，代价是真实性。显示端，光场和柱镜屏需要 32–45 个以上的视图，逐视图渲染的成本会成倍放大；评估端，GScomp-QA 等工作表明 18 种客观指标都没能完整捕捉高斯特有的时序失真和视角相关失真。这些问题集中说明，下一阶段的核心是在\"时序一致、低码率、低时延\"三者之间做联合设计，而这正是两篇锚点论文所在的接收端视图合成要与系统层衔接的地方。", "subtopics": [{"name_en": "Classic 3D Telepresence Systems", "name_zh": "经典三维远程呈现系统（1998–2022）", "summary_zh": "从 Office of the Future 的愿景出发，经过 Kinect 阵列和 Holoportation 的房间级实时融合，发展到 Starline、VirtualCube 的隔间式系统。它们确立了远程呈现的基本架构：多路 RGB-D 采集，几何融合，视点相关渲染，再用裸眼屏或头显显示。它们还给出了码率（约 7–100 Mbps）和端到端时延（105.8–300 ms）的现实基线，并提出了发送端渲染、接收端渲染、传显式 3D 三种计算切分方式。", "representative_works": ["Holoportation: Virtual 3D Teleportation in Real-time", "Project Starline: A high-fidelity telepresence system", "VirtualCube: An Immersive 3D Video Communication System", "High-quality streamable free-viewpoint video"]}, {"name_en": "Learned Sparse-RGB Live Capture & Rendering", "name_zh": "学习驱动的稀疏 RGB 实时采集与渲染", "summary_zh": "2023 年以后，主动深度传感器逐步退出。前馈网络从 1–6 路 RGB（甚至未标定的 RGB）预测像素对齐高斯、triplane 或分层深度，并实时渲染；产业侧的代表是 Google Beam。现有系统已达到 2K、25–30 FPS，但普遍逐帧处理、缺少时序状态，客户端时延和传输码率也偏高。", "representative_works": ["Tele-Aloha: A Low-budget and High-authenticity Telepresence System Using Sparse RGB Cameras", "Google Beam (Project Starline productization; HP Dimension)", "GPS-Gaussian: Generalizable Pixel-wise 3D Gaussian Splatting for Real-time Human Novel View Synthesis", "Tele360: Real-Time Feed-Forward Human Reconstruction from Sparse Unposed Cameras", "Online Neural Space Time Memory for Dynamic Novel View Synthesis"]}, {"name_en": "Avatar-Based & Semantic Telepresence", "name_zh": "化身与语义驱动的远程呈现", "summary_zh": "先离线构建个人化身（Codec Avatars、高斯化身、Persona），通话时只传表情、姿态参数或语义特征，由接收端生成画面。码率可低至 0.2 Mbps 以下，时延约 80 ms，并能在头显上以 60–72 FPS 运行；代价是真实性（服饰、手中物体、环境变化）和个性化建模成本。", "representative_works": ["Universal Facial Encoding of Codec Avatars from VR Headsets", "A First Look at Immersive Telepresence on Apple Vision Pro", "Mon3tr: Monocular 3D Telepresence with Pre-built Gaussian Avatars as Amortization"]}, {"name_en": "Volumetric Streaming Systems & Networking", "name_zh": "体积视频流传输系统与网络", "summary_zh": "网络与移动计算社区关注如何把点云、RGB-D 或高斯体积内容实时送达用户。主要手段包括：可见性和视场剔除、神经超分增强、复用 2D 视频栈（WebRTC、码率自适应）、选择性 FEC 与丢包恢复、4D 高斯的码率自适应、注视点压缩，以及跨层时延分析。研究重心正从点播转向双向直播会议。", "representative_works": ["ViVo: Visibility-aware Mobile Volumetric Video Streaming", "LiVo: Toward Bandwidth-adaptive Fully-Immersive Volumetric Video Conferencing", "ReVo: A Cross-Layer Reliable Volumetric Videoconferencing System", "MetaStream: Live Volumetric Content Capture, Creation, Delivery, and Rendering in Real Time"]}, {"name_en": "Volumetric & Gaussian Video Compression", "name_zh": "体积与高斯视频压缩及标准化", "summary_zh": "技术脉络从 MPEG V-PCC 的\"3D 转 2D 图集再用视频编码\"出发，经过 ReRF、VideoRF 的神经残差和特征视频，演进到 3DGStream、QUEEN 的逐帧高斯残差流，以及 V^3、PackUV 的高斯 UV 图集。面向会议的 RGB-D 神经编码（Sandwiched、GS-SCNet、DSGS）把编解码器与接收端重建联合设计。MPEG GSC 的静态高斯编码已进入 CDAM/WD 阶段，动态高斯仍在探索。", "representative_works": ["An overview of ongoing point cloud compression standardization activities: video-based (V-PCC) and geometry-based (G-PCC)", "QUEEN: QUantized Efficient ENcoding of Dynamic Gaussians for Streaming Free-viewpoint Videos", "One-Click Upgrade from 2D to 3D: Sandwiched RGB-D Video Compression for Stereoscopic Teleconferencing", "MPEG-I Gaussian Splat Coding (GSC) standardization"]}, {"name_en": "Displays, Perception & QoE Evaluation", "name_zh": "显示、感知与体验质量评估", "summary_zh": "裸眼光场屏和柱镜屏需要同时渲染 32–45 个以上的视图，推动了多视图计算摊销的研究，例如扫掠平面和子像素编码。评估方面，主观质量数据集和时序一致性研究表明，现有客观指标对高斯特有的时序失真、视角相关失真以及压缩带来的闪烁都不敏感。", "representative_works": ["Real-time 3D Visualization of Radiance Fields on Light Field Displays", "LentiAvatar: Pseudo-Multiview Reconstruction and Subpixel Prism Rendering for Real-Time Stereoscopic Communication", "GScomp-QA: A Subjective Dataset for Quality Assessment of Compressed Gaussian Splatting"]}], "timeline": [{"year": 1998, "event_zh": "UNC 发表 Office of the Future（SIGGRAPH 1998），提出用实时视觉获取逐像素深度来实现沉浸式远程协作。"}, {"year": 2011, "event_zh": "Maimone & Fuchs 用多台消费级 Kinect 实现无需佩戴设备的实时 3D 采集和头部跟踪立体显示（ISMAR 2011）。"}, {"year": 2015, "event_zh": "微软 Collet 等提出可流式的高质量自由视点视频：跟踪网格编码为 MPEG 流（SIGGRAPH 2015）。"}, {"year": 2016, "event_zh": "微软 Holoportation（UIST 2016）与 Fusion4D（SIGGRAPH 2016）实现房间级实时非刚性重建，并推送到 HoloLens/VR 端。"}, {"year": 2018, "event_zh": "Google 的 LookinGood 首次在实时性能捕捉中引入神经重渲染（SIGGRAPH Asia 2018）。"}, {"year": 2020, "event_zh": "ViVo（MobiCom 2020）提出可见性感知的移动体积视频流；MPEG V-PCC/G-PCC 标准趋于成熟（约 125:1 压缩）。"}, {"year": 2021, "event_zh": "Google 的 Project Starline 在 ACM TOG 发表：30–100 Mbit/s RGB-D 流，环回端到端 105.8 ms，65 英寸 8K 裸眼 3D 屏。"}, {"year": 2022, "event_zh": "VirtualCube 获 IEEE VR 2022 最佳期刊论文（6 台 Azure Kinect，多方会议视线一致）；YuZu（NSDI 2022）把神经超分引入体积流。"}, {"year": 2023, "event_zh": "Starline 推出电视尺寸新原型（更少摄像头 + AI）；NVIDIA 展示单摄像头的 AI 介导 3D 视频会议；ReRF（CVPR 2023）与 MetaStream（MobiCom 2023）发表。"}, {"year": 2024, "event_zh": "GPS-Gaussian（CVPR）、Tele-Aloha（SIGGRAPH）、3DGStream（CVPR）、QUEEN（NeurIPS）、V^3（SIGGRAPH Asia）相继发表，高斯溅射成为远程呈现与体积视频的主流表示；IMC 2024 首次测量 Vision Pro 空间 Persona；Quark（SIGGRAPH Asia 2024）实现 1080p/30 fps 的通用实时视图合成。"}, {"year": 2025, "event_zh": "Google Beam 发布，HP Dimension 商用（6 摄像头、60 fps、约 2.5 万美元）；Ha et al.（CVPR 2025）提出几何引导、时序一致的在线 3D 视频合成；VoluMe、LiveSplat、LiVo（CoNEXT 2025）发布；visionOS 26 重做 Persona。"}, {"year": 2026, "event_zh": "MPEG GSC 的 V-PCC 高斯 profile 进入 CDAM、G-PCC 方案进入 WD（第 153 次会议）；Mon3tr、ReVo、PackUV（CVPR）、CAGS（SIGGRAPH）、AirGS（INFOCOM）、NSTM（7 月）、Tele360（9 月）相继出现，前馈高斯远程呈现达到 2K、>25 FPS，但时序一致性和端到端时延仍是瓶颈。"}], "trends_zh": ["传感器正在去深度化。产业侧，Starline 的红外立体 pod 演变为 Google Beam 的 6 路 RGB 加 AI 体积模型；研究侧，Tele-Aloha（4 台 RGB）、Tele360（6 路未标定 RGB）、LiveStre4m（最少 2 路未标定 RGB）和 HiReFF 依靠几何基础模型的先验，逐步摆脱主动深度与精确标定。", "前馈的像素对齐高斯已成为实时默认表示，每帧重建时间在两年内从秒级降到毫秒级：3DGStream 约 12 s，QUEEN <5 s，LiveStre4m 70 ms，Tele360 35 ms（6 视图 2K）。但绝大多数方法仍逐帧独立处理、没有时序状态。", "体积和高斯内容越来越多地复用 2D 视频管道：V-PCC 图集、VideoRF 特征视频、V^3 和 PackUV 的 UV 图集、Tele360 的 split-byte H.265、LiVo 复用 WebRTC 与码率自适应编码器。标准化方面，MPEG GSC 的静态高斯编码已进入 CDAM/WD 阶段，动态高斯仍在探索。", "计算切分成为显式的设计维度，主要有五种：发送端渲染（VirtualCube，约 7 Mbps）、接收端图像域渲染（Starline 30–100 Mbps、Ha et al.）、传高斯图（Tele360 约 100 Mbps）、解码端前馈重建（DSGS、GS-SCNet）和参数驱动化身（Mon3tr <0.2 Mbps、Codec Avatars、FaceTime Persona）。", "网络与系统顶会大量进入这一领域：MobiCom（ViVo、MetaStream、Vega、NeVo）、NSDI（YuZu）、CoNEXT（LiVo）、INFOCOM（AirGS、Argus）。研究主题从点播转向双向直播会议，涵盖码率自适应、选择性 FEC、视场剔除和跨层时延分析；2026 年还出现了面向边缘设备（S²GS）和长时误差恢复（SoLAR）的高斯流工作。", "时序稳定性正在成为显式目标，已有做法包括：稳定性损失（VoluMe）、显式 TSDF 时序融合（Ha et al.）、测试时训练记忆（NSTM）和生成式插帧（LiveStre4m）。与此同时，Tele360 等系统级工作仍承认存在闪烁；DSGS 发现压缩本身也会改变视间和时序一致性。", "感知驱动的效率优化增多：眼动跟踪只渲染两个视点（Starline/Beam），注视点压缩把带宽降到约三分之一，光场屏的多视图共享渲染（扫掠平面，45 个视图 200+ FPS）。", "评估和社会维度开始受到重视：Starline 的行为学用户研究（手势 +43%，疲劳 −31%），GScomp-QA 等主观数据集指出客观指标对时序失真不敏感。2026 年还出现了体积流的隐私脱敏研究（Cloak of Invisibility / InViStream、ABE-VVS）。"], "open_problems_zh": ["玻璃到玻璃的时延预算。Starline 全链路为 105.8 ms，Tele-Aloha <150 ms，Mon3tr 约 80 ms；而 Ha et al. 渲染一个视图就约需 100 ms，Tele360 在客户端的端到端时延达 500–650 ms。目前缺少包含采集、编码、网络、解码、渲染和显示的完整时延分解；用一致的深度或 TSDF 驱动晚期重投影，让显示帧率与采集帧率解耦，这类方案也尚未被研究。", "时序状态与码率的联合设计。如果把时序 TSDF、静态区域状态或高斯记忆写进传输格式，静态内容只需发送一次，动态内容只流式发送残差，就可能同时降低码率和闪烁。目前还没有工作对码率、失真和闪烁做联合优化，MPEG GSC 在动态高斯与时序一致性上也仍处于探索阶段。", "编码器在环的 RGB-D 渲染。真实系统中深度都经过有损编码（Starline 用 HEVC 压缩深度）并可能丢包（ReVo），而压缩对时序一致性的影响是非线性的。TSDF 融合、视图混合网络与编解码器如何联合训练，深度码率如何按新视角可见性和闪烁影响来分配，都是空白。", "视点自适应的多相机流。对当前视点真正有用的只有最近的 K 台相机，Starline 甚至只需双眼两个视点，但系统通常仍传输全部 N 路流。需要研究：结合头动预测做相机选择，按相机和区域分配码率（类似 360 视频的 tiling 或 LiVo 的视场剔除），以及在某路流丢失时利用时序状态做隐藏。", "多视图显示的计算摊销。光场屏和柱镜屏需要 32–45 个以上的视图，而逐视图的神经渲染成本随视图数线性增长。如何在相邻显示视图之间共享 splat、TSDF 光线步进结果和混合特征，同时保持视间和时序一致，尚无实时方案。", "真实性与带宽之间的混合方案。化身路线稳定、廉价，但不够真实；图像渲染路线真实，但在去遮挡区域和手部容易闪烁。可以考虑用个人高斯化身先验来补洞和正则化几何，同时保留图像渲染的保真度，并在带宽不足时从 RGB-D 流平滑回退到参数传输。", "基准与感知指标。目前没有一个远程呈现基准同时具备：带真实传感器深度的多视图 RGB-D、分钟级序列、留出视图、头部跟踪的观看轨迹，以及时序感知指标。也缺少把闪烁、时延与共在感、对话行为联系起来的主观研究（GScomp-QA 显示 18 种客观指标都不充分）。", "多方会议的可扩展性、隐私与安全。多方会议中每个接收者需要不同的视点，计算应放在发送端、云端还是接收端，尚无形式化的优化方法。此外还有源端隐私脱敏（InViStream），以及针对高斯渲染计算量的攻击防护，这些都还处于起步阶段。"], "relation_to_anchors_zh": "两篇锚点论文都处在远程呈现链路中\\\"接收端新视角合成\\\"这一环。Quark（Google，SIGGRAPH Asia 2024）从稀疏 RGB 图像或视频流前馈生成分层深度图（LDM），再经迭代的 render-and-refine 精修，在单块 A100 上实现 1080p、30 fps（约 33 ms/帧）的通用实时视图合成。Ha et al.（KAIST 与 Meta，CVPR 2025）面向已标定的多相机 RGB-D：先把最近 K 个视图的像素尺寸高斯前向 splat 到目标视点，再用图像域 TSDF 融合经时序滤波的深度，最后用 U-Net 混合，在 V100 上约 100 ms/帧，重点解决多视图和时序一致性。本章讨论的是围绕它们的系统部分：采集、编码、传输、显示和时延预算。\n\n从谱系上看，Ha et al. 是 Starline 的神经化继承者（Starline 的做法是多路 RGB-D、接收端基于图像的深度融合、法向加权混合）；Maimone & Fuchs 和 Holoportation/Fusion4D 的时序融合思想也延续到了它的 TSDF 中。Quark 则对应 Starline 到 Beam 的产业转向，即去掉深度传感器、改用纯 RGB 加学习到的几何。Quark 与 Beam 同出 Google，但 Beam 实际使用的模型未公开。Quark 已被 LiveStre4m 和 Google 的 NSTM 等 2026 年流式新视角合成工作引用并延伸。两篇论文与 Tele-Aloha、Tele360 等前馈像素对齐高斯系统属于同一技术族。区别在于，Tele360 明确承认没有时序聚合、会闪烁；Ha et al. 用显式 TSDF 状态来弥补这一点，NSTM 则用 TTT 记忆。\n\n系统层面，本领域给两篇论文带来了四方面的硬约束和机会。（1）时延：Starline 全链路环回为 105.8 ms，Tele-Aloha <150 ms，Mon3tr 约 80 ms；而 Ha et al. 渲染单个视图就约 100 ms，Quark 的 33 ms 也只对应一个视点。Starline/Beam 的眼动跟踪只需渲染 2 个视点，光场或柱镜屏却需要 32–45 个视点（LentiAvatar、光场辐射场渲染），所以多视图摊销和晚期重投影是落地时绕不开的问题。（2）码率：两篇论文都假设接收端拿到高质量的多路流，但真实系统里深度要经过有损编码（Starline 用 HEVC 压缩深度），还可能丢包。Sandwiched RGB-D、ReVo、DSGS 都表明，编码和丢包会显著影响几何以及视间、时序一致性。编码器在环的训练，以及借鉴 ViVo/LiVo、按新视角可见性来分配码率和剔除内容，都还没有与这两类渲染器结合。（3）时序评估：据 Ha et al. 自己的消融实验，去掉 TSDF 后 PSNR 几乎不变（31.17 vs 31.16 dB）。这与 GScomp-QA 等工作发现的\\\"客观指标对时序失真不敏感\\\"相呼应，说明需要面向远程呈现的感知时序指标和主观研究，才能证明时序状态的价值。（4）表示与传输一体化：如果把 Ha et al. 的时序 TSDF 和静态区域状态，或 Quark 的分层表示，直接作为传输格式（静态部分只发一次，动态残差流式发送；类似 DSGS、GS-SCNet 那样在解码端重建），就有望同时降低码率和闪烁。这恰好对应 MPEG GSC 仍在探索的动态高斯和时序一致性编码空白，也是锚点方法走向真实远程呈现系统最自然的衔接点。"}, {"key": "avatars", "area_title_zh": "人体化身与人体表演捕捉：面向远程临场的“化身式”路线", "overview_zh": "“人”是3D远程临场中最核心的内容，也是人眼最挑剔的内容。怎样把远端的人逼真、实时地呈现在本地，到2026年已分成两条路线。第一条是“采集/IBR式”：Quark、Ha et al.、GPS-Gaussian、Tele-Aloha和Google Beam每一帧都用多相机实时拍摄真人，再用feed-forward网络或几何引导的IBR合成新视角，所见即所拍。第二条是“化身（avatar）式”：以Meta Codec Avatars和Apple Persona为代表，先用影棚、手机扫描乃至单张照片为用户建好一个可驱动的个性化3D模型；通话时只从头显相机、第一人称相机或音频中估计出紧凑的驱动信号（表情潜码、姿态、视线）并传输，由接收端在本地解码渲染。采集式真实可信，手中物品和临时装扮都能如实呈现，但依赖多相机、带宽大，戴头显时人脸会被遮挡。化身式带宽极低，天然绕开HMD遮挡，时序也稳定；代价是受先验限制，会有“幻觉”、身份可信度不足，模型之外的内容也无法呈现。本章梳理化身式路线，以及它与人体表演捕捉（performance capture）的交叉。\n\nMeta Reality Labs的Codec Avatars是化身式路线的主线。Deep Appearance Models（2018）用深度VAE从多视角影棚数据联合学习面部几何和视角相关纹理，确立了“发送端编码潜码、接收端解码渲染”的通信范式。MVP（2021）用可移动的体素原语兼顾体渲染的完整性与效率，头发这类细薄结构也能表达。Pixel Codec Avatars（2021）让5个照片级头像同时在Quest 2上实时运行。2022年的Authentic Volumetric Avatars from a Phone Sc
