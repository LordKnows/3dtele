r）；大量后续新视角视频方法以它为底座。", "priority": "should"}, {"title": "MVDream: Multi-view Diffusion for 3D Generation", "authors": "Yichun Shi et al.", "year": 2023, "venue": "ICLR 2024", "url": "https://arxiv.org/abs/2308.16512", "citations": 1094, "role_zh": "把 2D self-attention 膨胀为跨视图的 3D self-attention，联合生成 4 张正交视图，并用于多视图 SDS，缓解了多面（Janus）问题。", "priority": "should"}, {"title": "ReconFusion: 3D Reconstruction with Diffusion Priors", "authors": "Rundi Wu et al.", "year": 2023, "venue": "CVPR 2024", "url": "https://arxiv.org/abs/2312.02981", "citations": 405, "role_zh": "训练以 PixelNeRF 特征为条件的新视角扩散模型，在 3、6、9 视图的重建中正则 Zip-NeRF 的未观测视角，是“用扩散先验正则重建”的代表作。", "priority": "should"}, {"title": "Denoising Diffusion Implicit Models", "authors": "Jiaming Song et al.", "year": 2020, "venue": "ICLR 2021", "url": "https://arxiv.org/abs/2010.02502", "citations": 13571, "role_zh": "训练目标与 DDPM 相同的非马尔可夫采样，快 10–50 倍并支持确定性采样，是所有少步采样器的起点。", "priority": "should"}, {"title": "Classifier-Free Diffusion Guidance", "authors": "Jonathan Ho, Tim Salimans", "year": 2022, "venue": "NeurIPS 2021 Workshop on Deep Generative Models（arXiv 2022 完整版）", "url": "https://arxiv.org/abs/2207.12598", "citations": 7173, "role_zh": "不需要额外分类器的条件增强：训练时随机丢弃条件，让同一个网络同时学会有条件和无条件预测，推理时按权重 w 外推两者之差。文本、图像、相机条件的扩散模型几乎都依赖它；本专题第 2 条要点里的 \\(\\hat\\epsilon\\) 公式和 DreamFusion 的 w=100 都出自这里。", "priority": "should"}, {"title": "Novel View Synthesis with Diffusion Models", "authors": "Daniel Watson et al.", "year": 2022, "venue": "ICLR 2023", "url": "https://arxiv.org/abs/2210.04628", "citations": 351, "role_zh": "3DiM：第一个位姿条件的图像到图像扩散新视角合成模型，完全不含显式 3D 表示。它提出随机条件化（每个去噪步随机选一张已有视图作条件）来提高多视一致性，并提出“用生成视图训练一个神经场、再测其一致性”的 3D 一致性评分。Zero-1-to-3、CAT3D 这条“相机条件扩散”路线从这里开始。", "priority": "optional"}, {"title": "Adversarial Diffusion Distillation", "authors": "Axel Sauer et al.", "year": 2023, "venue": "ECCV 2024", "url": "https://arxiv.org/abs/2311.17042", "citations": 876, "role_zh": "用分数蒸馏加对抗损失，把大模型压到 1–4 步，4 步即可追平 SDXL。Turbo 系列单步模型出自这条线，Difix 的底座 SD-Turbo 即是其一。", "priority": "optional"}, {"title": "From Slow Bidirectional to Fast Autoregressive Video Diffusion Models", "authors": "Tianwei Yin et al.", "year": 2024, "venue": "CVPR 2025", "url": "https://arxiv.org/abs/2412.07772", "citations": 413, "role_zh": "CausVid：用 DMD 把 50 步双向视频扩散蒸馏为 4 步因果自回归生成器，配合 KV cache，首帧 1.3 s、之后 9.4 FPS；Self Forcing、RealCam 等流式视频扩散建立在它之上。", "priority": "optional"}], "prereqs": ["l-diffusion", "l-attention", "l-encoding", "l-iterative", "n-nerf", "n-3dgs", "n-generalizable", "v-temporal"], "relation_to_anchors_zh": "（1）两篇锚点共同回避的问题。Quark 明确把“单图、单目、生成式、人体先验类方法”划为另一类问题，不做比较。它的输出是输入像素的凸组合，任何输入都没看到的区域只能出错：在 Mip-NeRF360 和 Deep Blending 上，失败方式是硬边而不是模糊，作者自己也承认需要更好的视角选择或全局几何。Ha et al. 同样没有使用任何生成先验，而是用 4 层 U-Net 同时输出背景图 I_BG 和背景权重 w_BG，其中 L_Mask 只用空洞的二值掩码监督。本专题回答的正是这个被回避的问题：去遮挡区域的内容从哪里来。（2）概念对照。Quark 的射线方向编码对应 CAT3D 的 raymap；Quark 的 One-to-many attention（注意力部分的开销对视角数接近常数，编码与逐视角 update 仍是线性）对应 MVDream/CAT3D 的 3D self-attention（代价随 token 数平方增长）；Quark 的 5 次 learned render-and-refine，以及“减少迭代只掉约 0.08 dB”的消融，对应 DDIM/ADD/CausVid 的少步蒸馏；Quark 在 288×512 上求解、由 IBR 补全 1080p 细节，对应 LDM 在 64×64 潜空间求解、由 VAE 解码补回细节。（3）时间预算对照。Quark 的重建加渲染为 32.2 ms（A100），Ha et al. 约 39 ms（TensorRT，不含立体深度）；而单步 Difix 就需要 76 ms（A100），CausVid 首帧 1.3 s，RealCam 首帧 0.72–1.15 s。所以 2026 年现实可行的路线是“几何/IBR 主干 + 可选的单步生成式修补”，而不是端到端生成。（4）团队动向。Quark 作者参与的 Scaling Transformer-Based NVS（ICCV 2025，Nair 等；作者含 Quark 的 Kaza、Luo、Lombardi）用扩散模型生成的合成数据扩充 NVS 训练集，并提出 token disentanglement 来抑制合成数据中的伪影；在这里扩散是“数据引擎”，而不是渲染器。Ha et al. 的后续竞品 LiveStre4m 用扩散 Transformer 在关键帧之间做时间插值，以换取时序稳定。", "debates_zh": ["忠实性与完整性之争：远程临场能不能显示“生成出来的”对方？生成内容可能改变表情、口型或身份细节。一派主张只在确认没有观测的区域生成，并显式标注不确定度；另一派认为感知质量优先，理由是 FID/LPIPS 的改善很明显。", "蒸馏回 3D 还是逐帧后处理：Difix3D+ 表明，把修复结果蒸馏回持久的 3D 表示可以保持多视一致；推理时逐帧修复更快，但可能在视角和时间上不一致。Quark、Ha et al. 这类每帧丢弃表示的方法只能选后者。", "要不要显式 3D：CAT3D、ReconFusion 坚持“生成视图 + 3D 重建”；Stable Virtual Camera、FrameCrafter 等直接用视频或多视图扩散输出新视角，几何只隐含在网络里。后一种做法在大视角变化下的一致性和可控性仍有争议。", "SDS 路线还有没有价值：SDS 的 mode-seeking 带来过饱和、多面（Janus）等问题，2024 年后“多视图生成 + 重建”占了主导；不过“分数蒸馏”又以另一种身份回到了 ADD、DMD 等少步蒸馏方法中。", "指标之争：PSNR/SSIM 会惩罚任何与真值不同的合理生成，FID/LPIPS 又可能奖励“看起来真实但其实错误”的内容。临场场景更需要时间闪烁、身份一致性指标和人眼评测。"], "open_questions_zh": ["能否在 Quark 量级的约 30 ms 单卡预算内完成单步、时间一致、身份忠实的去遮挡补全？目前最快的单步修复器 Difix 在 A100 上仍需 76 ms，而且没有时间条件。", "怎样做“受观测约束的生成”：只在所有输入都看不到的像素上采样，其余像素严格服从 IBR 结果，同时输出逐像素不确定度，供渲染器混合使用？", "流式因果视频扩散的长时漂移和首帧延迟（0.7–1.3 s）怎样才能压进对话可接受的端到端 250 ms 以内？", "双目与多视点一致：左右眼各自独立采样会产生双目不一致，视差冲突直接导致不适。扩散先验怎样与立体约束结合？", "训练数据：大规模、带标定的多视角人像视频（而不是 Objaverse 物体或单目网络视频）依然稀缺。生成先验在人脸、头发、手部上的可信度如何量化？"], "resources": [{"title": "What are Diffusion Models? (Lilian Weng)", "url": "https://lilianweng.github.io/posts/2021-07-11-diffusion-models/", "type": "blog", "note_zh": "从前向与反向过程、DDIM、条件生成一直推导到加速采样，公式记号与 DDPM 原文一致，适合配合本专题公式 1、2 精读。"}, {"title": "CVPR 2022 Tutorial: Denoising Diffusion-based Generative Modeling: Foundations and Applications", "url": "https://cvpr2022-tutorial-diffusion-models.github.io/", "type": "tutorial", "note_zh": "CVPR 教程，提供讲义和录像：基础理论（DDPM、分数匹配、SDE）、加速与条件化，以及在图像编辑、3D 等方向的应用。"}, {"title": "The Annotated Diffusion Model (Hugging Face)", "url": "https://huggingface.co/blog/annotated-diffusion", "type": "tutorial", "note_zh": "用 PyTorch 逐行实现 DDPM，可以直接跑通前向加噪与噪声预测训练，把公式变成代码。"}, {"title": "threestudio: A unified framework for 3D content generation", "url": "https://github.com/threestudio-project/threestudio", "type": "code", "note_zh": "统一实现了 DreamFusion（SDS）、Zero-1-to-3、ProlificDreamer 等 3D 生成方法（MVDream 以扩展形式提供），适合动手对比“扩散作为损失”的各种变体。"}]}, {"id": "a-temporal-video", "title_zh": "视频时间一致性方法", "title_en": "Temporal consistency methods for video", "overview_zh": "很多视频处理都是逐帧做的：逐帧估计深度、逐帧做新视角合成、逐帧风格化。每一帧单独看都不错，连起来播放却在闪烁。原因在 v-temporal 中讲过：逐帧误差在帧间相互独立，而人眼对时间上的变化极其敏感。时间一致性方法要解决的问题可以这样表述：输出视频在时间上的变化，应当完全由输入（或真实场景）的变化来解释，不应多出额外的抖动；同时不能为了稳定而牺牲单帧质量，例如把所有帧都变得一样模糊。这里有两个容易被忽视的约束。第一，稳定和响应是一对矛盾：用的历史越多越稳，但对真实变化的反应越慢，会留下拖影。第二，对临场这类在线应用，方法必须是因果的（只能看过去）且低延迟，很多离线方法因此不能直接使用。\n\n第一类方法是事后处理，把逐帧结果“修”稳。Bonneel et al.（SIGGRAPH Asia 2015）提出“盲”时间一致性：不管前面用的是什么算法，只拿原始视频和逐帧处理后的视频，在梯度域求解一个屏蔽泊松方程，让输出的空间细节跟随当前的处理结果，整体色调跟随用光流 warp 过来的上一帧输出。Lai et al.（ECCV 2018）把它变成一个带 ConvLSTM 的前馈网络：训练时用 FlowNet2 光流构造短期和长期时间损失，测试时不再需要光流，1280×720 下超过 400 fps。Deep Video Prior（NeurIPS 2020）甚至不需要训练集，只在单个视频上训练一个 CNN，利用“网络先学会一致的内容、后学会闪烁”这一现象。2023 年的盲去闪烁方法用神经图集作为一致的参考，再用神经滤波去掉图集本身的瑕疵。\n\n第二类方法直接产出时间一致的几何，这与三维临场关系最密切。Consistent Video Depth Estimation（SIGGRAPH 2020）在测试时微调单图深度网络，让它满足 COLMAP 位姿和光流给出的多帧几何约束，一段 244 帧的视频在 4 张 Tesla M40 上要 40 分钟；Robust CVD（CVPR 2021）去掉了对已知位姿的依赖。在线方法则把时间信息做进网络：ST-CLSTM（ICCV 2019）用卷积 LSTM 做实时视频深度，并提出了 TCC 指标（Ha et al. 的 TCC 直接引用它）；ESTDepth（CVPR 2021）用极线时空 Transformer 关联相邻帧的深度，Ha et al. 的 SDT、SDV 指标沿用它的做法；CODD（WACV 2023）在逐帧立体网络之后接运动网络和融合网络，在线聚合历史深度，640×480 下 25 fps；DynamicStereo（CVPR 2023）用分解注意力跨帧汇聚信息，并发布了 Dynamic Replica 数据集。2025 年，Video Depth Anything 在 Depth Anything V2 上加入时空头和时间梯度匹配损失，能处理几分钟长的视频，小模型在 A100 上每帧 9.1 ms（518×518）；FlashDepth 用 Mamba 循环层，在 A100 上以 24 fps 处理 2044×1148 的流式视频；Stereo Any Video 和 PPMStereo 把同样的思路用到视频立体匹配上。\n\n第三条线来自实时图形学和临场系统本身。实时渲染中的时间抗锯齿（TAA）把上一帧结果按运动向量重投影，裁掉与当前邻域不符的历史，再做指数滑动平均（见 v-temporal）。Montage4D 用同样的指数平均（λ=0.05）平滑纹理混合权重，抑制 Holoportation 画面中的纹理闪烁。Fusion4D 提出“时间信息不得降低观测数据质量”的原则（见 a-human-capture）。到 2025–2026 年，新视角合成开始内置时间机制：Ha et al. 对输入深度做差分掩码滤波并回灌上一帧深度；Fuse-and-Refine 与 Online Neural Space Time Memory 维护可学习的记忆；LiveStre4m 用扩散 Transformer 在关键帧之间插值来保证稳定。\n\n截至 2026 年 9 月的格局是：离线场景下，基于视频扩散或测试时优化的方法一致性最好，但很慢（VDA 论文在 A100、518×518 下测得 DepthCrafter 每帧约 910 ms）；在线场景下，“单帧基础模型 + 轻量时序模块 + 时间损失”已经能实时运行（VDA-S、FlashDepth），但作者仍承认有残余闪烁。对两篇锚点来说：Quark 完全没有时间机制，并在 Sec. 4.1 和 Sec. 4.3 自承会闪烁；Ha et al. 只在输入深度端处理时间一致性，网络没有时间损失，也从未在视频上训练。学完本专题，就能判断这两篇论文的闪烁分别该用哪一类方法、在哪个环节去补。", "key_ideas": [{"name_zh": "一致性怎么量：比较“时间变化”，而不是逐帧误差", "explain_zh": "逐帧 PSNR 对闪烁不敏感：一个像素值在真值附近来回小幅跳动，PSNR 可以很高，看起来却在闪。所以时间指标比较的都是“变化”。(1) 光流 warping 误差（Lai et al. 推广的做法）：用光流把第 t+1 帧 warp 到第 t 帧，在非遮挡区域（二值掩码）上计算均方差，见公式 2 第二式；它依赖可靠的光流，遮挡区只能排除在外。(2) tOF 与 tLP（TecoGAN，ACM TOG 2020）：分别比较输出与真值在相邻帧之间的光流差和 LPIPS 差，即 ‖OF(b_{t−1},b_t)−OF(g_{t−1},g_t)‖₁ 和 ‖LP(b_{t−1},b_t)−LP(g_{t−1},g_t)‖₁，其中 b 为输出、g 为真值。(3) TCC：用 SSIM 比较输出帧差图和真值帧差图（公式 3），由 ST-CLSTM（Zhang et al., ICCV 2019）为视频深度提出（同时提出基于光流的 TMC）；Ha et al. 直接引用 ST-CLSTM，并把它改造用于彩色图像。(4) SDT 与 SDV：单帧 L1 误差在所有帧、所有视角上的标准差，Ha 称沿用 ESTDepth（Long et al., CVPR 2021）的做法，分别衡量时间一致性和视角一致性。(5) STED：Soundararajan 与 Bovik 提出的时空熵差视频质量指标（ST-RRED），在小波域比较参考与待测视频（及其帧差）的局部熵，Ha 把它作为主要的时间指标。有两个陷阱要记住：一个完全静止的输出在“变化”指标上也可能很好看，所以时间指标必须和保真度指标一起报告；这些指标通常只在固定相机上计算，Ha 的时间指标都在固定的留出相机上算，头动加场景动的组合情形没有被测量。"}, {"name_zh": "梯度域盲一致性：低频跟历史，高频跟当前", "explain_zh": "Bonneel et al. 的观察是：逐帧处理造成的闪烁大多是低频的（整体亮度、色调随帧跳动），而处理结果中真正有价值的多是高频细节（边缘、纹理）。于是他们在梯度域里求解：输出的梯度要接近当前处理结果的梯度，输出本身要接近 warp 过来的上一帧输出（公式 1）。这个能量的欧拉–拉格朗日方程是一个屏蔽泊松方程，可以高效求解。当权重为常数 λ₀ 时，傅里叶域的解给出了清晰的解释：空间频率高于某个交叉频率的成分主要来自当前帧，低于它的来自历史，直流分量（整体亮度）完全继承历史。论文还专门与普通时间平滑 O_n=(P_n+μ₀·warp(O_{n−1}))/(1+μ₀) 对比：后者对所有频率施加同样强度的约束。权重 w(x) 由原始视频本身的 warp 误差决定：原始视频在某处 warp 不准（遮挡、对应失败），就降低那里的时间约束。帧间对应可以用光流，也可以用更快的 PatchMatch，作者按任务在两者之间选择。它的局限来自两个假设：处理结果的梯度可信（对风格化这类大幅改变梯度的操作，结果会过度平滑），以及对应可靠（严重遮挡处会失败）。Lai et al. 后来改用学习方法。"}, {"name_zh": "学习式后处理：循环网络、时间损失与深度视频先验", "explain_zh": "Lai et al.（ECCV 2018）训练一个与具体任务无关的“稳定器”：输入原始帧 I_{t−1}、I_t，当前处理结果 P_t 和上一时刻的输出 O_{t−1}，网络（含一层 ConvLSTM）输出 O_t。它是因果的，可以逐帧在线运行。训练损失有三项：VGG relu4-3 上的感知损失，让 O_t 在内容上像 P_t；短期时间损失，让 O_t 与光流 warp 过来的 O_{t−1} 一致（公式 2 第一式）；长期时间损失，让每一帧都与 warp 过来的第 1 帧输出一致，训练序列长 T=10。遮挡掩码 M=exp(−α‖I_t−Î_{t−1}‖²)（α=50）由原始视频的 warp 残差计算。光流只在训练时使用，测试时 1280×720 下超过 400 fps。Deep Video Prior（NeurIPS 2020）走另一条路：不需要任何训练集，直接在一个视频上训练一个 CNN，把原始帧映射成处理后的帧。网络倾向于先拟合各帧一致的部分、后拟合闪烁，所以及时停止训练就能得到稳定的结果；对于“同一物体在不同帧被处理成不同颜色”这类多模态不一致，它用迭代重加权训练挑出主导模式。它需要看完整段视频，不能在线使用。"}, {"name_zh": "测试时优化：让几何在整段视频上自洽", "explain_zh": "Consistent Video Depth Estimation（CVD）的出发点是：单图深度网络每帧都能“猜”出一个合理的深度，但帧与帧之间的尺度和细节并不一致；多视几何能给出严格约束，只是在无纹理区域和运动区域不完整。CVD 先用 COLMAP 求出每帧的相机位姿，再用光流在帧对之间建立像素对应（为避免 O(N²) 个帧对，它分层采样，只保留 O(N) 对），然后在测试时微调深度网络，使两类损失下降：空间损失（用深度和位姿把帧 i 的像素投影到帧 j 后，应当落在光流给出的对应位置上）和视差损失（投影过去的视差应当与帧 j 在该处估计的视差一致）。网络权重在所有帧之间共享，所以一处的约束会传播到别处。一段 244 帧的视频在 4 张 Tesla M40 上约需 40 分钟，并且只能处理中等程度的动态。Robust CVD（CVPR 2021）不再需要输入位姿：先用灵活的形变样条做低频的大尺度对齐，再用几何感知的深度滤波对齐高频细节，能处理手机拍摄中的抖动、运动模糊和卷帘快门。这类方法给出的启示是：时间一致性最可靠的来源，是在整段时间里共享的 3D 几何。Ha et al. 的 image-based TSDF 是一个只在当前帧、只在目标视角中共享的几何，所以它主要改善视角一致性；时间上的共享只剩上一帧深度的回灌。"}, {"name_zh": "在线时序网络：循环、对齐融合与窗口注意力", "explain_zh": "要在线且实时，就得把时间信息直接放进前馈网络，并用视频数据和时间损失训练。按结构可分三种。(1) 循环：ST-CLSTM（ICCV 2019）在逐帧深度网络上加卷积 LSTM，并用对抗式的时间一致性损失训练，可实时运行；FlashDepth（ICCV 2025）在 Depth Anything V2 的 DPT 解码器之后、最终卷积头之前加入 Mamba 循环层，在 A100 上以 24 fps 处理 2044×1148 的流式视频，作者承认主要局限是残余闪烁。(2) 对齐 + 融合：CODD（WACV 2023）在逐帧立体网络之后接一个运动网络，为每个像素预测一个 SE(3) 变换，把历史观测对齐到当前帧，再由融合网络聚合当前深度与历史深度，640×480 下 25 fps，时间指标最多提升 31%。它在结构上就是 Ha et al. 时间滤波的“学习版”：Ha 依赖相机固定，用颜色差分掩码代替运动网络，用固定的指数平均代替融合网络。(3) 窗口注意力 + 关键帧：DynamicStereo（CVPR 2023）在时间、空间和左右视图上做分解注意力；Video Depth Anything（CVPR 2025）在 DPT 头中插入时间注意力层，用时间梯度匹配损失训练（公式 3）。推理时它每次处理 N=32 帧，其中 T_o=8 帧与上一段重叠，T_k=2 帧是每隔 Δk=12 帧往回取的关键帧，用来继承尺度和偏移，因此能处理几分钟长的视频。延迟（A100，518×518）：VDA-S 每帧 9.1 ms，VDA-L 67 ms，基于视频扩散的 DepthCrafter 为 910 ms。"}, {"name_zh": "实时图形学的时间累积：重投影、拒绝历史、指数平均", "explain_zh": "TAA 和实时降噪器的做法可以概括为三步：用运动向量把上一帧的累积结果重投影到当前像素；把重投影得到的历史值裁剪到当前像素邻域的颜色范围内，拒绝过时或被遮挡的历史；与当前观测做指数滑动平均（常用权重 α≈0.1，相当于约 19 帧的等效样本数，见 v-temporal）。这三步分别对应前面各类方法中的光流 warp、遮挡掩码和时间损失，只是全部手工设计，每帧几乎没有额外开销。临场系统中的例子：Montage4D 对每个顶点的纹理混合权重做指数平均 T(t)=(1−λ)T(t−1)+λT(t)，λ=0.05（时间常数约 20 帧），以消除视角切换时的纹理闪烁（详见 a-telepresence-sys）。Ha et al. 的 Eq. (1)–(2) 是同一框架的特例：输入相机固定，所以重投影是恒等映射；“拒绝历史”由颜色差分掩码实现；指数平均的新数据权重 M 至少为 0.6，历史最多占 40%。按 v-temporal 中的公式，M=0.6 时相当于只平均了约 2.3 帧，远弱于 TAA，但拖影也短得多。"}, {"name_zh": "新视角合成特有的闪烁：输入切换与视角跳变", "explain_zh": "新视角合成的闪烁除了来自逐帧误差，还有一个特殊来源：目标视点移动时，参与合成的输入视角集合会切换。Quark 每帧取离目标最近的 8 个输入视角（训练时从最近的 16 个中随机抽 8 个），作者在 Sec. 4.1 指出切换会造成明显闪烁，输入之间曝光差异大时尤其严重。Ha et al. 取最近的 K 个（DyNeRF 上 K=4），并在局限中承认 K 集合变化时 TSDF 深度仍会小幅跳变。这类闪烁即使场景完全静止也会出现，时间滤波对它无能为力，因为变化来自视点而不是时间。可行的对策有：像 ULR（见 i-blending）那样，让每个输入视角的权重随角度差连续衰减到 0，而不是硬性只取前 K 个；对输入选择加滞回，避免在边界附近来回切换；对混合权重本身做时间平滑（Montage4D）；做好输入视角之间的颜色和曝光标定。更彻底的办法是改用与视点无关的持久表示（4D 高斯，见 a-dynamic-4d），让不同视点看到的是同一个几何。Ha 的 SDV 指标和 EPI 可视化衡量的正是这一类视角一致性。"}], "equations": [{"tex": "O_n=\\arg\\min_{O}\\int\\big\\lVert\\nabla O-\\nabla P_n\\big\\rVert^{2}+w(\\mathbf{x})\\,\\big\\lVert O-\\mathrm{warp}(O_{n-1})\\big\\rVert^{2}\\,d\\mathbf{x},\\quad w(\\mathbf{x})=\\lambda\\,e^{-\\alpha\\lVert V_n-\\mathrm{warp}(V_{n-1})\\rVert^{2}};\\qquad \\mathcal{F}(O_n)=\\frac{4\\pi^{2}\\xi^{2}\\,\\mathcal{F}(P_n)+\\lambda_0\\,\\mathcal{F}\\big(\\mathrm{warp}(O_{n-1})\\big)}{4\\pi^{2}\\xi^{2}+\\lambda_0}", "explain_zh": "Bonneel et al. 的梯度域盲一致性（论文 Eq. 1a–1b 及其频域分析）。直觉：输出的“细节”（梯度）来自当前处理帧，输出的“底色”（数值本身）来自上一帧输出。符号：V_n 是原始输入视频的第 n 帧；P_n 是逐帧处理后的第 n 帧（会闪）；O_n 是要求的输出；warp(·) 表示用原始视频上估计的对应关系（光流或 PatchMatch）做后向 warp（见 d-flow）；∇ 是空间梯度；w(x) 是逐像素的时间约束权重，λ 控制整体强度，α 表示对 warp 的信任程度：原始视频在 x 处的 warp 残差大（遮挡或对应出错），w 就小，输出更多地听当前帧的。最小化后得到屏蔽泊松方程 −ΔO_n+wO_n=−ΔP_n+w·warp(O_{n−1})。当 w 取常数 λ₀ 时，做傅里叶变换 𝓕 得到第二式，ξ 是空间频率：频率高时 4π²ξ² 占优，输出跟随 P_n；频率低时 λ₀ 占优，输出跟随历史；ξ=0（整体亮度）完全取自历史。数值例：以像素为长度单位、取 λ₀=0.01，交叉频率 ξ_c=√λ₀/(2π)≈0.016 周期/像素，即周期约 63 像素。在 1080p 画面中，大于约 63 像素的结构（整体亮度起伏、大片色偏，正是典型的闪烁）继承自上一帧，更细的纹理取自当前帧。对比 Ha et al. 的深度指数平均：它对所有空间频率都用同一个权重 M 混合，正是 Bonneel 论文中拿来对比的“普通时间平滑”，不区分“该稳定的低频”和“该跟随的细节”。"}, {"tex": "\\mathcal{L}_{st}=\\sum_{t=2}^{T}\\sum_{i=1}^{N}M^{(i)}_{t\\Rightarrow t-1}\\big\\lVert O^{(i)}_t-\\hat{O}^{(i)}_{t-1}\\big\\rVert_1,\\quad M_{t\\Rightarrow t-1}=\\exp\\!\\big(-\\alpha\\lVert I_t-\\hat{I}_{t-1}\\rVert_2^{2}\\big);\\qquad E_{\\mathrm{warp}}(V_t,V_{t+1})=\\frac{\\sum_{i}M^{(i)}_t\\,\\lVert V^{(i)}_t-\\hat{V}^{(i)}_{t+1}\\rVert_2^{2}}{\\sum_i M^{(i)}_t}", "explain_zh": "Lai et al. 的短期时间损失（训练用）和光流 warping 误差（评测用）。直觉：把上一帧输出沿光流搬到当前帧，二者在“能对上”的像素上应该相同。符号：O_t 是网络在第 t 帧的输出；Ô_{t−1} 是用光流 F_{t⇒t−1}（FlowNet2 在原始帧上估计）warp 到第 t 帧的上一帧输出；i 遍历 N 个像素；M_{t⇒t−1} 是软可见性掩码，由原始帧 I_t 与 warp 后的 Î_{t−1} 之差计算，α=50，像素值范围为 [0,1]；T=10 是训练序列长度。长期损失把 Ô_{t−1} 换成 warp 过来的第 1 帧输出。第二式中 V 是被评测的视频，V̂_{t+1} 是用光流 warp 到第 t 帧的第 t+1 帧，M_t∈{0,1} 是用遮挡检测得到的二值非遮挡掩码；整段视频的误差是所有相邻帧对的平均。数值例：某像素 RGB 三个通道的 warp 残差都是 0.05，则 ‖·‖²=3×0.0025=0.0075，M=exp(−0.375)≈0.69，时间约束基本保留；若三个通道的残差都是 0.2（遮挡或新出现的物体），‖·‖²=0.12，M=exp(−6)≈0.0025，约束几乎关闭。对照 Ha et al. 的 M=min(|ΔI|/0.7+0.6, 1)：同样由原始颜色差决定“信历史多少”，但 Ha 比较的是同一像素位置（相机固定，无需光流），而且无论多么静止，都至少取 60% 的新数据。"}, {"tex": "\\mathrm{TCC}=\\frac{1}{T-1}\\sum_{t=1}^{T-1}\\mathrm{SSIM}\\big(|\\hat{I}_t-\\hat{I}_{t+1}|,\\ |I_t-I_{t+1}|\\big),\\qquad \\mathcal{L}_{\\mathrm{TGM}}=\\frac{1}{N-1}\\sum_{i=1}^{N-1}\\Big\\lVert\\,|d_{i+1}-d_i|-|g_{i+1}-g_i|\\,\\Big\\rVert_1", "explain_zh": "两个式子说的是同一件事：预测的帧间变化应该等于真值的帧间变化。第一式是 Ha et al. Eq. (8) 中的 TCC（Ha 直接引用 ST-CLSTM 并改造用于彩色图像），用作评测指标；第二式是 Video Depth Anything 的时间梯度匹配损失（TGM），用作训练目标。符号：Î_t 是渲染出的第 t 帧，I_t 是真值帧，|Î_t−Î_{t+1}| 是逐像素的帧差图；SSIM 比较两张帧差图的结构相似度（见 v-metrics），TCC 越接近 1 越好；T 是帧数。d_i、g_i 分别是窗口内第 i 帧经过尺度和偏移对齐后的预测深度与真值深度；N 是窗口长度（VDA 训练时为 32）；只在 |g_{i+1}−g_i|<0.05 的像素上计算，以避开边缘和快速运动。注意 TGM 比较的是同一像素位置，而不是光流对应点，所以不需要光流。数值例：静止像素的真值帧差为 0，若预测在相邻帧之间跳动 0.04，损失为 0.04；运动像素的真值变化为 0.03，预测也变化 0.03，那么即使整体偏了一个常数，损失也是 0。所以 TGM 必须与单帧的尺度平移不变损失一起使用（VDA 的总损失为 α·L_TGM+β·L_ssi）。在 Ha et al. 的 DyNeRF 结果中，TCC 为 0.872，ENeRF 为 0.867，差距很小；STED 为 68.76 对 76.14，更能拉开差距。"}], "evolution": [{"year": 2015, "milestone_zh": "Bonneel et al.（SIGGRAPH Asia 2015）提出盲视频时间一致性（梯度域屏蔽泊松方程）；ConvLSTM（NeurIPS 2015）提出卷积循环单元，后来成为视频深度与一致性网络中常用的时序模块"}, {"year": 2018, "milestone_zh": "Lai et al.（ECCV 2018）用 ConvLSTM 网络和短期、长期时间损失实现实时盲一致性，光流 warping 误差成为常用评测指标；Montage4D 用指数平均平滑纹理混合权重"}, {"year": 2019, "milestone_zh": "ST-CLSTM（ICCV 2019）把循环网络和时间一致性损失用于实时单目视频深度估计，并提出 TCC、TMC 两个时间指标"}, {"year": 2020, "milestone_zh": "Consistent Video Depth Estimation（SIGGRAPH 2020）用测试时优化得到几何一致的视频深度；Deep Video Prior（NeurIPS 2020）无需训练集；TecoGAN 提出 tOF、tLP 时间指标；TAA 综述（Computer Graphics Forum）系统总结实时渲染中的时间累积技术"}, {"year": 2021, "milestone_zh": "Robust CVD（CVPR 2021）去掉对已知位姿的依赖；ESTDepth（CVPR 2021）用极线时空 Transformer 提升视频多视角深度的时间连贯性，后被 Ha et al. 引为 SDT、SDV 指标的出处"}, {"year": 2023, "milestone_zh": "CODD（WACV 2023）实现在线、时间一致的动态场景立体深度（640×480 下 25 fps）；DynamicStereo 与 Dynamic Replica 数据集（CVPR 2023）；盲去闪烁（CVPR 2023）用神经图集去除各类闪烁"}, {"year": 2024, "milestone_zh": "DepthCrafter 用视频扩散模型一次生成最长 110 帧的一致深度序列，质量高，但每帧耗时接近 1 秒"}, {"year": 2025, "milestone_zh": "Video Depth Anything（CVPR 2025 Highlight）实现分钟级长视频的一致深度，小模型每帧 9.1 ms；FlashDepth（ICCV 2025）以 24 fps 处理 2K 流式视频；Stereo Any Video（ICCV 2025）实现时间一致的视频立体匹配；Ha et al.（CVPR 2025）把 TCC、STED、SDT、SDV 引入新视角视频合成的评测"}, {"year": 2026, "milestone_zh": "Online Neural Space Time Memory、LiveStre4m 等把可学习记忆和扩散插值用于在线新视角视频，时间一致性成为前馈新视角合成的内置目标"}], "papers": [{"title": "Blind Video Temporal Consistency", "authors": "Nicolas Bonneel et al.", "year": 2015, "venue": "SIGGRAPH Asia 2015 (ACM TOG 34(6))", "url": "https://doi.org/10.1145/2816795.2818107", "citations": 185, "role_zh": "第一个与具体处理算法无关的“盲”时间一致性方法：在梯度域中让输出的梯度跟随逐帧处理结果、数值跟随 warp 过来的上一帧输出，求解屏蔽泊松方程；权重由原始视频的 warp 误差决定。其傅里叶分析清楚地说明了“低频跟历史、高频跟当前”，并与普通时间平滑做了对比，是理解所有时间滤波的好起点。", "priority": "must"}, {"title": "Learning Blind Video Temporal Consistency", "authors": "Wei-Sheng Lai et al.", "year": 2018, "venue": "ECCV 2018", "url": "https://arxiv.org/abs/1808.00449", "citations": 509, "role_zh": "把盲一致性做成带 ConvLSTM 的前馈网络：感知损失加短期、长期时间损失，光流只在训练时使用，测试时 1280×720 下超过 400 fps，单个模型可处理风格迁移、上色、增强等多种任务。它还推广了光流 warping 误差这一评测指标；Ha et al. 的评测没有采用这一指标。", "priority": "must"}, {"title": "Consistent Video Depth Estimation", "authors": "Xuan Luo et al.", "year": 2020, "venue": "SIGGRAPH 2020 (ACM TOG 39(4))", "url": "https://arxiv.org/abs/2004.15021", "citations": 420, "role_zh": "用 COLMAP 位姿和光流对应构造多帧几何约束，在测试时微调单图深度网络，得到稠密、尺度一致、几何一致的视频深度（244 帧约 40 分钟）。它确立了“一致性来自共享的 3D 几何”这一思路，是一致视频深度这一方向的开端。", "priority": "must"}, {"title": "Video Depth Anything: Consistent Depth Estimation for Super-Long Videos", "authors": "Sili Chen et al.", "year": 2025, "venue": "CVPR 2025 (Highlight)", "url": "https://arxiv.org/abs/2501.12375", "citations": 261, "role_zh": "在 Depth Anything V2 上把 DPT 头换成带时间注意力的时空头，用不需要光流的时间梯度匹配损失训练，并以“重叠帧 + 关键帧”策略处理任意长的视频；小模型在 A100 上每帧 9.1 ms。它代表 2025 年“单帧基础模型 + 轻量时序模块”的主流做法，也是替换逐帧深度前端的现成选择。", "priority": "must"}, {"title": "Video Quality Assessment by Reduced Reference Spatio-Temporal Entropic Differencing", "authors": "Rajiv Soundararajan, Alan C. Bovik", "year": 2013, "venue": "IEEE TCSVT 23(4)", "url": "https://doi.org/10.1109/TCSVT.2012.2214933", "citations": 374, "role_zh": "ST-RRED：对参考视频和待测视频的帧以及相邻帧差做小波分解，用高斯尺度混合模型估计局部熵并比较熵差，空间项与时间项相乘得到最终分数，越小越接近参考。Ha et al. 表格中的 STED 就引用本文，它是 Ha 拉开差距最明显的时间指标（DyNeRF 上 68.76，ENeRF 为 76.14，去掉时间滤波后为 89.62）。读它能明白 STED 为什么对闪烁敏感，也能看出它仍需要真值视频作参考。", "priority": "should"}, {"title": "Blind Video Temporal Consistency via Deep Video Prior", "authors": "Chenyang Lei et al.", "year": 2020, "venue": "NeurIPS 2020", "url": "https://arxiv.org/abs/2010.11838", "citations": 133, "role_zh": "不需要训练集，也不需要光流：只在一对原始/处理后的视频上训练一个 CNN，利用网络的“深度视频先验”得到一致的结果，并用迭代重加权训练处理多模态不一致，在 7 种视频任务上验证。它展示了网络结构本身的时间正则作用。", "priority": "should"}, {"title": "Robust Consistent Video Depth Estimation", "authors": "Johannes Kopf et al.", "year": 2021, "venue": "CVPR 2021", "url": "https://arxiv.org/abs/2012.05901", "citations": 266, "role_zh": "不需要输入位姿，联合估计相机轨迹和一致的深度：形变样条负责低频大尺度对齐，几何感知深度滤波负责高频细节，能应对手机视频中的抖动、运动模糊和卷帘快门，在 Sintel 上的深度和位姿精度均优于此前方法。", "priority": "should"}, {"title": "Exploiting Temporal Consistency for Real-Time Video Depth Estimation", "authors": "Haokui Zhang et al.", "year": 2019, "venue": "ICCV 2019", "url": "https://arxiv.org/abs/1908.03706", "citations": 144, "role_zh": "ST-CLSTM：在逐帧深度网络上加时空卷积 LSTM，并用对抗式时间一致性损失训练，计算开销几乎不增加即可实时输出更稳定的视频深度。它还提出了 TCC（帧差图之间的 SSIM）和 TMC（帧差光流的一致性）两个时间指标；Ha et al. Eq. (8) 的 TCC 直接引用本文，并改造用于彩色图像。它是“循环模块 + 时间损失”这条在线路线的早期代表。", "priority": "should"}, {"title": "FlashDepth: Real-time Streaming Video Depth Estimation at 2K Resolution", "authors": "Gene Chou et al.", "year": 2025, "venue": "ICCV 2025", "url": "https://arxiv.org/abs/2504.07093", "citations": 18, "role_zh": "在 Depth Anything V2 上做两处改造：加入轻量循环网络（Mamba），在线地把各帧的深度特征对齐到同一尺度；用混合结构让轻量分支（ViT-S）处理 2K 全分辨率以保住边界、重分支在低分辨率上提供精度。在 A100 上以 24 fps 处理 2044×1148 的流式视频，边界锐度明显优于此前的视频深度模型；作者承认主要局限是残余闪烁。它是因果、实时、高分辨率时间一致深度的代表，最接近临场系统对深度前端的要求。", "priority": "should"}, {"title": "Temporally Consistent Online Depth Estimation in Dynamic Scenes", "authors": "Zhaoshuo Li et al.", "year": 2023, "venue": "WACV 2023", "url": "https://arxiv.org/abs/2111.09337", "citations": 40, "role_zh": "CODD（约翰斯·霍普金斯大学与 Meta Reality Labs）：在逐帧立体网络之后接运动网络（预测逐像素 SE(3) 以对齐历史观测）和融合网络（聚合当前与过去的估计），在线运行、640×480 下 25 fps，时间指标最多提升 31%，单帧精度持平。它在结构上就是 Ha et al.“差分掩码 + 指数平均”深度滤波的学习版。", "priority": "should"}, {"title": "DynamicStereo: Consistent Dynamic Depth from Stereo Videos", "authors": "Nikita Karaev et al.", "year": 2023, "venue": "CVPR 2023", "url": "https://arxiv.org/abs/2305.02296", "citations": 163, "role_zh": "用分解注意力在时间、空间和左右视图之间汇聚信息的视频立体网络，并发布 Dynamic Replica（524 段含人和动物的合成视频），为时间一致的立体深度提供了训练数据和基准。它的动机明确写到 AR/VR 中闪烁会破坏体验。", "priority": "should"}, {"title": "Multi-view Depth Estimation using Epipolar Spatio-Temporal Networks", "authors": "Xiaoxiao Long, Lingjie Liu, Wei Li, Christian Theobalt, Wenping Wang", "year": 2021, "venue": "CVPR 2021", "url": "https://arxiv.org/abs/2011.13118", "citations": 84, "role_zh": "ESTDepth：从单目视频做多视角深度估计，用极线时空（EST）Transformer 把相邻帧估计出的深度在几何上关联起来，得到时间连贯的深度，并用 2D 上下文网络加 3D 匹配网络的混合结构降低计算量。Ha et al. 衡量时间/视角一致性的 SDT、SDV（L1 误差在帧间/视角间的标准差）明确沿用它的做法。", "priority": "optional"}, {"title": "Learning Temporal Coherence via Self-Supervision for GAN-based Video Generation", "authors": "Mengyu Chu et al.", "year": 2020, "venue": "ACM TOG 39(4) (SIGGRAPH 2020)", "url": "https://arxiv.org/abs/1811.09393", "citations": 306, "role_zh": "TecoGAN：用时空判别器和 Ping-Pong 损失让循环生成网络在保持细节的同时不累积时间伪影，并提出了 tOF、tLP 两个时间指标，用户研究验证了指标排序。它说明单纯的 L2 时间约束会让结果过度平滑。", "priority": "optional"}, {"title": "Blind Video Deflickering by Neural Filtering with a Flawed Atlas", "authors": "Chenyang Lei et al.", "year": 2023, "venue": "CVPR 2023", "url": "https://arxiv.org/abs/2303.08120", "citations": 43, "role_zh": "只输入一段闪烁视频、不需要任何额外引导的通用去闪烁方法：用神经图集作为全视频统一的一致性参考，再训练一个神经滤波器学习一致的颜色和亮度、避开图集本身的瑕疵，并构建了真实闪烁视频数据集。", "priority": "optional"}], "prereqs": ["v-temporal", "d-flow", "v-metrics", "f-prob", "d-mono", "d-stereo", "l-loss"], "relation_to_anchors_zh": "与 Ha et al. 的关系：这篇论文把“多视角时间一致性”写进了标题，但它的时间机制全部放在输入深度端，分三部分。(1) Sec. 3.2 Eq. (1)–(2)：对每个输入视角计算软差分掩码 M=min(|I_t−I_{t−1}|/λ_t+β, 1)（λ_t=0.7，β=0.6，在 1/4 分辨率上计算，经 3×3 max-pool 后上采样），再做 Ḋ=M·D+(1−M)·Ḋ_{t−1}。用本专题的语言，这是“重投影为恒等（相机固定）+ 按颜色差拒绝历史 + 指数平均”的 TAA 式滤波，也是 CODD 的手工版本；它处理不了光照变化和自动曝光（会被误判为运动），也处理不了纯色运动物体（会被误判为静止）。(2) 附录 A.2 Eq. (13)–(14)：把上一帧渲染出的目标视角深度作为 TSDF 的额外输入，权重上限 η=15，动态区域用前向 splat 到目标视角的差分掩码降权。这是一个最小的流式状态，论文没有说明目标视点移动时如何重投影这张深度。(3) 训练端没有任何时间项：损失为 0.8·L1+0.2·SSIM+0.1·L_Depth+0.1·L_Mask，训练样本取自单一时刻，ScanNet 还是静态的，因此融合网络和背景图 I_BG 自身引入的闪烁不受约束。评测上（Sec. 4.3），Ha 用 Soundararajan 与 Bovik 的 STED、改造成彩色版的 TCC（直接引用 ST-CLSTM），以及沿用 ESTDepth 做法的 SDT（时间）和 SDV（视角），没有用 Lai et al. 的 warping 误差。Table 3 的消融显示，时间滤波几乎不改变 PSNR（31.16 对 31.17），只把 STED 从 89.62 降到 68.76。这正是时间一致性方法的典型特征：改善的是“变化”，而不是单帧误差。按本专题的分类，Ha 的下一步可以是：用 CODD、Stereo Any Video、PPMStereo 这类时间一致的深度前端替换“逐帧 RAFT-Stereo + 手工掩码”；在视频序列上训练，并加入 Lai 式的时间损失或 TGM 式的帧差匹配损失；把输入视角的硬切换改成连续权重。\n\n与 Quark 的关系：Quark 是“逐帧独立”的典型。Sec. 4.1 末段承认表中的指标都不测闪烁，离线的 NeRF/3DGS 在这方面更好，并指出输入集合切换和曝光差异会引起明显闪烁；Sec. 4.3 把缺少时间一致性列为局限。它的训练数据（Spaces、RFF、Shiny、SWORD）全是静态图像，损失 10·L1+LPIPS 中没有时间项，Neural 3D Video 评测每 10 帧才评一帧，更不可能反映闪烁。本专题的方法对 Quark 有三个接入点。输出端：Lai 式的在线稳定网络可以直接接在 1080p 输出后面（原文在 1280×720 下超过 400 fps，开销很小），但它只能压住低频闪烁，修不了几何跳变。中间表示端：对 LDM 的深度、密度和 blend weights 做运动补偿的时间滤波，或者像 Montage4D 那样平滑 blend weights。训练端：用视频数据加时间损失训练，并在 render-and-refine 的迭代中以上一帧的 LDM 作为初值（类似 CODD 的“对齐 + 融合”）。与 Quark 作者高度重叠的后续工作 Online Neural Space Time Memory 选择的是最后一条路的延伸：把长时记忆放进测试时训练的网络权重。", "debates_zh": ["事后稳定还是从源头保证一致：事后方法（Bonneel、Lai、Deep Video Prior）与任务无关、即插即用，但只能调整颜色，修不了几何；源头方法（时间一致的深度、带记忆的新视角合成）效果更根本，但每个任务都要重新设计和训练。", "要不要用光流：Bonneel、Lai、CVD 都依赖光流或类似的对应，遮挡和对应误差会直接变成伪影；VDA 的 TGM 和 Ha 的差分掩码都刻意避开光流，只比较同一像素位置，前提是相机固定或运动很小。在头部不断移动的临场场景中，哪一种更可靠？", "稳定与响应的权衡怎么定：指数平均越强越稳，拖影也越长（见 v-temporal）。临场中人脸和手的快速运动对拖影极其敏感，大面积背景则对闪烁极其敏感。逐区域自适应的权重应该由手工规则决定，还是由网络学习？", "指标是否可信：TCC 的差距常常只有千分之几（Ha 为 0.872，ENeRF 为 0.867）；STED 和 warping 误差依赖参考视频或光流；一个完全静止的输出在时间指标上也能拿高分。目前缺少与主观闪烁感知对齐的标准指标，也缺少用户研究。", "扩散模型的角色：视频扩散模型（DepthCrafter、LiveStre4m 的插值模块）一致性很好，但在因果、低延迟场景下能否直接使用，还是只能作为离线教师，把一致性蒸馏给在线模型？"], "open_questions_zh": ["因果、低延迟（每帧几毫秒）并对头部运动鲁棒的新视角视频稳定方法：既要处理场景运动，又要处理视点运动和输入集合切换。", "长时记忆：Ha 的递归滤波和 TSDF 回灌只在 100 帧上评测过。在分钟级的通话中，如何避免漂移和误差累积，同时在遮挡结束后恢复“之前见过”的内容？", "多视角与时间的联合一致性：双目两眼之间、多个观众之间、以及随时间变化，三者同时一致的度量方法和实现方法。", "对光照变化、自动曝光和编码噪声鲁棒的静态/动态判别，用来替代原始颜色差阈值。", "与感知对齐的时间质量指标：能够预测人在头显或光场屏上实际感到的闪烁和拖影。"], "resources": [{"title": "Blind Video Temporal Consistency 官方代码（Bonneel）", "url": "https://github.com/nbonneel/blindconsistency", "type": "code", "note_zh": "作者的 C++ 实现：输入原始视频和逐帧处理后的视频，输出时间一致的版本。适合对照公式 1 理解 λ 和 α 的作用，并把它当作任何逐帧新视角合成输出的后处理基线。"}, {"title": "Consistent Video Depth Estimation 官方代码", "url": "https://github.com/facebookresearch/consistent_depth", "type": "code", "note_zh": "包含 COLMAP 预处理、光流帧对采样和测试时微调的完整流程。跑一段自己的视频，对比微调前后深度的时间稳定性，并体会离线方法的耗时。"}, {"title": "Video Depth Anything 官方代码与模型", "url": "https://github.com/DepthAnything/Video-Depth-Anything", "type": "code", "note_zh": "提供不同规模的模型，并在 2025 年加入了实验性的免训练流式推理模式。可以直接把它作为时间一致的深度前端，与逐帧 Depth Anything V2 的输出做 TCC、帧差对比。"}, {"title": "A Survey of Temporal Antialiasing Techniques（Yang, Liu, Salvi, Computer Graphics Forum 2020）", "url": "https://doi.org/10.1111/cgf.14018", "type": "paper", "note_zh": "实时图形学中时间累积技术的系统综述：重投影、历史拒绝与裁剪、指数平均及其伪影（拖影、闪烁）。读完就能看出 Ha et al. 的差分掩码滤波在这一框架中的位置和局限。"}]}, {"id": "a-telepresence-sys", "title_zh": "三维临场系统设计", "title_en": "3D telepresence system design", "overview_zh": "三维临场（3D telepresence）要把远端参与者的外观和几何实时“搬”过来，并按本地观看者双眼的位置正确显示，使观看者获得立体视差、运动视差和目光接触。它不是单个算法，而是一条流水线：多相机采集（同步与标定，见 g-rig）→ 几何估计与融合（主动深度或学习式立体，见 d-sensors、d-stereo、d-tsdf）→ 编码与传输（见 v-codec）→ 按观看者视点渲染（IBR 或神经渲染）→ 头部跟踪的立体或光场显示（见 v-perception）。各段延迟相加：Starline 引用的对话同步上限约为 250 ms，而“头动 → 画面”的局部延迟要求更严，否则自动立体屏会出现左右眼串扰，甚至立体反转。Quark 和 Ha et al. 都只覆盖“重建 + 渲染”这一段，也只报告了这一段的 GPU 时间。本专题把它们放回完整系统中，才能判断“30 fps”“39 ms”到底意味着什么。\n\n核心设计轴有四条。（1）几何从哪里来：Holoportation 每个相机舱包含近红外立体相机和彩色相机，做主动立体；Starline 用 3 个自研的主动立体 RGB-D 采集舱（近红外图案投影，180 Hz 采集）；VirtualCube 用 6 台 Azure Kinect；Tele-Aloha 只用 4 台 RGB 相机加学习式级联视差估计（4.7 ms）。（2）传什么、在哪一端渲染：Holoportation 在发送端做 Fusion4D 非刚性融合，传网格和纹理（约 1–2 Gbps）；Starline 传 4 路彩色和 3 路深度视频（H.265，30–100 Mbit/s），在接收端按双眼位置做 image-based TSDF 光线步进；VirtualCube 在发送端按对方视点直接渲染出 2D 肖像，用 JPEG+TCP 传输，约 7 Mbps；Tele-Aloha 传 RGB 视频（约 100 Mbit/s），在接收端渲染。（3）外观如何合成：几乎所有系统都采用视角相关的纹理混合，包括 Holoportation 的法向加权加多数投票、Montage4D 的测地扩散加时间纹理场、Starline 的 cos² 法向权重、VirtualCube 的学习式 Lumi-Net 权重、Tele-Aloha 的加权混合。它们是 Quark 和 Ha et al. 中 blend weights 的系统前身（见 i-blending）。（4）显示：HMD（Holoportation）、头部跟踪的自动立体屏（Starline 65 英寸 8K，每眼约 45 px/deg；Tele-Aloha 27 英寸），或者大屏加视点跟踪（VirtualCube 用 3 块 65 英寸 4K 屏）。\n\n演化。1998 年 Office of the Future 提出用相机与投影把远端办公室“搬进来”的设想。2003 年 blue-c 在 CAVE 式投影房间里用可切换透明度的液晶玻璃幕“边投影边拍摄”，实时生成基于点的 3D 视频。2011 年 Maimone 与 Fuchs 用多台 Kinect 做出免穿戴的实时 3D 临场原型。2015 年 Collet 等用 106 台相机离线制作可流式传输的自由视点视频（平均 9.5 Mbps）。2016 年 Fusion4D 与 Holoportation 实现了实时非刚性融合和 AR/VR 双向临场。2018 年 Montage4D 解决了纹理接缝与时间闪烁，LookinGood 引入实时神经重渲染。2021 年 Project Starline 用用户研究证明 3D 临场优于 2D 视频会议（117 人、9 个月、308 次真实会议的部署调查，外加 25 人的组内对照实验），回环延迟 105.8 ms。VirtualCube（IEEE VR 2022）支持多方会议。2024 年 Tele-Aloha 把系统压缩到 4 台 RGB 相机加 1 块 RTX 4090，做到 2K、30 fps、延迟低于 150 ms。2025 年 Starline 产品化为 Google Beam（HP Dimension）：6 台高速相机、60 fps、65 英寸光场屏（约 3320 万像素，8K 级），每端至少需要 50 Mbps 对称带宽，网络延迟低于 100 ms。\n\n现状（截至 2026-09）。工业界以 Beam 为代表，走“少量 RGB 相机 + AI 重建 + 光场屏”的路线。研究侧有三条主线并行。(a) feed-forward 3DGS 人体重建与推流：Tele360 用 4–6 路未标定的 2K 相机，6 路时网络推理在 RTX 5090 上约 35 ms，Gaussian 图经视频编码推流约 100 Mbit/s。(b) 化身式极低带宽：Mon3tr 用预先建好的 Gaussian 化身摊销成本，码率低于 0.2 Mbps，端到端约 80 ms。(c) 语义编码或联合编码：GS-SCNet 把双目视频的语义编码与 feed-forward 3DGS 联合优化，在 PSNR 下相对“MV-HEVC + GPS-Gaussian”基线平均节省约 75% BD-rate。三条线共同未解决的问题是：怎样在采集、带宽、算力、延迟之间取得平衡，同时保证时间稳定和双目一致。Quark 和 Ha et al. 分别代表“单帧质量优先”和“一致性优先”的渲染核心，但两者都没有给出系统级的延迟和带宽数据。", "key_ideas": [{"name_zh": "端到端延迟预算：逐段相加，而不只看网络推理", "explain_zh": "直觉：观看者感受到的是“远端动作发生 → 本地屏幕显示”的总时间，任何一段都省不掉。VirtualCube 给出了最完整的拆解（三方会议）：RGB-D 采集 60 ms，在 RTX 3090 上渲染肖像 40 ms，拷贝与 JPEG 压缩 30 ms，网络传输 100 ms，解压与上屏 40 ms，合计约 270 ms，论文称端到端约 300 ms。各段是流水并行的，所以吞吐仍能达到 23 fps（三方）或 30 fps（一对一）。Starline 在回环模式下（完整 WebRTC 栈、两端在同一台机器上）测得 105.8 ms（标准差 9.1 ms），并且为了降低编解码延迟关闭了 B 帧。Tele-Aloha 在局域网内低于 150 ms。它的系统表（表 4）给出了逐段拆解：发送端采集 56 ms、上传显存 11 ms、去马赛克 13 ms、预处理 5 ms、编码 5 ms、回传内存 1 ms，RTC 传输 2 ms，接收端上传 1 ms、解码 5 ms、视图合成 28 ms、显示输出 27 ms，合计 149 ms。视图合成只占约五分之一，采集和显示两端加起来超过一半。其中新视角合成算法本身为 23.5 ms：视差 4.7 ms、编码器 6.1 ms、解码器与精修 9.3 ms、输入视图混合 1.4 ms、3DGS 光栅化 1.0 ms、其他 1.0 ms（RTX 4090，TensorRT FP16）。与锚点的联系：Quark 的 32.2 ms（1024×768）或 33.0 ms（2048×1536），以及 Ha et al. 的约 39 ms（前向 splat 10 ms + TSDF 6 ms + 融合网络 23 ms，TensorRT），都只对应上面“渲染”这一格。Ha et al. 还没有计入 RAFT-Stereo 立体深度的时间；Tele-Aloha 说明深度估计本身可以压到 5 ms 量级，前提是把它当作系统中的一段来设计。"}, {"name_zh": "渲染放在哪一端：视点相关表示的系统代价", "explain_zh": "直觉：如果表示依赖目标视点（Quark 的 LDM、Ha et al. 的目标视角 TSDF 深度），渲染就必须在“知道观看者眼睛在哪”的一端完成，而且每个视点都要完整算一遍。Starline 选择在接收端渲染：收到 3 路深度和 4 路彩色后，每帧做 6 次光线步进（为 4 个彩色相机各做一张 shadow map，再为左右眼各做一张深度图），依靠 image-based fusion，这 6 次步进合计只花 1.5 ms，只占 60 Hz 每帧 16.6 ms 预算的一小部分。VirtualCube 选择在发送端渲染：发送端知道每个远端观看者的视点，为每人渲染一张带 alpha 的 2D 肖像再发出去，所以带宽只有约 7 Mbps；代价是每多一位参与者就多一路渲染，而且观看者视点要先经网络回传。数值例子：如果把 Quark 用在头部跟踪的自动立体屏上，每帧要为左右眼各推理一次，约 2×32.2=64.4 ms，已经超过 30 Hz 的 33.3 ms 帧预算，更远超 Beam 60 fps 对应的 16.7 ms；两位观看者还要再翻一倍。与锚点的联系：两篇锚点都没有讨论双目或多观看者，它们的“实时”只在单目、单视点条件下成立。这也部分解释了 Quark 团队的后续工作（LVT、Fuse-and-Refine）为什么转向“一次重建、多次渲染”的持久 3DGS 表示。"}, {"name_zh": "Image-based TSDF：不建体素网格的实时深度融合（Starline → Ha et al.）", "explain_zh": "直觉：传统 TSDF（Curless & Levoy，见 d-tsdf）先把所有深度图累加进一个 3D 体素网格，再沿光线查表。Starline 反其道而行，只沿当前要渲染的光线前进：每走到一个点 p，就把 p 投影到每张深度图里读出深度，当场算出有符号距离并加权求和（公式 2）；检测到符号变化后，用二分法精确求出交点。为了省掉空跑，它还先把输入深度用点溅射光栅化到低分辨率的输出视图上，经过 2D min/max 滤波得到每条光线的搜索区间。数值：在 Titan RTX 上，体素融合（1152×896×768 网格）需要累积 2.5 ms 加光线步进 7.5 ms，共 10.0 ms；加入光栅化区间后降到 4.3 ms；换成 image-based fusion 后只要 1.5 ms。参数：截断距离 T=2 cm，步长 0.8·s，符号变化后做 3 次二分；深度权重 \\(w=\\min(0.001/\\sigma,1)\\)，σ 是 7×7 邻域内截断深度差的均方根，用来压低立体深度噪声大的区域的权重。与锚点的联系：Ha et al. 的 Sec. 3.2/A.1 几乎逐项沿用了这些数值（τ=0.02 m、0.8·s 步进、3 次二分、7×7 局部方差置信）。它新增的是两点：把上一帧的目标视角深度作为额外输入回灌（权重上限 η=15），以及对输入深度做颜色差分掩码滤波。不先读 Starline 的这一节，Ha et al. 附录 A.1 的公式几乎读不懂。反过来也能看出，Starline 原文明确写着渲染“逐帧独立处理、没有时间历史”，这正是 Ha et al. 要补的缺口。"}, {"name_zh": "视角相关纹理混合、接缝与时间稳定：blend weights 的系统演变", "explain_zh": "直觉：几何总有误差。把多台相机的纹理贴到同一个表面上时，权重怎么分配，决定了画面是“糊”、“有缝”还是“闪”。Holoportation 用表面法向加权、多数投票和膨胀后的深度不连续区域来抑制重影。Montage4D 指出法向加权会导致模糊，改用偏向主导视角的视角相关权重，用测地距离场把权重从接缝处平滑地扩散开，再用“时间纹理场”对每个顶点的权重做指数滑动平均 \\(T_v^i(t)=(1-\\lambda)T_v^i(t-1)+\\lambda\\,\\tilde T_v^i(t)\\)，其中 \\(\\tilde T_v^i(t)\\) 是当前帧为顶点 v、相机 i 算出的原始权重，λ=0.05，时间常数约 1/λ=20 帧。它在五个数据集上的 PSNR 全部提升（例如 Timo 序列 38.60→40.23 dB），渲染速度仍超过 100 fps（114–135 fps）。Starline 以表面法向与相机方向夹角余弦的平方作为权重，并且像 ULR 那样提高面部变焦相机的权重；同时沿深度不连续处做自适应模糊（edge blending），压制剪影处的闪烁。VirtualCube 的 Lumi-Net 在 1/4 分辨率上用 CNN 预测混合权重（2 ms），在全分辨率上混合纹理后，再经过一个 20 ms 的后处理 CNN；它还对输出 alpha 做历史缓冲平滑 \\(\\alpha'=0.5\\,\\alpha+0.5\\,\\alpha_h\\)，并只在人像边界像素上做颜色的时间平滑。与锚点的联系：Quark 的 blend weights 由 One-to-many attention 产生，softmax 推迟到上采样之后才施加；Ha et al. 由 4 层 U-Net 预测 K 个权重和一个背景权重。两者都延续了 Lumi-Net 这条“学习权重”的路线，但都没有 Montage4D 或 VirtualCube 那样对权重或 alpha 做时间平滑。Quark 在最近 8 个输入视角的集合发生切换时会闪烁，Montage4D 式的 EMA 是最便宜的补丁，代价是运动时出现拖影。Ha et al. 用掩码下限 0.6 限制历史深度的占比，面对的是同一个权衡。"}, {"name_zh": "传输表示与带宽：从网格到 RGB-D 视频再到 2D 肖像", "explain_zh": "直觉：传得越“原始”，接收端越自由（任意视点、双目都能做），但带宽越高；传得越接近“成品”，带宽越低，但视点被锁死。几个量级：Holoportation 传量化网格和去掉背景的彩色图（LZ4 无损压缩），30 fps 下约 1–2 Gbps。Collet 2015 离线把跟踪网格和纹理编码成 MPEG 流，平均 9.5 Mbps。Starline 用 GPU 的 NVENC/NVDEC 把 7 路视频编码为 H.265：彩色 8 bit、QP=22；深度 10 bit，存放在 Y 通道，UV 置为 512，QP=14；总码率 28.0–102.3 Mbit/s（穿纯色衣服静坐时 28.0，其中 3 路深度占 23.7；穿高频纹理衣服挥动手臂时 102.3）。Tele-Aloha 把 4 路图像裁成正方形后拼成一张 6000×6000 的大图送入 NVENC 做 H.265 编码，经 WebRTC 传输，实测约 100 Mbit/s。VirtualCube 发送渲染好的肖像，约 7 Mbps。Beam 要求每端至少 50 Mbps 的对称带宽。与锚点的联系：Quark 需要离目标最近的 8 路全分辨率 RGB；Ha et al. 需要 K 路 RGB 加上逐视角深度，而且“最近的 K 路”会随观看者位姿变化。如果在接收端渲染，就必须把全部 N 路都发过去（DyNeRF 阵列有 18–22 台相机）；如果只发 K 路，就要先把观看者位姿回传给发送端，多一次网络往返，切换到新相机流时还要等关键帧。两篇论文都没有讨论这一点（详见 a-compression）。"}, {"name_zh": "头部与眼睛跟踪：显示的是“预测出来”的视点", "explain_zh": "直觉：渲染用的眼睛位置来自跟踪，而跟踪本身有延迟。等到画面亮起时，眼睛已经移动了，自动立体屏就可能把本该给左眼的图像送进右眼。Starline 用 4 台跟踪相机以 120 Hz 检测眼、嘴、耳的 2D 位置，再三角化成 3D。它用显示器前的光电探测器测得跟踪延迟约 33 ms，因此对 3D 特征点做外推，并用同时平滑位置和速度的双指数平滑来抑制外推放大的噪声（公式 3）；用户静止时残留的微小抖动，再用一个“change band”滞回滤波器去掉（输入在一个小区间内变动时保持输出不变）。数值例子：头部以 0.3 m/s 平移时，33 ms 的延迟对应约 1 cm 的眼位误差，大约是瞳距（约 6.3 cm）的六分之一，足以产生明显的串扰。Tele-Aloha 用微调过的 BlazeFace 在两路顶部相机中检测虹膜，再做三角化。与锚点的联系：对 Quark 和 Ha et al. 来说，“目标视角”就是这个预测出来的眼睛位姿。由于每个目标视角都要完整跑一遍网络，预测误差不仅影响显示，还决定了该选哪 K 路或 M 路输入。而这两篇论文在评测中都使用留出相机的真实位姿作为目标视角，从来没有在跟踪噪声下测试过。"}, {"name_zh": "显示与感知约束决定渲染的“有效分辨率”", "explain_zh": "直觉：临场采用真人大小的显示，会把每一个伪影都放大。Starline 使用 65 英寸 8K 面板（3310 万全彩像素，60 Hz）的头部跟踪透镜阵列自动立体屏，在 1.25 m 的观看距离下，每只眼睛分到约 500 万个像素（每种原色），角分辨率约 45 像素/度。为了减轻串扰和辐辏-调节冲突（见 v-perception），它把远端人物放在显示平面附近。Tele-Aloha 在 27 英寸屏上以 0.5 的比例渲染上半身，同样把虚拟人放在显示平面附近。VirtualCube 在面部区域额外加了感知损失，因为人对脸部细节最敏感。与锚点的联系：Quark 的输出从 1024×768 提高到 2048×1536 时，RFF 上的 LPIPS 从 0.137 变为 0.233，Shiny 上的 PSNR 从 26.51 降到 24.66。它的内部几何固定在 288×512，高分辨率只来自 IBR 取样和上采样；在 45 px/deg 的真人大小显示上，这种退化会直接被看出来。两篇锚点都没有专门针对人像或人体的评测，而人脸、头发、手部恰恰是临场中最敏感的区域。"}], "equations": [{"tex": "T_{\\mathrm{e2e}}=T_{\\mathrm{cap}}+T_{\\mathrm{geo}}+T_{\\mathrm{render}}+T_{\\mathrm{enc}}+T_{\\mathrm{net}}+T_{\\mathrm{dec}}+T_{\\mathrm{disp}}", "explain_zh": "端到端（motion-to-photon）延迟预算。T_cap：采集与同步（曝光、传感器读出、传输到主机）；T_geo：深度估计与融合；T_render：按目标视点合成；T_enc、T_dec：编码与解码；T_net：网络传输加抖动缓冲；T_disp：显示扫描与面板响应。在接收端渲染时，T_geo 和 T_render 移到 T_dec 之后，但总和不变。流水并行只能提高吞吐（fps），不能减少单帧延迟。例：VirtualCube 为 60+40+30+100+40=270 ms（论文称约 300 ms）；Tele-Aloha 表 4 合计 149 ms，其中 T_cap≈56+11+13 ms、T_disp≈27 ms，视图合成 28 ms；Starline 回环 105.8 ms；对话同步上限约 250 ms。锚点的 Quark 32.2 ms 和 Ha et al. 约 39 ms 都只是其中的 T_render，而 Ha et al. 连 T_geo 里的立体深度都没有计入。"}, {"tex": "s(\\mathbf p)=\\sum_{j} w_j\\,\\mathrm{clamp}\\!\\big(d_j(\\pi_j(\\mathbf p))-z_j(\\mathbf p),\\,-T,\\,T\\big),\\qquad w_j=\\min\\!\\Big(\\frac{0.001}{\\sigma_j},\\,1\\Big)", "explain_zh": "Starline 的 image-based TSDF，Ha et al. 附录 A.1 使用的是同一个式子。p：沿目标光线的采样点；π_j(p)：p 在第 j 张深度图上的投影像素；d_j(·)：该像素的深度读数；z_j(p)：p 在相机 j 坐标系下的深度。两者之差就是有符号距离，正值表示 p 位于相机 j 看到的最前表面之前（两篇原文按各自坐标约定写成 z−d 的形式，含义相同）。T：截断距离（Starline 为 2 cm，Ha et al. 为 0.02 m）；σ_j：该像素 7×7 邻域内截断深度差的均方根，作为噪声的代理。差值小于 −T（p 在表面后方较远处）时令 w_j=0，防止“过度雕刻”；p 落在视锥外时同样令 w_j=0。沿光线以 0.8·s 为步长前进，s 变号后做 3 次二分求根。例：某点在相机 1 所见表面前 5 mm、在相机 2 所见表面后 3 mm，两处的 σ 分别为 1 mm 和 4 mm，则 w=(1, 0.25)，s=1×0.005+0.25×(−0.003)=0.00425>0，说明还没到表面，继续前进。"}, {"tex": "\\mathbf s_t=\\alpha\\,\\mathbf p_t+(1-\\alpha)(\\mathbf s_{t-1}+\\mathbf v_{t-1}),\\quad \\mathbf v_t=\\gamma(\\mathbf s_t-\\mathbf s_{t-1})+(1-\\gamma)\\mathbf v_{t-1},\\quad \\hat{\\mathbf p}_{t+k}=\\mathbf s_t+k\\,\\mathbf v_t", "explain_zh": "双指数（Holt）平滑与外推。p_t：第 t 次跟踪测得的 3D 眼位；s_t：平滑后的位置；v_t：平滑后的每帧速度；α、γ∈(0,1]：位置和速度的平滑系数，越小越平滑，但滞后也越大；k：需要补偿的延迟帧数；\\(\\hat{\\mathbf p}_{t+k}\\)：送给渲染器的预测眼位。Starline 只说明采用了“同时滤波位置与速度”的双指数平滑来外推、补偿约 33 ms 的延迟，没有公开 α、γ 的取值；这里写的是标准的 Holt 形式。例：120 Hz 跟踪时，33 ms 约为 4 帧；若 v_t=2.5 mm/帧（即 0.3 m/s），外推量 k·v=1 cm。与锚点的联系：Quark 和 Ha et al. 的目标相机位姿就是 \\(\\hat{\\mathbf p}_{t+k}\\)，它的误差会直接变成渲染视点的误差。"}], "evolution": [{"year": 1998, "milestone_zh": "Office of the Future（Raskar 等）提出用相机阵列实时采集、用投影构建沉浸式显示的远程协作设想。"}, {"year": 2003, "milestone_zh": "blue-c（Gross 等，SIGGRAPH 2003）：3 面可在不透明（投影）与透明（拍摄）之间切换的液晶玻璃幕，16 台同步相机透过幕墙采集，实时生成基于点的 3D 视频（约 2.5 万点 5 fps），是早期完整的沉浸式 3D 视频临场系统。"}, {"year": 2011, "milestone_zh": "Maimone 与 Fuchs 用多台消费级 Kinect 做出免穿戴、头部跟踪的实时 3D 临场原型。"}, {"year": 2015, "milestone_zh": "Collet 等用 106 台相机（53 台 RGB + 53 台 IR）离线生成可流式传输的自由视点视频，跟踪网格编码为 MPEG 流，平均 9.5 Mbps。"}, {"year": 2016, "milestone_zh": "Fusion4D 实现多视角 RGB-D 的实时非刚性融合；Holoportation 在此基础上做出端到端 AR/VR 双向临场，30 fps 下约 1–2 Gbps。"}, {"year": 2018, "milestone_zh": "Montage4D 用测地扩散和时间纹理场消除接缝与闪烁；LookinGood 引入实时神经重渲染；Tang 等在 Holoportation 类数据上实现 30 fps 的实时 4D 压缩。"}, {"year": 2021, "milestone_zh": "Project Starline（ACM TOG）：3 个主动立体采集舱，7 路 RGB-D H.265 流，image-based TSDF 融合只需 1.5 ms，头部跟踪自动立体屏，回环延迟 105.8 ms；117 人部署调查和 25 人组内对照实验都显示其优于 2D 视频会议。"}, {"year": 2022, "milestone_zh": "VirtualCube（IEEE VR 2022 / TVCG）：6 台 Azure Kinect 的隔间系统，采用发送端渲染和学习式混合权重，支持三方会议，端到端约 300 ms。"}, {"year": 2024, "milestone_zh": "Tele-Aloha（SIGGRAPH 2024）：4 台 RGB 相机加 1 块 RTX 4090，2048×2048、30 fps，端到端低于 150 ms，约 100 Mbit/s。"}, {"year": 2025, "milestone_zh": "Starline 产品化为 Google Beam / HP Dimension：6 台高速相机、60 fps、65 英寸光场屏（约 3320 万像素），每端至少 50 Mbps 对称带宽；UIST 2025 的 GaussianNexus 等把 3DGS 用于房间尺度的 AR/VR 临场。"}, {"year": 2026, "milestone_zh": "Tele360（未标定稀疏相机，feed-forward 3DGS 推流）、Mon3tr（化身摊销，低于 0.2 Mbps）、GS-SCNet（编码与 3DGS 联合）等把研究重点推向免标定、低带宽和端侧部署。"}], "papers": [{"title": "Project Starline: A High-Fidelity Telepresence System", "authors": "Jason Lawrence et al.", "year": 2021, "venue": "ACM TOG 40(6) (SIGGRAPH Asia 2021)", "url": "https://research.google/pubs/project-starline-a-high-fidelity-telepresence-system/", "citations": 92, "role_zh": "第一个经用户研究证明优于 2D 视频会议的 3D 临场系统：7 路 RGB-D H.265 流、image-based TSDF 融合（1.5 ms）、头部跟踪自动立体屏、105.8 ms 回环延迟。Ha et al. 的 TSDF 直接来自这里。", "priority": "must"}, {"title": "Holoportation: Virtual 3D Teleportation in Real-time", "authors": "Sergio Orts-Escolano et al.", "year": 2016, "venue": "UIST 2016", "url": "https://doi.org/10.1145/2984511.2984517", "citations": 753, "role_zh": "第一个端到端实时的 AR/VR 双向 3D 临场系统：8 个 RGB-D 相机舱，Fusion4D 非刚性融合，传输网格加纹理，在 HoloLens/VR 上显示。", "priority": "must"}, {"title": "VirtualCube: An Immersive 3D Video Communication System", "authors": "Yizhong Zhang et al.", "year": 2021, "venue": "IEEE TVCG 2022 (IEEE VR 2022)", "url": "https://arxiv.org/abs/2112.06730", "citations": 69, "role_zh": "多方临场隔间系统。V-Cube View 在 1/4 分辨率上估计目标视点深度和 Lumi-Net 混合权重，再在全分辨率上做 IBR 混合；采用发送端渲染，并给出端到端约 300 ms 的逐段延迟拆解。它是与两篇锚点结构最接近的系统。", "priority": "must"}, {"title": "Tele-Aloha: A Low-budget and High-authenticity Telepresence System Using Sparse RGB Cameras", "authors": "Hanzhang Tu et al.", "year": 2024, "venue": "SIGGRAPH 2024", "url": "https://arxiv.org/abs/2405.14866", "citations": 20, "role_zh": "4 台 RGB 相机加 1 块 RTX 4090 的低成本临场系统：级联视差、Gaussian 光栅化特征、输入视图加权混合；2K、30 fps，新视角合成 23.5 ms，端到端低于 150 ms（表 4 逐段合计 149 ms），约 100 Mbit/s。", "priority": "must"}, {"title": "Fusion4D: Real-time Performance Capture of Challenging Scenes", "authors": "Mingsong Dou et al.", "year": 2016, "venue": "ACM TOG 35(4) (SIGGRAPH 2016)", "url": "https://doi.org/10.1145/2897824.2925969", "citations": 426, "role_zh": "多视角 RGB-D 的实时非刚性融合，能应对大幅运动和拓扑变化，是 Holoportation 的几何引擎，也是“固定阵列 + 全局几何”路线的代表。", "priority": "should"}, {"title": "Montage4D: Interactive Seamless Fusion of Multiview Video Textures", "authors": "Ruofei Du et al.", "year": 2018, "venue": "ACM I3D 2018（JCGT 2019 扩展版）", "url": "https://doi.org/10.1145/3190834.3190843", "citations": 57, "role_zh": "在 Holoportation 数据上做无缝纹理融合：视角相关权重、测地扩散消除接缝、时间纹理场（λ=0.05）抑制闪烁，速度超过 100 fps。这是 blend weights 做时间平滑的经典做法。", "priority": "should"}, {"title": "High-quality streamable free-viewpoint video", "authors": "Alvaro Collet et al.", "year": 2015, "venue": "ACM TOG 34(4) (SIGGRAPH 2015)", "url": "https://doi.org/10.1145/2766945", "citations": 676, "role_zh": "106 台相机的离线自由视点视频管线：多模态 MVS、自适应网格、网格跟踪，编码为 MPEG 流（平均 9.5 Mbps），是体积视频产业化的起点。", "priority": "should"}, {"title": "LookinGood: Enhancing Performance Capture with Real-time Neural Re-Rendering", "authors": "Ricardo Martin-Brualla et al.", "year": 2018, "venue": "ACM TOG 37(6) (SIGGRAPH Asia 2018)", "url": "https://arxiv.org/abs/1811.05029", "citations": 59, "role_zh": "第一次在实时性能捕捉之后接一个神经重渲染网络，做补洞、超分和去噪，并显式约束双目一致与时间稳定，标志着学习式后处理进入临场系统。", "priority": "optional"}, {"title": "Encumbrance-free telepresence system with real-time 3D capture and display using commodity depth cameras", "authors": "Andrew Maimone, Henry Fuchs", "year": 2011, "venue": "IEEE ISMAR 2011", "url": "https://doi.org/10.1109/ISMAR.2011.6092379", "citations": 266, "role_zh": "用多台消费级 Kinect 实现免穿戴、头部跟踪的实时 3D 临场原型，开启了“商品深度相机临场”这条路线。", "priority": "optional"}, {"title": "The office of the future: a unified approach to image-based modeling and spatially immersive displays", "authors": "Ramesh Raskar et al.", "year": 1998, "venue": "SIGGRAPH 1998", "url": "https://doi.org/10.1145/280814.280861", "citations": 1020, "role_zh": "提出用相机阵列实时采集、用投影构建沉浸式显示的远程协作设想，Tele-Aloha 等论文把它视为 3D 临场研究的起点。", "priority": "optional"}, {"title": "blue-c: a spatially immersive display and 3D video portal for telepresence", "authors": "Markus Gross et al.", "year": 2003, "venue": "ACM TOG 22(3) (SIGGRAPH 2003)", "url": "https://doi.org/10.1145/882262.882350", "citations": 163, "role_zh": "早期完整的沉浸式 3D 视频临场系统：CAVE 式房间的 3 面投影幕由液晶玻璃制成，与投影仪、快门眼镜、相机同步切换，让 16 台相机能“透过幕墙”拍摄用户；重建结果以不规则点样本作为 3D 视频图元进行编码、传输和溅射渲染。“显示与采集同时进行”和“点表示 + 流式传输”这两个后来反复出现的系统问题，在这里第一次被放在一起解决。", "priority": "optional"}], "prereqs": ["v-codec", "v-perception", "d-tsdf", "d-stereo", "g-rig", "d-sensors", "i-blending", "i-warping", "v-temporal"], "relation_to_anchors_zh": "Quark 出自 Google 团队（与 DeepView、Immersive LF Video 是同一批作者）。它的设定（8 路已标定相机、基线不超过 30 cm、单卡 1080p/30 fps）正好落在 Starline/Beam 这类固定舱体的舒适区，但论文没有任何系统级数据：没有采集、编码、传输和显示延迟，没有双目或多观看者，也没有人像评测。放回系统中看，它相当于替换了 Starline 接收端“image-based fusion + cos² 法向权重混合”这一格的学习式模块，用 32.2 ms 换来了不再需要深度传感器，以及对非朗伯外观更好的处理。作为对照，Starline 这一格的几何部分只用 1.5 ms，而且这 1.5 ms 已包含双眼两个视点。Ha et al. 直接从 Starline 继承了 image-based TSDF，参数逐项一致；它把适用范围从“主动立体 RGB-D 采集舱 + 人物”推广到“RAFT-Stereo 深度 + 一般动态场景”，并补上了 Starline 明确缺失的时间历史。它“一致性优先”的思路与 Montage4D 的时间纹理场一脉相承。VirtualCube 的 V-Cube View 是理解两篇锚点最好的“系统版”入门：目标视点深度在 1/4 分辨率上用 MVS 代价体估计（5 ms），Lumi-Net 在 1/4 分辨率上预测混合权重（2 ms），在全分辨率上混合纹理后再做 20 ms 的后处理。这与 Quark 的“在低分辨率上求几何和权重、在全分辨率上做 IBR 取样”，以及 Ha et al. 的“目标视点深度引导 + U-Net 预测融合权重”在结构上一一对应。Tele-Aloha 则补上了 Ha et al. 缺失的那一段：把级联视差估计（4.7 ms）、Gaussian 光栅化特征和输入视图加权混合一起放进 23.5 ms，并报告了低于 150 ms 的端到端延迟。", "debates_zh": ["主动深度传感器还是纯 RGB：Holoportation、Starline、VirtualCube 依赖近红外或 ToF 深度；Tele-Aloha、Beam、Quark、Ha et al. 走纯 RGB 加学习的路线。前者在弱纹理和暗光下更稳，后者便宜、分辨率高，但依赖训练数据的分布。", "发送端渲染、接收端渲染还是云端渲染：需要在带宽、视点回传延迟、多方扩展性和隐私之间取舍。", "显式几何 + IBR（Starline、Ha et al.）、学习式表示（Quark 的 LDM、feed-forward 3DGS）还是化身（Codec Avatars、Mon3tr）：这是保真度、带宽与“看到的是否真实”之间的取舍。", "头显还是裸眼 3D：HMD 天然提供双目画面，但遮住了面部，妨碍目光接触；自动立体屏或光场屏免穿戴，但通常只服务一位观看者，可视角度也有限。", "评价标准：逐帧 PSNR 和用户研究哪个更有说服力？Starline 同时做了 117 人、308 次真实会议的部署调查（超过 87% 的反馈认为优于常规视频会议）和 25 人的组内对照实验（回忆对话内容时多写 27.87%）；实验室条件与真实网络条件之间的差距有多大，仍缺少数据。"], "open_questions_zh": ["在单块消费级 GPU 上，包含深度估计、双目渲染和编解码的完整管线能否稳定做到端到端 100 ms 以内、60 Hz？", "怎样把逐帧无状态的渲染核心（Quark、Ha et al.）改造成带时间记忆的版本，并在视点切换和输入相机集合切换时不跳变？", "多方会议与多观看者：视点相关表示的算力随观看者人数线性增长，是共享计算，还是改用可复用的持久表示？", "标定与同步漂移的在线检测和校正（例如 Tele360 用可微 Levenberg–Marquardt 在线优化相机参数）怎样成为标准模块？", "需要统一的系统级基准：同时报告 motion-to-photon 延迟、带宽、时间闪烁、双目一致性和主观评测。"], "resources": [{"title": "Project Starline: A High-Fidelity Telepresence System（论文页，含 PDF）", "url": "https://research.google/pubs/project-starline-a-high-fidelity-telepresence-system/", "type": "paper", "note_zh": "系统论文的范本。第 4 节逐一给出采集、跟踪、压缩（4.5 节，表 1 列出各路码率）、image-based fusion（4.6 节）和显示的设计与数字，附录有深度压缩消融。读 Ha et al. 之前必读 4.6 节。"}, {"title": "Google Beam technology specifications", "url": "https://beam.google/technology/", "type": "blog", "note_zh": "Starline 产品化后的官方参数：6 台高速相机、65 英寸光场屏（3320 万像素）、60 fps、每端至少 50 Mbps 对称带宽且到每台设备的网络延迟低于 100 ms、通话功耗 600 W，可以作为系统设计的真实约束。"}, {"title": "Montage4D project page", "url": "https://montage4d.com/", "type": "paper", "note_zh": "论文（I3D 2018 与 JCGT 2019 扩展版）和演示视频的入口，另附几个风格化/重光照 shader 示例。配合论文阅读，可以理解 Holoportation 的纹理融合方式和时间纹理场。"}, {"title": "Latency in Real-Time 3D Volumetric Streaming: A Comprehensive Study", "url": "https://arxiv.org/abs/2605.22131", "type": "paper", "note_zh": "2026 年的实测研究，把体积视频流的延迟拆成应用层、传输协议层和网络层逐层测量并定位瓶颈，正好补上锚点论文缺失的系统延迟视角。"}]}, {"id": "a-compression", "title_zh": "体积视频与神经表示的压缩传输", "title_en": "Compression & streaming of volumetric and neural representations", "overview_zh": "三维临场的数据量远远超过 2D 视频。8 路 1080p、30 fps 的原始 RGB 约为 8×1920×1080×24 bit×30 ≈ 11.9 Gbit/s。原版 3DGS 每个 Gaussian 存 59 个 float（236 字节），Mip-NeRF360 场景平均 734 MB；如果每帧都存一份，根本无法流式传输。可用的网络预算却只有几十 Mbit/s：Starline 的 7 路流实测为 28–102 Mbit/s，Google Beam 要求每端至少 50 Mbps。压缩传输要回答三个问题：传什么（多视角 RGB(-D)、点云或网格、Gaussian 参数、神经特征，还是渲染好的 2D 画面）；怎样消除空间、视间和时间上的冗余；压缩误差怎样传导到新视角的渲染质量上。\n\n核心思想分两大流派。第一派是“借用 2D 视频编码器”：把 3D 数据排成 2D 图像序列，交给 HEVC/VVC 这类有硬件支持的编解码器。MPEG V-PCC 把点云切成补丁，投影为几何图、属性图和占用图；MIV 把多视角纹理加深度中冗余的像素修剪掉，剩余补丁打包成 atlas，并用 10 bit 归一化视差表示深度；Starline 直接把 3 路深度（10 bit，放在 Y 通道）和 4 路彩色编码为 H.265；VideoRF、V^3、Self-Organizing Gaussians 把神经特征或 Gaussian 属性排成平滑的 2D 图，再交给图像或视频编码器。这一派的优势是有硬件编解码、延迟低、功耗低、码率控制成熟。第二派是“学习式率失真优化”：以 L=R+λD 为目标联合训练量化和概率模型，用算术编码逼近熵下限，代表是 Ballé 的 hyperprior。在 3DGS 上，这一派发展出剪枝加矢量量化（LightGaussian）和以 hash grid 为上下文的熵编码（HAC）；在动态场景上，则发展为只编码帧间残差（ReRF、3DGStream、QUEEN）。此外，MPEG G-PCC 用原生的八叉树编码几何。\n\n演化。2014–2015 年 MV-HEVC（HEVC 第 2 版）与 3D-HEVC（第 3 版）把视间预测和深度编码工具写进标准，Tech 等在 2016 年发表了官方综述。2015 年 Collet 等把跟踪网格和纹理编码为 MPEG 流，平均 9.5 Mbps，但完全离线（据 Tang 等引述，处理约 30 s/帧，需要约 70 台工作站的集群）。2018 年 Ballé 提出 hyperprior；Tang 等在 Holoportation 类数据上用 TSDF 块潜空间做到 30 fps 的实时 4D 压缩，几何部分约 7 Mbps。2019 年 Schwarz 等综述了 V-PCC 和 G-PCC，DVC 提出端到端的学习式视频编码。2021 年 MIV 进入国际标准流程，Starline 采用 7 路 RGB-D H.265 流。2023–2024 年神经表示压缩集中涌现：ReRF（约三个数量级压缩）、VideoRF、LightGaussian（15×）、SOG（17–42×）、HAC（相对 3DGS 超过 75×）、3DGStream 与 QUEEN（流式动态 Gaussian）。2025–2026 年进入“率感知 + 标准化 + 前馈”阶段，代表是 4DGC、D-FCGS、MPEG 高斯溅射编码（GSC）的 V-PCC/G-PCC 修正案，以及 GS-SCNet 这类联合编码方案。\n\n现状（截至 2026-09）。静态 3DGS 的压缩已达百倍量级，而且渲染不一定降速：HAC 在 BungeeNeRF 上为 283 FPS，高于原版 3DGS 的 75 FPS（在 Synthetic-NeRF 上则是 341 对 401 FPS）。动态流式仍不适合实时临场：QUEEN 的 0.7 MB/帧在 30 fps 下约为 168 Mbit/s，且每帧需要不到 5 s 的在线训练；3DGStream 约 12 s/帧。面向临场的前沿因此转向两个方向。(a) 前馈式编码：编码器直接输出紧凑的 Gaussian 或语义潜变量，例如 D-FCGS 和 GS-SCNet（发送端 52 ms、接收端 31 ms；在 PSNR 下相对“MV-HEVC + GPS-Gaussian”基线平均节省约 75% BD-rate）。(b) 继续传多视角视频，在解码端重建，例如 MIV 的解码端视图合成，以及在 MIV 的解码端深度估计（DSDE）配置下，把解码端的深度估计换成前馈 3DGS 推理的 DSGS。标准层面，MPEG 的 Gaussian Splat Coding 修正案在 2026 年到达 CDAM 阶段。Quark 和 Ha et al. 这类方法“逐帧、逐视点、用完即丢”，真正需要压缩的是它们的输入，即多视角 RGB(-D) 视频；而压缩伪影与 IBR 混合、深度融合之间的相互作用，目前研究很少。DSGS 报告了一个反直觉的结果：对前馈 3DGS 而言，有损 2D 编码相当于在输入端做了低通滤波，合成质量反而更好；这个结论能否推广到 Quark、Ha et al. 这类依赖精确像素对应的 IBR 方法，尚未验证。", "key_ideas": [{"name_zh": "率失真优化与熵编码：比特从哪里省", "explain_zh": "直觉：压缩 = 量化（丢掉看不出来的精度）+ 熵编码（常见的值用短码）。如果概率模型给某个符号的概率是 p，算术编码大约要用 \\(-\\log_2 p\\) 比特：p=0.5 时 1 bit，p=0.01 时约 6.64 bit。所以“压得好”等价于“预测得准”。学习式编解码器把编码器、量化和概率模型放在一起训练，目标是公式 1 的 R+λD；因为取整不可导，训练时用加均匀噪声来代替。Ballé 2018 的 hyperprior 额外传一小段“边信息” z，用它预测主潜变量每个元素的尺度（方差），让概率模型随图像内容自适应，作用相当于传统编解码器中的量化参数和上下文模型。HAC 把同样的思路搬到 3DGS 上：以 Scaffold-GS 的锚点为编码对象，用一个二值 hash grid 在锚点位置插值出上下文特征，再由 MLP 预测每个属性的高斯分布均值和方差，之后做自适应量化和算术编码。它相对原版 3DGS 压缩超过 75×，相对 Scaffold-GS 超过 11×。与锚点的联系：两篇锚点都完全没有码率的概念。但它们需要的输入（Quark 的 8 路 RGB，Ha et al. 的 K 路 RGB 加深度）在进入网络之前，必然已经被某个编解码器按 R+λD 处理过。λ 取多少、失真 D 用什么度量，决定了锚点网络实际看到的图像是什么样子。"}, {"name_zh": "把 3D 变成 2D 视频：V-PCC、MIV 与 RGB-D 流", "explain_zh": "直觉：硬件视频编码器是现成的“压缩引擎”，只要把 3D 数据排成时间上连贯、空间上平滑的 2D 图像，就能直接使用。V-PCC 把点云分割成法向相近的补丁，投影成几何图（深度）、属性图（颜色）和占用图，打包后用 HEVC 编码。MPEG 在 2018 年 10 月第 124 次会议（澳门）上公布，当时的 V-PCC 编码器压缩比约 125:1，100 万点的动态点云约 8 Mbit/s 即可有较好的主观质量；Graziosi 等 2020 年的综述报告，参考软件 TMC2 v8 在 10–15 Mbps 下已有良好视觉质量，而 v1 需要 30–40 Mbps。G-PCC 直接用八叉树编码几何，更适合稀疏的激光雷达点云。MIV 面向多相机视频：一部分视图被标为“基础视图”并完整保留；其余“附加视图”中，能由基础视图重投影得到的像素被修剪掉，剩余像素聚成补丁并打包成 atlas；在通用测试条件（CTC）中，纹理和几何都用 HEVC Main10（10 bit）编码（MIV 本身与具体编解码器无关）。解码端先重建各视图，然后做一个只基于深度的可见性 pass，再做着色 pass，按“视图离当前视口越近、权重越大”的规则混合。与锚点的联系：MIV 的解码端渲染器本质上就是一个不带学习的 Ha et al.：输入若干视图的纹理和深度，做前向投影、可见性判断和按距离加权的混合。Ha et al. 的消融中，“Distance-based Blending”只有 26.08 dB，完整模型为 31.17 dB。这说明把 MIV 的渲染器换成学习式融合网络（或者像 DSGS 那样换成解码端 Gaussian splatting）还有很大的提升空间。"}, {"name_zh": "深度怎么编码：视差量化、位深，以及“深度比颜色更贵”", "explain_zh": "直觉：视频编码器是为人眼看颜色设计的，而深度误差会被几何放大成像素错位，所以深度通常需要更高的位深和更小的量化步长。MIV 按公式 2 把归一化视差（1/深度）线性量化到 10 bit：近处精细、远处粗糙，这与立体视觉的误差特性一致（见 g-depth）。数值例子：设 z_near=0.5 m、z_far=3 m，视差范围为 2−0.333=1.667 m⁻¹，10 bit 的步长约为 0.00163 m⁻¹。在 2 m 处，对应的深度步长约为 \\(z^2\\Delta d=4\\times0.00163\\approx6.5\\) mm；在 3 m 处约为 14.7 mm；如果只用 8 bit，2 m 处的步长约为 26 mm。Ha et al. 的 TSDF 截断距离 τ 只有 20 mm：一个 8 bit 量化台阶就比整个截断带还宽（最大取整误差约 13 mm，也已达到 τ 的三分之二），表面过零点的位置只能以远粗于 τ 的精度确定。Starline 同样用 10 bit 深度（放在 Y 通道，UV 置为 512），深度 QP=14、彩色 QP=22。它的表 1 显示，穿纯色衣服静坐时总码率 28.0 Mbit/s 中，3 路深度占了 23.7 Mbit/s（约 85%）；穿高频纹理衣服挥动手臂时，总码率 102.3 Mbit/s 中深度占 49.7 Mbit/s（约 49%）；附录实验表明，10 bit 的 H.265 深度压缩对最终渲染没有明显影响。MIV 还观察到，压缩伪影会在前景与背景的过渡处造成明显的视图合成伪影，因此标准允许降低几何图的分辨率。与锚点的联系：Quark 的 LDM 各层同样在近、远平面之间按等视差间隔排布（anchor δ=(ℓ−0.5)/L），与 MIV 的视差量化遵循同一个“逆深度均匀采样”原理。Ha et al. 依赖公制的 τ=0.02 m 和 RAFT-Stereo 深度；深度一旦经过有损传输，这个阈值是否仍然合适，论文从未检验过。"}, {"name_zh": "静态 3DGS 压缩：剪枝、量化与结构化排列", "explain_zh": "直觉：3DGS 的存储大头不在位置，而在外观。每个 Gaussian 有 59 个 float：位置 3、尺度 3、旋转四元数 4、不透明度 1、三阶球谐系数 16×3=48，其中球谐占了 81%。相应的压缩手段有三类：减少 Gaussian 的数量（剪枝）；降低每个属性的比特数（量化或降阶）；利用属性之间的空间相关性（结构化排列加熵编码）。LightGaussian 按“全局重要性”剪枝并做恢复训练，再用知识蒸馏把球谐降到更低的阶，最后按重要性做矢量量化。它平均压缩 15×，同时把渲染速度从 144 FPS 提到 237 FPS（Mip-NeRF360 上原版 3DGS 平均 734 MB）。Self-Organizing Gaussians 把 Gaussian 属性排列到 2D 网格上，并在训练中约束邻域平滑，使之可以直接用成熟的图像编解码器压缩，达到 17–42×。HAC 在 Scaffold-GS 的锚点结构上做上下文熵编码（见第 1 条），压缩超过 75×。与锚点的联系：Ha et al. 的“像素级 Gaussian”正是一个极端情况。它为每个输入像素生成一个完全不透明、各向同性、尺度按解析式确定的 Gaussian，因此不需要传输任何 Gaussian 参数，只需要传 RGB 图和深度图，Gaussian 在接收端由深度即时生成。这说明“传图像加深度，在接收端生成 Gaussian”本身就是一种极致的参数压缩，代价是无法表达半透明和视角相关的外观。"}, {"name_zh": "动态场景：只编码“变化”", "explain_zh": "直觉：视频中大部分内容在帧与帧之间几乎不变，传统编码用运动补偿加残差来利用这一点，体积视频也一样。ReRF 用紧凑的运动网格加残差特征网格表示相邻帧之间的差异，配合专门设计的 FVV 编解码器，达到约三个数量级的压缩。3DGStream 用由 hash grid 和小 MLP 组成的 Neural Transformation Cache 预测每个 Gaussian 的平移和旋转，再自适应地添加新 Gaussian 来处理新出现的物体；每帧在线训练约 12 s，渲染 200 FPS。QUEEN 直接学习相邻帧之间所有 Gaussian 属性的残差：用学习的潜变量解码器量化位置以外的残差，用门控模块把位置残差稀疏化，并以视图空间梯度差区分静态和动态区域。在高动态场景下，它约为 0.7 MB/帧，每帧训练不到 5 s，渲染约 350 FPS。数值例子：0.7 MB/帧 × 8 bit × 30 fps ≈ 168 Mbit/s，仍然高于 Starline 的 30–100 Mbit/s 区间，更不用说每帧数秒的训练延迟。与锚点的联系：Ha et al. 的颜色差分掩码 \\(M=\\min(|I^t-I^{t-1}|/\\lambda_t+\\beta,1)\\) 与 QUEEN 的静动分离利用的是同一个事实：机位固定时，画面的大部分是静态的。前者用它来稳定深度，后者用它来节省比特。两者是“时间冗余”的两种用法，一个系统完全可以共用这个信号。"}, {"name_zh": "让神经表示“长得像视频”：硬件解码与神经前后处理", "explain_zh": "直觉：学习式编解码器压得更好，但手机和头显上通常只有视频硬解码单元。折中的办法有两种：改造表示去适应现成的编解码器，或者在标准编解码器的前后各加一个神经网络。VideoRF 把 4D 辐射场序列化成 2D 特征图像流，训练时就约束它的时空冗余，从而可以用 2D 视频编码器压缩、借助硬件解码，在移动端实时渲染。V^3 同样把动态 Gaussian 当作 2D 视频处理，并配套了多平台播放器。Starline 选择 GPU 上的 NVENC/NVDEC，四块 GPU 的硬件编解码单元足以在 60 Hz 下处理 7 路全分辨率视频流。面向立体视频会议的 Sandwiched RGB-D 压缩（Hu、Guleryuz、Chou 等，Google，CVPR 2024 Workshop）在标准编解码器前后各包一个神经网络，用图像编解码器的可微代理端到端训练，并使用几何感知损失；在新视角渲染质量相同时，它比常规编码和 MV-HEVC 节省约 30% 码率，而且不需要升级硬件。与锚点的联系：要把 Quark 或 Ha et al. 部署进真实系统，这条“神经前后处理 + 硬件编解码”的路线最容易落地，因为它不改变锚点网络的输入格式，输入仍然是多视角 RGB 或 RGB-D。"}, {"name_zh": "压缩误差怎样传到新视角：以渲染质量为目标的编码", "explain_zh": "直觉：编解码器最小化的是每一路视频自身的失真，而观看者看到的是由多路视频合成出的新视角，两者并不等价。MIV 标准化过程中的经验是，压缩伪影会在前景与背景的边缘被视图合成放大。多路视频各自独立编码时，同一个表面在不同视图中的颜色偏差、块效应，以及 GOP 边界处 I 帧引起的“呼吸”效应也各不相同。对 Quark 来说，这种跨视图的颜色不一致正是它自述的弱点：输入曝光不一致或标定有误差时，会出现硬边和闪烁。对 Ha et al. 来说，编码噪声会被颜色差分掩码误当成运动，导致少用历史深度；深度的编码误差则会直接进入 τ=2 cm 的 TSDF。两篇论文都只在没有经过有损传输的数据上训练和评测。任务感知编码试图直接优化“渲染之后的质量”：GS-SCNet 把视差引导的并行语义编解码器与 feed-forward 3DGS 参数预测器联合训练，编码端 52 ms、解码端 31 ms（19.2 FPS），在 PSNR 下相对“MV-HEVC + GPS-Gaussian”基线平均节省约 75% BD-rate。DSGS 则发现，对 MIV 解码端的前馈 3DGS 而言，有损编码起到了低通滤波的作用，合成质量不降反升。度量本身也有问题：GScomp-QA 的主观实验（331 段视频、9 种 GS 压缩方法）显示，18 种常用客观指标都不能完整反映 GS 压缩失真。"}], "equations": [{"tex": "\\min_{\\theta}\\ \\mathcal L=R+\\lambda D=\\mathbb E_{\\mathbf x}\\big[-\\log_2 p_\\theta(\\hat{\\mathbf y})\\big]+\\lambda\\,\\mathbb E_{\\mathbf x}\\big[d(\\mathbf x,\\hat{\\mathbf x})\\big],\\qquad \\hat{\\mathbf y}=\\mathrm{round}\\big(g_a(\\mathbf x)\\big),\\quad \\hat{\\mathbf x}=g_s(\\hat{\\mathbf y})", "explain_zh": "学习式编解码的率失真目标（Ballé 等）。x：待压缩的信号（图像、Gaussian 属性或特征网格）；g_a：分析变换，即编码器，输出潜变量 y；round：量化，训练时用加 U(−½,½) 均匀噪声来代替；g_s：合成变换，即解码器；p_θ：学习的概率模型（hyperprior，或 HAC 的 hash-grid 上下文模型），\\(-\\log_2 p_\\theta(\\hat{\\mathbf y})\\) 是算术编码所需的比特数，其期望就是码率 R；d：失真度量（MSE、1−MS-SSIM 或渲染损失）；λ：拉格朗日乘子，用来调节码率与质量，一个 λ 对应率失真曲线上的一个点。例：若 p_θ 给某个量化值的概率是 0.25，这个值约花 2 bit；把 λ 加倍，模型会倾向于多花比特来换更低的失真。"}, {"tex": "d_{q}=\\mathrm{round}\\!\\left(1023\\cdot\\frac{d-d_{\\mathrm{far}}}{d_{\\mathrm{near}}-d_{\\mathrm{far}}}\\right),\\qquad d=\\frac{1}{z},\\qquad \\Delta z\\approx z^{2}\\,\\frac{d_{\\mathrm{near}}-d_{\\mathrm{far}}}{1023}", "explain_zh": "MIV 的 10 bit 几何（深度）量化，对应 Boyce 等 2021 的式 (1)；取整和误差近似是本页补充的。z：深度，单位米；d=1/z：视差（归一化视差）；d_near=1/z_near 和 d_far=1/z_far：随每个视图元数据传输的视差上下限；d_q∈[0,1023]：写进 10 bit 视频亮度通道的整数；Δz：一个量化步对应的深度间隔（最大取整误差是它的一半），由 \\(\\mathrm dz=-z^2\\,\\mathrm dd\\) 得到，随深度的平方增长。例：z_near=0.5 m、z_far=3 m 时，2 m 处 Δz≈6.5 mm，3 m 处约 14.7 mm；换成 8 bit（把 1023 换成 255）后，2 m 处约 26 mm，一个台阶就超过了 Ha et al. 的 TSDF 截断 τ=20 mm。Quark 的 LDM 层深度同样在视差区间 [1/f, 1/η] 内按等间隔的 anchor 排布（η 为近平面深度、f 为远平面深度），原理相同。"}, {"tex": "S_{\\mathrm{3DGS}}=N\\times(3+3+4+1+48)\\times4\\ \\mathrm{B}=236\\,N\\ \\mathrm{B},\\qquad B_{\\mathrm{stream}}=8\\,S_{\\mathrm{frame}}\\,f", "explain_zh": "原版 3DGS 的存储量与流式码率估算。N：Gaussian 的个数；括号里依次是位置 3、尺度 3、旋转四元数 4、不透明度 1、三阶球谐 16 个系数×RGB 3 通道=48，每个 float32 占 4 字节；S_frame：每帧需要传输的字节数；f：帧率；B_stream：比特率，乘 8 是把字节换成比特。例：N=100 万时每帧 236 MB，如果每帧都传一份完整的 3DGS，30 fps 需要约 56.6 Gbit/s。QUEEN 把残差压到 0.7 MB/帧后，码率为 0.7×8×30≈168 Mbit/s。对照 Starline 的 30–100 Mbit/s 和 Beam 的 50 Mbps 下限，动态 Gaussian 流还需要再压一个量级，否则就应该改为传输多视角视频、在接收端重建。"}], "evolution": [{"year": 2015, "milestone_zh": "MV-HEVC（2014 年 HEVC 第 2 版）与 3D-HEVC（2015 年第 3 版）定稿，标准化了视间预测和深度图编码工具；Tech 等 2016 年发表官方综述。"}, {"year": 2015, "milestone_zh": "Collet 等把跟踪网格和纹理编码为 MPEG 流（平均 9.5 Mbps），但处理完全离线：据 Tang 等引述，约 30 s/帧，需要约 70 台高端工作站组成的集群。"}, {"year": 2018, "milestone_zh": "Ballé 等提出 hyperprior 学习式图像压缩；Tang 等用 TSDF 块潜空间实现 30 fps 的实时 4D 压缩（几何约 7 Mbps）。"}, {"year": 2019, "milestone_zh": "Schwarz 等系统介绍 MPEG V-PCC 与 G-PCC；DVC 提出端到端的学习式视频编码。"}, {"year": 2021, "milestone_zh": "MIV（ISO/IEC 23090-12）综述发表，第 1 版进入 DIS/FDIS 阶段，确立“视图 + 视差深度 atlas + 解码端视图合成”的框架；Starline 采用 7 路 RGB-D H.265 流，码率 28–102 Mbit/s。"}, {"year": 2023, "milestone_zh": "ReRF 用运动网格加残差网格实现约三个数量级的动态辐射场压缩，并支持长序列流式播放。"}, {"year": 2024, "milestone_zh": "3DGS 压缩集中涌现：LightGaussian（15×）、SOG（17–42×）、HAC（超过 75×）；流式方面有 3DGStream（约 12 s/帧）、QUEEN（0.7 MB/帧）、VideoRF、V^3；Sandwiched RGB-D 压缩比 MV-HEVC 节省约 30% 码率。"}, {"year": 2025, "milestone_zh": "4DGC 做率感知的 4D Gaussian 压缩，D-FCGS 实现前馈式动态 Gaussian 压缩；MIV 第 2 版到达 FDIS 阶段，V-DMC 到达 FDIS 阶段。"}, {"year": 2026, "milestone_zh": "MPEG Gaussian Splat Coding 的 V-PCC 修正案（1 月，第 153 次会议）和 G-PCC 修正案（第 154 次会议）先后到达 CDAM 阶段；GS-SCNet（联合编码与 feed-forward 3DGS）、DSGS（MIV 解码端前馈 Gaussian splatting）把压缩与渲染联合设计；GScomp-QA 发布 GS 压缩的主观质量数据集。"}], "papers": [{"title": "Emerging MPEG Standards for Point Cloud Compression", "authors": "Sebastian Schwarz et al.", "year": 2019, "venue": "IEEE JETCAS 9(1)", "url": "https://doi.org/10.1109/JETCAS.2018.2885981", "citations": 748, "role_zh": "V-PCC 与 G-PCC 的权威介绍：补丁投影加 2D 视频编码，对比八叉树几何编码。这是理解“把 3D 变成 2D 视频”的起点。", "priority": "must"}, {"title": "MPEG Immersive Video Coding Standard", "authors": "Jill M. Boyce et al.", "year": 2021, "venue": "Proceedings of the IEEE 109(9)", "url": "https://doi.org/10.1109/JPROC.2021.3062590", "citations": 134, "role_zh": "MIV 标准与 TMIV 参考软件：基础视图与附加视图、修剪、atlas 打包、10 bit 视差量化、解码端视图合成。它是与 Ha et al. 和 Quark 的输入格式最接近的标准。", "priority": "must"}, {"title": "Variational image compression with a scale hyperprior", "authors": "Johannes Ballé et al.", "year": 2018, "venue": "ICLR 2018", "url": "https://arxiv.org/abs/1802.01436", "citations": 2513, "role_zh": "学习式图像压缩的 hyperprior 框架：编码器与熵模型联合训练，以率失真为目标。HAC 等 3DGS 熵编码方法的方法论都来源于此。", "priority": "must"}, {"title": "HAC: Hash-grid Assisted Context for 3D Gaussian Splatting Compression", "authors": "Yihang Chen et al.", "year": 2024, "venue": "ECCV 2024", "url": "https://arxiv.org/abs/2403.14530", "citations": 300, "role_zh": "第一个面向 3DGS 的上下文熵编码方法：用 hash grid 提供锚点上下文，以高斯分布估计概率，结合自适应量化和算术编码，相对原版 3DGS 压缩超过 75×。", "priority": "must"}, {"title": "3DGStream: On-the-Fly Training of 3D Gaussians for Efficient Streaming of Photo-Realistic Free-Viewpoint Videos", "authors": "Jiakai Sun et al.", "year": 2024, "venue": "CVPR 2024 (Highlight)", "url": "https://arxiv.org/abs/2403.01444", "citations": 210, "role_zh": "在线流式自由视点视频：用 NTC 预测 Gaussian 的平移和旋转，并自适应添加新 Gaussian；每帧约 12 s，渲染 200 FPS，是动态 Gaussian 流式传输的基线。", "priority": "must"}, {"title": "Overview of the Multiview and 3D Extensions of High Efficiency Video Coding", "authors": "Gerhard Tech et al.", "year": 2016, "venue": "IEEE TCSVT 26(1)", "url": "https://doi.org/10.1109/TCSVT.2015.2477935", "citations": 442, "role_zh": "MV-HEVC 与 3D-HEVC 的官方综述，涵盖视间预测和深度图编码工具，是 RGB-D 与多视角视频编码的基础。", "priority": "should"}, {"title": "LightGaussian: Unbounded 3D Gaussian Compression with 15x Reduction and 200+ FPS", "authors": "Zhiwen Fan et al.", "year": 2023, "venue": "NeurIPS 2024", "url": "https://arxiv.org/abs/2311.17245", "citations": 663, "role_zh": "全局重要性剪枝、球谐蒸馏降阶加矢量量化，平均压缩 15×，并把渲染速度从 144 FPS 提到 237 FPS。", "priority": "should"}, {"title": "Compact 3D Scene Representation via Self-Organizing Gaussian Grids", "authors": "Wieland Morgenstern et al.", "year": 2023, "venue": "ECCV 2024", "url": "https://arxiv.org/abs/2312.13299", "citations": 207, "role_zh": "把 Gaussian 属性排成局部平滑的 2D 网格，再用现成的图像编解码器压缩（17–42×），体现了“把神经表示图像化、视频化”的思路。", "priority": "should"}, {"title": "QUEEN: QUantized Efficient ENcoding of Dynamic Gaussians for Streaming Free-viewpoint Videos", "authors": "Sharath Girish et al.", "year": 2024, "venue": "NeurIPS 2024", "url": "https://arxiv.org/abs/2412.04469", "citations": 36, "role_zh": "学习帧间属性残差，采用量化-稀疏框架并做静动分离；0.7 MB/帧，每帧训练不到 5 s，渲染 350 FPS，明确以 3D 视频会议为目标场景。", "priority": "should"}, {"title": "Neural Residual Radiance Fields for Streamably Free-Viewpoint Videos", "authors": "Liao Wang et al.", "year": 2023, "venue": "CVPR 2023", "url": "https://arxiv.org/abs/2304.04452", "citations": 105, "role_zh": "用运动网格加残差特征网格表示相邻帧的差异，配套 FVV 编解码器，实现约三个数量级的压缩和长序列流式播放。", "priority": "should"}, {"title": "VideoRF: Rendering Dynamic Radiance Fields as 2D Feature Video Streams", "authors": "Liao Wang et al.", "year": 2023, "venue": "CVPR 2024", "url": "https://arxiv.org/abs/2312.01407", "citations": 31, "role_zh": "把动态辐射场序列化成 2D 特征图像流，用标准视频编码和硬件解码在移动端实时播放。", "priority": "optional"}, {"title": "Real-time compression and streaming of 4D performances", "authors": "Danhang Tang et al.", "year": 2018, "venue": "ACM TOG 37(6) (SIGGRAPH Asia 2018)", "url": "https://doi.org/10.1145/3272127.3275096", "citations": 37, "role_zh": "在 Holoportation 类的 8 路 RGB-D 数据上实时压缩 TSDF：把 TSDF 块投影到学习得到的低维 SDF 潜空间，再量化编码；30 fps，几何约 7 Mbps，比基于网格的方法快两个数量级。", "priority": "optional"}, {"title": "One-Click Upgrade from 2D to 3D: Sandwiched RGB-D Video Compression for Stereoscopic Teleconferencing", "authors": "Yueyu Hu et al.", "year": 2024, "venue": "CVPR 2024 Workshops (AIS)", "url": "https://arxiv.org/abs/2404.09979", "citations": 2, "role_zh": "在标准 H.264/HEVC 编解码器前后各加一个神经网络（sandwich），用几何感知损失端到端训练，让现成的 2D 硬件编解码器直接承载立体 RGB-D 视频；在新视角渲染质量相同时比常规编码和 MV-HEVC 省约 30% 码率。它是“不改锚点网络输入格式、只改传输层”的最直接范例。", "priority": "optional"}], "prereqs": ["v-codec", "r-reps", "g-depth", "n-3dgs", "n-dynamic", "f-prob", "i-layered", "v-metrics"], "relation_to_anchors_zh": "（1）两篇锚点都完全没有带宽分析。Quark 没有报告采集、编码和传输；Ha et al. 没有说明渲染放在发送端还是接收端，也没有给出码率数据。它们的中间表示（Quark 的逐目标视点 LDM，Ha et al. 的目标视点 TSDF 深度和前向 splat 图）每帧即时生成、用完即丢，因此不存在可以压缩并复用的 3D 表示。能传输的只有输入（多视角 RGB，或 RGB 加深度），或者渲染好的 2D 画面。（2）如果在接收端渲染：Quark 需要离观看者最近的 8 路 RGB。粗略计算，8 路 1080p30 的原始数据约 11.9 Gbit/s；参照 Starline 表 1 中单路彩色流 0.9–20.8 Mbit/s 的实测范围，8 路 HEVC 大约在 7–170 Mbit/s 之间（本页按 8 倍粗略估算，未考虑分辨率差异）。Ha et al. 需要 K 路 RGB 和深度。深度流比彩色流更贵（Starline 穿纯色衣服静坐时深度占总码率约 85%，挥臂时约 49%），而且按公式 2 的例子（深度范围 0.5–3 m），要用 10 bit 视差量化，2 m 处的量化台阶（约 6.5 mm）才能明显小于 τ=2 cm。（3）MIV 与 Ha et al. 在结构上同构：MIV 传输“视图纹理 + 视差深度”的 atlas，解码端做深度可见性判断加按距离加权的混合；Ha et al. 做的事，正是把按距离加权混合（26.08 dB）换成几何引导的学习式融合（31.17 dB）。Quark 则可以看作一个不需要深度通道的 MIV 解码端渲染器（MIV 第 1 版就有只传纹理、在解码端估计几何的 Geometry Absent profile）；DSGS 正是沿这个思路，把解码端的深度估计换成了前馈 3DGS。（4）与持久表示路线的对照：3DGStream、QUEEN 等把动态场景压缩成 Gaussian 流，接收端可以为任意多个视点和双眼渲染，这也是 Quark 团队后续的 LVT、Fuse-and-Refine 转向 3DGS 的动机之一。不过这些方法目前每帧仍需数秒优化，只有 GS-SCNet、D-FCGS 这类前馈式编码才有可能跟上 Quark 和 Ha et al. 的实时性。（5）风险：两篇锚点都在无损或高质量的数据上训练和测试。Quark 自述对输入曝光差异和标定误差敏感，出错时是硬边而不是模糊；Ha et al. 的颜色差分掩码对噪声敏感。有损编码可能放大这些弱点，而这一点从未被评测过。", "debates_zh": ["传什么：多视角视频（在接收端渲染，视点自由，但带宽高）、3D 表示（可供多个视点复用，但编码前要先重建），还是渲染好的 2D 画面（带宽最低，但需要回传视点，增加延迟）。", "标准编解码器还是学习式编解码器：前者有硬件支持，延迟和功耗都低；后者率失真性能更好，但需要 GPU 或 NPU，端侧功耗和延迟尚不清楚。", "逐帧优化的流式 Gaussian（QUEEN、3DGStream，每帧秒级）还是前馈式编码（毫秒级）：这是质量与实时性之间的取舍。", "失真怎么度量：看每路视频的 PSNR/BD-rate、合成视点的质量，还是时间一致性？GScomp-QA 等主观数据集显示，客观指标与主观感受并不完全一致。", "标准化之争：MPEG GSC、MIV 与业界的事实格式（例如 Niantic 的 SPZ），谁会成为 Gaussian 交换和流式传输的主流？"], "open_questions_zh": ["面向逐帧、逐视点 NVS（Quark、Ha et al.）的率失真问题：码率给定时，彩色与深度之间、各视图之间应怎样分配比特，才能让合成视点的质量最优？", "NVS 网络对编码伪影的鲁棒性：在压缩数据上训练或微调能否消除这个域差？压缩伪影对时间闪烁指标的影响有多大？", "在低延迟约束下（不用 B 帧、只缓冲一帧），学习式和混合式编解码器还能保留多少优势？", "视点自适应流：观看者头动时只请求最近的 K 路视图，怎样隐藏视图切换的延迟和关键帧开销？", "动态 Gaussian 流的实时编码：能否在 33 ms 内完成一帧的“重建 + 编码”，同时把码率控制在 50 Mbit/s 以内？"], "resources": [{"title": "3DGS.zip: A survey on 3D Gaussian Splatting Compression Methods（交互式对比页）", "url": "https://w-m.github.io/3dgs-compression-survey/", "type": "tutorial", "note_zh": "Fraunhofer HHI、柏林洪堡大学和柏林工业大学维护的 3DGS 压缩方法对比表，在 Tanks&Temples、Mip-NeRF360、Deep Blending、Synthetic-NeRF 上汇总文件大小、PSNR/SSIM/LPIPS、Gaussian 数量和每个 Gaussian 的比特数，可以快速查到 LightGaussian、HAC、SOG 等方法的表现。"}, {"title": "CompressAI", "url": "https://github.com/InterDigitalInc/CompressAI", "type": "code", "note_zh": "PyTorch 学习式压缩库和评测平台，包含 Ballé hyperprior 等经典模型的实现，可以直接复现公式 1 的率失真训练。"}, {"title": "MPEG V-PCC Test Model (mpeg-pcc-tmc2)", "url": "https://github.com/MPEGGroup/mpeg-pcc-tmc2", "type": "code", "note_zh": "V-PCC 官方测试模型（编码器和解码器），可以观察补丁投影以及几何图、属性图、占用图的实际生成过程。"}, {"title": "An overview of ongoing point cloud compression standardization activities: video-based (V-PCC) and geometry-based (G-PCC)", "url": "https://doi.org/10.1017/ATSIP.2020.12", "type": "paper", "note_zh": "Graziosi 等发表在 APSIPA Trans. 2020 的开放获取综述，比 Schwarz 2019 更新，详细描述 TMC2（V-PCC）与 TMC13（G-PCC）的算法，并给出性能量级：例如 TMC2 v8 在 10–15 Mbps 下已有良好视觉质量，G-PCC 无损压缩平均约 3:1。"}]}, {"id": "a-diff-render", "title_zh": "可微渲染与逆渲染", "title_en": "Differentiable & inverse rendering", "overview_zh": "渲染器 R 把场景参数 θ（几何、材质、光照、相机）映射成图像。逆渲染反过来，从观测图像求 θ，通常写成 min_θ Σ_k L(R(θ; P_k), I_k) + 正则。用梯度法求解需要 ∂R/∂θ，但标准图形管线里有两处离散操作不可导。一是光栅化的覆盖测试：一个像素要么在三角形内，要么在外，所以像素颜色对顶点位置的导数几乎处处为 0，只在边缘处出现阶跃。二是 z-buffer：“取最近的面”是一个 argmin。物理渲染里还有阴影边界这类可见性不连续。可微渲染研究的就是怎样让这些不连续处也产生有用的梯度，使“从图像反推 3D”可以直接用梯度下降求解，或者端到端地训练。\n\n处理不连续性有三种思路。(a) 近似梯度：OpenDR（ECCV 2014）用基于图像空间局部近似的导数，NMR（CVPR 2018）为光栅化手工设计近似的反向梯度。(b) 软化前向过程：Soft Rasterizer（ICCV 2019）用 sigmoid 概率图代替二值覆盖，用类 softmax 聚合代替 z-buffer，梯度因此能流向被遮挡和远处的三角形。PyTorch3D 的网格光栅器也实现了 SoftRas 式的软光栅与软混合。(c) 精确处理边界：Li et al.（SIGGRAPH Asia 2018）的 edge sampling 在不连续边上单独采样，得到无偏的蒙特卡洛梯度；Mitsuba 2（SIGGRAPH Asia 2019）与 Dr.Jit（SIGGRAPH 2022）从系统层面提供“同一份代码既能前向渲染、又能自动求导”的物理渲染器，SIGGRAPH 2020 的物理可微渲染课程则系统整理了处理可见性边界的理论。工程上，nvdiffrast（SIGGRAPH Asia 2020）借助硬件光栅化，提供光栅化、属性插值、纹理过滤和解析抗锯齿等模块化可微原语，其中抗锯齿原语负责在轮廓边上产生几何梯度。这篇论文的示范应用正是把人脸表演捕捉写成逆渲染问题。\n\n点和 splat 没有连接关系，天然适合“溅射”式可微渲染，这也是通向 3DGS 的直接路径。DSS（SIGGRAPH Asia 2019）把 EWA 表面溅射做成可微的，并为点的位置和法线专门设计了跨越不连续处的梯度。NPBG（ECCV 2020）给每个点学习一个神经描述子，把点云按多种分辨率光栅化成“伪彩色”图，再用 U-Net 渲染成照片。SynSin（CVPR 2020）用可微点云渲染器把单图特征点云投影到新视角，再用网络补洞，形成“前向 splat + refine”的范式。Pulsar（CVPR 2021）用球体表示和高效的可微渲染引擎，实现了百万级球体的实时优化，并成为 PyTorch3D 的后端之一。NeRF（2020）可以看作以体渲染作为可微渲染器；3DGS（2023）则是可微的各向异性 EWA splatting 加排序 alpha 混合。两者都是本专题的直接后代。\n\n逆渲染的另一个目标是把外观分解为材质和光照，从而支持重光照和编辑。NeRFactor（SIGGRAPH Asia 2021）在单一未知光照下，从多视图恢复法线、光可见性、反照率和 BRDF。nvdiffrec（CVPR 2022）用可微 marching tetrahedra 和可微的 split-sum 环境光近似，联合优化三角网格拓扑、材质和光照，输出可以直接放进传统引擎的模型。还有一条“学习式逆渲染”的路线：DeepView（CVPR 2019）把逆问题的梯度下降展开，让网络根据“渲染图对观测图”的梯度分量学习每一步的更新（learned gradient descent）。Quark 的 render-and-refine 就是它的多尺度、实时版本。截至 2026-09，可微渲染已经成为神经渲染的基础设施（gsplat、nvdiffrast、PyTorch3D、Mitsuba 3），研究重心转向三处：把逆渲染从逐场景优化变成 feed-forward 或少步迭代；用可微优化在线校正相机，例如锚点深读列出的 Tele360（2026）用可微 Levenberg–Marquardt 在线优化相机参数；以及可重光照的高斯表示。", "key_ideas": [{"name_zh": "逆渲染 = 可微前向模型 + 优化", "explain_zh": "直觉：只要能完成“渲染、比较、求导、更新”这个循环，就能从 2D 图像反推 3D 参数，不需要任何 3D 标注。DeepView 用 MPI 把这个过程写得很清楚：渲染 Ĩ_k = O(W_k(M))，其中 W_k 把各层用单应变换 warp 到第 k 个视角，O 是 over 合成；然后对 Σ_k L(I_k, Ĩ_k) 做梯度下降。over 算子的梯度有直观的物理意义：对第 d 层颜色的导数等于它前方所有层的净透射率 Π_{i>d}(1−α_i)；对不透明度的导数取决于它后方的“累积 over”和前方的透射率。数值例子：共 3 层，每层 α=0.5，最后一层（最靠后）颜色的梯度只有 0.5×0.5=0.25。被遮挡得越多，梯度越小，可见性推理就藏在梯度里。与锚点的联系：Quark 的每一个中间 LDM 都用双线性 splat 投到 M=8 个输入视角并做 over 合成，得到 Ĩ（论文强调这里既不用光追也不用光栅化）。这个 Ĩ 就对应 O(W_k(M))，后续的更新由它与观测图之间的差异来驱动。"}, {"name_zh": "可见性不连续与“软化”（Soft Rasterizer）", "explain_zh": "直觉：在硬光栅化里，一个三角形只影响它覆盖的像素。挪动顶点时，像素颜色要么不变，要么突变，梯度没法告诉三角形“往左挪一点就能盖住那个像素”。SoftRas 让每个三角形按距离衰减地影响周围像素，用概率 D_j^i 表示，再用按深度加权的 softmax 聚合多个三角形；σ、γ→0 时，它就退化为标准光栅化和 z-buffer。数值例子：σ=10^{-4}（论文默认值）时，距离边缘 0.01 的外部像素 D=sigmoid(−1)≈0.27，距离 0.02 时 D=sigmoid(−4)≈0.018，影响只延伸到边缘外很窄的一圈（距离在归一化的图像坐标中度量）。代价是前向图像本身也被模糊了，所以通常训练时用“软”版本，推理时用“硬”版本。与锚点的联系：两篇锚点都不渲染网格，但它们的渲染核本身就是“软”的。Quark 用双线性 splat 把 LDM 投到输入视角，Ha 用有限尺寸的高斯做前向 splat，每个基元都平滑地影响相邻像素，所以不需要特殊处理就能得到有意义的梯度。这也解释了为什么 splatting 类表示在可微渲染时代胜出。"}, {"name_zh": "精确边界梯度与物理可微渲染", "explain_zh": "直觉：软化改变了前向结果。如果既要图像物理正确、又要梯度无偏，就必须显式处理不连续边。Li et al. 的 edge sampling 把像素积分对几何参数的导数拆成两部分：一部分是区域内部连续变化的积分，另一部分是沿轮廓边、阴影边的边界积分，后者在边上单独采样估计。这样就能正确地给出阴影和遮挡边缘对几何的梯度。Mitsuba 2 和 Dr.Jit 则从系统层面解决“怎样给整个物理渲染器求导”：Mitsuba 2 是可重定向（retargetable）的渲染器，同一份代码可以编译成前向或可微版本；Dr.Jit 是专为可微渲染设计的即时编译器。SIGGRAPH 2020 的物理可微渲染课程系统讲解了辐射传输的微分理论。与锚点的联系：两篇锚点都没有物理光传输模型。Quark 的视角相关效果只能靠对输入颜色做凸组合、逐帧“过拟合”来近似；Ha 在高光区域深度出错，导致视角和时间一致性破裂（Fig. 9）。物理可微渲染从原理上建模高光、阴影和互反射，但目前离 30 fps 还很远，更可能作为离线的数据生成或标定工具进入远程临场系统。"}, {"name_zh": "可微点渲染与神经点渲染（DSS、NPBG、SynSin、Pulsar）", "explain_zh": "直觉：点云没有拓扑，前后移动一个点不会造成网格翻转，所以很适合用梯度优化；代价是渲染时点与点之间会有空隙，而且容易走样。补救办法有三种：给点一个有限的 splat 半径（DSS 的 EWA 圆盘、Pulsar 的球）；让网络补洞（NPBG 用多尺度光栅化加 U-Net，SynSin 用 refine 网络）；或者两者结合。与锚点的联系：Ha et al. 在 Fig. 10 中把自己的像素级高斯与 Aliev et al.（即 NPBG）式的点溅射做了对比并拒绝了后者，理由是点溅射有像素间空隙和锯齿边，而像素大小的 Gaussian 走样更少，还能处理遮挡。Ha 的整体结构是“逐视角前向 splat 得到 K 张图，再用 4 层 U-Net 预测融合权重并用背景图补洞”，这和 SynSin 的“可微点云投影 + refine 网络”属于同一范式，Ha 的基线 FWD 也出自这一脉。区别在于，Ha 的网络只输出融合权重和背景图，不直接生成前景像素，从而保留了真实纹理。"}, {"name_zh": "学习式梯度下降：从 DeepView 到 Quark 的 render-and-refine", "explain_zh": "直觉：经典逆渲染每一步都要计算 ∂L/∂M，需要几百到几千次迭代，还要手工设计先验。DeepView 的关键观察是：不管损失函数具体长什么样，它对 MPI 的梯度只能是输入图 I_k、渲染图 Ĩ_k、累积 over A_k 和净透射率 T_k 这几个量的函数（Eq. 9）。因此它干脆不显式写出损失和梯度，而是把 N 次迭代“展开”成一个网络：每一步把这四个“梯度分量”经逆 warp W_k^{-1} 变回层空间，交给 CNN N_ω 直接输出更新量。步长和先验都由网络学到，所以只需要很少几步；训练时对最终渲染到留出视角的结果做监督。与锚点的联系：Quark 的 Update & Fuse 共 5 步。(a) 把当前 LDM 渲染到各输入视角得到 Ĩ，对应 O(W_k(M))；(b) Update Block 把 Ĩ、该级输入特征 I_k 和射线编码组合起来，生成含“渲染 vs 观测”可见性残差的 update feature，对应梯度分量；(c) 用当前深度反投影回层空间，对应 W_k^{-1}；(d) Fusion Block 用 One-to-many attention 跨 M 个视角聚合，对应 N_ω。与 DeepView 不同的是，Quark 在迭代过程中逐步升高空间分辨率、减少层数。消融结果：把 Ĩ 置零（去掉 render-and-refine），PSNR 从 30.41 降到 29.71，LPIPS 从 0.154 升到 0.160，运行时间却只省 5.22%；去掉前两步迭代（同时把初始分辨率翻倍），运行时间降低 17.49%，PSNR 仍有 30.32。不了解 DeepView 的公式，“learned gradient descent”“render-and-refine”这些说法就会显得像凭空设计的网络结构。"}, {"name_zh": "穿过渲染器的端到端训练", "explain_zh": "直觉：只要最后一步渲染可微，就能只用 2D 图像监督来训练整个“几何预测网络”，不需要深度真值。与锚点的联系：Quark 的输出为 c_target = O(Σ_m β_m·P^T_θ(I, d), σ)，即把全分辨率输入图按各层深度 d 反投影到 LDM 层，用 blend weights β 做凸组合，再按 density σ 做 over 合成。它对 d、σ、β 都可微，因此整个网络只用留出视角上的 10·L1 + LPIPS 训练；推理时换成 CUDA 优化的渲染器，1080p 约 1.3 ms。Ha et al. 的前向 splat 虽然用了可微的 3DGS 光栅器，但高斯参数是解析设定的，梯度不回传到几何，只流向融合 U-Net：I_FG = Σ_k 𝓘_k α_k w_k / Σ_k α_k w_k 对 w_k 可微。L_Depth 用同一组权重合成深度 Σ𝒟_k α_k w_k / Σα_k w_k，再与 TSDF 深度做 L1，相当于借助可微合成把“融合权重应当复现一致几何”写进损失（权重 0.1）。对比之下，Quark 的几何由可微渲染学出来；Ha 的几何来自外部的立体深度和 TSDF，可微渲染只负责学习怎样融合。"}, {"name_zh": "材质、光照分解与视角相关外观", "explain_zh": "直觉：观测到的颜色是材质（BRDF）、光照和可见性三者乘积的积分。如果能把这三者分开，就能在新视角下正确预测高光，也能重新打光。NeRFactor 在单一未知光照下，用重渲染损失、平滑先验和从真实 BRDF 数据学到的先验，恢复法线、光可见性、反照率和 BRDF；nvdiffrec 用可微光栅化加 split-sum 近似，联合优化网格、材质和环境光。这类分解高度不适定，每个场景都要优化数分钟到数小时。与锚点的联系：两篇锚点在高光上都有明确短板。Quark 的 blend weights 是输入颜色的凸组合，无法外推出输入中没有的高光，NeX、Ref-NeRF 式的显式视角相关建模被列为未来工作。Ha 在高光区域的立体深度出错，TSDF 随之被带偏，EPI 出现断裂（Fig. 9），视角相关外观只能靠对 K 个观测颜色重新加权来近似。远程临场中的眼睛高光和皮肤油光正属于这类效果。另外，锚点深读列出的 Tele360（2026）用可微 Levenberg–Marquardt 在线优化相机参数，针对的是两篇都依赖精确标定这一问题，说明逆渲染式的可微优化除了用于外观，也能用于标定。"}], "equations": [{"tex": "\\mathbf{M}^{\\star}=\\arg\\min_{\\mathbf{M}}\\sum_{k=1}^{K}\\mathcal{L}\\big(\\mathbf{I}_k,\\,\\mathcal{O}(\\mathcal{W}_k(\\mathbf{M}))\\big)+\\Phi(\\mathbf{M}),\\qquad \\mathbf{M}_{n+1}=\\mathbf{M}_n-\\lambda\\Big[\\sum_{k=1}^{K}\\frac{\\partial\\mathcal{L}_k(\\mathbf{M}_n)}{\\partial\\mathbf{M}_n}+\\frac{\\partial\\Phi(\\mathbf{M}_n)}{\\partial\\mathbf{M}_n}\\Big]", "explain_zh": "逆渲染目标与经典梯度下降（DeepView Eq. 3–4）。M 是待求的场景表示，在 DeepView 中是 D 个 RGBA 平面组成的 MPI，在 Quark 中对应 LDM；I_k 是第 k 个输入图，共 K 个；W_k 把各层 warp 到视角 k（平面层用单应，Quark 用按深度的双线性 splat）；O 是 over 合成，在预乘 alpha、层号 d 从后往前编号（d=1 最远）时，O(M)=Σ_d c_d Π_{i>d}(1−α_i)（DeepView Eq. 2），其中 Π_{i>d}(1−α_i) 称为第 d 层的净透射率；L 是图像差异（如 L1），L_k 是第 k 个视角的项；Φ 是先验或正则；λ 是步长；n 是迭代序号。例：3 层 α 均为 0.5 时，最后一层颜色的梯度因子为 Π(1−α_i)=0.25。"}, {"tex": "\\mathbf{M}_{n+1}=\\mathbf{M}_n+\\mathcal{N}_{\\omega}\\big(\\nabla_{n,1},\\dots,\\nabla_{n,K},\\,\\mathbf{M}_n\\big),\\qquad \\nabla_{n,k}=\\mathcal{W}_k^{-1}\\big([\\,\\mathbf{I}_k^{\\uparrow},\\,\\tilde{\\mathbf{I}}_k^{\\uparrow},\\,\\mathbf{A}_k,\\,\\mathbf{T}_k\\,]\\big)", "explain_zh": "学习式梯度下降（DeepView Eq. 9–10）。N_ω 是参数为 ω 的更新网络（每次迭代使用不同的权重），它把步长 λ 和先验 Φ 都吸收了进去；∇_{n,k} 是第 n 次迭代、第 k 个视角的“梯度分量”；I_k^↑、Ĩ_k^↑ 表示把 2D 输入图和渲染图沿深度方向广播成 3D 张量；A_k 是累积 over，即该层后方所有层合成的结果；T_k 是净透射率，即光线穿过该层前方各层后剩下的比例；W_k^{-1} 是逆 warp，把视角 k 的量变回层空间，其中 W_k^{-1}(I_k^↑) 就是平面扫描体；[·] 表示通道拼接。训练时展开 N 步，用最终表示渲染到留出视角的损失 L_f 来更新 ω。Quark 中 N=5，N_ω 由 Update Block（CNN）和 Fusion Block（One-to-many attention）组成。"}, {"tex": "D_j^i=\\operatorname{sigmoid}\\!\\Big(\\delta_j^i\\,\\frac{d^2(i,j)}{\\sigma}\\Big),\\qquad I^i=\\sum_j w_j^i C_j^i+w_b^i C_b,\\qquad w_j^i=\\frac{D_j^i\\exp(z_j^i/\\gamma)}{\\sum_k D_k^i\\exp(z_k^i/\\gamma)+\\exp(\\epsilon/\\gamma)}", "explain_zh": "Soft Rasterizer 的概率图与聚合函数。i 是像素索引，j、k 是三角形索引；d(i,j) 是像素 p_i 到三角形 f_j 各边的最近距离；δ_j^i 在 p_i 位于 f_j 内部时取 +1，否则取 −1；σ 控制边缘的软硬（默认 10^{-4}）；D_j^i 是 p_i 被 f_j 覆盖的“概率”；C_j^i 是 f_j 在 p_i 处的颜色（重心插值得到）；C_b 是背景色；z_j^i 是归一化深度，越近越大（正文称 normalized inverse depth，补充材料定义为 (Z_far−Z)/(Z_far−Z_near)）；γ 控制聚合的软硬（默认 10^{-4}），γ→0 时只保留最近的三角形，即退化为 z-buffer；ε 是让背景获得权重的小常数；所有 w_j^i 与 w_b^i 之和为 1。例：σ=10^{-4} 时，外部距离 0.01 的像素 D≈0.27，距离 0.02 时 D≈0.018。"}], "evolution": [{"year": 2014, "milestone_zh": "OpenDR（ECCV 2014）：第一个通用的近似可微渲染器，用于从图像拟合人体等模型"}, {"year": 2018, "milestone_zh": "NMR（CVPR 2018）为光栅化设计近似梯度；Li et al.（SIGGRAPH Asia 2018）的 edge sampling 给出物理正确的无偏梯度"}, {"year": 2019, "milestone_zh": "Soft Rasterizer（ICCV 2019）软化覆盖测试与 z-buffer；DSS（SIGGRAPH Asia 2019）实现可微 EWA 表面溅射；Mitsuba 2（SIGGRAPH Asia 2019）；DeepView（CVPR 2019）提出学习式梯度下降"}, {"year": 2020, "milestone_zh": "SynSin（CVPR 2020）与 NPBG（ECCV 2020）开启神经点渲染；nvdiffrast（SIGGRAPH Asia 2020）提供高性能可微原语；PyTorch3D 发布；SIGGRAPH 2020 开设物理可微渲染课程；NeRF 以体渲染作为可微渲染器"}, {"year": 2021, "milestone_zh": "Pulsar（CVPR 2021）实现百万级球体的实时可微渲染；NeRFactor（SIGGRAPH Asia 2021）分解形状与反射"}, {"year": 2022, "milestone_zh": "nvdiffrec（CVPR 2022）联合优化网格、材质与光照；Dr.Jit（SIGGRAPH 2022）即时编译的可微渲染系统"}, {"year": 2023, "milestone_zh": "3DGS：可微 tile 光栅化的各向异性高斯成为主流的可微场景表示"}, {"year": 2024, "milestone_zh": "Quark（SIGGRAPH Asia 2024）：5 步学习式 render-and-refine 嵌入实时 1080p 管线"}, {"year": 2025, "milestone_zh": "Ha et al.（CVPR 2025）：把可微 3DGS 光栅器当作固定的前向 warping 算子，梯度只用于训练融合网络"}, {"year": 2026, "milestone_zh": "Tele360：用可微 Levenberg–Marquardt 在线优化相机参数，服务于远程临场"}], "papers": [{"title": "Soft Rasterizer: A Differentiable Renderer for Image-based 3D Reasoning", "authors": "Shichen Liu et al.", "year": 2019, "venue": "ICCV 2019", "url": "https://arxiv.org/abs/1904.01786", "citations": 831, "role_zh": "把光栅化重新表述为概率覆盖加类 softmax 聚合，得到“真正可微”的网格渲染器，梯度能流向被遮挡和远处的三角形", "priority": "must"}, {"title": "DeepView: View Synthesis with Learned Gradient Descent", "authors": "John Flynn et al.", "year": 2019, "venue": "CVPR 2019", "url": "https://arxiv.org/abs/1906.07316", "citations": 493, "role_zh": "把 MPI 逆渲染的梯度下降展开为学习式更新（每步一个独立权重的 CNN），并推导出 over 算子的梯度分量（累积 over、净透射率）；是 Quark render-and-refine 的直接来源，Flynn、Broxton、DuVall 等作者与 Quark 重叠", "priority": "must"}, {"title": "Differentiable Surface Splatting for Point-based Geometry Processing", "authors": "Wang Yifan et al.", "year": 2019, "venue": "ACM TOG 38(6) / SIGGRAPH Asia 2019", "url": "https://arxiv.org/abs/1906.04173", "citations": 403, "role_zh": "可微的 EWA 表面溅射，为点的位置和法线设计能跨越不连续处的梯度；在点表示与后来的可微高斯溅射之间架起桥梁", "priority": "must"}, {"title": "Neural Point-Based Graphics", "authors": "Kara-Ali Aliev et al.", "year": 2020, "venue": "ECCV 2020", "url": "https://arxiv.org/abs/1906.08240", "citations": 504, "role_zh": "点云加可学习神经描述子，经多尺度光栅化后由 U-Net 渲染；Ha et al. 在 Fig. 10 中比较并拒绝的点溅射方案（Aliev et al.）就是它", "priority": "must"}, {"title": "OpenDR: An Approximate Differentiable Renderer", "authors": "Matthew M. Loper, Michael J. Black", "year": 2014, "venue": "ECCV 2014", "url": "https://files.is.tue.mpg.de/black/papers/OpenDR.pdf", "citations": 582, "role_zh": "第一个通用的近似可微渲染框架，把渲染接入自动微分，用来从图像拟合形状与位姿", "priority": "should"}, {"title": "Neural 3D Mesh Renderer", "authors": "Hiroharu Kato, Yoshitaka Ushiku, Tatsuya Harada", "year": 2018, "venue": "CVPR 2018", "url": "https://arxiv.org/abs/1711.07566", "citations": 1181, "role_zh": "为光栅化设计近似梯度，首次把网格渲染器嵌入神经网络，用轮廓监督实现单图 3D 网格重建", "priority": "should"}, {"title": "Differentiable Monte Carlo Ray Tracing through Edge Sampling", "authors": "Tzu-Mao Li, Miika Aittala, Frédo Durand, Jaakko Lehtinen", "year": 2018, "venue": "ACM TOG 37(6) / SIGGRAPH Asia 2018", "url": "https://people.csail.mit.edu/tzumao/diffrt/", "citations": 609, "role_zh": "在几何不连续边上专门采样，给出物理光线追踪对几何、材质的无偏梯度，是物理可微渲染的奠基工作", "priority": "should"}, {"title": "Modular Primitives for High-Performance Differentiable Rendering", "authors": "Samuli Laine et al.", "year": 2020, "venue": "ACM TOG 39(6) / SIGGRAPH Asia 2020", "url": "https://arxiv.org/abs/2011.03277", "citations": 696, "role_zh": "nvdiffrast：基于硬件光栅化的可微原语（光栅化、插值、纹理、解析抗锯齿），示范应用是把人脸表演捕捉写成逆渲染", "priority": "should"}, {"title": "Mitsuba 2: A Retargetable Forward and Inverse Renderer", "authors": "Merlin Nimier-David, Delio Vicini, Tizian Zeltner, Wenzel Jakob", "year": 2019, "venue": "ACM TOG 38(6) / SIGGRAPH Asia 2019", "url": "https://rgl.epfl.ch/publications/NimierDavidVicini2019Mitsuba2", "citations": 226, "role_zh": "把物理渲染器写成可“重定向”的模板代码，同一份实现可编译为标量、向量化、GPU 或可微版本，使整条光传输管线都能自动求导；是 Mitsuba 3 / Dr.Jit 与物理逆渲染研究的基础设施", "priority": "should"}, {"title": "SynSin: End-to-end View Synthesis from a Single Image", "authors": "Olivia Wiles et al.", "year": 2020, "venue": "CVPR 2020", "url": "https://arxiv.org/abs/1912.08804", "citations": 555, "role_zh": "可微点云渲染器加 refine 网络的“前向 splat + 补洞”范式，与 Ha 的前向 splat 加融合 U-Net 结构同源", "priority": "should"}, {"title": "Extracting Triangular 3D Models, Materials, and Lighting From Images", "authors": "Jacob Munkberg et al.", "year": 2022, "venue": "CVPR 2022", "url": "https://arxiv.org/abs/2111.12503", "citations": 528, "role_zh": "nvdiffrec：用可微 marching tetrahedra 和 split-sum 可微环境光，从多视图联合优化网格拓扑、材质与光照", "priority": "should"}, {"title": "Pulsar: Efficient Sphere-based Neural Rendering", "authors": "Christoph Lassner, Michael Zollhöfer", "year": 2021, "venue": "CVPR 2021", "url": "https://arxiv.org/abs/2004.07484", "citations": 240, "role_zh": "基于球体的高效可微渲染引擎加神经着色，可实时渲染和优化含数百万个球的表示，已集成进 PyTorch3D", "priority": "optional"}, {"title": "NeRFactor: Neural Factorization of Shape and Reflectance Under an Unknown Illumination", "authors": "Xiuming Zhang et al.", "year": 2021, "venue": "ACM TOG 40(6) / SIGGRAPH Asia 2021", "url": "https://arxiv.org/abs/2106.01970", "citations": 216, "role_zh": "在单一未知光照下，从 NeRF 蒸馏出表面，再分解法线、光可见性、反照率与 BRDF，支持重光照", "priority": "optional"}], "prereqs": ["r-raster", "r-appearance", "f-optim", "r-alpha", "r-volume", "l-iterative"], "relation_to_anchors_zh": "Quark（Sec. 3，Update & Fuse）：render-and-refine 就是 DeepView learned gradient descent 的多尺度实时版，一步一步对应如下。(a) 把当前 LDM 用双线性 splat 投到每个输入视角，并做 over 合成得到 Ĩ，即 DeepView 公式中的 O(W_k(M))，论文特别说明这里不用光追也不用光栅化。(b) Update Block 把 Ĩ、输入特征 I_k 与射线编码送进一个小 CNN，得到含“渲染 vs 观测”可见性残差的 update feature，对应梯度分量 [I_k, Ĩ_k, A_k, T_k]。(c) 用当前深度反投影回层空间，对应 W_k^{-1}。(d) Fusion Block 用 One-to-many attention 聚合 M 个视角，对应 N_ω。以上共迭代 5 次。消融显示，把 Ĩ 置零后 PSNR 从 30.41 降到 29.71，运行时间只省 5.22%。整个网络以最终的 IBR 渲染 c = O(Σ_m β_m P^T(I,d), σ) 为输出，用 10·L1 + LPIPS 在留出视角上端到端训练，所以渲染器必须对 depth、density、blend weights 可微。不了解逆渲染，“学习化梯度下降”和“先渲染再比较”就会显得像凭空设计。\nHa et al.：前向 splat 用的是原版 3DGS 可微光栅器，但高斯参数是解析设定的，梯度只流向融合 U-Net：I_FG = Σ_k 𝓘_k α_k w_k / Σ_k α_k w_k 对 w_k 可微。L_Depth 用同一组权重合成深度，再与 TSDF 深度做 L1，相当于借可微合成把几何一致性写进损失。作者在 Fig. 10 中比较并拒绝了 Aliev et al.（NPBG）式点溅射（有空隙和走样），也拒绝了 GPS-Gaussian 式由网络预测高斯参数的做法。“前向 splat + U-Net 融合”的结构与 SynSin、FWD 同属一个范式。两篇在高光上都失败：Ha 的 RAFT-Stereo 深度出错，TSDF 跟着出错，EPI 断裂（Fig. 9）；Quark 的凸组合 blend weights 无法表示视角相关材质。这正是材质与光照分解类逆渲染想解决的问题，但目前这类方法仍需逐场景优化。两篇也都依赖精确标定，后续的 Tele360（2026）用可微 Levenberg–Marquardt 在线优化相机参数，把可微优化用在了标定上。", "debates_zh": ["近似梯度、软化前向与精确边界采样之争：软化（SoftRas）会改变前向图像，训练和推理不一致；精确方法（edge sampling）无偏，但慢且实现复杂。splatting 类表示因为核本身平滑，基本绕开了这个问题。网格可微渲染是否因此被边缘化，也有争论：网格在编辑、物理仿真和传统引擎中仍不可替代，这正是 nvdiffrec 的出发点。", "显式优化与学习式更新：LGD（DeepView、Quark）步数少，适合实时，但没有收敛保证，行为取决于训练分布。Quark 的消融中，去掉前两步迭代（同时把初始分辨率翻倍），PSNR 只降约 0.08 dB，速度却快 17.49%；这些“迭代”究竟完成了多少真正的优化，值得怀疑。", "物理分解与纯外观 IBR：远程临场是否需要材质和光照分解？IBR 直接复用真实像素最逼真（Quark 改为直接回归 RGB 时，PSNR 从 30.41 降到 29.18），分解的误差会被放大；可如果不分解，就无法做光照一致的虚实合成和重光照。", "可微渲染监督与外部几何：Quark 的几何完全由可微渲染损失学出；Ha 则依赖外部立体深度加 TSDF，认为几何一致性更重要。Ha 的消融显示，TSDF 引导几乎不改变 PSNR（31.16 对 31.17），主要改善的是 STED（95.4 对 68.8）。两条路线孰优孰劣，取决于看重单帧质量还是时间稳定性。"], "open_questions_zh": ["能否跨时间复用“渲染、比较、更新”的迭代：以上一帧的结果为初值，只做 1–2 步学习式 refinement，同时获得时间一致性和低延迟？Quark 没有时间一致性机制，Ha 靠 TSDF 回灌上一帧深度。", "实时、feed-forward 的材质与光照分解：能否用于远程临场中的重光照，以及让虚实光照保持一致？", "用可微渲染在线估计标定、同步与颜色（曝光、白平衡）误差，并控制在 30 fps 预算以内：两篇都对这些误差敏感，Quark 在标定误差下产生硬边，Ha 在 ENeRF-Outdoor 上因同步和颜色标定问题只能降到 480×270 评测。", "高光和透明物体的可微深度与几何：Ha 在高光处的失败说明，只靠立体深度加 TSDF 不够。怎样把视角相关外观模型并入实时几何估计？", "3DGS 的排序本身不可导：在逐帧动态生成的高斯中，这种排序不连续对梯度和时间稳定性有什么影响，目前缺乏分析。"], "resources": [{"title": "Differentiable Rendering: A Survey（Kato et al.）", "url": "https://arxiv.org/abs/2006.12057", "type": "paper", "note_zh": "按网格、体素、点云、隐式表示分类梳理可微渲染的梯度近似方法与应用，适合在读 OpenDR、NMR、SoftRas 之前建立全局图景"}, {"title": "Physics-Based Differentiable Rendering: A Comprehensive Introduction（SIGGRAPH 2020 Course）", "url": "https://shuangz.com/courses/pbdr-course-sg20/", "type": "course", "note_zh": "Zhao、Jakob、Li 的课程，系统讲解辐射传输的微分理论、边界项与 edge sampling，是理解物理可微渲染的标准入门"}, {"title": "MIT 6.S980 Machine Learning for Inverse Graphics（Fall 2023）", "url": "https://www.scenerepresentations.org/courses/2023/fall/inverse-graphics", "type": "course", "note_zh": "Sitzmann 的课程，从针孔相机、位姿与多视几何讲起，覆盖神经场与体素、三维表示和光场中的可微渲染、自监督的逆图形学，与本专题和锚点论文的衔接最紧密"}, {"title": "PyTorch3D 渲染器文档", "url": "https://pytorch3d.org/docs/renderer", "type": "code", "note_zh": "解释 PyTorch3D 网格光栅器的中间输出 Fragments（pix_to_face、zbuf、bary_coords 与到三角形的距离）以及它与 SoftRas 软光栅的关系，适合动手比较硬光栅与软光栅的梯度"}]}]}</script>
<script>
(function () {
  "use strict";
  // ================= core: shared helpers, cross-links, math, navigation =================
  var DATA;
  try { DATA = JSON.parse(document.getElementById("data").textContent); } catch (e) { DATA = {}; }
  var SITE = DATA.site || {};
  var meta = DATA.meta || {};

  // ---------- DOM helpers: all text goes through textContent; external links are https-only ----------
  function safeUrl(u) { if (typeof u !== "string") return null; var s = u.trim(); return /^https:\/\/[^\s"'<>]+$/i.test(s) ? s : null; }
  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (!Object.prototype.hasOwnProperty.call(attrs, k)) continue;
      var v = attrs[k];
      if (v === null || v === undefined || v === false) continue;
      if (k === "class") n.className = v;
      else if (k === "text") n.textContent = String(v);
      else if (k === "href") { var u = safeUrl(v); if (u) { n.setAttribute("href", u); n.setAttribute("target", "_blank"); n.setAttribute("rel", "noopener noreferrer"); } }
      else if (k.slice(0, 2) === "on" && typeof v === "function") n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, String(v));
    }
    (kids || []).forEach(function (c) { if (c === null || c === undefined || c === false) return; n.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return n;
  }
  var SVGNS = "http://www.w3.org/2000/svg";
  function sv(tag, attrs, kids) {
    var n = document.createElementNS(SVGNS, tag);
    if (attrs) for (var k in attrs) {
      if (!Object.prototype.hasOwnProperty.call(attrs, k)) continue;
      var v = attrs[k];
