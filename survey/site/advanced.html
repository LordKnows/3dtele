.path { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 14px; }
.path ol { margin: 0; padding-left: 1.3em; display: grid; gap: 10px; font-size: 13.5px; }
.path ol li small { display: block; color: var(--muted); }
.note { font-size: 13px; color: var(--muted); max-width: 80ch; }

/* ---------- learning part ---------- */
.cchip { appearance: none; font: inherit; font-size: 12.5px; padding: 1px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); border: 1px solid transparent; cursor: pointer; white-space: nowrap; }
.cchip:hover { border-color: var(--accent); }
.cchip.ghost { background: transparent; border-color: var(--rule); color: var(--ink-2); }
.cchip.ghost:hover { border-color: var(--accent); color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chips .lbl { font-size: 12px; color: var(--muted); margin-right: 2px; }
.flash { animation: flash 1.6s ease-out 1; }
@keyframes flash { 0% { background-color: var(--flash); } 100% { background-color: transparent; } }
@media (prefers-reduced-motion: reduce) { .flash { animation: none; outline: 2px solid var(--accent); } }

.math-block { overflow-x: auto; overflow-y: hidden; padding: 8px 12px; background: var(--surface-2); border-radius: 6px; font-family: var(--mono); font-size: 13px; color: var(--ink); }
.math-block mjx-container { margin: 4px 0 !important; }
.eq { display: grid; gap: 6px; }
.eq p { font-size: 13.5px; color: var(--ink-2); white-space: pre-line; }
.eqs { display: grid; gap: 14px; }
.aside { background: var(--surface-2); border-radius: 8px; padding: 10px 14px; font-size: 14px; color: var(--ink-2); display: grid; gap: 2px; }
.aside b { font-size: 12px; color: var(--muted); letter-spacing: .05em; font-weight: 700; }
.aside span { white-space: pre-line; }
.idref { appearance: none; background: none; border: 0; padding: 0 1px; font: inherit; font-family: var(--mono); font-size: .86em; color: var(--accent); cursor: pointer; text-decoration: underline dotted; text-underline-offset: 3px; }
.idref:hover { text-decoration-style: solid; }

.roadmap { display: grid; gap: 10px; }
details.stage { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; min-width: 0; }
details.stage > summary { list-style: none; cursor: pointer; padding: 14px 18px; display: grid; grid-template-columns: 40px minmax(0,1fr) auto; gap: 12px; align-items: start; }
details.stage > summary::-webkit-details-marker { display: none; }
details.stage .num { font-family: var(--mono); width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: 13px; }
details.stage .head { display: grid; gap: 4px; }
details.stage .head h3 { font-size: 16.5px; }
details.stage .head p { font-size: 13.5px; color: var(--ink-2); }
details.stage .dur { font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: nowrap; }

.mods { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.mod { appearance: none; text-align: left; font: inherit; cursor: pointer; background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 12px 14px; display: grid; gap: 4px; align-content: start; color: var(--ink); }
.mod:hover { border-color: var(--accent); }
.mod i { font-style: normal; font-family: var(--mono); font-size: 11px; color: var(--muted); }
.mod b { font-family: var(--serif); font-size: 14.5px; }
.mod span { font-size: 12.5px; color: var(--ink-2); }

details.concept { border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); min-width: 0; }
details.concept > summary { list-style: none; cursor: pointer; padding: 12px 16px; display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 4px 12px; }
details.concept > summary::-webkit-details-marker { display: none; }
details.concept .nm { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
details.concept .nm b { font-family: var(--serif); font-size: 15.5px; }
details.concept .nm span { font-family: var(--mono); font-size: 11px; color: var(--muted); }
details.concept .tl { grid-column: 1 / -1; font-size: 13.5px; color: var(--ink-2); }
details.concept .uses { display: flex; gap: 6px; align-items: center; }
.concept-body { border-top: 1px solid var(--rule); padding: 16px 16px 20px; display: grid; gap: 18px; min-width: 0; }
.anchor-use { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }
.anchor-use > div { border: 1px solid var(--rule); border-radius: 8px; padding: 10px 12px; display: grid; gap: 6px; align-content: start; }
.anchor-use h5 { margin: 0; font-family: var(--sans); font-size: 12.5px; font-weight: 700; color: var(--ink); display: flex; gap: 8px; align-items: center; }
.anchor-use p { font-size: 13.5px; color: var(--ink-2); }
.anchor-use small { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
details.qa { border-top: 1px dashed var(--rule); }
details.qa > summary { list-style: none; cursor: pointer; padding: 8px 0; font-size: 14px; color: var(--ink); display: flex; gap: 8px; }
details.qa > summary::before { content: "问"; font-size: 11.5px; color: var(--accent); background: var(--accent-soft); border-radius: 4px; padding: 0 6px; height: fit-content; margin-top: 3px; }
details.qa > p { font-size: 13.5px; color: var(--ink-2); padding: 0 0 10px 30px; white-space: pre-line; }
.res { display: grid; gap: 6px; font-size: 13.5px; }
.res div { display: grid; grid-template-columns: 58px minmax(0,1fr); gap: 8px; }
.res .ty { font-family: var(--mono); font-size: 11px; color: var(--muted); padding-top: 3px; }
.res small { color: var(--muted); display: block; }

.diagram-wrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: 10px; background: var(--surface); padding: 10px; }
svg.diagram { display: block; width: 100%; min-width: 860px; height: auto; }
.dnode rect { fill: var(--surface-2); stroke: var(--rule); stroke-width: 1; }
.dnode.data rect { fill: var(--surface); stroke-dasharray: 4 3; }
.dnode.click { cursor: pointer; }
.dnode.click:hover rect, .dnode.click:focus rect { stroke: var(--accent); stroke-width: 1.6; }
.dnode.click:focus { outline: none; }
.dnode .t { fill: var(--ink); font-family: var(--sans); font-size: 13px; font-weight: 500; }
.dnode .s { fill: var(--muted); font-family: var(--sans); font-size: 11px; }
.dnode .k { fill: var(--accent); font-family: var(--mono); font-size: 10.5px; font-weight: 500; }
.dedge { stroke: var(--muted); stroke-width: 1.4; fill: none; }
.dedge.fb { stroke: var(--accent); stroke-dasharray: 5 4; }
.dhead { fill: var(--muted); }
.dhead.fb { fill: var(--accent); }
.dloop { fill: var(--accent-soft); fill-opacity: .45; stroke: var(--accent); stroke-width: 1; }
.dlabel { fill: var(--accent); font-family: var(--sans); font-size: 12px; font-weight: 700; }
.dnote { fill: var(--muted); font-family: var(--sans); font-size: 11.5px; }

details.step { border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); min-width: 0; }
details.step > summary { list-style: none; cursor: pointer; padding: 12px 16px; display: grid; grid-template-columns: 44px minmax(0,1fr) auto; gap: 10px; align-items: baseline; }
details.step .sid { font-family: var(--mono); font-size: 12px; color: var(--accent); }
details.step .st { display: grid; gap: 2px; }
details.step .st b { font-size: 15px; font-weight: 500; color: var(--ink); }
details.step .st small { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.step-body { border-top: 1px solid var(--rule); padding: 16px; display: grid; gap: 16px; min-width: 0; }
.checklist { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; }
.checklist div { border: 1px solid var(--rule); border-radius: 8px; padding: 8px 12px; display: grid; gap: 4px; font-size: 13px; color: var(--ink-2); align-content: start; }

.lanes-wrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: 10px; background: var(--surface); padding: 12px 12px 6px; position: relative; }
svg.lanes { display: block; width: 100%; min-width: 820px; height: auto; }
.lanes .grid { stroke: var(--rule); stroke-width: 1; }
.lanes .axis { fill: var(--muted); font-family: var(--mono); font-size: 11px; }
.lanes .lane-l { fill: var(--ink-2); font-family: var(--sans); font-size: 12px; }
.lanes .dot { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.lanes .dot.hollow { fill: var(--surface); stroke: var(--accent); stroke-width: 1.6; }
.lanes .hit { fill: transparent; cursor: pointer; }
.lanes g.m:hover .dot, .lanes g.m:focus .dot { stroke: var(--ink); }
.lanes g.m:focus { outline: none; }
.lanes .brk { stroke: var(--muted); stroke-width: 1; }
.vtip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; color: var(--ink); max-width: 320px; box-shadow: 0 4px 16px rgba(0,0,0,.12); display: grid; gap: 2px; z-index: 3; }
.vtip small { color: var(--muted); font-family: var(--mono); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--muted); align-items: center; padding: 4px 4px 0; }
.legend svg { vertical-align: middle; }
.classic-list { display: grid; gap: 10px; }
details.classic { border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); min-width: 0; }
details.classic > summary { list-style: none; cursor: pointer; padding: 10px 16px; display: grid; grid-template-columns: 52px minmax(0,1fr) auto; gap: 10px; align-items: baseline; }
details.classic > summary::-webkit-details-marker { display: none; }
details.classic .yr { font-family: var(--mono); font-size: 13px; color: var(--ink); }
details.classic .ti { display: grid; gap: 2px; }
details.classic .ti b { font-size: 14.5px; font-weight: 500; }
details.classic .ti small { font-size: 12px; color: var(--muted); }
details.classic .cit { font-family: var(--mono); font-size: 12px; color: var(--ink-2); text-align: right; white-space: nowrap; }
.classic-body { border-top: 1px solid var(--rule); padding: 12px 16px 16px; display: grid; gap: 12px; }

.gl-wrap { max-height: 72vh; overflow: auto; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); }
.gl td.en { font-weight: 500; color: var(--ink); min-width: 170px; }
.gl td.zh { min-width: 110px; }
.gl td.def { min-width: 300px; color: var(--ink-2); }

@media (max-width: 1000px) {
  .shell { grid-template-columns: minmax(0,1fr); gap: 20px; padding-top: 0; }
  .toc { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); max-height: none; overflow-x: auto; overflow-y: hidden; padding-block: 10px; border-bottom: 1px solid var(--rule); margin-inline: -20px; padding-inline: 20px; }
  .toc .brand, .toc .ramp, .toc li.grp, .toc ol.sub { display: none; }
  .toc ol { display: flex; gap: 4px; margin: 0; white-space: nowrap; }
  .toc a { border-left: 0; border-bottom: 2px solid transparent; padding: 4px 8px; }
  .toc a.on, .toc a.page.cur { border-bottom-color: var(--accent); }
  .toc-mobile { display: grid; gap: 6px; }
  :root { --jump-offset: 72px; }
  .toc { scrollbar-width: none; }
  .toc::-webkit-scrollbar { display: none; }
  .pager { grid-template-columns: minmax(0, 1fr); }
  .pager a.next { grid-column: 1; }
  .layer { grid-template-columns: minmax(0,1fr); gap: 10px; }
  .two, .idea-grid, .path, .anchor-use { grid-template-columns: minmax(0,1fr); }
  .mods { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .starts { grid-template-columns: minmax(0,1fr); }
}
@media (max-width: 560px) {
  .shell { padding-inline: 16px; }
  .toc { margin-inline: -16px; padding-inline: 16px; }
  .panel { padding: 16px; }
  details.idea > summary { grid-template-columns: minmax(0,1fr) auto; }
  details.idea .rank { display: none; }
  details.step > summary { grid-template-columns: minmax(0,1fr) auto; }
  details.step .sid { display: none; }
  details.classic > summary { grid-template-columns: 44px minmax(0,1fr); }
  details.classic .cit { grid-column: 2; text-align: left; }
  .mods { grid-template-columns: minmax(0,1fr); }
  .area-body, .idea-body, .concept-body, .step-body { padding-inline: 12px; }
}

/* ---------- overflow guards: long labels wrap inside cards instead of widening the page ---------- */
.cchip, .chip { max-width: 100%; }
.chips .cchip, .classic-body .chip, .card .chip { white-space: normal; overflow-wrap: anywhere; text-align: left; }
.toc-mobile .chips > * { white-space: nowrap; }
.card, .anchor-use > div, .classic-body, .concept-body, .step-body, .area-body, .idea-body, .blk, .subcard { grid-template-columns: minmax(0, 1fr); }
@media (min-width: 1001px) { .page-head.only-mobile { display: none; } }
@media (max-width: 1000px) { .page-head { margin-bottom: -40px; } }
main { overflow-wrap: break-word; }
.prose, .sec-head, .hero, .threat, .obj, .eqs, .eq, .kv div, .checklist div, .layer .body, .anchor-body, .classic-list, .roadmap { grid-template-columns: minmax(0, 1fr); }
mjx-container[jax="SVG"]:not([display="true"]) { display: inline-block; max-width: 100%; overflow-x: auto; overflow-y: hidden; vertical-align: middle; }
ul.plain, .path ol, .res, .timeline, .stages, .subgrid > *, .cards > * { grid-template-columns: minmax(0, 1fr); }
ul.plain li, .res span, .threat span { overflow-wrap: anywhere; }

</style>
</head>

<div class="shell">

<script type="application/json" id="data">{"meta": {"date": "2026-09-28", "subtitle": "以 Quark（Google，SIGGRAPH Asia 2024）与 Ha et al.（KAIST + Meta，CVPR 2025）两篇实时多视角新视角合成论文为出发点，分三部分展开。第一部分帮你入门：基础知识、进阶专题、经典论文，以及把基础知识和两篇论文逐步对上的精读导读。第二部分梳理 3D 临场（telepresence）的全栈调研：采集、几何、表示、渲染、传输、显示与感知。第三部分给出 18 个经过对抗式查新和模拟 AC 评审的研究方向。", "learn_lede": "面向刚进入 3D 视觉 / 临场方向的研究生，默认你有本科线代、概率、Python 和基础深度学习。建议的用法：按“学习路线”推进；遇到不懂的词查“术语表”；读两篇锚点论文时开着“精读导读”，每一步都能点回需要的基础概念。基础概念卡片也会反过来标出它在 Quark 和 Ha et al. 的哪一步用到。", "foundations_lede": "8 个模块按学习顺序排列。每个概念都有：一句话要点、直觉解释、类比、逐项拆解的公式、带数字的例子、易错点、它在两篇锚点论文中的具体位置、学习资源和自测题。标签“Quark 用到 / Ha 用到”表示该概念是否直接出现在对应论文中。", "guided_lede": "把两篇论文按流水线拆成若干步。每一步写清楚：做什么（输入 → 输出）、白话解释、类比、论文公式逐项拆解、具体超参、为什么这样设计、容易误解的地方和自测题，并链接到需要的基础概念。点击流程图的方框可以直接跳到对应步骤。内容写完后由另一个 agent 对照论文原文逐条核查，并修正了发现的错误。", "advanced_lede": "16 个进阶专题，每个包含核心思想、关键公式、演进时间线、按优先级排序的奠基论文（附 Semantic Scholar / OpenAlex 引用数）、与两篇锚点论文的关系、争论与开放问题。", "classics_lede": "按 6 个主题收录 2025 年及以前发表的高影响论文。入选标准是引用数高或改变了领域走向，并且偏重两篇锚点论文所依赖的工作。每篇都由另一个 agent 复核了是否存在、年份与会议，以及引用数（来源为 Semantic Scholar 或 OpenAlex，2026 年 9 月）。上图横轴 2010 年以前做了压缩。", "survey_lede": "以两篇锚点论文为坐标原点，覆盖 10 个子方向、350 余条论文 / 产品 / 标准，以及全栈地图、范式对比、趋势与挑战。", "ideas_lede": "这些方向来自 5 个独立视角（失败模式、基础模型、系统、问题重构/评测、跨领域）共 30 个 idea，聚类为 18 个方向。每个方向先由一个 agent 专门找“已经被做过”的证据，再由一个模拟 AC 的 agent 重新定位、打分、设计实验。结论：没有一个方向是完全空白的，18 个全部判定为“部分已被做，需要重新定位”。综合分 5 分约等于一篇普通录用论文的水平。列表按综合分排序，点开可看核心论点、查新找到的撞车工作、两周验证实验和止损标准。", "method_zh": "本报告由多 agent 工作流生成，所有 agent 都能联网检索（arXiv API、Semantic Scholar、OpenAlex、网页搜索）。\n\n调研部分：先精读两篇锚点论文（含附录），并对照原文逐条核查未言明的问题，例如 Ha et al. 的运行时间没算立体深度估计，TSDF 消融几乎没有增益。然后分 10 个子方向检索，每个方向 25–45 篇带真实链接的工作，分为里程碑 / 重要 / 相关三档，再由一个综合 agent 写出全景图、范式对比、趋势、重大挑战和阅读清单。\n\n研究方向部分：5 个视角各自提出 idea，聚类为 18 个方向。每个方向先做对抗式查新（抽查引用是否真实存在，至少 10 组检索），再做模拟 AC 评审。\n\n使用说明：这些内容由 AI agent 检索和撰写，可能有遗漏、过时或数字不准，2026 年 7–9 月的新论文覆盖尤其有限。引用或投稿前请务必打开原文核实，尤其是 2026 年的 arXiv 编号、性能数字和引用数。评分只用于比较方向之间的相对强弱，不代表真实的录用概率。\n\n入门学习部分：先固定一份课程骨架（8 个模块、40 个概念、16 个进阶专题），所有内容都用同一套 ID 互相链接。基础知识每个模块由一个 agent 撰写，再由技术编辑 agent 核查公式、数值例子、链接以及与两篇论文的对应关系，共修正 145 处。进阶专题同样经过撰写与复核，修正 95 处。经典论文由 6 个主题检索 agent 汇总并去重，再分批逐篇复核：保留 152 篇，更正 115 篇，剔除 0 篇。精读导读共 26 步，由对抗式核查 agent 对照论文原文修正 70 处。术语表 195 条。", "learn_method_zh": "入门学习部分：先固定一份课程骨架（8 个模块、{concepts} 个概念、{advanced} 个进阶专题），所有内容都用同一套 ID 互相链接。基础知识每个模块由一个 agent 撰写，再由技术编辑 agent 核查公式、数值例子、链接以及与两篇论文的对应关系，共修正 {foundation_fixes} 处。进阶专题同样经过撰写与复核，修正 {advanced_fixes} 处。经典论文由 6 个主题检索 agent 汇总并去重，再分批逐篇复核：保留 {classics} 篇，更正 {classics_corrected} 篇，剔除 {classics_removed} 篇。精读导读共 {steps} 步，由对抗式核查 agent 对照论文原文修正 {guide_fixes} 处。术语表 {glossary} 条。"}, "xref": {"concepts": {"f-linalg": "线性代数、齐次坐标与刚体变换", "f-optim": "优化、鲁棒估计与梯度下降", "f-prob": "概率、加权平均与递归滤波", "f-image": "数字图像：颜色、采样、插值与金字塔", "g-pinhole": "针孔相机模型：内参、外参、投影与反投影", "g-epipolar": "对极几何、三角化与单应", "g-depth": "深度、视差与逆深度采样", "g-sfm": "运动恢复结构（SfM）与光束法平差", "g-rig": "多相机阵列：标定、同步与卷帘快门", "d-stereo": "双目立体匹配：从 SGM 到 RAFT-Stereo", "d-mvs": "多视角立体（MVS）与平面扫描", "d-mono": "单目与视频深度估计", "d-flow": "光流、场景流与图像 warping", "d-tsdf": "截断符号距离场（TSDF）与深度融合", "d-sensors": "深度传感器与噪声特性", "r-raster": "光栅化、z-buffer 与点溅射（splatting）", "r-alpha": "Alpha 合成与 over 算子", "r-volume": "体渲染方程与离散化", "r-raymarch": "光线步进、球面追踪与隐式表面求交", "r-appearance": "反射模型、视角相关外观与光照", "r-reps": "三维表示总览：点、网格、体素、隐式场、高斯", "i-lightfield": "全光函数、光场与 Lumigraph", "i-blending": "视角相关纹理映射与混合权重（ULR）", "i-warping": "基于深度的渲染：前向/后向 warping、空洞与飞点", "i-layered": "分层表示：MPI、LDI 与分层深度图（LDM）", "i-psv": "平面扫描体与学习式视图合成", "l-cnn": "卷积网络、残差块与 U-Net", "l-attention": "注意力机制与 Transformer", "l-encoding": "位置编码、傅里叶特征与射线编码", "l-loss": "损失函数与训练实践", "l-iterative": "学习式迭代细化与展开优化", "l-diffusion": "扩散模型入门", "n-nerf": "神经辐射场（NeRF）", "n-3dgs": "3D Gaussian Splatting（3D 高斯溅射）", "n-generalizable": "可泛化 / 前馈式新视角合成", "n-dynamic": "动态场景与 4D 表示", "v-temporal": "时间一致性、闪烁与时域滤波", "v-metrics": "图像与视频质量指标", "v-codec": "视频编码、传输与延迟预算", "v-perception": "立体视觉感知与 3D 显示"}, "adv": {"a-learned-stereo": "从深度立体匹配到立体基础模型", "a-learned-mvs": "学习式多视角立体与代价体", "a-geo-fm": "前馈三维几何基础模型", "a-nerf-fast": "NeRF 的加速与抗锯齿", "a-3dgs-ext": "3D Gaussian Splatting 的扩展", "a-layered-nvs": "学习式分层表示：从 Stereo Magnification 到 Quark", "a-generalizable-ibr": "可泛化 NeRF 与学习式 IBR", "a-ff-3dgs": "前馈 3DGS 与大重建模型", "a-geometry-free": "无几何 Transformer 渲染器", "a-dynamic-4d": "动态 NeRF、4D 高斯与流式重建", "a-human-capture": "人体表演捕捉与数字人", "a-diffusion-3d": "扩散模型与三维/新视角生成先验", "a-temporal-video": "视频时间一致性方法", "a-telepresence-sys": "三维临场系统设计", "a-compression": "体积视频与神经表示的压缩传输", "a-diff-render": "可微渲染与逆渲染"}}, "site": {"brand": "3D 临场研究图谱", "current": "advanced", "pages": [{"key": "home", "file": "index.html", "label": "概览", "group": null}, {"key": "roadmap", "file": "roadmap.html", "label": "学习路线", "group": "入门学习"}, {"key": "foundations", "file": "foundations.html", "label": "基础知识", "group": "入门学习"}, {"key": "guided", "file": "guided.html", "label": "精读导读", "group": "入门学习"}, {"key": "advanced", "file": "advanced.html", "label": "进阶专题", "group": "入门学习"}, {"key": "classics", "file": "classics.html", "label": "经典论文", "group": "入门学习"}, {"key": "glossary", "file": "glossary.html", "label": "术语表", "group": "入门学习"}, {"key": "anchors", "file": "anchors.html", "label": "锚点论文", "group": "领域调研"}, {"key": "landscape", "file": "landscape.html", "label": "领域全景", "group": "领域调研"}, {"key": "areas", "file": "areas.html", "label": "分方向与论文库", "group": "领域调研"}, {"key": "ideas", "file": "ideas.html", "label": "研究机会", "group": "研究"}, {"key": "method", "href": "index.html#method", "label": "方法与说明", "group": "研究", "alias": true}], "sectionPage": {"top": "index.html", "summary": "index.html", "sitemap": "index.html", "method": "index.html", "roadmap": "roadmap.html", "roadmap-resources": "roadmap.html", "foundations": "foundations.html", "guided": "guided.html", "advanced": "advanced.html", "classics": "classics.html", "reading": "classics.html", "glossary": "glossary.html", "anchors": "anchors.html", "map": "landscape.html", "paradigms": "landscape.html", "trends": "landscape.html", "areas": "areas.html", "papers": "areas.html", "ideas": "ideas.html"}, "prefixPage": [["concept-", "foundations.html"], ["module-", "foundations.html"], ["walk-", "guided.html"], ["guide-", "guided.html"], ["adv-", "advanced.html"], ["classic-", "classics.html"], ["stage-", "roadmap.html"], ["area-", "areas.html"], ["idea-", "ideas.html"], ["anchor-", "anchors.html"]]}, "advanced": [{"id": "a-learned-stereo", "title_zh": "从深度立体匹配到立体基础模型", "title_en": "Deep stereo to stereo foundation models", "overview_zh": "双目立体匹配处理的是一对已经做过立体校正（rectification）的左右图像。对左图的每个像素，要在右图的同一行上找到对应点，两者的水平位移就是视差 d。已知以像素计的焦距 f 和两相机光心间的基线 B（米）时，深度为 Z = fB/d。难点有两层。第一，弱纹理、重复纹理、反光和遮挡区域没有可靠的匹配信号。第二，把视差误差换算成深度误差时，误差与 Z² 成正比，越远越不准。传统做法（见 d-stereo）是“代价计算 → 代价聚合 → SGM 全局优化 → 后处理”，每一步都依赖手工设计。对 3D telepresence 来说，深度是整个系统的前端：Ha et al. 在 DyNeRF 和 Google Spaces 上的整条几何链路（逐像素高斯、时间滤波、image-based TSDF）都建立在 RAFT-Stereo 输出的逐视角深度之上（ScanNet 则直接用传感器深度）。\n\n深度学习分三波改写了这条流水线。第一波（2015–2019）先只学习匹配代价：MC-CNN 用 CNN 判断两个图像块是否匹配，后面仍接 SGM 等手工步骤。随后 GC-Net（ICCV 2017）把整条流水线做成端到端可微。它把左右特征沿每个候选视差拼接，得到 H×W×D×F 的四维代价体（cost volume），用 3D 卷积做学习式的代价聚合，最后用 soft argmin 把每个像素的代价分布变成亚像素视差。PSMNet 在此基础上加入空间金字塔池化和堆叠 hourglass；GwcNet 用分组相关（group-wise correlation）压缩代价体。这一代方法有三个共性：显存随 H·W·D 增长；必须预设最大视差（如 192）；先在 SceneFlow 合成数据上预训练，再到 KITTI 等目标域微调。\n\n第二波是 2021 年 RAFT-Stereo 带来的迭代细化范式。它不再用 3D 卷积一次性正则化整块代价体，而是只沿水平极线计算一次所有像素对的相关，得到 H×W×W 的三维体。之后用多级 ConvGRU 反复执行“在当前视差附近查相关表、预测一个增量”，推理时通常迭代 32 次（ETH3D 结果用 80 次，迭代次数在推理时可以随意增加而不增加显存）。这种做法没有固定的视差上限，显存小，精度高：发表时在 Middlebury 和 ETH3D 上排名第一，还有一个在 KITTI 分辨率（1248×384）上达到 26 FPS 的实时变体。之后的 CREStereo（级联循环结构加自适应分组相关，针对手机上不理想的校正）和 IGEV-Stereo（先用轻量 3D 正则化得到几何编码体和较好的初值，再做 GRU 迭代）都沿着这条路发展。Ha et al.（CVPR 2025）在 DyNeRF 和 Google Spaces 上使用的正是 RAFT-Stereo。\n\n第三波是 2025 年出现的立体基础模型，以及视频立体。FoundationStereo 用 100 万对路径追踪合成的立体图像训练，并自动剔除有歧义的样本；它还通过 side-tuning 把冻结的 Depth Anything V2 单目特征注入立体网络。在训练中不接触任何目标域数据的零样本设定下，它在 Middlebury 上的 BP-2（视差误差大于 2 像素的像素百分比）从同设定下此前最好的 7.5 降到 1.1。代价是速度：论文自报在 A100 上处理 375×1242 约需 0.7 s。Fast-FoundationStereo（arXiv 2025-12，CVPR 2026）用蒸馏、分块 NAS 和结构化剪枝提速 10 倍以上，Middlebury-Q 在 RTX 3090 上约 49 ms，TensorRT 下约 21 ms（同一设置下 FoundationStereo 为 496 ms）。时间一致性方面，DynamicStereo（CVPR 2023）较早用跨帧注意力减轻学习式立体在视频上的闪烁，并发布了 Dynamic Replica 数据集。Stereo Any Video（ICCV 2025）利用冻结的 Video Depth Anything 特征，并提出跨 3 帧的时间凸上采样，在 Sintel Final 上把时间端点误差 TEPE 从 RAFT-Stereo 的 2.09 降到 1.07。\n\n截至 2026 年 9 月，零样本精度问题已大体被基础模型解决，实时化正在靠蒸馏解决。但“多对输入、1080p、时间一致、带可靠不确定度”这几个要求，还没有哪个实时模型能同时满足。telepresence 的特殊之处在于三点：每帧都要为 K 个输入视角各算一张深度（Ha et al. 取 K=4）；深度在物体边缘出错会直接变成渲染中的飞点（flying pixels）；逐帧独立估计会表现为闪烁。Project Starline 走的是另一条路：每个捕获舱用一对 1280×1024 近红外相机拍摄投射的图案（180 Hz），再用非学习的时空立体算法 ESPReSSo（3DV 2018）以 60 fps 输出深度。学完本专题，才能判断 Ha et al. 中“深度估计不计入运行时间”“颜色差分掩码滤波”“TSDF 截断取 2 cm”这些设计背后的真实代价。", "key_ideas": [{"name_zh": "代价体与 soft argmin：把“找对应”变成可微的体数据处理", "explain_zh": "直觉是这样的：对左图每个像素，把“视差分别为 0、1、…、D−1 时右图对应特征有多像”排成一列，所有像素合起来就是一个 H×W×D 的“相似度立方体”，深度估计变成在每一列里找代价最低的位置。GC-Net 用 3D 卷积在这个立方体里同时沿空间和视差方向聚合上下文，再用 soft argmin 得到可微的亚像素视差：先对负代价做 softmax 得到概率，再求视差的期望。代价体有三种构造方式：特征拼接（GC-Net，信息最全，体积最大）；全相关（DispNet-C，只剩 1 个通道）；分组相关（GwcNet，把通道分成若干组、逐组做相关，是两者的折中）。需要注意，soft argmin 求的是期望而不是众数。在前景和背景交界处，概率分布是双峰的，期望值会落在两者之间，GC-Net 论文自己也指出它对多峰分布敏感。这是深度图中飞点的主要来源之一。"}, {"name_zh": "相关查表加循环迭代：RAFT-Stereo 范式", "explain_zh": "RAFT-Stereo 先在 1/4 或 1/8 分辨率上，对左右特征计算同一行上所有像素对的点积，再沿最后一维做平均池化，得到 4 级相关金字塔。每次迭代时，GRU 以当前视差为中心，从各级金字塔中取出一个小窗口的相关值，结合上下文特征和隐藏状态输出一个视差增量。多级分辨率的 GRU 让信息能在大范围内传播。训练使用逐次加权的 L1 损失（γ=0.9），训练时迭代 16–22 次；论文的消融和 Middlebury 提交在推理时迭代 32 次，ETH3D 结果和零样本泛化表用 80 次。GRU 权重在各次迭代间共享，所以推理时多迭代几次只增加时间、不增加显存。最后用“3×3 粗分辨率邻居的凸组合”上采样到全分辨率，以保住边缘。这是学习式迭代细化（l-iterative）的典型例子，与 Quark 的 render-and-refine 思路相同、做法不同：RAFT 迭代的对象是视差，依据是相关查表；Quark 迭代的对象是 LDM，依据是把当前结果渲染回输入视角后与观测之间的残差。"}, {"name_zh": "大规模合成数据与零样本泛化", "explain_zh": "真实场景的稠密视差真值极难获得（KITTI 只有稀疏的 LiDAR 真值），所以学习式立体几乎都先在合成数据上训练。Mayer et al.（CVPR 2016）发布的 SceneFlow 三件套（FlyingThings3D、Monkaa、Driving）是第一代标准预训练集。CREStereo 专门合成了细结构、校正不理想等难例。FoundationStereo 用 NVIDIA Omniverse 路径追踪生成了 100 万对 FSD 数据，并迭代剔除 BP-2 大于 60% 的歧义样本。“只在合成数据上训练、直接在真实数据上测试”的零样本设定，已成为衡量泛化能力的标准协议。对 telepresence 要注意，这些数据里近距离的人脸、头发、眼镜都很少，FoundationStereo 也承认训练集中透明物体有限。"}, {"name_zh": "单目先验注入：从“只会匹配”到“匹配加理解”", "explain_zh": "纯匹配在无纹理墙面、反光区域和遮挡区域没有信号，而单目深度模型（如 Depth Anything V2，见 d-mono）能凭语义给出合理的相对形状。FoundationStereo 的做法叫 side-tuning：冻结 DAv2-L 的 ViT，用一个 CNN 在 1/4 分辨率上把它的特征与立体特征拼接。代价体由 8 组分组相关加特征拼接构成，再用轴向—平面卷积（APC）和只沿视差维做注意力的 Disparity Transformer 进行过滤。MonSter/MonSter++ 则让单目分支和立体分支互相校正尺度、互相补足病态区域。零样本结果（论文 Table 2，训练时不接触任何目标域数据）：Middlebury BP-2 为 1.1，ETH3D BP-1 为 0.5，KITTI-12 D1 为 2.3，KITTI-15 D1 为 2.8；同样允许用多个数据集训练的 Selective-IGEV* 分别为 7.5、3.4、3.2、4.5。即使只用 SceneFlow 训练，FoundationStereo 也有 5.5、1.8、3.2、4.9，优于同设定下所有对比方法，说明单目先验本身贡献了很大一部分泛化能力。"}, {"name_zh": "实时化的两条路：少建代价体，或压缩大模型", "explain_zh": "第一条是改结构。HITNet（Google，CVPR 2021）不建完整的代价体，而是用带斜率的平面 tile 假设做多分辨率初始化和传播；发表时，在耗时低于 100 ms 的已发表方法中，它在 KITTI 上排第一。RAFT-Stereo 的实时变体让特征与上下文编码器共享一个骨干，只保留 1/8 和 1/16 两级 GRU，并采用慢快交替（slow-fast）的迭代调度，在 KITTI 分辨率（1248×384）上达到 26 FPS，零样本 KITTI-15 D1 为 5.91。第二条是压缩大模型。Fast-FoundationStereo 把 FoundationStereo 的混合骨干蒸馏成单一骨干，用分块 NAS 搜索代价过滤结构，并剪枝迭代模块，在 Middlebury-Q 上约 49 ms（RTX 3090）或 21 ms（TensorRT），峰值显存 0.63 GB。Project Starline 则选择了非学习的 ESPReSSo：近红外图案投射加时空立体，用主动照明降低找匹配的难度。Quark 的作者之一 Supreeth Achar 也是 ESPReSSo 的作者。"}, {"name_zh": "视频立体与时间一致性", "explain_zh": "逐帧独立的立体网络即使每一帧都准确，相邻帧之间在弱纹理处也会出现亚像素级的来回跳动，换算成深度就是闪烁（见 v-temporal）。DynamicStereo 用分离的时空注意力汇聚相邻帧的信息，并发布了 Dynamic Replica（扫描环境中的人和动物的合成视频）作为训练集和基准。Stereo Any Video 用冻结的 Video Depth Anything 特征提供时间上稳定的先验，提出在两个搜索窗口内计算所有点对相似度的 all-to-all-pairs 相关，以及跨 3 帧、共 27 个低分辨率邻居的时间凸上采样。评价指标是时间端点误差 TEPE：在 Sintel Final 上，Stereo Any Video 为 1.07，DynamicStereo 为 1.43，RAFT-Stereo 为 2.09。代价同样明显：在 A6000 上处理 20 帧 720×1280 需要 41.1 GB 显存。Ha et al. 用“颜色差分掩码递归滤波”在网络外部近似完成同样的事。"}, {"name_zh": "从视差误差到深度误差：为什么远处总是更差", "explain_zh": "对 Z = fB/d 求导得 δZ ≈ Z²/(fB)·δd：同样 0.25 像素的视差误差，距离翻倍时深度误差变为 4 倍。这条关系影响三件事。一是基线的选择：B 越大越准，但遮挡更多、匹配更难。二是 TSDF 截断距离：它本应随深度变化。三是它说明了 Quark 把 LDM 的层按等视差而不是等深度放置的合理性（论文没有单独论证这一点）：等视差间隔在相邻视角图像上对应近似相等的像素位移，也就是相等的匹配难度（见 g-depth）。"}, {"name_zh": "读懂立体评测指标：EPE、BP-X、D1 与 TEPE", "explain_zh": "论文表格里的数字大多来自四个指标，都在视差域（像素）上计算。EPE（end-point error）是所有有效像素视差绝对误差的平均值。BP-X（bad pixel）是视差误差大于 X 像素的像素百分比，Middlebury 常用 BP-2，ETH3D 常用 BP-1。D1 是 KITTI 的指标：误差同时大于 3 像素且大于真值 5% 的像素百分比；D1-all 统计全部像素，D1-bg 和 D1-fg 分别只统计背景和前景。TEPE（temporal EPE）比较的是相邻两帧预测视差的变化量与真值变化量之差，衡量闪烁而不是单帧精度。数值例：一张 100 万像素的视差图里若有 1.1 万个像素误差超过 2 px，BP-2 就是 1.1%，这正是 FoundationStereo 在 Middlebury 上的水平。要注意两点：换到深度域后误差按 Z² 放大（见下面第一个公式）；这些指标都是全图平均，对少量边缘飞点不敏感，而飞点恰恰决定了渲染质量。"}], "equations": [{"tex": "Z = \\frac{f\\,B}{d}, \\qquad \\delta Z \\approx \\frac{Z^{2}}{f\\,B}\\,\\delta d", "explain_zh": "直觉：视差是同一个三维点在两台相机里横向错开的像素数，点越远，错开越少。符号：Z 为深度（米）；f 为以像素计的焦距；B 为两相机光心之间的基线（米）；d 为视差（像素）；δd 为视差估计误差（像素）；δZ 为由此造成的深度误差（米）。第二式由第一式对 d 求导得到。数值例：设 f=1400 px、B=0.2 m。Z=2 m 时 d=140 px，δd=0.25 px 对应 δZ≈4/280×0.25≈3.6 mm；Z=8 m 时 d=35 px，同样的 δd 对应 δZ≈64/280×0.25≈5.7 cm。后者远大于 Ha et al. TSDF 使用的固定截断 τ=0.02 m，说明固定的公制截断对远处背景偏紧。这与 Ha et al. 在户外数据集 ENeRF-Outdoor 上 PSNR 输给 ENeRF（24.01 对 25.79）的现象一致，但论文本身没有做这项归因，这里只是一种可能的解释。"}, {"tex": "\\hat{d}(u,v) = \\sum_{d=0}^{D_{\\max}} d \\cdot \\sigma\\big(-c_{d}(u,v)\\big)", "explain_zh": "GC-Net 的 soft argmin。直觉：用加权平均代替不可微的“取最小”。符号：c_d(u,v) 是像素 (u,v) 在候选视差 d 下经 3D 卷积聚合后的代价，越小越匹配；σ(·) 是沿视差维的 softmax，把 −c 变成概率 p_d；D_max 是最大候选视差（GC-Net 在 SceneFlow 上用 192）；\\hat d 是概率加权的期望视差，可微且可以达到亚像素精度。数值例：设 f=1400 px、B=0.2 m，人物在 1 m 处（d=280 px），背后的墙在 4 m 处（d=70 px）。在轮廓像素上，如果网络给两者各 0.5 的概率，\\hat d=175 px，对应 Z=1.6 m，这是一个悬在人背后 60 cm 空中的点。这种点在 Ha et al. 中会被变成一个完全不透明的像素级高斯；Ha et al. 选择逐视角分别 splat，再由融合网络在 TSDF 深度引导下取舍，就是为了压制飞点（Fig. 4）。Quark 的 LDM 每个像素保留多层（最终 6 层），可以一层放在人身上、一层放在墙上，再用 density 表达“部分属于前景”，从表示上避开了单峰平均的问题。"}, {"tex": "\\mathbf{C}_{ijk} = \\sum_{h} \\mathbf{f}_{ijh}\\,\\mathbf{g}_{ikh}, \\qquad \\mathbf{d}^{(n+1)} = \\mathbf{d}^{(n)} + \\Delta\\mathbf{d}^{(n)}, \\qquad \\mathcal{L} = \\sum_{n=1}^{N} \\gamma^{N-n} \\big\\lVert \\mathbf{d}_{gt} - \\mathbf{d}^{(n)} \\big\\rVert_{1}", "explain_zh": "RAFT-Stereo 的三个核心式子。f 和 g 分别是左图和右图的特征图（1/4 或 1/8 分辨率）；i 为行号，j 为左图列号，k 为右图列号，h 为特征通道。C_ijk 是左图像素 (i,j) 与右图同一行像素 (i,k) 的相似度。校正后对应点只可能落在同一行，所以相关体是 H×W×W，而不是光流所需的 H×W×H×W。d^(n) 是第 n 次迭代后的视差图；增量 Δd^(n) 由 GRU 预测，输入是以 d^(n) 为中心从相关金字塔取出的局部相关值、上下文特征和隐藏状态。N 为迭代次数，γ=0.9 让靠后的迭代权重更大，d_gt 为真值视差。数值例：若在 Ha et al. 的 DyNeRF 分辨率 1352×1014 上运行，特征取 1/4 分辨率（338×254），相关体有 254×338×338≈2.9×10⁷ 个元素，fp32 约 116 MB。若像光流那样做二维全对相关，则约有 7.4×10⁹ 个元素（约 30 GB）。极线约束在这里带来了两个数量级的节省。"}], "evolution": [{"year": 2015, "milestone_zh": "MC-CNN（CVPR 2015 初版，JMLR 2016 扩展版）用 CNN 学习图像块匹配代价，后接 SGM 等手工步骤，在 KITTI 和 Middlebury 上超越手工代价"}, {"year": 2016, "milestone_zh": "Mayer et al.（CVPR 2016）发布 SceneFlow 合成数据集与 DispNet，端到端视差回归和“合成数据预训练”成为标准做法"}, {"year": 2017, "milestone_zh": "GC-Net 提出拼接式四维代价体、3D 卷积聚合和 soft argmin，开启端到端深度立体"}, {"year": 2018, "milestone_zh": "PSMNet 引入空间金字塔池化与堆叠 hourglass；同年 ESPReSSo 实现实时时空立体，后来被 Project Starline 用于近红外深度"}, {"year": 2019, "milestone_zh": "GwcNet 提出分组相关代价体，在紧凑性和信息量之间折中"}, {"year": 2021, "milestone_zh": "RAFT-Stereo 提出相关查表加多级 GRU 迭代，在 Middlebury 和 ETH3D 上第一；HITNet 不建完整代价体，实现实时立体；Project Starline（SIGGRAPH Asia 2021）用 ESPReSSo 主动近红外时空立体为 telepresence 原型系统实时提供深度"}, {"year": 2022, "milestone_zh": "CREStereo 面向手机等设备上的非理想校正，采用级联循环网络和难例合成数据"}, {"year": 2023, "milestone_zh": "IGEV-Stereo 用几何编码体为 GRU 提供好的初值；DynamicStereo 与 Dynamic Replica 推动学习式立体视频的时间一致性研究"}, {"year": 2025, "milestone_zh": "FoundationStereo 以 100 万对合成数据和 DAv2 side-tuning 实现强零样本立体；Stereo Any Video 用视频深度先验实现时间一致的立体；Ha et al.（CVPR 2025）仍以 RAFT-Stereo 作为几何前端"}, {"year": 2025, "milestone_zh": "Fast-FoundationStereo（12 月 arXiv，CVPR 2026）首次在实时帧率下实现零样本泛化（TensorRT 约 21 ms）"}, {"year": 2026, "milestone_zh": "Lite Any Stereo V2 等工作继续压缩零样本立体的延迟，开始面向 Orin 等嵌入式平台"}], "papers": [{"title": "RAFT-Stereo: Multilevel Recurrent Field Transforms for Stereo Matching", "authors": "Lahav Lipson et al.", "year": 2021, "venue": "3DV 2021", "url": "https://arxiv.org/abs/2109.07547", "citations": 731, "role_zh": "把光流网络 RAFT 改造成立体匹配网络：只沿极线计算 H×W×W 的全对相关并建 4 级金字塔，多级 ConvGRU 迭代更新视差（推理通常 32 次），用凸上采样保住边缘。发表时在 Middlebury 和 ETH3D 上第一，并有 KITTI 分辨率 26 FPS 的实时变体。Ha et al. 的逐视角深度就是由它生成的，要读懂锚点 B 的几何前端必须读这篇。", "priority": "must"}, {"title": "End-to-End Learning of Geometry and Context for Deep Stereo Regression", "authors": "Alex Kendall et al.", "year": 2017, "venue": "ICCV 2017", "url": "https://arxiv.org/abs/1703.04309", "citations": 1561, "role_zh": "GC-Net，第一个端到端的深度立体网络：把左右特征拼接成四维代价体（SceneFlow 上 D=192），用 3D 卷积编码器—解码器聚合上下文，用 soft argmin 得到可微的亚像素视差；KITTI 2015 D1-all 为 2.87%。“代价体 + soft argmin”这一组合此后被 PSMNet、MVSNet、ENeRF 等沿用。", "priority": "must"}, {"title": "FoundationStereo: Zero-Shot Stereo Matching", "authors": "Bowen Wen et al.", "year": 2025, "venue": "CVPR 2025", "url": "https://arxiv.org/abs/2501.09898", "citations": 285, "role_zh": "立体基础模型的代表作，有三项关键设计：100 万对路径追踪合成数据，并自动剔除歧义样本；冻结 Depth Anything V2 的 side-tuning 特征；轴向—平面卷积加视差维 Transformer 的混合代价过滤。零样本 Middlebury BP-2 为 1.1（同设定下此前最好为 7.5），ETH3D BP-1 为 0.5。缺点是慢（A100 上 375×1242 约 0.7 s）。", "priority": "must"}, {"title": "A Large Dataset to Train Convolutional Networks for Disparity, Optical Flow, and Scene Flow Estimation", "authors": "Nikolaus Mayer et al.", "year": 2016, "venue": "CVPR 2016", "url": "https://arxiv.org/abs/1512.02134", "citations": 3092, "role_zh": "发布 FlyingThings3D、Monkaa、Driving 三个合成立体视频数据集（首批可用于训练场景流的大规模数据集），并提出实时视差网络 DispNet。“先在 SceneFlow 上预训练”从此成为学习式立体的标准流程，也是今天零样本评测中对训练集的默认约定。", "priority": "should"}, {"title": "Pyramid Stereo Matching Network", "authors": "Jia-Ren Chang, Yong-Sheng Chen", "year": 2018, "venue": "CVPR 2018", "url": "https://arxiv.org/abs/1803.08669", "citations": 1853, "role_zh": "PSMNet：在 GC-Net 基础上加入空间金字塔池化，聚合多尺度上下文；用带中间监督的堆叠 hourglass 3D CNN 正则化代价体。2018 年 3 月前在 KITTI 2012/2015 上第一，是“3D 代价体”时代最常用的基线和代码库。", "priority": "should"}, {"title": "Stereo Matching by Training a Convolutional Neural Network to Compare Image Patches", "authors": "Jure Žbontar, Yann LeCun", "year": 2016, "venue": "JMLR 17 (2016)", "url": "https://arxiv.org/abs/1510.05970", "citations": 1477, "role_zh": "MC-CNN：首次用 CNN 学习图像块相似度作为匹配代价（提供快速版和精确版两种结构），后面仍接交叉聚合、SGM、左右一致性检查等传统步骤，在 KITTI 和 Middlebury 上超越手工代价。它标志着“学习代价、传统优化”这一过渡阶段。", "priority": "should"}, {"title": "Iterative Geometry Encoding Volume for Stereo Matching", "authors": "Gangwei Xu et al.", "year": 2023, "venue": "CVPR 2023", "url": "https://arxiv.org/abs/2303.06615", "citations": 429, "role_zh": "IGEV-Stereo 指出 RAFT 式的全对相关缺少非局部几何信息。它先用轻量 3D 网络正则化得到几何编码体（GEV）并回归出较好的初值，再把 GEV 与全对相关合并，供 ConvGRU 迭代查表，因此收敛更快。在 KITTI 2015 和 KITTI 2012（反光区域）上第一，并扩展到了 MVS（IGEV-MVS）。", "priority": "should"}, {"title": "DynamicStereo: Consistent Dynamic Depth from Stereo Videos", "authors": "Nikita Karaev et al.", "year": 2023, "venue": "CVPR 2023", "url": "https://arxiv.org/abs/2305.02296", "citations": 163, "role_zh": "较早系统研究学习式立体在视频上的时间一致性，明确以 AR/VR 中闪烁严重影响体验为动机。Transformer 用分离的时空注意力汇聚相邻帧信息；同时发布 Dynamic Replica 合成数据集（扫描环境中的人和动物），作为训练集和一致性基准。", "priority": "should"}, {"title": "Stereo Any Video: Temporally Consistent Stereo Matching", "authors": "Junpeng Jing et al.", "year": 2025, "venue": "ICCV 2025", "url": "https://arxiv.org/abs/2503.05549", "citations": 10, "role_zh": "用冻结的 Video Depth Anything 特征提供时间稳定的先验，提出 all-to-all-pairs 相关和跨 3 帧的时间凸上采样；零样本 Sintel Final TEPE 为 1.07（DynamicStereo 1.43，RAFT-Stereo 2.09）。它可以从源头替代 Ha et al. 的“逐帧 RAFT-Stereo + 差分掩码滤波”，但处理 20 帧 720×1280 需要 41.1 GB 显存。", "priority": "should"}, {"title": "Group-wise Correlation Stereo Network", "authors": "Xiaoyang Guo et al.", "year": 2019, "venue": "CVPR 2019", "url": "https://arxiv.org/abs/1903.04025", "citations": 738, "role_zh": "GwcNet 提出分组相关代价体：把特征通道分组后逐组做相关，兼顾全相关的紧凑和拼接的信息量，并改进了 3D hourglass。FoundationStereo 等后续模型仍在使用分组相关。", "priority": "optional"}, {"title": "Practical Stereo Matching via Cascaded Recurrent Network with Adaptive Correlation", "authors": "Jiankun Li et al.", "year": 2022, "venue": "CVPR 2022", "url": "https://arxiv.org/abs/2203.11483", "citations": 418, "role_zh": "CREStereo 面向手机等消费级设备上的实用立体匹配：分层循环网络由粗到细更新视差，推理时采用级联结构；自适应分组相关层用于抵抗校正误差；另外构建了难例合成数据集。在 Middlebury 和 ETH3D 上第一。它对校正误差鲁棒的设计，对自己搭建相机阵列很有参考价值。", "priority": "optional"}, {"title": "Fast-FoundationStereo: Real-Time Zero-Shot Stereo Matching", "authors": "Bowen Wen et al.", "year": 2025, "venue": "CVPR 2026（arXiv 2025-12）", "url": "https://arxiv.org/abs/2512.11130", "citations": 29, "role_zh": "用知识蒸馏、分块神经结构搜索和结构化剪枝，把 FoundationStereo 提速 10 倍以上，并用 140 万对真实图像的伪标签补充训练。Middlebury-Q 上约 49 ms（RTX 3090）或 21 ms（TensorRT），同一设置下 FoundationStereo 为 496 ms，首次在实时帧率下实现强零样本泛化，是把立体深度纳入 telepresence 实时预算的现实选项。", "priority": "optional"}, {"title": "HITNet: Hierarchical Iterative Tile Refinement Network for Real-time Stereo Matching", "authors": "Vladimir Tankovich et al.", "year": 2021, "venue": "CVPR 2021", "url": "https://arxiv.org/abs/2007.12140", "citations": 308, "role_zh": "Google 的实时立体网络，代表“不建完整代价体”的实时路线：多分辨率初始化后，用带斜率的平面 tile 假设做可微的 2D 传播和 warping，逐级细化视差。发表时在耗时低于 100 ms 的已发表方法中，KITTI 2012/2015 排第一；在 ETH3D 上各项指标排 1–3 名。读它可以理解实时立体为了省掉 3D 代价体做了哪些取舍，也是理解 Fast-FoundationStereo、Lite Any Stereo 等后续实时模型的参照。", "priority": "optional"}, {"title": "ESPReSSo: Efficient Slanted PatchMatch for Real-time Spacetime Stereo", "authors": "Harris Nover, Supreeth Achar, Dan B Goldman", "year": 2018, "venue": "3DV 2018", "url": "https://doi.org/10.1109/3DV.2018.00072", "citations": 7, "role_zh": "非学习的实时主动时空立体：投射近红外图案，在空间和时间窗口上做带斜率的 PatchMatch。引用数不高，但它是 Project Starline 捕获舱的深度算法（Starline 论文写明沿用了它的分辨率、帧率和算法）；Ha et al. 的 image-based TSDF 正是沿用 Starline 的融合方式。第二作者 Supreeth Achar 也是 Quark 的作者。它提醒读者：在 telepresence 这种可控环境里，主动照明是绕开弱纹理难题的现实选项。", "priority": "optional"}], "prereqs": ["d-stereo", "g-epipolar", "g-depth", "l-cnn", "l-iterative"], "relation_to_anchors_zh": "与 Ha et al. 的关系最直接：它的整条几何分支都以立体深度为输入。Sec. 3 写明逐视角深度来自立体算法 RAFT-Stereo；Sec. 4 的实现细节和附录 A.5 进一步说明，对 DyNeRF 和 Google Spaces 这类固定阵列，RAFT-Stereo 是“在人工挑选的图像对上”运行的；ScanNet 则用传感器深度。这一步的耗时没有计入 Table 4 的约 39 ms（TensorRT，1352×1014，K=4）。学完本专题，至少能看清四件事。(1) 为什么要“人工挑选图像对”：RAFT-Stereo 只处理校正后的双目，必须为每台相机找一个基线合适、视场重叠大的伙伴，做立体校正后再用 Z=fB/d 把视差换回深度。人工选对无法在线进行，论文也没有交代测试时深度是怎样生成的。(2) 为什么需要颜色差分掩码滤波（Ḋ=M·D+(1−M)·Ḋ_{t−1}，M=min(|ΔI|/0.7+0.6, 1)）：逐帧的立体网络没有时间记忆，静态区域也会闪烁；DynamicStereo 和 Stereo Any Video 正是从源头解决这个问题的。(3) 为什么 TSDF 融合权重要看 7×7 局部方差：RAFT-Stereo 不输出不确定度，只能事后用深度的局部起伏来近似置信度。(4) 为什么固定截断 τ=0.02 m 可能有问题：δZ 与 Z² 成正比。若把深度前端换成 Fast-FoundationStereo，按它在 Middlebury-Q 上约 21 ms（TensorRT，RTX 3090）粗估，K=4 个视角各算一对就需要约 84 ms，已经超过 Ha et al. 其余所有阶段合计的 39 ms；而且 DyNeRF 的 1352×1014 约为 Middlebury-Q 像素数的 3–4 倍，实际只会更慢。可见在 telepresence 中，深度往往是最大的开销。\n\n与 Quark 的关系是隐式的：Quark 不输入任何深度，但它做的事情与学习式立体在结构上是对应的。(1) Quark 的 5 步 Update & Fuse 与 RAFT-Stereo 的 32 次 GRU 迭代都属于学习式迭代细化（l-iterative）。区别在于更新信号：RAFT 靠相关查表判断视差该往哪里走；Quark 把当前 LDM 渲染回每个输入视角，用渲染结果与观测之间的差作为更新信号。去掉这一信号后，PSNR 从 30.41 降到 29.71。(2) Quark 的层深度按近/远平面之间的等视差间隔放置，每层只能在自己的视差带内移动。这与立体匹配以视差而不是深度作为搜索变量是同一个原因。(3) RAFT-Stereo 用凸上采样，Quark 用“先上采样、后激活”（借自 ReLU Fields），目的都是从低分辨率几何得到锐利的遮挡边缘。(4) 在遮挡边缘，单一深度的 soft argmin 期望会产生飞点；Quark 每个像素保留多层（最终 6 层）并用 density 表达，从表示上允许前景和背景同时存在。所以 Quark 可以绕开“先估深度”这一步，代价是几何只对当前目标视角有效，用完即弃。", "debates_zh": ["代价体加 3D 卷积、相关查表加迭代、纯注意力匹配（STTR、Unimatch），哪条路线最能随数据和算力扩展？FoundationStereo 仍然保留代价体和 GRU，说明到 2025 年显式匹配结构还没有被纯 Transformer 取代，但这个结论可能随数据规模变化。", "合成数据够不够：FoundationStereo 靠 100 万对合成数据实现零样本泛化，Fast-FoundationStereo 又补充了 140 万对真实图像的伪标签。伪标签会不会把教师模型的系统误差（比如边缘过度平滑）固化下来？", "被动 RGB 立体、主动红外立体（Starline 的 ESPReSSo）还是 ToF 传感器？主动方案在弱纹理区可靠、延迟可控，但增加了硬件成本，也怕阳光干扰；纯 RGB 方案硬件简单，但要依赖大模型和 GPU 预算。", "显式深度是不是必需的：Ha et al. 先估深度再融合，Quark 完全不输入深度也拿到了更高的单帧质量。对 NVS 而言，逐视角深度的 EPE、D1 指标与最终画质、时间稳定性之间是什么关系，目前并不清楚。", "基准指标（EPE、D1、BP-2）只衡量单帧误差，反映不了飞点、边缘锐度和闪烁，而这些恰恰决定渲染质量。TEPE 这类时间指标才刚刚开始被采用。"], "open_questions_zh": ["多对、1080p、时间一致的实时深度：要为 4–8 台相机同时输出时间稳定的深度，总预算在 10–20 ms 量级。现有实时模型都是单对、逐帧的；视频立体模型离实时还很远（Stereo Any Video 在 A6000 上处理 20 帧 720p 需要 41.1 GB 显存）。", "边缘与多峰：怎样让立体网络在遮挡边界输出双峰或分层的深度，而不是单一期望值，从源头消除飞点，并以低成本传给下游的 splat 或 TSDF。", "不确定度：怎样输出经过校准的逐像素置信度，替代 Ha et al. 的 7×7 局部方差启发式，让融合网络在不可靠区域退回纯图像混合。", "非校正、宽基线、异构相机：telepresence 阵列里的相机未必成对平行，做校正会损失视场。Unimatch 这类带位姿的非校正立体方法或 MVS 方法，能否在实时预算内取代“选对 + 校正”？", "近距离人体的难例：头发、眼镜、皮肤高光、快速手势。现有合成数据覆盖不足，FoundationStereo 也承认透明物体有限。", "怎样用下游指标（渲染 PSNR/LPIPS、STED 等时间一致性指标）而不是 EPE 来训练和评估深度前端，实现深度与渲染的端到端联合优化。"], "resources": [{"title": "Computer Vision: Algorithms and Applications, 2nd ed.（Szeliski）", "url": "https://szeliski.org/Book/", "type": "book", "note_zh": "先读第 12 章 Depth estimation，涵盖对极几何、稠密对应、局部与全局方法和深度网络，再读 GC-Net 与 RAFT-Stereo 会轻松很多。官网可免费下载 PDF，限个人使用。"}, {"title": "CMU 16-385 Computer Vision", "url": "https://www.cs.cmu.edu/~16385/", "type": "course", "note_zh": "课程页（Spring 2020 版）中“Two-view geometry”和“Stereo”两讲有 PDF 和 PPT，讲清了校正、视差、深度换算和经典匹配代价，是学习式立体的直接前置。"}, {"title": "RAFT-Stereo 官方代码", "url": "https://github.com/princeton-vl/RAFT-Stereo", "type": "code", "note_zh": "官方 PyTorch 实现和预训练权重。建议自己跑 demo，观察迭代次数对边缘与细结构的影响，并把输出视差换算成深度，体会 δZ∝Z² 的效应。"}, {"title": "FoundationStereo 项目主页", "url": "https://nvlabs.github.io/FoundationStereo/", "type": "code", "note_zh": "项目页附有代码与模型链接，可以直接在自己拍摄的双目图像上测试零样本效果。之后再对照 Fast-FoundationStereo 项目页，比较精度与速度之间的取舍。"}]}, {"id": "a-learned-mvs", "title_zh": "学习式多视角立体与代价体", "title_en": "Learned MVS & cost volumes", "overview_zh": "多视角立体（MVS）的任务是：已知 N 张图像的内外参（通常来自 SfM/COLMAP，见 g-sfm），为某个参考视角估计稠密深度图，再把多张深度图融合成点云或网格。与双目不同，MVS 的相机不在同一条水平线上，数量可变，基线也各不相同，因此不能“沿一行找匹配”，而要用平面扫描（plane sweep，见 d-mvs）：在参考相机视锥里放一组等深度或等视差的平面，把每个源视角的图像经单应（homography）变换“贴”到每个平面上，看在哪个深度下所有视角看到的内容最一致。经典方法（如 COLMAP 的 PatchMatch MVS）依赖手工的光度一致性代价，在弱纹理、反光和遮挡处容易出错，处理一张图要花秒级到分钟级的时间。\n\nMVSNet（ECCV 2018）把这条流程做成端到端网络，确立了学习式 MVS 的四步模板：(1) 用 2D CNN 提取 1/4 分辨率、32 通道的特征；(2) 用可微单应把每个源视角的特征 warp 到参考视锥的 D 个深度平面上；(3) 用逐元素方差把任意 N 个特征体合成一个代价体，再用 3D U-Net 正则化成概率体；(4) 对概率体沿深度方向求期望，得到深度。它在 DTU 上的 overall（accuracy 与 completeness 两个平均距离的均值）为 0.462 mm，completeness 大幅领先传统方法。这个模板的瓶颈是显存：代价体大小为 (H/4)×(W/4)×D×C，D=256 时单个代价体就要数 GB。此后几年的工作几乎都在解决这一问题。R-MVSNet 用 GRU 沿深度方向顺序处理 2D 代价图。CasMVSNet 用由粗到细的级联代价体，逐级缩小深度搜索范围（假设数 48→32→8），把 DTU overall 降到 0.355 mm。UCS-Net 根据不确定度为每个像素构建“自适应薄体”。PatchmatchNet 把经典 PatchMatch 的传播与评估改成可学习模块，完全不建完整的代价体。TransMVSNet 用 Transformer 的自注意力和交叉注意力增强特征匹配。SimpleRecon 则证明，只用 2D CNN 加上带元数据的平面扫描特征体，就能实时估计深度，再交给传统 TSDF 融合。\n\n对本页读者更重要的是 MVS 与新视角合成（NVS）的结合。最早的学习式平面扫描体其实就出自 NVS：Quark 的第一作者 John Flynn 在 DeepStereo（CVPR 2016）中，在目标视角放置一组深度平面，把邻近视角重投影上去，让网络预测每个平面的颜色和“选择概率”。这就是“在目标视锥中构建代价体”思想的起点（详见 i-psv）。2021 年后，MVS 代价体成为可泛化神经渲染的几何骨架。MVSNeRF 用 3 张邻近图像构建平面扫描代价体，再解码成辐射场。ENeRF 用两级级联代价体（64 个平面 → 8 个平面）估计粗深度和它的标准差，只在表面附近 ±1σ 的范围内采 2 个点做体渲染，比此前的可泛化 NeRF 快至少 60 倍。MVSplat 用平面扫描代价体定位前馈 3D 高斯的中心；DepthSplat 又把单目深度特征接入了代价体。\n\n截至 2026 年 9 月，学习式 MVS 有两个明显趋势。一是零样本化：MVSAnywhere（CVPR 2025）结合单目和多视角线索，并使用自适应代价体，能跨室内外场景和不同深度范围泛化；MonSter++ 把单目先验同时用于双目和 MVS。二是正在被几何基础模型包抄：MapAnything 等模型接受已知内参和位姿作为输入，一次前向就完成已标定的 MVS。它的 50 视角消融（ETH3D、ScanNet++ v2、TartanAirV2 平均）显示，只给图像时点图相对误差为 0.28、公制尺度相对误差为 0.16；再给内参和公制位姿后分别降到 0.07 和 0.05。不过对实时 telepresence 来说，显式代价体仍是最可控的几何先验：每个平面都有明确的物理意义，计算量可以按“分辨率 × 平面数”精确预算。Quark 和 ENeRF 这类实时方法依赖的正是这一点。", "key_ideas": [{"name_zh": "参考视锥中的平面扫描与可微单应 warping", "explain_zh": "直觉：假设场景是一张位于深度 d 的平面，那么这张平面在两台相机中的像之间恰好是一个 3×3 射影变换（单应）。于是，把源图按 H_i(d) warp 到参考视角，本质上就是在问：如果真实表面在深度 d 处，源图应该长什么样。用双线性采样实现这个 warp，就可以对特征和相机参数求导，这就是“可微单应”。深度假设在范围小的场景里可以按深度均匀采样（MVSNet 在 DTU 上取 425–935 mm，步长 2 mm，D=256）；在范围大的场景里应按逆深度（视差）均匀采样，因为远处每单位深度对应的像素位移更小。Quark 初始的 24 层就是在近/远平面之间按等视差间隔放置的。"}, {"name_zh": "任意 N 视角的代价聚合：从方差到注意力", "explain_zh": "MVSNet 用 N 个特征体的逐元素方差作为代价：在正确深度上，各视角看到的是同一个表面点，特征一致，方差小。方差对视角顺序不敏感，又能接受任意 N，所以成为标准做法；IBRNet、ENeRF 用的“均值 + 方差 + 加权池化”也是同一思路。它的缺陷是对所有视角一视同仁：一个被遮挡的视角就能把正确深度处的方差拉高。之后的改进是让网络学习跨视角的权重或注意力：TransMVSNet 用帧间交叉注意力；Quark 用 One-to-many attention，把 LDM 当作单一 query，对 M 个视角的更新特征做交叉注意力。Quark 的消融显示，把 cross-attention 退化为均值后，PSNR 从 30.41 降到 29.73（DL3DV，1080p）。"}, {"name_zh": "代价体正则化与深度回归", "explain_zh": "原始的匹配代价充满噪声，需要“正则化”，也就是让相邻像素、相邻深度的代价互相参考。MVSNet 用四尺度的 3D U-Net（第一层就把 32 通道降到 8 通道）完成这一步，再沿深度做 softmax 得到概率体，用期望（soft argmin）回归深度。另一种做法是把深度当作分类问题，用交叉熵或 focal loss 监督，比如 TransMVSNet 的抗歧义 focal loss。回归的优点是可以达到亚像素精度，缺点是遇到多峰分布时会取平均；分类不会出现“两峰取中”，但深度精度受假设间隔的限制。"}, {"name_zh": "由粗到细与自适应深度假设", "explain_zh": "显存与分辨率之间的矛盾，靠“低分辨率用多个假设、高分辨率用少量假设”来解决。CasMVSNet 分三级，分辨率依次为原图每边的 1/4、1/2、1，深度假设数依次为 48、32、8，每一级都只在上一级深度附近搜索。UCS-Net 用概率体的方差决定每个像素搜索区间的宽度；ENeRF 取期望深度 ±1σ。Quark 做的是同一件事的分层版本：初始为 24 层、36×64，逐级提高分辨率并通过 layer collapse 减少层数，最终为 6 层、288×512。每层只能在自己的 ±0.5/L 视差带内移动，相当于一个学习出来的自适应薄体。去掉 layer collapse 后，运行时间增加 115%。"}, {"name_zh": "摆脱 3D 卷积：PatchmatchNet 与 SimpleRecon", "explain_zh": "3D 卷积是学习式 MVS 最主要的计算和显存开销。PatchmatchNet 把经典 PatchMatch 的“随机假设、邻域传播、代价评估”做成可学习的多尺度迭代模块，不建完整的代价体，比同期最优方法至少快 2.5 倍，显存减半。SimpleRecon 只用 2D CNN 处理平面扫描特征体，并把关键帧和几何元数据（如射线方向、相对位姿）一起放进代价体，实现在线、实时、低显存的深度估计，最后交给现成的 TSDF 融合。“逐视角深度 + TSDF 融合”正是 Ha et al. 几何分支的结构（见 d-tsdf）。"}, {"name_zh": "把代价体从参考视角搬到目标视角：MVS 遇上 NVS", "explain_zh": "MVS 在参考（输入）视角建代价体，目的是求这个视角的深度；NVS 关心的是目标视角看到什么，因此 DeepStereo、ENeRF、Quark 都把平面扫描放在目标视锥里：沿每条目标射线放置深度假设，把各输入视角的特征重投影上去，再预测颜色（或混合权重）和不透明度。这样得到的几何只对当前目标视角有效，但省去了“多张深度图再融合”这一步，渲染也只需逐像素做 over 合成（见 r-alpha）。Quark 论文 Sec. 3.2.2 明确写道，其逐视角更新特征 Δ“与平面扫描体有些相似”，同时还包含比较渲染图与输入图得到的可见性信息。"}, {"name_zh": "深度图融合与多视角一致性", "explain_zh": "MVS 为每个视角各自输出一张深度图，这些深度图之间并不天然一致，需要通过几何一致性检查或 TSDF 融合合成一个模型。Ha et al. 的 image-based TSDF 可以理解为“深度域的目标视角平面扫描”：沿目标射线逐点采样，把每个采样点投影到 K 个视角，用有符号距离 s_k=z_k−D_k[u_k,v_k] 代替特征方差作为“代价”，把符号由正变负的位置当作表面（步长 0.8·s，再做 3 步二分细化）。它与 MVS 代价体的差别在于：比较的是各视角已有的深度，而不是各视角的特征。"}, {"name_zh": "读懂 MVS 与深度的评测指标", "explain_zh": "DTU 用结构光扫描的点云作真值。accuracy 是重建点到真值表面的平均距离，衡量“重建出来的点准不准”；completeness 是真值点到重建点的平均距离，衡量“该有的地方有没有重建出来”；overall 是两者的平均。三者单位都是毫米，越小越好，MVSNet 分别为 0.396、0.527、0.462 mm。Tanks and Temples 报告的是给定距离阈值下 precision 与 recall 的调和平均（F-score），越大越好。评测单张深度图时常用 AbsRel=mean(|D̂−D|/D) 和 δ<1.25（预测与真值之比在 1.25 倍以内的像素比例）。数值例：某像素真值 2 m、预测 2.1 m，相对误差为 0.05；若全图一半像素误差 0.02、一半 0.08，AbsRel 就是 0.05。对 telepresence 要记住：这些指标都是逐帧、全局平均的，对遮挡边缘的飞点和帧间闪烁都不敏感。"}], "equations": [{"tex": "H_i(d) = K_i\\, R_i \\left( I - \\frac{(\\mathbf{c}_i - \\mathbf{c}_1)\\, \\mathbf{n}_1^{\\top}}{d} \\right) R_1^{\\top} K_1^{-1}", "explain_zh": "MVSNet 的可微单应（这里按相机中心约定重写）。直觉：把参考相机 1 视锥里一张深度为 d 的平面上的点，从参考图的像素坐标映射到源视角 i 的像素坐标。符号：K_i、R_i 为源相机 i 的内参和世界到相机的旋转（约定 x_cam = R_i(X − c_i)），c_i 为其光心在世界坐标系中的位置；K_1、R_1、c_1 为参考相机的相应量；n_1 为参考相机主光轴方向（世界坐标下的单位向量），也就是扫描平面的法向；d 为平面到参考光心的距离，即参考视角下的假设深度；I 为 3×3 单位阵。推导只需三步：参考像素 p 的射线为 X = c_1 + λR_1ᵀK_1⁻¹p；代入平面方程 n_1ᵀ(X − c_1) = d 解出 λ；再投影到相机 i。MVSNet 原文 Eq.(1) 写作 (t_1 − t_i) 且末尾印为 K_1ᵀ，对照原文时要注意平移的符号约定，最后一项应为 K_1⁻¹。数值例：若两台相机内参相同（焦距 f）、没有相对旋转（R_1=R_i=I）、源相机在参考相机右侧 B 处（c_i − c_1 = (B,0,0)），代入后参考像素 (u,v) 映射到 (u − fB/d, v)，即单应退化为水平平移 fB/d 像素，也就是双目视差。取 Quark 输入阵列的最大基线量级 B=0.3 m，并假设 f=1000 px：平面在 1 m 处平移 300 px，3 m 处平移 100 px，10 m 处平移 30 px。深度从 1 m 到 3 m，平移变化 200 px；从 3 m 到 10 m，只变化 70 px。所以近处的深度假设应当密、远处应当疏，即按逆深度均匀采样（见 g-depth）。"}, {"tex": "\\mathbf{C} = \\frac{1}{N}\\sum_{i=1}^{N}\\big(\\mathbf{V}_i - \\overline{\\mathbf{V}}\\big)^{2}, \\qquad \\hat{D}(p) = \\sum_{j=1}^{D} d_j\\, P_j(p)", "explain_zh": "方差代价与期望深度。符号：V_i 为第 i 个视角（含参考视角）的特征 warp 到 D 个深度平面后得到的特征体，大小为 H/4×W/4×D×C；\\bar V 为 N 个特征体的逐元素平均；平方是逐元素运算；C 为方差代价体。C 经 3D U-Net 正则化并沿深度做 softmax 后，得到像素 p 在第 j 个深度假设 d_j 上的概率 P_j(p)；\\hat D(p) 为期望深度。直觉：正确深度上各视角特征一致、方差小，错误深度上方差大。数值例（显存）：MVSNet 在 DTU 测试时 W×H=1600×1184、D=256，特征为 1/4 分辨率、32 通道，一个代价体有 400×296×256×32≈9.7×10⁸ 个元素，fp32 约 3.9 GB。这正是 R-MVSNet、CasMVSNet 等工作要解决的问题，也解释了 Quark 为什么只在很低的分辨率（最初 36×64）上使用密集的深度层。"}, {"tex": "\\hat{L} = \\sum_{i=1}^{D} P_i\\, L_i, \\qquad S = \\sqrt{\\sum_{i=1}^{D} P_i \\big(L_i - \\hat{L}\\big)^{2}}, \\qquad \\mathcal{U} = \\big[\\hat{L} - \\lambda S,\\ \\hat{L} + \\lambda S\\big]", "explain_zh": "级联代价体中下一级搜索区间的定义（按 ENeRF 的写法，每个量都针对像素 (u,v)；CasMVSNet 的思想相同）。符号：L_i 为第 i 个深度假设；P_i 为它的概率；\\hat L 为期望深度；S 为概率分布的标准差，即不确定度；λ 为区间系数（ENeRF 取 1）；𝒰 为下一级或渲染时的深度采样区间。直觉：网络越确定，下一级就搜得越窄。数值例：ENeRF 的粗级在 1/8 分辨率上使用 64 个平面，细级只用 8 个，最后每条光线只采 2 个点做体渲染（论文报告在 RTX 3090 上以 3 个输入视角渲染 512×512 图像约 25 FPS，其中 3D CNN 处理代价体占 16.1 ms；DTU 512×640 的消融中约 20 FPS）。对比 Quark：两者都是“低分辨率多假设、高分辨率少假设”，但 Quark 最终保留 6 层，ENeRF 只保留一个 ±1σ 的单峰区间。一个像素同时需要前景和背景时，单峰区间容纳不下，这就是 Quark 批评 ENeRF“单层带厚度深度在深度复杂场景中失败”的原因。"}], "evolution": [{"year": 1996, "milestone_zh": "Collins 提出平面扫描（space sweep），成为多视角匹配的基本操作"}, {"year": 2016, "milestone_zh": "DeepStereo（Flynn et al.）首次把学习式平面扫描体用于从真实图像做新视角合成，代价体被放到了目标视角"}, {"year": 2018, "milestone_zh": "MVSNet 确立“可微单应 + 方差代价体 + 3D U-Net + 期望深度”的模板；DeepMVS 用 VGG 特征和合成数据预训练做学习式 MVS"}, {"year": 2019, "milestone_zh": "R-MVSNet 用 GRU 沿深度方向顺序正则化，使高分辨率学习式 MVS 成为可能"}, {"year": 2020, "milestone_zh": "CasMVSNet 提出级联代价体（DTU overall 从 0.462 mm 降到 0.355 mm）；UCS-Net 提出基于不确定度的自适应薄体"}, {"year": 2021, "milestone_zh": "PatchmatchNet 提出可学习的 PatchMatch；MVSNeRF 把代价体解码成可泛化的辐射场"}, {"year": 2022, "milestone_zh": "TransMVSNet 把 Transformer 引入 MVS；SimpleRecon 不用 3D 卷积实现实时深度并配合 TSDF 融合；ENeRF 用级联代价体引导采样，实现交互式可泛化渲染"}, {"year": 2024, "milestone_zh": "MVSplat 用平面扫描代价体预测前馈 3DGS；Quark（SIGGRAPH Asia 2024）的迭代更新特征 Δ“与平面扫描体相似”，在目标视锥中做学习式、多尺度的扫描"}, {"year": 2025, "milestone_zh": "DepthSplat 把单目特征接入代价体；MVSAnywhere 实现零样本 MVS；Ha et al. 以 ENeRF 为最强基线；MapAnything 用一次前向完成已标定 MVS"}], "papers": [{"title": "MVSNet: Depth Inference for Unstructured Multi-view Stereo", "authors": "Yao Yao et al.", "year": 2018, "venue": "ECCV 2018", "url": "https://arxiv.org/abs/1804.02505", "citations": 1724, "role_zh": "确立学习式 MVS 的模板：1/4 分辨率 32 通道特征 → 可微单应把源视角特征 warp 到参考视锥的 D 个深度平面（DTU 上 425–935 mm，D=256）→ 方差聚合任意 N 个视角 → 3D U-Net 正则化 → 期望深度。DTU overall 0.462 mm；在 Tanks and Temples 上不做微调即排名第一。", "priority": "must"}, {"title": "Cascade Cost Volume for High-Resolution Multi-View Stereo and Stereo Matching", "authors": "Xiaodong Gu et al.", "year": 2020, "venue": "CVPR 2020", "url": "https://arxiv.org/abs/1912.06378", "citations": 995, "role_zh": "CasMVSNet：在特征金字塔上由粗到细构建代价体，用上一级的深度缩小下一级的搜索范围（假设数 48→32→8），同时逐级提高分辨率。套用在 MVSNet 上后，DTU overall 从 0.462 mm 降到 0.355 mm，摘要报告 GPU 显存减少 50.6%、运行时间减少 74.2%；该方法同样适用于双目立体。它是理解 ENeRF 和 Quark“升分辨率、降层数”设计的钥匙。", "priority": "must"}, {"title": "Efficient Neural Radiance Fields for Interactive Free-viewpoint Video", "authors": "Haotong Lin et al.", "year": 2022, "venue": "SIGGRAPH Asia 2022", "url": "https://arxiv.org/abs/2112.01517", "citations": 196, "role_zh": "ENeRF：把 MVS 的级联代价体（粗级 64 个平面，细级 8 个平面）用于可泛化神经渲染。由深度概率的均值和标准差确定 ±λσ（λ=1）的采样区间，每条光线只采 2 个点，比此前的可泛化 NeRF 快至少 60 倍（RTX 3090 上以 3 个输入视角渲染 512×512 约 25 FPS）。代价体的深度范围取自 SfM，这与 Quark 用 SfM 点设定近/远平面是同一个前提。它是 Quark 的主要速度对标对象（Quark 实测其在 1024×768 下 205 ms/帧），也是 Ha et al. 的最强基线。", "priority": "must"}, {"title": "DeepStereo: Learning to Predict New Views from the World's Imagery", "authors": "John Flynn et al.", "year": 2016, "venue": "CVPR 2016", "url": "https://arxiv.org/abs/1506.06825", "citations": 709, "role_zh": "Quark 第一作者 John Flynn 的早期工作，也是第一篇用深度网络从真实图像做新视角合成的论文。它在目标视角放置一组深度平面，把邻近视角重投影成平面扫描体，由网络预测每个平面的颜色和选择概率，再加权合成。它把代价体放在了目标视角，是 MVS 与 NVS 结合的起点，也是 Quark 在目标视锥中构建 LDM 的思想源头之一。", "priority": "must"}, {"title": "MVSNeRF: Fast Generalizable Radiance Field Reconstruction from Multi-View Stereo", "authors": "Anpei Chen et al.", "year": 2021, "venue": "ICCV 2021", "url": "https://arxiv.org/abs/2103.15595", "citations": 1103, "role_zh": "用 3 张邻近视图构建平面扫描代价体，经 3D CNN 编码成神经编码体，再解码成辐射场并做体渲染。模型能跨场景泛化，在有稠密图像时还能快速微调。它标志着 MVS 代价体成为可泛化 NeRF 的几何骨架。", "priority": "should"}, {"title": "Recurrent MVSNet for High-resolution Multi-view Stereo Depth Inference", "authors": "Yao Yao et al.", "year": 2019, "venue": "CVPR 2019", "url": "https://arxiv.org/abs/1902.10556", "citations": 720, "role_zh": "R-MVSNet 用 GRU 沿深度方向顺序正则化 2D 代价图，取代一次性处理整个代价体的 3D 卷积，大幅降低显存，使高分辨率、大场景的学习式 MVS 成为可能。", "priority": "should"}, {"title": "PatchmatchNet: Learned Multi-View Patchmatch Stereo", "authors": "Fangjinhua Wang et al.", "year": 2021, "venue": "CVPR 2021", "url": "https://arxiv.org/abs/2012.01411", "citations": 478, "role_zh": "把经典 PatchMatch 的初始化、传播与评估改成可学习的多尺度迭代模块（自适应传播与评估），不建完整的 3D 代价体。在 DTU、Tanks and Temples、ETH3D 上有竞争力，比同期最优方法至少快 2.5 倍，显存减半，适合资源受限的设备。", "priority": "should"}, {"title": "MVSplat: Efficient 3D Gaussian Splatting from Sparse Multi-View Images", "authors": "Yuedong Chen et al.", "year": 2024, "venue": "ECCV 2024", "url": "https://arxiv.org/abs/2403.14627", "citations": 628, "role_zh": "用平面扫描代价体里的跨视角特征相似度定位前馈 3D 高斯的中心，只用光度监督联合学习高斯的其余参数。在 RealEstate10K 和 ACID 上达到 22 fps，参数量是 pixelSplat 的 1/10，速度快 2 倍以上。它是“代价体 + 3DGS”路线的代表，Ha et al. 在 Fig. 12 中与它做了定性比较。", "priority": "should"}, {"title": "SimpleRecon: 3D Reconstruction Without 3D Convolutions", "authors": "Mohamed Sayed et al.", "year": 2022, "venue": "ECCV 2022", "url": "https://arxiv.org/abs/2208.14743", "citations": 138, "role_zh": "证明 3D 卷积不是必需的：2D CNN 加上带关键帧与几何元数据的平面扫描特征体，就能得到高质量的多视角深度，再用现成的 TSDF 融合出三维模型，支持在线、实时、低显存重建（ScanNet、7-Scenes）。“逐视角深度 + TSDF 融合”正是 Ha et al. 几何分支的结构。", "priority": "should"}, {"title": "TransMVSNet: Global Context-aware Multi-view Stereo Network with Transformers", "authors": "Yikang Ding et al.", "year": 2022, "venue": "CVPR 2022", "url": "https://arxiv.org/abs/2111.14600", "citations": 310, "role_zh": "第一个把 Transformer 引入 MVS 的工作：Feature Matching Transformer 用帧内自注意力和帧间交叉注意力聚合长程上下文，配合自适应感受野模块和抗歧义的 focal loss，在 DTU、Tanks and Temples、BlendedMVS 上领先。它与 Quark 用注意力做跨视角融合的思路相通。", "priority": "optional"}, {"title": "DeepMVS: Learning Multi-view Stereopsis", "authors": "Po-Han Huang et al.", "year": 2018, "venue": "CVPR 2018", "url": "https://arxiv.org/abs/1804.00650", "citations": 619, "role_zh": "早期的学习式 MVS：为任意数量的无序图像构建平面扫描体并聚合，利用合成数据预训练和 VGG-19 多层特征，在 ETH3D 的弱纹理区域和细结构上优于传统方法。", "priority": "optional"}, {"title": "DepthSplat: Connecting Gaussian Splatting and Depth", "authors": "Haofei Xu et al.", "year": 2025, "venue": "CVPR 2025", "url": "https://arxiv.org/abs/2410.13862", "citations": 314, "role_zh": "把预训练的单目深度特征接入多视角代价体，得到更鲁棒的多视角深度和前馈 3DGS；反过来，又把高斯渲染用作无监督预训练目标来提升深度模型。12 个视角、512×960 分辨率约 0.6 s 完成重建。它代表了“单目先验 + 代价体”的融合趋势。", "priority": "optional"}, {"title": "Deep Stereo Using Adaptive Thin Volume Representation with Uncertainty Awareness", "authors": "Shuo Cheng et al.", "year": 2020, "venue": "CVPR 2020", "url": "https://arxiv.org/abs/1911.12012", "citations": 390, "role_zh": "UCS-Net：由粗到细构建代价体，用上一级概率体的方差（不确定度）为每个像素决定下一级搜索区间的宽度，形成“自适应薄体”（adaptive thin volume），只在最可能的深度附近放少量假设。它与 CasMVSNet 同期，区别在于区间宽度是逐像素、由不确定度决定的；ENeRF 的 ±λσ 采样区间和 Quark 每层只能在自己的视差带内移动，都可以看作这一思想的变体。", "priority": "optional"}, {"title": "MVSAnywhere: Zero-Shot Multi-View Stereo", "authors": "Sergio Izquierdo et al.", "year": 2025, "venue": "CVPR 2025", "url": "https://arxiv.org/abs/2503.22430", "citations": 36, "role_zh": "面向零样本泛化的学习式 MVS（Niantic，与 SimpleRecon 同一团队）：用 Transformer 结合单目线索与多视角代价，并用自适应代价体处理不同场景深度范围差异巨大的问题（深度范围事先未知），在 Robust Multi-View Depth Benchmark 上超过此前的 MVS 和单目基线。对“固定阵列上 K 个最近视角的实时 MVS”来说，它展示了代价体方法如何摆脱预设深度范围，这正是 Quark 近/远平面和 MVSNet 固定深度区间所依赖的前提。", "priority": "optional"}], "prereqs": ["d-mvs", "g-pinhole", "g-depth", "i-psv", "l-cnn"], "relation_to_anchors_zh": "Quark：论文 Sec. 3.2.2 写明，每个视角的更新特征 Δ“既编码了提取的图像特征（因此与平面扫描体有些相似），也编码了比较渲染图与输入图得到的可见性信息”。换言之，Quark 在目标视锥里做的是一次学习式、迭代式的目标视角平面扫描，与本专题的对应关系可以逐项列出。(1) 初始 LDM 为 24 层、36×64，层深度固定在等视差 anchor 上；把编码后的图像特征反投影（Bp）到这些平面，就是 DeepStereo/MVSNet 的 warping 步骤。(2) 由粗到细“升分辨率、降层数”（24 层 36×64 → 6 层 288×512；去掉 layer collapse 会慢 115%），对应 CasMVSNet 的假设数 48→32→8。(3) 每层只能在 ±0.5/L 的视差带内移动，对应 UCS-Net 的自适应薄体。(4) 跨视角聚合用 One-to-many attention 取代 MVSNet、IBRNet 式的均值/方差（退化为均值时 PSNR 从 30.41 降到 29.73）。(5) 近/远平面由 SfM 点逐样本设定，与 MVSNet 在 DTU 上使用固定深度范围（425–935 mm）同理：代价体必须知道在哪一段深度里搜索。论文没有讨论实时系统里这个范围怎样在线获得；ENeRF 的深度范围同样来自 SfM，MVSAnywhere 的自适应代价体则是去掉这一前提的尝试。Quark 的主要速度对标对象 ENeRF，正是“级联代价体 + 深度引导采样”的 MVS 式 NeRF。Quark 实测 ENeRF 在 1024×768 下 205 ms/帧、RFF 上 PSNR 23.71；Quark 自己是 32.2 ms、26.03。不懂代价体，就很难看出 Quark 其实是把 MVS 的“平面扫描 + 由粗到细”与 DeepView 的“渲染后比较再更新”合在了一起。\n\nHa et al.：它没有代价体，而是先用双目得到逐视角深度，再在目标视角融合。这是“先逐视角求深度、后做深度融合”（SimpleRecon 路线）的实时版本。它的 image-based TSDF 可以看作深度域的目标视角平面扫描：沿目标射线逐点采样，投影到 K 个视角，用有符号距离 s_k=z_k−D_k[u_k,v_k] 代替特征方差作为代价，以符号变化处作为表面。截断 τ=0.02 m，权重由 7×7 局部方差决定，射线以 0.8·s 为步长推进，检测到变号后再做 3 步二分。它的最强基线 ENeRF 是代价体方法：在 DyNeRF 上 ENeRF 为 29.51，本文为 31.17；但在 ENeRF-Outdoor 上，ENeRF 以 25.79 对 24.01 胜出。MVSplat 则只出现在 Fig. 12 的定性对比中。学完本专题能看清 Ha et al. 的取舍：用外部的双目深度换来与渲染网络解耦的几何，深度模块可以单独替换成更好的模型；代价是没有 MVS 那种多视角联合推理带来的一致性，只能靠 TSDF 在目标视角事后补救。它的相机阵列固定（DyNeRF 为 18–22 台），对 K 个最近视角做实时 MVS（如 SimpleRecon 或 MVSAnywhere 类方法），是替代“人工选对 + RAFT-Stereo”的自然方向。", "debates_zh": ["参考视角代价体（MVS）与目标视角代价体（NVS）之争：前者得到的几何可以被多个观看者复用，但需要事后融合；后者（DeepStereo、ENeRF、Quark）直接服务于当前视点，但每个视点都要重算，双目头显或多名观众时开销线性增长。", "3D 卷积正则化是否必需：PatchmatchNet 和 SimpleRecon 表明，2D 网络加迭代已经足够；但在弱纹理区域，3D 正则化通常更稳。实时系统应该选择哪一边？", "深度监督还是光度监督：MVSplat 只用光度损失，ENeRF 联合学习深度与辐射场，Quark 也只用 10·L1+LPIPS 的图像损失。没有深度监督时，代价体学到的几何在多大程度上是“真几何”，还是只是“对渲染有用的几何”？", "代价体会不会被几何基础模型完全取代：MapAnything（可以把内参和位姿作为输入）和 VGGT（连标定都不需要）不用显式代价体，也能在 DTU 等基准上给出有竞争力的多视角深度，但分辨率和延迟都不满足实时渲染；显式代价体的可解释性和可预算性是否仍然不可替代？", "DTU、Tanks and Temples 这类静态物体和场景基准，能否代表 telepresence 的真实需求（近距离的人、动态、头发和皮肤高光）？"], "open_questions_zh": ["1080p、8 视角、10 ms 以内的代价体构建与聚合：Quark 的办法是在低分辨率上求几何、用 IBR 补纹理。直接在高分辨率上求几何有没有更好的方案？", "遮挡边界的多峰深度怎样表示：单一深度、多层（LDM）还是概率分布？怎样以低成本传给渲染器？", "时间维度：固定阵列里静态背景的代价体能否在帧间复用，只对变化区域做增量更新？", "反光、透明、头发等光度一致性失效的区域，代价应当怎样设计，或者怎样让网络知道“这里不该信代价体”？", "输入视角的选择：Quark 把学习式视角选择列为未来工作；Ha et al. 的 K 集合一切换，TSDF 深度就会跳变。代价体方法怎样做到对视角集合平滑？", "参考视角代价体与目标视角代价体怎样混合，既服务于左右眼两个视点，又避免重复计算？"], "resources": [{"title": "Multi-View Stereo: A Tutorial（Furukawa & Hernández, 2015）", "url": "https://www.carlos-hernandez.org/papers/fnt_mvs_2015.pdf", "type": "tutorial", "note_zh": "系统讲解经典 MVS：光度一致性代价、平面扫描、深度图融合、PatchMatch 类方法与评测基准。读 MVSNet 之前先读它的前几章，会明白学习式 MVS 替换的是哪一步。"}, {"title": "TUM Multiple View Geometry（Daniel Cremers）", "url": "https://cvg.cit.tum.de/teaching/online/mvg", "type": "course", "note_zh": "提供课程录像和讲义，系统覆盖多视角几何中的对极几何、单应和重建，是理解可微单应和平面扫描的数学基础。"}, {"title": "MVSNet / R-MVSNet 官方代码", "url": "https://github.com/YoYo000/MVSNet", "type": "code", "note_zh": "官方实现，同一仓库也包含 R-MVSNet。建议亲手改变深度假设数 D 和输入分辨率，观察显存变化，直观体会代价体的立方增长。"}, {"title": "ENeRF 项目主页", "url": "https://zju3dv.github.io/enerf/", "type": "code", "note_zh": "项目页附有代码和视频，可以看到“级联代价体估计粗深度 → 表面附近少量采样 → 体渲染”的完整实时流程。它是两篇锚点论文共同的基线。"}]}, {"id": "a-geo-fm", "title_zh": "前馈三维几何基础模型", "title_en": "Feed-forward 3D geometry foundation models", "overview_zh": "传统三维重建是一条很长的流水线：特征匹配 → SfM 求相机位姿与稀疏点（见 g-sfm，典型工具是 COLMAP）→ MVS 求稠密深度 → 融合。每一步都需要调参，都依赖足够的纹理和视角重叠。视角少（2–8 张）时经常直接失败，整个过程也是离线的。两篇锚点论文都默认这条流水线已经在幕后跑完：Ha et al. 的相机位姿“用 COLMAP 计算一次”（Sec. 3）；Quark 训练时的近/远平面由 SfM 点的深度分布逐样本设定。前馈三维几何基础模型（geometry foundation models）的目标是用一个在海量三维数据上训练的大 Transformer，一次前向就从图像直接得到相机、深度和点云。\n\n转折点是 DUSt3R（CVPR 2024）。它提出 pointmap 表示：对输入图像的每个像素，直接回归它在第一张图相机坐标系下的 3D 坐标。给定一对图像，Siamese ViT-L 编码器、两个互相做交叉注意力的 ViT-B 解码器和 DPT 头，输出两张位于同一坐标系的点图及其置信度。焦距、相对位姿和像素匹配都能从点图反推出来（用 Weiszfeld 算法求焦距，用 Procrustes 或 PnP 求位姿），因此单目深度、双目重建和位姿估计被统一成了一个回归问题。它用 CroCo（跨视角补全）预训练初始化，在 8 个数据集的 850 万对图像上训练；损失对尺度做了归一化，并让网络自报置信度。它的局限在于本质上是成对的：N 张图需要先对所有图像对推理，再做全局对齐优化。CUT3R 论文实测 DUSt3R-GA 在 A100 上只有 0.76 FPS。MASt3R（ECCV 2024）加入了稠密局部特征头和快速互最近邻匹配，使它成为强力的匹配器。\n\n2025 年的主线是“一次前向处理多视角”。Fast3R 一次可处理上千张图。VGGT（CVPR 2025 最佳论文）把 DINOv2 按 14×14 分块，经过 24 组“帧内注意力 + 全局注意力”交替层（约 12 亿参数），一次输出每张图的相机参数、深度图、点图和跟踪特征；在 H100 上以 518×336 输入处理 10 帧约 0.14 s（论文只统计特征骨干的时间，并使用 FlashAttention v3）。它发现用“深度 + 相机”反投影得到的点，比直接预测的点图更准，并证明其特征能提升前馈新视角合成。随后出现三个改进方向。π3（ICLR 2026）去掉“第一帧是参考系”的偏置，对输入顺序置换等变，预测尺度不变的局部点图和仿射不变的相机位姿。MapAnything（3DV 2026）和 Pow3R 允许把已知的内参、位姿、深度作为可选输入，MapAnything 还用“射线方向 + 射线深度 + 位姿 + 一个全局公制尺度”的因子化输出直接给出公制几何。Depth Anything 3（ICLR 2026 Oral）证明，一个朴素的 DINOv2 Transformer 加单一的“深度 + 射线”目标就已足够；其技术报告称，相机位姿精度比 VGGT 平均高 44.3%，几何精度高 25.1%。\n\n第二条主线是流式、在线的几何重建。Spann3R 在 DUSt3R 上加了外部空间记忆，逐帧把点图写入全局坐标系。CUT3R（CVPR 2025）维护 768 个持久的状态 token，每来一帧就读一次、写一次状态；在 A100、512×144 下约 16.6 FPS，输出公制点图，还能用射线图（raymap）查询没有拍到的虚拟视角。StreamVGGT 把 VGGT 改造成带 KV cache 的因果 Transformer，并从 VGGT 蒸馏训练。TTT3R 把状态更新重新解释为 test-time training，按对齐置信度给出闭式学习率，以 20 FPS、6 GB 显存处理上千帧。\n\n截至 2026 年 9 月，在许多离线和准实时应用中，DA3、VGGT 系列、MapAnything、π3 已开始取代“COLMAP + MVS”，成为默认的几何前端。但对 telepresence 来说还有三道鸿沟。(1) 分辨率与延迟：通用模型的输入约为 518 像素，而 Quark 在 A100 上以 1080p 完成整帧重建加渲染只需约 33 ms。(2) 输入结构：流式模型几乎都假设输入来自单个移动相机，而 telepresence 的输入是“N 台固定、已标定的相机 × 时间”。(3) 时间一致性：逐时刻推理同样会闪烁。把基础模型的先验蒸馏进阵列专用的小模型（如 2026 年的 Tele360：4–6 台未标定 2K 相机，在 RTX 5090 上超过 25 FPS），是目前最现实的落地路径。", "key_ideas": [{"name_zh": "Pointmap：把相机、深度和匹配统一为“每个像素一个 3D 点”", "explain_zh": "直觉：传统流程先求相机，再三角化出点；DUSt3R 反过来，直接让网络输出每个像素的 3D 坐标，相机参数则从点里反推。两张图的点图都表达在第一台相机的坐标系下，于是：点图 1 的每个点除以 z 再乘焦距应落回原像素，由此可求焦距；两张点图之间的刚体对齐就是相对位姿；在 3D 空间里最近的点就是匹配。这种表示不需要预先知道内参，对单目（两张相同的图）和双目统一适用。代价是输出只有相对尺度，而且要求网络隐式地学会投影几何。"}, {"name_zh": "置信度感知回归与尺度归一化", "explain_zh": "单看图像无法区分真实场景和 1:10 的模型，所以 DUSt3R、VGGT 在训练时先把预测和真值分别除以点到原点的平均距离，只监督形状、不监督绝对大小。同时，网络为每个像素输出置信度 C（经 1+exp 保证大于 1），损失为 C·误差 − α·log C：难像素（天空、反光、遮挡边缘）可以把 C 调低来减少惩罚，但 −α log C 阻止它无限制地调低。结果是置信度与误差成反比，可以直接作为下游融合的权重。输出没有公制尺度这一点，对 Ha et al. 的 TSDF（τ=0.02 m）是个陷阱：必须用已知的相机基线恢复尺度，或改用 MapAnything（全局尺度 m）、DA3-Metric 这类公制模型。DA3-Metric 训练时把真值深度乘以 f_c/f（f 为相机焦距，规范焦距 f_c=300），即在“规范焦距”空间里学习深度，使用时再乘以 f/300 还原，以消除不同焦距带来的尺度歧义。"}, {"name_zh": "交替注意力：帧内加全局", "explain_zh": "VGGT 把每张图切成 14×14 的块；一张 518×336 的图约有 37×24=888 个 token，另外还有少量相机 token 和寄存器 token。它交替使用两种注意力：帧内注意力（每张图的 token 只看自己）和全局注意力（所有图的所有 token 互相看），共 24 组，第一帧用一组专门的 token 标记为参考系。全局注意力的代价与 (N·T)² 成正比。8 张 518×336 的图约 7104 个 token，每头每层的注意力矩阵约 5.0×10⁷ 个元素；8 张 1080p 的图约 8.4 万个 token，矩阵约 7.1×10⁹ 个元素，是前者的约 140 倍。π3 去掉了专门的参考帧 token，改为对输入顺序置换等变：更换参考帧时，DTU 精度的标准差为 0.003，VGGT 为 0.033。DA3 则把 Transformer 分成两段：前 L_s 层只做帧内注意力，后 L_g 层交替做跨视角注意力和帧内注意力，取 L_s:L_g=2:1，也就是前三分之二的层完全不看其他视角（见 l-attention）。2026 年的 VGGT-Ω 进一步用 register attention 把帧间信息交换限制在少量寄存器 token 上，部分替代全局注意力，训练显存降到 VGGT 的约 30%。它和 Quark 的 One-to-many attention 解决的是同一个问题：跨视角注意力的平方代价。"}, {"name_zh": "因子化输出：深度、射线、位姿和尺度", "explain_zh": "直接回归世界坐标下的点图，会把“相机在哪、朝哪看”和“物体有多远”混在一起。VGGT 的实验发现，用“深度 + 相机”反投影得到的点比直接预测的点图更准。DA3 把目标简化为每个像素的射线（起点 t、方向 d）加沿射线的深度 D，点为 P=t+D·d；MapAnything 进一步拆成射线方向、射线深度、位姿和一个全局公制尺度 m。这种分解与针孔相机模型（g-pinhole）一一对应：射线由内外参决定，深度由场景决定。对已标定的阵列来说，射线可以直接由标定算出，网络只需要预测深度。"}, {"name_zh": "先验注入：把已知标定当作输入，而不是重新预测", "explain_zh": "Pow3R 和 MapAnything 在训练时随机给网络一部分辅助输入（内参、相对位姿、稠密或稀疏深度），让同一个模型在测试时有什么先验就用什么先验。MapAnything 用 DINOv2 ViT-G 加 16 层交替注意力，把射线方向和深度用浅层卷积编码到与图像 token 相同的维度后相加。效果很明显：在 50 视角的消融（ETH3D、ScanNet++ v2、TartanAirV2 平均）中，只给图像时点图相对误差为 0.28、公制尺度相对误差为 0.16、相对误差在 1.03% 以内的内点比例为 40.7%；再给内参和公制位姿后，三者分别变为 0.07、0.05、57.8%。Quark 和 Ha et al. 都假设相机已精确标定；对这类固定阵列，把标定当作输入，比让模型把它当作“位姿未知”重新估计更准，也能直接得到公制尺度。"}, {"name_zh": "流式记忆：状态、KV cache 与 test-time training", "explain_zh": "要处理视频流，不能每来一帧就把所有历史帧重新跑一遍。Spann3R 维护一个外部空间记忆，新帧通过查询记忆直接输出全局坐标系下的点图。CUT3R 维护 768 个维度为 768 的状态 token：每一帧的图像 token 与状态通过交叉注意力双向交互，一边读出本帧的点图与位姿，一边写回更新后的状态。给它一张 6 通道射线图（每个像素射线的起点和方向），还能在不更新状态的前提下读出一个虚拟视角的点图。StreamVGGT 采用类似大语言模型的因果注意力，把历史帧的 K/V 缓存起来当作隐式记忆。TTT3R 把状态更新看成在线学习，用状态与新观测的对齐置信度给出闭式学习率，从而改善超长序列上的泛化。"}, {"name_zh": "规模化训练、合成教师与蒸馏", "explain_zh": "这类模型的能力主要来自数据规模和预训练骨干。DUSt3R 用 8 个数据集的 850 万对图像；VGGT 用 17 个数据集，在 64 张 A100 上训练 9 天；CUT3R 用 32 个数据集。DA3 先用纯合成数据训练教师模型，再用教师为真实数据生成伪深度（用 RANSAC 最小二乘与稀疏真值对齐）来训练学生。StreamVGGT 从双向 VGGT 蒸馏出因果模型。面向产品时，路线通常是先用大模型当教师，再蒸馏出任务专用的实时小模型，例如 Tele360 在 telepresence 中的做法。"}, {"name_zh": "读懂几何基础模型的评测：尺度对齐是最大的陷阱", "explain_zh": "深度常用 AbsRel（平均相对误差）和 δ<1.25（预测与真值之比在 1.25 倍以内的像素比例）；相机常用 RRA/RTA（图像对之间相对旋转/平移的角度误差小于阈值的比例）及其 AUC@30，视频用 ATE（与真值轨迹对齐后的绝对位置误差）；点云用 accuracy/completeness（与 MVS 相同，见 a-learned-mvs）。最容易被忽略的是“对齐方式”：多数模型的输出没有公制尺度，评测前要先按帧或按序列求一个尺度（有时还有平移），把预测对齐到真值后再算误差，所以同一方法在“per-sequence scale”和“metric scale”两种设定下数字可以差很多。数值例：CUT3R 在 KITTI 视频深度上，按序列对齐尺度时 AbsRel 为 0.118，直接使用公制输出为 0.122；DUSt3R-GA 没有公制输出，根本无法报告后一种设定。对 telepresence，公制设定更接近真实需求，因为 Ha et al. 的 TSDF 截断 τ=0.02 m 等参数都是公制的。"}], "equations": [{"tex": "X^{n,m} = P_m\\, P_n^{-1}\\, h\\big(X^{n}\\big), \\qquad \\ell_{\\mathrm{regr}}(v,i) = \\Big\\lVert \\tfrac{1}{z}\\, X_i^{v,1} - \\tfrac{1}{\\bar{z}}\\, \\bar{X}_i^{v,1} \\Big\\rVert", "explain_zh": "DUSt3R 的 pointmap 定义与回归误差。符号：X^n∈R^{H×W×3} 为图像 n 的每个像素在其自身相机坐标系下的 3D 点；h(·) 把 3D 点变为齐次坐标；P_n、P_m 为相机 n、m 的世界到相机 4×4 位姿矩阵（见 f-linalg）；X^{n,m} 即图像 n 的点在相机 m 坐标系下的表示。DUSt3R 对两张输入图 v∈{1,2} 都预测 X^{v,1}，即统一到相机 1 的坐标系。在 ℓ_regr 中，X_i^{v,1} 为网络对第 i 个像素预测的点，\\bar X 为真值；z 和 \\bar z 分别是预测点和真值点到原点的平均距离，作为归一化因子。直觉：只要求形状正确，不要求绝对大小正确。数值例：若真值场景点平均距相机 2.5 m，归一化后平均距离变为 1，所以网络输出没有公制单位。把这样的输出直接交给 Ha et al. 的 TSDF（截断 τ=0.02 m 是公制值），τ 的含义就错了。对已标定阵列，可以用已知的相机间距（如两台相机中心相距 0.3 m）求出一个尺度 s，把整组点图乘回公制；也可以直接使用输出公制尺度的模型。"}, {"tex": "\\mathcal{L}_{\\mathrm{conf}} = \\sum_{v \\in \\{1,2\\}} \\sum_{i \\in \\mathcal{D}^{v}} C_i^{v,1}\\, \\ell_{\\mathrm{regr}}(v,i) - \\alpha \\log C_i^{v,1}, \\qquad C_i^{v,1} = 1 + \\exp\\big(\\tilde{C}_i^{v,1}\\big)", "explain_zh": "置信度感知损失。符号：C_i^{v,1} 为网络对像素 i 预测的置信度，\\tilde C 为未激活的输出，1+exp 保证 C 大于 1；𝒟^v 为图像 v 中有真值的像素集合；α 为正则系数；ℓ_regr 即上一式的回归误差。直觉：让网络对难像素承认不确定，但不允许它对所有像素都说“我不确定”。对单个像素，令 ∂/∂C=ℓ−α/C=0，得到最优置信度 C*=α/ℓ，即置信度与误差成反比。数值例（α=0.2 只是示例值）：误差 ℓ=0.05 时 C*=4；ℓ=0.1 时 C*=2；ℓ≥0.2 时 C* 本应不大于 1，但受 C>1 的约束被压到接近 1，最难的像素统一得到最低权重。VGGT 的深度损失采用同样的思想（不确定度乘以误差，再减去 α log 不确定度）。这张置信图正好可以取代 Ha et al. TSDF 中用 7×7 局部方差启发式计算的融合权重 ω_k。"}, {"tex": "\\mathbf{P}(u,v) = \\mathbf{t} + D(u,v)\\, \\mathbf{d}(u,v), \\qquad \\mathbf{d}(u,v) = R\\, K^{-1} [u,\\ v,\\ 1]^{\\top}", "explain_zh": "DA3 的 depth-ray 表示，以及它与针孔模型的对应关系。符号：(u,v) 为像素坐标；K 为内参；R 为相机到世界的旋转；t∈R³ 为该像素射线的起点，即相机光心在世界坐标系中的位置；d(u,v) 为世界坐标系中的射线方向，DA3 刻意不把它归一化，这样 d 的 z 分量（在相机系中）为 1，D(u,v) 就是通常意义下的 z 深度；P 为世界坐标下的 3D 点。若外参以世界到相机的形式给出（x_cam = R_w2c·x_world + t_w2c），则 R = R_w2cᵀ，t = −R_w2cᵀ·t_w2c。DA3 把逐像素的 (t, d) 存成 6 通道射线图，推理时可以从射线图反解出相机（光心取所有射线起点的平均）。直觉：把几何拆成“相机给出的射线”和“场景给出的距离”两部分。数值例：主点为 (960,540) 时，像素 (960,540) 的 K⁻¹[u,v,1]ᵀ=(0,0,1)ᵀ，射线就是光轴；若 R=I、相机光心 t=(0.3,0,0) m、D=1.2 m，则 P=(0.3,0,1.2) m。对已标定阵列，射线图由标定精确给出，网络只需预测 D，这正是 MapAnything 注入标定后误差大幅下降的原因。同一种“按射线描述几何”的语言也出现在 CUT3R 用 raymap 查询虚拟视角、Quark 沿每条目标射线放置 LDM 层（见 l-encoding）的做法里。"}], "evolution": [{"year": 2021, "milestone_zh": "DPT 用 ViT 做稠密预测，它的多尺度重组解码头后来成为 DUSt3R、VGGT、DA3 的标准输出头"}, {"year": 2022, "milestone_zh": "CroCo 提出跨视角补全的自监督预训练，成为 DUSt3R 的初始化来源"}, {"year": 2024, "milestone_zh": "DUSt3R（CVPR 2024）提出免标定的 pointmap 回归；MASt3R（ECCV 2024）加入稠密匹配头；Spann3R 用空间记忆做增量重建；MonST3R 把 pointmap 扩展到动态场景"}, {"year": 2025, "milestone_zh": "Fast3R 与 VGGT（CVPR 2025 最佳论文）实现单次前向多视角重建；CUT3R（CVPR 2025）用持久状态做流式公制重建；Pow3R 支持在测试时注入相机与深度先验"}, {"year": 2025, "milestone_zh": "π3（7 月）去掉参考帧；StreamVGGT（7 月）用因果注意力加 KV cache；MapAnything（9 月）给出公制因子化输出并支持先验注入；TTT3R（9 月）把状态更新视为 test-time training；Depth Anything 3（11 月）用极简架构加深度射线目标超越 VGGT"}, {"year": 2026, "milestone_zh": "VGGT-Ω（CVPR 2026 Oral，arXiv 2605.15195）显示精度随模型容量和数据规模可预测地提升，训练显存约为 VGGT 的 30%；Tele360 把几何基础模型的先验蒸馏进超过 25 FPS 的 2K 人体 telepresence 系统，基础模型开始进入实时临场链路"}], "papers": [{"title": "DUSt3R: Geometric 3D Vision Made Easy", "authors": "Shuzhe Wang et al.", "year": 2024, "venue": "CVPR 2024", "url": "https://arxiv.org/abs/2312.14132", "citations": 1904, "role_zh": "提出 pointmap 回归范式：对一对未标定的图像，直接回归两张图在同一坐标系（第一张图的相机坐标系）下的逐像素 3D 点和置信度；焦距、相对位姿和匹配都能从点图反推；多于两张图时用全局对齐优化。架构为 ViT-L 编码器、交叉注意力 ViT-B 解码器和 DPT 头，用 CroCo v2 初始化，在 8 个数据集的 850 万对图像上训练。它是几何基础模型的起点。", "priority": "must"}, {"title": "VGGT: Visual Geometry Grounded Transformer", "authors": "Jianyuan Wang et al.", "year": 2025, "venue": "CVPR 2025 (Best Paper)", "url": "https://arxiv.org/abs/2503.11651", "citations": 1807, "role_zh": "DINOv2 分块后经过 24 组帧内/全局交替注意力（约 12 亿参数），一次前向输出每张图的相机（四元数、平移、视场角）、深度、点图和跟踪特征；H100 上 518×336 输入 10 帧约 0.14 s，100 帧约 3.12 s（只计特征骨干）。训练用 17 个数据集，64 张 A100 训练 9 天。它发现用“深度 + 相机”反投影比直接预测点图更准，并证明其特征可以提升前馈 NVS。", "priority": "must"}, {"title": "Continuous 3D Perception Model with Persistent State", "authors": "Qianqian Wang et al.", "year": 2025, "venue": "CVPR 2025", "url": "https://arxiv.org/abs/2501.12387", "citations": 595, "role_zh": "CUT3R 把几何基础模型变成在线的流式系统：768 个持久状态 token 与每帧图像 token 双向交互（读状态、写状态），逐帧输出公制点图和位姿；可以用 6 通道 raymap 查询未拍到的虚拟视角。在 A100、512×144 下约 16.6 FPS，DUSt3R-GA 只有 0.76 FPS。它与 Ha et al. 面对的“目标视角深度”和“时间融合”两个问题直接对应。", "priority": "must"}, {"title": "Grounding Image Matching in 3D with MASt3R", "authors": "Vincent Leroy et al.", "year": 2024, "venue": "ECCV 2024", "url": "https://arxiv.org/abs/2406.09756", "citations": 1171, "role_zh": "在 DUSt3R 上增加输出稠密局部特征的匹配头和匹配损失，并提出带理论保证的快速互最近邻匹配，把 pointmap 模型变成强力的图像匹配器；在 Map-free 定位任务上，VCRE AUC 绝对提升 30%。", "priority": "should"}, {"title": "Depth Anything 3: Recovering the Visual Space from Any Views", "authors": "Haotong Lin et al.", "year": 2025, "venue": "ICLR 2026 Oral（arXiv 2025-11）", "url": "https://arxiv.org/abs/2511.10647", "citations": 675, "role_zh": "极简路线：一个朴素的 DINOv2 Transformer（前三分之二的层只做帧内注意力，后三分之一交替做跨视角与帧内注意力）加单一的“深度 + 射线”目标，配合合成数据教师—学生训练。技术报告称相机位姿精度比 VGGT 平均高 44.3%、几何精度高 25.1%（ICLR 版本为 35.7% 和 23.6%），单目深度也优于 DA2。第一作者 Haotong Lin 同时是 ENeRF 的第一作者。", "priority": "should"}, {"title": "MapAnything: Universal Feed-Forward Metric 3D Reconstruction", "authors": "Nikhil Keetha et al.", "year": 2025, "venue": "3DV 2026（arXiv 2025-09）", "url": "https://arxiv.org/abs/2509.13414", "citations": 342, "role_zh": "通用公制重建模型：可以选择性输入内参、位姿、深度，输出因子化的几何（射线方向、射线深度、位姿和全局公制尺度 m）。架构为 DINOv2 ViT-G 加 16 层交替注意力，在 13 个数据集上训练。50 视角消融中，给定内参与公制位姿后，点图相对误差从 0.28 降到 0.07，公制尺度误差从 0.16 降到 0.05。对已标定的 telepresence 阵列最直接可用。", "priority": "should"}, {"title": "π^3: Permutation-Equivariant Visual Geometry Learning", "authors": "Yifan Wang et al.", "year": 2025, "venue": "ICLR 2026（arXiv 2025-07）", "url": "https://arxiv.org/abs/2507.13347", "citations": 295, "role_zh": "去掉参考帧：不使用区分帧的位置嵌入或专门 token，网络对输入顺序置换等变，预测尺度不变的局部点图和仿射不变的相机位姿。更换参考帧时 DTU 精度的标准差为 0.003（VGGT 为 0.033）；在 KITTI 上 57.4 FPS（A800；VGGT 为 43.2）。对没有天然“第一台相机”的环形阵列更合适。", "priority": "should"}, {"title": "3D Reconstruction with Spatial Memory", "authors": "Hengyi Wang, Lourdes Agapito", "year": 2025, "venue": "3DV 2025", "url": "https://arxiv.org/abs/2408.16061", "citations": 292, "role_zh": "Spann3R 在 DUSt3R 上加入外部空间记忆，逐帧查询记忆并直接在全局坐标系中输出点图，省去全局对齐优化，可以对有序图像做实时增量重建（CUT3R 实测 224×224 下 13.55 FPS）。它是流式几何的第一个代表。", "priority": "should"}, {"title": "Fast3R: Towards 3D Reconstruction of 1000+ Images in One Forward Pass", "authors": "Jianing Yang et al.", "year": 2025, "venue": "CVPR 2025", "url": "https://arxiv.org/abs/2501.13928", "citations": 413, "role_zh": "把 DUSt3R 推广为单次前向并行处理 N 张（可达 1000 张以上）图像，绕开成对推理和迭代对齐，速度和误差累积都显著改善。与 VGGT 一起确立了“多视角单次前向”的方向。", "priority": "optional"}, {"title": "Streaming 4D Visual Geometry Transformer", "authors": "Dong Zhuo et al.", "year": 2025, "venue": "ICLR 2026（arXiv 2025-07；会议版题为 Streaming Visual Geometry Transformer）", "url": "https://arxiv.org/abs/2507.11539", "citations": 159, "role_zh": "StreamVGGT 借鉴大语言模型的因果设计：用时间因果注意力，把历史帧的 K/V 缓存起来当作隐式记忆；从双向 VGGT 蒸馏训练，可直接使用 FlashAttention 等 LLM 推理算子，实现低延迟的流式 4D 重建。", "priority": "optional"}, {"title": "MonST3R: A Simple Approach for Estimating Geometry in the Presence of Motion", "authors": "Junyi Zhang et al.", "year": 2025, "venue": "ICLR 2025", "url": "https://arxiv.org/abs/2410.03825", "citations": 468, "role_zh": "把 pointmap 扩展为“每个时刻一张点图”，在有限的动态、带位姿数据上微调 DUSt3R，使它能处理运动场景，并用于视频深度和相机位姿估计。它是动态几何基础模型的起点。", "priority": "optional"}, {"title": "Vision Transformers for Dense Prediction", "authors": "René Ranftl et al.", "year": 2021, "venue": "ICCV 2021", "url": "https://arxiv.org/abs/2103.13413", "citations": 3102, "role_zh": "DPT 用 ViT 作为稠密预测骨干，把不同层的 token 重组成多分辨率特征图，再由卷积解码器融合；单目深度相对提升最高达 28%。DUSt3R、VGGT、DA3 等模型的深度和点图输出头都沿用 DPT 头，读懂它才能看懂这些模型的输出端。", "priority": "optional"}, {"title": "Pow3R: Empowering Unconstrained 3D Reconstruction with Camera and Scene Priors", "authors": "Wonbong Jang et al.", "year": 2025, "venue": "CVPR 2025", "url": "https://arxiv.org/abs/2503.17316", "citations": 74, "role_zh": "在 DUSt3R 范式上加入轻量的条件输入，使同一个网络在测试时可以接受任意组合的辅助信息（内参、相对位姿、稠密或稀疏深度）。训练时每次迭代随机给出一部分模态，因此测试时“有什么先验就用什么”，还能在原生分辨率下推理、做点云补全。它是 MapAnything 之前“把已知标定当作输入”这一思路的代表，对固定、已标定的 telepresence 阵列最有参考价值。", "priority": "optional"}], "prereqs": ["g-sfm", "l-attention", "d-mono", "g-pinhole", "f-linalg"], "relation_to_anchors_zh": "两篇锚点论文都把几何基础模型想要替代的经典前端当作已知前提。Ha et al. 的相机位姿“用 COLMAP 计算一次”（Sec. 3），附录 A.7 却写“使用数据集提供的相机参数”，前后不一致；深度则来自人工挑选图像对上的 RAFT-Stereo。Quark 训练时用 SfM（COLMAP）点的深度分布逐样本设定近/远平面，并要求精确标定，标定误差会在其 IBR 融合中产生错误的硬边。不懂 SfM 和几何基础模型，就看不出这些“前提”在实时系统中其实是未解决的问题。几何基础模型对两篇论文的具体意义如下。\n\n(1) 对 Ha et al.：可以用“已标定的多视角推理”替换“人工选对 + RAFT-Stereo”。MapAnything 类模型接受已知的内参和位姿，一次输出 K 个视角互相一致的公制深度；公制尺度正是其 TSDF（τ=0.02 m）所必需的，而 DUSt3R/VGGT 的输出经过尺度归一化，必须先用已知基线恢复尺度。这类模型输出的逐像素置信度，可以直接替代 7×7 局部方差启发式得到的权重 ω_k。CUT3R 用 raymap 查询虚拟视角得到点图，与 Ha et al. 用 TSDF raymarch 得到目标视角深度，目的相同。流式模型的状态记忆，可以替代掩码下限为 0.6（每帧至少取 60% 新深度）的短记忆滤波。\n\n(2) 对 Quark：基础模型可以在线提供近/远平面和初始深度（论文只讨论了由 SfM 点给定的离线设定），也可以提供更强的多视角特征，VGGT 论文已显示其特征能提升前馈 NVS。在架构上，两者都在对付跨视角注意力的代价。VGGT 的全局注意力对 N 个视角的全部 token 做自注意力，代价与 (N·T)² 成正比。Quark 则刻意放弃 NerFormer 式 O(M²) 的跨视角自注意力，改用 One-to-many attention：每个 LDM 位置只有一个 query，并把 K/V 投影折叠进 Q 和输出投影。在 4 个注意力头的配置下，输入从 4 张增加到 64 张时，它的开销只增加 1.9 倍，标准注意力则增加 13.0 倍。\n\n(3) 预算差距：VGGT 在 H100 上以 518×336 处理 10 帧约 0.14 s（只计特征骨干）；CUT3R 在 A100、512×144 下约 16.6 FPS；而 Quark 在 A100 上以约 30 fps 输出 1080p（表 1 中 1024×768 为 32.2 ms、2048×1536 为 33.0 ms，均含重建和渲染）。按 14×14 分块，8 路 1080p 输入约有 8.4 万个 token，全局注意力矩阵每头每层约 7×10⁹ 个元素，约为 518×336 输入时的 140 倍。所以目前的几何基础模型只能充当“慢前端”（标定、近/远平面、关键帧深度），还不能直接进入每帧约 33 ms 的渲染环路。\n\n(4) 共同短板：两篇锚点论文和逐时刻推理的基础模型都没有长时记忆。流式几何模型（CUT3R、StreamVGGT、TTT3R）虽然有记忆，但都假设输入来自单个移动相机，与“N 台固定相机 × 时间”的阵列结构不同。怎样设计一个以标定为条件、为每台相机维护记忆、能直接输出目标视角深度的模型，是两个方向交叉处的空白。", "debates_zh": ["显式优化（BA）是否还有必要：基础模型在高分辨率、大场景下的精度是否仍不如 COLMAP 加光束法平差？许多系统采用“基础模型初始化 + BA 精修”，这说明两者目前仍是互补关系。", "三维归纳偏置之争：VGGT 用相机 token 和固定参考帧，π3 主张置换等变、不要参考帧，DA3 主张极简架构加单一目标。另一个问题是：pointmap 与“深度 + 射线”哪种输出更好？VGGT 自己的实验显示，“深度 + 相机”比直接预测点图更准。", "已知标定时还要不要“预测”标定：MapAnything 显示注入标定能大幅降低误差，但许多免标定系统（Tele360、LiveStre4m）宁可牺牲一部分质量来换取部署上的便利。固定阵列应该怎么选？", "基准的可比性：训练集普遍覆盖 ScanNet++、DL3DV 等数据，与评测集存在重叠风险；同一方法的技术报告和会议版本数字也不同（DA3 为 44.3% 对 35.7%）。跨论文比较时要格外小心。VGGT-Ω 的作者在 2026 年 8 月复查训练数据时发现可能与评测集存在重叠，无法排除对原 checkpoint 的影响，于是用重新核查过的数据重训，并声明以新 checkpoint 作为后续 benchmark 比较的基准（见其 GitHub 仓库的 reproduction 说明）。", "Scaling 与效率：VGGT-Ω 等工作显示，质量会随模型和数据规模可预测地提升；telepresence 却要求 10–30 ms 的几何预算。继续扩大模型与蒸馏小模型两条路线怎样分工？"], "open_questions_zh": ["面向“N 台固定、已标定、同步、朝内的相机 × 时间”的流式几何模型：以标定为条件，为每台相机维护记忆，在视角和时间上都保持因果，同时取代 RAFT-Stereo 和手工的 TSDF 时间滤波。", "分辨率与延迟：通用模型输入约 518 像素、10 个视角约 0.14 s，而实时临场留给几何的预算大约只有 10 ms。能否利用固定阵列中静态背景 token 可以跨帧复用的特点，只对变化区域做稀疏更新？", "毫秒级的目标视角深度查询：在缓存的基础模型 token 或 CUT3R 式的场景状态上，设计一个前馈的 raymap 查询头，取代 Ha et al. 的 TSDF raymarch 或 Quark 的 LDM 迭代。", "视角与时间联合一致性的评测：现有几何基准只评单帧或单相机视频，需要面向 telepresence 的长序列多视角数据集，以及深度边缘抖动、新暴露区域的稳定性等指标。", "近距离人体与细结构：头发、手指、眼镜、皮肤高光在场景级训练数据中很少；还需要把置信度校准后传给融合网络，让它在不可靠区域退回纯图像混合。", "在线标定漂移与同步误差：能否从跨视角注意力中逐帧前馈地估计小幅外参漂移和亚帧级的时间偏移，这决定了消费级或手机阵列的 telepresence 是否可行。"], "resources": [{"title": "VGGT 官方代码", "url": "https://github.com/facebookresearch/vggt", "type": "code", "note_zh": "官方代码和预训练权重。建议用手机围绕一个人拍 8 张照片跑一遍，把相机、深度和点云可视化出来，再故意打乱输入顺序、更换第一帧，观察结果的变化。"}, {"title": "DUSt3R 官方代码", "url": "https://github.com/naver/dust3r", "type": "code", "note_zh": "官方实现，包含成对推理与全局对齐。读论文第 3 节时对照代码里的归一化与置信度损失，能快速理解 pointmap 范式。"}, {"title": "CUT3R 项目主页", "url": "https://cut3r.github.io/", "type": "code", "note_zh": "项目页附有代码和演示视频，重点看状态更新和用 raymap 查询虚拟视角这两部分，它们分别对应 telepresence 中的时间记忆和目标视角深度。"}, {"title": "CMU 16-825 Learning for 3D Vision", "url": "https://learning3d.github.io/", "type": "course", "note_zh": "Shubham Tulsiani 的课程，覆盖三维表示、可微渲染、单视角和多视角三维推理、神经渲染，是从传统多视角几何过渡到学习式几何模型的系统课程。"}]}, {"id": "a-nerf-fast", "title_zh": "NeRF 的加速与抗锯齿", "title_en": "Fast & anti-aliased NeRFs", "overview_zh": "原版 NeRF 把整个场景存进一个 8 层、每层 256 通道的 MLP。渲染一个像素要沿射线采样：粗网络查询 64 个点，细网络再查询 64+128 个点，所以每条射线约 256 次 MLP 前向。1920×1080 的一帧约有 207 万条射线，合计约 5×10^8 次 MLP 查询；单个场景在一张 V100 上要优化约 1–2 天。另一个问题是走样（aliasing）。按采样定理，采样频率低于信号最高频率的两倍时，高频细节会“伪装”成低频图案，表现为锯齿、摩尔纹或闪烁。NeRF 每个像素只发一条无限细的射线，相当于只在像素中心取一个点样本、不做任何预滤波，所以训练图和测试图的分辨率或相机距离不同时，结果会出现锯齿，或者整体过度模糊（Mip-NeRF 摘要）。“慢”和“走样”是 2021–2023 年 NeRF 改进的两条主线，而且两者互相牵制：加速的主要手段是把 MLP 换成网格或哈希表，可网格本身没有“尺度”概念，反而更容易走样。Zip-NeRF 就是从这个矛盾出发的。\n\n加速有三类办法。第一类是把容量从 MLP 权重挪到显式数据结构。Plenoxels 用稀疏体素直接存密度和球谐（SH）系数，完全不用神经网络，优化速度比 NeRF 快两个数量级。DVGO 用密度网格加特征网格，后接浅层 MLP，15 分钟内收敛，并提出“先插值后激活”（post-activation）。TensoRF 把 4D 特征张量分解成低秩的向量和矩阵因子，VM 版本训练不到 10 分钟，模型小于 75 MB。Instant-NGP 用 16 级多分辨率哈希表（每项是 F=2 维特征）加一个很小的 MLP，配合全融合 CUDA kernel，把训练缩短到秒级，1080p 渲染只需几十毫秒。第二类是跳过空区域，只在有物体的地方采样，例如 Instant-NGP 的占据网格和 Plenoxels 的稀疏体素。可泛化 NeRF 里的 ENeRF 也属于这一类：它先用代价体估计粗深度，只在表面附近采少量点。第三类是训练后“烘焙”成适合实时渲染的结构。SNeRG 预计算为稀疏特征网格加小型延迟着色 MLP，平均小于 90 MB，笔记本 GPU 上超过 30 fps。PlenOctrees 用八叉树存 SH。MERF 用稀疏特征网格加高分辨率 2D 特征平面来降低显存，能在浏览器里实时渲染无界场景。SMERF 更进一步，让 300 m² 的大场景在手机上实时漫游。\n\n抗锯齿这条线从 Mip-NeRF 开始。它把每个像素看成一个圆锥而不是一条射线，沿射线切成圆锥台（conical frustum），每段用 3D 高斯近似，再用积分位置编码（IPE）求位置编码在该高斯下的期望。这样高频分量会按高斯大小自动衰减，相当于 mipmap 预滤波的连续版本。结果是：在 NeRF 数据集上误差降低 17%，在多尺度版本上降低 60%；与暴力超采样的 NeRF 精度相当，速度快 22 倍。Mip-NeRF 360 把它推广到 360° 无界场景，做了三件事：用 contraction 把无穷远压进半径为 2 的球，并按视差（1/距离）线性采样；用小型 proposal MLP 做在线蒸馏，决定采样位置；用 distortion 正则抑制“漂浮物”。它的 MSE 比 Mip-NeRF 降低 57%。Zip-NeRF 把 Mip-NeRF 360 的抗锯齿和 Instant-NGP 的哈希网格结合起来：每个锥台用 6 个多重采样点近似；每级网格特征按“高斯尺度相对网格单元大小”用 erf 衰减；另外用抗锯齿的 interlevel loss 解决 z-aliasing。它的误差比两者低 8%–77%，训练比 Mip-NeRF 360 快 24 倍：在单尺度的 Mip-NeRF 360 数据集上，Zip-NeRF 用 8 张 V100 训练约 0.89 小时，Mip-NeRF 360 约 21.69 小时（后者由其他硬件的实测时间换算而来，论文标为近似值）。\n\n2023 年 8 月 3DGS 出现后，实时渲染的主流表示转向了显式高斯（见 a-3dgs-ext）。但截至 2026-09，本专题的内容仍是读论文的基本词汇，原因有三。第一，Zip-NeRF 与 Mip-NeRF 360 仍常被用作逐场景优化的质量参照，Quark 在 DL3DV 上的对比表就直接列出了 Zip-NeRF、Mip-NeRF360、3DGS、Instant-NGP、Nerfacto 的数值。第二，Mip-Splatting 等高斯抗锯齿工作的理论（采样率、预滤波）直接继承自 Mip-NeRF，2DGS 的深度畸变损失也来自 Mip-NeRF 360。第三，“网格插值后再激活”“按视差分配采样”这些技巧已被 feed-forward 方法吸收。最需要分清的是“实时”在这里的含义：本专题的“实时”只指渲染，重建仍是逐场景优化（Instant-NGP 秒到分钟级，Zip-NeRF 约 8 卡×0.9 小时）；Quark 的“实时”则是每帧重建加渲染合计约 33 ms。远程临场里每 33 ms 就是一个新“场景”，这是两篇锚点论文都走 feed-forward 路线的根本原因。", "key_ideas": [{"name_zh": "把容量从 MLP 挪到网格：显式与混合表示", "explain_zh": "直觉：MLP 每查询一个点都要把整个网络算一遍，一个 8 层、256 宽的全连接网络约需 50 万次乘加；网格查询只需读周围 8 个顶点做三线性插值，计算量几乎是常数，代价是显存。Plenoxels 每个顶点存 1 个密度和 27 个 SH 系数（2 阶 SH 每通道 9 个，共 3 个颜色通道），合计 28 个浮点数。如果用 512³ 的稠密网格，需要 1.34×10^8 个顶点×28×4 字节≈15 GB，所以必须稀疏化（Plenoxels）、低秩分解（TensoRF 的 VM 分解）或哈希（Instant-NGP）。这类方法能成立，说明 NeRF 的质量主要来自“可微体渲染 + 多视角光度损失”，而不是 MLP 本身，Plenoxels 的标题就叫 “without Neural Networks”。与锚点的联系：Quark 的 LDM 本质上也是一个显式网格（最终 6 层×288×512，每格存 depth、density 和对 8 个输入视角的 blend logits），区别在于它由网络每帧预测，而不是逐场景优化出来的。"}, {"name_zh": "多分辨率哈希编码（Instant-NGP）", "explain_zh": "直觉：3D 空间大部分是空的，只有表面附近需要细节。Instant-NGP 设 L=16 个分辨率级别，分辨率从 N_min=16 按几何级数增长到 N_max（512 到 524288）。粗级别的顶点数少于表大小 T，与表项一一对应；细级别的顶点用空间哈希映射到大小为 T（2^14 到 2^24）、每项 F=2 维可训练特征的表里，冲突不做显式处理。这样做可行，有两个原因：冲突项上的梯度会被平均，对损失贡献大的表面点的梯度占主导；而且不同级别在不同位置发生冲突，小 MLP 可以借此消歧。数值例子：T=2^19、L=16、F=2 时共约 1680 万个参数，而一个 2048³ 的稠密网格就有约 8.6×10^9 个顶点。查表是 O(1)，没有树遍历，非常适合 GPU。与锚点的联系：两篇锚点都不用哈希网格。Quark 的 DL3DV 对比表里 Instant-NGP 只有 25.01 dB（Quark 31.31，Zip-NeRF 31.22），但这些基线数值直接取自 DL3DV 论文（默认设置、较低分辨率），不宜据此单独评判 Instant-NGP。更干净的对照来自 Zip-NeRF 论文自己的 Mip-NeRF 360 数据集：Instant-NGP 25.68 dB、训练约 0.15 小时，Zip-NeRF 28.54 dB、约 0.89 小时。Zip-NeRF 正是在哈希网格上补上了“尺度感知”（抗锯齿），才同时拿到速度和质量。"}, {"name_zh": "先插值、后激活（post-activation）", "explain_zh": "直觉：如果先对每个顶点的值做激活（如密度过 ReLU/softplus、占据过 sigmoid），再做线性插值，那么体素内部只能线性过渡，边界会被抹成一个体素宽的斜坡。如果先插值未激活的原始值、再施加非线性，零交叉点可以落在体素内部的任意位置，于是在低分辨率网格上也能得到亚体素精度的锐利边界。数值例子：相邻两个顶点的原始值为 −3 和 +1。先 ReLU 得到 0 和 1，插值后是一条横跨整个体素的斜坡；先插值则在 3/4 处过零，ReLU 后前 3/4 恒为 0，边界被精确定位在 0.75。ReLU Fields 与 DVGO 都提出了这一做法。与锚点的联系：Quark 的 “Upsample & Activate” 阶段明确借鉴了 ReLU Fields。最终 LDM 的 depth、density 与 blend logits 都以未激活形式双线性上采样 3.75×（288×512 → 1080×1920），然后才施加 tanh、sigmoid、softmax，blend weights 的 softmax 也推迟到上采样之后。不理解这一点，就很难明白 Quark 为什么能用 288×512 的内部表示输出 1080p，而遮挡边缘不发糊。"}, {"name_zh": "锥体追踪与积分位置编码（Mip-NeRF）", "explain_zh": "直觉：一个像素在远处覆盖的 3D 区域更大，它“看到”的应当是这块区域的平均颜色，而不是某一个点的颜色。Mip-NeRF 用 3D 高斯近似每段圆锥台，并解析地求出位置编码 sin(2^l x)、cos(2^l x) 在该高斯下的期望，结果是第 l 个频率被乘上 exp(−½·4^l·σ²)，其中 σ² 是高斯在该方向的方差。数值例子：σ=0.05（场景单位）时，l=2 的衰减因子约 0.98，l=4 约 0.73，l=6 约 0.006。足迹大的样本会自动丢掉高频特征，不再“假装”看得清细节，锯齿因此消失。与锚点的联系：Quark 在 1024×768 与 2048×1536 下的运行时间几乎相同（32.2 对 33.0 ms），因为内部 LDM 固定为 288×512；而在 2K 下，Shiny 的 PSNR 从 26.51 降到 24.66，LPIPS 从 0.108 升到 0.174。用 Mip-NeRF 的“像素足迹”语言来说，输出采样率提高后，新增细节只能来自 IBR 对全分辨率输入图的采样，几何并没有变细。评价“高分辨率实时”这类说法时，要用这个视角去看。"}, {"name_zh": "无界场景：contraction 与按视差采样（Mip-NeRF 360）", "explain_zh": "直觉：一个点在图像上的视差与深度成反比，所以深度分辨率应当按 1/d 来分配，近处细、远处粗。Mip-NeRF 360 的 contraction 让半径 1 以内的空间保持不变，把外部按 2−1/‖x‖ 压进半径 1 到 2 的壳层：‖x‖=2 映射到 1.5，‖x‖=10 映射到 1.9，无穷远映射到 2。沿射线的采样也按视差均匀分布。与锚点的联系：Quark 在由 SfM 点估计的近平面 η 与远平面 f 之间按等视差放置 L 个 anchor，每层深度只能在自己的视差带内移动。数值例子：η=0.5 m、f=10 m、L=24 时，视差范围为 2.0−0.1=1.9 m⁻¹，每层带宽约 0.079 m⁻¹。若某层 anchor 恰在 1 m，它的深度范围约为 0.96–1.04 m；若在 5 m，范围约为 4.2–6.2 m。这与 Mip-NeRF 360 的原则相同。Ha et al. 的 TSDF 截断则用固定的公制值 τ=0.02 m，与深度无关，锚点深读指出，由于立体深度误差随距离平方增长，这个值对远处背景太紧。理解了按视差参数化，就能看懂两篇在这一点上的不同取舍。"}, {"name_zh": "Proposal 采样、distortion 正则与 z-aliasing", "explain_zh": "直觉：体渲染的大部分采样点落在空区域或被遮挡区域，算力被浪费了。Mip-NeRF 360 用一个小型 proposal MLP 预测沿射线的密度直方图，再按直方图重采样，把样本点集中到第一个表面附近。proposal 网络只用主 NeRF 权重直方图的蒸馏来监督，不需要颜色。distortion 损失的形式为 Σ_{i,j} w_i w_j |s̄_i − s̄_j| 再加上一个区间自身项，它惩罚权重沿射线的分散，从而抑制漂浮物；2DGS 把它改写成了高斯的深度畸变损失。Zip-NeRF 发现，分段常数的 proposal 监督对表面的平滑位移不敏感，相机移动时场景内容会忽隐忽现，这就是 z-aliasing。它的解决办法是先把直方图模糊成分段线性样条，再重采样到 proposal 的 bin 中，使损失随射线距离平滑变化。与锚点的联系：Quark 采用由粗到细的结构，先在 36×64 分辨率上用 24 层密集定位表面，再经两次 layer collapse 降到 6 层、同时升到 288×512。这与“先粗估密度、再集中采样”是同一思想，只是由网络来学。两篇锚点的共同基线 ENeRF 用级联代价体预测粗深度，然后只在表面附近采少量点。Ha et al. 的 TSDF 则以 0.8·s 为步长推进，检测到符号变化后做 3 步二分，这是“用距离界跳过空区域”的另一种实现。"}, {"name_zh": "烘焙与“实时”的两种含义", "explain_zh": "直觉：训练时需要可微、灵活的表示，部署时需要能快速查表的表示，所以先训练、再烘焙。SNeRG 把 NeRF 改写为“体渲染特征 + 每像素只跑一次的小 MLP”（延迟着色），再预计算成稀疏网格。MERF 用一种既能压缩无界场景、又便于快速做射线-盒求交的 contraction，实现浏览器中的实时渲染。SMERF 把大场景分块，并用蒸馏保证块与块之间一致。但这些方法都是“逐场景优化，然后实时渲染”。数值对比：Zip-NeRF 每个场景要在 8 张 V100 上训练约 0.9 小时；Quark 在单张 A100 上每帧重建加渲染只需 32.2 ms（1024×768）；Ha et al. 各阶段合计约 39 ms（TensorRT，不含立体深度）。在 30 fps 的远程临场中，每 33 ms 场景就会变化一次，逐场景优化来不及，所以两篇锚点都采用 feed-forward、不做逐场景训练。读 Quark 的 DL3DV 对比表时要记住：表中的逐场景方法对每个测试场景都做过拟合，Quark 则从未见过这些场景，因此 31.31 对 Zip-NeRF 31.22 的“超越”必须结合设定来理解。锚点深读还指出：基线数值直接取自 DL3DV 论文，分辨率较低；测试时每 8 帧取一帧作目标、其余帧作输入，属于稠密轨迹上的插值设定。"}], "equations": [{"tex": "\\gamma(\\boldsymbol{\\mu},\\boldsymbol{\\Sigma})=\\mathbb{E}_{\\mathbf{x}\\sim\\mathcal{N}(\\boldsymbol{\\mu},\\boldsymbol{\\Sigma})}\\big[\\gamma(\\mathbf{x})\\big]=\\begin{bmatrix}\\sin(\\boldsymbol{\\mu}_\\gamma)\\circ\\exp\\!\\left(-\\tfrac12\\operatorname{diag}(\\boldsymbol{\\Sigma}_\\gamma)\\right)\\\\ \\cos(\\boldsymbol{\\mu}_\\gamma)\\circ\\exp\\!\\left(-\\tfrac12\\operatorname{diag}(\\boldsymbol{\\Sigma}_\\gamma)\\right)\\end{bmatrix},\\quad \\gamma(\\mathbf{x})=\\begin{bmatrix}\\sin(\\mathbf{P}\\mathbf{x})\\\\ \\cos(\\mathbf{P}\\mathbf{x})\\end{bmatrix},\\ \\boldsymbol{\\mu}_\\gamma=\\mathbf{P}\\boldsymbol{\\mu},\\ \\boldsymbol{\\Sigma}_\\gamma=\\mathbf{P}\\boldsymbol{\\Sigma}\\mathbf{P}^{\\top},\\ \
