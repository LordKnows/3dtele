\mathbf{P}=[\\mathbf{I},2\\mathbf{I},\\dots,2^{L-1}\\mathbf{I}]^{\\top}", "explain_zh": "Mip-NeRF 的积分位置编码（IPE）。γ(x) 是普通位置编码：P 把 3D 坐标 x 依次乘以 1, 2, …, 2^{L−1}（L 为频率级数），再取 sin 和 cos；μ、Σ 是某段圆锥台近似高斯的 3D 均值和 3×3 协方差（由该段的起止距离 t0、t1 和像素圆锥半径解析算出）；μ_γ=Pμ、Σ_γ=PΣPᵀ 是这个高斯经 P 线性变换后的均值与协方差；diag(·) 取对角元，因为每个 sin/cos 分量只依赖一个坐标的边缘分布；∘ 表示逐元素相乘。公式的依据是一维恒等式：若 x∼N(μ, σ²)，则 E[sin x]=sin(μ)·exp(−σ²/2)，cos 同理。于是 exp(−½ diag Σ_γ) 就是每个频率分量的衰减因子。Σ→0 时（无限细的射线），IPE 退化为 NeRF 的普通位置编码 γ(μ)。例：某轴方差 σ²=0.0025（σ=0.05），第 l 级（从 0 开始计）对角元为 4^l σ²，l=2 时衰减 exp(−0.02)≈0.98，l=4 时 exp(−0.32)≈0.73，l=6 时约 0.006。足迹越大，高频特征越被抑制，这就是“预滤波”。"}, {"tex": "h(\\mathbf{x})=\\Big(\\bigoplus_{i=1}^{d} x_i\\,\\pi_i\\Big)\\bmod T,\\qquad N_l=\\big\\lfloor N_{\\min}\\, b^{\\,l}\\big\\rfloor,\\quad b=\\exp\\!\\Big(\\frac{\\ln N_{\\max}-\\ln N_{\\min}}{L-1}\\Big)", "explain_zh": "Instant-NGP 的空间哈希与分辨率级数。x 是某一级缩放后网格顶点的整数坐标（d=2 或 3 维）；π_i 是大素数（π_1=1、π_2=2654435761、π_3=805459861）；⊕ 是按位异或；T 是该级哈希表的大小（2^14 到 2^24）；N_l 是第 l 级的网格分辨率；N_min、N_max 分别是最粗和最细分辨率；b 是相邻级之间的增长因子（论文中 b∈[1.26, 2]）；L 是级数（16）。每个查询点在每一级取所在体素 2^d 个顶点的特征做 d 线性插值，L 级特征拼接后送入小 MLP。例：N_min=16、N_max=2048、L=16 时，b=exp(ln128/15)≈1.38。"}, {"tex": "\\operatorname{contract}(\\mathbf{x})=\\begin{cases}\\mathbf{x}, & \\|\\mathbf{x}\\|\\le 1\\\\ \\left(2-\\dfrac{1}{\\|\\mathbf{x}\\|}\\right)\\dfrac{\\mathbf{x}}{\\|\\mathbf{x}\\|}, & \\|\\mathbf{x}\\|>1\\end{cases}", "explain_zh": "Mip-NeRF 360 的场景收缩。x 是以场景中心为原点、按相机分布归一化后的世界坐标；‖x‖≤1 的区域保持线性，外部按 2−1/‖x‖ 缩放到半径 [1, 2) 的壳层，此时径向坐标与视差 1/‖x‖ 呈线性关系。例：‖x‖=2 映射到 1.5，4 映射到 1.75，10 映射到 1.9，无穷远映射到 2。对照 Quark 的层深度 d_ℓ=[(δ+0.5/L·tanh(VW_d))(1/η−1/f)+1/f]^{-1}：其中 δ=(ℓ−0.5)/L 是第 ℓ 层的 anchor，η、f 是近/远平面，VW_d 是网络输出，tanh 把每层限制在自己的视差带内。它同样是在视差空间里做线性参数化，与 contraction 的原则一致。"}], "evolution": [{"year": 2020, "milestone_zh": "NeRF（ECCV 2020）：8 层 MLP + 体渲染，每条射线约 256 次 MLP 查询，单场景在 V100 上训练约 1–2 天"}, {"year": 2021, "milestone_zh": "Mip-NeRF（ICCV 2021）提出锥体追踪与 IPE；同年 KiloNeRF、PlenOctrees、SNeRG（均为 ICCV 2021）用分治或烘焙实现实时渲染"}, {"year": 2022, "milestone_zh": "Plenoxels、DVGO、Mip-NeRF 360（CVPR 2022）：无网络的稀疏体素、post-activation、无界场景的 contraction 与 proposal 采样"}, {"year": 2022, "milestone_zh": "Instant-NGP（SIGGRAPH 2022）的多分辨率哈希编码把训练缩短到秒到分钟级；TensoRF（ECCV 2022）张量分解；ReLU Fields（SIGGRAPH 2022）"}, {"year": 2023, "milestone_zh": "Zip-NeRF（ICCV 2023）把网格加速与抗锯齿统一起来；MERF（SIGGRAPH 2023）实现浏览器实时；Nerfstudio 发布 nerfacto；8 月 3DGS 发布，实时渲染主流转向高斯；12 月 SMERF 让 300 m² 场景在手机上实时"}, {"year": 2024, "milestone_zh": "Quark（SIGGRAPH Asia 2024）单次前向、未见测试场景，在 DL3DV 上取得 31.31 dB，高于表中 Zip-NeRF 的 31.22（基线数值取自 DL3DV 论文）；其 Upsample & Activate 借用 ReLU Fields"}, {"year": 2025, "milestone_zh": "Ha et al.（CVPR 2025）完全不做体采样，改用 image-based TSDF 射线推进；最强基线 ENeRF 属于“加速的可泛化 NeRF”"}], "papers": [{"title": "Instant Neural Graphics Primitives with a Multiresolution Hash Encoding", "authors": "Thomas Müller et al.", "year": 2022, "venue": "ACM TOG 41(4) / SIGGRAPH 2022", "url": "https://arxiv.org/abs/2201.05989", "citations": 6355, "role_zh": "多分辨率哈希编码加全融合 CUDA，把 NeRF 训练从天级降到秒到分钟级、1080p 渲染降到几十毫秒；nerfacto、Zip-NeRF 都建立在它之上", "priority": "must"}, {"title": "Mip-NeRF: A Multiscale Representation for Anti-Aliasing Neural Radiance Fields", "authors": "Jonathan T. Barron et al.", "year": 2021, "venue": "ICCV 2021", "url": "https://arxiv.org/abs/2103.13415", "citations": 2947, "role_zh": "锥体追踪与积分位置编码，是 NeRF 抗锯齿的起点（误差降低 17%，多尺度下降低 60%）；采样率与预滤波的思想后来被 Mip-Splatting 继承", "priority": "must"}, {"title": "Mip-NeRF 360: Unbounded Anti-Aliased Neural Radiance Fields", "authors": "Jonathan T. Barron et al.", "year": 2022, "venue": "CVPR 2022", "url": "https://arxiv.org/abs/2111.12077", "citations": 2923, "role_zh": "提出 contraction 与按视差采样、proposal 在线蒸馏和 distortion 正则，MSE 降低 57%；其数据集也是 Quark 的评测集之一（Quark 26.60 对 M-NeRF360 27.69）", "priority": "must"}, {"title": "Zip-NeRF: Anti-Aliased Grid-Based Neural Radiance Fields", "authors": "Jonathan T. Barron et al.", "year": 2023, "venue": "ICCV 2023", "url": "https://arxiv.org/abs/2304.06706", "citations": 922, "role_zh": "结合哈希网格、6 点多重采样、按尺度的 erf 特征衰减与抗锯齿 interlevel loss（解决 z-aliasing），误差降低 8%–77%，训练比 Mip-NeRF 360 快 24 倍；是 Quark DL3DV 对比表中最强的逐场景基线（31.22 dB）", "priority": "must"}, {"title": "Plenoxels: Radiance Fields without Neural Networks", "authors": "Sara Fridovich-Keil, Alex Yu（共同一作）et al.", "year": 2022, "venue": "CVPR 2022", "url": "https://arxiv.org/abs/2112.05131", "citations": 2340, "role_zh": "用稀疏体素存密度和 SH，完全不用神经网络，优化速度快两个数量级，说明 NeRF 质量主要来自可微体渲染", "priority": "should"}, {"title": "TensoRF: Tensorial Radiance Fields", "authors": "Anpei Chen et al.", "year": 2022, "venue": "ECCV 2022", "url": "https://arxiv.org/abs/2203.09517", "citations": 1854, "role_zh": "把 4D 特征张量做 CP/VM 低秩分解：CP 版本不到 4 MB，VM 版本训练不到 10 分钟、模型不到 75 MB，兼顾速度与显存", "priority": "should"}, {"title": "Direct Voxel Grid Optimization: Super-fast Convergence for Radiance Fields Reconstruction", "authors": "Cheng Sun et al.", "year": 2022, "venue": "CVPR 2022", "url": "https://arxiv.org/abs/2111.11215", "citations": 1404, "role_zh": "用密度网格、特征网格加浅层 MLP，约 15 分钟收敛；提出密度的 post-activation 插值，能在低分辨率网格上得到锐利表面", "priority": "should"}, {"title": "ReLU Fields: The Little Non-linearity That Could", "authors": "Animesh Karnewar et al.", "year": 2022, "venue": "SIGGRAPH 2022", "url": "https://arxiv.org/abs/2205.10824", "citations": 123, "role_zh": "在插值后的网格值上施加 ReLU，再配合由粗到细优化；是 Quark “Upsample & Activate”（先上采样未激活属性再施加非线性）的直接来源", "priority": "should"}, {"title": "Baking Neural Radiance Fields for Real-Time View Synthesis", "authors": "Peter Hedman et al.", "year": 2021, "venue": "ICCV 2021", "url": "https://arxiv.org/abs/2103.14645", "citations": 663, "role_zh": "SNeRG：把训练好的 NeRF 改写为延迟着色并烘焙成稀疏特征网格，平均小于 90 MB，笔记本 GPU 上超过 30 fps", "priority": "should"}, {"title": "MERF: Memory-Efficient Radiance Fields for Real-time View Synthesis in Unbounded Scenes", "authors": "Christian Reiser et al.", "year": 2023, "venue": "ACM TOG / SIGGRAPH 2023", "url": "https://arxiv.org/abs/2302.12249", "citations": 307, "role_zh": "用稀疏特征网格加高分辨率 2D 平面以及便于射线-盒求交的新 contraction，在浏览器中实时渲染无界场景", "priority": "optional"}, {"title": "PlenOctrees for Real-time Rendering of Neural Radiance Fields", "authors": "Alex Yu et al.", "year": 2021, "venue": "ICCV 2021", "url": "https://arxiv.org/abs/2103.14024", "citations": 1346, "role_zh": "让 NeRF 直接输出 SH 系数，再转存为八叉树实现实时渲染；SH 颜色后来成为 3DGS 的标准做法", "priority": "optional"}, {"title": "Nerfstudio: A Modular Framework for Neural Radiance Field Development", "authors": "Matthew Tancik et al.", "year": 2023, "venue": "SIGGRAPH 2023", "url": "https://arxiv.org/abs/2302.04264", "citations": 1051, "role_zh": "模块化 NeRF 框架，nerfacto 把 proposal 采样、哈希编码、场景收缩、位姿优化组合在一起；Quark 的 DL3DV 对比表中 Nerfacto 为 24.61 dB", "priority": "optional"}, {"title": "SMERF: Streamable Memory Efficient Radiance Fields for Real-Time Large-Scene Exploration", "authors": "Daniel Duckworth, Peter Hedman, Christian Reiser et al.", "year": 2024, "venue": "ACM TOG 43(4) / SIGGRAPH 2024", "url": "https://arxiv.org/abs/2312.07541", "citations": 90, "role_zh": "在 MERF 基础上做分层模型分块与蒸馏，支持最大约 300 m² 的场景在浏览器、手机和笔记本上实时 6DoF 漫游；摘要明确指出光线步进式神经场质量更高但实时代价过高，是理解“烘焙”路线上限的参照", "priority": "optional"}], "prereqs": ["n-nerf", "r-volume", "l-encoding", "f-image", "g-depth", "r-raymarch"], "relation_to_anchors_zh": "Quark：(1) 在 DL3DV-10K benchmark 上与逐场景方法比较，Quark 为 31.31/0.932/0.103（PSNR/SSIM/LPIPS），Zip-NeRF 31.22/0.921/0.112，Mip-NeRF360 30.98/0.911/0.132，3DGS 29.82，Instant-NGP 25.01，Nerfacto 24.61。基线数值取自 DL3DV 论文，分辨率较低，Quark 也没有在 DL3DV 上训练过。在 3DGS 论文使用的场景上，Mip-NeRF360 数据集 Quark 为 26.60，排第三（M-NeRF360 27.69，3DGS-30K 27.21）；Deep Blending 上 Quark 为 23.61，远低于 M-NeRF360 的 29.66 和 3DGS 的 30.04，只高于 Plenoxels 和 INGP，原因是最近 8 个视角覆盖不足。不了解本专题，就无法判断这些数字的分量：Zip-NeRF 每个场景要在 8 张 V100 上训练约 0.9 小时，而 Quark 是一次 32–33 ms 的前向，且从未见过这些场景。(2) Quark 的 Upsample & Activate 明确借用 ReLU Fields 的 post-activation（DVGO 也有同样的做法）：最终 LDM 的 depth、density、blend logits 先双线性上采样 3.75×，再施加非线性，这是它能用 288×512 的内部表示输出锐利 1080p 遮挡边的原因。(3) Quark 在 SfM 估计的 [η, f] 之间按等视差放置层 anchor，并把每层限制在自己的视差带内，这与 Mip-NeRF 360 按视差采样、用 contraction 压缩远景是同一原则。它的由粗到细结构（24 层@36×64 → 6 层@288×512，中间两次 layer collapse）对应“先粗定位表面、再集中采样”的 proposal 思想。(4) 2K 输出时内部 LDM 分辨率不变（32.2 对 33.0 ms），Shiny 的 LPIPS 从 0.108 变为 0.174。用 Mip-NeRF 的像素足迹视角可以解释：输出采样率提高，几何并没有变细。\nHa et al.：全文不使用任何 NeRF 式表示。它的最强基线 ENeRF 属于“加速的可泛化 NeRF”：先用级联代价体预测粗几何，再只在表面附近采少量点，比此前的可泛化 NeRF 快至少 60 倍，这是 empty-space skipping 在 feed-forward 中的体现。Ha 在 DyNeRF 上以 31.17 对 29.51 胜过 ENeRF，但在 ENeRF-Outdoor 上以 24.01 对 25.79 落败。Ha 的 image-based TSDF 沿目标射线以 0.8·s 为步长推进、检测到变号后做 3 步二分，靠距离界跳过空区域，而不是 NeRF 式的密集体采样。它的截断用公制 τ=0.02 m，与 Mip-NeRF 360/Quark 的视差参数化正好相反。Ha 与逐场景方法 4K4D、4DGS（K=17）只做了定性比较。", "debates_zh": ["神经网络是否必要：Plenoxels 不用网络也能达到 NeRF 的质量，说明关键在可微体渲染与正则；但 Instant-NGP、Zip-NeRF 表明，小 MLP 在消解哈希冲突和建模视角相关外观上仍有价值。“显式 vs 隐式”至今没有统一答案。", "抗锯齿的代价是否值得：Zip-NeRF 每个锥台要算 6 个多重采样点，计算量随之增加。收益高度依赖测试协议：在 Zip-NeRF 的多尺度 360 基准上，把多重采样换成朴素单点采样（消融 A），全分辨率（1×）下 PSNR 只从 28.25 降到 27.93，但在 1/8 分辨率下渲染（相当于从远处看）时从 32.52 暴跌到 26.53；而暴力 6× 超采样（消融 B）训练要 2.54 小时，质量反而更差。也就是说，只在训练分辨率上测试时几乎看不出抗锯齿的价值，一旦观看距离变化就必不可少。3DGS 出现后，同样的争论在 Mip-Splatting 上又重演了一遍。", "逐场景优化与 feed-forward 的比较是否公平：Quark 在 DL3DV 上以 31.31 对 31.22 胜过 Zip-NeRF，但在 Deep Blending 上以 23.61 远低于 Mip-NeRF360 的 29.66；DL3DV 的基线数值取自原论文、分辨率不同，测试设定又是稠密轨迹插值。“feed-forward 已追平逐场景”这一说法强烈依赖视角覆盖。", "体渲染光线步进 vs 光栅化：SMERF 摘要指出，基于光线步进的神经场质量更高，但实时代价高昂；3DGS 靠光栅化赢得了速度，之后 3DGRT 等工作又把光线追踪带回了粒子表示。"], "open_questions_zh": ["能否把逐场景优化从“秒到分钟”压缩到“每帧 33 ms 在线更新”，例如用 feed-forward 初始化再加少量 test-time 优化，同时兼顾质量与延迟？锚点深读列出的 Online Neural Space Time Memory（2026）用 TTT 记忆约 1 FPS 更新、逐帧应用，是一个可参考的方向。", "动态、流式场景下的抗锯齿与时间稳定：观看者在头显中前后移动时采样率连续变化，逐帧生成的表示怎样才能既无锯齿又不闪烁？", "深度参数化如何统一：等视差分层（Quark）、contraction（Mip-NeRF 360）与公制截断（Ha 的 τ=0.02 m）各有适用范围。在“近处人物 + 远处房间背景”的远程临场场景中，哪种参数化更稳健？", "视角相关外观：哈希网格加小 MLP 或 SH 在逐场景设定下能表示高光，而 feed-forward IBR 只能对输入颜色做凸组合。显式视角相关模型（Quark 列为未来工作）能否做到实时？"], "resources": [{"title": "Neural Fields in Visual Computing and Beyond（Xie et al. 综述）", "url": "https://arxiv.org/abs/2111.11426", "type": "paper", "note_zh": "神经场综述，系统梳理了网格、哈希等混合表示，以及采样、加速和先验。读完 NeRF 后先读它，可以建立整体框架，再回头逐篇读本专题的论文"}, {"title": "Nerfstudio 文档：Nerfacto", "url": "https://docs.nerf.studio/nerfology/methods/nerfacto.html", "type": "tutorial", "note_zh": "讲解 nerfacto 如何组合 piecewise sampler、proposal sampler、哈希编码和位姿优化，把 Mip-NeRF 360 与 Instant-NGP 的思想落到可运行的代码里，适合动手对照"}, {"title": "Instant-NGP 官方代码（NVlabs）", "url": "https://github.com/NVlabs/instant-ngp", "type": "code", "note_zh": "多分辨率哈希编码与占据网格加速的官方实现，自带交互式 GUI，能直观看到秒级收敛的过程"}, {"title": "CamP / Zip-NeRF 官方 JAX 代码", "url": "https://github.com/jonbarron/camp_zipnerf", "type": "code", "note_zh": "Zip-NeRF 与 CamP 的官方实现，包含 Mip-NeRF 360 的 contraction、proposal 与 distortion 损失，以及 Zip-NeRF 的多重采样和 erf 特征衰减"}]}, {"id": "a-3dgs-ext", "title_zh": "3D Gaussian Splatting 的扩展", "title_en": "Extensions of 3D Gaussian Splatting", "overview_zh": "3DGS（Kerbl et al., SIGGRAPH 2023）把场景表示为数百万个带不透明度和 SH 颜色的各向异性 3D 高斯。渲染时，每个高斯被投影成屏幕上的 2D 椭圆，按 tile 排序后做前到后 alpha 混合，1080p 下可达 30 fps 以上。为了速度，这条管线用了若干近似和启发式，2023 年 11 月以后的扩展工作大致可以按它们修补的缺陷分成六类：(1) 走样：改变焦距或相机距离时伪影明显。拉近时物体“变细”并出现高频噪点；拉远时，官方 CUDA 代码中硬编码的 0.3 px² 屏幕空间膨胀（dilation，论文正文没有交代）会让细结构发亮、变胖。(2) 几何不准：3D 高斯的深度随视角变化，多视角之间不一致，法线噪声大，难以提取网格。(3) 冗余与存储：LightGaussian 指出，单个无界场景可能要占用 GB 级磁盘。(4) 排序近似：每个高斯只用一个视空间深度参与排序，旋转视角时画面会突然跳变（popping）。(5) 致密化依赖手工启发式和初始化。(6) 光栅化只支持针孔相机，也做不了反射、阴影等二次光线。\n\n各类缺陷对应的代表性工作如下。抗锯齿方面，Mip-Splatting（CVPR 2024 最佳学生论文）从 Nyquist 采样定理出发：训练视图决定了每个高斯能被观测到的最大采样率 ν̂_k = max_n f_n/d_n，3D 平滑滤波给高斯协方差加上正比于 1/ν̂² 的项，使它不小于采样间隔；2D Mip 滤波则用一个近似单像素 box 的 2D 高斯代替 dilation，并按行列式比值缩放幅度，以保持能量守恒。几何方面，SuGaR 用正则把高斯压平、贴合表面，再用 Poisson 重建提取网格。2DGS 把 3D 体积塌缩成有向的 2D 高斯圆盘（surfel），用射线与圆盘的精确求交代替仿射近似，并加上深度畸变与法线一致性损失；它在 DTU 上的 Chamfer 距离为 0.80（3DGS 为 1.96，SuGaR 为 1.33），训练 10.9 分钟。GOF 从射线追踪式的体渲染定义不透明度场，再用高斯诱导的四面体网格做 Marching Tetrahedra，得到自适应表面。紧凑表示方面，Scaffold-GS 用锚点加小 MLP，按视角和距离即时生成“神经高斯”；LightGaussian 结合剪枝、SH 蒸馏和向量量化，平均压缩 15 倍，FPS 从 144 提到 237；HAC 在 Scaffold-GS 的锚点之上，用二值化哈希网格为无序锚点建立上下文模型并做熵编码，体积比原版 3DGS 小 75 倍以上、比 Scaffold-GS 小 11 倍以上。渲染正确性方面，StopThePop 用分层的逐像素重排序消除 popping，平均只慢 4%，而且高斯数量可以因此减半，最终反而比原版快 1.6 倍；3DGRT 用 BVH 和 GPU 光追硬件追踪粒子，支持畸变相机与二次光线；3DGUT（CVPR 2025）则留在光栅化框架内，用 unscented transform 支持畸变相机和卷帘快门。优化方面，3DGS-MCMC 把致密化与剪枝改写成 SGLD 采样中的状态转移，对初始化更鲁棒，高斯数量也可以直接控制。\n\n工具链方面，gsplat（JMLR 2025）提供 PyTorch 前端和 CUDA 后端，训练时间最多减少 10%，显存降到原来的四分之一。它支持 antialiased 模式（即 Mip-Splatting 的 2D 滤波）、2DGS、MCMC 致密化和 3DGUT，配套的数学补充文档（arXiv 2312.02121）写出了前向与反向的全部公式。据 gsplat README 的更新记录，2026 年它又陆续加入了 LiDAR 光栅化（3 月）、实验性的 HiGS 推理渲染路径（5 月）和稀疏光栅化（7 月），已成为学术界复现和改造 3DGS 的常用底座。\n\n截至 2026-09，3DGS 已是“持久 3D 表示”的默认选择，feed-forward 路线也不例外。Quark 团队后续的 LVT（SIGGRAPH Asia 2025）和 Fuse-and-Refine（NeurIPS 2025），面向远程临场的 Tele360（2026），以及做语义编码传输的 GS-SCNet（2026），输出的都是 3DGS。这意味着本专题的问题会原样出现在远程临场管线中：观看者前后移动就是采样率变化（抗锯齿问题）；双目 HMD 需要一次重建、多次渲染（持久表示问题）；流式传输需要紧凑编码（压缩问题）；逐帧重建的高斯排序会导致闪烁（popping 问题）。Ha et al.（Sec. 3.1 与实现细节）直接用原版 3DGS 代码做逐视角前向 warping，是理解本专题最直接的切入口。", "key_ideas": [{"name_zh": "采样率与 3D 平滑滤波（Mip-Splatting）", "explain_zh": "直觉：焦距为 f（像素单位）的相机看深度 d 处的表面，一个像素对应的世界空间长度（采样间隔）是 T̂=d/f，采样频率为 ν̂=f/d。按 Nyquist 定理，这组样本最多只能约束频率 ν̂/2 以内的细节；比 2T̂ 还小的高斯其实从未被真正看清，放大观看时就会暴露高频伪影。Mip-Splatting 为每个高斯取所有可见训练相机中的最大采样率，把协方差加上 (s/ν̂²)I（官方代码 compute_3D_filter 中附加标准差为 √0.2·d/f，即 s=0.2）。训练结束后，这个滤波就固化为表示的一部分。数值例子：f=1000 px、d=2 m 时 T̂=2 mm，3D 滤波附加的标准差约为 √0.2×2 mm≈0.9 mm。与锚点的联系：Ha et al.（Sec. 3.1、A.3）把每个像素变成一个“在源图中投影覆盖单个像素”的各向同性高斯。论文没有给出尺度的具体常数，但它的世界尺寸必然与 d/f 同量级，也就是源相机的采样间隔 T̂。换句话说，Ha 的解析设定恰好是“每个样本一个、与源相机采样率匹配”的高斯。目标相机采样率与源相机不同时，情况会变化：观看者更靠近被摄者（采样率更高），这些高斯在屏幕上大于 1 像素，结果变模糊，因为源图本来就没有更高频的信息；观看者更远时，高斯变成亚像素大小，走样风险就交给光栅器里的 dilation 处理。Ha 的测试视角都是阵列中留出的相机，与源相机距离相近，所以论文几乎没有暴露这个问题；但在头显中自由移动时，它是关键问题。"}, {"name_zh": "2D Mip 滤波与屏幕空间膨胀的能量问题", "explain_zh": "直觉：原版 3DGS 实现会给每个投影后的 2D 协方差的对角元加上 0.3 px²（论文正文没有交代，官方 CUDA 代码 computeCov2D 中硬编码，注释称“每个高斯至少一个像素宽”），目的是防止高斯小于一个像素。它相当于 EWA splatting 中“重建核卷积低通滤波”的简化版，但 EWA 的卷积保持积分不变，3DGS 的做法却保持峰值不变。这个操作只扩大面积、不降低峰值，于是亚像素高斯的“能量”被放大了。数值例子：一个远处高斯投影后每轴方差为 0.1 px²，加上 0.3 后变为 0.4 px²，峰值不变，而积分正比于峰值乘 √det Σ，从 0.1 变成 0.4，放大了 4 倍，细辐条因此发亮、变胖。Mip-Splatting 的 2D Mip 滤波改为加 s·I（官方实现 s=0.1，近似单像素 box 滤波），同时把幅度乘以 √(|Σ|/|Σ+sI|)。上例中方差变为 0.2 px²，幅度乘 0.5，积分仍然是 0.1。gsplat 的 rasterize_mode=\"antialiased\" 实现的就是这种带补偿的滤波，但它的滤波方差用参数 eps2d（默认 0.3，而非 Mip-Splatting 的 0.1）；默认的 \"classic\" 模式则与原版 3DGS 一样只膨胀、不补偿。与锚点的联系：Ha et al. 明确使用原版 3DGS 代码做前向渲染；若未改动其光栅器，就带有 0.3 px² dilation、不做能量补偿，而且每个高斯的 opacity=1。当目标视角比源视角远时，多个亚像素高斯会落进同一个目标像素，此时 α_k 与颜色由 dilation 之后的覆盖决定。复现或改进 Ha 的前向 splat 时要注意，这个细节会改变融合网络的输入 α_k。"}, {"name_zh": "从体积到表面：SuGaR、2DGS 与 GOF", "explain_zh": "直觉：一条射线穿过 3D 椭球时，“表面在哪”没有唯一定义，不同视角算出的深度不同，所以多视角几何不一致。2DGS 把高斯压成有向圆盘：中心 p_k、两个切向量 t_u、t_v 和尺度 s_u、s_v 确定一个平面，法线为 t_w=t_u×t_v。渲染时求射线与圆盘平面的精确交点（ray-splat intersection），不用仿射近似，深度和法线因此都有良好定义。它再加两个正则：深度畸变损失（借鉴 Mip-NeRF 360）让同一射线上的交点聚拢；法线一致性损失让圆盘法线与由渲染深度梯度算出的法线对齐。网格通过对训练视角的渲染深度做 TSDF 融合得到（Open3D，体素 0.004，截断 0.02，场景单位）。代价是外观略降：Mip-NeRF 360 户外场景上 2DGS 为 24.34 dB，3DGS 为 24.64 dB。SuGaR 更早，用正则让高斯贴合表面后做 Poisson 重建；GOF 则不需要 TSDF 或 Poisson，直接从高斯的不透明度水平集提取表面。与锚点的联系：Ha et al. 的像素高斯是各向同性的，尺度按解析式设定，完全忽略表面倾斜，因此在掠射角下会被拉伸或出现空隙（锚点深读列出的未声明局限）。如果改用 2DGS 式的有向面元，由深度图梯度估计法线，就能按局部切平面来确定 splat 形状。Ha 在目标视角做的 image-based TSDF（τ=0.02 m）和 2DGS 提网格用的 TSDF 融合基于同一原理（对多视角截断符号距离做加权平均，再找零交叉），实现方式不同：Ha 沿目标射线即时求值、不建体素网格（Starline 式），服务于每帧的几何一致性；2DGS 用 Open3D 体素网格离线融合，服务于提网格。"}, {"name_zh": "排序近似、popping 与 Z-fighting", "explain_zh": "直觉：为了速度，3DGS 只给每个高斯算一个视空间深度（中心深度），按 tile 做全局排序，然后在像素内按这个顺序做 alpha 混合。两个互相穿插的高斯，在不同视角下中心深度的先后可能翻转，画面就会突然跳变（popping）。StopThePop 用分层的逐像素重排序去近似真正的逐像素深度，消除了 popping，平均只慢 4%。与锚点的联系：Ha et al. 明确拒绝“把所有视角的像素高斯一次性渲染”（Sec. 3.1 以 GS-LRM 为例，Fig. 4 与消融以 GPS-Gaussian 为例），理由是会产生飞点、遮挡空洞，并因 Z-fighting 让边缘变差。原因可以这样理解：K 个视角的像素高斯描述的是同一块表面，由于立体深度噪声，它们的深度只差几毫米，颜色又因曝光和视角不同而略有差异，于是排序在相邻像素之间、相邻帧之间来回翻转。Ha 的做法是逐视角单独渲染得到 K 张图，再由融合网络在几何引导下加权。消融中，No Blending（一次渲染全部高斯）的 PSNR 为 24.64、STED 为 483.3，完整模型为 31.17、68.76。可见对于逐帧生成的像素级高斯，排序一致性直接决定时间稳定性。"}, {"name_zh": "结构化与压缩：Scaffold-GS、LightGaussian、HAC", "explain_zh": "直觉：3DGS 为了拟合每一张训练图，会产生大量冗余高斯。压缩有三条路。第一条是剪掉不重要的高斯并降低 SH 阶数（LightGaussian，平均压缩 15 倍）。第二条是用少量锚点加小 MLP 按需生成高斯，把“存高斯”变成“存锚点特征”（Scaffold-GS）。第三条是对锚点属性做量化和基于上下文的熵编码：HAC 用哈希网格建模锚点之间的空间关系，体积比原版小 75 倍以上，比 Scaffold-GS 小 11 倍以上。数值例子（假设值）：如果每帧的高斯表示有 10 MB，30 fps 就是 300 MB/s，约 2.4 Gbps，现实网络无法承受，因此需要数量级的压缩。与锚点的联系：Quark 和 Ha 都是逐帧、逐目标视角重新计算，没有可压缩的持久表示，需要传输的是 K 路原始 RGB（Ha 还要加深度），两篇都没有分析带宽。锚点深读列出的后续工作 GS-SCNet（2026）把多视角编码与 feed-forward 3DGS 联合起来，相比 MV-HEVC + GPS-Gaussian 节省约 75% 的 BD-rate；D-FCGS（2025）则对动态高斯做 feed-forward 压缩。这些工作都建立在本专题的压缩思想之上。"}, {"name_zh": "致密化与优化：从启发式到 MCMC，以及 feed-forward 中的“参数由谁决定”", "explain_zh": "直觉：原版 3DGS 的高斯数量由 clone、split、prune 等启发式规则控制，并依赖 SfM 初始化。3DGS-MCMC 把高斯集合看作从场景分布中抽出的 MCMC 样本：在参数更新中加入噪声就得到 SGLD，致密化则变成近似保持概率的“重定位”。这样高斯总数可以精确控制，对初始化也更鲁棒。gsplat 提供 DefaultStrategy（原版自适应致密化，可选 AbsGrad 梯度）和 MCMCStrategy 两类策略。与锚点的联系：在 feed-forward、像素对齐的设定下没有致密化，高斯数量就等于像素数。按像素数推算，Ha 在 DyNeRF 1352×1014、K=4 时每帧约有 4×137 万≈550 万个高斯，Table 4 中前向 splat 约 10 ms。Ha 还称（Sec. 3.1、A.3），网络在稠密像素网格上预测的尺度、不透明度和旋转会收敛到近似常数，让尺度可变去填补遮挡洞还会降低 PSNR，所以改用解析设定；锚点深读指出这只有 Fig. 10 的定性对比，没有消融表支撑。GPS-Gaussian、pixelSplat 等 feed-forward 方法恰恰是去预测这些参数的。“高斯的数量和参数由谁决定”，在逐场景方法和 feed-forward 方法中的答案完全不同，这也是本专题与 a-ff-3dgs 的分界线。"}, {"name_zh": "光线追踪、通用相机与 gsplat 工具链", "explain_zh": "直觉：光栅化假设针孔相机，并在屏幕空间做仿射近似。遇到鱼眼镜头、卷帘快门或反射这类二次光线，这个假设就不成立了。3DGRT 用包围网格加 BVH，借助硬件光追逐条射线求交；3DGRT 论文称，这种灵活性相对光栅化代价不大。3DGUT 留在光栅化框架内，用 unscented transform 投影高斯（用少量 sigma 点经真实相机模型投影，再拟合 2D 高斯，而不是在中心处做一阶线性化），从而支持畸变相机和卷帘快门，并已集成进 gsplat（2025 年 4 月）。工程上，gsplat 的 rasterization() 接收任意的均值、四元数、尺度、不透明度和颜色，返回渲染颜色、alpha，以及可选的期望深度（render_mode=\"RGB+ED\"），并支持 antialiased 模式、2DGS 和多视角批量渲染。与锚点的联系：两篇锚点都没有开源。复现 Ha 的第一阶段时可以直接用 gsplat：按深度把每个像素反投影得到均值，旋转取单位四元数，尺度取与 d/f 同量级的值（论文只说投影覆盖单个像素，具体常数需自行标定），不透明度取 1，颜色取像素值，然后逐视角渲染到目标相机（render_mode=\"RGB+ED\" 同时得到颜色与期望深度），得到 𝓘_k、α_k、𝒟_k。注意 gsplat 默认 eps2d=0.3、rasterize_mode=\"classic\"，与原版 3DGS 的 dilation 行为一致。远程临场阵列常用卷帘快门相机（见 g-rig），而两篇锚点都假设针孔相机和全局快门，3DGUT 这类扩展提供了放宽这一假设的途径。"}], "equations": [{"tex": "\\boldsymbol{\\Sigma}_k=\\mathbf{R}_k\\mathbf{S}_k\\mathbf{S}_k^{\\top}\\mathbf{R}_k^{\\top},\\qquad \\boldsymbol{\\Sigma}^{2D}_k=\\big[\\mathbf{J}_k\\mathbf{W}\\boldsymbol{\\Sigma}_k\\mathbf{W}^{\\top}\\mathbf{J}_k^{\\top}\\big]_{2\\times 2}+s\\,\\mathbf{I}", "explain_zh": "3DGS 的协方差参数化与投影（EWA splatting）。Σ_k 是第 k 个高斯在世界坐标下的 3×3 协方差，由旋转 R_k（用四元数参数化）和对角尺度矩阵 S_k 组成，保证半正定；W 是世界到相机的旋转，即视图变换的线性部分；J_k 是透视投影在高斯中心处的雅可比，也就是局部仿射近似；[·]_{2×2} 表示取左上 2×2 块，得到屏幕空间协方差；s·I 是屏幕空间 dilation，原版实现中 s=0.3 px²（论文未写），Mip-Splatting 改用带幅度补偿的 2D Mip 滤波。例：Ha 的像素高斯取 S_k=σI、R_k=I，σ 与 d/f 同量级。若取 σ=d/f 且目标相机与源相机相同，投影后每轴标准差约 1 px，加上 dilation 后方差约为 1+0.3=1.3 px²；若观看者后退使深度翻倍、焦距不变，投影标准差降为 0.5 px（方差 0.25 px²），dilation 后变成 0.55 px²：峰值不变，积分（正比于峰值×√det Σ）却放大约 2.2 倍，这就是远处细结构“发亮变胖”的来源。"}, {"tex": "\\mathcal{G}_k^{\\mathrm{reg}}(\\mathbf{x})=\\sqrt{\\frac{|\\boldsymbol{\\Sigma}_k|}{\\big|\\boldsymbol{\\Sigma}_k+\\frac{s}{\\hat{\\nu}_k^{2}}\\mathbf{I}\\big|}}\\;\\exp\\!\\Big(-\\tfrac{1}{2}(\\mathbf{x}-\\mathbf{p}_k)^{\\top}\\big(\\boldsymbol{\\Sigma}_k+\\tfrac{s}{\\hat{\\nu}_k^{2}}\\mathbf{I}\\big)^{-1}(\\mathbf{x}-\\mathbf{p}_k)\\Big),\\qquad \\hat{\\nu}_k=\\max_{n=1,\\dots,N}\\Big(\\mathbb{1}_n(\\mathbf{p}_k)\\,\\frac{f_n}{d_n}\\Big)", "explain_zh": "Mip-Splatting 的 3D 平滑滤波。p_k 是高斯中心，Σ_k 是原协方差；ν̂_k 是该高斯在全部 N 个训练相机中的最大采样频率，f_n 是第 n 个相机的焦距（像素），d_n 是 p_k 在该相机下的深度，1_n(p_k) 表示 p_k 是否在第 n 个相机视锥内；(s/ν̂_k²)I 是各向同性低通滤波的方差，因为两个高斯卷积等于协方差相加；官方代码中附加标准差为 √0.2·d/f，即 s=0.2、附加方差为 0.2·(d/f)²（代码里 d 取所有可见相机中的最小深度、f 取全部相机中的最大焦距，是对 max f_n/d_n 的近似）；根号因子让高斯的积分保持不变（能量守恒）。例：f=1000 px、d=2 m 时 1/ν̂=2 mm，附加方差为 0.2×4 mm²=0.8 mm²。2D Mip 滤波的形式相同，只是在屏幕空间对 Σ^{2D} 加 sI，官方实现取 s=0.1 px²。"}, {"tex": "P(u,v)=\\mathbf{p}_k+s_u\\mathbf{t}_u\\,u+s_v\\mathbf{t}_v\\,v,\\qquad \\mathcal{L}=\\mathcal{L}_c+\\alpha\\sum_{i,j}\\omega_i\\omega_j\\,|z_i-z_j|+\\beta\\sum_i\\omega_i\\big(1-\\mathbf{n}_i^{\\top}\\mathbf{N}\\big)", "explain_zh": "2DGS 的面元参数化与训练损失。P(u,v) 是圆盘局部坐标 (u,v) 对应的 3D 点；p_k 是中心，t_u、t_v 是正交切向量，s_u、s_v 是两个方向的尺度，法线为 t_w=t_u×t_v；L_c 是 RGB 重建损失；ω_i 是射线与第 i 个圆盘交点的混合权重（α_i 乘以透射率）；z_i 是该交点的深度；第二项为深度畸变损失，惩罚同一射线上权重分散在不同深度；n_i 是第 i 个圆盘的法线，N 是由渲染深度图梯度估计的表面法线；第三项为法线一致性损失。α 在有界场景取 1000、无界场景取 100，β=0.05。例：一条射线上有两个交点，权重各 0.5，深度相差 1 cm（场景单位为米），则畸变项为 2×0.25×0.01=0.005，乘以 α=100 后为 0.5，会推动两个圆盘向同一深度靠拢。"}], "evolution": [{"year": 2001, "milestone_zh": "Zwicker et al. 的 EWA volume splatting 与 surface splatting（2001）给出椭圆高斯溅射的投影公式（JWΣWᵀJᵀ）和“重建核卷积低通滤波”的抗锯齿理论，是 3DGS 投影与屏幕空间滤波的源头"}, {"year": 2023, "milestone_zh": "3DGS（SIGGRAPH 2023）实现实时辐射场渲染；11–12 月 Mip-Splatting、SuGaR、LightGaussian、Scaffold-GS 相继挂出 arXiv；12 月发布 gsplat 数学补充"}, {"year": 2024, "milestone_zh": "StopThePop 与 2DGS（SIGGRAPH 2024）分别解决 popping 与几何精度；HAC（ECCV 2024）引入上下文熵编码；Mip-Splatting 获 CVPR 2024 最佳学生论文"}, {"year": 2024, "milestone_zh": "GOF、3DGRT（SIGGRAPH Asia 2024）；3DGS-MCMC、LightGaussian（NeurIPS 2024）：表面提取、光线追踪粒子、MCMC 致密化"}, {"year": 2025, "milestone_zh": "gsplat 发表于 JMLR；3DGUT（CVPR 2025）支持畸变相机与卷帘快门并并入 gsplat；Ha et al.（CVPR 2025）把原版 3DGS 光栅器用作逐视角前向 warping 算子；Quark 团队后续的 LVT、Fuse-and-Refine 改为 feed-forward 输出持久 3DGS"}, {"year": 2026, "milestone_zh": "面向远程临场的 Tele360、做语义编码传输的 GS-SCNet 把 feed-forward 3DGS 与实时推流、压缩结合；gsplat 加入 LiDAR 光栅化（3 月）、实验性 HiGS 推理路径（5 月）和稀疏光栅化（7 月）"}], "papers": [{"title": "3D Gaussian Splatting for Real-Time Radiance Field Rendering", "authors": "Bernhard Kerbl, Georgios Kopanas, Thomas Leimkühler, George Drettakis", "year": 2023, "venue": "ACM TOG 42(4) / SIGGRAPH 2023", "url": "https://arxiv.org/abs/2308.04079", "citations": 10484, "role_zh": "本专题所有扩展的出发点：各向异性 3D 高斯 + SH 颜色 + tile 排序光栅化 + 自适应致密化，1080p 实时渲染。Ha et al. 直接使用它的官方代码做前向 splat，Quark 在 T&T、Mip-NeRF360、Deep Blending、DL3DV 上都与 3DGS-30K 对比", "priority": "must"}, {"title": "Mip-Splatting: Alias-free 3D Gaussian Splatting", "authors": "Zehao Yu et al.", "year": 2024, "venue": "CVPR 2024（最佳学生论文）", "url": "https://arxiv.org/abs/2311.16493", "citations": 937, "role_zh": "用 Nyquist 采样定理分析 3DGS 的走样来源（缺少 3D 频率约束，以及只膨胀不补偿的 2D dilation），提出 3D 平滑滤波与 2D Mip 滤波；是理解 Ha 像素高斯尺度设定与其在观看距离变化时行为的钥匙", "priority": "must"}, {"title": "2D Gaussian Splatting for Geometrically Accurate Radiance Fields", "authors": "Binbin Huang et al.", "year": 2024, "venue": "SIGGRAPH 2024", "url": "https://arxiv.org/abs/2403.17888", "citations": 1641, "role_zh": "用有向 2D 高斯面元和射线-圆盘精确求交得到多视角一致的深度与法线，加入深度畸变和法线一致性损失；DTU Chamfer 0.80（3DGS 1.96）", "priority": "must"}, {"title": "gsplat: An Open-Source Library for Gaussian Splatting", "authors": "Vickie Ye et al.", "year": 2025, "venue": "JMLR 26(34)", "url": "https://arxiv.org/abs/2409.06765", "citations": 382, "role_zh": "PyTorch + CUDA 的开源高斯光栅化库，训练时间最多减少 10%、显存减到四分之一，集成 antialiased、2DGS、MCMC、3DGUT；是复现 Ha 前向 splat 阶段最方便的工具", "priority": "must"}, {"title": "StopThePop: Sorted Gaussian Splatting for View-Consistent Real-time Rendering", "authors": "Lukas Radl et al.", "year": 2024, "venue": "ACM TOG 43(4) / SIGGRAPH 2024", "url": "https://arxiv.org/abs/2402.00525", "citations": 167, "role_zh": "指出单一视空间深度排序导致 popping，用分层逐像素重排序以约 4% 的代价消除；有助于理解 Ha 为何拒绝多视角高斯一次性渲染（Z-fighting）", "priority": "should"}, {"title": "Scaffold-GS: Structured 3D Gaussians for View-Adaptive Rendering", "authors": "Tao Lu et al.", "year": 2024, "venue": "CVPR 2024", "url": "https://arxiv.org/abs/2312.00109", "citations": 978, "role_zh": "用锚点加小 MLP 按视角和距离即时生成神经高斯，减少冗余；后续 HAC 等压缩方法的基础结构", "priority": "should"}, {"title": "SuGaR: Surface-Aligned Gaussian Splatting for Efficient 3D Mesh Reconstruction and High-Quality Mesh Rendering", "authors": "Antoine Guédon, Vincent Lepetit", "year": 2024, "venue": "CVPR 2024", "url": "https://arxiv.org/abs/2311.12775", "citations": 959, "role_zh": "最早用正则让高斯贴合表面，再用 Poisson 重建快速提取可编辑网格，并可把高斯绑定到网格上联合优化", "priority": "should"}, {"title": "LightGaussian: Unbounded 3D Gaussian Compression with 15x Reduction and 200+ FPS", "authors": "Zhiwen Fan et al.", "year": 2024, "venue": "NeurIPS 2024", "url": "https://arxiv.org/abs/2311.17245", "citations": 663, "role_zh": "基于全局重要性剪枝，并结合 SH 蒸馏与向量量化，平均压缩 15 倍，FPS 从 144 提到 237", "priority": "should"}, {"title": "HAC: Hash-grid Assisted Context for 3D Gaussian Splatting Compression", "authors": "Yihang Chen et al.", "year": 2024, "venue": "ECCV 2024", "url": "https://arxiv.org/abs/2403.14530", "citations": 300, "role_zh": "在 Scaffold-GS 锚点上用二值化哈希网格建立上下文模型并做熵编码，体积比原版 3DGS 小 75 倍以上、比 Scaffold-GS 小 11 倍以上；是高斯表示走向可流式传输的代表性压缩工作", "priority": "should"}, {"title": "Gaussian Opacity Fields: Efficient Adaptive Surface Reconstruction in Unbounded Scenes", "authors": "Zehao Yu et al.", "year": 2024, "venue": "ACM TOG / SIGGRAPH Asia 2024", "url": "https://arxiv.org/abs/2404.10772", "citations": 350, "role_zh": "从射线追踪式体渲染定义高斯不透明度场，不经 TSDF 或 Poisson，直接用高斯诱导的四面体网格提取自适应表面", "priority": "optional"}, {"title": "3D Gaussian Splatting as Markov Chain Monte Carlo", "authors": "Shakiba Kheradmand et al.", "year": 2024, "venue": "NeurIPS 2024", "url": "https://arxiv.org/abs/2404.09591", "citations": 275, "role_zh": "把高斯更新看作 SGLD、把致密化改为重定位，去掉手工启发式，可精确控制高斯数量，对初始化鲁棒", "priority": "optional"}, {"title": "3D Gaussian Ray Tracing: Fast Tracing of Particle Scenes", "authors": "Nicolas Moenne-Loccoz et al.", "year": 2024, "venue": "ACM TOG / SIGGRAPH Asia 2024", "url": "https://arxiv.org/abs/2407.07090", "citations": 199, "role_zh": "用包围网格加 BVH 和硬件光追追踪高斯粒子，支持畸变相机、卷帘快门、反射、折射、阴影等二次光线，论文称相对光栅化代价不大", "priority": "optional"}, {"title": "EWA Volume Splatting", "authors": "Matthias Zwicker, Hanspeter Pfister, Jeroen van Baar, Markus Gross", "year": 2001, "venue": "IEEE Visualization 2001", "url": "https://www.cs.umd.edu/~zwicker/publications/EWAVolumeSplatting-VIS01.pdf", "citations": -1, "role_zh": "椭圆高斯核溅射与“重建核卷积低通核”的重采样滤波理论；3DGS 的投影协方差公式与 0.3 px² 低通膨胀、Mip-Splatting 的 2D 滤波都可以追溯到这里", "priority": "should"}, {"title": "3DGUT: Enabling Distorted Cameras and Secondary Rays in Gaussian Splatting", "authors": "Qi Wu, Janick Martinez Esturo, Ashkan Mirzaei, Nicolas Moenne-Loccoz, Zan Gojcic", "year": 2025, "venue": "CVPR 2025", "url": "https://arxiv.org/abs/2412.12507", "citations": 116, "role_zh": "用 unscented transform 代替 EWA 的一阶线性化投影，在光栅化框架内支持鱼眼等畸变相机与卷帘快门，并与 3DGRT 表示对齐以支持二次光线；已集成进 gsplat，是放宽锚点“针孔 + 全局快门”假设的直接工具", "priority": "optional"}], "prereqs": ["n-3dgs", "r-raster", "r-alpha", "f-image", "i-warping"], "relation_to_anchors_zh": "Ha et al.（Sec. 3.1 / A.3，实现上使用原版 3DGS 代码）用 3DGS 光栅器做“前向 warping”：K 个视角的每个像素按深度反投影成一个完全不透明、各向同性、在源图中投影覆盖单个像素的高斯，每个视角单独渲染到目标相机，得到 𝓘_k、α_k、𝒟_k（DyNeRF 1352×1014、K=4 时约 10 ms，每帧约 550 万个高斯）。读懂这一步需要本专题的四点。(a) 高斯大小与源相机的采样间隔 d/f 同量级，也就是 Mip-Splatting 中的 T̂=1/ν̂；原版光栅器还会给投影协方差加 0.3 px² 的 dilation，而且不做能量补偿。目标视角采样率与源视角不同时（观看者靠近或远离），就会出现 Mip-Splatting 分析过的模糊或走样；Ha 的测试视角都是阵列内留出的相机，几乎不会触发这个问题。(b) 作者拒绝 GPS-Gaussian、GS-LRM 式的“所有视角一次渲染”，理由是飞点、遮挡空洞与 Z-fighting（Sec. 3.1、Fig. 4）。3DGS 按每个高斯的单一深度排序，而来自不同视角、描述同一表面的高斯深度几乎相等，排序会在像素间和帧间翻转，这和 StopThePop 研究的 popping 同源。消融 No Blending 的 PSNR 为 24.64、STED 为 483.3，完整模型为 31.17、68.76。(c) 各向同性的解析尺度忽略表面倾斜，掠射角下会拉伸或出现空隙，而 2DGS 的有向面元正是为这个问题设计的。Ha 还称网络预测的高斯参数会收敛到常数，但只有 Fig. 10 的定性对比，没有消融表。(d) Ha 的 image-based TSDF（τ=0.02 m）与 2DGS 提网格所用的 TSDF 融合（截断 0.02，场景单位）原理相同，只是前者沿目标射线即时求值、不建体素网格。\nQuark 不使用高斯，而用逐目标视角的 LDM，但它在多个数据集上直接与 3DGS-30K 对比：T&T 23.60 对 23.14，Mip-NeRF360 26.60 对 27.21，Deep Blending 23.61 对 30.04，DL3DV 31.31 对 29.82。更关键的是，Quark 的表示用完即丢，每个目标视角都要完整运行一次网络，双目 HMD 或多观众时成本线性增长。团队后续的 LVT（2025）和 Fuse-and-Refine/SplatVoxel（2025）都改为输出持久 3DGS，这时抗锯齿（观看距离变化）、压缩（HAC 75×、LightGaussian 15×）、排序一致性（StopThePop）就成了真实系统必须处理的问题。锚点深读列出的相关工作 GS-SCNet（2026）和 D-FCGS（2025）（均非 Ha 团队的工作）处理的也正是高斯的压缩与传输，补上了两篇锚点都没有分析的带宽问题。", "debates_zh": ["3D 体积高斯还是 2D 面元：2DGS 几何明显更好（DTU Chamfer 0.80 对 1.96），但 Mip-NeRF 360 户外 PSNR 略低（24.34 对 24.64）。外观质量与几何精度之间是否存在根本性的权衡，仍有争议。", "光栅化近似还是光线追踪：StopThePop 以约 4% 的代价修正排序，3DGRT 则用硬件光追换来正确性和对通用相机的支持。对于实时远程临场，做到什么程度才算“足够正确”，还没有定论。", "预测参数还是解析设定：Ha 认为在稠密像素网格上，网络预测的高斯参数会收敛到常数，因此改用解析设定（只有 Fig. 10 的定性对比，无消融表）；GPS-Gaussian、pixelSplat 等 feed-forward 方法则预测全部参数。哪种做法更适合实时 IBR 仍不清楚。", "传输高斯还是传输视频：GS-SCNet 报告比 MV-HEVC + GPS-Gaussian 节省约 75% BD-rate；但直接传多视角视频、在接收端重建（Quark 与 Ha 的隐含选择）更简单，也能兼容现有编解码硬件。", "评测协议：抗锯齿的收益只在多尺度测试下才显现，单尺度 benchmark 的 PSNR 看不出差别。Mip-Splatting 为此专门设计了“单尺度训练、多尺度测试”协议，而远程临场论文几乎都不做这类测试。"], "open_questions_zh": ["逐帧 feed-forward 高斯怎样抗锯齿：ν̂ 由输入相机决定，观看者靠近显示屏时如何避免模糊或走样？能否把 Mip-Splatting 的 3D 滤波直接写进像素对齐高斯的解析尺度里？", "动态场景中的排序一致性：StopThePop 解决了视角旋转时的 popping，但逐帧重新生成的高斯排序在时间上是否稳定、该用什么指标度量（STED、flicker），还没有系统研究。", "feed-forward 能否做到表面对齐：像素对齐高斯能否直接预测 2DGS 式的有向面元和可靠法线，从而同时服务于渲染和 Ha 式的 TSDF 几何一致性？", "码率、质量与延迟如何联合优化：持久 3DGS 在远程临场中怎样做增量更新（只传变化的高斯），并用 MCMC 式预算控制高斯数量？", "非针孔相机与卷帘快门：3DGUT 在逐场景设定下解决了这个问题，那么 feed-forward 方法和实时相机阵列又该如何处理？"], "resources": [{"title": "gsplat 官方文档", "url": "https://docs.gsplat.studio/", "type": "code", "note_zh": "含 rasterization() API（eps2d、rasterize_mode、render_mode 等参数）、antialiased 模式、2DGS、MCMC 与 3DGUT 的示例，适合动手复现 Mip-Splatting 或 Ha 的像素高斯前向 splat"}, {"title": "Mathematical Supplement for the gsplat Library", "url": "https://arxiv.org/abs/2312.02121", "type": "tutorial", "note_zh": "自成体系地推导高斯光栅化的前向和反向计算，包括投影雅可比、2D 协方差和 alpha 混合的梯度，是读懂 3DGS 代码的最佳数学参考"}, {"title": "A Survey on 3D Gaussian Splatting（ACM Computing Surveys）", "url": "https://arxiv.org/abs/2401.03890", "type": "paper", "note_zh": "Chen 与 Wang 的 3DGS 综述（已被 ACM Computing Surveys 接收），按抗锯齿、几何、压缩、动态等方向分类整理，并附 GitHub 论文列表（Awesome3DGS）和 benchmark 汇总（3DGS-Benchmarks）"}, {"title": "Mip-Splatting 官方代码", "url": "https://github.com/autonomousvision/mip-splatting", "type": "code", "note_zh": "scene/gaussian_model.py 中的 compute_3D_filter 给出 3D 滤波的具体实现（附加标准差 √0.2·d/f，即方差 0.2·(d/f)²），arguments 中 kernel_size=0.1 是 2D Mip 滤波的方差，可以对照公式逐行阅读"}]}, {"id": "a-layered-nvs", "title_zh": "学习式分层表示：从 Stereo Magnification 到 Quark", "title_en": "Learned layered representations: Stereo Magnification to Quark", "overview_zh": "分层表示针对这样一个问题：只有少量已标定图像时，怎样得到一个实时可渲染的三维中间表示，同时还要处理好遮挡边界、半透明和被遮挡内容。单张深度图（见 i-warping）每个像素只有一个深度，warp 到新视角后，前景边缘会出现飞点，背景里会露出空洞。分层表示把场景切成若干张带 alpha 的图层，渲染时只需把每层 warp 到新视角，再从后往前做 over 合成（见 r-alpha、i-layered）；遮挡、半透明这些难点都交给一个 2D 网络去预测图层内容。本专题讲的是学习式分层表示：网络跨场景训练，推理时从输入图像经一次前向（或几次迭代）直接预测图层，不做逐场景优化。其中从 MPI、DeepView、Immersive Light Field Video 到 Quark 这条主干，主要由 Google 的同一批作者（Flynn、Tucker、Snavely、Broxton、Overbeck 等）推动。\n\n2018–2019 年的奠基工作确立了三个核心构件。第一个是 Stereo Magnification（Zhou et al., SIGGRAPH 2018）提出的多平面图像 MPI：在参考相机视锥内放置 D=32 个前平行平面，在视差（逆深度）上等间隔分布，近平面 1 m、远平面 100 m。网络的输入是参考图 I_1，加上第二张图在这些平面上的平面扫描体（PSV），共 H×W×3(D+1) 个通道；输出是每层的 alpha、每层的混合权重和一张全局背景图，每层颜色由参考图与背景图逐像素加权得到。训练数据是用 ORB-SLAM2 跟踪 YouTube 房产视频的相机、再筛选出的约 7000 个片段（约 75 万帧），即后来的 RealEstate10K。第二个是 LLFF（Mildenhall et al., SIGGRAPH 2019）：它把每张输入图都扩展成一个局部 MPI（参考视角与 4 个近邻共 5 个视角的 PSV 送入 3D CNN，每个体素输出 1 个 alpha 和 5 路和为 1 的颜色选择权重），渲染时按累积 alpha 调制的权重融合相邻的 MPI。它还从全光采样理论推出，只要相邻视角之间最近点的最大视差不超过 min(D, W/2) 像素即可，二维视角采样因此可比 Nyquist 少 D² 倍（D=64 时约 4000 倍）。第三个是 DeepView（Flynn et al., CVPR 2019），它把求解 MPI 写成 learned gradient descent：把当前 MPI 渲染回每个输入视角，把输入 PSV、渲染 PSV、累积 over 和净透射率这几个梯度分量交给更新 CNN，跨视角用 max-pool 聚合，共迭代 3 次。DeepView 同时发布了 16 相机、100 个场景的 Spaces 数据集；处理 4 张输入在 P100 上约需 50 s。\n\nMPI 的通病有三个：层数多，大部分体素是透明的，视点偏离参考视角后会露出“纸片感”。2020–2023 年的改进沿三个方向展开。第一个方向是换几何形状：MatryODShka（ECCV 2020）把 ODS 立体全景转成 32 层同心球面（MSI，半径 1–100 m），在 640×320 下推理 alpha 与混合权重，用 GPU 联合双边上采样把 alpha 对齐到 4K×2K 原图，颜色直接取原图；MSI 推理 30 Hz，笔记本 GPU 上渲染 60 Hz 以上。Immersive Light Field Video（SIGGRAPH 2020）用直径 92 cm 半球上的 46 台同步相机采集，以 DeepView 式方法求解多球壳 MSI，再把大量球壳层压缩成少量 RGBA+depth 层（layered mesh），经纹理图集与视频编码后可以在网页浏览器和移动 VR/AR 设备上播放。第二个方向是让层贴合表面：StereoLayers（CVPR 2022）从一对立体图分两阶段推断少量随场景自适应的非平面层（先几何，后颜色与透明度）；SIMPLI（WACV 2023）先预测 P=40 个平面，再用注意力池化把它们合并成 L=4 或 8 个带逐像素深度的层，并反复把表示投影回源视角、比较差异，做前馈的误差校正。第三个方向是视角相关外观：NeX（CVPR 2021）把每层每像素的颜色写成神经基函数的线性组合，但需要逐场景优化。此外，Pushing the Boundaries（CVPR 2019）证明 MPI 可渲染的视角范围随视差采样频率线性增长；Single-view MPI（CVPR 2020）把 MPI 推广到单图输入。\n\nQuark（Flynn et al., SIGGRAPH Asia 2024）把这条线上的部件组装成了一个实时系统。表示方面，它用目标视角对齐的分层深度图（LDM）取代 MPI：每层有逐像素深度（限制在各自的等视差带内）、density，以及对 M=8 个输入视角的 blend weights；LDM 每帧、每个目标视角重新生成，用完即丢弃。求解方面，它把 DeepView 的 render-and-refine 嵌入 UNet 式多尺度结构，共 5 次 Update & Fuse，从 24 层×36×64 逐级升到 6 层×288×512，层数靠 layer collapse 减半；跨视角聚合也从 max-pool 换成了 One-to-many attention。输出方面，它沿用 LLFF 和 MatryODShka 的思路，即低分辨率求几何、用全分辨率输入像素着色：先把未激活的层属性双线性上采样 3.75 倍，再施加激活函数，最后用 CUDA IBR 渲染器合成（1080p 约 1.3 ms）。在 8 路输入下，Quark 在单张 A100 上重建加渲染合计达到 1080p/30 fps；在同一硬件上重测的 SIMPLI 需要 4.4 s，DeepView 原文报告约 50 s（P100，4 路输入）。\n\n截至 2026-09，据我们检索，Quark 仍是学习式分层加 IBR 路线在质量与速度上的代表作，但代码未开源，而且研究重心已经转移。Quark 团队自己的 LVT（SIGGRAPH Asia 2025）与 Fuse-and-Refine（NeurIPS 2025）把输出换成了一次重建、多次渲染的 3DGS；Online Neural Space Time Memory（2026）用 test-time training 记忆保存长时历史，补的正是 Quark 缺失的时间维度。MPI 本身只在移动端轻量化等方向还有新工作，例如 2026 年 6 月的可微 MPI 轻量 NVS（用几何基础模型预测的点图初始化 MPI，再做可微优化，并用单步扩散补洞）。不过，分层表示留下的设计原则仍是理解 Quark 的钥匙：以目标或参考视角为中心，用少量深度可学习的层，颜色直接取自输入像素，并迭代地把结果渲染回输入视角再做修正。Ha et al. 虽然没有使用分层表示，但它的流程（逐视角前向 warp，按累积 alpha 与学习到的权重融合，再用背景图补洞）几乎逐项对应 LLFF 的多 MPI 融合公式和 Stereo Magnification 的背景图设计。", "key_ideas": [{"name_zh": "颜色参数化：从“参考图 + 背景图”到 M 路 blend weights", "explain_zh": "直觉：如果让网络为 D 层各输出一张完整的 RGBA，输出量是 W·H·4D，而且网络得自己把每层的颜色“画”出来，结果容易发糊。Stereo Magnification 注意到，场景颜色大多可以从两张图里挑出来：参考图 I_1 提供前景，网络预测的背景图 Î_b 提供被前景挡住的内容。这样每层只需预测一张 alpha 和一张混合权重 w_d（再加一张共享的 3 通道背景图），输出量降为 W·H·(2D+3)。数值例子：1024×576、D=32 时，直接预测约需 7550 万个输出（589,824×128），换成这种参数化后约 3950 万个（589,824×67），几乎减半，纹理细节也直接来自真实像素。LLFF 更进一步，把两张图换成 5 个视角的 PSV，每个 MPI 体素输出 5 个和为 1 的颜色选择权重；这样一来，参考视角看不到、但其他视角看得到的内容也能取到。Quark 把这一思路推到了头：LDM 每层每个像素存 M=8 维 blend weights，softmax 推迟到上采样之后再做；颜色按该层深度从全分辨率输入图重投影取得。它的消融（以半分辨率训练 250K 步的 Quark+ 为基线，在 DL3DV 上以 1080p 评测）显示，把 IBR 输出换成直接回归 RGB，PSNR 从 30.41 降到 29.18，LPIPS 从 0.154 升到 0.179，是所有消融中退化最大的一项。与锚点的联系：Ha et al. 的 U-Net 同样只输出 K 个逐像素权重 w_k（外加一个背景权重 w_BG 和一张背景图 I_BG），颜色全部来自前向 splat 得到的真实像素。它的 I_BG 与 Stereo Magnification 的 Î_b 作用相同，都用来给前景挡住、在新视角里露出来的区域提供颜色。"}, {"name_zh": "采样定理：需要多少层？Quark 为何“升分辨率、降层数”", "explain_zh": "直觉：固定平面的 MPI 本质上是在视差上做离散采样。新视角相对参考视角移动时，同一平面上的点整体平移；而位于两个平面之间的真实表面会被劈成两份，产生重影或层状伪影。LLFF 给出的界是：相邻输入视角之间，最近场景点的最大像素视差 d_max = f·Δu / z_min 不能超过 min(D, W/2)。其中 f 是以像素为单位的焦距，Δu 是相机间距，z_min 是最近深度，D 是平面数，W 是图像宽度。数值例子（参数为假设值）：f=1000 px、z_min=1 m、Δu=10 cm 时 d_max=100 px。D=32 的 MPI 不够用，要么增加到约 100 层，要么把相机间距缩小到 3.2 cm。DeepView 在 Spaces 的 4 视角实验中（相机间距约 10 cm，近平面 0.7 m）训练时用 64 个平面、推理时用 80 个平面，与这个量级吻合。下面用同样的思路对 Quark 做数量级估算（注意：LLFF 的界针对相邻输入视角；Quark 的 LDM 对齐到目标视角，相关的是目标视角与各输入视角之间的视差，量级相同）。Quark 的输入相机间距最大约 30 cm，同样假设下，1080p 分辨率的视差可达 300 px。它的对策是按分辨率分配层数。在 36×64 的粗网格上（约为 1080p 的 1/30），300 px 视差只相当于约 10 个粗像素，24 层足以让每个视差带窄于半个粗像素，基本满足采样条件。到 288×512（1/3.75）时，视差约 80 px，只剩 6 层，每层的视差带约 13 px。此时层已经不是平面，而是带逐像素深度的 LDM 层，可以在视差带内移动去贴住表面，因此不再受平面采样界的约束。这就是 Quark “升分辨率、降层数”在数量级上的依据。消融显示，去掉 layer collapse（即不减层）后 PSNR 只升高 0.16 dB，运行时间却增加 115%。"}, {"name_zh": "Learned gradient descent：把“渲染回输入、比较、修正”交给网络", "explain_zh": "直觉：如果手里是真实的 MPI，把它渲染到每个输入视角，应当能精确复现输入图像，所以渲染结果与输入的残差指出了哪里有错。经典做法是定义一个损失，再对 MPI 做梯度下降，往往需要成百上千步。DeepView 用 learned gradient descent（LGD）：每一步仍然计算梯度所需的原料，但由 CNN 决定怎样更新，因此 3 步就够。它推导出，无论用什么损失，关于 MPI 的梯度都只依赖四样东西：输入图像的 PSV、当前渲染图的 PSV、每层的累积 over（该层身后所有层合成的颜色），以及净透射率（该层身前所有层的 Π(1−α)）。净透射率就是可见性信号：某个位置在某视角的透射率接近 0，说明它被前景挡住了，网络据此学会在这个视角忽略它。DeepView 在 Spaces 上的消融（512×300、20 个平面的缩小设置）数据如下：迭代 1、2、3、4 次时 SSIM 依次为 0.8968、0.9417、0.9445、0.9461；完全不提供梯度分量时降到 0.9075；改喂真正的 L2 梯度时只有 0.9389，不如直接喂原始分量（0.9446）。与锚点的联系：Quark 的 5 次 Update & Fuse 直接继承自 DeepView 的 LGD。每一次都把当前 LDM 双线性 splat 到各输入视角并做 over 合成，得到渲染图 Ĩ；Update Block 再从 Ĩ、输入特征和射线编码中提取“渲染与观测不符”的残差线索，按当前深度反投影回层空间。消融中把 Ĩ 置零，PSNR 从 30.41 降到 29.71；而去掉前两次迭代只损失约 0.08 dB，速度却快了 17%，说明在多尺度结构下迭代次数仍有压缩空间。Ha et al. 则完全不迭代：几何来自外部立体深度与 TSDF 融合，网络只做一次前向融合。"}, {"name_zh": "从平面到可变形层：MSI、layered mesh、MLI 与 LDM 的深度参数化", "explain_zh": "直觉：大多数像素在大多数层里都是透明的；如果把层“弯”到物体表面上，用很少的层就能达到同样的深度精度。这方面有三种做法。第一种是 Immersive Light Field Video：先求稠密的多球壳 MSI，再离线把大量球壳层压成少量 RGBA+depth 层（layered mesh），方便视频编码。第二种是 SIMPLI：在网络内部完成平面到层的转换，以 L 个锚点沿 P=40 个平面的方向做注意力池化，把平面分成 L 组；再沿平面方向用自注意力预测每个平面的逐像素不透明度，在每组相邻平面内 over 合成出该层的深度，最终只剩 4 或 8 层。第三种是 Quark：直接预测 LDM，并规定共 L 层中的第 ℓ 层只能在自己的视差带内移动。锚点取 δ=(ℓ−0.5)/L，深度为 d_ℓ = 1 / [(δ + (0.5/L)·tanh(V·W_d))·(1/z_near − 1/z_far) + 1/z_far]，其中 V 是该层该像素的特征，W_d 是线性投影。原文把近、远平面记为 η 和 f，这里的 f 指远平面，不是焦距。数值例子：取 z_near=1 m、z_far=100 m、L=6，最近一层（ℓ=6）的视差带为 [0.835, 1.0] m⁻¹，对应深度 1.0–1.2 m；最远一层（ℓ=1）的视差带为 [0.01, 0.175] m⁻¹，对应深度 5.7–100 m。tanh 保证层不会越出各自的视差带，也避免多层挤到同一深度。Layer collapse 用残差 MLP 合并相邻两层：直通支路取两层的均值，残差支路取两层的拼接，层数由 24 减到 12 再减到 6。代价是近/远平面要按 SfM 点逐场景设定；如果设错，落在 [z_near, z_far] 之外的表面只能被挤到最近或最远的层上，视差出错，锚点深读认为这种情况下方法会直接失效。"}, {"name_zh": "低分辨率几何、全分辨率像素：post-activation 上采样", "explain_zh": "直觉：几何量（深度、alpha、混合权重）在空间上大多是平滑的，只在遮挡边界处突变；纹理则需要全分辨率。所以可以在低分辨率上求几何，再用原图着色。MatryODShka 在 640×320 上推理 32 层的 alpha 与混合权重，用 GPU 联合双边上采样对齐到 4K×2K 的原图，MSI 推理 30 Hz。Quark 在 288×512 上求出 6 层 LDM，先把未激活的 depth、density、blend logits 双线性上采样 3.75 倍，再施加 sigmoid、tanh、softmax。这种“先插值后激活”的做法借鉴自 ReLU Fields。举个例子：两个相邻低分辨率像素（上采样后相距约 3.75 个输出像素）的 density logit 分别为 −6 和 +6。如果先激活再插值，就是在 0.0025 与 0.9975 之间线性插值，α 落在 0.1–0.9 之间的过渡区约占这段距离的 80%（约 3 个输出像素），形成一条半透明的软边；如果先插值 logit 再过 sigmoid，只有 logit 落在 ±2.2 之间的约 37%（约 1.4 个输出像素）处于 0.1–0.9，边界明显更锐利。这种做法的代价在 Quark 的表 1 里一目了然：1024×768 与 2048×1536 的运行时间几乎相同（32.2 ms 对 33.0 ms），但 Shiny 上的 LPIPS 从 0.108 升到了 0.174。这说明 2K 输出中的高频细节来自输入像素，几何分辨率并没有提高。"}, {"name_zh": "跨视角聚合：从 PSV 拼接、max-pool 到 One-to-many attention", "explain_zh": "直觉：网络需要比较同一个 3D 位置在各输入视角中的样子（各视角一致，就可能是表面），并且结果最好不随输入视角的数量和顺序而变。Stereo Magnification 只处理两张图，直接在通道维上拼接 PSV；LLFF 拼接 5 个 PSV，输入视角的数量和顺序都被固定死了；DeepView 对每个视角用共享的 CNN，再跨视角做 max-pool，与顺序无关，但论文承认其实现仍只能针对固定的输入数训练。Quark 用 One-to-many attention：以层空间特征 V 作为唯一的 query，对 M 个视角反投影得到的 Δ 做 cross-attention。因为 query 只有一个，可以把 W^K 折叠进 W^Q、把 W^V 折叠进 W^O，完全省掉对 M 个 Δ 的 K/V 投影。在 h=4 头时，输入数从 4 增加到 64，标准注意力的开销涨 13.0 倍，这种写法只涨 1.9 倍。消融中去掉 cross-attention（keys 置零，退化为取均值），PSNR 从 30.41 降到 29.73。与锚点的联系：Ha et al. 的 4 层 U-Net 按通道拼接 K 个视角的 RGB（3K）、splat 深度（K）、累积 alpha（K）、4 组相机特征（4K），再加 1 张 TSDF 深度，共 9K+1 个通道。它与 LLFF 一样依赖视角顺序，K 也是固定的。改用 Quark 式的注意力是一个明显的改进方向（见 anchor_compare 的互补性分析）。"}, {"name_zh": "对齐到谁：参考视角 MPI、多 MPI 融合与目标视角 LDM", "explain_zh": "直觉：分层表示总要对齐到某个相机的视锥。对齐到参考视角时（Stereo Magnification、DeepView），推理一次就能渲染多个新视角，但新视角离参考视角越远，层状结构越明显。LLFF 为每个输入视角各建一个 MPI，渲染时取最近 5 个 MPI（不规则采样时）或最近 4 个 MPI（规则网格时，双线性插值）的渲染结果，用距离权重乘以累积 alpha 来融合；某个 MPI 看不到的区域累积 alpha 很小，会自动让位给其他 MPI。Quark 则把层对齐到目标视角，每个目标视角重建一次。这样几何与混合权重可以专门为这个视角“过拟合”，从而近似复现反射和折射，也不再有离参考视角太远的问题；代价是双目头显要推理两次，观看者越多，计算量线性增长。与锚点的联系：Ha et al. 走的是 LLFF 的路子，只是把“每个输入视角一个 MPI”换成了“每个输入视角一层像素高斯”。K 个视角各自前向 splat 到目标相机，得到 𝓘_k 和 α_k，再按 I_FG = Σ_k 𝓘_k α_k w_k / Σ_k α_k w_k 融合。这与 LLFF 的式 (8) 形式完全一致，区别只是 w_k 由网络逐像素预测。Ha 的消融中换成按相机距离加权（Buehler / LLFF 式的手工权重）后，PSNR 从 31.17 降到 26.08，STED 从 68.76 升到 235.3。"}], "equations": [{"tex": "C_{\\ell}(\\mathbf{x})=\\sum_{m=1}^{M}\\beta_{\\ell,m}(\\mathbf{x})\\,I_m\\big(\\pi_m(\\mathbf{X}_{\\ell}(\\mathbf{x}))\\big),\\quad \\sum_{m=1}^{M}\\beta_{\\ell,m}(\\mathbf{x})=1,\\qquad \\hat{I}(\\mathbf{x})=\\sum_{\\ell=1}^{L}C_{\\ell}(\\mathbf{x})\\,\\alpha_{\\ell}(\\mathbf{x})\\prod_{j=\\ell+1}^{L}\\big(1-\\alpha_{j}(\\mathbf{x})\\big)", "explain_zh": "分层 IBR 的统一写法。x 是目标（或参考）视角的像素；ℓ=1…L 是层编号，1 最远，L 最近；X_ℓ(x) 是像素 x 的射线与第 ℓ 层的交点，在 MPI 中是固定深度平面上的点，在 Quark 的 LDM 中是该层逐像素深度 d_ℓ 对应的点；π_m 把 3D 点投影到第 m 个输入视角（共 M 个）；I_m(·) 是在投影位置双线性插值得到的输入颜色；β_{ℓ,m} 是混合权重，和为 1；C_ℓ 是第 ℓ 层的颜色；α_ℓ 是该层的不透明度（Quark 中为 density σ）。后一个式子是从后到前的 over 合成。几个特例：Stereo Magnification 中 M=2，两个“输入”分别是参考图 I_1 和预测的背景图 Î_b，它们都已在参考视角中，π_m 为恒等映射，β=(w_d, 1−w_d)；LLFF 中 M=5（每个体素对 5 个视角的 PSV 颜色加权）；Quark 中 M=8，β 由最后一个 One-to-many attention 产生，并且在上采样之后才做 softmax。例：某层某像素的 β=(0.7, 0.3)，两个视角取到的颜色为 (200,100,50) 和 (180,110,60)，则 C=(194,103,53)。若该层 α=0.8，它前面只有一层且 α=0.25，那么它对最终像素的贡献是 0.8×0.75=0.6 倍的 C。"}, {"tex": "\\mathcal{M}_{n+1}=\\mathcal{M}_{n}+N_{\\omega}^{(n)}\\big(\\nabla_{n,1},\\dots,\\nabla_{n,K},\\mathcal{M}_{n}\\big),\\quad \\nabla_{n,k}=\\mathcal{W}_{k}^{-1}\\big([\\,I_{k}^{\\uparrow},\\ \\tilde{I}_{k}^{\\uparrow},\\ A_{k},\\ T_{k}\\,]\\big),\\qquad \\frac{\\partial\\mathcal{O}}{\\partial c_{d}}=\\prod_{i=d+1}^{D}(1-\\alpha_{i})", "explain_zh": "DeepView 的 learned gradient descent（记号略作简化）。M_n 是第 n 次迭代的 MPI（D 个 RGBA 平面）；N_ω^{(n)} 是第 n 步的更新 CNN，每一步的权重不同，输出对 MPI 的增量；K 是输入视角数；W_k 把 MPI 各平面 warp 到第 k 个输入视角，W_k^{-1} 是反向 warp，回到 MPI 的平面扫描坐标；I_k^↑ 是把输入图沿深度方向复制成的 3D 张量，所以 W_k^{-1}(I_k^↑) 就是熟悉的 PSV；Ĩ_k 是当前 MPI 渲染到视角 k 的图像；A_k 是累积 over，即第 d 层身后所有层合成出的颜色；T_k 是净透射率；方括号表示按通道拼接。最后一个式子是 over 算子 O 对第 d 层颜色的导数。注意 DeepView 用的是预乘 alpha 的颜色（c_d 已经乘过 α_d，O=Σ_d c_d Π_{i>d}(1−α_i)），所以导数里没有 α_d，恰好等于该层前方所有层透射率的乘积，这正是 T_k 的来源。例：3 层从远到近 α=(1, 0.5, 0.8)，第 2 层的净透射率为 1−0.8=0.2，即第 2 层的（预乘）颜色改变 Δc 时，该视角的渲染只改变 0.2·Δc。网络看到这个 0.2，就知道这个视角对第 2 层的约束很弱，应更多依靠其他视角。DeepView 共迭代 3 次；初始化步等价于从全透明 MPI 出发的一次更新，只输入 PSV。"}, {"tex": "C_{t}=\\frac{\\sum_{k}w_{t,k}\\,\\alpha_{t,k}\\,C_{t,k}}{\\sum_{k}w_{t,k}\\,\\alpha_{t,k}},\\qquad w_{t,k}\\propto\\exp\\!\\big(-\\gamma\\,\\ell(\\mathbf{p}_t,\\mathbf{p}_k)\\big),\\qquad \\gamma=\\frac{f}{D\\,z_{\\min}}", "explain_zh": "LLFF 的多 MPI 融合（论文式 (8)）。t 表示目标相机；k 遍历参与融合的近邻 MPI，不规则采样时取最近 5 个；C_{t,k} 和 α_{t,k} 是第 k 个 MPI 渲染到目标相机得到的颜色和累积 alpha；w_{t,k} 是随相机距离衰减的标量权重；ℓ(p_t, p_k) 是两个相机位置之间的 L2 距离；γ=f/(D·z_min) 把这个距离换算成以平面数为单位的像素视差，其中 f 是像素焦距，D 是平面数，z_min 是最近深度。乘以 α_{t,k} 的作用是：某个 MPI 在该像素处是空洞（α 小）时，自动把权重让给其他 MPI。例：两个 MPI 在同一像素分别给出红色 (255,0,0)、α=1，和蓝色 (0,0,255)、α=0.1（空洞），距离权重为 w=(0.3, 0.7)。按上式，分子为 (76.5, 0, 17.9)，分母为 0.37，结果约为 (207, 0, 48)，以可见的红色为主。如果不乘 α，直接按 w 平均，结果是 (76.5, 0, 178.5)，空洞里的错误颜色反而占了上风。Ha et al. 的 I_FG = Σ_k 𝓘_k α_k w_k / Σ_k α_k w_k 与此式形式相同，只是 w_k 由 U-Net 逐像素预测；它的 Distance-based Blending 消融相当于使用这种手工距离权重，PSNR 为 26.08，完整模型为 31.17。"}], "evolution": [{"year": 1998, "milestone_zh": "Shade et al. 提出分层深度图像 LDI：每个像素沿视线存储多个（颜色，深度）样本，是所有分层表示的前身"}, {"year": 2016, "milestone_zh": "DeepStereo（Flynn et al., CVPR 2016）首次用深度网络从 PSV 直接合成新视角：使用 96 个深度平面，选择塔输出沿深度的 softmax 概率，颜色塔输出每个平面的颜色；在多核工作站上渲染一张 512×512 的图约需 12 分钟"}, {"year": 2017, "milestone_zh": "Soft3D（Penner & Zhang, SIGGRAPH Asia 2017）用软可见性体积做视图合成，后来成为 DeepView 的主要对比基线"}, {"year": 2018, "milestone_zh": "Stereo Magnification 提出 MPI（32 层，1–100 m 内按视差等间隔分布），以及 RealEstate10K 的 YouTube 数据挖掘流程"}, {"year": 2019, "milestone_zh": "LLFF（局部 MPI、采样界、按累积 alpha 融合）、DeepView（learned gradient descent 与 Spaces 数据集）和 Pushing the Boundaries（视差采样频率与可外推范围的关系）相继发表"}, {"year": 2020, "milestone_zh": "MatryODShka（32 层 MSI，推理 30 Hz）、Immersive Light Field Video（46 台相机，MSI 转为 layered mesh 后以视频流播放）和 Single-view MPI 发表"}, {"year": 2021, "milestone_zh": "NeX 用神经基函数为 MPI 加入视角相关外观，并发布 Shiny 数据集，该数据集后来被 Quark 用于训练与评测"}, {"year": 2022, "milestone_zh": "StereoLayers（CVPR 2022）用少量随场景自适应的非平面层代替等间隔平面，并发布 SWORD 数据集；SIMPLI（arXiv 2022-10，WACV 2023）通过 planes-to-layers 转换和前馈误差校正得到 4 或 8 层的多层图像"}, {"year": 2024, "milestone_zh": "Quark 结合目标视角 LDM、多尺度 render-and-refine 和 One-to-many attention，在 A100 上实现 1080p/30 fps"}, {"year": 2025, "milestone_zh": "Quark 团队转向持久的 3DGS 表示：LVT（SIGGRAPH Asia 2025）和 Fuse-and-Refine（NeurIPS 2025，原名 SplatVoxel）"}, {"year": 2026, "milestone_zh": "Online Neural Space Time Memory 用 TTT 记忆做在线动态 NVS；MPI 在移动端轻量 NVS 方向仍有新工作（可微 MPI，arXiv 2606.02068，属于逐场景优化而非前馈）"}], "papers": [{"title": "Stereo Magnification: Learning View Synthesis using Multiplane Images", "authors": "Tinghui Zhou, Richard Tucker, John Flynn, Graham Fyffe, Noah Snavely", "year": 2018, "venue": "ACM TOG 37(4) / SIGGRAPH 2018", "url": "https://arxiv.org/abs/1805.09817", "citations": 436, "role_zh": "提出 MPI（32 个在视差上等间隔的 RGBA 平面），以“参考图 + 预测背景图 + 每层混合权重”的方式参数化颜色；用 ORB-SLAM2 从 YouTube 视频挖出训练数据，即后来的 RealEstate10K", "priority": "must"}, {"title": "DeepView: View Synthesis with Learned Gradient Descent", "authors": "John Flynn, Michael Broxton, Paul Debevec, Matthew DuVall, Graham Fyffe, Ryan Overbeck, Noah Snavely, Richard Tucker", "year": 2019, "venue": "CVPR 2019", "url": "https://arxiv.org/abs/1906.07316", "citations": 493, "role_zh": "用 learned gradient descent 求解 MPI，推导出以净透射率和累积 over 为核心的梯度分量，跨视角用 max-pool 聚合；发布 Spaces 数据集。它是 Quark 中 render-and-refine 的直接来源", "priority": "must"}, {"title": "Local Light Field Fusion: Practical View Synthesis with Prescriptive Sampling Guidelines", "authors": "Ben Mildenhall et al.", "year": 2019, "venue": "ACM TOG 38(4) / SIGGRAPH 2019", "url": "https://arxiv.org/abs/1905.00889", "citations": 1331, "role_zh": "把每个输入视角扩展成局部 MPI，用 5 路颜色选择权重着色；推出相邻视角视差不超过 min(D, W/2) 的采样界；提出按累积 alpha 调制权重来融合多个 MPI（式 (8)，形式与 Ha 的 I_FG 相同）；其前向场景数据即 RFF", "priority": "must"}, {"title": "Quark: Real-time, High-resolution, and General Neural View Synthesis", "authors": "John Flynn, Michael Broxton, Lukas Murmann et al.", "year": 2024, "venue": "ACM TOG 43(6) / SIGGRAPH Asia 2024", "url": "https://arxiv.org/abs/2411.16680", "citations": 21, "role_zh": "锚点论文 A。结合目标视角 LDM、UNet 式多尺度 render-and-refine、layer collapse、One-to-many attention 和 IBR 着色，在单张 A100 上以 8 路输入达到 1080p/30 fps", "priority": "must"}, {"title": "Immersive Light Field Video with a Layered Mesh Representation", "authors": "Michael Broxton et al.", "year": 2020, "venue": "ACM TOG 39(4) / SIGGRAPH 2020", "url": "https://augmentedperception.github.io/deepviewvideo/", "citations": 336, "role_zh": "用 46 台同步相机、以 DeepView 式方法求解多球壳 MSI，再压缩为少量 RGBA+depth 层（layered mesh），经纹理图集和视频编码实现可在浏览器和移动 VR/AR 上播放的 6DoF 光场视频；是 LDM 的直接前身", "priority": "should"}, {"title": "Self-improving Multiplane-to-layer Images for Novel View Synthesis", "authors": "Pavel Solovev, Taras Khakhulin, Denis Korzhenkov et al.", "year": 2023, "venue": "WACV 2023", "url": "https://arxiv.org/abs/2210.01602", "citations": 12, "role_zh": "SIMPLI：在网络内部用注意力池化把 40 个平面合并为 4 或 8 个层，并反复投影回源视角做前馈误差校正；是 Quark 最接近的基线（Quark 在同一 A100 上测得每帧 4.4 s）", "priority": "should"}, {"title": "MatryODShka: Real-time 6DoF Video View Synthesis using Multi-Sphere Images", "authors": "Benjamin Attal, Selena Ling, Aaron Gokaslan, Christian Richardt, James Tompkin", "year": 2020, "venue": "ECCV 2020", "url": "https://arxiv.org/abs/2008.06534", "citations": 116, "role_zh": "把 ODS 立体全景转成 32 层 MSI，在 640×320 下推理、用 4K×2K 原图着色并联合双边上采样 alpha，MSI 推理 30 Hz、VR 中实时渲染；是“低分辨率几何 + 全分辨率像素”思路的早期实时实现", "priority": "should"}, {"title": "Pushing the Boundaries of View Extrapolation with Multiplane Images", "authors": "Pratul P. Srinivasan, Richard Tucker, Jonathan T. Barron, Ravi Ramamoorthi, Ren Ng, Noah Snavely", "year": 2019, "venue": "CVPR 2019 (Oral)", "url": "https://arxiv.org/abs/1905.00413", "citations": 356, "role_zh": "证明 MPI 可渲染的视角范围随视差采样频率线性增长；借助 3D CNN 和随机分辨率训练，理论上把可外推的横向视点移动提高到先前工作的 4 倍，并约束被遮挡内容只能取自同一深度或更深处的可见内容", "priority": "should"}, {"title": "Stereo Magnification with Multi-Layer Images", "authors": "Taras Khakhulin, Denis Korzhenkov, Pavel Solovev et al.", "year": 2022, "venue": "CVPR 2022", "url": "https://arxiv.org/abs/2201.05023", "citations": 19, "role_zh": "StereoLayers：从立体图对分两阶段先推断少量随场景自适应的非平面层的几何，再推断颜色和透明度；发布 SWORD 数据集，该数据集被 SIMPLI 和 Quark 用于训练", "priority": "optional"}, {"title": "Single-View View Synthesis with Multiplane Images", "authors": "Richard Tucker, Noah Snavely", "year": 2020, "venue": "CVPR 2020", "url": "https://arxiv.org/abs/2004.11364", "citations": 413, "role_zh": "从单张图预测 MPI，提出尺度不变的视图合成监督，使模型可以在尺度未知的在线视频上训练；并展示了背景层怎样学会补全前景边缘后面的内容", "priority": "optional"}, {"title": "NeX: Real-time View Synthesis with Neural Basis Expansion", "authors": "Suttisak Wizadwongsa et al.", "year": 2021, "venue": "CVPR 2021 (Oral)", "url": "https://arxiv.org/abs/2103.05606", "citations": 359, "role_zh": "把 MPI 每个像素的颜色表示为神经基函数的线性组合，以建模视角相关效果（需逐场景优化）；发布 Shiny 数据集。Quark 把显式视角相关建模列为未来工作", "priority": "optional"}], "prereqs": ["i-layered", "l-iterative", "i-psv", "r-alpha", "g-depth", "i-blending", "l-attention"], "relation_to_anchors_zh": "Quark 是本专题的终点，它的几乎每个部件都能在前作中找到出处（Sec. 3 及附录表 8/9）。(1) 表示：从 Stereo Magnification 的 MPI，经 Immersive LF Video 的 layered mesh 和 SIMPLI 的多层图像，演变为 Quark 的目标视角 LDM。Quark 的初始 LDM 为 24 层×36×64，输出为 6 层×288×512；Quark+ 从 32 层减到 8 层，输出 432×768。每层深度都被限制在自己的等视差带内。(2) 颜色：LLFF 的 5 路颜色选择权重发展为 Quark 每层每像素 M=8 维的 blend weights，颜色从全分辨率输入图重投影取得；改成直接输出 RGB 时 PSNR 下降 1.23 dB。(3) 求解：DeepView 的 learned gradient descent（3 次迭代，约 50 s）发展为 Quark 嵌入 UNet 式多尺度结构的 5 次 Update & Fuse；去掉 render-and-refine 时 PSNR 下降 0.70 dB。(4) 聚合：DeepView 的 max-pool 换成了 One-to-many attention，去掉后 PSNR 下降 0.68 dB。(5) 分辨率：MatryODShka 的“低分辨率 alpha + 高分辨率 RGB”对应 Quark 的 3.75× post-activation 上采样，1080p 的 IBR 渲染约 1.3 ms。(6) 数据：Quark 的训练集 Spaces（DeepView 发布）、RFF（LLFF 发布）、Shiny（NeX 发布）、SWORD（StereoLayers 发布）全部来自本专题的论文，主要基线 SIMPLI 也属于本专题。Quark 的局限同样继承自这条线：层表示对齐到单一视角，所以每个目标视角（包括左右眼）都要重新跑一遍网络；近/远平面需要由 SfM 点给定；没有任何时间机制。Ha et al. 与本专题形式相近，取舍却相反。它不用分层表示，每个输入视角只贡献一层完全不透明的像素高斯；几何来自外部 RAFT-Stereo 深度和目标视角的 image-based TSDF，而不是由网络迭代求出。但它的融合公式 I_FG = Σ_k 𝓘_k α_k w_k / Σ_k α_k w_k 与 LLFF 的多 MPI 融合式 (8) 同构；背景图 I_BG 与 Stereo Magnification 的背景图 Î_b 一样，都是为去遮挡区域准备的。它的距离加权消融（26.08 dB）使用的正是 LLFF 式的手工权重，被学习到的权重（31.17 dB）大幅超过。", "debates_zh": ["目标视角对齐还是持久表示：Quark 为每个目标视角重建 LDM，可以针对该视角“过拟合”几何来近似反射，但双目和多观看者的成本随视点数线性增长。Quark 团队后续的 LVT、Fuse-and-Refine 改用一次重建、多次渲染的 3DGS，说明团队自己也认为在视频与临场场景下后者更划算。", "平面还是可变形层：MPI 对细结构、半透明和反射更宽容（反射可以放在“虚平面”上），也更容易训练；可变形层（MLI、LDM）更省层数，但依赖深度范围的设定。Quark 去掉 layer collapse 后 PSNR 反而高 0.16 dB，说明减层本质上是用少量质量换速度。", "IBR 混合还是直接回归颜色：本专题的工作普遍选择混合真实像素（Stereo Magnification 的“背景图 + 混合权重”、LLFF 的颜色选择权重）；IBRNet 报告直接回归颜色在 RFF 上略差（24.73 对 25.13 dB），Quark 消融中差 1.23 dB。但 LVSM 等无几何模型在 256–512 分辨率上直接回归 RGB 取得了更高的 PSNR。在 1080p 以上、需要真实纹理的场景中哪种更好，目前没有定论。", "learned gradient descent 究竟是“优化”还是更深的网络：DeepView 发现喂原始梯度分量（SSIM 0.9446）比喂真正的 L2 梯度（0.9389）更好，而且每一步的更新网络权重都不同；Quark 进一步把迭代嵌入 UNet，去掉两次迭代几乎不掉点。迭代结构贡献的是可解释的优化过程，还是只相当于加深了网络，仍有争议。", "评测可比性：本专题论文多用 SSIM/LPIPS 和自建数据集（Spaces、SWORD），分辨率与预处理各不相同。Quark 与 SIMPLI、ENeRF 的比较用的是重训后的基线；Quark 附录也承认，DeepView 在 Spaces 上的数值因预处理不同而无法直接对比。"], "open_questions_zh": ["时间一致的分层表示：Quark 每帧都从常数特征重新初始化 LDM，输入相机集合切换时画面还会跳变。能否把上一帧的 LDM 按新视点重投影后作为初始化（替代学习式初始化），并借此减少迭代次数？", "一次推理同时服务双眼：左右眼的视锥高度重叠，能否共享粗尺度的层与注意力计算，只在最后的高分辨率阶段分开，避免双目成本翻倍？", "视角外推与去遮挡：分层表示只能在输入覆盖的范围内工作，Quark 在 Deep Blending 上远低于 3DGS（23.61 对 30.04）。能否在层内容中引入生成式先验，同时保留 IBR 的真实纹理？", "视角相关外观：blend weights 是输入颜色的凸组合，无法产生比任何输入都更亮的高光。NeX 式的基函数能否由前馈网络预测，并且实时运行？", "对标定误差与曝光差异的鲁棒性：位姿有误差时，层几何与混合权重产生的是硬边，而不是模糊。怎样把在线标定监控和可微的位姿修正嵌入迭代求解？", "与 3DGS 互相转换：LDM 的层能否直接转成有向的高斯面元，得到一种既能迭代求解、又能持久渲染的混合表示？"], "resources": [{"title": "Computer Vision: Algorithms and Applications, 2nd ed. (Szeliski)", "url": "https://szeliski.org/Book/", "type": "book", "note_zh": "第 14 章 Image-based rendering 是 IBR 的教科书式综述，14.1 讲视图插值，14.2 讲 Layered depth images，14.3 讲光场与 Lumigraph。先读这三节再读 MPI 系列论文会轻松很多。官网登记后可免费下载 PDF，限个人使用。"}, {"title": "DeepView project page", "url": "https://augmentedperception.github.io/deepview/", "type": "paper", "note_zh": "DeepView 的项目主页，提供结果对比、消融与迭代过程的可视化，以及交互式 MPI 查看器，可以直观看到各深度平面上的 RGBA 内容，有助于理解 learned gradient descent 输出的是什么。"}, {"title": "augmentedperception/spaces_dataset (data)", "url": "https://github.com/augmentedperception/spaces_dataset", "type": "code", "note_zh": "DeepView 发布的 Spaces 多视角数据集（16 相机、100 个场景）及读取代码。它是 Quark 的训练数据之一，也是 Ha et al. 训练用的小基线数据，适合用来复现分层视图合成的训练与评测。"}, {"title": "google/stereo-magnification (code)", "url": "https://github.com/google/stereo-magnification", "type": "code", "note_zh": "Stereo Magnification 的官方 TensorFlow 实现，包含 PSV 构造、MPI 的单应 warp 和 over 合成，适合动手复现分层渲染的基本流程。"}, {"title": "Fyusion/LLFF (code)", "url": "https://github.com/Fyusion/LLFF", "type": "code", "note_zh": "LLFF 的官方代码，包含 COLMAP 位姿处理、局部 MPI 预测和多 MPI 融合渲染。其前向场景数据（RFF）及位姿格式（poses_bounds）后来被 NeRF 和 Quark 等大量工作沿用。"}]}, {"id": "a-generalizable-ibr", "title_zh": "可泛化 NeRF 与学习式 IBR", "title_en": "Generalizable NeRF & learned IBR", "overview_zh": "逐场景的 NeRF 需要几十上百张图和数小时的优化；传统 IBR（如 ULR，见 i-blending）速度快，但依赖稠密的视角或准确的代理几何。可泛化新视角合成想同时拿到两者的好处：先在大量场景上训练一个网络，测试时遇到新场景不再做任何优化，直接从少量近邻源视角中查取像素或特征，合成目标视角。本专题覆盖 2016–2022 年的两个分支。第一个是学习式 IBR：先用某种几何代理（平面扫描体、MVS 网格、深度点云）把源图重投影到目标视角，再用 CNN 或 Transformer 融合，代表作有 DeepStereo、Deep Blending、FVS/SVS、FWD。第二个是可泛化 NeRF：沿目标射线采样 3D 点，把每个点投影到各源视角取特征，跨视角聚合后预测 density 与颜色，最后做体渲染，代表作有 pixelNeRF、MVSNeRF、IBRNet、NeuRay、ENeRF。GPNR 则用沿极线采集的图像 patch 和 Transformer 直接预测射线颜色，是连接本专题与无几何 Transformer（a-geometry-free）的桥梁。\n\n学习式 IBR 分支的演进主线是代理几何越来越好，融合网络越来越强。DeepStereo（CVPR 2016）用 96 个深度平面构成 PSV：选择塔输出沿深度的 softmax 概率，颜色塔输出每个平面的颜色，两者相乘再求和得到像素；在多核工作站上渲染一张 512×512 的图约需 12 分钟。Deep Blending（SIGGRAPH Asia 2018）用 CNN 学习多张重投影源图（mosaic）的逐像素混合权重，专门消除传统 IBR 的接缝与重影。FVS（ECCV 2020）先用 COLMAP 做 SfM 与 MVS 得到粗网格，由此渲染出目标视角的代理深度，再把近邻源视角的编码特征按代理深度重投影过来，用一个可处理可变数量输入的循环编码解码网络融合；论文称它首次在 Tanks and Temples 上成功做出自由视点合成。SVS（CVPR 2021）把融合移到代理表面的每个 3D 点上，对该点在各源视角中的方向特征做视角相关的聚合；由于聚合结果随目标视角平滑变化，论文强调其结果在空间和时间上都更稳定。FWD（CVPR 2022）把每个输入视角变成一个带特征的点云（深度来自 MVS 或深度传感器），各自渲染到目标视角后，再用 Transformer 融合并细化，达到实时。\n\n可泛化 NeRF 分支在 2020–2022 年集中出现。pixelNeRF（CVPR 2021）以 ResNet34 特征金字塔为条件：对 3D 点 x 取它投影位置处的特征 W(π(x))，与位置编码和视角方向一起送入 MLP，只有一张输入图时也能工作；多视角时先在各视角的坐标系中分别处理，再做平均池化。MVSNeRF（ICCV 2021）只用 3 个近邻视角，先建立平面扫描代价体，经 3D CNN 得到神经编码体，再解码出辐射场。IBRNet（CVPR 2021）训练时先取 n·N 个近邻（n∈[1,3]），再从中随机选 N∈[8,12] 个源视角；对每个采样点，用类 PointNet 的 MLP 做跨视角的均值/方差聚合和可见性加权，再用 ray transformer 让同一射线上的样本相互注意，从而预测 density。它的颜色不是回归出来的，而是对源像素颜色做 softmax 混合，权重由特征和相对视角方向 Δd 决定。NeuRay（CVPR 2022）用累积分布函数（logistic 混合）参数化每个源视角对 3D 点的可见性，把被遮挡视角的特征排除在外。GPNR（ECCV 2022）沿极线从每个参考视角截取 patch，经过三个 Transformer（视觉特征、极线聚合、参考视角聚合）直接输出射线颜色；它的位置编码以目标射线为基准做规范化，在某些设定下只用 IBRNet 训练集的约 11%（37 个 LLFF 场景加 131 个 IBRNet 自采场景）就超过了前作。ENeRF（SIGGRAPH Asia 2022）则主攻速度：用级联代价体（64 与 8 个深度平面）预测深度概率，只在“均值 ± 1 倍标准差”的区间内对每条射线采 2 个点。它在 512×512 下于 RTX 3090 上达到 25.21 FPS（静态场景用 3 个、动态场景用 2 个源视角），论文称比此前的可泛化辐射场方法快至少 60 倍。\n\n这一代方法的共同瓶颈是速度和分辨率。体渲染式的方法对每条射线要做数十到上百次跨视角特征查询（IBRNet 为 64+64 个样本）：在 Quark 的测试中，GPNR 渲染一帧需要 25 s；在 GPS-Gaussian 的测试中，IBRNet 只有约 0.25 FPS。ENeRF 把采样数压到每条射线 2 个点才达到交互速率，但在 1024×768 下仍需 205 ms（Quark 表 1，A100），而且单层带厚度的深度在深度复杂的场景中会失败。另一个共同问题是时间一致性：视频被逐帧当作独立场景处理，源视角集合又随目标视角切换，输出因此闪烁和跳变。\n\n截至 2026-09，本专题的方法大多已经从前沿变成了基线。Quark 以 ENeRF、GPNR（以及分层方法 SIMPLI）为主要对手（Quark 比 ENeRF 快 6 倍以上，比 GPNR 快 700 倍以上）；Ha et al. 以 IBRNet、ENeRF、FWD 为基线，此外还有前馈 3DGS 方法 GPS-Gaussian，并在 ENeRF 团队发布的户外数据集 ENeRF-Outdoor 上做了测试。2023 年以后，前沿分成两条路：一条是输出显式高斯的前馈 3DGS（a-ff-3dgs），一条是几乎不带几何先验的大 Transformer（a-geometry-free）。本专题确立的内核却原样留在了两篇锚点论文的输出端：为目标射线从近邻源视角取真实像素，学习混合权重，并用可见性或代价体做引导。Quark 用 M=8 维 blend weights 做 IBR；Ha et al. 用 U-Net 预测的 K 个逐像素权重融合前向 splat 得到的真实像素。", "key_ideas": [{"name_zh": "两种取像素的方式：射线采样与代理几何重投影", "explain_zh": "直觉：要给目标像素找颜色，先得回答“这条射线打到了哪里”。可泛化 NeRF 不直接回答，而是沿射线采 N_s 个点，把每个点都投影到源视角取特征，交给网络判断，代价与采样数成正比。学习式 IBR 先用代理几何给出答案（每个像素一个或几个深度），再按这个深度去源视角取像素，代价小，但会受代理几何误差的影响。数值例子：1024×768 的目标图有 786,432 条射线。如果每条射线取 128 个样本（IBRNet 的粗 64 加细 64）、用 10 个源视角，就需要约 10 亿次特征查询与跨视角聚合。ENeRF 每条射线 2 个样本、3 个源视角，只需约 470 万次，因此快了两三个数量级（代价体本身另有开销）。Quark 的 LDM 介于两者之间：最终 6 层×288×512，每层对 8 个视角取样，约 700 万次查询；但每层深度由网络迭代求出，因此同时具备“采样”和“代理几何”的好处。Ha et al. 走的是纯代理几何路线：每个源像素按外部立体深度前向 splat 一次，再在目标视角做一次 TSDF 射线步进（6 ms）。"}, {"name_zh": "跨视角聚合：均值/方差为什么能找到表面", "explain_zh": "直觉：如果 3D 点 x 真的落在表面上，而且在各源视角都可见，那么它在各视角取到的特征应该一致；如果 x 在空中，各视角看到的是不同的物体，特征就不一致。所以跨视角的方差是光度一致性信号，均值则是该点外观的估计。例：3 个源视角在 x 处取到的特征（简化为 1 维）为 0.80、0.82、0.79，方差约 0.00016，说明 x 很可能在表面上；如果是 0.8、0.2、0.5，方差为 0.06，x 多半在空中或被遮挡。麻烦在于遮挡：真实表面在某个视角被挡住时，这个视角贡献的是遮挡物的特征，方差被拉大。IBRNet 先用类 PointNet 的 MLP 算出均值、方差作为全局特征，再为每个视角输出一个池化权重，按权重重新计算加权均值与方差，相当于一种软可见性。NeuRay 更进一步，显式预测每个视角对该点的可见性；DeepView 和 Quark 则利用渲染回输入视角得到的透射率与残差来推理可见性。与锚点的联系：Quark 把均值/方差统计列为被拒绝的聚合方式，换成了 One-to-many attention（退化为均值时 PSNR 下降 0.68 dB）。Ha et al. 不做跨视角的特征聚合，可见性信息来自每个视角前向 splat 得到的累积 alpha α_k 和 splat 深度 𝒟_k，由 U-Net 自行判断。"}, {"name_zh": "混合权重而非回归颜色，以及相对视角方向", "explain_zh": "直觉：网络直接输出 RGB 时往往偏糊，因为它得记住所有纹理。如果改为输出“取哪个源视角的真实像素”，高频纹理就能原样保留，网络只需学一个低频的权重场。IBRNet 对每个源视角 i，用小网络从特征 f'_i 和相对方向 Δd_i = d − d_i 算出权重 w_i，再做 softmax 混合；它的消融显示，在 RFF 上改为直接回归颜色后 PSNR 从 25.13 降到 24.73。相对方向是视角相关外观的关键线索：目标射线与源射线方向越接近，源像素越可能与目标颜色相同。这正是 ULR“角度偏差”准则的学习版（见 i-blending）。与锚点的联系：Quark 的射线方向编码 γ 取输入射线与目标 LDM 视锥近/远平面两个交点的差向量，经 tanh 后做 8 个 octave 的正弦编码；输入射线与目标射线重合时编码为 0。它本质上是投影空间里的 Δd，消融中的收益只有 0.09 dB。Ha et al. 给 U-Net 的 4 组相机特征（输入射线与 TSDF 法线的点积、输入射线与目标方向的点积、相机间距离、输入与目标视线方向的点积）是同一思想的手工版本。两篇锚点都延续了混合真实像素的选择：Quark 改为直接输出 RGB 时 PSNR 下降 1.23 dB。"}, {"name_zh": "几何引导采样：ENeRF 的深度区间与单层表示的上限", "explain_zh": "直觉：沿射线的大部分样本都落在空气里，是浪费；如果先粗略估出表面深度，只在表面附近采样，就能大幅提速。ENeRF 先在目标视角建一个 64 平面的粗代价体，得到每个像素的深度概率分布，取其均值 L̂ 与标准差 Ŝ；再只在 [L̂−Ŝ, L̂+Ŝ] 内建一个 8 平面的细代价体；最后每条射线只采 2 个点做体渲染。512×512 一帧的各阶段耗时为：特征提取 4.3 ms，代价体 3D CNN 16.1 ms，辐射场与体渲染 19.2 ms（RTX 3090）。它隐含的假设是每个像素只有一个主要表面，即深度分布是单峰的。在前景边缘、细结构或半透明处，真实分布是双峰的，均值落在两个表面之间，±1σ 的区间可能两边都覆盖不到，于是出现拉丝或空洞。与锚点的联系：Quark 在相关工作中把 ENeRF 的“单层带厚度深度”列为被拒绝的表示，理由正是它在深度复杂的场景中会失败；Quark 的 LDM 保留了多层，每层都可以贴住一个表面。ENeRF 是两篇锚点共同的最强基线：N3DV 上 Quark 31.57 对 ENeRF 29.86；DyNeRF 上 Ha 31.17 对 ENeRF 29.51；但在 ENeRF-Outdoor 上 ENeRF 反超 Ha（25.79 对 24.01）。注意：N3DV 就是 DyNeRF 数据集（Neural 3D Video），但两篇论文的分辨率、测试视角和帧采样都不同，两组数字不能横向比较。"}, {"name_zh": "代理几何 + 逐视角渲染 + 学习融合：从 FVS、SVS、FWD 到 Ha et al.", "explain_zh": "直觉：与其让网络在 3D 空间里推理，不如先按代理几何把每个源视角搬到目标视角，再在目标图像空间里用 2D 网络完成融合。FVS 用 MVS 网格渲染出目标视角的代理深度，按它把各源视角的编码特征 warp 过来，再用循环网络逐个吸收，因此可以处理任意数量的输入。SVS 把聚合放在代理表面的 3D 点上，并指出由于聚合结果随目标视角平滑变化，合成结果在空间和时间上更稳定。FWD 把每个源视角转成带特征的点云，先各自渲染到目标视角（而不是先合并所有点云再渲染），再用 Transformer 融合、用细化网络补洞；它还可以选择接入传感器深度，并达到实时。这条线的更早源头是 SynSin 的可微特征点云渲染器。与锚点的联系：Ha et al. 的第一阶段与 FWD 几乎同构。每个源视角的像素按立体深度变成像素级高斯，各自 splat 到目标相机，再由 U-Net 在几何引导下融合。作者明确拒绝把所有视角一次性渲染，理由是飞点与 Z-fighting（No Blending 消融：PSNR 24.64，STED 483.3）。Ha 的 TSDF 引导深度对应 FVS 的目标视角代理深度，区别在于它每帧在线地由 K 个视角的立体深度融合得到（6 ms），并回灌上一帧的深度以求时间稳定。FWD 在 Ha 的 DyNeRF 实验中重训后只有 16.97 dB，这说明“逐视角渲染再融合”的框架本身还不够，深度质量以及融合网络得到的几何引导才是关键。"}, {"name_zh": "输入视角的选择与训练采样", "explain_zh": "直觉：可泛化方法只看目标附近的少数源视角。选哪几个、训练时怎样采样，直接决定了泛化能力和视角切换时的稳定性。IBRNet 训练时先取 n·N 个近邻（n∈[1,3]），再从中随机抽 N∈[8,12] 个，以模拟不同的视角密度。Quark 训练时从最近的 16 个视角中随机抽 8 个，推理时取最近的 8 个。Ha et al. 取最近的 K 个（DyNeRF 与 ENeRF-Outdoor 上 K=4，D3DMV 上 K=2），并报告 K≥4 时质量饱和，运行时间随 K 线性增长。问题在于，目标相机连续移动时，“最近的 K 个”是离散切换的。例：4 台相机排成一排，间距 10 cm，K=2。观看者从第 1 台走到第 3 台，经过第 2 台的位置时，最近的 2 台从 {1,2} 变成 {2,3}；此刻第 1 台与第 3 台到观看者的距离恰好相等。如果混合权重在这一刻没有连续过渡，画面就会突变。Quark 在局限中承认这种切换会引起闪烁；Ha et al. 也承认 K 集合变化时 TSDF 深度仍会有小幅变化。"}, {"name_zh": "泛化协议：训练数据、预训练权重与公平比较", "explain_zh": "直觉：“可泛化”的含义取决于训练数据与测试数据差得有多远。pixelNeRF 在 ShapeNet 与 DTU 上训练和测试；MVSNeRF 与 ENeRF 在 DTU 上训练，再跨数据集测试；IBRNet 用多个数据集的混合训练；GPNR 声称在某些设定下只用 IBRNet 训练数据的约 11% 就能超过前作。两篇锚点论文在这方面都有值得注意的细节。Quark 的基线（ENeRF、GPNR、SIMPLI）是在 RFF+IBRNet 数据上重训的，而 Quark 自己用 Spaces+RFF+Shiny+SWORD 训练。Ha et al. 中的 IBRNet 与 ENeRF 用的是作者发布的预训练权重，只有 FWD 与 GPS-Gaussian 按本文数据重训；而本文的训练集还包含与测试场景同一厨房拍摄的 DyNeRF 场景。读这类比较表时要问三件事：训练数据是否相同，测试场景是否见过，分辨率与视角选择是否一致。在 DyNeRF 上，IBRNet（22.49 dB）与 ENeRF（29.51 dB）相差 7 dB，其中多少来自方法本身、多少来自训练数据的差异，论文没有给出答案。"}], "equations": [{"tex": "(\\sigma,\\mathbf{c})=f\\big(\\gamma(\\mathbf{x}),\\mathbf{d};\\,\\mathbf{W}(\\pi(\\mathbf{x}))\\big),\\qquad \\mathbf{V}=\\frac{1}{N}\\sum_{i=1}^{N}f_{1}\\big(\\gamma(\\mathbf{x}^{(i)}),\\mathbf{d}^{(i)};\\,\\mathbf{W}^{(i)}(\\pi_{i}(\\mathbf{x}))\\big),\\quad(\\sigma,\\mathbf{c})=f_{2}(\\mathbf{V})", "explain_zh": "pixelNeRF 的条件辐射场。x 是沿目标射线采样的 3D 点，d 是观察方向；γ 是 NeRF 的位置编码；π(x) 把 x 投影到输入图像平面；W 是 CNN（ResNet34）的特征图，W(π(x)) 表示在投影位置双线性插值得到的特征向量；f 是 MLP，输出 density σ 与颜色 c。多视角时，x^{(i)} 和 d^{(i)} 是变换到第 i 个视角相机坐标系（view space）后的坐标与方向；f_1 逐视角提取中间特征，对 N 个视角取平均池化得到 V，再由 f_2 输出 (σ, c)，之后照常做体渲染。例：x 投影到第 1 张特征图的 (10.3, 20.7) 处，就取周围 4 个格点特征的双线性组合。这个式子体现了“可泛化”的本质：场景信息不再存放在 MLP 的权重里，而是推理时从特征图里查出来的。"}, {"tex": "\\mathbf{c}(\\mathbf{x},\\mathbf{d})=\\sum_{i=1}^{N}\\frac{\\exp(w_{i})}{\\sum_{j=1}^{N}\\exp(w_{j})}\\,\\mathbf{C}_{i},\\quad w_{i}=g\\big(\\mathbf{f}'_{i},\\,\\mathbf{d}-\\mathbf{d}_{i}\\big),\\qquad \\hat{\\mathbf{C}}(\\mathbf{r})=\\sum_{s=1}^{S}T_{s}\\big(1-e^{-\\sigma_{s}\\delta_{s}}\\big)\\mathbf{c}_{s},\\quad T_{s}=\\exp\\!\\Big(-\\sum_{s'<s}\\sigma_{s'}\\delta_{s'}\\Big)", "explain_zh": "IBRNet 的颜色混合与体渲染。N 是源视角数；C_i 是 3D 点 x 投影到第 i 个源视角后取到的像素颜色；f'_i 是跨视角聚合后第 i 个视角的特征，已包含多视角信息；d 是目标射线方向，d_i 是从源相机中心指向 x 的方向，d − d_i 是两者的相对方向；g 是小 MLP，输出标量得分 w_i；softmax 把得分变成和为 1 的权重。第二个式子是离散体渲染：r 是目标射线，S 是样本数，σ_s、c_s 是第 s 个样本的 density 与颜色（density 由 ray transformer 预测），δ_s 是相邻样本的间距，T_s 是透射率。例：3 个源视角的得分为 w=(2.0, 1.0, 0.0)，softmax 后约为 (0.665, 0.245, 0.090)。若它们的颜色分别为 (200,50,50)、(190,60,50)、(100,100,100)，混合结果约为 (188.5, 57.0, 54.5)，主要取自方向与目标射线最接近的第 1 个视角。"}, {"tex": "\\hat{L}(u,v)=\\sum_{i=1}^{D}P_{i}(u,v)\\,L_{i},\\qquad \\hat{S}(u,v)=\\sqrt{\\sum_{i=1}^{D}P_{i}(u,v)\\big(L_{i}-\\hat{L}(u,v)\\big)^{2}},\\qquad \\hat{U}(u,v)=\\big[\\hat{L}-\\lambda\\hat{S},\\ \\hat{L}+\\lambda\\hat{S}\\big]", "explain_zh": "ENeRF 由粗代价体得到深度区间。(u,v) 是目标视角的像素；D 是该级代价体的深度平面数（粗级 64，细级 8）；L_i 是第 i 个平面的深度；P_i(u,v) 是 3D CNN 处理代价体后沿深度维做 softmax 得到的概率；L̂ 是期望深度，Ŝ 是标准差，用作置信度；Û 是下一级只在其中均匀放置平面、采样的深度区间；λ 是超参数，论文取 1。例：某像素的概率集中在 2.0 m 附近，Ŝ=0.05 m，那么细级只在 [1.95, 2.05] m 内放 8 个平面，间距约 1.4 cm，最后每条射线在细区间内采 2 个点做体渲染。如果该像素正好在前景（1 m）与背景（3 m）的交界处，概率各占一半，则 L̂=2 m、Ŝ=1 m，区间 [1, 3] m 很宽，细级 8 个平面的间距约为 29 cm，2 个样本很难同时命中两个表面。这就是单层深度引导在深度复杂区域出错的原因。"}], "evolution": [{"year": 1996, "milestone_zh": "Light Field Rendering 与 The Lumigraph 提出：视角采样足够稠密时，新视角合成只需在光场中插值射线"}, {"year": 2001, "milestone_zh": "Unstructured Lumigraph Rendering 提出按角度偏差、分辨率、连续性等准则确定混合权重，是后来各种学习式混合权重的手工原型"}, {"year": 2016, "milestone_zh": "DeepStereo 实现首个端到端学习的新视角合成（PSV 加选择塔与颜色塔）"}, {"year": 2018, "milestone_zh": "Deep Blending 用 CNN 学习 IBR 的逐像素混合权重"}, {"year": 2020, "milestone_zh": "SynSin（CVPR 2020）提出可微特征点云渲染；FVS（ECCV 2020）结合 MVS 代理深度与循环融合网络，首次在 Tanks and Temples 上成功做出自由视点合成；pixelNeRF 于 2020-12 发布在 arXiv"}, {"year": 2021, "milestone_zh": "pixelNeRF、IBRNet、SVS（CVPR 2021）与 MVSNeRF（ICCV 2021）发表，分别代表可泛化辐射场和表面上的视角相关聚合"}, {"year": 2022, "milestone_zh": "NeuRay、FWD（CVPR 2022）、GPNR（ECCV 2022）与 ENeRF（SIGGRAPH Asia 2022，512² 下 25 FPS）发表"}, {"year": 2023, "milestone_zh": "前馈 3DGS 与大重建模型兴起（pixelSplat、GPS-Gaussian、LRM，见 a-ff-3dgs），本专题的方法逐渐变成基线；ENeRF 团队于 2023-01 发布 ENeRF-Outdoor 数据集"}, {"year": 2024, "milestone_zh": "Quark 以 ENeRF、GPNR 为主要基线，在 RFF、Shiny、N3DV 上的质量与速度均超过它们"}, {"year": 2025, "milestone_zh": "Ha et al.（CVPR 2025）以 IBRNet、ENeRF、FWD、GPS-Gaussian 为基线，并引入时间一致性与视角一致性指标"}], "papers": [{"title": "IBRNet: Learning Multi-View Image-Based Rendering", "authors": "Qianqian Wang, Zhicheng Wang, Kyle Genova et al.", "year": 2021, "venue": "CVPR 2021", "url": "https://arxiv.org/abs/2102.13090", "citations": 1014, "role_zh": "可泛化 IBR 的代表作：跨视角均值/方差聚合加可见性权重，ray transformer 预测 density，颜色由源像素做 softmax 混合得到；是 Ha 的基线，Quark 的基线也在它的数据上重训", "priority": "must"}, {"title": "pixelNeRF: Neural Radiance Fields from One or Few Images", "authors": "Alex Yu, Vickie Ye, Matthew Tancik, Angjoo Kanazawa", "year": 2021, "venue": "CVPR 2021", "url": "https://arxiv.org/abs/2012.02190", "citations": 2319, "role_zh": "首次把 NeRF 条件化在图像特征上，在 view space 中工作，1 张或少量输入即可前馈合成新视角；确立了“查询特征而非存储场景”的可泛化范式", "priority": "must"}, {"title": "Efficient Neural Radiance Fields for Interactive Free-viewpoint Video", "authors": "Haotong Lin, Sida Peng, Zhen Xu et al.", "year": 2022, "venue": "SIGGRAPH Asia 2022", "url": "https://arxiv.org/abs/2112.01517", "citations": 196, "role_zh": "ENeRF：由级联代价体得到深度区间，每条射线只采 2 个样本，在 512² 下达到 25 FPS；是两篇锚点共同的最强基线，其团队随代码发布的 ENeRF-Outdoor 是 Ha 的测试集之一", "priority": "must"}, {"title": "Generalizable Patch-Based Neural Rendering", "authors": "Mohammed Suhail, Carlos Esteves, Leonid Sigal, Ameesh Makadia", "year": 2022, "venue": "ECCV 2022", "url": "https://arxiv.org/abs/2207.10662", "citations": 151, "role_zh": "GPNR：沿极线截取 patch，经三阶段 Transformer 直接预测射线颜色，使用以目标射线为基准的规范化位置编码；是 Quark 的基线（每帧 25 s）", "priority": "must"}, {"title": "Free View Synthesis", "authors": "Gernot Riegler, Vladlen Koltun", "year": 2020, "venue": "ECCV 2020", "url": "https://arxiv.org/abs/2008.05511", "citations": 389, "role_zh": "用 MVS 代理几何渲染目标视角深度，再重投影近邻特征，由可处理可变数量输入的循环网络融合；是“目标视角代理深度引导融合”的原型，Ha 的 TSDF 引导与之对应", "priority": "should"}, {"title": "Stable View Synthesis", "authors": "Gernot Riegler, Vladlen Koltun", "year": 2021, "venue": "CVPR 2021", "url": "https://arxiv.org/abs/2011.07233", "citations": 235, "role_zh": "在代理表面的 3D 点上做视角相关的特征聚合，因聚合结果随目标视角平滑变化，得到空间与时间上更稳定的自由视点合成", "priority": "should"}, {"title": "FWD: Real-time Novel View Synthesis with Forward Warping and Depth", "authors": "Ang Cao, Chris Rockwell, Justin Johnson", "year": 2022, "venue": "CVPR 2022", "url": "https://arxiv.org/abs/2206.08355", "citations": 60, "role_zh": "把每个视角转成带特征的点云，分别前向渲染后再用 Transformer 融合，可接入传感器深度并实时运行；结构上是 Ha 的直接前身，也是 Ha 重训的基线", "priority": "should"}, {"title": "MVSNeRF: Fast Generalizable Radiance Field Reconstruction from Multi-View Stereo", "authors": "Anpei Chen, Zexiang Xu, Fuqiang Zhao et al.", "year": 2021, "venue": "ICCV 2021", "url": "https://arxiv.org/abs/2103.15595", "citations": 1103, "role_zh": "把 MVS 的平面扫描代价体引入可泛化 NeRF，用 3 个视角经 3D CNN 得到神经编码体，可快速微调", "priority": "should"}, {"title": "Neural Rays for Occlusion-aware Image-based Rendering", "authors": "Yuan Liu, Sida Peng, Lingjie Liu et al.", "year": 2022, "venue": "CVPR 2022", "url": "https://arxiv.org/abs/2107.13421", "citations": 269, "role_zh": "NeuRay：用累积分布函数（logistic 混合）参数化各源视角对 3D 点的可见性，把被遮挡视角的特征排除在外，是显式可见性推理的代表", "priority": "should"}, {"title": "DeepStereo: Learning to Predict New Views from the World's Imagery", "authors": "John Flynn, Ivan Neulander, James Philbin, Noah Snavely", "year": 2016, "venue": "CVPR 2016", "url": "https://arxiv.org/abs/1506.06825", "citations": 709, "role_zh": "首个端到端学习的新视角合成：96 平面的 PSV 加选择塔与颜色塔，用 Street View 数据训练；Quark 第一作者这一系列工作的起点", "priority": "should"}, {"title": "Deep Blending for Free-Viewpoint Image-Based Rendering", "authors": "Peter Hedman, Julien Philip, True Price, Jan-Michael Frahm, George Drettakis, Gabriel Brostow", "year": 2018, "venue": "ACM TOG 37(6) / SIGGRAPH Asia 2018", "url": "https://repo-sam.inria.fr/fungraph/deep-blending/", "citations": 923, "role_zh": "用 CNN 学习多张重投影源图的逐像素混合权重，消除接缝与重影；是 Ha 的 U-Net 融合权重的思想源头，其 Playroom 等场景后来成为 3DGS 的评测集", "priority": "optional"}, {"title": "SynSin: End-to-End View Synthesis From a Single Image", "authors": "Olivia Wiles, Georgia Gkioxari, Richard Szeliski, Justin Johnson", "year": 2020, "venue": "CVPR 2020", "url": "https://arxiv.org/abs/1912.08804", "citations": 555, "role_zh": "提出可微的特征点云渲染器：把图像的深度与特征抬升成 3D 点云，前向 splat 到目标视角后由细化网络补洞。FWD 明确以它为灵感，是“前向 warp + 学习补全”这条线的起点，对应 Ha 的前向 splat 加背景图补洞", "priority": "optional"}], "prereqs": ["n-generalizable", "i-blending", "n-nerf", "r-volume", "d-mvs", "i-psv", "i-warping", "l-attention"], "relation_to_anchors_zh": "两篇锚点都属于本专题所说的“可泛化、推理时不优化”的 NVS，并且都以本专题的方法为主要对手。Quark（表 1）把 ENeRF、GPNR、SIMPLI 在 RFF+IBRNet 数据上重训后比较：RFF 1024×768 上，Quark 26.03 dB，GPNR 25.42，ENeRF 23.71；N3DV 上，Quark 31.57，ENeRF 29.86，GPNR 29.80；速度上，ENeRF 205 ms，GPNR 25 s，Quark 32.2 ms。Quark 从本专题继承了三样东西。一是 IBR 输出，即对输入像素的 blend weights，而不是回归 RGB。二是以目标射线为参照的射线方向编码，对应 IBRNet 的 Δd 和 GPNR 的规范化射线编码。三是训练时随机抽取近邻视角（从最近 16 个中抽 8 个），对应 IBRNet 的 n·N 候选池。它也明确拒绝了 IBRNet、MVSNeRF 式的均值/方差聚合，以及 ENeRF 的单层带厚度深度。Ha et al.（表 1、表 2）以 IBRNet、ENeRF（作者预训练权重）以及 FWD、GPS-Gaussian（重训）为基线：DyNeRF 上，Ha 31.17 dB，ENeRF 29.51，IBRNet 22.49，FWD 16.97；STED 上，Ha 68.76，ENeRF 76.14，IBRNet 737.7；但在 ENeRF-Outdoor 上，ENeRF 的 PSNR（25.79）高于 Ha（24.01）。注意 Quark 的 N3DV 与 Ha 的 DyNeRF 是同一套数据，但评测协议不同，两篇论文的 ENeRF 数字不能互相对照。Ha 的结构是本专题学习式 IBR 分支的直接后代：逐视角前向渲染再融合来自 FWD（更早可追溯到 SynSin）；用目标视角代理深度引导融合来自 FVS，只是代理深度换成了在线的 image-based TSDF；学习逐像素混合权重来自 Deep Blending 和 IBRNet；相机方向点积特征则是 ULR 角度准则的手工特征版。本专题暴露出的两个共同缺陷，也正是两篇锚点的出发点：Quark 针对速度与分辨率，Ha 针对逐帧独立处理带来的闪烁与视角跳变。", "debates_zh": ["体渲染还是深度引导：IBRNet 式的密集采样对多峰分布、半透明更鲁棒，但慢；ENeRF 式只在单一深度附近采样，快，但在深度复杂的区域会失败。Quark 的多层 LDM 与 Ha 的“TSDF 深度 + 逐视角 splat”代表了两种折中。", "需要多少显式几何：MVSNeRF、ENeRF 用代价体，FVS、SVS 用离线 MVS 网格，GPNR 只用极线约束。几何越显式，结果越稳定（Ha 的 TSDF 主要改善的是 STED）；几何越隐式，越能处理反射和透明，但越难保证一致性。", "基线的公平性：用作者预训练权重（Ha 对 IBRNet、ENeRF 的做法），还是在同一数据上重训（Quark 对 ENeRF、GPNR 的做法），会明显改变结论。Ha 的训练集与 DyNeRF 测试场景来自同一厨房，进一步混淆了比较。", "逐场景微调是否违背“可泛化”：IBRNet、MVSNeRF、NeuRay 都报告了微调后的更高分数，但临场场景没有留给微调的时间。", "深度监督有没有用：ENeRF 的消融发现，加入真值深度监督并不提升渲染质量；而 GPS-Gaussian 使用真值深度监督，Ha 则直接依赖外部立体深度。深度在这类方法里只是中间变量，还是必须准确的几何，看法不一。"], "open_questions_zh": ["时间一致性：本专题的方法都把视频当作独立的帧处理，源视角集合切换时还会跳变。怎样在不牺牲泛化能力的前提下，引入跨帧记忆或平滑的软视角选择？", "高分辨率：射线级或 patch 级的方法（IBRNet、GPNR）很难做到 1080p 实时，Quark 靠“低分辨率几何 + IBR 上采样”才做到。能否把 GPNR 式的局部 patch 推理稀疏化，只在边界处精细计算？", "非朗伯表面：混合权重是凸组合，产生不了任何源视角里都没有的高光。怎样在保留真实像素的同时，建模视角相关的残差？", "遮挡与外推：目标视角看到的区域若在所有 K 个源视角中都被遮挡，就只能靠网络去补（如 Ha 的 I_BG）。怎样引入长期记忆或生成先验？", "与深度传感器、视频立体结合：FWD 已能接入传感器深度，Ha 依赖 RAFT-Stereo。时间一致的视频立体方法能否取代启发式滤波，并被计入实时预算？"], "resources": [{"title": "MIT 6.S980: Machine Learning for Inverse Graphics (Fall 2023)", "url": "https://scenerepresentations.org/courses/2023/fall/inverse-graphics/", "type": "course", "note_zh": "Sitzmann 开设的课程。其中 Prior-Based Reconstruction 系列（共三讲）系统讲解 pixelNeRF 式的“从图像推断场景”，光场相关讲次涉及光场渲染、极线推理，衔接了传统 IBR。"}, {"title": "Advances in Neural Rendering (Eurographics 2022 STAR)", "url": "https://arxiv.org/abs/2111.05849", "type": "paper", "note_zh": "Tewari 等人的神经渲染综述，梳理了神经场的表示、渲染与跨场景泛化（条件化）等主题，适合在读完 IBRNet、pixelNeRF 后建立全局图景。"}, {"title": "googleinterns/IBRNet (code)", "url": "https://github.com/googleinterns/IBRNet", "type": "code", "note_zh": "IBRNet 的官方 PyTorch 实现，包含源视角采样、跨视角聚合、ray transformer 与混合权重，是理解可泛化 IBR 数据流最直接的代码。"}, {"title": "ENeRF project page", "url": "https://zju3dv.github.io/enerf/", "type": "paper", "note_zh": "ENeRF 的项目主页，含代码链接与动态场景的自由视点视频演示；Ha 的户外测试集 ENeRF-Outdoor 由该团队随代码仓库发布。"}]}, {"id": "a-ff-3dgs", "title_zh": "前馈 3DGS 与大重建模型", "title_en": "Feed-forward 3DGS & large reconstruction models", "overview_zh": "3DGS（见 n-3dgs）渲染极快，但每个场景都要从 SfM 点出发优化几分钟到几十分钟，没法用在每帧都在变的临场通话中。前馈 3DGS（feed-forward 3DGS）用一次网络前向代替优化：输入少量带位姿的图像，网络直接输出一组高斯的均值、协方差、不透明度和颜色，再用标准光栅器渲染任意视角。它沿用了可泛化 NeRF（a-generalizable-ibr）的思路，但去掉了最慢的环节：不再对每条射线做上百次网络查询，而是一次输出显式图元，之后每个新视角只需几毫秒的光栅化。2023 年底以来，这个方向分成两条主线。一条是像素对齐（pixel-aligned）方法，为每个输入像素预测一个或几个高斯，高斯中心放在该像素射线上的预测深度处。另一条是大重建模型（LRM），用数亿参数的 Transformer 和海量数据，把多视角图像 token 直接映射为 3D 表示。\n\n像素对齐路线的核心问题是深度从哪里来。pixelSplat（CVPR 2024）处理两张图：它用极线 Transformer 解决 SfM 位姿的尺度不确定，为每个像素预测深度桶上的离散概率，从中采样深度，并令高斯的不透明度等于所采深度桶的概率，借助这一重参数化技巧把梯度传回概率。MVSplat（ECCV 2024）改用平面扫描代价体：把其他视角的特征按 D 个逆深度候选 warp 过来计算点积相关，经 2D U-Net 精化后用 softmax 加权得到深度。按 MVSplat 表 1，它的参数量约为 pixelSplat 的 1/10（12.0M 对 125.4M），推理时间 0.044 s 对 0.104 s，RealEstate10K 上 PSNR 为 26.39 dB 对 25.89 dB（pixelSplat 原文报告 26.09 dB）。DepthSplat（CVPR 2025）在代价体之外引入预训练单目深度模型 Depth Anything V2 的特征，12 张 512×960 的输入 0.6 s 即可完成重建；它还证明高斯渲染损失可以反过来充当深度模型的无监督预训练目标。面向人像的 GPS-Gaussian（CVPR 2024）对最近的两个视角做立体校正，用 RAFT-Stereo 式的迭代匹配估计深度，再在图像平面上回归旋转、尺度和不透明度图，颜色直接取自源图；它在 RTX 3090 上以 2K 分辨率达到 25 FPS。Splatter Image（CVPR 2024）则把单张图映射成“每像素一个高斯”的图像，重建速度 38 FPS。\n\n大重建模型路线始于 LRM（ICLR 2024）：一个 5 亿参数的 Transformer 从单张图预测三平面 NeRF，在约 100 万个物体（Objaverse 渲染图加 MVImgNet 实拍）上训练，5 秒出结果。GS-LRM（ECCV 2024）把输出换成像素对齐高斯：每张图与它的 Plücker 射线图拼成 9 通道后切成 8×8 的 patch，送入 24 层、宽 1024 的 Transformer 做全局自注意力；每个像素解码出 12 个通道（RGB 3、尺度 3、四元数 4、不透明度 1、沿射线距离 1），高斯中心为 ray_o + t·ray_d。它在单张 A100 上重建只需约 0.23 s，RealEstate10K 上达到 28.10 dB（其表中 pixelSplat 为 25.89），训练用了 64 张 A100、约 3 天（256 分辨率 2 天加 512 分辨率微调 1 天）。Long-LRM 把输入扩大到 32 张 960×540 的图（约 25 万个 token），混合使用 Mamba2 块与 Transformer 块，并加入 token 合并与高斯剪枝，1 秒完成宽覆盖场景的重建；在 DL3DV 与 Tanks and Temples 上质量接近优化方法，速度快 800 倍。\n\n2025 年的主题是去掉位姿、扩大规模、处理动态。NoPoSplat（ICLR 2025）以第一个视角的相机坐标系作为规范空间，只用光度损失训练，从无位姿图像预测高斯。VGGT（CVPR 2025）等几何基础模型出现后，AnySplat 在一次前向中同时输出高斯和每张图的内外参。为了摆脱全局注意力的平方复杂度，iLRM 把场景表示与输入像素解耦并迭代精化；Quark 团队的 LVT（SIGGRAPH Asia 2025）只在每个视角的局部邻域内做注意力，用相对几何变换编码代替位置编码，一次前向即可重建任意大的场景。Fuse-and-Refine（NeurIPS 2025）把像素高斯聚合进由粗到细的体素层级，用稀疏体素 Transformer 融合与精化，支持带历史信息的动态在线重建，在单张 H100 上达到 15 fps。\n\n截至 2026-09，前馈 3DGS 已是可泛化 NVS 的主流输出形式，前沿集中在四个方向：(1) 以 VGGT、Depth Anything 3 等几何基础模型为骨干；(2) 让高斯脱离像素网格，例如 TokenGS（2026）用可学习的高斯 token 直接回归 3D 均值，高斯数量因此不再取决于分辨率和视角数；(3) 长上下文与流式处理，例如 tttLRM（CVPR 2026）用 test-time training 层以线性复杂度把大量观测压缩进快权重，能够自回归地逐步重建；(4) 面向临场的系统化，例如 Tele360（2026-09）从稀疏、无位姿的 2K 相机流实时重建动态人体高斯，用视频编码器把高斯图推流到远端，在单张消费级 GPU 上端到端超过 25 FPS。就远程临场而言，它与 Quark 的根本区别在于“一次重建、多次渲染”：GPS-Gaussian 处理源视角约需 27 ms，此后每多渲染一个视角只要约 0.8 ms；而 Quark 每渲染一个目标视角（包括每只眼）都要完整跑一遍网络。", "key_ideas": [{"name_zh": "像素对齐高斯：一个像素，一个高斯", "explain_zh": "直觉：每个输入像素本来就是某条射线打到表面的一次观测。只要知道这条射线在哪里碰到表面，就可以在那里放一个高斯：颜色取像素值，大小约等于一个像素在该深度处覆盖的范围。这样，3D 重建就化简成了 2D 的逐像素回归：网络输出深度（或沿射线的距离），以及尺度、旋转、不透明度和颜色。结构上它就是一个图像到图像的网络，可以直接用 U-Net 或 ViT 实现。数量级：GS-LRM 在场景级设定下用 2 张 256×256 的输入，产生 131,072 个高斯；Ha et al. 在 DyNeRF 1352×1014、K=4 时，每帧约 548 万个高斯。它的根本限制是只显式表示输入视锥内被看到的表面（GS-LRM 论文自己也这么说：不可见区域无法重建），被所有输入挡住的内容没有高斯。不同视角的高斯描述的是同一表面，冗余很大，还会互相穿插。与锚点的联系：Ha et al. 的第一阶段就是一个没有网络的像素对齐 3DGS。深度来自 RAFT-Stereo；尺度按解析式设定，使高斯在源图中的投影恰好覆盖 1 个像素（世界尺寸与 z/f 成正比）；旋转取单位阵，完全不透明，各向同性；颜色取像素值。作者称网络在稠密像素网格上预测出的尺度、不透明度和旋转会收敛到近似常数，所以干脆用解析值；锚点深读指出，这一说法没有消融表支撑。"}, {"name_zh": "深度从哪里来：概率采样、代价体、单目先验与立体匹配", "explain_zh": "直觉：像素对齐方法的质量几乎完全取决于深度，各方法的差别主要就在这里。(1) pixelSplat 处理两张图，用极线 Transformer 让每个像素看到另一张图上对应极线的特征及其深度编码，从而确定绝对尺度，然后输出深度桶上的概率并采样。(2) MVSplat 使用显式的平面扫描代价体，相关值最高的深度候选就是表面。它把多视角立体（见 d-mvs、a-learned-mvs）的归纳偏置直接写进了网络结构，所以参数少、泛化好。(3) DepthSplat 注意到代价体在弱纹理和遮挡区域会失效，而单目深度模型（Depth Anything V2 的特征）正好能补上。(4) GPS-Gaussian 针对固定的环形人像阵列，先做立体校正，再做 RAFT-Stereo 式的迭代匹配（T=3 次迭代），训练使用真值深度监督。(5) GS-LRM、LVSM 这一类不建代价体，由 Transformer 直接回归沿射线的距离，靠模型和数据的规模学会匹配。数值例子：MVSplat 有 12.0M 参数、推理 0.044 s；pixelSplat 有 125.4M 参数、推理 0.104 s；前者在 RealEstate10K 上的 PSNR 反而更高（26.39 对 25.89，MVSplat 表 1）。与锚点的联系：Ha et al. 的深度来源与 GPS-Gaussian 同类，都是外部立体匹配，但 Ha 没有把立体深度的计算时间算进运行时间。Quark 的深度则更像一个迭代的代价体：初始化时把输入特征反投影到固定的视差平面上（PSV 的思想），之后每次 Update & Fuse 再用渲染残差修正。"}, {"name_zh": "可微性与局部极小：为什么 pixelSplat 要“采样”深度", "explain_zh": "直觉：如果网络直接回归一个深度值，梯度只能告诉高斯“往前或往后挪一点”。当初始深度离真实表面很远时（比如估在 2 m，真实在 4 m），中间位置的损失可能更差，高斯就会卡在局部极小。pixelSplat 改为预测深度桶上的概率 p_φ，按概率采样一个桶，并令这个高斯的不透明度等于该桶的概率。如果采到的桶让渲染变好，损失对不透明度的梯度就会提高这个桶的概率。这相当于在所有候选深度之间投票，而不是沿着连续深度一步一步挪。数值例子：3 个桶位于 1、2、4 m，概率为 (0.1, 0.7, 0.2)；采到 2 m 时，高斯的 α=0.7。若真实表面在 4 m，那么采到 4 m 的那些迭代渲染误差更小，梯度会把 φ_3 推高；多次迭代后，概率质量转移到 4 m，中间不需要经过 3 m。论文的消融（RealEstate10K）显示，改为直接回归深度后 PSNR 从 26.09 降到 24.62，约低 1.5 dB，并出现斑点状伪影。MVSplat 和 DepthSplat 用代价体加 softmax 期望深度，得到了更直接的几何线索，基本绕开了这个问题。"}, {"name_zh": "一次渲染所有高斯，还是逐视角渲染再融合", "explain_zh": "直觉：像素对齐方法得到 K 组高斯后，最省事的做法是把它们合并成一个场景，一次光栅化完成（pixelSplat、MVSplat、GPS-Gaussian、GS-LRM 都这么做）。但这 K 组高斯描述的是同一个表面：由于深度误差，它们在深度上只相差几毫米，颜色又因曝光和视角不同而略有差异。3DGS 按每个高斯中心的深度排序，排序结果会在相邻像素之间、相邻帧之间来回翻转，于是出现 Z-fighting 和闪烁；深度估错的高斯还会变成飞点。因此 Ha et al.（Fig. 4）选择把每个视角单独渲染到目标相机，再由融合网络在几何引导下取舍。数值：Ha 的 No Blending 消融（仿照 GPS-Gaussian 一次渲染全部高斯）PSNR 为 24.64、STED 为 483.3；重训的 GPS-Gaussian 基线 PSNR 为 25.46、STED 为 693.0，每帧 143.4 ms；完整模型为 31.17、68.76。另一个方向是先在 3D 里融合、再渲染：Fuse-and-Refine 把各视角的像素高斯聚合进体素层级，用 Transformer 去重和精化，得到一个无冗余的持久表示，这也是它能做时间融合的前提。"}, {"name_zh": "大重建模型：token、Plücker 射线与注意力复杂度", "explain_zh": "直觉：LRM 类方法把每张输入图切成 p×p 的 patch，每个 patch 连同其中各像素的相机射线（Plücker 坐标，见 l-encoding、a-geometry-free）一起线性投影成一个 token。所有视角的 token 拼在一起做全局自注意力，让网络自己学会跨视角匹配；输出端再把 token 解码回每个像素的高斯参数。代价是注意力的计算量随 token 数平方增长。数值：GS-LRM 在场景级设定下用 2 张 256×256 的图，p=8，共 2×32×32=2048 个 token，每层注意力矩阵约 420 万个元素。Long-LRM 用 32 张 960×540 的图，约 25 万个 token，全注意力矩阵约有 6×10¹⁰ 个元素，因此改用线性复杂度的 Mamba2 块并合并 token。之后的扩展工作都在削减这个平方项：LVT 只关注空间上相邻的视角，iLRM 把全局交互拆成两阶段注意力，tttLRM 用 TTT 层实现线性复杂度。与锚点的联系：Quark 在类似问题上用了另一种省计算的办法。它不在所有视角的 token 之间做自注意力，而是让目标视角的层特征作为唯一的 query，对 M 个视角做 cross-attention（One-to-many attention），融合代价对视角数接近 O(1)。LVT 是 Quark 团队的后续工作，保留了“近邻视角最有用”的判断，但输出改成了持久的 3DGS。"}, {"name_zh": "一次重建、多次渲染：对双目与多观看者的意义", "explain_zh": "直觉：临场显示要的不是一张图，而是左右眼各一张，每秒刷新 72–90 次，有时还有多个观看者，或者光场显示器上的数十个视点。持久的 3D 表示只需重建一次，之后每个视点都只是一次光栅化；目标视角相关的表示（Quark 的 LDM、Ha 的逐目标视角融合）则每个视点都要重跑一遍。数值（各自论文报告，硬件不同，只能比较量级：GPS-Gaussian 为 RTX 3090、1024×1024；Quark 为 A100；Ha 未说明测试 GPU，且不含立体深度）：GPS-Gaussian 处理源视角约 27 ms，每渲染一个新视角约 0.8 ms，双目合计约 28.6 ms。Quark 每个视点约 32 ms（1080p），按单视点时间简单相加，双目约 64 ms，已经低于 30 fps。Ha 每个视点约 39 ms（前向 splat 10 ms、TSDF 6 ms、融合网络 23 ms，TensorRT），双目约 78 ms。反过来，持久表示需要传输，或者在接收端重建。Tele360 把逐帧的高斯图用视频编码器推流到远端再渲染；GS-SCNet（2026）把多视角编码与前馈 3DGS 联合设计，报告比 MV-HEVC + GPS-Gaussian 节省约 75% 的 BD-rate。是在服务端按头部位姿渲染出 2D 视频，还是把 3D 表示传到本地渲染，是临场系统设计的第一个分岔点（见 a-telepresence-sys、a-compression）。"}, {"name_zh": "去掉标定：无位姿前馈重建与几何基础模型", "explain_zh": "直觉：两篇锚点都假设相机已精确标定且固定不动。但实际部署中相机会被碰歪，也会因发热漂移，而标定误差会让 IBR 出现硬边（Quark）或模糊（Ha）。无位姿方法把相机参数也交给网络预测。NoPoSplat 以第一个视角为规范坐标系，直接在这个坐标系中预测所有视角的高斯，并把内参编码为 token 来确定尺度。AnySplat 在一次前向中同时输出高斯和每张图的内外参。这类方法常以 VGGT、Depth Anything 3 等几何基础模型（见 a-geo-fm）作为骨干或教师。面向临场的 Tele360 在此基础上加入了轻量的可微 Levenberg–Marquardt 相机精化层，并通过师生蒸馏从大型视觉几何基础模型迁移多视角几何先验，在稀疏、无位姿的 2K 相机流上实现了实时重建。与锚点的联系：Quark 依赖精确标定，以及由 SfM 点给出的近/远平面；Ha 依赖同步与标定，在 ENeRF-Outdoor 上就因为同步和颜色标定问题，只能在 480×270 分辨率下计算指标。无位姿的前馈 3DGS 正在去掉这个前提。"}], "equations": [{"tex": "\\boldsymbol{\\mu}_{k}(\\mathbf{u})=\\mathbf{o}_{k}+t_{k}(\\mathbf{u})\\,\\mathbf{r}_{k}(\\mathbf{u}),\\quad \\mathbf{r}_{k}(\\mathbf{u})=\\mathbf{R}_{k}^{\\top}\\mathbf{K}_{k}^{-1}\\big(\\mathbf{u}^{\\top},1\\big)^{\\top},\\qquad \\boldsymbol{\\Sigma}_{k}(\\mathbf{u})=\\mathbf{R}_{q}\\mathbf{S}\\mathbf{S}^{\\top}\\mathbf{R}_{q}^{\\top},\\qquad \\text{Ha: }\\ \\mathbf{S}\\propto\\tfrac{t_{k}(\\mathbf{u})}{f_{k}}\\mathbf{I},\\ \\mathbf{R}_{q}=\\mathbf{I},\\ \\alpha=1", "explain_zh": "像素对齐高斯的参数化。k 是输入视角编号，u 是该视角中的像素坐标；o_k 是相机中心（世界坐标）；R_k、K_k 分别是世界到相机的旋转和内参；r_k(u) 是像素 u 的射线方向，不归一化时它在相机坐标系中的 z 分量为 1，所以 t_k(u) 就是 z 深度（GS-LRM 用归一化的方向，t 是沿射线的距离，写成 ray_o + t·ray_d）；μ 是高斯中心；Σ 是协方差，R_q 由网络预测的四元数得到，S 是对角尺度矩阵；α 是不透明度。最后一式是 Ha et al. 的解析特例：尺度按“在源图中的投影恰好覆盖 1 个像素”设定，与深度除以像素焦距成正比（原文没有给出比例常数）。例：f_k=1000 px、深度 t=2 m 时，一个像素在该深度覆盖约 2 mm，高斯尺度就在这个量级；DyNeRF 1352×1014、K=4 时，共有 4×1,370,928≈548 万个高斯。GPS-Gaussian 用网络预测 R_q、S、α（分别经过归一化、Softplus、Sigmoid），pixelSplat、MVSplat、GS-LRM 也预测全部参数。"}, {"tex": "z\\sim p_{\\phi}(z)=\\operatorname{softmax}(\\boldsymbol{\\phi})_{z},\\qquad \\boldsymbol{\\mu}=\\mathbf{o}+\\big(b_{z}+\\delta_{z}\\big)\\,\\mathbf{d}_{\\mathbf{u}},\\qquad \\alpha=\\phi_{z}", "explain_zh": "pixelSplat 的概率深度采样（论文算法 1）。φ 是网络为像素 u 在 Z 个深度桶上输出的概率向量（softmax 之后和为 1）；z 是按该分布采样得到的桶编号；b_z 是第 z 个桶的深度，δ_z 是网络额外预测的桶内偏移；o 是参考相机中心，d_u 是像素 u 的射线方向；μ 是高斯中心；α 是这个高斯的不透明度，直接设为所采桶的概率 φ_z。关键在最后一式：采样本身不可微，但 α=φ_z 可微，渲染损失通过 α 把梯度传回概率 φ，这就相当于重参数化。例：3 个桶的深度为 1、2、4 m，φ=(0.1, 0.7, 0.2)；采到 z=2 时，高斯位于 2 m 处，α=0.7。若 4 m 才是真实表面，那么采到 z=3 的那些迭代渲染误差更小，其梯度会增大 φ_3，概率质量可以直接跳到 4 m，而不必沿连续深度经过 3 m。论文中每个像素也可以采样多个高斯。"}, {"tex": "C^{i}_{d_m}(\\mathbf{u})=\\frac{\\mathbf{F}^{i}(\\mathbf{u})\\cdot\\mathbf{F}^{j\\to i}_{d_m}(\\mathbf{u})}{\\sqrt{C}},\\quad m=1,\\dots,D,\\qquad \\hat{d}(\\mathbf{u})=\\sum_{m=1}^{D}\\operatorname{softmax}_{m}\\big(\\hat{C}^{i}(\\mathbf{u})\\big)\\,d_{m}", "explain_zh": "MVSplat 的代价体与深度回归。i 是参考视角，j 是另一个视角；F^i(u) 是视角 i 在像素 u 处的 C 维特征（1/4 分辨率，经跨视角 Transformer 增强）；d_m 是在近、远平面之间按逆深度均匀选取的 D 个候选深度；F^{j→i}_{d_m} 是假设深度为 d_m 时，把视角 j 的特征 warp 到视角 i 的结果。两者点积再除以 √C，就是相关值 C^i_{d_m}；视角多于两个时，对各视角的相关值逐像素取平均，因此可以接受任意数量的输入。Ĉ^i 是经 2D U-Net 精化、再上采样到全分辨率的代价；对它沿深度维做 softmax 再求期望，就得到深度 d̂(u)（之后还有一个轻量 U-Net 做残差深度细化）。例：3 个候选深度 1、2、4 m 的精化代价为 (2.1, 5.3, 1.0)，softmax 后约为 (0.039, 0.948, 0.013)，期望深度约 1.99 m。与锚点的联系：Quark 在初始化时把输入特征反投影到固定的视差平面上，在 Update & Fuse 中又按当前深度反投影得到 Δ，这两步与此处的代价体同源（见 i-psv）。"}], "evolution": [{"year": 2023, "milestone_zh": "LRM（arXiv 2023-11，ICLR 2024）用 5 亿参数的 Transformer 从单图预测三平面 NeRF，开启“大重建模型”路线"}, {"year": 2023, "milestone_zh": "12 月，pixelSplat、Splatter Image、GPS-Gaussian 几乎同时提出像素对齐的前馈 3DGS"}, {"year": 2024, "milestone_zh": "MVSplat（ECCV 2024）引入代价体；LGM 与 GS-LRM（ECCV 2024）把大重建模型的输出换成高斯"}, {"year": 2024, "milestone_zh": "10 月，DepthSplat（单目先验加代价体）、Long-LRM（32 个视角、约 25 万 token）、NoPoSplat（无位姿）相继发布"}, {"year": 2025, "milestone_zh": "几何基础模型 VGGT（CVPR 2025）发表，AnySplat、iLRM 相继发布；Ha et al.（CVPR 2025）用解析设定的像素高斯做前向 warping，并论证不应一次渲染全部视角的高斯"}, {"year": 2025, "milestone_zh": "Quark 团队的 LVT（SIGGRAPH Asia 2025）采用局部视角注意力；Fuse-and-Refine（NeurIPS 2025）用体素层级融合，支持动态在线重建；Depth Anything 3 于 2025-11 发布"}, {"year": 2026, "milestone_zh": "tttLRM（CVPR 2026）实现线性复杂度的长上下文与自回归重建；TokenGS 让高斯脱离像素网格；Tele360 与 GS-SCNet 面向实时临场与语义编码传输"}], "papers": [{"title": "pixelSplat: 3D Gaussian Splats from Image Pairs for Scalable Generalizable 3D Reconstruction", "authors": "David Charatan, Sizhe Lester Li, Andrea Tagliasacchi, Vincent Sitzmann", "year": 2024, "venue": "CVPR 2024", "url": "https://arxiv.org/abs/2312.12337", "citations": 813, "role_zh": "首个场景级像素对齐前馈 3DGS：用极线 Transformer 解决尺度不确定，用概率深度采样加上“不透明度等于概率”的重参数化来绕开局部极小（消融中比直接回归深度高约 1.5 dB）", "priority": "must"}, {"title": "MVSplat: Efficient 3D Gaussian Splatting from Sparse Multi-View Images", "authors": "Yuedong Chen, Haofei Xu, Chuanxia Zheng et al.", "year": 2024, "venue": "ECCV 2024", "url": "https://arxiv.org/abs/2403.14627", "citations": 628, "role_zh": "把平面扫描代价体引入前馈 3DGS，参数约为 pixelSplat 的 1/10，速度快 2 倍以上，跨数据集泛化更好；Ha 在 ENeRF-Outdoor 上与它做了定性比较", "priority": "must"}, {"title": "GPS-Gaussian: Generalizable Pixel-wise 3D Gaussian Splatting for Real-time Human Novel View Synthesis", "authors": "Shunyuan Zheng, Boyao Zhou, Ruizhi Shao et al.", "year": 2024, "venue": "CVPR 2024 (Highlight)", "url": "https://arxiv.org/abs/2312.02155", "citations": 221, "role_zh": "面向人像的实时前馈 3DGS：用立体校正加迭代匹配得到深度，在图像平面上回归高斯参数图，2K 分辨率 25 FPS；是 Ha 重点批判和重训比较的基线", "priority": "must"}, {"title": "GS-LRM: Large Reconstruction Model for 3D Gaussian Splatting", "authors": "Kai Zhang, Sai Bi, Hao Tan et al.", "year": 2024, "venue": "ECCV 2024", "url": "https://arxiv.org/abs/2404.19702", "citations": 375, "role_zh": "用图像与 Plücker 射线 patch token 加 24 层 Transformer 输出每像素 1
