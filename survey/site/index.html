<style>
/* ---------- base (previously supplied by the artifact page skeleton) ---------- */
html, body { margin: 0; }

  --sans: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}

  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0B1110; --surface: #121A19; --surface-2: #1A2422; --ink: #E3EBE9; --ink-2: #BCC9C6;
    --muted: #8A9B98; --rule: #26322F; --accent: #4CCFBE; --accent-ink: #04201D; --accent-soft: #10312D;
    --mile: #F0B45A; --mile-soft: #37280F; --good: #62D38F; --good-soft: #10301D; --warn: #F0B45A;
    --warn-soft: #37280F; --bad: #FF8F80; --bad-soft: #3A1714; --flash: #3A3312;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0B1110; --surface: #121A19; --surface-2: #1A2422; --ink: #E3EBE9; --ink-2: #BCC9C6;
  --muted: #8A9B98; --rule: #26322F; --accent: #4CCFBE; --accent-ink: #04201D; --accent-soft: #10312D;
  --mile: #F0B45A; --mile-soft: #37280F; --good: #62D38F; --good-soft: #10301D; --warn: #F0B45A;

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.75; }
a { color: var(--accent); text-underline-offset: 3px; text-decoration-thickness: 1px; }
a:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

.shell { max-width: 1280px; margin: 0 auto; padding-inline: 20px; padding-block: 28px 80px; display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 48px; }
.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 20px); align-self: start; max-height: calc(100vh - 40px); overflow-y: auto; font-size: 13px; }

.toc .brand:hover { color: var(--accent); }
.toc ol { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 1px; }

.toc a { display: block; color: var(--ink-2); text-decoration: none; padding: 3px 10px; border-left: 2px solid var(--rule); }

/* ---------- multi-page navigation ---------- */
.crumbs { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; font-size: 12.5px; color: var(--muted); }
.crumbs a { color: var(--ink-2); text-decoration: none; }

.crumbs b { color: var(--ink); font-weight: 500; }
.page-head { display: grid; gap: 10px; margin-bottom: -48px; }
.toc-mobile { display: none; }

.toc-mobile .chips > * { flex: none; }
.pager { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; padding-top: 8px; border-top: 1px solid var(--rule); }
.pager a { display: grid; gap: 2px; padding: 12px 14px; border: 1px solid var(--rule); border-radius: 10px; background: var(--surface); color: var(--ink); text-decoration: none; }
.pager a:hover { border-color: var(--accent); }
.pager a small { font-size: 12px; color: var(--muted); }
.pager a b { font-family: var(--serif); font-size: 15px; }
.pager a.next { text-align: right; grid-column: 2; }
.sitemap { display: grid; gap: 22px; }
.sitemap .grp-card { display: grid; gap: 10px; }
.sitemap .grp-card > p { color: var(--ink-2); max-width: 72ch; font-size: 14px; }
.sitemap .pages { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.sitemap .pages a { display: grid; gap: 4px; align-content: start; padding: 14px 16px; border: 1px solid var(--rule); border-radius: 10px; background: var(--surface); color: var(--ink); text-decoration: none; }
.sitemap .pages a:hover { border-color: var(--accent); }

a.start, a.mod { text-decoration: none; }

main { min-width: 0; display: grid; gap: 72px; }
section { display: grid; gap: 22px; scroll-margin-top: 24px; min-width: 0; }
:root { --jump-offset: 16px; }
[id] { scroll-margin-top: var(--jump-offset); }

.part { display: grid; gap: 6px; padding-top: 12px; border-top: 1px solid var(--rule); }
.part .eyebrow { color: var(--accent); }
.part h2 { font-size: clamp(26px, 3vw, 34px); }
.part p { color: var(--ink-2); max-width: 72ch; }
.eyebrow { font-family: var(--mono); font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.sec-head { display: grid; gap: 8px; }
.sec-head h2 { font-size: clamp(22px, 2.6vw, 28px); }
.sec-head .lede { color: var(--ink-2); max-width: 72ch; }
.prose { display: grid; gap: 12px; max-width: 74ch; color: var(--ink-2); }
.prose p { text-align: justify; white-space: pre-line; }
.sec-head .lede { white-space: pre-line; }

.hero { display: grid; gap: 18px; padding-top: 8px; }
.hero h1 { font-size: clamp(30px, 4.6vw, 46px); letter-spacing: .01em; }
.hero .sub { max-width: 68ch; color: var(--ink-2); font-size: 16px; }
.anchors-line { display: flex; flex-wrap: wrap; gap: 10px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; padding: 2px 10px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--rule); white-space: nowrap; }
.chip.accent { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.stats { display: flex; flex-wrap: wrap; gap: 28px; padding-top: 6px; }
.stat { display: grid; gap: 0; }
.stat b { font-family: var(--mono); font-size: 22px; font-weight: 500; color: var(--ink); }
.stat span { font-size: 12.5px; color: var(--muted); }
.starts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.start { appearance: none; text-align: left; font: inherit; cursor: pointer; background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 14px 16px; display: grid; gap: 4px; color: var(--ink); }
.start:hover { border-color: var(--accent); }
.start b { font-family: var(--serif); font-size: 15.5px; }
.start span { font-size: 13px; color: var(--ink-2); }
.start i { font-style: normal; font-family: var(--mono); font-size: 11.5px; color: var(--accent); }

.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 22px; min-width: 0; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; border-bottom: 1px solid var(--rule); }
.tab { appearance: none; background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 14px; font: inherit; font-size: 14px; color: var(--ink-2); cursor: pointer; margin-bottom: -1px; }

.anchor-body { display: grid; gap: 26px; padding-top: 22px; min-width: 0; }
.meta-line { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 16px; }
.tldr { font-size: 16px; color: var(--ink); border-left: 3px solid var(--accent); padding-left: 14px; max-width: 72ch; }
h3.sub { font-size: 17px; }
.stages { list-style: none; counter-reset: st; margin: 0; padding: 0; display: grid; gap: 12px; }
.stages li { counter-increment: st; display: grid; grid-template-columns: 34px minmax(0,1fr); gap: 10px; }
.stages li::before { content: counter(st); font-family: var(--mono); font-size: 13px; width: 26px; height: 26px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; margin-top: 2px; }
.stages b { display: block; color: var(--ink); }
.stages span { color: var(--ink-2); font-size: 14px; }
.kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1px; background: var(--rule); border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }

.two { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 24px; }

.tbl-wrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { text-align: left; vertical-align: top; padding: 10px 12px; border-bottom: 1px solid var(--rule); }
th { font-weight: 500; color: var(--muted); font-size: 12px; letter-spacing: .04em; background: var(--surface-2); position: sticky; top: 0; z-index: 1; }
tr:last-child td { border-bottom: 0; }
td.dim { color: var(--ink); font-weight: 500; white-space: nowrap; }
td.code { font-family: var(--mono); font-size: 12.5px; color: var(--ink); white-space: nowrap; }

.stack { display: grid; gap: 0; border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; background: var(--surface); }
.layer { display: grid; grid-template-columns: 200px minmax(0,1fr) 150px; gap: 20px; padding: 16px 18px; border-bottom: 1px solid var(--rule); }
.layer:last-child { border-bottom: 0; }
.layer .name b { display: block; font-family: var(--serif); font-size: 16px; }
.layer .name span { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
.layer .body { display: grid; gap: 8px; font-size: 14px; color: var(--ink-2); }
.layer .chips { display: flex; flex-wrap: wrap; gap: 6px; }
.layer .bneck { font-size: 13px; }
.layer .bneck em { font-style: normal; color: var(--bad); font-weight: 500; }
.mat { display: grid; gap: 6px; align-content: start; }
.mat .bar { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; }
.mat .bar i { height: 8px; border-radius: 2px; background: var(--surface-2); }
.mat .bar i.f1 { background: var(--v1); } .mat .bar i.f2 { background: var(--v2); } .mat .bar i.f3 { background: var(--v3); } .mat .bar i.f4 { background: var(--v4); } .mat .bar i.f5 { background: var(--v5); }
.mat small { font-size: 11.5px; color: var(--muted); }

details.area, details.card-d { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; min-width: 0; }

details.area > summary::-webkit-details-marker, details.card-d > summary::-webkit-details-marker, details.idea > summary::-webkit-details-marker, details.step > summary::-webkit-details-marker, details.qa > summary::-webkit-details-marker { display: none; }

.tog { margin-left: auto; font-family: var(--mono); font-size: 12px; color: var(--accent); }
details[open] > summary .tog::after { content: "收起"; }
details:not([open]) > summary .tog::after { content: "展开"; }
.area-body { padding: 18px 20px 22px; display: grid; gap: 22px; border-top: 1px solid var(--rule); min-width: 0; }
.subgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.subcard { border: 1px solid var(--rule); border-radius: 8px; padding: 12px 14px; display: grid; gap: 6px; align-content: start; }
.subcard b { font-size: 14px; }
.subcard .en { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.subcard p { font-size: 13.5px; color: var(--ink-2); }
.subcard .reps { font-size: 12px; color: var(--muted); }
.timeline { display: grid; gap: 0; border-left: 2px solid var(--rule); margin-left: 6px; }
.timeline div { display: grid; grid-template-columns: 58px minmax(0,1fr); gap: 10px; padding: 4px 0 4px 14px; position: relative; font-size: 13.5px; color: var(--ink-2); }
.timeline div::before { content: ""; position: absolute; left: -6px; top: 12px; width: 10px; height: 10px; border-radius: 50%; background: var(--surface); border: 2px solid var(--accent); }
.timeline .y { font-family: var(--mono); color: var(--ink); }
.btn { appearance: none; border: 1px solid var(--accent); background: transparent; color: var(--accent); border-radius: 6px; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; justify-self: start; }
.btn:hover { background: var(--accent-soft); }

.db-controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
.field { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
.field select { max-width: min(360px, 86vw); }
.field input, .field select { font: inherit; font-size: 14px; color: var(--ink); background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 7px 10px; min-width: 0; }
.field input { width: min(320px, 80vw); }
.db-count { font-size: 13px; color: var(--muted); margin-left: auto; }
.db-wrap { max-height: 78vh; overflow: auto; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); }
.db td.t { min-width: 260px; }
.db td.t a { font-weight: 500; }
.db td.t small { display: block; color: var(--muted); font-size: 12px; }

.db td.y { font-family: var(--mono); }
.tier { font-size: 11.5px; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
.tier.milestone { background: var(--mile-soft); color: var(--mile); }
.tier.important { background: var(--accent-soft); color: var(--accent); }
.tier.relevant { background: var(--surface-2); color: var(--muted); }
.areatag { font-size: 11.5px; color: var(--muted); white-space: nowrap; display: block; }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }

.card h4 { font-size: 15.5px; }
.card p { font-size: 13.5px; color: var(--ink-2); }
.card .lbl { font-size: 11.5px; color: var(--muted); letter-spacing: .04em; }

.pill { font-size: 12px; padding: 1px 9px; border-radius: 999px; white-space: nowrap; font-weight: 500; }
.pill.pursue, .pill.open, .pill.yes { background: var(--good-soft); color: var(--good); }

.pill.optional { background: var(--surface-2); color: var(--muted); font-weight: 400; }
.score { display: inline-grid; grid-template-columns: 60px 1fr; align-items: center; gap: 8px; width: 100%; }

.score .track i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.score .num { font-family: var(--mono); font-size: 12px; color: var(--ink-2); }

details.idea { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; min-width: 0; }

details.idea .ov small { display: block; font-size: 11px; color: var(--muted); }
.idea-body { border-top: 1px solid var(--rule); padding: 18px 20px 22px; display: grid; gap: 20px; min-width: 0; }
.scores { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px 18px; }

.threat.high { border-left-color: var(--bad); }
.threat.medium { border-left-color: var(--warn); }
.obj { display: grid; gap: 2px; font-size: 13.5px; }
.obj b { color: var(--ink); font-weight: 500; }
.obj span { color: var(--ink-2); }

.path { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 14px; }
.path ol { margin: 0; padding-left: 1.3em; display: grid; gap: 10px; font-size: 13.5px; }
.path ol li small { display: block; color: var(--muted); }
.note { font-size: 13px; color: var(--muted); max-width: 80ch; }

/* ---------- learning part ---------- */
.cchip { appearance: none; font: inherit; font-size: 12.5px; padding: 1px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); border: 1px solid transparent; cursor: pointer; white-space: nowrap; }
.cchip:hover { border-color: var(--accent); }
.cchip.ghost { background: transparent; border-color: var(--rule); color: var(--ink-2); }
.cchip.ghost:hover { border-color: var(--accent); color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chips .lbl { font-size: 12px; color: var(--muted); margin-right: 2px; }
.flash { animation: flash 1.6s ease-out 1; }
@keyframes flash { 0% { background-color: var(--flash); } 100% { background-color: transparent; } }
@media (prefers-reduced-motion: reduce) { .flash { animation: none; outline: 2px solid var(--accent); } }

.math-block { overflow-x: auto; overflow-y: hidden; padding: 8px 12px; background: var(--surface-2); border-radius: 6px; font-family: var(--mono); font-size: 13px; color: var(--ink); }
.math-block mjx-container { margin: 4px 0 !important; }
.eq { display: grid; gap: 6px; }
.eq p { font-size: 13.5px; color: var(--ink-2); white-space: pre-line; }
.eqs { display: grid; gap: 14px; }
.aside { background: var(--surface-2); border-radius: 8px; padding: 10px 14px; font-size: 14px; color: var(--ink-2); display: grid; gap: 2px; }
.aside b { font-size: 12px; color: var(--muted); letter-spacing: .05em; font-weight: 700; }
.aside span { white-space: pre-line; }
.idref { appearance: none; background: none; border: 0; padding: 0 1px; font: inherit; font-family: var(--mono); font-size: .86em; color: var(--accent); cursor: pointer; text-decoration: underline dotted; text-underline-offset: 3px; }
.idref:hover { text-decoration-style: solid; }

.roadmap { display: grid; gap: 10px; }
details.stage { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; min-width: 0; }
details.stage > summary { list-style: none; cursor: pointer; padding: 14px 18px; display: grid; grid-template-columns: 40px minmax(0,1fr) auto; gap: 12px; align-items: start; }
details.stage > summary::-webkit-details-marker { display: none; }
details.stage .num { font-family: var(--mono); width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: 13px; }
details.stage .head { display: grid; gap: 4px; }
details.stage .head h3 { font-size: 16.5px; }
details.stage .head p { font-size: 13.5px; color: var(--ink-2); }
details.stage .dur { font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: nowrap; }

.mods { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.mod { appearance: none; text-align: left; font: inherit; cursor: pointer; background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 12px 14px; display: grid; gap: 4px; align-content: start; color: var(--ink); }
.mod:hover { border-color: var(--accent); }
.mod i { font-style: normal; font-family: var(--mono); font-size: 11px; color: var(--muted); }
.mod b { font-family: var(--serif); font-size: 14.5px; }
.mod span { font-size: 12.5px; color: var(--ink-2); }

details.concept { border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); min-width: 0; }
details.concept > summary { list-style: none; cursor: pointer; padding: 12px 16px; display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 4px 12px; }
details.concept > summary::-webkit-details-marker { display: none; }
details.concept .nm { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
details.concept .nm b { font-family: var(--serif); font-size: 15.5px; }
details.concept .nm span { font-family: var(--mono); font-size: 11px; color: var(--muted); }
details.concept .tl { grid-column: 1 / -1; font-size: 13.5px; color: var(--ink-2); }
details.concept .uses { display: flex; gap: 6px; align-items: center; }
.concept-body { border-top: 1px solid var(--rule); padding: 16px 16px 20px; display: grid; gap: 18px; min-width: 0; }
.anchor-use { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }
.anchor-use > div { border: 1px solid var(--rule); border-radius: 8px; padding: 10px 12px; display: grid; gap: 6px; align-content: start; }
.anchor-use h5 { margin: 0; font-family: var(--sans); font-size: 12.5px; font-weight: 700; color: var(--ink); display: flex; gap: 8px; align-items: center; }
.anchor-use p { font-size: 13.5px; color: var(--ink-2); }
.anchor-use small { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
details.qa { border-top: 1px dashed var(--rule); }
details.qa > summary { list-style: none; cursor: pointer; padding: 8px 0; font-size: 14px; color: var(--ink); display: flex; gap: 8px; }
details.qa > summary::before { content: "问"; font-size: 11.5px; color: var(--accent); background: var(--accent-soft); border-radius: 4px; padding: 0 6px; height: fit-content; margin-top: 3px; }
details.qa > p { font-size: 13.5px; color: var(--ink-2); padding: 0 0 10px 30px; white-space: pre-line; }
.res { display: grid; gap: 6px; font-size: 13.5px; }
.res div { display: grid; grid-template-columns: 58px minmax(0,1fr); gap: 8px; }
.res .ty { font-family: var(--mono); font-size: 11px; color: var(--muted); padding-top: 3px; }
.res small { color: var(--muted); display: block; }

.diagram-wrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: 10px; background: var(--surface); padding: 10px; }
svg.diagram { display: block; width: 100%; min-width: 860px; height: auto; }
.dnode rect { fill: var(--surface-2); stroke: var(--rule); stroke-width: 1; }
.dnode.data rect { fill: var(--surface); stroke-dasharray: 4 3; }
.dnode.click { cursor: pointer; }
.dnode.click:hover rect, .dnode.click:focus rect { stroke: var(--accent); stroke-width: 1.6; }
.dnode.click:focus { outline: none; }
.dnode .t { fill: var(--ink); font-family: var(--sans); font-size: 13px; font-weight: 500; }
.dnode .s { fill: var(--muted); font-family: var(--sans); font-size: 11px; }
.dnode .k { fill: var(--accent); font-family: var(--mono); font-size: 10.5px; font-weight: 500; }
.dedge { stroke: var(--muted); stroke-width: 1.4; fill: none; }
.dedge.fb { stroke: var(--accent); stroke-dasharray: 5 4; }
.dhead { fill: var(--muted); }
.dhead.fb { fill: var(--accent); }
.dloop { fill: var(--accent-soft); fill-opacity: .45; stroke: var(--accent); stroke-width: 1; }
.dlabel { fill: var(--accent); font-family: var(--sans); font-size: 12px; font-weight: 700; }
.dnote { fill: var(--muted); font-family: var(--sans); font-size: 11.5px; }

details.step { border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); min-width: 0; }
details.step > summary { list-style: none; cursor: pointer; padding: 12px 16px; display: grid; grid-template-columns: 44px minmax(0,1fr) auto; gap: 10px; align-items: baseline; }
details.step .sid { font-family: var(--mono); font-size: 12px; color: var(--accent); }
details.step .st { display: grid; gap: 2px; }
details.step .st b { font-size: 15px; font-weight: 500; color: var(--ink); }
details.step .st small { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.step-body { border-top: 1px solid var(--rule); padding: 16px; display: grid; gap: 16px; min-width: 0; }
.checklist { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; }
.checklist div { border: 1px solid var(--rule); border-radius: 8px; padding: 8px 12px; display: grid; gap: 4px; font-size: 13px; color: var(--ink-2); align-content: start; }

.lanes-wrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: 10px; background: var(--surface); padding: 12px 12px 6px; position: relative; }
svg.lanes { display: block; width: 100%; min-width: 820px; height: auto; }
.lanes .grid { stroke: var(--rule); stroke-width: 1; }
.lanes .axis { fill: var(--muted); font-family: var(--mono); font-size: 11px; }
.lanes .lane-l { fill: var(--ink-2); font-family: var(--sans); font-size: 12px; }
.lanes .dot { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.lanes .dot.hollow { fill: var(--surface); stroke: var(--accent); stroke-width: 1.6; }
.lanes .hit { fill: transparent; cursor: pointer; }
.lanes g.m:hover .dot, .lanes g.m:focus .dot { stroke: var(--ink); }
.lanes g.m:focus { outline: none; }
.lanes .brk { stroke: var(--muted); stroke-width: 1; }
.vtip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; color: var(--ink); max-width: 320px; box-shadow: 0 4px 16px rgba(0,0,0,.12); display: grid; gap: 2px; z-index: 3; }
.vtip small { color: var(--muted); font-family: var(--mono); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--muted); align-items: center; padding: 4px 4px 0; }
.legend svg { vertical-align: middle; }
.classic-list { display: grid; gap: 10px; }
details.classic { border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); min-width: 0; }
details.classic > summary { list-style: none; cursor: pointer; padding: 10px 16px; display: grid; grid-template-columns: 52px minmax(0,1fr) auto; gap: 10px; align-items: baseline; }
details.classic > summary::-webkit-details-marker { display: none; }
details.classic .yr { font-family: var(--mono); font-size: 13px; color: var(--ink); }
details.classic .ti { display: grid; gap: 2px; }
details.classic .ti b { font-size: 14.5px; font-weight: 500; }
details.classic .ti small { font-size: 12px; color: var(--muted); }
details.classic .cit { font-family: var(--mono); font-size: 12px; color: var(--ink-2); text-align: right; white-space: nowrap; }
.classic-body { border-top: 1px solid var(--rule); padding: 12px 16px 16px; display: grid; gap: 12px; }

.gl-wrap { max-height: 72vh; overflow: auto; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); }
.gl td.en { font-weight: 500; color: var(--ink); min-width: 170px; }
.gl td.zh { min-width: 110px; }
.gl td.def { min-width: 300px; color: var(--ink-2); }

@media (max-width: 1000px) {
  .shell { grid-template-columns: minmax(0,1fr); gap: 20px; padding-top: 0; }
  .toc { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); max-height: none; overflow-x: auto; overflow-y: hidden; padding-block: 10px; border-bottom: 1px solid var(--rule); margin-inline: -20px; padding-inline: 20px; }
  .toc .brand, .toc .ramp, .toc li.grp, .toc ol.sub { display: none; }
  .toc ol { display: flex; gap: 4px; margin: 0; white-space: nowrap; }
  .toc a { border-left: 0; border-bottom: 2px solid transparent; padding: 4px 8px; }
  .toc a.on, .toc a.page.cur { border-bottom-color: var(--accent); }
  .toc-mobile { display: grid; gap: 6px; }
  :root { --jump-offset: 72px; }
  .toc { scrollbar-width: none; }
  .toc::-webkit-scrollbar { display: none; }
  .pager { grid-template-columns: minmax(0, 1fr); }
  .pager a.next { grid-column: 1; }
  .layer { grid-template-columns: minmax(0,1fr); gap: 10px; }
  .two, .idea-grid, .path, .anchor-use { grid-template-columns: minmax(0,1fr); }
  .mods { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .starts { grid-template-columns: minmax(0,1fr); }
}
@media (max-width: 560px) {
  .shell { padding-inline: 16px; }
  .toc { margin-inline: -16px; padding-inline: 16px; }
  .panel { padding: 16px; }
  details.idea > summary { grid-template-columns: minmax(0,1fr) auto; }
  details.idea .rank { display: none; }
  details.step > summary { grid-template-columns: minmax(0,1fr) auto; }
  details.step .sid { display: none; }
  details.classic > summary { grid-template-columns: 44px minmax(0,1fr); }
  details.classic .cit { grid-column: 2; text-align: left; }
  .mods { grid-template-columns: minmax(0,1fr); }
  .area-body, .idea-body, .concept-body, .step-body { padding-inline: 12px; }
}

/* ---------- overflow guards: long labels wrap inside cards instead of widening the page ---------- */
.cchip, .chip { max-width: 100%; }
.chips .cchip, .classic-body .chip, .card .chip { white-space: normal; overflow-wrap: anywhere; text-align: left; }
.toc-mobile .chips > * { white-space: nowrap; }
.card, .anchor-use > div, .classic-body, .concept-body, .step-body, .area-body, .idea-body, .blk, .subcard { grid-template-columns: minmax(0, 1fr); }
@media (min-width: 1001px) { .page-head.only-mobile { display: none; } }
@media (max-width: 1000px) { .page-head { margin-bottom: -40px; } }
main { overflow-wrap: break-word; }
.prose, .sec-head, .hero, .threat, .obj, .eqs, .eq, .kv div, .checklist div, .layer .body, .anchor-body, .classic-list, .roadmap { grid-template-columns: minmax(0, 1fr); }
mjx-container[jax="SVG"]:not([display="true"]) { display: inline-block; max-width: 100%; overflow-x: auto; overflow-y: hidden; vertical-align: middle; }
ul.plain, .path ol, .res, .timeline, .stages, .subgrid > *, .cards > * { grid-template-columns: minmax(0, 1fr); }
ul.plain li, .res span, .threat span { overflow-wrap: anywhere; }

</style>
</head>

<div class="shell">

<script type="application/json" id="data">{"meta": {"date": "2026-09-28", "subtitle": "以 Quark（Google，SIGGRAPH Asia 2024）与 Ha et al.（KAIST + Meta，CVPR 2025）两篇实时多视角新视角合成论文为出发点，分三部分展开。第一部分帮你入门：基础知识、进阶专题、经典论文，以及把基础知识和两篇论文逐步对上的精读导读。第二部分梳理 3D 临场（telepresence）的全栈调研：采集、几何、表示、渲染、传输、显示与感知。第三部分给出 18 个经过对抗式查新和模拟 AC 评审的研究方向。", "learn_lede": "面向刚进入 3D 视觉 / 临场方向的研究生，默认你有本科线代、概率、Python 和基础深度学习。建议的用法：按“学习路线”推进；遇到不懂的词查“术语表”；读两篇锚点论文时开着“精读导读”，每一步都能点回需要的基础概念。基础概念卡片也会反过来标出它在 Quark 和 Ha et al. 的哪一步用到。", "foundations_lede": "8 个模块按学习顺序排列。每个概念都有：一句话要点、直觉解释、类比、逐项拆解的公式、带数字的例子、易错点、它在两篇锚点论文中的具体位置、学习资源和自测题。标签“Quark 用到 / Ha 用到”表示该概念是否直接出现在对应论文中。", "guided_lede": "把两篇论文按流水线拆成若干步。每一步写清楚：做什么（输入 → 输出）、白话解释、类比、论文公式逐项拆解、具体超参、为什么这样设计、容易误解的地方和自测题，并链接到需要的基础概念。点击流程图的方框可以直接跳到对应步骤。内容写完后由另一个 agent 对照论文原文逐条核查，并修正了发现的错误。", "advanced_lede": "16 个进阶专题，每个包含核心思想、关键公式、演进时间线、按优先级排序的奠基论文（附 Semantic Scholar / OpenAlex 引用数）、与两篇锚点论文的关系、争论与开放问题。", "classics_lede": "按 6 个主题收录 2025 年及以前发表的高影响论文。入选标准是引用数高或改变了领域走向，并且偏重两篇锚点论文所依赖的工作。每篇都由另一个 agent 复核了是否存在、年份与会议，以及引用数（来源为 Semantic Scholar 或 OpenAlex，2026 年 9 月）。上图横轴 2010 年以前做了压缩。", "survey_lede": "以两篇锚点论文为坐标原点，覆盖 10 个子方向、350 余条论文 / 产品 / 标准，以及全栈地图、范式对比、趋势与挑战。", "ideas_lede": "这些方向来自 5 个独立视角（失败模式、基础模型、系统、问题重构/评测、跨领域）共 30 个 idea，聚类为 18 个方向。每个方向先由一个 agent 专门找“已经被做过”的证据，再由一个模拟 AC 的 agent 重新定位、打分、设计实验。结论：没有一个方向是完全空白的，18 个全部判定为“部分已被做，需要重新定位”。综合分 5 分约等于一篇普通录用论文的水平。列表按综合分排序，点开可看核心论点、查新找到的撞车工作、两周验证实验和止损标准。", "method_zh": "本报告由多 agent 工作流生成，所有 agent 都能联网检索（arXiv API、Semantic Scholar、OpenAlex、网页搜索）。\n\n调研部分：先精读两篇锚点论文（含附录），并对照原文逐条核查未言明的问题，例如 Ha et al. 的运行时间没算立体深度估计，TSDF 消融几乎没有增益。然后分 10 个子方向检索，每个方向 25–45 篇带真实链接的工作，分为里程碑 / 重要 / 相关三档，再由一个综合 agent 写出全景图、范式对比、趋势、重大挑战和阅读清单。\n\n研究方向部分：5 个视角各自提出 idea，聚类为 18 个方向。每个方向先做对抗式查新（抽查引用是否真实存在，至少 10 组检索），再做模拟 AC 评审。\n\n使用说明：这些内容由 AI agent 检索和撰写，可能有遗漏、过时或数字不准，2026 年 7–9 月的新论文覆盖尤其有限。引用或投稿前请务必打开原文核实，尤其是 2026 年的 arXiv 编号、性能数字和引用数。评分只用于比较方向之间的相对强弱，不代表真实的录用概率。\n\n入门学习部分：先固定一份课程骨架（8 个模块、40 个概念、16 个进阶专题），所有内容都用同一套 ID 互相链接。基础知识每个模块由一个 agent 撰写，再由技术编辑 agent 核查公式、数值例子、链 ", "foundations.html"], ["module-", "foundations.html"], ["walk-", "guided.html"], ["guide-", "guided.html"], ["adv-", "advanced.html"], ["classic-", "classics.html"], ["stage-", "roadmap.html"], ["area-", "areas.html"], ["idea-", "ideas.html"], ["anchor-", "anchors.html"]]}, "home": {"counts": {"concepts": 40, "advanced": 16, "classics": 152, "papers": 359, "ideas": 18, "glossary": 195, "areas": 10, "stages": 8, "steps": {"quark": 12, "ha": 14}}, "executive_summary_zh": "以 Quark（Google，SIGGRAPH Asia 2024）和 Ha et al.（KAIST + Meta，CVPR 2025）为起点看，3D telepresence 在 2024–2026 年的核心矛盾很清楚：单帧质量与分辨率、时间和视角一致性、端到端延迟，这三者目前没有任何方法能同时做到。Quark 走“学习驱动、质量优先、无状态”：在单张 A100 上用 8 路输入逐帧即时预测 LDM，再做 IBR 混合，重建加渲染 1080p/30fps，单帧质量可与逐场景优化的 Zip-NeRF 相当，但帧间会闪烁。Ha et al. 走“几何驱动、一致性优先、弱状态”：用外部立体深度、image-based TSDF 和一个 4 层 U-Net，把 STED 从 95 降到 69，PSNR 几乎不变。两者长短互补，合起来正好勾勒出下一代实时渲染器的样子：高分辨率 IBR 细节，加上可跨视角、跨时间共享的几何或记忆状态。\n\n从全栈看，瓶颈已经从“能不能实时渲染”转到了“能不能在一致性和系统约束下实时渲染”。渲染速度本身基本解决了：逐场景 4DGS 可达数百到上千 FPS，前馈方法 Quark、3DTV、Tele360 在 1–2K 下每帧 25–35 ms。真正卡住的是四件事。第一，时间一致性：多数前馈方法逐帧独立处理，Tele360 和 Quark 都自承闪烁。第二，端到端延迟与传输：Starline 全链路 105.8 ms 仍是标杆，学术系统在普通客户端上常为 0.5 s 量级，逐帧高斯流需要 80–200 Mbps。第三，多视点显示的成本放大：双目要算两份，光场屏要 45 个以上视角。第四，评测：缺少能同时衡量画质、闪烁、延迟、码率和 QoE 的基准。\n\n表示与方法层面，六条路线在竞争中逐渐合流：分层/IBR（Quark、Ha et al.），feed-forward 3DGS（pixelSplat → GS-LRM → Tele360），无几何 Transformer（LVSM → NSTM），逐场景或流式 4DGS（STG、3DGStream、IGS），参数化化身（Codec Avatars → LCA），生成式视频和世界模型（GEN3C、Self Forcing、Genie 3）。收敛方向是“少量几何 + 高分辨率图像细节 + 学习型时间记忆 + 置信度门控的生成补全”。一个明显的信号是：Quark 所在的 Google 团队自己已经转向 Fuse-and-Refine（3DGS + 稀疏体素）、LVT 和 NSTM（LVSM + 在线时空记忆），等于承认“逐视角、无状态”这一设计需要补上时间状态。\n\n几何前端正在被基础模型改写。VGGT、Depth Anything 3、MapAnything 已基本取代 COLMAP + MVS 成为离线默认；FoundationStereo 经 Fast-FoundationStereo 蒸馏，已降到 20–50 ms 一对；CUT3R 和 TTT3R 这类流式模型在约 518 像素下有 14–20 FPS。但还缺一块关键拼图：面向“N 个固定、已标定、朝内的相机 × 时间”的流式几何模型，能以标定为条件、为每个相机维护时间记忆，并直接给出目标视角深度。它正好能替换 Ha et al. 那套 RAFT-Stereo + 手工时间滤波 + TSDF 的流程。\n\n产业上，截至 2026 年 9 月形成三条路径。第一条是采集式裸眼光场终端：Google Beam / HP Dimension，6 路 RGB 加 AI 体积模型，60 fps，约 2.5 万美元，3D 通话仅限 1:1。第二条是头显或眼镜端的写实化身：Apple Persona、Meta Codec Avatars/Hologram、Android XR Likeness，靠低码率参数驱动，但真实性依赖先验。第三条是 4DGS 体积视频串流，码率 17–75 Mbps。标准也在快速向 3DGS 收敛：Khronos KHR_gaussian_splatting、MPEG GSC 的 V-PCC 与 G-PCC 修正案均已到 CDAM。未来 1–3 年最现实的机会是：把 Quark 级的前馈 IBR 接到时间一致的几何或记忆状态上，用生成模型只补去遮挡区域，并在编码、传输、显示层做联合设计，从 1:1 走向多方，从固定头位走向真 6DoF。", "pageDesc": {"home": "全站概览、执行摘要、内容导航与调研方法。", "roadmap": "8 个阶段：每阶段的概念、论文、课程、动手项目和检查题，最后复现两篇锚点论文。", "foundations": "8 个模块、40 个概念：直觉、公式、例子、易错点，以及在两篇锚点论文中的位置。", "guided": "把 Quark（12 步）和 Ha et al.（14 步）逐步拆开，每一步链接到所需的基础概念。", "advanced": "16 个进阶专题：核心思想、演进时间线和按优先级排序的奠基论文。", "classics": "152 篇 2026 年前的高影响论文（时间分布图 + 可筛选列表），以及前沿阅读清单。", "glossary": "195 条中英术语，可搜索，并链接到基础概念。", "anchors": "两篇锚点论文的研究视角精读：精确数字、设计选择、局限与谱系，以及两者的对比与互补。", "landscape": "端到端技术栈全景、表示与渲染范式对比、跨方向趋势与重大挑战。", "areas": "10 个子方向的综述，以及 359 条可筛选的论文 / 产品 / 标准库。", "ideas": "18 个经对抗查新与模拟评审的研究方向。", "method": "调研流程、核查方式与使用注意事项（位于概览页底部）。"}}}</script>
