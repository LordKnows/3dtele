.obj b { color: var(--ink); font-weight: 500; }

.path { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 14px; }
.path ol { margin: 0; padding-left: 1.3em; display: grid; gap: 10px; font-size: 13.5px; }
.path ol li small { display: block; color: var(--muted); }
.note { font-size: 13px; color: var(--muted); max-width: 80ch; }

/* ---------- learning part ---------- */
.cchip { appearance: none; font: inherit; font-size: 12.5px; padding: 1px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); border: 1px solid transparent; cursor: pointer; white-space: nowrap; }
.cchip:hover { border-color: var(--accent); }
.cchip.ghost { background: transparent; border-color: var(--rule); color: var(--ink-2); }
.cchip.ghost:hover { border-color: var(--accent); color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chips .lbl { font-size: 12px; color: var(--muted); margin-right: 2px; }
.flash { animation: flash 1.6s ease-out 1; }
@keyframes flash { 0% { background-color: var(--flash); } 100% { background-color: transparent; } }
@media (prefers-reduced-motion: reduce) { .flash { animation: none; outline: 2px solid var(--accent); } }

.math-block { overflow-x: auto; overflow-y: hidden; padding: 8px 12px; background: var(--surface-2); border-radius: 6px; font-family: var(--mono); font-size: 13px; color: var(--ink); }
.math-block mjx-container { margin: 4px 0 !important; }
.eq { display: grid; gap: 6px; }
.eq p { font-size: 13.5px; color: var(--ink-2); white-space: pre-line; }
.eqs { display: grid; gap: 14px; }
.aside { background: var(--surface-2); border-radius: 8px; padding: 10px 14px; font-size: 14px; color: var(--ink-2); display: grid; gap: 2px; }
.aside b { font-size: 12px; color: var(--muted); letter-spacing: .05em; font-weight: 700; }
.aside span { white-space: pre-line; }
.idref { appearance: none; background: none; border: 0; padding: 0 1px; font: inherit; font-family: var(--mono); font-size: .86em; color: var(--accent); cursor: pointer; text-decoration: underline dotted; text-underline-offset: 3px; }
.idref:hover { text-decoration-style: solid; }

.roadmap { display: grid; gap: 10px; }
details.stage { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; min-width: 0; }
details.stage > summary { list-style: none; cursor: pointer; padding: 14px 18px; display: grid; grid-template-columns: 40px minmax(0,1fr) auto; gap: 12px; align-items: start; }
details.stage > summary::-webkit-details-marker { display: none; }
details.stage .num { font-family: var(--mono); width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: 13px; }
details.stage .head { display: grid; gap: 4px; }
details.stage .head h3 { font-size: 16.5px; }
details.stage .head p { font-size: 13.5px; color: var(--ink-2); }
details.stage .dur { font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: nowrap; }

.mods { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.mod { appearance: none; text-align: left; font: inherit; cursor: pointer; background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 12px 14px; display: grid; gap: 4px; align-content: start; color: var(--ink); }
.mod:hover { border-color: var(--accent); }
.mod i { font-style: normal; font-family: var(--mono); font-size: 11px; color: var(--muted); }
.mod b { font-family: var(--serif); font-size: 14.5px; }
.mod span { font-size: 12.5px; color: var(--ink-2); }

details.concept { border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); min-width: 0; }
details.concept > summary { list-style: none; cursor: pointer; padding: 12px 16px; display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 4px 12px; }
details.concept > summary::-webkit-details-marker { display: none; }
details.concept .nm { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
details.concept .nm b { font-family: var(--serif); font-size: 15.5px; }
details.concept .nm span { font-family: var(--mono); font-size: 11px; color: var(--muted); }
details.concept .tl { grid-column: 1 / -1; font-size: 13.5px; color: var(--ink-2); }
details.concept .uses { display: flex; gap: 6px; align-items: center; }
.concept-body { border-top: 1px solid var(--rule); padding: 16px 16px 20px; display: grid; gap: 18px; min-width: 0; }
.anchor-use { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }
.anchor-use > div { border: 1px solid var(--rule); border-radius: 8px; padding: 10px 12px; display: grid; gap: 6px; align-content: start; }
.anchor-use h5 { margin: 0; font-family: var(--sans); font-size: 12.5px; font-weight: 700; color: var(--ink); display: flex; gap: 8px; align-items: center; }
.anchor-use p { font-size: 13.5px; color: var(--ink-2); }
.anchor-use small { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
details.qa { border-top: 1px dashed var(--rule); }
details.qa > summary { list-style: none; cursor: pointer; padding: 8px 0; font-size: 14px; color: var(--ink); display: flex; gap: 8px; }
details.qa > summary::before { content: "问"; font-size: 11.5px; color: var(--accent); background: var(--accent-soft); border-radius: 4px; padding: 0 6px; height: fit-content; margin-top: 3px; }
details.qa > p { font-size: 13.5px; color: var(--ink-2); padding: 0 0 10px 30px; white-space: pre-line; }
.res { display: grid; gap: 6px; font-size: 13.5px; }
.res div { display: grid; grid-template-columns: 58px minmax(0,1fr); gap: 8px; }
.res .ty { font-family: var(--mono); font-size: 11px; color: var(--muted); padding-top: 3px; }
.res small { color: var(--muted); display: block; }

.diagram-wrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: 10px; background: var(--surface); padding: 10px; }
svg.diagram { display: block; width: 100%; min-width: 860px; height: auto; }
.dnode rect { fill: var(--surface-2); stroke: var(--rule); stroke-width: 1; }
.dnode.data rect { fill: var(--surface); stroke-dasharray: 4 3; }
.dnode.click { cursor: pointer; }
.dnode.click:hover rect, .dnode.click:focus rect { stroke: var(--accent); stroke-width: 1.6; }
.dnode.click:focus { outline: none; }
.dnode .t { fill: var(--ink); font-family: var(--sans); font-size: 13px; font-weight: 500; }
.dnode .s { fill: var(--muted); font-family: var(--sans); font-size: 11px; }
.dnode .k { fill: var(--accent); font-family: var(--mono); font-size: 10.5px; font-weight: 500; }
.dedge { stroke: var(--muted); stroke-width: 1.4; fill: none; }
.dedge.fb { stroke: var(--accent); stroke-dasharray: 5 4; }
.dhead { fill: var(--muted); }
.dhead.fb { fill: var(--accent); }
.dloop { fill: var(--accent-soft); fill-opacity: .45; stroke: var(--accent); stroke-width: 1; }
.dlabel { fill: var(--accent); font-family: var(--sans); font-size: 12px; font-weight: 700; }
.dnote { fill: var(--muted); font-family: var(--sans); font-size: 11.5px; }

details.step { border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); min-width: 0; }
details.step > summary { list-style: none; cursor: pointer; padding: 12px 16px; display: grid; grid-template-columns: 44px minmax(0,1fr) auto; gap: 10px; align-items: baseline; }
details.step .sid { font-family: var(--mono); font-size: 12px; color: var(--accent); }
details.step .st { display: grid; gap: 2px; }
details.step .st b { font-size: 15px; font-weight: 500; color: var(--ink); }
details.step .st small { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.step-body { border-top: 1px solid var(--rule); padding: 16px; display: grid; gap: 16px; min-width: 0; }
.checklist { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; }
.checklist div { border: 1px solid var(--rule); border-radius: 8px; padding: 8px 12px; display: grid; gap: 4px; font-size: 13px; color: var(--ink-2); align-content: start; }

.lanes-wrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: 10px; background: var(--surface); padding: 12px 12px 6px; position: relative; }
svg.lanes { display: block; width: 100%; min-width: 820px; height: auto; }
.lanes .grid { stroke: var(--rule); stroke-width: 1; }
.lanes .axis { fill: var(--muted); font-family: var(--mono); font-size: 11px; }
.lanes .lane-l { fill: var(--ink-2); font-family: var(--sans); font-size: 12px; }
.lanes .dot { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.lanes .dot.hollow { fill: var(--surface); stroke: var(--accent); stroke-width: 1.6; }
.lanes .hit { fill: transparent; cursor: pointer; }
.lanes g.m:hover .dot, .lanes g.m:focus .dot { stroke: var(--ink); }
.lanes g.m:focus { outline: none; }
.lanes .brk { stroke: var(--muted); stroke-width: 1; }
.vtip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; color: var(--ink); max-width: 320px; box-shadow: 0 4px 16px rgba(0,0,0,.12); display: grid; gap: 2px; z-index: 3; }
.vtip small { color: var(--muted); font-family: var(--mono); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--muted); align-items: center; padding: 4px 4px 0; }
.legend svg { vertical-align: middle; }
.classic-list { display: grid; gap: 10px; }
details.classic { border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); min-width: 0; }
details.classic > summary { list-style: none; cursor: pointer; padding: 10px 16px; display: grid; grid-template-columns: 52px minmax(0,1fr) auto; gap: 10px; align-items: baseline; }
details.classic > summary::-webkit-details-marker { display: none; }
details.classic .yr { font-family: var(--mono); font-size: 13px; color: var(--ink); }
details.classic .ti { display: grid; gap: 2px; }
details.classic .ti b { font-size: 14.5px; font-weight: 500; }
details.classic .ti small { font-size: 12px; color: var(--muted); }
details.classic .cit { font-family: var(--mono); font-size: 12px; color: var(--ink-2); text-align: right; white-space: nowrap; }
.classic-body { border-top: 1px solid var(--rule); padding: 12px 16px 16px; display: grid; gap: 12px; }

.gl-wrap { max-height: 72vh; overflow: auto; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); }
.gl td.en { font-weight: 500; color: var(--ink); min-width: 170px; }
.gl td.zh { min-width: 110px; }
.gl td.def { min-width: 300px; color: var(--ink-2); }

@media (max-width: 1000px) {
  .shell { grid-template-columns: minmax(0,1fr); gap: 20px; padding-top: 0; }
  .toc { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); max-height: none; overflow-x: auto; overflow-y: hidden; padding-block: 10px; border-bottom: 1px solid var(--rule); margin-inline: -20px; padding-inline: 20px; }
  .toc .brand, .toc .ramp, .toc li.grp, .toc ol.sub { display: none; }
  .toc ol { display: flex; gap: 4px; margin: 0; white-space: nowrap; }
  .toc a { border-left: 0; border-bottom: 2px solid transparent; padding: 4px 8px; }
  .toc a.on, .toc a.page.cur { border-bottom-color: var(--accent); }
  .toc-mobile { display: grid; gap: 6px; }
  :root { --jump-offset: 72px; }
  .toc { scrollbar-width: none; }
  .toc::-webkit-scrollbar { display: none; }
  .pager { grid-template-columns: minmax(0, 1fr); }
  .pager a.next { grid-column: 1; }
  .layer { grid-template-columns: minmax(0,1fr); gap: 10px; }
  .two, .idea-grid, .path, .anchor-use { grid-template-columns: minmax(0,1fr); }
  .mods { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .starts { grid-template-columns: minmax(0,1fr); }
}
@media (max-width: 560px) {
  .shell { padding-inline: 16px; }
  .toc { margin-inline: -16px; padding-inline: 16px; }
  .panel { padding: 16px; }
  details.idea > summary { grid-template-columns: minmax(0,1fr) auto; }
  details.idea .rank { display: none; }
  details.step > summary { grid-template-columns: minmax(0,1fr) auto; }
  details.step .sid { display: none; }
  details.classic > summary { grid-template-columns: 44px minmax(0,1fr); }
  details.classic .cit { grid-column: 2; text-align: left; }
  .mods { grid-template-columns: minmax(0,1fr); }
  .area-body, .idea-body, .concept-body, .step-body { padding-inline: 12px; }
}

/* ---------- overflow guards: long labels wrap inside cards instead of widening the page ---------- */
.cchip, .chip { max-width: 100%; }
.chips .cchip, .classic-body .chip, .card .chip { white-space: normal; overflow-wrap: anywhere; text-align: left; }
.toc-mobile .chips > * { white-space: nowrap; }
.card, .anchor-use > div, .classic-body, .concept-body, .step-body, .area-body, .idea-body, .blk, .subcard { grid-template-columns: minmax(0, 1fr); }
@media (min-width: 1001px) { .page-head.only-mobile { display: none; } }
@media (max-width: 1000px) { .page-head { margin-bottom: -40px; } }
main { overflow-wrap: break-word; }
.prose, .sec-head, .hero, .threat, .obj, .eqs, .eq, .kv div, .checklist div, .layer .body, .anchor-body, .classic-list, .roadmap { grid-template-columns: minmax(0, 1fr); }
mjx-container[jax="SVG"]:not([display="true"]) { display: inline-block; max-width: 100%; overflow-x: auto; overflow-y: hidden; vertical-align: middle; }
ul.plain, .path ol, .res, .timeline, .stages, .subgrid > *, .cards > * { grid-template-columns: minmax(0, 1fr); }
ul.plain li, .res span, .threat span { overflow-wrap: anywhere; }

</style>
</head>

<div class="shell">

<script type="application/json" id="data">{"meta": {"date": "2026-09-28", "subtitle": "以 Quark（Google，SIGGRAPH Asia 2024）与 Ha et al.（KAIST + Meta，CVPR 2025）两篇实时多视角新视角合成论文为出发点，分三部分展开。第一部分帮你入门：基础知识、进阶专题、经典论文，以及把基础知识和两篇论文逐步对上的精读导读。第二部分梳理 3D 临场（telepresence）的全栈调研：采集、几何、表示、渲染、传输、显示与感知。第三部分给出 18 个经过对抗式查新和模拟 AC 评审的研究方向。", "learn_lede": "面向刚进入 3D 视觉 / 临场方向的研究生，默认你有本科线代、概率、Python 和基础深度学习。建议的用法：按“学习路线”推进；遇到不懂的词查“术语表”；读两篇锚点论文时开着“精读导读”，每一步都能点回需要的基础概念。基础概念卡片也会反过来标出它在 Quark 和 Ha et al. 的哪一步用到。", "foundations_lede": "8 个模块按学习顺序排列。每个概念都有：一句话要点、直觉解释、类比、逐项拆解的公式、带数字的例子、易错点、它在两篇锚点论文中的具体位置、学习资源和自测题。标签“Quark 用到 / Ha 用到”表示该概念是否直接出现在对应论文中。", "guided_lede": "把两篇论文按流水线拆成若干步。每一步写清楚：做什么（输入 → 输出）、白话解释、类比、论文公式逐项拆解、具体超参、为什么这样设计、容易误解的地方和自测题，并链接到需要的基础概念。点击流程图的方框可以直接跳到对应步骤。内容写完后由另一个 agent 对照论文原文逐条核查，并修正了发现的错误。", "advanced_lede": "16 个进阶专题，每个包含核心思想、关键公式、演进时间线、按优先级排序的奠基论文（附 Semantic Scholar / OpenAlex 引用数）、与两篇锚点论文的关系、争论与开放问题。", "classics_lede": "按 6 个主题收录 2025 年及以前发表的高影响论文。入选标准是引用数高或改变了领域走向，并且偏重两篇锚点论文所依赖的工作。每篇都由另一个 agent 复核了是否存在、年份与会议，以及引用数（来源为 Semantic Scholar 或 OpenAlex，2026 年 9 月）。上图横轴 2010 年以前做了压缩。", "survey_lede": "以两篇锚点论文为坐标原点，覆盖 10 个子方向、350 余条论文 / 产品 / 标准，以及全栈地图、范式对比、趋势与挑战。", "ideas_lede": "这些方向来自 5 个独立视角（失败模式、基础模型、系统、问题重构/评测、跨领域）共 30 个 idea，聚类为 18 个方向。每个方向先由一个 agent 专门找“已经被做过”的证据，再由一个模拟 AC 的 agent 重新定位、打分、设计实验。结论：没有一个方向是完全空白的，18 个全部判定为“部分已被做，需要重新定位”。综合分 5 分约等于一篇普通录用论文的水平。列表按综合分排序，点开可看核心论点、查新找到的撞车工作、两周验证实验和止损标准。", "method_zh": "本报告由多 agent 工作流生成，所有 agent 都能联网检索（arXiv API、Semantic Scholar、OpenAlex、网页搜索）。\n\n调研部分：先精读两篇锚点论文（含附录），并对照原文逐条核查未言明的问题，例如 Ha et al. 的运行时间没算立体深度估计，TSDF 消融几乎没有增益。然后分 10 个子方向检索，每个方向 25–45 篇带真实链接的工作，分为里程碑 / 重要 / 相关三档，再由一个综合 agent 写出全景图、范式对比、趋势、重大挑战和阅读清单。\n\n研究方向部分：5 个视角各自提出 idea，聚类为 18 个方向。每个方向先做对抗式查新（抽查引用是否真实存在，至少 10 组检索），再做模拟 AC 评审。\n\n使用说明：这些内容由 AI agent 检索和撰写，可能有遗漏、过时或数字不准，2026 年 7–9 月的新论文覆盖尤其有限。引用或投稿前请务必打开原文核实，尤其是 2026 年的 arXiv 编号、性能数字和引用数。评分只用于比较方向之间的相对强弱，不代表真实的录用概率。\n\n入门学习部分：先固定一份课程骨架（8 个模块、40 个概念、16 个进阶专题），所有内容都用同一套 ID 互相链接。基础知识每个模块由一个 agent 撰写，再由技术编辑 agent 核查公式、数值例子、链接以及与两篇论文的对应关系，共修正 145 处。进阶专题同样经过撰写与复核，修正 95 处。经典论文由 6 个主题检索 agent 汇总并去重，再分批逐篇复核：保留 152 篇，更正 115 篇，剔除 0 篇。精读导读共 26 步，由对抗式核查 agent 对照论文原文修正 70 处。术语表 195 条。", "learn_method_zh": "入门学习部分：先固定一份课程骨架（8 个模块、{concepts} 个概念、{advanced} 个进阶专题），所有内容都用同一套 ID 互相链接。基础知识每个模块由一个 agent 撰写，再由技术编辑 agent 核查公式、数值例子、链接以及与两篇论文的对应关系，共修正 {foundation_fixes} 处。进阶专题同样经过撰写与复核，修正 {advanced_fixes} 处。经典论文由 6 个主题检索 agent 汇总并去重，再分批逐篇复核：保留 {classics} 篇，更正 {classics_corrected} 篇，剔除 {classics_removed} 篇。精读导读共 {steps} 步，由对抗式核查 agent 对照论文原文修正 {guide_fixes} 处。术语表 {glossary} 条。"}, "xref": {"concepts": {"f-linalg": "线性代数、齐次坐标与刚体变换", "f-optim": "优化、鲁棒估计与梯度下降", "f-prob": "概率、加权平均与递归滤波", "f-image": "数字图像：颜色、采样、插值与金字塔", "g-pinhole": "针孔相机模型：内参、外参、投影与反投影", "g-epipolar": "对极几何、三角化与单应", "g-depth": "深度、视差与逆深度采样", "g-sfm": "运动恢复结构（SfM）与光束法平差", "g-rig": "多相机阵列：标定、同步与卷帘快门", "d-stereo": "双目立体匹配：从 SGM 到 RAFT-Stereo", "d-mvs": "多视角立体（MVS）与平面扫描", "d-mono": "单目与视频深度估计", "d-flow": "光流、场景流与图像 warping", "d-tsdf": "截断符号距离场（TSDF）与深度融合", "d-sensors": "深度传感器与噪声特性", "r-raster": "光栅化、z-buffer 与点溅射（splatting）", "r-alpha": "Alpha 合成与 over 算子", "r-volume": "体渲染方程与离散化", "r-raymarch": "光线步进、球面追踪与隐式表面求交", "r-appearance": "反射模型、视角相关外观与光照", "r-reps": "三维表示总览：点、网格、体素、隐式场、高斯", "i-lightfield": "全光函数、光场与 Lumigraph", "i-blending": "视角相关纹理映射与混合权重（ULR）", "i-warping": "基于深度的渲染：前向/后向 warping、空洞与飞点", "i-layered": "分层表示：MPI、LDI 与分层深度图（LDM）", "i-psv": "平面扫描体与学习式视图合成", "l-cnn": "卷积网络、残差块与 U-Net", "l-attention": "注意力机制与 Transformer", "l-encoding": "位置编码、傅里叶特征与射线编码", "l-loss": "损失函数与训练实践", "l-iterative": "学习式迭代细化与展开优化", "l-diffusion": "扩散模型入门", "n-nerf": "神经辐射场（NeRF）", "n-3dgs": "3D Gaussian Splatting（3D 高斯溅射）", "n-generalizable": "可泛化 / 前馈式新视角合成", "n-dynamic": "动态场景与 4D 表示", "v-temporal": "时间一致性、闪烁与时域滤波", "v-metrics": "图像与视频质量指标", "v-codec": "视频编码、传输与延迟预算", "v-perception": "立体视觉感知与 3D 显示"}, "adv": {"a-learned-stereo": "从深度立体匹配到立体基础模型", "a-learned-mvs": "学习式多视角立体与代价体", "a-geo-fm": "前馈三维几何基础模型", "a-nerf-fast": "NeRF 的加速与抗锯齿", "a-3dgs-ext": "3D Gaussian Splatting 的扩展", "a-layered-nvs": "学习式分层表示：从 Stereo Magnification 到 Quark", "a-generalizable-ibr": "可泛化 NeRF 与学习式 IBR", "a-ff-3dgs": "前馈 3DGS 与大重建模型", "a-geometry-free": "无几何 Transformer 渲染器", "a-dynamic-4d": "动态 NeRF、4D 高斯与流式重建", "a-human-capture": "人体表演捕捉与数字人", "a-diffusion-3d": "扩散模型与三维/新视角生成先验", "a-temporal-video": "视频时间一致性方法", "a-telepresence-sys": "三维临场系统设计", "a-compression": "体积视频与神经表示的压缩传输", "a-diff-render": "可微渲染与逆渲染"}}, "site": {"brand": "3D 临场研究图谱", "current": "landscape", "pages": [{"key": "home", "file": "index.html", "label": "概览", "group": null}, {"key": "roadmap", "file": "roadmap.html", "label": "学习路线", "group": "入门学习"}, {"key": "foundations", "file": "foundations.html", "label": "基础知识", "group": "入门学习"}, {"key": "guided", "file": "guided.html", "label": "精读导读", "group": "入门学习"}, {"key": "advanced", "file": "advanced.html", "label": "进阶专题", "group": "入门学习"}, {"key": "classics", "file": "classics.html", "label": "经典论文", "group": "入门学习"}, {"key": "glossary", "file": "glossary.html", "label": "术语表", "group": "入门学习"}, {"key": "anchors", "file": "anchors.html", "label": "锚点论文", "group": "领域调研"}, {"key": "landscape", "file": "landscape.html", "label": "领域全景", "group": "领域调研"}, {"key": "areas", "file": "areas.html", "label": "分方向与论文库", "group": "领域调研"}, {"key": "ideas", "file": "ideas.html", "label": "研究机会", "group": "研究"}, {"key": "method", "href": "index.html#method", "label": "方法与说明", "group": "研究", "alias": true}], "sectionPage": {"top": "index.html", "summary": "index.html", "sitemap": "index.html", "method": "index.html", "roadmap": "roadmap.html", "roadmap-resources": "roadmap.html", "foundations": "foundations.html", "guided": "guided.html", "advanced": "advanced.html", "classics": "classics.html", "reading": "classics.html", "glossary": "glossary.html", "anchors": "anchors.html", "map": "landscape.html", "paradigms": "landscape.html", "trends": "landscape.html", "areas": "areas.html", "papers": "areas.html", "ideas": "ideas.html"}, "prefixPage": [["concept-", "foundations.html"], ["module-", "foundations.html"], ["walk-", "guided.html"], ["guide-", "guided.html"], ["adv-", "advanced.html"], ["classic-", "classics.html"], ["stage-", "roadmap.html"], ["area-", "areas.html"], ["idea-", "ideas.html"], ["anchor-", "anchors.html"]]}, "synth": {"field_map": [{"layer_zh": "采集、同步与标定", "layer_en": "Capture, Sync & Calibration", "components_zh": ["多路 RGB / RGB-D 相机阵列（Starline 3 个 pod，Beam 6 相机，Tele-Aloha 4 路 RGB）", "硬件同步触发与曝光、白平衡锁定", "离线标定与在线标定监控（Tele360 可微 LM 层、Rig3R rig 发现）", "免位姿或非同步输入（VisualSync、LiveStre4m、AnySplat）"], "state_of_art_zh": "传感器正在去深度化：从 Starline 2021 的红外立体 pod 和 4 块 GPU，演进到 Beam 的 6 路 RGB 加 AI 模型，再到学术界的 4 路（Tele-Aloha）和 2 路未标定 RGB（LiveStre4m，每帧 0.07 s）。Tele360 用 4–6 台未标定 4K 相机在前向中估计位姿，已达消费级 GPU 实时。离线多视角采集的规模也在扩大（PackUV-2B 50+ 路，MVHumanNet 4,500 身份）。", "maturity": 4, "bottleneck_zh": "两篇锚点论文都强依赖精确标定和严格同步，对跨相机颜色不一致也很敏感：IBR 凸组合修不了颜色差，会形成接缝和闪烁。亚帧时间偏移、卷帘快门、热漂移的在线估计仍停留在离线优化阶段（VisualSync、SyncTrack4D），也没有“去同步”基准。消费级场景需要 2–4 路相机，这又逼着下游引入生成先验。"}, {"layer_zh": "几何与深度估计", "layer_en": "Geometry & Depth Estimation", "components_zh": ["立体 / MVS 基础模型（RAFT-Stereo → FoundationStereo → Fast-FoundationStereo）", "多视角几何基础模型（DUSt3R、VGGT、π3、Depth Anything 3、MapAnything）", "流式 / 带记忆几何（CUT3R、StreamVGGT、TTT3R、LingBot-Map）", "视频深度时间一致性（Video Depth Anything、FlashDepth、Stereo Any Video）", "显式融合（image-based TSDF，Ha et al. / Starline）"], "state_of_art_zh": "离线端，VGGT 和 DA3 一次前向就能输出位姿、深度和点图，已成为默认几何前端。实时端，Fast-FoundationStereo 在 TensorRT 下约 21 ms/对，FlashDepth 能以 24 FPS 流式输出 2K 深度，CUT3R 系列在约 518 像素下达到 14–20 FPS。Quark 则把几何隐式放进网络里，不需要深度输入。", "maturity": 3, "bottleneck_zh": "缺一个以标定为条件、按相机维护时间记忆、能直接给出目标视角深度的“阵列专用”流式几何模型。现有多视角模型逐时刻推理会闪烁，而且约 518 像素、10 视角要 0.14 s；流式模型又假设输入来自单个移动相机。高光、透明物体、头发和飞点仍会破坏逐像素 splat（Ha et al. 的主要失败模式）。"}, {"layer_zh": "场景 / 人物表示", "layer_en": "Scene & Human Representation", "components_zh": ["分层表示 MPI / LDI / LDM（Stereo Magnification → DeepView → Quark）", "像素对齐或纹理化 3D Gaussians（pixelSplat、GPS-Gaussian、LGTM）", "4D Gaussians（4DGS、STG、FreeTimeGS、TGH）", "潜在 token / KV-cache / TTT 记忆（LVSM、DVSM、NSTM）", "参数化化身（FLAME/SMPL-X 绑定高斯、Codec Avatar 潜码）"], "state_of_art_zh": "3DGS 及其混合形态已成为产业和学术的共同语言：Persona、Codec Avatars、Hyperscape、4DViews 与 glTF / MPEG 标准都在用。逐场景 4DGS 渲染可达数百到上千 FPS（4DGS-1K）；TGH 能处理 10 分钟序列且显存恒定。前馈侧开始出现“少量几何 + 丰富外观”的混合表示，如 LGTM 用 512×288 个带纹理的高斯输出 4K。", "maturity": 4, "bottleneck_zh": "“逐帧即时、用完即丢”（Quark、Ha et al.）与“持久、可跨视角复用”（3DGS / 记忆）之间还没有统一的表示。像素对齐高斯的数量随视角数和分辨率按二次增长；潜在 token 不可解释、不可编辑，也难以压缩传输。视角相关外观在各种表示里都只是近似。"}, {"layer_zh": "渲染 / 新视角合成", "layer_en": "Rendering & Novel View Synthesis", "components_zh": ["可泛化 IBR 与 render-and-refine（Quark、ENeRF、Ha et al.、3DTV）", "feed-forward 3DGS 重建 + 光栅化（MVSplat、GS-LRM、Tele360）", "无几何 Transformer 渲染器（LVSM、Efficient-LVSM、LagerNVS）", "高分辨率上采样与“低分辨率几何 + 高分辨率外观”设计"], "state_of_art_zh": "在单 GPU 上直接吃视频输入、达到 1–2K 实时的仍主要是分层 / IBR 类和人体专用前馈 3DGS：Quark 1080p 约 32 ms（A100），3DTV 1024² 约 25 ms（RTX 4090），Tele360 6 视角 2K 约 35 ms（RTX 5090）。Transformer 渲染器质量和泛化领先（LagerNVS 在 RealEstate10K 上 31.4 dB），但实时分辨率停在 256–512。", "maturity": 4, "bottleneck_zh": "视角覆盖不足时，外推会出现硬边或空洞。凸组合融合表达不了高光和反射。每个目标视角都要完整跑一遍，双目和多观看者的成本因此线性放大。Transformer 的 token 数随分辨率平方增长，要从 512 提到 1080p 需要多尺度 token 或 IBR 细节回填。"}, {"layer_zh": "时间一致性、记忆与生成补全", "layer_en": "Temporal Consistency, Memory & Generative Completion", "components_zh": ["手工几何累积（Ha et al. 的颜色差分掩码 + TSDF 回灌）", "流式逐帧优化（3DGStream、QUEEN、IGS、DecoGS）", "学习型记忆（NSTM、tttLRM、Forge4D 状态 token、StreamSplat 因果缓存）", "单步 / 因果生成修复（Difix3D+、ArtiFixer、SyncFix、Self Forcing、RealCam）"], "state_of_art_zh": "Ha et al. 是少数把 TCC、STED、SDT、SDV 做成量化指标的在线 NVS 工作。NSTM 用 TTT 记忆把摊销延迟压到约 28 ms/帧，但分辨率只有 256²。流式优化方法每帧仍需秒级（IGS 2.67 s）。生成侧，Self Forcing 在 H100 上 17 FPS，RealCam 的新视角视频首块延迟为亚秒级。", "maturity": 2, "bottleneck_zh": "这是全栈最薄弱的一环。现在还没有方法能同时做到 1080p 以上、每帧 33 ms 以内、并有显式时间一致性。记忆型方法分辨率低；几何累积受深度质量限制，且只在短时内有效（最多保留 40% 历史）；生成补全慢（0.5–1 s），还可能幻觉出身份或表情。长时（分钟级）漂移几乎没有评测过。"}, {"layer_zh": "压缩、传输与计算切分", "layer_en": "Compression, Transport & Compute Split", "components_zh": ["多路 RGB-D 视频编码 + WebRTC（Starline 30–100 Mbit/s）", "体积 / 高斯视频编码（V-PCC、VideoRF、V^3、PackUV、4DGC、QUEEN）", "视场剔除与码率自适应（ViVo、LiVo、AirGS、CAGS）", "参数化传输（Codec Avatars、Mon3tr <0.2 Mbps）", "标准（MPEG V3C / MIV / GSC、KHR_gaussian_splatting、SPZ、RFC 10034）"], "state_of_art_zh": "码率谱已经清晰：化身参数约 0.2 Mbps，发送端渲染的 2D 视图约 7 Mbps，4DGS 串流 17–75 Mbps（Gracia），原始 RGB-D 30–100 Mbps，高斯图约 100 Mbps（Tele360），逐帧高斯优化流可达 Gbps 级（3DGStream）。“体积视频即 2D 视频”的图集打包已成主流，MPEG GSC 已进入 CDAM。", "maturity": 3, "bottleneck_zh": "动态高斯和时间一致性编码还在探索阶段，缺少面向双向会话、低于 100 ms 的低延迟 profile。编码失真如何影响下游重建和一致性，没有联合优化。接收端重建、云端渲染还是传参数，也缺少形式化的切分方法。多方会议时带宽和算力接近 N² 增长。"}, {"layer_zh": "显示", "layer_en": "Display", "components_zh": ["头追踪 lenticular 裸眼 3D（Starline / Beam 65 英寸 8K）", "多视点光场屏（Looking Glass 类，32–100 视点）", "多观众眼动追踪视差显示（Hybrid Scan）", "HMD / MR 头显与轻量眼镜（Vision Pro、Quest 3、Meta VR Glasses）", "全息与波前通信（Holographic Parallax、KAIST wavefront telepresence）"], "state_of_art_zh": "头追踪裸眼 3D 已经商用（Beam，60 Hz，双眼各一路视频流）。光场直出渲染有 NVIDIA 共享扫描平面方案，45 视点、512p、200+ FPS；DirectL 最高加速 40×。多观众显示和全息通信（约 28 fps，约 50 ms）仍是原型。", "maturity": 3, "bottleneck_zh": "Beam 本质上是单人头追踪，多人同时观看时视点数、串扰和分辨率损失都会成倍增加。辐辏调节冲突（VAC）和深度预算管理缺少系统方法。头追踪延迟约 33 ms，需要靠预测补偿，否则会出现左右眼串扰。终端成本（约 2.5 万美元、600 W）和眼镜形态的体积式通话仍很遥远。"}, {"layer_zh": "交互、感知与评测", "layer_en": "Interaction, Perception & Evaluation", "components_zh": ["眼神接触与视线一致（VirtualCube、Gazing Heads）", "空间音频与视听一致", "行为学用户研究（Starline：手势 +43%，回忆 +28%）", "时间 / 3D 一致性指标（TCC、STED、tLP、MEt3R）与主观质量库（GScomp-QA 等）", "QoE 标准（ITU-T P.1320）"], "state_of_art_zh": "评价方法已从问卷和 PSNR 转向行为学和长期部署研究。主观研究一再发现，VMAF、FovVideoVDP 等视频指标比 LPIPS 更贴近人眼；动态 GS / NeRF 主观库中最佳全参考指标的 SRCC 只有约 0.72。时间与 3D 一致性指标已经出现，但没有标准化。", "maturity": 2, "bottleneck_zh": "缺一个端到端的 telepresence 基准，要同时包含同步多视角、观看者头部轨迹、留出视图真值、全链路延迟和码率，以及主观 QoE。闪烁、左右眼不一致、生成幻觉都没有经过心理物理校准的指标。人因证据也不是一边倒：重建质量低于某个阈值时，3D 反而不如高质量的 2D。"}], "paradigms": [{"name": "分层表示 + 可泛化 IBR / render-and-refine（Layered & Geometry-guided IBR）", "idea_zh": "按目标视角即时预测少量带深度的层（MPI/LDM）或一张引导深度，再对全分辨率输入像素做学习的凸组合混合。几何可以由网络迭代学出（Quark），也可以由外部深度加 TSDF 给出（Ha et al.）。", "strengths_zh": "直接复用真实像素，纹理锐利，保真度最高，不容易幻觉。计算集中在低分辨率，输出可达 1080p–2K。直接吃视频，不需要逐场景训练。是目前单 GPU 上 1K 以上实时、泛化性最成熟的方案。", "weaknesses_zh": "无状态或只有弱状态，帧间会闪烁；输入集合切换时画面会跳变。凸组合表达不了高光和反射。需要 8–16 个邻近相机覆盖目标视角，外推能力差。每个目标视角都要重算，双目和多观看者成本成倍增加。强依赖标定和颜色一致。", "exemplars": ["Quark (arXiv 2411.16680)", "Geometry-guided Online 3D Video Synthesis (Ha et al., arXiv 2505.18932)", "DeepView", "ENeRF", "IBRNet", "3DTV", "Project Starline"], "outlook_zh": "短期内仍是高分辨率实时 telepresence 的主力。演进方向是“有状态化”：用持久几何或记忆初始化 LDM，用 attention 取代按通道拼接的融合，再加轻量时间状态和一致性损失。它会作为高频细节层，与 Transformer 或 3DGS 方案融合，而不是被取代。"}, {"name": "Feed-forward 3DGS（像素对齐 / 纹理化高斯）", "idea_zh": "网络一次前向从稀疏视图回归一组 3D Gaussians（通常与像素对齐），然后用光栅化渲染任意视角。实现“重建一次、渲染多次”。", "strengths_zh": "重建之后渲染极快，天然支持双目、多观看者和光场的多视角输出。表示显式，可以编辑、可以压缩，也有 glTF / MPEG 标准可用。人体专用版本已经实时（GPS-Gaussian、Tele-Aloha、Tele360）。与几何基础模型结合后可以免标定。", "weaknesses_zh": "通用场景重建约需 0.1–1 s，离每帧重建的 30 Hz 视频还差约一个数量级。高斯数量随视角和分辨率按二次增长。多数方法逐帧独立，会闪烁（Tele360 自承）。逐帧传输高斯的码率很高（约 100 Mbps）。", "exemplars": ["pixelSplat", "MVSplat", "GS-LRM", "GPS-Gaussian", "Tele-Aloha", "Tele360 (arXiv 2609.15032)", "LGTM", "Fuse-and-Refine (arXiv 2503.14698)"], "outlook_zh": "最有可能成为“持久状态”的载体。Fuse-and-Refine、IGS、StreamSplat 这类在规范空间做时间融合的流式前馈 3DGS，会与 IBR 细节层结合，承担跨帧记忆和多视点输出。人体 telepresence 的系统规格已收敛到 4–6 相机、2K、每帧 25–40 ms。"}, {"name": "无几何 Transformer 渲染器（Geometry-free / LVSM 系）", "idea_zh": "只用 Plücker 射线等相机编码，不引入显式 3D 结构，由大规模 Transformer 直接从输入图像 token 生成目标视图。场景可以存成 latent、KV-cache 或 TTT fast weights。", "strengths_zh": "质量和泛化领先（LVSM 比 GS-LRM 高 1.6 dB），能自然学到视角相关效果和遮挡推理。可以缩放，有 scaling law（SVSM）。记忆型变体（NSTM、LaCT）天然支持长时在线状态。", "weaknesses_zh": "token 数随分辨率平方增长，实时结果只到 256–512²（NSTM 256²，LagerNVS 512²）。训练成本极高（64–128 张 H100 / B200 级别）。不可解释，输出不保证与输入像素一致，存在幻觉风险。压缩传输格式也没有定义。", "exemplars": ["LVSM", "RayZer", "LaCT", "Efficient-LVSM", "LagerNVS", "Online Neural Space Time Memory (NSTM, arXiv 2607.15271)"], "outlook_zh": "在 Google 等团队的押注下会快速工程化，但 1–3 年内更可能以“低分辨率 latent 负责几何和遮挡推理、高分辨率 IBR 负责回填细节”的混合形态进入 telepresence，而不是单独在 1080p 上跑。"}, {"name": "逐场景 / 流式 4D Gaussian 优化（Per-scene & Streaming 4DGS）", "idea_zh": "对多视角视频做逐场景（或逐帧增量）优化，得到 4D 高斯表示，追求离线质量上限。流式变体从首帧模型出发，逐帧只优化残差或运动。", "strengths_zh": "质量天花板最高（STG、FreeTimeGS、DecoGS 在 N3DV 上约 32–34.5 dB），渲染数百到上千 FPS。可以处理长序列（TGH 10 分钟，PackUV 30 分钟）。适合点播式体积视频，已有产业链（4DViews、Gracia）。", "weaknesses_zh": "训练需要数分钟到数小时；流式方法每帧仍是秒级（IGS 2.67 s，3DGStream 约 12 s），比通话要求慢 1–2 个数量级。需要 15–20 台以上标定好的相机。码率高（80 Mbps 到 Gbps 级）。不同论文的评测协议不统一。", "exemplars": ["DyNeRF / N3DV", "Dynamic 3D Gaussians", "4DGS", "Spacetime Gaussians", "4K4D", "Temporal Gaussian Hierarchy", "3DGStream", "IGS (arXiv 2503.16979)"], "outlook_zh": "在实时通话中难以直接使用，但会有两个角色：一是给前馈模型提供伪真值、教师和训练数据；二是作为体积视频点播和串流的主流格式，受益于 MPEG GSC 与 glTF 标准化。"}, {"name": "参数化 / 化身式远程呈现（Avatar-based）", "idea_zh": "先为用户建一个可驱动的个性化 3D 模型（影棚、手机扫描或单图前馈），通话时只传表情潜码、姿态、视线等紧凑驱动信号，由接收端解码渲染。", "strengths_zh": "码率极低（<0.2 Mbps）；天然解决戴头显时人脸被遮挡的问题；时序稳定；能在一体机上实时运行（SqueezeMe 在 Quest 3 上 72 FPS 驱动 3 个全身化身）；支持重光照与 MR 合成。已经产品化（Persona、Codec Avatars / Hologram、Likeness）。", "weaknesses_zh": "化身是“生成”的而不是“拍摄”的，真实性与信任存在问题：微表情、口腔、眼神可能失真。模型外的内容（手持物、换装、环境交互）无法呈现。单图注册的质量（PSNR 约 24.5）与影棚级（LCA 约 30.5）差距明显。有深度伪造和身份冒用风险。", "exemplars": ["Deep Appearance Models", "Pixel Codec Avatars", "Relightable Gaussian Codec Avatars", "URAvatar", "LAM", "Large-scale Codec Avatars (LCA)", "Universal Facial Encoding"], "outlook_zh": "会主导头显和眼镜端的空间通话。与采集式路线在技术上会趋同：用个人化身先验给采集式渲染补洞和正则化，采集残差再修正化身；带宽不足时平滑回退到参数传输。"}, {"name": "生成式视频 / 世界模型渲染（Generative Rendering）", "idea_zh": "以几何缓存（点云、深度 warp、LDM）或带位姿的帧为条件，用视频扩散或自回归世界模型生成目标视角，补全去遮挡区域、表达视角相关效果。", "strengths_zh": "能补出观测之外的内容，能表达反射和光泽（RTFM），适合稀疏相机和外推。因果少步蒸馏已把延迟压到亚秒级（Self Forcing 17 FPS，RealCam 首块 0.72–1.15 s）。“几何缓存条件化”让一致性明显改善（GEN3C、ViewCrafter）。", "weaknesses_zh": "延迟和分辨率（480–720p）距离通话要求还差一个数量级。不保证像素级保真，可能改变表情、口型、身份，这在通信场景中不可接受。逐帧或逐视角生成会破坏时间和双目一致性。需要 H100 级算力。", "exemplars": ["3DiM", "CAT3D", "GEN3C", "Difix3D+", "CausVid", "Self Forcing", "GameNGen", "Genie 3"], "outlook_zh": "1–3 年内不会成为主渲染器，但会以“置信度门控的补洞器 / 修复器”身份进入 telepresence：只在 TSDF 权重低、深度冲突或去遮挡的区域生成，并蒸馏进实时网络。LiveStre4m 只把 DiT 用于关键帧之间的插值，就是这种谨慎用法的样例。"}, {"name": "经典实时 RGB-D 融合系统（Fusion-based Systems）", "idea_zh": "用深度传感器或立体深度，加上非刚性或 image-based 体融合（Fusion4D、TSDF），重建网格或深度，再做纹理混合。Holoportation 和早期 Starline 是代表。", "strengths_zh": "几何显式、可解释，时间和视角一致性好，工程成熟。Starline 实测端到端 105.8 ms，并在用户研究中胜过 2D 视频会议。", "weaknesses_zh": "依赖主动深度传感和大量硬件（Starline 用了 4 块 GPU）。细结构和头发重建差，存在飞点和空洞。画质受深度质量上限约束。", "exemplars": ["The Office of the Future", "Holoportation", "Project Starline", "VirtualCube", "LookinGood"], "outlook_zh": "作为独立范式正在退场（Starline → Beam 已转向 RGB + AI），但它的显式融合思想（TSDF、全局几何代理）正以“一致性模块”的形式被 Ha et al. 这类神经方法继承。"}], "trends_zh": [{"trend": "从“逐帧无状态”走向“持久状态 / 时间记忆”", "evidence": "Quark 逐帧独立，自承闪烁；Ha et al. 用 TSDF 回灌上一帧深度，把 STED 从 95 降到 69。Quark 团队后续工作 Fuse-and-Refine（规范空间时间融合）和 NSTM（在线 TTT 时空记忆，约 28 ms/帧）；IGS、StreamSplat、Forge4D 状态 token、tttLRM 等在 2025–2026 年集中出现。", "implication": "下一代 telepresence 渲染器的核心设计问题，会从“单帧怎么渲染”变成“状态存什么、怎么更新、怎么防漂移”。评测必须加入长序列和时间指标，也会影响传输格式的设计（静态状态只发一次）。"}, {"trend": "“低分辨率几何 / 结构 + 高分辨率外观 / 细节”成为高分辨率实时的通用配方", "evidence": "Quark 用 288×512 的内部 LDM 加 IBR 取样输出 1080p–2K；Tele-Aloha 先在潜空间渲染再混合到 2K；HiReFF 用 0.5K 骨干加 2K side-tuning；LGTM 用 512×288 个带纹理的高斯输出 4K，峰值显存只增加 1.8×。", "implication": "Transformer 渲染器要走到 1080p，很可能要借用 IBR 回填细节的思路。几何模块可以留在低分辨率，把算力预算让给时间一致性和多视点输出。"}, {"trend": "几何基础模型让标定、深度和位姿从“前提”变成“网络输出”", "evidence": "VGGT（CVPR 2025 最佳论文）、Depth Anything 3、MapAnything、π3 取代 COLMAP + MVS；Tele360 从大型几何模型蒸馏，得到免位姿的 2K 实时人体系统；LiveStre4m、AnySplat、NoPo4D 都是免位姿；Fast-FoundationStereo 把立体基础模型压到约 21 ms。", "implication": "telepresence 的部署和维护成本（标定、同步）会大幅下降；新方法如果假设预标定阵列，需要说明理由。同时，“把标定作为提示注入”与“完全免位姿”之间的取舍需要定量研究。"}, {"trend": "表示层在产业和标准上收敛到 3D Gaussians", "evidence": "Codec Avatars（RGCA、URAvatar、SqueezeMe）、visionOS 26 Persona（据媒体报道）、Hyperscape、4DViews、Gracia 都采用 GS；Khronos KHR_gaussian_splatting 已进入候选或批准阶段，SPZ 体积约为 PLY 的 1/10；MPEG GSC 的 V-PCC 与 G-PCC 修正案均进入 CDAM。", "implication": "研究成果进入产品时，GS 兼容性会成为隐性要求。基于 LDM 或 latent 的方法需要考虑怎样导出成 GS 或视频图集，才能接上现有编码与播放生态。"}, {"trend": "采集端去深度化、稀疏化，生成先验顶上空缺", "evidence": "Starline 2021 用红外立体 pod，Beam 改为 6 路 RGB；Tele-Aloha 4 路，LiveStre4m 最少 2 路，MonoFlex3D 和 NVIDIA Live 3D Portrait 只用单相机；Difix3D+、GEN3C、Diffuman4D 用生成先验补稀疏视角。", "implication": "“真实性与幻觉”从学术问题变成产品风险。需要置信度门控和幻觉率指标，只允许在去遮挡区域生成。"}, {"trend": "因果少步生成模型快速逼近交互帧率", "evidence": "CausVid 9.4 FPS → Self Forcing 17 FPS（H100，832×480）→ StreamDiffusionV2 58–64 FPS（4×H100）；RealCam 的相机可控新视角视频延迟从 ReCamMaster 的 426 s 降到 0.72–1.15 s；InstantViR 超过 35 FPS，明确以远程呈现为目标。", "implication": "生成式修复器进入实时 telepresence 的时间窗口可能在 1–3 年内打开，但会先以局部修复、低分辨率、云端的形式出现。"}, {"trend": "评测从逐帧 PSNR 走向一致性、感知与系统级 QoE", "evidence": "Ha et al. 引入 TCC、STED、SDT、SDV；MEt3R 和 COLMAP 几何验证度量 3D 一致性；DyCheck 和 Mind the Gap 揭示协议泄漏与外推差距（1–12 dB）；Starline 做行为学研究；ITU-T P.1320；GScomp-QA 显示 18 种客观指标都不充分。", "implication": "只报 PSNR / SSIM / LPIPS 的 telepresence 论文说服力会越来越弱。报告闪烁、双目一致性、端到端延迟和码率会成为顶会审稿的常见要求。"}, {"trend": "系统与网络社区深度介入，计算切分成为显式设计维度", "evidence": "MobiCom（ViVo、MetaStream）、NSDI（YuZu）、CoNEXT（LiVo，MOS 4.1）、INFOCOM（AirGS）；ReVo 的选择性 FEC 让卡顿最多减少 95.7%；DSGS 在解码端用前馈 3DGS 取代深度估计；码率谱从 0.2 Mbps（化身）到 100 Mbps（高斯图）。", "implication": "视觉方法需要和编解码器、网络联合设计，例如编码器在环训练、视点自适应选择相机、状态化传输。纯渲染论文与系统论文的边界会越来越模糊。"}, {"trend": "通用元宇宙会议退潮，产品聚焦高价值 1:1 场景和现有 UC 生态互通", "evidence": "Microsoft Mesh 2025 年 12 月下线，Meta Horizon Workrooms 2026 年 1 月停止；Beam 定位于高管和客户 1:1 会议，进驻 Industrious 联合办公空间，Zoom for Google Beam 将于 2026 年下半年上线；Persona、Likeness、Hologram 以虚拟摄像头方式接入 Zoom、Teams。", "implication": "近期技术价值集中在：1:1 质量与成本下降、从 1:1 扩展到多方、以及与 2D 生态的平滑互通。“虚拟空间社交”不是主要驱动力。"}], "grand_challenges_zh": [{"title": "质量、一致性、延迟“三者兼得”的实时渲染器", "description": "在单张消费级或边缘 GPU 上，从稀疏标定多路视频中以 1080p 以上、每帧不超过 33 ms 输出新视角，同时在 STED / TCC / SDV 等时间和视角一致性指标上稳定。", "why_hard": "Quark 快而清晰但闪烁；Ha et al. 一致但依赖外部深度，单帧上限低；NSTM 有记忆但只有 256²；Fuse-and-Refine 延迟 350 ms。时间状态会带来额外计算，也有漂移风险；学习型记忆难以在高分辨率下保持实时。", "promising_directions": "用 TSDF、流式几何或持久 3DGS 状态初始化 Quark 式 LDM，减少迭代次数；用 One-to-many attention 替代按通道拼接的融合；把上一帧 LDM 特征重投影后作为输入；在多视角人体视频上用 L_Depth、时间 warping 损失和相邻视点一致性损失训练；做低分辨率 latent 记忆 + 高分辨率 IBR 回填的混合结构。"}, {"title": "面向固定阵列的流式几何基础模型", "description": "构建一个以标定为条件、按相机维护时间记忆、视角与时间双因果的几何模型，每帧直接输出时间一致的逐视角深度和目标视角深度，替代 RAFT-Stereo + 手工时间滤波 + TSDF 的流程。", "why_hard": "现有多视角基础模型约 518 像素、10 视角要 0.14 s，逐时刻推理会闪烁；流式模型假设单个移动相机；Rig3R 和 X-Lens 面向朝外阵列。telepresence 需要 1080p 以上、约 10 ms 的几何预算，还要处理头发、高光和飞点。", "promising_directions": "MapAnything 式标定提示注入；静态背景 token 跨帧复用、只对变化区域稀疏更新；TTT3R / CUT3R 式置信度门控记忆；从 VGGT / DA3 蒸馏出阵列专用小模型；在缓存的场景状态上加毫秒级 ray-map 查询头；输出逐像素不确定性，供下游融合网络使用。"}, {"title": "端到端 motion-to-photon 延迟预算与晚期重投影", "description": "把采集、几何、渲染、编码、网络、解码、显示全链路压到对话可接受的范围（约 100–150 ms），同时让本地头动到显示的延迟达到几十毫秒量级。", "why_hard": "两篇锚点论文都没有计量系统延迟（Quark 只报 A100 推理，Ha et al. 不含立体深度）。Tele360 在普通客户端上端到端 500–650 ms；神经渲染的延迟抖动还会影响立体感和对话节奏。", "promising_directions": "用 LDM 或一致深度在接收端做 ATW 式晚期重投影，把显示帧率和采集帧率解耦；用头动预测做视点预渲染；发布包含延迟分解的系统论文和基准；在编码器在环的条件下联合训练渲染网络。"}, {"title": "多视点输出的计算摊销：双目、多观看者、光场", "description": "让一次重建原生、低成本地输出左右眼、多名观看者乃至 45 个以上的光场视点，并保证视点之间一致。", "why_hard": "Quark 和 Ha et al. 都是每个目标视角完整跑一遍，成本线性增长；左右眼混合权重不一致会造成双眼竞争；光场屏每帧需要大量视点。", "promising_directions": "让左右眼共享低分辨率阶段，只在最后一两级分开；显式加入双目一致性损失；借鉴 NVIDIA 的共享扫描平面和 DirectL 的子像素直出；用持久 3DGS 状态实现“重建一次、渲染多次”；LDM 本身也可以作为光场的共享中间表示。"}, {"title": "稀疏覆盖下的外推与可信生成补全", "description": "在 2–4 路消费级相机、大角度转头或阵列外视点下，补全去遮挡区域，同时保证不幻觉出身份、表情、口型和手势。", "why_hard": "IBR 只能插值；生成模型能补全但延迟高（0.5–1 s），也不保证保真；通信场景对“真实”的要求远高于内容创作；目前没有可量化的幻觉率指标。", "promising_directions": "用 TSDF 权重、alpha、融合权重熵、深度冲突等信号做置信度门控，只在低置信区域生成；把几何缓存作为条件的单步修复器，并蒸馏进实时网络（Difix3D+ → ArtiFixer → SyncFix）；用个人化身先验约束人体区域；在留出相机上测幻觉率，并把生成内容标识出来。"}, {"title": "视角相关外观与非朗伯材质", "description": "实时表达皮肤油光、眼镜、屏幕、镜面和半透明，并保证这些效果在视角间和时间上一致。", "why_hard": "输出只是输入颜色的凸组合，无法外推高光；镜面还会反过来破坏深度估计（Ha et al. 的主要失败模式）；用共享几何约束一致性，会抹掉 Quark 那种“按视角过拟合”带来的近似反射。", "promising_directions": "把几何的时间平滑和逐帧的视角相关残差解耦：TSDF 只约束 density 和深度，blend weights 保持视角相关；在实时预算内重新引入 NeX 式基函数或轻量神经残差；用重光照化身和生成式渲染（RTFM、DiffusionRenderer）的先验做局部修正；几何端输出不确定性，在高光区域退回光场式混合。"}, {"title": "状态化、编码器在环的传输格式与计算切分", "description": "设计一种面向双向会话的 3D 码流，把时间状态（静态背景、TSDF、高斯记忆）和动态残差分开传输，支持码率自适应、丢包隐藏，以及发送端、云端、接收端之间灵活的计算切分。", "why_hard": "逐帧高斯需要 80–200 Mbps 甚至更高；压缩对下游重建一致性的影响是非线性的；MPEG GSC 的动态高斯部分仍在探索；多方会议时带宽和算力接近 N² 增长。", "promising_directions": "静态状态只发一次、动态只发残差；根据头动预测选择相机并分配码率（类似 LiVo 的视场剔除）；解码端前馈重建（DSGS、GS-SCNet）；做码率、失真、闪烁的联合优化；设计从 RGB-D 流平滑回退到化身参数的混合方案。"}, {"title": "面向 telepresence 的统一基准与感知指标", "description": "建立一个公开基准，提供同步多视角 RGB(-D)、分钟级人像对话序列、留出视图和头部追踪观看轨迹，并统一报告画质、时间和双目一致性、幻觉率、延迟、码率与主观 QoE。", "why_hard": "现有评测集中在 N3DV 等 10 秒短片、单个中心留出相机和降采样协议上；时间指标各论文各用一套，没有经过心理物理校准；主观库只有十几个场景、在 2D 屏上观看；不少人体数据集许可受限。", "promising_directions": "在 PackUV-2B、MVHumanNet++、SelfCap 等长时数据上加入对话场景和观看轨迹；把 TCC / STED / SDV 与感知闪烁阈值实验挂钩；在头显、光场屏上做交互式 6DoF 主观评测；引入 ITU-T P.1320 和 Starline 式行为学指标。"}, {"title": "采集式与化身式的融合，以及真实性与信任", "description": "把采集式的“所见即所拍”和化身式的“低码率、抗遮挡、稳定”统一在一个系统里，并提供身份认证、生成内容标识和隐私保护。", "why_hard": "两条路线的表示、训练数据和产品生态都不同；化身先验与实时采集残差的融合缺少理论框架；远程呈现传输的是人脸和人体的三维数据，天然带有深度伪造和生物特征隐私风险，而两篇锚点论文都没有讨论这一点。", "promising_directions": "用个人高斯化身先验给采集式渲染补洞和正则化几何，采集残差再修正化身；在带宽或遮挡变化时平滑切换；做源端隐私脱敏（InViStream）、水印与溯源；把“忠实度”作为一等评测指标。"}], "predictions_zh": ["2027 年内会出现至少一项“有状态的 Quark 式渲染器”：前馈 IBR / LDM 加上持久几何或记忆（TSDF、稀疏体素、3DGS 或 TTT），在 1080p、单张数据中心 GPU 上约 30 fps，并同时报告 PSNR 和 STED / TCC 等时间指标。Quark 团队的 Fuse-and-Refine 与 NSTM 已经铺好了路。", "时间一致性指标（TCC、STED、tLP、flicker）和长序列（分钟级）评测，会在 1–2 年内成为动态 NVS 和 telepresence 顶会论文的常规要求。只报 PSNR / SSIM / LPIPS 且逐帧独立的方法，需要单独论证。", "几何前端会普遍换成蒸馏后的立体或几何基础模型（Fast-FoundationStereo 级别，约 20–50 ms），并以相机标定为条件输入。RAFT-Stereo 加手工时间滤波的做法，在新系统中会基本消失。", "Transformer 渲染器（LVSM 系）的实时分辨率会从 256–512² 提到约 1K，但主要靠“低分辨率 latent + 局部注意力 / KV-cache + IBR 细节回填”的混合结构实现，纯 token 方案在 1080p / 30 fps 下仍然困难。", "生成模型进入实时 telepresence 的方式，会是“置信度门控的单步修复器”（只修补去遮挡和低置信区域），而不是全帧生成式渲染。全帧生成在通话场景中 3 年内仍受保真和信任问题限制。", "产业上，Beam 类裸眼终端会先出现“多方”形态（1–2 个真 3D 席位加空间化的 2D 参会者）；头显和眼镜端从立体视频 Hologram 演进到真 6DoF 化身通话（Meta 已表态）。真 3D 的多方 6DoF 通话，3 年内仍限于原型和高端场景。", "3DGS 会成为体积视频和化身交换的事实标准格式（KHR_gaussian_splatting、SPZ、MPEG GSC 在 1–2 年内推进到正式标准）。面向双向低延迟会话的动态高斯编码 profile 会进入 MPEG 探索或标准化议程，但 3 年内很难成熟。", "消费级 GPU（RTX 4090 / 5090 级别）上 4–6 路相机、2K、25–40 FPS 的人体 telepresence，会成为学术系统的标配基线（Tele-Aloha、Tele360、3DTV 已经达到）。研究重点会转向闪烁、手部和物体交互、多人、HMD 双目一致性，以及端到端延迟分解。"]}}</script>
<script>
(function () {
  "use strict";
  // ================= core: shared helpers, cross-links, math, navigation =================
  var DATA;
  try { DATA = JSON.parse(document.getElementById("data").textContent); } catch (e) { DATA = {}; }
  var SITE = DATA.site || {};
  var meta = DATA.meta || {};

  // ---------- DOM helpers: all text goes through textContent; external links are https-only ----------
  function safeUrl(u) { if (typeof u !== "string") return null; var s = u.trim(); return /^https:\/\/[^\s"'<>]+$/i.test(s) ? s : null; }
  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (!Object.prototype.hasOwnProperty.call(attrs, k)) continue;
      var v = attrs[k];
      if (v === null || v === undefined || v === false) continue;
      if (k === "class") n.className = v;
      else if (k === "text") n.textContent = String(v);
      else if (k === "href") { var u = safeUrl(v); if (u) { n.setAttribute("href", u); n.setAttribute("target", "_blank"); n.setAttribute("rel", "noopener noreferrer"); } }
      else if (k.slice(0, 2) === "on" && typeof v === "function") n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, String(v));
    }
    (kids || []).forEach(function (c) { if (c === null || c === undefined || c === false) return; n.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return n;
  }
  var SVGNS = "http://www.w3.org/2000/svg";
  function sv(tag, attrs, kids) {
    var n = document.createElementNS(SVGNS, tag);
    if (attrs) for (var k in attrs) {
      if (!Object.prototype.hasOwnProperty.call(attrs, k)) continue;
      var v = attrs[k];
      if (v === null || v === undefined || v === false) continue;
      if (k === "text") n.textContent = String(v);
      else if (k.slice(0, 2) === "on" && typeof v === "function") n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, String(v));
    }
    (kids || []).forEach(function (c) { if (c) n.appendChild(c); });
    return n;
  }
  function arr(x) { return Array.isArray(x) ? x : []; }
  function str(x) { return typeof x === "string" ? x : (x === null || x === undefined ? "" : String(x)); }

  // ---------- pages & cross-page links ----------
